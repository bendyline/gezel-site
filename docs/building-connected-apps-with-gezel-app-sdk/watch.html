ition":{"start":{"line":137,"column":257,"offset":7468},"end":{"line":137,"column":363,"offset":7574}}}],"position":{"start":{"line":137,"column":1,"offset":7212},"end":{"line":137,"column":363,"offset":7574}}},{"type":"paragraph","children":[{"type":"text","value":"The daemon publishes the current public OpenAPI document at unauthenticated ","position":{"start":{"line":139,"column":1,"offset":7576},"end":{"line":139,"column":77,"offset":7652}}},{"type":"inlineCode","value":"GET /v1/openapi.json","position":{"start":{"line":139,"column":77,"offset":7652},"end":{"line":139,"column":99,"offset":7674}}},{"type":"text","value":". Use it for route inspection or code generation; use the SDK types for ordinary application code.","position":{"start":{"line":139,"column":99,"offset":7674},"end":{"line":139,"column":197,"offset":7772}}}],"position":{"start":{"line":139,"column":1,"offset":7576},"end":{"line":139,"column":197,"offset":7772}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"@bendyline/gezel-app-sdk is for software that runs beside Gezel.","startTime":0,"endTime":3.090909090909091,"audioSegment":0},{"text":"It lets a desktop or Node application discover the logged-in user's daemon, trust its loopback TLS certificate,","startTime":3.090909090909091,"endTime":6.181818181818182,"audioSegment":0},{"text":"ask the user for a scoped connection, remember the issued token securely, and use OpenAI-shaped model APIs.","startTime":6.181818181818182,"endTime":9.272727272727273,"audioSegment":0},{"text":"This differs from @bendyline/gezel-sdk, whose scripts run inside Gezel's sandbox.","startTime":9.272727272727273,"endTime":12.363636363636363,"audioSegment":0},{"text":"A connected app owns its own interface and process.","startTime":12.363636363636363,"endTime":15.454545454545453,"audioSegment":0},{"text":"Gezel owns model discovery and downloads, consent,","startTime":15.454545454545453,"endTime":18.545454545454547,"audioSegment":0},{"text":"revocation, and the local inference service.","startTime":18.545454545454547,"endTime":21.636363636363637,"audioSegment":0},{"text":"If the experience should live inside a Gezel project as a custom crew, dashboard,","startTime":21.636363636363637,"endTime":24.727272727272727,"audioSegment":0},{"text":"craftbooks, scripts, and data, see Building AI Apps inside Gezel instead.","startTime":24.727272727272727,"endTime":27.818181818181817,"audioSegment":0},{"text":"The Connected apps article explains what the user sees.","startTime":27.818181818181817,"endTime":30.909090909090907,"audioSegment":0},{"text":"This article covers the developer side.","startTime":30.909090909090907,"endTime":34,"audioSegment":0},{"text":"The Node entry requires Node.js 24 or newer:","startTime":34,"endTime":36.4054054054054,"audioSegment":0},{"text":"npm install @bendyline/gezel-app-sdk","startTime":36.4054054054054,"endTime":38.81081081081081,"audioSegment":0},{"text":"The normal third-party flow is: detect Gezel, request the narrowest scope, let the user approve in the desktop app,","startTime":38.81081081081081,"endTime":41.21621621621622,"audioSegment":0},{"text":"and store the resulting token in the operating system's credential store.","startTime":41.21621621621622,"endTime":43.62162162162162,"audioSegment":0},{"text":"import { connect, detectGezel } from '@bendyline/gezel-app-sdk';","startTime":43.62162162162162,"endTime":46.027027027027025,"audioSegment":0},{"text":"// Demo only: this lasts for one process.","startTime":46.027027027027025,"endTime":48.432432432432435,"audioSegment":0},{"text":"Replace it with Keychain,","startTime":48.432432432432435,"endTime":50.83783783783784,"audioSegment":0},{"text":"// Credential Manager, libsecret, or your existing secure credential vault.","startTime":50.83783783783784,"endTime":53.24324324324324,"audioSegment":0},{"text":"const demoTokens = new Map<string, string>();","startTime":53.24324324324324,"endTime":55.648648648648646,"audioSegment":0},{"text":"const tokenStorage = {","startTime":55.648648648648646,"endTime":58.05405405405405,"audioSegment":0},{"text":"load: (appId: string) => demoTokens.get(appId) ?? null,","startTime":58.05405405405405,"endTime":60.45945945945946,"audioSegment":0},{"text":"save: (appId: string, token: string) => demoTokens.set(appId, token),","startTime":60.45945945945946,"endTime":62.86486486486486,"audioSegment":0},{"text":"delete: (appId: string) => demoTokens.delete(appId), };","startTime":62.86486486486486,"endTime":65.27027027027026,"audioSegment":0},{"text":"const status = await detectGezel();","startTime":65.27027027027026,"endTime":67.67567567567568,"audioSegment":0},{"text":"if (!status.running) {","startTime":67.67567567567568,"endTime":70.08108108108108,"audioSegment":0},{"text":"throw new Error('Start Gezel, then connect this app again.'); }","startTime":70.08108108108108,"endTime":72.48648648648648,"audioSegment":0},{"text":"const app = await connect({","startTime":72.48648648648648,"endTime":74.89189189189189,"audioSegment":0},{"text":"appId: 'acme.notes',","startTime":74.89189189189189,"endTime":77.29729729729729,"audioSegment":0},{"text":"appName: 'Acme Notes',","startTime":77.29729729729729,"endTime":79.70270270270271,"audioSegment":0},{"text":"scopes: ['openai'], tokenStorage, });","startTime":79.70270270270271,"endTime":82.1081081081081,"audioSegment":0},{"text":"const available = await app.models();","startTime":82.1081081081081,"endTime":84.51351351351352,"audioSegment":0},{"text":"const model = available.data[0];","startTime":84.51351351351352,"endTime":86.91891891891892,"audioSegment":0},{"text":"if (!model) throw new Error('No Gezel models are available.');","startTime":86.91891891891892,"endTime":89.32432432432432,"audioSegment":0},{"text":"const stream = await app.chat({","startTime":89.32432432432432,"endTime":91.72972972972973,"audioSegment":0},{"text":"model: model.id,","startTime":91.72972972972973,"endTime":94.13513513513513,"audioSegment":0},{"text":"messages: [{ role: 'user', content: 'Give this note a short title.' }], stream: true, });","startTime":94.13513513513513,"endTime":96.54054054054053,"audioSegment":0},{"text":"for await (const chunk of stream) {","startTime":96.54054054054053,"endTime":98.94594594594594,"audioSegment":0},{"text":"process.stdout.write(chunk.choices[0]?.delta?.content ?? ''); }","startTime":98.94594594594594,"endTime":101.35135135135135,"audioSegment":0},{"text":"The in-memory map keeps the quickstart self-contained, but a real application must replace it with secure operating-system storage;","startTime":101.35135135135135,"endTime":103.75675675675676,"audioSegment":0},{"text":"do not save the token in source code, a project file, or plain-text preferences.","startTime":103.75675675675676,"endTime":106.16216216216216,"audioSegment":0},{"text":"connect() verifies a stored token still has the requested scopes.","startTime":106.16216216216216,"endTime":108.56756756756756,"audioSegment":0},{"text":"If it was revoked or is too narrow,","startTime":108.56756756756756,"endTime":110.97297297297297,"audioSegment":0},{"text":"the SDK discards it and starts a fresh visible consent flow.","startTime":110.97297297297297,"endTime":113.37837837837837,"audioSegment":0},{"text":"Call app.models() rather than hardcoding a model id.","startTime":113.37837837837837,"endTime":115.78378378378378,"audioSegment":0},{"text":"The response is the authoritative list available to this connection and can include both raw models and eligible gezels.","startTime":115.78378378378378,"endTime":118.18918918918918,"audioSegment":0},{"text":"Selecting a gezel gives the caller that gezel's character and tuned model,","startTime":118.18918918918918,"endTime":120.59459459459458,"audioSegment":0},{"text":"while your app keeps ownership of its interface and conversation loop.","startTime":120.59459459459458,"endTime":123,"audioSegment":0},{"text":"Every connection has a stable appId,","startTime":123,"endTime":125.8,"audioSegment":0},{"text":"a user-visible name, and one or more scopes.","startTime":125.8,"endTime":128.6,"audioSegment":0},{"text":"The user can review and revoke it under Settings → Connected Apps.","startTime":128.6,"endTime":131.4,"audioSegment":0},{"text":"ScopeUse it forApprovalopenaiModel listing, chat, embeddings,","startTime":131.4,"endTime":134.2,"audioSegment":0},{"text":"and ensuring a local model is presentClick approval by defaultproductThe ordinary Gezel product API through @bendyline/gezel-clientApproval plus a requester-visible verification coderemote-inferenceGezel's paired-device inference surfaceClick approval by default","startTime":134.2,"endTime":137,"audioSegment":0},{"text":"Third-party applications should not request the first-party cli scope or call authorizeLocalOwner().","startTime":137,"endTime":139.8,"audioSegment":0},{"text":"Those surfaces are reserved for Gezel's own command line and same-user clients.","startTime":139.8,"endTime":142.6,"audioSegment":0},{"text":"Ask for product only when the application truly needs projects, tasks, gezels,","startTime":142.6,"endTime":145.4,"audioSegment":0},{"text":"or other product state; add openai only if that same application also performs inference.","startTime":145.4,"endTime":148.2,"audioSegment":0},{"text":"Stateful scopes require onVerificationCode.","startTime":148.2,"endTime":151,"audioSegment":0},{"text":"Show the code in the requesting application so the user can type it into Gezel's approval dialog:","startTime":151,"endTime":153.8,"audioSegment":0},{"text":"import { authorizeLocal } from '@bendyline/gezel-app-sdk';","startTime":153.8,"endTime":156.6,"audioSegment":0},{"text":"const authorized = await authorizeLocal({","startTime":156.6,"endTime":159.4,"audioSegment":0},{"text":"appId: 'acme.editor',","startTime":159.4,"endTime":162.2,"audioSegment":0},{"text":"appName: 'Acme Editor',","startTime":162.2,"endTime":165,"audioSegment":0},{"text":"scopes: ['product'], tokenStorage,","startTime":165,"endTime":167.8,"audioSegment":0},{"text":"onVerificationCode(code) {","startTime":167.8,"endTime":170.6,"audioSegment":0},{"text":"showConnectionCode(code); }, });","startTime":170.6,"endTime":173.4,"audioSegment":0},{"text":"The daemon generates the code and never sends it to the Gezel desktop approval surface.","startTime":173.4,"endTime":176.2,"audioSegment":0},{"text":"This proves that the person approving the grant can also see the application that requested it.","startTime":176.2,"endTime":179,"audioSegment":0},{"text":"The app SDK's GezelApp class deliberately stays focused on the OpenAI-compatible surface.","startTime":179,"endTime":181.33333333333334,"audioSegment":0},{"text":"When a connected app also needs projects, tasks, chats, scripts, or other Gezel state,","startTime":181.33333333333334,"endTime":183.66666666666666,"audioSegment":0},{"text":"use authorizeLocal() to obtain the approved transport and pass it to the typed client:","startTime":183.66666666666666,"endTime":186,"audioSegment":0},{"text":"import { authorizeLocal } from '@bendyline/gezel-app-sdk';","startTime":186,"endTime":188.33333333333334,"audioSegment":0},{"text":"import { GezelClient } from '@bendyline/gezel-client/node';","startTime":188.33333333333334,"endTime":190.66666666666666,"audioSegment":0},{"text":"const authorized = await authorizeLocal({","startTime":190.66666666666666,"endTime":193,"audioSegment":0},{"text":"appId: 'acme.editor',","startTime":193,"endTime":195.33333333333334,"audioSegment":0},{"text":"appName: 'Acme Editor',","startTime":195.33333333333334,"endTime":197.66666666666666,"audioSegment":0},{"text":"scopes: ['product'], tokenStorage,","startTime":197.66666666666666,"endTime":200,"audioSegment":0},{"text":"onVerificationCode: showConnectionCode, });","startTime":200,"endTime":202.33333333333334,"audioSegment":0},{"text":"const client = new GezelClient(authorized);","startTime":202.33333333333334,"endTime":204.66666666666666,"audioSegment":0},{"text":"const projects = await client.listProjects();","startTime":204.66666666666666,"endTime":207,"audioSegment":0},{"text":"This pairing is the supported route for a rich integration: the app SDK owns discovery,","startTime":207,"endTime":209.33333333333334,"audioSegment":0},{"text":"pinned TLS, consent, and scoped credentials; @bendyline/gezel-client owns the typed product API.","startTime":209.33333333333334,"endTime":211.66666666666669,"audioSegment":0},{"text":"Avoid hand-written /api requests when the client already covers the endpoint.","startTime":211.66666666666669,"endTime":214,"audioSegment":0},{"text":"MethodPurposeapp.models()List the models and gezels exposed to this appapp.chat()OpenAI-compatible chat completion,","startTime":214,"endTime":218.71428571428572,"audioSegment":0},{"text":"streaming or completeapp.embeddings()OpenAI-compatible embeddings when the selected provider supports themapp.ensureModel()Make sure a catalog model is installed and warmapp.streamEnsureEvents()Follow model download progress and completion over SSEapp.revokeMyToken()Let the app revoke its own connection","startTime":218.71428571428572,"endTime":223.42857142857142,"audioSegment":0},{"text":"detectGezel() is a useful preflight, but it does not authorize anything.","startTime":223.42857142857142,"endTime":228.14285714285714,"audioSegment":0},{"text":"connect() returns a ready GezelApp; authorize() returns the generic base URL, token, and trusted fetch;","startTime":228.14285714285714,"endTime":232.85714285714286,"audioSegment":0},{"text":"connectLocal() combines the full Node-native local flow with non-sensitive daemon diagnostics.","startTime":232.85714285714286,"endTime":237.57142857142858,"audioSegment":0},{"text":"Ordinary third-party apps should ask the user to start Gezel when discovery reports daemon_not_running.","startTime":237.57142857142858,"endTime":242.28571428571428,"audioSegment":0},{"text":"The optional start-if-missing path is only for native integrations that deliberately bundle the matching gezeld package.","startTime":242.28571428571428,"endTime":247,"audioSegment":0},{"text":"The local daemon uses a per-launch self-signed certificate.","startTime":247,"endTime":250.28571428571428,"audioSegment":0},{"text":"The Node SDK reads the public certificate from Gezel's runtime directory and constructs a pinned fetch,","startTime":250.28571428571428,"endTime":253.57142857142858,"audioSegment":0},{"text":"so you should not disable TLS verification globally or replace the transport with an unpinned client.","startTime":253.57142857142858,"endTime":256.85714285714283,"audioSegment":0},{"text":"A browser cannot read ~/.gezel/runtime/ and cannot perform this local trust setup itself.","startTime":256.85714285714283,"endTime":260.14285714285717,"audioSegment":0},{"text":"Use a desktop helper to complete discovery and consent,","startTime":260.14285714285717,"endTime":263.42857142857144,"audioSegment":0},{"text":"then pass the resolved address and scoped token to a renderer that imports GezelApp from @bendyline/gezel-app-sdk/browser.","startTime":263.42857142857144,"endTime":266.7142857142857,"audioSegment":0},{"text":"Pure websites should not attempt to bypass the browser's loopback TLS protections.","startTime":266.7142857142857,"endTime":270,"audioSegment":0},{"text":"Catch GezelSdkError and branch on its code.","startTime":270,"endTime":273.2857142857143,"audioSegment":0},{"text":"Common cases include daemon_not_running, user_denied, approval_timeout, verification_code_handler_required, model_not_found, embeddings_not_supported, missing_scope:<scope>, and provider_error.","startTime":273.2857142857143,"endTime":276.57142857142856,"audioSegment":0},{"text":"Treat denial as a normal user choice,","startTime":276.57142857142856,"endTime":279.85714285714283,"audioSegment":0},{"text":"and give timeouts and missing-daemon errors an obvious retry path.","startTime":279.85714285714283,"endTime":283.1428571428571,"audioSegment":0},{"text":"The daemon publishes the current public OpenAPI document at unauthenticated GET /v1/openapi.json.","startTime":283.1428571428571,"endTime":286.42857142857144,"audioSegment":0},{"text":"Use it for route inspection or code generation;","startTime":286.42857142857144,"endTime":289.7142857142857,"audioSegment":0},{"text":"use the SDK types for ordinary application code.","startTime":289.7142857142857,"endTime":293,"audioSegment":0}],"version":1},"startBlock":{"title":"Building connected apps with gezel-app-sdk","subtitle":"@bendyline/gezel-app-sdk is for software that runs beside Gezel. It lets a desktop or Node application discover the logged-in user's daemon, trust its loopback TLS certificate, ask the user for a scoped connection, remember the issued token securely, and use OpenAI-shaped model APIs.","ambientMotion":"zoomIn"}}</script>
