"offset":12169},"end":{"line":194,"column":107,"offset":12171}}},{"type":"inlineCode","value":"approval_timeout","position":{"start":{"line":194,"column":107,"offset":12171},"end":{"line":194,"column":125,"offset":12189}}},{"type":"text","value":", ","position":{"start":{"line":194,"column":125,"offset":12189},"end":{"line":194,"column":127,"offset":12191}}},{"type":"inlineCode","value":"verification_code_handler_required","position":{"start":{"line":194,"column":127,"offset":12191},"end":{"line":194,"column":163,"offset":12227}}},{"type":"text","value":", ","position":{"start":{"line":194,"column":163,"offset":12227},"end":{"line":194,"column":165,"offset":12229}}},{"type":"inlineCode","value":"model_not_found","position":{"start":{"line":194,"column":165,"offset":12229},"end":{"line":194,"column":182,"offset":12246}}},{"type":"text","value":", ","position":{"start":{"line":194,"column":182,"offset":12246},"end":{"line":194,"column":184,"offset":12248}}},{"type":"inlineCode","value":"embeddings_not_supported","position":{"start":{"line":194,"column":184,"offset":12248},"end":{"line":194,"column":210,"offset":12274}}},{"type":"text","value":", ","position":{"start":{"line":194,"column":210,"offset":12274},"end":{"line":194,"column":212,"offset":12276}}},{"type":"inlineCode","value":"missing_scope:<scope>","position":{"start":{"line":194,"column":212,"offset":12276},"end":{"line":194,"column":235,"offset":12299}}},{"type":"text","value":", and ","position":{"start":{"line":194,"column":235,"offset":12299},"end":{"line":194,"column":241,"offset":12305}}},{"type":"inlineCode","value":"provider_error","position":{"start":{"line":194,"column":241,"offset":12305},"end":{"line":194,"column":257,"offset":12321}}},{"type":"text","value":". Treat denial as a normal user choice, and give timeouts and missing-daemon errors an obvious retry path.","position":{"start":{"line":194,"column":257,"offset":12321},"end":{"line":194,"column":363,"offset":12427}}}],"position":{"start":{"line":194,"column":1,"offset":12065},"end":{"line":194,"column":363,"offset":12427}}},{"type":"paragraph","children":[{"type":"text","value":"The daemon publishes the current public OpenAPI document at unauthenticated ","position":{"start":{"line":196,"column":1,"offset":12429},"end":{"line":196,"column":77,"offset":12505}}},{"type":"inlineCode","value":"GET /v1/openapi.json","position":{"start":{"line":196,"column":77,"offset":12505},"end":{"line":196,"column":99,"offset":12527}}},{"type":"text","value":". Use it for route inspection or code generation; use the SDK types for ordinary application code.","position":{"start":{"line":196,"column":99,"offset":12527},"end":{"line":196,"column":197,"offset":12625}}}],"position":{"start":{"line":196,"column":1,"offset":12429},"end":{"line":196,"column":197,"offset":12625}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"@bendyline/gezel-app-sdk is for software that runs beside Gezel.","startTime":0,"endTime":3.375,"audioSegment":0},{"text":"It lets a desktop or Node application discover the logged-in user's daemon, trust its loopback TLS certificate,","startTime":3.375,"endTime":6.75,"audioSegment":0},{"text":"ask the user for a scoped connection, remember the issued token securely, and use OpenAI-shaped model APIs.","startTime":6.75,"endTime":10.125,"audioSegment":0},{"text":"This differs from @bendyline/gezel-sdk, whose scripts run inside Gezel's sandbox.","startTime":10.125,"endTime":13.5,"audioSegment":0},{"text":"A connected app owns its own interface and process.","startTime":13.5,"endTime":16.875,"audioSegment":0},{"text":"Gezel owns model discovery and downloads, consent,","startTime":16.875,"endTime":20.25,"audioSegment":0},{"text":"revocation, and the local inference service.","startTime":20.25,"endTime":23.625,"audioSegment":0},{"text":"If the experience should live inside a Gezel project as a custom crew, dashboard,","startTime":23.625,"endTime":27,"audioSegment":0},{"text":"craftbooks, scripts, and data, see Building AI Apps inside Gezel instead.","startTime":27,"endTime":30.375,"audioSegment":0},{"text":"The Connected apps article explains what the user sees.","startTime":30.375,"endTime":33.75,"audioSegment":0},{"text":"This article covers the developer side.","startTime":33.75,"endTime":37.125,"audioSegment":0},{"text":"For a worked editor integration, see How DocBlocks uses Gezel for text AI, including private inference hosting,","startTime":37.125,"endTime":40.5,"audioSegment":0},{"text":"streamed drafts, reference knowledge, and opportunities to simplify the SDK boundary.","startTime":40.5,"endTime":43.875,"audioSegment":0},{"text":"This article teaches the SDK.","startTime":43.875,"endTime":47.25,"audioSegment":0},{"text":"For what is promised rather than how to use it — which exports are stable, what cancellation guarantees,","startTime":47.25,"endTime":50.625,"audioSegment":0},{"text":"and what a store build must do differently — see the App SDK surface contract.","startTime":50.625,"endTime":54,"audioSegment":0},{"text":"The Node entry requires Node.js 24 or newer:","startTime":54,"endTime":56.4054054054054,"audioSegment":0},{"text":"npm install @bendyline/gezel-app-sdk","startTime":56.4054054054054,"endTime":58.81081081081081,"audioSegment":0},{"text":"The normal third-party flow is: detect Gezel, request the narrowest scope, let the user approve in the desktop app,","startTime":58.81081081081081,"endTime":61.21621621621622,"audioSegment":0},{"text":"and store the resulting token in the operating system's credential store.","startTime":61.21621621621622,"endTime":63.62162162162162,"audioSegment":0},{"text":"import { connect, detectGezel } from '@bendyline/gezel-app-sdk';","startTime":63.62162162162162,"endTime":66.02702702702703,"audioSegment":0},{"text":"// Demo only: this lasts for one process.","startTime":66.02702702702703,"endTime":68.43243243243244,"audioSegment":0},{"text":"Replace it with Keychain,","startTime":68.43243243243244,"endTime":70.83783783783784,"audioSegment":0},{"text":"// Credential Manager, libsecret, or your existing secure credential vault.","startTime":70.83783783783784,"endTime":73.24324324324324,"audioSegment":0},{"text":"const demoTokens = new Map<string, string>();","startTime":73.24324324324324,"endTime":75.64864864864865,"audioSegment":0},{"text":"const tokenStorage = {","startTime":75.64864864864865,"endTime":78.05405405405405,"audioSegment":0},{"text":"load: (appId: string) => demoTokens.get(appId) ?? null,","startTime":78.05405405405405,"endTime":80.45945945945945,"audioSegment":0},{"text":"save: (appId: string, token: string) => demoTokens.set(appId, token),","startTime":80.45945945945945,"endTime":82.86486486486487,"audioSegment":0},{"text":"delete: (appId: string) => demoTokens.delete(appId), };","startTime":82.86486486486487,"endTime":85.27027027027026,"audioSegment":0},{"text":"const status = await detectGezel();","startTime":85.27027027027026,"endTime":87.67567567567568,"audioSegment":0},{"text":"if (!status.running) {","startTime":87.67567567567568,"endTime":90.08108108108108,"audioSegment":0},{"text":"throw new Error('Start Gezel, then connect this app again.'); }","startTime":90.08108108108108,"endTime":92.48648648648648,"audioSegment":0},{"text":"const app = await connect({","startTime":92.48648648648648,"endTime":94.89189189189189,"audioSegment":0},{"text":"appId: 'acme.notes',","startTime":94.89189189189189,"endTime":97.29729729729729,"audioSegment":0},{"text":"appName: 'Acme Notes',","startTime":97.29729729729729,"endTime":99.70270270270271,"audioSegment":0},{"text":"scopes: ['openai'], tokenStorage, });","startTime":99.70270270270271,"endTime":102.1081081081081,"audioSegment":0},{"text":"const available = await app.models();","startTime":102.1081081081081,"endTime":104.51351351351352,"audioSegment":0},{"text":"const model = available.data[0];","startTime":104.51351351351352,"endTime":106.91891891891892,"audioSegment":0},{"text":"if (!model) throw new Error('No Gezel models are available.');","startTime":106.91891891891892,"endTime":109.32432432432432,"audioSegment":0},{"text":"const stream = await app.chat({","startTime":109.32432432432432,"endTime":111.72972972972973,"audioSegment":0},{"text":"model: model.id,","startTime":111.72972972972973,"endTime":114.13513513513513,"audioSegment":0},{"text":"messages: [{ role: 'user', content: 'Give this note a short title.' }], stream: true, });","startTime":114.13513513513513,"endTime":116.54054054054053,"audioSegment":0},{"text":"for await (const chunk of stream) {","startTime":116.54054054054053,"endTime":118.94594594594594,"audioSegment":0},{"text":"process.stdout.write(chunk.choices[0]?.delta?.content ?? ''); }","startTime":118.94594594594594,"endTime":121.35135135135135,"audioSegment":0},{"text":"The in-memory map keeps the quickstart self-contained, but a real application must replace it with secure operating-system storage;","startTime":121.35135135135135,"endTime":123.75675675675676,"audioSegment":0},{"text":"do not save the token in source code, a project file, or plain-text preferences.","startTime":123.75675675675676,"endTime":126.16216216216216,"audioSegment":0},{"text":"connect() verifies a stored token still has the requested scopes.","startTime":126.16216216216216,"endTime":128.56756756756755,"audioSegment":0},{"text":"If it was revoked or is too narrow,","startTime":128.56756756756755,"endTime":130.97297297297297,"audioSegment":0},{"text":"the SDK discards it and starts a fresh visible consent flow.","startTime":130.97297297297297,"endTime":133.3783783783784,"audioSegment":0},{"text":"Call app.models() rather than hardcoding a model id.","startTime":133.3783783783784,"endTime":135.78378378378378,"audioSegment":0},{"text":"The response is the authoritative list available to this connection and can include both raw models and eligible gezels.","startTime":135.78378378378378,"endTime":138.18918918918916,"audioSegment":0},{"text":"Selecting a gezel gives the caller that gezel's character and tuned model,","startTime":138.18918918918916,"endTime":140.59459459459458,"audioSegment":0},{"text":"while your app keeps ownership of its interface and conversation loop.","startTime":140.59459459459458,"endTime":143,"audioSegment":0},{"text":"Every connection has a stable appId,","startTime":143,"endTime":145.56521739130434,"audioSegment":0},{"text":"a user-visible name, and one or more scopes.","startTime":145.56521739130434,"endTime":148.1304347826087,"audioSegment":0},{"text":"The user can review and revoke it under Settings → Connected Apps.","startTime":148.1304347826087,"endTime":150.69565217391303,"audioSegment":0},{"text":"Scope Use it for Approval","startTime":150.69565217391303,"endTime":153.26086956521738,"audioSegment":0},{"text":"openai Model listing, chat, embeddings,","startTime":153.26086956521738,"endTime":155.82608695652175,"audioSegment":0},{"text":"and ensuring a local model is present Click approval by default","startTime":155.82608695652175,"endTime":158.3913043478261,"audioSegment":0},{"text":"product The ordinary Gezel product API through @bendyline/gezel-client Approval plus a requester-visible verification code","startTime":158.3913043478261,"endTime":160.95652173913044,"audioSegment":0},{"text":"remote-inference Gezel's paired-device inference surface Click approval by default","startTime":160.95652173913044,"endTime":163.52173913043478,"audioSegment":0},{"text":"Third-party applications should not request the first-party cli scope or call authorizeLocalOwner().","startTime":163.52173913043478,"endTime":166.08695652173913,"audioSegment":0},{"text":"Those surfaces are reserved for Gezel's own command line and same-user clients.","startTime":166.08695652173913,"endTime":168.65217391304347,"audioSegment":0},{"text":"Ask for product only when the application truly needs projects, tasks, gezels,","startTime":168.65217391304347,"endTime":171.2173913043478,"audioSegment":0},{"text":"or other product state; add openai only if that same application also performs inference.","startTime":171.2173913043478,"endTime":173.7826086956522,"audioSegment":0},{"text":"Stateful scopes require onVerificationCode.","startTime":173.7826086956522,"endTime":176.3478260869565,"audioSegment":0},{"text":"Show the code in the requesting application so the user can type it into Gezel's approval dialog:","startTime":176.3478260869565,"endTime":178.91304347826087,"audioSegment":0},{"text":"import { authorizeLocal } from '@bendyline/gezel-app-sdk';","startTime":178.91304347826087,"endTime":181.47826086956522,"audioSegment":0},{"text":"const authorized = await authorizeLocal({","startTime":181.47826086956522,"endTime":184.04347826086956,"audioSegment":0},{"text":"appId: 'acme.editor',","startTime":184.04347826086956,"endTime":186.6086956521739,"audioSegment":0},{"text":"appName: 'Acme Editor',","startTime":186.6086956521739,"endTime":189.17391304347825,"audioSegment":0},{"text":"scopes: ['product'], tokenStorage,","startTime":189.17391304347825,"endTime":191.73913043478262,"audioSegment":0},{"text":"onVerificationCode(code) {","startTime":191.73913043478262,"endTime":194.30434782608694,"audioSegment":0},{"text":"showConnectionCode(code); }, });","startTime":194.30434782608694,"endTime":196.8695652173913,"audioSegment":0},{"text":"The daemon generates the code and never sends it to the Gezel desktop approval surface.","startTime":196.8695652173913,"endTime":199.43478260869566,"audioSegment":0},{"text":"This proves that the person approving the grant can also see the application that requested it.","startTime":199.43478260869566,"endTime":202,"audioSegment":0},{"text":"The app SDK's GezelApp class deliberately stays focused on the OpenAI-compatible surface.","startTime":202,"endTime":204.33333333333334,"audioSegment":0},{"text":"When a connected app also needs projects, tasks, chats, scripts, or other Gezel state,","startTime":204.33333333333334,"endTime":206.66666666666666,"audioSegment":0},{"text":"use authorizeLocal() to obtain the approved transport and pass it to the typed client:","startTime":206.66666666666666,"endTime":209,"audioSegment":0},{"text":"import { authorizeLocal } from '@bendyline/gezel-app-sdk';","startTime":209,"endTime":211.33333333333334,"audioSegment":0},{"text":"import { GezelClient } from '@bendyline/gezel-client/node';","startTime":211.33333333333334,"endTime":213.66666666666666,"audioSegment":0},{"text":"const authorized = await authorizeLocal({","startTime":213.66666666666666,"endTime":216,"audioSegment":0},{"text":"appId: 'acme.editor',","startTime":216,"endTime":218.33333333333334,"audioSegment":0},{"text":"appName: 'Acme Editor',","startTime":218.33333333333334,"endTime":220.66666666666666,"audioSegment":0},{"text":"scopes: ['product'], tokenStorage,","startTime":220.66666666666666,"endTime":223,"audioSegment":0},{"text":"onVerificationCode: showConnectionCode, });","startTime":223,"endTime":225.33333333333334,"audioSegment":0},{"text":"const client = new GezelClient(authorized);","startTime":225.33333333333334,"endTime":227.66666666666666,"audioSegment":0},{"text":"const projects = await client.listProjects();","startTime":227.66666666666666,"endTime":230,"audioSegment":0},{"text":"This pairing is the supported route for a rich integration: the app SDK owns discovery,","startTime":230,"endTime":232.33333333333334,"audioSegment":0},{"text":"pinned TLS, consent, and scoped credentials; @bendyline/gezel-client owns the typed product API.","startTime":232.33333333333334,"endTime":234.66666666666669,"audioSegment":0},{"text":"Avoid hand-written /api requests when the client already covers the endpoint.","startTime":234.66666666666669,"endTime":237,"audioSegment":0},{"text":"Method Purpose","startTime":237,"endTime":240.08333333333334,"audioSegment":0},{"text":"app.models() List the models and gezels exposed to this app","startTime":240.08333333333334,"endTime":243.16666666666666,"audioSegment":0},{"text":"app.chat() OpenAI-compatible chat completion, streaming or complete","startTime":243.16666666666666,"endTime":246.25,"audioSegment":0},{"text":"app.embeddings() OpenAI-compatible embeddings when the selected provider supports them","startTime":246.25,"endTime":249.33333333333334,"audioSegment":0},{"text":"app.ensureModel() Make sure a catalog model is installed and warm","startTime":249.33333333333334,"endTime":252.41666666666666,"audioSegment":0},{"text":"app.streamEnsureEvents() Follow model download progress and completion over SSE","startTime":252.41666666666666,"endTime":255.5,"audioSegment":0},{"text":"app.revokeMyToken() Let the app revoke its own connection","startTime":255.5,"endTime":258.5833333333333,"audioSegment":0},{"text":"detectGezel() is a useful preflight, but it does not authorize anything.","startTime":258.5833333333333,"endTime":261.6666666666667,"audioSegment":0},{"text":"connect() returns a ready GezelApp; authorize() returns the generic base URL, token, and trusted fetch;","startTime":261.6666666666667,"endTime":264.75,"audioSegment":0},{"text":"connectLocal() combines the full Node-native local flow with non-sensitive daemon diagnostics.","startTime":264.75,"endTime":267.8333333333333,"audioSegment":0},{"text":"Ordinary third-party apps should ask the user to start Gezel when discovery reports daemon_not_running.","startTime":267.8333333333333,"endTime":270.9166666666667,"audioSegment":0},{"text":"The optional start-if-missing path is only for native integrations that deliberately bundle the matching gezeld package.","startTime":270.9166666666667,"endTime":274,"audioSegment":0},{"text":"The flow above needs a Gezel the person already runs.","startTime":274,"endTime":277.34375,"audioSegment":0},{"text":"An application that must work either way can host one itself: @bendyline/gezel-app-sdk/host connects to their Gezel when it is running,","startTime":277.34375,"endTime":280.6875,"audioSegment":0},{"text":"and otherwise starts a daemon inside your own process.","startTime":280.6875,"endTime":284.03125,"audioSegment":0},{"text":"Application code is the same afterwards.","startTime":284.03125,"endTime":287.375,"audioSegment":0},{"text":"import { connectOrHost } from '@bendyline/gezel-app-sdk/host';","startTime":287.375,"endTime":290.71875,"audioSegment":0},{"text":"const gezel = await connectOrHost({","startTime":290.71875,"endTime":294.0625,"audioSegment":0},{"text":"appId: 'acme.travel',","startTime":294.0625,"endTime":297.40625,"audioSegment":0},{"text":"appName: 'Acme Travel',","startTime":297.40625,"endTime":300.75,"audioSegment":0},{"text":"host: { nodePath: bundledNodePath }, });","startTime":300.75,"endTime":304.09375,"audioSegment":0},{"text":"await gezel.ensureModel({ model: 'gemma4-e2b-q4' });","startTime":304.09375,"endTime":307.4375,"audioSegment":0},{"text":"const project = await gezel.ensureProject({ package: shippedGezapp, folder: travelFolder });","startTime":307.4375,"endTime":310.78125,"audioSegment":0},{"text":"const chat = await project.openChat({ role: 'travel-guide' });","startTime":310.78125,"endTime":314.125,"audioSegment":0},{"text":"Gezel is the central object — the connection, the models, the projects.","startTime":314.125,"endTime":317.46875,"audioSegment":0},{"text":"Most work happens in the GezelProject it hands back, because chats and tools are both project-scoped,","startTime":317.46875,"endTime":320.8125,"audioSegment":0},{"text":"and an application that has the project never has to pass its id back in.","startTime":320.8125,"endTime":324.15625,"audioSegment":0},{"text":"gezel.openProject(id) reaches a project that already exists.","startTime":324.15625,"endTime":327.5,"audioSegment":0},{"text":"A hosted daemon keeps its state under ~/.gezel/apps/<appId>/, so the projects and gezels an application creates for itself never appear in the person's own workshop,","startTime":327.5,"endTime":330.84375,"audioSegment":0},{"text":"and the two daemons never contend for one runtime directory.","startTime":330.84375,"endTime":334.1875,"audioSegment":0},{"text":"Models the person already installed are read from their home rather than downloaded again.","startTime":334.1875,"endTime":337.53125,"audioSegment":0},{"text":"Both ensureModel and ensureProject are idempotent and meant to run on every launch.","startTime":337.53125,"endTime":340.875,"audioSegment":0},{"text":"ensureModel uses an installed model first, then a .gezmodel bundle the application ships,","startTime":340.875,"endTime":344.21875,"audioSegment":0},{"text":"and only then the network — so a first run can work offline.","startTime":344.21875,"endTime":347.5625,"audioSegment":0},{"text":"ensureProject keeps the person's edits to seeded files and reuses the crew already on the roster.","startTime":347.5625,"endTime":350.90625,"audioSegment":0},{"text":"Hosting requires @bendyline/gezel-service beside the SDK;","startTime":350.90625,"endTime":354.25,"audioSegment":0},{"text":"it is an optional peer dependency, so applications that only connect never download it.","startTime":354.25,"endTime":357.59375,"audioSegment":0},{"text":"Under Electron, pass a real Node binary as host.nodePath: Gezel runs its tool server as a child process,","startTime":357.59375,"endTime":360.9375,"audioSegment":0},{"text":"and an Electron binary cannot stand in for Node.","startTime":360.9375,"endTime":364.28125,"audioSegment":0},{"text":"Without one, the SDK uses the Node that a Gezel install keeps in its home,","startTime":364.28125,"endTime":367.625,"audioSegment":0},{"text":"when there is one.","startTime":367.625,"endTime":370.96875,"audioSegment":0},{"text":"By default the application hosts only when no Gezel is running;","startTime":370.96875,"endTime":374.3125,"audioSegment":0},{"text":"a person who declines the connection in Gezel is not overridden.","startTime":374.3125,"endTime":377.65625,"audioSegment":0},{"text":"An application whose AI is optional and switched on by the person inside it may pass hostWhenRefused: true to host after a refusal too.","startTime":377.65625,"endTime":381,"audioSegment":0},{"text":"An application can offer its own tools to the gezels in its project.","startTime":381,"endTime":384.29411764705884,"audioSegment":0},{"text":"The model sees them beside Gezel's built-in tools; when one is called,","startTime":384.29411764705884,"endTime":387.5882352941176,"audioSegment":0},{"text":"the handler runs in the application's process and what it returns becomes the tool's output.","startTime":387.5882352941176,"endTime":390.88235294117646,"audioSegment":0},{"text":"await project.registerTools({ tools: [ {","startTime":390.88235294117646,"endTime":394.1764705882353,"audioSegment":0},{"text":"name: 'add_travel_points',","startTime":394.1764705882353,"endTime":397.47058823529414,"audioSegment":0},{"text":"description: 'Award travel points to the traveler.', inputSchema: {","startTime":397.47058823529414,"endTime":400.7647058823529,"audioSegment":0},{"text":"type: 'object',","startTime":400.7647058823529,"endTime":404.05882352941177,"audioSegment":0},{"text":"properties: { points: { type: 'number' } },","startTime":404.05882352941177,"endTime":407.3529411764706,"audioSegment":0},{"text":"required: ['points'], },","startTime":407.3529411764706,"endTime":410.6470588235294,"audioSegment":0},{"text":"handler: async ({ points }) => awardPoints(Number(points)), }, ], });","startTime":410.6470588235294,"endTime":413.94117647058823,"audioSegment":0},{"text":"The registration lives as long as the connection that made it.","startTime":413.94117647058823,"endTime":417.2352941176471,"audioSegment":0},{"text":"A brief disconnection is held open for a grace window and reconnects on its own;","startTime":417.2352941176471,"endTime":420.52941176470586,"audioSegment":0},{"text":"a closed application's tools are withdrawn, because a tool whose handler is gone would accept a call and never answer it.","startTime":420.52941176470586,"endTime":423.8235294117647,"audioSegment":0},{"text":"Arguments are checked against the declared schema before they leave the daemon,","startTime":423.8235294117647,"endTime":427.11764705882354,"audioSegment":0},{"text":"a handler that throws is reported to the model as an ordinary tool failure, and each call has a timeout the application sets.","startTime":427.11764705882354,"endTime":430.4117647058823,"audioSegment":0},{"text":"Tool calls appear in the transcript and the history log like any other tool.","startTime":430.4117647058823,"endTime":433.70588235294116,"audioSegment":0},{"text":"This needs the product scope, or a daemon the application hosts.","startTime":433.70588235294116,"endTime":437,"audioSegment":0},{"text":"The local daemon uses a per-launch self-signed certificate.","startTime":437,"endTime":440.39130434782606,"audioSegment":0},{"text":"The Node SDK reads the public certificate from Gezel's runtime directory and constructs a pinned fetch,","startTime":440.39130434782606,"endTime":443.7826086956522,"audioSegment":0},{"text":"so you should not disable TLS verification globally or replace the transport with an unpinned client.","startTime":443.7826086956522,"endTime":447.17391304347825,"audioSegment":0},{"text":"A browser cannot read ~/.gezel/runtime/ and cannot perform this local trust setup itself.","startTime":447.17391304347825,"endTime":450.5652173913044,"audioSegment":0},{"text":"Use a desktop helper to complete discovery and consent,","startTime":450.5652173913044,"endTime":453.95652173913044,"audioSegment":0},{"text":"then pass the resolved address and scoped token to a renderer that imports GezelApp from @bendyline/gezel-app-sdk/browser.","startTime":453.95652173913044,"endTime":457.3478260869565,"audioSegment":0},{"text":"Pure websites should not attempt to bypass the browser's loopback TLS protections.","startTime":457.3478260869565,"endTime":460.7391304347826,"audioSegment":0},{"text":"registerAppTools is exported from ./browser too: it needs only fetch and streams,","startTime":460.7391304347826,"endTime":464.1304347826087,"audioSegment":0},{"text":"so a renderer that already holds a product token can offer tools of its own.","startTime":464.1304347826087,"endTime":467.52173913043475,"audioSegment":0},{"text":"Gezel's Office task pane is the worked example.","startTime":467.52173913043475,"endTime":470.9130434782609,"audioSegment":0},{"text":"The daemon serves that pane itself, on a stable HTTPS origin with a certificate the user trusts once,","startTime":470.9130434782609,"endTime":474.30434782608694,"audioSegment":0},{"text":"which is the one browser origin allowed to request a grant directly.","startTime":474.30434782608694,"endTime":477.69565217391306,"audioSegment":0},{"text":"It registers doc_*, sheet_*, and slide_* tools that run Office.js,","startTime":477.69565217391306,"endTime":481.0869565217391,"audioSegment":0},{"text":"and withdraws the write tools when the user turns edits off.","startTime":481.0869565217391,"endTime":484.47826086956525,"audioSegment":0},{"text":"The LibreOffice extension does the same from native Python,","startTime":484.47826086956525,"endTime":487.8695652173913,"audioSegment":0},{"text":"and the source of both lives in the Gezel repository (packages/ui/src/office/, packages/libreoffice-extension/).","startTime":487.8695652173913,"endTime":491.2608695652174,"audioSegment":0},{"text":"Catch GezelSdkError and branch on its code.","startTime":491.2608695652174,"endTime":494.6521739130435,"audioSegment":0},{"text":"Common cases include daemon_not_running, user_denied, approval_timeout, verification_code_handler_required, model_not_found, embeddings_not_supported, missing_scope:<scope>, and provider_error.","startTime":494.6521739130435,"endTime":498.04347826086956,"audioSegment":0},{"text":"Treat denial as a normal user choice,","startTime":498.04347826086956,"endTime":501.4347826086956,"audioSegment":0},{"text":"and give timeouts and missing-daemon errors an obvious retry path.","startTime":501.4347826086956,"endTime":504.82608695652175,"audioSegment":0},{"text":"The daemon publishes the current public OpenAPI document at unauthenticated GET /v1/openapi.json.","startTime":504.82608695652175,"endTime":508.2173913043478,"audioSegment":0},{"text":"Use it for route inspection or code generation;","startTime":508.2173913043478,"endTime":511.6086956521739,"audioSegment":0},{"text":"use the SDK types for ordinary application code.","startTime":511.6086956521739,"endTime":515,"audioSegment":0}],"version":1},"startBlock":{"title":"Building connected apps with gezel-app-sdk","subtitle":"@bendyline/gezel-app-sdk is for software that runs beside Gezel. It lets a desktop or Node application discover the logged-in user's daemon, trust its loopback TLS certificate, ask the user for a scoped connection, remember the issued token securely, and use OpenAI-shaped model APIs.","ambientMotion":"zoomIn"}}</script>
