:25,"offset":4499}}},"title":"When you ship an app","contents":[{"type":"paragraph","children":[{"type":"text","value":"The open port is for trying things out and for tools that only know Ollama. An app other people install should connect with a key of its own, so the person can see it in ","position":{"start":{"line":95,"column":1,"offset":4501},"end":{"line":95,"column":171,"offset":4671}}},{"type":"strong","children":[{"type":"text","value":"Settings → Integrations","position":{"start":{"line":95,"column":173,"offset":4673},"end":{"line":95,"column":196,"offset":4696}}}],"position":{"start":{"line":95,"column":171,"offset":4671},"end":{"line":95,"column":198,"offset":4698}}},{"type":"text","value":" and revoke it:","position":{"start":{"line":95,"column":198,"offset":4698},"end":{"line":95,"column":213,"offset":4713}}}],"position":{"start":{"line":95,"column":1,"offset":4501},"end":{"line":95,"column":213,"offset":4713}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"inlineCode","value":"gezel integrations token create my-app","position":{"start":{"line":97,"column":3,"offset":4717},"end":{"line":97,"column":43,"offset":4757}}},{"type":"text","value":" makes a key and prints the address to use it with. ","position":{"start":{"line":97,"column":43,"offset":4757},"end":{"line":97,"column":95,"offset":4809}}},{"type":"inlineCode","value":"gezel integrations address","position":{"start":{"line":97,"column":95,"offset":4809},"end":{"line":97,"column":123,"offset":4837}}},{"type":"text","value":" prints every address at any time.","position":{"start":{"line":97,"column":123,"offset":4837},"end":{"line":97,"column":157,"offset":4871}}}],"position":{"start":{"line":97,"column":3,"offset":4717},"end":{"line":97,"column":157,"offset":4871}}}],"position":{"start":{"line":97,"column":1,"offset":4715},"end":{"line":97,"column":157,"offset":4871}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Outside a container that address is served with Gezel's own certificate, which a program has to trust or skip checking. The SDK below does that for you, along with asking the person for consent and keeping the key.","position":{"start":{"line":98,"column":3,"offset":4874},"end":{"line":98,"column":217,"offset":5088}}}],"position":{"start":{"line":98,"column":3,"offset":4874},"end":{"line":98,"column":217,"offset":5088}}}],"position":{"start":{"line":98,"column":1,"offset":4872},"end":{"line":98,"column":217,"offset":5088}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"A ","position":{"start":{"line":99,"column":3,"offset":5091},"end":{"line":99,"column":5,"offset":5093}}},{"type":"link","url":"../gezel-in-docker/","children":[{"type":"text","value":"Gezel container","position":{"start":{"line":99,"column":6,"offset":5094},"end":{"line":99,"column":21,"offset":5109}}}],"position":{"start":{"line":99,"column":5,"offset":5093},"end":{"line":99,"column":43,"offset":5131}}},{"type":"text","value":" answers keyed requests over plain HTTP at ","position":{"start":{"line":99,"column":43,"offset":5131},"end":{"line":99,"column":86,"offset":5174}}},{"type":"inlineCode","value":"http://localhost:6230/v1","position":{"start":{"line":99,"column":86,"offset":5174},"end":{"line":99,"column":112,"offset":5200}}},{"type":"text","value":".","position":{"start":{"line":99,"column":112,"offset":5200},"end":{"line":99,"column":113,"offset":5201}}}],"position":{"start":{"line":99,"column":3,"offset":5091},"end":{"line":99,"column":113,"offset":5201}}}],"position":{"start":{"line":99,"column":1,"offset":5089},"end":{"line":99,"column":113,"offset":5201}}}],"position":{"start":{"line":97,"column":1,"offset":4715},"end":{"line":99,"column":113,"offset":5201}}}]}]},{"id":"install-and-connect","startTime":206,"duration":89,"audioSegment":0,"template":"sectionHeader", "text","value":").","position":{"start":{"line":286,"column":695,"offset":17445},"end":{"line":286,"column":697,"offset":17447}}}],"position":{"start":{"line":286,"column":1,"offset":16751},"end":{"line":286,"column":697,"offset":17447}}},{"type":"paragraph","children":[{"type":"text","value":"Catch ","position":{"start":{"line":288,"column":1,"offset":17449},"end":{"line":288,"column":7,"offset":17455}}},{"type":"inlineCode","value":"GezelSdkError","position":{"start":{"line":288,"column":7,"offset":17455},"end":{"line":288,"column":22,"offset":17470}}},{"type":"text","value":" and branch on its ","position":{"start":{"line":288,"column":22,"offset":17470},"end":{"line":288,"column":41,"offset":17489}}},{"type":"inlineCode","value":"code","position":{"start":{"line":288,"column":41,"offset":17489},"end":{"line":288,"column":47,"offset":17495}}},{"type":"text","value":". Common cases include ","position":{"start":{"line":288,"column":47,"offset":17495},"end":{"line":288,"column":70,"offset":17518}}},{"type":"inlineCode","value":"daemon_not_running","position":{"start":{"line":288,"column":70,"offset":17518},"end":{"line":288,"column":90,"offset":17538}}},{"type":"text","value":", ","position":{"start":{"line":288,"column":90,"offset":17538},"end":{"line":288,"column":92,"offset":17540}}},{"type":"inlineCode","value":"user_denied","position":{"start":{"line":288,"column":92,"offset":17540},"end":{"line":288,"column":105,"offset":17553}}},{"type":"text","value":", ","position":{"start":{"line":288,"column":105,"offset":17553},"end":{"line":288,"column":107,"offset":17555}}},{"type":"inlineCode","value":"approval_timeout","position":{"start":{"line":288,"column":107,"offset":17555},"end":{"line":288,"column":125,"offset":17573}}},{"type":"text","value":", ","position":{"start":{"line":288,"column":125,"offset":17573},"end":{"line":288,"column":127,"offset":17575}}},{"type":"inlineCode","value":"verification_code_handler_required","position":{"start":{"line":288,"column":127,"offset":17575},"end":{"line":288,"column":163,"offset":17611}}},{"type":"text","value":", ","position":{"start":{"line":288,"column":163,"offset":17611},"end":{"line":288,"column":165,"offset":17613}}},{"type":"inlineCode","value":"model_not_found","position":{"start":{"line":288,"column":165,"offset":17613},"end":{"line":288,"column":182,"offset":17630}}},{"type":"text","value":", ","position":{"start":{"line":288,"column":182,"offset":17630},"end":{"line":288,"column":184,"offset":17632}}},{"type":"inlineCode","value":"embeddings_not_supported","position":{"start":{"line":288,"column":184,"offset":17632},"end":{"line":288,"column":210,"offset":17658}}},{"type":"text","value":", ","position":{"start":{"line":288,"column":210,"offset":17658},"end":{"line":288,"column":212,"offset":17660}}},{"type":"inlineCode","value":"missing_scope:<scope>","position":{"start":{"line":288,"column":212,"offset":17660},"end":{"line":288,"column":235,"offset":17683}}},{"type":"text","value":", and ","position":{"start":{"line":288,"column":235,"offset":17683},"end":{"line":288,"column":241,"offset":17689}}},{"type":"inlineCode","value":"provider_error","position":{"start":{"line":288,"column":241,"offset":17689},"end":{"line":288,"column":257,"offset":17705}}},{"type":"text","value":". Treat denial as a normal user choice, and give timeouts and missing-daemon errors an obvious retry path.","position":{"start":{"line":288,"column":257,"offset":17705},"end":{"line":288,"column":363,"offset":17811}}}],"position":{"start":{"line":288,"column":1,"offset":17449},"end":{"line":288,"column":363,"offset":17811}}},{"type":"paragraph","children":[{"type":"text","value":"The daemon publishes the current public OpenAPI document at unauthenticated ","position":{"start":{"line":290,"column":1,"offset":17813},"end":{"line":290,"column":77,"offset":17889}}},{"type":"inlineCode","value":"GET /v1/openapi.json","position":{"start":{"line":290,"column":77,"offset":17889},"end":{"line":290,"column":99,"offset":17911}}},{"type":"text","value":". Use it for route inspection or code generation; use the SDK types for ordinary application code.","position":{"start":{"line":290,"column":99,"offset":17911},"end":{"line":290,"column":197,"offset":18009}}}],"position":{"start":{"line":290,"column":1,"offset":17813},"end":{"line":290,"column":197,"offset":18009}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"@bendyline/gezel-app-sdk is for software that runs beside Gezel.","startTime":0,"endTime":3.375,"audioSegment":0},{"text":"It lets a desktop or Node application discover the logged-in user's daemon, trust its loopback TLS certificate,","startTime":3.375,"endTime":6.75,"audioSegment":0},{"text":"ask the user for a scoped connection, remember the issued token securely, and use OpenAI-shaped model APIs.","startTime":6.75,"endTime":10.125,"audioSegment":0},{"text":"This differs from @bendyline/gezel-sdk, whose scripts run inside Gezel's sandbox.","startTime":10.125,"endTime":13.5,"audioSegment":0},{"text":"A connected app owns its own interface and process.","startTime":13.5,"endTime":16.875,"audioSegment":0},{"text":"Gezel owns model discovery and downloads, consent,","startTime":16.875,"endTime":20.25,"audioSegment":0},{"text":"revocation, and the local inference service.","startTime":20.25,"endTime":23.625,"audioSegment":0},{"text":"If the experience should live inside a Gezel project as a custom crew, dashboard,","startTime":23.625,"endTime":27,"audioSegment":0},{"text":"craftbooks, scripts, and data, see Building AI Apps inside Gezel instead.","startTime":27,"endTime":30.375,"audioSegment":0},{"text":"The Integrations article explains what the user sees.","startTime":30.375,"endTime":33.75,"audioSegment":0},{"text":"This article covers the developer side.","startTime":33.75,"endTime":37.125,"audioSegment":0},{"text":"For a worked editor integration, see How DocBlocks uses Gezel for text AI, including private inference hosting,","startTime":37.125,"endTime":40.5,"audioSegment":0},{"text":"streamed drafts, reference knowledge, and opportunities to simplify the SDK boundary.","startTime":40.5,"endTime":43.875,"audioSegment":0},{"text":"This article teaches the SDK.","startTime":43.875,"endTime":47.25,"audioSegment":0},{"text":"For what is promised rather than how to use it — which exports are stable, what cancellation guarantees,","startTime":47.25,"endTime":50.625,"audioSegment":0},{"text":"and what a store build must do differently — see the App SDK surface contract.","startTime":50.625,"endTime":54,"audioSegment":0},{"text":"You don't need the SDK to try Gezel's models.","startTime":54,"endTime":56.46666666666667,"audioSegment":0},{"text":"Any program that speaks the OpenAI chat API can reach them over plain HTTP,","startTime":56.46666666666667,"endTime":58.93333333333334,"audioSegment":0},{"text":"in three steps. 1.","startTime":58.93333333333334,"endTime":61.4,"audioSegment":0},{"text":"Install the command line and download a model that fits this computer.","startTime":61.4,"endTime":63.86666666666667,"audioSegment":0},{"text":"Skip this step if Gezel is already set up here.","startTime":63.86666666666667,"endTime":66.33333333333333,"audioSegment":0},{"text":"npm install -g @bendyline/gezel-cli","startTime":66.33333333333333,"endTime":68.8,"audioSegment":0},{"text":"gezel run --download \"Say hello\" 2.","startTime":68.8,"endTime":71.26666666666667,"audioSegment":0},{"text":"Open the plain-HTTP port.","startTime":71.26666666666667,"endTime":73.73333333333333,"audioSegment":0},{"text":"gezel integrations ollama on","startTime":73.73333333333333,"endTime":76.2,"audioSegment":0},{"text":"This is the port Ollama uses, 11434,","startTime":76.2,"endTime":78.66666666666667,"audioSegment":0},{"text":"so tools that look for Ollama find Gezel too.","startTime":78.66666666666667,"endTime":81.13333333333333,"audioSegment":0},{"text":"It takes no key.","startTime":81.13333333333333,"endTime":83.6,"audioSegment":0},{"text":"While it is on, any program on this computer can use your models without asking,","startTime":83.6,"endTime":86.06666666666666,"audioSegment":0},{"text":"which is why it stays off until you turn it on.","startTime":86.06666666666666,"endTime":88.53333333333333,"audioSegment":0},{"text":"In the desktop app the same switch is Settings → Integrations → Ollama.","startTime":88.53333333333333,"endTime":91,"audioSegment":0},{"text":"Gezel leaves the port alone when Ollama itself is running. 3. Ask.","startTime":91,"endTime":93.46666666666667,"audioSegment":0},{"text":"curl http://127.0.0.1:11434/v1/chat/completions \\","startTime":93.46666666666667,"endTime":95.93333333333334,"audioSegment":0},{"text":"-H \"Content-Type: application/json\" \\ -d '{","startTime":95.93333333333334,"endTime":98.4,"audioSegment":0},{"text":"\"model\": \"gezel\",","startTime":98.4,"endTime":100.86666666666667,"audioSegment":0},{"text":"\"reasoning_effort\": \"none\",","startTime":100.86666666666667,"endTime":103.33333333333334,"audioSegment":0},{"text":"\"messages\": [{\"role\": \"user\", \"content\": \"Say hello in five words.\"}] }'","startTime":103.33333333333334,"endTime":105.80000000000001,"audioSegment":0},{"text":"The reply comes from your Meester,","startTime":105.80000000000001,"endTime":108.26666666666667,"audioSegment":0},{"text":"the crew member who runs your workshop, on the model your chats use.","startTime":108.26666666666667,"endTime":110.73333333333333,"audioSegment":0},{"text":"Gezel answers any model name it does not know that way,","startTime":110.73333333333333,"endTime":113.2,"audioSegment":0},{"text":"so code written for another OpenAI-style service runs without a change to its model name.","startTime":113.2,"endTime":115.66666666666667,"audioSegment":0},{"text":"\"reasoning_effort\": \"none\" skips the model's thinking step,","startTime":115.66666666666667,"endTime":118.13333333333334,"audioSegment":0},{"text":"which is what you want for a quick reply.","startTime":118.13333333333334,"endTime":120.60000000000001,"audioSegment":0},{"text":"In PowerShell, send the same request with Invoke-RestMethod:","startTime":120.60000000000001,"endTime":123.06666666666666,"audioSegment":0},{"text":"$body = '{\"model\":\"gezel\",\"reasoning_effort\":\"none\",\"messages\":[{\"role\":\"user\",\"content\":\"Say hello in five words.\"}]}'","startTime":123.06666666666666,"endTime":125.53333333333333,"audioSegment":0},{"text":"(Invoke-RestMethod http://127.0.0.1:11434/v1/chat/completions -Method Post -ContentType 'application/json' -Body $body).choices[0].message.content","startTime":125.53333333333333,"endTime":128,"audioSegment":0},{"text":"curl http://127.0.0.1:11434/v1/models","startTime":128,"endTime":130.5,"audioSegment":0},{"text":"The list holds your crew, as gezel:<role>-<name>,","startTime":130.5,"endTime":133,"audioSegment":0},{"text":"and the models in Gezel's catalog, as <engine>:<model>.","startTime":133,"endTime":135.5,"audioSegment":0},{"text":"A crew member answers in character on its own tuned model.","startTime":135.5,"endTime":138,"audioSegment":0},{"text":"A model answers plainly, and only one whose availability is available is downloaded and ready;","startTime":138,"endTime":140.5,"audioSegment":0},{"text":"the others need a download first.","startTime":140.5,"endTime":143,"audioSegment":0},{"text":"On an Apple-silicon Mac the engine is mlx,","startTime":143,"endTime":145.5,"audioSegment":0},{"text":"and elsewhere it is llama-cpp, for example llama-cpp:qwen3.5-9b-q4.","startTime":145.5,"endTime":148,"audioSegment":0},{"text":"Point the client at the same address.","startTime":148,"endTime":149.53333333333333,"audioSegment":0},{"text":"The port takes no key, but most clients insist on a value.","startTime":149.53333333333333,"endTime":151.06666666666666,"audioSegment":0},{"text":"from openai import OpenAI","startTime":151.06666666666666,"endTime":152.6,"audioSegment":0},{"text":"client = OpenAI(base_url=\"http://127.0.0.1:11434/v1\", api_key=\"not-needed\")","startTime":152.6,"endTime":154.13333333333333,"audioSegment":0},{"text":"reply = client.chat.completions.create( model=\"gezel\",","startTime":154.13333333333333,"endTime":155.66666666666666,"audioSegment":0},{"text":"reasoning_effort=\"none\",","startTime":155.66666666666666,"endTime":157.2,"audioSegment":0},{"text":"messages=[{\"role\": \"user\", \"content\": \"Say hello in five words.\"}], )","startTime":157.2,"endTime":158.73333333333335,"audioSegment":0},{"text":"print(reply.choices[0].message.content)","startTime":158.73333333333335,"endTime":160.26666666666668,"audioSegment":0},{"text":"import OpenAI from 'openai';","startTime":160.26666666666668,"endTime":161.8,"audioSegment":0},{"text":"const client = new OpenAI({ baseURL: 'http://127.0.0.1:11434/v1', apiKey: 'not-needed' });","startTime":161.8,"endTime":163.33333333333334,"audioSegment":0},{"text":"const reply = await client.chat.completions.create({","startTime":163.33333333333334,"endTime":164.86666666666667,"audioSegment":0},{"text":"model: 'gezel',","startTime":164.86666666666667,"endTime":166.4,"audioSegment":0},{"text":"reasoning_effort: 'none',","startTime":166.4,"endTime":167.93333333333334,"audioSegment":0},{"text":"messages: [{ role: 'user', content: 'Say hello in five words.' }], });","startTime":167.93333333333334,"endTime":169.46666666666667,"audioSegment":0},{"text":"console.log(reply.choices[0].message.content);","startTime":169.46666666666667,"endTime":171,"audioSegment":0},{"text":"The open port is for trying things out and for tools that only know Ollama.","startTime":171,"endTime":174.5,"audioSegment":0},{"text":"An app other people install should connect with a key of its own,","startTime":174.5,"endTime":178,"audioSegment":0},{"text":"so the person can see it in Settings → Integrations and revoke it:","startTime":178,"endTime":181.5,"audioSegment":0},{"text":"gezel integrations token create my-app makes a key and prints the address to use it with.","startTime":181.5,"endTime":185,"audioSegment":0},{"text":"gezel integrations address prints every address at any time.","startTime":185,"endTime":188.5,"audioSegment":0},{"text":"Outside a container that address is served with Gezel's own certificate,","startTime":188.5,"endTime":192,"audioSegment":0},{"text":"which a program has to trust or skip checking.","startTime":192,"endTime":195.5,"audioSegment":0},{"text":"The SDK below does that for you,","startTime":195.5,"endTime":199,"audioSegment":0},{"text":"along with asking the person for consent and keeping the key.","startTime":199,"endTime":202.5,"audioSegment":0},{"text":"A Gezel container answers keyed requests over plain HTTP at http://localhost:6230/v1.","startTime":202.5,"endTime":206,"audioSegment":0},{"text":"The Node entry requires Node.js 24 or newer:","startTime":206,"endTime":208.40540540540542,"audioSegment":0},{"text":"npm install @bendyline/gezel-app-sdk","startTime":208.40540540540542,"endTime":210.8108108108108,"audioSegment":0},{"text":"The normal third-party flow is: detect Gezel, request the narrowest scope, let the user approve in the desktop app,","startTime":210.8108108108108,"endTime":213.21621621621622,"audioSegment":0},{"text":"and store the resulting token in the operating system's credential store.","startTime":213.21621621621622,"endTime":215.6216216216216,"audioSegment":0},{"text":"import { connect, detectGezel } from '@bendyline/gezel-app-sdk';","startTime":215.6216216216216,"endTime":218.02702702702703,"audioSegment":0},{"text":"// Demo only: this lasts for one process.","startTime":218.02702702702703,"endTime":220.43243243243242,"audioSegment":0},{"text":"Replace it with Keychain,","startTime":220.43243243243242,"endTime":222.83783783783784,"audioSegment":0},{"text":"// Credential Manager, libsecret, or your existing secure credential vault.","startTime":222.83783783783784,"endTime":225.24324324324323,"audioSegment":0},{"text":"const demoTokens = new Map<string, string>();","startTime":225.24324324324323,"endTime":227.64864864864865,"audioSegment":0},{"text":"const tokenStorage = {","startTime":227.64864864864865,"endTime":230.05405405405406,"audioSegment":0},{"text":"load: (appId: string) => demoTokens.get(appId) ?? null,","startTime":230.05405405405406,"endTime":232.45945945945945,"audioSegment":0},{"text":"save: (appId: string, token: string) => demoTokens.set(appId, token),","startTime":232.45945945945945,"endTime":234.86486486486487,"audioSegment":0},{"text":"delete: (appId: string) => demoTokens.delete(appId), };","startTime":234.86486486486487,"endTime":237.27027027027026,"audioSegment":0},{"text":"const status = await detectGezel();","startTime":237.27027027027026,"endTime":239.67567567567568,"audioSegment":0},{"text":"if (!status.running) {","startTime":239.67567567567568,"endTime":242.0810810810811,"audioSegment":0},{"text":"throw new Error('Start Gezel, then connect this app again.'); }","startTime":242.0810810810811,"endTime":244.48648648648648,"audioSegment":0},{"text":"const app = await connect({","startTime":244.48648648648648,"endTime":246.89189189189187,"audioSegment":0},{"text":"appId: 'acme.notes',","startTime":246.89189189189187,"endTime":249.2972972972973,"audioSegment":0},{"text":"appName: 'Acme Notes',","startTime":249.2972972972973,"endTime":251.7027027027027,"audioSegment":0},{"text":"scopes: ['openai'], tokenStorage, });","startTime":251.7027027027027,"endTime":254.1081081081081,"audioSegment":0},{"text":"const available = await app.models();","startTime":254.1081081081081,"endTime":256.5135135135135,"audioSegment":0},{"text":"const model = available.data[0];","startTime":256.5135135135135,"endTime":258.9189189189189,"audioSegment":0},{"text":"if (!model) throw new Error('No Gezel models are available.');","startTime":258.9189189189189,"endTime":261.3243243243243,"audioSegment":0},{"text":"const stream = await app.chat({","startTime":261.3243243243243,"endTime":263.72972972972974,"audioSegment":0},{"text":"model: model.id,","startTime":263.72972972972974,"endTime":266.1351351351351,"audioSegment":0},{"text":"messages: [{ role: 'user', content: 'Give this note a short title.' }], stream: true, });","startTime":266.1351351351351,"endTime":268.5405405405405,"audioSegment":0},{"text":"for await (const chunk of stream) {","startTime":268.5405405405405,"endTime":270.94594594594594,"audioSegment":0},{"text":"process.stdout.write(chunk.choices[0]?.delta?.content ?? ''); }","startTime":270.94594594594594,"endTime":273.35135135135135,"audioSegment":0},{"text":"The in-memory map keeps the quickstart self-contained, but a real application must replace it with secure operating-system storage;","startTime":273.35135135135135,"endTime":275.7567567567568,"audioSegment":0},{"text":"do not save the token in source code, a project file, or plain-text preferences.","startTime":275.7567567567568,"endTime":278.1621621621622,"audioSegment":0},{"text":"connect() verifies a stored token still has the requested scopes.","startTime":278.1621621621622,"endTime":280.56756756756755,"audioSegment":0},{"text":"If it was revoked or is too narrow,","startTime":280.56756756756755,"endTime":282.97297297297297,"audioSegment":0},{"text":"the SDK discards it and starts a fresh visible consent flow.","startTime":282.97297297297297,"endTime":285.3783783783784,"audioSegment":0},{"text":"Call app.models() rather than hardcoding a model id.","startTime":285.3783783783784,"endTime":287.78378378378375,"audioSegment":0},{"text":"The response is the authoritative list available to this connection and can include both raw models and eligible crew members.","startTime":287.78378378378375,"endTime":290.18918918918916,"audioSegment":0},{"text":"Selecting a crew member gives the caller that crew member's character and tuned model,","startTime":290.18918918918916,"endTime":292.5945945945946,"audioSegment":0},{"text":"while your app keeps ownership of its interface and conversation loop.","startTime":292.5945945945946,"endTime":295,"audioSegment":0},{"text":"Every connection has a stable appId,","startTime":295,"endTime":298.0882352941176,"audioSegment":0},{"text":"a user-visible name, and one or more scopes.","startTime":298.0882352941176,"endTime":301.1764705882353,"audioSegment":0},{"text":"The user can review and revoke it under Settings → Integrations.","startTime":301.1764705882353,"endTime":304.2647058823529,"audioSegment":0},{"text":"Scope Use it for Approval","startTime":304.2647058823529,"endTime":307.3529411764706,"audioSegment":0},{"text":"openai Model listing, chat, embeddings,","startTime":307.3529411764706,"endTime":310.44117647058823,"audioSegment":0},{"text":"and ensuring a local model is present Click approval by default","startTime":310.44117647058823,"endTime":313.52941176470586,"audioSegment":0},{"text":"product The ordinary Gezel product API through @bendyline/gezel-client Approval plus a requester-visible verification code","startTime":313.52941176470586,"endTime":316.61764705882354,"audioSegment":0},{"text":"remote-inference Gezel's paired-device inference surface Click approval by default","startTime":316.61764705882354,"endTime":319.70588235294116,"audioSegment":0},{"text":"knowledge Searching the knowledge catalogs installed in Gezel Approval plus a requester-visible verification code","startTime":319.70588235294116,"endTime":322.79411764705884,"audioSegment":0},{"text":"images Generating images on this computer and downloading image models (app.images) Approval plus a requester-visible verification code","startTime":322.79411764705884,"endTime":325.88235294117646,"audioSegment":0},{"text":"An app that is already connected adds a scope without disconnecting: app.requestScopes({ appId, appName, scopes: [...held, 'images'],","startTime":325.88235294117646,"endTime":328.97058823529414,"audioSegment":0},{"text":"onVerificationCode }) asks for the wider grant while the current token keeps working, then switches the client to the new token.","startTime":328.97058823529414,"endTime":332.05882352941177,"audioSegment":0},{"text":"Ask for images only from an explicit action, such as an \"Allow image generation\" button,","startTime":332.05882352941177,"endTime":335.1470588235294,"audioSegment":0},{"text":"and only when app.images.support() reports that this Gezel serves it; an older Gezel answers images_unsupported before anything changes.","startTime":335.1470588235294,"endTime":338.2352941176471,"audioSegment":0},{"text":"Third-party applications should not request the first-party cli scope or call authorizeLocalOwner().","startTime":338.2352941176471,"endTime":341.3235294117647,"audioSegment":0},{"text":"Those surfaces are reserved for Gezel's own command line and same-user clients.","startTime":341.3235294117647,"endTime":344.4117647058824,"audioSegment":0},{"text":"Ask for product only when the application truly needs projects, tasks, crew,","startTime":344.4117647058824,"endTime":347.5,"audioSegment":0},{"text":"or other product state; add openai only if that same application also performs inference.","startTime":347.5,"endTime":350.5882352941177,"audioSegment":0},{"text":"Stateful scopes require onVerificationCode.","startTime":350.5882352941177,"endTime":353.6764705882353,"audioSegment":0},{"text":"Show the code in the requesting application so the user can type it into Gezel's approval dialog:","startTime":353.6764705882353,"endTime":356.7647058823529,"audioSegment":0},{"text":"import { authorizeLocal } from '@bendyline/gezel-app-sdk';","startTime":356.7647058823529,"endTime":359.8529411764706,"audioSegment":0},{"text":"const authorized = await authorizeLocal({","startTime":359.8529411764706,"endTime":362.94117647058823,"audioSegment":0},{"text":"appId: 'acme.editor',","startTime":362.94117647058823,"endTime":366.02941176470586,"audioSegment":0},{"text":"appName: 'Acme Editor',","startTime":366.02941176470586,"endTime":369.11764705882354,"audioSegment":0},{"text":"scopes: ['product'], tokenStorage,","startTime":369.11764705882354,"endTime":372.20588235294116,"audioSegment":0},{"text":"onVerificationCode(code) {","startTime":372.20588235294116,"endTime":375.29411764705884,"audioSegment":0},{"text":"showConnectionCode(code); }, });","startTime":375.29411764705884,"endTime":378.38235294117646,"audioSegment":0},{"text":"The daemon generates the code and never sends it to the Gezel desktop approval surface.","startTime":378.38235294117646,"endTime":381.47058823529414,"audioSegment":0},{"text":"This proves that the person approving the grant can also see the application that requested it.","startTime":381.47058823529414,"endTime":384.55882352941177,"audioSegment":0},{"text":"On a server, or anywhere Gezel runs without its window,","startTime":384.55882352941177,"endTime":387.6470588235294,"audioSegment":0},{"text":"the person answers from a terminal.","startTime":387.6470588235294,"endTime":390.7352941176471,"audioSegment":0},{"text":"gezel integrations list shows the apps waiting, gezel integrations approve <appId> lets one in (add --code <code> for a scope that shows a code),","startTime":390.7352941176471,"endTime":393.8235294117647,"audioSegment":0},{"text":"and gezel integrations deny <appId> turns it down.","startTime":393.8235294117647,"endTime":396.9117647058824,"audioSegment":0},{"text":"A request waits ten minutes.","startTime":396.9117647058824,"endTime":400,"audioSegment":0},{"text":"The app SDK's GezelApp class deliberately stays focused on the OpenAI-compatible surface.","startTime":400,"endTime":402.3333333333333,"audioSegment":0},{"text":"When a connected app also needs projects, tasks, chats, scripts, or other Gezel state,","startTime":402.3333333333333,"endTime":404.6666666666667,"audioSegment":0},{"text":"use authorizeLocal() to obtain the approved transport and pass it to the typed client:","startTime":404.6666666666667,"endTime":407,"audioSegment":0},{"text":"import { authorizeLocal } from '@bendyline/gezel-app-sdk';","startTime":407,"endTime":409.3333333333333,"audioSegment":0},{"text":"import { GezelClient } from '@bendyline/gezel-client/node';","startTime":409.3333333333333,"endTime":411.6666666666667,"audioSegment":0},{"text":"const authorized = await authorizeLocal({","startTime":411.6666666666667,"endTime":414,"audioSegment":0},{"text":"appId: 'acme.editor',","startTime":414,"endTime":416.3333333333333,"audioSegment":0},{"text":"appName: 'Acme Editor',","startTime":416.3333333333333,"endTime":418.6666666666667,"audioSegment":0},{"text":"scopes: ['product'], tokenStorage,","startTime":418.6666666666667,"endTime":421,"audioSegment":0},{"text":"onVerificationCode: showConnectionCode, });","startTime":421,"endTime":423.3333333333333,"audioSegment":0},{"text":"const client = new GezelClient(authorized);","startTime":423.3333333333333,"endTime":425.6666666666667,"audioSegment":0},{"text":"const projects = await client.listProjects();","startTime":425.6666666666667,"endTime":428,"audioSegment":0},{"text":"This pairing is the supported route for a rich integration: the app SDK owns discovery,","startTime":428,"endTime":430.3333333333333,"audioSegment":0},{"text":"pinned TLS, consent, and scoped credentials; @bendyline/gezel-client owns the typed product API.","startTime":430.3333333333333,"endTime":432.6666666666667,"audioSegment":0},{"text":"Avoid hand-written /api requests when the client already covers the endpoint.","startTime":432.6666666666667,"endTime":435,"audioSegment":0},{"text":"Method Purpose","startTime":435,"endTime":438.2105263157895,"audioSegment":0},{"text":"app.models() List the models and crew members exposed to this app","startTime":438.2105263157895,"endTime":441.42105263157896,"audioSegment":0},{"text":"app.chat() OpenAI-compatible chat completion, streaming or complete","startTime":441.42105263157896,"endTime":444.63157894736844,"audioSegment":0},{"text":"app.embeddings() OpenAI-compatible embeddings when the selected provider supports them","startTime":444.63157894736844,"endTime":447.8421052631579,"audioSegment":0},{"text":"app.ensureModel() Make sure a catalog model is installed and warm","startTime":447.8421052631579,"endTime":451.0526315789474,"audioSegment":0},{"text":"app.streamEnsureEvents() Follow model download progress and completion over SSE","startTime":451.0526315789474,"endTime":454.2631578947368,"audioSegment":0},{"text":"app.revokeMyToken() Let the app revoke its own connection","startTime":454.2631578947368,"endTime":457.4736842105263,"audioSegment":0},{"text":"Many local models think before they answer,","startTime":457.4736842105263,"endTime":460.6842105263158,"audioSegment":0},{"text":"and that thinking is not part of the reply.","startTime":460.6842105263158,"endTime":463.89473684210526,"audioSegment":0},{"text":"A short answer can take several seconds and use a few hundred tokens you never see.","startTime":463.89473684210526,"endTime":467.10526315789474,"audioSegment":0},{"text":"For quick replies such as a title, a label, or a yes or no,","startTime":467.10526315789474,"endTime":470.3157894736842,"audioSegment":0},{"text":"send reasoning_effort: 'none' (or 'minimal') with the chat request and the model answers straight away.","startTime":470.3157894736842,"endTime":473.5263157894737,"audioSegment":0},{"text":"On the Ollama-style endpoints the same switch is think: false.","startTime":473.5263157894737,"endTime":476.7368421052632,"audioSegment":0},{"text":"Neither turns thinking on for a model that runs without it.","startTime":476.7368421052632,"endTime":479.94736842105266,"audioSegment":0},{"text":"detectGezel() is a useful preflight, but it does not authorize anything.","startTime":479.94736842105266,"endTime":483.1578947368421,"audioSegment":0},{"text":"connect() returns a ready GezelApp; authorize() returns the generic base URL, token, and trusted fetch;","startTime":483.1578947368421,"endTime":486.36842105263156,"audioSegment":0},{"text":"connectLocal() combines the full Node-native local flow with non-sensitive daemon diagnostics.","startTime":486.36842105263156,"endTime":489.57894736842104,"audioSegment":0},{"text":"Ordinary third-party apps should ask the user to start Gezel when discovery reports daemon_not_running.","startTime":489.57894736842104,"endTime":492.7894736842105,"audioSegment":0},{"text":"The optional start-if-missing path is only for native integrations that deliberately bundle the matching gezeld package.","startTime":492.7894736842105,"endTime":496,"audioSegment":0},{"text":"The flow above needs a Gezel the person already runs.","startTime":496,"endTime":499.34375,"audioSegment":0},{"text":"An application that must work either way can host one itself: @bendyline/gezel-app-sdk/host connects to their Gezel when it is running,","startTime":499.34375,"endTime":502.6875,"audioSegment":0},{"text":"and otherwise starts a daemon inside your own process.","startTime":502.6875,"endTime":506.03125,"audioSegment":0},{"text":"Application code is the same afterwards.","startTime":506.03125,"endTime":509.375,"audioSegment":0},{"text":"import { connectOrHost } from '@bendyline/gezel-app-sdk/host';","startTime":509.375,"endTime":512.71875,"audioSegment":0},{"text":"const gezel = await connectOrHost({","startTime":512.71875,"endTime":516.0625,"audioSegment":0},{"text":"appId: 'acme.travel',","startTime":516.0625,"endTime":519.40625,"audioSegment":0},{"text":"appName: 'Acme Travel',","startTime":519.40625,"endTime":522.75,"audioSegment":0},{"text":"host: { nodePath: bundledNodePath }, });","startTime":522.75,"endTime":526.09375,"audioSegment":0},{"text":"await gezel.ensureModel({ model: 'gemma4-e2b-q4' });","startTime":526.09375,"endTime":529.4375,"audioSegment":0},{"text":"const project = await gezel.ensureProject({ package: shippedGezapp, folder: travelFolder });","startTime":529.4375,"endTime":532.78125,"audioSegment":0},{"text":"const chat = await project.openChat({ role: 'travel-guide' });","startTime":532.78125,"endTime":536.125,"audioSegment":0},{"text":"Gezel is the central object — the connection, the models, the projects.","startTime":536.125,"endTime":539.46875,"audioSegment":0},{"text":"Most work happens in the GezelProject it hands back, because chats and tools are both project-scoped,","startTime":539.46875,"endTime":542.8125,"audioSegment":0},{"text":"and an application that has the project never has to pass its id back in.","startTime":542.8125,"endTime":546.15625,"audioSegment":0},{"text":"gezel.openProject(id) reaches a project that already exists.","startTime":546.15625,"endTime":549.5,"audioSegment":0},{"text":"A hosted daemon keeps its state under ~/.gezel/apps/<appId>/, so the projects and crew members an application creates for itself never appear in the person's own workshop,","startTime":549.5,"endTime":552.84375,"audioSegment":0},{"text":"and the two daemons never contend for one runtime directory.","startTime":552.84375,"endTime":556.1875,"audioSegment":0},{"text":"Models the person already installed are read from their home rather than downloaded again.","startTime":556.1875,"endTime":559.53125,"audioSegment":0},{"text":"Both ensureModel and ensureProject are idempotent and meant to run on every launch.","startTime":559.53125,"endTime":562.875,"audioSegment":0},{"text":"ensureModel uses an installed model first, then a .gezmodel bundle the application ships,","startTime":562.875,"endTime":566.21875,"audioSegment":0},{"text":"and only then the network — so a first run can work offline.","startTime":566.21875,"endTime":569.5625,"audioSegment":0},{"text":"ensureProject keeps the person's edits to seeded files and reuses the crew already on the roster.","startTime":569.5625,"endTime":572.90625,"audioSegment":0},{"text":"Hosting requires @bendyline/gezel-service beside the SDK;","startTime":572.90625,"endTime":576.25,"audioSegment":0},{"text":"it is an optional peer dependency, so applications that only connect never download it.","startTime":576.25,"endTime":579.59375,"audioSegment":0},{"text":"Under Electron, pass a real Node binary as host.nodePath: Gezel runs its tool server as a child process,","startTime":579.59375,"endTime":582.9375,"audioSegment":0},{"text":"and an Electron binary cannot stand in for Node.","startTime":582.9375,"endTime":586.28125,"audioSegment":0},{"text":"Without one, the SDK uses the Node that a Gezel install keeps in its home,","startTime":586.28125,"endTime":589.625,"audioSegment":0},{"text":"when there is one.","startTime":589.625,"endTime":592.96875,"audioSegment":0},{"text":"By default the application hosts only when no Gezel is running;","startTime":592.96875,"endTime":596.3125,"audioSegment":0},{"text":"a person who declines the connection in Gezel is not overridden.","startTime":596.3125,"endTime":599.65625,"audioSegment":0},{"text":"An application whose AI is optional and switched on by the person inside it may pass hostWhenRefused: true to host after a refusal too.","startTime":599.65625,"endTime":603,"audioSegment":0},{"text":"An application can offer its own tools to the crew in its project.","startTime":603,"endTime":606.2941176470588,"audioSegment":0},{"text":"The model sees them beside Gezel's built-in tools; when one is called,","startTime":606.2941176470588,"endTime":609.5882352941177,"audioSegment":0},{"text":"the handler runs in the application's process and what it returns becomes the tool's output.","startTime":609.5882352941177,"endTime":612.8823529411765,"audioSegment":0},{"text":"await project.registerTools({ tools: [ {","startTime":612.8823529411765,"endTime":616.1764705882352,"audioSegment":0},{"text":"name: 'add_travel_points',","startTime":616.1764705882352,"endTime":619.4705882352941,"audioSegment":0},{"text":"description: 'Award travel points to the traveler.', inputSchema: {","startTime":619.4705882352941,"endTime":622.7647058823529,"audioSegment":0},{"text":"type: 'object',","startTime":622.7647058823529,"endTime":626.0588235294117,"audioSegment":0},{"text":"properties: { points: { type: 'number' } },","startTime":626.0588235294117,"endTime":629.3529411764706,"audioSegment":0},{"text":"required: ['points'], },","startTime":629.3529411764706,"endTime":632.6470588235294,"audioSegment":0},{"text":"handler: async ({ points }) => awardPoints(Number(points)), }, ], });","startTime":632.6470588235294,"endTime":635.9411764705883,"audioSegment":0},{"text":"The registration lives as long as the connection that made it.","startTime":635.9411764705883,"endTime":639.2352941176471,"audioSegment":0},{"text":"A brief disconnection is held open for a grace window and reconnects on its own;","startTime":639.2352941176471,"endTime":642.5294117647059,"audioSegment":0},{"text":"a closed application's tools are withdrawn, because a tool whose handler is gone would accept a call and never answer it.","startTime":642.5294117647059,"endTime":645.8235294117648,"audioSegment":0},{"text":"Arguments are checked against the declared schema before they leave the daemon,","startTime":645.8235294117648,"endTime":649.1176470588235,"audioSegment":0},{"text":"a handler that throws is reported to the model as an ordinary tool failure, and each call has a timeout the application sets.","startTime":649.1176470588235,"endTime":652.4117647058823,"audioSegment":0},{"text":"Tool calls appear in the transcript and the history log like any other tool.","startTime":652.4117647058823,"endTime":655.7058823529412,"audioSegment":0},{"text":"This needs the product scope, or a daemon the application hosts.","startTime":655.7058823529412,"endTime":659,"audioSegment":0},{"text":"The local daemon uses a per-launch self-signed certificate.","startTime":659,"endTime":662.3913043478261,"audioSegment":0},{"text":"The Node SDK reads the public certificate from Gezel's runtime directory and constructs a pinned fetch,","startTime":662.3913043478261,"endTime":665.7826086956521,"audioSegment":0},{"text":"so you should not disable TLS verification globally or replace the transport with an unpinned client.","startTime":665.7826086956521,"endTime":669.1739130434783,"audioSegment":0},{"text":"A browser cannot read ~/.gezel/runtime/ and cannot perform this local trust setup itself.","startTime":669.1739130434783,"endTime":672.5652173913044,"audioSegment":0},{"text":"Use a desktop helper to complete discovery and consent,","startTime":672.5652173913044,"endTime":675.9565217391304,"audioSegment":0},{"text":"then pass the resolved address and scoped token to a renderer that imports GezelApp from @bendyline/gezel-app-sdk/browser.","startTime":675.9565217391304,"endTime":679.3478260869565,"audioSegment":0},{"text":"Pure websites should not attempt to bypass the browser's loopback TLS protections.","startTime":679.3478260869565,"endTime":682.7391304347826,"audioSegment":0},{"text":"registerAppTools is exported from ./browser too: it needs only fetch and streams,","startTime":682.7391304347826,"endTime":686.1304347826087,"audioSegment":0},{"text":"so a renderer that already holds a product token can offer tools of its own.","startTime":686.1304347826087,"endTime":689.5217391304348,"audioSegment":0},{"text":"Gezel's Office task pane is the worked example.","startTime":689.5217391304348,"endTime":692.9130434782609,"audioSegment":0},{"text":"The daemon serves that pane itself, on a stable HTTPS origin with a certificate the user trusts once,","startTime":692.9130434782609,"endTime":696.304347826087,"audioSegment":0},{"text":"which is the one browser origin allowed to request a grant directly.","startTime":696.304347826087,"endTime":699.695652173913,"audioSegment":0},{"text":"It registers doc_*, sheet_*, and slide_* tools that run Office.js,","startTime":699.695652173913,"endTime":703.0869565217391,"audioSegment":0},{"text":"and withdraws the write tools when the user turns edits off.","startTime":703.0869565217391,"endTime":706.4782608695652,"audioSegment":0},{"text":"The LibreOffice extension does the same from native Python,","startTime":706.4782608695652,"endTime":709.8695652173913,"audioSegment":0},{"text":"and the source of both lives in the Gezel repository (packages/ui/src/office/, packages/libreoffice-extension/).","startTime":709.8695652173913,"endTime":713.2608695652174,"audioSegment":0},{"text":"Catch GezelSdkError and branch on its code.","startTime":713.2608695652174,"endTime":716.6521739130435,"audioSegment":0},{"text":"Common cases include daemon_not_running, user_denied, approval_timeout, verification_code_handler_required, model_not_found, embeddings_not_supported, missing_scope:<scope>, and provider_error.","startTime":716.6521739130435,"endTime":720.0434782608695,"audioSegment":0},{"text":"Treat denial as a normal user choice,","startTime":720.0434782608695,"endTime":723.4347826086956,"audioSegment":0},{"text":"and give timeouts and missing-daemon errors an obvious retry path.","startTime":723.4347826086956,"endTime":726.8260869565217,"audioSegment":0},{"text":"The daemon publishes the current public OpenAPI document at unauthenticated GET /v1/openapi.json.","startTime":726.8260869565217,"endTime":730.2173913043479,"audioSegment":0},{"text":"Use it for route inspection or code generation;","startTime":730.2173913043479,"endTime":733.6086956521739,"audioSegment":0},{"text":"use the SDK types for ordinary application code.","startTime":733.6086956521739,"endTime":737,"audioSegment":0}],"version":1},"startBlock":{"title":"Building connected apps with gezel-app-sdk","subtitle":"@bendyline/gezel-app-sdk is for software that runs beside Gezel. It lets a desktop or Node application discover the logged-in user's daemon, trust its loopback TLS certificate, ask the user for a scoped connection, remember the issued token securely, and use OpenAI-shaped model APIs.","ambientMotion":"zoomIn"}}</script>
