audioSegment":0},{"text":"The tab is named after the view you last chose (\"Gallery view\").","startTime":5.333333333333333,"endTime":8,"audioSegment":0},{"text":"Click it again to pick another.","startTime":8,"endTime":10.666666666666666,"audioSegment":0},{"text":"Every view comes from gezel's index of the folder,","startTime":10.666666666666666,"endTime":13.333333333333332,"audioSegment":0},{"text":"so nothing is opened or changed to draw it.","startTime":13.333333333333332,"endTime":16,"audioSegment":0},{"text":"Village shows a codebase as a small town you come to know: each file is a building,","startTime":16,"endTime":19.16,"audioSegment":0},{"text":"and the streets are the files that use each other.","startTime":19.16,"endTime":22.32,"audioSegment":0},{"text":"Guide says what each folder is for and which files the rest of the project leans on.","startTime":22.32,"endTime":25.48,"audioSegment":0},{"text":"Diagram draws files as boxes and arrows,","startTime":25.48,"endTime":28.64,"audioSegment":0},{"text":"from each file to the ones it uses.","startTime":28.64,"endTime":31.8,"audioSegment":0},{"text":"Folders open and close,","startTime":31.8,"endTime":34.96,"audioSegment":0},{"text":"and double-clicking a file shows just that file and its neighbors.","startTime":34.96,"endTime":38.120000000000005,"audioSegment":0},{"text":"Reports lists everything gezel has written about the project, such as the overnight reports,","startTime":38.120000000000005,"endTime":41.28,"audioSegment":0},{"text":"the codebase map and code reviews, and lets you read them in place.","startTime":41.28,"endTime":44.44,"audioSegment":0},{"text":"Write … now writes one straight away,","startTime":44.44,"endTime":47.6,"audioSegment":0},{"text":"so you don't have to wait for the night.","startTime":47.6,"endTime":50.760000000000005,"audioSegment":0},{"text":"Gallery puts the files on shelves: by type (photos, slides,","startTime":50.760000000000005,"endTime":53.92,"audioSegment":0},{"text":"spreadsheets, notes), by folder, or, for a photo folder, by outing.","startTime":53.92,"endTime":57.08,"audioSegment":0},{"text":"A photo folder starts with its Exact copies and Look-alikes.","startTime":57.08,"endTime":60.24,"audioSegment":0},{"text":"You can narrow it to photos, documents, data, media or code,","startTime":60.24,"endTime":63.400000000000006,"audioSegment":0},{"text":"or type a word to find files that mention it.","startTime":63.400000000000006,"endTime":66.56,"audioSegment":0},{"text":"Timeline shows what changed when, as bars by week, month or year.","startTime":66.56,"endTime":69.72,"audioSegment":0},{"text":"For a codebase, the bars count its commits,","startTime":69.72,"endTime":72.88,"audioSegment":0},{"text":"colored by part of the project.","startTime":72.88,"endTime":76.04,"audioSegment":0},{"text":"For any other folder, each file sits at its own date,","startTime":76.04,"endTime":79.2,"audioSegment":0},{"text":"and a photo at the time it was taken.","startTime":79.2,"endTime":82.36,"audioSegment":0},{"text":"Choose a bar to see what happened in that stretch.","startTime":82.36,"endTime":85.52000000000001,"audioSegment":0},{"text":"Not every view suits every folder: a Pictures folder has no Guide or Diagram, for instance.","startTime":85.52000000000001,"endTime":88.68,"audioSegment":0},{"text":"A new project opens on the view that suits it: the Village for code,","startTime":88.68,"endTime":91.84,"audioSegment":0},{"text":"and the Gallery for pictures and documents.","startTime":91.84,"endTime":95,"audioSegment":0},{"text":"Choosing a file in any view opens it in the panel on the right.","startTime":95,"endTime":98.625,"audioSegment":0},{"text":"The panel says what the file is and what gezel's summary says about it.","startTime":98.625,"endTime":102.25,"audioSegment":0},{"text":"It also shows what the file uses and what uses it,","startTime":102.25,"endTime":105.875,"audioSegment":0},{"text":"any problems the Librarian found, and a preview.","startTime":105.875,"endTime":109.5,"audioSegment":0},{"text":"The file stays chosen when you switch views, so you can find it in the Diagram,","startTime":109.5,"endTime":113.125,"audioSegment":0},{"text":"then see when it last changed on the Timeline.","startTime":113.125,"endTime":116.75,"audioSegment":0},{"text":"The views are drawn from the same index the Night Shift keeps up to date,","startTime":116.75,"endTime":120.375,"audioSegment":0},{"text":"so a folder you added yesterday fills in by morning.","startTime":120.375,"endTime":124,"audioSegment":0}],"version":1},"startBlock":{"title":"Views: see what's in a folder","subtitle":"Once gezel has read a folder you added, the project's Views tab shows what it found. The tab is named after the view you last chose (\"Gallery view\"). Click it again to pick another. Every view comes from gezel's index of the folder, so nothing is opened or changed to draw it.","ambientMotion":"zoomIn"}}</script>
