 it sets up.","position":{"start":{"line":18,"column":5,"offset":1432},"end":{"line":18,"column":22,"offset":1449}}}],"position":{"start":{"line":18,"column":3,"offset":1430},"end":{"line":18,"column":24,"offset":1451}}},{"type":"text","value":" On first start gezel installs its browser-automation tools, fetching Playwright from npm and a Chromium browser through Playwright's own installer. Other tools you or a gezel install also come from npm.","position":{"start":{"line":18,"column":24,"offset":1451},"end":{"line":18,"column":227,"offset":1654}}}],"position":{"start":{"line":18,"column":3,"offset":1430},"end":{"line":18,"column":227,"offset":1654}}}],"position":{"start":{"line":18,"column":1,"offset":1428},"end":{"line":18,"column":227,"offset":1654}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Updates.","position":{"start":{"line":19,"column":5,"offset":1659},"end":{"line":19,"column":13,"offset":1667}}}],"position":{"start":{"line":19,"column":3,"offset":1657},"end":{"line":19,"column":15,"offset":1669}}},{"type":"text","value":" The desktop app checks gezel's GitHub releases for new versions; you can turn automatic checks off. Live catalog updates, if you switch them on, check npm about once a day.","position":{"start":{"line":19,"column":15,"offset":1669},"end":{"line":19,"column":188,"offset":1842}}}],"position":{"start":{"line":19,"column":3,"offset":1657},"end":{"line":19,"column":188,"offset":1842}}}],"position":{"start":{"line":19,"column":1,"offset":1655},"end":{"line":19,"column":188,"offset":1842}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Web search, when you allow it.","position":{"start":{"line":20,"column":5,"offset":1847},"end":{"line":20,"column":35,"offset":1877}}}],"position":{"start":{"line":20,"column":3,"offset":1845},"end":{"line":20,"column":37,"offset":1879}}},{"type":"text","value":" Gezels can search and fetch web pages only once outside services are turned on in ","position":{"start":{"line":20,"column":37,"offset":1879},"end":{"line":20,"column":120,"offset":1962}}},{"type":"strong","children":[{"type":"text","value":"Settings → Security","position":{"start":{"line":20,"column":122,"offset":1964},"end":{"line":20,"column":141,"offset":1983}}}],"position":{"start":{"line":20,"column":120,"offset":1962},"end":{"line":20,"column":143,"offset":1985}}},{"type":"text","value":". What a gezel searches for then goes to that search service: Wikipedia by default, or Brave if you add a Brave Search key.","position":{"start":{"line":20,"column":143,"offset":1985},"end":{"line":20,"column":266,"offset":2108}}}],"position":{"start":{"line":20,"column":3,"offset":1845},"end":{"line":20,"column":266,"offset":2108}}}],"position":{"start":{"line":20,"column":1,"offset":1843},"end":{"line":20,"column":266,"offset":2108}}}],"position":{"start":{"line":17,"column":1,"offset":1199},"end":{"line":20,"column":266,"offset":2108}}},{"type":"paragraph","children":[{"type":"text","value":"Apart from web searches, none of these carry your conversations or files. The strictest level in ","position":{"start":{"line":22,"column":1,"offset":2110},"end":{"line":22,"column":98,"offset":2207}}},{"type":"strong","children":[{"type":"text","value":"Settings → Security","position":{"start":{"line":22,"column":100,"offset":2209},"end":{"line":22,"column":119,"offset":2228}}}],"position":{"start":{"line":22,"column":98,"offset":2207},"end":{"line":22,"column":121,"offset":2230}}},{"type":"text","value":" also turns off update checks.","position":{"start":{"line":22,"column":121,"offset":2230},"end":{"line":22,"column":151,"offset":2260}}}],"position":{"start":{"line":22,"column":1,"offset":2110},"end":{"line":22,"column":151,"offset":2260}}}]},{"id":"credentials","startTime":108,"duration":46,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Credentials","position":{"start":{"line":24,"column":4,"offset":2265},"end":{"line":24,"column":15,"offset":2276}}}],"position":{"start":{"line":24,"column":1,"offset":2262},"end":{"line":24,"column":15,"offset":2276}}},"title":"Credentials","contents":[{"type":"paragraph","children":[{"type":"text","value":"Keys you give gezel for a provider are kept in your operating system's keychain — Keychain on macOS, Credential Manager on Windows, the Secret Service on Linux — and sent only to that provider. Where no keychain is available, such as on a headless server, gezel keeps them in an encrypted file inside its own folder, protected by your account's file permissions; in that case, keep the folder out of cloud sync. The background service on your machine answers only on this computer and asks for a pass that changes every time it starts, so other devices on your network can't reach your crew. That pass can't keep out programs already running under your account on this computer, or anyone with administrator rights: like you, they can open the files where it's kept. So be as careful about what you install as you would be anyway. ","position":{"start":{"line":26,"column":1,"offset":2278},"end":{"line":26,"column":832,"offset":3109}}},{"type":"link","url":"../security-model/","children":[{"type":"text","value":"The security model","position":{"start":{"line":26,"column":833,"offset":3110},"end":{"line":26,"column":851,"offset":3128}}}],"position":{"start":{"line":26,"column":832,"offset":3109},"end":{"line":26,"column":872,"offset":3149}}},{"type":"text","value":" has the details.","position":{"start":{"line":26,"column":872,"offset":3149},"end":{"line":26,"column":889,"offset":3166}}}],"position":{"start":{"line":26,"column":1,"offset":2278},"end":{"line":26,"column":889,"offset":3166}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel is built on one stubborn idea: your work belongs to you,","startTime":0,"endTime":3,"audioSegment":0},{"text":"on your machine, in files you can read.","startTime":3,"endTime":6,"audioSegment":0},{"text":"No gezel account.","startTime":6,"endTime":8.285714285714285,"audioSegment":0},{"text":"There is no sign-up and no gezel server holding your chats,","startTime":8.285714285714285,"endTime":10.571428571428571,"audioSegment":0},{"text":"and your conversations and files are never sent to us.","startTime":10.571428571428571,"endTime":12.857142857142858,"audioSegment":0},{"text":"When you use a cloud AI provider,","startTime":12.857142857142858,"endTime":15.142857142857142,"audioSegment":0},{"text":"the app talks directly from your computer to that provider.","startTime":15.142857142857142,"endTime":17.428571428571427,"audioSegment":0},{"text":"Files all the way down.","startTime":17.428571428571427,"endTime":19.714285714285715,"audioSegment":0},{"text":"Gezels, their characters, their memories, your projects,","startTime":19.714285714285715,"endTime":22,"audioSegment":0},{"text":"your chat history — all ordinary files in one folder.","startTime":22,"endTime":24.285714285714285,"audioSegment":0},{"text":"Back it up, sync it,","startTime":24.285714285714285,"endTime":26.57142857142857,"audioSegment":0},{"text":"move it to a new machine, grep it.","startTime":26.57142857142857,"endTime":28.857142857142854,"audioSegment":0},{"text":"The Where files live article gives the map.","startTime":28.857142857142854,"endTime":31.142857142857142,"audioSegment":0},{"text":"Local models keep your words local.","startTime":31.142857142857142,"endTime":33.42857142857143,"audioSegment":0},{"text":"Run a model on your own hardware and your prompts,","startTime":33.42857142857143,"endTime":35.71428571428571,"audioSegment":0},{"text":"and its answers, never leave the machine.","startTime":35.71428571428571,"endTime":38,"audioSegment":0},{"text":"When you use a cloud provider, the text of your conversation (and any files a gezel reads for you in that conversation) goes to that provider to generate the response —","startTime":38,"endTime":41.333333333333336,"audioSegment":0},{"text":"the same as using their product directly, under their terms.","startTime":41.333333333333336,"endTime":44.666666666666664,"audioSegment":0},{"text":"You choose the provider; gezel adds no middleman of its own.","startTime":44.666666666666664,"endTime":48,"audioSegment":0},{"text":"Gezel also uses the internet for a few ordinary jobs:","startTime":48,"endTime":51.333333333333336,"audioSegment":0},{"text":"Downloads you start.","startTime":51.333333333333336,"endTime":54.66666666666667,"audioSegment":0},{"text":"Models you choose to install (usually from Hugging Face), the on-device engines that run them (from gezel's own releases on GitHub,","startTime":54.66666666666667,"endTime":58,"audioSegment":0},{"text":"checked against pinned fingerprints), and knowledge catalogs you add.","startTime":58,"endTime":61.333333333333336,"audioSegment":0},{"text":"Tools it sets up.","startTime":61.333333333333336,"endTime":64.66666666666667,"audioSegment":0},{"text":"On first start gezel installs its browser-automation tools,","startTime":64.66666666666667,"endTime":68,"audioSegment":0},{"text":"fetching Playwright from npm and a Chromium browser through Playwright's own installer.","startTime":68,"endTime":71.33333333333334,"audioSegment":0},{"text":"Other tools you or a gezel install also come from npm. Updates.","startTime":71.33333333333334,"endTime":74.66666666666667,"audioSegment":0},{"text":"The desktop app checks gezel's GitHub releases for new versions;","startTime":74.66666666666667,"endTime":78,"audioSegment":0},{"text":"you can turn automatic checks off.","startTime":78,"endTime":81.33333333333334,"audioSegment":0},{"text":"Live catalog updates, if you switch them on,","startTime":81.33333333333334,"endTime":84.66666666666667,"audioSegment":0},{"text":"check npm about once a day.","startTime":84.66666666666667,"endTime":88,"audioSegment":0},{"text":"Web search, when you allow it.","startTime":88,"endTime":91.33333333333334,"audioSegment":0},{"text":"Gezels can search and fetch web pages only once outside services are turned on in Settings → Security.","startTime":91.33333333333334,"endTime":94.66666666666667,"audioSegment":0},{"text":"What a gezel searches for then goes to that search service: Wikipedia by default,","startTime":94.66666666666667,"endTime":98,"audioSegment":0},{"text":"or Brave if you add a Brave Search key.","startTime":98,"endTime":101.33333333333334,"audioSegment":0},{"text":"Apart from web searches, none of these carry your conversations or files.","startTime":101.33333333333334,"endTime":104.66666666666667,"audioSegment":0},{"text":"The strictest level in Settings → Security also turns off update checks.","startTime":104.66666666666667,"endTime":108,"audioSegment":0},{"text":"Keys you give gezel for a provider are kept in your operating system's keychain — Keychain on macOS,","startTime":108,"endTime":112.6,"audioSegment":0},{"text":"Credential Manager on Windows, the Secret Service on Linux — and sent only to that provider.","startTime":112.6,"endTime":117.2,"audioSegment":0},{"text":"Where no keychain is available, such as on a headless server, gezel keeps them in an encrypted file inside its own folder,","startTime":117.2,"endTime":121.8,"audioSegment":0},{"text":"protected by your account's file permissions; in that case, keep the folder out of cloud sync.","startTime":121.8,"endTime":126.4,"audioSegment":0},{"text":"The background service on your machine answers only on this computer and asks for a pass that changes every time it starts,","startTime":126.4,"endTime":131,"audioSegment":0},{"text":"so other devices on your network can't reach your crew.","startTime":131,"endTime":135.6,"audioSegment":0},{"text":"That pass can't keep out programs already running under your account on this computer,","startTime":135.6,"endTime":140.2,"audioSegment":0},{"text":"or anyone with administrator rights: like you, they can open the files where it's kept.","startTime":140.2,"endTime":144.8,"audioSegment":0},{"text":"So be as careful about what you install as you would be anyway.","startTime":144.8,"endTime":149.4,"audioSegment":0},{"text":"The security model has the details.","startTime":149.4,"endTime":154,"audioSegment":0}],"version":1},"startBlock":{"title":"Local-first: your data stays on your disk","subtitle":"Gezel is built on one stubborn idea: your work belongs to you, on your machine, in files you can read.","ambientMotion":"zoomIn"}}</script>
