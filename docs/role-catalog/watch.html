,"audio":{"segments":[]},"captions":{"phrases":[{"text":"A role template is a ready-made character for your crew: a name,","startTime":0,"endTime":3.017857142857143,"audioSegment":0},{"text":"a job, and a working style that shapes how they think and talk.","startTime":3.017857142857143,"endTime":6.035714285714286,"audioSegment":0},{"text":"The Meester picks from these when it builds a crew,","startTime":6.035714285714286,"endTime":9.053571428571429,"audioSegment":0},{"text":"and you can add any of them yourself with New Gezel.","startTime":9.053571428571429,"endTime":12.071428571428571,"audioSegment":0},{"text":"The core roles each have their own page in Roles.","startTime":12.071428571428571,"endTime":15.089285714285714,"audioSegment":0},{"text":"Role What they do","startTime":15.089285714285714,"endTime":18.107142857142858,"audioSegment":0},{"text":"Aanjager An infectious, organized rallier for community drives.","startTime":18.107142857142858,"endTime":21.125,"audioSegment":0},{"text":"Archivaris A gentle, rigorous archivist for the file nobody wants to need —","startTime":21.125,"endTime":24.142857142857142,"audioSegment":0},{"text":"wills, policies, accounts, instructions.","startTime":24.142857142857142,"endTime":27.160714285714285,"audioSegment":0},{"text":"Boekwachter The index-keeper.","startTime":27.160714285714285,"endTime":30.178571428571427,"audioSegment":0},{"text":"Builder Takes a job end-to-end on their own — research, build, ship.","startTime":30.178571428571427,"endTime":33.19642857142857,"audioSegment":0},{"text":"Ceremoniemeester A composed master of ceremonies for weddings, parties, and reunions.","startTime":33.19642857142857,"endTime":36.214285714285715,"audioSegment":0},{"text":"Coach A steady, encouraging training coach.","startTime":36.214285714285715,"endTime":39.232142857142854,"audioSegment":0},{"text":"Conversationalist A thoughtful companion for questions, research, brainstorming, and writing together.","startTime":39.232142857142854,"endTime":42.25,"audioSegment":0},{"text":"Copywriter Writes for humans.","startTime":42.25,"endTime":45.26785714285714,"audioSegment":0},{"text":"Damspeler A warm, playful checkers opponent.","startTime":45.26785714285714,"endTime":48.285714285714285,"audioSegment":0},{"text":"Designer Thinks in layout, hierarchy, and visual tone.","startTime":48.285714285714285,"endTime":51.30357142857143,"audioSegment":0},{"text":"Developer Writes, tests, and ships code.","startTime":51.30357142857143,"endTime":54.32142857142857,"audioSegment":0},{"text":"Generalist Carries a whole task from first step to last in one conversation —","startTime":54.32142857142857,"endTime":57.339285714285715,"audioSegment":0},{"text":"reads the outline, works the active step, passes its check, moves on.","startTime":57.339285714285715,"endTime":60.357142857142854,"audioSegment":0},{"text":"Go-speler A calm, attentive Go opponent who plays legal stones, respects the quiet shape of the board,","startTime":60.357142857142854,"endTime":63.375,"audioSegment":0},{"text":"and handles captures, passes, and final scores with good grace.","startTime":63.375,"endTime":66.39285714285714,"audioSegment":0},{"text":"Huismeester An unflappable house steward.","startTime":66.39285714285714,"endTime":69.41071428571428,"audioSegment":0},{"text":"Image generator An image generator.","startTime":69.41071428571428,"endTime":72.42857142857143,"audioSegment":0},{"text":"Kantoormeester The operations half of a freelancer's brain.","startTime":72.42857142857143,"endTime":75.44642857142857,"audioSegment":0},{"text":"Keurmeester The guild's quality inspector — consulted when a smaller model's work stalls, loops,","startTime":75.44642857142857,"endTime":78.46428571428571,"audioSegment":0},{"text":"or drifts, to diagnose the cause and hand back the smallest fix that gets the journeyman moving again.","startTime":78.46428571428571,"endTime":81.48214285714286,"audioSegment":0},{"text":"Language Trainer A warm, patient language tutor.","startTime":81.48214285714286,"endTime":84.5,"audioSegment":0},{"text":"Loopbaancoach A steady career coach who runs your job search like a campaign —","startTime":84.5,"endTime":87.51785714285714,"audioSegment":0},{"text":"keeps the pipeline current, gets your materials tailored, and never lets a follow-up slip.","startTime":87.51785714285714,"endTime":90.53571428571428,"audioSegment":0},{"text":"Maaltijdplanner A practical meal planner who answers \"what's for dinner?\" once a week instead of nightly —","startTime":90.53571428571428,"endTime":93.55357142857143,"audioSegment":0},{"text":"menus from what's actually in the pantry, one grocery run, less waste.","startTime":93.55357142857143,"endTime":96.57142857142857,"audioSegment":0},{"text":"Meester The concierge of a gezel crew — greets new users,","startTime":96.57142857142857,"endTime":99.58928571428571,"audioSegment":0},{"text":"understands what they're trying to build, and spins up the right team.","startTime":99.58928571428571,"endTime":102.60714285714286,"audioSegment":0},{"text":"Oefen-interviewer A mock interviewer who asks the hard questions for real —","startTime":102.60714285714286,"endTime":105.625,"audioSegment":0},{"text":"then debriefs kindly, with specifics you can actually fix before it counts.","startTime":105.625,"endTime":108.64285714285714,"audioSegment":0},{"text":"Omroeper The town crier for your feeds.","startTime":108.64285714285714,"endTime":111.66071428571428,"audioSegment":0},{"text":"Penningmeester A calm, unjudging treasurer for the household.","startTime":111.66071428571428,"endTime":114.67857142857143,"audioSegment":0},{"text":"Planner Turns fuzzy asks into concrete steps —","startTime":114.67857142857143,"endTime":117.69642857142857,"audioSegment":0},{"text":"good at the 'what' and the 'in what order', less opinionated on the 'how'.","startTime":117.69642857142857,"endTime":120.71428571428571,"audioSegment":0},{"text":"Reisleider A well-traveled guide who plans trips people a
