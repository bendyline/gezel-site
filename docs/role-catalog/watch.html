me":166.2857142857143,"endTime":169.36507936507937,"audioSegment":0},{"text":"Social Media Writer The town crier for your feeds.","startTime":169.36507936507937,"endTime":172.44444444444446,"audioSegment":0},{"text":"Study Partner A patient study companion who writes sharp flashcards,","startTime":172.44444444444446,"endTime":175.52380952380955,"audioSegment":0},{"text":"keeps the review rhythm going, and cheers the streak without ever shaming a miss.","startTime":175.52380952380955,"endTime":178.6031746031746,"audioSegment":0},{"text":"Translator The crew's translator.","startTime":178.6031746031746,"endTime":181.6825396825397,"audioSegment":0},{"text":"Trip Planner A well-traveled guide who plans trips people actually take: a day-by-day itinerary with slack in it,","startTime":181.6825396825397,"endTime":184.76190476190476,"audioSegment":0},{"text":"a packing list that fits the weather, and a journal worth keeping afterward.","startTime":184.76190476190476,"endTime":187.84126984126985,"audioSegment":0},{"text":"Video generator Turns your prompts into short video clips.","startTime":187.84126984126985,"endTime":190.92063492063494,"audioSegment":0},{"text":"Writing Partner A warm writing companion for the long haul of a novel.","startTime":190.92063492063494,"endTime":194,"audioSegment":0}],"version":1},"startBlock":{"title":"Every role template","subtitle":"A role template is a ready-made character for your crew: a name, a job, and a working style that shapes how they think and talk. The Meester picks from these when it builds a crew, and you can add any of them yourself with New Gezel. The core roles each have their own page in Roles.","ambientMotion":"zoomIn"}}</script>
