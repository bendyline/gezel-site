ho has finished which course, what expires when, and what a new hire needs in their first weeks, and books refreshers before anything lapses.","position":{"start":{"line":54,"column":68,"offset":7820},"end":{"line":54,"column":250,"offset":8002}}}],"position":{"start":{"line":54,"column":66,"offset":7818},"end":{"line":54,"column":252,"offset":8004}}}],"position":{"start":{"line":54,"column":1,"offset":7753},"end":{"line":54,"column":252,"offset":8004}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../role-template/vertaler/","children":[{"type":"text","value":"Translator","position":{"start":{"line":55,"column":4,"offset":8008},"end":{"line":55,"column":14,"offset":8018}}}],"position":{"start":{"line":55,"column":3,"offset":8007},"end":{"line":55,"column":43,"offset":8047}}}],"position":{"start":{"line":55,"column":1,"offset":8005},"end":{"line":55,"column":44,"offset":8048}}},{"type":"tableCell","children":[{"type":"text","value":"The crew's translator.","position":{"start":{"line":55,"column":46,"offset":8050},"end":{"line":55,"column":68,"offset":8072}}}],"position":{"start":{"line":55,"column":44,"offset":8048},"end":{"line":55,"column":70,"offset":8074}}}],"position":{"start":{"line":55,"column":1,"offset":8005},"end":{"line":55,"column":70,"offset":8074}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../role-template/reisleider/","children":[{"type":"text","value":"Trip Planner","position":{"start":{"line":56,"column":4,"offset":8078},"end":{"line":56,"column":16,"offset":8090}}}],"position":{"start":{"line":56,"column":3,"offset":8077},"end":{"line":56,"column":47,"offset":8121}}}],"position":{"start":{"line":56,"column":1,"offset":8075},"end":{"line":56,"column":48,"offset":8122}}},{"type":"tableCell","children":[{"type":"text","value":"A well-traveled guide who plans trips people actually take: a day-by-day itinerary with slack in it, a packing list that fits the weather, and a journal worth keeping afterward.","position":{"start":{"line":56,"column":50,"offset":8124},"end":{"line":56,"column":227,"offset":8301}}}],"position":{"start":{"line":56,"column":48,"offset":8122},"end":{"line":56,"column":229,"offset":8303}}}],"position":{"start":{"line":56,"column":1,"offset":8075},"end":{"line":56,"column":229,"offset":8303}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../role-template/video-generator/","children":[{"type":"text","value":"Video generator","position":{"start":{"line":57,"column":4,"offset":8307},"end":{"line":57,"column":19,"offset":8322}}}],"position":{"start":{"line":57,"column":3,"offset":8306},"end":{"line":57,"column":55,"offset":8358}}}],"position":{"start":{"line":57,"column":1,"offset":8304},"end":{"line":57,"column":56,"offset":8359}}},{"type":"tableCell","children":[{"type":"text","value":"Turns your prompts into short video clips.","position":{"start":{"line":57,"column":58,"offset":8361},"end":{"line":57,"column":100,"offset":8403}}}],"position":{"start":{"line":57,"column":56,"offset":8359},"end":{"line":57,"column":102,"offset":8405}}}],"position":{"start":{"line":57,"column":1,"offset":8304},"end":{"line":57,"column":102,"offset":8405}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../role-template/schrijfmaat/","children":[{"type":"text","value":"Writing Partner","position":{"start":{"line":58,"column":4,"offset":8409},"end":{"line":58,"column":19,"offset":8424}}}],"position":{"start":{"line":58,"column":3,"offset":8408},"end":{"line":58,"column":51,"offset":8456}}}],"position":{"start":{"line":58,"column":1,"offset":8406},"end":{"line":58,"column":52,"offset":8457}}},{"type":"tableCell","children":[{"type":"text","value":"A warm writing companion for the long haul of a novel.","position":{"start":{"line":58,"column":54,"offset":8459},"end":{"line":58,"column":108,"offset":8513}}}],"position":{"start":{"line":58,"column":52,"offset":8457},"end":{"line":58,"column":110,"offset":8515}}}],"position":{"start":{"line":58,"column":1,"offset":8406},"end":{"line":58,"column":110,"offset":8515}}}],"position":{"start":{"line":5,"column":1,"offset":340},"end":{"line":58,"column":110,"offset":8515}}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A role template is a ready-made character for your crew: a name,","startTime":0,"endTime":3.627906976744186,"audioSegment":0},{"text":"a job, and a working style that shapes how they think and talk.","startTime":3.627906976744186,"endTime":7.255813953488372,"audioSegment":0},{"text":"The Meester picks from these when a job calls for one,","startTime":7.255813953488372,"endTime":10.883720930232558,"audioSegment":0},{"text":"and you can add any of them yourself with New crew member.","startTime":10.883720930232558,"endTime":14.511627906976743,"audioSegment":0},{"text":"The core roles each have their own page in Roles.","startTime":14.511627906976743,"endTime":18.13953488372093,"audioSegment":0},{"text":"Role What they do","startTime":18.13953488372093,"endTime":21.767441860465116,"audioSegment":0},{"text":"Account Manager A warm, organized keeper of a small business’s sales: every deal with its stage,","startTime":21.767441860465116,"endTime":25.3953488372093,"audioSegment":0},{"text":"value and next follow-up, the calls to make today, and a weighted forecast that stays honest.","startTime":25.3953488372093,"endTime":29.023255813953487,"audioSegment":0},{"text":"Archivist A gentle, rigorous archivist for the file nobody wants to need —","startTime":29.023255813953487,"endTime":32.651162790697676,"audioSegment":0},{"text":"wills, policies, accounts, instructions.","startTime":32.651162790697676,"endTime":36.27906976744186,"audioSegment":0},{"text":"Bookkeeper A careful keeper of a small business's books: every receipt booked with its proof,","startTime":36.27906976744186,"endTime":39.906976744186046,"audioSegment":0},{"text":"every entry in a category, each month closed on a checklist, and the cash planned weeks ahead.","startTime":39.906976744186046,"endTime":43.53488372093023,"audioSegment":0},{"text":"Builder Takes a job end-to-end on their own — research, build, ship.","startTime":43.53488372093023,"endTime":47.16279069767442,"audioSegment":0},{"text":"Campaign Manager A steady, numbers-honest runner of one marketing campaign: the goal, the channel calendar,","startTime":47.16279069767442,"endTime":50.7906976744186,"audioSegment":0},{"text":"every asset from idea to live, the budget against what was spent, and the results that say what worked.","startTime":50.7906976744186,"endTime":54.41860465116279,"audioSegment":0},{"text":"Care Coordinator A warm, discreet care coordinator.","startTime":54.41860465116279,"endTime":58.04651162790697,"audioSegment":0},{"text":"Career Coach A steady career coach who runs your job search like a campaign —","startTime":58.04651162790697,"endTime":61.67441860465116,"audioSegment":0},{"text":"keeps the pipeline current, gets your materials tailored, and never lets a follow-up slip.","startTime":61.67441860465116,"endTime":65.30232558139535,"audioSegment":0},{"text":"Checkers Player A warm, playful checkers opponent.","startTime":65.30232558139535,"endTime":68.93023255813954,"audioSegment":0},{"text":"Chess Player A thoughtful, warm chess opponent who plays a complete legal game,","startTime":68.93023255813954,"endTime":72.55813953488372,"audioSegment":0},{"text":"keeps plans private, and makes the table welcoming whether the result is a win, loss, or draw.","startTime":72.55813953488372,"endTime":76.18604651162791,"audioSegment":0},{"text":"Chief Security Officer Chief Security Officer for the crew.","startTime":76.18604651162791,"endTime":79.81395348837209,"audioSegment":0},{"text":"Clue Giver A lively clue-giver for word games: bold one-word clues that link several words at once,","startTime":79.81395348837209,"endTime":83.44186046511628,"audioSegment":0},{"text":"and cheerful table talk.","startTime":83.44186046511628,"endTime":87.06976744186046,"audioSegment":0},{"text":"Coach A steady, encouraging training coach.","startTime":87.06976744186046,"endTime":90.69767441860465,"audioSegment":0},{"text":"Compliance Officer A calm, exact keeper of a small business's obligations: licenses, permits, filings,","startTime":90.69767441860465,"endTime":94.32558139534883,"audioSegment":0},{"text":"insurance and certifications, each with an owner, a due date and the evidence that it was done.","startTime":94.32558139534883,"endTime":97.95348837209302,"audioSegment":0},{"text":"Conversationalist A thoughtful companion for questions, research, brainstorming, and writing together.","startTime":97.95348837209302,"endTime":101.5813953488372,"audioSegment":0},{"text":"Copywriter Writes for humans.","startTime":101.5813953488372,"endTime":105.20930232558139,"audioSegment":0},{"text":"Crew Lead Foreman of a project — plans tasks,","startTime":105.20930232558139,"endTime":108.83720930232558,"audioSegment":0},{"text":"delegates to the right gezels, and keeps work moving.","startTime":108.83720930232558,"endTime":112.46511627906976,"audioSegment":0},{"text":"Curator Looks after a photo library.","startTime":112.46511627906976,"endTime":116.09302325581395,"audioSegment":0},{"text":"Designer Thinks in layout, hierarchy, and visual tone.","startTime":116.09302325581395,"endTime":119.72093023255813,"audioSegment":0},{"text":"Developer Writes, tests, and ships code.","startTime":119.72093023255813,"endTime":123.34883720930232,"audioSegment":0},{"text":"Estimator A careful, practical pricer for trade and service businesses: every quote built line by line from labor and materials at the business’s own rates,","startTime":123.34883720930232,"endTime":126.9767441860465,"audioSegment":0},{"text":"exact to the cent, and followed up until it is won or lost.","startTime":126.9767441860465,"endTime":130.6046511627907,"audioSegment":0},{"text":"Event Planner A composed master of ceremonies for weddings, parties, and reunions.","startTime":130.6046511627907,"endTime":134.2325581395349,"audioSegment":0},{"text":"Fundraiser An infectious, organized rallier for community drives.","startTime":134.2325581395349,"endTime":137.86046511627907,"audioSegment":0},{"text":"Generalist Carries a whole task from first step to last in one conversation —","startTime":137.86046511627907,"endTime":141.48837209302326,"audioSegment":0},{"text":"reads the outline, works the active step, passes its check, moves on.","startTime":141.48837209302326,"endTime":145.11627906976744,"audioSegment":0},{"text":"Go Player A calm, attentive Go opponent who plays legal stones, respects the quiet shape of the board,","startTime":145.11627906976744,"endTime":148.74418604651163,"audioSegment":0},{"text":"and handles captures, passes, and final scores with good grace.","startTime":148.74418604651163,"endTime":152.37209302325581,"audioSegment":0},{"text":"Home Keeper An unflappable house steward.","startTime":152.37209302325581,"endTime":156,"audioSegment":0},{"text":"Household Treasurer A calm, unjudging treasurer for the household.","startTime":156,"endTime":159.62790697674419,"audioSegment":0},{"text":"Illustrator Turns a brief into finished images: logos, icons,","startTime":159.62790697674419,"endTime":163.25581395348837,"audioSegment":0},{"text":"heroes, character sheets and sets that belong together.","startTime":163.25581395348837,"endTime":166.88372093023256,"audioSegment":0},{"text":"Image editor Changes a picture you give it.","startTime":166.88372093023256,"endTime":170.51162790697674,"audioSegment":0},{"text":"Image generator An image generator.","startTime":170.51162790697674,"endTime":174.13953488372093,"audioSegment":0},{"text":"Inspector The guild's quality inspector — consulted when a smaller model's work stalls, loops,","startTime":174.13953488372093,"endTime":177.7674418604651,"audioSegment":0},{"text":"or drifts, to diagnose the cause and hand back the smallest fix that gets the journeyman moving again.","startTime":177.7674418604651,"endTime":181.3953488372093,"audioSegment":0},{"text":"Language Trainer A warm, patient language tutor.","startTime":181.3953488372093,"endTime":185.02325581395348,"audioSegment":0},{"text":"Librarian The index-keeper.","startTime":185.02325581395348,"endTime":188.65116279069767,"audioSegment":0},{"text":"Managing Editor A calm keeper of a small business's editorial pipeline: every long-form piece from idea to published with one owner and one date,","startTime":188.65116279069767,"endTime":192.27906976744185,"audioSegment":0},{"text":"an honest calendar, and a plan for the newsletter, social posts and video chapters each piece spins off.","startTime":192.27906976744185,"endTime":195.90697674418604,"audioSegment":0},{"text":"Meal Planner A practical meal planner who answers \"what's for dinner?\" once a week instead of nightly —","startTime":195.90697674418604,"endTime":199.53488372093022,"audioSegment":0},{"text":"menus from what's actually in the pantry, one grocery run, less waste.","startTime":199.53488372093022,"endTime":203.1627906976744,"audioSegment":0},{"text":"Meester The concierge of a gezel crew — greets new users,","startTime":203.1627906976744,"endTime":206.7906976744186,"audioSegment":0},{"text":"understands what they're trying to build, and spins up the right team.","startTime":206.7906976744186,"endTime":210.41860465116278,"audioSegment":0},{"text":"Mock Interviewer A mock interviewer who asks the hard questions for real —","startTime":210.41860465116278,"endTime":214.04651162790697,"audioSegment":0},{"text":"then debriefs kindly, with specifics you can actually fix before it counts.","startTime":214.04651162790697,"endTime":217.67441860465115,"audioSegment":0},{"text":"Office Administrator The operations half of a freelancer's brain.","startTime":217.67441860465115,"endTime":221.30232558139534,"audioSegment":0},{"text":"Planner Turns fuzzy asks into concrete steps —","startTime":221.30232558139534,"endTime":224.93023255813952,"audioSegment":0},{"text":"good at the 'what' and the 'in what order', less opinionated on the 'how'.","startTime":224.93023255813952,"endTime":228.5581395348837,"audioSegment":0},{"text":"Puzzler A careful clue-giver for word games: precise one-word clues that keep well away from the trap,","startTime":228.5581395348837,"endTime":232.1860465116279,"audioSegment":0},{"text":"and dry, friendly asides.","startTime":232.1860465116279,"endTime":235.81395348837208,"audioSegment":0},{"text":"Recruiter A fair, organized recruiter for a small business: writes job-related requirements,","startTime":235.81395348837208,"endTime":239.44186046511626,"audioSegment":0},{"text":"keeps every candidate moving with a clear next step, gathers structured scorecards, and leaves every hiring decision to you.","startTime":239.44186046511626,"endTime":243.06976744186045,"audioSegment":0},{"text":"Researcher Reads source, prior art,","startTime":243.06976744186045,"endTime":246.69767441860463,"audioSegment":0},{"text":"or external docs and files a substantive written analysis.","startTime":246.69767441860463,"endTime":250.32558139534882,"audioSegment":0},{"text":"Reviewer Second set of eyes on code, docs, or plans.","startTime":250.32558139534882,"endTime":253.953488372093,"audioSegment":0},{"text":"Shift Scheduler A fair, careful builder of a small team's weekly roster: every shift covered from who is available,","startTime":253.953488372093,"endTime":257.5813953488372,"audioSegment":0},{"text":"hours kept inside the limits the business sets, and every week left for a person to approve.","startTime":257.5813953488372,"endTime":261.2093023255814,"audioSegment":0},{"text":"Social Media Writer The town crier for your feeds.","startTime":261.2093023255814,"endTime":264.83720930232556,"audioSegment":0},{"text":"Stock Keeper A tidy, numbers-first keeper of a small business's stockroom: what is on the shelf, what is running low,","startTime":264.83720930232556,"endTime":268.4651162790698,"audioSegment":0},{"text":"which supplier brings it and how long they take, and the purchase orders ready to check and send.","startTime":268.4651162790698,"endTime":272.09302325581393,"audioSegment":0},{"text":"Study Partner A patient study companion who writes sharp flashcards,","startTime":272.09302325581393,"endTime":275.72093023255815,"audioSegment":0},{"text":"keeps the review rhythm going, and cheers the streak without ever shaming a miss.","startTime":275.72093023255815,"endTime":279.3488372093023,"audioSegment":0},{"text":"Support Lead A calm, organized lead for a small business's customer questions: every request logged as a ticket,","startTime":279.3488372093023,"endTime":282.9767441860465,"audioSegment":0},{"text":"answered from the business's own help articles, and the questions those articles miss turned into new ones.","startTime":282.9767441860465,"endTime":286.6046511627907,"audioSegment":0},{"text":"Training Coordinator A steady training coordinator who knows who has finished which course, what expires when,","startTime":286.6046511627907,"endTime":290.2325581395349,"audioSegment":0},{"text":"and what a new hire needs in their first weeks, and books refreshers before anything lapses.","startTime":290.2325581395349,"endTime":293.86046511627904,"audioSegment":0},{"text":"Translator The crew's translator.","startTime":293.86046511627904,"endTime":297.48837209302326,"audioSegment":0},{"text":"Trip Planner A well-traveled guide who plans trips people actually take: a day-by-day itinerary with slack in it,","startTime":297.48837209302326,"endTime":301.1162790697674,"audioSegment":0},{"text":"a packing list that fits the weather, and a journal worth keeping afterward.","startTime":301.1162790697674,"endTime":304.74418604651163,"audioSegment":0},{"text":"Video generator Turns your prompts into short video clips.","startTime":304.74418604651163,"endTime":308.3720930232558,"audioSegment":0},{"text":"Writing Partner A warm writing companion for the long haul of a novel.","startTime":308.3720930232558,"endTime":312,"audioSegment":0}],"version":1},"startBlock":{"title":"Every role template","subtitle":"A role template is a ready-made character for your crew: a name, a job, and a working style that shapes how they think and talk. The Meester picks from these when a job calls for one, and you can add any of them yourself with New crew member. The core roles each have their own page in Roles.","ambientMotion":"zoomIn"}}</script>
