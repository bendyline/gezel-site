Segment":0},{"text":"Event Planner A composed master of ceremonies for weddings, parties, and reunions.","startTime":80.03125,"endTime":83.109375,"audioSegment":0},{"text":"Fundraiser An infectious, organized rallier for community drives.","startTime":83.109375,"endTime":86.1875,"audioSegment":0},{"text":"Generalist Carries a whole task from first step to last in one conversation —","startTime":86.1875,"endTime":89.265625,"audioSegment":0},{"text":"reads the outline, works the active step, passes its check, moves on.","startTime":89.265625,"endTime":92.34375,"audioSegment":0},{"text":"Go Player A calm, attentive Go opponent who plays legal stones, respects the quiet shape of the board,","startTime":92.34375,"endTime":95.421875,"audioSegment":0},{"text":"and handles captures, passes, and final scores with good grace.","startTime":95.421875,"endTime":98.5,"audioSegment":0},{"text":"Home Keeper An unflappable house steward.","startTime":98.5,"endTime":101.578125,"audioSegment":0},{"text":"Household Treasurer A calm, unjudging treasurer for the household.","startTime":101.578125,"endTime":104.65625,"audioSegment":0},{"text":"Illustrator Turns a brief into finished images: logos, icons,","startTime":104.65625,"endTime":107.734375,"audioSegment":0},{"text":"heroes, character sheets and sets that belong together.","startTime":107.734375,"endTime":110.8125,"audioSegment":0},{"text":"Image editor Changes a picture you give it.","startTime":110.8125,"endTime":113.890625,"audioSegment":0},{"text":"Image generator An image generator.","startTime":113.890625,"endTime":116.96875,"audioSegment":0},{"text":"Inspector The guild's quality inspector — consulted when a smaller model's work stalls, loops,","startTime":116.96875,"endTime":120.046875,"audioSegment":0},{"text":"or drifts, to diagnose the cause and hand back the smallest fix that gets the journeyman moving again.","startTime":120.046875,"endTime":123.125,"audioSegment":0},{"text":"Language Trainer A warm, patient language t r plans.","startTime":169.296875,"endTime":172.375,"audioSegment":0},{"text":"Social Media Writer The town crier for your feeds.","startTime":172.375,"endTime":175.453125,"audioSegment":0},{"text":"Study Partner A patient study companion who writes sharp flashcards,","startTime":175.453125,"endTime":178.53125,"audioSegment":0},{"text":"keeps the review rhythm going, and cheers the streak without ever shaming a miss.","startTime":178.53125,"endTime":181.609375,"audioSegment":0},{"text":"Translator The crew's translator.","startTime":181.609375,"endTime":184.6875,"audioSegment":0},{"text":"Trip Planner A well-traveled guide who plans trips people actually take: a day-by-day itinerary with slack in it,","startTime":184.6875,"endTime":187.765625,"audioSegment":0},{"text":"a packing list that fits the weather, and a journal worth keeping afterward.","startTime":187.765625,"endTime":190.84375,"audioSegment":0},{"text":"Video generator Turns your prompts into short video clips.","startTime":190.84375,"endTime":193.921875,"audioSegment":0},{"text":"Writing Partner A warm writing companion for the long haul of a novel.","startTime":193.921875,"endTime":197,"audioSegment":0}],"version":1},"startBlock":{"title":"Every role template","subtitle":"A role template is a ready-made character for your crew: a name, a job, and a working style that shapes how they think and talk. The Meester picks from these when it builds a crew, and you can add any of them yourself with New Gezel. The core roles each have their own page in Roles.","ambientMotion":"zoomIn"}}</script>
