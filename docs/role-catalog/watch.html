ished which course, what expires when, and what a new hire needs in their first weeks, and books refreshers before anything lapses.","position":{"start":{"line":54,"column":68,"offset":7811},"end":{"line":54,"column":250,"offset":7993}}}],"position":{"start":{"line":54,"column":66,"offset":7809},"end":{"line":54,"column":252,"offset":7995}}}],"position":{"start":{"line":54,"column":1,"offset":7744},"end":{"line":54,"column":252,"offset":7995}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../role-template/vertaler/","children":[{"type":"text","value":"Translator","position":{"start":{"line":55,"column":4,"offset":7999},"end":{"line":55,"column":14,"offset":8009}}}],"position":{"start":{"line":55,"column":3,"offset":7998},"end":{"line":55,"column":43,"offset":8038}}}],"position":{"start":{"line":55,"column":1,"offset":7996},"end":{"line":55,"column":44,"offset":8039}}},{"type":"tableCell","children":[{"type":"text","value":"The crew's translator.","position":{"start":{"line":55,"column":46,"offset":8041},"end":{"line":55,"column":68,"offset":8063}}}],"position":{"start":{"line":55,"column":44,"offset":8039},"end":{"line":55,"column":70,"offset":8065}}}],"position":{"start":{"line":55,"column":1,"offset":7996},"end":{"line":55,"column":70,"offset":8065}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../role-template/reisleider/","children":[{"type":"text","value":"Trip Planner","position":{"start":{"line":56,"column":4,"offset":8069},"end":{"line":56,"column":16,"offset":8081}}}],"position":{"start":{"line":56,"column":3,"offset":8068},"end":{"line":56,"column":47,"offset":8112}}}],"position":{"start":{"line":56,"column":1,"offset":8066},"end":{"line":56,"column":48,"offset":8113}}},{"type":"tableCell","children":[{"type":"text","value":"A well-traveled guide who plans trips people actually take: a day-by-day itinerary with slack in it, a packing list that fits the weather, and a journal worth keeping afterward.","position":{"start":{"line":56,"column":50,"offset":8115},"end":{"line":56,"column":227,"offset":8292}}}],"position":{"start":{"line":56,"column":48,"offset":8113},"end":{"line":56,"column":229,"offset":8294}}}],"position":{"start":{"line":56,"column":1,"offset":8066},"end":{"line":56,"column":229,"offset":8294}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../role-template/video-generator/","children":[{"type":"text","value":"Video generator","position":{"start":{"line":57,"column":4,"offset":8298},"end":{"line":57,"column":19,"offset":8313}}}],"position":{"start":{"line":57,"column":3,"offset":8297},"end":{"line":57,"column":55,"offset":8349}}}],"position":{"start":{"line":57,"column":1,"offset":8295},"end":{"line":57,"column":56,"offset":8350}}},{"type":"tableCell","children":[{"type":"text","value":"Turns your prompts into short video clips.","position":{"start":{"line":57,"column":58,"offset":8352},"end":{"line":57,"column":100,"offset":8394}}}],"position":{"start":{"line":57,"column":56,"offset":8350},"end":{"line":57,"column":102,"offset":8396}}}],"position":{"start":{"line":57,"column":1,"offset":8295},"end":{"line":57,"column":102,"offset":8396}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../role-template/schrijfmaat/","children":[{"type":"text","value":"Writing Partner","position":{"start":{"line":58,"column":4,"offset":8400},"end":{"line":58,"column":19,"offset":8415}}}],"position":{"start":{"line":58,"column":3,"offset":8399},"end":{"line":58,"column":51,"offset":8447}}}],"position":{"start":{"line":58,"column":1,"offset":8397},"end":{"line":58,"column":52,"offset":8448}}},{"type":"tableCell","children":[{"type":"text","value":"A warm writing companion for the long haul of a novel.","position":{"start":{"line":58,"column":54,"offset":8450},"end":{"line":58,"column":108,"offset":8504}}}],"position":{"start":{"line":58,"column":52,"offset":8448},"end":{"line":58,"column":110,"offset":8506}}}],"position":{"start":{"line":58,"column":1,"offset":8397},"end":{"line":58,"column":110,"offset":8506}}}],"position":{"start":{"line":5,"column":1,"offset":331},"end":{"line":58,"column":110,"offset":8506}}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A role template is a ready-made character for your crew: a name,","startTime":0,"endTime":3.616279069767442,"audioSegment":0},{"text":"a job, and a working style that shapes how they think and talk.","startTime":3.616279069767442,"endTime":7.232558139534884,"audioSegment":0},{"text":"The Meester picks from these when it builds a crew,","startTime":7.232558139534884,"endTime":10.848837209302326,"audioSegment":0},{"text":"and you can add any of them yourself with New Gezel.","startTime":10.848837209302326,"endTime":14.465116279069768,"audioSegment":0},{"text":"The core roles each have their own page in Roles.","startTime":14.465116279069768,"endTime":18.081395348837212,"audioSegment":0},{"text":"Role What they do","startTime":18.081395348837212,"endTime":21.697674418604652,"audioSegment":0},{"text":"Account Manager A warm, organized keeper of a small business’s sales: every deal with its stage,","startTime":21.697674418604652,"endTime":25.313953488372093,"audioSegment":0},{"text":"value and next follow-up, the calls to make today, and a weighted forecast that stays honest.","startTime":25.313953488372093,"endTime":28.930232558139537,"audioSegment":0},{"text":"Archivist A gentle, rigorous archivist for the file nobody wants to need —","startTime":28.930232558139537,"endTime":32.54651162790698,"audioSegment":0},{"text":"wills, policies, accounts, instructions.","startTime":32.54651162790698,"endTime":36.162790697674424,"audioSegment":0},{"text":"Bookkeeper A careful keeper of a small business's books: every receipt booked with its proof,","startTime":36.162790697674424,"endTime":39.77906976744186,"audioSegment":0},{"text":"every entry in a category, each month closed on a checklist, and the cash planned weeks ahead.","startTime":39.77906976744186,"endTime":43.395348837209305,"audioSegment":0},{"text":"Builder Takes a job end-to-end on their own — research, build, ship.","startTime":43.395348837209305,"endTime":47.01162790697675,"audioSegment":0},{"text":"Campaign Manager A steady, numbers-honest runner of one marketing campaign: the goal, the channel calendar,","startTime":47.01162790697675,"endTime":50.627906976744185,"audioSegment":0},{"text":"every asset from idea to live, the budget against what was spent, and the results that say what worked.","startTime":50.627906976744185,"endTime":54.24418604651163,"audioSegment":0},{"text":"Care Coordinator A warm, discreet care coordinator.","startTime":54.24418604651163,"endTime":57.86046511627907,"audioSegment":0},{"text":"Career Coach A steady career coach who runs your job search like a campaign —","startTime":57.86046511627907,"endTime":61.47674418604652,"audioSegment":0},{"text":"keeps the pipeline current, gets your materials tailored, and never lets a follow-up slip.","startTime":61.47674418604652,"endTime":65.09302325581396,"audioSegment":0},{"text":"Checkers Player A warm, playful checkers opponent.","startTime":65.09302325581396,"endTime":68.7093023255814,"audioSegment":0},{"text":"Chess Player A thoughtful, warm chess opponent who plays a complete legal game,","startTime":68.7093023255814,"endTime":72.32558139534885,"audioSegment":0},{"text":"keeps plans private, and makes the table welcoming whether the result is a win, loss, or draw.","startTime":72.32558139534885,"endTime":75.94186046511628,"audioSegment":0},{"text":"Chief Security Officer Chief Security Officer for the crew.","startTime":75.94186046511628,"endTime":79.55813953488372,"audioSegment":0},{"text":"Clue Giver A lively clue-giver for word games: bold one-word clues that link several words at once,","startTime":79.55813953488372,"endTime":83.17441860465117,"audioSegment":0},{"text":"and cheerful table talk.","startTime":83.17441860465117,"endTime":86.79069767441861,"audioSegment":0},{"text":"Coach A steady, encouraging training coach.","startTime":86.79069767441861,"endTime":90.40697674418605,"audioSegment":0},{"text":"Compliance Officer A calm, exact keeper of a small business's obligations: licenses, permits, filings,","startTime":90.40697674418605,"endTime":94.0232558139535,"audioSegment":0},{"text":"insurance and certifications, each with an owner, a due date and the evidence that it was done.","startTime":94.0232558139535,"endTime":97.63953488372094,"audioSegment":0},{"text":"Conversationalist A thoughtful companion for questions, research, brainstorming, and writing together.","startTime":97.63953488372094,"endTime":101.25581395348837,"audioSegment":0},{"text":"Copywriter Writes for humans.","startTime":101.25581395348837,"endTime":104.87209302325581,"audioSegment":0},{"text":"Crew Lead Foreman of a project — plans tasks,","startTime":104.87209302325581,"endTime":108.48837209302326,"audioSegment":0},{"text":"delegates to the right gezels, and keeps work moving.","startTime":108.48837209302326,"endTime":112.1046511627907,"audioSegment":0},{"text":"Curator Looks after a photo library.","startTime":112.1046511627907,"endTime":115.72093023255815,"audioSegment":0},{"text":"Designer Thinks in layout, hierarchy, and visual tone.","startTime":115.72093023255815,"endTime":119.33720930232559,"audioSegment":0},{"text":"Developer Writes, tests, and ships code.","startTime":119.33720930232559,"endTime":122.95348837209303,"audioSegment":0},{"text":"Estimator A careful, practical pricer for trade and service businesses: every quote built line by line from labor and materials at the business’s own rates,","startTime":122.95348837209303,"endTime":126.56976744186048,"audioSegment":0},{"text":"exact to the cent, and followed up until it is won or lost.","startTime":126.56976744186048,"endTime":130.18604651162792,"audioSegment":0},{"text":"Event Planner A composed master of ceremonies for weddings, parties, and reunions.","startTime":130.18604651162792,"endTime":133.80232558139537,"audioSegment":0},{"text":"Fundraiser An infectious, organized rallier for community drives.","startTime":133.80232558139537,"endTime":137.4186046511628,"audioSegment":0},{"text":"Generalist Carries a whole task from first step to last in one conversation —","startTime":137.4186046511628,"endTime":141.03488372093025,"audioSegment":0},{"text":"reads the outline, works the active step, passes its check, moves on.","startTime":141.03488372093025,"endTime":144.6511627906977,"audioSegment":0},{"text":"Go Player A calm, attentive Go opponent who plays legal stones, respects the quiet shape of the board,","startTime":144.6511627906977,"endTime":148.2674418604651,"audioSegment":0},{"text":"and handles captures, passes, and final scores with good grace.","startTime":148.2674418604651,"endTime":151.88372093023256,"audioSegment":0},{"text":"Home Keeper An unflappable house steward.","startTime":151.88372093023256,"endTime":155.5,"audioSegment":0},{"text":"Household Treasurer A calm, unjudging treasurer for the household.","startTime":155.5,"endTime":159.11627906976744,"audioSegment":0},{"text":"Illustrator Turns a brief into finished images: logos, icons,","startTime":159.11627906976744,"endTime":162.7325581395349,"audioSegment":0},{"text":"heroes, character sheets and sets that belong together.","startTime":162.7325581395349,"endTime":166.34883720930233,"audioSegment":0},{"text":"Image editor Changes a picture you give it.","startTime":166.34883720930233,"endTime":169.96511627906978,"audioSegment":0},{"text":"Image generator An image generator.","startTime":169.96511627906978,"endTime":173.58139534883722,"audioSegment":0},{"text":"Inspector The guild's quality inspector — consulted when a smaller model's work stalls, loops,","startTime":173.58139534883722,"endTime":177.19767441860466,"audioSegment":0},{"text":"or drifts, to diagnose the cause and hand back the smallest fix that gets the journeyman moving again.","startTime":177.19767441860466,"endTime":180.8139534883721,"audioSegment":0},{"text":"Language Trainer A warm, patient language tutor.","startTime":180.8139534883721,"endTime":184.43023255813955,"audioSegment":0},{"text":"Librarian The index-keeper.","startTime":184.43023255813955,"endTime":188.046511627907,"audioSegment":0},{"text":"Managing Editor A calm keeper of a small business's editorial pipeline: every long-form piece from idea to published with one owner and one date,","startTime":188.046511627907,"endTime":191.66279069767444,"audioSegment":0},{"text":"an honest calendar, and a plan for the newsletter, social posts and video chapters each piece spins off.","startTime":191.66279069767444,"endTime":195.27906976744188,"audioSegment":0},{"text":"Meal Planner A practical meal planner who answers \"what's for dinner?\" once a week instead of nightly —","startTime":195.27906976744188,"endTime":198.89534883720933,"audioSegment":0},{"text":"menus from what's actually in the pantry, one grocery run, less waste.","startTime":198.89534883720933,"endTime":202.51162790697674,"audioSegment":0},{"text":"Meester The concierge of a gezel crew — greets new users,","startTime":202.51162790697674,"endTime":206.12790697674419,"audioSegment":0},{"text":"understands what they're trying to build, and spins up the right team.","startTime":206.12790697674419,"endTime":209.74418604651163,"audioSegment":0},{"text":"Mock Interviewer A mock interviewer who asks the hard questions for real —","startTime":209.74418604651163,"endTime":213.36046511627907,"audioSegment":0},{"text":"then debriefs kindly, with specifics you can actually fix before it counts.","startTime":213.36046511627907,"endTime":216.97674418604652,"audioSegment":0},{"text":"Office Administrator The operations half of a freelancer's brain.","startTime":216.97674418604652,"endTime":220.59302325581396,"audioSegment":0},{"text":"Planner Turns fuzzy asks into concrete steps —","startTime":220.59302325581396,"endTime":224.2093023255814,"audioSegment":0},{"text":"good at the 'what' and the 'in what order', less opinionated on the 'how'.","startTime":224.2093023255814,"endTime":227.82558139534885,"audioSegment":0},{"text":"Puzzler A careful clue-giver for word games: precise one-word clues that keep well away from the trap,","startTime":227.82558139534885,"endTime":231.4418604651163,"audioSegment":0},{"text":"and dry, friendly asides.","startTime":231.4418604651163,"endTime":235.05813953488374,"audioSegment":0},{"text":"Recruiter A fair, organized recruiter for a small business: writes job-related requirements,","startTime":235.05813953488374,"endTime":238.67441860465118,"audioSegment":0},{"text":"keeps every candidate moving with a clear next step, gathers structured scorecards, and leaves every hiring decision to you.","startTime":238.67441860465118,"endTime":242.29069767441862,"audioSegment":0},{"text":"Researcher Reads source, prior art,","startTime":242.29069767441862,"endTime":245.90697674418607,"audioSegment":0},{"text":"or external docs and files a substantive written analysis.","startTime":245.90697674418607,"endTime":249.5232558139535,"audioSegment":0},{"text":"Reviewer Second set of eyes on code, docs, or plans.","startTime":249.5232558139535,"endTime":253.13953488372096,"audioSegment":0},{"text":"Shift Scheduler A fair, careful builder of a small team's weekly roster: every shift covered from who is available,","startTime":253.13953488372096,"endTime":256.75581395348837,"audioSegment":0},{"text":"hours kept inside the limits the business sets, and every week left for a person to approve.","startTime":256.75581395348837,"endTime":260.37209302325584,"audioSegment":0},{"text":"Social Media Writer The town crier for your feeds.","startTime":260.37209302325584,"endTime":263.98837209302326,"audioSegment":0},{"text":"Stock Keeper A tidy, numbers-first keeper of a small business's stockroom: what is on the shelf, what is running low,","startTime":263.98837209302326,"endTime":267.60465116279073,"audioSegment":0},{"text":"which supplier brings it and how long they take, and the purchase orders ready to check and send.","startTime":267.60465116279073,"endTime":271.22093023255815,"audioSegment":0},{"text":"Study Partner A patient study companion who writes sharp flashcards,","startTime":271.22093023255815,"endTime":274.8372093023256,"audioSegment":0},{"text":"keeps the review rhythm going, and cheers the streak without ever shaming a miss.","startTime":274.8372093023256,"endTime":278.45348837209303,"audioSegment":0},{"text":"Support Lead A calm, organized lead for a small business's customer questions: every request logged as a ticket,","startTime":278.45348837209303,"endTime":282.0697674418605,"audioSegment":0},{"text":"answered from the business's own help articles, and the questions those articles miss turned into new ones.","startTime":282.0697674418605,"endTime":285.6860465116279,"audioSegment":0},{"text":"Training Coordinator A steady training coordinator who knows who has finished which course, what expires when,","startTime":285.6860465116279,"endTime":289.3023255813954,"audioSegment":0},{"text":"and what a new hire needs in their first weeks, and books refreshers before anything lapses.","startTime":289.3023255813954,"endTime":292.9186046511628,"audioSegment":0},{"text":"Translator The crew's translator.","startTime":292.9186046511628,"endTime":296.5348837209302,"audioSegment":0},{"text":"Trip Planner A well-traveled guide who plans trips people actually take: a day-by-day itinerary with slack in it,","startTime":296.5348837209302,"endTime":300.1511627906977,"audioSegment":0},{"text":"a packing list that fits the weather, and a journal worth keeping afterward.","startTime":300.1511627906977,"endTime":303.7674418604651,"audioSegment":0},{"text":"Video generator Turns your prompts into short video clips.","startTime":303.7674418604651,"endTime":307.3837209302326,"audioSegment":0},{"text":"Writing Partner A warm writing companion for the long haul of a novel.","startTime":307.3837209302326,"endTime":311,"audioSegment":0}],"version":1},"startBlock":{"title":"Every role template","subtitle":"A role template is a ready-made character for your crew: a name, a job, and a working style that shapes how they think and talk. The Meester picks from these when it builds a crew, and you can add any of them yourself with New Gezel. The core roles each have their own page in Roles.","ambientMotion":"zoomIn"}}</script>
