are row keys (B3).","No ISO dates, raw enum values, or ids are shown (C1). Tones follow values (C2).","Empty states span their list. Search appears only on long lists, with a real placeholder (C3, C5).","Actions and focus use the action color. The demo banner is the shared one (D1, D2).","The page works at 420px wide without scrolling sideways, in dark mode, and with the keyboard."],"ordered":false,"title":"Review checklist"}},{"id":"open-questions","startTime":481,"duration":60,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Open questions","position":{"start":{"line":131,"column":4,"offset":9923},"end":{"line":131,"column":18,"offset":9937}}}],"position":{"start":{"line":131,"column":1,"offset":9920},"end":{"line":131,"column":18,"offset":9937}}},"title":"Open questions","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Settings for what the person chose at creation.","position":{"start":{"line":133,"column":5,"offset":9943},"end":{"line":133,"column":52,"offset":9990}}}],"position":{"start":{"line":133,"column":3,"offset":9941},"end":{"line":133,"column":54,"offset":9992}}},{"type":"text","value":" A business name, an event date, or a weekly word goal is a project parameter. Pages can read these but not change them, so most of them cannot appear in Settings today. A host-drawn Settings form generated from the parameter schema would serve every app at once.","position":{"start":{"line":133,"column":54,"offset":9992},"end":{"line":133,"column":317,"offset":10255}}}],"position":{"start":{"line":133,"column":3,"offset":9941},"end":{"line":133,"column":317,"offset":10255}}}],"position":{"start":{"line":133,"column":1,"offset":9939},"end":{"line":133,"column":317,"offset":10255}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Nouns shared between apps.","position":{"start":{"line":134,"column":5,"offset":10260},"end":{"line":134,"column":31,"offset":10286}}}],"position":{"start":{"line":134,"column":3,"offset":10258},"end":{"line":134,"column":33,"offset":10288}}},{"type":"text","value":" Shift Roster, New Hire Onboarding, and Training Tracker each keep their own list of the same café staff. Should one business keep one People list?","position":{"start":{"line":134,"column":33,"offset":10288},"end":{"line":134,"column":180,"offset":10435}}}],"position":{"start":{"line":134,"column":3,"offset":10258},"end":{"line":134,"column":180,"offset":10435}}}],"position":{"start":{"line":134,"column":1,"offset":10256},"end":{"line":134,"column":180,"offset":10435}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Field types the forms lack.","position":{"start":{"line":135,"column":5,"offset":10440},"end":{"line":135,"column":32,"offset":10467}}}],"position":{"start":{"line":135,"column":3,"offset":10438},"end":{"line":135,"column":34,"offset":10469}}},{"type":"text","value":" A rating, a yes/no choice, a color, and amounts stored in cents. Without them, some actions stay a free-text field or stay out of Settings.","position":{"start":{"line":135,"column":34,"offset":10469},"end":{"line":135,"column":174,"offset":10609}}}],"position":{"start":{"line":135,"column":3,"offset":10438},"end":{"line":135,"column":174,"offset":10609}}}],"position":{"start":{"line":135,"column":1,"offset":10436},"end":{"line":135,"column":174,"offset":10609}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The companion's name on the page.","position":{"start":{"line":136,"column":5,"offset":10614},"end":{"line":136,"column":38,"offset":10647}}}],"position":{"start":{"line":136,"column":3,"offset":10612},"end":{"line":136,"column":40,"offset":10649}}},{"type":"text","value":" Pages know the crew member's role but not their name, so page text says \"Your shift scheduler\" while the conversation says \"Nina\".","position":{"start":{"line":136,"column":40,"offset":10649},"end":{"line":136,"column":171,"offset":10780}}}],"position":{"start":{"line":136,"column":3,"offset":10612},"end":{"line":136,"column":171,"offset":10780}}}],"position":{"start":{"line":136,"column":1,"offset":10610},"end":{"line":136,"column":171,"offset":10780}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Narrow tab rows.","position":{"start":{"line":137,"column":5,"offset":10785},"end":{"line":137,"column":21,"offset":10801}}}],"position":{"start":{"line":137,"column":3,"offset":10783},"end":{"line":137,"column":23,"offset":10803}}},{"type":"text","value":" The shell's tab rows trade labels for icons as they narrow. App tabs scroll instead, which works for short labels but is not the shell's rule.","position":{"start":{"line":137,"column":23,"offset":10803},"end":{"line":137,"column":166,"offset":10946}}}],"position":{"start":{"line":137,"column":3,"offset":10783},"end":{"line":137,"column":166,"offset":10946}}}],"position":{"start":{"line":137,"column":1,"offset":10781},"end":{"line":137,"column":166,"offset":10946}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Host-supplied tokens.","position":{"start":{"line":138,"column":5,"offset":10951},"end":{"line":138,"column":26,"offset":10972}}}],"position":{"start":{"line":138,"column":3,"offset":10949},"end":{"line":138,"column":28,"offset":10974}}},{"type":"text","value":" Pages still declare their own colors, spacing, and title sizes. A small shared set (action color, surfaces, title scale) would remove most of the drift this guide polices.","position":{"start":{"line":138,"column":28,"offset":10974},"end":{"line":138,"column":200,"offset":11146}}}],"position":{"start":{"line":138,"column":3,"offset":10949},"end":{"line":138,"column":200,"offset":11146}}}],"position":{"start":{"line":138,"column":1,"offset":10947},"end":{"line":138,"column":200,"offset":11146}}}],"position":{"start":{"line":133,"column":1,"offset":9939},"end":{"line":138,"column":200,"offset":11146}}}],"autoTemplate":true,"templateData":{"items":["Settings for what the person chose at creation. A business name, an event date, or a weekly word goal is a project parameter. Pages can read these but not change them, so most of them cannot appear in Settings today. A host-drawn Settings form generated from the parameter schema would serve every app at once.","Nouns shared between apps. Shift Roster, New Hire Onboarding, and Training Tracker each keep their own list of the same café staff. Should one business keep one People list?","Field types the forms lack. A rating, a yes/no choice, a color, and amounts stored in cents. Without them, some actions stay a free-text field or stay out of Settings.","The companion's name on the page. Pages know the crew member's role but not their name, so page text says \"Your shift scheduler\" while the conversation says \"Nina\".","Narrow tab rows. The shell's tab rows trade labels for icons as they narrow. App tabs scroll instead, which works for short labels but is not the shell's rule.","Host-supplied tokens. Pages still declare their own colors, spacing, and title sizes. A small shared set (action color, surfaces, title scale) would remove most of the drift this guide polices."],"ordered":false,"title":"Open questions"}},{"id":"changes","startTime":541,"duration":9,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Changes","position":{"start":{"line":140,"column":4,"offset":11151},"end":{"line":140,"column":11,"offset":11158}}}],"position":{"start":{"line":140,"column":1,"offset":11148},"end":{"line":140,"column":11,"offset":11158}}},"title":"Changes","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"November 7, 2026.","position":{"start":{"line":142,"column":5,"offset":11164},"end":{"line":142,"column":22,"offset":11181}}}],"position":{"start":{"line":142,"column":3,"offset":11162},"end":{"line":142,"column":24,"offset":11183}}},{"type":"text","value":" First version, from a review of 43 catalog apps. It covers the five app shapes, Home and noun tabs, dialog actions, row actions, inline settings, and value formatting.","position":{"start":{"line":142,"column":24,"offset":11183},"end":{"line":142,"column":192,"offset":11351}}}],"position":{"start":{"line":142,"column":3,"offset":11162},"end":{"line":142,"column":192,"offset":11351}}}],"position":{"start":{"line":142,"column":1,"offset":11160},"end":{"line":142,"column":192,"offset":11351}}}],"position":{"start":{"line":142,"column":1,"offset":11160},"end":{"line":142,"column":192,"offset":11351}}}],"autoTemplate":true,"templateData":{"items":["November 7, 2026. First version, from a review of 43 catalog apps. It covers the five app shapes, Home and noun tabs, dialog actions, row actions, inline settings, and value formatting."],"ordered":false,"title":"Changes"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"This guide says how an app page is organized and how people act in it.","startTime":0,"endTime":3.1,"audioSegment":0},{"text":"The page style guide covers what Gezel supplies to a page and how it looks: fonts,","startTime":3.1,"endTime":6.2,"audioSegment":0},{"text":"color, controls, and states.","startTime":6.2,"endTime":9.3,"audioSegment":0},{"text":"Using the Gezel page APIs covers the components named here.","startTime":9.3,"endTime":12.4,"audioSegment":0},{"text":"It is a living standard.","startTime":12.4,"endTime":15.5,"audioSegment":0},{"text":"Each practice has a number,","startTime":15.5,"endTime":18.6,"audioSegment":0},{"text":"so a review can cite it (\"B3: this form picks a record that is already on screen\").","startTime":18.6,"endTime":21.7,"audioSegment":0},{"text":"The open questions at the end record what is not settled.","startTime":21.7,"endTime":24.8,"audioSegment":0},{"text":"When a pass over the apps teaches something new,","startTime":24.8,"endTime":27.900000000000002,"audioSegment":0},{"text":"change the practice and add a line to the change list.","startTime":27.900000000000002,"endTime":31,"audioSegment":0},{"text":"Most apps fall into one of five shapes.","startTime":31,"endTime":33.69230769230769,"audioSegment":0},{"text":"Pick the shape first; it decides the structure.","startTime":33.69230769230769,"endTime":36.38461538461539,"audioSegment":0},{"text":"Shape Examples Structure","startTime":36.38461538461539,"endTime":39.07692307692308,"audioSegment":0},{"text":"Workspace Shift Roster, Sales Pipeline, Event Desk Home,","startTime":39.07692307692308,"endTime":41.769230769230774,"audioSegment":0},{"text":"then one tab per noun the person manages, then Settings when there is something to set","startTime":41.769230769230774,"endTime":44.46153846153847,"audioSegment":0},{"text":"Single list Household Manual,","startTime":44.46153846153847,"endTime":47.15384615384615,"audioSegment":0},{"text":"Life Binder One view with a key bar under the title and actions on each row","startTime":47.15384615384615,"endTime":49.84615384615385,"audioSegment":0},{"text":"Board Checkers, Chess, Word Clues The board is the page.","startTime":49.84615384615385,"endTime":52.53846153846154,"audioSegment":0},{"text":"New game opens a dialog","startTime":52.53846153846154,"endTime":55.23076923076923,"audioSegment":0},{"text":"Practice Flashcards, Language Trainer Home is today's practice,","startTime":55.23076923076923,"endTime":57.92307692307693,"audioSegment":0},{"text":"with tabs for what you collect and for progress","startTime":57.92307692307693,"endTime":60.61538461538461,"audioSegment":0},{"text":"Collection Media Library, Design Scheme The gallery is the page,","startTime":60.61538461538461,"endTime":63.30769230769231,"audioSegment":0},{"text":"with filter keys, an Add key, and a preview dialog per item","startTime":63.30769230769231,"endTime":66,"audioSegment":0},{"text":"A1.","startTime":66,"endTime":69.03225806451613,"audioSegment":0},{"text":"One title and one summary line.","startTime":69.03225806451613,"endTime":72.06451612903226,"audioSegment":0},{"text":"The h1 names the person's subject when there is one (\"Trip: Lisbon\",","startTime":72.06451612903226,"endTime":75.09677419354838,"audioSegment":0},{"text":"\"The Glass Cartographer\"), otherwise the app.","startTime":75.09677419354838,"endTime":78.12903225806451,"audioSegment":0},{"text":"Under it, one line says the state in plain words and what needs attention: \"The week is approved,","startTime":78.12903225806451,"endTime":81.16129032258064,"audioSegment":0},{"text":"with 2 spots still open.\" Compute it from the data; never leave a static description there. A2.","startTime":81.16129032258064,"endTime":84.19354838709677,"audioSegment":0},{"text":"Home comes first and answers \"what needs me now?\" In a workspace app, Home holds up to four summary tiles,","startTime":84.19354838709677,"endTime":87.2258064516129,"audioSegment":0},{"text":"the list of things that need the person, the app's main view, and the app's top two or three actions. A3.","startTime":87.2258064516129,"endTime":90.25806451612902,"audioSegment":0},{"text":"One tab per noun.","startTime":90.25806451612902,"endTime":93.29032258064515,"audioSegment":0},{"text":"Each thing the person manages (People, Deals, Quotes,","startTime":93.29032258064515,"endTime":96.32258064516128,"audioSegment":0},{"text":"Vendors) gets a tab with its full list, its search, and its create and update actions.","startTime":96.32258064516128,"endTime":99.35483870967741,"audioSegment":0},{"text":"Label tabs with short plural nouns in sentence case.","startTime":99.35483870967741,"endTime":102.38709677419355,"audioSegment":0},{"text":"Two to five tabs is right; more means two nouns should merge. A4.","startTime":102.38709677419355,"endTime":105.41935483870968,"audioSegment":0},{"text":"Settings comes last, and only when there is something to set.","startTime":105.41935483870968,"endTime":108.45161290322581,"audioSegment":0},{"text":"Rules, rates, targets, and event or campaign details belong there.","startTime":108.45161290322581,"endTime":111.48387096774194,"audioSegment":0},{"text":"Settings forms are open on the tab,","startTime":111.48387096774194,"endTime":114.51612903225806,"audioSegment":0},{"text":"not behind a key, and show the values saved now.","startTime":114.51612903225806,"endTime":117.54838709677419,"audioSegment":0},{"text":"Never show an empty Settings tab. A5.","startTime":117.54838709677419,"endTime":120.58064516129032,"audioSegment":0},{"text":"No tab repeats Home.","startTime":120.58064516129032,"endTime":123.61290322580645,"audioSegment":0},{"text":"When the app's main view already is a noun's list,","startTime":123.61290322580645,"endTime":126.64516129032258,"audioSegment":0},{"text":"that noun lives on Home and gets no tab of its own.","startTime":126.64516129032258,"endTime":129.67741935483872,"audioSegment":0},{"text":"Shift Roster's week grid is its list of shifts,","startTime":129.67741935483872,"endTime":132.70967741935482,"audioSegment":0},{"text":"so Shift Roster has Home, People, and Settings, and no Shifts tab. A6.","startTime":132.70967741935482,"endTime":135.74193548387098,"audioSegment":0},{"text":"Declare navigation; don't derive it from headings.","startTime":135.74193548387098,"endTime":138.7741935483871,"audioSegment":0},{"text":"Many section headings are dashboard panels (\"Coming up\",","startTime":138.7741935483871,"endTime":141.80645161290323,"audioSegment":0},{"text":"\"Reorder now\"), not places to go.","startTime":141.80645161290323,"endTime":144.83870967741936,"audioSegment":0},{"text":"Name the tabs and what each holds.","startTime":144.83870967741936,"endTime":147.8709677419355,"audioSegment":0},{"text":"Do not add an \"On this page\" row of links. A7.","startTime":147.8709677419355,"endTime":150.90322580645162,"audioSegment":0},{"text":"A single-view app has no tabs.","startTime":150.90322580645162,"endTime":153.93548387096774,"audioSegment":0},{"text":"A key bar under the title and actions on each row are enough.","startTime":153.93548387096774,"endTime":156.96774193548387,"audioSegment":0},{"text":"Add tabs when a second noun needs its own list, not before.","startTime":156.96774193548387,"endTime":160,"audioSegment":0},{"text":"B1.","startTime":160,"endTime":163,"audioSegment":0},{"text":"An action is a key that opens a dialog.","startTime":163,"endTime":166,"audioSegment":0},{"text":"Never put a form on the page behind an expandable card.","startTime":166,"endTime":169,"audioSegment":0},{"text":"The disclosure presentation of actionForm exists only for older pages.","startTime":169,"endTime":172,"audioSegment":0},{"text":"One exception: a quick add of one field and its key (a grocery item,","startTime":172,"endTime":175,"audioSegment":0},{"text":"a record's title) can sit open at the top of the list it adds to. B2.","startTime":175,"endTime":178,"audioSegment":0},{"text":"Three keys at most, and one filled primary per view.","startTime":178,"endTime":181,"audioSegment":0},{"text":"The primary is the action that creates or commits.","startTime":181,"endTime":184,"audioSegment":0},{"text":"When the view already has a commit key of its own (Approve the week),","startTime":184,"endTime":187,"audioSegment":0},{"text":"every action key in that view is secondary. B3.","startTime":187,"endTime":190,"audioSegment":0},{"text":"Act on the record where it is.","startTime":190,"endTime":193,"audioSegment":0},{"text":"When a form starts by picking a record that is already on screen (a shift, a deal, an invoice),","startTime":193,"endTime":196,"audioSegment":0},{"text":"put a small key on that record's row or card instead: Fill, Time off, Move, Mark paid.","startTime":196,"endTime":199,"audioSegment":0},{"text":"It opens the same dialog with the record filled in.","startTime":199,"endTime":202,"audioSegment":0},{"text":"Keep a general key only when people also start that action from nowhere in particular. B4.","startTime":202,"endTime":205,"audioSegment":0},{"text":"Dialogs follow one pattern.","startTime":205,"endTime":208,"audioSegment":0},{"text":"The title is the action (\"Add a person\"),","startTime":208,"endTime":211,"audioSegment":0},{"text":"and fields sit in one column.","startTime":211,"endTime":214,"audioSegment":0},{"text":"Cancel comes before the verb on the right (\"Assign\", \"Add person\").","startTime":214,"endTime":217,"audioSegment":0},{"text":"Escape and a click on the backdrop close the dialog.","startTime":217,"endTime":220,"audioSegment":0},{"text":"A failed save keeps the dialog open with the typed values and says what went wrong.","startTime":220,"endTime":223,"audioSegment":0},{"text":"A successful save closes it and confirms beside the key that opened it,","startTime":223,"endTime":226,"audioSegment":0},{"text":"and the page shows the change. B5.","startTime":226,"endTime":229,"audioSegment":0},{"text":"Ask before discarding work.","startTime":229,"endTime":232,"audioSegment":0},{"text":"New game, remove,","startTime":232,"endTime":235,"audioSegment":0},{"text":"and anything else that loses state opens a dialog first. B6.","startTime":235,"endTime":238,"audioSegment":0},{"text":"Keys name a verb and its object.","startTime":238,"endTime":241,"audioSegment":0},{"text":"\"Add a shift\", in sentence case.","startTime":241,"endTime":244,"audioSegment":0},{"text":"When the dialog title is long, give the key a shorter label.","startTime":244,"endTime":247,"audioSegment":0},{"text":"C1.","startTime":247,"endTime":249.57142857142858,"audioSegment":0},{"text":"Show values the way people say them.","startTime":249.57142857142858,"endTime":252.14285714285714,"audioSegment":0},{"text":"Write \"Thu, Nov 12\", \"$1,529\", and \"In review\",","startTime":252.14285714285714,"endTime":254.71428571428572,"audioSegment":0},{"text":"never 2026-11-12, 1529, in-review, or an internal id like ch-4.","startTime":254.71428571428572,"endTime":257.2857142857143,"audioSegment":0},{"text":"Do date math in local time. C2.","startTime":257.2857142857143,"endTime":259.85714285714283,"audioSegment":0},{"text":"Color follows the value.","startTime":259.85714285714283,"endTime":262.42857142857144,"audioSegment":0},{"text":"A count is ink.","startTime":262.42857142857144,"endTime":265,"audioSegment":0},{"text":"Red and amber mean a problem now,","startTime":265,"endTime":267.57142857142856,"audioSegment":0},{"text":"so 0 conflicts is not red.","startTime":267.57142857142856,"endTime":270.14285714285717,"audioSegment":0},{"text":"The accent is not a color for counts. C3.","startTime":270.14285714285717,"endTime":272.7142857142857,"audioSegment":0},{"text":"Empty states span their list and say how to fill it.","startTime":272.7142857142857,"endTime":275.2857142857143,"audioSegment":0},{"text":"\"Open spots appear here once the week has shifts.\" Never squeeze the message into a list's first grid column. C4.","startTime":275.2857142857143,"endTime":277.8571428571429,"audioSegment":0},{"text":"Say when a list is cut.","startTime":277.8571428571429,"endTime":280.42857142857144,"audioSegment":0},{"text":"Write \"Showing 4 of 12\" when only part of a list is shown. C5.","startTime":280.42857142857144,"endTime":283,"audioSegment":0},{"text":"Search only long lists.","startTime":283,"endTime":285.57142857142856,"audioSegment":0},{"text":"Show a search box from about eight items, inside the list's section,","startTime":285.57142857142856,"endTime":288.14285714285717,"audioSegment":0},{"text":"with a placeholder that says what to type (\"Name or role\").","startTime":288.14285714285717,"endTime":290.7142857142857,"audioSegment":0},{"text":"Do not count the empty-state row as an item. C6.","startTime":290.7142857142857,"endTime":293.2857142857143,"audioSegment":0},{"text":"Everything the companion can change has a place on the page.","startTime":293.2857142857143,"endTime":295.8571428571429,"audioSegment":0},{"text":"If it can edit sessions, past visits,","startTime":295.8571428571429,"endTime":298.42857142857144,"audioSegment":0},{"text":"or a voice guide, the person can see them somewhere.","startTime":298.42857142857144,"endTime":301,"audioSegment":0},{"text":"The page style guide holds the detail.","startTime":301,"endTime":303.29411764705884,"audioSegment":0},{"text":"These are the rules apps most often break. D1.","startTime":303.29411764705884,"endTime":305.5882352941176,"audioSegment":0},{"text":"Actions use Gezel's action color.","startTime":305.5882352941176,"endTime":307.88235294117646,"audioSegment":0},{"text":"Primary keys, focus rings, and Send use terracotta.","startTime":307.88235294117646,"endTime":310.1764705882353,"audioSegment":0},{"text":"The app's own accent is identity: charts, bars, and chips.","startTime":310.1764705882353,"endTime":312.47058823529414,"audioSegment":0},{"text":"Never set --gezel-component-accent to restyle Gezel's components in an app color. D2.","startTime":312.47058823529414,"endTime":314.7647058823529,"audioSegment":0},{"text":"One demo banner.","startTime":314.7647058823529,"endTime":317.05882352941177,"audioSegment":0},{"text":"The banner is a quiet parchment strip with Reset demo,","startTime":317.05882352941177,"endTime":319.3529411764706,"audioSegment":0},{"text":"the same in every app.","startTime":319.3529411764706,"endTime":321.6470588235294,"audioSegment":0},{"text":"It is a notice, not an action or an error. D3.","startTime":321.6470588235294,"endTime":323.94117647058823,"audioSegment":0},{"text":"Headings use PT Serif at weight 400.","startTime":323.94117647058823,"endTime":326.2352941176471,"audioSegment":0},{"text":"Small uppercase labels and eyebrows use the UI sans.","startTime":326.2352941176471,"endTime":328.52941176470586,"audioSegment":0},{"text":"Do not mark one up as a styled-down h2 or h3,","startTime":328.52941176470586,"endTime":330.8235294117647,"audioSegment":0},{"text":"which turns it serif. D4.","startTime":330.8235294117647,"endTime":333.11764705882354,"audioSegment":0},{"text":"Body text is about 16px.","startTime":333.11764705882354,"endTime":335.4117647058823,"audioSegment":0},{"text":"Nothing you can press is smaller than 28px,","startTime":335.4117647058823,"endTime":337.70588235294116,"audioSegment":0},{"text":"and keys are 44px tall.","startTime":337.70588235294116,"endTime":340,"audioSegment":0},{"text":"E1.","startTime":340,"endTime":342.44444444444446,"audioSegment":0},{"text":"The conversation's title says where you are,","startTime":342.44444444444446,"endTime":344.8888888888889,"audioSegment":0},{"text":"and its description suggests what to ask.","startTime":344.8888888888889,"endTime":347.3333333333333,"audioSegment":0},{"text":"For example: \"At the scheduling desk\" and \"Add a shift,","startTime":347.3333333333333,"endTime":349.77777777777777,"audioSegment":0},{"text":"mark when someone can't work, or ask where the week is short.\" E2.","startTime":349.77777777777777,"endTime":352.22222222222223,"audioSegment":0},{"text":"Keep the composer's placeholder to about 28 characters. For example,","startTime":352.22222222222223,"endTime":354.6666666666667,"audioSegment":0},{"text":"\"What changed this week?\" A longer one is cut off in the panel. E3.","startTime":354.6666666666667,"endTime":357.1111111111111,"audioSegment":0},{"text":"Demo suggestions do real work on the page.","startTime":357.1111111111111,"endTime":359.55555555555554,"audioSegment":0},{"text":"See the sample conversation.","startTime":359.55555555555554,"endTime":362,"audioSegment":0},{"text":"The components carry most of these practices.","startTime":362,"endTime":364.42857142857144,"audioSegment":0},{"text":"A page on a current host (page components version 2) can use:","startTime":364.42857142857144,"endTime":366.85714285714283,"audioSegment":0},{"text":"actionForm(mount, { presentation: 'dialog', primary, buttonLabel, ... }).","startTime":366.85714285714283,"endTime":369.2857142857143,"audioSegment":0},{"text":"It draws a key that opens the form in a modal.","startTime":369.2857142857143,"endTime":371.7142857142857,"audioSegment":0},{"text":"Its handle's open(values) opens the form filled in, for a row's key.","startTime":371.7142857142857,"endTime":374.14285714285717,"audioSegment":0},{"text":"Use trigger: false for a dialog that only rows open.","startTime":374.14285714285717,"endTime":376.57142857142856,"audioSegment":0},{"text":"actionForm(mount, { presentation: 'inline' }) for a settings form,","startTime":376.57142857142856,"endTime":379,"audioSegment":0},{"text":"with reset(values) to show what is saved.","startTime":379,"endTime":381.42857142857144,"audioSegment":0},{"text":"tabs(mount, { tabs: [{ id, label, panel,","startTime":381.42857142857144,"endTime":383.85714285714283,"audioSegment":0},{"text":"badge }] }) for underline tabs over the page's own panels.","startTime":383.85714285714283,"endTime":386.2857142857143,"audioSegment":0},{"text":"collectionFilter(mount, { ..., placeholder,","startTime":386.2857142857143,"endTime":388.7142857142857,"audioSegment":0},{"text":"minItems: 8 }) for search that appears only when it helps.","startTime":388.7142857142857,"endTime":391.1428571428571,"audioSegment":0},{"text":"Feature-detect version 2 (gezel.ui.components.version >= 2 and typeof tabs === 'function').","startTime":391.1428571428571,"endTime":393.57142857142856,"audioSegment":0},{"text":"Keep an older host usable: there,","startTime":393.57142857142856,"endTime":396,"audioSegment":0},{"text":"an action form falls back to a disclosure.","startTime":396,"endTime":398.42857142857144,"audioSegment":0},{"text":"Catalog apps in Gilde share one composition script, application.js.","startTime":398.42857142857144,"endTime":400.85714285714283,"audioSegment":0},{"text":"Its config declares the structure, and the script builds the tabs,","startTime":400.85714285714283,"endTime":403.2857142857143,"audioSegment":0},{"text":"keys, settings forms, and row dialogs from it: \"tabs\": [","startTime":403.2857142857143,"endTime":405.7142857142857,"audioSegment":0},{"text":"{ \"id\": \"home\", \"label\": \"Home\", \"sections\": [\".tiles\", \"#gaps-section\", \"#week-section\"],","startTime":405.7142857142857,"endTime":408.1428571428571,"audioSegment":0},{"text":"\"actions\": [\"add_shift\", \"assign_shift\", \"set_availability\"], \"primary\": false },","startTime":408.1428571428571,"endTime":410.57142857142856,"audioSegment":0},{"text":"{ \"id\": \"people\", \"label\": \"People\", \"sections\": [\"#hours-section\", \"#away-section\"],","startTime":410.57142857142856,"endTime":413,"audioSegment":0},{"text":"\"actions\": [\"add_staff\", \"set_availability\"] },","startTime":413,"endTime":415.42857142857144,"audioSegment":0},{"text":"{ \"id\": \"settings\", \"label\": \"Settings\", \"settings\": [\"set_rules\"], \"sections\": [\"#rules-section\"] } ]","startTime":415.42857142857144,"endTime":417.85714285714283,"audioSegment":0},{"text":"A row action is a button in the page's own markup.","startTime":417.85714285714283,"endTime":420.2857142857143,"audioSegment":0},{"text":"The shared script opens the matching dialog filled in:","startTime":420.2857142857143,"endTime":422.7142857142857,"audioSegment":0},{"text":"const fill = document.createElement('button');","startTime":422.7142857142857,"endTime":425.1428571428571,"audioSegment":0},{"text":"fill.type = 'button';","startTime":425.1428571428571,"endTime":427.57142857142856,"audioSegment":0},{"text":"fill.className = 'key';","startTime":427.57142857142856,"endTime":430,"audioSegment":0},{"text":"fill.textContent = 'Fill';","startTime":430,"endTime":432.42857142857144,"audioSegment":0},{"text":"fill.setAttribute('aria-label', `Fill ${dayName} ${shift.fields.start} ${shift.fields.role}`);","startTime":432.42857142857144,"endTime":434.85714285714283,"audioSegment":0},{"text":"fill.setAttribute('data-app-action', 'assign_shift');","startTime":434.85714285714283,"endTime":437.2857142857143,"audioSegment":0},{"text":"fill.setAttribute('data-app-values', JSON.stringify({ id: shift.id }));","startTime":437.2857142857143,"endTime":439.7142857142857,"audioSegment":0},{"text":"Shift Roster 1.1.0 is the reference implementation.","startTime":439.7142857142857,"endTime":442.1428571428571,"audioSegment":0},{"text":"Its page shows Home, People, and Settings, Fill keys on open spots,","startTime":442.1428571428571,"endTime":444.57142857142856,"audioSegment":0},{"text":"Time off keys on each person, and a settings form that shows the saved rules.","startTime":444.57142857142856,"endTime":447,"audioSegment":0},{"text":"The shape is chosen, and the structure matches it (A2–A7).","startTime":447,"endTime":449.61538461538464,"audioSegment":0},{"text":"The summary line says the state and what needs attention (A1).","startTime":449.61538461538464,"endTime":452.2307692307692,"audioSegment":0},{"text":"Every action opens a dialog.","startTime":452.2307692307692,"endTime":454.84615384615387,"audioSegment":0},{"text":"No view has more than three keys or more than one primary (B1, B2).","startTime":454.84615384615387,"endTime":457.46153846153845,"audioSegment":0},{"text":"Forms that pick an on-screen record are row keys (B3).","startTime":457.46153846153845,"endTime":460.0769230769231,"audioSegment":0},{"text":"No ISO dates, raw enum values, or ids are shown (C1).","startTime":460.0769230769231,"endTime":462.6923076923077,"audioSegment":0},{"text":"Tones follow values (C2).","startTime":462.6923076923077,"endTime":465.3076923076923,"audioSegment":0},{"text":"Empty states span their list.","startTime":465.3076923076923,"endTime":467.9230769230769,"audioSegment":0},{"text":"Search appears only on long lists, with a real placeholder (C3, C5).","startTime":467.9230769230769,"endTime":470.53846153846155,"audioSegment":0},{"text":"Actions and focus use the action color.","startTime":470.53846153846155,"endTime":473.15384615384613,"audioSegment":0},{"text":"The demo banner is the shared one (D1, D2).","startTime":473.15384615384613,"endTime":475.7692307692308,"audioSegment":0},{"text":"The page works at 420px wide without scrolling sideways,","startTime":475.7692307692308,"endTime":478.38461538461536,"audioSegment":0},{"text":"in dark mode, and with the keyboard.","startTime":478.38461538461536,"endTime":481,"audioSegment":0},{"text":"Settings for what the person chose at creation.","startTime":481,"endTime":483.5,"audioSegment":0},{"text":"A business name, an event date,","startTime":483.5,"endTime":486,"audioSegment":0},{"text":"or a weekly word goal is a project parameter.","startTime":486,"endTime":488.5,"audioSegment":0},{"text":"Pages can read these but not change them,","startTime":488.5,"endTime":491,"audioSegment":0},{"text":"so most of them cannot appear in Settings today.","startTime":491,"endTime":493.5,"audioSegment":0},{"text":"A host-drawn Settings form generated from the parameter schema would serve every app at once.","startTime":493.5,"endTime":496,"audioSegment":0},{"text":"Nouns shared between apps.","startTime":496,"endTime":498.5,"audioSegment":0},{"text":"Shift Roster, New Hire Onboarding,","startTime":498.5,"endTime":501,"audioSegment":0},{"text":"and Training Tracker each keep their own list of the same café staff.","startTime":501,"endTime":503.5,"audioSegment":0},{"text":"Should one business keep one People list?","startTime":503.5,"endTime":506,"audioSegment":0},{"text":"Field types the forms lack.","startTime":506,"endTime":508.5,"audioSegment":0},{"text":"A rating, a yes/no choice, a color, and amounts stored in cents. Without them,","startTime":508.5,"endTime":511,"audioSegment":0},{"text":"some actions stay a free-text field or stay out of Settings.","startTime":511,"endTime":513.5,"audioSegment":0},{"text":"The companion's name on the page.","startTime":513.5,"endTime":516,"audioSegment":0},{"text":"Pages know the crew member's role but not their name,","startTime":516,"endTime":518.5,"audioSegment":0},{"text":"so page text says \"Your shift scheduler\" while the conversation says \"Nina\".","startTime":518.5,"endTime":521,"audioSegment":0},{"text":"Narrow tab rows.","startTime":521,"endTime":523.5,"audioSegment":0},{"text":"The shell's tab rows trade labels for icons as they narrow.","startTime":523.5,"endTime":526,"audioSegment":0},{"text":"App tabs scroll instead,","startTime":526,"endTime":528.5,"audioSegment":0},{"text":"which works for short labels but is not the shell's rule.","startTime":528.5,"endTime":531,"audioSegment":0},{"text":"Host-supplied tokens.","startTime":531,"endTime":533.5,"audioSegment":0},{"text":"Pages still declare their own colors, spacing, and title sizes.","startTime":533.5,"endTime":536,"audioSegment":0},{"text":"A small shared set (action color, surfaces,","startTime":536,"endTime":538.5,"audioSegment":0},{"text":"title scale) would remove most of the drift this guide polices.","startTime":538.5,"endTime":541,"audioSegment":0},{"text":"November 7, 2026.","startTime":541,"endTime":543.25,"audioSegment":0},{"text":"First version, from a review of 43 catalog apps.","startTime":543.25,"endTime":545.5,"audioSegment":0},{"text":"It covers the five app shapes, Home and noun tabs, dialog actions,","startTime":545.5,"endTime":547.75,"audioSegment":0},{"text":"row actions, inline settings, and value formatting.","startTime":547.75,"endTime":550,"audioSegment":0}],"version":1},"startBlock":{"title":"Gezel app UX guide","subtitle":"This guide says how an app page is organized and how people act in it. The page style guide covers what Gezel supplies to a page and how it looks: fonts, color, controls, and states. Using the Gezel page APIs covers the components named here.","ambientMotion":"zoomIn"}}</script>
