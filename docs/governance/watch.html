ition":{"start":{"line":56,"column":5,"offset":4819},"end":{"line":56,"column":26,"offset":4840}}}],"position":{"start":{"line":56,"column":3,"offset":4817},"end":{"line":56,"column":28,"offset":4842}}},{"type":"text","value":" There is no Bendyline sign-in and no Bendyline service in the path of your work, so an installed copy keeps working.","position":{"start":{"line":56,"column":28,"offset":4842},"end":{"line":56,"column":145,"offset":4959}}}],"position":{"start":{"line":56,"column":3,"offset":4817},"end":{"line":56,"column":145,"offset":4959}}}],"position":{"start":{"line":56,"column":1,"offset":4815},"end":{"line":56,"column":145,"offset":4959}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Standard model files.","position":{"start":{"line":57,"column":5,"offset":4964},"end":{"line":57,"column":26,"offset":4985}}}],"position":{"start":{"line":57,"column":3,"offset":4962},"end":{"line":57,"column":28,"offset":4987}}},{"type":"text","value":" Models are ordinary GGUF and MLX model files, downloaded from Hugging Face and usable by other tools.","position":{"start":{"line":57,"column":28,"offset":4987},"end":{"line":57,"column":130,"offset":5089}}}],"position":{"start":{"line":57,"column":3,"offset":4962},"end":{"line":57,"column":130,"offset":5089}}}],"position":{"start":{"line":57,"column":1,"offset":4960},"end":{"line":57,"column":130,"offset":5089}}}],"position":{"start":{"line":54,"column":1,"offset":4547},"end":{"line":57,"column":130,"offset":5089}}},{"type":"paragraph","children":[{"type":"text","value":"What would stop is new releases. Engine downloads and update checks go to Gezel's GitHub releases, so a fresh install would need those releases to stay up, or someone to build them from source.","position":{"start":{"line":59,"column":1,"offset":5091},"end":{"line":59,"column":194,"offset":5284}}}],"position":{"start":{"line":59,"column":1,"offset":5091},"end":{"line":59,"column":194,"offset":5284}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel is open source under the MIT license.","startTime":0,"endTime":3.6,"audioSegment":0},{"text":"Anyone can read it, audit it, fork it and build it.","startTime":3.6,"endTime":7.2,"audioSegment":0},{"text":"It is not open to outside code: every line in the repository is written by one team at Bendyline.","startTime":7.2,"endTime":10.8,"audioSegment":0},{"text":"This page explains why, how an idea from outside reaches a release anyway,","startTime":10.8,"endTime":14.4,"audioSegment":0},{"text":"and what checks a change has to pass.","startTime":14.4,"endTime":18,"audioSegment":0},{"text":"Gezel runs scripts that models write,","startTime":18,"endTime":21.1,"audioSegment":0},{"text":"on people's own machines, with access to their files.","startTime":21.1,"endTime":24.2,"audioSegment":0},{"text":"For software like that, we think the safer arrangement is one accountable author for every line,","startTime":24.2,"endTime":27.3,"audioSegment":0},{"text":"one set of conventions throughout, and no path by which a change reaches you without that team having written and reviewed it.","startTime":27.3,"endTime":30.4,"audioSegment":0},{"text":"SQLite has worked this way for more than twenty years,","startTime":30.4,"endTime":33.5,"audioSegment":0},{"text":"for much the same reasons.","startTime":33.5,"endTime":36.6,"audioSegment":0},{"text":"So pull requests that change source code, tests,","startTime":36.6,"endTime":39.7,"audioSegment":0},{"text":"build configuration or dependencies are closed, however good they are.","startTime":39.7,"endTime":42.8,"audioSegment":0},{"text":"That is not a judgement on the change.","startTime":42.8,"endTime":45.900000000000006,"audioSegment":0},{"text":"It keeps the answer to \"who wrote this?\" simple.","startTime":45.900000000000006,"endTime":49,"audioSegment":0},{"text":"Ideas from outside are welcome, and this is how they get in:","startTime":49,"endTime":51.666666666666664,"audioSegment":0},{"text":"Write the problem down.","startTime":51.666666666666664,"endTime":54.333333333333336,"audioSegment":0},{"text":"Add a Markdown document to the specs/ folder: the problem,","startTime":54.333333333333336,"endTime":57,"audioSegment":0},{"text":"the behavior you want, the constraints, and examples or acceptance criteria.","startTime":57,"endTime":59.666666666666664,"audioSegment":0},{"text":"Open a pull request containing only that document.","startTime":59.666666666666664,"endTime":62.33333333333333,"audioSegment":0},{"text":"It is a request for consideration,","startTime":62.33333333333333,"endTime":65,"audioSegment":0},{"text":"not a commitment that it will be built.","startTime":65,"endTime":67.66666666666666,"audioSegment":0},{"text":"If it is accepted,","startTime":67.66666666666666,"endTime":70.33333333333333,"audioSegment":0},{"text":"the team implements it in the codebase's own conventions, with its tests.","startTime":70.33333333333333,"endTime":73,"audioSegment":0},{"text":"For something smaller, open an issue.","startTime":73,"endTime":75.66666666666666,"audioSegment":0},{"text":"The submission terms in CONTRIBUTING.md grant Bendyline and the public a license to use what you submit,","startTime":75.66666666666666,"endTime":78.33333333333333,"audioSegment":0},{"text":"so an accepted idea can ship without any further paperwork.","startTime":78.33333333333333,"endTime":81,"audioSegment":0},{"text":"Much of Gezel's code is written by AI coding agents,","startTime":81,"endTime":84.3125,"audioSegment":0},{"text":"directed by the team.","startTime":84.3125,"endTime":87.625,"audioSegment":0},{"text":"Nothing written that way reaches a release on the agent's say-so.","startTime":87.625,"endTime":90.9375,"audioSegment":0},{"text":"Every change lands through the team and passes the same automated checks:","startTime":90.9375,"endTime":94.25,"audioSegment":0},{"text":"Build, lint, type check and the unit suites, with the UI, service and terminal suites repeated three times on every change,","startTime":94.25,"endTime":97.5625,"audioSegment":0},{"text":"so a test that only sometimes passes is caught rather than shipped.","startTime":97.5625,"endTime":100.875,"audioSegment":0},{"text":"Model-facing contract checks.","startTime":100.875,"endTime":104.1875,"audioSegment":0},{"text":"The tool names and descriptions a model sees are checked against what each role is really allowed to call,","startTime":104.1875,"endTime":107.5,"audioSegment":0},{"text":"so a prompt cannot advertise a tool the security level has removed.","startTime":107.5,"endTime":110.8125,"audioSegment":0},{"text":"Platform checks for the Windows service,","startTime":110.8125,"endTime":114.125,"audioSegment":0},{"text":"its sandbox and engine discovery, on both x64 and ARM.","startTime":114.125,"endTime":117.4375,"audioSegment":0},{"text":"Packaging checks on a release-stamped build: the packaged service loads,","startTime":117.4375,"endTime":120.75,"audioSegment":0},{"text":"the published package shapes are right, and a software bill of materials is generated.","startTime":120.75,"endTime":124.0625,"audioSegment":0},{"text":"Pinned dependencies in the build itself.","startTime":124.0625,"endTime":127.375,"audioSegment":0},{"text":"Every GitHub Action the workflows use is pinned to an exact commit,","startTime":127.375,"endTime":130.6875,"audioSegment":0},{"text":"and a scheduled audit raises an alarm on known vulnerabilities in production dependencies.","startTime":130.6875,"endTime":134,"audioSegment":0},{"text":"The security architecture document is the reference for every change that touches what a model can reach.","startTime":134,"endTime":137,"audioSegment":0},{"text":"It ends with the rules a change must not break, among them:","startTime":137,"endTime":140,"audioSegment":0},{"text":"Check a permission where the action happens,","startTime":140,"endTime":143,"audioSegment":0},{"text":"not only where a tool is offered, so no route around the check exists.","startTime":143,"endTime":146,"audioSegment":0},{"text":"Work out who is asking from their credentials,","startTime":146,"endTime":149,"audioSegment":0},{"text":"never from what the request claims about itself.","startTime":149,"endTime":152,"audioSegment":0},{"text":"Keep secrets on the service side;","startTime":152,"endTime":155,"audioSegment":0},{"text":"scripts and tools get results, never keys.","startTime":155,"endTime":158,"audioSegment":0},{"text":"Send paths through the path-safety helpers and outbound requests through the request guard,","startTime":158,"endTime":161,"audioSegment":0},{"text":"and start processes without a shell.","startTime":161,"endTime":164,"audioSegment":0},{"text":"Classify every new model-reachable tool against the security levels before it ships.","startTime":164,"endTime":167,"audioSegment":0},{"text":"Make code and comments agree.","startTime":167,"endTime":170,"audioSegment":0},{"text":"A comment that promises a protection the code does not have is treated as a defect.","startTime":170,"endTime":173,"audioSegment":0},{"text":"Every release publishes a SHA256SUMS manifest and SLSA build provenance for each installer,","startTime":173,"endTime":176.66666666666666,"audioSegment":0},{"text":"and the macOS and Windows installers are signed.","startTime":176.66666666666666,"endTime":180.33333333333334,"audioSegment":0},{"text":"Verifying your download shows how to check that what you installed is what the release pipeline built.","startTime":180.33333333333334,"endTime":184,"audioSegment":0},{"text":"Email support@bendyline.com with the subject [Gezel Security].","startTime":184,"endTime":186.33333333333334,"audioSegment":0},{"text":"Please do not post exploitable details in a public issue.","startTime":186.33333333333334,"endTime":188.66666666666666,"audioSegment":0},{"text":"Fixes are made against the latest release.","startTime":188.66666666666666,"endTime":191,"audioSegment":0},{"text":"Nothing about how Gezel runs depends on us staying in business: The license.","startTime":191,"endTime":193.85714285714286,"audioSegment":0},{"text":"MIT lets anyone fork the code and carry on,","startTime":193.85714285714286,"endTime":196.71428571428572,"audioSegment":0},{"text":"and the catalog of craftbooks, roles and models is MIT-licensed too. Your data.","startTime":196.71428571428572,"endTime":199.57142857142858,"audioSegment":0},{"text":"Projects, crews, memories and history are Markdown,","startTime":199.57142857142858,"endTime":202.42857142857142,"audioSegment":0},{"text":"JSON and SQLite files on your own machine, readable without Gezel.","startTime":202.42857142857142,"endTime":205.28571428571428,"audioSegment":0},{"text":"No account or server.","startTime":205.28571428571428,"endTime":208.14285714285714,"audioSegment":0},{"text":"There is no Bendyline sign-in and no Bendyline service in the path of your work,","startTime":208.14285714285714,"endTime":211,"audioSegment":0},{"text":"so an installed copy keeps working.","startTime":211,"endTime":213.85714285714286,"audioSegment":0},{"text":"Standard model files.","startTime":213.85714285714286,"endTime":216.71428571428572,"audioSegment":0},{"text":"Models are ordinary GGUF and MLX model files,","startTime":216.71428571428572,"endTime":219.57142857142858,"audioSegment":0},{"text":"downloaded from Hugging Face and usable by other tools.","startTime":219.57142857142858,"endTime":222.42857142857144,"audioSegment":0},{"text":"What would stop is new releases.","startTime":222.42857142857144,"endTime":225.28571428571428,"audioSegment":0},{"text":"Engine downloads and update checks go to Gezel's GitHub releases,","startTime":225.28571428571428,"endTime":228.14285714285714,"audioSegment":0},{"text":"so a fresh install would need those releases to stay up, or someone to build them from source.","startTime":228.14285714285714,"endTime":231,"audioSegment":0}],"version":1},"startBlock":{"title":"Governance: who writes Gezel, and how","subtitle":"Gezel is open source under the MIT license. Anyone can read it, audit it, fork it and build it. It is not open to outside code: every line in the repository is written by one team at Bendyline. This page explains why, how an idea from outside reaches a release anyway, and what checks a change has to pass.","ambientMotion":"zoomIn"}}</script>
