<script type="application/json" id="squisq-doc" data-squisq-doc="1">{"articleId":"security-model","duration":462,"blocks":[{"id":"the-security-model","startTime":0,"duration":69,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":1,"children":[{"type":"text","value":"The security model","position":{"start":{"line":1,"column":3,"offset":2},"end":{"line":1,"column":21,"offset":20}}}],"position":{"start":{"line":1,"column":1,"offset":0},"end":{"line":1,"column":21,"offset":20}}},"title":"The security model","contents":[{"type":"paragraph","children":[{"type":"text","value":"Giving AI hands means deciding, carefully, what those hands may touch.","position":{"start":{"line":3,"column":1,"offset":22},"end":{"line":3,"column":71,"offset":92}}}],"position":{"start":{"line":3,"column":1,"offset":22},"end":{"line":3,"column":71,"offset":92}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"It is important to note: gezel is still in early beta.","position":{"start":{"line":5,"column":3,"offset":96},"end":{"line":5,"column":57,"offset":150}}}],"position":{"start":{"line":5,"column":1,"offset":94},"end":{"line":5,"column":59,"offset":152}}},{"type":"text","value":" Like any young project, it will have security bugs we haven't found yet, and we fix them as they are reported. If you find one, please report it privately as described in the project's ","position":{"start":{"line":5,"column":59,"offset":152},"end":{"line":5,"column":245,"offset":338}}},{"type":"link","url":"https://github.com/bendyline/gezel/blob/main/SECURITY.md","children":[{"type":"text","value":"security policy","position":{"start":{"line":5,"column":246,"offset":339},"end":{"line":5,"column":261,"offset":354}}}],"position":{"start":{"line":5,"column":245,"offset":338},"end":{"line":5,"column":320,"offset":413}}},{"type":"text","value":" rather than in a public issue.","position":{"start":{"line":5,"column":320,"offset":413},"end":{"line":5,"column":351,"offset":444}}}],"position":{"start":{"line":5,"column":1,"offset":94},"end":{"line":5,"column":351,"offset":444}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Our security model is not designed to be perfect.","position":{"start":{"line":7,"column":3,"offset":448},"end":{"line":7,"column":52,"offset":497}}}],"position":{"start":{"line":7,"column":1,"offset":446},"end":{"line":7,"column":54,"offset":499}}},{"type":"text","value":" In many places, the security design focuses on keeping honest models honest via layers of \"defense in depth\". This lets gezel still be useful without requiring you to make every fiddly technical security decision, and without requiring exotic and complicated isolation mechanisms (e.g., containers). Think of the security design like multiple 5-foot-tall chain-link fences: it keeps things corralled, but a determined attacker (a purpose-built malicious program already on your machine) could hop over them.","position":{"start":{"line":7,"column":54,"offset":499},"end":{"line":7,"column":562,"offset":1007}}}],"position":{"start":{"line":7,"column":1,"offset":446},"end":{"line":7,"column":562,"offset":1007}}},{"type":"paragraph","children":[{"type":"text","value":"Also, most of this guidance applies whenever a model acts through gezel's own tools — local models and direct API providers (OpenAI and Anthropic keys) alike. If you work through the Claude CLI, Codex CLI, or GitHub Copilot, those harnesses run their own tool loops under their own security designs: gezel configures them — permission modes, sandbox settings — but the enforcement is theirs. Like us, those providers put a lot of work and thought into securely managing threads, but flaws can happen anywhere.","position":{"start":{"line":9,"column":1,"offset":1009},"end":{"line":9,"column":510,"offset":1518}}}],"position":{"start":{"line":9,"column":1,"offset":1009},"end":{"line":9,"column":510,"offset":1518}}}],"children":[{"id":"how-gezel-secures-a-models-hands","startTime":69,"duration":3,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"How gezel secures a model's hands","position":{"start":{"line":11,"column":4,"offset":1523},"end":{"line":11,"column":37,"offset":1556}}}],"position":{"start":{"line":11,"column":1,"offset":1520},"end":{"line":11,"column":37,"offset":1556}}},"title":"How gezel secures a model's hands","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel layers its guardrails:","position":{"start":{"line":13,"column":1,"offset":1558},"end":{"line":13,"column":29,"offset":1586}}}],"position":{"start":{"line":13,"column":1,"offset":1558},"end":{"line":13,"column":29,"offset":1586}}}],"children":[{"id":"the-service-is-locked-to-your-machine","startTime":72,"duration":37,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"The service is locked to your machine","position":{"start":{"line":15,"column":5,"offset":1592},"end":{"line":15,"column":42,"offset":1629}}}],"position":{"start":{"line":15,"column":1,"offset":1588},"end":{"line":15,"column":42,"offset":1629}}},"title":"The service is locked to your machine","contents":[{"type":"paragraph","children":[{"type":"text","value":"The background service listens only on your computer, over an encrypted loopback channel, and requires a credential that rotates every time the service starts. The desktop app also pins the service's certificate. These controls keep the service off your local network and reject clients that do not have a current credential.","position":{"start":{"line":17,"column":1,"offset":1631},"end":{"line":17,"column":326,"offset":1956}}}],"position":{"start":{"line":17,"column":1,"offset":1631},"end":{"line":17,"column":326,"offset":1956}}},{"type":"paragraph","children":[{"type":"text","value":"They are not a wall against malicious software already running as ","position":{"start":{"line":19,"column":1,"offset":1958},"end":{"line":19,"column":67,"offset":2024}}},{"type":"strong","children":[{"type":"text","value":"your","position":{"start":{"line":19,"column":69,"offset":2026},"end":{"line":19,"column":73,"offset":2030}}}],"position":{"start":{"line":19,"column":67,"offset":2024},"end":{"line":19,"column":75,"offset":2032}}},{"type":"text","value":" operating-system account, or against an administrator. Software with those powers can generally read files your account can read, including Gezel's user-scoped connection details. The separately installed machine engine has a credential that local user daemons can discover by design, but that credential is limited to inference and model management — it cannot read projects, gezellen, chats, tools, or credentials.","position":{"start":{"line":19,"column":75,"offset":2032},"end":{"line":19,"column":492,"offset":2449}}}],"position":{"start":{"line":19,"column":1,"offset":1958},"end":{"line":19,"column":492,"offset":2449}}}]},{"id":"workspaces-have-walls","startTime":109,"duration":17,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Workspaces have walls","position":{"start":{"line":21,"column":5,"offset":2455},"end":{"line":21,"column":26,"offset":2476}}}],"position":{"start":{"line":21,"column":1,"offset":2451},"end":{"line":21,"column":26,"offset":2476}}},"title":"Workspaces have walls","contents":[{"type":"paragraph","children":[{"type":"text","value":"A gezel using Gezel's workspace tools sees that project's workspace — not your whole disk. Paths those tools receive are checked against the workspace boundary before a file is read or written, so \"../\" tricks and symlink hops end at the wall. Provider-native tools and explicitly approved full-trust commands are different execution classes; their limits are described below.","position":{"start":{"line":23,"column":1,"offset":2478},"end":{"line":23,"column":377,"offset":2854}}}],"position":{"start":{"line":23,"column":1,"offset":2478},"end":{"line":23,"column":377,"offset":2854}}}]},{"id":"scripts-run-in-layered-isolation","startTime":126,"duration":187,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Scripts run in layered isolation","position":{"start":{"line":25,"column":5,"offset":2860},"end":{"line":25,"column":37,"offset":2892}}}],"position":{"start":{"line":25,"column":1,"offset":2856},"end":{"line":25,"column":37,"offset":2892}}},"title":"Scripts run in layered isolation","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel's ","position":{"start":{"line":27,"column":1,"offset":2894},"end":{"line":27,"column":9,"offset":2902}}},{"type":"strong","children":[{"type":"text","value":"sandboxed standalone-script tools","position":{"start":{"line":27,"column":11,"offset":2904},"end":{"line":27,"column":44,"offset":2937}}}],"position":{"start":{"line":27,"column":9,"offset":2902},"end":{"line":27,"column":46,"offset":2939}}},{"type":"text","value":" run code in a separate process wrapped in several independent layers:","position":{"start":{"line":27,"column":46,"offset":2939},"end":{"line":27,"column":116,"offset":3009}}}],"position":{"start":{"line":27,"column":1,"offset":2894},"end":{"line":27,"column":116,"offset":3009}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Its own small world.","position":{"start":{"line":29,"column":5,"offset":3015},"end":{"line":29,"column":25,"offset":3035}}}],"position":{"start":{"line":29,"column":3,"offset":3013},"end":{"line":29,"column":27,"offset":3037}}},{"type":"text","value":" The script gets a fresh scratch area, and its writes are confined to that area and the project workspace — not your disk. Node's permission model checks the file boundary as one layer of the sandbox.","position":{"start":{"line":29,"column":27,"offset":3037},"end":{"line":29,"column":227,"offset":3237}}}],"position":{"start":{"line":29,"column":3,"offset":3013},"end":{"line":29,"column":227,"offset":3237}}}],"position":{"start":{"line":29,"column":1,"offset":3011},"end":{"line":29,"column":227,"offset":3237}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"No calling for backup.","position":{"start":{"line":30,"column":5,"offset":3242},"end":{"line":30,"column":27,"offset":3264}}}],"position":{"start":{"line":30,"column":3,"offset":3240},"end":{"line":30,"column":29,"offset":3266}}},{"type":"text","value":" The script can't launch other programs, spawn workers, or load native extensions. Where the operating system can enforce it (next point), a script also can't quietly open its own connection to the internet — when a gezel needs the web, it goes through gezel's named tools (search, fetch, the browser), which are policy-checked and show up in History. In most configurations, whatever a gezel does, it does alone, inside the fence of the project workspace.","position":{"start":{"line":30,"column":29,"offset":3266},"end":{"line":30,"column":485,"offset":3722}}}],"position":{"start":{"line":30,"column":3,"offset":3240},"end":{"line":30,"column":485,"offset":3722}}}],"position":{"start":{"line":30,"column":1,"offset":3238},"end":{"line":30,"column":485,"offset":3722}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The operating system holds the outer wall where it can.","position":{"start":{"line":31,"column":5,"offset":3727},"end":{"line":31,"column":60,"offset":3782}}}],"position":{"start":{"line":31,"column":3,"offset":3725},"end":{"line":31,"column":62,"offset":3784}}},{"type":"text","value":" Untrusted code that must run without network access starts only when Gezel can apply a supported OS boundary — macOS Seatbelt, the Windows sandbox (Microsoft's process container, on recent Windows 11), or a probed systemd boundary for compatible Linux jobs. Otherwise Gezel refuses to start it. On macOS and Windows that wall surrounds every script run, and on Windows it also holds the script to the same folders as the file limits above. Settings → Security & Compliance shows whether the Windows sandbox is active on your PC, says why when it isn't, and has a switch to turn it off. One narrow compatibility path exists for byte-verified first-party scripts shipped in Gezel's standard library or catalog: where a job cannot use the OS boundary, those trusted bytes may run with the remaining filesystem limits, subprocess/worker/addon denial, environment scrubbing, and JavaScript network-denial layers. Edited, user-authored, and model-authored scripts do not receive that exception.","position":{"start":{"line":31,"column":62,"offset":3784},"end":{"line":31,"column":1051,"offset":4773}}}],"position":{"start":{"line":31,"column":3,"offset":3725},"end":{"line":31,"column":1051,"offset":4773}}}],"position":{"start":{"line":31,"column":1,"offset":3723},"end":{"line":31,"column":1051,"offset":4773}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Scripts a gezel writes follow your network setting where there is no wall.","position":{"start":{"line":32,"column":5,"offset":4778},"end":{"line":32,"column":79,"offset":4852}}}],"position":{"start":{"line":32,"column":3,"offset":4776},"end":{"line":32,"column":81,"offset":4854}}},{"type":"text","value":" On Windows when the Windows sandbox is off or not available, and on Linux without the systemd boundary, ","position":{"start":{"line":32,"column":81,"offset":4854},"end":{"line":32,"column":186,"offset":4959}}},{"type":"inlineCode","value":"run_nodejs_script","position":{"start":{"line":32,"column":186,"offset":4959},"end":{"line":32,"column":205,"offset":4978}}},{"type":"text","value":" and ","position":{"start":{"line":32,"column":205,"offset":4978},"end":{"line":32,"column":210,"offset":4983}}},{"type":"inlineCode","value":"derive_file","position":{"start":{"line":32,"column":210,"offset":4983},"end":{"line":32,"column":223,"offset":4996}}},{"type":"text","value":" are withheld unless your security level already lets gezels use external services (as Free does). When it does, these scripts run with the other layers but with ordinary network access. That access is direct: it skips the checks the named web tools apply, its requests do not appear in History, and it can reach addresses on your own machine and local network. On macOS, on Windows with the sandbox active, and on Linux with the boundary, they always run without network access.","position":{"start":{"line":32,"column":223,"offset":4996},"end":{"line":32,"column":702,"offset":5475}}}],"position":{"start":{"line":32,"column":3,"offset":4776},"end":{"line":32,"column":702,"offset":5475}}}],"position":{"start":{"line":32,"column":1,"offset":4774},"end":{"line":32,"column":702,"offset":5475}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A time and memory leash.","position":{"start":{"line":33,"column":5,"offset":5480},"end":{"line":33,"column":29,"offset":5504}}}],"position":{"start":{"line":33,"column":3,"offset":5478},"end":{"line":33,"column":31,"offset":5506}}},{"type":"text","value":" Every run has a deadline and can be capped on memory, so a runaway script gets stopped instead of dragging your machine down.","position":{"start":{"line":33,"column":31,"offset":5506},"end":{"line":33,"column":157,"offset":5632}}}],"position":{"start":{"line":33,"column":3,"offset":5478},"end":{"line":33,"column":157,"offset":5632}}}],"position":{"start":{"line":33,"column":1,"offset":5476},"end":{"line":33,"column":157,"offset":5632}}}],"position":{"start":{"line":29,"column":1,"offset":3011},"end":{"line":33,"column":157,"offset":5632}}},{"type":"paragraph","children":[{"type":"text","value":"The layers deliberately overlap, but they are defense in depth rather than a promise that hostile code can never escape.","position":{"start":{"line":35,"column":1,"offset":5634},"end":{"line":35,"column":121,"offset":5754}}}],"position":{"start":{"line":35,"column":1,"offset":5634},"end":{"line":35,"column":121,"offset":5754}}},{"type":"paragraph","children":[{"type":"text","value":"Some tools deliberately run with more authority. After showing the exact command and receiving your approval, ","position":{"start":{"line":37,"column":1,"offset":5756},"end":{"line":37,"column":111,"offset":5866}}},{"type":"strong","children":[{"type":"text","value":"package scripts and installed package binaries","position":{"start":{"line":37,"column":113,"offset":5868},"end":{"line":37,"column":159,"offset":5914}}}],"position":{"start":{"line":37,"column":111,"offset":5866},"end":{"line":37,"column":161,"offset":5916}}},{"type":"text","value":" (","position":{"start":{"line":37,"column":161,"offset":5916},"end":{"line":37,"column":163,"offset":5918}}},{"type":"inlineCode","value":"run_package_script","position":{"start":{"line":37,"column":163,"offset":5918},"end":{"line":37,"column":183,"offset":5938}}},{"type":"text","value":" and ","position":{"start":{"line":37,"column":183,"offset":5938},"end":{"line":37,"column":188,"offset":5943}}},{"type":"inlineCode","value":"run_npx","position":{"start":{"line":37,"column":188,"offset":5943},"end":{"line":37,"column":197,"offset":5952}}},{"type":"text","value":") run as your operating-system account. They may start other programs, use the network, and read or change files outside the project. A persistent approval is tied to the exact command, its arguments, and the content hashes of local inputs Gezel can identify — such as ","position":{"start":{"line":37,"column":197,"offset":5952},"end":{"line":37,"column":466,"offset":6221}}},{"type":"inlineCode","value":"package.json","position":{"start":{"line":37,"column":466,"offset":6221},"end":{"line":37,"column":480,"offset":6235}}},{"type":"text","value":", a referenced script, relative static imports, or an installed binary entry. Changing one of those files asks for approval again. Commands can still discover files dynamically, load implicit configuration, resolve other programs through ","position":{"start":{"line":37,"column":480,"offset":6235},"end":{"line":37,"column":718,"offset":6473}}},{"type":"inlineCode","value":"PATH","position":{"start":{"line":37,"column":718,"offset":6473},"end":{"line":37,"column":724,"offset":6479}}},{"type":"text","value":", use outside-project or directory/glob inputs, or fetch code from the network, so this binding is not a complete dependency graph and does not turn package commands into a sandbox. Third-party MCP servers are also not inside the standalone-script sandbox; because they are unconfined local or remote code, Gezel enables them only under the corresponding Security & Compliance setting.","position":{"start":{"line":37,"column":724,"offset":6479},"end":{"line":37,"column":1109,"offset":6864}}}],"position":{"start":{"line":37,"column":1,"offset":5756},"end":{"line":37,"column":1109,"offset":6864}}}]},{"id":"mutations-need-consent","startTime":313,"duration":27,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Mutations need consent","position":{"start":{"line":39,"column":5,"offset":6870},"end":{"line":39,"column":27,"offset":6892}}}],"position":{"start":{"line":39,"column":1,"offset":6866},"end":{"line":39,"column":27,"offset":6892}}},"title":"Mutations need consent","contents":[{"type":"paragraph","children":[{"type":"text","value":"Reading is cheap; changing things is not. Changes made through Gezel-managed tools — project-file writes, git operations, and outward-facing actions — go through the policy and per-project consent you control in Settings. Approving a full-trust package command authorizes that command as a whole; Gezel cannot separately mediate every side effect produced inside it. Git itself stays yours in the default managed workflow: gezellen work in your working copy while you control commits, branches, and pushes. A full-trust command can perform any of those operations if the command you approve includes them.","position":{"start":{"line":41,"column":1,"offset":6894},"end":{"line":41,"column":606,"offset":7499}}}],"position":{"start":{"line":41,"column":1,"offset":6894},"end":{"line":41,"column":606,"offset":7499}}}]},{"id":"prefer-mediated-connections-to-services","startTime":340,"duration":27,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Prefer mediated connections to services","position":{"start":{"line":43,"column":5,"offset":7505},"end":{"line":43,"column":44,"offset":7544}}}],"position":{"start":{"line":43,"column":1,"offset":7501},"end":{"line":43,"column":44,"offset":7544}}},"title":"Prefer mediated connections to services","contents":[{"type":"paragraph","children":[{"type":"text","value":"Being useful means connecting to services like e-mail or data systems. Wherever possible, Gezel keeps that connection in a named, policy-checked connector or tool and gives the model a file or a narrow operation instead of the raw credential. For example, e-mail can arrive as files in the workspace, and sending uses a reviewed request.","position":{"start":{"line":45,"column":1,"offset":7546},"end":{"line":45,"column":338,"offset":7883}}}],"position":{"start":{"line":45,"column":1,"offset":7546},"end":{"line":45,"column":338,"offset":7883}}},{"type":"paragraph","children":[{"type":"text","value":"That is the preferred path, not a universal guarantee. An approved full-trust package command or an enabled third-party MCP server can make its own network connections. Provider-native tools follow that provider's security and permission model.","position":{"start":{"line":47,"column":1,"offset":7885},"end":{"line":47,"column":245,"offset":8129}}}],"position":{"start":{"line":47,"column":1,"offset":7885},"end":{"line":47,"column":245,"offset":8129}}}]},{"id":"leverage-the-nodejsnpm-open-source-ecosystem","startTime":367,"duration":55,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Leverage the node.js/NPM open source ecosystem","position":{"start":{"line":49,"column":5,"offset":8135},"end":{"line":49,"column":51,"offset":8181}}}],"position":{"start":{"line":49,"column":1,"offset":8131},"end":{"line":49,"column":51,"offset":8181}}},"title":"Leverage the node.js/NPM open source ecosystem","contents":[{"type":"paragraph","children":[{"type":"text","value":"At your direction, Gezel can download additional scripts and tools from NPM (the Node.js package catalog). NPM is widely used, but it is not perfect and has experienced compromises. Gezel installs packages with their install-time scripts disabled, preventing that common supply-chain execution path.","position":{"start":{"line":51,"column":1,"offset":8183},"end":{"line":51,"column":300,"offset":8482}}}],"position":{"start":{"line":51,"column":1,"offset":8183},"end":{"line":51,"column":300,"offset":8482}}},{"type":"paragraph","children":[{"type":"text","value":"Gezel's ordinary install flow accepts packages from the NPM registry only: a package name plus a version, semver range, or dist-tag. It does not accept a URL, Git repository, local file or directory, workspace reference, package alias, or command-line option in that field. Installs can target only the private package directory of an existing project; project identifiers and the resolved destination are checked before the package manager starts. Alternate package sources would need a separate, explicitly approved feature with their own network and path protections.","position":{"start":{"line":53,"column":1,"offset":8484},"end":{"line":53,"column":571,"offset":9054}}}],"position":{"start":{"line":53,"column":1,"offset":8484},"end":{"line":53,"column":571,"offset":9054}}},{"type":"paragraph","children":[{"type":"text","value":"What happens later depends on the tool type. A standalone script uses the sandbox described above. A package command runs with your account's authority after explicit approval. A third-party MCP server is unconfined and requires the security posture that permits non-builtin toolsets. Review the package, publisher, requested capabilities, and exact command before granting that authority.","position":{"start":{"line":55,"column":1,"offset":9056},"end":{"line":55,"column":390,"offset":9445}}}],"position":{"start":{"line":55,"column":1,"offset":9056},"end":{"line":55,"column":390,"offset":9445}}}]},{"id":"what-history-records","startTime":422,"duration":40,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"What History records","position":{"start":{"line":57,"column":5,"offset":9451},"end":{"line":57,"column":25,"offset":9471}}}],"position":{"start":{"line":57,"column":1,"offset":9447},"end":{"line":57,"column":25,"offset":9471}}},"title":"What History records","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel writes durable History events for project and crew changes and for tool completions it can observe. Calls through Gezel's own MCP bridge have the strongest coverage. Provider-native tool loops — such as Claude CLI, Codex CLI, or GitHub Copilot — are recorded when their SDK or event stream exposes enough information, so a missing History entry is not proof that an external provider performed no action.","position":{"start":{"line":59,"column":1,"offset":9473},"end":{"line":59,"column":411,"offset":9883}}}],"position":{"start":{"line":59,"column":1,"offset":9473},"end":{"line":59,"column":411,"offset":9883}}},{"type":"paragraph","children":[{"type":"text","value":"Copilot's built-in tools are disabled by default in favor of Gezel's scoped MCP tools. The explicit ","position":{"start":{"line":61,"column":1,"offset":9885},"end":{"line":61,"column":101,"offset":9985}}},{"type":"inlineCode","value":"sandboxCopilot: false","position":{"start":{"line":61,"column":101,"offset":9985},"end":{"line":61,"column":124,"offset":10008}}},{"type":"text","value":" compatibility setting restores those built-ins. Their observed completions may still appear in History, but they do not receive Gezel's MCP scope and action-level sink checks, and their audit detail can be incomplete.","position":{"start":{"line":61,"column":124,"offset":10008},"end":{"line":61,"column":342,"offset":10226}}}],"position":{"start":{"line":61,"column":1,"offset":9885},"end":{"line":61,"column":342,"offset":10226}}},{"type":"paragraph","children":[{"type":"text","value":"History is a useful, user-owned local activity record. It is not a tamper-evident compliance ledger.","position":{"start":{"line":63,"column":1,"offset":10228},"end":{"line":63,"column":101,"offset":10328}}}],"position":{"start":{"line":63,"column":1,"offset":10228},"end":{"line":63,"column":101,"offset":10328}}}]}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Giving AI hands means deciding, carefully, what those hands may touch.","startTime":0,"endTime":3.6315789473684212,"audioSegment":0},{"text":"It is important to note: gezel is still in early beta.","startTime":3.6315789473684212,"endTime":7.2631578947368425,"audioSegment":0},{"text":"Like any young project, it will have security bugs we haven't found yet,","startTime":7.2631578947368425,"endTime":10.894736842105264,"audioSegment":0},{"text":"and we fix them as they are reported.","startTime":10.894736842105264,"endTime":14.526315789473685,"audioSegment":0},{"text":"If you find one,","startTime":14.526315789473685,"endTime":18.157894736842106,"audioSegment":0},{"text":"please report it privately as described in the project's security policy rather than in a public issue.","startTime":18.157894736842106,"endTime":21.789473684210527,"audioSegment":0},{"text":"Our security model is not designed to be perfect.","startTime":21.789473684210527,"endTime":25.42105263157895,"audioSegment":0},{"text":"In many places,","startTime":25.42105263157895,"endTime":29.05263157894737,"audioSegment":0},{"text":"the security design focuses on keeping honest models honest via layers of \"defense in depth\".","startTime":29.05263157894737,"endTime":32.684210526315795,"audioSegment":0},{"text":"This lets gezel still be useful without requiring you to make every fiddly technical security decision,","startTime":32.684210526315795,"endTime":36.31578947368421,"audioSegment":0},{"text":"and without requiring exotic and complicated isolation mechanisms (e.g., containers).","startTime":36.31578947368421,"endTime":39.94736842105263,"audioSegment":0},{"text":"Think of the security design like multiple 5-foot-tall chain-link fences: it keeps things corralled,","startTime":39.94736842105263,"endTime":43.578947368421055,"audioSegment":0},{"text":"but a determined attacker (a purpose-built malicious program already on your machine) could hop over them.","startTime":43.578947368421055,"endTime":47.21052631578948,"audioSegment":0},{"text":"Also, most of this guidance applies whenever a model acts through gezel's own tools —","startTime":47.21052631578948,"endTime":50.8421052631579,"audioSegment":0},{"text":"local models and direct API providers (OpenAI and Anthropic keys) alike.","startTime":50.8421052631579,"endTime":54.473684210526315,"audioSegment":0},{"text":"If you work through the Claude CLI, Codex CLI, or GitHub Copilot, those harnesses run their own tool loops under their own security designs: gezel configures them —","startTime":54.473684210526315,"endTime":58.10526315789474,"audioSegment":0},{"text":"permission modes, sandbox settings — but the enforcement is theirs.","startTime":58.10526315789474,"endTime":61.736842105263165,"audioSegment":0},{"text":"Like us, those providers put a lot of work and thought into securely managing threads,","startTime":61.736842105263165,"endTime":65.36842105263159,"audioSegment":0},{"text":"but flaws can happen anywhere.","startTime":65.36842105263159,"endTime":69,"audioSegment":0},{"text":"Gezel layers its guardrails:","startTime":69,"endTime":72,"audioSegment":0},{"text":"The background service listens only on your computer, over an encrypted loopback channel,","startTime":72,"endTime":75.7,"audioSegment":0},{"text":"and requires a credential that rotates every time the service starts.","startTime":75.7,"endTime":79.4,"audioSegment":0},{"text":"The desktop app also pins the service's certificate.","startTime":79.4,"endTime":83.1,"audioSegment":0},{"text":"These controls keep the service off your local network and reject clients that do not have a current credential.","startTime":83.1,"endTime":86.8,"audioSegment":0},{"text":"They are not a wall against malicious software already running as your operating-system account,","startTime":86.8,"endTime":90.5,"audioSegment":0},{"text":"or against an administrator.","startTime":90.5,"endTime":94.2,"audioSegment":0},{"text":"Software with those powers can generally read files your account can read,","startTime":94.2,"endTime":97.9,"audioSegment":0},{"text":"including Gezel's user-scoped connection details.","startTime":97.9,"endTime":101.6,"audioSegment":0},{"text":"The separately installed machine engine has a credential that local user daemons can discover by design,","startTime":101.6,"endTime":105.30000000000001,"audioSegment":0},{"text":"but that credential is limited to inference and model management — it cannot read projects, gezellen, chats, tools, or credentials.","startTime":105.30000000000001,"endTime":109,"audioSegment":0},{"text":"A gezel using Gezel's workspace tools sees that project's workspace —","startTime":109,"endTime":111.83333333333333,"audioSegment":0},{"text":"not your whole disk.","startTime":111.83333333333333,"endTime":114.66666666666667,"audioSegment":0},{"text":"Paths those tools receive are checked against the workspace boundary before a file is read or written,","startTime":114.66666666666667,"endTime":117.5,"audioSegment":0},{"text":"so \"../\" tricks and symlink hops end at the wall.","startTime":117.5,"endTime":120.33333333333333,"audioSegment":0},{"text":"Provider-native tools and explicitly approved full-trust commands are different execution classes;","startTime":120.33333333333333,"endTime":123.16666666666667,"audioSegment":0},{"text":"their limits are described below.","startTime":123.16666666666667,"endTime":126,"audioSegment":0},{"text":"Gezel's sandboxed standalone-script tools run code in a separate process wrapped in several independent layers:","startTime":126,"endTime":129.9787234042553,"audioSegment":0},{"text":"Its own small world.","startTime":129.9787234042553,"endTime":133.95744680851064,"audioSegment":0},{"text":"The script gets a fresh scratch area,","startTime":133.95744680851064,"endTime":137.93617021276594,"audioSegment":0},{"text":"and its writes are confined to that area and the project workspace — not your disk.","startTime":137.93617021276594,"endTime":141.91489361702128,"audioSegment":0},{"text":"Node's permission model checks the file boundary as one layer of the sandbox.","startTime":141.91489361702128,"endTime":145.89361702127658,"audioSegment":0},{"text":"No calling for backup.","startTime":145.89361702127658,"endTime":149.87234042553192,"audioSegment":0},{"text":"The script can't launch other programs, spawn workers, or load native extensions.","startTime":149.87234042553192,"endTime":153.85106382978722,"audioSegment":0},{"text":"Where the operating system can enforce it (next point), a script also can't quietly open its own connection to the internet —","startTime":153.85106382978722,"endTime":157.82978723404256,"audioSegment":0},{"text":"when a gezel needs the web, it goes through gezel's named tools (search, fetch, the browser), which are policy-checked and show up in History.","startTime":157.82978723404256,"endTime":161.80851063829786,"audioSegment":0},{"text":"In most configurations, whatever a gezel does,","startTime":161.80851063829786,"endTime":165.7872340425532,"audioSegment":0},{"text":"it does alone, inside the fence of the project workspace.","startTime":165.7872340425532,"endTime":169.7659574468085,"audioSegment":0},{"text":"The operating system holds the outer wall where it can.","startTime":169.7659574468085,"endTime":173.74468085106383,"audioSegment":0},{"text":"Untrusted code that must run without network access starts only when Gezel can apply a supported OS boundary — macOS Seatbelt,","startTime":173.74468085106383,"endTime":177.72340425531914,"audioSegment":0},{"text":"the Windows sandbox (Microsoft's process container, on recent Windows 11), or a probed systemd boundary for compatible Linux jobs.","startTime":177.72340425531914,"endTime":181.70212765957447,"audioSegment":0},{"text":"Otherwise Gezel refuses to start it.","startTime":181.70212765957447,"endTime":185.68085106382978,"audioSegment":0},{"text":"On macOS and Windows that wall surrounds every script run,","startTime":185.68085106382978,"endTime":189.6595744680851,"audioSegment":0},{"text":"and on Windows it also holds the script to the same folders as the file limits above.","startTime":189.6595744680851,"endTime":193.63829787234042,"audioSegment":0},{"text":"Settings → Security & Compliance shows whether the Windows sandbox is active on your PC,","startTime":193.63829787234042,"endTime":197.61702127659572,"audioSegment":0},{"text":"says why when it isn't, and has a switch to turn it off.","startTime":197.61702127659572,"endTime":201.59574468085106,"audioSegment":0},{"text":"One narrow compatibility path exists for byte-verified first-party scripts shipped in Gezel's standard library or catalog: where a job cannot use the OS boundary,","startTime":201.59574468085106,"endTime":205.5744680851064,"audioSegment":0},{"text":"those trusted bytes may run with the remaining filesystem limits, subprocess/worker/addon denial, environment scrubbing, and JavaScript network-denial layers.","startTime":205.5744680851064,"endTime":209.5531914893617,"audioSegment":0},{"text":"Edited, user-authored, and model-authored scripts do not receive that exception.","startTime":209.5531914893617,"endTime":213.531914893617,"audioSegment":0},{"text":"Scripts a gezel writes follow your network setting where there is no wall.","startTime":213.531914893617,"endTime":217.51063829787233,"audioSegment":0},{"text":"On Windows when the Windows sandbox is off or not available, and on Linux without the systemd boundary,","startTime":217.51063829787233,"endTime":221.48936170212767,"audioSegment":0},{"text":"run_nodejs_script and derive_file are withheld unless your security level already lets gezels use external services (as Free does). When it does,","startTime":221.48936170212767,"endTime":225.46808510638297,"audioSegment":0},{"text":"these scripts run with the other layers but with ordinary network access.","startTime":225.46808510638297,"endTime":229.44680851063828,"audioSegment":0},{"text":"That access is direct: it skips the checks the named web tools apply,","startTime":229.44680851063828,"endTime":233.4255319148936,"audioSegment":0},{"text":"its requests do not appear in History, and it can reach addresses on your own machine and local network.","startTime":233.4255319148936,"endTime":237.40425531914894,"audioSegment":0},{"text":"On macOS, on Windows with the sandbox active,","startTime":237.40425531914894,"endTime":241.38297872340425,"audioSegment":0},{"text":"and on Linux with the boundary, they always run without network access.","startTime":241.38297872340425,"endTime":245.36170212765956,"audioSegment":0},{"text":"A time and memory leash.","startTime":245.36170212765956,"endTime":249.3404255319149,"audioSegment":0},{"text":"Every run has a deadline and can be capped on memory,","startTime":249.3404255319149,"endTime":253.31914893617022,"audioSegment":0},{"text":"so a runaway script gets stopped instead of dragging your machine down.","startTime":253.31914893617022,"endTime":257.29787234042556,"audioSegment":0},{"text":"The layers deliberately overlap,","startTime":257.29787234042556,"endTime":261.27659574468083,"audioSegment":0},{"text":"but they are defense in depth rather than a promise that hostile code can never escape.","startTime":261.27659574468083,"endTime":265.25531914893617,"audioSegment":0},{"text":"Some tools deliberately run with more authority.","startTime":265.25531914893617,"endTime":269.23404255319144,"audioSegment":0},{"text":"After showing the exact command and receiving your approval,","startTime":269.23404255319144,"endTime":273.2127659574468,"audioSegment":0},{"text":"package scripts and installed package binaries (run_package_script and run_npx) run as your operating-system account.","startTime":273.2127659574468,"endTime":277.1914893617021,"audioSegment":0},{"text":"They may start other programs, use the network,","startTime":277.1914893617021,"endTime":281.17021276595744,"audioSegment":0},{"text":"and read or change files outside the project.","startTime":281.17021276595744,"endTime":285.1489361702128,"audioSegment":0},{"text":"A persistent approval is tied to the exact command, its arguments, and the content hashes of local inputs Gezel can identify —","startTime":285.1489361702128,"endTime":289.1276595744681,"audioSegment":0},{"text":"such as package.json, a referenced script, relative static imports, or an installed binary entry.","startTime":289.1276595744681,"endTime":293.1063829787234,"audioSegment":0},{"text":"Changing one of those files asks for approval again.","startTime":293.1063829787234,"endTime":297.0851063829787,"audioSegment":0},{"text":"Commands can still discover files dynamically, load implicit configuration, resolve other programs through PATH, use outside-project or directory/glob inputs,","startTime":297.0851063829787,"endTime":301.063829787234,"audioSegment":0},{"text":"or fetch code from the network, so this binding is not a complete dependency graph and does not turn package commands into a sandbox.","startTime":301.063829787234,"endTime":305.04255319148933,"audioSegment":0},{"text":"Third-party MCP servers are also not inside the standalone-script sandbox; because they are unconfined local or remote code,","startTime":305.04255319148933,"endTime":309.02127659574467,"audioSegment":0},{"text":"Gezel enables them only under the corresponding Security & Compliance setting.","startTime":309.02127659574467,"endTime":313,"audioSegment":0},{"text":"Reading is cheap; changing things is not.","startTime":313,"endTime":316.375,"audioSegment":0},{"text":"Changes made through Gezel-managed tools — project-file writes, git operations,","startTime":316.375,"endTime":319.75,"audioSegment":0},{"text":"and outward-facing actions — go through the policy and per-project consent you control in Settings.","startTime":319.75,"endTime":323.125,"audioSegment":0},{"text":"Approving a full-trust package command authorizes that command as a whole;","startTime":323.125,"endTime":326.5,"audioSegment":0},{"text":"Gezel cannot separately mediate every side effect produced inside it.","startTime":326.5,"endTime":329.875,"audioSegment":0},{"text":"Git itself stays yours in the default managed workflow: gezellen work in your working copy while you control commits,","startTime":329.875,"endTime":333.25,"audioSegment":0},{"text":"branches, and pushes.","startTime":333.25,"endTime":336.625,"audioSegment":0},{"text":"A full-trust command can perform any of those operations if the command you approve includes them.","startTime":336.625,"endTime":340,"audioSegment":0},{"text":"Being useful means connecting to services like e-mail or data systems.","startTime":340,"endTime":343.375,"audioSegment":0},{"text":"Wherever possible, Gezel keeps that connection in a named,","startTime":343.375,"endTime":346.75,"audioSegment":0},{"text":"policy-checked connector or tool and gives the model a file or a narrow operation instead of the raw credential.","startTime":346.75,"endTime":350.125,"audioSegment":0},{"text":"For example, e-mail can arrive as files in the workspace,","startTime":350.125,"endTime":353.5,"audioSegment":0},{"text":"and sending uses a reviewed request.","startTime":353.5,"endTime":356.875,"audioSegment":0},{"text":"That is the preferred path, not a universal guarantee.","startTime":356.875,"endTime":360.25,"audioSegment":0},{"text":"An approved full-trust package command or an enabled third-party MCP server can make its own network connections.","startTime":360.25,"endTime":363.625,"audioSegment":0},{"text":"Provider-native tools follow that provider's security and permission model.","startTime":363.625,"endTime":367,"audioSegment":0},{"text":"At your direction,","startTime":367,"endTime":369.75,"audioSegment":0},{"text":"Gezel can download additional scripts and tools from NPM (the Node.js package catalog).","startTime":369.75,"endTime":372.5,"audioSegment":0},{"text":"NPM is widely used,","startTime":372.5,"endTime":375.25,"audioSegment":0},{"text":"but it is not perfect and has experienced compromises.","startTime":375.25,"endTime":378,"audioSegment":0},{"text":"Gezel installs packages with their install-time scripts disabled,","startTime":378,"endTime":380.75,"audioSegment":0},{"text":"preventing that common supply-chain execution path.","startTime":380.75,"endTime":383.5,"audioSegment":0},{"text":"Gezel's ordinary install flow accepts packages from the NPM registry only: a package name plus a version,","startTime":383.5,"endTime":386.25,"audioSegment":0},{"text":"semver range, or dist-tag.","startTime":386.25,"endTime":389,"audioSegment":0},{"text":"It does not accept a URL, Git repository, local file or directory,","startTime":389,"endTime":391.75,"audioSegment":0},{"text":"workspace reference, package alias, or command-line option in that field.","startTime":391.75,"endTime":394.5,"audioSegment":0},{"text":"Installs can target only the private package directory of an existing project;","startTime":394.5,"endTime":397.25,"audioSegment":0},{"text":"project identifiers and the resolved destination are checked before the package manager starts.","startTime":397.25,"endTime":400,"audioSegment":0},{"text":"Alternate package sources would need a separate,","startTime":400,"endTime":402.75,"audioSegment":0},{"text":"explicitly approved feature with their own network and path protections.","startTime":402.75,"endTime":405.5,"audioSegment":0},{"text":"What happens later depends on the tool type.","startTime":405.5,"endTime":408.25,"audioSegment":0},{"text":"A standalone script uses the sandbox described above.","startTime":408.25,"endTime":411,"audioSegment":0},{"text":"A package command runs with your account's authority after explicit approval.","startTime":411,"endTime":413.75,"audioSegment":0},{"text":"A third-party MCP server is unconfined and requires the security posture that permits non-builtin toolsets.","startTime":413.75,"endTime":416.5,"audioSegment":0},{"text":"Review the package, publisher, requested capabilities,","startTime":416.5,"endTime":419.25,"audioSegment":0},{"text":"and exact command before granting that authority.","startTime":419.25,"endTime":422,"audioSegment":0},{"text":"Gezel writes durable History events for project and crew changes and for tool completions it can observe.","startTime":422,"endTime":426,"audioSegment":0},{"text":"Calls through Gezel's own MCP bridge have the strongest coverage.","startTime":426,"endTime":430,"audioSegment":0},{"text":"Provider-native tool loops — such as Claude CLI, Codex CLI, or GitHub Copilot — are recorded when their SDK or event stream exposes enough information,","startTime":430,"endTime":434,"audioSegment":0},{"text":"so a missing History entry is not proof that an external provider performed no action.","startTime":434,"endTime":438,"audioSegment":0},{"text":"Copilot's built-in tools are disabled by default in favor of Gezel's scoped MCP tools.","startTime":438,"endTime":442,"audioSegment":0},{"text":"The explicit sandboxCopilot: false compatibility setting restores those built-ins.","startTime":442,"endTime":446,"audioSegment":0},{"text":"Their observed completions may still appear in History,","startTime":446,"endTime":450,"audioSegment":0},{"text":"but they do not receive Gezel's MCP scope and action-level sink checks, and their audit detail can be incomplete.","startTime":450,"endTime":454,"audioSegment":0},{"text":"History is a useful, user-owned local activity record.","startTime":454,"endTime":458,"audioSegment":0},{"text":"It is not a tamper-evident compliance ledger.","startTime":458,"endTime":462,"audioSegment":0}],"version":1},"startBlock":{"title":"The security model","subtitle":"Giving AI hands means deciding, carefully, what those hands may touch.","ambientMotion":"zoomIn"}}</script>
