<script type="application/json" id="squisq-doc" data-squisq-doc="1">{"articleId":"security-model","duration":257,"blocks":[{"id":"the-security-model","startTime":0,"duration":61,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":1,"children":[{"type":"text","value":"The security model","position":{"start":{"line":1,"column":3,"offset":2},"end":{"line":1,"column":21,"offset":20}}}],"position":{"start":{"line":1,"column":1,"offset":0},"end":{"line":1,"column":21,"offset":20}}},"title":"The security model","contents":[{"type":"paragraph","children":[{"type":"text","value":"Giving AI hands means deciding, carefully, what those hands may touch.","position":{"start":{"line":3,"column":1,"offset":22},"end":{"line":3,"column":71,"offset":92}}}],"position":{"start":{"line":3,"column":1,"offset":22},"end":{"line":3,"column":71,"offset":92}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"It is important to note: gezel is still in early beta.","position":{"start":{"line":5,"column":3,"offset":96},"end":{"line":5,"column":57,"offset":150}}}],"position":{"start":{"line":5,"column":1,"offset":94},"end":{"line":5,"column":59,"offset":152}}},{"type":"text","value":" Undoubtedly there are still security flaws or broader design holes in the security regimen of gezel.","position":{"start":{"line":5,"column":59,"offset":152},"end":{"line":5,"column":160,"offset":253}}}],"position":{"start":{"line":5,"column":1,"offset":94},"end":{"line":5,"column":160,"offset":253}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Our security model is not designed to be perfect.","position":{"start":{"line":7,"column":3,"offset":257},"end":{"line":7,"column":52,"offset":306}}}],"position":{"start":{"line":7,"column":1,"offset":255},"end":{"line":7,"column":54,"offset":308}}},{"type":"text","value":" In many places, the security design focuses on keeping honest models honest via layers of \"defense in depth\". This lets gezel still be useful without requiring you to make every fiddly technical security decision, and without requiring exotic and complicated isolation mechanisms (e.g., containers). Think of the security design like multiple 5-foot-tall chain-link fences: it keeps things corralled, but a determined attacker (a purpose-built malicious program already on your machine) could hop over them.","position":{"start":{"line":7,"column":54,"offset":308},"end":{"line":7,"column":562,"offset":816}}}],"position":{"start":{"line":7,"column":1,"offset":255},"end":{"line":7,"column":562,"offset":816}}},{"type":"paragraph","children":[{"type":"text","value":"Also, most of this guidance applies whenever a model acts through gezel's own tools — local models and direct API providers (OpenAI and Anthropic keys) alike. If you work through the Claude CLI, Codex CLI, or GitHub Copilot, those harnesses run their own tool loops under their own security designs: gezel configures them — permission modes, sandbox settings — but the enforcement is theirs. Like us, those providers put a lot of work and thought into securely managing threads, but flaws can happen anywhere.","position":{"start":{"line":9,"column":1,"offset":818},"end":{"line":9,"column":510,"offset":1327}}}],"position":{"start":{"line":9,"column":1,"offset":818},"end":{"line":9,"column":510,"offset":1327}}}],"children":[{"id":"how-gezel-secures-a-models-hands","startTime":61,"duration":3,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"How gezel secures a model's hands","position":{"start":{"line":11,"column":4,"offset":1332},"end":{"line":11,"column":37,"offset":1365}}}],"position":{"start":{"line":11,"column":1,"offset":1329},"end":{"line":11,"column":37,"offset":1365}}},"title":"How gezel secures a model's hands","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel layers its guardrails:","position":{"start":{"line":13,"column":1,"offset":1367},"end":{"line":13,"column":29,"offset":1395}}}],"position":{"start":{"line":13,"column":1,"offset":1367},"end":{"line":13,"column":29,"offset":1395}}}],"children":[{"id":"the-service-is-locked-to-your-machine","startTime":64,"duration":12,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"The service is locked to your machine","position":{"start":{"line":15,"column":5,"offset":1401},"end":{"line":15,"column":42,"offset":1438}}}],"position":{"start":{"line":15,"column":1,"offset":1397},"end":{"line":15,"column":42,"offset":1438}}},"title":"The service is locked to your machine","contents":[{"type":"paragraph","children":[{"type":"text","value":"The background service only accepts connections from your own computer, over an encrypted local channel, with a token that rotates every time the service starts. Other software on the machine can't impersonate the app, and nothing is reachable from the network.","position":{"start":{"line":17,"column":1,"offset":1440},"end":{"line":17,"column":262,"offset":1701}}}],"position":{"start":{"line":17,"column":1,"offset":1440},"end":{"line":17,"column":262,"offset":1701}}}]},{"id":"workspaces-have-walls","startTime":76,"duration":13,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Workspaces have walls","position":{"start":{"line":19,"column":5,"offset":1707},"end":{"line":19,"column":26,"offset":1728}}}],"position":{"start":{"line":19,"column":1,"offset":1703},"end":{"line":19,"column":26,"offset":1728}}},"title":"Workspaces have walls","contents":[{"type":"paragraph","children":[{"type":"text","value":"A gezel working in a project sees that project's workspace — not your whole disk. Paths a model asks for are checked against the workspace boundary before any file is read or written, so \"../\" tricks and symlink hops end at the wall.","position":{"start":{"line":21,"column":1,"offset":1730},"end":{"line":21,"column":234,"offset":1963}}}],"position":{"start":{"line":21,"column":1,"offset":1730},"end":{"line":21,"column":234,"offset":1963}}}]},{"id":"scripts-run-in-layered-isolation","startTime":89,"duration":74,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Scripts run in layered isolation","position":{"start":{"line":23,"column":5,"offset":1969},"end":{"line":23,"column":37,"offset":2001}}}],"position":{"start":{"line":23,"column":1,"offset":1965},"end":{"line":23,"column":37,"offset":2001}}},"title":"Scripts run in layered isolation","contents":[{"type":"paragraph","children":[{"type":"text","value":"When a gezel runs code, that code doesn't run inside the app and doesn't get your full user powers. It runs in a separate process wrapped in several independent layers, so no single slip opens the whole machine:","position":{"start":{"line":25,"column":1,"offset":2003},"end":{"line":25,"column":212,"offset":2214}}}],"position":{"start":{"line":25,"column":1,"offset":2003},"end":{"line":25,"column":212,"offset":2214}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Its own small world.","position":{"start":{"line":27,"column":5,"offset":2220},"end":{"line":27,"column":25,"offset":2240}}}],"position":{"start":{"line":27,"column":3,"offset":2218},"end":{"line":27,"column":27,"offset":2242}}},{"type":"text","value":" The script gets a fresh scratch area, and its writes are confined to that area and the project workspace — not your disk. The JavaScript runtime itself enforces the file boundary.","position":{"start":{"line":27,"column":27,"offset":2242},"end":{"line":27,"column":207,"offset":2422}}}],"position":{"start":{"line":27,"column":3,"offset":2218},"end":{"line":27,"column":207,"offset":2422}}}],"position":{"start":{"line":27,"column":1,"offset":2216},"end":{"line":27,"column":207,"offset":2422}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"No calling for backup.","position":{"start":{"line":28,"column":5,"offset":2427},"end":{"line":28,"column":27,"offset":2449}}}],"position":{"start":{"line":28,"column":3,"offset":2425},"end":{"line":28,"column":29,"offset":2451}}},{"type":"text","value":" The script can't launch other programs, spawn workers, or load native extensions. A script also can't quietly open its own connection to the internet — when a gezel needs the web, it goes through gezel's named tools (search, fetch, the browser), which are policy-checked and show up in History. In most configurations, whatever a gezel does, it does alone, inside the fence of the project workspace.","position":{"start":{"line":28,"column":29,"offset":2451},"end":{"line":28,"column":429,"offset":2851}}}],"position":{"start":{"line":28,"column":3,"offset":2425},"end":{"line":28,"column":429,"offset":2851}}}],"position":{"start":{"line":28,"column":1,"offset":2423},"end":{"line":28,"column":429,"offset":2851}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The operating system holds the outer wall.","position":{"start":{"line":29,"column":5,"offset":2856},"end":{"line":29,"column":47,"offset":2898}}}],"position":{"start":{"line":29,"column":3,"offset":2854},"end":{"line":29,"column":49,"offset":2900}}},{"type":"text","value":" When a script is meant to run without network access, that's enforced by the OS itself — macOS's sandbox on Mac, a confined service on Linux — not by asking the code to behave. If the machine can't provide that wall, gezel refuses to run the script at all rather than quietly settle for less.","position":{"start":{"line":29,"column":49,"offset":2900},"end":{"line":29,"column":342,"offset":3193}}}],"position":{"start":{"line":29,"column":3,"offset":2854},"end":{"line":29,"column":342,"offset":3193}}}],"position":{"start":{"line":29,"column":1,"offset":2852},"end":{"line":29,"column":342,"offset":3193}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A time and memory leash.","position":{"start":{"line":30,"column":5,"offset":3198},"end":{"line":30,"column":29,"offset":3222}}}],"position":{"start":{"line":30,"column":3,"offset":3196},"end":{"line":30,"column":31,"offset":3224}}},{"type":"text","value":" Every run has a deadline and can be capped on memory, so a runaway script gets stopped instead of dragging your machine down.","position":{"start":{"line":30,"column":31,"offset":3224},"end":{"line":30,"column":157,"offset":3350}}}],"position":{"start":{"line":30,"column":3,"offset":3196},"end":{"line":30,"column":157,"offset":3350}}}],"position":{"start":{"line":30,"column":1,"offset":3194},"end":{"line":30,"column":157,"offset":3350}}}],"position":{"start":{"line":27,"column":1,"offset":2216},"end":{"line":30,"column":157,"offset":3350}}},{"type":"paragraph","children":[{"type":"text","value":"The layers deliberately overlap: even if one were bypassed, the next is still standing.","position":{"start":{"line":32,"column":1,"offset":3352},"end":{"line":32,"column":88,"offset":3439}}}],"position":{"start":{"line":32,"column":1,"offset":3352},"end":{"line":32,"column":88,"offset":3439}}}]},{"id":"mutations-need-consent","startTime":163,"duration":13,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Mutations need consent","position":{"start":{"line":34,"column":5,"offset":3445},"end":{"line":34,"column":27,"offset":3467}}}],"position":{"start":{"line":34,"column":1,"offset":3441},"end":{"line":34,"column":27,"offset":3467}}},"title":"Mutations need consent","contents":[{"type":"paragraph","children":[{"type":"text","value":"Reading is cheap; changing things is not. Writes to project files, anything touching git, and outward-facing actions go through per-project consent you control in Settings. Git itself stays yours: gezellen work in your working copy but don't commit, branch, or push on their own.","position":{"start":{"line":36,"column":1,"offset":3469},"end":{"line":36,"column":280,"offset":3748}}}],"position":{"start":{"line":36,"column":1,"offset":3469},"end":{"line":36,"column":280,"offset":3748}}}]},{"id":"where-possible-we-never-let-a-gezel-directly-connect-to-services","startTime":176,"duration":32,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Where possible, we never let a gezel directly connect to services","position":{"start":{"line":38,"column":5,"offset":3754},"end":{"line":38,"column":70,"offset":3819}}}],"position":{"start":{"line":38,"column":1,"offset":3750},"end":{"line":38,"column":70,"offset":3819}}},"title":"Where possible, we never let a gezel directly connect to services","contents":[{"type":"paragraph","children":[{"type":"text","value":"We still want gezel to be useful, and being useful means connecting to services like e-mail or data services. But we never let the local gezel just have access to pull that data directly. Instead, outside of the purview of a gezel, we have a system of connectors and toolsets that pull down data and place it in the gezel workspace; for example, each e-mail is a file in your workspace folder. The gezel can then reason over that e-mail as a file in an isolated folder. If it needs to work with e-mail (e.g., send an e-mail), it does so through an abstracted request, with your permission.","position":{"start":{"line":40,"column":1,"offset":3821},"end":{"line":40,"column":590,"offset":4410}}}],"position":{"start":{"line":40,"column":1,"offset":3821},"end":{"line":40,"column":590,"offset":4410}}}]},{"id":"leverage-the-nodejsnpm-open-source-ecosystem","startTime":208,"duration":41,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Leverage the node.js/NPM open source ecosystem","position":{"start":{"line":42,"column":5,"offset":4416},"end":{"line":42,"column":51,"offset":4462}}}],"position":{"start":{"line":42,"column":1,"offset":4412},"end":{"line":42,"column":51,"offset":4462}}},"title":"Leverage the node.js/NPM open source ecosystem","contents":[{"type":"paragraph","children":[{"type":"text","value":"At your direction, gezel can download additional scripts and tools to extend what you can do with gezel. For this, we use the NPM (node.js) package manager. NPM is a package catalog owned and managed by GitHub/Microsoft, and is used by millions of developers for building many of the apps you may already be using. NPM is not perfect, and there have been compromises of NPM. Gezel applies the standard hardening locally: packages install with their install-time scripts disabled — the classic supply-chain trick never runs — and the code they bring executes inside the script sandbox described above. The collective eyes of the community on this open source catalog, coupled with those local practices, help make this the best but always imperfect system for people to leverage other people's honest open source at scale.","position":{"start":{"line":44,"column":1,"offset":4464},"end":{"line":44,"column":822,"offset":5285}}}],"position":{"start":{"line":44,"column":1,"offset":4464},"end":{"line":44,"column":822,"offset":5285}}}]},{"id":"everything-is-on-the-record","startTime":249,"duration":8,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Everything is on the record","position":{"start":{"line":46,"column":5,"offset":5291},"end":{"line":46,"column":32,"offset":5318}}}],"position":{"start":{"line":46,"column":1,"offset":5287},"end":{"line":46,"column":32,"offset":5318}}},"title":"Everything is on the record","contents":[{"type":"paragraph","children":[{"type":"text","value":"Tool calls, project changes, crew changes — all land in the History log. Supervision you can't audit isn't supervision; the log is the floor the rest stands on.","position":{"start":{"line":48,"column":1,"offset":5320},"end":{"line":48,"column":161,"offset":5480}}}],"position":{"start":{"line":48,"column":1,"offset":5320},"end":{"line":48,"column":161,"offset":5480}}}]}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Giving AI hands means deciding, carefully, what those hands may touch.","startTime":0,"endTime":3.8125,"audioSegment":0},{"text":"It is important to note: gezel is still in early beta.","startTime":3.8125,"endTime":7.625,"audioSegment":0},{"text":"Undoubtedly there are still security flaws or broader design holes in the security regimen of gezel.","startTime":7.625,"endTime":11.4375,"audioSegment":0},{"text":"Our security model is not designed to be perfect.","startTime":11.4375,"endTime":15.25,"audioSegment":0},{"text":"In many places,","startTime":15.25,"endTime":19.0625,"audioSegment":0},{"text":"the security design focuses on keeping honest models honest via layers of \"defense in depth\".","startTime":19.0625,"endTime":22.875,"audioSegment":0},{"text":"This lets gezel still be useful without requiring you to make every fiddly technical security decision,","startTime":22.875,"endTime":26.6875,"audioSegment":0},{"text":"and without requiring exotic and complicated isolation mechanisms (e.g., containers).","startTime":26.6875,"endTime":30.5,"audioSegment":0},{"text":"Think of the security design like multiple 5-foot-tall chain-link fences: it keeps things corralled,","startTime":30.5,"endTime":34.3125,"audioSegment":0},{"text":"but a determined attacker (a purpose-built malicious program already on your machine) could hop over them.","startTime":34.3125,"endTime":38.125,"audioSegment":0},{"text":"Also, most of this guidance applies whenever a model acts through gezel's own tools —","startTime":38.125,"endTime":41.9375,"audioSegment":0},{"text":"local models and direct API providers (OpenAI and Anthropic keys) alike.","startTime":41.9375,"endTime":45.75,"audioSegment":0},{"text":"If you work through the Claude CLI, Codex CLI, or GitHub Copilot, those harnesses run their own tool loops under their own security designs: gezel configures them —","startTime":45.75,"endTime":49.5625,"audioSegment":0},{"text":"permission modes, sandbox settings — but the enforcement is theirs.","startTime":49.5625,"endTime":53.375,"audioSegment":0},{"text":"Like us, those providers put a lot of work and thought into securely managing threads,","startTime":53.375,"endTime":57.1875,"audioSegment":0},{"text":"but flaws can happen anywhere.","startTime":57.1875,"endTime":61,"audioSegment":0},{"text":"Gezel layers its guardrails:","startTime":61,"endTime":64,"audioSegment":0},{"text":"The background service only accepts connections from your own computer,","startTime":64,"endTime":67,"audioSegment":0},{"text":"over an encrypted local channel, with a token that rotates every time the service starts.","startTime":67,"endTime":70,"audioSegment":0},{"text":"Other software on the machine can't impersonate the app,","startTime":70,"endTime":73,"audioSegment":0},{"text":"and nothing is reachable from the network.","startTime":73,"endTime":76,"audioSegment":0},{"text":"A gezel working in a project sees that project's workspace —","startTime":76,"endTime":79.25,"audioSegment":0},{"text":"not your whole disk.","startTime":79.25,"endTime":82.5,"audioSegment":0},{"text":"Paths a model asks for are checked against the workspace boundary before any file is read or written,","startTime":82.5,"endTime":85.75,"audioSegment":0},{"text":"so \"../\" tricks and symlink hops end at the wall.","startTime":85.75,"endTime":89,"audioSegment":0},{"text":"When a gezel runs code,","startTime":89,"endTime":92.08333333333333,"audioSegment":0},{"text":"that code doesn't run inside the app and doesn't get your full user powers.","startTime":92.08333333333333,"endTime":95.16666666666667,"audioSegment":0},{"text":"It runs in a separate process wrapped in several independent layers,","startTime":95.16666666666667,"endTime":98.25,"audioSegment":0},{"text":"so no single slip opens the whole machine:","startTime":98.25,"endTime":101.33333333333333,"audioSegment":0},{"text":"Its own small world.","startTime":101.33333333333333,"endTime":104.41666666666667,"audioSegment":0},{"text":"The script gets a fresh scratch area,","startTime":104.41666666666667,"endTime":107.5,"audioSegment":0},{"text":"and its writes are confined to that area and the project workspace — not your disk.","startTime":107.5,"endTime":110.58333333333334,"audioSegment":0},{"text":"The JavaScript runtime itself enforces the file boundary.","startTime":110.58333333333334,"endTime":113.66666666666667,"audioSegment":0},{"text":"No calling for backup.","startTime":113.66666666666667,"endTime":116.75,"audioSegment":0},{"text":"The script can't launch other programs, spawn workers, or load native extensions.","startTime":116.75,"endTime":119.83333333333334,"audioSegment":0},{"text":"A script also can't quietly open its own connection to the internet — when a gezel needs the web,","startTime":119.83333333333334,"endTime":122.91666666666667,"audioSegment":0},{"text":"it goes through gezel's named tools (search, fetch, the browser), which are policy-checked and show up in History.","startTime":122.91666666666667,"endTime":126,"audioSegment":0},{"text":"In most configurations, whatever a gezel does,","startTime":126,"endTime":129.08333333333334,"audioSegment":0},{"text":"it does alone, inside the fence of the project workspace.","startTime":129.08333333333334,"endTime":132.16666666666669,"audioSegment":0},{"text":"The operating system holds the outer wall.","startTime":132.16666666666669,"endTime":135.25,"audioSegment":0},{"text":"When a script is meant to run without network access, that's enforced by the OS itself —","startTime":135.25,"endTime":138.33333333333334,"audioSegment":0},{"text":"macOS's sandbox on Mac, a confined service on Linux — not by asking the code to behave.","startTime":138.33333333333334,"endTime":141.41666666666669,"audioSegment":0},{"text":"If the machine can't provide that wall,","startTime":141.41666666666669,"endTime":144.5,"audioSegment":0},{"text":"gezel refuses to run the script at all rather than quietly settle for less.","startTime":144.5,"endTime":147.58333333333334,"audioSegment":0},{"text":"A time and memory leash.","startTime":147.58333333333334,"endTime":150.66666666666669,"audioSegment":0},{"text":"Every run has a deadline and can be capped on memory,","startTime":150.66666666666669,"endTime":153.75,"audioSegment":0},{"text":"so a runaway script gets stopped instead of dragging your machine down.","startTime":153.75,"endTime":156.83333333333334,"audioSegment":0},{"text":"The layers deliberately overlap: even if one were bypassed,","startTime":156.83333333333334,"endTime":159.91666666666669,"audioSegment":0},{"text":"the next is still standing.","startTime":159.91666666666669,"endTime":163,"audioSegment":0},{"text":"Reading is cheap; changing things is not.","startTime":163,"endTime":165.6,"audioSegment":0},{"text":"Writes to project files, anything touching git,","startTime":165.6,"endTime":168.2,"audioSegment":0},{"text":"and outward-facing actions go through per-project consent you control in Settings.","startTime":168.2,"endTime":170.8,"audioSegment":0},{"text":"Git itself stays yours: gezellen work in your working copy but don't commit,","startTime":170.8,"endTime":173.4,"audioSegment":0},{"text":"branch, or push on their own.","startTime":173.4,"endTime":176,"audioSegment":0},{"text":"We still want gezel to be useful,","startTime":176,"endTime":180,"audioSegment":0},{"text":"and being useful means connecting to services like e-mail or data services.","startTime":180,"endTime":184,"audioSegment":0},{"text":"But we never let the local gezel just have access to pull that data directly.","startTime":184,"endTime":188,"audioSegment":0},{"text":"Instead, outside of the purview of a gezel, we have a system of connectors and toolsets that pull down data and place it in the gezel workspace;","startTime":188,"endTime":192,"audioSegment":0},{"text":"for example, each e-mail is a file in your workspace folder.","startTime":192,"endTime":196,"audioSegment":0},{"text":"The gezel can then reason over that e-mail as a file in an isolated folder.","startTime":196,"endTime":200,"audioSegment":0},{"text":"If it needs to work with e-mail (e.g., send an e-mail),","startTime":200,"endTime":204,"audioSegment":0},{"text":"it does so through an abstracted request, with your permission.","startTime":204,"endTime":208,"audioSegment":0},{"text":"At your direction,","startTime":208,"endTime":212.1,"audioSegment":0},{"text":"gezel can download additional scripts and tools to extend what you can do with gezel.","startTime":212.1,"endTime":216.2,"audioSegment":0},{"text":"For this, we use the NPM (node.js) package manager.","startTime":216.2,"endTime":220.3,"audioSegment":0},{"text":"NPM is a package catalog owned and managed by GitHub/Microsoft,","startTime":220.3,"endTime":224.4,"audioSegment":0},{"text":"and is used by millions of developers for building many of the apps you may already be using.","startTime":224.4,"endTime":228.5,"audioSegment":0},{"text":"NPM is not perfect, and there have been compromises of NPM.","startTime":228.5,"endTime":232.6,"audioSegment":0},{"text":"Gezel applies the standard hardening locally: packages install with their install-time scripts disabled —","startTime":232.6,"endTime":236.7,"audioSegment":0},{"text":"the classic supply-chain trick never runs — and the code they bring executes inside the script sandbox described above.","startTime":236.7,"endTime":240.8,"audioSegment":0},{"text":"The collective eyes of the community on this open source catalog, coupled with those local practices,","startTime":240.8,"endTime":244.9,"audioSegment":0},{"text":"help make this the best but always imperfect system for people to leverage other people's honest open source at scale.","startTime":244.9,"endTime":249,"audioSegment":0},{"text":"Tool calls, project changes, crew changes —","startTime":249,"endTime":251,"audioSegment":0},{"text":"all land in the History log.","startTime":251,"endTime":253,"audioSegment":0},{"text":"Supervision you can't audit isn't supervision;","startTime":253,"endTime":255,"audioSegment":0},{"text":"the log is the floor the rest stands on.","startTime":255,"endTime":257,"audioSegment":0}],"version":1},"startBlock":{"title":"The security model","subtitle":"Giving AI hands means deciding, carefully, what those hands may touch.","ambientMotion":"zoomIn"}}</script>
