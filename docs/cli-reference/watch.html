18,"column":66,"offset":7585}}},{"type":"text","value":" for the complete reference, including validation, signing, location search, removal, Parquet export, and a build–validate–install walkthrough. ","position":{"start":{"line":118,"column":66,"offset":7585},"end":{"line":118,"column":210,"offset":7729}}},{"type":"link","url":"../how-knowledge-works/","children":[{"type":"text","value":"How knowledge works in Gezel","position":{"start":{"line":118,"column":211,"offset":7730},"end":{"line":118,"column":239,"offset":7758}}}],"position":{"start":{"line":118,"column":210,"offset":7729},"end":{"line":118,"column":265,"offset":7784}}},{"type":"text","value":" explains the embeddings and storage behind these commands.","position":{"start":{"line":118,"column":265,"offset":7784},"end":{"line":118,"column":324,"offset":7843}}}],"position":{"start":{"line":118,"column":1,"offset":7520},"end":{"line":118,"column":324,"offset":7843}}},{"type":"code","value":"gezel knowledge init <dir>  scaffold a catalog folder\ngezel knowledge build <dir> compile it into a .gezk file\ngezel knowledge search <file> \"...\"\n                            search a catalog file offline\ngezel knowledge available   catalogs offered for download\ngezel knowledge install <source>\n                            install one by catalog id, file, or URL\ngezel knowledge list        what is installed","position":{"start":{"line":120,"column":1,"offset":7845},"end":{"line":129,"column":4,"offset":8262}}},{"type":"paragraph","children":[{"type":"text","value":"Building, checking, and searching a catalog file work without the service; installing and listing use the running Gezel. Building a catalog and ","position":{"start":{"line":131,"column":1,"offset":8264},"end":{"line":131,"column":145,"offset":8408}}},{"type":"inlineCode","value":"search --semantic","position":{"start":{"line":131,"column":145,"offset":8408},"end":{"line":131,"column":164,"offset":8427}}},{"type":"text","value":" also need the embedding runtime, which the desktop app includes. After an npm install, add it with ","position":{"start":{"line":131,"column":164,"offset":8427},"end":{"line":131,"column":264,"offset":8527}}},{"type":"inlineCode","value":"npm install -g @huggingface/transformers@^4.3.1","position":{"start":{"line":131,"column":264,"offset":8527},"end":{"line":131,"column":313,"offset":8576}}},{"type":"text","value":" (without ","position":{"start":{"line":131,"column":313,"offset":8576},"end":{"line":131,"column":323,"offset":8586}}},{"type":"inlineCode","value":"-g","position":{"start":{"line":131,"column":323,"offset":8586},"end":{"line":131,"column":327,"offset":8590}}},{"type":"text","value":" if the CLI is installed in a project).","position":{"start":{"line":131,"column":327,"offset":8590},"end":{"line":131,"column":366,"offset":8629}}}],"position":{"start":{"line":131,"column":1,"offset":8264},"end":{"line":131,"column":366,"offset":8629}}}]},{"id":"keys-and-security-settings","startTime":367,"duration":19,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Keys and security settings","position":{"start":{"line":133,"column":4,"offset":8634},"end":{"line":133,"column":30,"offset":8660}}}],"position":{"start":{"line":133,"column":1,"offset":8631},"end":{"line":133,"column":30,"offset":8660}}},"title":"Keys and security settings","contents":[{"type":"code","value":"gezel secret list           which provider keys are set (never their values)\ngezel secret set <name> --env VARIABLE\n                            store a key, read from an environment variable\n                            (or --stdin to pipe it in)\ngezel secret remove <name>  forget a key\ngezel security external-services [on|off]\n                            let gezels use web search and other outside services\ngezel env indexing [on|off] pause or resume background indexing for this project","position":{"start":{"line":135,"column":1,"offset":8662},"end":{"line":144,"column":4,"offset":9160}}}]},{"id":"space-backups-and-restoring","startTime":386,"duration":12,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Space, backups, and restoring","position":{"start":{"line":146,"column":4,"offset":9165},"end":{"line":146,"column":33,"offset":9194}}}],"position":{"start":{"line":146,"column":1,"offset":9162},"end":{"line":146,"column":33,"offset":9194}}},"title":"Space, backups, and restoring","contents":[{"type":"code","value":"gezel cleanup               see how much space Gezel is using\ngezel cleanup --redownloadable\n                            reclaim everything Gezel can download again\ngezel backup <file>         write your gezels, projects, and documents to a file\ngezel restore <file>        bring them back (--list to look first)","position":{"start":{"line":148,"column":1,"offset":9196},"end":{"line":154,"column":4,"offset":9516}}}]},{"id":"this-documentation","startTime":398,"duration":18,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"This documentation","position":{"start":{"line":156,"column":4,"offset":9521},"end":{"line":156,"column":22,"offset":9539}}}],"position":{"start":{"line":156,"column":1,"offset":9518},"end":{"line":156,"column":22,"offset":9539}}},"title":"This documentation","contents":[{"type":"code","value":"gezel handboek export --out ./site","position":{"start":{"line":158,"column":1,"offset":9541},"end":{"line":160,"column":4,"offset":9583}}},{"type":"paragraph","children":[{"type":"text","value":"renders the Handboek — the same articles you're reading now — as a static website, for publishing or offline reading.","position":{"start":{"line":162,"column":1,"offset":9585},"end":{"line":162,"column":118,"offset":9702}}}],"position":{"start":{"line":162,"column":1,"offset":9585},"end":{"line":162,"column":118,"offset":9702}}},{"type":"paragraph","children":[{"type":"text","value":"Run ","position":{"start":{"line":164,"column":1,"offset":9704},"end":{"line":164,"column":5,"offset":9708}}},{"type":"inlineCode","value":"gezel --help","position":{"start":{"line":164,"column":5,"offset":9708},"end":{"line":164,"column":19,"offset":9722}}},{"type":"text","value":" (or ","position":{"start":{"line":164,"column":19,"offset":9722},"end":{"line":164,"column":24,"offset":9727}}},{"type":"inlineCode","value":"--help","position":{"start":{"line":164,"column":24,"offset":9727},"end":{"line":164,"column":32,"offset":9735}}},{"type":"text","value":" on any subcommand) for the full surface.","position":{"start":{"line":164,"column":32,"offset":9735},"end":{"line":164,"column":73,"offset":9776}}}],"position":{"start":{"line":164,"column":1,"offset":9704},"end":{"line":164,"column":73,"offset":9776}}},{"type":"paragraph","children":[{"type":"text","value":"To automate work ","position":{"start":{"line":166,"column":1,"offset":9778},"end":{"line":166,"column":18,"offset":9795}}},{"type":"emphasis","children":[{"type":"text","value":"inside","position":{"start":{"line":166,"column":19,"offset":9796},"end":{"line":166,"column":25,"offset":9802}}}],"position":{"start":{"line":166,"column":18,"offset":9795},"end":{"line":166,"column":26,"offset":9803}}},{"type":"text","value":" a project, continue with ","position":{"start":{"line":166,"column":26,"offset":9803},"end":{"line":166,"column":52,"offset":9829}}},{"type":"link","url":"../writing-scripts-with-gezel-sdk/","children":[{"type":"text","value":"Writing scripts with gezel-sdk","position":{"start":{"line":166,"column":53,"offset":9830},"end":{"line":166,"column":83,"offset":9860}}}],"position":{"start":{"line":166,"column":52,"offset":9829},"end":{"line":166,"column":120,"offset":9897}}},{"type":"text","value":". To let another application use Gezel, see ","position":{"start":{"line":166,"column":120,"offset":9897},"end":{"line":166,"column":164,"offset":9941}}},{"type":"link","url":"../building-connected-apps-with-gezel-app-sdk/","children":[{"type":"text","value":"Building connected apps with gezel-app-sdk","position":{"start":{"line":166,"column":165,"offset":9942},"end":{"line":166,"column":207,"offset":9984}}}],"position":{"start":{"line":166,"column":164,"offset":9941},"end":{"line":166,"column":256,"offset":10033}}},{"type":"text","value":".","position":{"start":{"line":166,"column":256,"offset":10033},"end":{"line":166,"column":257,"offset":10034}}}],"position":{"start":{"line":166,"column":1,"offset":9778},"end":{"line":166,"column":257,"offset":10034}}}]},{"id":"watching-tasks","startTime":416,"duration":25,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Watching tasks","position":{"start":{"line":168,"column":4,"offset":10039},"end":{"line":168,"column":18,"offset":10053}}}],"position":{"start":{"line":168,"column":1,"offset":10036},"end":{"line":168,"column":18,"offset":10053}}},"title":"Watching tasks","contents":[{"type":"paragraph","children":[{"type":"text","value":"When a task you wait for is blocked, ","position":{"start":{"line":170,"column":1,"offset":10055},"end":{"line":170,"column":38,"offset":10092}}},{"type":"inlineCode","value":"gezel do --wait","position":{"start":{"line":170,"column":38,"offset":10092},"end":{"line":170,"column":55,"offset":10109}}},{"type":"text","value":" prints why (the task's latest note) and points to ","position":{"start":{"line":170,"column":55,"offset":10109},"end":{"line":170,"column":106,"offset":10160}}},{"type":"inlineCode","value":"gezel task notes <ref>","position":{"start":{"line":170,"column":106,"offset":10160},"end":{"line":170,"column":130,"offset":10184}}},{"type":"text","value":", which shows the full notes.","position":{"start":{"line":170,"column":130,"offset":10184},"end":{"line":170,"column":159,"offset":10213}}}],"position":{"start":{"line":170,"column":1,"offset":10055},"end":{"line":170,"column":159,"offset":10213}}},{"type":"paragraph","children":[{"type":"text","value":"A task watch is an observer. Its timeout ends the command without canceling or pausing native work; watching the same task again follows that work. A task's current paused status or an unanswered question blocks the watch. Historical service pause cards do not block an already resumed task and are not answered by the observer.","position":{"start":{"line":172,"column":1,"offset":10215},"end":{"line":172,"column":329,"offset":10543}}}],"position":{"start":{"line":172,"column":1,"offset":10215},"end":{"line":172,"column":329,"offset":10543}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The gezel command drives the same service the desktop app uses —","startTime":0,"endTime":4,"audioSegment":0},{"text":"handy on servers, in scripts, or when you just live in a terminal.","startTime":4,"endTime":8,"audioSegment":0},{"text":"Install the command-line package with Node.js 24 or newer:","startTime":8,"endTime":12,"audioSegment":0},{"text":"npm install -g @bendyline/gezel-cli gezel","startTime":12,"endTime":16,"audioSegment":0},{"text":"To try it without installing, run npx -p @bendyline/gezel-cli gezel.","startTime":16,"endTime":20,"audioSegment":0},{"text":"Name the @bendyline/ package whenever you use npx: a bare npx gezel outside a folder where the CLI is installed asks npm for an unrelated package.","startTime":20,"endTime":24,"audioSegment":0},{"text":"The CLI is one of Gezel's public JavaScript packages.","startTime":24,"endTime":28,"audioSegment":0},{"text":"See Gezel on npm for the complete package map and the SDKs to use when a shell command is not the right integration boundary.","startTime":28,"endTime":32,"audioSegment":0},{"text":"The npm package is sufficient for local CLI use, including first use.","startTime":32,"endTime":35.2,"audioSegment":0},{"text":"The CLI discovers your per-user daemon through its runtime files and pinned TLS certificate,","startTime":35.2,"endTime":38.4,"audioSegment":0},{"text":"then connects with your same-user owner credential.","startTime":38.4,"endTime":41.6,"audioSegment":0},{"text":"You do not need to install or open the desktop app or approve a connection to your own local daemon.","startTime":41.6,"endTime":44.8,"audioSegment":0},{"text":"Management commands can start your user daemon when it is absent;","startTime":44.8,"endTime":48,"audioSegment":0},{"text":"it keeps running until you use gezel stop.","startTime":48,"endTime":51.2,"audioSegment":0},{"text":"The interactive terminal app shuts down a daemon it started when you exit.","startTime":51.2,"endTime":54.400000000000006,"audioSegment":0},{"text":"gezel run adopts an already-running user daemon,","startTime":54.400000000000006,"endTime":57.6,"audioSegment":0},{"text":"or starts a service in-process for that one invocation and stops it afterward.","startTime":57.6,"endTime":60.8,"audioSegment":0},{"text":"An unhealthy running daemon remains an error.","startTime":60.8,"endTime":64,"audioSegment":0},{"text":"An explicit --connect <url> uses a separate CLI-scoped grant for that service.","startTime":64,"endTime":67.2,"audioSegment":0},{"text":"Without a valid saved grant or supplied --token,","startTime":67.2,"endTime":70.4,"audioSegment":0},{"text":"the terminal displays a six-character code and waits for you to approve Gezel CLI in the Gezel app.","startTime":70.4,"endTime":73.6,"audioSegment":0},{"text":"The resulting revocable credential is saved under ~/.gezel/cli/tokens/.","startTime":73.6,"endTime":76.80000000000001,"audioSegment":0},{"text":"A valid saved grant or --connect <url> --token <token> lets you connect without that interaction.","startTime":76.80000000000001,"endTime":80,"audioSegment":0},{"text":"Rolling-upgrade compatibility may also select an older legacy-full machine service,","startTime":80,"endTime":83.2,"audioSegment":0},{"text":"which uses that approval path.","startTime":83.2,"endTime":86.4,"audioSegment":0},{"text":"Use --standalone to skip this compatibility choice;","startTime":86.4,"endTime":89.6,"audioSegment":0},{"text":"--home <path> or an explicit GEZEL_HOME also implies standalone operation.","startTime":89.6,"endTime":92.80000000000001,"audioSegment":0},{"text":"A modern machine service is an engine broker;","startTime":92.80000000000001,"endTime":96,"audioSegment":0},{"text":"your per-user daemon handles product data and connects to that broker for inference.","startTime":96,"endTime":99.2,"audioSegment":0},{"text":"A home you name with --home is also kept separate from what the Gezel desktop app's machine install publishes: its shared gezels and projects,","startTime":99.2,"endTime":102.4,"audioSegment":0},{"text":"and the models it downloaded.","startTime":102.4,"endTime":105.60000000000001,"audioSegment":0},{"text":"Set GEZEL_DISABLE_MACHINE_SHARED=0 to include them anyway.","startTime":105.60000000000001,"endTime":108.80000000000001,"audioSegment":0},{"text":"Your default home, ~/.gezel, still sees them.","startTime":108.80000000000001,"endTime":112,"audioSegment":0},{"text":"gezel                       open the interactive terminal app for this folder's project","startTime":112,"endTime":115.03846153846153,"audioSegment":0},{"text":"gezel start                 ensure the service is running","startTime":115.03846153846153,"endTime":118.07692307692308,"audioSegment":0},{"text":"gezel start --port 8080 --foreground","startTime":118.07692307692308,"endTime":121.11538461538461,"audioSegment":0},{"text":"run it attached, on a fixed port","startTime":121.11538461538461,"endTime":124.15384615384616,"audioSegment":0},{"text":"gezel start --web --open    serve the web interface on this computer and open","startTime":124.15384615384616,"endTime":127.1923076923077,"audioSegment":0},{"text":"it in your browser; the printed link signs you in","startTime":127.1923076923077,"endTime":130.23076923076923,"audioSegment":0},{"text":"until the service restarts","startTime":130.23076923076923,"endTime":133.26923076923077,"audioSegment":0},{"text":"gezel status                is it up,","startTime":133.26923076923077,"endTime":136.30769230769232,"audioSegment":0},{"text":"and where (exits 1 if not running or unhealthy)","startTime":136.30769230769232,"endTime":139.34615384615384,"audioSegment":0},{"text":"gezel stop                  cancel any AI work and shut the service down","startTime":139.34615384615384,"endTime":142.3846153846154,"audioSegment":0},{"text":"gezel stop --keep-running   emergency brake: cancel AI work, unload engines,","startTime":142.3846153846154,"endTime":145.4230769230769,"audioSegment":0},{"text":"switch to Reactive — the service keeps running","startTime":145.4230769230769,"endTime":148.46153846153845,"audioSegment":0},{"text":"gezel mode [mode]           show or set how active the AI may be","startTime":148.46153846153845,"endTime":151.5,"audioSegment":0},{"text":"(read-only, reactive, reactive+tasks, full-play)","startTime":151.5,"endTime":154.53846153846155,"audioSegment":0},{"text":"gezel growth [on|off]       show or set gezel growth (XP and level-ups); off","startTime":154.53846153846155,"endTime":157.57692307692307,"audioSegment":0},{"text":"computes no XP, for homes that run bulk workflows","startTime":157.57692307692307,"endTime":160.6153846153846,"audioSegment":0},{"text":"gezel run \"...\"             one-shot: send a prompt, print the reply","startTime":160.6153846153846,"endTime":163.65384615384616,"audioSegment":0},{"text":"gezel doctor                check the installation","startTime":163.65384615384616,"endTime":166.69230769230768,"audioSegment":0},{"text":"If the desktop app's machine-wide service is in use,","startTime":166.69230769230768,"endTime":169.73076923076923,"audioSegment":0},{"text":"gezel stop applies the emergency brake to it instead and says the service is managed by the operating system.","startTime":169.73076923076923,"endTime":172.76923076923077,"audioSegment":0},{"text":"It does the same for a service the Gezel app started for you,","startTime":172.76923076923077,"endTime":175.80769230769232,"audioSegment":0},{"text":"which the app would only start again: quit the app to shut that one down.","startTime":175.80769230769232,"endTime":178.84615384615384,"audioSegment":0},{"text":"gezel stop shuts a service down only after confirming the process is Gezel's.","startTime":178.84615384615384,"endTime":181.8846153846154,"audioSegment":0},{"text":"When the service has already exited, it removes the files the service left behind,","startTime":181.8846153846154,"endTime":184.9230769230769,"audioSegment":0},{"text":"and it never stops another program that happens to have reused the service's old process number.","startTime":184.9230769230769,"endTime":187.96153846153845,"audioSegment":0},{"text":"gezel stop --daemon still works and means the same as gezel stop.","startTime":187.96153846153845,"endTime":191,"audioSegment":0},{"text":"gezel, gezel run, gezel do, and the other project commands work in the project for the folder you run them from,","startTime":191,"endTime":194.22222222222223,"audioSegment":0},{"text":"and create it the first time.","startTime":194.22222222222223,"endTime":197.44444444444446,"audioSegment":0},{"text":"Pass --project <folder> to use another folder without changing directory.","startTime":197.44444444444446,"endTime":200.66666666666666,"audioSegment":0},{"text":"Gezel never makes a project of your home folder,","startTime":200.66666666666666,"endTime":203.88888888888889,"audioSegment":0},{"text":"the temp folder, or the top of a drive.","startTime":203.88888888888889,"endTime":207.11111111111111,"audioSegment":0},{"text":"Run a command from one of those and it uses the Default project instead,","startTime":207.11111111111111,"endTime":210.33333333333334,"audioSegment":0},{"text":"with a note saying so.","startTime":210.33333333333334,"endTime":213.55555555555554,"audioSegment":0},{"text":"Naming one of those folders with --project stops the command,","startTime":213.55555555555554,"endTime":216.77777777777777,"audioSegment":0},{"text":"so it never quietly uses a different project than the one you asked for.","startTime":216.77777777777777,"endTime":220,"audioSegment":0},{"text":"gezel agent list            your gezels","startTime":220,"endTime":222.76923076923077,"audioSegment":0},{"text":"gezel project list          your projects (gezel env is the same command)","startTime":222.76923076923077,"endTime":225.53846153846155,"audioSegment":0},{"text":"gezel task list             tasks across every project (--status to filter)","startTime":225.53846153846155,"endTime":228.30769230769232,"audioSegment":0},{"text":"gezel task show <ref>       one task, such as default/12","startTime":228.30769230769232,"endTime":231.07692307692307,"audioSegment":0},{"text":"gezel task pause <ref>      pause one task without stopping the others","startTime":231.07692307692307,"endTime":233.84615384615384,"audioSegment":0},{"text":"gezel task resume <ref>     retry a paused task and wait for its result","startTime":233.84615384615384,"endTime":236.6153846153846,"audioSegment":0},{"text":"gezel craftbook list [words]","startTime":236.6153846153846,"endTime":239.3846153846154,"audioSegment":0},{"text":"craftbooks you can start in this folder's project","startTime":239.3846153846154,"endTime":242.15384615384616,"audioSegment":0},{"text":"(words filter by command, title, and tags)","startTime":242.15384615384616,"endTime":244.92307692307693,"audioSegment":0},{"text":"gezel do <craftbook>        start a craftbook as a task in this folder's project","startTime":244.92307692307693,"endTime":247.69230769230768,"audioSegment":0},{"text":"(--wait to stay until it finishes)","startTime":247.69230769230768,"endTime":250.46153846153845,"audioSegment":0},{"text":"gezel skills list           SKILL.md skills found in this project's workspace","startTime":250.46153846153845,"endTime":253.23076923076923,"audioSegment":0},{"text":"gezel skills import <path>  turn one of those skills into a craftbook","startTime":253.23076923076923,"endTime":256,"audioSegment":0},{"text":"gezel app new my-app        scaffold an app source folder","startTime":256,"endTime":259.125,"audioSegment":0},{"text":"gezel app validate my-app   check a source folder or .gezapp (--json for tooling)","startTime":259.125,"endTime":262.25,"audioSegment":0},{"text":"gezel app pack my-app       produce my-app-1.0.0.gezapp","startTime":262.25,"endTime":265.375,"audioSegment":0},{"text":"gezel app add <file> --yes  review and install a package","startTime":265.375,"endTime":268.5,"audioSegment":0},{"text":"gezel app apply my-app      outfit the current folder as a project","startTime":268.5,"endTime":271.625,"audioSegment":0},{"text":"gezel app serve my-app      share its page as a mini-site","startTime":271.625,"endTime":274.75,"audioSegment":0},{"text":"The full story — the source-folder format, both script forms,","startTime":274.75,"endTime":277.875,"audioSegment":0},{"text":"and the loop an AI agent can drive — is Building AI Apps inside Gezel.","startTime":277.875,"endTime":281,"audioSegment":0},{"text":"gezel model list            local chat models for this computer's engine","startTime":281,"endTime":283.5,"audioSegment":0},{"text":"gezel model list --available","startTime":283.5,"endTime":286,"audioSegment":0},{"text":"catalog models that fit this computer, with sizes","startTime":286,"endTime":288.5,"audioSegment":0},{"text":"gezel model pull <id>       download a chat model from the catalog","startTime":288.5,"endTime":291,"audioSegment":0},{"text":"gezel model use <id>        make chats use a downloaded model","startTime":291,"endTime":293.5,"audioSegment":0},{"text":"gezel model context <id> [tokens]","startTime":293.5,"endTime":296,"audioSegment":0},{"text":"show or set a model's context window (auto clears it)","startTime":296,"endTime":298.5,"audioSegment":0},{"text":"gezel model concurrency [slots]","startTime":298.5,"endTime":301,"audioSegment":0},{"text":"show or set how many requests a local engine serves at once","startTime":301,"endTime":303.5,"audioSegment":0},{"text":"gezel model export <id> [file]","startTime":303.5,"endTime":306,"audioSegment":0},{"text":"save a model as a portable .gezmodel file","startTime":306,"endTime":308.5,"audioSegment":0},{"text":"gezel native install        download and verify the on-device engines","startTime":308.5,"endTime":311,"audioSegment":0},{"text":"gezel native status         engine release, platform, and backend","startTime":311,"endTime":313.5,"audioSegment":0},{"text":"gezel image models          local image-generation models (image pull / image rm)","startTime":313.5,"endTime":316,"audioSegment":0},{"text":"gezel create-image \"...\"    generate an image with the configured image engine","startTime":316,"endTime":318.6666666666667,"audioSegment":0},{"text":"gezel create-video \"...\"    generate a video","startTime":318.6666666666667,"endTime":321.3333333333333,"audioSegment":0},{"text":"gezel create-audio \"...\"    read text aloud into an audio file","startTime":321.3333333333333,"endTime":324,"audioSegment":0},{"text":"See Working with knowledge catalogs for the complete reference, including validation, signing,","startTime":324,"endTime":326.52941176470586,"audioSegment":0},{"text":"location search, removal, Parquet export, and a build–validate–install walkthrough.","startTime":326.52941176470586,"endTime":329.05882352941177,"audioSegment":0},{"text":"How knowledge works in Gezel explains the embeddings and storage behind these commands.","startTime":329.05882352941177,"endTime":331.5882352941176,"audioSegment":0},{"text":"gezel knowledge init <dir>  scaffold a catalog folder","startTime":331.5882352941176,"endTime":334.11764705882354,"audioSegment":0},{"text":"gezel knowledge build <dir> compile it into a .gezk file","startTime":334.11764705882354,"endTime":336.6470588235294,"audioSegment":0},{"text":"gezel knowledge search <file> \"...\"","startTime":336.6470588235294,"endTime":339.1764705882353,"audioSegment":0},{"text":"search a catalog file offline","startTime":339.1764705882353,"endTime":341.70588235294116,"audioSegment":0},{"text":"gezel knowledge available   catalogs offered for download","startTime":341.70588235294116,"endTime":344.2352941176471,"audioSegment":0},{"text":"gezel knowledge install <source>","startTime":344.2352941176471,"endTime":346.7647058823529,"audioSegment":0},{"text":"install one by catalog id, file, or URL","startTime":346.7647058823529,"endTime":349.29411764705884,"audioSegment":0},{"text":"gezel knowledge list        what is installed","startTime":349.29411764705884,"endTime":351.8235294117647,"audioSegment":0},{"text":"Building, checking, and searching a catalog file work without the service;","startTime":351.8235294117647,"endTime":354.3529411764706,"audioSegment":0},{"text":"installing and listing use the running Gezel.","startTime":354.3529411764706,"endTime":356.88235294117646,"audioSegment":0},{"text":"Building a catalog and search --semantic also need the embedding runtime,","startTime":356.88235294117646,"endTime":359.4117647058823,"audioSegment":0},{"text":"which the desktop app includes.","startTime":359.4117647058823,"endTime":361.94117647058823,"audioSegment":0},{"text":"After an npm install,","startTime":361.94117647058823,"endTime":364.47058823529414,"audioSegment":0},{"text":"add it with npm install -g @huggingface/transformers@^4.3.1 (without -g if the CLI is installed in a project).","startTime":364.47058823529414,"endTime":367,"audioSegment":0},{"text":"gezel secret list           which provider keys are set (never their values)","startTime":367,"endTime":369.375,"audioSegment":0},{"text":"gezel secret set <name> --env VARIABLE","startTime":369.375,"endTime":371.75,"audioSegment":0},{"text":"store a key, read from an environment variable","startTime":371.75,"endTime":374.125,"audioSegment":0},{"text":"(or --stdin to pipe it in)","startTime":374.125,"endTime":376.5,"audioSegment":0},{"text":"gezel secret remove <name>  forget a key","startTime":376.5,"endTime":378.875,"audioSegment":0},{"text":"gezel security external-services [on|off]","startTime":378.875,"endTime":381.25,"audioSegment":0},{"text":"let gezels use web search and other outside services","startTime":381.25,"endTime":383.625,"audioSegment":0},{"text":"gezel env indexing [on|off] pause or resume background indexing for this project","startTime":383.625,"endTime":386,"audioSegment":0},{"text":"gezel cleanup               see how much space Gezel is using","startTime":386,"endTime":388.4,"audioSegment":0},{"text":"gezel cleanup --redownloadable","startTime":388.4,"endTime":390.8,"audioSegment":0},{"text":"reclaim everything Gezel can download again","startTime":390.8,"endTime":393.2,"audioSegment":0},{"text":"gezel backup <file>         write your gezels, projects, and documents to a file","startTime":393.2,"endTime":395.6,"audioSegment":0},{"text":"gezel restore <file>        bring them back (--list to look first)","startTime":395.6,"endTime":398,"audioSegment":0},{"text":"gezel handboek export --out ./site","startTime":398,"endTime":401,"audioSegment":0},{"text":"renders the Handboek — the same articles you're reading now —","startTime":401,"endTime":404,"audioSegment":0},{"text":"as a static website, for publishing or offline reading.","startTime":404,"endTime":407,"audioSegment":0},{"text":"Run gezel --help (or --help on any subcommand) for the full surface.","startTime":407,"endTime":410,"audioSegment":0},{"text":"To automate work inside a project, continue with Writing scripts with gezel-sdk.","startTime":410,"endTime":413,"audioSegment":0},{"text":"To let another application use Gezel, see Building connected apps with gezel-app-sdk.","startTime":413,"endTime":416,"audioSegment":0},{"text":"When a task you wait for is blocked,","startTime":416,"endTime":419.57142857142856,"audioSegment":0},{"text":"gezel do --wait prints why (the task's latest note) and points to gezel task notes <ref>, which shows the full notes.","startTime":419.57142857142856,"endTime":423.14285714285717,"audioSegment":0},{"text":"A task watch is an observer.","startTime":423.14285714285717,"endTime":426.7142857142857,"audioSegment":0},{"text":"Its timeout ends the command without canceling or pausing native work;","startTime":426.7142857142857,"endTime":430.2857142857143,"audioSegment":0},{"text":"watching the same task again follows that work.","startTime":430.2857142857143,"endTime":433.85714285714283,"audioSegment":0},{"text":"A task's current paused status or an unanswered question blocks the watch.","startTime":433.85714285714283,"endTime":437.42857142857144,"audioSegment":0},{"text":"Historical service pause cards do not block an already resumed task and are not answered by the observer.","startTime":437.42857142857144,"endTime":441,"audioSegment":0}],"version":1},"startBlock":{"title":"The gezel command line","subtitle":"The gezel command drives the same service the desktop app uses — handy on servers, in scripts, or when you just live in a terminal.","ambientMotion":"zoomIn"}}</script>
