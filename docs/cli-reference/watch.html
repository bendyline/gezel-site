ype":"link","url":"../writing-scripts-with-gezel-sdk/","children":[{"type":"text","value":"Writing scripts with gezel-sdk","position":{"start":{"line":151,"column":53,"offset":8086},"end":{"line":151,"column":83,"offset":8116}}}],"position":{"start":{"line":151,"column":52,"offset":8085},"end":{"line":151,"column":120,"offset":8153}}},{"type":"text","value":". To let another application use Gezel, see ","position":{"start":{"line":151,"column":120,"offset":8153},"end":{"line":151,"column":164,"offset":8197}}},{"type":"link","url":"../building-connected-apps-with-gezel-app-sdk/","children":[{"type":"text","value":"Building connected apps with gezel-app-sdk","position":{"start":{"line":151,"column":165,"offset":8198},"end":{"line":151,"column":207,"offset":8240}}}],"position":{"start":{"line":151,"column":164,"offset":8197},"end":{"line":151,"column":256,"offset":8289}}},{"type":"text","value":".","position":{"start":{"line":151,"column":256,"offset":8289},"end":{"line":151,"column":257,"offset":8290}}}],"position":{"start":{"line":151,"column":1,"offset":8034},"end":{"line":151,"column":257,"offset":8290}}}]},{"id":"watching-tasks","startTime":336,"duration":17,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Watching tasks","position":{"start":{"line":153,"column":4,"offset":8295},"end":{"line":153,"column":18,"offset":8309}}}],"position":{"start":{"line":153,"column":1,"offset":8292},"end":{"line":153,"column":18,"offset":8309}}},"title":"Watching tasks","contents":[{"type":"paragraph","children":[{"type":"text","value":"A task watch is an observer. Its timeout ends the command without canceling or pausing native work; watching the same task again follows that work. A task's current paused status or an unanswered question blocks the watch. Historical service pause cards do not block an already resumed task and are not answered by the observer.","position":{"start":{"line":155,"column":1,"offset":8311},"end":{"line":155,"column":329,"offset":8639}}}],"position":{"start":{"line":155,"column":1,"offset":8311},"end":{"line":155,"column":329,"offset":8639}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The gezel command drives the same service the desktop app uses —","startTime":0,"endTime":3.6666666666666665,"audioSegment":0},{"text":"handy on servers, in scripts, or when you just live in a terminal.","startTime":3.6666666666666665,"endTime":7.333333333333333,"audioSegment":0},{"text":"Install the command-line package with Node.js 24 or newer:","startTime":7.333333333333333,"endTime":11,"audioSegment":0},{"text":"npm install @bendyline/gezel-cli npx gezel","startTime":11,"endTime":14.666666666666666,"audioSegment":0},{"text":"The CLI is one of Gezel's public JavaScript packages.","startTime":14.666666666666666,"endTime":18.333333333333332,"audioSegment":0},{"text":"See Gezel on npm for the complete package map and the SDKs to use when a shell command is not the right integration boundary.","startTime":18.333333333333332,"endTime":22,"audioSegment":0},{"text":"The npm package is sufficient for local CLI use, including first use.","startTime":22,"endTime":25.238095238095237,"audioSegment":0},{"text":"The CLI discovers your per-user daemon through its runtime files and pinned TLS certificate,","startTime":25.238095238095237,"endTime":28.476190476190474,"audioSegment":0},{"text":"then connects with your same-user owner credential.","startTime":28.476190476190474,"endTime":31.714285714285715,"audioSegment":0},{"text":"You do not need to install or open the desktop app or approve a connection to your own local daemon.","startTime":31.714285714285715,"endTime":34.95238095238095,"audioSegment":0},{"text":"Management commands can start your user daemon when it is absent;","startTime":34.95238095238095,"endTime":38.19047619047619,"audioSegment":0},{"text":"it keeps running until you use gezel stop --daemon.","startTime":38.19047619047619,"endTime":41.42857142857143,"audioSegment":0},{"text":"The interactive terminal app shuts down a daemon it started when you exit.","startTime":41.42857142857143,"endTime":44.66666666666667,"audioSegment":0},{"text":"gezel run adopts an already-running user daemon,","startTime":44.66666666666667,"endTime":47.904761904761905,"audioSegment":0},{"text":"or starts a service in-process for that one invocation and stops it afterward.","startTime":47.904761904761905,"endTime":51.14285714285714,"audioSegment":0},{"text":"An unhealthy running daemon remains an error.","startTime":51.14285714285714,"endTime":54.38095238095238,"audioSegment":0},{"text":"An explicit --connect <url> uses a separate CLI-scoped grant for that service.","startTime":54.38095238095238,"endTime":57.61904761904762,"audioSegment":0},{"text":"Without a valid saved grant or supplied --token,","startTime":57.61904761904762,"endTime":60.85714285714286,"audioSegment":0},{"text":"the terminal displays a six-character code and waits for you to approve Gezel CLI in the Gezel app.","startTime":60.85714285714286,"endTime":64.0952380952381,"audioSegment":0},{"text":"The resulting revocable credential is saved under ~/.gezel/cli/tokens/.","startTime":64.0952380952381,"endTime":67.33333333333334,"audioSegment":0},{"text":"A valid saved grant or --connect <url> --token <token> lets you connect without that interaction.","startTime":67.33333333333334,"endTime":70.57142857142857,"audioSegment":0},{"text":"Rolling-upgrade compatibility may also select an older legacy-full machine service,","startTime":70.57142857142857,"endTime":73.80952380952381,"audioSegment":0},{"text":"which uses that approval path.","startTime":73.80952380952381,"endTime":77.04761904761905,"audioSegment":0},{"text":"Use --standalone to skip this compatibility choice;","startTime":77.04761904761905,"endTime":80.28571428571428,"audioSegment":0},{"text":"--home <path> or an explicit GEZEL_HOME also implies standalone operation.","startTime":80.28571428571428,"endTime":83.52380952380952,"audioSegment":0},{"text":"A modern machine service is an engine broker;","startTime":83.52380952380952,"endTime":86.76190476190476,"audioSegment":0},{"text":"your per-user daemon handles product data and connects to that broker for inference.","startTime":86.76190476190476,"endTime":90,"audioSegment":0},{"text":"gezel                       open the interactive terminal app for this folder's project","startTime":90,"endTime":92.33333333333333,"audioSegment":0},{"text":"gezel start                 ensure the service is running","startTime":92.33333333333333,"endTime":94.66666666666667,"audioSegment":0},{"text":"gezel start --port 8080 --foreground","startTime":94.66666666666667,"endTime":97,"audioSegment":0},{"text":"run it attached, on a fixed port","startTime":97,"endTime":99.33333333333333,"audioSegment":0},{"text":"gezel start --web --open    serve the web interface on this computer and open","startTime":99.33333333333333,"endTime":101.66666666666667,"audioSegment":0},{"text":"it in your browser","startTime":101.66666666666667,"endTime":104,"audioSegment":0},{"text":"gezel status                is it up,","startTime":104,"endTime":106.33333333333334,"audioSegment":0},{"text":"and where (exits 1 if not running or unhealthy)","startTime":106.33333333333334,"endTime":108.66666666666667,"audioSegment":0},{"text":"gezel stop                  emergency stop: cancel AI work, unload engines,","startTime":108.66666666666667,"endTime":111,"audioSegment":0},{"text":"switch to Reactive — the service keeps running","startTime":111,"endTime":113.33333333333334,"audioSegment":0},{"text":"gezel stop --daemon         shut the service down","startTime":113.33333333333334,"endTime":115.66666666666667,"audioSegment":0},{"text":"gezel mode [mode]           show or set how active the AI may be","startTime":115.66666666666667,"endTime":118,"audioSegment":0},{"text":"(read-only, reactive, reactive+tasks, full-play)","startTime":118,"endTime":120.33333333333334,"audioSegment":0},{"text":"gezel run \"...\"             one-shot: send a prompt, print the reply","startTime":120.33333333333334,"endTime":122.66666666666667,"audioSegment":0},{"text":"gezel doctor                check the installation","startTime":122.66666666666667,"endTime":125,"audioSegment":0},{"text":"gezel, gezel run, gezel do, and the other project commands work in the project for the folder you run them from,","startTime":125,"endTime":128.22222222222223,"audioSegment":0},{"text":"and create it the first time.","startTime":128.22222222222223,"endTime":131.44444444444446,"audioSegment":0},{"text":"Pass --project <folder> to use another folder without changing directory.","startTime":131.44444444444446,"endTime":134.66666666666666,"audioSegment":0},{"text":"Gezel never makes a project of your home folder,","startTime":134.66666666666666,"endTime":137.88888888888889,"audioSegment":0},{"text":"the temp folder, or the top of a drive.","startTime":137.88888888888889,"endTime":141.11111111111111,"audioSegment":0},{"text":"Run a command from one of those and it uses the Default project instead,","startTime":141.11111111111111,"endTime":144.33333333333334,"audioSegment":0},{"text":"with a note saying so.","startTime":144.33333333333334,"endTime":147.55555555555554,"audioSegment":0},{"text":"Naming one of those folders with --project stops the command,","startTime":147.55555555555554,"endTime":150.77777777777777,"audioSegment":0},{"text":"so it never quietly uses a different project than the one you asked for.","startTime":150.77777777777777,"endTime":154,"audioSegment":0},{"text":"gezel agent list            your gezellen","startTime":154,"endTime":157,"audioSegment":0},{"text":"gezel project list          your projects (gezel env is the same command)","startTime":157,"endTime":160,"audioSegment":0},{"text":"gezel task list             tasks across every project (--status to filter)","startTime":160,"endTime":163,"audioSegment":0},{"text":"gezel task show <ref>       one task, such as default/12","startTime":163,"endTime":166,"audioSegment":0},{"text":"gezel task pause <ref>      pause one task without stopping the others","startTime":166,"endTime":169,"audioSegment":0},{"text":"gezel task resume <ref>     retry a paused task and wait for its result","startTime":169,"endTime":172,"audioSegment":0},{"text":"gezel do <craftbook>        start a craftbook as a task in this folder's project","startTime":172,"endTime":175,"audioSegment":0},{"text":"(--wait to stay until it finishes)","startTime":175,"endTime":178,"audioSegment":0},{"text":"gezel skills list           SKILL.md skills found in this project's workspace","startTime":178,"endTime":181,"audioSegment":0},{"text":"gezel skills import <path>  turn one of those skills into a craftbook","startTime":181,"endTime":184,"audioSegment":0},{"text":"gezel app new my-app        scaffold an app source folder","startTime":184,"endTime":187.125,"audioSegment":0},{"text":"gezel app validate my-app   check a source folder or .gezapp (--json for tooling)","startTime":187.125,"endTime":190.25,"audioSegment":0},{"text":"gezel app pack my-app       produce my-app-1.0.0.gezapp","startTime":190.25,"endTime":193.375,"audioSegment":0},{"text":"gezel app add <file> --yes  review and install a package","startTime":193.375,"endTime":196.5,"audioSegment":0},{"text":"gezel app apply my-app      outfit the current folder as a project","startTime":196.5,"endTime":199.625,"audioSegment":0},{"text":"gezel app serve my-app      share its page as a mini-site","startTime":199.625,"endTime":202.75,"audioSegment":0},{"text":"The full story — the source-folder format, both script forms,","startTime":202.75,"endTime":205.875,"audioSegment":0},{"text":"and the loop an AI agent can drive — is Building AI Apps inside Gezel.","startTime":205.875,"endTime":209,"audioSegment":0},{"text":"gezel model list            local chat models for this computer's engine","startTime":209,"endTime":211.54545454545453,"audioSegment":0},{"text":"gezel model pull <id>       download a chat model from the catalog","startTime":211.54545454545453,"endTime":214.0909090909091,"audioSegment":0},{"text":"gezel model context <id> [tokens]","startTime":214.0909090909091,"endTime":216.63636363636363,"audioSegment":0},{"text":"show or set a model's context window (auto clears it)","startTime":216.63636363636363,"endTime":219.1818181818182,"audioSegment":0},{"text":"gezel model concurrency [slots]","startTime":219.1818181818182,"endTime":221.72727272727272,"audioSegment":0},{"text":"show or set how many requests a local engine serves at once","startTime":221.72727272727272,"endTime":224.27272727272728,"audioSegment":0},{"text":"gezel model export <id> [file]","startTime":224.27272727272728,"endTime":226.8181818181818,"audioSegment":0},{"text":"save a model as a portable .gezmodel file","startTime":226.8181818181818,"endTime":229.36363636363637,"audioSegment":0},{"text":"gezel native install        download and verify the on-device engines","startTime":229.36363636363637,"endTime":231.9090909090909,"audioSegment":0},{"text":"gezel native status         engine release, platform, and backend","startTime":231.9090909090909,"endTime":234.45454545454544,"audioSegment":0},{"text":"gezel image models          local image-generation models (image pull / image rm)","startTime":234.45454545454544,"endTime":237,"audioSegment":0},{"text":"gezel create-image \"...\"    generate an image with the configured image engine","startTime":237,"endTime":239.66666666666666,"audioSegment":0},{"text":"gezel create-video \"...\"    generate a video","startTime":239.66666666666666,"endTime":242.33333333333334,"audioSegment":0},{"text":"gezel create-audio \"...\"    read text aloud into an audio file","startTime":242.33333333333334,"endTime":245,"audioSegment":0},{"text":"See Working with knowledge catalogs for the complete reference, including validation, signing,","startTime":245,"endTime":247.47058823529412,"audioSegment":0},{"text":"location search, removal, Parquet export, and a build–validate–install walkthrough.","startTime":247.47058823529412,"endTime":249.94117647058823,"audioSegment":0},{"text":"How knowledge works in Gezel explains the embeddings and storage behind these commands.","startTime":249.94117647058823,"endTime":252.41176470588235,"audioSegment":0},{"text":"gezel knowledge init <dir>  scaffold a catalog folder","startTime":252.41176470588235,"endTime":254.88235294117646,"audioSegment":0},{"text":"gezel knowledge build <dir> compile it into a .gezk file","startTime":254.88235294117646,"endTime":257.3529411764706,"audioSegment":0},{"text":"gezel knowledge search <file> \"...\"","startTime":257.3529411764706,"endTime":259.8235294117647,"audioSegment":0},{"text":"search a catalog file offline","startTime":259.8235294117647,"endTime":262.29411764705884,"audioSegment":0},{"text":"gezel knowledge available   catalogs offered for download","startTime":262.29411764705884,"endTime":264.7647058823529,"audioSegment":0},{"text":"gezel knowledge install <source>","startTime":264.7647058823529,"endTime":267.2352941176471,"audioSegment":0},{"text":"install one by catalog id, file, or URL","startTime":267.2352941176471,"endTime":269.70588235294116,"audioSegment":0},{"text":"gezel knowledge list        what is installed","startTime":269.70588235294116,"endTime":272.1764705882353,"audioSegment":0},{"text":"Building, checking, and searching a catalog file work without the service;","startTime":272.1764705882353,"endTime":274.6470588235294,"audioSegment":0},{"text":"installing and listing use the running gezel.","startTime":274.6470588235294,"endTime":277.11764705882354,"audioSegment":0},{"text":"Building a catalog and search --semantic also need the embedding runtime,","startTime":277.11764705882354,"endTime":279.5882352941177,"audioSegment":0},{"text":"which the desktop app includes.","startTime":279.5882352941177,"endTime":282.05882352941177,"audioSegment":0},{"text":"After an npm install,","startTime":282.05882352941177,"endTime":284.52941176470586,"audioSegment":0},{"text":"add it with npm install -g @huggingface/transformers@^3.8.1 (without -g if gezel is installed in a project).","startTime":284.52941176470586,"endTime":287,"audioSegment":0},{"text":"gezel secret list           which provider keys are set (never their values)","startTime":287,"endTime":289.375,"audioSegment":0},{"text":"gezel secret set <name> --env VARIABLE","startTime":289.375,"endTime":291.75,"audioSegment":0},{"text":"store a key, read from an environment variable","startTime":291.75,"endTime":294.125,"audioSegment":0},{"text":"(or --stdin to pipe it in)","startTime":294.125,"endTime":296.5,"audioSegment":0},{"text":"gezel secret remove <name>  forget a key","startTime":296.5,"endTime":298.875,"audioSegment":0},{"text":"gezel security external-services [on|off]","startTime":298.875,"endTime":301.25,"audioSegment":0},{"text":"let gezels use web search and other outside services","startTime":301.25,"endTime":303.625,"audioSegment":0},{"text":"gezel env indexing [on|off] pause or resume background indexing for this project","startTime":303.625,"endTime":306,"audioSegment":0},{"text":"gezel cleanup               see how much space gezel is using","startTime":306,"endTime":308.4,"audioSegment":0},{"text":"gezel cleanup --redownloadable","startTime":308.4,"endTime":310.8,"audioSegment":0},{"text":"reclaim everything gezel can download again","startTime":310.8,"endTime":313.2,"audioSegment":0},{"text":"gezel backup <file>         write your gezels, projects, and documents to a file","startTime":313.2,"endTime":315.6,"audioSegment":0},{"text":"gezel restore <file>        bring them back (--list to look first)","startTime":315.6,"endTime":318,"audioSegment":0},{"text":"gezel handboek export --out ./site","startTime":318,"endTime":321,"audioSegment":0},{"text":"renders the Handboek — the same articles you're reading now —","startTime":321,"endTime":324,"audioSegment":0},{"text":"as a static website, for publishing or offline reading.","startTime":324,"endTime":327,"audioSegment":0},{"text":"Run gezel --help (or --help on any subcommand) for the full surface.","startTime":327,"endTime":330,"audioSegment":0},{"text":"To automate work inside a project, continue with Writing scripts with gezel-sdk.","startTime":330,"endTime":333,"audioSegment":0},{"text":"To let another application use Gezel, see Building connected apps with gezel-app-sdk.","startTime":333,"endTime":336,"audioSegment":0},{"text":"A task watch is an observer.","startTime":336,"endTime":339.4,"audioSegment":0},{"text":"Its timeout ends the command without canceling or pausing native work;","startTime":339.4,"endTime":342.8,"audioSegment":0},{"text":"watching the same task again follows that work.","startTime":342.8,"endTime":346.2,"audioSegment":0},{"text":"A task's current paused status or an unanswered question blocks the watch.","startTime":346.2,"endTime":349.6,"audioSegment":0},{"text":"Historical service pause cards do not block an already resumed task and are not answered by the observer.","startTime":349.6,"endTime":353,"audioSegment":0}],"version":1},"startBlock":{"title":"The gezel command line","subtitle":"The gezel command drives the same service the desktop app uses — handy on servers, in scripts, or when you just live in a terminal.","ambientMotion":"zoomIn"}}</script>
