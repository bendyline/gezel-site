me":75,"endTime":78,"audioSegment":0},{"text":"(--wait to stay until it finishes)","startTime":78,"endTime":81,"audioSegment":0},{"text":"gezel skills list           SKILL.md skills found in this project's workspace","startTime":81,"endTime":84,"audioSegment":0},{"text":"gezel skills import <path>  turn one of those skills into a craftbook","startTime":84,"endTime":87,"audioSegment":0},{"text":"gezel app new my-app        scaffold an app source folder","startTime":87,"endTime":90.125,"audioSegment":0},{"text":"gezel app validate my-app   check a source folder or .gezapp (--json for tooling)","startTime":90.125,"endTime":93.25,"audioSegment":0},{"text":"gezel app pack my-app       produce my-app-1.0.0.gezapp","startTime":93.25,"endTime":96.375,"audioSegment":0},{"text":"gezel app add <file> --yes  review and install a package","startTime":96.375,"endTime":99.5,"audioSegment":0},{"text":"gezel app apply my-app      outfit the current folder as a project","startTime":99.5,"endTime":102.625,"audioSegment":0},{"text":"gezel app serve my-app      share its page as a mini-site","startTime":102.625,"endTime":105.75,"audioSegment":0},{"text":"The full story — the source-folder format, both script forms,","startTime":105.75,"endTime":108.875,"audioSegment":0},{"text":"and the loop an AI agent can drive — is Building AI Apps inside Gezel.","startTime":108.875,"endTime":112,"audioSegment":0},{"text":"gezel model list            local chat models for this computer's engine","startTime":112,"endTime":114.54545454545455,"audioSegment":0},{"text":"gezel model pull <id>       download a chat model from the catalog","startTime":114.54545454545455,"endTime":117.0909090909091,"audioSegment":0},{"text":"gezel model context <id> [tokens]","startTime":117.0909090909091,"endTime":119.63636363636364,"audioSegment":0},{"text":"show or set a model's context window (auto clears it)","startTime":119.63636363636364,"endTime":122.18181818181819,"audioSegment":0},{"text":"gezel model concurrency [ 9.42857142857142,"audioSegment":0},{"text":"gezel knowledge install <source>","startTime":159.42857142857142,"endTime":161.71428571428572,"audioSegment":0},{"text":"install one by catalog id, file, or URL","startTime":161.71428571428572,"endTime":164,"audioSegment":0},{"text":"gezel knowledge list        what is installed","startTime":164,"endTime":166.28571428571428,"audioSegment":0},{"text":"Building, checking, and searching a catalog file work without the service;","startTime":166.28571428571428,"endTime":168.57142857142856,"audioSegment":0},{"text":"installing and listing use the running gezel.","startTime":168.57142857142856,"endTime":170.85714285714286,"audioSegment":0},{"text":"Building a catalog and search --semantic also need the embedding runtime,","startTime":170.85714285714286,"endTime":173.14285714285714,"audioSegment":0},{"text":"which the desktop app includes.","startTime":173.14285714285714,"endTime":175.42857142857142,"audioSegment":0},{"text":"After an npm install,","startTime":175.42857142857142,"endTime":177.71428571428572,"audioSegment":0},{"text":"add it with npm install -g @huggingface/transformers@^3.8.1 (without -g if gezel is installed in a project).","startTime":177.71428571428572,"endTime":180,"audioSegment":0},{"text":"gezel secret list           which provider keys are set (never their values)","startTime":180,"endTime":182.375,"audioSegment":0},{"text":"gezel secret set <name> --env VARIABLE","startTime":182.375,"endTime":184.75,"audioSegment":0},{"text":"store a key, read from an environment variable","startTime":184.75,"endTime":187.125,"audioSegment":0},{"text":"(or --stdin to pipe it in)","startTime":187.125,"endTime":189.5,"audioSegment":0},{"text":"gezel secret remove <name>  forget a key","startTime":189.5,"endTime":191.875,"audioSegment":0},{"text":"gezel security external-services [on|off]","startTime":191.875,"endTime":194.25,"audioSegment":0},{"text":"let gezels use web search and other outside services","startTime":194.25,"endTime":196.625,"audioSegment":0},{"text":"gezel env indexing [on|off] pause or resume background indexing for this project","startTime":196.625,"endTime":199,"audioSegment":0},{"text":"gezel cleanup               see how much space gezel is using","startTime":199,"endTime":201.4,"audioSegment":0},{"text":"gezel cleanup --redownloadable","startTime":201.4,"endTime":203.8,"audioSegment":0},{"text":"reclaim everything gezel can download again","startTime":203.8,"endTime":206.2,"audioSegment":0},{"text":"gezel backup <file>         write your gezels, projects, and documents to a file","startTime":206.2,"endTime":208.6,"audioSegment":0},{"text":"gezel restore <file>        bring them back (--list to look first)","startTime":208.6,"endTime":211,"audioSegment":0},{"text":"gezel handboek export --out ./site","startTime":211,"endTime":214,"audioSegment":0},{"text":"renders the Handboek — the same articles you're reading now —","startTime":214,"endTime":217,"audioSegment":0},{"text":"as a static website, for publishing or offline reading.","startTime":217,"endTime":220,"audioSegment":0},{"text":"Run gezel --help (or --help on any subcommand) for the full surface.","startTime":220,"endTime":223,"audioSegment":0},{"text":"To automate work inside a project, continue with Writing scripts with gezel-sdk.","startTime":223,"endTime":226,"audioSegment":0},{"text":"To let another application use Gezel, see Building connected apps with gezel-app-sdk.","startTime":226,"endTime":229,"audioSegment":0},{"text":"A task watch is an observer.","startTime":229,"endTime":232.4,"audioSegment":0},{"text":"Its timeout ends the command without canceling or pausing native work;","startTime":232.4,"endTime":235.8,"audioSegment":0},{"text":"watching the same task again follows that work.","startTime":235.8,"endTime":239.2,"audioSegment":0},{"text":"A task's current paused status or an unanswered question blocks the watch.","startTime":239.2,"endTime":242.6,"audioSegment":0},{"text":"Historical service pause cards do not block an already resumed task and are not answered by the observer.","startTime":242.6,"endTime":246,"audioSegment":0}],"version":1},"startBlock":{"title":"The gezel command line","subtitle":"The gezel command drives the same service the desktop app uses — handy on servers, in scripts, or when you just live in a terminal.","ambientMotion":"zoomIn"}}</script>
