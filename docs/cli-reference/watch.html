the configured image engine\ngezel create-video \"...\"    generate a video\ngezel create-audio \"...\"    read text aloud into an audio file","position":{"start":{"line":203,"column":1,"offset":14498},"end":{"line":207,"column":4,"offset":14692}}}]},{"id":"knowledge-catalogs","startTime":639,"duration":43,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Knowledge catalogs","position":{"start":{"line":209,"column":4,"offset":14697},"end":{"line":209,"column":22,"offset":14715}}}],"position":{"start":{"line":209,"column":1,"offset":14694},"end":{"line":209,"column":22,"offset":14715}}},"title":"Knowledge catalogs","contents":[{"type":"paragraph","children":[{"type":"text","value":"See ","position":{"start":{"line":211,"column":1,"offset":14717},"end":{"line":211,"column":5,"offset":14721}}},{"type":"link","url":"../knowledge-command-line/","children":[{"type":"text","value":"Working with knowledge catalogs","position":{"start":{"line":211,"column":6,"offset":14722},"end":{"line":211,"column":37,"offset":14753}}}],"position":{"start":{"line":211,"column":5,"offset":14721},"end":{"line":211,"column":66,"offset":14782}}},{"type":"text","value":" for the complete reference, including validation, signing, location search, removal, Parquet export, and a build–validate–install walkthrough. ","position":{"start":{"line":211,"column":66,"offset":14782},"end":{"line":211,"column":210,"offset":14926}}},{"type":"link","url":"../how-knowledge-works/","children":[{"type":"text","value":"How knowledge works in Gezel","position":{"start":{"line":211,"column":211,"offset":14927},"end":{"line":211,"column":239,"offset":14955}}}],"position":{"start":{"line":211,"column":210,"offset":14926},"end":{"line":211,"column":265,"offset":14981}}},{"type":"text","value":" explains the embeddings and storage behind these commands.","position":{"start":{"line":211,"column":265,"offset":14981},"end":{"line":211,"column":324, :224,"column":366,"offset":15826}}}],"position":{"start":{"line":224,"column":1,"offset":15461},"end":{"line":224,"column":366,"offset":15826}}}]},{"id":"keys-and-security-settings","startTime":682,"duration":26,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Keys and security settings","position":{"start":{"line":226,"column":4,"offset":15831},"end":{"line":226,"column":30,"offset":15857}}}],"position":{"start":{"line":226,"column":1,"offset":15828},"end":{"line":226,"column":30,"offset":15857}}},"title":"Keys and security settings","contents":[{"type":"code","value":"gezel secret list           which provider keys are set (never their values)\ngezel secret set <name> --env VARIABLE\n                            store a key, read from an environment variable\n                            (or --stdin to pipe it in)\ngezel secret remove <name>  forget a key\ngezel security level        the security level and what it allows\ngezel security level set <super-lockdown|lockdown|free>\n                            switch to a preset (free is Unrestricted in Settings)\ngezel security external-services [on|off]\n                            let your crew use web search and other outside services\ngezel env indexing [on|off] pause or resume background indexing for this project","position":{"start":{"line":228,"column":1,"offset":15859},"end":{"line":240,"column":4,"offset":16564}}}]},{"id":"space-backups-and-restoring","startTime":708,"duration":12,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Space, backups, and restoring","position":{"start":{"line":242,"column":4,"offset":16569},"end":{"line":242,"column":33,"offset":16598}}}],"position":{"start":{"line":242,"column":1,"offset":16566},"end":{"line":242,"column":33,"offset":16598}}},"title":"Space, backups, and restoring","contents":[{"type":"code","value":"gezel cleanup               see how much space Gezel is using\ngezel cleanup --redownloadable\n                            reclaim everything Gezel can download again\ngezel backup <file>         write your crew, projects, and documents to a file\ngezel restore <file>        bring them back (--list to look first)","position":{"start":{"line":244,"column":1,"offset":16600},"end":{"line":250,"column":4,"offset":16918}}}]},{"id":"this-documentation","startTime":720,"duration":18,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"This documentation","position":{"start":{"line":252,"column":4,"offset":16923},"end":{"line":252,"column":22,"offset":16941}}}],"position":{"start":{"line":252,"column":1,"offset":16920},"end":{"line":252,"column":22,"offset":16941}}},"title":"This documentation","contents":[{"type":"code","value":"gezel handboek export --out ./site","position":{"start":{"line":254,"column":1,"offset":16943},"end":{"line":256,"column":4,"offset":16985}}},{"type":"paragraph","children":[{"type":"text","value":"renders Help — the same articles you're reading now — as a static website, for publishing or offline reading.","position":{"start":{"line":258,"column":1,"offset":16987},"end":{"line":258,"column":110,"offset":17096}}}],"position":{"start":{"line":258,"column":1,"offset":16987},"end":{"line":258,"column":110,"offset":17096}}},{"type":"paragraph","children":[{"type":"text","value":"Run ","position":{"start":{"line":260,"column":1,"offset":17098},"end":{"line":260,"column":5,"offset":17102}}},{"type":"inlineCode","value":"gezel --help","position":{"start":{"line":260,"column":5,"offset":17102},"end":{"line":260,"column":19,"offset":17116}}},{"type":"text","value":" (or ","position":{"start":{"line":260,"column":19,"offset":17116},"end":{"line":260,"column":24,"offset":17121}}},{"type":"inlineCode","value":"--help","position":{"start":{"line":260,"column":24,"offset":17121},"end":{"line":260,"column":32,"offset":17129}}},{"type":"text","value":" on any subcommand) for the full surface.","position":{"start":{"line":260,"column":32,"offset":17129},"end":{"line":260,"column":73,"offset":17170}}}],"position":{"start":{"line":260,"column":1,"offset":17098},"end":{"line":260,"column":73,"offset":17170}}},{"type":"paragraph","children":[{"type":"text","value":"To automate work ","position":{"start":{"line":262,"column":1,"offset":17172},"end":{"line":262,"column":18,"offset":17189}}},{"type":"emphasis","children":[{"type":"text","value":"inside","position":{"start":{"line":262,"column":19,"offset":17190},"end":{"line":262,"column":25,"offset":17196}}}],"position":{"start":{"line":262,"column":18,"offset":17189},"end":{"line":262,"column":26,"offset":17197}}},{"type":"text","value":" a project, continue with ","position":{"start":{"line":262,"column":26,"offset":17197},"end":{"line":262,"column":52,"offset":17223}}},{"type":"link","url":"../writing-scripts-with-gezel-sdk/","children":[{"type":"text","value":"Writing scripts with gezel-sdk","position":{"start":{"line":262,"column":53,"offset":17224},"end":{"line":262,"column":83,"offset":17254}}}],"position":{"start":{"line":262,"column":52,"offset":17223},"end":{"line":262,"column":120,"offset":17291}}},{"type":"text","value":". To let another application use Gezel, see ","position":{"start":{"line":262,"column":120,"offset":17291},"end":{"line":262,"column":164,"offset":17335}}},{"type":"link","url":"../building-connected-apps-with-gezel-app-sdk/","children":[{"type":"text","value":"Building connected apps with gezel-app-sdk","position":{"start":{"line":262,"column":165,"offset":17336},"end":{"line":262,"column":207,"offset":17378}}}],"position":{"start":{"line":262,"column":164,"offset":17335},"end":{"line":262,"column":256,"offset":17427}}},{"type":"text","value":".","position":{"start":{"line":262,"column":256,"offset":17427},"end":{"line":262,"column":257,"offset":17428}}}],"position":{"start":{"line":262,"column":1,"offset":17172},"end":{"line":262,"column":257,"offset":17428}}}]},{"id":"watching-tasks","startTime":738,"duration":25,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Watching tasks","position":{"start":{"line":264,"column":4,"offset":17433},"end":{"line":264,"column":18,"offset":17447}}}],"position":{"start":{"line":264,"column":1,"offset":17430},"end":{"line":264,"column":18,"offset":17447}}},"title":"Watching tasks","contents":[{"type":"paragraph","children":[{"type":"text","value":"When a task you wait for is blocked, ","position":{"start":{"line":266,"column":1,"offset":17449},"end":{"line":266,"column":38,"offset":17486}}},{"type":"inlineCode","value":"gezel do --wait","position":{"start":{"line":266,"column":38,"offset":17486},"end":{"line":266,"column":55,"offset":17503}}},{"type":"text","value":" prints why (the task's latest note) and points to ","position":{"start":{"line":266,"column":55,"offset":17503},"end":{"line":266,"column":106,"offset":17554}}},{"type":"inlineCode","value":"gezel task notes <ref>","position":{"start":{"line":266,"column":106,"offset":17554},"end":{"line":266,"column":130,"offset":17578}}},{"type":"text","value":", which shows the full notes.","position":{"start":{"line":266,"column":130,"offset":17578},"end":{"line":266,"column":159,"offset":17607}}}],"position":{"start":{"line":266,"column":1,"offset":17449},"end":{"line":266,"column":159,"offset":17607}}},{"type":"paragraph","children":[{"type":"text","value":"A task watch is an observer. Its timeout ends the command without canceling or pausing native work; watching the same task again follows that work. A task's current paused status or an unanswered question blocks the watch. Historical service pause cards do not block an already resumed task and are not answered by the observer.","position":{"start":{"line":268,"column":1,"offset":17609},"end":{"line":268,"column":329,"offset":17937}}}],"position":{"start":{"line":268,"column":1,"offset":17609},"end":{"line":268,"column":329,"offset":17937}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The gezel command drives the same service the desktop app uses —","startTime":0,"endTime":2.6666666666666665,"audioSegment":0},{"text":"handy on servers, in scripts, or when you just live in a terminal.","startTime":2.6666666666666665,"endTime":5.333333333333333,"audioSegment":0},{"text":"The command line needs Node.js 24 or newer.","startTime":5.333333333333333,"endTime":8,"audioSegment":0},{"text":"Check with node --version; if it is older or missing,","startTime":8,"endTime":10.666666666666666,"audioSegment":0},{"text":"one line installs a current version:","startTime":10.666666666666666,"endTime":13.333333333333332,"audioSegment":0},{"text":"macOS: brew install node","startTime":13.333333333333332,"endTime":16,"audioSegment":0},{"text":"Windows: winget install OpenJS.NodeJS.LTS","startTime":16,"endTime":18.666666666666664,"audioSegment":0},{"text":"Ubuntu or Debian: curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -","startTime":18.666666666666664,"endTime":21.333333333333332,"audioSegment":0},{"text":"&& sudo apt-get install -y nodejs","startTime":21.333333333333332,"endTime":24,"audioSegment":0},{"text":"Anywhere, with nvm: nvm install 24","startTime":24,"endTime":26.666666666666664,"audioSegment":0},{"text":"To try Gezel without installing anything else, run: npx gezel-cli","startTime":26.666666666666664,"endTime":29.333333333333332,"audioSegment":0},{"text":"To keep it installed:","startTime":29.333333333333332,"endTime":32,"audioSegment":0},{"text":"npm install -g gezel-cli gezel","startTime":32,"endTime":34.666666666666664,"audioSegment":0},{"text":"The gezel-cli package is the short name for @bendyline/gezel-cli,","startTime":34.666666666666664,"endTime":37.33333333333333,"audioSegment":0},{"text":"and the two are the same program.","startTime":37.33333333333333,"endTime":40,"audioSegment":0},{"text":"If you installed @bendyline/gezel-cli before, keep using it,","startTime":40,"endTime":42.666666666666664,"audioSegment":0},{"text":"or remove it with npm uninstall -g @bendyline/gezel-cli before you install gezel-cli.","startTime":42.666666666666664,"endTime":45.33333333333333,"audioSegment":0},{"text":"They both provide the gezel command,","startTime":45.33333333333333,"endTime":48,"audioSegment":0},{"text":"and npm will not install a second one over the first.","startTime":48,"endTime":50.666666666666664,"audioSegment":0},{"text":"The CLI is one of Gezel's public JavaScript packages.","startTime":50.666666666666664,"endTime":53.33333333333333,"audioSegment":0},{"text":"See Gezel on npm for the complete package map and the SDKs to use when a shell command is not the right integration boundary.","startTime":53.33333333333333,"endTime":56,"audioSegment":0},{"text":"The npm package is sufficient for local CLI use, including first use.","startTime":56,"endTime":59.148148148148145,"audioSegment":0},{"text":"The CLI discovers your per-user daemon through its runtime files and pinned TLS certificate,","startTime":59.148148148148145,"endTime":62.2962962962963,"audioSegment":0},{"text":"then connects with your same-user owner credential.","startTime":62.2962962962963,"endTime":65.44444444444444,"audioSegment":0},{"text":"You do not need to install or open the desktop app or approve a connection to your own local daemon.","startTime":65.44444444444444,"endTime":68.5925925925926,"audioSegment":0},{"text":"Management commands can start your user daemon when it is absent;","startTime":68.5925925925926,"endTime":71.74074074074075,"audioSegment":0},{"text":"it keeps running until you use gezel stop.","startTime":71.74074074074075,"endTime":74.88888888888889,"audioSegment":0},{"text":"The interactive terminal app shuts down a daemon it started when you exit.","startTime":74.88888888888889,"endTime":78.03703703703704,"audioSegment":0},{"text":"gezel run adopts an already-running user daemon,","startTime":78.03703703703704,"endTime":81.18518518518519,"audioSegment":0},{"text":"or starts a service in-process for that one invocation and stops it afterward.","startTime":81.18518518518519,"endTime":84.33333333333334,"audioSegment":0},{"text":"An unhealthy running daemon remains an error.","startTime":84.33333333333334,"endTime":87.48148148148148,"audioSegment":0},{"text":"An explicit --connect <url> uses a separate CLI-scoped grant for that service.","startTime":87.48148148148148,"endTime":90.62962962962963,"audioSegment":0},{"text":"Without a valid saved grant or supplied --token,","startTime":90.62962962962963,"endTime":93.77777777777777,"audioSegment":0},{"text":"the terminal displays a six-character code and waits for you to approve Gezel CLI in the Gezel app.","startTime":93.77777777777777,"endTime":96.92592592592592,"audioSegment":0},{"text":"The resulting revocable credential is saved under ~/.gezel/cli/tokens/.","startTime":96.92592592592592,"endTime":100.07407407407408,"audioSegment":0},{"text":"A valid saved grant or --connect <url> --token <token> lets you connect without that interaction.","startTime":100.07407407407408,"endTime":103.22222222222223,"audioSegment":0},{"text":"Rolling-upgrade compatibility may also select an older legacy-full machine service,","startTime":103.22222222222223,"endTime":106.37037037037038,"audioSegment":0},{"text":"which uses that approval path.","startTime":106.37037037037038,"endTime":109.51851851851852,"audioSegment":0},{"text":"Use --standalone to skip this compatibility choice;","startTime":109.51851851851852,"endTime":112.66666666666667,"audioSegment":0},{"text":"--home <path> or an explicit GEZEL_HOME also implies standalone operation.","startTime":112.66666666666667,"endTime":115.81481481481481,"audioSegment":0},{"text":"A modern machine service is an engine broker;","startTime":115.81481481481481,"endTime":118.96296296296296,"audioSegment":0},{"text":"your per-user daemon handles product data and connects to that broker for inference.","startTime":118.96296296296296,"endTime":122.11111111111111,"audioSegment":0},{"text":"A home you name with --home is also kept separate from what the Gezel desktop app's machine install publishes: its shared crew and projects,","startTime":122.11111111111111,"endTime":125.25925925925927,"audioSegment":0},{"text":"and the models it downloaded.","startTime":125.25925925925927,"endTime":128.40740740740742,"audioSegment":0},{"text":"Set GEZEL_DISABLE_MACHINE_SHARED=0 to include them anyway.","startTime":128.40740740740742,"endTime":131.55555555555554,"audioSegment":0},{"text":"Your default home, ~/.gezel, still sees them.","startTime":131.55555555555554,"endTime":134.7037037037037,"audioSegment":0},{"text":"To run Gezel headless on a machine of its own,","startTime":134.7037037037037,"endTime":137.85185185185185,"audioSegment":0},{"text":"see Gezel on a server.","startTime":137.85185185185185,"endTime":141,"audioSegment":0},{"text":"gezel                       open the interactive terminal app for this folder's project","startTime":141,"endTime":144.14285714285714,"audioSegment":0},{"text":"gezel start                 ensure the service is running","startTime":144.14285714285714,"endTime":147.28571428571428,"audioSegment":0},{"text":"gezel start --port 8080 --foreground","startTime":147.28571428571428,"endTime":150.42857142857142,"audioSegment":0},{"text":"run it attached, on a fixed port","startTime":150.42857142857142,"endTime":153.57142857142858,"audioSegment":0},{"text":"gezel start --web --open    serve the web interface on this computer and open","startTime":153.57142857142858,"endTime":156.71428571428572,"audioSegment":0},{"text":"it in your browser; the printed link signs you in","startTime":156.71428571428572,"endTime":159.85714285714286,"audioSegment":0},{"text":"until the service restarts","startTime":159.85714285714286,"endTime":163,"audioSegment":0},{"text":"gezel start --web --accounts","startTime":163,"endTime":166.14285714285714,"audioSegment":0},{"text":"the same, but people sign in with a name and","startTime":166.14285714285714,"endTime":169.28571428571428,"audioSegment":0},{"text":"password; the first run prints a link to create one","startTime":169.28571428571428,"endTime":172.42857142857142,"audioSegment":0},{"text":"gezel status                is it up,","startTime":172.42857142857142,"endTime":175.57142857142856,"audioSegment":0},{"text":"and where (exits 1 if not running or unhealthy)","startTime":175.57142857142856,"endTime":178.71428571428572,"audioSegment":0},{"text":"gezel stop                  cancel any AI work and shut the service down","startTime":178.71428571428572,"endTime":181.85714285714286,"audioSegment":0},{"text":"gezel stop --keep-running   emergency brake: cancel AI work, unload engines,","startTime":181.85714285714286,"endTime":185,"audioSegment":0},{"text":"switch to Reactive — the service keeps running","startTime":185,"endTime":188.14285714285714,"audioSegment":0},{"text":"gezel mode [mode]           show or set how active the AI may be","startTime":188.14285714285714,"endTime":191.28571428571428,"audioSegment":0},{"text":"(read-only, reactive, reactive+tasks, full-play)","startTime":191.28571428571428,"endTime":194.42857142857144,"audioSegment":0},{"text":"gezel growth [on|off]       show or set crew growth (XP and level-ups); off","startTime":194.42857142857144,"endTime":197.57142857142856,"audioSegment":0},{"text":"computes no XP, for homes that run bulk workflows","startTime":197.57142857142856,"endTime":200.71428571428572,"audioSegment":0},{"text":"gezel run \"...\"             one-shot: send a prompt, print the reply","startTime":200.71428571428572,"endTime":203.85714285714286,"audioSegment":0},{"text":"gezel doctor                check the installation","startTime":203.85714285714286,"endTime":207,"audioSegment":0},{"text":"The first time you use Gezel on a computer,","startTime":207,"endTime":210.14285714285714,"audioSegment":0},{"text":"it has no model to answer with.","startTime":210.14285714285714,"endTime":213.28571428571428,"audioSegment":0},{"text":"gezel and gezel run then show the same setup: they suggest a model that fits this computer,","startTime":213.28571428571428,"endTime":216.42857142857144,"audioSegment":0},{"text":"download it with your OK, and carry on.","startTime":216.42857142857144,"endTime":219.57142857142856,"audioSegment":0},{"text":"gezel run goes straight on to your prompt afterward.","startTime":219.57142857142856,"endTime":222.71428571428572,"audioSegment":0},{"text":"When gezel run is not in a terminal, for example in a script or with its prompt piped in,","startTime":222.71428571428572,"endTime":225.85714285714286,"audioSegment":0},{"text":"it prints the setup commands instead and downloads nothing.","startTime":225.85714285714286,"endTime":229,"audioSegment":0},{"text":"Add --download when nobody will be there to answer, as for a script,","startTime":229,"endTime":232.14285714285714,"audioSegment":0},{"text":"a container, or an AI agent running Gezel for you.","startTime":232.14285714285714,"endTime":235.28571428571428,"audioSegment":0},{"text":"Any command that needs a model then downloads what this computer needs without asking: the on-device engine,","startTime":235.28571428571428,"endTime":238.42857142857144,"audioSegment":0},{"text":"and the model that fits this computer best, which becomes the default.","startTime":238.42857142857144,"endTime":241.57142857142856,"audioSegment":0},{"text":"It prints each step as it goes.","startTime":241.57142857142856,"endTime":244.71428571428572,"audioSegment":0},{"text":"gezel run --download \"Summarize these notes\" sets up a new computer and answers in one command,","startTime":244.71428571428572,"endTime":247.85714285714286,"audioSegment":0},{"text":"and gezel do --download <craftbook> also downloads the models the craftbook names.","startTime":247.85714285714286,"endTime":251,"audioSegment":0},{"text":"GEZEL_AUTO_DOWNLOAD=1 does the same for every command.","startTime":251,"endTime":254.14285714285714,"audioSegment":0},{"text":"It only downloads: turning on a security setting or saving a key still needs you.","startTime":254.14285714285714,"endTime":257.2857142857143,"audioSegment":0},{"text":"A new install starts in full-play.","startTime":257.2857142857143,"endTime":260.42857142857144,"audioSegment":0},{"text":"For a server nobody is watching, reactive+tasks is the better fit: messages,","startTime":260.42857142857144,"endTime":263.57142857142856,"audioSegment":0},{"text":"tasks you start and schedules still run, without proactive nudges.","startTime":263.57142857142856,"endTime":266.7142857142857,"audioSegment":0},{"text":"Gezel on a server covers the rest of a headless setup.","startTime":266.7142857142857,"endTime":269.8571428571429,"audioSegment":0},{"text":"If the desktop app's machine-wide service is in use,","startTime":269.8571428571429,"endTime":273,"audioSegment":0},{"text":"gezel stop applies the emergency brake to it instead and says the service is managed by the operating system.","startTime":273,"endTime":276.1428571428571,"audioSegment":0},{"text":"It does the same for a service the Gezel app started for you,","startTime":276.1428571428571,"endTime":279.2857142857143,"audioSegment":0},{"text":"which the app would only start again: quit the app to shut that one down.","startTime":279.2857142857143,"endTime":282.42857142857144,"audioSegment":0},{"text":"gezel stop shuts a service down only after confirming the process is Gezel's.","startTime":282.42857142857144,"endTime":285.57142857142856,"audioSegment":0},{"text":"When the service has already exited, it removes the files the service left behind,","startTime":285.57142857142856,"endTime":288.7142857142857,"audioSegment":0},{"text":"and it never stops another program that happens to have reused the service's old process number.","startTime":288.7142857142857,"endTime":291.8571428571429,"audioSegment":0},{"text":"gezel stop --daemon still works and means the same as gezel stop.","startTime":291.8571428571429,"endTime":295,"audioSegment":0},{"text":"gezel, gezel run, gezel do, and the other project commands work in the project for the folder you run them from,","startTime":295,"endTime":298,"audioSegment":0},{"text":"and create it the first time.","startTime":298,"endTime":301,"audioSegment":0},{"text":"Pass --project <folder> to use another folder without changing directory.","startTime":301,"endTime":304,"audioSegment":0},{"text":"Gezel never makes a project of your home folder,","startTime":304,"endTime":307,"audioSegment":0},{"text":"the temp folder, or the top of a drive.","startTime":307,"endTime":310,"audioSegment":0},{"text":"Run a command from one of those and it uses the Default project instead,","startTime":310,"endTime":313,"audioSegment":0},{"text":"with a note saying so.","startTime":313,"endTime":316,"audioSegment":0},{"text":"Naming one of those folders with --project stops the command,","startTime":316,"endTime":319,"audioSegment":0},{"text":"so it never quietly uses a different project than the one you asked for.","startTime":319,"endTime":322,"audioSegment":0},{"text":"A folder's project starts read-only: Gezel reads the folder and keeps what it makes in its own task folders,","startTime":322,"endTime":325,"audioSegment":0},{"text":"which --out <dir> copies out.","startTime":325,"endTime":328,"audioSegment":0},{"text":"Some craftbooks save into the folder itself,","startTime":328,"endTime":331,"audioSegment":0},{"text":"such as a deck or a web page.","startTime":331,"endTime":334,"audioSegment":0},{"text":"At a terminal gezel do asks before it starts one of those.","startTime":334,"endTime":337,"audioSegment":0},{"text":"In a script, add --allow-edits,","startTime":337,"endTime":340,"audioSegment":0},{"text":"or run gezel project edits on once in the folder.","startTime":340,"endTime":343,"audioSegment":0},{"text":"gezel project edits shows the current setting,","startTime":343,"endTime":346,"audioSegment":0},{"text":"and gezel craftbook show <craftbook> says where a craftbook saves.","startTime":346,"endTime":349,"audioSegment":0},{"text":"gezel agent list            your crew","startTime":349,"endTime":351.46153846153845,"audioSegment":0},{"text":"gezel project list          your projects (gezel env is the same command)","startTime":351.46153846153845,"endTime":353.9230769230769,"audioSegment":0},{"text":"gezel project edits [on|off]","startTime":353.9230769230769,"endTime":356.38461538461536,"audioSegment":0},{"text":"show or set whether Gezel may change files in","startTime":356.38461538461536,"endTime":358.84615384615387,"audioSegment":0},{"text":"this folder's project (a folder starts read-only)","startTime":358.84615384615387,"endTime":361.3076923076923,"audioSegment":0},{"text":"gezel task list             tasks across every project (--status to filter)","startTime":361.3076923076923,"endTime":363.7692307692308,"audioSegment":0},{"text":"gezel task show <ref>       one task, such as default/12","startTime":363.7692307692308,"endTime":366.2307692307692,"audioSegment":0},{"text":"gezel task pause <ref>      pause one task without stopping the others","startTime":366.2307692307692,"endTime":368.6923076923077,"audioSegment":0},{"text":"gezel task resume <ref>     retry a paused task and wait for its result","startTime":368.6923076923077,"endTime":371.15384615384613,"audioSegment":0},{"text":"gezel task wait <ref>       wait for a task,","startTime":371.15384615384613,"endTime":373.61538461538464,"audioSegment":0},{"text":"then say where its result is","startTime":373.61538461538464,"endTime":376.0769230769231,"audioSegment":0},{"text":"(--out <dir> to copy what it made into that folder)","startTime":376.0769230769231,"endTime":378.53846153846155,"audioSegment":0},{"text":"gezel craftbook list [words]","startTime":378.53846153846155,"endTime":381,"audioSegment":0},{"text":"craftbooks you can start in this folder's project","startTime":381,"endTime":383.46153846153845,"audioSegment":0},{"text":"(words filter by command, title, and tags;","startTime":383.46153846153845,"endTime":385.9230769230769,"audioSegment":0},{"text":"--no-start answers from a running service only)","startTime":385.9230769230769,"endTime":388.38461538461536,"audioSegment":0},{"text":"gezel craftbook show <craftbook>","startTime":388.38461538461536,"endTime":390.84615384615387,"audioSegment":0},{"text":"what one does, what it takes before your request,","startTime":390.84615384615387,"endTime":393.3076923076923,"audioSegment":0},{"text":"and where it saves","startTime":393.3076923076923,"endTime":395.7692307692308,"audioSegment":0},{"text":"gezel do <craftbook>        start a craftbook as a task in this folder's project","startTime":395.7692307692308,"endTime":398.2307692307692,"audioSegment":0},{"text":"(--wait to stay until it finishes and print where","startTime":398.2307692307692,"endTime":400.6923076923077,"audioSegment":0},{"text":"its result is; --out <dir> to wait and copy what it","startTime":400.6923076923077,"endTime":403.1538461538462,"audioSegment":0},{"text":"made into that folder; --allow-edits when it saves","startTime":403.1538461538462,"endTime":405.61538461538464,"audioSegment":0},{"text":"into the folder itself)","startTime":405.61538461538464,"endTime":408.0769230769231,"audioSegment":0},{"text":"gezel skills list           SKILL.md skills found in this project's workspace","startTime":408.0769230769231,"endTime":410.53846153846155,"audioSegment":0},{"text":"gezel skills import <path>  turn one of those skills into a craftbook","startTime":410.53846153846155,"endTime":413,"audioSegment":0},{"text":"These matter where people sign in from a browser: a Gezel container,","startTime":413,"endTime":415.62857142857143,"audioSegment":0},{"text":"or gezel start --web --accounts.","startTime":415.62857142857143,"endTime":418.25714285714287,"audioSegment":0},{"text":"gezel account list          the accounts that can sign in","startTime":418.25714285714287,"endTime":420.8857142857143,"audioSegment":0},{"text":"gezel account create <name> add one (asks for a password;","startTime":420.8857142857143,"endTime":423.51428571428573,"audioSegment":0},{"text":"--password-stdin to pipe it)","startTime":423.51428571428573,"endTime":426.14285714285717,"audioSegment":0},{"text":"gezel account reset-password <name>","startTime":426.14285714285717,"endTime":428.7714285714286,"audioSegment":0},{"text":"set a new password and sign them out everywhere","startTime":428.7714285714286,"endTime":431.4,"audioSegment":0},{"text":"gezel account disable <name> / enable <name>","startTime":431.4,"endTime":434.0285714285714,"audioSegment":0},{"text":"gezel account remove <name> --yes","startTime":434.0285714285714,"endTime":436.65714285714284,"audioSegment":0},{"text":"gezel account sessions <name>","startTime":436.65714285714284,"endTime":439.2857142857143,"audioSegment":0},{"text":"where an account is signed in","startTime":439.2857142857143,"endTime":441.9142857142857,"audioSegment":0},{"text":"gezel account setup-link    a new link to create the first account","startTime":441.9142857142857,"endTime":444.54285714285714,"audioSegment":0},{"text":"gezel integrations token create <app>","startTime":444.54285714285714,"endTime":447.1714285714286,"audioSegment":0},{"text":"a key for another program to use Gezel's models","startTime":447.1714285714286,"endTime":449.8,"audioSegment":0},{"text":"(--scope to give it more than chat; shown once)","startTime":449.8,"endTime":452.42857142857144,"audioSegment":0},{"text":"gezel integrations token revoke <app>","startTime":452.42857142857144,"endTime":455.0571428571429,"audioSegment":0},{"text":"gezel integrations address  where other programs reach this Gezel's models","startTime":455.0571428571429,"endTime":457.6857142857143,"audioSegment":0},{"text":"gezel integrations ollama [on|off]","startTime":457.6857142857143,"endTime":460.3142857142857,"audioSegment":0},{"text":"show or set a plain-HTTP port on this computer","startTime":460.3142857142857,"endTime":462.9428571428571,"audioSegment":0},{"text":"that needs no key (Ollama emulation, port 11434)","startTime":462.9428571428571,"endTime":465.57142857142856,"audioSegment":0},{"text":"gezel integrations list     apps connected to this Gezel, and apps waiting","startTime":465.57142857142856,"endTime":468.2,"audioSegment":0},{"text":"for your approval","startTime":468.2,"endTime":470.8285714285714,"audioSegment":0},{"text":"gezel integrations approve <app> / deny <app>","startTime":470.8285714285714,"endTime":473.45714285714286,"audioSegment":0},{"text":"answer an app that asked to connect (--code for","startTime":473.45714285714286,"endTime":476.0857142857143,"audioSegment":0},{"text":"one that shows a code)","startTime":476.0857142857143,"endTime":478.7142857142857,"audioSegment":0},{"text":"Everyone with an account can do everything, including open a terminal.","startTime":478.7142857142857,"endTime":481.34285714285716,"audioSegment":0},{"text":"Add only people you trust with the computer Gezel runs on.","startTime":481.34285714285716,"endTime":483.9714285714286,"audioSegment":0},{"text":"A program with a key reaches the models at the address gezel integrations address prints.","startTime":483.9714285714286,"endTime":486.6,"audioSegment":0},{"text":"Outside a container that address uses Gezel's own certificate,","startTime":486.6,"endTime":489.2285714285714,"audioSegment":0},{"text":"which a program has to trust or skip checking, and its port is 6228 when that port is free.","startTime":489.2285714285714,"endTime":491.8571428571429,"audioSegment":0},{"text":"For a program that cannot do either,","startTime":491.8571428571429,"endTime":494.48571428571427,"audioSegment":0},{"text":"gezel integrations ollama on opens http://127.0.0.1:11434/v1 (and Ollama's own paths on the same port): plain HTTP, always that port, no key.","startTime":494.48571428571427,"endTime":497.1142857142857,"audioSegment":0},{"text":"While it is on, any program on this computer can use your models without asking,","startTime":497.1142857142857,"endTime":499.74285714285713,"audioSegment":0},{"text":"so it stays off until you turn it on.","startTime":499.74285714285713,"endTime":502.37142857142857,"audioSegment":0},{"text":"Gezel leaves the port alone when Ollama itself is running.","startTime":502.37142857142857,"endTime":505,"audioSegment":0},{"text":"gezel app new my-app        scaffold an app source folder","startTime":505,"endTime":508.125,"audioSegment":0},{"text":"gezel app validate my-app   check a source folder or .gezapp (--json for tooling)","startTime":508.125,"endTime":511.25,"audioSegment":0},{"text":"gezel app pack my-app       produce my-app-1.0.0.gezapp","startTime":511.25,"endTime":514.375,"audioSegment":0},{"text":"gezel app add <file> --yes  review and install a package","startTime":514.375,"endTime":517.5,"audioSegment":0},{"text":"gezel app apply my-app      outfit the current folder as a project","startTime":517.5,"endTime":520.625,"audioSegment":0},{"text":"gezel app serve my-app      share its page as a mini-site","startTime":520.625,"endTime":523.75,"audioSegment":0},{"text":"The full story — the source-folder format, both script forms,","startTime":523.75,"endTime":526.875,"audioSegment":0},{"text":"and the loop an AI agent can drive — is Building AI Apps inside Gezel.","startTime":526.875,"endTime":530,"audioSegment":0},{"text":"gezel model list            local chat models for this computer's engine","startTime":530,"endTime":532.4705882352941,"audioSegment":0},{"text":"(--no-start: answer from a running service only)","startTime":532.4705882352941,"endTime":534.9411764705883,"audioSegment":0},{"text":"gezel model list --available","startTime":534.9411764705883,"endTime":537.4117647058823,"audioSegment":0},{"text":"catalog models that fit this computer, with sizes and","startTime":537.4117647058823,"endTime":539.8823529411765,"audioSegment":0},{"text":"the published scorecard's measured pass rate for each","startTime":539.8823529411765,"endTime":542.3529411764706,"audioSegment":0},{"text":"gezel model pull <id>       download a chat model from the catalog, and the","startTime":542.3529411764706,"endTime":544.8235294117648,"audioSegment":0},{"text":"engine it runs on if that is missing","startTime":544.8235294117648,"endTime":547.2941176470588,"audioSegment":0},{"text":"gezel model use <id>        make chats use a downloaded model","startTime":547.2941176470588,"endTime":549.7647058823529,"audioSegment":0},{"text":"gezel model context <id> [tokens]","startTime":549.7647058823529,"endTime":552.2352941176471,"audioSegment":0},{"text":"show or set a model's context window (auto clears it)","startTime":552.2352941176471,"endTime":554.7058823529412,"audioSegment":0},{"text":"gezel model concurrency [slots]","startTime":554.7058823529412,"endTime":557.1764705882352,"audioSegment":0},{"text":"show or set how many requests a local engine serves at once","startTime":557.1764705882352,"endTime":559.6470588235294,"audioSegment":0},{"text":"gezel model export <id> [file]","startTime":559.6470588235294,"endTime":562.1176470588235,"audioSegment":0},{"text":"save a model as a portable .gezmodel file","startTime":562.1176470588235,"endTime":564.5882352941177,"audioSegment":0},{"text":"gezel native install        download and verify the on-device engines","startTime":564.5882352941177,"endTime":567.0588235294117,"audioSegment":0},{"text":"gezel native status         engine release, platform, and backend","startTime":567.0588235294117,"endTime":569.5294117647059,"audioSegment":0},{"text":"gezel image models          local image-generation models (image pull / image rm)","startTime":569.5294117647059,"endTime":572,"audioSegment":0},{"text":"The same tasks, checks and counting rules as the published model scorecard,","startTime":572,"endTime":574.5652173913044,"audioSegment":0},{"text":"run on your own computer through the service's benchmark runner.","startTime":574.5652173913044,"endTime":577.1304347826087,"audioSegment":0},{"text":"gezel bench and Settings → Benchmarks show the same runs.","startTime":577.1304347826087,"endTime":579.695652173913,"audioSegment":0},{"text":"gezel bench                 run the core set on the model chats use,","startTime":579.695652173913,"endTime":582.2608695652174,"audioSegment":0},{"text":"one trial per task","startTime":582.2608695652174,"endTime":584.8260869565217,"audioSegment":0},{"text":"gezel bench --suite productivity|developer|complex-work|all","startTime":584.8260869565217,"endTime":587.3913043478261,"audioSegment":0},{"text":"another set, several, or all four","startTime":587.3913043478261,"endTime":589.9565217391304,"audioSegment":0},{"text":"gezel bench --smoke         the set's pulse check instead (fast;","startTime":589.9565217391304,"endTime":592.5217391304348,"audioSegment":0},{"text":"not a suite score)","startTime":592.5217391304348,"endTime":595.0869565217391,"audioSegment":0},{"text":"gezel bench --model <id> --count 3","startTime":595.0869565217391,"endTime":597.6521739130435,"audioSegment":0},{"text":"a particular model;","startTime":597.6521739130435,"endTime":600.2173913043479,"audioSegment":0},{"text":"three trials is what it takes to quote a rate","startTime":600.2173913043479,"endTime":602.7826086956521,"audioSegment":0},{"text":"gezel bench --json <file>   also write the results as a scorecard shard","startTime":602.7826086956521,"endTime":605.3478260869565,"audioSegment":0},{"text":"gezel bench list            every set,","startTime":605.3478260869565,"endTime":607.9130434782609,"audioSegment":0},{"text":"its size, and how long it can take","startTime":607.9130434782609,"endTime":610.4782608695652,"audioSegment":0},{"text":"gezel bench results         finished runs on this computer","startTime":610.4782608695652,"endTime":613.0434782608695,"audioSegment":0},{"text":"gezel bench submit <file>   share a results file as a GitHub issue (uses gh when installed)","startTime":613.0434782608695,"endTime":615.6086956521739,"audioSegment":0},{"text":"A run that could take more than an hour asks before it starts;","startTime":615.6086956521739,"endTime":618.1739130434783,"audioSegment":0},{"text":"--yes skips the question.","startTime":618.1739130434783,"endTime":620.7391304347826,"audioSegment":0},{"text":"Below three trials a result prints as a count,","startTime":620.7391304347826,"endTime":623.304347826087,"audioSegment":0},{"text":"never a rate, exactly as the scorecard does.","startTime":623.304347826087,"endTime":625.8695652173913,"audioSegment":0},{"text":"The report ends with the run's provenance — hardware, engine build, gezel version,","startTime":625.8695652173913,"endTime":628.4347826086956,"audioSegment":0},{"text":"catalog version — because a number without those is not a measurement.","startTime":628.4347826086956,"endTime":631,"audioSegment":0},{"text":"gezel create-image \"...\"    generate an image with the configured image engine","startTime":631,"endTime":633.6666666666666,"audioSegment":0},{"text":"gezel create-video \"...\"    generate a video","startTime":633.6666666666666,"endTime":636.3333333333334,"audioSegment":0},{"text":"gezel create-audio \"...\"    read text aloud into an audio file","startTime":636.3333333333334,"endTime":639,"audioSegment":0},{"text":"See Working with knowledge catalogs for the complete reference, including validation, signing,","startTime":639,"endTime":641.5294117647059,"audioSegment":0},{"text":"location search, removal, Parquet export, and a build–validate–install walkthrough.","startTime":641.5294117647059,"endTime":644.0588235294117,"audioSegment":0},{"text":"How knowledge works in Gezel explains the embeddings and storage behind these commands.","startTime":644.0588235294117,"endTime":646.5882352941177,"audioSegment":0},{"text":"gezel knowledge init <dir>  scaffold a catalog folder","startTime":646.5882352941177,"endTime":649.1176470588235,"audioSegment":0},{"text":"gezel knowledge build <dir> compile it into a .gezk file","startTime":649.1176470588235,"endTime":651.6470588235294,"audioSegment":0},{"text":"gezel knowledge search <file> \"...\"","startTime":651.6470588235294,"endTime":654.1764705882352,"audioSegment":0},{"text":"search a catalog file offline","startTime":654.1764705882352,"endTime":656.7058823529412,"audioSegment":0},{"text":"gezel knowledge available   catalogs offered for download","startTime":656.7058823529412,"endTime":659.2352941176471,"audioSegment":0},{"text":"gezel knowledge install <source>","startTime":659.2352941176471,"endTime":661.7647058823529,"audioSegment":0},{"text":"install one by catalog id, file, or URL","startTime":661.7647058823529,"endTime":664.2941176470588,"audioSegment":0},{"text":"gezel knowledge list        what is installed","startTime":664.2941176470588,"endTime":666.8235294117648,"audioSegment":0},{"text":"Building, checking, and searching a catalog file work without the service;","startTime":666.8235294117648,"endTime":669.3529411764706,"audioSegment":0},{"text":"installing and listing use the running Gezel.","startTime":669.3529411764706,"endTime":671.8823529411765,"audioSegment":0},{"text":"Building a catalog and search --semantic also need the embedding runtime,","startTime":671.8823529411765,"endTime":674.4117647058823,"audioSegment":0},{"text":"which the desktop app includes.","startTime":674.4117647058823,"endTime":676.9411764705883,"audioSegment":0},{"text":"After an npm install,","startTime":676.9411764705883,"endTime":679.4705882352941,"audioSegment":0},{"text":"add it with npm install -g @huggingface/transformers@^4.3.1 (without -g if the CLI is installed in a project).","startTime":679.4705882352941,"endTime":682,"audioSegment":0},{"text":"gezel secret list           which provider keys are set (never their values)","startTime":682,"endTime":684.3636363636364,"audioSegment":0},{"text":"gezel secret set <name> --env VARIABLE","startTime":684.3636363636364,"endTime":686.7272727272727,"audioSegment":0},{"text":"store a key, read from an environment variable","startTime":686.7272727272727,"endTime":689.0909090909091,"audioSegment":0},{"text":"(or --stdin to pipe it in)","startTime":689.0909090909091,"endTime":691.4545454545455,"audioSegment":0},{"text":"gezel secret remove <name>  forget a key","startTime":691.4545454545455,"endTime":693.8181818181819,"audioSegment":0},{"text":"gezel security level        the security level and what it allows","startTime":693.8181818181819,"endTime":696.1818181818181,"audioSegment":0},{"text":"gezel security level set <super-lockdown|lockdown|free>","startTime":696.1818181818181,"endTime":698.5454545454545,"audioSegment":0},{"text":"switch to a preset (free is Unrestricted in Settings)","startTime":698.5454545454545,"endTime":700.9090909090909,"audioSegment":0},{"text":"gezel security external-services [on|off]","startTime":700.9090909090909,"endTime":703.2727272727273,"audioSegment":0},{"text":"let your crew use web search and other outside services","startTime":703.2727272727273,"endTime":705.6363636363636,"audioSegment":0},{"text":"gezel env indexing [on|off] pause or resume background indexing for this project","startTime":705.6363636363636,"endTime":708,"audioSegment":0},{"text":"gezel cleanup               see how much space Gezel is using","startTime":708,"endTime":710.4,"audioSegment":0},{"text":"gezel cleanup --redownloadable","startTime":710.4,"endTime":712.8,"audioSegment":0},{"text":"reclaim everything Gezel can download again","startTime":712.8,"endTime":715.2,"audioSegment":0},{"text":"gezel backup <file>         write your crew, projects, and documents to a file","startTime":715.2,"endTime":717.6,"audioSegment":0},{"text":"gezel restore <file>        bring them back (--list to look first)","startTime":717.6,"endTime":720,"audioSegment":0},{"text":"gezel handboek export --out ./site","startTime":720,"endTime":723,"audioSegment":0},{"text":"renders Help — the same articles you're reading now —","startTime":723,"endTime":726,"audioSegment":0},{"text":"as a static website, for publishing or offline reading.","startTime":726,"endTime":729,"audioSegment":0},{"text":"Run gezel --help (or --help on any subcommand) for the full surface.","startTime":729,"endTime":732,"audioSegment":0},{"text":"To automate work inside a project, continue with Writing scripts with gezel-sdk.","startTime":732,"endTime":735,"audioSegment":0},{"text":"To let another application use Gezel, see Building connected apps with gezel-app-sdk.","startTime":735,"endTime":738,"audioSegment":0},{"text":"When a task you wait for is blocked,","startTime":738,"endTime":741.5714285714286,"audioSegment":0},{"text":"gezel do --wait prints why (the task's latest note) and points to gezel task notes <ref>, which shows the full notes.","startTime":741.5714285714286,"endTime":745.1428571428571,"audioSegment":0},{"text":"A task watch is an observer.","startTime":745.1428571428571,"endTime":748.7142857142857,"audioSegment":0},{"text":"Its timeout ends the command without canceling or pausing native work;","startTime":748.7142857142857,"endTime":752.2857142857143,"audioSegment":0},{"text":"watching the same task again follows that work.","startTime":752.2857142857143,"endTime":755.8571428571429,"audioSegment":0},{"text":"A task's current paused status or an unanswered question blocks the watch.","startTime":755.8571428571429,"endTime":759.4285714285714,"audioSegment":0},{"text":"Historical service pause cards do not block an already resumed task and are not answered by the observer.","startTime":759.4285714285714,"endTime":763,"audioSegment":0}],"version":1},"startBlock":{"title":"The gezel command line","subtitle":"The gezel command drives the same service the desktop app uses — handy on servers, in scripts, or when you just live in a terminal.","ambientMotion":"zoomIn"}}</script>
