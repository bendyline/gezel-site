"line":46,"column":24,"offset":3457},"end":{"line":46,"column":141,"offset":3574}}}],"position":{"start":{"line":46,"column":1,"offset":3434},"end":{"line":46,"column":141,"offset":3574}}}]}]},{"id":"privacy","startTime":183,"duration":27,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Privacy","position":{"start":{"line":48,"column":4,"offset":3579},"end":{"line":48,"column":11,"offset":3586}}}],"position":{"start":{"line":48,"column":1,"offset":3576},"end":{"line":48,"column":11,"offset":3586}}},"title":"Privacy","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Pictures, motion detection and the vision model all run on this computer.","position":{"start":{"line":50,"column":3,"offset":3590},"end":{"line":50,"column":76,"offset":3663}}}],"position":{"start":{"line":50,"column":3,"offset":3590},"end":{"line":50,"column":76,"offset":3663}}}],"position":{"start":{"line":50,"column":1,"offset":3588},"end":{"line":50,"column":76,"offset":3663}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Only gezellen on an on-device model see a camera's pictures. Others get a description made here, unless you allow cloud AI for that camera.","position":{"start":{"line":51,"column":3,"offset":3666},"end":{"line":51,"column":142,"offset":3805}}}],"position":{"start":{"line":51,"column":3,"offset":3666},"end":{"line":51,"column":142,"offset":3805}}}],"position":{"start":{"line":51,"column":1,"offset":3664},"end":{"line":51,"column":142,"offset":3805}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"What the vision model writes is treated as untrusted: a sign held up to the camera can't send an email or start work, because lookouts act only on yes-or-no answers and your own instructions.","position":{"start":{"line":52,"column":3,"offset":3808},"end":{"line":52,"column":194,"offset":3999}}}],"position":{"start":{"line":52,"column":3,"offset":3808},"end":{"line":52,"column":194,"offset":3999}}}],"position":{"start":{"line":52,"column":1,"offset":3806},"end":{"line":52,"column":194,"offset":3999}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Removing a camera deletes the pictures it saved. The moments it recorded stay in the project until you delete them.","position":{"start":{"line":53,"column":3,"offset":4002},"end":{"line":53,"column":118,"offset":4117}}}],"position":{"start":{"line":53,"column":3,"offset":4002},"end":{"line":53,"column":118,"offset":4117}}}],"position":{"start":{"line":53,"column":1,"offset":4000},"end":{"line":53,"column":118,"offset":4117}}}],"position":{"start":{"line":50,"column":1,"offset":3588},"end":{"line":53,"column":118,"offset":4117}}}],"autoTemplate":true,"templateData":{"items":["Pictures, motion detection and the vision model all run on this computer.","Only gezellen on an on-device model see a camera's pictures. Others get a description made here, unless you allow cloud AI for that camera.","What the vision model writes is treated as untrusted: a sign held up to the camera can't send an email or start work, because lookouts act only on yes-or-no answers and your own instructions.","Removing a camera deletes the pictures it saved. The moments it recorded stay in the project until you delete them."],"ordered":false,"title":"Privacy"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A project can watch a room through a webcam or a computer's built-in camera.","startTime":0,"endTime":3.6666666666666665,"audioSegment":0},{"text":"Gezel notices when something moves, can ask an on-device vision model what it sees,","startTime":3.6666666666666665,"endTime":7.333333333333333,"audioSegment":0},{"text":"and keeps the moments worth keeping.","startTime":7.333333333333333,"endTime":11,"audioSegment":0},{"text":"A lookout tells it what to watch for and what to do: when the mud room camera sees the cat squatting on the floor,","startTime":11,"endTime":14.666666666666666,"audioSegment":0},{"text":"play the alarm and tell me.","startTime":14.666666666666666,"endTime":18.333333333333332,"audioSegment":0},{"text":"The pictures never leave your computer unless you say so.","startTime":18.333333333333332,"endTime":22,"audioSegment":0},{"text":"Open the project, then About → Connections → Add connection,","startTime":22,"endTime":24.529411764705884,"audioSegment":0},{"text":"and choose Webcam.","startTime":24.529411764705884,"endTime":27.058823529411764,"audioSegment":0},{"text":"Pick the camera and press Take a test picture to check the view.","startTime":27.058823529411764,"endTime":29.588235294117645,"audioSegment":0},{"text":"Choose what to keep:","startTime":29.588235294117645,"endTime":32.11764705882353,"audioSegment":0},{"text":"Moments: only what the camera found worth noting (the default),","startTime":32.11764705882353,"endTime":34.64705882352941,"audioSegment":0},{"text":"While moving: a picture every few seconds while something moves,","startTime":34.64705882352941,"endTime":37.17647058823529,"audioSegment":0},{"text":"On a schedule: a picture every few seconds,","startTime":37.17647058823529,"endTime":39.705882352941174,"audioSegment":0},{"text":"from once a second to once a minute,","startTime":39.705882352941174,"endTime":42.23529411764706,"audioSegment":0},{"text":"Nothing: just the live view.","startTime":42.23529411764706,"endTime":44.76470588235294,"audioSegment":0},{"text":"Leave Recognize what's happening on if you want the vision model to look at what moves.","startTime":44.76470588235294,"endTime":47.294117647058826,"audioSegment":0},{"text":"Lookouts that ask a question need it.","startTime":47.294117647058826,"endTime":49.8235294117647,"audioSegment":0},{"text":"Gezel reads cameras through ffmpeg.","startTime":49.8235294117647,"endTime":52.35294117647059,"audioSegment":0},{"text":"If it's missing, the setup shows how to install it.","startTime":52.35294117647059,"endTime":54.88235294117647,"audioSegment":0},{"text":"While any camera is watching, the titlebar says so,","startTime":54.88235294117647,"endTime":57.41176470588235,"audioSegment":0},{"text":"and the camera's light is on.","startTime":57.41176470588235,"endTime":59.94117647058823,"audioSegment":0},{"text":"Click the indicator to pause a camera from anywhere.","startTime":59.94117647058823,"endTime":62.470588235294116,"audioSegment":0},{"text":"The emergency stop pauses every camera until you resume each one.","startTime":62.470588235294116,"endTime":65,"audioSegment":0},{"text":"Every time something happens in view (a person walks through,","startTime":65,"endTime":68.66666666666667,"audioSegment":0},{"text":"the cat comes in and sits down), gezel treats it as one moment.","startTime":68.66666666666667,"endTime":72.33333333333333,"audioSegment":0},{"text":"A moment is saved as a short note in the project with up to three pictures and what the vision model saw,","startTime":72.33333333333333,"endTime":76,"audioSegment":0},{"text":"so you and your gezellen can find it later: \"when was the cat last in the mud room?\"","startTime":76,"endTime":79.66666666666667,"audioSegment":0},{"text":"Saved pictures from While moving and On a schedule stay in a private folder on this computer,","startTime":79.66666666666667,"endTime":83.33333333333333,"audioSegment":0},{"text":"never in a synced folder.","startTime":83.33333333333333,"endTime":87,"audioSegment":0},{"text":"They're kept for as many days as you choose,","startTime":87,"endTime":90.66666666666666,"audioSegment":0},{"text":"up to a size limit, and the oldest go first.","startTime":90.66666666666666,"endTime":94.33333333333333,"audioSegment":0},{"text":"Moments are kept for 90 days.","startTime":94.33333333333333,"endTime":98,"audioSegment":0},{"text":"Under Lookouts, press Add a lookout and finish the sentence:","startTime":98,"endTime":101.125,"audioSegment":0},{"text":"When the camera sees anything moving,","startTime":101.125,"endTime":104.25,"audioSegment":0},{"text":"a person, a pet, or something specific.","startTime":104.25,"endTime":107.375,"audioSegment":0},{"text":"For something specific,","startTime":107.375,"endTime":110.5,"audioSegment":0},{"text":"write a yes-or-no question like Is a cat squatting or pooping on the floor?","startTime":110.5,"endTime":113.625,"audioSegment":0},{"text":"Tick Only when it is clearly happening to wait for a second picture before acting.","startTime":113.625,"endTime":116.75,"audioSegment":0},{"text":"Then tell you, play a sound, say something out loud, send it to your phone,","startTime":116.75,"endTime":119.875,"audioSegment":0},{"text":"email you, ask a gezel to follow up, or run a craftbook.","startTime":119.875,"endTime":123,"audioSegment":0},{"text":"Each lookout acts at most once per moment,","startTime":123,"endTime":126.125,"audioSegment":0},{"text":"rests after it acts (10 minutes by default), and stops for the day at its limit.","startTime":126.125,"endTime":129.25,"audioSegment":0},{"text":"You can limit it to certain hours, snooze it for an hour,","startTime":129.25,"endTime":132.375,"audioSegment":0},{"text":"or press Test to hear and see exactly what it does.","startTime":132.375,"endTime":135.5,"audioSegment":0},{"text":"The Recently list shows every time a lookout acted,","startTime":135.5,"endTime":138.625,"audioSegment":0},{"text":"the picture it acted on, and what happened to each action.","startTime":138.625,"endTime":141.75,"audioSegment":0},{"text":"If something was held, it says why, in plain words.","startTime":141.75,"endTime":144.875,"audioSegment":0},{"text":"Press Not this on a false alarm.","startTime":144.875,"endTime":148,"audioSegment":0},{"text":"Sounds, spoken alerts and notifications work at every security level.","startTime":148,"endTime":151.5,"audioSegment":0},{"text":"Phone alerts use the phone channel from Settings.","startTime":151.5,"endTime":155,"audioSegment":0},{"text":"Email needs a mail account connected to the project and the Free security level.","startTime":155,"endTime":158.5,"audioSegment":0},{"text":"A lookout only ever emails the addresses you typed on it.","startTime":158.5,"endTime":162,"audioSegment":0},{"text":"Asking a gezel and running a craftbook need Gezel to be set to run tasks.","startTime":162,"endTime":165.5,"audioSegment":0},{"text":"A gezel on a cloud model can't see the pictures unless you turn on Let cloud AI see these pictures for that camera;","startTime":165.5,"endTime":169,"audioSegment":0},{"text":"otherwise the action is held and the list says so.","startTime":169,"endTime":172.5,"audioSegment":0},{"text":"A gezel can propose a lookout,","startTime":172.5,"endTime":176,"audioSegment":0},{"text":"but it stays off until you approve it.","startTime":176,"endTime":179.5,"audioSegment":0},{"text":"Gezellen can never turn on, change, or widen a lookout themselves.","startTime":179.5,"endTime":183,"audioSegment":0},{"text":"Pictures, motion detection and the vision model all run on this computer.","startTime":183,"endTime":186.375,"audioSegment":0},{"text":"Only gezellen on an on-device model see a camera's pictures.","startTime":186.375,"endTime":189.75,"audioSegment":0},{"text":"Others get a description made here,","startTime":189.75,"endTime":193.125,"audioSegment":0},{"text":"unless you allow cloud AI for that camera.","startTime":193.125,"endTime":196.5,"audioSegment":0},{"text":"What the vision model writes is treated as untrusted: a sign held up to the camera can't send an email or start work,","startTime":196.5,"endTime":199.875,"audioSegment":0},{"text":"because lookouts act only on yes-or-no answers and your own instructions.","startTime":199.875,"endTime":203.25,"audioSegment":0},{"text":"Removing a camera deletes the pictures it saved.","startTime":203.25,"endTime":206.625,"audioSegment":0},{"text":"The moments it recorded stay in the project until you delete them.","startTime":206.625,"endTime":210,"audioSegment":0}],"version":1},"startBlock":{"title":"Cameras and lookouts","subtitle":"A project can watch a room through a webcam or a computer's built-in camera. Gezel notices when something moves, can ask an on-device vision model what it sees, and keeps the moments worth keeping. A lookout tells it what to watch for and what to do: when the mud room camera sees the cat squatting on the floor, play the alarm and tell me.","ambientMotion":"zoomIn"}}</script>
