 add that model. A repository usually holds the same model in several sizes, and a smaller one often fits where the largest does not.","position":{"start":{"line":48,"column":1,"offset":3504},"end":{"line":48,"column":176,"offset":3679}}}],"position":{"start":{"line":48,"column":1,"offset":3504},"end":{"line":48,"column":176,"offset":3679}}},{"type":"paragraph","children":[{"type":"text","value":"Once the model is on your computer, Gezel tries it: it starts the model, asks for a short reply and checks that the reply reads as language, and asks it to use a tool. The result appears beside the model in Settings → Models. Gezel doesn't pick a model that failed for work on its own, but you can still choose it yourself.","position":{"start":{"line":50,"column":1,"offset":3681},"end":{"line":50,"column":324,"offset":4004}}}],"position":{"start":{"line":50,"column":1,"offset":3681},"end":{"line":50,"column":324,"offset":4004}}},{"type":"paragraph","children":[{"type":"text","value":"Gezel also looks for good settings for the model. If the catalog has a tested version of the same model, the added one borrows its settings. Otherwise it uses the settings the model's author recommends, or Gezel's general settings for a model of its size. The review tells you which. If the catalog already has the exact file you linked, Gezel offers the catalog version instead.","position":{"start":{"line":52,"column":1,"offset":4006},"end":{"line":52,"column":380,"offset":4385}}}],"position":{"start":{"line":52,"column":1,"offset":4006},"end":{"line":52,"column":380,"offset":4385}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel doesn't come with its own AI —","startTime":0,"endTime":2.8,"audioSegment":0},{"text":"it puts your choice of AI to work.","startTime":2.8,"endTime":5.6,"audioSegment":0},{"text":"That can be a cloud provider (OpenAI, Anthropic,","startTime":5.6,"endTime":8.399999999999999,"audioSegment":0},{"text":"GitHub Copilot) or a model running locally on your own machine.","startTime":8.399999999999999,"endTime":11.2,"audioSegment":0},{"text":"With a local model, your data never leaves the room.","startTime":11.2,"endTime":14,"audioSegment":0},{"text":"Models come in sizes,","startTime":14,"endTime":16.61111111111111,"audioSegment":0},{"text":"and size matters for what a model can be trusted to do alone.","startTime":16.61111111111111,"endTime":19.22222222222222,"audioSegment":0},{"text":"Gezel groups them into tiers:","startTime":19.22222222222222,"endTime":21.833333333333336,"audioSegment":0},{"text":"Tier Size (in billions of parameters) Good at","startTime":21.833333333333336,"endTime":24.444444444444443,"audioSegment":0},{"text":"tiny under 5B quick drafts, simple lookups","startTime":24.444444444444443,"endTime":27.055555555555557,"audioSegment":0},{"text":"small 5–12B everyday chat, focused single tasks","startTime":27.055555555555557,"endTime":29.666666666666668,"audioSegment":0},{"text":"medium 12–45B multi-step work with tools","startTime":29.666666666666668,"endTime":32.27777777777778,"audioSegment":0},{"text":"large 45B and up, local most roles, unsupervised steps","startTime":32.27777777777778,"endTime":34.888888888888886,"audioSegment":0},{"text":"cloud hosted frontier models everything","startTime":34.888888888888886,"endTime":37.5,"audioSegment":0},{"text":"Every role declares a model floor —","startTime":37.5,"endTime":40.111111111111114,"audioSegment":0},{"text":"the minimum tier it needs to work unsupervised.","startTime":40.111111111111114,"endTime":42.72222222222222,"audioSegment":0},{"text":"A reviewer gating your deliverables needs more headroom than someone drafting a shopping list,","startTime":42.72222222222222,"endTime":45.333333333333336,"audioSegment":0},{"text":"and gezel enforces that automatically.","startTime":45.333333333333336,"endTime":47.94444444444444,"audioSegment":0},{"text":"A tier says what a size class should manage.","startTime":47.94444444444444,"endTime":50.55555555555556,"audioSegment":0},{"text":"For what individual models actually did — measured,","startTime":50.55555555555556,"endTime":53.166666666666664,"audioSegment":0},{"text":"on a real machine — see the Model scorecard.","startTime":53.166666666666664,"endTime":55.77777777777778,"audioSegment":0},{"text":"It is the fastest way to pick a local model you can trust with a given job,","startTime":55.77777777777778,"endTime":58.38888888888889,"audioSegment":0},{"text":"and How we test models explains what the numbers do and do not tell you.","startTime":58.38888888888889,"endTime":61,"audioSegment":0},{"text":"Gezel classifies each device as tiny, small, medium,","startTime":61,"endTime":63.5,"audioSegment":0},{"text":"or large from the memory available to local models.","startTime":63.5,"endTime":66,"audioSegment":0},{"text":"Gezel runs local models (llama.cpp, MLX, Ollama and friends) alongside cloud providers —","startTime":66,"endTime":69.5,"audioSegment":0},{"text":"the Models catalog in the app shows what fits your machine.","startTime":69.5,"endTime":73,"audioSegment":0},{"text":"You don't have to get this right up front.","startTime":73,"endTime":76.75,"audioSegment":0},{"text":"Set a default provider in Settings, and override it for one crew member only when they need something different —","startTime":76.75,"endTime":80.5,"audioSegment":0},{"text":"a big cloud model for your reviewer, a fast local one for day-to-day chat.","startTime":80.5,"endTime":84.25,"audioSegment":0},{"text":"Gezel checks each new model's fitness on your hardware before recommending it.","startTime":84.25,"endTime":88,"audioSegment":0},{"text":"Every model on gezel.com lists the local chat, image, and video models Gezel knows about,","startTime":88,"endTime":91.75,"audioSegment":0},{"text":"including their download size, context window, license, and the engines they run on.","startTime":91.75,"endTime":95.5,"audioSegment":0},{"text":"Once you have a shortlist that fits,","startTime":95.5,"endTime":99.25,"audioSegment":0},{"text":"the Model scorecard shows how those models actually performed.","startTime":99.25,"endTime":103,"audioSegment":0},{"text":"The catalog is a short list Gezel has tried.","startTime":103,"endTime":105.86842105263158,"audioSegment":0},{"text":"You can add other models too.","startTime":105.86842105263158,"endTime":108.73684210526315,"audioSegment":0},{"text":"Choose Add a model… on your engine's page in Settings, then From Hugging Face or a file…,","startTime":108.73684210526315,"endTime":111.60526315789474,"audioSegment":0},{"text":"and paste a link to a model on Hugging Face, the public library most open models are published in.","startTime":111.60526315789474,"endTime":114.47368421052632,"audioSegment":0},{"text":"You can also choose a .gguf file that is already on your computer,","startTime":114.47368421052632,"endTime":117.34210526315789,"audioSegment":0},{"text":"for example one you downloaded with another app.","startTime":117.34210526315789,"endTime":120.21052631578948,"audioSegment":0},{"text":"On huggingface.co,","startTime":120.21052631578948,"endTime":123.07894736842105,"audioSegment":0},{"text":"a model's Use this model menu opens Gezel with that model ready to check.","startTime":123.07894736842105,"endTime":125.94736842105263,"audioSegment":0},{"text":"Gezel runs local models from GGUF files on every computer,","startTime":125.94736842105263,"endTime":128.81578947368422,"audioSegment":0},{"text":"and from MLX models on Apple silicon Macs.","startTime":128.81578947368422,"endTime":131.68421052631578,"audioSegment":0},{"text":"On Hugging Face, look for a repository whose name ends in \"-GGUF\",","startTime":131.68421052631578,"endTime":134.55263157894737,"audioSegment":0},{"text":"or an MLX one from mlx-community.","startTime":134.55263157894737,"endTime":137.42105263157896,"audioSegment":0},{"text":"Before anything is added, Gezel checks that:","startTime":137.42105263157896,"endTime":140.28947368421052,"audioSegment":0},{"text":"anyone can download it,","startTime":140.28947368421052,"endTime":143.1578947368421,"audioSegment":0},{"text":"and every file has a checksum to verify it against","startTime":143.1578947368421,"endTime":146.0263157894737,"audioSegment":0},{"text":"it is a model you can talk to,","startTime":146.0263157894737,"endTime":148.89473684210526,"audioSegment":0},{"text":"not an add-on part of one","startTime":148.89473684210526,"endTime":151.76315789473682,"audioSegment":0},{"text":"it contains no program code of its own, which Gezel never runs","startTime":151.76315789473682,"endTime":154.6315789473684,"audioSegment":0},{"text":"the engine in this version of Gezel can run it","startTime":154.6315789473684,"endTime":157.5,"audioSegment":0},{"text":"it includes its own conversation format,","startTime":157.5,"endTime":160.36842105263156,"audioSegment":0},{"text":"and says whether it can use tools","startTime":160.36842105263156,"endTime":163.23684210526315,"audioSegment":0},{"text":"it fits this computer's memory and disk","startTime":163.23684210526315,"endTime":166.10526315789474,"audioSegment":0},{"text":"If a check fails, Gezel says why and won't add that model.","startTime":166.10526315789474,"endTime":168.9736842105263,"audioSegment":0},{"text":"A repository usually holds the same model in several sizes,","startTime":168.9736842105263,"endTime":171.8421052631579,"audioSegment":0},{"text":"and a smaller one often fits where the largest does not.","startTime":171.8421052631579,"endTime":174.71052631578948,"audioSegment":0},{"text":"Once the model is on your computer, Gezel tries it: it starts the model,","startTime":174.71052631578948,"endTime":177.57894736842104,"audioSegment":0},{"text":"asks for a short reply and checks that the reply reads as language, and asks it to use a tool.","startTime":177.57894736842104,"endTime":180.44736842105263,"audioSegment":0},{"text":"The result appears beside the model in Settings → Models.","startTime":180.44736842105263,"endTime":183.31578947368422,"audioSegment":0},{"text":"Gezel doesn't pick a model that failed for work on its own,","startTime":183.31578947368422,"endTime":186.18421052631578,"audioSegment":0},{"text":"but you can still choose it yourself.","startTime":186.18421052631578,"endTime":189.05263157894737,"audioSegment":0},{"text":"Gezel also looks for good settings for the model.","startTime":189.05263157894737,"endTime":191.92105263157896,"audioSegment":0},{"text":"If the catalog has a tested version of the same model,","startTime":191.92105263157896,"endTime":194.78947368421052,"audioSegment":0},{"text":"the added one borrows its settings.","startTime":194.78947368421052,"endTime":197.65789473684208,"audioSegment":0},{"text":"Otherwise it uses the settings the model's author recommends,","startTime":197.65789473684208,"endTime":200.52631578947367,"audioSegment":0},{"text":"or Gezel's general settings for a model of its size.","startTime":200.52631578947367,"endTime":203.39473684210526,"audioSegment":0},{"text":"The review tells you which.","startTime":203.39473684210526,"endTime":206.26315789473682,"audioSegment":0},{"text":"If the catalog already has the exact file you linked,","startTime":206.26315789473682,"endTime":209.1315789473684,"audioSegment":0},{"text":"Gezel offers the catalog version instead.","startTime":209.1315789473684,"endTime":212,"audioSegment":0}],"version":1},"startBlock":{"title":"Models, tiers, and what runs on this device","subtitle":"Gezel doesn't come with its own AI — it puts your choice of AI to work. That can be a cloud provider (OpenAI, Anthropic, GitHub Copilot) or a model running locally on your own machine. With a local model, your data never leaves the room.","ambientMotion":"zoomIn"}}</script>
