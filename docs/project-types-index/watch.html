ing pipeline,","startTime":73.33333333333333,"endTime":77,"audioSegment":0},{"text":"an image maker turns notions into pictures in the feed's own style, and a live gallery shows every post from first idea to published.","startTime":77,"endTime":80.66666666666666,"audioSegment":0},{"text":"Job Hunt Run your job search like a campaign — a career coach tracks every application through the pipeline,","startTime":80.66666666666666,"endTime":84.33333333333333,"audioSegment":0},{"text":"a mock interviewer gets you ready, and a live board keeps the whole slog navigable.","startTime":84.33333333333333,"endTime":88,"audioSegment":0},{"text":"Language Trainer Practice a new language by chatting with a patient tutor who corrects gently and tracks your progress.","startTime":88,"endTime":91.66666666666666,"audioSegment":0},{"text":"Life Binder The \"in case of emergency\" file, actually complete.","startTime":91.66666666666666,"endTime":95.33333333333333,"audioSegment":0},{"text":"Meal Planner & Pantry Answer \"what's for dinner?\" once a week.","startTime":95.33333333333333,"endTime":99,"audioSegment":0},{"text":"Novel Writing Room A room for the long haul of a novel.","startTime":99,"endTime":102.66666666666666,"audioSegment":0},{"text":"Social Feed Run a social feed like a small newsroom — an Omroeper keeps every post moving through a real pipeline (idea to published,","startTime":102.66666666666666,"endTime":106.33333333333333,"audioSegment":0},{"text":"nothing by accident), a copywriter sharpens each variant for its platform, and a live board shows exactly where every post stands.","startTime":106.33333333333333,"endTime":110,"audioSegment":0},{"text":"Software Project A working codebase with a real crew: a developer voorman who builds and fixes,","startTime":110,"endTime":113.66666666666666,"audioSegment":0},{"text":"a reviewer who checks the work, and a boekwachter who reads the code while you sleep and files what it finds.","startTime":113.66666666666666,"endTime":117.33
