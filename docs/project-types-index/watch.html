tfits a whole project for one kind of work: the right crew,","startTime":0,"endTime":3.5526315789473686,"audioSegment":0},{"text":"craftbooks, toolsets, and schedules, composed into a single installable setup.","startTime":3.5526315789473686,"endTime":7.105263157894737,"audioSegment":0},{"text":"Project type What it sets up","startTime":7.105263157894737,"endTime":10.657894736842106,"audioSegment":0},{"text":"Caregiving Binder Coordinate a loved one's care without losing the thread.","startTime":10.657894736842106,"endTime":14.210526315789474,"audioSegment":0},{"text":"Chat A quiet room for talking — no tasks,","startTime":14.210526315789474,"endTime":17.763157894736842,"audioSegment":0},{"text":"no workspace, no deliverables.","startTime":17.763157894736842,"endTime":21.315789473684212,"audioSegment":0},{"text":"Checkers Play checkers against a gezel opponent on a live board.","startTime":21.315789473684212,"endTime":24.86842105263158,"audioSegment":0},{"text":"Chess Play a complete game of chess against a gezel opponent on a live board.","startTime":24.86842105263158,"endTime":28.42105263157895,"audioSegment":0},{"text":"Data Analysis Explore the datasets in a project folder.","startTime":28.42105263157895,"endTime":31.97368421052632,"audioSegment":0},{"text":"Design Scheme Explore color schemes and design directions with a designer.","startTime":31.97368421052632,"endTime":35.526315789473685,"audioSegment":0},{"text":"Email / Inbox Sync an email account into a project as canonical markdown,","startTime":35.526315789473685,"endTime":39.078947368421055,"audioSegment":0},{"text":"then triage, draft, and summarize correspondence with a gezel.","startTime":39.078947368421055,"endTime":42.631578947368425,"audioSegment":0},{"text":"Event Planner Plan the wedding, the milestone birthday, the reunion.","startTime":42.631578947368425,"endTime":46.184210526315795,"audioSegment":0},{"text":"Fitness Coach A training habit that survives real life.","startTime":46.1842105263157 le, actually complete.","startTime":92.36842105263159,"endTime":95.92105263157895,"audioSegment":0},{"text":"Meal Planner & Pantry Answer \"what's for dinner?\" once a week.","startTime":95.92105263157895,"endTime":99.47368421052632,"audioSegment":0},{"text":"Media Library Browse a folder of images,","startTime":99.47368421052632,"endTime":103.02631578947368,"audioSegment":0},{"text":"videos, and audio in a live gallery.","startTime":103.02631578947368,"endTime":106.57894736842105,"audioSegment":0},{"text":"Novel Writing Room A room for the long haul of a novel.","startTime":106.57894736842105,"endTime":110.13157894736842,"audioSegment":0},{"text":"Social Feed Run a social feed like a small newsroom — a social media writer keeps every post moving through a real pipeline (idea to published,","startTime":110.13157894736842,"endTime":113.6842105263158,"audioSegment":0},{"text":"nothing by accident), a copywriter sharpens each variant for its platform, and a live board shows exactly where every post stands.","startTime":113.6842105263158,"endTime":117.23684210526316,"audioSegment":0},{"text":"Software Project A working codebase with a real crew: a lead developer who builds and fixes,","startTime":117.23684210526316,"endTime":120.78947368421053,"audioSegment":0},{"text":"a reviewer who checks the work, and a librarian who reads the code while you sleep and files what it finds.","startTime":120.78947368421053,"endTime":124.3421052631579,"audioSegment":0},{"text":"Trip Planner Plan a trip you'll actually be present for.","startTime":124.3421052631579,"endTime":127.89473684210527,"audioSegment":0},{"text":"Word Clues Find your six words on a board of sixteen from one-word clues,","startTime":127.89473684210527,"endTime":131.44736842105263,"audioSegment":0},{"text":"and steer clear of the trap.","startTime":131.44736842105263,"endTime":135,"audioSegment":0}],"version":1},"startBlock":{"title":"Every project type","subtitle":"A project type outfits a whole project for one kin
