eal life.","startTime":47.79411764705882,"endTime":51.470588235294116,"audioSegment":0},{"text":"Flashcards Learn anything with spaced-repetition flashcards.","startTime":51.470588235294116,"endTime":55.147058823529406,"audioSegment":0},{"text":"Freelance Office Run a one-person business without dropping anything.","startTime":55.147058823529406,"endTime":58.8235294117647,"audioSegment":0},{"text":"Fundraiser HQ Rally a community drive.","startTime":58.8235294117647,"endTime":62.5,"audioSegment":0},{"text":"Go Play Go against a gezel opponent on a live 9×9,","startTime":62.5,"endTime":66.17647058823529,"audioSegment":0},{"text":"13×13, or 19×19 board.","startTime":66.17647058823529,"endTime":69.85294117647058,"audioSegment":0},{"text":"Household Budget Know where the money actually goes.","startTime":69.85294117647058,"endTime":73.52941176470588,"audioSegment":0},{"text":"Household Manual The living manual for your home.","startTime":73.52941176470588,"endTime":77.20588235294117,"audioSegment":0},{"text":"Image Feed A visual feed with a working rhythm — your Omroeper runs the posting pipeline,","startTime":77.20588235294117,"endTime":80.88235294117646,"audioSegment":0},{"text":"an image maker turns notions into pictures in the feed's own style, and a live gallery shows every post from first idea to published.","startTime":80.88235294117646,"endTime":84.55882352941175,"audioSegment":0},{"text":"Job Hunt Run your job search like a campaign — a career coach tracks every application through the pipeline,","startTime":84.55882352941175,"endTime":88.23529411764706,"audioSegment":0},{"text":"a mock interviewer gets you ready, and a live board keeps the whole slog navigable.","startTime":88.23529411764706,"endTime":91.91176470588235,"audioSegment":0},{"text":"Language Trainer Practice a new language by chatting with a patient tutor who corrects gently and tracks your progress.","startTime":91.91176470588235,"endTime":95.58823529411764,"audioSegment":0},{"text":"Life Binder The \"in case of emergency\" file, actually complete.","startTime":95.58823529411764,"endTime":99.26470588235294,"audioSegment":0},{"text":"Meal Planner & Pantry Answer \"what's for dinner?\" once a week.","startTime":99.26470588235294,"endTime":102.94117647058823,"audioSegment":0},{"text":"Novel Writing Room A room for the long haul of a novel.","startTime":102.94117647058823,"endTime":106.61764705882352,"audioSegment":0},{"text":"Social Feed Run a social feed like a small newsroom — an Omroeper keeps every post moving through a real pipeline (idea to published,","startTime":106.61764705882352,"endTime":110.29411764705881,"audioSegment":0},{"text":"nothing by accident), a copywriter sharpens each variant for its platform, and a live board shows exactly where every post stands.","startTime":110.29411764705881,"endTime":113.97058823529412,"audioSegment":0},{"text":"Software Project A working codebase with a real crew: a developer voorman who builds and fixes,","startTime":113.97058823529412,"endTime":117.6470588235294,"audioSegment":0},{"text":"a reviewer who checks the work, and a boekwachter who reads the code while you sleep and files what it finds.","startTime":117.6470588235294,"endTime":121.3235294117647,"audioSegment":0},{"text":"Trip Planner Plan a trip you'll actually be present for.","startTime":121.3235294117647,"endTime":125,"audioSegment":0}],"version":1},"startBlock":{"title":"Every project type","subtitle":"A project type outfits a whole project for one kind of work: the right crew, craftbooks, toolsets, and schedules, composed into a single installable setup.","ambientMotion":"zoomIn"}}</script>
