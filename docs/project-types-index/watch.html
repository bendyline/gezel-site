3,"endTime":87.4920634920635,"audioSegment":0},{"text":"Fundraiser HQ Rally a community drive.","startTime":87.4920634920635,"endTime":90.85714285714286,"audioSegment":0},{"text":"Go Play Go against a gezel opponent on a live 9×9,","startTime":90.85714285714286,"endTime":94.22222222222223,"audioSegment":0},{"text":"13×13, or 19×19 board.","startTime":94.22222222222223,"endTime":97.58730158730158,"audioSegment":0},{"text":"Grants & Proposals Find grants, write proposals and meet every deadline.","startTime":97.58730158730158,"endTime":100.95238095238095,"audioSegment":0},{"text":"Hiring Desk Run a hiring round from the job post to the signed offer.","startTime":100.95238095238095,"endTime":104.31746031746032,"audioSegment":0},{"text":"Household Budget Know where the money actually goes.","startTime":104.31746031746032,"endTime":107.68253968253968,"audioSegment":0},{"text":"Household Manual The living manual for your home.","startTime":107.68253968253968,"endTime":111.04761904761905,"audioSegment":0},{"text":"Image Feed A visual feed with a working rhythm — your social media writer runs the posting pipeline,","startTime":111.04761904761905,"endTime":114.41269841269842,"audioSegment":0},{"text":"an image maker turns notions into pictures in the feed's own style, and a live gallery shows every post from first idea to published.","startTime":114.41269841269842,"endTime":117.77777777777779,"audioSegment":0},{"text":"Inventory & Reorder Know what is in stock and reorder before you run out.","startTime":117.77777777777779,"endTime":121.14285714285714,"audioSegment":0},{"text":"Job Hunt Run your job search like a campaign — a career coach tracks every application through the pipeline,","startTime":121.14285714285714,"endTime":124.5079365079365,"audioSegment":0},{"text":"a mock interviewer gets you ready, and a live board keeps the whole slog navigable.","startTime":124.5079365079365,"endTime":127.87301587301587,"audioSegment":0},{"text":"Language Trainer Practice a new language by chatting with a patient tutor who corrects gently and tracks your progress.","startTime":127.87301587301587,"endTime":131.23809523809524,"audioSegment":0},{"text":"Life Binder The \"in case of emergency\" file, actually complete.","startTime":131.23809523809524,"endTime":134.6031746031746,"audioSegment":0},{"text":"Meal Planner & Pantry Answer \"what's for dinner?\" once a week.","startTime":134.6031746031746,"endTime":137.96825396825398,"audioSegment":0},{"text":"Media Library Browse a folder of images,","startTime":137.96825396825398,"endTime":141.33333333333334,"audioSegment":0},{"text":"videos, and audio in a live gallery.","startTime":141.33333333333334,"endTime":144.6984126984127,"audioSegment":0},{"text":"New Hire Onboarding Give each new hire a clear plan for their first weeks.","startTime":144.6984126984127,"endTime":148.06349206349208,"audioSegment":0},{"text":"Novel Writing Room A room for the long haul of a novel.","startTime":148.06349206349208,"endTime":151.42857142857142,"audioSegment":0},{"text":"Quotes & Bids Price the job and send quotes and bids that win work.","startTime":151.42857142857142,"endTime":154.79365079365078,"audioSegment":0},{"text":"Sales Pipeline Follow every deal from first contact to close.","startTime":154.79365079365078,"endTime":158.15873015873015,"audioSegment":0},{"text":"Shift Roster Build the shift roster and keep every shift covered.","startTime":158.15873015873015,"endTime":161.52380952380952,"audioSegment":0},{"text":"Social Feed Run a social feed like a small newsroom — a social media writer keeps every post moving through a real pipeline (idea to published,","startTime":161.52380952380952,"endTime":164.88888888888889,"audioSegment":0},{"text":"nothing by accident), a copywriter sharpens each variant for its platform, and a live board shows exactly where every post stands.","startTime":164.88888888888889,"endTime":168.25396825396825,"audioSegment":0},{"text":"Software Project A working codebase with a real crew: a lead developer who builds and fixes,","startTime":168.25396825396825,"endTime":171.61904761904762,"audioSegment":0},{"text":"a reviewer who checks the work, and a librarian who reads the code while you sleep and files what it finds.","startTime":171.61904761904762,"endTime":174.984126984127,"audioSegment":0},{"text":"SOP Library Write down how the work gets done,","startTime":174.984126984127,"endTime":178.34920634920636,"audioSegment":0},{"text":"and keep it current.","startTime":178.34920634920636,"endTime":181.71428571428572,"audioSegment":0},{"text":"Support Desk Answer customer questions and keep every request moving.","startTime":181.71428571428572,"endTime":185.0793650793651,"audioSegment":0},{"text":"Team Goals Set your team's goals and check progress toward them.","startTime":185.0793650793651,"endTime":188.44444444444446,"audioSegment":0},{"text":"Training Tracker Track who has finished which training,","startTime":188.44444444444446,"endTime":191.80952380952382,"audioSegment":0},{"text":"and what is due next.","startTime":191.80952380952382,"endTime":195.17460317460316,"audioSegment":0},{"text":"Trip Planner Plan a trip you'll actually be present for.","startTime":195.17460317460316,"endTime":198.53968253968253,"audioSegment":0},{"text":"Vendor & Contract Desk Keep your vendors and contracts,","startTime":198.53968253968253,"endTime":201.9047619047619,"audioSegment":0},{"text":"with their renewal dates, in one place.","startTime":201.9047619047619,"endTime":205.26984126984127,"audioSegment":0},{"text":"Word Clues Find your six words on a board of sixteen from one-word clues,","startTime":205.26984126984127,"endTime":208.63492063492063,"audioSegment":0},{"text":"and steer clear of the trap.","startTime":208.63492063492063,"endTime":212,"audioSegment":0}],"version":1},"startBlock":{"title":"Every project type","subtitle":"A project type outfits a whole project for one kind of work: the right crew, plans, toolsets, and schedules, composed into a single installable setup.","ambientMotion":"zoomIn"}}</script>
