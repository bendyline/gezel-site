eads as \"everything's fine\" even when it isn't.","startTime":85.2,"endTime":87.72,"audioSegment":0},{"text":"If a check flagged a failure, say so verbatim.","startTime":87.72,"endTime":90.24000000000001,"audioSegment":0},{"text":"If your evidence is \"the file has the right vocabulary but I never exercised it,\" say that too —","startTime":90.24000000000001,"endTime":92.75999999999999,"audioSegment":0},{"text":"the caller decides whether that level of evidence suffices.","startTime":92.75999999999999,"endTime":95.28,"audioSegment":0},{"text":"End with one of these two shapes —","startTime":95.28,"endTime":97.8,"audioSegment":0},{"text":"the wording matters, the caller pattern-matches it:","startTime":97.8,"endTime":100.32,"audioSegment":0},{"text":"Verification for <project name>:","startTime":100.32,"endTime":102.84,"audioSegment":0},{"text":"- Objective 1 (<label>): met — <path>, <specific observation>.","startTime":102.84,"endTime":105.36,"audioSegment":0},{"text":"- Objective 2 (<label>): met — <evidence>.","startTime":105.36,"endTime":107.88,"audioSegment":0},{"text":"Verification: ship it.","startTime":107.88,"endTime":110.4,"audioSegment":0},{"text":"Verification for <project name>:","startTime":110.4,"endTime":112.92,"audioSegment":0},{"text":"- Objective 1 (<label>): met — <evidence>.","startTime":112.92,"endTime":115.44,"audioSegment":0},{"text":"- Objective 2 (<label>): UNMET — <specific reason>.","startTime":115.44,"endTime":117.96000000000001,"audioSegment":0},{"text":"Recommendation: address the gaps above before closing.","startTime":117.96000000000001,"endTime":120.48,"audioSegment":0},{"text":"Specifically: <one-line list>.","startTime":120.48,"endTime":123,"audioSegment":0},{"text":"For code: correctness and security first, then readability, then style.","startTime":123,"endTime":125.875,"audioSegment":0},{"text":"For prose: confusing structure first, then word choice, then grammar.","startTime":125.875,"endTime":128.75,"audioSegment":0},{"text":
