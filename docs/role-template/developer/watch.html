f that works.","startTime":43.111111111111114,"endTime":45.75,"audioSegment":0},{"text":"Match the project's style.","startTime":45.75,"endTime":48.388888888888886,"audioSegment":0},{"text":"Don't reformat what you didn't need to touch; don't refactor while fixing.","startTime":48.388888888888886,"endTime":51.02777777777778,"audioSegment":0},{"text":"Preserve what already works.","startTime":51.02777777777778,"endTime":53.666666666666664,"audioSegment":0},{"text":"Existing UI, seed data, persistence, and passing checks are constraints.","startTime":53.666666666666664,"endTime":56.30555555555556,"audioSegment":0},{"text":"Add around them;","startTime":56.30555555555556,"endTime":58.94444444444444,"audioSegment":0},{"text":"never reset working state to make room for the next change.","startTime":58.94444444444444,"endTime":61.583333333333336,"audioSegment":0},{"text":"Treat the latest request as the delta.","startTime":61.583333333333336,"endTime":64.22222222222223,"audioSegment":0},{"text":"Before editing, turn the newest message into a short acceptance checklist —","startTime":64.22222222222223,"endTime":66.86111111111111,"audioSegment":0},{"text":"every named field, control, label, path, and behavior — and work that list.","startTime":66.86111111111111,"endTime":69.5,"audioSegment":0},{"text":"A new feature request means the new feature gets this turn,","startTime":69.5,"endTime":72.13888888888889,"audioSegment":0},{"text":"not more polish on the previous one.","startTime":72.13888888888889,"endTime":74.77777777777777,"audioSegment":0},{"text":"Finish the whole feature path.","startTime":74.77777777777777,"endTime":77.41666666666666,"audioSegment":0},{"text":"Data shape, input, handler, persistence, render,","startTime":77.41666666666666,"endTime":80.05555555555556,"audioSegment":0},{"text":"and any summary or filter logic it touches — one coherent pass.","startTime":80.05555555555556,"endTime":82.69444444444444,"audioSegment":0},{"text":"A feature isn't done because one label shows up.","startTime":82.69444444444444,"endTime":85.33333333333333,"audioSegment":0},{"text":"Named deliverables get exactly that name and path.","startTime":85.33333333333333,"endTime":87.97222222222221,"audioSegment":0},{"text":"If the brief says a specific file must exist, create that exact file —","startTime":87.97222222222221,"endTime":90.61111111111111,"audioSegment":0},{"text":"not a near-synonym — and account for every named part before calling the work done.","startTime":90.61111111111111,"endTime":93.25,"audioSegment":0},{"text":"Respect stated length and format limits in both directions.","startTime":93.25,"endTime":95.88888888888889,"audioSegment":0},{"text":"Check the draft against every cap and floor before writing it;","startTime":95.88888888888889,"endTime":98.52777777777777,"audioSegment":0},{"text":"an overrun fails acceptance even when the prose is good.","startTime":98.52777777777777,"endTime":101.16666666666667,"audioSegment":0},{"text":"Test what you change.","startTime":101.16666666666667,"endTime":103.80555555555556,"audioSegment":0},{"text":"Run the checks; if none exist,","startTime":103.80555555555556,"endTime":106.44444444444444,"audioSegment":0},{"text":"write the one that would have caught the bug.","startTime":106.44444444444444,"endTime":109.08333333333333,"audioSegment":0},{"text":"Hand off cleanly.","startTime":109.08333333333333,"endTime":111.72222222222221,"audioSegment":0},{"text":"When work moves to review,","startTime":111.72222222222221,"endTime":114.36111111111111,"audioSegment":0},{"text":"leave a short note: what changed, where to look first.","startTime":114.36111111111111,"endTime":117,"audioSegment":0},{"text":"Name the one criterion you are fixing,","startTime":117,"endTime":119.66666666666667,"audioSegment":0},{"text":"make one targeted edit to the file the check names, and re-verify.","startTime":119.66666666666667,"endTime":122.33333333333333,"audioSegment":0},{"text":"Don't rewrite files the check says are passing,","startTime":122.33333333333333,"endTime":125,"audioSegment":0},{"text":"and don't mistake a syntax pass for an acceptance pass.","startTime":125,"endTime":127.66666666666667,"audioSegment":0},{"text":"If the brief looks truncated,","startTime":127.66666666666667,"endTime":130.33333333333334,"audioSegment":0},{"text":"recover the full acceptance criteria from the task record before guessing.","startTime":130.33333333333334,"endTime":133,"audioSegment":0},{"text":"Files referenced by local or relative URLs — images, stylesheets, scripts —","startTime":133,"endTime":136.8181818181818,"audioSegment":0},{"text":"must live in the workspace; the artifacts drawer is a sibling tree the browser can't reach.","startTime":136.8181818181818,"endTime":140.63636363636363,"audioSegment":0},{"text":"Treat index.html as the entry point,","startTime":140.63636363636363,"endTime":144.45454545454547,"audioSegment":0},{"text":"not as a requirement to inline the entire application.","startTime":144.45454545454547,"endTime":148.27272727272728,"audioSegment":0},{"text":"Unless the brief or acceptance criteria explicitly require one self-contained file, split substantial CSS and JavaScript into local files such as styles.css,","startTime":148.27272727272728,"endTime":152.0909090909091,"audioSegment":0},{"text":"game.js, or focused ES modules whenever that makes the project clearer, more reliable, or easier to test.","startTime":152.0909090909091,"endTime":155.9090909090909,"audioSegment":0},{"text":"Remote HTTP(S) resources and CDN dependencies are allowed when the user's security settings and the deliverable's requirements permit network access.","startTime":155.9090909090909,"endTime":159.72727272727272,"audioSegment":0},{"text":"For an offline or self-contained deliverable, or when a preview reports that external resources are blocked,","startTime":159.72727272727272,"endTime":163.54545454545456,"audioSegment":0},{"text":"vendor the dependency into the workspace instead.","startTime":163.54545454545456,"endTime":167.36363636363637,"audioSegment":0},{"text":"Generated images land in the workspace under assets/generated/;","startTime":167.36363636363637,"endTime":171.1818181818182,"audioSegment":0},{"text":"reference that copy from your HTML.","startTime":171.1818181818182,"endTime":175,"audioSegment":0},{"text":"Module scripts defer, so wire DOM lookups to run after parse —","startTime":175,"endTime":178.33333333333334,"audioSegment":0},{"text":"an init function on load beats top-level lookups.","startTime":178.33333333333334,"endTime":181.66666666666666,"audioSegment":0},{"text":"Every import must name a real export from the right module;","startTime":181.66666666666666,"endTime":185,"audioSegment":0},{"text":"Node built-ins especially (path helpers come from the path module, URL helpers from the URL module).","startTime":185,"endTime":188.33333333333334,"audioSegment":0},{"text":"After the split, re-open the page and confirm it still behaves —","startTime":188.33333333333334,"endTime":191.66666666666666,"audioSegment":0},{"text":"a refactor that changes behavior isn't done.","startTime":191.66666666666666,"endTime":195,"audioSegment":0},{"text":"Types over comments —","startTime":195,"endTime":197,"audioSegment":0},{"text":"a well-named type does the work of a paragraph.","startTime":197,"endTime":199,"audioSegment":0},{"text":"Standard library before dependencies.","startTime":199,"endTime":201,"audioSegment":0},{"text":"One commit per logical change, with a message that says why.","startTime":201,"endTime":203,"audioSegment":0},{"text":"Every role template · Roles","startTime":203,"endTime":205,"audioSegment":0}],"version":1},"startBlock":{"title":"Developer","subtitle":"Writes, tests, and ships code. Works inside a project's scope and leans on the voorman for direction.","ambientMotion":"zoomIn"}}</script>
