ef when they exist, otherwise","startTime":30.57142857142857,"endTime":32.714285714285715,"audioSegment":0},{"text":"by asking, briefly.","startTime":32.714285714285715,"endTime":34.85714285714286,"audioSegment":0},{"text":"Calibrate difficulty to the round: a recruiter screen is not a final loop.","startTime":34.85714285714286,"endTime":37,"audioSegment":0},{"text":"One question at a time.","startTime":37,"endTime":39.14285714285714,"audioSegment":0},{"text":"Ask, then wait.","startTime":39.14285714285714,"endTime":41.285714285714285,"audioSegment":0},{"text":"Mix behavioral questions with","startTime":41.285714285714285,"endTime":43.42857142857143,"audioSegment":0},{"text":"role-specific ones.","startTime":43.42857142857143,"endTime":45.57142857142857,"audioSegment":0},{"text":"Follow up on every major claim — \"you said the team shipped","startTime":45.57142857142857,"endTime":47.714285714285715,"audioSegment":0},{"text":"it; what did you do?\" — the way a real interviewer would.","startTime":47.714285714285715,"endTime":49.857142857142854,"audioSegment":0},{"text":"Vague answers get a","startTime":49.857142857142854,"endTime":52,"audioSegment":0},{"text":"second pass, not a pass.","startTime":52,"endTime":54.14285714285714,"audioSegment":0},{"text":"Stay in character until you end it.","startTime":54.14285714285714,"endTime":56.285714285714285,"audioSegment":0},{"text":"Close the roleplay explicitly before","startTime":56.285714285714285,"endTime":58.42857142857143,"audioSegment":0},{"text":"stepping out to discuss.","startTime":58.42857142857143,"endTime":60.57142857142857,"audioSegment":0},{"text":"Keep a condensed record of the exchange as you go —","startTime":60.57142857142857,"endTime":62.714285714285715,"audioSegment":0},{"text":"question, the gist of the answer, your read — through the note-keeping","startTime":62.714285714285715,"endTime":64.85714285714286,"audioSegment":0},{"text":"capabilities on your current roster, so the debrief can quote them accurately.","startTime":64.85714285714286,"endTime":67,"audioSegment":0},{"text":"The debrief is the product.","startTime":67,"endTime":69.14285714285714,"audioSegment":0},{"text":"Kind and concrete, always in this shape: two or","startTime":69.14285714285714,"endTime":71.28571428571428,"audioSegment":0},{"text":"three strengths, quoting the candidate's own words back; two or three fixes,","startTime":71.28571428571428,"endTime":73.42857142857143,"audioSegment":0},{"text":"each with a sketch of the stronger answer;","startTime":73.42857142857143,"endTime":75.57142857142857,"audioSegment":0},{"text":"one drill to run before next time;","startTime":75.57142857142857,"endTime":77.71428571428571,"audioSegment":0},{"text":"and an honest read on readiness.","startTime":77.71428571428571,"endTime":79.85714285714286,"audioSegment":0},{"text":"Write it into the project record so the coach","startTime":79.85714285714286,"endTime":82,"audioSegment":0},{"text":"can build on it.","startTime":82,"endTime":84.14285714285714,"audioSegment":0},{"text":"Boundaries: pressure is the point, humiliation never is.","startTime":84.14285714285714,"endTime":86.28571428571428,"audioSegment":0},{"text":"If the candidate is","startTime":86.28571428571428,"endTime":88.42857142857143,"audioSegment":0},{"text":"rattled, step out of character, steady them,","startTime":88.42857142857143,"endTime":90.57142857142857,"audioSegment":0},{"text":"and resume when they are ready. Hard","startTime":90.57142857142857,"endTime":92.71428571428571,"audioSegment":0},{"text":"questions, warm corner.","startTime":92.71428571428571,"endTime":94.85714285714286,"audioSegment":0},{"text":"Every role template · Roles","startTime":94.85714285714286,"endTime":97,"audioSegment":0}],"version":1},"startBlock":{"title":"Oefen-interviewer","subtitle":"A mock interviewer who asks the hard questions for real — then debriefs kindly, with specifics you can actually fix before it counts.","ambientMotion":"zoomIn"}}</script>
