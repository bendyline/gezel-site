,"startTime":20,"endTime":23,"audioSegment":0},{"text":"Temperament: warm, calm, lively, precise, wry, or patient.","startTime":23,"endTime":26,"audioSegment":0},{"text":"Quirk: curious, tidy, storyteller, planner, frugal, cheerleader, skeptic,","startTime":26,"endTime":29,"audioSegment":0},{"text":"wordsmith, rememberer, punctual, straight-shooter, or encourager.","startTime":29,"endTime":32,"audioSegment":0},{"text":"Style: plain, playful, or formal.","startTime":32,"endTime":35,"audioSegment":0},{"text":"Sociability: how much small talk they make, from Quiet to Talkative.","startTime":35,"endTime":38,"audioSegment":0},{"text":"A character is picked from a crew member's id when they are created and then kept as it is,","startTime":38,"endTime":41,"audioSegment":0},{"text":"so they stay the same person.","startTime":41,"endTime":44,"audioSegment":0},{"text":"You can change any of it on their Appearance tab.","startTime":44,"endTime":47,"audioSegment":0},{"text":"Under the choices, you'll see the exact lines they read about themselves,","startTime":47,"endTime":50,"audioSegment":0},{"text":"so nothing a choice does is hidden.","startTime":50,"endTime":53,"audioSegment":0},{"text":"Character is about how someone talks, not what they can do.","startTime":53,"endTime":56,"audioSegment":0},{"text":"Their role, toolkit,","startTime":56,"endTime":59,"audioSegment":0},{"text":"and the description on their About tab stay in charge of the work.","startTime":59,"endTime":62,"audioSegment":0},{"text":"A character never makes anyone skip a step or cut a corner.","startTime":62,"endTime":65,"audioSegment":0},{"text":"It decides whether they open with a joke or get straight to the point.","startTime":65,"endTime":68,"audioSegment":0},{"text":"Some choices also have a practical effect.","startTime":68,"endTime":71,"audioSegment":0},{"text":"A quiet, calm, or frugal character keeps table talk short.","startTime":71,"endTime":74,"audioSegment":0},{"text":"In a game like checkers,","startTime":74,"endTime":77,"audioSegment":0},{"text":"an opponent set to the default in-character personality plays in their own character.","startTime":77,"endTime":80,"audioSegment":0},{"text":"Your crew gets better at helping you over time,","startTime":80,"endTime":82.95833333333333,"audioSegment":0},{"text":"and growth makes that visible.","startTime":82.95833333333333,"endTime":85.91666666666667,"audioSegment":0},{"text":"Each crew member earns experience from what they learn: preferences and decisions they write down,","startTime":85.91666666666667,"endTime":88.875,"audioSegment":0},{"text":"corrections they take on board, lessons they distill, and work they finish.","startTime":88.875,"endTime":91.83333333333333,"audioSegment":0},{"text":"Chatting more does not earn anything.","startTime":91.83333333333333,"endTime":94.79166666666667,"audioSegment":0},{"text":"Neither does sending lots of messages.","startTime":94.79166666666667,"endTime":97.75,"audioSegment":0},{"text":"When one of them reaches a new level, they offer you a short menu of changes,","startTime":97.75,"endTime":100.70833333333334,"audioSegment":0},{"text":"each grounded in what they've actually learned:","startTime":100.70833333333334,"endTime":103.66666666666667,"audioSegment":0},{"text":"a trait: a working habit drawn from their notes (for example,","startTime":103.66666666666667,"endTime":106.625,"audioSegment":0},{"text":"\"Show a worked example before stating the rule\"),","startTime":106.625,"endTime":109.58333333333334,"audioSegment":0},{"text":"a tuning change: a little more deliberate, or a little more exploratory,","startTime":109.58333333333334,"endTime":112.54166666666667,"audioSegment":0},{"text":"a cosmetic: a new hat, apron, or accessory for their figure.","startTime":112.54166666666667,"endTime":115.5,"audioSegment":0},{"text":"You choose one, or skip the level.","startTime":115.5,"endTime":118.45833333333334,"audioSegment":0},{"text":"Nothing changes until you say yes,","startTime":118.45833333333334,"endTime":121.41666666666667,"audioSegment":0},{"text":"and you can retire a trait later from the Growth tab.","startTime":121.41666666666667,"endTime":124.375,"audioSegment":0},{"text":"Growth keeps counting with social mode off.","startTime":124.375,"endTime":127.33333333333334,"audioSegment":0},{"text":"You just won't see the Growth tab, the level badges,","startTime":127.33333333333334,"endTime":130.29166666666669,"audioSegment":0},{"text":"or the \"I just reached level 3!\" note in chat until you turn it back on.","startTime":130.29166666666669,"endTime":133.25,"audioSegment":0},{"text":"Growth works the same on phones as on the desktop.","startTime":133.25,"endTime":136.20833333333334,"audioSegment":0},{"text":"On a phone, level-up suggestions are drafted quietly in the background with the on-device model,","startTime":136.20833333333334,"endTime":139.16666666666669,"audioSegment":0},{"text":"and that drafting pauses whenever the app does.","startTime":139.16666666666669,"endTime":142.125,"audioSegment":0},{"text":"Your own progress is separate.","startTime":142.125,"endTime":145.08333333333334,"audioSegment":0},{"text":"Your Spanish level or a workout streak belongs to the project you're working in.","startTime":145.08333333333334,"endTime":148.04166666666669,"audioSegment":0},{"text":"It never counts toward a crew member's level.","startTime":148.04166666666669,"endTime":151,"audioSegment":0},{"text":"With social mode on,","startTime":151,"endTime":153.375,"audioSegment":0},{"text":"opening someone's chat shows at most one thing they have waiting for you:","startTime":153.375,"endTime":155.75,"audioSegment":0},{"text":"a question they asked that you haven't answered yet, or","startTime":155.75,"endTime":158.125,"audioSegment":0},{"text":"work they finished in the last few days,","startTime":158.125,"endTime":160.5,"audioSegment":0},{"text":"with a button to open it.","startTime":160.5,"endTime":162.875,"audioSegment":0},{"text":"If there's nothing waiting, there's no card.","startTime":162.875,"endTime":165.25,"audioSegment":0},{"text":"Gezel doesn't invent a greeting to fill the space.","startTime":165.25,"endTime":167.625,"audioSegment":0},{"text":"Dismiss a card and it stays gone.","startTime":167.625,"endTime":170,"audioSegment":0}],"version":1},"startBlock":{"title":"Social mode","subtitle":"Social mode is one switch in Settings → General. With it on, your crew chats in character, you can watch each of them grow, and opening a chat shows you what is waiting. With it off, they work in a plain, even voice and none of this is on screen.","ambientMotion":"zoomIn"}}</script>
