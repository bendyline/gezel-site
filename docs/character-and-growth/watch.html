":[{"type":"paragraph","children":[{"type":"text","value":"work they finished in the last few days, with a button to open it.","position":{"start":{"line":45,"column":3,"offset":3176},"end":{"line":45,"column":69,"offset":3242}}}],"position":{"start":{"line":45,"column":3,"offset":3176},"end":{"line":45,"column":69,"offset":3242}}}],"position":{"start":{"line":45,"column":1,"offset":3174},"end":{"line":45,"column":69,"offset":3242}}}],"position":{"start":{"line":44,"column":1,"offset":3116},"end":{"line":45,"column":69,"offset":3242}}},{"type":"paragraph","children":[{"type":"text","value":"If there's nothing waiting, there's no card. Gezellen don't invent a greeting to fill the space. Dismiss a card and it stays gone.","position":{"start":{"line":47,"column":1,"offset":3244},"end":{"line":47,"column":131,"offset":3374}}}],"position":{"start":{"line":47,"column":1,"offset":3244},"end":{"line":47,"column":131,"offset":3374}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Social mode is one switch in Settings → General.","startTime":0,"endTime":2.857142857142857,"audioSegment":0},{"text":"With it on, your gezellen chat in their own character, you can watch them grow,","startTime":2.857142857142857,"endTime":5.714285714285714,"audioSegment":0},{"text":"and opening a chat shows you what they have waiting.","startTime":5.714285714285714,"endTime":8.571428571428571,"audioSegment":0},{"text":"With it off, they work in a plain,","startTime":8.571428571428571,"endTime":11.428571428571429,"audioSegment":0},{"text":"even voice and none of this is on screen.","startTime":11.428571428571429,"endTime":14.285714285714286,"audioSegment":0},{"text":"It starts on for phones and off for the desktop.","startTime":14.285714285714286,"endTime":17.142857142857142,"audioSegment":0},{"text":"Your choice wins on either one.","startTime":17.142857142857142,"endTime":20,"audioSegment":0},{"text":"Every gezel is born with a character: four small choices that shape how they come across in chat.","startTime":20,"endTime":23.05,"audioSegment":0},{"text":"Temperament: warm, calm, lively, precise, wry, or patient.","startTime":23.05,"endTime":26.1,"audioSegment":0},{"text":"Quirk: curious, tidy, storyteller, planner, frugal, cheerleader, skeptic,","startTime":26.1,"endTime":29.15,"audioSegment":0},{"text":"wordsmith, rememberer, punctual, straight-shooter, or encourager.","startTime":29.15,"endTime":32.2,"audioSegment":0},{"text":"Style: plain, playful, or formal.","startTime":32.2,"endTime":35.25,"audioSegment":0},{"text":"Sociability: how much small talk they make, from Quiet to Talkative.","startTime":35.25,"endTime":38.3,"audioSegment":0},{"text":"A character is picked from the gezel's id when they are created and then kept as it is,","startTime":38.3,"endTime":41.349999999999994,"audioSegment":0},{"text":"so the same gezel stays the same person.","startTime":41.349999999999994,"endTime":44.4,"audioSegment":0},{"text":"You can change any of it on the gezel's Appearance tab.","startTime":44.4,"endTime":47.45,"audioSegment":0},{"text":"Under the choices, you'll see the exact lines your gezel reads about themselves,","startTime":47.45,"endTime":50.5,"audioSegment":0},{"text":"so nothing a choice does is hidden.","startTime":50.5,"endTime":53.55,"audioSegment":0},{"text":"Character is about how a gezel talks, not what they can do.","startTime":53.55,"endTime":56.599999999999994,"audioSegment":0},{"text":"Their role, toolkit,","startTime":56.599999999999994,"endTime":59.65,"audioSegment":0},{"text":"and the description on their About tab stay in charge of the work.","startTime":59.65,"endTime":62.699999999999996,"audioSegment":0},{"text":"A character never makes a gezel skip a step or cut a corner.","startTime":62.699999999999996,"endTime":65.75,"audioSegment":0},{"text":"It decides whether they open with a joke or get straight to the point.","startTime":65.75,"endTime":68.8,"audioSegment":0},{"text":"Some choices also have a practical effect.","startTime":68.8,"endTime":71.85,"audioSegment":0},{"text":"A quiet, calm, or frugal gezel keeps table talk short.","startTime":71.85,"endTime":74.9,"audioSegment":0},{"text":"In a game like checkers,","startTime":74.9,"endTime":77.94999999999999,"audioSegment":0},{"text":"a gezel set to the default in-character personality plays in their own character.","startTime":77.94999999999999,"endTime":81,"audioSegment":0},{"text":"Gezellen get better at helping you over time,","startTime":81,"endTime":83.91666666666667,"audioSegment":0},{"text":"and growth makes that visible.","startTime":83.91666666666667,"endTime":86.83333333333333,"audioSegment":0},{"text":"A gezel earns experience from what they learn: preferences and decisions they write down,","startTime":86.83333333333333,"endTime":89.75,"audioSegment":0},{"text":"corrections they take on board, lessons they distill, and work they finish.","startTime":89.75,"endTime":92.66666666666667,"audioSegment":0},{"text":"Chatting more does not earn anything.","startTime":92.66666666666667,"endTime":95.58333333333333,"audioSegment":0},{"text":"Neither does sending lots of messages.","startTime":95.58333333333333,"endTime":98.5,"audioSegment":0},{"text":"When a gezel reaches a new level, they offer you a short menu of changes,","startTime":98.5,"endTime":101.41666666666666,"audioSegment":0},{"text":"each grounded in what they've actually learned:","startTime":101.41666666666666,"endTime":104.33333333333333,"audioSegment":0},{"text":"a trait: a working habit drawn from their notes (for example,","startTime":104.33333333333333,"endTime":107.25,"audioSegment":0},{"text":"\"Show a worked example before stating the rule\"),","startTime":107.25,"endTime":110.16666666666666,"audioSegment":0},{"text":"a tuning change: a little more deliberate, or a little more exploratory,","startTime":110.16666666666666,"endTime":113.08333333333333,"audioSegment":0},{"text":"a cosmetic: a new hat, apron, or accessory for their figure.","startTime":113.08333333333333,"endTime":116,"audioSegment":0},{"text":"You choose one, or skip the level.","startTime":116,"endTime":118.91666666666666,"audioSegment":0},{"text":"Nothing changes until you say yes,","startTime":118.91666666666666,"endTime":121.83333333333333,"audioSegment":0},{"text":"and you can retire a trait later from the Growth tab.","startTime":121.83333333333333,"endTime":124.75,"audioSegment":0},{"text":"Growth keeps counting with social mode off.","startTime":124.75,"endTime":127.66666666666666,"audioSegment":0},{"text":"You just won't see the Growth tab, the level badges,","startTime":127.66666666666666,"endTime":130.58333333333331,"audioSegment":0},{"text":"or the \"I just reached level 3!\" note in chat until you turn it back on.","startTime":130.58333333333331,"endTime":133.5,"audioSegment":0},{"text":"Growth works the same on phones as on the desktop.","startTime":133.5,"endTime":136.41666666666666,"audioSegment":0},{"text":"On a phone, a gezel's level-up suggestions are drafted quietly in the background with the on-device model,","startTime":136.41666666666666,"endTime":139.33333333333331,"audioSegment":0},{"text":"and that drafting pauses whenever the app does.","startTime":139.33333333333331,"endTime":142.25,"audioSegment":0},{"text":"Your own progress is separate.","startTime":142.25,"endTime":145.16666666666666,"audioSegment":0},{"text":"Your Spanish level or a workout streak belongs to the project you're working in.","startTime":145.16666666666666,"endTime":148.08333333333331,"audioSegment":0},{"text":"It never counts toward a gezel's level.","startTime":148.08333333333331,"endTime":151,"audioSegment":0},{"text":"With social mode on,","startTime":151,"endTime":153.5,"audioSegment":0},{"text":"opening a gezel's chat shows at most one thing they have waiting for you:","startTime":153.5,"endTime":156,"audioSegment":0},{"text":"a question they asked that you haven't answered yet, or","startTime":156,"endTime":158.5,"audioSegment":0},{"text":"work they finished in the last few days,","startTime":158.5,"endTime":161,"audioSegment":0},{"text":"with a button to open it.","startTime":161,"endTime":163.5,"audioSegment":0},{"text":"If there's nothing waiting, there's no card.","startTime":163.5,"endTime":166,"audioSegment":0},{"text":"Gezellen don't invent a greeting to fill the space.","startTime":166,"endTime":168.5,"audioSegment":0},{"text":"Dismiss a card and it stays gone.","startTime":168.5,"endTime":171,"audioSegment":0}],"version":1},"startBlock":{"title":"Social mode","subtitle":"Social mode is one switch in Settings → General. With it on, your gezellen chat in their own character, you can watch them grow, and opening a chat shows you what they have waiting. With it off, they work in a plain, even voice and none of this is on screen.","ambientMotion":"zoomIn"}}</script>
