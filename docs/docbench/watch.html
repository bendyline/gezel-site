":393,"duration":14,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Choosing from this","position":{"start":{"line":105,"column":4,"offset":8348},"end":{"line":105,"column":22,"offset":8366}}}],"position":{"start":{"line":105,"column":1,"offset":8345},"end":{"line":105,"column":22,"offset":8366}}},"title":"Choosing from this","contents":[{"type":"paragraph","children":[{"type":"text","value":"In DocBlocks, the model list ranks models that fit your computer by their docbench score, so the first suggestion is the best measured model your hardware can run. If a model has no score, it has not been measured yet. That is not a verdict either way.","position":{"start":{"line":107,"column":1,"offset":8368},"end":{"line":107,"column":253,"offset":8620}}}],"position":{"start":{"line":107,"column":1,"offset":8368},"end":{"line":107,"column":253,"offset":8620}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The model scorecard asks whether a model can finish a job on its own.","startTime":0,"endTime":3.8,"audioSegment":0},{"text":"Docbench asks a different question: when DocBlocks hands a model a single piece of document work,","startTime":3.8,"endTime":7.6,"audioSegment":0},{"text":"how good is what comes back?","startTime":7.6,"endTime":11.399999999999999,"audioSegment":0},{"text":"It runs the same prompts, parsers, and repairs DocBlocks itself uses,","startTime":11.399999999999999,"endTime":15.2,"audioSegment":0},{"text":"so the score describes what you would see in the editor, not a lab version of it.","startTime":15.2,"endTime":19,"audioSegment":0},{"text":"Every model gets the same documents and the same requests, in six groups:","startTime":19,"endTime":22.1,"audioSegment":0},{"text":"Review — the eight review styles, from a general read to resume feedback,","startTime":22.1,"endTime":25.2,"audioSegment":0},{"text":"fact checking, and plain-language edits.","startTime":25.2,"endTime":28.3,"audioSegment":0},{"text":"Each test document has known problems written into it, and a reviewer checks which ones the model found,","startTime":28.3,"endTime":31.4,"audioSegment":0},{"text":"which suggestions were real but small, and which were wrong.","startTime":31.4,"endTime":34.5,"audioSegment":0},{"text":"Clean documents check that a model does not invent problems.","startTime":34.5,"endTime":37.6,"audioSegment":0},{"text":"Writing — new content from a brief, plus text added to the end of a document or inserted in the middle of one,","startTime":37.6,"endTime":40.7,"audioSegment":0},{"text":"and rewrites (shorter, more formal, fixed grammar, bullets to prose).","startTime":40.7,"endTime":43.8,"audioSegment":0},{"text":"Pictures — choosing what to illustrate, building diagrams of thirteen kinds,","startTime":43.8,"endTime":46.900000000000006,"audioSegment":0},{"text":"drawing simple illustrations, and writing briefs for an image model.","startTime":46.900000000000006,"endTime":50,"audioSegment":0},{"text":"Drawings are judged as rendered pictures.","startTime":50,"endTime":53.1,"audioSegment":0},{"text":"Slides — turning a document into a slide deck.","startTime":53.1,"endTime":56.2,"audioSegment":0},{"text":"Study — summaries, notes, quizzes,","startTime":56.2,"endTime":59.300000000000004,"audioSegment":0},{"text":"and flashcards that stay true to the source.","startTime":59.300000000000004,"endTime":62.4,"audioSegment":0},{"text":"Narration — cleaning up a dictated transcript without changing what was said.","startTime":62.4,"endTime":65.5,"audioSegment":0},{"text":"Each answer gets two kinds of marks.","startTime":65.5,"endTime":68.6,"audioSegment":0},{"text":"Automatic checks catch answers DocBlocks could not use at all: cut off,","startTime":68.6,"endTime":71.7,"audioSegment":0},{"text":"unparseable, or ignoring the request.","startTime":71.7,"endTime":74.80000000000001,"audioSegment":0},{"text":"An AI reviewer then grades the rest against a written rubric.","startTime":74.80000000000001,"endTime":77.9,"audioSegment":0},{"text":"An answer DocBlocks could not use scores zero.","startTime":77.9,"endTime":81,"audioSegment":0},{"text":"Docbench is a weighted average of the six groups, from 0 to 100.","startTime":81,"endTime":84.5,"audioSegment":0},{"text":"Review and writing count for a quarter each, pictures a fifth,","startTime":84.5,"endTime":88,"audioSegment":0},{"text":"study aids 15%, slides 10%, and narration 5%.","startTime":88,"endTime":91.5,"audioSegment":0},{"text":"95% range is how far the score could plausibly move if we had picked different test documents.","startTime":91.5,"endTime":95,"audioSegment":0},{"text":"Two models whose ranges overlap are not reliably different,","startTime":95,"endTime":98.5,"audioSegment":0},{"text":"so they share a band, and the band is the fairest way to read the order.","startTime":98.5,"endTime":102,"audioSegment":0},{"text":"Usable is the share of answers DocBlocks could show you at all,","startTime":102,"endTime":105.5,"audioSegment":0},{"text":"before any grading.","startTime":105.5,"endTime":109,"audioSegment":0},{"text":"Suggestions per document breaks general review down by how much each suggestion would change the draft: small fixes,","startTime":109,"endTime":112.5,"audioSegment":0},{"text":"moderate changes, and substantial ones, beside the trivial and wrong suggestions a model added.","startTime":112.5,"endTime":116,"audioSegment":0},{"text":"A model that finds few substantial problems but many trivial ones will feel busy without being helpful.","startTime":116,"endTime":119.5,"audioSegment":0},{"text":"Scores compare fairly only within one round: the same test set,","startTime":119.5,"endTime":123,"audioSegment":0},{"text":"the same reviewer, and the same version of the prompts.","startTime":123,"endTime":126.5,"audioSegment":0},{"text":"Each round says which it used.","startTime":126.5,"endTime":130,"audioSegment":0},{"text":"Sometimes a fix to Gezel changes what a model can do,","startTime":130,"endTime":133.5,"audioSegment":0},{"text":"such as a model that could not produce structured answers until Gezel worked around it.","startTime":133.5,"endTime":137,"audioSegment":0},{"text":"Then that model is measured again in a focused re-run under the same tests,","startTime":137,"endTime":140.5,"audioSegment":0},{"text":"reviewer and date, and listed beneath the full round.","startTime":140.5,"endTime":144,"audioSegment":0},{"text":"Its row in the full table says it was re-measured,","startTime":144,"endTime":147.5,"audioSegment":0},{"text":"and its band is its place in the full field.","startTime":147.5,"endTime":151,"audioSegment":0},{"text":"2026-11-11 · NVIDIA RTX Spark N1X (6144-core GPU,","startTime":151,"endTime":153.55882352941177,"audioSegment":0},{"text":"20-core CPU) · NVIDIA RTX Spark N1X (6144-core Blackwell RTX GPU) · 23 GB · llama-cpp · pack 0.2.1 · judged by claude-opus-5-5","startTime":153.55882352941177,"endTime":156.11764705882354,"audioSegment":0},{"text":"Band Model Size Docbench 95% range Review Writing Pictures Slides Study Narration Usable","startTime":156.11764705882354,"endTime":158.6764705882353,"audioSegment":0},{"text":"1 Qwen 3.8 (27B,","startTime":158.6764705882353,"endTime":161.23529411764707,"audioSegment":0},{"text":"Q4) 27B 81 79–82 72 89 82 89 74 86 100%","startTime":161.23529411764707,"endTime":163.7941176470588,"audioSegment":0},{"text":"1 Qwen 3.8 (27B,","startTime":163.7941176470588,"endTime":166.35294117647058,"audioSegment":0},{"text":"Q2) 27B 79 77–81 69 87 78 90 74 87 100%","startTime":166.35294117647058,"endTime":168.91176470588235,"audioSegment":0},{"text":"1 Gemma 4 (12B,","startTime":168.91176470588235,"endTime":171.47058823529412,"audioSegment":0},{"text":"Q4) 12B 79 77–81 70 83 84 86 72 88 100%","startTime":171.47058823529412,"endTime":174.02941176470588,"audioSegment":0},{"text":"2 Qwen 3.6 (35B-A3B,","startTime":174.02941176470588,"endTime":176.58823529411765,"audioSegm 97%","startTime":348.3333333333333,"endTime":352.22222222222223,"audioSegment":0},{"text":"Focused re-run of nanbeige4.2-3b-q4, gpt-oss-20b-q4 beside docbench-sweep-0.2.1-2026-11-10, after fixes to how Gezel serves them;","startTime":352.22222222222223,"endTime":356.1111111111111,"audioSegment":0},{"text":"bands place them in that round's field · docbench 0.2.2 · public fixtures 27f9a7ba3ea4 · 32768-token launch context · judge claude-opus-5-5 (prompt v2) · prompts dated 2026-11-10","startTime":356.1111111111111,"endTime":360,"audioSegment":0},{"text":"An AI reviewer is only worth trusting if it is consistent and hard to fool, so before a round is published the reviewer passes three tests: it must give nearly the same marks when asked twice,","startTime":360,"endTime":366.6,"audioSegment":0},{"text":"agree with a second reviewer from a different model family, and mark down deliberately damaged answers (cut short, padded, with invented numbers, or ignoring the request) at least nine times in ten.","startTime":366.6,"endTime":373.2,"audioSegment":0},{"text":"Some test documents are kept private and used only in published rounds.","startTime":373.2,"endTime":379.8,"audioSegment":0},{"text":"If a model does much better on the public documents than the private ones,","startTime":379.8,"endTime":386.4,"audioSegment":0},{"text":"that is a sign the prompts have been tuned to the test rather than to real work.","startTime":386.4,"endTime":393,"audioSegment":0},{"text":"In DocBlocks, the model list ranks models that fit your computer by their docbench score,","startTime":393,"endTime":396.5,"audioSegment":0},{"text":"so the first suggestion is the best measured model your hardware can run.","startTime":396.5,"endTime":400,"audioSegment":0},{"text":"If a model has no score, it has not been measured yet.","startTime":400,"endTime":403.5,"audioSegment":0},{"text":"That is not a verdict either way.","startTime":403.5,"endTime":407,"audioSegment":0}],"version":1},"startBlock":{"ti
