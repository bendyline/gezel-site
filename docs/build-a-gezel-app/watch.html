3014.714285714286,"audioSegment":0},{"text":"never 2026-11-12, 1529, in-review, or an internal id like ch-4.","startTime":3014.714285714286,"endTime":3017.285714285714,"audioSegment":0},{"text":"Do date math in local time. C2.","startTime":3017.285714285714,"endTime":3019.8571428571427,"audioSegment":0},{"text":"Color follows the value.","startTime":3019.8571428571427,"endTime":3022.4285714285716,"audioSegment":0},{"text":"A count is ink.","startTime":3022.4285714285716,"endTime":3025,"audioSegment":0},{"text":"Red and amber mean a problem now,","startTime":3025,"endTime":3027.5714285714284,"audioSegment":0},{"text":"so 0 conflicts is not red.","startTime":3027.5714285714284,"endTime":3030.1428571428573,"audioSegment":0},{"text":"The accent is not a color for counts. C3.","startTime":3030.1428571428573,"endTime":3032.714285714286,"audioSegment":0},{"text":"Empty states span their list and say how to fill it.","startTime":3032.714285714286,"endTime":3035.285714285714,"audioSegment":0},{"text":"\"Open spots appear here once the week has shifts.\" Never squeeze the message into a list's first grid column. C4.","startTime":3035.285714285714,"endTime":3037.8571428571427,"audioSegment":0},{"text":"Say when a list is cut.","startTime":3037.8571428571427,"endTime":3040.4285714285716,"audioSegment":0},{"text":"Write \"Showing 4 of 12\" when only part of a list is shown. C5.","startTime":3040.4285714285716,"endTime":3043,"audioSegment":0},{"text":"Search only long lists.","startTime":3043,"endTime":3045.5714285714284,"audioSegment":0},{"text":"Show a search box from about eight items, inside the list's section,","startTime":3045.5714285714284,"endTime":3048.1428571428573,"audioSegment":0},{"text":"with a placeholder that says what to type (\"Name or role\").","startTime":3048.1428571428573,"endTime":3050.714285714286,"audioSegment":0},{"text":"Do not count the empty-state row as an item. C6.","startTime":3050.714285714286,"endTime":3053.285714285714,"audioSegment":0},{"text":"Everything the companion can change has a place on the page.","startTime":3053.285714285714,"endTime":3055.8571428571427,"audioSegment":0},{"text":"If it can edit sessions, past visits,","startTime":3055.8571428571427,"endTime":3058.4285714285716,"audioSegment":0},{"text":"or a voice guide, the person can see them somewhere.","startTime":3058.4285714285716,"endTime":3061,"audioSegment":0},{"text":"The page style guide holds the detail.","startTime":3061,"endTime":3063.294117647059,"audioSegment":0},{"text":"These are the rules apps most often break. D1.","startTime":3063.294117647059,"endTime":3065.5882352941176,"audioSegment":0},{"text":"Actions use Gezel's action color.","startTime":3065.5882352941176,"endTime":3067.8823529411766,"audioSegment":0},{"text":"Primary keys, focus rings, and Send use terracotta.","startTime":3067.8823529411766,"endTime":3070.176470588235,"audioSegment":0},{"text":"The app's own accent is identity: charts, bars, and chips.","startTime":3070.176470588235,"endTime":3072.470588235294,"audioSegment":0},{"text":"Never set --gezel-component-accent to restyle Gezel's components in an app color. D2.","startTime":3072.470588235294,"endTime":3074.764705882353,"audioSegment":0},{"text":"One demo banner.","startTime":3074.764705882353,"endTime":3077.0588235294117,"audioSegment":0},{"text":"The banner is a quiet parchment strip with Reset demo,","startTime":3077.0588235294117,"endTime":3079.3529411764707,"audioSegment":0},{"text":"the same in every app.","startTime":3079.3529411764707,"endTime":3081.6470588235293,"audioSegment":0},{"text":"It is a notice, not an action or an error. D3.","startTime":3081.6470588235293,"endTime":3083.9411764705883,"audioSegment":0},{"text":"Headings use PT Serif at weight 400.","startTime":3083.9411764705883,"endTime":3086.235294117647,"audioSegment":0},{"text":"Small uppercase labels and eyebrows use the UI sans.","startTime":3086.235294117647,"endTime":3088.529411764706,"audioSegment":0},{"text":"Do not mark one up as a styled-down h2 or h3,","startTime":3088.529411764706,"endTime":3090.823529411765,"audioSegment":0},{"text":"which turns it serif. D4.","startTime":3090.823529411765,"endTime":3093.1176470588234,"audioSegment":0},{"text":"Body text is about 16px.","startTime":3093.1176470588234,"endTime":3095.4117647058824,"audioSegment":0},{"text":"Nothing you can press is smaller than 28px,","startTime":3095.4117647058824,"endTime":3097.705882352941,"audioSegment":0},{"text":"and keys are 44px tall.","startTime":3097.705882352941,"endTime":3100,"audioSegment":0},{"text":"E1.","startTime":3100,"endTime":3102.4444444444443,"audioSegment":0},{"text":"The conversation's title says where you are,","startTime":3102.4444444444443,"endTime":3104.8888888888887,"audioSegment":0},{"text":"and its description suggests what to ask.","startTime":3104.8888888888887,"endTime":3107.3333333333335,"audioSegment":0},{"text":"For example: \"At the scheduling desk\" and \"Add a shift,","startTime":3107.3333333333335,"endTime":3109.777777777778,"audioSegment":0},{"text":"mark when someone can't work, or ask where the week is short.\" E2.","startTime":3109.777777777778,"endTime":3112.222222222222,"audioSegment":0},{"text":"Keep the composer's placeholder to about 28 characters. For example,","startTime":3112.222222222222,"endTime":3114.6666666666665,"audioSegment":0},{"text":"\"What changed this week?\" A longer one is cut off in the panel. E3.","startTime":3114.6666666666665,"endTime":3117.1111111111113,"audioSegment":0},{"text":"Demo suggestions do real work on the page.","startTime":3117.1111111111113,"endTime":3119.5555555555557,"audioSegment":0},{"text":"See the sample conversation.","startTime":3119.5555555555557,"endTime":3122,"audioSegment":0},{"text":"The components carry most of these practices.","startTime":3122,"endTime":3124.4285714285716,"audioSegment":0},{"text":"A page on a current host (page components version 2) can use:","startTime":3124.4285714285716,"endTime":3126.8571428571427,"audioSegment":0},{"text":"actionForm(mount, { presentation: 'dialog', primary, buttonLabel, ... }).","startTime":3126.8571428571427,"endTime":3129.285714285714,"audioSegment":0},{"text":"It draws a key that opens the form in a modal.","startTime":3129.285714285714,"endTime":3131.714285714286,"audioSegment":0},{"text":"Its handle's open(values) opens the form filled in, for a row's key.","startTime":3131.714285714286,"endTime":3134.1428571428573,"audioSegment":0},{"text":"Use trigger: false for a dialog that only rows open.","startTime":3134.1428571428573,"endTime":3136.5714285714284,"audioSegment":0},{"text":"actionForm(mount, { presentation: 'inline' }) for a settings form,","startTime":3136.5714285714284,"endTime":3139,"audioSegment":0},{"text":"with reset(values) to show what is saved.","startTime":3139,"endTime":3141.4285714285716,"audioSegment":0},{"text":"tabs(mount, { tabs: [{ id, label, panel,","startTime":3141.4285714285716,"endTime":3143.8571428571427,"audioSegment":0},{"text":"badge }] }) for underline tabs over the page's own panels.","startTime":3143.8571428571427,"endTime":3146.285714285714,"audioSegment":0},{"text":"collectionFilter(mount, { ..., placeholder,","startTime":3146.285714285714,"endTime":3148.714285714286,"audioSegment":0},{"text":"minItems: 8 }) for search that appears only when it helps.","startTime":3148.714285714286,"endTime":3151.1428571428573,"audioSegment":0},{"text":"Feature-detect version 2 (gezel.ui.components.version >= 2 and typeof tabs === 'function').","startTime":3151.1428571428573,"endTime":3153.5714285714284,"audioSegment":0},{"text":"Keep an older host usable: there,","startTime":3153.5714285714284,"endTime":3156,"audioSegment":0},{"text":"an action form falls back to a disclosure.","startTime":3156,"endTime":3158.4285714285716,"audioSegment":0},{"text":"Catalog apps in Gilde share one composition script, application.js.","startTime":3158.4285714285716,"endTime":3160.8571428571427,"audioSegment":0},{"text":"Its config declares the structure, and the script builds the tabs,","startTime":3160.8571428571427,"endTime":3163.285714285714,"audioSegment":0},{"text":"keys, settings forms, and row dialogs from it: \"tabs\": [","startTime":3163.285714285714,"endTime":3165.714285714286,"audioSegment":0},{"text":"{ \"id\": \"home\", \"label\": \"Home\", \"sections\": [\".tiles\", \"#gaps-section\", \"#week-section\"],","startTime":3165.714285714286,"endTime":3168.1428571428573,"audioSegment":0},{"text":"\"actions\": [\"add_shift\", \"assign_shift\", \"set_availability\"], \"primary\": false },","startTime":3168.1428571428573,"endTime":3170.5714285714284,"audioSegment":0},{"text":"{ \"id\": \"people\", \"label\": \"People\", \"sections\": [\"#hours-section\", \"#away-section\"],","startTime":3170.5714285714284,"endTime":3173,"audioSegment":0},{"text":"\"actions\": [\"add_staff\", \"set_availability\"] },","startTime":3173,"endTime":3175.4285714285716,"audioSegment":0},{"text":"{ \"id\": \"settings\", \"label\": \"Settings\", \"settings\": [\"set_rules\"], \"sections\": [\"#rules-section\"] } ]","startTime":3175.4285714285716,"endTime":3177.8571428571427,"audioSegment":0},{"text":"A row action is a button in the page's own markup.","startTime":3177.8571428571427,"endTime":3180.285714285714,"audioSegment":0},{"text":"The shared script opens the matching dialog filled in:","startTime":3180.285714285714,"endTime":3182.714285714286,"audioSegment":0},{"text":"const fill = document.createElement('button');","startTime":3182.714285714286,"endTime":3185.1428571428573,"audioSegment":0},{"text":"fill.type = 'button';","startTime":3185.1428571428573,"endTime":3187.5714285714284,"audioSegment":0},{"text":"fill.className = 'key';","startTime":3187.5714285714284,"endTime":3190,"audioSegment":0},{"text":"fill.textContent = 'Fill';","startTime":3190,"endTime":3192.4285714285716,"audioSegment":0},{"text":"fill.setAttribute('aria-label', `Fill ${dayName} ${shift.fields.start} ${shift.fields.role}`);","startTime":3192.4285714285716,"endTime":3194.8571428571427,"audioSegment":0},{"text":"fill.setAttribute('data-app-action', 'assign_shift');","startTime":3194.8571428571427,"endTime":3197.285714285714,"audioSegment":0},{"text":"fill.setAttribute('data-app-values', JSON.stringify({ id: shift.id }));","startTime":3197.285714285714,"endTime":3199.714285714286,"audioSegment":0},{"text":"Shift Roster 1.1.0 is the reference implementation.","startTime":3199.714285714286,"endTime":3202.1428571428573,"audioSegment":0},{"text":"Its page shows Home, People, and Settings, Fill keys on open spots,","startTime":3202.1428571428573,"endTime":3204.5714285714284,"audioSegment":0},{"text":"Time off keys on each person, and a settings form that shows the saved rules.","startTime":3204.5714285714284,"endTime":3207,"audioSegment":0},{"text":"The shape is chosen, and the structure matches it (A2–A7).","startTime":3207,"endTime":3209.6153846153848,"audioSegment":0},{"text":"The summary line says the state and what needs attention (A1).","startTime":3209.6153846153848,"endTime":3212.230769230769,"audioSegment":0},{"text":"Every action opens a dialog.","startTime":3212.230769230769,"endTime":3214.846153846154,"audioSegment":0},{"text":"No view has more than three keys or more than one primary (B1, B2).","startTime":3214.846153846154,"endTime":3217.4615384615386,"audioSegment":0},{"text":"Forms that pick an on-screen record are row keys (B3).","startTime":3217.4615384615386,"endTime":3220.076923076923,"audioSegment":0},{"text":"No ISO dates, raw enum values, or ids are shown (C1).","startTime":3220.076923076923,"endTime":3222.6923076923076,"audioSegment":0},{"text":"Tones follow values (C2).","startTime":3222.6923076923076,"endTime":3225.3076923076924,"audioSegment":0},{"text":"Empty states span their list.","startTime":3225.3076923076924,"endTime":3227.923076923077,"audioSegment":0},{"text":"Search appears only on long lists, with a real placeholder (C3, C5).","startTime":3227.923076923077,"endTime":3230.5384615384614,"audioSegment":0},{"text":"Actions and focus use the action color.","startTime":3230.5384615384614,"endTime":3233.153846153846,"audioSegment":0},{"text":"The demo banner is the shared one (D1, D2).","startTime":3233.153846153846,"endTime":3235.769230769231,"audioSegment":0},{"text":"The page works at 420px wide without scrolling sideways,","startTime":3235.769230769231,"endTime":3238.3846153846152,"audioSegment":0},{"text":"in dark mode, and with the keyboard.","startTime":3238.3846153846152,"endTime":3241,"audioSegment":0},{"text":"Settings for what the person chose at creation.","startTime":3241,"endTime":3243.5,"audioSegment":0},{"text":"A business name, an event date,","startTime":3243.5,"endTime":3246,"audioSegment":0},{"text":"or a weekly word goal is a project parameter.","startTime":3246,"endTime":3248.5,"audioSegment":0},{"text":"Pages can read these but not change them,","startTime":3248.5,"endTime":3251,"audioSegment":0},{"text":"so most of them cannot appear in Settings today.","startTime":3251,"endTime":3253.5,"audioSegment":0},{"text":"A host-drawn Settings form generated from the parameter schema would serve every app at once.","startTime":3253.5,"endTime":3256,"audioSegment":0},{"text":"Nouns shared between apps.","startTime":3256,"endTime":3258.5,"audioSegment":0},{"text":"Shift Roster, New Hire Onboarding,","startTime":3258.5,"endTime":3261,"audioSegment":0},{"text":"and Training Tracker each keep their own list of the same café staff.","startTime":3261,"endTime":3263.5,"audioSegment":0},{"text":"Should one business keep one People list?","startTime":3263.5,"endTime":3266,"audioSegment":0},{"text":"Field types the forms lack.","startTime":3266,"endTime":3268.5,"audioSegment":0},{"text":"A rating, a yes/no choice, a color, and amounts stored in cents. Without them,","startTime":3268.5,"endTime":3271,"audioSegment":0},{"text":"some actions stay a free-text field or stay out of Settings.","startTime":3271,"endTime":3273.5,"audioSegment":0},{"text":"The companion's name on the page.","startTime":3273.5,"endTime":3276,"audioSegment":0},{"text":"Pages know the crew member's role but not their name,","startTime":3276,"endTime":3278.5,"audioSegment":0},{"text":"so page text says \"Your shift scheduler\" while the conversation says \"Nina\".","startTime":3278.5,"endTime":3281,"audioSegment":0},{"text":"Narrow tab rows.","startTime":3281,"endTime":3283.5,"audioSegment":0},{"text":"The shell's tab rows trade labels for icons as they narrow.","startTime":3283.5,"endTime":3286,"audioSegment":0},{"text":"App tabs scroll instead,","startTime":3286,"endTime":3288.5,"audioSegment":0},{"text":"which works for short labels but is not the shell's rule.","startTime":3288.5,"endTime":3291,"audioSegment":0},{"text":"Host-supplied tokens.","startTime":3291,"endTime":3293.5,"audioSegment":0},{"text":"Pages still declare their own colors, spacing, and title sizes.","startTime":3293.5,"endTime":3296,"audioSegment":0},{"text":"A small shared set (action color, surfaces,","startTime":3296,"endTime":3298.5,"audioSegment":0},{"text":"title scale) would remove most of the drift this guide polices.","startTime":3298.5,"endTime":3301,"audioSegment":0},{"text":"November 7, 2026.","startTime":3301,"endTime":3303.25,"audioSegment":0},{"text":"First version, from a review of 43 catalog apps.","startTime":3303.25,"endTime":3305.5,"audioSegment":0},{"text":"It covers the five app shapes, Home and noun tabs, dialog actions,","startTime":3305.5,"endTime":3307.75,"audioSegment":0},{"text":"row actions, inline settings, and value formatting.","startTime":3307.75,"endTime":3310,"audioSegment":0},{"text":"Open these when you need an exact detail:","startTime":3310,"endTime":3313.125,"audioSegment":0},{"text":"Output Pane API reference: every page method,","startTime":3313.125,"endTime":3316.25,"audioSegment":0},{"text":"permission, mode, limit, and error code.","startTime":3316.25,"endTime":3319.375,"audioSegment":0},{"text":"TypeScript declarations for pages: the same API as types.","startTime":3319.375,"endTime":3322.5,"audioSegment":0},{"text":"Project-type specification: composition, adoption, upgrades, and the .gezapp format.","startTime":3322.5,"endTime":3325.625,"audioSegment":0},{"text":"Writing scripts with gezel-sdk: deterministic actions and the checks that hold a craftbook step until its work is right.","startTime":3325.625,"endTime":3328.75,"audioSegment":0},{"text":"Sample apps: three complete source folders, kept working by Gezel's test suite.","startTime":3328.75,"endTime":3331.875,"audioSegment":0},{"text":"Sharing an app page with app serve: a page outside the desktop app.","startTime":3331.875,"endTime":3335,"audioSegment":0}],"version":1},"startBlock":{"title":"Build a Gezel app: the complete guide","subtitle":"This is the page to read, or to hand to an AI agent, before building a Gezel app. It starts with the working loop and the rules that keep an app working, then gives the four maintained guides: how an app is put together, how its page talks to Gezel, how it looks, and how it is organized. The exact references are linked at the end.","ambientMotion":"zoomIn"}}</script>
