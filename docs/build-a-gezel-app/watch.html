evision++; stop(); }, { once: true });","startTime":1506.6666666666667,"endTime":1509.0555555555557,"audioSegment":0},{"text":"void refresh();","startTime":1509.0555555555557,"endTime":1511.4444444444443,"audioSegment":0},{"text":"Do not treat the watch callback's {path, etag} as the file's contents.","startTime":1511.4444444444443,"endTime":1513.8333333333333,"audioSegment":0},{"text":"Avoid overlapping whole-folder scans and unbounded watchers.","startTime":1513.8333333333333,"endTime":1516.2222222222222,"audioSegment":0},{"text":"The browser fallback interval is configurable;","startTime":1516.2222222222222,"endTime":1518.611111111111,"audioSegment":0},{"text":"embedded watches use the host's shared mechanism.","startTime":1518.611111111111,"endTime":1521,"audioSegment":0},{"text":"Host Files/media Tools File viewer Tables","startTime":1521,"endTime":1523.8846153846155,"audioSegment":0},{"text":"Desktop Output pane (embedded) Scoped access Declared actions data.open() When the query engine and index are available","startTime":1523.8846153846155,"endTime":1526.7692307692307,"audioSegment":0},{"text":"Authenticated mini-site (serve) Scoped access Declared actions Unavailable When the query engine and index are available","startTime":1526.7692307692307,"endTime":1529.6538461538462,"audioSegment":0},{"text":"Capability preview tab (browser) Capability-scoped fallback Unavailable Unavailable Unavailable","startTime":1529.6538461538462,"endTime":1532.5384615384614,"audioSegment":0},{"text":"Published or exported standalone demo (demo) Authored samples In-memory demo handlers Explain the live action Authored sample summaries, if provided","startTime":1532.5384615384614,"endTime":1535.423076923077,"audioSegment":0},{"text":"Phone's embedded snapshot Scoped bridge with bounded media relay Supported portable actions Host-dependent;","startTime":1535.423076923077,"endTime":1538.3076923076924,"audioSegment":0},{"text":"handle unavailable Unavailable in the portable runtime","startTime":1538.3076923076924,"endTime":1541.1923076923076,"audioSegment":0},{"text":"Feature-detect optional additions such as gezel.tables and gezel.data.open, then handle their errors.","startTime":1541.1923076923076,"endTime":1544.076923076923,"audioSegment":0},{"text":"Mode alone is not a promise that every engine or codec is installed.","startTime":1544.076923076923,"endTime":1546.9615384615386,"audioSegment":0},{"text":"Avoid offering an action that cannot work in the current mode.","startTime":1546.9615384615386,"endTime":1549.8461538461538,"audioSegment":0},{"text":"For standalone demos, the website publisher, local preview server,","startTime":1549.8461538461538,"endTime":1552.7307692307693,"audioSegment":0},{"text":"or offline exporter injects a shared bootstrap before app scripts.","startTime":1552.7307692307693,"endTime":1555.6153846153845,"audioSegment":0},{"text":"App source contains its UI and sample handlers,","startTime":1555.6153846153845,"endTime":1558.5,"audioSegment":0},{"text":"not a copied SDK, component runtime, or font set.","startTime":1558.5,"endTime":1561.3846153846155,"audioSegment":0},{"text":"Initialize with const api = window.gezel || window.makeDemoGezel({ page,","startTime":1561.3846153846155,"endTime":1564.2692307692307,"audioSegment":0},{"text":"tools, data, existingPaths });.","startTime":1564.2692307692307,"endTime":1567.1538461538462,"audioSegment":0},{"text":"In a real host the existing API wins; in a demo,","startTime":1567.1538461538462,"endTime":1570.0384615384614,"audioSegment":0},{"text":"the bootstrap installs the sample transport and api.ui.components.","startTime":1570.0384615384614,"endTime":1572.923076923077,"audioSegment":0},{"text":"Import targets come from the manifest's pages.imports.","startTime":1572.923076923077,"endTime":1575.8076923076924,"audioSegment":0},{"text":"Keep deterministic samples, a visible banner and Reset demo.","startTime":1575.8076923076924,"endTime":1578.6923076923076,"audioSegment":0},{"text":"A failed live call must remain a live error,","startTime":1578.6923076923076,"endTime":1581.576923076923,"audioSegment":0},{"text":"not switch into demo mode.","startTime":1581.576923076923,"endTime":1584.4615384615386,"audioSegment":0},{"text":"Pages have no daemon credentials, Node filesystem,","startTime":1584.4615384615386,"endTime":1587.3461538461538,"audioSegment":0},{"text":"unrestricted SQL connection, or arbitrary-path write API.","startTime":1587.3461538461538,"endTime":1590.2307692307693,"audioSegment":0},{"text":"Imports are a narrow exception for explicitly declared destinations.","startTime":1590.2307692307693,"endTime":1593.1153846153845,"audioSegment":0},{"text":"Stay on this shared surface.","startTime":1593.1153846153845,"endTime":1596,"audioSegment":0},{"text":"Read gezel.ui.layout at boot and subscribe with gezel.ui.onLayout(callback).","startTime":1596,"endTime":1598.5333333333333,"audioSegment":0},{"text":"The snapshot contains fullscreen, width, and height in CSS pixels.","startTime":1598.5333333333333,"endTime":1601.0666666666666,"audioSegment":0},{"text":"In the Output pane,","startTime":1601.0666666666666,"endTime":1603.6,"audioSegment":0},{"text":"fullscreen means the page is maximized inside the Gezel window's main workspace.","startTime":1603.6,"endTime":1606.1333333333334,"audioSegment":0},{"text":"The project sidebar stays available on its configured side,","startTime":1606.1333333333334,"endTime":1608.6666666666667,"audioSegment":0},{"text":"expanded or collapsed as the user left it.","startTime":1608.6666666666667,"endTime":1611.2,"audioSegment":0},{"text":"Each project remembers whether its page is closed, open,","startTime":1611.2,"endTime":1613.7333333333333,"audioSegment":0},{"text":"or fullscreen when revisited, including after a restart.","startTime":1613.7333333333333,"endTime":1616.2666666666667,"audioSegment":0},{"text":"It does not mean that the operating system window is maximized.","startTime":1616.2666666666667,"endTime":1618.8,"audioSegment":0},{"text":"The same page stays mounted across maximize/restore; game state and drafts survive.","startTime":1618.8,"endTime":1621.3333333333333,"audioSegment":0},{"text":"The initial fullscreen value is false until the host handshake arrives.","startTime":1621.3333333333333,"endTime":1623.8666666666666,"audioSegment":0},{"text":"Browser, serve, and demo pages follow the browser Fullscreen API instead.","startTime":1623.8666666666666,"endTime":1626.4,"audioSegment":0},{"text":"The root also receives data-gezel-fullscreen=\"true\" or \"false\" for CSS.","startTime":1626.4,"endTime":1628.9333333333334,"audioSegment":0},{"text":"Mount native chat with gezel.ui.components.chat(element, options).","startTime":1628.9333333333334,"endTime":1631.4666666666667,"audioSegment":0},{"text":"Give the mount an explicit height.","startTime":1631.4666666666667,"endTime":1634,"audioSegment":0},{"text":"The handle has element, update(partialOptions), destroy(),","startTime":1634,"endTime":1636.5333333333333,"audioSegment":0},{"text":"and ready (a promise that rejects when the host cannot mount it).","startTime":1636.5333333333333,"endTime":1639.0666666666666,"audioSegment":0},{"text":"Keep the mount in the document and hide it with CSS to preserve its current conversation.","startTime":1639.0666666666666,"endTime":1641.6,"audioSegment":0},{"text":"Destroy it when permanently discarding it.","startTime":1641.6,"endTime":1644.1333333333334,"audioSegment":0},{"text":"const chat = gezel.ui.components.chat('#game-chat', {","startTime":1644.1333333333334,"endTime":1646.6666666666667,"audioSegment":0},{"text":"gezelRole: 'Opponent', // resolve a role from this project's crew","startTime":1646.6666666666667,"endTime":1649.2,"audioSegment":0},{"text":"lockRecipient: true,","startTime":1649.2,"endTime":1651.7333333333333,"audioSegment":0},{"text":"showAddress: false,","startTime":1651.7333333333333,"endTime":1654.2666666666667,"audioSegment":0},{"text":"showThreads: false,","startTime":1654.2666666666667,"endTime":1656.8,"audioSegment":0},{"text":"placeholder: 'Ask about a move…', });","startTime":1656.8,"endTime":1659.3333333333333,"audioSegment":0},{"text":"const arrange = ({ fullscreen, width }) => {","startTime":1659.3333333333333,"endTime":1661.8666666666666,"audioSegment":0},{"text":"document.querySelector('#game').classList.toggle('with-chat', fullscreen && width >= 800); };","startTime":1661.8666666666666,"endTime":1664.4,"audioSegment":0},{"text":"arrange(gezel.ui.layout);","startTime":1664.4,"endTime":1666.9333333333334,"audioSegment":0},{"text":"const stopLayout = gezel.ui.onLayout(arrange);","startTime":1666.9333333333334,"endTime":1669.4666666666667,"audioSegment":0},{"text":"window.addEventListener('pagehide', () => { stopLayout(); chat.destroy(); });","startTime":1669.4666666666667,"endTime":1672,"audioSegment":0},{"text":"#game { display: grid; min-height: 0; }","startTime":1672,"endTime":1674.5333333333333,"audioSegment":0},{"text":"#game-chat { display: none; height: 70vh; min-width: 0; }","startTime":1674.5333333333333,"endTime":1677.0666666666666,"audioSegment":0},{"text":"#game.with-chat { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 16px; }","startTime":1677.0666666666666,"endTime":1679.6,"audioSegment":0},{"text":"#game.with-chat #game-chat { display: block; }","startTime":1679.6,"endTime":1682.1333333333332,"audioSegment":0},{"text":"Use gezelId for an exact crew member, gezelRole for a role,","startTime":1682.1333333333332,"endTime":1684.6666666666667,"audioSegment":0},{"text":"or omit both to use the project's crew lead (then its first member).","startTime":1684.6666666666667,"endTime":1687.2,"audioSegment":0},{"text":"An unavailable requested recipient displays an error rather than silently choosing someone else.","startTime":1687.2,"endTime":1689.7333333333333,"audioSegment":0},{"text":"lockRecipient defaults to true and disables recipient switching and mention fan-out.","startTime":1689.7333333333333,"endTime":1692.2666666666667,"audioSegment":0},{"text":"showAddress and showThreads default to true.","startTime":1692.2666666666667,"endTime":1694.8,"audioSegment":0},{"text":"variant: 'composer' omits the timeline;","startTime":1694.8,"endTime":1697.3333333333333,"audioSegment":0},{"text":"the default 'chat' shows that recipient's project history.","startTime":1697.3333333333333,"endTime":1699.8666666666666,"audioSegment":0},{"text":"attachments, dictation, promptAssist, and expand default to false and can be enabled individually,","startTime":1699.8666666666666,"endTime":1702.4,"audioSegment":0},{"text":"subject to the host's capabilities.","startTime":1702.4,"endTime":1704.9333333333334,"audioSegment":0},{"text":"Chat currently requires the embedded Gezel host.","startTime":1704.9333333333334,"endTime":1707.4666666666667,"audioSegment":0},{"text":"Browser previews, app-serve visitors,","startTime":1707.4666666666667,"endTime":1710,"audioSegment":0},{"text":"and standalone demos show an explicit unavailable message; demos never call a model.","startTime":1710,"endTime":1712.5333333333333,"audioSegment":0},{"text":"The parent owns the native chat and composer, including their theme,","startTime":1712.5333333333333,"endTime":1715.0666666666666,"audioSegment":0},{"text":"accessibility, sessions, and ordinary permission prompts.","startTime":1715.0666666666666,"endTime":1717.6,"audioSegment":0},{"text":"Page scripts receive no transcript, input text, credentials, or programmatic send method.","startTime":1717.6,"endTime":1720.1333333333332,"audioSegment":0},{"text":"Options change presentation, not the recipient's tool authority.","startTime":1720.1333333333332,"endTime":1722.6666666666667,"audioSegment":0},{"text":"The slot follows layout, scrolling, and hidden containers.","startTime":1722.6666666666667,"endTime":1725.2,"audioSegment":0},{"text":"Keep it rectangular and untransformed;","startTime":1725.2,"endTime":1727.7333333333333,"audioSegment":0},{"text":"the host clips it to the page viewport.","startTime":1727.7333333333333,"endTime":1730.2666666666667,"audioSegment":0},{"text":"Page CSS cannot restyle chat internals,","startTime":1730.2666666666667,"endTime":1732.8,"audioSegment":0},{"text":"and page popovers cannot cover native chat.","startTime":1732.8,"endTime":1735.3333333333333,"audioSegment":0},{"text":"A modal page dialog (dialog.showModal(), aria-modal=\"true\", or a component dialog) dims the chat instead: the host draws the dialog's backdrop color over it,","startTime":1735.3333333333333,"endTime":1737.8666666666668,"audioSegment":0},{"text":"leaves the dialog's own area uncovered, and lets clicks reach the page until the dialog closes.","startTime":1737.8666666666668,"endTime":1740.4,"audioSegment":0},{"text":"At most four slots can be mounted per page.","startTime":1740.4,"endTime":1742.9333333333334,"audioSegment":0},{"text":"Removing a slot from the document destroys it;","startTime":1742.9333333333334,"endTime":1745.4666666666667,"audioSegment":0},{"text":"create a new handle if you need to mount it again.","startTime":1745.4666666666667,"endTime":1748,"audioSegment":0},{"text":"gezel.ui.components.appLayout(main, options) wraps an existing content element without replacing its DOM.","startTime":1748,"endTime":1750.6285714285714,"audioSegment":0},{"text":"In fullscreen it opens a companion beside the content;","startTime":1750.6285714285714,"endTime":1753.2571428571428,"audioSegment":0},{"text":"below 900 CSS pixels the conversation stacks beneath it.","startTime":1753.2571428571428,"endTime":1755.8857142857144,"audioSegment":0},{"text":"Restoring the pane, hiding the conversation,","startTime":1755.8857142857144,"endTime":1758.5142857142857,"audioSegment":0},{"text":"or opening a native page dialog retains the conversation and its draft.","startTime":1758.5142857142857,"endTime":1761.142857142857,"audioSegment":0},{"text":"While a page dialog is open the conversation stays on screen,","startTime":1761.142857142857,"endTime":1763.7714285714285,"audioSegment":0},{"text":"dimmed with the rest of the page, since iframe content cannot cover host-owned chat.","startTime":1763.7714285714285,"endTime":1766.4,"audioSegment":0},{"text":"const workspace = gezel.ui.components.appLayout('main', {","startTime":1766.4,"endTime":1769.0285714285715,"audioSegment":0},{"text":"title: 'Practice with your tutor',","startTime":1769.0285714285715,"endTime":1771.6571428571428,"audioSegment":0},{"text":"description: 'Choose a scene, then talk here.',","startTime":1771.6571428571428,"endTime":1774.2857142857142,"audioSegment":0},{"text":"chat: { showAddress: false, lockRecipient: true, dictation: true }, });","startTime":1774.2857142857142,"endTime":1776.9142857142858,"audioSegment":0},{"text":"chat: false gives a file-only application room to expand without recruiting a companion.","startTime":1776.9142857142858,"endTime":1779.5428571428572,"audioSegment":0},{"text":"Multi-person crews can use lockRecipient: false, showAddress: true.","startTime":1779.5428571428572,"endTime":1782.1714285714286,"audioSegment":0},{"text":"The page still owns its content, typography choices, and domain layout.","startTime":1782.1714285714286,"endTime":1784.8,"audioSegment":0},{"text":"Feature detect appLayout when supporting older hosts.","startTime":1784.8,"endTime":1787.4285714285713,"audioSegment":0},{"text":"Retain the handle and call destroy() if discarding the workspace;","startTime":1787.4285714285713,"endTime":1790.057142857143,"audioSegment":0},{"text":"it also cleans up on pagehide.","startTime":1790.057142857143,"endTime":1792.6857142857143,"audioSegment":0},{"text":"Use actionForm for a compact,","startTime":1792.6857142857143,"endTime":1795.3142857142857,"audioSegment":0},{"text":"accessible form that invokes one declared page tool.","startTime":1795.3142857142857,"endTime":1797.942857142857,"audioSegment":0},{"text":"It validates required fields, numbers and dates;","startTime":1797.942857142857,"endTime":1800.5714285714287,"audioSegment":0},{"text":"serializes one save at a time; and retains entered values after a failure.","startTime":1800.5714285714287,"endTime":1803.2,"audioSegment":0},{"text":"Fields can be text, number, date, URL, multiline text, or a selection.","startTime":1803.2,"endTime":1805.8285714285714,"audioSegment":0},{"text":"mapInput can map a simple form into the tool's input schema.","startTime":1805.8285714285714,"endTime":1808.4571428571428,"audioSegment":0},{"text":"It does not change the page's authority.","startTime":1808.4571428571428,"endTime":1811.0857142857144,"audioSegment":0},{"text":"const form = gezel.ui.components.actionForm('#add-guest', {","startTime":1811.0857142857144,"endTime":1813.7142857142858,"audioSegment":0},{"text":"title: 'Add a guest', tool: 'page_add_guest', fields: [","startTime":1813.7142857142858,"endTime":1816.3428571428572,"audioSegment":0},{"text":"{ name: 'name', label: 'Guest or household', required: true },","startTime":1816.3428571428572,"endTime":1818.9714285714285,"audioSegment":0},{"text":"{ name: 'party', label: 'Party size',","startTime":1818.9714285714285,"endTime":1821.6,"audioSegment":0},{"text":"type: 'number', min: 1, step: 1, required: true }, ],","startTime":1821.6,"endTime":1824.2285714285715,"audioSegment":0},{"text":"onSaved: () => refreshGuests(), });","startTime":1824.2285714285715,"endTime":1826.857142857143,"audioSegment":0},{"text":"On a current host, draw actions as keys that open dialogs,","startTime":1826.857142857143,"endTime":1829.4857142857143,"audioSegment":0},{"text":"following the app UX guide.","startTime":1829.4857142857143,"endTime":1832.1142857142856,"audioSegment":0},{"text":"A row's own key can open the same dialog filled in for that record:","startTime":1832.1142857142856,"endTime":1834.7428571428572,"audioSegment":0},{"text":"const components = gezel.ui.components;","startTime":1834.7428571428572,"endTime":1837.3714285714286,"audioSegment":0},{"text":"const modern = components.version >= 2;","startTime":1837.3714285714286,"endTime":1840,"audioSegment":0},{"text":"const addGuest = components.actionForm('#guest-actions', {","startTime":1840,"endTime":1842.6285714285714,"audioSegment":0},{"text":"title: 'Add a guest', tool: 'page_add_guest', presentation: 'dialog', primary: true,","startTime":1842.6285714285714,"endTime":1845.2571428571428,"audioSegment":0},{"text":"submitLabel: 'Add guest', fields: [","startTime":1845.2571428571428,"endTime":1847.8857142857144,"audioSegment":0},{"text":"{ name: 'name', label: 'Guest or household', required: true },","startTime":1847.8857142857144,"endTime":1850.5142857142857,"audioSegment":0},{"text":"{ name: 'party', label: 'Party size',","startTime":1850.5142857142857,"endTime":1853.142857142857,"audioSegment":0},{"text":"type: 'number', min: 1, step: 1, required: true }, ],","startTime":1853.142857142857,"endTime":1855.7714285714285,"audioSegment":0},{"text":"onSaved: () => refreshGuests(), });","startTime":1855.7714285714285,"endTime":1858.4,"audioSegment":0},{"text":"function editParty(guest) {","startTime":1858.4,"endTime":1861.0285714285715,"audioSegment":0},{"text":"if (modern) addGuest.open({ name: guest.name, party: guest.party }); }","startTime":1861.0285714285715,"endTime":1863.6571428571428,"audioSegment":0},{"text":"presentation: 'inline' draws an always-open form for a settings panel;","startTime":1863.6571428571428,"endTime":1866.2857142857142,"audioSegment":0},{"text":"call reset(values) with the saved values after each read so it shows what is set now.","startTime":1866.2857142857142,"endTime":1868.9142857142856,"audioSegment":0},{"text":"Older hosts ignore presentation and draw a disclosure,","startTime":1868.9142857142856,"endTime":1871.5428571428572,"audioSegment":0},{"text":"so keep the action reachable there and feature-detect open.","startTime":1871.5428571428572,"endTime":1874.1714285714286,"audioSegment":0},{"text":"tabs organizes a workspace into page-owned panels.","startTime":1874.1714285714286,"endTime":1876.8,"audioSegment":0},{"text":"Put the summary tiles and main view on Home,","startTime":1876.8,"endTime":1879.4285714285713,"audioSegment":0},{"text":"one noun per tab, and Settings last:","startTime":1879.4285714285713,"endTime":1882.057142857143,"audioSegment":0},{"text":"const tabs = gezel.ui.components.tabs('#tabs', {","startTime":1882.057142857143,"endTime":1884.6857142857143,"audioSegment":0},{"text":"label: 'Guest list', tabs: [","startTime":1884.6857142857143,"endTime":1887.3142857142857,"audioSegment":0},{"text":"{ id: 'home', label: 'Home', panel: '#home' },","startTime":1887.3142857142857,"endTime":1889.942857142857,"audioSegment":0},{"text":"{ id: 'guests', label: 'Guests', panel: '#guests', badge: awaitingReply },","startTime":1889.942857142857,"endTime":1892.5714285714287,"audioSegment":0},{"text":"{ id: 'settings', label: 'Settings', panel: '#settings' }, ], });","startTime":1892.5714285714287,"endTime":1895.2,"audioSegment":0},{"text":"The component only labels, shows,","startTime":1895.2,"endTime":1897.8285714285714,"audioSegment":0},{"text":"and hides the panels; the page owns their content.","startTime":1897.8285714285714,"endTime":1900.4571428571428,"audioSegment":0},{"text":"tabs.update({ tabs }) with new badges keeps keyboard focus.","startTime":1900.4571428571428,"endTime":1903.0857142857144,"audioSegment":0},{"text":"Destroy the handle with the view.","startTime":1903.0857142857144,"endTime":1905.7142857142858,"audioSegment":0},{"text":"Give the page its own alias when a model already uses the action: page_add_guest and add_guest share the same script and bindings,","startTime":1905.7142857142858,"endTime":1908.3428571428572,"audioSegment":0},{"text":"while only the former appears in pages.tools.","startTime":1908.3428571428572,"endTime":1910.9714285714285,"audioSegment":0},{"text":"Workspace policy, tool schema validation, and script permissions still apply.","startTime":1910.9714285714285,"endTime":1913.6,"audioSegment":0},{"text":"Forms do not write files directly.","startTime":1913.6,"endTime":1916.2285714285715,"audioSegment":0},{"text":"Standalone demos provide in-memory handlers for the same aliases.","startTime":1916.2285714285715,"endTime":1918.857142857143,"audioSegment":0},{"text":"collectionFilter('#search', { container: '#guests', selector: 'li:not(.empty)', label: 'Find a guest', placeholder: 'Name or household',","startTime":1918.857142857143,"endTime":1921.4857142857143,"audioSegment":0},{"text":"minItems: 8 }) adds accent-insensitive search over rendered records, shown once the list reaches minItems.","startTime":1921.4857142857143,"endTime":1924.1142857142856,"audioSegment":0},{"text":"It updates when the collection changes and preserves existing buttons and controls.","startTime":1924.1142857142856,"endTime":1926.7428571428572,"audioSegment":0},{"text":"It searches only those rendered items; describe pagination or truncation honestly.","startTime":1926.7428571428572,"endTime":1929.3714285714286,"audioSegment":0},{"text":"Keep the handle and destroy it with the view.","startTime":1929.3714285714286,"endTime":1932,"audioSegment":0},{"text":"The host injects gezel.ui.components with the page API.","startTime":1932,"endTime":1934.7166666666667,"audioSegment":0},{"text":"It works with ordinary HTML and has no React dependency.","startTime":1934.7166666666667,"endTime":1937.4333333333334,"audioSegment":0},{"text":"Pass a selector or an element;","startTime":1937.4333333333334,"endTime":1940.15,"audioSegment":0},{"text":"the component appends its own custom element with a shadow root.","startTime":1940.15,"endTime":1942.8666666666666,"audioSegment":0},{"text":"Retain its handle and call destroy() before discarding it.","startTime":1942.8666666666666,"endTime":1945.5833333333333,"audioSegment":0},{"text":"update(partialOptions) updates an existing instance.","startTime":1945.5833333333333,"endTime":1948.3,"audioSegment":0},{"text":"File adder handles also provide refresh() to recheck destination availability after a settings change.","startTime":1948.3,"endTime":1951.0166666666667,"audioSegment":0},{"text":"<div id=\"add-files\"></div>","startTime":1951.0166666666667,"endTime":1953.7333333333333,"audioSegment":0},{"text":"<div id=\"selected-file\"></div>","startTime":1953.7333333333333,"endTime":1956.45,"audioSegment":0},{"text":"const card = gezel.ui.components.fileCard('#selected-file', {","startTime":1956.45,"endTime":1959.1666666666667,"audioSegment":0},{"text":"file: { source: 'workspace', path: 'media/garden.jpg', size: 24576 },","startTime":1959.1666666666667,"endTime":1961.8833333333334,"audioSegment":0},{"text":"variant: 'tile', // 'row' for a compact list });","startTime":1961.8833333333334,"endTime":1964.6,"audioSegment":0},{"text":"const adder = gezel.ui.components.fileAdder('#add-files', {","startTime":1964.6,"endTime":1967.3166666666666,"audioSegment":0},{"text":"target: 'library',","startTime":1967.3166666666666,"endTime":1970.0333333333333,"audioSegment":0},{"text":"onAdded: async (savedFiles) => { await refreshListing(); }, });","startTime":1970.0333333333333,"endTime":1972.75,"audioSegment":0},{"text":"window.addEventListener('pagehide', () => { card.destroy(); adder.destroy(); });","startTime":1972.75,"endTime":1975.4666666666667,"audioSegment":0},{"text":"By default a card calls data.open and displays an error if the host viewer is unavailable.","startTime":1975.4666666666667,"endTime":1978.1833333333334,"audioSegment":0},{"text":"A gallery can supply onActivate(file) to show its own media preview;","startTime":1978.1833333333334,"endTime":1980.9,"audioSegment":0},{"text":"do not replace Gezel's spreadsheet/document renditions.","startTime":1980.9,"endTime":1983.6166666666666,"audioSegment":0},{"text":"thumbnail: false disables automatic image thumbnails;","startTime":1983.6166666666666,"endTime":1986.3333333333333,"audioSegment":0},{"text":"an explicit URL selects a local demo illustration.","startTime":1986.3333333333333,"endTime":1989.05,"audioSegment":0},{"text":"Filenames render as text.","startTime":1989.05,"endTime":1991.7666666666667,"audioSegment":0},{"text":"Components inherit --font-ui and track ui.onTheme; see the style guide.","startTime":1991.7666666666667,"endTime":1994.4833333333333,"audioSegment":0},{"text":"Declare destinations in the project type, separately from readable files: { \"pages\": {","startTime":1994.4833333333333,"endTime":1997.2,"audioSegment":0},{"text":"\"entry\": \"index.html\", \"api\": 1,","startTime":1997.2,"endTime":1999.9166666666667,"audioSegment":0},{"text":"\"reads\": [{ \"source\": \"workspace\", \"path\": \"media\", \"subtree\": true }], \"imports\": [{","startTime":1999.9166666666667,"endTime":2002.6333333333334,"audioSegment":0},{"text":"\"id\": \"library\", \"source\": \"workspace\", \"path\": \"media\",","startTime":2002.6333333333334,"endTime":2005.35,"audioSegment":0},{"text":"\"accept\": [\".jpg\", \".png\", \".mp4\"], \"maxFileBytes\": 268435456 }] } }","startTime":2005.35,"endTime":2008.0666666666666,"audioSegment":0},{"text":"Imports support workspace destinations only.","startTime":2008.0666666666666,"endTime":2010.7833333333333,"audioSegment":0},{"text":"path: \".\" means the project's selected folder.","startTime":2010.7833333333333,"endTime":2013.5,"audioSegment":0},{"text":"accept is an optional extension allowlist;","startTime":2013.5,"endTime":2016.2166666666667,"audioSegment":0},{"text":"the host enforces it and the byte limit independently of picker hints.","startTime":2016.2166666666667,"endTime":2018.9333333333334,"audioSegment":0},{"text":"An import declaration does not grant read access or override managed workspace writes. In particular,","startTime":2018.9333333333334,"endTime":2021.65,"audioSegment":0},{"text":"an external folder still needs the user's existing write opt-in in Project Settings.","startTime":2021.65,"endTime":2024.3666666666668,"audioSegment":0},{"text":"There is no page-facing bypass or permission toggle.","startTime":2024.3666666666668,"endTime":2027.0833333333333,"audioSegment":0},{"text":"Use the adder for the usual flow.","startTime":2027.0833333333333,"endTime":2029.8,"audioSegment":0},{"text":"A custom UI can call data.importFiles(File[], { target, signal, onProgress }); each result is { ok: true,","startTime":2029.8,"endTime":2032.5166666666667,"audioSegment":0},{"text":"name, file: { source, path, name, size, mtime } } or { ok: false, name, error }.","startTime":2032.5166666666667,"endTime":2035.2333333333333,"audioSegment":0},{"text":"onProgress reports { completed, total, name } per file, not bytes.","startTime":2035.2333333333333,"endTime":2037.95,"audioSegment":0},{"text":"Save the returned paths: duplicates become name (1).ext,","startTime":2037.95,"endTime":2040.6666666666667,"audioSegment":0},{"text":"and existing files are never overwritten.","startTime":2040.6666666666667,"endTime":2043.3833333333334,"audioSegment":0},{"text":"Originals stay where the user selected them.","startTime":2043.3833333333334,"endTime":2046.1,"audioSegment":0},{"text":"Cancel stops pending work and does not undo files already saved.","startTime":2046.1,"endTime":2048.8166666666666,"audioSegment":0},{"text":"A file that finished committing as cancellation arrived may already exist;","startTime":2048.8166666666666,"endTime":2051.5333333333333,"audioSegment":0},{"text":"refresh the listing to reconcile.","startTime":2051.5333333333333,"endTime":2054.25,"audioSegment":0},{"text":"The current limits are 100 files per batch, 256 MiB per file (a target may lower it), two active uploads per project,","startTime":2054.25,"endTime":2056.9666666666667,"audioSegment":0},{"text":"four per daemon, 120 attempts per project per minute, and a five-minute upload deadline.","startTime":2056.9666666666667,"endTime":2059.6833333333334,"audioSegment":0},{"text":"The server streams bytes to private temporary storage, validates scopes and paths,","startTime":2059.6833333333334,"endTime":2062.4,"audioSegment":0},{"text":"rechecks the destination and write policy at commit, and publishes atomically through the Store.","startTime":2062.4,"endTime":2065.116666666667,"audioSegment":0},{"text":"It rejects traversal, symlink escapes, hidden/reserved names, and alternate streams.","startTime":2065.116666666667,"endTime":2067.8333333333335,"audioSegment":0},{"text":"Imports never accept host source paths from a page.","startTime":2067.8333333333335,"endTime":2070.55,"audioSegment":0},{"text":"Live imports currently require the embedded desktop host.","startTime":2070.55,"endTime":2073.266666666667,"audioSegment":0},{"text":"Browser tabs, phone snapshots and app-serve visitors get an explicit unavailable state;","startTime":2073.266666666667,"endTime":2075.9833333333336,"audioSegment":0},{"text":"a shareable site's read capability never grants uploads.","startTime":2075.9833333333336,"endTime":2078.7,"audioSegment":0},{"text":"Components themselves work across these hosts.","startTime":2078.7,"endTime":2081.4166666666665,"audioSegment":0},{"text":"Always handle unsupported hosts and permission failures without silently enabling demo mode.","startTime":2081.4166666666665,"endTime":2084.133333333333,"audioSegment":0},{"text":"After onAdded, refresh the app's listing.","startTime":2084.133333333333,"endTime":2086.85,"audioSegment":0},{"text":"Ordinary workspace indexing follows asynchronously,","startTime":2086.85,"endTime":2089.5666666666666,"audioSegment":0},{"text":"so a newly added spreadsheet may appear before its DuckDB tables are ready.","startTime":2089.5666666666666,"endTime":2092.2833333333333,"audioSegment":0},{"text":"Keep the indexing/empty state and normal table refresh behavior.","startTime":2092.2833333333333,"endTime":2095,"audioSegment":0},{"text":"The demo host supplies the components and shared fonts before app code.","startTime":2095,"endTime":2097.740740740741,"audioSegment":0},{"text":"Keep the visible banner and Reset demo control. For Gilde,","startTime":2097.740740740741,"endTime":2100.4814814814813,"audioSegment":0},{"text":"use npm run demos or npm run export-page-demo -- <id> --out <new-directory>.","startTime":2100.4814814814813,"endTime":2103.222222222222,"audioSegment":0},{"text":"For private source folders, run gezel app demo .","startTime":2103.222222222222,"endTime":2105.962962962963,"audioSegment":0},{"text":"--out ../my-app-demo and open its generated entry under pages/;","startTime":2105.962962962963,"endTime":2108.703703703704,"audioSegment":0},{"text":"the output works offline without a daemon.","startTime":2108.703703703704,"endTime":2111.4444444444443,"audioSegment":0},{"text":"The website uses shared, content-hashed assets;","startTime":2111.4444444444443,"endTime":2114.185185185185,"audioSegment":0},{"text":"each offline export contains its own generated asset set.","startTime":2114.185185185185,"endTime":2116.925925925926,"audioSegment":0},{"text":"Do not double-click the unprocessed source page or add platform files to its pages/ tree.","startTime":2116.925925925926,"endTime":2119.6666666666665,"audioSegment":0},{"text":"const api = window.gezel || window.makeDemoGezel({","startTime":2119.6666666666665,"endTime":2122.4074074074074,"audioSegment":0},{"text":"page: { typeName: 'My library' },","startTime":2122.4074074074074,"endTime":2125.1481481481483,"audioSegment":0},{"text":"existingPaths: samples.map(file => file.path),","startTime":2125.1481481481483,"endTime":2127.8888888888887,"audioSegment":0},{"text":"// data and tools: app-owned sample handlers, when needed });","startTime":2127.8888888888887,"endTime":2130.6296296296296,"audioSegment":0},{"text":"const components = api.ui.components;","startTime":2130.6296296296296,"endTime":2133.3703703703704,"audioSegment":0},{"text":"// Merge these into your representative sample listing after onAdded:","startTime":2133.3703703703704,"endTime":2136.1111111111113,"audioSegment":0},{"text":"const added = components.demo?.files() ?? [];","startTime":2136.1111111111113,"endTime":2138.8518518518517,"audioSegment":0},{"text":"// In your Reset demo handler,","startTime":2138.8518518518517,"endTime":2141.5925925925926,"audioSegment":0},{"text":"clear imported descriptors and release object URLs:","startTime":2141.5925925925926,"endTime":2144.3333333333335,"audioSegment":0},{"text":"components.demo?.reset();","startTime":2144.3333333333335,"endTime":2147.074074074074,"audioSegment":0},{"text":"Demo imports exercise the same picker, drop, validation, progress and cards.","startTime":2147.074074074074,"endTime":2149.814814814815,"audioSegment":0},{"text":"They retain browser Files/object URLs in this tab,","startTime":2149.814814814815,"endTime":2152.5555555555557,"audioSegment":0},{"text":"use deterministic metadata, and never write to disk or invoke a model.","startTime":2152.5555555555557,"endTime":2155.296296296296,"audioSegment":0},{"text":"data.url resolves imported demo media.","startTime":2155.296296296296,"endTime":2158.037037037037,"audioSegment":0},{"text":"Reset the page's own sample state and remount the adder to clear its result list.","startTime":2158.037037037037,"endTime":2160.777777777778,"audioSegment":0},{"text":"Do not claim imported demo data was indexed: Data Analysis keeps its charts on labeled sample tables.","startTime":2160.777777777778,"endTime":2163.5185185185187,"audioSegment":0},{"text":"React apps can mount either component in a ref inside an effect and call destroy() in cleanup.","startTime":2163.5185185185187,"endTime":2166.259259259259,"audioSegment":0},{"text":"There is no separate React component implementation to keep in sync.","startTime":2166.259259259259,"endTime":2169,"audioSegment":0},{"text":"In a standalone demo,","startTime":2169,"endTime":2171.9117647058824,"audioSegment":0},{"text":"appLayout (or a bare chat slot) draws a sample conversation where Gezel's chat would be.","startTime":2171.9117647058824,"endTime":2174.823529411765,"audioSegment":0},{"text":"A demo opens as the whole window: the layout reports fullscreen: true without the Fullscreen API,","startTime":2174.823529411765,"endTime":2177.735294117647,"audioSegment":0},{"text":"so the companion sits beside the page, or beneath it below 900 CSS pixels.","startTime":2177.735294117647,"endTime":2180.6470588235293,"audioSegment":0},{"text":"Script the conversation and pass it as chat:","startTime":2180.6470588235293,"endTime":2183.5588235294117,"audioSegment":0},{"text":"const api = window.gezel || window.makeDemoGezel({","startTime":2183.5588235294117,"endTime":2186.470588235294,"audioSegment":0},{"text":"page: { typeName: 'Meal Planner' },","startTime":2186.470588235294,"endTime":2189.3823529411766,"audioSegment":0},{"text":"tools: { page_set_menu: input => setDemoMenu(input), grocery_list: () => demoGroceries() },","startTime":2189.3823529411766,"endTime":2192.294117647059,"audioSegment":0},{"text":"data: { 'menu.json': () => demoMenu }, chat: { name: 'Mila',","startTime":2192.294117647059,"endTime":2195.205882352941,"audioSegment":0},{"text":"role: 'Meal Planner',","startTime":2195.205882352941,"endTime":2198.1176470588234,"audioSegment":0},{"text":"greeting: 'Hello, I’m Mila.","startTime":2198.1176470588234,"endTime":2201.029411764706,"audioSegment":0},{"text":"Sunday is still open.',","startTime":2201.029411764706,"endTime":2203.9411764705883,"audioSegment":0},{"text":"suggestions: ['Plan Sunday around what we have'],","startTime":2203.9411764705883,"endTime":2206.8529411764707,"audioSegment":0},{"text":"respond: async (text, ctx) => {","startTime":2206.8529411764707,"endTime":2209.764705882353,"audioSegment":0},{"text":"if (!/sunday|plan/i.test(text)) return null;","startTime":2209.764705882353,"endTime":2212.676470588235,"audioSegment":0},{"text":"await ctx.invoke('set_menu', { day: 'sunday', meal: 'Shakshuka' }, 'Sunday: Shakshuka');","startTime":2212.676470588235,"endTime":2215.5882352941176,"audioSegment":0},{"text":"return 'Sunday is shakshuka.","startTime":2215.5882352941176,"endTime":2218.5,"audioSegment":0},{"text":"Everything it needs is stocked.'; },","startTime":2218.5,"endTime":2221.4117647058824,"audioSegment":0},{"text":"reactions: { page_set_menu: input => `${input.day} is set.` }, }, });","startTime":2221.4117647058824,"endTime":2224.323529411765,"audioSegment":0},{"text":"ctx.read(path) returns a snapshot of the sample data.","startTime":2224.323529411765,"endTime":2227.235294117647,"audioSegment":0},{"text":"ctx.invoke(tool, input, summary) runs the page's demo handler for the model's tool name, falling back to its page_ alias,","startTime":2227.235294117647,"endTime":2230.1470588235293,"audioSegment":0},{"text":"shows the step in the conversation, fires the page's watches and gezel-app-data-changed, and briefly highlights page text that changed.","startTime":2230.1470588235293,"endTime":2233.0588235294117,"audioSegment":0},{"text":"ctx.say(text) adds a line mid-turn,","startTime":2233.0588235294117,"endTime":2235.970588235294,"audioSegment":0},{"text":"and ctx.suggest(list) swaps the suggestions without a reply.","startTime":2235.970588235294,"endTime":2238.8823529411766,"audioSegment":0},{"text":"A read-only tool that changes nothing repaints nothing.","startTime":2238.8823529411766,"endTime":2241.794117647059,"audioSegment":0},{"text":"A reply is a string, an array of strings, or { reply, suggestions };","startTime":2241.794117647059,"endTime":2244.705882352941,"audioSegment":0},{"text":"null gives the shared answer that the preview follows a few sample requests.","startTime":2244.705882352941,"endTime":2247.6176470588234,"audioSegment":0},{"text":"reactions, keyed by page tool, are the demo form of a manifest reaction: the person's page action summons a reply,","startTime":2247.6176470588234,"endTime":2250.529411764706,"audioSegment":0},{"text":"and a game answers with the companion's move through its turn tool.","startTime":2250.529411764706,"endTime":2253.4411764705883,"audioSegment":0},{"text":"The composer labels the replies as scripted,","startTime":2253.4411764705883,"endTime":2256.3529411764707,"audioSegment":0},{"text":"nothing leaves the page, and a live host never runs this code.","startTime":2256.3529411764707,"endTime":2259.264705882353,"audioSegment":0},{"text":"Without a script the conversation greets the visitor and gives the shared answer,","startTime":2259.264705882353,"endTime":2262.176470588235,"audioSegment":0},{"text":"naming the crew lead's role when the exporter supplies it.","startTime":2262.176470588235,"endTime":2265.0882352941176,"audioSegment":0},{"text":"A demo configured with layout: 'pane' keeps the narrow Output-pane presentation.","startTime":2265.0882352941176,"endTime":2268,"audioSegment":0},{"text":"An app page should feel like part of Gezel: readable,","startTime":2268,"endTime":2271.8333333333335,"audioSegment":0},{"text":"warm, and focused on the person's work.","startTime":2271.8333333333335,"endTime":2275.6666666666665,"audioSegment":0},{"text":"This guide applies to the HTML/CSS/JavaScript pages declared by a project type's pages block.","startTime":2275.6666666666665,"endTime":2279.5,"audioSegment":0},{"text":"Start with Building AI Apps inside Gezel for the composition and Using the Gezel page APIs for behavior.","startTime":2279.5,"endTime":2283.3333333333335,"audioSegment":0},{"text":"The app UX guide says how an app is organized: Home and noun tabs,","startTime":2283.3333333333335,"endTime":2287.1666666666665,"audioSegment":0},{"text":"actions as keys that open dialogs, and actions on the records themselves.","startTime":2287.1666666666665,"endTime":2291,"audioSegment":0},{"text":"Gezel injects a shared typography stylesheet into hosted project-type HTML,","startTime":2291,"endTime":2293.5862068965516,"audioSegment":0},{"text":"before the page's own styles.","startTime":2293.5862068965516,"endTime":2296.1724137931033,"audioSegment":0},{"text":"This works in desktop previews, app-serve, and the phone's offline page snapshot.","startTime":2296.1724137931033,"endTime":2298.7586206896553,"audioSegment":0},{"text":"It includes local font faces and these roles:","startTime":2298.7586206896553,"endTime":2301.344827586207,"audioSegment":0},{"text":"Role Default Applied automatically to","startTime":2301.344827586207,"endTime":2303.9310344827586,"audioSegment":0},{"text":"--font-body Hanken Grotesk, with system sans fallbacks The document root;","startTime":2303.9310344827586,"endTime":2306.5172413793102,"audioSegment":0},{"text":"ordinary body text inherits it","startTime":2306.5172413793102,"endTime":2309.103448275862,"audioSegment":0},{"text":"--font-ui Hanken Grotesk, with system sans fallbacks Buttons,","startTime":2309.103448275862,"endTime":2311.689655172414,"audioSegment":0},{"text":"inputs, selects, textareas, options, and option groups","startTime":2311.689655172414,"endTime":2314.2758620689656,"audioSegment":0},{"text":"--font-heading PT Serif, with serif fallbacks h1 through h6","startTime":2314.2758620689656,"endTime":2316.862068965517,"audioSegment":0},{"text":"--font-display The heading family Compatibility alias used by --font-heading","startTime":2316.862068965517,"endTime":2319.448275862069,"audioSegment":0},{"text":"Hanken Grotesk has normal weights 400,","startTime":2319.448275862069,"endTime":2322.0344827586205,"audioSegment":0},{"text":"500, 600, and 700 plus 400 italic.","startTime":2322.0344827586205,"endTime":2324.6206896551726,"audioSegment":0},{"text":"PT Serif has normal 400 and 700 plus 400 italic.","startTime":2324.6206896551726,"endTime":2327.206896551724,"audioSegment":0},{"text":"Use those weights rather than requesting an intermediate serif weight that the browser must synthesize.","startTime":2327.206896551724,"endTime":2329.793103448276,"audioSegment":0},{"text":"Do not copy fonts, licenses, @font-face declarations,","startTime":2329.793103448276,"endTime":2332.3793103448274,"audioSegment":0},{"text":"or a font CDN into each app.","startTime":2332.3793103448274,"endTime":2334.9655172413795,"audioSegment":0},{"text":"Gezel owns the hosted font assets.","startTime":2334.9655172413795,"endTime":2337.551724137931,"audioSegment":0},{"text":"The defaults use low-specificity :where() selectors,","startTime":2337.551724137931,"endTime":2340.137931034483,"audioSegment":0},{"text":"so your authored styles can override them.","startTime":2340.137931034483,"endTime":2342.7241379310344,"audioSegment":0},{"text":"A font: … system-ui shorthand on body also overrides them;","startTime":2342.7241379310344,"endTime":2345.310344827586,"audioSegment":0},{"text":"avoid that accidental reset.","startTime":2345.310344827586,"endTime":2347.896551724138,"audioSegment":0},{"text":"The host supplies typography and an opt-in component kit,","startTime":2347.896551724138,"endTime":2350.4827586206898,"audioSegment":0},{"text":"not a complete CSS framework.","startTime":2350.4827586206898,"endTime":2353.0689655172414,"audioSegment":0},{"text":"It does not inject the shell's color palette, spacing or radius tokens, a CSS reset,","startTime":2353.0689655172414,"endTime":2355.655172413793,"audioSegment":0},{"text":"a body margin reset, a type size scale, general button styling, a chart library, or page layouts.","startTime":2355.655172413793,"endTime":2358.2413793103447,"audioSegment":0},{"text":"Variables such as --bg and classes such as .primary have no built-in meaning inside the page.","startTime":2358.2413793103447,"endTime":2360.8275862068967,"audioSegment":0},{"text":"Define the ones your page uses.","startTime":2360.8275862068967,"endTime":2363.4137931034484,"audioSegment":0},{"text":"Shell CSS does not inherit through the sandboxed iframe.","startTime":2363.4137931034484,"endTime":2366,"audioSegment":0},{"text":"For a full application workspace,","startTime":2366,"endTime":2368.746031746032,"audioSegment":0},{"text":"ui.components.appLayout wraps the existing main content and adds a responsive fullscreen conversation.","startTime":2368.746031746032,"endTime":2371.4920634920636,"audioSegment":0},{"text":"It keeps the page mounted on restore, provides a conversation toggle,","startTime":2371.4920634920636,"endTime":2374.2380952380954,"audioSegment":0},{"text":"and dims its native chat slot with the rest of the page while a page dialog is open.","startTime":2374.2380952380954,"endTime":2376.9841269841268,"audioSegment":0},{"text":"Use a specific companion title and a short description of useful work the person can do together.","startTime":2376.9841269841268,"endTime":2379.7301587301586,"audioSegment":0},{"text":"A file-only app can pass chat: false.","startTime":2379.7301587301586,"endTime":2382.4761904761904,"audioSegment":0},{"text":"Keep the content usable in the ordinary pane as well.","startTime":2382.4761904761904,"endTime":2385.222222222222,"audioSegment":0},{"text":"In a standalone demo the same slot holds the sample conversation, drawn to match Gezel's chat: replies in the heading serif, the visitor's messages in an accent-tinted bubble,","startTime":2385.222222222222,"endTime":2387.968253968254,"audioSegment":0},{"text":"each tool the companion uses as a quiet step row with a check, and suggestions as bare keys under the conversation (one scrolling row on narrow screens).","startTime":2387.968253968254,"endTime":2390.714285714286,"audioSegment":0},{"text":"It lives in the component's shadow root,","startTime":2390.714285714286,"endTime":2393.4603174603176,"audioSegment":0},{"text":"so restyle it only through the --gezel-component-* properties below.","startTime":2393.4603174603176,"endTime":2396.2063492063494,"audioSegment":0},{"text":"Keep its copy in the role's voice: short,","startTime":2396.2063492063494,"endTime":2398.9523809523807,"audioSegment":0},{"text":"specific, American English, no emojis.","startTime":2398.9523809523807,"endTime":2401.6984126984125,"audioSegment":0},{"text":"Use actionForm for declared edits: presentation: 'dialog' for an action key that opens a modal,","startTime":2401.6984126984125,"endTime":2404.4444444444443,"audioSegment":0},{"text":"'inline' for a settings panel.","startTime":2404.4444444444443,"endTime":2407.190476190476,"audioSegment":0},{"text":"Use tabs for a workspace's Home, noun, and Settings panels,","startTime":2407.190476190476,"endTime":2409.936507936508,"audioSegment":0},{"text":"and collectionFilter for search over long lists of rendered records.","startTime":2409.936507936508,"endTime":2412.6825396825398,"audioSegment":0},{"text":"These components supply controls and state handling, while the app owns field labels,","startTime":2412.6825396825398,"endTime":2415.4285714285716,"audioSegment":0},{"text":"domain data, allowed actions, and refresh behavior.","startTime":2415.4285714285716,"endTime":2418.1746031746034,"audioSegment":0},{"text":"Avoid duplicating the host's composer or building a separate persistence store.","startTime":2418.1746031746034,"endTime":2420.9206349206347,"audioSegment":0},{"text":"See workspace components.","startTime":2420.9206349206347,"endTime":2423.6666666666665,"audioSegment":0},{"text":"For a responsive game or other app,","startTime":2423.6666666666665,"endTime":2426.4126984126983,"audioSegment":0},{"text":"use gezel.ui.layout / ui.onLayout and data-gezel-fullscreen to adapt when the Output pane expands.","startTime":2426.4126984126983,"endTime":2429.15873015873,"audioSegment":0},{"text":"Native chat slots use ui.components.chat;","startTime":2429.15873015873,"endTime":2431.904761904762,"audioSegment":0},{"text":"size their containing rectangle in page CSS and choose their controls through options.","startTime":2431.904761904762,"endTime":2434.6507936507937,"audioSegment":0},{"text":"They inherit the shell's theme and fonts, not page CSS overrides.","startTime":2434.6507936507937,"endTime":2437.3968253968255,"audioSegment":0},{"text":"See fullscreen and chat for the layout example and clipping constraints.","startTime":2437.3968253968255,"endTime":2440.1428571428573,"audioSegment":0},{"text":"Prefer gezel.ui.components.fileCard for a file tile/row and fileAdder for uploads.","startTime":2440.1428571428573,"endTime":2442.8888888888887,"audioSegment":0},{"text":"The page API guide covers mounting, lifecycle,","startTime":2442.8888888888887,"endTime":2445.6349206349205,"audioSegment":0},{"text":"permission declarations and standalone demo setup.","startTime":2445.6349206349205,"endTime":2448.3809523809523,"audioSegment":0},{"text":"Both ship their own shadow-root styles, native buttons,","startTime":2448.3809523809523,"endTime":2451.126984126984,"audioSegment":0},{"text":"focus outlines, status messages and light/dark colors.","startTime":2451.126984126984,"endTime":2453.873015873016,"audioSegment":0},{"text":"They inherit the host's --font-ui;","startTime":2453.873015873016,"endTime":2456.6190476190477,"audioSegment":0},{"text":"published and exported demos receive the same fonts.","startTime":2456.6190476190477,"endTime":2459.3650793650795,"audioSegment":0},{"text":"A page's broad button or img rules do not change component internals.","startTime":2459.3650793650795,"endTime":2462.1111111111113,"audioSegment":0},{"text":"Pages own the containing grid/list, spacing and breakpoints.","startTime":2462.1111111111113,"endTime":2464.8571428571427,"audioSegment":0},{"text":"Choose variant: 'tile' or 'row'; use update when changing layouts.","startTime":2464.8571428571427,"endTime":2467.6031746031745,"audioSegment":0},{"text":"Keep filenames as the primary label and preserve keyboard access.","startTime":2467.6031746031745,"endTime":2470.3492063492063,"audioSegment":0},{"text":"The adder states where files go and what was saved,","startTime":2470.3492063492063,"endTime":2473.095238095238,"audioSegment":0},{"text":"so do not hide that destination or status.","startTime":2473.095238095238,"endTime":2475.84126984127,"audioSegment":0},{"text":"Optional CSS custom properties on the mount element are --gezel-component-text, --gezel-component-surface,","startTime":2475.84126984127,"endTime":2478.5873015873017,"audioSegment":0},{"text":"--gezel-component-border, --gezel-component-muted, and --gezel-component-accent.","startTime":2478.5873015873017,"endTime":2481.3333333333335,"audioSegment":0},{"text":"Set both light and dark values if overriding them,","startTime":2481.3333333333335,"endTime":2484.0793650793653,"audioSegment":0},{"text":"and maintain contrast and a visible focus outline.","startTime":2484.0793650793653,"endTime":2486.8253968253966,"audioSegment":0},{"text":"In dark mode the components fill a primary key with deep terracotta (#8c4428) and cream ink,","startTime":2486.8253968253966,"endTime":2489.5714285714284,"audioSegment":0},{"text":"as the shell does, and keep the lighter accent for focus rings; a page's own filled keys should match.","startTime":2489.5714285714284,"endTime":2492.3174603174602,"audioSegment":0},{"text":"No copied fonts, CSS framework,","startTime":2492.3174603174602,"endTime":2495.063492063492,"audioSegment":0},{"text":"external icon service or per-app component fork is needed.","startTime":2495.063492063492,"endTime":2497.809523809524,"audioSegment":0},{"text":"Ordinary workspace/artifact HTML keeps its own styles.","startTime":2497.809523809524,"endTime":2500.5555555555557,"audioSegment":0},{"text":"The demo publisher/exporter supplies the same typography and components.","startTime":2500.5555555555557,"endTime":2503.3015873015875,"audioSegment":0},{"text":"Keep system fallbacks for degraded rendering without bundling a second font set into app source: body {","startTime":2503.3015873015875,"endTime":2506.0476190476193,"audioSegment":0},{"text":"font-family: var(--font-body, system-ui, sans-serif);","startTime":2506.0476190476193,"endTime":2508.7936507936506,"audioSegment":0},{"text":"font-size: 1rem;","startTime":2508.7936507936506,"endTime":2511.5396825396824,"audioSegment":0},{"text":"line-height: 1.5; }","startTime":2511.5396825396824,"endTime":2514.285714285714,"audioSegment":0},{"text":"h1, h2, h3, h4, h5, h6 {","startTime":2514.285714285714,"endTime":2517.031746031746,"audioSegment":0},{"text":"font-family: var(--font-heading, Georgia, serif);","startTime":2517.031746031746,"endTime":2519.777777777778,"audioSegment":0},{"text":"font-weight: 400; }","startTime":2519.777777777778,"endTime":2522.5238095238096,"audioSegment":0},{"text":"button, input, select, textarea {","startTime":2522.5238095238096,"endTime":2525.2698412698414,"audioSegment":0},{"text":"font-family: var(--font-ui, system-ui, sans-serif);","startTime":2525.2698412698414,"endTime":2528.015873015873,"audioSegment":0},{"text":"font-size: inherit; }","startTime":2528.015873015873,"endTime":2530.7619047619046,"audioSegment":0},{"text":"The implementation contract is in the typography roles,","startTime":2530.7619047619046,"endTime":2533.5079365079364,"audioSegment":0},{"text":"the injected defaults, and the font builder.","startTime":2533.5079365079364,"endTime":2536.253968253968,"audioSegment":0},{"text":"Update this guide when that contract changes.","startTime":2536.253968253968,"endTime":2539,"audioSegment":0},{"text":"Use parchment and warm ink in light mode,","startTime":2539,"endTime":2540.490566037736,"audioSegment":0},{"text":"dark neutral surfaces in dark mode, and terracotta for actions.","startTime":2540.490566037736,"endTime":2541.9811320754716,"audioSegment":0},{"text":"Sage is an identity color.","startTime":2541.9811320754716,"endTime":2543.4716981132074,"audioSegment":0},{"text":"Use semantic variables in component rules;","startTime":2543.4716981132074,"endTime":2544.9622641509436,"audioSegment":0},{"text":"retain content colors for photographs, illustrations, charts, and other data.","startTime":2544.9622641509436,"endTime":2546.4528301886794,"audioSegment":0},{"text":"Use both the system preference and the host theme.","startTime":2546.4528301886794,"endTime":2547.943396226415,"audioSegment":0},{"text":"The media query gives the page a correct initial appearance and supports a raw standalone demo.","startTime":2547.943396226415,"endTime":2549.433962264151,"audioSegment":0},{"text":"An explicit host theme should win over the operating system preference.","startTime":2549.433962264151,"endTime":2550.9245283018868,"audioSegment":0},{"text":"This small starter uses the shell's palette values,","startTime":2550.9245283018868,"endTime":2552.4150943396226,"audioSegment":0},{"text":"but these declarations belong to the page; they are not injected: :root {","startTime":2552.4150943396226,"endTime":2553.9056603773583,"audioSegment":0},{"text":"color-scheme: light dark;","startTime":2553.9056603773583,"endTime":2555.396226415094,"audioSegment":0},{"text":"--page-bg: #eae5d6;","startTime":2555.396226415094,"endTime":2556.8867924528304,"audioSegment":0},{"text":"--page-panel: #f3eddf;","startTime":2556.8867924528304,"endTime":2558.377358490566,"audioSegment":0},{"text":"--page-text: #1c1c1c;","startTime":2558.377358490566,"endTime":2559.867924528302,"audioSegment":0},{"text":"--page-muted: #5a4f42;","startTime":2559.867924528302,"endTime":2561.3584905660377,"audioSegment":0},{"text":"--page-border: #8b7e6b;","startTime":2561.3584905660377,"endTime":2562.8490566037735,"audioSegment":0},{"text":"--page-accent: #9a4e30; }","startTime":2562.8490566037735,"endTime":2564.3396226415093,"audioSegment":0},{"text":"@media (prefers-color-scheme: dark) {","startTime":2564.3396226415093,"endTime":2565.830188679245,"audioSegment":0},{"text":":root:not([data-theme=\"light\"]) {","startTime":2565.830188679245,"endTime":2567.3207547169814,"audioSegment":0},{"text":"--page-bg: #141517;","startTime":2567.3207547169814,"endTime":2568.811320754717,"audioSegment":0},{"text":"--page-panel: #1c1d20;","startTime":2568.811320754717,"endTime":2570.301886792453,"audioSegment":0},{"text":"--page-text: #f0f0f0;","startTime":2570.301886792453,"endTime":2571.7924528301887,"audioSegment":0},{"text":"--page-muted: #b9aea0;","startTime":2571.7924528301887,"endTime":2573.2830188679245,"audioSegment":0},{"text":"--page-border: #8b7e6b;","startTime":2573.2830188679245,"endTime":2574.7735849056603,"audioSegment":0},{"text":"--page-accent: #d5a07a; } }","startTime":2574.7735849056603,"endTime":2576.264150943396,"audioSegment":0},{"text":":root[data-theme=\"dark\"] {","startTime":2576.264150943396,"endTime":2577.754716981132,"audioSegment":0},{"text":"color-scheme: dark;","startTime":2577.754716981132,"endTime":2579.245283018868,"audioSegment":0},{"text":"--page-bg: #141517;","startTime":2579.245283018868,"endTime":2580.735849056604,"audioSegment":0},{"text":"--page-panel: #1c1d20;","startTime":2580.735849056604,"endTime":2582.2264150943397,"audioSegment":0},{"text":"--page-text: #f0f0f0;","startTime":2582.2264150943397,"endTime":2583.7169811320755,"audioSegment":0},{"text":"--page-muted: #b9aea0;","startTime":2583.7169811320755,"endTime":2585.2075471698113,"audioSegment":0},{"text":"--page-border: #8b7e6b;","startTime":2585.2075471698113,"endTime":2586.698113207547,"audioSegment":0},{"text":"--page-accent: #d5a07a; }","startTime":2586.698113207547,"endTime":2588.188679245283,"audioSegment":0},{"text":":root[data-theme=\"light\"] { color-scheme: light; }","startTime":2588.188679245283,"endTime":2589.6792452830186,"audioSegment":0},{"text":"* { box-sizing: border-box; }","startTime":2589.6792452830186,"endTime":2591.169811320755,"audioSegment":0},{"text":"[hidden] { display: none !important; }","startTime":2591.169811320755,"endTime":2592.6603773584907,"audioSegment":0},{"text":"body { margin: 0; background: var(--page-bg); color: var(--page-text); }","startTime":2592.6603773584907,"endTime":2594.1509433962265,"audioSegment":0},{"text":"main { max-width: 72rem; margin: auto; padding: clamp(1rem, 3vw, 2.5rem); }","startTime":2594.1509433962265,"endTime":2595.6415094339623,"audioSegment":0},{"text":"button, input, select, textarea {","startTime":2595.6415094339623,"endTime":2597.132075471698,"audioSegment":0},{"text":"min-height: 44px;","startTime":2597.132075471698,"endTime":2598.622641509434,"audioSegment":0},{"text":"padding: .5rem .75rem;","startTime":2598.622641509434,"endTime":2600.1132075471696,"audioSegment":0},{"text":"border: 1px solid var(--page-border);","startTime":2600.1132075471696,"endTime":2601.603773584906,"audioSegment":0},{"text":"border-radius: 6px;","startTime":2601.603773584906,"endTime":2603.0943396226417,"audioSegment":0},{"text":"background: var(--page-panel);","startTime":2603.0943396226417,"endTime":2604.5849056603774,"audioSegment":0},{"text":"color: var(--page-text); }","startTime":2604.5849056603774,"endTime":2606.0754716981132,"audioSegment":0},{"text":":focus-visible { outline: 2px solid var(--page-accent); outline-offset: 3px; }","startTime":2606.0754716981132,"endTime":2607.566037735849,"audioSegment":0},{"text":"a { font-family: var(--font-ui, system-ui, sans-serif); color: var(--page-accent); }","startTime":2607.566037735849,"endTime":2609.056603773585,"audioSegment":0},{"text":"After the real API or shared demo bootstrap has initialized gezel,","startTime":2609.056603773585,"endTime":2610.5471698113206,"audioSegment":0},{"text":"apply and subscribe to its theme:","startTime":2610.5471698113206,"endTime":2612.0377358490564,"audioSegment":0},{"text":"const applyTheme = ({ mode }) => { document.documentElement.dataset.theme = mode; };","startTime":2612.0377358490564,"endTime":2613.5283018867926,"audioSegment":0},{"text":"applyTheme(gezel.ui.theme);","startTime":2613.5283018867926,"endTime":2615.0188679245284,"audioSegment":0},{"text":"const stopTheme = gezel.ui.onTheme(applyTheme);","startTime":2615.0188679245284,"endTime":2616.509433962264,"audioSegment":0},{"text":"window.addEventListener('pagehide', stopTheme, { once: true });","startTime":2616.509433962264,"endTime":2618,"audioSegment":0},{"text":"Put the person's content first.","startTime":2618,"endTime":2620.6666666666665,"audioSegment":0},{"text":"Give the page one clear title, a short explanation when needed,","startTime":2620.6666666666665,"endTime":2623.3333333333335,"audioSegment":0},{"text":"and visible primary actions.","startTime":2623.3333333333335,"endTime":2626,"audioSegment":0},{"text":"Keep project ids, tool names, SQL,","startTime":2626,"endTime":2628.6666666666665,"audioSegment":0},{"text":"and host transport details out of ordinary flows.","startTime":2628.6666666666665,"endTime":2631.3333333333335,"audioSegment":0},{"text":"Use serif for headings and sans for body text, labels, and controls.","startTime":2631.3333333333335,"endTime":2634,"audioSegment":0},{"text":"Start body text around 16px with a comfortable line-height.","startTime":2634,"endTime":2636.6666666666665,"audioSegment":0},{"text":"Keep captions readable and avoid shrinking controls to fit a narrow pane.","startTime":2636.6666666666665,"endTime":2639.3333333333335,"audioSegment":0},{"text":"Use mostly-square controls: 4px for small badges,","startTime":2639.3333333333335,"endTime":2642,"audioSegment":0},{"text":"6px for buttons and inputs, and around 10px for trays and small surfaces.","startTime":2642,"endTime":2644.6666666666665,"audioSegment":0},{"text":"Choice controls are keys in a tray with a clear pressed state.","startTime":2644.6666666666665,"endTime":2647.3333333333335,"audioSegment":0},{"text":"Avoid capsule buttons, emoji navigation, and decorative dashboard clutter.","startTime":2647.3333333333335,"endTime":2650,"audioSegment":0},{"text":"Use native elements: a button for an action, an a for a real destination,","startTime":2650,"endTime":2652.6666666666665,"audioSegment":0},{"text":"labels for inputs, and a real table for tabular data.","startTime":2652.6666666666665,"endTime":2655.3333333333335,"audioSegment":0},{"text":"Give toggles aria-pressed and icon-only controls an accessible name.","startTime":2655.3333333333335,"endTime":2658,"audioSegment":0},{"text":"The embedded page sandbox permits scripts but not native form submissions.","startTime":2658,"endTime":2660.6666666666665,"audioSegment":0},{"text":"Use button type=\"button\" and explicit action handlers;","startTime":2660.6666666666665,"endTime":2663.3333333333335,"audioSegment":0},{"text":"support Enter in single-line inputs without relying on a form's submit event.","startTime":2663.3333333333335,"endTime":2666,"audioSegment":0},{"text":"Invoke declared tools through gezel.tools.invoke.","startTime":2666,"endTime":2668.6666666666665,"audioSegment":0},{"text":"Keep focus visible, support keyboard operation, and restore focus after closing dialogs.","startTime":2668.6666666666665,"endTime":2671.3333333333335,"audioSegment":0},{"text":"Native video/audio controls are a useful baseline.","startTime":2671.3333333333335,"endTime":2674,"audioSegment":0},{"text":"Do not autoplay media.","startTime":2674,"endTime":2676.6666666666665,"audioSegment":0},{"text":"Check contrast in both themes, including helper text and selected states.","startTime":2676.6666666666665,"endTime":2679.3333333333335,"audioSegment":0},{"text":"Communicate errors and chart series with text or shape as well as color.","startTime":2679.3333333333335,"endTime":2682,"audioSegment":0},{"text":"Honor reduced-motion preferences when adding animation.","startTime":2682,"endTime":2684.6666666666665,"audioSegment":0},{"text":"Check a narrow Output pane and a 320px viewport.","startTime":2684.6666666666665,"endTime":2687.3333333333335,"audioSegment":0},{"text":"Wrap filters, allow long filenames to break,","startTime":2687.3333333333335,"endTime":2690,"audioSegment":0},{"text":"and contain necessary table overflow within its region.","startTime":2690,"endTime":2692.6666666666665,"audioSegment":0},{"text":"A page should not force the whole host to scroll sideways.","startTime":2692.6666666666665,"endTime":2695.3333333333335,"audioSegment":0},{"text":"The full product direction remains in Gezel UX;","startTime":2695.3333333333335,"endTime":2698,"audioSegment":0},{"text":"the brand guidelines cover other surfaces.","startTime":2698,"endTime":2700.6666666666665,"audioSegment":0},{"text":"Their shell class names and token declarations are references,","startTime":2700.6666666666665,"endTime":2703.3333333333335,"audioSegment":0},{"text":"not automatically available page APIs.","startTime":2703.3333333333335,"endTime":2706,"audioSegment":0},{"text":"Show distinct loading, empty, permission-denied, unavailable, partial-result, and failed-action states.","startTime":2706,"endTime":2709.176470588235,"audioSegment":0},{"text":"Keep useful content visible when an optional capability fails;","startTime":2709.176470588235,"endTime":2712.3529411764707,"audioSegment":0},{"text":"a data dashboard can still list files without DuckDB, and a gallery can still list a file whose codec cannot play.","startTime":2712.3529411764707,"endTime":2715.529411764706,"audioSegment":0},{"text":"Tell the person when a listing or query is truncated,","startTime":2715.529411764706,"endTime":2718.705882352941,"audioSegment":0},{"text":"or when a chart describes an indexed snapshot rather than the latest file bytes.","startTime":2718.705882352941,"endTime":2721.8823529411766,"audioSegment":0},{"text":"Use textContent for filenames and data labels.","startTime":2721.8823529411766,"endTime":2725.0588235294117,"audioSegment":0},{"text":"Read files through gezel.data, use data.url() for media,","startTime":2725.0588235294117,"endTime":2728.235294117647,"audioSegment":0},{"text":"and use declared tools for writes.","startTime":2728.235294117647,"endTime":2731.4117647058824,"audioSegment":0},{"text":"Debounce refreshes, limit rendered cards, unsubscribe watches, stop players on close,","startTime":2731.4117647058824,"endTime":2734.5882352941176,"audioSegment":0},{"text":"and ignore stale asynchronous results after a selection changes.","startTime":2734.5882352941176,"endTime":2737.764705882353,"audioSegment":0},{"text":"Standalone samples must be clearly labeled and deterministic.","startTime":2737.764705882353,"endTime":2740.9411764705883,"audioSegment":0},{"text":"Keep their mutations in memory and provide Reset demo.","startTime":2740.9411764705883,"endTime":2744.1176470588234,"audioSegment":0},{"text":"Never substitute sample data after a live permission or query failure.","startTime":2744.1176470588234,"endTime":2747.294117647059,"audioSegment":0},{"text":"The page API guide describes the host modes and the shared demo bootstrap.","startTime":2747.294117647059,"endTime":2750.470588235294,"audioSegment":0},{"text":"Before delivery, inspect light and dark mode, keyboard focus, long labels,","startTime":2750.470588235294,"endTime":2753.6470588235293,"audioSegment":0},{"text":"an empty folder, a failed operation, narrow layouts, and the real host flow.","startTime":2753.6470588235293,"endTime":2756.823529411765,"audioSegment":0},{"text":"Structural validation cannot establish that a page is usable.","startTime":2756.823529411765,"endTime":2760,"audioSegment":0},{"text":"This guide says how an app page is organized and how people act in it.","startTime":2760,"endTime":2763.1,"audioSegment":0},{"text":"The page style guide covers what Gezel supplies to a page and how it looks: fonts,","startTime":2763.1,"endTime":2766.2,"audioSegment":0},{"text":"color, controls, and states.","startTime":2766.2,"endTime":2769.3,"audioSegment":0},{"text":"Using the Gezel page APIs covers the components named here.","startTime":2769.3,"endTime":2772.4,"audioSegment":0},{"text":"It is a living standard.","startTime":2772.4,"endTime":2775.5,"audioSegment":0},{"text":"Each practice has a number,","startTime":2775.5,"endTime":2778.6,"audioSegment":0},{"text":"so a review can cite it (\"B3: this form picks a record that is already on screen\").","startTime":2778.6,"endTime":2781.7,"audioSegment":0},{"text":"The open questions at the end record what is not settled.","startTime":2781.7,"endTime":2784.8,"audioSegment":0},{"text":"When a pass over the apps teaches something new,","startTime":2784.8,"endTime":2787.9,"audioSegment":0},{"text":"change the practice and add a line to the change list.","startTime":2787.9,"endTime":2791,"audioSegment":0},{"text":"Most apps fall into one of five shapes.","startTime":2791,"endTime":2793.6923076923076,"audioSegment":0},{"text":"Pick the shape first; it decides the structure.","startTime":2793.6923076923076,"endTime":2796.3846153846152,"audioSegment":0},{"text":"Shape Examples Structure","startTime":2796.3846153846152,"endTime":2799.076923076923,"audioSegment":0},{"text":"Workspace Shift Roster, Sales Pipeline, Event Desk Home,","startTime":2799.076923076923,"endTime":2801.769230769231,"audioSegment":0},{"text":"then one tab per noun the person manages, then Settings when there is something to set","startTime":2801.769230769231,"endTime":2804.4615384615386,"audioSegment":0},{"text":"Single list Household Manual,","startTime":2804.4615384615386,"endTime":2807.153846153846,"audioSegment":0},{"text":"Life Binder One view with a key bar under the title and actions on each row","startTime":2807.153846153846,"endTime":2809.846153846154,"audioSegment":0},{"text":"Board Checkers, Chess, Word Clues The board is the page.","startTime":2809.846153846154,"endTime":2812.5384615384614,"audioSegment":0},{"text":"New game opens a dialog","startTime":2812.5384615384614,"endTime":2815.230769230769,"audioSegment":0},{"text":"Practice Flashcards, Language Trainer Home is today's practice,","startTime":2815.230769230769,"endTime":2817.923076923077,"audioSegment":0},{"text":"with tabs for what you collect and for progress","startTime":2817.923076923077,"endTime":2820.6153846153848,"audioSegment":0},{"text":"Collection Media Library, Design Scheme The gallery is the page,","startTime":2820.6153846153848,"endTime":2823.3076923076924,"audioSegment":0},{"text":"with filter keys, an Add key, and a preview dialog per item","startTime":2823.3076923076924,"endTime":2826,"audioSegment":0},{"text":"A1.","startTime":2826,"endTime":2829.032258064516,"audioSegment":0},{"text":"One title and one summary line.","startTime":2829.032258064516,"endTime":2832.064516129032,"audioSegment":0},{"text":"The h1 names the person's subject when there is one (\"Trip: Lisbon\",","startTime":2832.064516129032,"endTime":2835.0967741935483,"audioSegment":0},{"text":"\"The Glass Cartographer\"), otherwise the app.","startTime":2835.0967741935483,"endTime":2838.1290322580644,"audioSegment":0},{"text":"Under it, one line says the state in plain words and what needs attention: \"The week is approved,","startTime":2838.1290322580644,"endTime":2841.1612903225805,"audioSegment":0},{"text":"with 2 spots still open.\" Compute it from the data; never leave a static description there. A2.","startTime":2841.1612903225805,"endTime":2844.1935483870966,"audioSegment":0},{"text":"Home comes first and answers \"what needs me now?\" In a workspace app, Home holds up to four summary tiles,","startTime":2844.1935483870966,"endTime":2847.2258064516127,"audioSegment":0},{"text":"the list of things that need the person, the app's main view, and the app's top two or three actions. A3.","startTime":2847.2258064516127,"endTime":2850.2580645161293,"audioSegment":0},{"text":"One tab per noun.","startTime":2850.2580645161293,"endTime":2853.2903225806454,"audioSegment":0},{"text":"Each thing the person manages (People, Deals, Quotes,","startTime":2853.2903225806454,"endTime":2856.3225806451615,"audioSegment":0},{"text":"Vendors) gets a tab with its full list, its search, and its create and update actions.","startTime":2856.3225806451615,"endTime":2859.3548387096776,"audioSegment":0},{"text":"Label tabs with short plural nouns in sentence case.","startTime":2859.3548387096776,"endTime":2862.3870967741937,"audioSegment":0},{"text":"Two to five tabs is right; more means two nouns should merge. A4.","startTime":2862.3870967741937,"endTime":2865.4193548387098,"audioSegment":0},{"text":"Settings comes last, and only when there is something to set.","startTime":2865.4193548387098,"endTime":2868.451612903226,"audioSegment":0},{"text":"Rules, rates, targets, and event or campaign details belong there.","startTime":2868.451612903226,"endTime":2871.483870967742,"audioSegment":0},{"text":"Settings forms are open on the tab,","startTime":2871.483870967742,"endTime":2874.516129032258,"audioSegment":0},{"text":"not behind a key, and show the values saved now.","startTime":2874.516129032258,"endTime":2877.548387096774,"audioSegment":0},{"text":"Never show an empty Settings tab. A5.","startTime":2877.548387096774,"endTime":2880.5806451612902,"audioSegment":0},{"text":"No tab repeats Home.","startTime":2880.5806451612902,"endTime":2883.6129032258063,"audioSegment":0},{"text":"When the app's main view already is a noun's list,","startTime":2883.6129032258063,"endTime":2886.6451612903224,"audioSegment":0},{"text":"that noun lives on Home and gets no tab of its own.","startTime":2886.6451612903224,"endTime":2889.6774193548385,"audioSegment":0},{"text":"Shift Roster's week grid is its list of shifts,","startTime":2889.6774193548385,"endTime":2892.7096774193546,"audioSegment":0},{"text":"so Shift Roster has Home, People, and Settings, and no Shifts tab. A6.","startTime":2892.7096774193546,"endTime":2895.7419354838707,"audioSegment":0},{"text":"Declare navigation; don't derive it from headings.","startTime":2895.7419354838707,"endTime":2898.7741935483873,"audioSegment":0},{"text":"Many section headings are dashboard panels (\"Coming up\",","startTime":2898.7741935483873,"endTime":2901.8064516129034,"audioSegment":0},{"text":"\"Reorder now\"), not places to go.","startTime":2901.8064516129034,"endTime":2904.8387096774195,"audioSegment":0},{"text":"Name the tabs and what each holds.","startTime":2904.8387096774195,"endTime":2907.8709677419356,"audioSegment":0},{"text":"Do not add an \"On this page\" row of links. A7.","startTime":2907.8709677419356,"endTime":2910.9032258064517,"audioSegment":0},{"text":"A single-view app has no tabs.","startTime":2910.9032258064517,"endTime":2913.935483870968,"audioSegment":0},{"text":"A key bar under the title and actions on each row are enough.","startTime":2913.935483870968,"endTime":2916.967741935484,"audioSegment":0},{"text":"Add tabs when a second noun needs its own list, not before.","startTime":2916.967741935484,"endTime":2920,"audioSegment":0},{"text":"B1.","startTime":2920,"endTime":2923,"audioSegment":0},{"text":"An action is a key that opens a dialog.","startTime":2923,"endTime":2926,"audioSegment":0},{"text":"Never put a form on the page behind an expandable card.","startTime":2926,"endTime":2929,"audioSegment":0},{"text":"The disclosure presentation of actionForm exists only for older pages.","startTime":2929,"endTime":2932,"audioSegment":0},{"text":"One exception: a quick add of one field and its key (a grocery item,","startTime":2932,"endTime":2935,"audioSegment":0},{"text":"a record's title) can sit open at the top of the list it adds to. B2.","startTime":2935,"endTime":2938,"audioSegment":0},{"text":"Three keys at most, and one filled primary per view.","startTime":2938,"endTime":2941,"audioSegment":0},{"text":"The primary is the action that creates or commits.","startTime":2941,"endTime":2944,"audioSegment":0},{"text":"When the view already has a commit key of its own (Approve the week),","startTime":2944,"endTime":2947,"audioSegment":0},{"text":"every action key in that view is secondary. B3.","startTime":2947,"endTime":2950,"audioSegment":0},{"text":"Act on the record where it is.","startTime":2950,"endTime":2953,"audioSegment":0},{"text":"When a form starts by picking a record that is already on screen (a shift, a deal, an invoice),","startTime":2953,"endTime":2956,"audioSegment":0},{"text":"put a small key on that record's row or card instead: Fill, Time off, Move, Mark paid.","startTime":2956,"endTime":2959,"audioSegment":0},{"text":"It opens the same dialog with the record filled in.","startTime":2959,"endTime":2962,"audioSegment":0},{"text":"Keep a general key only when people also start that action from nowhere in particular. B4.","startTime":2962,"endTime":2965,"audioSegment":0},{"text":"Dialogs follow one pattern.","startTime":2965,"endTime":2968,"audioSegment":0},{"text":"The title is the action (\"Add a person\"),","startTime":2968,"endTime":2971,"audioSegment":0},{"text":"and fields sit in one column.","startTime":2971,"endTime":2974,"audioSegment":0},{"text":"Cancel comes before the verb on the right (\"Assign\", \"Add person\").","startTime":2974,"endTime":2977,"audioSegment":0},{"text":"Escape and a click on the backdrop close the dialog.","startTime":2977,"endTime":2980,"audioSegment":0},{"text":"A failed save keeps the dialog open with the typed values and says what went wrong.","startTime":2980,"endTime":2983,"audioSegment":0},{"text":"A successful save closes it and confirms beside the key that opened it,","startTime":2983,"endTime":2986,"audioSegment":0},{"text":"and the page shows the change. B5.","startTime":2986,"endTime":2989,"audioSegment":0},{"text":"Ask before discarding work.","startTime":2989,"endTime":2992,"audioSegment":0},{"text":"New game, remove,","startTime":2992,"endTime":2995,"audioSegment":0},{"text":"and anything else that loses state opens a dialog first. B6.","startTime":2995,"endTime":2998,"audioSegment":0},{"text":"Keys name a verb and its object.","startTime":2998,"endTime":3001,"audioSegment":0},{"text":"\"Add a shift\", in sentence case.","startTime":3001,"endTime":3004,"audioSegment":0},{"text":"When the dialog title is long, give the key a shorter label.","startTime":3004,"endTime":3007,"audioSegment":0},{"text":"C1.","startTime":3007,"endTime":3009.5714285714284,"audioSegment":0},{"text":"Show values the way people say them.","startTime":3009.5714285714284,"endTime":3012.1428571428573,"audioSegment":0},{"text":"Write \"Thu, Nov 12\", \"$1,529\", and \"In review\",","startTime":3012.1428571428573,"endTime":
