87}}}],"position":{"start":{"line":735,"column":1,"offset":68806},"end":{"line":735,"column":282,"offset":69087}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A4. Settings comes last, and only when there is something to set.","position":{"start":{"line":737,"column":3,"offset":69091},"end":{"line":737,"column":68,"offset":69156}}}],"position":{"start":{"line":737,"column":1,"offset":69089},"end":{"line":737,"column":70,"offset":69158}}},{"type":"text","value":" Rules, rates, targets, and event or campaign details belong there. Settings forms are open on the tab, not behind a key, and show the values saved now. Never show an empty Settings tab.","position":{"start":{"line":737,"column":70,"offset":69158},"end":{"line":737,"column":256,"offset":69344}}}],"position":{"start":{"line":737,"column":1,"offset":69089},"end":{"line":737,"column":256,"offset":69344}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A5. No tab repeats Home.","position":{"start":{"line":739,"column":3,"offset":69348},"end":{"line":739,"column":27,"offset":69372}}}],"position":{"start":{"line":739,"column":1,"offset":69346},"end":{"line":739,"column":29,"offset":69374}}},{"type":"text","value":" When the app's main view already is a noun's list, that noun lives on Home and gets no tab of its own. Shift Roster's week grid is its list of shifts, so Shift Roster has Home, People, and Settings, and no Shifts tab.","position":{"start":{"line":739,"column":29,"offset":69374},"end":{"line":739,"column":247,"offset":69592}}}],"position":{"start":{"line":739,"column":1,"offset":69346},"end":{"line":739,"column":247,"offset":69592}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A6. Declare navigation; don't derive it from headings.","position":{"start":{"line":741,"column":3,"offset":69596},"end":{"line":741,"column":57,"offset":69650}}}],"position":{"start":{"line":741,"column":1,"offset":69594},"end":{"line":741,"column":59,"offset":69652}}},{"type":"text","value":" Many section headings are dashboard panels (\"Coming up\", \"Reorder now\"), not places to go. Name the tabs and what each holds. Do not add an \"On this page\" row of links.","position":{"start":{"line":741,"column":59,"offset":69652},"end":{"line":741,"column":228,"offset":69821}}}],"position":{"start":{"line":741,"column":1,"offset":69594},"end":{"line":741,"column":228,"offset":69821}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A7. A single-view app has no tabs.","position":{"start":{"line":743,"column":3,"offset":69825},"end":{"line":743,"column":37,"offset":69859}}}],"position":{"start":{"line":743,"column":1,"offset":69823},"end":{"line":743,"column":39,"offset":69861}}},{"type":"text","value":" A key bar under the title and actions on each row are enough. Add tabs when a second noun needs its own list, not before.","position":{"start":{"line":743,"column":39,"offset":69861},"end":{"line":743,"column":161,"offset":69983}}}],"position":{"start":{"line":743,"column":1,"offset":69823},"end":{"line":743,"column":161,"offset":69983}}}]},{"id":"b-actions","startTime":2920,"duration":87,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"B. Actions","position":{"start":{"line":745,"column":5,"offset":69989},"end":{"line":745,"column":15,"offset":69999}}}],"position":{"start":{"line":745,"column":1,"offset":69985},"end":{"line":745,"column":15,"offset":69999}}},"title":"B. Actions","contents":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"B1. An action is a key that opens a dialog.","position":{"start":{"line":747,"column":3,"offset":70003},"end":{"line":747,"column":46,"offset":70046}}}],"position":{"start":{"line":747,"column":1,"offset":70001},"end":{"line":747,"column":48,"offset":70048}}},{"type":"text","value":" Never put a form on the page behind an expandable card. The disclosure presentation of ","position":{"start":{"line":747,"column":48,"offset":70048},"end":{"line":747,"column":136,"offset":70136}}},{"type":"inlineCode","value":"actionForm","position":{"start":{"line":747,"column":136,"offset":70136},"end":{"line":747,"column":148,"offset":70148}}},{"type":"text","value":" exists only for older pages. One exception: a quick add of one field and its key (a grocery item, a record's title) can sit open at the top of the list it adds to.","position":{"start":{"line":747,"column":148,"offset":70148},"end":{"line":747,"column":312,"offset":70312}}}],"position":{"start":{"line":747,"column":1,"offset":70001},"end":{"line":747,"column":312,"offset":70312}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"B2. Three keys at most, and one filled primary per view.","position":{"start":{"line":749,"column":3,"offset":70316},"end":{"line":749,"column":59,"offset":70372}}}],"position":{"start":{"line":749,"column":1,"offset":70314},"end":{"line":749,"column":61,"offset":70374}}},{"type":"text","value":" The primary is the action that creates or commits. When the view already has a commit key of its own (Approve the week), every action key in that view is secondary.","position":{"start":{"line":749,"column":61,"offset":70374},"end":{"line":749,"column":226,"offset":70539}}}],"position":{"start":{"line":749,"column":1,"offset":70314},"end":{"line":749,"column":226,"offset":70539}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"B3. Act on the record where it is.","position":{"start":{"line":751,"column":3,"offset":70543},"end":{"line":751,"column":37,"offset":70577}}}],"position":{"start":{"line":751,"column":1,"offset":70541},"end":{"line":751,"column":39,"offset":70579}}},{"type":"text","value":" When a form starts by picking a record that is already on screen (a shift, a deal, an invoice), put a small key on that record's ro olumn":161,"offset":78850}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"link","url":"https://github.com/bendyline/gezel/tree/main/examples/apps","children":[{"type":"text","value":"Sample apps","position":{"start":{"line":862,"column":4,"offset":78854},"end":{"line":862,"column":15,"offset":78865}}}],"position":{"start":{"line":862,"column":3,"offset":78853},"end":{"line":862,"column":76,"offset":78926}}},{"type":"text","value":": three complete source folders, kept working by Gezel's test suite.","position":{"start":{"line":862,"column":76,"offset":78926},"end":{"line":862,"column":144,"offset":78994}}}],"position":{"start":{"line":862,"column":3,"offset":78853},"end":{"line":862,"column":144,"offset":78994}}}],"position":{"start":{"line":862,"column":1,"offset":78851},"end":{"line":862,"column":144,"offset":78994}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"link","url":"https://github.com/bendyline/gezel/blob/main/docs/app-serve.md","children":[{"type":"text","value":"Sharing an app page with app serve","position":{"start":{"line":863,"column":4,"offset":78998},"end":{"line":863,"column":38,"offset":79032}}}],"position":{"start":{"line":863,"column":3,"offset":78997},"end":{"line":863,"column":103,"offset":79097}}},{"type":"text","value":": a page outside the desktop app.","position":{"start":{"line":863,"column":103,"offset":79097},"end":{"line":863,"column":136,"offset":79130}}}],"position":{"start":{"line":863,"column":3,"offset":78997},"end":{"line":863,"column":136,"offset":79130}}}],"position":{"start":{"line":863,"column":1,"offset":78995},"end":{"line":863,"column":136,"offset":79130}}}],"position":{"start":{"line":858,"column":1,"offset":78237},"end":{"line":863,"column":136,"offset":79130}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"This is the page to read, or to hand to an AI agent,","startTime":0,"endTime":4.1,"audioSegment":0},{"text":"before building a Gezel app.","startTime":4.1,"endTime":8.2,"audioSegment":0},{"text":"It starts with the working loop and the rules that keep an app working,","startTime":8.2,"endTime":12.299999999999999,"audioSegment":0},{"text":"then gives the four maintained guides: how an app is put together, how its page talks to Gezel, how it looks, and how it is organized.","startTime":12.299999999999999,"endTime":16.4,"audioSegment":0},{"text":"The exact references are linked at the end.","startTime":16.4,"endTime":20.5,"audioSegment":0},{"text":"A Gezel app is an experience: a page people use, a crew that works it,","startTime":20.5,"endTime":24.599999999999998,"audioSegment":0},{"text":"the craftbooks the crew follows, and the actions it takes.","startTime":24.599999999999998,"endTime":28.699999999999996,"audioSegment":0},{"text":"A project type is the app's reusable composition, a project is one person's copy of it,","startTime":28.699999999999996,"endTime":32.8,"audioSegment":0},{"text":"and a .gezapp is a package that carries the composition to another computer.","startTime":32.8,"endTime":36.9,"audioSegment":0},{"text":"Use only the parts an app needs: a page and a folder are already an app.","startTime":36.9,"endTime":41,"audioSegment":0},{"text":"Work the same loop a person does, using its machine-readable ends:","startTime":41,"endTime":43.76315789473684,"audioSegment":0},{"text":"Install the command line with npm install -g @bendyline/gezel-cli (Node.js 24 or newer).","startTime":43.76315789473684,"endTime":46.526315789473685,"audioSegment":0},{"text":"gezel app guide prints this page for the version you installed.","startTime":46.526315789473685,"endTime":49.28947368421053,"audioSegment":0},{"text":"Add --download to any command that needs a model (gezel run,","startTime":49.28947368421053,"endTime":52.05263157894737,"audioSegment":0},{"text":"gezel do): it downloads the on-device engine and the model that fits this computer, printing each step, instead of stopping to ask.","startTime":52.05263157894737,"endTime":54.81578947368421,"audioSegment":0},{"text":"Start from gezel app new <name> --with-page,","startTime":54.81578947368421,"endTime":57.578947368421055,"audioSegment":0},{"text":"or from one of the sample apps.","startTime":57.578947368421055,"endTime":60.34210526315789,"audioSegment":0},{"text":"Read the file formats with gezel app schemas --json.","startTime":60.34210526315789,"endTime":63.10526315789474,"audioSegment":0},{"text":"They are rendered from the build you installed,","startTime":63.10526315789474,"endTime":65.86842105263158,"audioSegment":0},{"text":"so they are never out of date.","startTime":65.86842105263158,"endTime":68.63157894736842,"audioSegment":0},{"text":"Run gezel app validate <folder> --json.","startTime":68.63157894736842,"endTime":71.39473684210526,"audioSegment":0},{"text":"Fix every finding and run it again until ok is true.","startTime":71.39473684210526,"endTime":74.15789473684211,"audioSegment":0},{"text":"Run gezel app pack <folder> to make the .gezapp.","startTime":74.15789473684211,"endTime":76.92105263157895,"audioSegment":0},{"text":"Report what the app does, which files it owns, what it can read and change,","startTime":76.92105263157895,"endTime":79.68421052631578,"audioSegment":0},{"text":"what you tested, and how to install it with gezel app add.","startTime":79.68421052631578,"endTime":82.44736842105263,"audioSegment":0},{"text":"These rules keep an app working:","startTime":82.44736842105263,"endTime":85.21052631578948,"audioSegment":0},{"text":"Decide data and permissions first.","startTime":85.21052631578948,"endTime":87.97368421052632,"audioSegment":0},{"text":"Name the files the app owns, what its page reads (pages.reads),","startTime":87.97368421052632,"endTime":90.73684210526315,"audioSegment":0},{"text":"where it adds files (pages.imports), and what each action may change.","startTime":90.73684210526315,"endTime":93.5,"audioSegment":0},{"text":"Use the page API, not a bridge of your own.","startTime":93.5,"endTime":96.26315789473685,"audioSegment":0},{"text":"Pages talk to Gezel through window.gezel and inherit Gezel's fonts.","startTime":96.26315789473685,"endTime":99.02631578947368,"audioSegment":0},{"text":"Never copy font files or platform scripts into an app,","startTime":99.02631578947368,"endTime":101.78947368421052,"audioSegment":0},{"text":"and never build a private file or query bridge.","startTime":101.78947368421052,"endTime":104.55263157894737,"audioSegment":0},{"text":"Change files only through declared tools.","startTime":104.55263157894737,"endTime":107.3157894736842,"audioSegment":0},{"text":"A page has no raw write API,","startTime":107.3157894736842,"endTime":110.07894736842105,"audioSegment":0},{"text":"and nothing may get around the workspace write policy.","startTime":110.07894736842105,"endTime":112.84210526315789,"audioSegment":0},{"text":"Reuse the shared file components.","startTime":112.84210526315789,"endTime":115.60526315789474,"audioSegment":0},{"text":"Anything that shows or adds files uses gezel.ui.components.fileCard and fileAdder.","startTime":115.60526315789474,"endTime":118.36842105263158,"audioSegment":0},{"text":"Reuse before you add.","startTime":118.36842105263158,"endTime":121.13157894736842,"audioSegment":0},{"text":"Prefer existing roles and craftbooks.","startTime":121.13157894736842,"endTime":123.89473684210526,"audioSegment":0},{"text":"Extend the shared runtime only when a reusable capability is missing.","startTime":123.89473684210526,"endTime":126.65789473684211,"audioSegment":0},{"text":"Organize the page the Gezel way.","startTime":126.65789473684211,"endTime":129.42105263157896,"audioSegment":0},{"text":"Home plus a tab per noun, actions as keys that open dialogs,","startTime":129.42105263157896,"endTime":132.18421052631578,"audioSegment":0},{"text":"and actions on the records themselves.","startTime":132.18421052631578,"endTime":134.94736842105263,"audioSegment":0},{"text":"Test what people will use.","startTime":134.94736842105263,"endTime":137.71052631578948,"audioSegment":0},{"text":"Try a real Gezel flow as well as the standalone demo,","startTime":137.71052631578948,"endTime":140.4736842105263,"audioSegment":0},{"text":"in both themes and at a narrow width.","startTime":140.4736842105263,"endTime":143.23684210526315,"audioSegment":0},{"text":"The rest of this page is the four maintained guides, in this order:","startTime":143.23684210526315,"endTime":146,"audioSegment":0},{"text":"File-oriented apps should reuse the shared file card and file adder.","startTime":146,"endTime":149.21428571428572,"audioSegment":0},{"text":"Use explicit pages.imports destinations for uploads, alongside pages.reads for browsing.","startTime":149.21428571428572,"endTime":152.42857142857142,"audioSegment":0},{"text":"The components work with plain HTML, inherit shared typography,","startTime":152.42857142857142,"endTime":155.64285714285714,"audioSegment":0},{"text":"and include an in-memory standalone demo adapter.","startTime":155.64285714285714,"endTime":158.85714285714286,"audioSegment":0},{"text":"Test both demo and embedded flows, including write denial,","startTime":158.85714285714286,"endTime":162.07142857142858,"audioSegment":0},{"text":"partial failures and resetting demo state.","startTime":162.07142857142858,"endTime":165.28571428571428,"audioSegment":0},{"text":"An AI App is a reusable experience that runs inside Gezel: a tailored project,","startTime":165.28571428571428,"endTime":168.5,"audioSegment":0},{"text":"a purpose-built crew, repeatable craftbooks, scripts, data, and an optional interactive dashboard.","startTime":168.5,"endTime":171.71428571428572,"audioSegment":0},{"text":"A language trainer, research room, board game,","startTime":171.71428571428572,"endTime":174.92857142857144,"audioSegment":0},{"text":"or client-service workspace can all use the same underlying pieces while feeling like a distinct application.","startTime":174.92857142857144,"endTime":178.14285714285714,"audioSegment":0},{"text":"\"Gezel app\" and \"AI App\" name that experience.","startTime":178.14285714285714,"endTime":181.35714285714286,"audioSegment":0},{"text":"The project type is its reusable composition and setup recipe;","startTime":181.35714285714286,"endTime":184.57142857142856,"audioSegment":0},{"text":"the project is one person's instance.","startTime":184.57142857142856,"endTime":187.78571428571428,"audioSegment":0},{"text":"You can build a useful app with only a page and a folder,","startTime":187.78571428571428,"endTime":191,"audioSegment":0},{"text":"then add a crew member or a craftbook when the work calls for one.","startTime":191,"endTime":194.21428571428572,"audioSegment":0},{"text":"You do not need every component in every app.","startTime":194.21428571428572,"endTime":197.42857142857144,"audioSegment":0},{"text":"For the interface,","startTime":197.42857142857144,"endTime":200.64285714285714,"audioSegment":0},{"text":"read Using the Gezel page APIs and the app page style guide.","startTime":200.64285714285714,"endTime":203.85714285714286,"audioSegment":0},{"text":"The complete page API reference and project-type specification provide the precise runtime contracts.","startTime":203.85714285714286,"endTime":207.07142857142858,"audioSegment":0},{"text":"These three Help guides are the starting path for people and AI agents building an app.","startTime":207.07142857142858,"endTime":210.28571428571428,"audioSegment":0},{"text":"The project type is the composition root and installer.","startTime":210.28571428571428,"endTime":213.5,"audioSegment":0},{"text":"Public AI Apps arrive through the project-type collection;","startTime":213.5,"endTime":216.71428571428572,"audioSegment":0},{"text":"private or experimental apps travel as .gezapp packages.","startTime":216.71428571428572,"endTime":219.92857142857144,"audioSegment":0},{"text":"Both start life as the same thing: a source folder you can build with the command line,","startTime":219.92857142857144,"endTime":223.14285714285714,"audioSegment":0},{"text":"by hand, or with an AI agent — this article is the guide to that folder.","startTime":223.14285714285714,"endTime":226.35714285714286,"audioSegment":0},{"text":"An AI App is different from a connected app.","startTime":226.35714285714286,"endTime":229.57142857142856,"audioSegment":0},{"text":"A connected app runs in its own process and interface and reaches Gezel through @bendyline/gezel-app-sdk.","startTime":229.57142857142856,"endTime":232.78571428571428,"audioSegment":0},{"text":"See Building connected apps with gezel-app-sdk when that is what you are building.","startTime":232.78571428571428,"endTime":236,"audioSegment":0},{"text":"Scaffolding, schema export, validation, and packing work without a running service.","startTime":236,"endTime":238.97674418604652,"audioSegment":0},{"text":"Installation and adoption use the Gezel daemon.","startTime":238.97674418604652,"endTime":241.95348837209303,"audioSegment":0},{"text":"Start with a disposable project folder while developing an app that writes data:","startTime":241.95348837209303,"endTime":244.93023255813952,"audioSegment":0},{"text":"gezel app new my-app --with-page     # a minimal source folder that validates cd my-app","startTime":244.93023255813952,"endTime":247.90697674418604,"audioSegment":0},{"text":"gezel app schemas --out schemas     # the exact schemas this CLI understands","startTime":247.90697674418604,"endTime":250.88372093023256,"audioSegment":0},{"text":"# edit items/ —","startTime":250.88372093023256,"endTime":253.86046511627907,"audioSegment":0},{"text":"the role's about.md and the version manifest are the heart","startTime":253.86046511627907,"endTime":256.83720930232556,"audioSegment":0},{"text":"gezel app validate .","startTime":256.83720930232556,"endTime":259.8139534883721,"audioSegment":0},{"text":"# every finding at once; --json for tooling","startTime":259.8139534883721,"endTime":262.7906976744186,"audioSegment":0},{"text":"gezel app pack .","startTime":262.7906976744186,"endTime":265.7674418604651,"audioSegment":0},{"text":"# -> my-app-1.0.0.gezapp","startTime":265.7674418604651,"endTime":268.74418604651163,"audioSegment":0},{"text":"gezel app add my-app-1.0.0.gezapp     # review and confirm the installation","startTime":268.74418604651163,"endTime":271.72093023255815,"audioSegment":0},{"text":"cd ~/the/folder/for/it && gezel app apply my-app","startTime":271.72093023255815,"endTime":274.69767441860466,"audioSegment":0},{"text":"apply outfits the current folder as a project: it creates the crew from the embedded role templates,","startTime":274.69767441860466,"endTime":277.6744186046512,"audioSegment":0},{"text":"installs craftbooks and scripts, seeds the data files, and pins the Output page.","startTime":277.6744186046512,"endTime":280.6511627906977,"audioSegment":0},{"text":"From there, iterate — edit the source, validate, pack, add (an upgrade), and apply --refresh;","startTime":280.6511627906977,"endTime":283.62790697674416,"audioSegment":0},{"text":"gezel app status reports seed drift, and gezel app serve shares the finished page (and optional visitor chat) as a mini-site.","startTime":283.62790697674416,"endTime":286.6046511627907,"audioSegment":0},{"text":"The --with-page scaffold includes a working records page.","startTime":286.6046511627907,"endTime":289.5813953488372,"audioSegment":0},{"text":"Run gezel app demo .","startTime":289.5813953488372,"endTime":292.5581395348837,"audioSegment":0},{"text":"--out ../my-app-demo and open the generated pages/dashboard/index.html for a standalone demo with resettable,","startTime":292.5581395348837,"endTime":295.5348837209302,"audioSegment":0},{"text":"in-memory sample data.","startTime":295.5348837209302,"endTime":298.51162790697674,"audioSegment":0},{"text":"The exporter supplies the shared bootstrap,","startTime":298.51162790697674,"endTime":301.48837209302326,"audioSegment":0},{"text":"components and fonts; app source does not bundle them.","startTime":301.48837209302326,"endTime":304.4651162790698,"audioSegment":0},{"text":"Inside Gezel it reads the real data.json, inherits the shared body/UI/heading fonts,","startTime":304.4651162790698,"endTime":307.4418604651163,"audioSegment":0},{"text":"follows host theme changes, and displays failures without switching to sample data.","startTime":307.4418604651163,"endTime":310.4186046511628,"audioSegment":0},{"text":"It includes loading, empty, pending,","startTime":310.4186046511628,"endTime":313.3953488372093,"audioSegment":0},{"text":"and retry states and cleans up its subscriptions.","startTime":313.3953488372093,"endTime":316.37209302325584,"audioSegment":0},{"text":"The browser preview is read-only;","startTime":316.37209302325584,"endTime":319.34883720930236,"audioSegment":0},{"text":"embedded and shared-site actions remain subject to host permissions.","startTime":319.34883720930236,"endTime":322.3255813953488,"audioSegment":0},{"text":"The scaffold exposes add_record to the keeper and page_add_record to the page,","startTime":322.3255813953488,"endTime":325.30232558139534,"audioSegment":0},{"text":"both backed by the same records-store script.","startTime":325.30232558139534,"endTime":328.27906976744185,"audioSegment":0},{"text":"This distinction matters: a name in pages.tools is excluded from the model's tool roster.","startTime":328.27906976744185,"endTime":331.25581395348837,"audioSegment":0},{"text":"Keep separate names when both audiences need an action.","startTime":331.25581395348837,"endTime":334.2325581395349,"audioSegment":0},{"text":"The sample uses button and keyboard handlers because the page sandbox does not allow native form submissions.","startTime":334.2325581395349,"endTime":337.2093023255814,"audioSegment":0},{"text":"Extend this starting point using the style/API guides,","startTime":337.2093023255814,"endTime":340.1860465116279,"audioSegment":0},{"text":"and test your new actions against a real host as well as the demo.","startTime":340.1860465116279,"endTime":343.1627906976744,"audioSegment":0},{"text":"Three worked samples of graded size live in examples/apps — example-journal (the minimal shape),","startTime":343.1627906976744,"endTime":346.1395348837209,"audioSegment":0},{"text":"example-habit-tracker (state, tools, a live page), and example-reading-circle (a crew, craftbooks, schedules, dependencies).","startTime":346.1395348837209,"endTime":349.1162790697674,"audioSegment":0},{"text":"Copying the smallest one that fits beats starting empty.","startTime":349.1162790697674,"endTime":352.09302325581393,"audioSegment":0},{"text":"For shared page APIs, inspect the Media Library and Data Analysis types: they show folder discovery,","startTime":352.09302325581393,"endTime":355.06976744186045,"audioSegment":0},{"text":"file-viewer navigation, inherited typography, and indexed summaries without private transports.","startTime":355.06976744186045,"endTime":358.04651162790697,"audioSegment":0},{"text":"Use the API reference as the contract;","startTime":358.04651162790697,"endTime":361.0232558139535,"audioSegment":0},{"text":"a sample's implementation choices are not additional requirements.","startTime":361.0232558139535,"endTime":364,"audioSegment":0},{"text":"The other on-ramp is to prototype the experience as an ordinary project first: settle the crew roles in conversation,","startTime":364,"endTime":368.8333333333333,"audioSegment":0},{"text":"work through each craftbook, run the scripts by hand, and decide which files are durable state versus generated artifacts.","startTime":368.8333333333333,"endTime":373.6666666666667,"audioSegment":0},{"text":"When the composition feels right,","startTime":373.6666666666667,"endTime":378.5,"audioSegment":0},{"text":"ask someone on the crew who has the project-management tools to export the type applied to that project.","startTime":378.5,"endTime":383.3333333333333,"audioSegment":0},{"text":"Gezel writes a .gezapp into the project artifacts — and a .gezapp is a renamed zip of exactly the source layout below,","startTime":383.3333333333333,"endTime":388.1666666666667,"audioSegment":0},{"text":"so unzip it, drop in a small gezapp.json, and keep iterating with validate and pack.","startTime":388.1666666666667,"endTime":393,"audioSegment":0},{"text":"A source folder is a gezapp.json beside an items/ tree.","startTime":393,"endTime":395.55263157894734,"audioSegment":0},{"text":"The tree is the same layout the packed archive and the installed app use (items sharded by the first two characters of their id,","startTime":395.55263157894734,"endTime":398.10526315789474,"audioSegment":0},{"text":"identity separate from versioned content), which is why exports round-trip: my-app/","startTime":398.10526315789474,"endTime":400.6578947368421,"audioSegment":0},{"text":"gezapp.json                        the source manifest — small on purpose items/","startTime":400.6578947368421,"endTime":403.2105263157895,"audioSegment":0},{"text":"project-types/my/my-app/","startTime":403.2105263157895,"endTime":405.7631578947368,"audioSegment":0},{"text":"manifest.json                  identity: id, name, description, maintainer","startTime":405.7631578947368,"endTime":408.3157894736842,"audioSegment":0},{"text":"versions/1.0.0/","startTime":408.3157894736842,"endTime":410.86842105263156,"audioSegment":0},{"text":"manifest.json                the composition root (everything below hangs off it)","startTime":410.86842105263156,"endTime":413.42105263157896,"audioSegment":0},{"text":"about.md                     param-templated project context mission.md","startTime":413.42105263157896,"endTime":415.9736842105263,"audioSegment":0},{"text":"records.json                 seed data (workspaceSeed) scripts/","startTime":415.9736842105263,"endTime":418.5263157894737,"audioSegment":0},{"text":"record-store.ts            sidecar script — folded inline at pack craftbooks/","startTime":418.5263157894737,"endTime":421.07894736842104,"audioSegment":0},{"text":"review-records.json        type-private craftbook document pages/","startTime":421.07894736842104,"endTime":423.63157894736844,"audioSegment":0},{"text":"dashboard/index.html       the Output page","startTime":423.63157894736844,"endTime":426.1842105263158,"audioSegment":0},{"text":"gezel-templates/my/my-app-lead/","startTime":426.1842105263158,"endTime":428.7368421052632,"audioSegment":0},{"text":"manifest.json                  role identity (kind, id, name, role)","startTime":428.7368421052632,"endTime":431.2894736842105,"audioSegment":0},{"text":"versions/1.0.0/","startTime":431.2894736842105,"endTime":433.8421052631579,"audioSegment":0},{"text":"manifest.json                points at about.md","startTime":433.8421052631579,"endTime":436.39473684210526,"audioSegment":0},{"text":"about.md                     the role's working character","startTime":436.39473684210526,"endTime":438.94736842105266,"audioSegment":0},{"text":"craftbook-templates/my/my-app-review/ manifest.json","startTime":438.94736842105266,"endTime":441.5,"audioSegment":0},{"text":"versions/1.0.0/","startTime":441.5,"endTime":444.0526315789474,"audioSegment":0},{"text":"craftbook.json               the reusable craftbook document","startTime":444.0526315789474,"endTime":446.60526315789474,"audioSegment":0},{"text":"test.json                    its eval sidecar","startTime":446.60526315789474,"endTime":449.1578947368421,"audioSegment":0},{"text":"gezapp.json stays small on purpose — format: \"gezel-ai-app-source\",","startTime":449.1578947368421,"endTime":451.7105263157895,"audioSegment":0},{"text":"schemaVersion: 1, and optionally an entry pin and a publisher.","startTime":451.7105263157895,"endTime":454.2631578947369,"audioSegment":0},{"text":"The item list, per-item SHA-256 hashes, the external dependency lock, minGezelVersion,","startTime":454.2631578947369,"endTime":456.8157894736842,"audioSegment":0},{"text":"and timestamps are all derived from the tree by gezel app pack; writing them by hand is a validation error, not a convention.","startTime":456.8157894736842,"endTime":459.36842105263156,"audioSegment":0},{"text":"Scripts have two equal authoring forms.","startTime":459.36842105263156,"endTime":461.92105263157896,"audioSegment":0},{"text":"The version manifest's scripts map holds inline TypeScript strings — the form models author most reliably —","startTime":461.92105263157896,"endTime":464.4736842105263,"audioSegment":0},{"text":"and versions/<v>/scripts/<name>.ts holds the same scripts as real files, which people and typecheckers prefer.","startTime":464.4736842105263,"endTime":467.0263157894737,"audioSegment":0},{"text":"Pack folds sidecars into the map and drops the files, so the shipped app is byte-identical either way;","startTime":467.0263157894737,"endTime":469.57894736842104,"audioSegment":0},{"text":"defining one name in both forms is a validation error.","startTime":469.57894736842104,"endTime":472.13157894736844,"audioSegment":0},{"text":"Craftbooks also have two homes.","startTime":472.13157894736844,"endTime":474.6842105263158,"audioSegment":0},{"text":"A procedure private to this app lives embedded at versions/<v>/craftbooks/<id>.json —","startTime":474.6842105263158,"endTime":477.2368421052632,"audioSegment":0},{"text":"it ships inside the project type and appears in no catalog.","startTime":477.2368421052632,"endTime":479.7894736842105,"audioSegment":0},{"text":"A reusable procedure is its own craftbook-templates/ item with a craftbook.json and a test.json eval sidecar —","startTime":479.7894736842105,"endTime":482.3421052631579,"audioSegment":0},{"text":"or simply a reference to an existing recipe in the craftbook collection.","startTime":482.3421052631579,"endTime":484.89473684210526,"audioSegment":0},{"text":"The version manifest's craftbooks list references both by id,","startTime":484.89473684210526,"endTime":487.44736842105266,"audioSegment":0},{"text":"and an embedded document wins over a catalog item with the same id.","startTime":487.44736842105266,"endTime":490,"audioSegment":0},{"text":"Part What it contributes","startTime":490,"endTime":493.1111111111111,"audioSegment":0},{"text":"Project type Identity, version, setup params, project templates,","startTime":493.1111111111111,"endTime":496.22222222222223,"audioSegment":0},{"text":"crew roster, and references to every other part","startTime":496.22222222222223,"endTime":499.3333333333333,"audioSegment":0},{"text":"Role templates Each crew member's name, role, and about.md working character;","startTime":499.3333333333333,"endTime":502.44444444444446,"audioSegment":0},{"text":"one entry can be the crew lead (voorman: true), or a solo type presents its one crew member under a custom leadLabel.","startTime":502.44444444444446,"endTime":505.55555555555554,"audioSegment":0},{"text":"Browse the role collection before writing a new one","startTime":505.55555555555554,"endTime":508.6666666666667,"audioSegment":0},{"text":"Craftbooks Repeatable procedures installed into each project —","startTime":508.6666666666667,"endTime":511.77777777777777,"audioSegment":0},{"text":"embedded (type-private) or referenced catalog items","startTime":511.77777777777777,"endTime":514.8888888888889,"audioSegment":0},{"text":"Scripts and tools Capability-declared TypeScript run in Gezel's sandbox;","startTime":514.8888888888889,"endTime":518,"audioSegment":0},{"text":"a tools entry exposes a script as a schema-validated tool for the model or the page","startTime":518,"endTime":521.1111111111111,"audioSegment":0},{"text":"Output page A read-limited HTML/CSS/JS experience pinned into the project's Output tab","startTime":521.1111111111111,"endTime":524.2222222222222,"audioSegment":0},{"text":"Data Ordinary JSON, Markdown,","startTime":524.2222222222222,"endTime":527.3333333333334,"audioSegment":0},{"text":"and media files seeded into the workspace or artifacts","startTime":527.3333333333334,"endTime":530.4444444444445,"audioSegment":0},{"text":"Schedules Consent-gated scheduled or Night Shift craftbook runs","startTime":530.4444444444445,"endTime":533.5555555555555,"audioSegment":0},{"text":"Toolsets Catalog references for capabilities the project needs or suggests;","startTime":533.5555555555555,"endTime":536.6666666666666,"audioSegment":0},{"text":"toolset code is never embedded","startTime":536.6666666666666,"endTime":539.7777777777778,"audioSegment":0},{"text":"Nothing installs merely because Gezel detects a suitable project type: adoption is explicit, params render as a form and substitute into nameTemplate,","startTime":539.7777777777778,"endTime":542.8888888888889,"audioSegment":0},{"text":"the about/mission templates, and seed files, and toolsets and schedules remain subject to consent and security policy.","startTime":542.8888888888889,"endTime":546,"audioSegment":0},{"text":"Write a short brief with five decisions: what the person does, which files are authoritative,","startTime":546,"endTime":548.6222222222223,"audioSegment":0},{"text":"which actions change them, where judgment needs a model, and what successful completion looks like.","startTime":548.6222222222223,"endTime":551.2444444444444,"audioSegment":0},{"text":"Map each decision to an existing part of the platform:","startTime":551.2444444444444,"endTime":553.8666666666667,"audioSegment":0},{"text":"Requirement Put it here","startTime":553.8666666666667,"endTime":556.4888888888889,"audioSegment":0},{"text":"Show, search, filter,","startTime":556.4888888888889,"endTime":559.1111111111111,"audioSegment":0},{"text":"or chart existing content A type-owned page using the shared page APIs","startTime":559.1111111111111,"endTime":561.7333333333333,"audioSegment":0},{"text":"Store a record or calculate a deterministic result A capability-declared SDK script,","startTime":561.7333333333333,"endTime":564.3555555555556,"audioSegment":0},{"text":"exposed through a tool when needed","startTime":564.3555555555556,"endTime":566.9777777777778,"audioSegment":0},{"text":"Make a judgment, explain, research,","startTime":566.9777777777778,"endTime":569.6,"audioSegment":0},{"text":"or converse A focused crew role with the tools it actually needs","startTime":569.6,"endTime":572.2222222222222,"audioSegment":0},{"text":"Carry out a repeatable multi-step job A craftbook with clear inputs,","startTime":572.2222222222222,"endTime":574.8444444444444,"audioSegment":0},{"text":"step ownership, and completion gates","startTime":574.8444444444444,"endTime":577.4666666666667,"audioSegment":0},{"text":"Set up the experience The project type's params,","startTime":577.4666666666667,"endTime":580.0888888888888,"audioSegment":0},{"text":"about/mission, crew, scripts, seeds, and project defaults","startTime":580.0888888888888,"endTime":582.7111111111111,"audioSegment":0},{"text":"Describe the data contract explicitly: path, workspace or artifacts,","startTime":582.7111111111111,"endTime":585.3333333333334,"audioSegment":0},{"text":"schema, owner, who writes it, and how the page learns about changes.","startTime":585.3333333333334,"endTime":587.9555555555555,"audioSegment":0},{"text":"Keep the source definition separate from user data.","startTime":587.9555555555555,"endTime":590.5777777777778,"audioSegment":0},{"text":"A gallery's HTML belongs to the catalog type;","startTime":590.5777777777778,"endTime":593.2,"audioSegment":0},{"text":"photos belong to the selected workspace.","startTime":593.2,"endTime":595.8222222222222,"audioSegment":0},{"text":"A generated report belongs in artifacts.","startTime":595.8222222222222,"endTime":598.4444444444445,"audioSegment":0},{"text":"The page should not create a second source of truth in local storage.","startTime":598.4444444444445,"endTime":601.0666666666667,"audioSegment":0},{"text":"For a folder app such as Media Library or Data Analysis,","startTime":601.0666666666667,"endTime":603.6888888888889,"audioSegment":0},{"text":"declare a page with read access and no workspaceSeed. On desktop,","startTime":603.6888888888889,"endTime":606.3111111111111,"audioSegment":0},{"text":"New Project can attach an existing folder to a seedless type without copying or moving its originals.","startTime":606.3111111111111,"endTime":608.9333333333334,"audioSegment":0},{"text":"Typed creation accepts workingDir;","startTime":608.9333333333334,"endTime":611.5555555555555,"audioSegment":0},{"text":"types with workspace starter files use an internal workspace instead.","startTime":611.5555555555555,"endTime":614.1777777777778,"audioSegment":0},{"text":"This does not imply that CLI app apply is read-only: applying a stateful type can seed files in the folder you choose.","startTime":614.1777777777778,"endTime":616.8,"audioSegment":0},{"text":"Start a new type with the smallest version manifest that fits.","startTime":616.8,"endTime":619.4222222222222,"audioSegment":0},{"text":"For a read-only folder app, a composition can be this small;","startTime":619.4222222222222,"endTime":622.0444444444445,"audioSegment":0},{"text":"its identity manifest still lives one level above versions/: {","startTime":622.0444444444445,"endTime":624.6666666666666,"audioSegment":0},{"text":"\"schemaVersion\": 1,","startTime":624.6666666666666,"endTime":627.2888888888889,"audioSegment":0},{"text":"\"version\": \"1.0.0\",","startTime":627.2888888888889,"endTime":629.9111111111112,"audioSegment":0},{"text":"\"releasedAt\": \"2026-10-19T00:00:00Z\",","startTime":629.9111111111112,"endTime":632.5333333333333,"audioSegment":0},{"text":"\"aboutTemplate\": \"about.md\",","startTime":632.5333333333333,"endTime":635.1555555555556,"audioSegment":0},{"text":"\"missionTemplate\": \"mission.md\", \"pages\": {","startTime":635.1555555555556,"endTime":637.7777777777778,"audioSegment":0},{"text":"\"entry\": \"index.html\", \"api\": 1,","startTime":637.7777777777778,"endTime":640.4,"audioSegment":0},{"text":"\"reads\": [{ \"source\": \"workspace\", \"path\": \".\", \"subtree\": true }] } }","startTime":640.4,"endTime":643.0222222222222,"audioSegment":0},{"text":"Add params only for choices the person needs to make.","startTime":643.0222222222222,"endTime":645.6444444444444,"audioSegment":0},{"text":"nameTemplate, aboutTemplate, and missionTemplate describe the instance;","startTime":645.6444444444444,"endTime":648.2666666666667,"audioSegment":0},{"text":"they are not replacements for a role's character.","startTime":648.2666666666667,"endTime":650.8888888888889,"audioSegment":0},{"text":"tabVisibility can simplify supporting tabs, mode and leadLabel shape a solo experience,","startTime":650.8888888888889,"endTime":653.5111111111111,"audioSegment":0},{"text":"and meesterManaged controls progress check-ins.","startTime":653.5111111111111,"endTime":656.1333333333333,"audioSegment":0},{"text":"Set indexingEnabled: false only when the app does not need indexed search or tables.","startTime":656.1333333333333,"endTime":658.7555555555556,"audioSegment":0},{"text":"Omitting a default preserves the existing project choice;","startTime":658.7555555555556,"endTime":661.3777777777777,"audioSegment":0},{"text":"a declaration can change it during adoption.","startTime":661.3777777777777,"endTime":664,"audioSegment":0},{"text":"A custom role is a gezel-templates item with an identity manifest,","startTime":664,"endTime":667.1818181818181,"audioSegment":0},{"text":"a version manifest, and an about.md.","startTime":667.1818181818181,"endTime":670.3636363636364,"audioSegment":0},{"text":"Reference its template id in gezels[],","startTime":670.3636363636364,"endTime":673.5454545454545,"audioSegment":0},{"text":"marking the crew lead with voorman: true when appropriate.","startTime":673.5454545454545,"endTime":676.7272727272727,"audioSegment":0},{"text":"Reuse a suitable existing role before adding a new one.","startTime":676.7272727272727,"endTime":679.9090909090909,"audioSegment":0},{"text":"A role template defines expertise, temperament, working style,","startTime":679.9090909090909,"endTime":683.0909090909091,"audioSegment":0},{"text":"and boundaries; it does not define one person's project brief.","startTime":683.0909090909091,"endTime":686.2727272727273,"audioSegment":0},{"text":"Keep tool listings out of its prose because Gezel injects the actual available tools at runtime.","startTime":686.2727272727273,"endTime":689.4545454545455,"audioSegment":0},{"text":"A custom craftbook turns a job into a sequence that can be checked.","startTime":689.4545454545455,"endTime":692.6363636363636,"audioSegment":0},{"text":"Define its input parameters, a valid entryStepId, unique step ids,","startTime":692.6363636363636,"endTime":695.8181818181819,"audioSegment":0},{"text":"the role responsible for each step, concrete outputs, and success gates.","startTime":695.8181818181819,"endTime":699,"audioSegment":0},{"text":"Use a script for calculation or mechanical file manipulation and a model for judgment.","startTime":699,"endTime":702.1818181818181,"audioSegment":0},{"text":"Do not ask a model to reconstruct data already available to a script.","startTime":702.1818181818181,"endTime":705.3636363636364,"audioSegment":0},{"text":"Use {{task.dir}} for task-owned outputs instead of inventing global paths.","startTime":705.3636363636364,"endTime":708.5454545454545,"audioSegment":0},{"text":"See Plans, the script SDK,","startTime":708.5454545454545,"endTime":711.7272727272727,"audioSegment":0},{"text":"and the complete Reading Circle sample for a crew with both embedded and reusable craftbooks.","startTime":711.7272727272727,"endTime":714.9090909090909,"audioSegment":0},{"text":"Validate craftbook documents against schemas exported by the installed CLI rather than guessing step or gate fields.","startTime":714.9090909090909,"endTime":718.0909090909091,"audioSegment":0},{"text":"Reusable catalog craftbooks carry a test.json sidecar;","startTime":718.0909090909091,"endTime":721.2727272727273,"audioSegment":0},{"text":"that sidecar is not proof the workflow has run successfully.","startTime":721.2727272727273,"endTime":724.4545454545455,"audioSegment":0},{"text":"Exercise a representative task and its gates.","startTime":724.4545454545455,"endTime":727.6363636363636,"audioSegment":0},{"text":"Schedules reference the craftbook id and should make their consent behavior explicit;","startTime":727.6363636363636,"endTime":730.8181818181818,"audioSegment":0},{"text":"start with consent: \"ask\" for work the person has not yet enabled.","startTime":730.8181818181818,"endTime":734,"audioSegment":0},{"text":"The app composition is the same in both cases;","startTime":734,"endTime":737,"audioSegment":0},{"text":"the authoring and release loops differ.","startTime":737,"endTime":740,"audioSegment":0},{"text":"Target Source Check and use it","startTime":740,"endTime":743,"audioSegment":0},{"text":"Private, experimental, or portable app gezapp.json + items/ gezel app validate,","startTime":743,"endTime":746,"audioSegment":0},{"text":"pack, then install and apply against a test project","startTime":746,"endTime":749,"audioSegment":0},{"text":"Public Gilde app gilde/data/<kind>/<shard>/<id>/ Gilde's schema/content checks,","startTime":749,"endTime":752,"audioSegment":0},{"text":"page-demo checks, and local index build; then test with Gezel using that content root","startTime":752,"endTime":755,"audioSegment":0},{"text":"In the Gezel repository, public catalog content belongs in the sibling Gilde checkout,","startTime":755,"endTime":758,"audioSegment":0},{"text":"not in Gezel's old data/ tree or installed dependencies.","startTime":758,"endTime":761,"audioSegment":0},{"text":"GEZEL_GILDE_DATA_DIR can select the checkout's data/ directory for a development service.","startTime":761,"endTime":764,"audioSegment":0},{"text":"The normal application still uses its pinned catalog unless configured otherwise.","startTime":764,"endTime":767,"audioSegment":0},{"text":"A catalog change must be released and consumed before it appears in an ordinary installation.","startTime":767,"endTime":770,"audioSegment":0},{"text":"The private source packer folds script sidecars into the version manifest.","startTime":770,"endTime":773,"audioSegment":0},{"text":"That preprocessing is specific to the source-package path: when authoring Gilde directly,","startTime":773,"endTime":776,"audioSegment":0},{"text":"follow its released-payload conventions and validators.","startTime":776,"endTime":779,"audioSegment":0},{"text":"Never hand-edit a released version; add a new version.","startTime":779,"endTime":782,"audioSegment":0},{"text":"Exported hashes, dependency locks, and catalog-root indexes are generated, not authored.","startTime":782,"endTime":785,"audioSegment":0},{"text":"Projects made from an earlier version of an app move to a newer one on their own, within the same major version,","startTime":785,"endTime":789.0769230769231,"audioSegment":0},{"text":"when the update would change nothing the person made: the page, tool declarations and scripts move together, and their data, edited About text and settings stay.","startTime":789.0769230769231,"endTime":793.1538461538462,"audioSegment":0},{"text":"An update that would replace a script edited in the project, add crew, connect a tool service,","startTime":793.1538461538462,"endTime":797.2307692307693,"audioSegment":0},{"text":"start a recurring run, or write new files into a person's folder waits for them to approve it in the project.","startTime":797.2307692307693,"endTime":801.3076923076923,"audioSegment":0},{"text":"Apps installed from a .gezapp always wait for approval.","startTime":801.3076923076923,"endTime":805.3846153846154,"audioSegment":0},{"text":"Write versions so this is safe:","startTime":805.3846153846154,"endTime":809.4615384615385,"audioSegment":0},{"text":"A minor or patch version must read every data file an earlier version of the same major wrote.","startTime":809.4615384615385,"endTime":813.5384615384615,"audioSegment":0},{"text":"Change a data file's shape only in a new major version;","startTime":813.5384615384615,"endTime":817.6153846153846,"audioSegment":0},{"text":"existing projects stay on their major.","startTime":817.6153846153846,"endTime":821.6923076923077,"audioSegment":0},{"text":"A param added within a major needs a default,","startTime":821.6923076923077,"endTime":825.7692307692307,"audioSegment":0},{"text":"or projects made earlier are not offered the update.","startTime":825.7692307692307,"endTime":829.8461538461538,"audioSegment":0},{"text":"Keep page and script changes in step: they ship together,","startTime":829.8461538461538,"endTime":833.9230769230769,"audioSegment":0},{"text":"so a page may call a tool its own version's script provides.","startTime":833.9230769230769,"endTime":838,"audioSegment":0},{"text":"Each script declares its capabilities, inputs, outputs, and whether it is an action or gate through @bendyline/gezel-sdk;","startTime":838,"endTime":841.3,"audioSegment":0},{"text":"the Writing scripts with gezel-sdk article covers that contract.","startTime":841.3,"endTime":844.6,"audioSegment":0},{"text":"Adoption copies the scripts into the project with provenance.","startTime":844.6,"endTime":847.9,"audioSegment":0},{"text":"A tools entry gives a script a stable name, a JSON Schema inputs object validated before every run,","startTime":847.9,"endTime":851.2,"audioSegment":0},{"text":"and static bind values so several narrow tools can share one script without letting the caller replace the bound operation.","startTime":851.2,"endTime":854.5,"audioSegment":0},{"text":"A tool listed in pages.tools is page-only — kept off the model's roster —","startTime":854.5,"endTime":857.8,"audioSegment":0},{"text":"and can carry a reaction that summons a named crew member when the page invokes it, with the tool output interpolated into the reaction prompt.","startTime":857.8,"endTime":861.1,"audioSegment":0},{"text":"Design tools a small local model can use.","startTime":861.1,"endTime":864.4,"audioSegment":0},{"text":"These rules come from running app requests on Gemma 4 E4B and 12B,","startTime":864.4,"endTime":867.7,"audioSegment":0},{"text":"where each one fixed a request that otherwise failed:","startTime":867.7,"endTime":871,"audioSegment":0},{"text":"Give the status tool the whole picture a request needs.","startTime":871,"endTime":874.3,"audioSegment":0},{"text":"A meal planner whose status listed only the grocery gap could not plan \"around what we have\",","startTime":874.3,"endTime":877.6,"audioSegment":0},{"text":"because nothing said what was in stock.","startTime":877.6,"endTime":880.9,"audioSegment":0},{"text":"Include ids, owners, dates and totals, and lead with what changed.","startTime":880.9,"endTime":884.2,"audioSegment":0},{"text":"A state: true tool runs before each chat turn and the model often answers from its output without calling anything,","startTime":884.2,"endTime":887.5,"audioSegment":0},{"text":"literally: asked what was due in 60 days, it skipped a separate \"Overdue\" list.","startTime":887.5,"endTime":890.8,"audioSegment":0},{"text":"Put what a question selects in one list, most urgent first.","startTime":890.8,"endTime":894.1,"audioSegment":0},{"text":"Name people in an output field, don't just count them.","startTime":894.1,"endTime":897.4,"audioSegment":0},{"text":"Asked who still owed a dietary answer, a model read missingDietary: 2 beside a list that also held a guest who had not replied,","startTime":897.4,"endTime":900.7,"audioSegment":0},{"text":"decided he was one of the two, and could not name the other.","startTime":900.7,"endTime":904,"audioSegment":0},{"text":"A noDietaryAnswer field listing the names leaves nothing to infer.","startTime":904,"endTime":907.3,"audioSegment":0},{"text":"Say when to call a write tool.","startTime":907.3,"endTime":910.6,"audioSegment":0},{"text":"\"Call it as soon as the person mentions one,","startTime":910.6,"endTime":913.9,"audioSegment":0},{"text":"before you describe it\" stops a model that would otherwise describe a plan it never saved.","startTime":913.9,"endTime":917.2,"audioSegment":0},{"text":"Make adds idempotent on name.","startTime":917.2,"endTime":920.5,"audioSegment":0},{"text":"\"We ran out of olive oil\" often arrives as an add;","startTime":920.5,"endTime":923.8,"audioSegment":0},{"text":"update the existing record instead of creating a twin.","startTime":923.8,"endTime":927.1,"audioSegment":0},{"text":"Give relative changes their own input.","startTime":927.1,"endTime":930.4,"audioSegment":0},{"text":"Told that someone joined a party of four,","startTime":930.4,"endTime":933.7,"audioSegment":0},{"text":"a model replaced the party with one name.","startTime":933.7,"endTime":937,"audioSegment":0},{"text":"A joining input the script adds to the count removes the arithmetic from the model.","startTime":937,"endTime":940.3,"audioSegment":0},{"text":"Keep money in integer cents and dates as local YYYY-MM-DD,","startTime":940.3,"endTime":943.6,"audioSegment":0},{"text":"and roll a monthly date forward to the last day of a shorter month rather than into the next.","startTime":943.6,"endTime":946.9,"audioSegment":0},{"text":"Speak to the model in the units its inputs take.","startTime":946.9,"endTime":950.2,"audioSegment":0},{"text":"Store cents, but report dollars in tool outputs.","startTime":950.2,"endTime":953.5,"audioSegment":0},{"text":"After reading openValueCents in one result,","startTime":953.5,"endTime":956.8,"audioSegment":0},{"text":"a model passed valueChange: 340000 for \"another $3,400\" to an input that takes dollars, and a $22,500 deal became $362,500.","startTime":956.8,"endTime":960.1,"audioSegment":0},{"text":"The Output page runs in a sandbox and codes against the injected window.gezel API (typed definitions in @bendyline/gezel-sdk/page;","startTime":960.1,"endTime":963.4,"audioSegment":0},{"text":"set pages.api to 1).","startTime":963.4,"endTime":966.7,"audioSegment":0},{"text":"Every readable file must appear in pages.reads and every callable tool in pages.tools —","startTime":966.7,"endTime":970,"audioSegment":0},{"text":"there is deliberately no raw page write API, so state changes flow through declared tools and stay auditable:","startTime":970,"endTime":973.3,"audioSegment":0},{"text":"async function refresh() {","startTime":973.3,"endTime":976.6,"audioSegment":0},{"text":"render(await gezel.data.read('records.json', { as: 'json' })); }","startTime":976.6,"endTime":979.9,"audioSegment":0},{"text":"const stop = gezel.data.watch('records.json', () => { void refresh().catch(showError); });","startTime":979.9,"endTime":983.2,"audioSegment":0},{"text":"await refresh();","startTime":983.2,"endTime":986.5,"audioSegment":0},{"text":"const { output } = await gezel.tools.invoke('add_record', { title: 'First review' });","startTime":986.5,"endTime":989.8,"audioSegment":0},{"text":"window.addEventListener('pagehide', stop, { once: true });","startTime":989.8,"endTime":993.1,"audioSegment":0},{"text":"Here render and showError are your UI functions.","startTime":993.1,"endTime":996.4,"audioSegment":0},{"text":"A watch reports that a file changed;","startTime":996.4,"endTime":999.7,"audioSegment":0},{"text":"it does not pass the file contents to render.","startTime":999.7,"endTime":1003,"audioSegment":0},{"text":"Use gezel.data.list() to discover files, data.url() for media,","startTime":1003,"endTime":1006.3,"audioSegment":0},{"text":"and data.open() to navigate to their existing Gezel renditions.","startTime":1006.3,"endTime":1009.6,"audioSegment":0},{"text":"Use gezel.tables.list/describe/query for permission-scoped summaries and charts over indexed data.","startTime":1009.6,"endTime":1012.9,"audioSegment":0},{"text":"These capabilities are shared infrastructure; keep them out of app-specific transports.","startTime":1012.9,"endTime":1016.2,"audioSegment":0},{"text":"See the page API guide for host differences and failure states.","startTime":1016.2,"endTime":1019.5,"audioSegment":0},{"text":"Pages inherit Gezel's local body/UI and heading fonts.","startTime":1019.5,"endTime":1022.8,"audioSegment":0},{"text":"They still define their own layout, color variables,","startTime":1022.8,"endTime":1026.1,"audioSegment":0},{"text":"control styles, and responsive behavior.","startTime":1026.1,"endTime":1029.4,"audioSegment":0},{"text":"Follow the page style guide,","startTime":1029.4,"endTime":1032.7,"audioSegment":0},{"text":"including both themes and system fallbacks for standalone demos.","startTime":1032.7,"endTime":1036,"audioSegment":0},{"text":"gezel app validate collects every finding at once, in layers: folder shape and portable paths, every manifest and craftbook parsed with the same schemas the runtime uses, the exact verification an install runs (hashes,","startTime":1036,"endTime":1040.8666666666666,"audioSegment":0},{"text":"reference closure, dependency locks), referenced files and craftbook step graphs, script diagnostics from the real TypeScript compiler, page syntax and theme checks, and offline dependency availability.","startTime":1040.8666666666666,"endTime":1045.7333333333333,"audioSegment":0},{"text":"Errors mean install or adoption would break; warnings are advisory.","startTime":1045.7333333333333,"endTime":1050.6,"audioSegment":0},{"text":"gezel app pack derives the manifest and produces the .gezapp —","startTime":1050.6,"endTime":1055.4666666666667,"audioSegment":0},{"text":"a renamed zip holding the root manifest and the items/ tree, with a SHA-256 digest per embedded item.","startTime":1055.4666666666667,"endTime":1060.3333333333333,"audioSegment":0},{"text":"Exactly one entry project type travels, along with every role and craftbook template it references; toolsets, connectors,","startTime":1060.3333333333333,"endTime":1065.2,"audioSegment":0},{"text":"and models stay outside as an exact-version dependency lock — models remain separate catalog choices (browse every model) and are never bundled into an app.","startTime":1065.2,"endTime":1070.0666666666666,"audioSegment":0},{"text":"Version 1 packages are explicitly unsigned — hashes detect corruption,","startTime":1070.0666666666666,"endTime":1074.9333333333334,"audioSegment":0},{"text":"not authorship, so install only from sources you trust.","startTime":1074.9333333333334,"endTime":1079.8,"audioSegment":0},{"text":"Installation is gezel app add: a first pass previews publisher, contents, compatibility, conflicts, and missing dependencies without writing anything;","startTime":1079.8,"endTime":1084.6666666666667,"audioSegment":0},{"text":"the confirmed pass installs atomically under ~/.gezel/ai-apps/, records a receipt, and mounts the app as one catalog source.","startTime":1084.6666666666667,"endTime":1089.5333333333333,"audioSegment":0},{"text":"Import never executes package contents,","startTime":1089.5333333333333,"endTime":1094.4,"audioSegment":0},{"text":"and gezel app list/show/enable/disable/remove/update manage the installed lifecycle.","startTime":1094.4,"endTime":1099.2666666666667,"audioSegment":0},{"text":"For public distribution, contribute the same items/ content to the Gilde repository —","startTime":1099.2666666666667,"endTime":1104.1333333333332,"audioSegment":0},{"text":"the catalog and a .gezapp share the layout, so a private app can graduate to the public collection without restructuring.","startTime":1104.1333333333332,"endTime":1109,"audioSegment":0},{"text":"An AI agent building an app should work the same loop a person does,","startTime":1109,"endTime":1112.0454545454545,"audioSegment":0},{"text":"with the machine-readable ends of it:","startTime":1112.0454545454545,"endTime":1115.090909090909,"audioSegment":0},{"text":"gezel app schemas --out schemas (or --json) — the JSON Schemas for every catalog content file plus the packed and source gezapp manifests,","startTime":1115.090909090909,"endTime":1118.1363636363637,"audioSegment":0},{"text":"rendered live from the running build so they can never be stale.","startTime":1118.1363636363637,"endTime":1121.1818181818182,"audioSegment":0},{"text":"gezel app validate <folder> --json — the findings list with stable rule ids;","startTime":1121.1818181818182,"endTime":1124.2272727272727,"audioSegment":0},{"text":"fix and re-run until ok is true, then pack.","startTime":1124.2272727272727,"endTime":1127.2727272727273,"audioSegment":0},{"text":"examples/apps — three complete source folders of graded complexity,","startTime":1127.2727272727273,"endTime":1130.3181818181818,"audioSegment":0},{"text":"each kept working against the real service by the repository's test suite.","startTime":1130.3181818181818,"endTime":1133.3636363636363,"audioSegment":0},{"text":"gezel app new —","startTime":1133.3636363636363,"endTime":1136.409090909091,"audioSegment":0},{"text":"a guaranteed-valid starting shape when no sample is at hand.","startTime":1136.409090909091,"endTime":1139.4545454545455,"audioSegment":0},{"text":"Use this brief when asking an LLM to build an app:","startTime":1139.4545454545455,"endTime":1142.5,"audioSegment":0},{"text":"Build a Gezel app for [person and task].","startTime":1142.5,"endTime":1145.5454545454545,"audioSegment":0},{"text":"Read Building AI Apps inside Gezel, Using the Gezel page APIs,","startTime":1145.5454545454545,"endTime":1148.590909090909,"audioSegment":0},{"text":"and the Gezel app page style guide first.","startTime":1148.590909090909,"endTime":1151.6363636363637,"audioSegment":0},{"text":"Choose public Gilde content or a private .gezapp source folder.","startTime":1151.6363636363637,"endTime":1154.6818181818182,"audioSegment":0},{"text":"State the user flow, authoritative files and schemas,","startTime":1154.6818181818182,"endTime":1157.7272727272727,"audioSegment":0},{"text":"read/write permissions, crew responsibilities, and completion criteria.","startTime":1157.7272727272727,"endTime":1160.7727272727273,"audioSegment":0},{"text":"Reuse existing APIs, roles, and craftbooks.","startTime":1160.7727272727273,"endTime":1163.8181818181818,"audioSegment":0},{"text":"Implement only the components this app needs.","startTime":1163.8181818181818,"endTime":1166.8636363636363,"audioSegment":0},{"text":"Use shared fonts and window.gezel, deterministic scripts for actions,","startTime":1166.8636363636363,"endTime":1169.909090909091,"audioSegment":0},{"text":"and gated craftbooks for repeatable work.","startTime":1169.909090909091,"endTime":1172.9545454545455,"audioSegment":0},{"text":"Include labeled standalone samples where required,","startTime":1172.9545454545455,"endTime":1176,"audioSegment":0},{"text":"but never use samples after a live failure.","startTime":1176,"endTime":1179.0454545454545,"audioSegment":0},{"text":"Validate against the installed schemas, test the main flow in a real host,","startTime":1179.0454545454545,"endTime":1182.090909090909,"audioSegment":0},{"text":"and report supported modes, remaining limitations, and the release/install step needed to use it.","startTime":1182.090909090909,"endTime":1185.1363636363637,"audioSegment":0},{"text":"Before handing over the app:","startTime":1185.1363636363637,"endTime":1188.1818181818182,"audioSegment":0},{"text":"Validate the source or Gilde payload,","startTime":1188.1818181818182,"endTime":1191.2272727272727,"audioSegment":0},{"text":"including every referenced role, craftbook, script, page, and seed.","startTime":1191.2272727272727,"endTime":1194.2727272727273,"audioSegment":0},{"text":"Keep generated and authored files distinct.","startTime":1194.2727272727273,"endTime":1197.3181818181818,"audioSegment":0},{"text":"Create or apply the app in an isolated test project.","startTime":1197.3181818181818,"endTime":1200.3636363636363,"audioSegment":0},{"text":"Verify the actual folder binding, permission denials, and every state-changing action.","startTime":1200.3636363636363,"endTime":1203.409090909091,"audioSegment":0},{"text":"A folder explorer must leave originals unchanged.","startTime":1203.409090909091,"endTime":1206.4545454545455,"audioSegment":0},{"text":"Exercise the main craftbook with representative inputs and confirm its outputs and gates.","startTime":1206.4545454545455,"endTime":1209.5,"audioSegment":0},{"text":"Check disabled/consent-required schedules without silently arming them.","startTime":1209.5,"endTime":1212.5454545454545,"audioSegment":0},{"text":"Test the page's live and standalone flows, light/dark themes, keyboard navigation,","startTime":1212.5454545454545,"endTime":1215.590909090909,"audioSegment":0},{"text":"narrow layout, empty content, unavailable capabilities, and failed actions.","startTime":1215.590909090909,"endTime":1218.6363636363637,"audioSegment":0},{"text":"Dispose watches and media players.","startTime":1218.6363636363637,"endTime":1221.6818181818182,"audioSegment":0},{"text":"A page with a conversation gets a sample conversation for its demo;","startTime":1221.6818181818182,"endTime":1224.7272727272727,"audioSegment":0},{"text":"then ask the real crew lead the same suggestions on a small local model, so the demo never promises what the app cannot do.","startTime":1224.7272727272727,"endTime":1227.7727272727273,"audioSegment":0},{"text":"If upgrading, apply the new version to a project made with the old one (gezel app apply <id>,","startTime":1227.7727272727273,"endTime":1230.8181818181818,"audioSegment":0},{"text":"or gezel app status to see what is on offer) and confirm its data still loads.","startTime":1230.8181818181818,"endTime":1233.8636363636363,"audioSegment":0},{"text":"Document any unsupported migration rather than overwriting data as a convenience.","startTime":1233.8636363636363,"endTime":1236.909090909091,"audioSegment":0},{"text":"Report what shipped, what was tested, which host modes are supported,","startTime":1236.909090909091,"endTime":1239.9545454545455,"audioSegment":0},{"text":"and whether the normal app consumes the new catalog version yet.","startTime":1239.9545454545455,"endTime":1243,"audioSegment":0},{"text":"The authoring loop above is real,","startTime":1243,"endTime":1246.578947368421,"audioSegment":0},{"text":"but the surrounding lifecycle still has gaps:","startTime":1246.578947368421,"endTime":1250.157894736842,"audioSegment":0},{"text":"Gap What is needed","startTime":1250.157894736842,"endTime":1253.7368421052631,"audioSegment":0},{"text":"Project-to-app export Export packages the catalog definition; a diff-and-review flow that turns organic project changes (edited scripts,","startTime":1253.7368421052631,"endTime":1257.3157894736842,"audioSegment":0},{"text":"new craftbooks, a redesigned page) into a new version does not exist yet","startTime":1257.3157894736842,"endTime":1260.8947368421052,"audioSegment":0},{"text":"Import interface The desktop app still routes import through project artifacts and model tools;","startTime":1260.8947368421052,"endTime":1264.4736842105262,"audioSegment":0},{"text":"file picking, bundle review, and conflict handling belong in the UI the way the CLI already has them","startTime":1264.4736842105262,"endTime":1268.0526315789473,"audioSegment":0},{"text":"Updates and drift Updates keep the person's data, edits and settings,","startTime":1268.0526315789473,"endTime":1271.6315789473683,"audioSegment":0},{"text":"and an edited script is saved before it is replaced; there is no three-way merge of an edited script yet","startTime":1271.6315789473683,"endTime":1275.2105263157894,"audioSegment":0},{"text":"Schema evolution App data-version declarations and migrations,","startTime":1275.2105263157894,"endTime":1278.7894736842106,"audioSegment":0},{"text":"so an existing project can cross a major version, plus backup and rollback for custom records","startTime":1278.7894736842106,"endTime":1282.3684210526317,"audioSegment":0},{"text":"Dashboard surface First-class page templates, an in-app development preview,","startTime":1282.3684210526317,"endTime":1285.9473684210527,"audioSegment":0},{"text":"diagnostics, and possibly more than one app-owned project tab","startTime":1285.9473684210527,"endTime":1289.5263157894738,"audioSegment":0},{"text":"Craftbook test harness test.json sidecars are validated at authoring time,","startTime":1289.5263157894738,"endTime":1293.1052631578948,"audioSegment":0},{"text":"but the eval harness does not yet run an installed app's craftbook tests","startTime":1293.1052631578948,"endTime":1296.6842105263158,"audioSegment":0},{"text":"Signing and registries v1 signature status is unsigned;","startTime":1296.6842105263158,"endTime":1300.2631578947369,"audioSegment":0},{"text":"a signing story and a private registry path alongside public Gilde contributions","startTime":1300.2631578947369,"endTime":1303.842105263158,"audioSegment":0},{"text":"Until those close, treat the source folder as the canonical form of an AI App: Gilde for public distribution,","startTime":1303.842105263158,"endTime":1307.421052631579,"audioSegment":0},{"text":".gezapp for controlled sharing, and ordinary projects for prototypes whose composition is still changing.","startTime":1307.421052631579,"endTime":1311,"audioSegment":0},{"text":"A project type can ship pages/index.html with relative JavaScript, CSS, and assets.","startTime":1311,"endTime":1315.125,"audioSegment":0},{"text":"Gezel hosts that page in the project's Output pane and injects window.gezel before its scripts run.","startTime":1315.125,"endTime":1319.25,"audioSegment":0},{"text":"You build a normal browser interface; Gezel supplies project identity,","startTime":1319.25,"endTime":1323.375,"audioSegment":0},{"text":"scoped file access, declared actions, and the theme.","startTime":1323.375,"endTime":1327.5,"audioSegment":0},{"text":"You do not need a React component inside the desktop shell or a new service for each app.","startTime":1327.5,"endTime":1331.625,"audioSegment":0},{"text":"Read Building AI Apps inside Gezel for the whole app and the app page style guide for injected fonts and page-owned styles.","startTime":1331.625,"endTime":1335.75,"audioSegment":0},{"text":"The complete Output Pane API reference owns method signatures, error codes, permissions, limits,","startTime":1335.75,"endTime":1339.875,"audioSegment":0},{"text":"and compatibility; the typed API is exported as @bendyline/gezel-sdk/page for authoring tools.","startTime":1339.875,"endTime":1344,"audioSegment":0},{"text":"This is a pages block inside a project type's version manifest: { \"pages\": {","startTime":1344,"endTime":1346.8235294117646,"audioSegment":0},{"text":"\"entry\": \"index.html\", \"api\": 1, \"reads\": [","startTime":1346.8235294117646,"endTime":1349.6470588235295,"audioSegment":0},{"text":"{ \"source\": \"workspace\", \"path\": \"media\", \"subtree\": true },","startTime":1349.6470588235295,"endTime":1352.4705882352941,"audioSegment":0},{"text":"{ \"source\": \"artifacts\", \"path\": \"summary.json\" } ],","startTime":1352.4705882352941,"endTime":1355.2941176470588,"audioSegment":0},{"text":"\"tools\": [\"page_refresh_summary\"] } }","startTime":1355.2941176470588,"endTime":1358.1176470588234,"audioSegment":0},{"text":"The entry is relative to pages/.","startTime":1358.1176470588234,"endTime":1360.9411764705883,"audioSegment":0},{"text":"Reads are project-relative; workspace and artifacts are different trees.","startTime":1360.9411764705883,"endTime":1363.764705882353,"audioSegment":0},{"text":"An exact-file grant does not grant the surrounding directory.","startTime":1363.764705882353,"endTime":1366.5882352941176,"audioSegment":0},{"text":"A folder explorer can deliberately grant {\"source\":\"workspace\",\"path\":\".\",\"subtree\":true} for the whole selected project folder.","startTime":1366.5882352941176,"endTime":1369.4117647058824,"audioSegment":0},{"text":"The host checks the grants and path containment.","startTime":1369.4117647058824,"endTime":1372.235294117647,"audioSegment":0},{"text":"It binds the project;","startTime":1372.235294117647,"endTime":1375.0588235294117,"audioSegment":0},{"text":"a page never supplies its own project id to escape that boundary.","startTime":1375.0588235294117,"endTime":1377.8823529411766,"audioSegment":0},{"text":"Every pages.tools name must also be declared in the type's tools array.","startTime":1377.8823529411766,"endTime":1380.7058823529412,"audioSegment":0},{"text":"Those names are page-only: they are removed from the model's tool roster.","startTime":1380.7058823529412,"endTime":1383.5294117647059,"audioSegment":0},{"text":"If both the page and the model need an action,","startTime":1383.5294117647059,"endTime":1386.3529411764705,"audioSegment":0},{"text":"declare two tool names sharing the same script and bound operation.","startTime":1386.3529411764705,"endTime":1389.1764705882354,"audioSegment":0},{"text":"A declared action still needs the script's capabilities and the user's project policy to permit it.","startTime":1389.1764705882354,"endTime":1392,"audioSegment":0},{"text":"Job API Important behavior","startTime":1392,"endTime":1394.388888888889,"audioSegment":0},{"text":"Identify the app instance gezel.page Type name,","startTime":1394.388888888889,"endTime":1396.7777777777778,"audioSegment":0},{"text":"params, project id, API version, and host mode","startTime":1396.7777777777778,"endTime":1399.1666666666667,"audioSegment":0},{"text":"List a folder gezel.data.list(path, opts?) One directory at a time;","startTime":1399.1666666666667,"endTime":1401.5555555555557,"audioSegment":0},{"text":"recursion and scan bounds belong to the page","startTime":1401.5555555555557,"endTime":1403.9444444444443,"audioSegment":0},{"text":"Read small state gezel.data.read(path, opts?) JSON, text, or bytes; bounded reads","startTime":1403.9444444444443,"endTime":1406.3333333333333,"audioSegment":0},{"text":"Follow changes gezel.data.watch(path, callback, opts?) Callback signals a change;","startTime":1406.3333333333333,"endTime":1408.7222222222222,"audioSegment":0},{"text":"re-read the data; retain the unsubscribe function","startTime":1408.7222222222222,"endTime":1411.111111111111,"audioSegment":0},{"text":"Display media gezel.data.url(path, opts?) Assign to an image/audio/video element;","startTime":1411.111111111111,"endTime":1413.5,"audioSegment":0},{"text":"hosted media can stream and seek","startTime":1413.5,"endTime":1415.888888888889,"audioSegment":0},{"text":"Open the original in Gezel gezel.data.open(path,","startTime":1415.888888888889,"endTime":1418.2777777777778,"audioSegment":0},{"text":"opts?) Navigates to the existing file rendition in embedded mode","startTime":1418.2777777777778,"endTime":1420.6666666666667,"audioSegment":0},{"text":"Render a consistent file tile or row gezel.ui.components.fileCard(mount,","startTime":1420.6666666666667,"endTime":1423.0555555555557,"audioSegment":0},{"text":"options) Thumbnail/fallback, metadata, keyboard action and existing file viewer","startTime":1423.0555555555557,"endTime":1425.4444444444443,"audioSegment":0},{"text":"Add files with a picker or drop gezel.ui.components.fileAdder(mount,","startTime":1425.4444444444443,"endTime":1427.8333333333333,"audioSegment":0},{"text":"options) Explicit destination, progress, cancellation and per-file results","startTime":1427.8333333333333,"endTime":1430.2222222222222,"audioSegment":0},{"text":"Discover upload destinations gezel.data.importTargets() Manifest targets plus current write permission","startTime":1430.2222222222222,"endTime":1432.611111111111,"audioSegment":0},{"text":"Copy selected files into a destination gezel.data.importFiles(files,","startTime":1432.611111111111,"endTime":1435,"audioSegment":0},{"text":"options) Scoped, create-only uploads; returns saved paths and partial failures","startTime":1435,"endTime":1437.388888888889,"audioSegment":0},{"text":"Find indexed datasets gezel.tables.list() Only tables whose source files are within the page's readable scope","startTime":1437.388888888889,"endTime":1439.7777777777778,"audioSegment":0},{"text":"Inspect columns gezel.tables.describe(tableName) Column types and available metadata","startTime":1439.7777777777778,"endTime":1442.1666666666667,"audioSegment":0},{"text":"Summarize or chart data gezel.tables.query(sql, opts?) Bounded,","startTime":1442.1666666666667,"endTime":1444.5555555555557,"audioSegment":0},{"text":"read-only DuckDB queries over permitted indexed tables","startTime":1444.5555555555557,"endTime":1446.9444444444443,"audioSegment":0},{"text":"Change state or run an action gezel.tools.invoke(name, input?) Schema-validated, declared script-backed action","startTime":1446.9444444444443,"endTime":1449.3333333333333,"audioSegment":0},{"text":"Follow the host theme gezel.ui.theme,","startTime":1449.3333333333333,"endTime":1451.7222222222222,"audioSegment":0},{"text":"gezel.ui.onTheme(callback) Apply at boot and keep the unsubscribe function","startTime":1451.7222222222222,"endTime":1454.111111111111,"audioSegment":0},{"text":"Use the existing file rendition instead of rebuilding a spreadsheet or CSV editor in your page.","startTime":1454.111111111111,"endTime":1456.5,"audioSegment":0},{"text":"Use the shared query API instead of bundling DuckDB or fetching observation storage files.","startTime":1456.5,"endTime":1458.888888888889,"audioSegment":0},{"text":"Tables describe an indexed snapshot: listing a CSV does not guarantee a table is ready.","startTime":1458.888888888889,"endTime":1461.2777777777778,"audioSegment":0},{"text":"Handle missing indexing and unavailable query engines explicitly.","startTime":1461.2777777777778,"endTime":1463.6666666666667,"audioSegment":0},{"text":"For a simple live list, wire a change signal to a fresh read,","startTime":1463.6666666666667,"endTime":1466.0555555555557,"audioSegment":0},{"text":"and treat filenames as text:","startTime":1466.0555555555557,"endTime":1468.4444444444443,"audioSegment":0},{"text":"// Use the injected host or initialize sample handlers through the demo bootstrap.","startTime":1468.4444444444443,"endTime":1470.8333333333333,"audioSegment":0},{"text":"const list = document.querySelector('#files');","startTime":1470.8333333333333,"endTime":1473.2222222222222,"audioSegment":0},{"text":"const status = document.querySelector('#status');","startTime":1473.2222222222222,"endTime":1475.611111111111,"audioSegment":0},{"text":"let revision = 0;","startTime":1475.611111111111,"endTime":1478,"audioSegment":0},{"text":"async function refresh() {","startTime":1478,"endTime":1480.388888888889,"audioSegment":0},{"text":"const request = ++revision; try {","startTime":1480.388888888889,"endTime":1482.7777777777778,"audioSegment":0},{"text":"const entries = await gezel.data.list('media');","startTime":1482.7777777777778,"endTime":1485.1666666666667,"audioSegment":0},{"text":"if (request !== revision) return;","startTime":1485.1666666666667,"endTime":1487.5555555555557,"audioSegment":0},{"text":"list.replaceChildren(...entries.map((entry) => {","startTime":1487.5555555555557,"endTime":1489.9444444444443,"audioSegment":0},{"text":"const row = document.createElement('li');","startTime":1489.9444444444443,"endTime":1492.3333333333333,"audioSegment":0},{"text":"row.textContent = entry.name; return row; }));","startTime":1492.3333333333333,"endTime":1494.7222222222222,"audioSegment":0},{"text":"status.textContent = entries.length ?","startTime":1494.7222222222222,"endTime":1497.111111111111,"audioSegment":0},{"text":"`${entries.length} items` : 'This folder is empty.';","startTime":1497.111111111111,"endTime":1499.5,"audioSegment":0},{"text":"} catch (error) {","startTime":1499.5,"endTime":1501.888888888889,"audioSegment":0},{"text":"if (request === revision) status.textContent = `Could not read this folder: ${error.message}`; } }","startTime":1501.888888888889,"endTime":1504.2777777777778,"audioSegment":0},{"text":"const stop = gezel.data.watch('media', refresh, { intervalMs: 15000 });","startTime":1504.2777777777778,"endTime":1506.6666666666667,"audioSegment":0},{"text":"window.addEventListener('pagehide', () => { r
