nowledge commands let you turn Markdown into a portable .gezk catalog,","startTime":0,"endTime":3.2,"audioSegment":0},{"text":"inspect and search an existing archive, and manage the reference catalogs installed in your Gezel home.","startTime":3.2,"endTime":6.4,"audioSegment":0},{"text":"For the storage and retrieval design, see How knowledge works in Gezel.","startTime":6.4,"endTime":9.600000000000001,"audioSegment":0},{"text":"The open format, including its versioned specifications and independent reader,","startTime":9.600000000000001,"endTime":12.8,"audioSegment":0},{"text":"lives in bendyline/gezk.","startTime":12.8,"endTime":16,"audioSegment":0},{"text":"Install the CLI with Node.js 24 or newer:","startTime":16,"endTime":18.240000000000002,"audioSegment":0},{"text":"npm install -g @bendyline/gezel-cli","startTime":18.240000000000002,"endTime":20.48,"audioSegment":0},{"text":"gezel knowledge --help","startTime":20.48,"endTime":22.72,"audioSegment":0},{"text":"Building a catalog and adding --semantic to file search need the optional embedding runtime.","startTime":22.72,"endTime":24.96,"audioSegment":0},{"text":"The desktop app includes it.","startTime":24.96,"endTime":27.200000000000003,"audioSegment":0},{"text":"For a global npm CLI installation,","startTime":27.200000000000003,"endTime":29.44,"audioSegment":0},{"text":"add it in the same installation context:","startTime":29.44,"endTime":31.68,"audioSegment":0},{"text":"npm install -g @huggingface/transformers@^4.3.1","startTime":31.68,"endTime":33.92,"audioSegment":0},{"text":"For a project-local CLI installation,","startTime":33.92,"endTime":36.160000000000004,"audioSegment":0},{"text":"install both packages in that project and run commands with npx -p @bendyline/gezel-cli gezel.","startTime":36.160000000000004,"endTime":38.400000000000006,"audioSegment":0},{"text":"Plain keyword search, inspection, validation,","startTime":38.400000000000006,"endTime":40.64,"audioSegment":0},{"text":"and location discovery do not need the embedding model.","startTime":40.64,"endTime":42.88,"audioSegment":0},{"text":"Building and semantic search can download the profile's pinned model on first use;","startTime":42.88,"endTime":45.120000000000005,"audioSegment":0},{"text":"later runs can work offline from its cache.","startTime":45.120000000000005,"endTime":47.36,"audioSegment":0},{"text":"By default, the CLI cache is <GEZEL_HOME>/engines/hf-cache, or ~/.gezel/engines/hf-cache; GEZEL_HF_CACHE_DIR overrides it.","startTime":47.36,"endTime":49.6,"audioSegment":0},{"text":"There are two command groups:","startTime":49.6,"endTime":51.84,"audioSegment":0},{"text":"Commands Connection","startTime":51.84,"endTime":54.080000000000005,"audioSegment":0},{"text":"init, build, inspect, validate, search, nearby,","startTime":54.080000000000005,"endTime":56.32000000000001,"audioSegment":0},{"text":"export-parquet Work on files without the Gezel daemon","startTime":56.32000000000001,"endTime":58.56,"audioSegment":0},{"text":"available, install, list, find,","startTime":58.56,"endTime":60.800000000000004,"audioSegment":0},{"text":"remove Connect to your user daemon and can start it when absent","startTime":60.800000000000004,"endTime":63.040000000000006,"audioSegment":0},{"text":"File commands operate on a named source folder, archive, or extracted catalog.","startTime":63.040000000000006,"endTime":65.28,"audioSegment":0},{"text":"Installed-catalog commands use the daemon's registry.","startTime":65.28,"endTime":67.52000000000001,"audioSegment":0},{"text":"The general CLI reference explains home selection,","startTime":67.52000000000001,"endTime":69.76,"audioSegment":0},{"text":"local discovery, and explicit external connections.","startTime":69.76,"endTime":72,"audioSegment":0},{"text":"This example creates a catalog called team-guide:","startTime":72,"endTime":73.97297297297297,"audioSegment":0},{"text":"gezel knowledge init ./team-guide","startTime":73.97297297297297,"endTime":75.94594594594595,"audioSegment":0},{"text":"The new folder contains catalog.json and a sample Markdown document under content/.","startTime":75.94594594594595,"endTime":77.91891891891892,"audioSegment":0},{"text":"Replace the sample with your reference material, and edit the catalog identity,","startTime":77.91891891891892,"endTime":79.89189189189189,"audioSegment":0},{"text":"publisher, language, and license before distributing it. team-guide/ catalog.json content/","startTime":79.89189189189189,"endTime":81.86486486486487,"audioSegment":0},{"text":"Getting Started/ welcome.md Policies/ expenses.md","startTime":81.86486486486487,"endTime":83.83783783783784,"audioSegment":0},{"text":"writing-style.md","startTime":83.83783783783784,"endTime":85.8108108108108,"audioSegment":0},{"text":"A complete configuration might be: {","startTime":85.8108108108108,"endTime":87.78378378378379,"audioSegment":0},{"text":"\"id\": \"team-guide\",","startTime":87.78378378378379,"endTime":89.75675675675676,"audioSegment":0},{"text":"\"version\": \"1.0.0\",","startTime":89.75675675675676,"endTime":91.72972972972973,"audioSegment":0},{"text":"\"name\": \"Team Guide\",","startTime":91.72972972972973,"endTime":93.70270270270271,"audioSegment":0},{"text":"\"description\": \"Our working practices and policies.\",","startTime":93.70270270270271,"endTime":95.67567567567568,"audioSegment":0},{"text":"\"language\": \"en\",","startTime":95.67567567567568,"endTime":97.64864864864865,"audioSegment":0},{"text":"\"publisher\": { \"id\": \"example-team\", \"name\": \"Example Team\" },","startTime":97.64864864864865,"endTime":99.62162162162161,"audioSegment":0},{"text":"\"license\": { \"name\": \"All rights reserved\", \"attributionRequired\": false },","startTime":99.62162162162161,"endTime":101.5945945945946,"audioSegment":0},{"text":"\"profile\": \"bge-small-en-v1.5@1\",","startTime":101.5945945945946,"endTime":103.56756756756756,"audioSegment":0},{"text":"\"createdAt\": \"2026-10-05T00:00:00.000Z\" }","startTime":103.56756756756756,"endTime":105.54054054054055,"audioSegment":0},{"text":"createdAt is optional;","startTime":105.54054054054055,"endTime":107.51351351351352,"audioSegment":0},{"text":"pin it when you want repeat builds from identical inputs to retain the same declared timestamp.","startTime":107.51351351351352,"endTime":109.48648648648648,"audioSegment":0},{"text":"The license describes your content,","startTime":109.48648648648648,"endTime":111.45945945945945,"audioSegment":0},{"text":"so replace the example with the terms that apply to your documents.","startTime":111.45945945945945,"endTime":113.43243243243244,"audioSegment":0},{"text":"Build, check, and search the archive:","startTime":113.43243243243244,"endTime":115.4054054054054,"audioSegment":0},{"text":"gezel knowledge build ./team-guide","startTime":115.4054054054054,"endTime":117.37837837837839,"audioSegment":0},{"text":"gezel knowledge inspect ./team-guide/team-guide-1.0.0.gezk","startTime":117.37837837837839,"endTime":119.35135135135135,"audioSegment":0},{"text":"gezel knowledge validate ./team-guide/team-guide-1.0.0.gezk --deep","startTime":119.35135135135135,"endTime":121.32432432432432,"audioSegment":0},{"text":"gezel knowledge search ./team-guide/team-guide-1.0.0.gezk \"expenses\"","startTime":121.32432432432432,"endTime":123.29729729729729,"audioSegment":0},{"text":"gezel knowledge search ./team-guide/team-guide-1.0.0.gezk \"How do I claim travel costs?\" --semantic","startTime":123.29729729729729,"endTime":125.27027027027027,"audioSegment":0},{"text":"The default output is <dir>/<id>-<version>.gezk.","startTime":125.27027027027027,"endTime":127.24324324324324,"audioSegment":0},{"text":"The build reports document, chunk, shard, and archive-size counts.","startTime":127.24324324324324,"endTime":129.21621621621622,"audioSegment":0},{"text":"Search prints document and passage references as knowledge:// URIs.","startTime":129.21621621621622,"endTime":131.1891891891892,"audioSegment":0},{"text":"Once the checks pass, install it:","startTime":131.1891891891892,"endTime":133.16216216216216,"audioSegment":0},{"text":"gezel knowledge install ./team-guide/team-guide-1.0.0.gezk","startTime":133.16216216216216,"endTime":135.13513513513513,"audioSegment":0},{"text":"gezel knowledge list","startTime":135.13513513513513,"endTime":137.10810810810813,"audioSegment":0},{"text":"gezel knowledge find \"How do I claim travel costs?\"","startTime":137.10810810810813,"endTime":139.0810810810811,"audioSegment":0},{"text":"Install enables the catalog for search.","startTime":139.0810810810811,"endTime":141.05405405405406,"audioSegment":0},{"text":"A project's catalog policy can still select a narrower set or switch reference catalogs off.","startTime":141.05405405405406,"endTime":143.02702702702703,"audioSegment":0},{"text":"Use the Knowledge settings and project settings to control that selection.","startTime":143.02702702702703,"endTime":145,"audioSegment":0},{"text":"You can initialize a folder that already contains Markdown:","startTime":145,"endTime":148.01960784313727,"audioSegment":0},{"text":"gezel knowledge init ./existing-docs","startTime":148.01960784313727,"endTime":151.0392156862745,"audioSegment":0},{"text":"gezel knowledge build ./existing-docs --out ./existing-docs.gezk","startTime":151.0392156862745,"endTime":154.05882352941177,"audioSegment":0},{"text":"init creates catalog.json without inserting a sample content/ folder when it detects an existing Markdown tree.","startTime":154.05882352941177,"endTime":157.078431372549,"audioSegment":0},{"text":"It refuses to overwrite an existing catalog.json.","startTime":157.078431372549,"endTime":160.09803921568627,"audioSegment":0},{"text":"For a text-only catalog, run gezel knowledge build ./existing-docs --skip-images.","startTime":160.09803921568627,"endTime":163.11764705882354,"audioSegment":0},{"text":"With the BGE and E5 profiles, images are bundled for display only;","startTime":163.11764705882354,"endTime":166.13725490196077,"audioSegment":0},{"text":"the text embedding model does not read them.","startTime":166.13725490196077,"endTime":169.15686274509804,"audioSegment":0},{"text":"--skip-images keeps the alt text of images, video and audio without resolving or reading the files,","startTime":169.15686274509804,"endTime":172.1764705882353,"audioSegment":0},{"text":"avoiding the catalog's asset limits (8 MiB per image and 256 MiB of images in total; 512 MiB per video or audio file and 8 GiB in total).","startTime":172.1764705882353,"endTime":175.19607843137254,"audioSegment":0},{"text":"For a larger illustrated collection, split it into multiple catalogs.","startTime":175.19607843137254,"endTime":178.2156862745098,"audioSegment":0},{"text":"With the embeddinggemma-2-512@1 profile, the build also makes photos,","startTime":178.2156862745098,"endTime":181.23529411764707,"audioSegment":0},{"text":"video and recordings searchable by what is in them.","startTime":181.23529411764707,"endTime":184.2549019607843,"audioSegment":0},{"text":"Reference them like images — ![A brass bell ringing](sounds/bell.mp3) or ![Planing a board](clips/plane.mp4) —","startTime":184.2549019607843,"endTime":187.27450980392157,"audioSegment":0},{"text":"and each photo becomes one searchable entry, each 30-second window of a clip or recording another.","startTime":187.27450980392157,"endTime":190.29411764705884,"audioSegment":0},{"text":"The alt text, the paragraph around the reference,","startTime":190.29411764705884,"endTime":193.31372549019608,"audioSegment":0},{"text":"the file name and the document title become that entry's text, so keyword search finds it too.","startTime":193.31372549019608,"endTime":196.33333333333331,"audioSegment":0},{"text":"Video and audio need ffmpeg (GEZEL_FFMPEG, SQUISQ_FFMPEG, or on PATH);","startTime":196.33333333333331,"endTime":199.35294117647058,"audioSegment":0},{"text":"without it the files are still bundled but get no entries, and the build says so.","startTime":199.35294117647058,"endTime":202.37254901960785,"audioSegment":0},{"text":"Shipped media usually carries its own terms,","startTime":202.37254901960785,"endTime":205.39215686274508,"audioSegment":0},{"text":"so record them per file in catalog.json: {","startTime":205.39215686274508,"endTime":208.41176470588235,"audioSegment":0},{"text":"\"profile\": \"embeddinggemma-2-512@1\", \"assets\": {","startTime":208.41176470588235,"endTime":211.4313725490196,"audioSegment":0},{"text":"\"sounds/bell.mp3\": { \"license\": \"CC0-1.0\", \"author\": \"Field recordist\", \"source\": \"https://example.org/bell\" } } }","startTime":211.4313725490196,"endTime":214.45098039215685,"audioSegment":0},{"text":"Readers show that credit beside the entry.","startTime":214.45098039215685,"endTime":217.47058823529412,"audioSegment":0},{"text":"Keys are paths relative to the content root (or the archive path, assets/…).","startTime":217.47058823529412,"endTime":220.49019607843138,"audioSegment":0},{"text":"The build warns and skips images with mismatched or unrecognized file data,","startTime":220.49019607843138,"endTime":223.50980392156862,"audioSegment":0},{"text":"images over the per-file size limit, and unsafe SVGs.","startTime":223.50980392156862,"endTime":226.52941176470588,"audioSegment":0},{"text":"References to a skipped image become their alt text (or link label),","startTime":226.52941176470588,"endTime":229.54901960784315,"audioSegment":0},{"text":"preserving the surrounding document.","startTime":229.54901960784315,"endTime":232.5686274509804,"audioSegment":0},{"text":"Valid images are still included, and source files are unchanged.","startTime":232.5686274509804,"endTime":235.58823529411765,"audioSegment":0},{"text":"The build locates content in this order: the explicit content setting;","startTime":235.58823529411765,"endTime":238.60784313725492,"audioSegment":0},{"text":"a content/ subfolder; an applicable MkDocs docs_dir; otherwise the catalog folder itself.","startTime":238.60784313725492,"endTime":241.62745098039215,"audioSegment":0},{"text":"It detects common table-of-contents formats, or uses folders as topics.","startTime":241.62745098039215,"endTime":244.6470588235294,"audioSegment":0},{"text":"Supported outlines include GitBook SUMMARY.md, MkDocs nav,","startTime":244.6470588235294,"endTime":247.66666666666666,"audioSegment":0},{"text":"Jupyter Book _toc.yml, DocFX toc.yml, and Hugo _index.md conventions.","startTime":247.66666666666666,"endTime":250.68627450980392,"audioSegment":0},{"text":"You can make the selection explicit in catalog.json: {","startTime":250.68627450980392,"endTime":253.70588235294116,"audioSegment":0},{"text":"\"content\": \"docs\",","startTime":253.70588235294116,"endTime":256.72549019607845,"audioSegment":0},{"text":"\"ignore\": [\"draft.md\"],","startTime":256.72549019607845,"endTime":259.7450980392157,"audioSegment":0},{"text":"\"toc\": { \"format\": \"gitbook\", \"path\": \"SUMMARY.md\" } }","startTime":259.7450980392157,"endTime":262.7647058823529,"audioSegment":0},{"text":"These are additional fields in the complete configuration,","startTime":262.7647058823529,"endTime":265.78431372549016,"audioSegment":0},{"text":"not a replacement for its required identity fields.","startTime":265.78431372549016,"endTime":268.80392156862746,"audioSegment":0},{"text":"content is relative to the catalog folder;","startTime":268.80392156862746,"endTime":271.8235294117647,"audioSegment":0},{"text":"ignore names Markdown files relative to the content root.","startTime":271.8235294117647,"endTime":274.843137254902,"audioSegment":0},{"text":"An explicit TOC path is resolved from the content root.","startTime":274.843137254902,"endTime":277.8627450980392,"audioSegment":0},{"text":"Without a TOC file,","startTime":277.8627450980392,"endTime":280.88235294117646,"audioSegment":0},{"text":"use \"toc\": { \"format\": \"folders\" } to request folder-based organization.","startTime":280.88235294117646,"endTime":283.9019607843137,"audioSegment":0},{"text":"Choose an embedding profile appropriate to the documents: bge-small-en-v1.5@1 for the default English build, multilingual-e5-small@2 for multilingual retrieval,","startTime":283.9019607843137,"endTime":286.92156862745094,"audioSegment":0},{"text":"or embeddinggemma-2-512@1 when photos, video or audio should be searchable (its catalogs use format 0.8, which older Gezel releases refuse to open rather than misread).","startTime":286.92156862745094,"endTime":289.94117647058823,"audioSegment":0},{"text":"The earlier multilingual-e5-small@1 remains supported for existing catalogs.","startTime":289.94117647058823,"endTime":292.9607843137255,"audioSegment":0},{"text":"A profile is a complete vector-space contract;","startTime":292.9607843137255,"endTime":295.98039215686276,"audioSegment":0},{"text":"changing it requires rebuilding the catalog.","startTime":295.98039215686276,"endTime":299,"audioSegment":0},{"text":"Command Arguments and options Result","startTime":299,"endTime":301.88,"audioSegment":0},{"text":"gezel knowledge init <dir> A new folder or an existing Markdown tree Create the catalog configuration and,","startTime":301.88,"endTime":304.76,"audioSegment":0},{"text":"for a new tree, sample content","startTime":304.76,"endTime":307.64,"audioSegment":0},{"text":"gezel knowledge build <dir> --out <file>, --sign-key <pemfile>,","startTime":307.64,"endTime":310.52,"audioSegment":0},{"text":"--skip-images Compile Markdown, assets, and indexes into a .gezk archive","startTime":310.52,"endTime":313.4,"audioSegment":0},{"text":"gezel knowledge inspect <path> Archive or extracted catalog directory Show manifest identity,","startTime":313.4,"endTime":316.28,"audioSegment":0},{"text":"license, counts, profiles, signature metadata, and sizes","startTime":316.28,"endTime":319.16,"audioSegment":0},{"text":"gezel knowledge validate <path> --deep Verify declared files,","startTime":319.16,"endTime":322.04,"audioSegment":0},{"text":"hashes, schema, and counts; deep mode adds database/vector checks","startTime":322.04,"endTime":324.92,"audioSegment":0},{"text":"gezel knowledge search <path> <query> --semantic, --limit <n>,","startTime":324.92,"endTime":327.8,"audioSegment":0},{"text":"optional radius options Search that file or extracted catalog; default limit 10, clamped to 1–50","startTime":327.8,"endTime":330.68,"audioSegment":0},{"text":"gezel knowledge nearby <path> Required radius options; --limit <n>,","startTime":330.68,"endTime":333.56,"audioSegment":0},{"text":"--json List subject articles near a point; default page size 50, maximum 500","startTime":333.56,"endTime":336.44,"audioSegment":0},{"text":"gezel knowledge export-parquet <path> --out <dir>,","startTime":336.44,"endTime":339.32,"audioSegment":0},{"text":"--duckdb <binary> Export catalog tables and stored embeddings using DuckDB","startTime":339.32,"endTime":342.2,"audioSegment":0},{"text":"inspect reads the manifest;","startTime":342.2,"endTime":345.08,"audioSegment":0},{"text":"it is not a full validation or signature-trust check.","startTime":345.08,"endTime":347.96,"audioSegment":0},{"text":"validate --deep checks SQLite quick_check, chunk/vector row alignment,","startTime":347.96,"endTime":350.84,"audioSegment":0},{"text":"self-neighbor search, and the catalog's declared keyword smoke queries.","startTime":350.84,"endTime":353.72,"audioSegment":0},{"text":"These structural checks do not require downloading an embedding model or prove publisher identity.","startTime":353.72,"endTime":356.6,"audioSegment":0},{"text":"File search always includes keyword search.","startTime":356.6,"endTime":359.48,"audioSegment":0},{"text":"--semantic additionally loads the catalog profile's model and prepends semantic passage hits before deduplication;","startTime":359.48,"endTime":362.36,"audioSegment":0},{"text":"it does not use the daemon's complete installed-catalog rank-fusion pipeline.","startTime":362.36,"endTime":365.24,"audioSegment":0},{"text":"If explicitly requested semantic embedding cannot run, the command reports an error.","startTime":365.24,"endTime":368.12,"audioSegment":0},{"text":"Compare it with a plain keyword search when diagnosing model availability.","startTime":368.12,"endTime":371,"audioSegment":0},{"text":"Catalogs with subject coordinates can be searched within a radius:","startTime":371,"endTime":374,"audioSegment":0},{"text":"gezel knowledge nearby ./places.gezk --latitude 52.3676 --longitude 4.9041 --radius-meters 5000 --json","startTime":374,"endTime":377,"audioSegment":0},{"text":"gezel knowledge search ./places.gezk \"museum\" --latitude 52.3676 --longitude 4.9041 --radius-meters 5000 --limit 10","startTime":377,"endTime":380,"audioSegment":0},{"text":"Pass all three options together: --latitude, --longitude, and --radius-meters.","startTime":380,"endTime":383,"audioSegment":0},{"text":"You can also add --semantic to the radius-filtered search.","startTime":383,"endTime":386,"audioSegment":0},{"text":"nearby returns subject articles ordered by distance;","startTime":386,"endTime":389,"audioSegment":0},{"text":"a document's associated places do not make it a subject match.","startTime":389,"endTime":392,"audioSegment":0},{"text":"Location support depends on metadata shipped by the producer,","startTime":392,"endTime":395,"audioSegment":0},{"text":"and a catalog without that metadata does not acquire coordinates through search.","startTime":395,"endTime":398,"audioSegment":0},{"text":"Command Arguments and options Result","startTime":398,"endTime":400.53846153846155,"audioSegment":0},{"text":"gezel knowledge available None List Gilde offerings,","startTime":400.53846153846155,"endTime":403.0769230769231,"audioSegment":0},{"text":"versions, sizes, install state, and available updates","startTime":403.0769230769231,"endTime":405.61538461538464,"audioSegment":0},{"text":"gezel knowledge install <source> Catalog id, local file,","startTime":405.61538461538464,"endTime":408.15384615384613,"audioSegment":0},{"text":"or HTTP(S) URL Install and enable the catalog, following progress until completion","startTime":408.15384615384613,"endTime":410.6923076923077,"audioSegment":0},{"text":"gezel knowledge list None Show installed versions,","startTime":410.6923076923077,"endTime":413.2307692307692,"audioSegment":0},{"text":"enabled/mounted state, quarantine reasons, and update flags","startTime":413.2307692307692,"endTime":415.7692307692308,"audioSegment":0},{"text":"gezel knowledge find <query> --limit <n>;","startTime":415.7692307692308,"endTime":418.3076923076923,"audioSegment":0},{"text":"default 10 Search installed catalogs through the daemon","startTime":418.3076923076923,"endTime":420.84615384615387,"audioSegment":0},{"text":"gezel knowledge remove <catalogId> Installed catalog id Remove your registry reference and its private catalog files","startTime":420.84615384615387,"endTime":423.38461538461536,"audioSegment":0},{"text":"For a Gilde catalog, copy its id from available:","startTime":423.38461538461536,"endTime":425.9230769230769,"audioSegment":0},{"text":"gezel knowledge available","startTime":425.9230769230769,"endTime":428.46153846153845,"audioSegment":0},{"text":"gezel knowledge install <catalog-id>","startTime":428.46153846153845,"endTime":431,"audioSegment":0},{"text":"gezel knowledge install <catalog-id> --version <version>","startTime":431,"endTime":433.53846153846155,"audioSegment":0},{"text":"gezel knowledge install <catalog-id> --private","startTime":433.53846153846155,"endTime":436.0769230769231,"audioSegment":0},{"text":"--version and --private apply only to catalog-id installs.","startTime":436.0769230769231,"endTime":438.61538461538464,"audioSegment":0},{"text":"Public catalog bytes may be shared once per machine through the engine broker;","startTime":438.61538461538464,"endTime":441.15384615384613,"audioSegment":0},{"text":"--private keeps that download in your own Gezel home.","startTime":441.15384615384613,"endTime":443.6923076923077,"audioSegment":0},{"text":"Local files and arbitrary URL imports are private already.","startTime":443.6923076923077,"endTime":446.2307692307692,"audioSegment":0},{"text":"For a URL, you can supply the expected archive SHA-256:","startTime":446.2307692307692,"endTime":448.7692307692308,"audioSegment":0},{"text":"gezel knowledge install https://example.org/team-guide-1.0.0.gezk --sha256 <64-hexadecimal-character-digest>","startTime":448.7692307692308,"endTime":451.3076923076923,"audioSegment":0},{"text":"The digest is the archive's hash, not a manifest file hash.","startTime":451.3076923076923,"endTime":453.8461538461538,"audioSegment":0},{"text":"Obtain it through a source you trust.","startTime":453.8461538461538,"endTime":456.38461538461536,"audioSegment":0},{"text":"The --sha256 option is valid only for URL installs.","startTime":456.38461538461536,"endTime":458.9230769230769,"audioSegment":0},{"text":"To update a catalog,","startTime":458.9230769230769,"endTime":461.46153846153845,"audioSegment":0},{"text":"install its catalog id again or install the replacement archive.","startTime":461.46153846153845,"endTime":464,"audioSegment":0},{"text":"There is currently no separate knowledge update command.","startTime":464,"endTime":466.53846153846155,"audioSegment":0},{"text":"available and list report newer catalog versions known to Gilde.","startTime":466.53846153846155,"endTime":469.0769230769231,"audioSegment":0},{"text":"The current CLI has no knowledge enable or knowledge disable subcommands;","startTime":469.0769230769231,"endTime":471.61538461538464,"audioSegment":0},{"text":"use Knowledge settings or the HTTP patch endpoint below.","startTime":471.61538461538464,"endTime":474.15384615384613,"audioSegment":0},{"text":"find searches your installed catalogs directly.","startTime":474.15384615384613,"endTime":476.6923076923077,"audioSegment":0},{"text":"It does not select the project for the current directory or apply that project's catalog policy.","startTime":476.6923076923077,"endTime":479.2307692307692,"audioSegment":0},{"text":"For the session-scoped search a chat uses, see the search tool.","startTime":479.2307692307692,"endTime":481.7692307692308,"audioSegment":0},{"text":"Removing a private catalog deletes the daemon's installed copy,","startTime":481.7692307692308,"endTime":484.3076923076923,"audioSegment":0},{"text":"not the original .gezk archive you supplied.","startTime":484.3076923076923,"endTime":486.8461538461538,"audioSegment":0},{"text":"Removing a shared catalog removes your reference;","startTime":486.8461538461538,"endTime":489.38461538461536,"audioSegment":0},{"text":"public shared bytes have a separate reclamation lifecycle.","startTime":489.38461538461536,"endTime":491.9230769230769,"audioSegment":0},{"text":"The bundled Handboek is managed by Gezel and cannot be removed through this command;","startTime":491.9230769230769,"endTime":494.46153846153845,"audioSegment":0},{"text":"disable it in Knowledge settings if needed.","startTime":494.46153846153845,"endTime":497,"audioSegment":0},{"text":"If you have an Ed25519 private key in PKCS#8 PEM form,","startTime":497,"endTime":499.5882352941176,"audioSegment":0},{"text":"sign at build time:","startTime":499.5882352941176,"endTime":502.1764705882353,"audioSegment":0},{"text":"gezel knowledge build ./team-guide --out ./team-guide-signed.gezk --sign-key ./publisher-key.pem","startTime":502.1764705882353,"endTime":504.7647058823529,"audioSegment":0},{"text":"The signature covers the canonical manifest,","startTime":504.7647058823529,"endTime":507.3529411764706,"audioSegment":0},{"text":"whose file list contains the payload digests.","startTime":507.3529411764706,"endTime":509.94117647058823,"audioSegment":0},{"text":"Keep the signing key separate from content you distribute.","startTime":509.94117647058823,"endTime":512.5294117647059,"audioSegment":0},{"text":"inspect reports signature presence and key id;","startTime":512.5294117647059,"endTime":515.1176470588235,"audioSegment":0},{"text":"origin verification requires a reader to verify it against a trusted public key.","startTime":515.1176470588235,"endTime":517.7058823529412,"audioSegment":0},{"text":"The format package exposes verifyManifestSignature for that purpose.","startTime":517.7058823529412,"endTime":520.2941176470588,"audioSegment":0},{"text":"For analysis in a columnar data tool, export a companion:","startTime":520.2941176470588,"endTime":522.8823529411765,"audioSegment":0},{"text":"gezel knowledge export-parquet ./team-guide-signed.gezk --out ./team-guide-parquet","startTime":522.8823529411765,"endTime":525.4705882352941,"audioSegment":0},{"text":"The command needs the DuckDB CLI installed by Gezel, a discoverable DuckDB executable,","startTime":525.4705882352941,"endTime":528.0588235294117,"audioSegment":0},{"text":"or an explicit --duckdb <binary> / GEZEL_DUCKDB_BIN.","startTime":528.0588235294117,"endTime":530.6470588235294,"audioSegment":0},{"text":"It exports topics, documents and chunks by shard, and document locations when present,","startTime":530.6470588235294,"endTime":533.2352941176471,"audioSegment":0},{"text":"with the stored int8 and binary embeddings and profile metadata.","startTime":533.2352941176471,"endTime":535.8235294117648,"audioSegment":0},{"text":"It also writes parquet-manifest.json.","startTime":535.8235294117648,"endTime":538.4117647058823,"audioSegment":0},{"text":"It does not regenerate float32 embeddings or change the .gezk archive.","startTime":538.4117647058823,"endTime":541,"audioSegment":0},{"text":"In a chat, Gezel uses search to retrieve admitted project and reference material,","startTime":541,"endTime":543.5757575757576,"audioSegment":0},{"text":"read_document to open knowledge:// citations, and knowledge_nearby for subject-location discovery.","startTime":543.5757575757576,"endTime":546.1515151515151,"audioSegment":0},{"text":"save_memory, search_memory, and list_memories manage the mutable memory sources.","startTime":546.1515151515151,"endTime":548.7272727272727,"audioSegment":0},{"text":"These tool names are distinct from CLI subcommands;","startTime":548.7272727272727,"endTime":551.3030303030303,"audioSegment":0},{"text":"there is no gezel knowledge save-memory command.","startTime":551.3030303030303,"endTime":553.8787878787879,"audioSegment":0},{"text":"For your editable shared library, list_documents, read_document, write_document,","startTime":553.8787878787879,"endTime":556.4545454545455,"audioSegment":0},{"text":"and delete_document operate on the library's original files, subject to the tool and security policy.","startTime":556.4545454545455,"endTime":559.030303030303,"audioSegment":0},{"text":"Installed catalog documents remain read-only;","startTime":559.030303030303,"endTime":561.6060606060606,"audioSegment":0},{"text":"change their source and build a new archive to publish a revision.","startTime":561.6060606060606,"endTime":564.1818181818181,"audioSegment":0},{"text":"Applications can use @bendyline/gezel-client against the authenticated user daemon.","startTime":564.1818181818181,"endTime":566.7575757575758,"audioSegment":0},{"text":"The main product endpoints are:","startTime":566.7575757575758,"endTime":569.3333333333334,"audioSegment":0},{"text":"Endpoint Purpose","startTime":569.3333333333334,"endTime":571.9090909090909,"audioSegment":0},{"text":"GET /api/knowledge/catalogs, GET /api/knowledge/available,","startTime":571.9090909090909,"endTime":574.4848484848485,"audioSegment":0},{"text":"GET /api/knowledge/updates Installed state, available catalogs, and known updates","startTime":574.4848484848485,"endTime":577.060606060606,"audioSegment":0},{"text":"POST /api/knowledge/install Start an install job and return its id","startTime":577.060606060606,"endTime":579.6363636363636,"audioSegment":0},{"text":"GET /api/knowledge/jobs/:jobId/events Subscribe to install progress as server-sent events","startTime":579.6363636363636,"endTime":582.2121212121212,"audioSegment":0},{"text":"DELETE /api/knowledge/jobs/:jobId Explicitly cancel an install","startTime":582.2121212121212,"endTime":584.7878787878788,"audioSegment":0},{"text":"PATCH /api/knowledge/catalogs/:catalogId Set enabled state with, for example, { \"enabled\": false }","startTime":584.7878787878788,"endTime":587.3636363636364,"audioSegment":0},{"text":"DELETE /api/knowledge/catalogs/:catalogId Remove an installed reference and private bytes","startTime":587.3636363636364,"endTime":589.939393939394,"audioSegment":0},{"text":"POST /api/knowledge/search, POST /api/knowledge/nearby Search or discover installed catalog documents","startTime":589.939393939394,"endTime":592.5151515151515,"audioSegment":0},{"text":"GET /api/knowledge/catalogs/:catalogId/topics Browse the shipped topic tree","startTime":592.5151515151515,"endTime":595.0909090909091,"audioSegment":0},{"text":"GET /api/knowledge/catalogs/:catalogId/documents Page document metadata","startTime":595.0909090909091,"endTime":597.6666666666666,"audioSegment":0},{"text":"GET /api/knowledge/catalogs/:catalogId/document?id=<documentId> Read a complete document","startTime":597.6666666666666,"endTime":600.2424242424242,"audioSegment":0},{"text":"GET /api/knowledge/catalogs/:catalogId/passage?id=<documentId>&chunk=<uid> Read a cited passage","startTime":600.2424242424242,"endTime":602.8181818181818,"audioSegment":0},{"text":"POST /api/memory/save, POST /api/memory/search Save and retrieve mutable memories","startTime":602.8181818181818,"endTime":605.3939393939394,"audioSegment":0},{"text":"URL-encode document ids in query parameters; they can contain slashes and Unicode.","startTime":605.3939393939394,"endTime":607.969696969697,"audioSegment":0},{"text":"Install and catalog-management routes require the first-party management boundary,","startTime":607.969696969697,"endTime":610.5454545454545,"audioSegment":0},{"text":"rather than a model session token.","startTime":610.5454545454545,"endTime":613.1212121212121,"audioSegment":0},{"text":"A progress subscriber can disconnect without cancelling an install;","startTime":613.1212121212121,"endTime":615.6969696969697,"audioSegment":0},{"text":"use the explicit cancel endpoint when that is the intended action.","startTime":615.6969696969697,"endTime":618.2727272727273,"audioSegment":0},{"text":"For an independent compiler or reader, use @bendyline/gezel-knowledge.","startTime":618.2727272727273,"endTime":620.8484848484849,"audioSegment":0},{"text":"For the schemas, citation grammar, quantization, and signature helpers, use @bendyline/gezk.","startTime":620.8484848484849,"endTime":623.4242424242424,"audioSegment":0},{"text":"The specification repository, Python reader, and conformance kit support implementations outside Gezel.","startTime":623.4242424242424,"endTime":626,"audioSegment":0}],"version":1},"startBlock":{"title":"Working with knowledge catalogs","subtitle":"The gezel knowledge commands let you turn Markdown into a portable .gezk catalog, inspect and search an existing archive, and manage the reference catalogs installed in your Gezel home. For the storage and retrieval design, see How knowledge works in Gezel. The open format, including its versioned specifications and independent reader, lives in bendyline/gezk.","ambientMotion":"zoomIn"}}</script>
