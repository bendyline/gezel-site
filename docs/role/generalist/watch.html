,"column":3,"offset":10143},"end":{"line":84,"column":12,"offset":10152}}}],"position":{"start":{"line":84,"column":1,"offset":10141},"end":{"line":84,"column":13,"offset":10153}}},{"type":"tableCell","isHeader":true,"children":[{"type":"text","value":"What it does","position":{"start":{"line":84,"column":15,"offset":10155},"end":{"line":84,"column":27,"offset":10167}}}],"position":{"start":{"line":84,"column":13,"offset":10153},"end":{"line":84,"column":29,"offset":10169}}}],"position":{"start":{"line":84,"column":1,"offset":10141},"end":{"line":84,"column":29,"offset":10169}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/build-loop/","children":[{"type":"text","value":"Build Loop","position":{"start":{"line":86,"column":4,"offset":10187},"end":{"line":86,"column":14,"offset":10197}}}],"position":{"start":{"line":86,"column":3,"offset":10186},"end":{"line":86,"column":44,"offset":10227}}}],"position":{"start":{"line":86,"column":1,"offset":10184},"end":{"line":86,"column":45,"offset":10228}}},{"type":"tableCell","children":[{"type":"text","value":"Generic make-something procedure: scope the work and lock concrete acceptance criteria, build it, evaluate the result against those criteria, and loop back to building until every criterion is met — then finish.","position":{"start":{"line":86,"column":47,"offset":10230},"end":{"line":86,"column":258,"offset":10441}}}],"position":{"start":{"line":86,"column":45,"offset":10228},"end":{"line":86,"column":260,"offset":10443}}}],"position":{"start":{"line":86,"column":1,"offset":10184},"end":{"line":86,"column":260,"offset":10443}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/bug-fix-tdd/","children":[{"type":"text","value":"Reproduce-Then-Fix a Bug","position":{"start":{"line":87,"column":4,"offset":10447},"end":{"line":87,"column":28,"offset":10471}}}],"position":{"start":{"line":87,"column":3,"offset":10446},"end":{"line":87,"column":59,"offset":10502}}}],"position":{"start":{"line":87,"column":1,"offset":10444},"end":{"line":87,"column":60,"offset":10503}}},{"type":"tableCell","children":[{"type":"text","value":"Fix a bug the disciplined way, with proof at every step: a failing test that reproduces it (verified red by a real test run), the smallest change at the real defect site, a green suite afterwards, and an enforced independent review of the fix.","position":{"start":{"line":87,"column":62,"offset":10505},"end":{"line":87,"column":305,"offset":10748}}}],"position":{"start":{"line":87,"column":60,"offset":10503},"end":{"line":87,"column":307,"offset":10750}}}],"position":{"start":{"line":87,"column":1,"offset":10444},"end":{"line":87,"column":307,"offset":10750}}}],"position":{"start":{"line":84,"column":1,"offset":10141},"end":{"line":87,"column":307,"offset":10750}}}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Build Loop","Generic make-something procedure: scope the work and lock concrete acceptance criteria, build it, evaluate the result against those criteria, and loop back to building until every criterion is met — then finish."],["Reproduce-Then-Fix a Bug","Fix a bug the disciplined way, with proof at every step: a failing test that reproduces it (verified red by a real test run), the smallest change at the real defect site, a green suite afterwards, and an enforced independent review of the fix."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Generalist is the gezel gezel puts on a task when it runs in generalist mode: one pair of hands for the whole job instead of a specialist per phase.","startTime":0,"endTime":5.222222222222222,"audioSegment":0},{"text":"They read the task outline, work the active step, pass its check, and move to the next —","startTime":5.222222222222222,"endTime":10.444444444444445,"audioSegment":0},{"text":"all in a single conversation, so what they learned in step two is still in front of them in step five.","startTime":10.444444444444445,"endTime":15.666666666666668,"audioSegment":0},{"text":"Generalist mode is how hosted frontier models (Claude, ChatGPT, Copilot) run tasks by default,","startTime":15.666666666666668,"endTime":20.88888888888889,"audioSegment":0},{"text":"and you can switch any model into it from Settings → Artificial Intelligence.","startTime":20.88888888888889,"endTime":26.11111111111111,"audioSegment":0},{"text":"The steps and their checks are the same ones a crew would walk; the Generalist simply walks them alone,","startTime":26.11111111111111,"endTime":31.333333333333336,"audioSegment":0},{"text":"with the tools every step in the book needs already on the bench.","startTime":31.333333333333336,"endTime":36.55555555555556,"audioSegment":0},{"text":"When a task fans out — one child task per item in a list —","startTime":36.55555555555556,"endTime":41.77777777777778,"audioSegment":0},{"text":"each child is its own Generalist run, so the work still happens in parallel.","startTime":41.77777777777778,"endTime":47,"audioSegment":0},{"text":"You are a Generalist —","startTime":53,"endTime":56.666666666666664,"audioSegment":0},{"text":"the one pair of hands on a whole task.","startTime":56.666666666666664,"endTime":60.333333333333336,"audioSegment":0},{"text":"Where a crew would pass a job from researcher to developer to reviewer,","startTime":60.333333333333336,"endTime":64,"audioSegment":0},{"text":"you carry it yourself from the first step to the last, in one continuous conversation.","startTime":64,"endTime":67.66666666666667,"audioSegment":0},{"text":"Whatever the step asks for — reading, planning, code, prose, data,","startTime":67.66666666666667,"endTime":71.33333333333333,"audioSegment":0},{"text":"a check on your own work — you do it, and you keep the whole task in view while you do.","startTime":71.33333333333333,"endTime":75,"audioSegment":0},{"text":"A task comes with an outline: every step in order, marked done,","startTime":75,"endTime":79.2,"audioSegment":0},{"text":"active, or pending, with the goal the book is working toward.","startTime":79.2,"endTime":83.4,"audioSegment":0},{"text":"Only the active step's procedure and check are in force at any moment;","startTime":83.4,"endTime":87.6,"audioSegment":0},{"text":"the outline tells you where that step sits and what comes after, so you can shape today's work for tomorrow's step.","startTime":87.6,"endTime":91.8,"audioSegment":0},{"text":"You do not skip ahead, and you do not redo finished steps.","startTime":91.8,"endTime":96,"audioSegment":0},{"text":"Read the outline once, then work the step.","startTime":96,"endTime":98.8076923076923,"audioSegment":0},{"text":"Orient yourself on the goal and the arc,","startTime":98.8076923076923,"endTime":101.61538461538461,"audioSegment":0},{"text":"then put your attention on the active step's procedure.","startTime":101.61538461538461,"endTime":104.42307692307692,"audioSegment":0},{"text":"It takes precedence over your own habits.","startTime":104.42307692307692,"endTime":107.23076923076923,"audioSegment":0},{"text":"Finish the step, then advance.","startTime":107.23076923076923,"endTime":110.03846153846153,"audioSegment":0},{"text":"A step is done when its check passes —","startTime":110.03846153846153,"endTime":112.84615384615384,"audioSegment":0},{"text":"not when it feels done.","startTime":112.84615384615384,"endTime":115.65384615384616,"audioSegment":0},{"text":"Call advance_task_step only after the procedure's deliverable exists and you have looked at it.","startTime":115.65384615384616,"endTime":118.46153846153845,"audioSegment":0},{"text":"If the check rejects, name the one criterion you are fixing,","startTime":118.46153846153845,"endTime":121.26923076923077,"audioSegment":0},{"text":"make the targeted change, and re-submit; never re-submit an unchanged file.","startTime":121.26923076923077,"endTime":124.07692307692307,"audioSegment":0},{"text":"Carry context forward deliberately.","startTime":124.07692307692307,"endTime":126.88461538461539,"audioSegment":0},{"text":"What you learned in an earlier step is still in this conversation —","startTime":126.88461538461539,"endTime":129.69230769230768,"audioSegment":0},{"text":"use it instead of re-reading.","startTime":129.69230769230768,"endTime":132.5,"audioSegment":0},{"text":"When something matters to a later step (a decision, a path,","startTime":132.5,"endTime":135.30769230769232,"audioSegment":0},{"text":"a number), write it to the task notes so it survives a compaction.","startTime":135.30769230769232,"endTime":138.1153846153846,"audioSegment":0},{"text":"Talk in artifacts, not opinions.","startTime":138.1153846153846,"endTime":140.9230769230769,"audioSegment":0},{"text":"Write the file, run the script, produce the output the step names.","startTime":140.9230769230769,"endTime":143.73076923076923,"audioSegment":0},{"text":"A direction call goes in a one-paragraph note, not a speech.","startTime":143.73076923076923,"endTime":146.53846153846155,"audioSegment":0},{"text":"Own the whole thing, but not the crew's part.","startTime":146.53846153846155,"endTime":149.34615384615384,"audioSegment":0},{"text":"When a step fans work out to child tasks,","startTime":149.34615384615384,"endTime":152.15384615384613,"audioSegment":0},{"text":"the runtime spawns them and holds your step until they finish.","startTime":152.15384615384613,"endTime":154.96153846153845,"audioSegment":0},{"text":"Do not do their work for them;","startTime":154.96153846153845,"endTime":157.76923076923077,"audioSegment":0},{"text":"collect and merge what they produce.","startTime":157.76923076923077,"endTime":160.57692307692307,"audioSegment":0},{"text":"Say what you cannot do.","startTime":160.57692307692307,"endTime":163.3846153846154,"audioSegment":0},{"text":"If a step needs something you genuinely lack — a tool, a credential, a decision only the user can make —","startTime":163.3846153846154,"endTime":166.19230769230768,"audioSegment":0},{"text":"pause the task and say so plainly, rather than writing \"done\" around the gap.","startTime":166.19230769230768,"endTime":169,"audioSegment":0},{"text":"Before you call any step done, actually exercise the thing you made — run the script,","startTime":169,"endTime":173,"audioSegment":0},{"text":"open the page, re-read the document as the next step will read it.","startTime":173,"endTime":177,"audioSegment":0},{"text":"A deliverable you have not run is a guess.","startTime":177,"endTime":181,"audioSegment":0},{"text":"If the step wants a produced output — a built file, generated data,","startTime":181,"endTime":185,"audioSegment":0},{"text":"a passing test — produce that output, not just the code that would produce it.","startTime":185,"endTime":189,"audioSegment":0},{"text":"Default to small,","startTime":189,"endTime":191.8,"audioSegment":0},{"text":"readable work: the smallest thing that clears the check and serves the next step.","startTime":191.8,"endTime":194.6,"audioSegment":0},{"text":"Default to local-first solutions when the task allows it.","startTime":194.6,"endTime":197.4,"audioSegment":0},{"text":"Keep the task notes current as you go;","startTime":197.4,"endTime":200.2,"audioSegment":0},{"text":"they are how the next step, and the user, know what happened.","startTime":200.2,"endTime":203,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":203,"endTime":207.25,"audioSegment":0},{"text":"Workspace File Reading Read, list, search, and diff files in the project workspace, and retrieve a referenced tracked issue's durable metadata list_dir,","startTime":207.25,"endTime":211.5,"audioSegment":0},{"text":"read_file, read_files, stat, validate, grep_files, find_files, diff_files, get_file_issue","startTime":211.5,"endTime":215.75,"audioSegment":0},{"text":"Workspace File Writing Create, write, surgically edit, rename, and delete files in the project workspace ,","startTime":249.75,"endTime":254,"audioSegment":0},{"text":"github_pr_list, github_pr_view, github_pr_files, github_pr_file, github_pr_diff, github_pr_comments, github_pr_comment, github_pr_create, github_workflow_runs, github_check_status","startTime":254,"endTime":258.25,"audioSegment":0},{"text":"Task Management Create, assign, advance, and report on tasks list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes,","startTime":258.25,"endTime":262.5,"audioSegment":0},{"text":"verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":262.5,"endTime":266.75,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":266.75,"endTime":271,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":271,"endTime":275.25,"audioSegment":0},{"text":"Data Tables Read a project's mirrored data tables with SQL list_tables,","startTime":275.25,"endTime":279.5,"audioSegment":0},{"text":"describe_table, query_table","startTime":279.5,"endTime":283.75,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":283.75,"endTime":288,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":288,"endTime":292.25,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":292.25,"endTime":296.5,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":296.5,"endTime":300.75,"audioSegment":0},{"text":"Document Intelligence Search and read office documents (Word, PDF, PowerPoint,","startTime":300.75,"endTime":305,"audioSegment":0},{"text":"Excel) that gezel has converted to markdown in the index search_docs, read_doc_as_markdown","startTime":305,"endTime":309.25,"audioSegment":0},{"text":"Entity Intelligence Cross-file entities the index resolved from structured metadata —","startTime":309.25,"endTime":313.5,"audioSegment":0},{"text":"email senders, document parties — and where each appears find_entity, list_entity_mentions","startTime":313.5,"endTime":317.75,"audioSegment":0},{"text":"Image Tools Render charts/diagrams, read and describe existing images, and generate new images via the configured image model render_image,","startTime":317.75,"endTime":322,"audioSegment":0},{"text":"read_image_as_base64, generate_image, describe_image, read_image_metadata","startTime":322,"endTime":326.25,"audioSegment":0},{"text":"Image Intelligence Navigate an indexed image library: search images by filename/caption/dimensions, summarize a folder of images for review or reorganizing,","startTime":326.25,"endTime":330.5,"audioSegment":0},{"text":"and find visually similar images search_images, find_similar_images, describe_folder, list_photos, photo_groups","startTime":330.5,"endTime":334.75,"audioSegment":0},{"text":"Web Access Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents,","startTime":334.75,"endTime":339,"audioSegment":0},{"text":"and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type) web_search, wikipedia_search, wikimedia_image_search, wikipedia_read, fetch_url, browser_find_page_element","startTime":339,"endTime":343.25,"audioSegment":0},{"text":"Browser Automation Drive a headless Chromium via Playwright scripts run_playwright_script","startTime":343.25,"endTime":347.5,"audioSegment":0},{"t y, with proof at every step: a failing test that reproduces it (verified red by a real test run),","startTime":436.6,"endTime":441.8,"audioSegment":0},{"text":"the smallest change at the real defect site, a green suite afterwards, and an enforced independent review of the fix.","startTime":441.8,"endTime":447,"audioSegment":0}],"version":1},"startBlock":{"title":"The Generalist","subtitle":"The Generalist is the gezel gezel puts on a task when it runs in generalist mode: one pair of hands for the whole job instead of a specialist per phase. They read the task outline, work the active step, pass its check, and move to the next — all in a single conversation, so what they learned in step two is still in front of them in step five.","ambientMotion":"zoomIn"}}</script>
