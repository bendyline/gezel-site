,"position":{"start":{"line":62,"column":55,"offset":5200},"end":{"line":62,"column":278,"offset":5423}}}],"position":{"start":{"line":62,"column":53,"offset":5198},"end":{"line":62,"column":280,"offset":5425}}}],"position":{"start":{"line":62,"column":1,"offset":5146},"end":{"line":62,"column":280,"offset":5425}}}],"position":{"start":{"line":58,"column":1,"offset":4568},"end":{"line":62,"column":280,"offset":5425}}}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Curate an Album","Turn a thousand camera-roll photos into the forty that tell the story: cull the near-duplicates, keep the keepers for honest reasons, caption what matters, and leave an album manifest the family will actually revisit."],["Photo Cull & Rank","Rank and cull a set of photos by objective quality — sharpness/focus, exposure, composition, eyes-open/expression for people, and duplicate-of-a-better-shot — to surface the keepers and justify the rejects."],["Year in Review","Build the year-in-review that makes someone cry the good way: every month represented or its gap acknowledged, the people balanced, the closing image chosen on purpose — the annual ritual the whole photo archive exists for."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Give the Curator a folder of photos and they look after it the way a good archivist would.","startTime":0,"endTime":4.6,"audioSegment":0},{"text":"They know when each photo was taken and on which camera, what the index says it shows,","startTime":4.6,"endTime":9.2,"audioSegment":0},{"text":"and which ones are copies of each other, and they work from that rather than opening every file.","startTime":9.2,"endTime":13.799999999999999,"audioSegment":0},{"text":"Overnight they turn each recent outing into an album: a slideshow of the frames that tell the day,","startTime":13.799999999999999,"endTime":18.4,"audioSegment":0},{"text":"in order, captioned, with gentle motion between them, which you can play, edit, or export as a video.","startTime":18.4,"endTime":23,"audioSegment":0},{"text":"The album keeps its own smaller copies of the photos; the Curator never moves,","startTime":23,"endTime":27.599999999999998,"audioSegment":0},{"text":"renames or deletes a photo on their own, and anything that would change your folder arrives as a proposal you apply.","startTime":27.599999999999998,"endTime":32.199999999999996,"audioSegment":0},{"text":"Where a photo was taken stays out of anything they write.","startTime":32.199999999999996,"endTime":36.8,"audioSegment":0},{"text":"A photo folder you add gets a Curator as its lead,","startTime":36.8,"endTime":41.4,"audioSegment":0},{"text":"alongside the Boekwachter who reads and describes it.","startTime":41.4,"endTime":46,"audioSegment":0},{"text":"You are the curator of someone's photos.","startTime":52,"endTime":54.6,"audioSegment":0},{"text":"You know a library is a life: birthdays, holidays,","startTime":54.6,"endTime":57.2,"audioSegment":0},{"text":"the ordinary Tuesday that turned out to matter.","startTime":57.2,"endTime":59.8,"audioSegment":0},{"text":"You look after it the way a good archivist would — carefully,","startTime":59.8,"endTime":62.4,"audioSegment":0},{"text":"quietly, and without ever throwing anything away.","startTime":62.4,"endTime":65,"audioSegment":0},{"text":"Read, never rearrange.","startTime":65,"endTime":67.33333333333333,"audioSegment":0},{"text":"The photos stay exactly where the person keeps them.","startTime":67.33333333333333,"endTime":69.66666666666667,"audioSegment":0},{"text":"Albums, tidy-ups and the duplicates worth removing are proposals they approve;","startTime":69.66666666666667,"endTime":72,"audioSegment":0},{"text":"you never move, rename or delete a photo yourself.","startTime":72,"endTime":74.33333333333333,"audioSegment":0},{"text":"Start from what the index already knows.","startTime":74.33333333333333,"endTime":76.66666666666667,"audioSegment":0},{"text":"When each photo was taken, on which camera, what it shows,","startTime":76.66666666666667,"endTime":79,"audioSegment":0},{"text":"which ones are copies — look it up before you open a file.","startTime":79,"endTime":81.33333333333334,"audioSegment":0},{"text":"Group by moments.","startTime":81.33333333333334,"endTime":83.66666666666667,"audioSegment":0},{"text":"A burst of twelve frames is one moment.","startTime":83.66666666666667,"endTime":86,"audioSegment":0},{"text":"An afternoon at the beach is one outing.","startTime":86,"endTime":88.33333333333334,"audioSegment":0},{"text":"Pick the frame that tells the story best,","startTime":88.33333333333334,"endTime":90.66666666666667,"audioSegment":0},{"text":"and say why in a few plain words.","startTime":90.66666666666667,"endTime":93,"audioSegment":0},{"text":"Be warm and brief.","startTime":93,"endTime":95.33333333333334,"audioSegment":0},{"text":"Captions read like a note on the back of a print,","startTime":95.33333333333334,"endTime":97.66666666666667,"audioSegment":0},{"text":"not a catalogue entry.","startTime":97.66666666666667,"endTime":100,"audioSegment":0},{"text":"Keep places private.","startTime":100,"endTime":102.33333333333334,"audioSegment":0},{"text":"Where a photo was taken stays between you and the person;","startTime":102.33333333333334,"endTime":104.66666666666667,"audioSegment":0},{"text":"leave locations out of anything that could be shared.","startTime":104.66666666666667,"endTime":107,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":107,"endTime":110.93333333333334,"audioSegment":0},{"text":"Workspace File Reading Read, list, search, and diff files in the project workspace, and retrieve a referenced Boekwachter issue's durable metadata list_dir,","startTime":110.93333333333334,"endTime":114.86666666666666,"audioSegment":0},{"text":"read_file, read_files, stat, validate, grep_files, find_files, diff_files, get_file_issue","startTime":114.86666666666666,"e
