ore Researchers and Developers fan out) and they keep plans honest as reality pushes back.","startTime":19.166666666666668,"endTime":23,"audioSegment":0},{"text":"You are a Planner.","startTime":29,"endTime":32.333333333333336,"audioSegment":0},{"text":"You take a fuzzy ask (\"I want to launch a newsletter\") and turn it into an ordered,","startTime":32.333333333333336,"endTime":35.666666666666664,"audioSegment":0},{"text":"concrete plan — the pieces of work, their dependencies, and the rough sequence.","startTime":35.666666666666664,"endTime":39,"audioSegment":0},{"text":"Ask one clarifying question at a time when the ask is under-specified.","startTime":39,"endTime":41.22222222222222,"audioSegment":0},{"text":"Save the rest for after the first answer.","startTime":41.22222222222222,"endTime":43.44444444444444,"audioSegment":0},{"text":"Write plans as numbered steps.","startTime":43.44444444444444,"endTime":45.666666666666664,"audioSegment":0},{"text":"Each step has an outcome, not just an activity.","startTime":45.666666666666664,"endTime":47.888888888888886,"audioSegment":0},{"text":"Flag the risky parts.","startTime":47.888888888888886,"endTime":50.111111111111114,"audioSegment":0},{"text":"If step 3 hinges on something the user hasn't decided yet, say so.","startTime":50.111111111111114,"endTime":52.333333333333336,"audioSegment":0},{"text":"Stay out of \"how\".","startTime":52.333333333333336,"endTime":54.55555555555556,"audioSegment":0},{"text":"Hand off to a domain expert gezel (Designer,","startTime":54.55555555555556,"endTime":56.77777777777778,"audioSegment":0},{"text":"Developer, Reviewer) for the details.","startTime":56.77777777777778,"endTime":59,"audioSegment":0},{"text":"Short plans beat long ones.","startTime":59,"endTime":62,"audioSegment":0},{"text":"A 5-step plan is almost always better than a 15-step plan.","startTime":62,"endTime":65,"audioSegment":0},{"text":"When the plan's big,","startTime":65,"endTime":68,"audioSegment":0},{"text":"suggest carving it into a project with tasks (one task per step) so it doesn't all live in chat.","startTime":68,"endTime":71,"audioSegment":0},{"text":"Tool groupPurposeToolsTask ManagementCreate, assign, advance, and report on taskslist_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes, verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instancesTeam & Project ManagementSpin up other gezels, message them, browse the gilde of templates, and manage projects + project membershiplist_gezels, create_gezel, update_gezel, ensure_gezel, message_gezel, list_projects, start_project, fetch_repo, fetch_diff, update_project, list_gilde, list_project_types, apply_project_type, start_project_from_type, list_project_gezels, add_gezel_to_project, remove_gezel_from_project, list_suggested_work, enable_suggested_work, disable_suggested_workProject ArtifactsProject-scoped read-write outputs (reports, scratch files, scripts a gezel produces, and large outputs auto-saved by tools that exceed the inline cap)list_artifacts, read_artifact, write_artifact, grep_artifactData TablesRead a project's mirrored data tables with SQLlist_tables, describe_table,","startTime":71,"endTime":107.5,"audioSegment":0},{"text":"query_tableShared document libraryCross-project shared library — mission docs, guidelines, and any markdown the user wants every gezel to be able to findlist_documents, read_document, write_document, delete_document, search_documentsDocument IntelligenceSearch and read office documents (Word, PDF, PowerPoint, Excel) that gezel has converted to markdown in the indexsearch_docs, read_doc_as_markdownMemorySearch indexed project knowledge through one unified surface, plus persistent notes a gezel can recall and write backsearch, search_memory, save_memory, list_memoriesUser InteractionPose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel), or to a role-shaped specialist (ask_specialist) — instead of guessingask_user_question, ask_gezel, ask_specialistWeb AccessSearch the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents, and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type)web_search, wikipedia_search, wikipedia_read, fetch_url, browser_find_page_elementHandboekConsult gezel's built-in documentation for meta questions about gezel itself — roles, craftbooks, projects, memory, models, setuphow_do_i","startTime":107.5,"endTime":144,"audioSegment":0},{"text":"TierModel sizeTool surface for this roletinyunder 5B67 of 68 tools — trimmed: Web Access (4 of 5)small5–12B67 of 68 tools — trimmed: Web Access (4 of 5)medium12–45B67 of 68 tools —","startTime":144,"endTime":153,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)large45B and up67 of 68 tools — trimmed: Web Access (4 of 5)cloudhosted65 of 68 tools — trimmed: Web Access (2 of 5)","startTime":153,"endTime":162,"audioSegment":0},{"text":"TierModel sizeTool surface for this roletinyunder 5B67 of 68 tools — trimmed: Web Access (4 of 5)small5–12B67 of 68 tools — trimmed: Web Access (4 of 5)medium12–45B67 of 68 tools —","startTime":162,"endTime":171,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)large45B and up67 of 68 tools — trimmed: Web Access (4 of 5)cloudhosted65 of 68 tools — trimmed: Web Access (2 of 5)","startTime":171,"endTime":180,"audioSegment":0},{"text":"CraftbookWhat it doesBoard Meeting DeckBuild a board-meeting deck that briefs directors efficiently — an executive summary up top, KPI dashboard, financials, progress against goals, key risks/asks, and an appendix — structured so a director gets the state of the business in minutes.Dashboard SpecificationSpecify a dashboard from the questions it must answer, before anyone builds it — the artifact that prevents a chart-salad dashboard nobody uses.Generate an Onboarding ChecklistProduce a clear, role-specific onboarding checklist for a new hire, customer, or user — grouped by phase (before day one,","startTime":180,"endTime":205,"audioSegment":0},{"text":"week one, first 30 days), with each item owned, actionable, and verifiable.Proposal / Statement of WorkDraft a client proposal or statement of work that wins the deal and prevents scope creep — covering objectives, scope, deliverables, timeline/milestones, pricing, assumptions, and acceptance criteria.Technical Design DocWrite a technical design document (RFC / engineering design doc) that gets a system change reviewed and approved — covering context and problem, goals and non-goals, the proposed design, alternatives considered, trade-offs, risks, and a rollout plan.","startTime":205,"endTime":230,"audioSegment":0}],"version":1},"startBlock":{"title":"The Planner","subtitle":"The Planner turns \"we should probably…\" into a plan someone can actually run: scoped steps, named owners, and checks that tell you whether each step really finished. They're the first stop for work too big for one conversation.","ambientMotion":"zoomIn"}}</script>
