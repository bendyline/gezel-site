egment":0},{"text":"Planners think in deliverables, not vibes —","startTime":11.5,"endTime":15.333333333333334,"audioSegment":0},{"text":"a good plan names the artifact each step produces.","startTime":15.333333333333334,"endTime":19.166666666666668,"audioSegment":0},{"text":"They often open a craftbook run (scoping the question before Researchers and Developers fan out) and they keep plans honest as reality pushes back.","startTime":19.166666666666668,"endTime":23,"audioSegment":0},{"text":"You are a Planner.","startTime":29,"endTime":32.333333333333336,"audioSegment":0},{"text":"You take a fuzzy ask (\"I want to launch a newsletter\") and turn it into an ordered,","startTime":32.333333333333336,"endTime":35.666666666666664,"audioSegment":0},{"text":"concrete plan — the pieces of work, their dependencies, and the rough sequence.","startTime":35.666666666666664,"endTime":39,"audioSegment":0},{"text":"Ask one clarifying question at a time when the ask is under-specified.","startTime":39,"endTime":41.22222222222222,"audioSegment":0},{"text":"Save the rest for after the first answer.","startTime":41.22222222222222,"endTime":43.44444444444444,"audioSegment":0},{"text":"Write plans as numbered steps.","startTime":43.44444444444444,"endTime":45.666666666666664,"audioSegment":0},{"text":"Each step has an outcome, not just an activity.","startTime":45.666666666666664,"endTime":47.888888888888886,"audioSegment":0},{"text":"Flag the risky parts.","startTime":47.888888888888886,"endTime":50.111111111111114,"audioSegment":0},{"text":"If step 3 hinges on something the user hasn't decided yet, say so.","startTime":50.111111111111114,"endTime":52.333333333333336,"audioSegment":0},{"text":"Stay out of \"how\".","startTime":52.333333333333336,"endTime":54.55555555555556,"audioSegment":0},{"text":"Hand off to a domain expert gezel (Designer,","startTime":54.55555555555556,"endTime":56.77777777777778,"audioSegment":0},{"text":"Developer, Reviewer) for the details.","startTime":56.77777777777778,"endTime":59,"audioSegment":0},{"text":"Short plans beat long ones.","startTime":59,"endTime":62,"audioSegment":0},{"text":"A 5-step plan is almost always better than a 15-step plan.","startTime":62,"endTime":65,"audioSegment":0},{"text":"When the plan's big,","startTime":65,"endTime":68,"audioSegment":0},{"text":"suggest carving it into a project with tasks (one task per step) so it doesn't all live in chat.","startTime":68,"endTime":71,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":71,"endTime":74.95238095238095,"audioSegment":0},{"text":"Task Management Create, assign, advance, and report on tasks list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes,","startTime":74.95238095238095,"endTime":78.9047619047619,"audioSegment":0},{"text":"verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":78.9047619047619,"endTime":82.85714285714286,"audioSegment":0},{"text":"Team & Project Management Spin up other gezels, message them, browse the gilde of templates, and manage projects + project membership list_gezels, create_gezel, update_gezel, ensure_gezel, message_gezel, list_projects, start_project, fetch_repo,","startTime":82.85714285714286,"endTime":86.80952380952381,"audioSegment":0},{"text":"fetch_diff, update_project, list_gilde, list_project_types, apply_project_type, start_project_from_type, list_project_gezels, add_gezel_to_project, remove_gezel_from_project, list_suggested_work, enable_suggested_work, disable_suggested_work","startTime":86.80952380952381,"endTime":90.76190476190476,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":90.76190476190476,"endTime":94.71428571428572,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":94.71428571428572,"endTime":98.66666666666667,"audioSegment":0},{"text":"Data Tables Read a project's mirrored data tables with SQL list_tables,","startTime":98.66666666666667,"endTime":102.61904761904762,"audioSegment":0},{"text":"describe_table, query_table","startTime":102.61904761904762,"endTime":106.57142857142857,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":106.57142857142857,"endTime":110.52380952380952,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":110.52380952380952,"endTime":114.47619047619048,"audioSegment":0},{"text":"Document Intelligence Search and read office documents (Word, PDF, PowerPoint,","startTime":114.47619047619048,"endTime":118.42857142857143,"audioSegment":0},{"text":"Excel) that gezel has converted to markdown in the index search_docs, read_doc_as_markdown","startTime":118.42857142857143,"endTime":122.38095238095238,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":122.38095238095238,"endTime":126.33333333333334,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, search_memory, save_memory, list_memories","startTime":126.33333333333334,"endTime":130.28571428571428,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":130.28571428571428,"endTime":134.23809523809524,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":134.23809523809524,"endTime":138.1904761904762,"audioSegment":0},{"text":"Web Access Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents,","startTime":138.1904761904762,"endTime":142.14285714285714,"audioSegment":0},{"text":"and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type) web_search, wikipedia_search, wikipedia_read, fetch_url, browser_find_page_element","startTime":142.14285714285714,"endTime":146.0952380952381,"audioSegment":0},{"text":"Handboek Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":146.0952380952381,"endTime":150.04761904761904,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":150.04761904761904,"endTime":154,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":154,"endTime":156.0909090909091,"audioSegment":0},{"text":"tiny under 5B 68 of 69 tools —","startTime":156.0909090909091,"endTime":158.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)","startTime":158.1818181818182,"endTime":160.27272727272728,"audioSegment":0},{"text":"small 5–12B 68 of 69 tools —","startTime":160.27272727272728,"endTime":162.36363636363637,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)","startTime":162.36363636363637,"endTime":164.45454545454544,"audioSegment":0},{"text":"medium 12–45B 68 of 69 tools —","startTime":164.45454545454544,"endTime":166.54545454545453,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)","startTime":166.54545454545453,"endTime":168.63636363636363,"audioSegment":0},{"text":"large 45B and up 68 of 69 tools —","startTime":168.63636363636363,"endTime":170.72727272727272,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)","startTime":170.72727272727272,"endTime":172.8181818181818,"audioSegment":0},{"text":"cloud hosted 66 of 69 tools —","startTime":172.8181818181818,"endTime":174.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (2 of 5)","startTime":174.9090909090909,"endTime":177,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":177,"endTime":179.0909090909091,"audioSegment":0},{"text":"tiny under 5B 68 of 69 tools —","startTime":179.0909090909091,"endTime":181.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)","startTime":181.1818181818182,"endTime":183.27272727272728,"audioSegment":0},{"text":"small 5–12B 68 of 69 tools —","startTime":183.27272727272728,"endTime":185.36363636363637,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)","startTime":185.36363636363637,"endTime":187.45454545454544,"audioSegment":0},{"text":"medium 12–45B 68 of 69 tools —","startTime":187.45454545454544,"endTime":189.54545454545453,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)","startTime":189.54545454545453,"endTime":191.63636363636363,"audioSegment":0},{"text":"large 45B and up 68 of 69 tools —","startTime":191.63636363636363,"endTime":193.72727272727272,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)","startTime":193.72727272727272,"endTime":195.8181818181818,"audioSegment":0},{"text":"cloud hosted 66 of 69 tools —","startTime":195.8181818181818,"endTime":197.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (2 of 5)","startTime":197.9090909090909,"endTime":200,"audioSegment":0},{"text":"Craftbook What it does","startTime":200,"endTime":204.8181818181818,"audioSegment":0},{"text":"Board Meeting Deck Build a board-meeting deck that briefs directors efficiently — an executive summary up top, KPI dashboard, financials,","startTime":204.8181818181818,"endTime":209.63636363636363,"audioSegment":0},{"text":"progress against goals, key risks/asks, and an appendix — structured so a director gets the state of the business in minutes.","startTime":209.63636363636363,"endTime":214.45454545454547,"audioSegment":0},{"text":"Dashboard Specification Specify a dashboard from the questions it must answer,","startTime":214.45454545454547,"endTime":219.27272727272728,"audioSegment":0},{"text":"before anyone builds it — the artifact that prevents a chart-salad dashboard nobody uses.","startTime":219.27272727272728,"endTime":224.0909090909091,"audioSegment":0},{"text":"Generate an Onboarding Checklist Produce a clear, role-specific onboarding checklist for a new hire, customer, or user —","startTime":224.0909090909091,"endTime":228.9090909090909,"audioSegment":0},{"text":"grouped by phase (before day one, week one, first 30 days), with each item owned, actionable, and verifiable.","startTime":228.9090909090909,"endTime":233.72727272727272,"audioSegment":0},{"text":"Proposal / Statement of Work Draft a client proposal or statement of work that wins the deal and prevents scope creep —","startTime":233.72727272727272,"endTime":238.54545454545456,"audioSegment":0},{"text":"covering objectives, scope, deliverables, timeline/milestones, pricing, assumptions, and acceptance criteria.","startTime":238.54545454545456,"endTime":243.36363636363637,"audioSegment":0},{"text":"Technical Design Doc Write a technical design document (RFC / engineering design doc) that gets a system change reviewed and approved —","startTime":243.36363636363637,"endTime":248.1818181818182,"audioSegment":0},{"text":"covering context and problem, goals and non-goals, the proposed design, alternatives considered, trade-offs, risks, and a rollout plan.","startTime":248.1818181818182,"endTime":253,"audioSegment":0}],"version":1},"startBlock":{"title":"The Planner","subtitle":"The Planner turns \"we should probably…\" into a plan someone can actually run: scoped steps, named owners, and checks that tell you whether each step really finished. They're the first stop for work too big for one conversation.","ambientMotion":"zoomIn"}}</script>
