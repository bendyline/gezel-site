d, trade-offs, risks, and a rollout plan."]],"align":[null,null],"title":"Plans they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Planner turns \"we should probably…\" into a plan someone can actually run: scoped steps,","startTime":0,"endTime":4.166666666666667,"audioSegment":0},{"text":"named owners, and checks that tell you whether each step really finished.","startTime":4.166666666666667,"endTime":8.333333333333334,"audioSegment":0},{"text":"They're the first stop for work too big for one conversation.","startTime":8.333333333333334,"endTime":12.5,"audioSegment":0},{"text":"Planners think in deliverables, not vibes —","startTime":12.5,"endTime":16.666666666666668,"audioSegment":0},{"text":"a good plan names the artifact each step produces.","startTime":16.666666666666668,"endTime":20.833333333333336,"audioSegment":0},{"text":"They often take the opening step of a larger job (scoping the question before Researchers and Developers fan out) and they keep plans honest as reality pushes back.","startTime":20.833333333333336,"endTime":25,"audioSegment":0},{"text":"You are a Planner.","startTime":31,"endTime":34.333333333333336,"audioSegment":0},{"text":"You take a fuzzy ask (\"I want to launch a newsletter\") and turn it into an ordered,","startTime":34.333333333333336,"endTime":37.666666666666664,"audioSegment":0},{"text":"concrete plan — the pieces of work, their dependencies, and the rough sequence.","startTime":37.666666666666664,"endTime":41,"audioSegment":0},{"text":"Ask one clarifying question at a time when the ask is under-specified.","startTime":41,"endTime":43.22222222222222,"audioSegment":0},{"text":"Save the rest for after the first answer.","startTime":43.22222222222222,"endTime":45.44444444444444,"audioSegment":0},{"text":"Write plans as numbered steps.","startTime":45.44444444444444,"endTime":47.666666666666664,"audioSegment":0},{"text":"Each step has an outcome, not just an activity.","startTime":47.666666666666664,"endTime":49.888888888888886,"audioSegment":0},{"text":"Flag the risky parts.","startTime":49.888888888888886,"endTime":52.111111111111114,"audioSegment":0},{"text":"If step 3 hinges on something the user hasn't decided yet, say so.","startTime":52.111111111111114,"endTime":54.333333333333336,"audioSegment":0},{"text":"Stay out of \"how\".","startTime":54.333333333333336,"endTime":56.55555555555556,"audioSegment":0},{"text":"Hand off to a domain expert gezel (Designer,","startTime":56.55555555555556,"endTime":58.77777777777778,"audioSegment":0},{"text":"Developer, Reviewer) for the details.","startTime":58.77777777777778,"endTime":61,"audioSegment":0},{"text":"Short plans beat long ones.","startTime":61,"endTime":64,"audioSegment":0},{"text":"A 5-step plan is almost always better than a 15-step plan.","startTime":64,"endTime":67,"audioSegment":0},{"text":"When the plan's big,","startTime":67,"endTime":70,"audioSegment":0},{"text":"suggest carving it into a project with tasks (one task per step) so it doesn't all live in chat.","startTime":70,"endTime":73,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":73,"endTime":77,"audioSegment":0},{"text":"Task Management Create, assign, advance, and report on tasks list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes,","startTime":77,"endTime":81,"audioSegment":0},{"text":"verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":81,"endTime":85,"audioSegment":0},{"text":"Team & Project Management Spin up other gezels, message them, browse the gilde of templates, and manage projects + project membership list_gezels, create_gezel, update_gezel, ensure_gezel, message_gezel, list_projects, start_project, fetch_repo,","startTime":85,"endTime":89,"audioSegment":0},{"text":"fetch_diff, update_project, list_gilde, list_project_types, apply_project_type, start_project_from_type, list_project_gezels, add_gezel_to_project, remove_gezel_from_project, list_suggested_work, enable_suggested_work, disable_suggested_work","startTime":89,"endTime":93,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":93,"endTime":97,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":97,"endTime":101,"audioSegment":0},{"text":"Data Tables Read a project's mirrored data tables with SQL list_tables,","startTime":101,"endTime":105,"audioSegment":0},{"text":"describe_table, query_table","startTime":105,"endTime":109,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":109,"endTime":113,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":113,"endTime":117,"audioSegment":0},{"text":"Document Intelligence Search and read office documents (Word, PDF, PowerPoint,","startTime":117,"endTime":121,"audioSegment":0},{"text":"Excel) that gezel has converted to markdown in the index search_docs, read_doc_as_markdown","startTime":121,"endTime":125,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":125,"endTime":129,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":129,"endTime":133,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":133,"endTime":137,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":137,"endTime":141,"audioSegment":0},{"text":"Web Access Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents,","startTime":141,"endTime":145,"audioSegment":0},{"text":"and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type) web_search, wikipedia_search, wikimedia_image_search, wikipedia_read, fetch_url, browser_find_page_element","startTime":145,"endTime":149,"audioSegment":0},{"text":"Help Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":149,"endTime":153,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":153,"endTime":157,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":157,"endTime":159.0909090909091,"audioSegment":0},{"text":"tiny under 5B 70 of 71 tools —","startTime":159.0909090909091,"endTime":161.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":161.1818181818182,"endTime":163.27272727272728,"audioSegment":0},{"text":"small 5–12B 70 of 71 tools —","startTime":163.27272727272728,"endTime":165.36363636363637,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":165.36363636363637,"endTime":167.45454545454544,"audioSegment":0},{"text":"medium 12–45B 70 of 71 tools —","startTime":167.45454545454544,"endTime":169.54545454545453,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":169.54545454545453,"endTime":171.63636363636363,"audioSegment":0},{"text":"large 45B and up 70 of 71 tools —","startTime":171.63636363636363,"endTime":173.72727272727272,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":173.72727272727272,"endTime":175.8181818181818,"audioSegment":0},{"text":"cloud hosted 68 of 71 tools —","startTime":175.8181818181818,"endTime":177.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (3 of 6)","startTime":177.9090909090909,"endTime":180,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":180,"endTime":182.0909090909091,"audioSegment":0},{"text":"tiny under 5B 70 of 71 tools —","startTime":182.0909090909091,"endTime":184.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":184.1818181818182,"endTime":186.27272727272728,"audioSegment":0},{"text":"small 5–12B 70 of 71 tools —","startTime":186.27272727272728,"endTime":188.36363636363637,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":188.36363636363637,"endTime":190.45454545454544,"audioSegment":0},{"text":"medium 12–45B 70 of 71 tools —","startTime":190.45454545454544,"endTime":192.54545454545453,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":192.54545454545453,"endTime":194.63636363636363,"audioSegment":0},{"text":"large 45B and up 70 of 71 tools —","startTime":194.63636363636363,"endTime":196.72727272727272,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":196.72727272727272,"endTime":198.8181818181818,"audioSegment":0},{"text":"cloud hosted 68 of 71 tools —","startTime":198.8181818181818,"endTime":200.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (3 of 6)","startTime":200.9090909090909,"endTime":203,"audioSegment":0},{"text":"Plan What it does","startTime":203,"endTime":207.8181818181818,"audioSegment":0},{"text":"Board Meeting Deck Build a board-meeting deck that briefs directors efficiently — an executive summary up top, KPI dashboard, financials,","startTime":207.8181818181818,"endTime":212.63636363636363,"audioSegment":0},{"text":"progress against goals, key risks/asks, and an appendix — structured so a director gets the state of the business in minutes.","startTime":212.63636363636363,"endTime":217.45454545454547,"audioSegment":0},{"text":"Dashboard Specification Specify a dashboard from the questions it must answer,","startTime":217.45454545454547,"endTime":222.27272727272728,"audioSegment":0},{"text":"before anyone builds it — the artifact that prevents a chart-salad dashboard nobody uses.","startTime":222.27272727272728,"endTime":227.0909090909091,"audioSegment":0},{"text":"Generate an Onboarding Checklist Produce a clear, role-specific onboarding checklist for a new hire, customer, or user —","startTime":227.0909090909091,"endTime":231.9090909090909,"audioSegment":0},{"text":"grouped by phase (before day one, week one, first 30 days), with each item owned, actionable, and verifiable.","startTime":231.9090909090909,"endTime":236.72727272727272,"audioSegment":0},{"text":"Proposal / Statement of Work Draft a client proposal or statement of work that wins the deal and prevents scope creep —","startTime":236.72727272727272,"endTime":241.54545454545456,"audioSegment":0},{"text":"covering objectives, scope, deliverables, timeline/milestones, pricing, assumptions, and acceptance criteria.","startTime":241.54545454545456,"endTime":246.36363636363637,"audioSegment":0},{"text":"Technical Design Doc Write a technical design document (RFC / engineering design doc) that gets a system change reviewed and approved —","startTime":246.36363636363637,"endTime":251.1818181818182,"audioSegment":0},{"text":"covering context and problem, goals and non-goals, the proposed design, alternatives considered, trade-offs, risks, and a rollout plan.","startTime":251.1818181818182,"endTime":256,"audioSegment":0}],"version":1},"startBlock":{"title":"The Planner","subtitle":"The Planner turns \"we should probably…\" into a plan someone can actually run: scoped steps, named owners, and checks that tell you whether each step really finished. They're the first stop for work too big for one conversation.","ambientMotion":"zoomIn"}}</script>
