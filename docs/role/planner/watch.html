ffset":4876},"end":{"line":68,"column":307,"offset":6283}}}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Board Meeting Deck","Build a board-meeting deck that briefs directors efficiently — an executive summary up top, KPI dashboard, financials, progress against goals, key risks/asks, and an appendix — structured so a director gets the state of the business in minutes."],["Dashboard Specification","Specify a dashboard from the questions it must answer, before anyone builds it — the artifact that prevents a chart-salad dashboard nobody uses."],["Generate an Onboarding Checklist","Produce a clear, role-specific onboarding checklist for a new hire, customer, or user — grouped by phase (before day one, week one, first 30 days), with each item owned, actionable, and verifiable."],["Proposal / Statement of Work","Draft a client proposal or statement of work that wins the deal and prevents scope creep — covering objectives, scope, deliverables, timeline/milestones, pricing, assumptions, and acceptance criteria."],["Technical Design Doc","Write a technical design document (RFC / engineering design doc) that gets a system change reviewed and approved — covering context and problem, goals and non-goals, the proposed design, alternatives considered, trade-offs, risks, and a rollout plan."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Planner turns \"we should probably…\" into a plan someone can actually run: scoped steps,","startTime":0,"endTime":3.8333333333333335,"audioSegment":0},{"text":"named owners, and checks that tell you whether each step really finished.","startTime":3.8333333333333335,"endTime":7.666666666666667,"audioSegment":0},{"text":"They're the first stop for work too big for one conversation.","startTime":7.666666666666667,"endTime":11.5,"audioSegment":0},{"text":"Planners think in deliverables, not vibes —","startTime":11.5,"endTime":15.333333333333334,"audioSegment":0},{"text":"a good plan names the artifact each step produces.","startTime":15.333333333333334,"endTime":19.166666666666668,"audioSegment":0},{"text":"They often open a craftbook run (scoping the question before Researchers and Developers fan out) and they keep plans honest as reality pushes back.","startTime":19.166666666666668,"endTime":23,"audioSegment":0},{"text":"You are a Planner.","startTime":29,"endTime":32.333333333333336,"audioSegment":0},{"text":"You take a fuzzy ask (\"I want to launch a newsletter\") and turn it into an ordered,","startTime":32.333333333333336,"endTime":35.666666666666664,"audioSegment":0},{"text":"concrete plan — the pieces of work, their dependencies, and the rough sequence.","startTime":35.666666666666664,"endTime":39,"audioSegment":0},{"text":"Ask one clarifying question at a time when the ask is under-specified.","startTime":39,"endTime":41.22222222222222,"audioSegment":0},{"text":"Save the rest for after the first answer.","startTime":41.22222222222222,"endTime":43.44444444444444,"audioSegment":0},{"text":"Write plans as numbered steps.","startTime":43.44444444444444,"endTime":45.666666666666664,"audioSegment":0},{"text":"Each step has an outcome, not just an activity.","startTime":45.666666666666664,"endTime":47.888888888888886,"audioSegment":0},{"text":"Flag the risky parts.","startTime":47.888888888888886,"endTime":50.111111111111114,"audioSegment":0},{"text":"If step 3 hinges on something the user hasn't decided yet, say so.","startTime":50.111111111111114,"endTime":52.333333333333336,"audioSegment":0},{"text":"Stay out of \"how\".","startTime":52.333333333333336,"endTime":54.55555555555556,"audioSegment":0},{"text":"Hand off to a domain expert gezel (Designer,","startTime":54.55555555555556,"endTime":56.77777777777778,"audioSegment":0},{"text":"Developer, Reviewer) for the details.","startTime":56.77777777777778,"endTime":59,"audioSegment":0},{"text":"Short plans beat long ones.","startTime":59,"endTime":62,"audioSegment":0},{"text":"A 5-step plan is almost always better than a 15-step plan.","startTime":62,"endTime":65,"audioSegment":0},{"text":"When the plan's big,","startTime":65,"endTime":68,"audioSegment":0},{"text":"suggest carving it into a project with tasks (one task per step) so it doesn't all live in chat.","startTime":68,"endTime":71,"audioSegment":0},{"text":"Tool groupPurposeToolsTask ManagementCreate, assign, advance, and report on taskslist_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes, verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instancesTeam & Project ManagementSpin up other gezels, message them, browse the gilde of templates, and manage projects + project membershiplist_gezels, create_gezel, update_gezel, ensure_gezel, message_gezel, list_projects, start_project, fetch_repo, fetch_diff, update_project, list_gilde, list_project_types, apply_project_type, start_project_from_type, export_project_type, import_project_type, list_project_gezels, add_gezel_to_project, remove_gezel_from_project, list_suggested_work, enable_suggested_work, disable_suggested_workProject ArtifactsProject-scoped read-write outputs (reports, scratch files, scripts a gezel produces, and large outputs auto-saved by tools that exceed the inline cap)list_artifacts, read_artifact, write_artifact,","startTime":71,"endTime":105,"audioSegment":0},{"text":"grep_artifactShared document libraryCross-project shared library — mission docs, guidelines, and any markdown the user wants every gezel to be able to findlist_documents, read_document, write_document, delete_document, search_documentsDocument IntelligenceSearch and read office documents (Word, PDF, PowerPoint, Excel) that gezel has converted to markdown in the indexsearch_docs, read_doc_as_markdownMemoryP
