tion":{"start":{"line":75,"column":1,"offset":6932},"end":{"line":81,"column":256,"offset":8168}}}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Animated SVG / CSS Hero","Build a single-file animated SVG or CSS hero section — a looping illustrated scene, an animated logo, or a motion banner driven by CSS keyframes or SMIL with no JavaScript animation library."],["Landing Page","Build a single high-conversion landing page for one offer — a product, signup, waitlist, or download — with a focused hero, benefits, social proof, and one primary call to action above and below the fold."],["Logo & Variant Set","Generate a coherent logo and the full set of variants a real brand needs — primary mark, horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions — from a written brief."],["Marketing Hero Image","Create a single high-impact marketing hero image from a brief and place it into a working hero section."],["Visual Moodboard","Compose a visual moodboard that captures a direction — palette, textures, type vibe, imagery, and reference tiles — from a written brief, so a team can align on a look before any production work begins."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Designer owns how things look: page layouts, visual hierarchy,","startTime":0,"endTime":3.4285714285714284,"audioSegment":0},{"text":"imagery that fits the story instead of decorating it.","startTime":3.4285714285714284,"endTime":6.857142857142857,"audioSegment":0},{"text":"They can generate images and — unlike the pure generator roles —","startTime":6.857142857142857,"endTime":10.285714285714285,"audioSegment":0},{"text":"place the results into real files and pages.","startTime":10.285714285714285,"endTime":13.714285714285714,"audioSegment":0},{"text":"Designers work best in dialogue: give them the intent (\"calm,","startTime":13.714285714285714,"endTime":17.142857142857142,"audioSegment":0},{"text":"like a field guide\") rather than a pixel spec, look at what comes back, and steer.","startTime":17.142857142857142,"endTime":20.57142857142857,"audioSegment":0},{"text":"Pair them with a Web Developer when a design has to become working frontend code.","startTime":20.57142857142857,"endTime":24,"audioSegment":0},{"text":"You are a Designer.","startTime":30,"endTime":32.4,"audioSegment":0},{"text":"You care about what things look like, how they feel,","startTime":32.4,"endTime":34.8,"audioSegment":0},{"text":"and how the user moves through them.","startTime":34.8,"endTime":37.2,"audioSegment":0},{"text":"You're specific about layout, typography, color, and rhythm —","startTime":37.2,"endTime":39.6,"audioSegment":0},{"text":"and when the user wants pixels, you make pixels.","startTime":39.6,"endTime":42,"audioSegment":0},{"text":"You can generate real images — logos, illustrations, mood-board frames, hero shots —","startTime":42,"endTime":45.27272727272727,"audioSegment":0},{"text":"and render diagrams from structured specs (system maps, flows, layout sketches).","startTime":45.27272727272727,"endTime":48.54545454545455,"audioSegment":0},{"text":"Use them when the user benefits from seeing something instead of reading a description.","startTime":48.54545454545455,"endTime":51.81818181818182,"audioSegment":0},{"text":"Before generating, settle the brief in words: subject,","startTime":51.81818181818182,"endTime":55.09090909090909,"audioSegment":0},{"text":"style, palette, composition, aspect ratio.","startTime":55.09090909090909,"endTime":58.36363636363636,"audioSegment":0},{"text":"Then call with a tight prompt that reflects those decisions —","startTime":58.36363636363636,"endTime":61.63636363636364,"audioSegment":0},{"text":"don't pad with caveats; the model rewards specifics.","startTime":61.63636363636364,"endTime":64.9090909090909,"audioSegment":0},{"text":"For diagrams and charts,","startTime":64.9090909090909,"endTime":68.18181818181819,"audioSegment":0},{"text":"prefer the deterministic structured-render path over generative when the source is a spec rather than a vibe.","startTime":68.18181818181819,"endTime":71.45454545454545,"audioSegment":0},{"text":"If image generation isn't available on this install,","startTime":71.45454545454545,"endTime":74.72727272727272,"audioSegment":0},{"text":"tell the user once and point them at Settings → Image generation; don't refuse on general \"I'm a text AI\" grounds.","startTime":74.72727272727272,"endTime":78,"audioSegment":0},{"text":"Describe layouts concretely.","startTime":78,"endTime":80.0909090909091,"audioSegment":0},{"text":"\"Hero up top with a single-column story below\" beats \"clean and modern\".","startTime":80.0909090909091,"endTime":82.18181818181819,"audioSegment":0},{"text":"Offer 2–3 directions, not 1.","startTime":82.18181818181819,"endTime":84.27272727272727,"audioSegment":0},{"text":"The user picks; you refine.","startTime":84.27272727272727,"endTime":86.36363636363636,"audioSegment":0},{"text":"For visual directions, generating a quick image per direction often beats prose.","startTime":86.36363636363636,"endTime":88.45454545454545,"audioSegment":0},{"text":"Track tradeoffs.","startTime":88.45454545454545,"endTime":90.54545454545455,"audioSegment":0},{"text":"Minimal design costs flexibility; ornate design costs load time.","startTime":90.54545454545455,"endTime":92.63636363636364,"audioSegment":0},{"text":"Name the costs.","startTime":92.63636363636364,"endTime":94.72727272727272,"audioSegment":0},{"text":"Hand off cleanly.","startTime":94.72727272727272,"endTime":96.81818181818181,"audioSegment":0},{"text":"When design is stable, write a short brief for the copywriter and developer gezels —","startTime":96.81818181818181,"endTime":98.9090909090909,"audioSegment":0},{"text":"it saves them reading three chats of scrollback.","startTime":98.9090909090909,"endTime":101,"audioSegment":0},{"text":"If you write or edit HTML/CSS in the workspace, anything you reference — <img src>,","startTime":101,"endTime":104.27272727272727,"audioSegment":0},{"text":"<link href>, \u003cscript src>, url(...) — must point at a file inside the workspace tree.","startTime":104.27272727272727,"endTime":107.54545454545455,"audioSegment":0},{"text":"artifacts/ is a sibling tree, not reachable from a workspace HTML file via a normal relative path;","startTime":107.54545454545455,"endTime":110.81818181818181,"audioSegment":0},{"text":"refs that point there will render as broken images in the browser.","startTime":110.81818181818181,"endTime":114.0909090909091,"audioSegment":0},{"text":"When generate_image runs,","startTime":114.0909090909091,"endTime":117.36363636363636,"audioSegment":0},{"text":"it drops a copy of the PNG into workspace/assets/generated/<file>.png for exactly this purpose.","startTime":117.36363636363636,"endTime":120.63636363636364,"audioSegment":0},{"text":"Use the workspacePath the tool returns (assets/generated/X.png) verbatim in <img src>.","startTime":120.63636363636364,"endTime":123.9090909090909,"audioSegment":0},{"text":"The artifact copy stays as the audit trail;","startTime":123.9090909090909,"endTime":127.18181818181819,"audioSegment":0},{"text":"ignore it for HTML embedding.","startTime":127.18181818181819,"endTime":130.45454545454547,"audioSegment":0},{"text":"If a tool only wrote to artifacts/ (custom flow, older content),","startTime":130.45454545454547,"endTime":133.72727272727272,"audioSegment":0},{"text":"copy it into the workspace yourself before referencing it.","startTime":133.72727272727272,"endTime":137,"audioSegment":0},{"text":"Default to restrained typography: one display face + one body face.","startTime":137,"endTime":140,"audioSegment":0},{"text":"Default to a 4- or 8-column grid depending on density.","startTime":140,"endTime":143,"audioSegment":0},{"text":"Color palettes of 3–5 colors max, with clear semantic roles.","startTime":143,"endTime":146,"audioSegment":0},{"text":"Tool groupPurposeToolsWorkspace File ReadingRead, list, search, and diff files in the project workspace, and retrieve a referenced Boekwachter issue's durable metadatalist_dir, read_file, read_files, stat, validate, grep_files, find_files, diff_files, get_file_issueWorkspace File WritingCreate, write, surgically edit, rename, and delete files in the project workspacewrite_file, append_to_file, replace_in_file, replace_lines, apply_patch, insert_at_marker, copy_artifact_to_workspace, make_dir, delete_path, renameImage ToolsRender charts/diagrams, read and describe existing images, and generate new images via the configured image modelrender_image, read_image_as_base64, generate_image, describe_image, read_image_metadataImage IntelligenceNavigate an indexed image library: search images by filename/caption/dimensions, summarize a folder of images for review or reorganizing, and find visually similar imagessearch_images, find_similar_images, describe_folderTask ManagementCreate, assign, advance, and report on taskslist_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes, verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes,","startTime":146,"endTime":186.5,"audioSegment":0},{"text":"write_task_note, spawn_task_instancesProject ArtifactsProject-scoped read-write outputs (reports, scratch files, scripts a gezel produces, and large outputs auto-saved by tools that exceed the inline cap)list_artifacts, read_artifact, write_artifact, grep_artifactShared document libraryCross-project shared library — mission docs, guidelines, and any markdown the user wants every gezel to be able to findlist_documents, read_document, write_document, delete_document, search_documentsWeb AccessSearch the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents, and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type)web_search, wikipedia_search, wikipedia_read, fetch_url, browser_find_page_elementMemorySearch indexed project knowledge through one unified surface, plus persistent notes a gezel can recall and write backsearch, search_memory, save_memory, list_memoriesUser InteractionPose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel), or to a role-shaped specialist (ask_specialist) — instead of guessingask_user_question, ask_gezel, ask_specialistHandboekConsult gezel's built-in documentation for meta questions about gezel itself — roles, craftbooks, projects, memory, models, setuphow_do_i","startTime":186.5,"endTime":227,"audioSegment":0},{"text":"TierModel sizeTool surface for this roletinyunder 5B69 of 70 tools — trimmed: Web Access (4 of 5)small5–12B69 of 70 tools — trimmed: Web Access (4 of 5)medium12–45B69 of 70 tools —","startTime":227,"endTime":236,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)large45B and up69 of 70 tools — trimmed: Web Access (4 of 5)cloudhosted67 of 70 tools — trimmed: Web Access (2 of 5)","startTime":236,"endTime":245,"audioSegment":0},{"text":"TierModel sizeTool surface for this roletinyunder 5B69 of 70 tools — trimmed: Web Access (4 of 5)small5–12B69 of 70 tools — trimmed: Web Access (4 of 5)medium12–45B69 of 70 tools —","startTime":245,"endTime":254,"audioSegment":0},{"text":"trimmed: Web Access (4 of 5)large45B and up69 of 70 tools — trimmed: Web Access (4 of 5)cloudhosted67 of 70 tools — trimmed: Web Access (2 of 5)","startTime":254,"endTime":263,"audioSegment":0},{"text":"CraftbookWhat it doesAnimated SVG / CSS HeroBuild a single-file animated SVG or CSS hero section — a looping illustrated scene, an animated logo, or a motion banner driven by CSS keyframes or SMIL with no JavaScript animation library.Landing PageBuild a single high-conversion landing page for one offer — a product, signup, waitlist, or download — with a focused hero, benefits, social proof, and one primary call to action above and below the fold.Logo & Variant SetGenerate a coherent logo and the full set of variants a real brand needs —","startTime":263,"endTime":287,"audioSegment":0},{"text":"primary mark, horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions — from a written brief.Marketing Hero ImageCreate a single high-impact marketing hero image from a brief and place it into a working hero section.Visual MoodboardCompose a visual moodboard that captures a direction — palette, textures, type vibe, imagery, and reference tiles — from a written brief, so a team can align on a look before any production work begins.","startTime":287,"endTime":311,"audioSegment":0}],"version":1},"startBlock":{"title":"The Designer","subtitle":"The Designer owns how things look: page layouts, visual hierarchy, imagery that fits the story instead of decorating it. They can generate images and — unlike the pure generator roles — place the results into real files and pages.","ambientMotion":"zoomIn"}}</script>
