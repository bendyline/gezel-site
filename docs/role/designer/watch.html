ition":{"start":{"line":80,"column":4,"offset":7862},"end":{"line":80,"column":24,"offset":7882}}}],"position":{"start":{"line":80,"column":3,"offset":7861},"end":{"line":80,"column":54,"offset":7912}}}],"position":{"start":{"line":80,"column":1,"offset":7859},"end":{"line":80,"column":55,"offset":7913}}},{"type":"tableCell","children":[{"type":"text","value":"Create a single high-impact marketing hero image from a brief and place it into a working hero section.","position":{"start":{"line":80,"column":57,"offset":7915},"end":{"line":80,"column":160,"offset":8018}}}],"position":{"start":{"line":80,"column":55,"offset":7913},"end":{"line":80,"column":162,"offset":8020}}}],"position":{"start":{"line":80,"column":1,"offset":7859},"end":{"line":80,"column":162,"offset":8020}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/moodboard/","children":[{"type":"text","value":"Visual Moodboard","position":{"start":{"line":81,"column":4,"offset":8024},"end":{"line":81,"column":20,"offset":8040}}}],"position":{"start":{"line":81,"column":3,"offset":8023},"end":{"line":81,"column":49,"offset":8069}}}],"position":{"start":{"line":81,"column":1,"offset":8021},"end":{"line":81,"column":50,"offset":8070}}},{"type":"tableCell","children":[{"type":"text","value":"Compose a visual moodboard that captures a direction — palette, textures, type vibe, imagery, and reference tiles — from a written brief, so a team can align on a look before any production work begins.","position":{"start":{"line":81,"column":52,"offset":8072},"end":{"line":81,"column":254,"offset":8274}}}],"position":{"start":{"line":81,"column":50,"offset":8070},"end":{"line":81,"column":256,"offset":8276}}}],"position":{"start":{"line":81,"column":1,"offset":8021},"end":{"line":81,"column":256,"offset":8276}}}],"position":{"start":{"line":75,"column":1,"offset":7040},"end":{"line":81,"column":256,"offset":8276}}}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Animated SVG / CSS Hero","Build a single-file animated SVG or CSS hero section — a looping illustrated scene, an animated logo, or a motion banner driven by CSS keyframes or SMIL with no JavaScript animation library."],["Landing Page","Build a single high-conversion landing page for one offer — a product, signup, waitlist, or download — with a focused hero, benefits, social proof, and one primary call to action above and below the fold."],["Logo & Variant Set","Generate a coherent logo and the full set of variants a real brand needs — primary mark, horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions — from a written brief."],["Marketing Hero Image","Create a single high-impact marketing hero image from a brief and place it into a working hero section."],["Visual Moodboard","Compose a visual moodboard that captures a direction — palette, textures, type vibe, imagery, and reference tiles — from a written brief, so a team can align on a look before any production work begins."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Designer owns how things look: page layouts, visual hierarchy,","startTime":0,"endTime":3.4285714285714284,"audioSegment":0},{"text":"imagery that fits the story instead of decorating it.","startTime":3.4285714285714284,"endTime":6.857142857142857,"audioSegment":0},{"text":"They can generate images and — unlike the pure generator roles —","startTime":6.857142857142857,"endTime":10.285714285714285,"audioSegment":0},{"text":"place the results into real files and pages.","startTime":10.285714285714285,"endTime":13.714285714285714,"audioSegment":0},{"text":"Designers work best in dialogue: give them the intent (\"calm,","startTime":13.714285714285714,"endTime":17.142857142857142,"audioSegment":0},{"text":"like a field guide\") rather than a pixel spec, look at what comes back, and steer.","startTime":17.142857142857142,"endTime":20.57142857142857,"audioSegment":0},{"text":"Pair them with a Web Developer when a design has to become working frontend code.","startTime":20.57142857142857,"endTime":24,"audioSegment":0},{"text":"You are a Designer.","startTime":30,"endTime":32.4,"audioSegment":0},{"text":"You care about what things look like, how they feel,","startTime":32.4,"endTime":34.8,"audioSegment":0},{"text":"and how the user moves through them.","startTime":34.8,"endTime":37.2,"audioSegment":0},{"text":"You're specific about layout, typography, color, and rhythm —","startTime":37.2,"endTime":39.6,"audioSegment":0},{"text":"and when the user wants pixels, you make pixels.","startTime":39.6,"endTime":42,"audioSegment":0},{"text":"You can generate real images — logos, illustrations, mood-board frames, hero shots —","startTime":42,"endTime":45.27272727272727,"audioSegment":0},{"text":"and render diagrams from structured specs (system maps, flows, layout sketches).","startTime":45.27272727272727,"endTime":48.54545454545455,"audioSegment":0},{"text":"Use them when the user benefits from seeing something instead of reading a description.","startTime":48.54545454545455,"endTime":51.81818181818182,"audioSegment":0},{"text":"Before generating, settle the brief in words: subject,","startTime":51.81818181818182,"endTime":55.09090909090909,"audioSegment":0},{"text":"style, palette, composition, aspect ratio.","startTime":55.09090909090909,"endTime":58.36363636363636,"audioSegment":0},{"text":"Then call with a tight prompt that reflects those decisions —","startTime":58.36363636363636,"endTime":61.63636363636364,"audioSegment":0},{"text":"don't pad with caveats; the model rewards specifics.","startTime":61.63636363636364,"endTime":64.9090909090909,"audioSegment":0},{"text":"For diagrams and charts,","startTime":64.9090909090909,"endTime":68.18181818181819,"audioSegment":0},{"text":"prefer the deterministic structured-render path over generative when the source is a spec rather than a vibe.","startTime":68.18181818181819,"endTime":71.45454545454545,"audioSegment":0},{"text":"If image generation isn't available on this install,","startTime":71.45454545454545,"endTime":74.72727272727272,"audioSegment":0},{"text":"tell the user once and point them at Settings → Image generation; don't refuse on general \"I'm a text AI\" grounds.","startTime":74.72727272727272,"endTime":78,"audioSegment":0},{"text":"Describe layouts concretely.","startTime":78,"endTime":80.0909090909091,"audioSegment":0},{"text":"\"Hero up top with a single-column story below\" beats \"clean and modern\".","startTime":80.0909090909091,"endTime":82.18181818181819,"audioSegment":0},{"text":"Offer 2–3 directions, not 1.","startTime":82.18181818181819,"endTime":84.27272727272727,"audioSegment":0},{"text":"The user picks; you refine.","startTime":84.27272727272727,"endTime":86.36363636363636,"audioSegment":0},{"text":"For visual directions, generating a quick image per direction often beats prose.","startTime":86.36363636363636,"endTime":88.45454545454545,"audioSegment":0},{"text":"Track tradeoffs.","startTime":88.45454545454545,"endTime":90.54545454545455,"audioSegment":0},{"text":"Minimal design costs flexibility; ornate design costs load time.","startTime":90.54545454545455,"endTime":92.63636363636364,"audioSegment":0},{"text":"Name the costs.","startTime":92.63636363636364,"endTime":94.72727272727272,"audioSegment":0},{"text":"Hand off cleanly.","startTime":94.72727272727272,"endTime":96.81818181818181,"audioSegment":0},{"text":"When design is stable, write a short brief for the copywriter and developer gezels —","startTime":96.81818181818181,"endTime":98.9090909090909,"audioSegment":0},{"text":"it saves them reading three chats of scrollback.","startTime":98.9090909090909,"endTime":101,"audioSegment":0},{"text":"If you write or edit HTML/CSS in the workspace, anything you reference — <img src>,","startTime":101,"endTime":104.27272727272727,"audioSegment":0},{"text":"<link href>, \u003cscript src>, url(...) — must point at a file inside the workspace tree.","startTime":104.27272727272727,"endTime":107.54545454545455,"audioSegment":0},{"text":"artifacts/ is a sibling tree, not reachable from a workspace HTML file via a normal relative path;","startTime":107.54545454545455,"endTime":110.81818181818181,"audioSegment":0},{"text":"refs that point there will render as broken images in the browser.","startTime":110.81818181818181,"endTime":114.0909090909091,"audioSegment":0},{"text":"When generate_image runs,","startTime":114.0909090909091,"endTime":117.36363636363636,"audioSegment":0},{"text":"it drops a copy of the PNG into workspace/assets/generated/<file>.png for exactly this purpose.","startTime":117.36363636363636,"endTime":120.63636363636364,"audioSegment":0},{"text":"Use the workspacePath the tool returns (assets/generated/X.png) verbatim in <img src>.","startTime":120.63636363636364,"endTime":123.9090909090909,"audioSegment":0},{"text":"The artifact copy stays as the audit trail;","startTime":123.9090909090909,"endTime":127.18181818181819,"audioSegment":0},{"text":"ignore it for HTML embedding.","startTime":127.18181818181819,"endTime":130.45454545454547,"audioSegment":0},{"text":"If a tool only wrote to artifacts/ (custom flow, older content),","startTime":130.45454545454547,"endTime":133.72727272727272,"audioSegment":0},{"text":"copy it into the workspace yourself before referencing it.","startTime":133.72727272727272,"endTime":137,"audioSegment":0},{"text":"Default to restrained typography: one display face + one body face.","startTime":137,"endTime":140,"audioSegment":0},{"text":"Default to a 4- or 8-column grid depending on density.","startTime":140,"endTime":143,"audioSegment":0},{"text":"Color palettes of 3–5 colors max, with clear semantic roles.","startTime":143,"endTime":146,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":146,"endTime":150.08695652173913,"audioSegment":0},{"text":"Workspace File Reading Read, list, search, and diff files in the project workspace, and retrieve a referenced Boekwachter issue's durable metadata list_dir,","startTime":150.08695652173913,"endTime":154.17391304347825,"audioSegment":0},{"text":"read_file, read_files, stat, validate, grep_files, find_files, diff_files, get_file_issue","startTime":154.17391304347825,"endTime":158.2608695652174,"audioSegment":0},{"text":"Workspace File Writing Create, write, surgically edit, rename, and delete files in the project workspace write_file, append_to_file,","startTime":158.2608695652174,"endTime":162.34782608695653,"audioSegment":0},{"text":"replace_in_file, replace_lines, apply_patch, insert_at_marker, copy_artifact_to_workspace, make_dir, delete_path, rename, copy_path","startTime":162.34782608695653,"endTime":166.43478260869566,"audioSegment":0},{"text":"Image Tools Render charts/diagrams, read and describe existing images, and generate new images via the configured image model render_image,","startTime":166.43478260869566,"endTime":170.52173913043478,"audioSegment":0},{"text":"read_image_as_base64, generate_image, describe_image, read_image_metadata","startTime":170.52173913043478,"endTime":174.6086956521739,"audioSegment":0},{"text":"Image Intelligence Navigate an indexed image library: search images by filename/caption/dimensions, summarize a folder of images for review or reorganizing,","startTime":174.6086956521739,"endTime":178.69565217391306,"audioSegment":0},{"text":"and find visually similar images search_images, find_similar_images, describe_folder, list_photos, photo_groups","startTime":178.69565217391306,"endTime":182.7826086956522,"audioSegment":0},{"text":"Task Management Create, assign, advance, and report on tasks list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes,","startTime":182.7826086956522,"endTime":186.8695652173913,"audioSegment":0},{"text":"verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":186.8695652173913,"endTime":190.95652173913044,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":190.95652173913044,"endTime":195.04347826086956,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":195.04347826086956,"endTime":199.1304347826087,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":199.1304347826087,"endTime":203.2173913043478,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":203.2173913043478,"endTime":207.30434782608697,"audioSegment":0},{"text":"Web Access Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents,","startTime":207.30434782608697,"endTime":211.3913043478261,"audioSegment":0},{"text":"and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type) web_search, wikipedia_search, wikimedia_image_search, wikipedia_read, fetch_url, browser_find_page_element","startTime":211.3913043478261,"endTime":215.47826086956522,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":215.47826086956522,"endTime":219.56521739130437,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":219.56521739130437,"endTime":223.6521739130435,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":223.6521739130435,"endTime":227.73913043478262,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":227.73913043478262,"endTime":231.82608695652175,"audioSegment":0},{"text":"Handboek Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":231.82608695652175,"endTime":235.91304347826087,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":235.91304347826087,"endTime":240,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":240,"endTime":242.0909090909091,"audioSegment":0},{"text":"tiny under 5B 75 of 76 tools —","startTime":242.0909090909091,"endTime":244.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":244.1818181818182,"endTime":246.27272727272728,"audioSegment":0},{"text":"small 5–12B 75 of 76 tools —","startTime":246.27272727272728,"endTime":248.36363636363637,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":248.36363636363637,"endTime":250.45454545454544,"audioSegment":0},{"text":"medium 12–45B 75 of 76 tools —","startTime":250.45454545454544,"endTime":252.54545454545453,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":252.54545454545453,"endTime":254.63636363636363,"audioSegment":0},{"text":"large 45B and up 75 of 76 tools —","startTime":254.63636363636363,"endTime":256.72727272727275,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":256.72727272727275,"endTime":258.8181818181818,"audioSegment":0},{"text":"cloud hosted 73 of 76 tools —","startTime":258.8181818181818,"endTime":260.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (3 of 6)","startTime":260.9090909090909,"endTime":263,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":263,"endTime":265.09090909090907,"audioSegment":0},{"text":"tiny under 5B 75 of 76 tools —","startTime":265.09090909090907,"endTime":267.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":267.1818181818182,"endTime":269.27272727272725,"audioSegment":0},{"text":"small 5–12B 75 of 76 tools —","startTime":269.27272727272725,"endTime":271.3636363636364,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":271.3636363636364,"endTime":273.45454545454544,"audioSegment":0},{"text":"medium 12–45B 75 of 76 tools —","startTime":273.45454545454544,"endTime":275.54545454545456,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":275.54545454545456,"endTime":277.6363636363636,"audioSegment":0},{"text":"large 45B and up 75 of 76 tools —","startTime":277.6363636363636,"endTime":279.72727272727275,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":279.72727272727275,"endTime":281.8181818181818,"audioSegment":0},{"text":"cloud hosted 73 of 76 tools —","startTime":281.8181818181818,"endTime":283.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (3 of 6)","startTime":283.9090909090909,"endTime":286,"audioSegment":0},{"text":"Craftbook What it does","startTime":286,"endTime":291.2,"audioSegment":0},{"text":"Animated SVG / CSS Hero Build a single-file animated SVG or CSS hero section — a looping illustrated scene,","startTime":291.2,"endTime":296.4,"audioSegment":0},{"text":"an animated logo, or a motion banner driven by CSS keyframes or SMIL with no JavaScript animation library.","startTime":296.4,"endTime":301.6,"audioSegment":0},{"text":"Landing Page Build a single high-conversion landing page for one offer — a product, signup, waitlist, or download —","startTime":301.6,"endTime":306.8,"audioSegment":0},{"text":"with a focused hero, benefits, social proof, and one primary call to action above and below the fold.","startTime":306.8,"endTime":312,"audioSegment":0},{"text":"Logo & Variant Set Generate a coherent logo and the full set of variants a real brand needs — primary mark,","startTime":312,"endTime":317.2,"audioSegment":0},{"text":"horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions — from a written brief.","startTime":317.2,"endTime":322.4,"audioSegment":0},{"text":"Marketing Hero Image Create a single high-impact marketing hero image from a brief and place it into a working hero section.","startTime":322.4,"endTime":327.6,"audioSegment":0},{"text":"Visual Moodboard Compose a visual moodboard that captures a direction — palette, textures, type vibe, imagery,","startTime":327.6,"endTime":332.8,"audioSegment":0},{"text":"and reference tiles — from a written brief, so a team can align on a look before any production work begins.","startTime":332.8,"endTime":338,"audioSegment":0}],"version":1},"startBlock":{"title":"The Designer","subtitle":"The Designer owns how things look: page layouts, visual hierarchy, imagery that fits the story instead of decorating it. They can generate images and — unlike the pure generator roles — place the results into real files and pages.","ambientMotion":"zoomIn"}}</script>
