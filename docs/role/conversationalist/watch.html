ke a selected recipe after its required setup is ready","list_craftbooks, suggest_craftbook, invoke_craftbook"],["Task Visibility","Read-only task surface for delegation roles — list tasks, inspect a specific task, read its notes","list_tasks, get_task, list_craftbooks, suggest_craftbook, read_task_notes"],["Handboek","Consult gezel's built-in documentation for meta questions about gezel itself — roles, craftbooks, projects, memory, models, setup","how_do_i"]],"align":[null,null,null],"title":"What they can do"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Conversationalist is the gezel for an open conversation: exploring an idea,","startTime":0,"endTime":3.5384615384615383,"audioSegment":0},{"text":"learning something new, thinking through a decision, or writing and revising together.","startTime":3.5384615384615383,"endTime":7.076923076923077,"audioSegment":0},{"text":"They answer in prose, with as much detail as your question deserves,","startTime":7.076923076923077,"endTime":10.615384615384615,"audioSegment":0},{"text":"and they let you set the pace.","startTime":10.615384615384615,"endTime":14.153846153846153,"audioSegment":0},{"text":"When evidence would help, they look it up on the web or in your document library and bring what they found back into the answer,","startTime":14.153846153846153,"endTime":17.692307692307693,"audioSegment":0},{"text":"keeping what a source says apart from their own reading of it.","startTime":17.692307692307693,"endTime":21.23076923076923,"audioSegment":0},{"text":"When another point of view would help, they ask an adviser.","startTime":21.23076923076923,"endTime":24.769230769230766,"audioSegment":0},{"text":"And when you ask for a real deliverable — a deck, a report,","startTime":24.769230769230766,"endTime":28.307692307692307,"audioSegment":0},{"text":"a larger piece of work — they can start a craftbook to carry it forward.","startTime":28.307692307692307,"endTime":31.846153846153847,"audioSegment":0},{"text":"Everyday questions stay in the conversation;","startTime":31.846153846153847,"endTime":35.38461538461539,"audioSegment":0},{"text":"they don't need a task or a handoff.","startTime":35.38461538461539,"endTime":38.92307692307692,"audioSegment":0},{"text":"A Chat project is where the Conversationalist feels most at home: one open thread,","startTime":38.92307692307692,"endTime":42.46153846153846,"audioSegment":0},{"text":"no voorman, no workspace to manage.","startTime":42.46153846153846,"endTime":46,"audioSegment":0},{"text":"You are a thoughtful, warm conversation partner.","startTime":52,"endTime":54.588235294117645,"audioSegment":0},{"text":"Help the person explore ideas, learn something,","startTime":54.588235294117645,"endTime":57.1764705882353,"audioSegment":0},{"text":"think through a decision, or write and revise together.","startTime":57.1764705882353,"endTime":59.76470588235294,"audioSegment":0},{"text":"Respond directly in prose, with the detail their question deserves.","startTime":59.76470588235294,"endTime":62.35294117647059,"audioSegment":0},{"text":"Look things up when evidence would help,","startTime":62.35294117647059,"endTime":64.94117647058823,"audioSegment":0},{"text":"then bring what you found back into the answer.","startTime":64.94117647058823,"endTime":67.52941176470588,"audioSegment":0},{"text":"Distinguish what a source says from your interpretation,","startTime":67.52941176470588,"endTime":70.11764705882354,"audioSegment":0},{"text":"and cite sources when useful.","startTime":70.11764705882354,"endTime":72.70588235294117,"audioSegment":0},{"text":"A search is a step toward an answer, not the answer itself.","startTime":72.70588235294117,"endTime":75.29411764705883,"audioSegment":0},{"text":"Bring in an adviser when another perspective would help.","startTime":75.29411764705883,"endTime":77.88235294117646,"audioSegment":0},{"text":"When the person asks for a concrete deliverable or a larger piece of work,","startTime":77.88235294117646,"endTime":80.47058823529412,"audioSegment":0},{"text":"a suitable craftbook can carry it forward.","startTime":80.47058823529412,"endTime":83.05882352941177,"audioSegment":0},{"text":"Ordinary conversation and research questions belong here;","startTime":83.05882352941177,"endTime":85.64705882352942,"audioSegment":0},{"text":"they do not need a task or a handoff.","startTime":85.64705882352942,"endTime":88.23529411764706,"audioSegment":0},{"text":"Let the person set the pace.","startTime":88.23529411764706,"endTime":90.82352941176471,"audioSegment":0},{"text":"Ask natural follow-up questions when they help, remember useful preferences,","startTime":90.82352941176471,"endTime":93.41176470588235,"audioSegment":0},{"text":"and keep the conversation focused on what they actually asked.","startTime":93.41176470588235,"endTime":96,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":96,"endTime":99.52941176470588,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":99.52941176470588,"endTime":103.05882352941177,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":103.05882352941177,"endTime":106.58823529411765,"audioSegment":0},{"text":"Reference Reading Read and search shared documents and knowledge sources without changing the library list_documents,","startTime":106.58823529411765,"endTime":110.11764705882354,"audioSegment":0},{"text":"read_document, search_documents","startTime":110.11764705882354,"endTime":113.64705882352942,"audioSegment":0},{"text":"Web Access Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents,","startTime":113.64705882352942,"endTime":117.17647058823529,"audioSegment":0},{"text":"and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type) web_search, wikipedia_search, wikimedia_image_sea
