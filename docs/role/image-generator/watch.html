 brief and place it into a working hero section."],["Thumbnail Generator","Derive a consistent set of thumbnails or responsive size-variants from a folder of source images — square crops for grids, srcset widths for the web, smart-cropped to keep the subject centered — and emit them with predictable names."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Image Generator does one thing on purpose: turn descriptions into images.","startTime":0,"endTime":2.888888888888889,"audioSegment":0},{"text":"Illustrations, hero images, textures, mockup art — ask, refine, ask again.","startTime":2.888888888888889,"endTime":5.777777777777778,"audioSegment":0},{"text":"Results land in the project's artifacts,","startTime":5.777777777777778,"endTime":8.666666666666666,"audioSegment":0},{"text":"ready for a Designer or you to place.","startTime":8.666666666666666,"endTime":11.555555555555555,"audioSegment":0},{"text":"This is a deliberately narrow, fixed-function role.","startTime":11.555555555555555,"endTime":14.444444444444445,"audioSegment":0},{"text":"It doesn't edit your files or wander the workspace;","startTime":14.444444444444445,"endTime":17.333333333333332,"audioSegment":0},{"text":"keeping it single-purpose makes it safe to hand loose creative prompts without side effects.","startTime":17.333333333333332,"endTime":20.22222222222222,"audioSegment":0},{"text":"Gezel's install dialog likes to give these gezellen painterly names —","startTime":20.22222222222222,"endTime":23.11111111111111,"audioSegment":0},{"text":"Picasso, Vermeer — because a character beats a button.","startTime":23.11111111111111,"endTime":26,"audioSegment":0},{"text":"This gezel is a pass-through to image generation.","startTime":32,"endTime":35.666666666666664,"audioSegment":0},{"text":"There's no LLM behind it — when you @mention them with a prompt,","startTime":35.666666666666664,"endTime":39.333333333333336,"audioSegment":0},{"text":"the message goes straight to the configured image engine and the result lands in chat.","startTime":39.333333333333336,"endTime":43,"audioSegment":0},{"text":"Type the prompt you'd give to a stable-diffusion-like model:","startTime":43,"endTime":46.6,"audioSegment":0},{"text":"@{name} two horses jumping a cow, oil on canvas, dramatic lighting","startTime":46.6,"endTime":50.2,"audioSegment":0},{"text":"The image is saved into your project's artifacts/generated/ folder and rendered inline in the chat bubble.","startTime":50.2,"endTime":53.8,"audioSegment":0},{"text":"To iterate, ask again with a new prompt —","startTime":53.8,"endTime":57.4,"audioSegment":0},{"text":"there's no conversation memory because there's no model on this side of the wire.","startTime":57.4,"endTime":61,"audioSegment":0},{"text":"This gezel has no about.md to edit (no system prompt).","startTime":61,"endTime":64.25,"audioSegment":0},{"text":"The image engine + model are picked in Settings → Image generation.","startTime":64.25,"endTime":67.5,"audioSegment":0},{"text":"Per-gezel defaults — width, height, sampling steps, model id —","startTime":67.5,"endTime":70.75,"audioSegment":0},{"text":"are editable in the gezel's edit dialog under \"Default arguments\".","startTime":70.75,"endTime":74,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":74,"endTime":77.82352941176471,"audioSegment":0},{"text":"Image Tools Render charts/diagrams, read and describe existing images, and generate new images via the configured image model render_image,","startTime":77.82352941176471,"endTime":81.6470588235294,"audioSegment":0},{"text":"read_image_as_base64, generate_image, describe_image, read_image_metadata","startTime":81.6470588235294,"endTime":85.47058823529412,"audioSegment":0},{"text":"Image Intelligence Navigate an indexed image library: search images by filename/caption/dimensions, summarize a folder of images for review or reorganizing,","startTime":85.47058823529412,"endTime":89.29411764705883,"audioSegment":0},{"text":"and find visually similar images search_images, find_similar_images, describe_folder, list_photos, photo_groups","startTime":89.29411764705883,"endTime":93.11764705882354,"audioSegment":0},{"text":"Task Management Create, assign, advance, and report on tasks list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes,","startTime":93.11764705882354,"endTime":96.94117647058823,"audioSegment":0},{"text":"verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":96.94117647058823,"endTime":100.76470588235294,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":100.76470588235294,"endTime":104.58823529411765,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":104.58823529411765,"endTime":108.41176470588235,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":108.41176470588235,"endTime":112.23529411764706,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":112.23529411764706,"endTime":116.05882352941177,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":116.05882352941177,"endTime":119.88235294117646,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":119.88235294117646,"endTime":123.70588235294119,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":123.70588235294119,"endTime":127.52941176470588,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":127.52941176470588,"endTime":131.3529411764706,"audioSegment":0},{"text":"Handboek Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":131.3529411764706,"endTime":135.1764705882353,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":135.1764705882353,"endTime":139,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":139,"endTime":141,"audioSegment":0},{"text":"tiny under 5B full kit (50 tools)","startTime":141,"endTime":143,"audioSegment":0},{"text":"small 5–12B full kit (50 tools)","startTime":143,"endTime":145,"audioSegment":0},{"text":"medium 12–45B full kit (50 tools)","startTime":145,"endTime":147,"audioSegment":0},{"text":"large 45B and up full kit (50 tools)","startTime":147,"endTime":149,"audioSegment":0},{"text":"cloud hosted full kit (50 tools)","startTime":149,"endTime":151,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":151,"endTime":153,"audioSegment":0},{"text":"tiny under 5B full kit (50 tools)","startTime":153,"endTime":155,"audioSegment":0},{"text":"small 5–12B full kit (50 tools)","startTime":155,"endTime":157,"audioSegment":0},{"text":"medium 12–45B full kit (50 tools)","startTime":157,"endTime":159,"audioSegment":0},{"text":"large 45B and up full kit (50 tools)","startTime":159,"endTime":161,"audioSegment":0},{"text":"cloud hosted full kit (50 tools)","startTime":161,"endTime":163,"audioSegment":0},{"text":"Craftbook What it does","startTime":163,"endTime":168.125,"audioSegment":0},{"text":"Coherent Icon Pack Produce a coherent set of UI icons that look like they belong to one family — consistent grid,","startTime":168.125,"endTime":173.25,"audioSegment":0},{"text":"stroke weight, corner radius, optical sizing, and metaphor language — from a named list of concepts.","startTime":173.25,"endTime":178.375,"audioSegment":0},{"text":"Logo & Variant Set Generate a coherent logo and the full set of variants a real brand needs — primary mark,","startTime":178.375,"endTime":183.5,"audioSegment":0},{"text":"horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions — from a written brief.","startTime":183.5,"endTime":188.625,"audioSegment":0},{"text":"Marketing Hero Image Create a single high-impact marketing hero image from a brief and place it into a working hero section.","startTime":188.625,"endTime":193.75,"audioSegment":0},{"text":"Thumbnail Generator Derive a consistent set of thumbnails or responsive size-variants from a folder of source images —","startTime":193.75,"endTime":198.875,"audioSegment":0},{"text":"square crops for grids, srcset widths for the web, smart-cropped to keep the subject centered — and emit them with predictable names.","startTime":198.875,"endTime":204,"audioSegment":0}],"version":1},"startBlock":{"title":"The Image Generator","subtitle":"The Image Generator does one thing on purpose: turn descriptions into images. Illustrations, hero images, textures, mockup art — ask, refine, ask again. Results land in the project's artifacts, ready for a Designer or you to place.","ambientMotion":"zoomIn"}}</script>
