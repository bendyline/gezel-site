anguage — from a named list of concepts."],["Logo & Variant Set","Generate a coherent logo and the full set of variants a real brand needs — primary mark, horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions — from a written brief."],["Marketing Hero Image","Create a single high-impact marketing hero image from a brief and place it into a working hero section."],["Thumbnail Generator","Derive a consistent set of thumbnails or responsive size-variants from a folder of source images — square crops for grids, srcset widths for the web, smart-cropped to keep the subject centered — and emit them with predictable names."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Image Generator does one thing on purpose: turn descriptions into images.","startTime":0,"endTime":2.888888888888889,"audioSegment":0},{"text":"Illustrations, hero images, textures, mockup art — ask, refine, ask again.","startTime":2.888888888888889,"endTime":5.777777777777778,"audioSegment":0},{"text":"Results land in the project's artifacts,","startTime":5.777777777777778,"endTime":8.666666666666666,"audioSegment":0},{"text":"ready for a Designer or you to place.","startTime":8.666666666666666,"endTime":11.555555555555555,"audioSegment":0},{"text":"This is a deliberately narrow, fixed-function role.","startTime":11.555555555555555,"endTime":14.444444444444445,"audioSegment":0},{"text":"It doesn't edit your files or wander the workspace;","startTime":14.444444444444445,"endTime":17.333333333333332,"audioSegment":0},{"text":"keeping it single-purpose makes it safe to hand loose creative prompts without side effects.","startTime":17.333333333333332,"endTime":20.22222222222222,"audioSegment":0},{"text":"Gezel's install dialog likes to give these gezellen painterly names —","startTime":20.22222222222222,"endTime":23.11111111111111,"audioSegment":0},{"text":"Picasso, Vermeer — because a character beats a button.","startTime":23.11111111111111,"endTime":26,"audioSegment":0},{"text":"This gezel is a pass-through to image generation.","startTime":32,"endTime":35.666666666666664,"audioSegment":0},{"text":"There's no LLM behind it — when you @mention them with a prompt,","startTime":35.666666666666664,"endTime":39.333333333333336,"audioSegment":0},{"text":"the message goes straight to the configured image engine and the result lands in chat.","startTime":39.333333333333336,"endTime":43,"audioSegment":0},{"text":"Type the prompt you'd give to a stable-diffusion-like model:","startTime":43,"endTime":46.6,"audioSegment":0},{"text":"@{name} two horses jumping a cow, oil on canvas, dramatic lighting","startTime":46.6,"endTime":50.2,"audioSegment":0},{"text":"The image is saved into your project's artifacts/generated/ folder and rendered inline in the chat bubble.","startTime":50.2,"endTime":53.8,"audioSegment":0},{"text":"To iterate, ask again with a new prompt —","startTime":53.8,"endTime":57.4,"audioSegment":0},{"text":"there's no conversation memory because there's no model on this side of the wire.","startTime":57.4,"endTime":61,"audioSegment":0},{"text":"This gezel has no about.md to edit (no system prompt).","startTime":61,"endTime":64.25,"audioSegment":0},{"text":"The image engine + model are picked in Settings → Image generation.","startTime":64.25,"endTime":67.5,"audioSegment":0},{"text":"Per-gezel defaults — width, height, sampling steps, model id —","startTime":67.5,"endTime":70.75,"audioSegment":0},{"text":"are editable in the gezel's edit dialog under \"Default arguments\".","startTime":70.75,"endTime":74,"audioSegment":0},{"text":"Tool groupPurposeToolsImage ToolsRender charts/diagrams, read and describe existing images, and generate new images via the configured image modelrender_image, read_image_as_base64, generate_image, describe_image, read_image_metadataImage IntelligenceNavigate an indexed image library: search images by filename/caption/dimensions, summarize a folder of images for review or reorganizing, and find visually similar imagessearch_images, find_similar_images, describe_folderTask ManagementCreate, assign, advance, and report on taskslist_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes, verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instancesProject ArtifactsProject-scoped read-write outputs (reports,","startTime":74,"endTime":100.5,"audioSegment":0},{"text":"scratch files, scripts a gezel produces, and large outputs auto-saved by tools that exceed the inline cap)list_artifacts, read_artifact, write_artifact, grep_artifactDocumentsCross-project shared library — mission docs, guidelines, and any markdown the user wants every gezel to be able to findlist_documents, read_document, write_document, delete_document, search_documentsMemoryPersistent notes a gezel can search, recall, and write backsearch_memory, save_memory, list_memoriesUser InteractionPose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel), or to a role-shaped specialist (ask_specialist) — instead of guessingask_user_question, ask_gezel, ask_specialistHandboekConsult gezel's built-in documentation for meta questions about gezel itself — roles, craftbooks, projects, memory, models, setuphow_do_i","startTime":100.5,"endTime":127,"audioSegment":0},{"text":"TierModel sizeTool surface for this roletinyunder 5Bfull kit (45 tools)small5–12Bfull kit (45 tools)medium12–45Bfull kit (45 tools)large45B and upfull kit (45 tools)cloudhostedfull kit (45 tools)","startTime":127,"endTime":134,"audioSegment":0},{"text":"TierModel sizeTool surface for this roletinyunder 5Bfull kit (45 tools)small5–12Bfull kit (45 tools)medium12–45Bfull kit (45 tools)large45B and upfull kit (45 tools)cloudhostedfull kit (45 tools)","startTime":134,"endTime":141,"audioSegment":0},{"text":"CraftbookWhat it doesCoherent Icon PackProduce a coherent set of UI icons that look like they belong to one family — consistent grid, stroke weight, corner radius, optical sizing, and metaphor language — from a named list of concepts.Logo & Variant SetGenerate a coherent logo and the full set of variants a real brand needs — primary mark, horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions —","startTime":141,"endTime":160.5,"audioSegment":0},{"text":"from a written brief.Marketing Hero ImageCreate a single high-impact marketing hero image from a brief and place it into a working hero section.Thumbnail GeneratorDerive a consistent set of thumbnails or responsive size-variants from a folder of source images — square crops for grids, srcset widths for the web, smart-cropped to keep the subject centered — and emit them with predictable names.","startTime":160.5,"endTime":180,"audioSegment":0}],"version":1},"startBlock":{"title":"The Image Generator","subtitle":"The Image Generator does one thing on purpose: turn descriptions into images. Illustrations, hero images, textures, mockup art — ask, refine, ask again. Results land in the project's artifacts, ready for a Designer or you to place.","ambientMotion":"zoomIn"}}</script>
