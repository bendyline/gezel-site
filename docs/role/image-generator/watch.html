,"column":8,"offset":8637}}},{"type":"strong","children":[{"type":"text","value":"OpenAI Codex CLI (cloud, experimental)","position":{"start":{"line":94,"column":10,"offset":8639},"end":{"line":94,"column":48,"offset":8677}}}],"position":{"start":{"line":94,"column":8,"offset":8637},"end":{"line":94,"column":50,"offset":8679}}},{"type":"text","value":" in Settings → Image generation. Install or update Codex CLI and sign it in with ","position":{"start":{"line":94,"column":50,"offset":8679},"end":{"line":94,"column":131,"offset":8760}}},{"type":"inlineCode","value":"codex login","position":{"start":{"line":94,"column":131,"offset":8760},"end":{"line":94,"column":144,"offset":8773}}},{"type":"text","value":". Gezel uses whatever the CLI is signed in with, under that account's usage limits and terms; it does not need a separate image API key. The CLI runs on the machine hosting your per-user Gezel service. If needed, set its binary path in Settings → OpenAI Codex CLI → Advanced.","position":{"start":{"line":94,"column":144,"offset":8773},"end":{"line":94,"column":419,"offset":9048}}}],"position":{"start":{"line":94,"column":1,"offset":8630},"end":{"line":94,"column":419,"offset":9048}}},{"type":"paragraph","children":[{"type":"text","value":"Chat, MCP, and direct image requests use the same provider. Prompts, reference images, negative instructions, size, aspect ratio, quality, and edit-strength guidance go into the image request. Codex controls the underlying image model and final render settings: size and quality are requests in the brief, and edit strength is approximate. Seeds and sampling steps are unavailable. Results include actual pixel dimensions and notes about unsupported controls or size differences. Only native image output is accepted; a text response claiming to have saved an image is not a successful render.","position":{"start":{"line":96,"column":1,"offset":9050},"end":{"line":96,"column":594,"offset":9643}}}],"position":{"start":{"line":96,"column":1,"offset":9050},"end":{"line":96,"column":594,"offset":9643}}}]}],"autoTemplate":true,"templateData":{"headers":["Plan","What it does"],"rows":[["Coherent Icon Pack","Produce a coherent set of UI icons that look like they belong to one family — consistent grid, stroke weight, corner radius, optical sizing, and metaphor language — from a named list of concepts."],["Logo & Variant Set","Generate a coherent logo and the full set of variants a real brand needs — primary mark, horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions — from a written brief."],["Marketing Hero Image","Create a single high-impact marketing hero image from a brief and place it into a working hero section."],["Thumbnail Generator","Derive a consistent set of thumbnails or responsive size-variants from a folder of source images — square crops for grids, srcset widths for the web, smart-cropped to keep the subject centered — and emit them with predictable names."]],"align":[null,null],"title":"Plans they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Image Generator does one thing on purpose: turn descriptions into images.","startTime":0,"endTime":2.888888888888889,"audioSegment":0},{"text":"Illustrations, hero images, textures, mockup art — ask, refine, ask again.","startTime":2.888888888888889,"endTime":5.777777777777778,"audioSegment":0},{"text":"Results land in the project's artifacts,","startTime":5.777777777777778,"endTime":8.666666666666666,"audioSegment":0},{"text":"ready for a Designer or you to place.","startTime":8.666666666666666,"endTime":11.555555555555555,"audioSegment":0},{"text":"This is a deliberately narrow, fixed-function role.","startTime":11.555555555555555,"endTime":14.444444444444445,"audioSegment":0},{"text":"It doesn't edit your files or wander the workspace;","startTime":14.444444444444445,"endTime":17.333333333333332,"audioSegment":0},{"text":"keeping it single-purpose makes it safe to hand loose creative prompts without side effects.","startTime":17.333333333333332,"endTime":20.22222222222222,"audioSegment":0},{"text":"Gezel's install dialog gives these crew members painterly names —","startTime":20.22222222222222,"endTime":23.11111111111111,"audioSegment":0},{"text":"Picasso, Vermeer — because a character beats a button.","startTime":23.11111111111111,"endTime":26,"audioSegment":0},{"text":"To change a picture rather than make a new one,","startTime":26,"endTime":29.571428571428573,"audioSegment":0},{"text":"add an Image editor to your crew from the catalog.","startTime":29.571428571428573,"endTime":33.142857142857146,"audioSegment":0},{"text":"Attach a picture to your message and say what to change (\"remove the people in the background,\" \"turn it into a watercolor\").","startTime":33.142857142857146,"endTime":36.714285714285715,"audioSegment":0},{"text":"It changes that and keeps the rest.","startTime":36.714285714285715,"endTime":40.285714285714285,"audioSegment":0},{"text":"Send the next change without a picture and it keeps editing the last result,","startTime":40.285714285714285,"endTime":43.85714285714286,"audioSegment":0},{"text":"or attach up to three pictures to combine them.","startTime":43.85714285714286,"endTime":47.42857142857143,"audioSegment":0},{"text":"A message with no picture to change is turned away,","startTime":47.42857142857143,"endTime":51,"audioSegment":0},{"text":"so it never draws something new from words alone.","startTime":51,"endTime":54.57142857142857,"audioSegment":0},{"text":"On this computer, editing needs a model that can do it.","startTime":54.57142857142857,"endTime":58.142857142857146,"audioSegment":0},{"text":"Qwen Image Edit 2511 is made for editing and does nothing else.","startTime":58.142857142857146,"endTime":61.714285714285715,"audioSegment":0},{"text":"FLUX.2 Klein draws new pictures and edits too.","startTime":61.714285714285715,"endTime":65.28571428571428,"audioSegment":0},{"text":"Whenever a picture comes with the request, whether it went to the Image editor or to anyone else,","startTime":65.28571428571428,"endTime":68.85714285714286,"audioSegment":0},{"text":"Gezel picks an installed model that can edit it, and the result keeps the picture's shape unless you choose another.","startTime":68.85714285714286,"endTime":72.42857142857143,"audioSegment":0},{"text":"Download them in Settings → Image generation.","startTime":72.42857142857143,"endTime":76,"audioSegment":0},{"text":"Models on this computer can take two kinds of add-on,","startTime":76,"endTime":78.75,"audioSegment":0},{"text":"both from Settings → Image generation → Styles and fast mode.","startTime":78.75,"endTime":81.5,"audioSegment":0},{"text":"Each works only with the models it names,","startTime":81.5,"endTime":84.25,"audioSegment":0},{"text":"so Settings offers only the ones that fit a model you have.","startTime":84.25,"endTime":87,"audioSegment":0},{"text":"Fast mode draws a picture in a few steps instead of dozens.","startTime":87,"endTime":89.75,"audioSegment":0},{"text":"Once you get it, it is on for that model;","startTime":89.75,"endTime":92.5,"audioSegment":0},{"text":"switch it off in the model's row.","startTime":92.5,"endTime":95.25,"audioSegment":0},{"text":"Asking for more steps than fast mode uses leaves it off for that picture.","startTime":95.25,"endTime":98,"audioSegment":0},{"text":"A style gives a picture a set look,","startTime":98,"endTime":100.75,"audioSegment":0},{"text":"such as pixel art or watercolor.","startTime":100.75,"endTime":103.5,"audioSegment":0},{"text":"Pick it in the Style menu above the message,","startTime":103.5,"endTime":106.25,"audioSegment":0},{"text":"or ask for it by name.","startTime":106.25,"endTime":109,"audioSegment":0},{"text":"A style that doesn't match leaves the picture without one,","startTime":109,"endTime":111.75,"audioSegment":0},{"text":"and the result names the styles the model has.","startTime":111.75,"endTime":114.5,"audioSegment":0},{"text":"A few styles carry their model's license, which restricts commercial use.","startTime":114.5,"endTime":117.25,"audioSegment":0},{"text":"Their license button says so.","startTime":117.25,"endTime":120,"audioSegment":0},{"text":"Choose GitHub Copilot CLI in Settings → Image generation → Engine to use Copilot's experimental image generator.","startTime":120,"endTime":123.25,"audioSegment":0},{"text":"Install or update the Copilot runtime there if needed.","startTime":123.25,"endTime":126.5,"audioSegment":0},{"text":"Gezel uses your existing Copilot sign-in,","startTime":126.5,"endTime":129.75,"audioSegment":0},{"text":"or the GitHub token configured in Gezel; no separate image API key is required.","startTime":129.75,"endTime":133,"audioSegment":0},{"text":"Your account's image access, organization policies, and usage limits still apply.","startTime":133,"endTime":136.25,"audioSegment":0},{"text":"Being signed in does not guarantee image generation is available.","startTime":136.25,"endTime":139.5,"audioSegment":0},{"text":"Describe the image in chat, or call generate_image through MCP.","startTime":139.5,"endTime":142.75,"audioSegment":0},{"text":"Prompts, reference images, aspect ratio, explicit dimensions,","startTime":142.75,"endTime":146,"audioSegment":0},{"text":"and quality reach the same image provider.","startTime":146,"endTime":149.25,"audioSegment":0},{"text":"Copilot currently accepts square (1024×1024), landscape (1536×1024), and portrait (1024×1536) images;","startTime":149.25,"endTime":152.5,"audioSegment":0},{"text":"other dimensions use the closest supported shape and the result explains the adjustment.","startTime":152.5,"endTime":155.75,"audioSegment":0},{"text":"Negative prompts become instructions about what to avoid.","startTime":155.75,"endTime":159,"audioSegment":0},{"text":"Copilot chooses its image model and does not expose a reproducible seed, sampling steps,","startTime":159,"endTime":162.25,"audioSegment":0},{"text":"or edit strength; requests for those controls return an explanatory note.","startTime":162.25,"endTime":165.5,"audioSegment":0},{"text":"Image generation follows Gezel's cloud cost-confirmation setting.","startTime":165.5,"endTime":168.75,"audioSegment":0},{"text":"Other apps using Gezel's MCP tools need Any image engine access in Settings → Integrations to use Copilot.","startTime":168.75,"endTime":172,"audioSegment":0},{"text":"This gezel is a pass-through to image generation.","startTime":178,"endTime":181.66666666666666,"audioSegment":0},{"text":"There's no LLM behind it — when you @mention them with a prompt,","startTime":181.66666666666666,"endTime":185.33333333333334,"audioSegment":0},{"text":"the message goes straight to the configured image engine and the result lands in chat.","startTime":185.33333333333334,"endTime":189,"audioSegment":0},{"text":"Type the prompt you'd give to a stable-diffusion-like model:","startTime":189,"endTime":192.6,"audioSegment":0},{"text":"@{name} two horses jumping a cow, oil on canvas, dramatic lighting","startTime":192.6,"endTime":196.2,"audioSegment":0},{"text":"The image is saved into your project's artifacts/generated/ folder and rendered inline in the chat bubble.","startTime":196.2,"endTime":199.8,"audioSegment":0},{"text":"To iterate, ask again with a new prompt —","startTime":199.8,"endTime":203.4,"audioSegment":0},{"text":"there's no conversation memory because there's no model on this side of the wire.","startTime":203.4,"endTime":207,"audioSegment":0},{"text":"This gezel has no about.md to edit (no system prompt).","startTime":207,"endTime":210.25,"audioSegment":0},{"text":"The image engine + model are picked in Settings → Image generation.","startTime":210.25,"endTime":213.5,"audioSegment":0},{"text":"Per-gezel defaults — width, height, sampling steps, model id —","startTime":213.5,"endTime":216.75,"audioSegment":0},{"text":"are editable in the gezel's edit dialog under \"Default arguments\".","startTime":216.75,"endTime":220,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":220,"endTime":223.8421052631579,"audioSegment":0},{"text":"Image Tools Render charts/diagrams, read and describe existing images, and generate new images via the configured image model render_image,","startTime":223.8421052631579,"endTime":227.68421052631578,"audioSegment":0},{"text":"read_image_as_base64, generate_image, describe_image, read_image_metadata","startTime":227.68421052631578,"endTime":231.5263157894737,"audioSegment":0},{"text":"Image Intelligence Navigate an indexed image library: search images by filename/caption/dimensions, summarize a folder of images for review or reorganizing,","startTime":231.5263157894737,"endTime":235.3684210526316,"audioSegment":0},{"text":"and find visually similar images search_images, find_similar_images, describe_folder, list_photos, photo_groups","startTime":235.3684210526316,"endTime":239.21052631578948,"audioSegment":0},{"text":"Workspace File Writing Create, write, surgically edit, rename, and delete files in the project workspace write_file, append_to_file,","startTime":239.21052631578948,"endTime":243.05263157894737,"audioSegment":0},{"text":"replace_in_file, replace_lines, apply_patch, insert_at_marker, copy_artifact_to_workspace, make_dir, delete_path, rename, copy_path","startTime":243.05263157894737,"endTime":246.89473684210526,"audioSegment":0},{"text":"Task Management Create, assign, advance, and report on tasks list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes,","startTime":246.89473684210526,"endTime":250.73684210526315,"audioSegment":0},{"text":"verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":250.73684210526315,"endTime":254.57894736842104,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":254.57894736842104,"endTime":258.42105263157896,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":258.42105263157896,"endTime":262.2631578947368,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":262.2631578947368,"endTime":266.10526315789474,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":266.10526315789474,"endTime":269.9473684210526,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":269.9473684210526,"endTime":273.7894736842105,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":273.7894736842105,"endTime":277.63157894736844,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":277.63157894736844,"endTime":281.4736842105263,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":281.4736842105263,"endTime":285.3157894736842,"audioSegment":0},{"text":"Handboek Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":285.3157894736842,"endTime":289.1578947368421,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":289.1578947368421,"endTime":293,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":293,"endTime":295,"audioSegment":0},{"text":"tiny under 5B full kit (61 tools)","startTime":295,"endTime":297,"audioSegment":0},{"text":"small 5–12B full kit (61 tools)","startTime":297,"endTime":299,"audioSegment":0},{"text":"medium 12–45B full kit (61 tools)","startTime":299,"endTime":301,"audioSegment":0},{"text":"large 45B and up full kit (61 tools)","startTime":301,"endTime":303,"audioSegment":0},{"text":"cloud hosted full kit (61 tools)","startTime":303,"endTime":305,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":305,"endTime":307,"audioSegment":0},{"text":"tiny under 5B full kit (61 tools)","startTime":307,"endTime":309,"audioSegment":0},{"text":"small 5–12B full kit (61 tools)","startTime":309,"endTime":311,"audioSegment":0},{"text":"medium 12–45B full kit (61 tools)","startTime":311,"endTime":313,"audioSegment":0},{"text":"large 45B and up full kit (61 tools)","startTime":313,"endTime":315,"audioSegment":0},{"text":"cloud hosted full kit (61 tools)","startTime":315,"endTime":317,"audioSegment":0},{"text":"Plan What it does","startTime":317,"endTime":322.125,"audioSegment":0},{"text":"Coherent Icon Pack Produce a coherent set of UI icons that look like they belong to one family — consistent grid,","startTime":322.125,"endTime":327.25,"audioSegment":0},{"text":"stroke weight, corner radius, optical sizing, and metaphor language — from a named list of concepts.","startTime":327.25,"endTime":332.375,"audioSegment":0},{"text":"Logo & Variant Set Generate a coherent logo and the full set of variants a real brand needs — primary mark,","startTime":332.375,"endTime":337.5,"audioSegment":0},{"text":"horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions — from a written brief.","startTime":337.5,"endTime":342.625,"audioSegment":0},{"text":"Marketing Hero Image Create a single high-impact marketing hero image from a brief and place it into a working hero section.","startTime":342.625,"endTime":347.75,"audioSegment":0},{"text":"Thumbnail Generator Derive a consistent set of thumbnails or responsive size-variants from a folder of source images —","startTime":347.75,"endTime":352.875,"audioSegment":0},{"text":"square crops for grids, srcset widths for the web, smart-cropped to keep the subject centered — and emit them with predictable names.","startTime":352.875,"endTime":358,"audioSegment":0},{"text":"Choose OpenAI Codex CLI (cloud, experimental) in Settings → Image generation.","startTime":358,"endTime":361.26666666666665,"audioSegment":0},{"text":"Install or update Codex CLI and sign it in with codex login.","startTime":361.26666666666665,"endTime":364.53333333333336,"audioSegment":0},{"text":"Gezel uses whatever the CLI is signed in with,","startTime":364.53333333333336,"endTime":367.8,"audioSegment":0},{"text":"under that account's usage limits and terms; it does not need a separate image API key.","startTime":367.8,"endTime":371.06666666666666,"audioSegment":0},{"text":"The CLI runs on the machine hosting your per-user Gezel service. If needed,","startTime":371.06666666666666,"endTime":374.3333333333333,"audioSegment":0},{"text":"set its binary path in Settings → OpenAI Codex CLI → Advanced.","startTime":374.3333333333333,"endTime":377.6,"audioSegment":0},{"text":"Chat, MCP, and direct image requests use the same provider.","startTime":377.6,"endTime":380.8666666666667,"audioSegment":0},{"text":"Prompts, reference images, negative instructions, size, aspect ratio,","startTime":380.8666666666667,"endTime":384.1333333333333,"audioSegment":0},{"text":"quality, and edit-strength guidance go into the image request.","startTime":384.1333333333333,"endTime":387.4,"audioSegment":0},{"text":"Codex controls the underlying image model and final render settings: size and quality are requests in the brief,","startTime":387.4,"endTime":390.6666666666667,"audioSegment":0},{"text":"and edit strength is approximate.","startTime":390.6666666666667,"endTime":393.93333333333334,"audioSegment":0},{"text":"Seeds and sampling steps are unavailable.","startTime":393.93333333333334,"endTime":397.2,"audioSegment":0},{"text":"Results include actual pixel dimensions and notes about unsupported controls or size differences.","startTime":397.2,"endTime":400.4666666666667,"audioSegment":0},{"text":"Only native image output is accepted;","startTime":400.4666666666667,"endTime":403.73333333333335,"audioSegment":0},{"text":"a text response claiming to have saved an image is not a successful render.","startTime":403.73333333333335,"endTime":407,"audioSegment":0}],"version":1},"startBlock":{"title":"The Image Generator","subtitle":"The Image Generator does one thing on purpose: turn descriptions into images. Illustrations, hero images, textures, mockup art — ask, refine, ask again. Results land in the project's artifacts, ready for a Designer or you to place.","ambientMotion":"zoomIn"}}</script>
