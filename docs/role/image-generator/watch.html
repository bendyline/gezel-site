"type":"heading","depth":3,"children":[{"type":"text","value":"Codex CLI","position":{"start":{"line":77,"column":5,"offset":6854},"end":{"line":77,"column":14,"offset":6863}}}],"position":{"start":{"line":77,"column":1,"offset":6850},"end":{"line":77,"column":14,"offset":6863}}},"title":"Codex CLI","contents":[{"type":"paragraph","children":[{"type":"text","value":"Choose ","position":{"start":{"line":79,"column":1,"offset":6865},"end":{"line":79,"column":8,"offset":6872}}},{"type":"strong","children":[{"type":"text","value":"OpenAI Codex CLI (cloud, experimental)","position":{"start":{"line":79,"column":10,"offset":6874},"end":{"line":79,"column":48,"offset":6912}}}],"position":{"start":{"line":79,"column":8,"offset":6872},"end":{"line":79,"column":50,"offset":6914}}},{"type":"text","value":" in Settings → Image generation. Install or update Codex CLI and run ","position":{"start":{"line":79,"column":50,"offset":6914},"end":{"line":79,"column":119,"offset":6983}}},{"type":"inlineCode","value":"codex login","position":{"start":{"line":79,"column":119,"offset":6983},"end":{"line":79,"column":132,"offset":6996}}},{"type":"text","value":" with your ChatGPT account. Gezel uses that existing sign-in and Codex usage limits; it does not need an image API key. The CLI runs on the machine hosting your per-user Gezel service. If needed, set its binary path in Settings → OpenAI Codex CLI → Advanced.","position":{"start":{"line":79,"column":132,"offset":6996},"end":{"line":79,"column":390,"offset":7254}}}],"position":{"start":{"line":79,"column":1,"offset":6865},"end":{"line":79,"column":390,"offset":7254}}},{"type":"paragraph","children":[{"type":"text","value":"Chat, MCP, and direct image requests use the same provider. Prompts, reference images, negative instructions, size, aspect ratio, quality, and edit-strength guidance go into the image request. Codex controls the underlying image model and final render settings: size and quality are requests in the brief, and edit strength is approximate. Seeds and sampling steps are unavailable. Results include actual pixel dimensions and notes about unsupported controls or size differences. Only native image output is accepted; a text response claiming to have saved an image is not a successful render.","position":{"start":{"line":81,"column":1,"offset":7256},"end":{"line":81,"column":594,"offset":7849}}}],"position":{"start":{"line":81,"column":1,"offset":7256},"end":{"line":81,"column":594,"offset":7849}}}]}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Coherent Icon Pack","Produce a coherent set of UI icons that look like they belong to one family — consistent grid, stroke weight, corner radius, optical sizing, and metaphor language — from a named list of concepts."],["Logo & Variant Set","Generate a coherent logo and the full set of variants a real brand needs — primary mark, horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions — from a written brief."],["Marketing Hero Image","Create a single high-impact marketing hero image from a brief and place it into a working hero section."],["Thumbnail Generator","Derive a consistent set of thumbnails or responsive size-variants from a folder of source images — square crops for grids, srcset widths for the web, smart-cropped to keep the subject centered — and emit them with predictable names."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Image Generator does one thing on purpose: turn descriptions into images.","startTime":0,"endTime":2.888888888888889,"audioSegment":0},{"text":"Illustrations, hero images, textures, mockup art — ask, refine, ask again.","startTime":2.888888888888889,"endTime":5.777777777777778,"audioSegment":0},{"text":"Results land in the project's artifacts,","startTime":5.777777777777778,"endTime":8.666666666666666,"audioSegment":0},{"text":"ready for a Designer or you to place.","startTime":8.666666666666666,"endTime":11.555555555555555,"audioSegment":0},{"text":"This is a deliberately narrow, fixed-function role.","startTime":11.555555555555555,"endTime":14.444444444444445,"audioSegment":0},{"text":"It doesn't edit your files or wander the workspace;","startTime":14.444444444444445,"endTime":17.333333333333332,"audioSegment":0},{"text":"keeping it single-purpose makes it safe to hand loose creative prompts without side effects.","startTime":17.333333333333332,"endTime":20.22222222222222,"audioSegment":0},{"text":"Gezel's install dialog likes to give these gezellen painterly names —","startTime":20.22222222222222,"endTime":23.11111111111111,"audioSegment":0},{"text":"Picasso, Vermeer — because a character beats a button.","startTime":23.11111111111111,"endTime":26,"audioSegment":0},{"text":"Choose GitHub Copilot CLI in Settings → Image generation → Engine to use Copilot's experimental image generator.","startTime":26,"endTime":29.25,"audioSegment":0},{"text":"Install or update the Copilot runtime there if needed.","startTime":29.25,"endTime":32.5,"audioSegment":0},{"text":"Gezel uses your existing Copilot sign-in,","startTime":32.5,"endTime":35.75,"audioSegment":0},{"text":"or the GitHub token configured in Gezel; no separate image API key is required.","startTime":35.75,"endTime":39,"audioSegment":0},{"text":"Your account's image access, organization policies, and usage limits still apply.","startTime":39,"endTime":42.25,"audioSegment":0},{"text":"Being signed in does not guarantee image generation is available.","startTime":42.25,"endTime":45.5,"audioSegment":0},{"text":"Describe the image in chat, or call generate_image through MCP.","startTime":45.5,"endTime":48.75,"audioSegment":0},{"text":"Prompts, reference images, aspect ratio, explicit dimensions,","startTime":48.75,"endTime":52,"audioSegment":0},{"text":"and quality reach the same image provider.","startTime":52,"endTime":55.25,"audioSegment":0},{"text":"Copilot currently accepts square (1024×1024), landscape (1536×1024), and portrait (1024×1536) images;","startTime":55.25,"endTime":58.5,"audioSegment":0},{"text":"other dimensions use the closest supported shape and the result explains the adjustment.","startTime":58.5,"endTime":61.75,"audioSegment":0},{"text":"Negative prompts become instructions about what to avoid.","startTime":61.75,"endTime":65,"audioSegment":0},{"text":"Copilot chooses its image model and does not expose a reproducible seed, sampling steps,","startTime":65,"endTime":68.25,"audioSegment":0},{"text":"or edit strength; requests for those controls return an explanatory note.","startTime":68.25,"endTime":71.5,"audioSegment":0},{"text":"Image generation follows Gezel's cloud cost-confirmation setting.","startTime":71.5,"endTime":74.75,"audioSegment":0},{"text":"Other apps using Gezel's MCP tools need Any image engine access in Settings → Integrations to use Copilot.","startTime":74.75,"endTime":78,"audioSegment":0},{"text":"This gezel is a pass-through to image generation.","startTime":84,"endTime":87.66666666666667,"audioSegment":0},{"text":"There's no LLM behind it — when you @mention them with a prompt,","startTime":87.66666666666667,"endTime":91.33333333333333,"audioSegment":0},{"text":"the message goes straight to the configured image engine and the result lands in chat.","startTime":91.33333333333333,"endTime":95,"audioSegment":0},{"text":"Type the prompt you'd give to a stable-diffusion-like model:","startTime":95,"endTime":98.6,"audioSegment":0},{"text":"@{name} two horses jumping a cow, oil on canvas, dramatic lighting","startTime":98.6,"endTime":102.2,"audioSegment":0},{"text":"The image is saved into your project's artifacts/generated/ folder and rendered inline in the chat bubble.","startTime":102.2,"endTime":105.8,"audioSegment":0},{"text":"To iterate, ask again with a new prompt —","startTime":105.8,"endTime":109.4,"audioSegment":0},{"text":"there's no conversation memory because there's no model on this side of the wire.","startTime":109.4,"endTime":113,"audioSegment":0},{"text":"This gezel has no about.md to edit (no system prompt).","startTime":113,"endTime":116.25,"audioSegment":0},{"text":"The image engine + model are picked in Settings → Image generation.","startTime":116.25,"endTime":119.5,"audioSegment":0},{"text":"Per-gezel defaults — width, height, sampling steps, model id —","startTime":119.5,"endTime":122.75,"audioSegment":0},{"text":"are editable in the gezel's edit dialog under \"Default arguments\".","startTime":122.75,"endTime":126,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":126,"endTime":129.8421052631579,"audioSegment":0},{"text":"Image Tools Render charts/diagrams, read and describe existing images, and generate new images via the configured image model render_image,","startTime":129.8421052631579,"endTime":133.68421052631578,"audioSegment":0},{"text":"read_image_as_base64, generate_image, describe_image, read_image_metadata","startTime":133.68421052631578,"endTime":137.5263157894737,"audioSegment":0},{"text":"Image Intelligence Navigate an indexed image library: search images by filename/caption/dimensions, summarize a folder of images for review or reorganizing,","startTime":137.5263157894737,"endTime":141.3684210526316,"audioSegment":0},{"text":"and find visually similar images search_images, find_similar_images, describe_folder, list_photos, photo_groups","startTime":141.3684210526316,"endTime":145.21052631578948,"audioSegment":0},{"text":"Workspace File Writing Create, write, surgically edit, rename, and delete files in the project workspace write_file, append_to_file,","startTime":145.21052631578948,"endTime":149.05263157894737,"audioSegment":0},{"text":"replace_in_file, replace_lines, apply_patch, insert_at_marker, copy_artifact_to_workspace, make_dir, delete_path, rename, copy_path","startTime":149.05263157894737,"endTime":152.89473684210526,"audioSegment":0},{"text":"Task Management Create, assign, advance, and report on tasks list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes,","startTime":152.89473684210526,"endTime":156.73684210526315,"audioSegment":0},{"text":"verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":156.73684210526315,"endTime":160.57894736842104,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":160.57894736842104,"endTime":164.42105263157896,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":164.42105263157896,"endTime":168.26315789473685,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":168.26315789473685,"endTime":172.10526315789474,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":172.10526315789474,"endTime":175.94736842105263,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":175.94736842105263,"endTime":179.78947368421052,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":179.78947368421052,"endTime":183.6315789473684,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":183.6315789473684,"endTime":187.4736842105263,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":187.4736842105263,"endTime":191.31578947368422,"audioSegment":0},{"text":"Handboek Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":191.31578947368422,"endTime":195.1578947368421,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":195.1578947368421,"endTime":199,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":199,"endTime":201,"audioSegment":0},{"text":"tiny under 5B full kit (61 tools)","startTime":201,"endTime":203,"audioSegment":0},{"text":"small 5–12B full kit (61 tools)","startTime":203,"endTime":205,"audioSegment":0},{"text":"medium 12–45B full kit (61 tools)","startTime":205,"endTime":207,"audioSegment":0},{"text":"large 45B and up full kit (61 tools)","startTime":207,"endTime":209,"audioSegment":0},{"text":"cloud hosted full kit (61 tools)","startTime":209,"endTime":211,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":211,"endTime":213,"audioSegment":0},{"text":"tiny under 5B full kit (61 tools)","startTime":213,"endTime":215,"audioSegment":0},{"text":"small 5–12B full kit (61 tools)","startTime":215,"endTime":217,"audioSegment":0},{"text":"medium 12–45B full kit (61 tools)","startTime":217,"endTime":219,"audioSegment":0},{"text":"large 45B and up full kit (61 tools)","startTime":219,"endTime":221,"audioSegment":0},{"text":"cloud hosted full kit (61 tools)","startTime":221,"endTime":223,"audioSegment":0},{"text":"Craftbook What it does","startTime":223,"endTime":228.125,"audioSegment":0},{"text":"Coherent Icon Pack Produce a coherent set of UI icons that look like they belong to one family — consistent grid,","startTime":228.125,"endTime":233.25,"audioSegment":0},{"text":"stroke weight, corner radius, optical sizing, and metaphor language — from a named list of concepts.","startTime":233.25,"endTime":238.375,"audioSegment":0},{"text":"Logo & Variant Set Generate a coherent logo and the full set of variants a real brand needs — primary mark,","startTime":238.375,"endTime":243.5,"audioSegment":0},{"text":"horizontal lockup, stacked lockup, icon-only/favicon, plus light-on-dark and monochrome versions — from a written brief.","startTime":243.5,"endTime":248.625,"audioSegment":0},{"text":"Marketing Hero Image Create a single high-impact marketing hero image from a brief and place it into a working hero section.","startTime":248.625,"endTime":253.75,"audioSegment":0},{"text":"Thumbnail Generator Derive a consistent set of thumbnails or responsive size-variants from a folder of source images —","startTime":253.75,"endTime":258.875,"audioSegment":0},{"text":"square crops for grids, srcset widths for the web, smart-cropped to keep the subject centered — and emit them with predictable names.","startTime":258.875,"endTime":264,"audioSegment":0},{"text":"Choose OpenAI Codex CLI (cloud, experimental) in Settings → Image generation.","startTime":264,"endTime":267.1333333333333,"audioSegment":0},{"text":"Install or update Codex CLI and run codex login with your ChatGPT account.","startTime":267.1333333333333,"endTime":270.26666666666665,"audioSegment":0},{"text":"Gezel uses that existing sign-in and Codex usage limits;","startTime":270.26666666666665,"endTime":273.4,"audioSegment":0},{"text":"it does not need an image API key.","startTime":273.4,"endTime":276.53333333333336,"audioSegment":0},{"text":"The CLI runs on the machine hosting your per-user Gezel service. If needed,","startTime":276.53333333333336,"endTime":279.6666666666667,"audioSegment":0},{"text":"set its binary path in Settings → OpenAI Codex CLI → Advanced.","startTime":279.6666666666667,"endTime":282.8,"audioSegment":0},{"text":"Chat, MCP, and direct image requests use the same provider.","startTime":282.8,"endTime":285.93333333333334,"audioSegment":0},{"text":"Prompts, reference images, negative instructions, size, aspect ratio,","startTime":285.93333333333334,"endTime":289.06666666666666,"audioSegment":0},{"text":"quality, and edit-strength guidance go into the image request.","startTime":289.06666666666666,"endTime":292.2,"audioSegment":0},{"text":"Codex controls the underlying image model and final render settings: size and quality are requests in the brief,","startTime":292.2,"endTime":295.3333333333333,"audioSegment":0},{"text":"and edit strength is approximate.","startTime":295.3333333333333,"endTime":298.4666666666667,"audioSegment":0},{"text":"Seeds and sampling steps are unavailable.","startTime":298.4666666666667,"endTime":301.6,"audioSegment":0},{"text":"Results include actual pixel dimensions and notes about unsupported controls or size differences.","startTime":301.6,"endTime":304.73333333333335,"audioSegment":0},{"text":"Only native image output is accepted;","startTime":304.73333333333335,"endTime":307.8666666666667,"audioSegment":0},{"text":"a text response claiming to have saved an image is not a successful render.","startTime":307.8666666666667,"endTime":311,"audioSegment":0}],"version":1},"startBlock":{"title":"The Image Generator","subtitle":"The Image Generator does one thing on purpose: turn descriptions into images. Illustrations, hero images, textures, mockup art — ask, refine, ask again. Results land in the project's artifacts, ready for a Designer or you to place.","ambientMotion":"zoomIn"}}</script>
