ts, write_artifact, grep_artifact","startTime":84.80000000000001,"endTime":89,"audioSegment":0},{"text":"Data Tables Read a project's mirrored data tables with SQL list_tables,","startTime":89,"endTime":93.2,"audioSegment":0},{"text":"describe_table, query_table","startTime":93.2,"endTime":97.4,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":97.4,"endTime":101.60000000000001,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":101.60000000000001,"endTime":105.8,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":105.8,"endTime":110,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":110,"endTime":114.2,"audioSegment":0},{"text":"Web Access Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents,","startTime":114.2,"endTime":118.4,"audioSegment":0},{"text":"and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type) web_search, wikipedia_search, wikimedia_image_search, wikipedia_read, fetch_url, browser_find_page_element","startTime":118.4,"endTime":122.60000000000001,"audioSegment":0},{"text":"Handboek Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":122.60000000000001,"endTime":126.80000000000001,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":126.80000000000001,"endTime":131,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":131,"endTime":133.1818181818182,"audioSegment":0},{"text":"tiny under 5B 91 of 94 tools —","startTime":133.1818181818182,"endTime":135.36363636363637,"audioSe rofessional portfolio site that showcases projects,","startTime":218.27272727272725,"endTime":222.63636363636363,"audioSegment":0},{"text":"an about/bio, and contact links in a single polished page.","startTime":222.63636363636363,"endTime":227,"audioSegment":0}],"version":1},"startBlock":{"title":"The Web Developer","subtitle":"The Web Developer is a Developer who ships things you can click. Beyond the code tools, they drive a real browser: load the page they just changed, see what rendered, and fix what didn't — the look-then-fix loop that frontend work actually needs.","ambientMotion":"zoomIn"}}</script>
