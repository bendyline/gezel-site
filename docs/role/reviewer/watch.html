inline cap)","list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact"],["Data Tables","Read a project's mirrored data tables with SQL","list_tables, describe_table, query_table"],["Memory","Search indexed project knowledge through one unified surface, plus persistent notes a gezel can recall and write back","search, knowledge_nearby, search_memory, save_memory, list_memories"],["Shared document library","Cross-project shared library — mission docs, guidelines, and any markdown the user wants every gezel to be able to find","list_documents, read_document, write_document, delete_document, search_documents"],["Document Intelligence","Search and read office documents (Word, PDF, PowerPoint, Excel) that gezel has converted to markdown in the index","search_docs, read_doc_as_markdown"],["Entity Intelligence","Cross-file entities the index resolved from structured metadata — email senders, document parties — and where each appears","find_entity, list_entity_mentions"],["User Interaction","Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel), or to a role-shaped specialist (ask_specialist) — instead of guessing","ask_user_question, ask_gezel, ask_specialist"],["Web Access","Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents, and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type)","web_search, wikipedia_search, wikimedia_image_search, wikipedia_read, fetch_url, browser_find_page_element"],["Help","Consult gezel's built-in documentation for meta questions about gezel itself — roles, craftbooks, projects, memory, models, setup","how_do_i"]],"align":[null,null,null],"title":"What they can do"}},{"id":"plans-they-run-well","startTime":350,"duration":36,"audioSegment":0,"template":"dataTable","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Plans they run well","position":{"start":{"line":100,"column":4,"offset":8730},"end":{"line":100,"column":23,"offset":8749}}}],"position":{"start":{"line":100,"column":1,"offset":8727},"end":{"line":100,"column":23,"offset":8749}}},"title":"Plans they run well","contents":[{"type":"table","align":[null,null],"children":[{"type":"tableRow","children":[{"type":"tableCell","isHeader":true,"children":[{"type":"text","value":"Plan","position":{"start":{"line":102,"column":3,"offset":8753},"end":{"line":102,"column":7,"offset":8757}}}],"position":{"start":{"line":102,"column":1,"offset":8751},"end":{"line":102,"column":8,"offset":8758}}},{"type":"tableCell","isHeader":true,"children":[{"type":"text","value":"What it does","position":{"start":{"line":102,"column":10,"offset":8760},"end":{"line":102,"column":22,"offset":8772}}}],"position":{"start":{"line":102,"column":8,"offset":8758},"end":{"line":102,"column":24,"offset":8774}}}],"position":{"start":{"line":102,"column":1,"offset":8751},"end":{"line":102,"column":24,"offset":8774}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/code-review/","children":[{"type":"text","value":"Code Review","position":{"start":{"line":104,"column":4,"offset":8792},"end":{"line":104,"column":15,"offset":8803}}}],"position":{"start":{"line":104,"column":3,"offset":8791},"end":{"line":104,"column":46,"offset":8834}}}],"position":{"start":{"line":104,"column":1,"offset":8789},"end":{"line":104,"column":47,"offset":8835}}},{"type":"tableCell","children":[{"type":"text","value":"Snapshot-driven code review.","position":{"start":{"line":104,"column":49,"offset":8837},"end":{"line":104,"column":77,"offset":8865}}}],"position":{"start":{"line":104,"column":47,"offset":8835},"end":{"line":104,"column":79,"offset":8867}}}],"position":{"start":{"line":104,"column":1,"offset":8789},"end":{"line":104,"column":79,"offset":8867}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/deep-security-review/","children":[{"type":"text","value":"Deep Security Review","position":{"start":{"line":105,"column":4,"offset":8871},"end":{"line":105,"column":24,"offset":8891}}}],"position":{"start":{"line":105,"column":3,"offset":8870},"end":{"line":105,"column":64,"offset":8931}}}],"position":{"start":{"line":105,"column":1,"offset":8868},"end":{"line":105,"column":65,"offset":8932}}},{"type":"tableCell","children":[{"type":"text","value":"Run a slow, thorough, WHOLE-CODEBASE security audit that looks for SYSTEMIC weaknesses — a vulnerability class repeated across many routes, a missing control at an architectural layer, inconsistent authorization, ad-hoc secret handling, a trust-boundary violation — not just isolated issues in one file.","position":{"start":{"line":105,"column":67,"offset":8934},"end":{"line":105,"column":370,"offset":9237}}}],"position":{"start":{"line":105,"column":65,"offset":8932},"end":{"line":105,"column":372,"offset":9239}}}],"position":{"start":{"line":105,"column":1,"offset":8868},"end":{"line":105,"column":372,"offset":9239}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/pull-request-review/","children":[{"type":"text","value":"Pull Request Review","position":{"start":{"line":106,"column":4,"offset":9243},"end":{"line":106,"column":23,"offset":9262}}}],"position":{"start":{"line":106,"column":3,"offset":9242},"end":{"line":106,"column":62,"offset":9301}}}],"position":{"start":{"line":106,"column":1,"offset":9240},"end":{"line":106,"column":63,"offset":9302}}},{"type":"tableCell","children":[{"type":"text","value":"Staff-engineer-style PR review over a complete local PR corpus.","position":{"start":{"line":106,"column":65,"offset":9304},"end":{"line":106,"column":128,"offset":9367}}}],"position":{"start":{"line":106,"column":63,"offset":9302},"end":{"line":106,"column":130,"offset":9369}}}],"position":{"start":{"line":106,"column":1,"offset":9240},"end":{"line":106,"column":130,"offset":9369}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/pr-security-review/","children":[{"type":"text","value":"Security Review of a Diff","position":{"start":{"line":107,"column":4,"offset":9373},"end":{"line":107,"column":29,"offset":9398}}}],"position":{"start":{"line":107,"column":3,"offset":9372},"end":{"line":107,"column":67,"offset":9436}}}],"position":{"start":{"line":107,"column":1,"offset":9370},"end":{"line":107,"column":68,"offset":9437}}},{"type":"tableCell","children":[{"type":"text","value":"Perform a focused security review of a code change or diff and produce a vulnerability report mapped to a threat checklist.","position":{"start":{"line":107,"column":70,"offset":9439},"end":{"line":107,"column":193,"offset":9562}}}],"position":{"start":{"line":107,"column":68,"offset":9437},"end":{"line":107,"column":195,"offset":9564}}}],"position":{"start":{"line":107,"column":1,"offset":9370},"end":{"line":107,"column":195,"offset":9564}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/test-coverage-review/","children":[{"type":"text","value":"Test Coverage Review","position":{"start":{"line":108,"column":4,"offset":9568},"end":{"line":108,"column":24,"offset":9588}}}],"position":{"start":{"line":108,"column":3,"offset":9567},"end":{"line":108,"column":64,"offset":9628}}}],"position":{"start":{"line":108,"column":1,"offset":9565},"end":{"line":108,"column":65,"offset":9629}}},{"type":"tableCell","children":[{"type":"text","value":"Review a codebase or module's test suite for real coverage and quality, then produce a gap report and a prioritized backlog of tests to add.","position":{"start":{"line":108,"column":67,"offset":9631},"end":{"line":108,"column":207,"offset":9771}}}],"position":{"start":{"line":108,"column":65,"offset":9629},"end":{"line":108,"column":209,"offset":9773}}}],"position":{"start":{"line":108,"column":1,"offset":9565},"end":{"line":108,"column":209,"offset":9773}}}],"position":{"start":{"line":102,"column":1,"offset":8751},"end":{"line":108,"column":209,"offset":9773}}}],"autoTemplate":true,"templateData":{"headers":["Plan","What it does"],"rows":[["Code Review","Snapshot-driven code review."],["Deep Security Review","Run a slow, thorough, WHOLE-CODEBASE security audit that looks for SYSTEMIC weaknesses — a vulnerability class repeated across many routes, a missing control at an architectural layer, inconsistent authorization, ad-hoc secret handling, a trust-boundary violation — not just isolated issues in one file."],["Pull Request Review","Staff-engineer-style PR review over a complete local PR corpus."],["Security Review of a Diff","Perform a focused security review of a code change or diff and produce a vulnerability report mapped to a threat checklist."],["Test Coverage Review","Review a codebase or module's test suite for real coverage and quality, then produce a gap report and a prioritized backlog of tests to add."]],"align":[null,null],"title":"Plans they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Every crew needs the person who checks the joinery.","startTime":0,"endTime":3.7142857142857144,"audioSegment":0},{"text":"The Reviewer reads deliverables — code, documents, plans — with a skeptic's eye,","startTime":3.7142857142857144,"endTime":7.428571428571429,"audioSegment":0},{"text":"verifies claims against the actual sources, and only approves what holds up.","startTime":7.428571428571429,"endTime":11.142857142857142,"audioSegment":0},{"text":"Reviewers are most valuable when they're independent: give the review to someone other than the one who built the thing,","startTime":11.142857142857142,"endTime":14.857142857142858,"audioSegment":0},{"text":"ideally on a strong model.","startTime":14.857142857142858,"endTime":18.571428571428573,"audioSegment":0},{"text":"The gates in a plan lean on this role heavily —","startTime":18.571428571428573,"endTime":22.285714285714285,"audioSegment":0},{"text":"a step that says \"reviewed\" means a Reviewer actually passed it, not that the author felt done.","startTime":22.285714285714285,"endTime":26,"audioSegment":0},{"text":"You are a Reviewer.","startTime":32,"endTime":34.333333333333336,"audioSegment":0},{"text":"Your job is to catch the things the first pass missed —","startTime":34.333333333333336,"endTime":36.666666666666664,"audioSegment":0},{"text":"bugs, unclear wording, bad defaults, inconsistent tone.","startTime":36.666666666666664,"endTime":39,"audioSegment":0},{"text":"Name the specific problem, then suggest the fix.","startTime":39,"endTime":40.9,"audioSegment":0},{"text":"\"This is confusing\" without a concrete rewrite is low-value.","startTime":40.9,"endTime":42.8,"audioSegment":0},{"text":"Rank your findings.","startTime":42.8,"endTime":44.7,"audioSegment":0},{"text":"Lead with what actually matters.","startTime":44.7,"endTime":46.6,"audioSegment":0},{"text":"Nits go last and are clearly marked.","startTime":46.6,"endTime":48.5,"audioSegment":0},{"text":"Don't rewrite silently.","startTime":48.5,"endTime":50.4,"audioSegment":0},{"text":"Big proposed changes come with the diff or the shape described,","startTime":50.4,"endTime":52.3,"audioSegment":0},{"text":"never a wall of new text without explanation.","startTime":52.3,"endTime":54.2,"audioSegment":0},{"text":"Be precise, not harsh.","startTime":54.2,"endTime":56.099999999999994,"audioSegment":0},{"text":"You're catching mistakes, not grading.","startTime":56.099999999999994,"endTime":58,"audioSegment":0},{"text":"Gather evidence before writing.","startTime":58,"endTime":61.285714285714285,"audioSegment":0},{"text":"Map the workspace first; read breadth before synthesis — at least five substantive files when they exist,","startTime":61.285714285714285,"endTime":64.57142857142857,"audioSegment":0},{"text":"including entry points, core modules, tests, and config, not just the manifests.","startTime":64.57142857142857,"endTime":67.85714285714286,"audioSegment":0},{"text":"Cite only files you actually read;","startTime":67.85714285714286,"endTime":71.14285714285714,"audioSegment":0},{"text":"never invent plausible filenames to satisfy a citation count.","startTime":71.14285714285714,"endTime":74.42857142857143,"audioSegment":0},{"text":"If the requested source is absent or the workspace holds only scaffolding,","startTime":74.42857142857143,"endTime":77.71428571428572,"audioSegment":0},{"text":"report that blocker to the coordinator — don't fill the gap with generic review prose.","startTime":77.71428571428572,"endTime":81,"audioSegment":0},{"text":"Before closing a project with mission objectives,","startTime":81,"endTime":83.52,"audioSegment":0},{"text":"a crew lead will ask you to verify.","startTime":83.52,"endTime":86.04,"audioSegment":0},{"text":"Your reply becomes the verification text in the project's audit log,","startTime":86.04,"endTime":88.56,"audioSegment":0},{"text":"so be specific and structured, not chatty.","startTime":88.56,"endTime":91.08,"audioSegment":0},{"text":"The flow: read every deliverable the caller named yourself —","startTime":91.08,"endTime":93.6,"audioSegment":0},{"text":"never ask for pasted contents.","startTime":93.6,"endTime":96.12,"audioSegment":0},{"text":"Run validate on each shipping file and quote its findings (it is always on your roster).","startTime":96.12,"endTime":98.64,"audioSegment":0},{"text":"Then match each mission objective to evidence: one short line per objective citing the path and the specific observation that proves it met,","startTime":98.64,"endTime":101.16,"audioSegment":0},{"text":"or names exactly what's missing.","startTime":101.16,"endTime":103.68,"audioSegment":0},{"text":"Don't be polite.","startTime":103.68,"endTime":106.2,"audioSegment":0},{"text":"Soft phrasing reads as \"everything's fine\" even when it isn't.","startTime":106.2,"endTime":108.72,"audioSegment":0},{"text":"If a check flagged a failure, say so verbatim.","startTime":108.72,"endTime":111.24000000000001,"audioSegment":0},{"text":"If your evidence is \"the file has the right vocabulary but I never exercised it,\" say that too —","startTime":111.24000000000001,"endTime":113.75999999999999,"audioSegment":0},{"text":"the caller decides whether that level of evidence suffices.","startTime":113.75999999999999,"endTime":116.28,"audioSegment":0},{"text":"End with one of these two shapes —","startTime":116.28,"endTime":118.8,"audioSegment":0},{"text":"the wording matters, the caller pattern-matches it:","startTime":118.8,"endTime":121.32,"audioSegment":0},{"text":"Verification for <project name>:","startTime":121.32,"endTime":123.84,"audioSegment":0},{"text":"- Objective 1 (<label>): met — <path>, <specific observation>.","startTime":123.84,"endTime":126.36,"audioSegment":0},{"text":"- Objective 2 (<label>): met — <evidence>.","startTime":126.36,"endTime":128.88,"audioSegment":0},{"text":"Verification: ship it.","startTime":128.88,"endTime":131.4,"audioSegment":0},{"text":"Verification for <project name>:","startTime":131.4,"endTime":133.92000000000002,"audioSegment":0},{"text":"- Objective 1 (<label>): met — <evidence>.","startTime":133.92000000000002,"endTime":136.44,"audioSegment":0},{"text":"- Objective 2 (<label>): UNMET — <specific reason>.","startTime":136.44,"endTime":138.96,"audioSegment":0},{"text":"Recommendation: address the gaps above before closing.","startTime":138.96,"endTime":141.48000000000002,"audioSegment":0},{"text":"Specifically: <one-line list>.","startTime":141.48000000000002,"endTime":144,"audioSegment":0},{"text":"For code: correctness and security first, then readability, then style.","startTime":144,"endTime":147.14285714285714,"audioSegment":0},{"text":"For prose: confusing structure first, then word choice, then grammar.","startTime":147.14285714285714,"endTime":150.28571428571428,"audioSegment":0},{"text":"If you can't decide whether something's a problem, say so —","startTime":150.28571428571428,"endTime":153.42857142857142,"audioSegment":0},{"text":"\"I'd want another pair of eyes on this\" is a valid answer.","startTime":153.42857142857142,"endTime":156.57142857142858,"audioSegment":0},{"text":"When in doubt on a verification: err toward UNMET with a specific reason.","startTime":156.57142857142858,"endTime":159.71428571428572,"audioSegment":0},{"text":"A false \"met\" hides a real bug;","startTime":159.71428571428572,"endTime":162.85714285714286,"audioSegment":0},{"text":"a false \"UNMET\" gets corrected in one more turn.","startTime":162.85714285714286,"endTime":166,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":166,"endTime":170.4516129032258,"audioSegment":0},{"text":"Workspace File Reading Read, list, search, and diff files in the project workspace, and retrieve a referenced tracked issue's durable metadata list_dir,","startTime":170.4516129032258,"endTime":174.90322580645162,"audioSegment":0},{"text":"read_file, read_files, stat, validate, grep_files, find_files, diff_files, get_file_issue","startTime":174.90322580645162,"endTime":179.3548387096774,"audioSegment":0},{"text":"Workspace File Writing Create, write, surgically edit, rename, and delete files in the project workspace write_file, append_to_file,","startTime":179.3548387096774,"endTime":183.80645161290323,"audioSegment":0},{"text":"replace_in_file, replace_lines, apply_patch, insert_at_marker, copy_artifact_to_workspace, make_dir, delete_path, rename, copy_path","startTime":183.80645161290323,"endTime":188.25806451612902,"audioSegment":0},{"text":"Code Intelligence Navigate and understand the codebase via the workspace index instead of reading whole files: outline a file's symbols, jump to a definition, read just one symbol's source,","startTime":188.25806451612902,"endTime":192.70967741935485,"audioSegment":0},{"text":"find usages, and map the repo outline_file, find_symbol, read_symbol, find_references, map_repo, search_code, file_review, list_file_issues, set_file_issue_status","startTime":192.70967741935485,"endTime":197.16129032258064,"audioSegment":0},{"text":"Security Intelligence Static security analysis pushed into the index and reused as tools: run a whole-repo scan (dependency inventory + opportunistic semgrep/osv-scanner/gitleaks), get a posture overview with candidate systemic themes, list findings by severity/category,","startTime":197.16129032258064,"endTime":201.61290322580646,"audioSegment":0},{"text":"map the attack surface (entry points, routes, auth boundaries, secret touchpoints), inventory dependencies with advisories, and trace import-graph reachability for source→sink flows security_scan, security_overview, scan_findings, map_attack_surface, list_dependencies, trace_taint","startTime":201.61290322580646,"endTime":206.06451612903226,"audioSegment":0},{"text":"Git & GitHub Run read-only git commands inside the project workspace, inspect GitHub pull requests, post review comments, open PRs, and check workflow status for linked project repositories run_git,","startTime":206.06451612903226,"endTime":210.51612903225805,"audioSegment":0},{"text":"github_pr_list, github_pr_view, github_pr_files, github_pr_file, github_pr_diff, github_pr_comments, github_pr_comment, github_pr_create, github_workflow_runs, github_check_status","startTime":210.51612903225805,"endTime":214.96774193548387,"audioSegment":0},{"text":"Task Management Create, assign, advance, and report on tasks list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes,","startTime":214.96774193548387,"endTime":219.41935483870967,"audioSegment":0},{"text":"verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":219.41935483870967,"endTime":223.8709677419355,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":223.8709677419355,"endTime":228.32258064516128,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":228.32258064516128,"endTime":232.77419354838707,"audioSegment":0},{"text":"Data Tables Read a project's mirrored data tables with SQL list_tables,","startTime":232.77419354838707,"endTime":237.2258064516129,"audioSegment":0},{"text":"describe_table, query_table","startTime":237.2258064516129,"endTime":241.67741935483872,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":241.67741935483872,"endTime":246.1290322580645,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":246.1290322580645,"endTime":250.5806451612903,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":250.5806451612903,"endTime":255.03225806451613,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":255.03225806451613,"endTime":259.48387096774195,"audioSegment":0},{"text":"Document Intelligence Search and read office documents (Word, PDF, PowerPoint,","startTime":259.48387096774195,"endTime":263.93548387096774,"audioSegment":0},{"text":"Excel) that gezel has converted to markdown in the index search_docs, read_doc_as_markdown","startTime":263.93548387096774,"endTime":268.38709677419354,"audioSegment":0},{"text":"Entity Intelligence Cross-file entities the index resolved from structured metadata —","startTime":268.38709677419354,"endTime":272.83870967741933,"audioSegment":0},{"text":"email senders, document parties — and where each appears find_entity, list_entity_mentions","startTime":272.83870967741933,"endTime":277.2903225806451,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":277.2903225806451,"endTime":281.741935483871,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":281.741935483871,"endTime":286.19354838709677,"audioSegment":0},{"text":"Web Access Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents,","startTime":286.19354838709677,"endTime":290.64516129032256,"audioSegment":0},{"text":"and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type) web_search, wikipedia_search, wikimedia_image_search, wikipedia_read, fetch_url, browser_find_page_element","startTime":290.64516129032256,"endTime":295.0967741935484,"audioSegment":0},{"text":"Help Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":295.0967741935484,"endTime":299.54838709677415,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":299.54838709677415,"endTime":304,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":304,"endTime":306.09090909090907,"audioSegment":0},{"text":"tiny under 5B 98 of 99 tools —","startTime":306.09090909090907,"endTime":308.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":308.1818181818182,"endTime":310.27272727272725,"audioSegment":0},{"text":"small 5–12B 98 of 99 tools —","startTime":310.27272727272725,"endTime":312.3636363636364,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":312.3636363636364,"endTime":314.45454545454544,"audioSegment":0},{"text":"medium 12–45B 98 of 99 tools —","startTime":314.45454545454544,"endTime":316.54545454545456,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":316.54545454545456,"endTime":318.6363636363636,"audioSegment":0},{"text":"large 45B and up 98 of 99 tools —","startTime":318.6363636363636,"endTime":320.72727272727275,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":320.72727272727275,"endTime":322.8181818181818,"audioSegment":0},{"text":"cloud hosted 96 of 99 tools —","startTime":322.8181818181818,"endTime":324.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (3 of 6)","startTime":324.9090909090909,"endTime":327,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":327,"endTime":329.09090909090907,"audioSegment":0},{"text":"tiny under 5B 98 of 99 tools —","startTime":329.09090909090907,"endTime":331.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":331.1818181818182,"endTime":333.27272727272725,"audioSegment":0},{"text":"small 5–12B 98 of 99 tools —","startTime":333.27272727272725,"endTime":335.3636363636364,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":335.3636363636364,"endTime":337.45454545454544,"audioSegment":0},{"text":"medium 12–45B 98 of 99 tools —","startTime":337.45454545454544,"endTime":339.54545454545456,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":339.54545454545456,"endTime":341.6363636363636,"audioSegment":0},{"text":"large 45B and up 98 of 99 tools —","startTime":341.6363636363636,"endTime":343.72727272727275,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":343.72727272727275,"endTime":345.8181818181818,"audioSegment":0},{"text":"cloud hosted 96 of 99 tools —","startTime":345.8181818181818,"endTime":347.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (3 of 6)","startTime":347.9090909090909,"endTime":350,"audioSegment":0},{"text":"Plan What it does","startTime":350,"endTime":354.5,"audioSegment":0},{"text":"Code Review Snapshot-driven code review.","startTime":354.5,"endTime":359,"audioSegment":0},{"text":"Deep Security Review Run a slow, thorough, WHOLE-CODEBASE security audit that looks for SYSTEMIC weaknesses — a vulnerability class repeated across many routes,","startTime":359,"endTime":363.5,"audioSegment":0},{"text":"a missing control at an architectural layer, inconsistent authorization, ad-hoc secret handling, a trust-boundary violation — not just isolated issues in one file.","startTime":363.5,"endTime":368,"audioSegment":0},{"text":"Pull Request Review Staff-engineer-style PR review over a complete local PR corpus.","startTime":368,"endTime":372.5,"audioSegment":0},{"text":"Security Review of a Diff Perform a focused security review of a code change or diff and produce a vulnerability report mapped to a threat checklist.","startTime":372.5,"endTime":377,"audioSegment":0},{"text":"Test Coverage Review Review a codebase or module's test suite for real coverage and quality,","startTime":377,"endTime":381.5,"audioSegment":0},{"text":"then produce a gap report and a prioritized backlog of tests to add.","startTime":381.5,"endTime":386,"audioSegment":0}],"version":1},"startBlock":{"title":"The Reviewer","subtitle":"Every crew needs the person who checks the joinery. The Reviewer reads deliverables — code, documents, plans — with a skeptic's eye, verifies claims against the actual sources, and only approves what holds up.","ambientMotion":"zoomIn"}}</script>
