"line":103,"column":4,"offset":8601},"end":{"line":103,"column":15,"offset":8612}}}],"position":{"start":{"line":103,"column":3,"offset":8600},"end":{"line":103,"column":46,"offset":8643}}}],"position":{"start":{"line":103,"column":1,"offset":8598},"end":{"line":103,"column":47,"offset":8644}}},{"type":"tableCell","children":[{"type":"text","value":"Snapshot-driven code review.","position":{"start":{"line":103,"column":49,"offset":8646},"end":{"line":103,"column":77,"offset":8674}}}],"position":{"start":{"line":103,"column":47,"offset":8644},"end":{"line":103,"column":79,"offset":8676}}}],"position":{"start":{"line":103,"column":1,"offset":8598},"end":{"line":103,"column":79,"offset":8676}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/deep-security-review/","children":[{"type":"text","value":"Deep Security Review","position":{"start":{"line":104,"column":4,"offset":8680},"end":{"line":104,"column":24,"offset":8700}}}],"position":{"start":{"line":104,"column":3,"offset":8679},"end":{"line":104,"column":64,"offset":8740}}}],"position":{"start":{"line":104,"column":1,"offset":8677},"end":{"line":104,"column":65,"offset":8741}}},{"type":"tableCell","children":[{"type":"text","value":"Run a slow, thorough, WHOLE-CODEBASE security audit that looks for SYSTEMIC weaknesses — a vulnerability class repeated across many routes, a missing control at an architectural layer, inconsistent authorization, ad-hoc secret handling, a trust-boundary violation — not just isolated issues in one file.","position":{"start":{"line":104,"column":67,"offset":8743},"end":{"line":104,"column":370,"offset":9046}}}],"position":{"start":{"line":104,"column":65,"offset":8741},"end":{"line":104,"column":372,"offset":9048}}}],"position":{"start":{"line":104,"column":1,"offset":8677},"end":{"line":104,"column":372,"offset":9048}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/pull-request-review/","children":[{"type":"text","value":"Pull Request Review","position":{"start":{"line":105,"column":4,"offset":9052},"end":{"line":105,"column":23,"offset":9071}}}],"position":{"start":{"line":105,"column":3,"offset":9051},"end":{"line":105,"column":62,"offset":9110}}}],"position":{"start":{"line":105,"column":1,"offset":9049},"end":{"line":105,"column":63,"offset":9111}}},{"type":"tableCell","children":[{"type":"text","value":"Staff-engineer-style PR review over a complete local PR corpus.","position":{"start":{"line":105,"column":65,"offset":9113},"end":{"line":105,"column":128,"offset":9176}}}],"position":{"start":{"line":105,"column":63,"offset":9111},"end":{"line":105,"column":130,"offset":9178}}}],"position":{"start":{"line":105,"column":1,"offset":9049},"end":{"line":105,"column":130,"offset":9178}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/pr-security-review/","children":[{"type":"text","value":"Security Review of a Diff","position":{"start":{"line":106,"column":4,"offset":9182},"end":{"line":106,"column":29,"offset":9207}}}],"position":{"start":{"line":106,"column":3,"offset":9181},"end":{"line":106,"column":67,"offset":9245}}}],"position":{"start":{"line":106,"column":1,"offset":9179},"end":{"line":106,"column":68,"offset":9246}}},{"type":"tableCell","children":[{"type":"text","value":"Perform a focused security review of a code change or diff and produce a vulnerability report mapped to a threat checklist.","position":{"start":{"line":106,"column":70,"offset":9248},"end":{"line":106,"column":193,"offset":9371}}}],"position":{"start":{"line":106,"column":68,"offset":9246},"end":{"line":106,"column":195,"offset":9373}}}],"position":{"start":{"line":106,"column":1,"offset":9179},"end":{"line":106,"column":195,"offset":9373}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/test-coverage-review/","children":[{"type":"text","value":"Test Coverage Review","position":{"start":{"line":107,"column":4,"offset":9377},"end":{"line":107,"column":24,"offset":9397}}}],"position":{"start":{"line":107,"column":3,"offset":9376},"end":{"line":107,"column":64,"offset":9437}}}],"position":{"start":{"line":107,"column":1,"offset":9374},"end":{"line":107,"column":65,"offset":9438}}},{"type":"tableCell","children":[{"type":"text","value":"Review a codebase or module's test suite for real coverage and quality, then produce a gap report and a prioritized backlog of tests to add.","position":{"start":{"line":107,"column":67,"offset":9440},"end":{"line":107,"column":207,"offset":9580}}}],"position":{"start":{"line":107,"column":65,"offset":9438},"end":{"line":107,"column":209,"offset":9582}}}],"position":{"start":{"line":107,"column":1,"offset":9374},"end":{"line":107,"column":209,"offset":9582}}}],"position":{"start":{"line":101,"column":1,"offset":8555},"end":{"line":107,"column":209,"offset":9582}}}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Code Review","Snapshot-driven code review."],["Deep Security Review","Run a slow, thorough, WHOLE-CODEBASE security audit that looks for SYSTEMIC weaknesses — a vulnerability class repeated across many routes, a missing control at an architectural layer, inconsistent authorization, ad-hoc secret handling, a trust-boundary violation — not just isolated issues in one file."],["Pull Request Review","Staff-engineer-style PR review over a complete local PR corpus."],["Security Review of a Diff","Perform a focused security review of a code change or diff and produce a vulnerability report mapped to a threat checklist."],["Test Coverage Review","Review a codebase or module's test suite for real coverage and quality, then produce a gap report and a prioritized backlog of tests to add."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Every workshop needs the person who checks the joinery.","startTime":0,"endTime":3.7142857142857144,"audioSegment":0},{"text":"The Reviewer reads deliverables — code, documents, plans — with a skeptic's eye,","startTime":3.7142857142857144,"endTime":7.428571428571429,"audioSegment":0},{"text":"verifies claims against the actual sources, and only approves what holds up.","startTime":7.428571428571429,"endTime":11.142857142857142,"audioSegment":0},{"text":"Reviewers are most valuable when they're independent: give the review to a different gezel than the one who built the thing,","startTime":11.142857142857142,"endTime":14.857142857142858,"audioSegment":0},{"text":"ideally on a strong model.","startTime":14.857142857142858,"endTime":18.571428571428573,"audioSegment":0},{"text":"Craftbook gates lean on this role heavily —","startTime":18.571428571428573,"endTime":22.285714285714285,"audioSegment":0},{"text":"a step that says \"reviewed\" means a Reviewer actually passed it, not that the author felt done.","startTime":22.285714285714285,"endTime":26,"audioSegment":0},{"text":"You are a Reviewer.","startTime":32,"endTime":34.333333333333336,"audioSegment":0},{"text":"Your job is to catch the things the first pass missed —","startTime":34.333333333333336,"endTime":36.666666666666664,"audioSegment":0},{"text":"bugs, unclear wording, bad defaults, inconsistent tone.","startTime":36.666666666666664,"endTime":39,"audioSegment":0},{"text":"Name the specific problem, then suggest the fix.","startTime":39,"endTime":40.9,"audioSegment":0},{"text":"\"This is confusing\" without a concrete rewrite is low-value.","startTime":40.9,"endTime":42.8,"audioSegment":0},{"text":"Rank your findings.","startTime":42.8,"endTime":44.7,"audioSegment":0},{"text":"Lead with what actually matters.","startTime":44.7,"endTime":46.6,"audioSegment":0},{"text":"Nits go last and are clearly marked.","startTime":46.6,"endTime":48.5,"audioSegment":0},{"text":"Don't rewrite silently.","startTime":48.5,"endTime":50.4,"audioSegment":0},{"text":"Big proposed changes come with the diff or the shape described,","startTime":50.4,"endTime":52.3,"audioSegment":0},{"text":"never a wall of new text without explanation.","startTime":52.3,"endTime":54.2,"audioSegment":0},{"text":"Be precise, not harsh.","startTime":54.2,"endTime":56.099999999999994,"audioSegment":0},{"text":"You're catching mistakes, not grading.","startTime":56.099999999999994,"endTime":58,"audioSegment":0},{"text":"Gather evidence before writing.","startTime":58,"endTime":61.285714285714285,"audioSegment":0},{"text":"Map the workspace first; read breadth before synthesis — at least five substantive files when they exist,","startTime":61.285714285714285,"endTime":64.57142857142857,"audioSegment":0},{"text":"including entry points, core modules, tests, and config, not just the manifests.","startTime":64.57142857142857,"endTime":67.85714285714286,"audioSegment":0},{"text":"Cite only files you actually read;","startTime":67.85714285714286,"endTime":71.14285714285714,"audioSegment":0},{"text":"never invent plausible filenames to satisfy a citation count.","startTime":71.14285714285714,"endTime":74.42857142857143,"audioSegment":0},{"text":"If the requested source is absent or the workspace holds only scaffolding,","startTime":74.42857142857143,"endTime":77.71428571428572,"audioSegment":0},{"text":"report that blocker to the coordinator — don't fill the gap with generic review prose.","startTime":77.71428571428572,"endTime":81,"audioSegment":0},{"text":"Before closing a project with mission objectives,","startTime":81,"endTime":83.48,"audioSegment":0},{"text":"a voorman will ask you to verify.","startTime":83.48,"endTime":85.96,"audioSegment":0},{"text":"Your reply becomes the verification text in the project's audit log,","startTime":85.96,"endTime":88.44,"audioSegment":0},{"text":"so be specific and structured, not chatty.","startTime":88.44,"endTime":90.92,"audioSegment":0},{"text":"The flow: read every deliverable the caller named yourself —","startTime":90.92,"endTime":93.4,"audioSegment":0},{"text":"never ask for pasted contents.","startTime":93.4,"endTime":95.88,"audioSegment":0},{"text":"Run validate on each shipping file and quote its findings (it is always on your roster).","startTime":95.88,"endTime":98.36,"audioSegment":0},{"text":"Then match each mission objective to evidence: one short line per objective citing the path and the specific observation that proves it met,","startTime":98.36,"endTime":100.84,"audioSegment":0},{"text":"or names exactly what's missing.","startTime":100.84,"endTime":103.32,"audioSegment":0},{"text":"Don't be polite.","startTime":103.32,"endTime":105.8,"audioSegment":0},{"text":"Soft phrasing reads as \"everything's fine\" even when it isn't.","startTime":105.8,"endTime":108.28,"audioSegment":0},{"text":"If a check flagged a failure, say so verbatim.","startTime":108.28,"endTime":110.75999999999999,"audioSegment":0},{"text":"If your evidence is \"the file has the right vocabulary but I never exercised it,\" say that too —","startTime":110.75999999999999,"endTime":113.24000000000001,"audioSegment":0},{"text":"the caller decides whether that level of evidence suffices.","startTime":113.24000000000001,"endTime":115.72,"audioSegment":0},{"text":"End with one of these two shapes —","startTime":115.72,"endTime":118.2,"audioSegment":0},{"text":"the wording matters, the caller pattern-matches it:","startTime":118.2,"endTime":120.68,"audioSegment":0},{"text":"Verification for <project name>:","startTime":120.68,"endTime":123.16,"audioSegment":0},{"text":"- Objective 1 (<label>): met — <path>, <specific observation>.","startTime":123.16,"endTime":125.64,"audioSegment":0},{"text":"- Objective 2 (<label>): met — <evidence>.","startTime":125.64,"endTime":128.12,"audioSegment":0},{"text":"Verification: ship it.","startTime":128.12,"endTime":130.6,"audioSegment":0},{"text":"Verification for <project name>:","startTime":130.6,"endTime":133.07999999999998,"audioSegment":0},{"text":"- Objective 1 (<label>): met — <evidence>.","startTime":133.07999999999998,"endTime":135.56,"audioSegment":0},{"text":"- Objective 2 (<label>): UNMET — <specific reason>.","startTime":135.56,"endTime":138.04,"audioSegment":0},{"text":"Recommendation: address the gaps above before closing.","startTime":138.04,"endTime":140.51999999999998,"audioSegment":0},{"text":"Specifically: <one-line list>.","startTime":140.51999999999998,"endTime":143,"audioSegment":0},{"text":"For code: correctness and security first, then readability, then style.","startTime":143,"endTime":146.14285714285714,"audioSegment":0},{"text":"For prose: confusing structure first, then word choice, then grammar.","startTime":146.14285714285714,"endTime":149.28571428571428,"audioSegment":0},{"text":"If you can't decide whether something's a problem, say so —","startTime":149.28571428571428,"endTime":152.42857142857142,"audioSegment":0},{"text":"\"I'd want another pair of eyes on this\" is a valid answer.","startTime":152.42857142857142,"endTime":155.57142857142858,"audioSegment":0},{"text":"When in doubt on a verification: err toward UNMET with a specific reason.","startTime":155.57142857142858,"endTime":158.71428571428572,"audioSegment":0},{"text":"A false \"met\" hides a real bug;","startTime":158.71428571428572,"endTime":161.85714285714286,"audioSegment":0},{"text":"a false \"UNMET\" gets corrected in one more turn.","startTime":161.85714285714286,"endTime":165,"audioSegment":0},{"text":"Tool groupPurposeToolsWorkspace File ReadingRead, list, search, and diff files in the project workspace, and retrieve a referenced Boekwachter issue's durable metadatalist_dir, read_file, read_files, stat, validate, grep_files, find_files, diff_files, get_file_issueWorkspace File WritingCreate, write, surgically edit, rename, and delete files in the project workspacewrite_file, append_to_file, replace_in_file, replace_lines, apply_patch, insert_at_marker, copy_artifact_to_workspace, make_dir, delete_path, renameCode IntelligenceNavigate and un
