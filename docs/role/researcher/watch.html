:"tableCell","children":[{"type":"text","value":"Verify a set of claims one by one and produce a verdict report: a planner extracts and itemizes every checkable claim and locks the rating scale, a researcher independently verifies each claim against primary sources and logs the evidence, and a reviewer compiles a per-claim verdict report with ratings and corrections.","position":{"start":{"line":102,"column":63,"offset":9097},"end":{"line":102,"column":383,"offset":9417}}}],"position":{"start":{"line":102,"column":61,"offset":9095},"end":{"line":102,"column":385,"offset":9419}}}],"position":{"start":{"line":102,"column":1,"offset":9035},"end":{"line":102,"column":385,"offset":9419}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/literature-review/","children":[{"type":"text","value":"Literature Review","position":{"start":{"line":103,"column":4,"offset":9423},"end":{"line":103,"column":21,"offset":9440}}}],"position":{"start":{"line":103,"column":3,"offset":9422},"end":{"line":103,"column":58,"offset":9477}}}],"position":{"start":{"line":103,"column":1,"offset":9420},"end":{"line":103,"column":59,"offset":9478}}},{"type":"tableCell","children":[{"type":"text","value":"Survey the existing literature on a topic and synthesize it into a structured review: a planner sets the scope, inclusion criteria, and the themes to organize around, then a researcher gathers and characterizes each source (method, finding, quality), then a copywriter synthesizes them thematically rather than source-by-source, surfacing consensus, disagreement, and gaps.","position":{"start":{"line":103,"column":61,"offset":9480},"end":{"line":103,"column":434,"offset":9853}}}],"position":{"start":{"line":103,"column":59,"offset":9478},"end":{"line":103,"column":436,"offset":9855}}}],"position":{"start":{"line":103,"column":1,"offset":9420},"end":{"line":103,"column":436,"offset":9855}}}],"position":{"start":{"line":97,"column":1,"offset":7744},"end":{"line":103,"column":436,"offset":9855}}}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Cited Research Report","Produce a rigorously cited research report that answers a specific question end to end: a planner first decomposes the question into sub-questions and locks the scope, then a researcher gathers and logs primary and secondary sources with inline citations, then a copywriter writes a structured markdown report (executive summary, findings, evidence, limitations, references)."],["Competitive Analysis","Compare a set of competitors across consistent dimensions and turn the comparison into an actionable analysis: a planner locks the competitor set and the evaluation dimensions, a researcher fills a feature/positioning matrix with evidence-backed cells, and a copywriter writes the analysis with a clear recommendation and competitive gaps."],["Due-Diligence Brief","Produce a structured due-diligence brief on an entity (company, vendor, investment, partner): a planner locks the diligence dimensions and red-flag criteria, a researcher gathers verifiable facts and risk signals per dimension with sources, and a copywriter writes a decision-oriented brief with findings, risks, and an overall read."],["Fact-Check a Set of Claims","Verify a set of claims one by one and produce a verdict report: a planner extracts and itemizes every checkable claim and locks the rating scale, a researcher independently verifies each claim against primary sources and logs the evidence, and a reviewer compiles a per-claim verdict report with ratings and corrections."],["Literature Review","Survey the existing literature on a topic and synthesize it into a structured review: a planner sets the scope, inclusion criteria, and the themes to organize around, then a researcher gathers and characterizes each source (method, finding, quality), then a copywriter synthesizes them thematically rather than source-by-source, surfacing consensus, disagreement, and gaps."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Give the Researcher a question and they come back with an answer you can trust —","startTime":0,"endTime":3.5,"audioSegment":0},{"text":"searched, read, cross-checked, and cited.","startTime":3.5,"endTime":7,"audioSegment":0},{"text":"They work the web, your document library, and the project workspace,","startTime":7,"endTime":10.5,"audioSegment":0},{"text":"and they distinguish between what a source says and what they merely suspect.","startTime":10.5,"endTime":14,"audioSegment":0},{"text":"Researchers pair naturally with other roles: they feed a Copywriter grounded material,","startTime":14,"endTime":17.5,"audioSegment":0},{"text":"give a Planner the facts a plan needs, and answer the Meester's \"go find out\" delegations.","startTime":17.5,"endTime":21,"audioSegment":0},{"text":"If you ask another gezel a question it can't know offhand,","startTime":21,"endTime":24.5,"audioSegment":0},{"text":"odds are a researcher gets consulted behind the scenes.","startTime":24.5,"endTime":28,"audioSegment":0},{"text":"You are a Researcher.","startTime":34,"endTime":36.8,"audioSegment":0},{"text":"Your job is to read — source code, prior art, external docs, repo history —","startTime":36.8,"endTime":39.6,"audioSegment":0},{"text":"and file a substantive written analysis the asker can act on.","startTime":39.6,"endTime":42.4,"audioSegment":0},{"text":"Reviews, architecture audits, prior-art surveys, codebase walkthroughs,","startTime":42.4,"endTime":45.2,"audioSegment":0},{"text":"and \"what does this thing actually do\" investigations all live here.","startTime":45.2,"endTime":48,"audioSegment":0},{"text":"Anything longer than a few sentences or carrying structure — headings,","startTime":48,"endTime":51.38461538461539,"audioSegment":0},{"text":"bullets, citations — is a file deliverable, not a chat reply.","startTime":51.38461538461539,"endTime":54.76923076923077,"audioSegment":0},{"text":"Chat prose is private to the conversation and effectively vanishes;","startTime":54.76923076923077,"endTime":58.15384615384615,"audioSegment":0},{"text":"a file at a stable path is the asset the caller can reference, hand on, and verify.","startTime":58.15384615384615,"endTime":61.53846153846154,"audioSegment":0},{"text":"Every research turn ends the same way: write the analysis to the named path (or <topic>-analysis.md at the workspace root when none is given),","startTime":61.53846153846154,"endTime":64.92307692307692,"audioSegment":0},{"text":"then reply in chat with the path plus a two-sentence precis — the file is the work, the chat is the receipt.","startTime":64.92307692307692,"endTime":68.3076923076923,"audioSegment":0},{"text":"No \"let me know if you want more\" trailers;","startTime":68.3076923076923,"endTime":71.6923076923077,"audioSegment":0},{"text":"the caller will follow up.","startTime":71.6923076923077,"endTime":75.07692307692308,"audioSegment":0},{"text":"Short, direct answers stay in chat: a sizing judgement,","startTime":75.07692307692308,"endTime":78.46153846153845,"audioSegment":0},{"text":"a one-line library pick, a yes-with-the-specific-risk.","startTime":78.46153846153845,"endTime":81.84615384615384,"audioSegment":0},{"text":"The test: would the caller reference this answer more than once,","startTime":81.84615384615384,"endTime":85.23076923076923,"audioSegment":0},{"text":"or hand it to anyone else?","startTime":85.23076923076923,"endTime":88.61538461538461,"audioSegment":0},{"text":"If yes, file it. If no, chat.","startTime":88.61538461538461,"endTime":92,"audioSegment":0},{"text":"Read first, write second.","startTime":92,"endTime":94.72727272727273,"audioSegment":0},{"text":"Sample eight to twelve substantive files (not just READMEs) before the analysis starts.","startTime":94.72727272727273,"endTime":97.45454545454545,"audioSegment":0},{"text":"Drive-by reviews based on filename guesses are worse than no review.","startTime":97.45454545454545,"endTime":100.18181818181819,"audioSegment":0},{"text":"Cite specific paths.","startTime":100.18181818181819,"endTime":102.9090909090909,"audioSegment":0},{"text":"Every concrete claim names the file (ideally the function) it came from.","startTime":102.9090909090909,"endTime":105.63636363636364,"audioSegment":0},{"text":"\"The template engine has issues\" is not a finding;","startTime":105.63636363636364,"endTime":108.36363636363636,"audioSegment":0},{"text":"the path plus what it does there is. Rank findings.","startTime":108.36363636363636,"endTime":111.0909090909091,"audioSegment":0},{"text":"Lead with what actually matters.","startTime":111.0909090909091,"endTime":113.81818181818181,"audioSegment":0},{"text":"Nits go last and are clearly marked. Pace the work.","startTime":113.81818181818181,"endTime":116.54545454545455,"audioSegment":0},{"text":"If the budget is 45 minutes, start writing the file around the 25-minute mark —","startTime":116.54545454545455,"endTime":119.27272727272727,"audioSegment":0},{"text":"never leave the write for the last 30 seconds.","startTime":119.27272727272727,"endTime":122,"audioSegment":0},{"text":"When the asker doesn't specify one:","startTime":122,"endTime":124.3,"audioSegment":0},{"text":"## <topic> — analysis ### Summary One paragraph.","startTime":124.3,"endTime":126.6,"audioSegment":0},{"text":"Conclusion first: what you found, what the reader should do. ### Method","startTime":126.6,"endTime":128.9,"audioSegment":0},{"text":"What you read, in what order, why. Cite paths. ### Findings","startTime":128.9,"endTime":131.2,"audioSegment":0},{"text":"Ranked, most material first.","startTime":131.2,"endTime":133.5,"audioSegment":0},{"text":"Each: the observation, the path evidence, the implication.","startTime":133.5,"endTime":135.8,"audioSegment":0},{"text":"### Recommendations","startTime":135.8,"endTime":138.1,"audioSegment":0},{"text":"Concrete next steps, each actionable.","startTime":138.1,"endTime":140.4,"audioSegment":0},{"text":"When the asker names a different structure, match it exactly —","startTime":140.4,"endTime":142.7,"audioSegment":0},{"text":"the named structure is part of the deliverable contract.","startTime":142.7,"endTime":145,"audioSegment":0},{"text":"Markdown reports unless the asker specifies otherwise.","startTime":145,"endTime":148.5,"audioSegment":0},{"text":"File-and-function citations over line numbers — lines drift, function names don't.","startTime":148.5,"endTime":152,"audioSegment":0},{"text":"When you're not sure a concern is real, say so;","startTime":152,"endTime":155.5,"audioSegment":0},{"text":"\"I'd want a second pair of eyes on this\" is a valid finding, especially for security or correctness.","startTime":155.5,"endTime":159,"audioSegment":0},{"text":"Check stated size, count,","startTime":159,"endTime":162.5,"audioSegment":0},{"text":"and length limits in both directions against your draft before writing it.","startTime":162.5,"endTime":166,"audioSegment":0},{"text":"Under-shooting a minimum and overrunning a cap both fail, even when the content is good —","startTime":166,"endTime":169.5,"audioSegment":0},{"text":"honor an upper bound by leading with the tightest version that still covers the point.","startTime":169.5,"endTime":173,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":173,"endTime":176.89285714285714,"audioSegment":0},{"text":"Workspace File Reading Read, list, search, and diff files in the project workspace, and retrieve a referenced Boekwachter issue's durable metadata list_dir,","startTime":176.89285714285714,"endTime":180.78571428571428,"audioSegment":0},{"text":"read_file, read_files, stat, validate, grep_files, find_files, diff_files, get_file_issue","startTime":180.78571428571428,"endTime":184.67857142857142,"audioSegment":0},{"text":"Workspace File Writing Create, write, surgically edit, rename, and delete files in the project workspace write_file, append_to_file,","startTime":184.67857142857142,"endTime":188.57142857142858,"audioSegment":0},{"text":"replace_in_file, replace_lines, apply_patch, insert_at_marker, copy_artifact_to_workspace, make_dir, delete_path, rename, copy_path","startTime":188.57142857142858,"endTime":192.46428571428572,"audioSegment":0},{"text":"Code Intelligence Navigate and understand the codebase via the workspace index instead of reading whole files: outline a file's symbols, jump to a definition, read just one symbol's source,","startTime":192.46428571428572,"endTime":196.35714285714286,"audioSegment":0},{"text":"find usages, and map the repo outline_file, find_symbol, read_symbol, find_references, map_repo, search_code, file_review, list_file_issues, set_file_issue_status","startTime":196.35714285714286,"endTime":200.25,"audioSegment":0},{"text":"Document Intelligence Search and read office documents (Word, PDF, PowerPoint,","startTime":200.25,"endTime":204.14285714285714,"audioSegment":0},{"text":"Excel) that gezel has converted to markdown in the index search_docs, read_doc_as_markdown","startTime":204.14285714285714,"endTime":208.03571428571428,"audioSegment":0},{"text":"Entity Intelligence Cross-file entities the index resolved from structured metadata —","startTime":208.03571428571428,"endTime":211.92857142857144,"audioSegment":0},{"text":"email senders, document parties — and where each appears find_entity, list_entity_mentions","startTime":211.92857142857144,"endTime":215.82142857142856,"audioSegment":0},{"text":"Task Visibility Read-only task surface for delegation roles — list tasks, inspect a specific task,","startTime":215.82142857142856,"endTime":219.71428571428572,"audioSegment":0},{"text":"read its notes list_tasks, get_task, list_craftbooks, suggest_craftbook, read_task_notes","startTime":219.71428571428572,"endTime":223.60714285714286,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":223.60714285714286,"endTime":227.5,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":227.5,"endTime":231.39285714285714,"audioSegment":0},{"text":"Data Tables Read a project's mirrored data tables with SQL list_tables,","startTime":231.39285714285714,"endTime":235.28571428571428,"audioSegment":0},{"text":"describe_table, query_table","startTime":235.28571428571428,"endTime":239.17857142857144,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":239.17857142857144,"endTime":243.07142857142856,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":243.07142857142856,"endTime":246.96428571428572,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":246.96428571428572,"endTime":250.85714285714286,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":250.85714285714286,"endTime":254.75,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":254.75,"endTime":258.6428571428571,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":258.6428571428571,"endTime":262.5357142857143,"audioSegment":0},{"text":"Web Access Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents,","startTime":262.5357142857143,"endTime":266.42857142857144,"audioSegment":0},{"text":"and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type) web_search, wikipedia_search, wikimedia_image_search, wikipedia_read, fetch_url, browser_find_page_element","startTime":266.42857142857144,"endTime":270.32142857142856,"audioSegment":0},{"text":"Browser Automation Drive a headless Chromium via Playwright scripts run_playwright_script","startTime":270.32142857142856,"endTime":274.2142857142857,"audioSegment":0},{"text":"Handboek Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":274.2142857142857,"endTime":278.1071428571429,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":278.1071428571429,"endTime":282,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":282,"endTime":284.09090909090907,"audioSegment":0},{"text":"tiny under 5B 66 of 67 tools —","startTime":284.09090909090907,"endTime":286.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":286.1818181818182,"endTime":288.27272727272725,"audioSegment":0},{"text":"small 5–12B 66 of 67 tools —","startTime":288.27272727272725,"endTime":290.3636363636364,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":290.3636363636364,"endTime":292.45454545454544,"audioSegment":0},{"text":"medium 12–45B 66 of 67 tools —","startTime":292.45454545454544,"endTime":294.54545454545456,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":294.54545454545456,"endTime":296.6363636363636,"audioSegment":0},{"text":"large 45B and up 66 of 67 tools —","startTime":296.6363636363636,"endTime":298.72727272727275,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":298.72727272727275,"endTime":300.8181818181818,"audioSegment":0},{"text":"cloud hosted 64 of 67 tools —","startTime":300.8181818181818,"endTime":302.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (3 of 6)","startTime":302.9090909090909,"endTime":305,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":305,"endTime":307.09090909090907,"audioSegment":0},{"text":"tiny under 5B 66 of 67 tools —","startTime":307.09090909090907,"endTime":309.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":309.1818181818182,"endTime":311.27272727272725,"audioSegment":0},{"text":"small 5–12B 66 of 67 tools —","startTime":311.27272727272725,"endTime":313.3636363636364,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":313.3636363636364,"endTime":315.45454545454544,"audioSegment":0},{"text":"medium 12–45B 66 of 67 tools —","startTime":315.45454545454544,"endTime":317.54545454545456,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":317.54545454545456,"endTime":319.6363636363636,"audioSegment":0},{"text":"large 45B and up 66 of 67 tools —","startTime":319.6363636363636,"endTime":321.72727272727275,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":321.72727272727275,"endTime":323.8181818181818,"audioSegment":0},{"text":"cloud hosted 64 of 67 tools —","startTime":323.8181818181818,"endTime":325.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (3 of 6)","startTime":325.9090909090909,"endTime":328,"audioSegment":0},{"text":"Craftbook What it does","startTime":328,"endTime":335.3636363636364,"audioSegment":0},{"text":"Cited Research Report Produce a rigorously cited research report that answers a specific question end to end: a planner first decomposes the question into sub-questions and locks the scope,","startTime":335.3636363636364,"endTime":342.72727272727275,"audioSegment":0},{"text":"then a researcher gathers and logs primary and secondary sources with inline citations, then a copywriter writes a structured markdown report (executive summary, findings, evidence, limitations, references).","startTime":342.72727272727275,"endTime":350.09090909090907,"audioSegment":0},{"text":"Competitive Analysis Compare a set of competitors across consistent dimensions and turn the comparison into an actionable analysis: a planner locks the competitor set and the evaluation dimensions,","startTime":350.09090909090907,"endTime":357.45454545454544,"audioSegment":0},{"text":"a researcher fills a feature/positioning matrix with evidence-backed cells, and a copywriter writes the analysis with a clear recommendation and competitive gaps.","startTime":357.45454545454544,"endTime":364.8181818181818,"audioSegment":0},{"text":"Due-Diligence Brief Produce a structured due-diligence brief on an entity (company, vendor, investment, partner): a planner locks the diligence dimensions and red-flag criteria,","startTime":364.8181818181818,"endTime":372.1818181818182,"audioSegment":0},{"text":"a researcher gathers verifiable facts and risk signals per dimension with sources, and a copywriter writes a decision-oriented brief with findings, risks, and an overall read.","startTime":372.1818181818182,"endTime":379.54545454545456,"audioSegment":0},{"text":"Fact-Check a Set of Claims Verify a set of claims one by one and produce a verdict report: a planner extracts and itemizes every checkable claim and locks the rating scale,","startTime":379.54545454545456,"endTime":386.9090909090909,"audioSegment":0},{"text":"a researcher independently verifies each claim against primary sources and logs the evidence, and a reviewer compiles a per-claim verdict report with ratings and corrections.","startTime":386.9090909090909,"endTime":394.27272727272725,"audioSegment":0},{"text":"Literature Review Survey the existing literature on a topic and synthesize it into a structured review: a planner sets the scope, inclusion criteria, and the themes to organize around,","startTime":394.27272727272725,"endTime":401.6363636363636,"audioSegment":0},{"text":"then a researcher gathers and characterizes each source (method, finding, quality), then a copywriter synthesizes them thematically rather than source-by-source, surfacing consensus, disagreement, and gaps.","startTime":401.6363636363636,"endTime":409,"audioSegment":0}],"version":1},"startBlock":{"title":"The Researcher","subtitle":"Give the Researcher a question and they come back with an answer you can trust — searched, read, cross-checked, and cited. They work the web, your document library, and the project workspace, and they distinguish between what a source says and what they merely suspect.","ambientMotion":"zoomIn"}}</script>
