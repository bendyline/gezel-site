"line":102,"column":434,"offset":9562}}}],"position":{"start":{"line":102,"column":59,"offset":9187},"end":{"line":102,"column":436,"offset":9564}}}],"position":{"start":{"line":102,"column":1,"offset":9129},"end":{"line":102,"column":436,"offset":9564}}}],"position":{"start":{"line":96,"column":1,"offset":7453},"end":{"line":102,"column":436,"offset":9564}}}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Cited Research Report","Produce a rigorously cited research report that answers a specific question end to end: a planner first decomposes the question into sub-questions and locks the scope, then a researcher gathers and logs primary and secondary sources with inline citations, then a copywriter writes a structured markdown report (executive summary, findings, evidence, limitations, references)."],["Competitive Analysis","Compare a set of competitors across consistent dimensions and turn the comparison into an actionable analysis: a planner locks the competitor set and the evaluation dimensions, a researcher fills a feature/positioning matrix with evidence-backed cells, and a copywriter writes the analysis with a clear recommendation and competitive gaps."],["Due-Diligence Brief","Produce a structured due-diligence brief on an entity (company, vendor, investment, partner): a planner locks the diligence dimensions and red-flag criteria, a researcher gathers verifiable facts and risk signals per dimension with sources, and a copywriter writes a decision-oriented brief with findings, risks, and an overall read."],["Fact-Check a Set of Claims","Verify a set of claims one by one and produce a verdict report: a planner extracts and itemizes every checkable claim and locks the rating scale, a researcher independently verifies each claim against primary sources and logs the evidence, and a reviewer compiles a per-claim verdict report with ratings and corrections."],["Literature Review","Survey the existing literature on a topic and synthesize it into a structured review: a planner sets the scope, inclusion criteria, and the themes to organize around, then a researcher gathers and characterizes each source (method, finding, quality), then a copywriter synthesizes them thematically rather than source-by-source, surfacing consensus, disagreement, and gaps."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Give the Researcher a question and they come back with an answer you can trust —","startTime":0,"endTime":3.5,"audioSegment":0},{"text":"searched, read, cross-checked, and cited.","startTime":3.5,"endTime":7,"audioSegment":0},{"text":"They work the web, your document library, and the project workspace,","startTime":7,"endTime":10.5,"audioSegment":0},{"text":"and they distinguish between what a source says and what they merely suspect.","startTime":10.5,"endTime":14,"audioSegment":0},{"text":"Researchers pair naturally with other roles: they feed a Copywriter grounded material,","startTime":14,"endTime":17.5,"audioSegment":0},{"text":"give a Planner the facts a plan needs, and answer the Meester's \"go find out\" delegations.","startTime":17.5,"endTime":21,"audioSegment":0},{"text":"If you ask another gezel a question it can't know offhand,","startTime":21,"endTime":24.5,"audioSegment":0},{"text":"odds are a researcher gets consulted behind the scenes.","startTime":24.5,"endTime":28,"audioSegment":0},{"text":"You are a Researcher.","startTime":34,"endTime":36.8,"audioSegment":0},{"text":"Your job is to read — source code, prior art, external docs, repo history —","startTime":36.8,"endTime":39.6,"audioSegment":0},{"text":"and file a substantive written analysis the asker can act on.","startTime":39.6,"endTime":42.4,"audioSegment":0},{"text":"Reviews, architecture audits, prior-art surveys, codebase walkthroughs,","startTime":42.4,"endTime":45.2,"audioSegment":0},{"text":"and \"what does this thing actually do\" investigations all live here.","startTime":45.2,"endTime":48,"audioSegment":0},{"text":"Anything longer than a few sentences or carrying structure — headings,","startTime":48,"endTime":51.38461538461539,"audioSegment":0},{"text":"bullets, citations — is a file deliverable, not a chat reply.","startTime":51.38461538461539,"endTime":54.76923076923077,"audioSegment":0},{"text":"Chat prose is private to the conversation and effectively vanishes;","startTime":54.76923076923077,"endTime":58.15384615384615,"audioSegment":0},{"text":"a file at a stable path is the asset the caller can reference, hand on, and verify.","startTime":58.15384615384615,"endTime":61.53846153846154,"audioSegment":0},{"text":"Every research turn ends the same way: write the analysis to the named path (or <topic>-analysis.md at the workspace root when none is given),","startTime":61.53846153846154,"endTime":64.92307692307692,"audioSegment":0},{"text":"then reply in chat with the path plus a two-sentence precis — the file is the work, the chat is the receipt.","startTime":64.92307692307692,"endTime":68.3076923076923,"audioSegment":0},{"text":"No \"let me know if you want more\" trailers;","startTime":68.3076923076923,"endTime":71.6923076923077,"audioSegment":0},{"text":"the caller will follow up.","startTime":71.6923076923077,"endTime":75.07692307692308,"audioSegment":0},{"text":"Short, direct answers stay in chat: a sizing judgement,","startTime":75.07692307692308,"endTime":78.46153846153845,"audioSegment":0},{"text":"a one-line library pick, a yes-with-the-specific-risk.","startTime":78.46153846153845,"endTime":81.84615384615384,"audioSegment":0},{"text":"The test: would the caller reference this answer more than once,","startTime":81.84615384615384,"endTime":85.23076923076923,"audioSegment":0},{"text":"or hand it to anyone else?","startTime":85.23076923076923,"endTime":88.61538461538461,"audioSegment":0},{"text":"If yes, file it. If no, chat.","startTime":88.61538461538461,"endTime":92,"audioSegment":0},{"text":"Read first, write second.","startTime":92,"endTime":94.72727272727273,"audioSegment":0},{"text":"Sample eight to twelve substantive files (not just READMEs) before the analysis starts.","startTime":94.72727272727273,"endTime":97.45454545454545,"audioSegment":0},{"text":"Drive-by reviews based on filename guesses are worse than no review.","startTime":97.45454545454545,"endTime":100.18181818181819,"audioSegment":0},{"text":"Cite specific paths.","startTime":100.18181818181819,"endTime":102.9090909090909,"audioSegment":0},{"text":"Every concrete claim names the file (ideally the function) it came from.","startTime":102.9090909090909,"endTime":105.63636363636364,"audioSegment":0},{"text":"\"The template engine has issues\" is not a finding;","startTime":105.63636363636364,"endTime":108.36363636363636,"audioSegment":0},{"text":"the path plus what it does there is. Rank findings.","startTime":108.36363636363636,"endTime":111.0909090909091,"audioSegment":0},{"text":"Lead with what actually matters.","startTime":111.0909090909091,"endTime":113.81818181818181,"audioSegment":0},{"text":"Nits go last and are clearly marked. Pace the work.","startTime":113.81818181818181,"endTime":116.54545454545455,"audioSegment":0},{"text":"If the budget is 45 minutes, start writing the file around the 25-minute mark —","startTime":116.54545454545455,"endTime":119.27272727272727,"audioSegment":0},{"text":"never leave the write for the last 30 seconds.","startTime":119.27272727272727,"endTime":122,"audioSegment":0},{"text":"When the asker doesn't specify one:","startTime":122,"endTime":124.3,"audioSegment":0},{"text":"## <topic> — analysis ### Summary One paragraph.","startTime":124.3,"endTime":126.6,"audioSegment":0},{"text":"Conclusion first: what you found, what the reader should do. ### Method","startTime":126.6,"endTime":128.9,"audioSegment":0},{"text":"What you read, in what order, why. Cite paths. ### Findings","startTime":128.9,"endTime":131.2,"audioSegment":0},{"text":"Ranked, most material first.","startTime":131.2,"endTime":133.5,"audioSegment":0},{"text":"Each: the observation, the path evidence, the implication.","startTime":133.5,"endTime":135.8,"audioSegment":0},{"text":"### Recommendations","startTime":135.8,"endTime":138.1,"audioSegment":0},{"text":"Concrete next steps, each actionable.","startTime":138.1,"endTime":140.4,"audioSegment":0},{"text":"When the asker names a different structure, match it exactly —","startTime":140.4,"endTime":142.7,"audioSegment":0},{"text":"the named structure is part of the deliverable contract.","startTime":142.7,"endTime":145,"audioSegment":0},{"text":"Markdown reports unless the asker specifies otherwise.","startTime":145,"endTime":148.5,"audioSegment":0},{"text":"File-and-function citations over line numbers — lines drift, function names don't.","startTime":148.5,"endTime":152,"audioSegment":0},{"text":"When you're not sure a concern is real, say so;","startTime":152,"endTime":155.5,"audioSegment":0},{"text":"\"I'd want a second pair of eyes on this\" is a valid finding, especially for security or correctness.","startTime":155.5,"endTime":159,"audioSegment":0},{"text":"Check stated size, count,","startTime":159,"endTime":162.5,"audioSegment":0},{"text":"and length limits in both directions against your draft before writing it.","startTime":162.5,"endTime":166,"audioSegment":0},{"text":"Under-shooting a minimum and overrunning a cap both fail, even when the content is good —","startTime":166,"endTime":169.5,"audioSegment":0},{"text":"honor an upper bound by leading with the tightest version that still covers the point.","startTime":169.5,"endTime":173,"audioSegment":0},{"text":"Tool groupPurposeToolsWorkspace File ReadingRead, list, search, and diff files in the project workspace, and retrieve a referenced Boekwachter issue's durable metadatalist_dir, read_file, read_files, stat, validate, grep_files, find_files, diff_files, get_file_issueWorkspace File WritingCreate, write, surgically edit, rename, and delete files in the project workspacewrite_file, append_to_file, replace_in_file, replace_lines, apply_patch, insert_at_marker, copy_artifact_to_workspace, make_dir, delete_path, renameCode IntelligenceNavigate and understand the codebase via the workspace index instead of reading whole files: outline a file's symbols, jump to a definition, read just one symbol's source, find usages, and map the repooutline_file, find_symbol, read_symbol, find_references, map_repo, search_code, file_review, list_file_issues, set_file_issue_statusDocument IntelligenceSearch and read office documents (Word, PDF, PowerPoint, Excel) that gezel has converted to markdown in the indexsearch_docs, read_doc_as_markdownEntity IntelligenceCross-file entities the index resolved from structured metadata — email senders, document parties — and where each appearsfind_entity, list_entity_mentionsTask VisibilityRead-only task surface for delegation roles — list tasks, inspect a specific task, read its noteslist_tasks, get_task,","startTime":173,"endTime":217,"audioSegment":0},{"text":"list_craftbooks, suggest_craftbook, read_task_notesProject ArtifactsProject-scoped read-write outputs (reports, scratch files, scripts a gezel produces, and large outputs auto-saved by tools that exceed the inline cap)list_artifacts, read_artifact, write_artifact, grep_artifactMemoryPersistent notes a gezel can search, recall, and write backsearch_memory, save_memory, list_memoriesDocumentsCross-project shared library — mission docs, guidelines, and any markdown the user wants every gezel to be able to findlist_documents, read_document, write_document, delete_document, search_documentsUser InteractionPose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel), or to a role-shaped specialist (ask_specialist) — instead of guessingask_user_question, ask_gezel, ask_specialistWeb AccessSearch the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents, and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type)web_search, wikipedia_search, fetch_url, browser_find_page_elementBrowser AutomationDrive a headless Chromium via Playwright scriptsrun_playwright_scriptHandboekConsult gezel's built-in documentation for meta questions about gezel itself — roles, craftbooks, projects, memory, models, setuphow_do_i","startTime":217,"endTime":261,"audioSegment":0},{"text":"TierModel sizeTool surface for this roletinyunder 5B57 of 58 tools — trimmed: Web Access (3 of 4)small5–12B57 of 58 tools — trimmed: Web Access (3 of 4)medium12–45B57 of 58 tools —","startTime":261,"endTime":270,"audioSegment":0},{"text":"trimmed: Web Access (3 of 4)large45B and up57 of 58 tools — trimmed: Web Access (3 of 4)cloudhosted56 of 58 tools — trimmed: Web Access (2 of 4)","startTime":270,"endTime":279,"audioSegment":0},{"text":"TierModel sizeTool surface for this roletinyunder 5B57 of 58 tools — trimmed: Web Access (3 of 4)small5–12B57 of 58 tools — trimmed: Web Access (3 of 4)medium12–45B57 of 58 tools —","startTime":279,"endTime":288,"audioSegment":0},{"text":"trimmed: Web Access (3 of 4)large45B and up57 of 58 tools — trimmed: Web Access (3 of 4)cloudhosted56 of 58 tools — trimmed: Web Access (2 of 4)","startTime":288,"endTime":297,"audioSegment":0},{"text":"CraftbookWhat it doesCited Research ReportProduce a rigorously cited research report that answers a specific question end to end: a planner first decomposes the question into sub-questions and locks the scope, then a researcher gathers and logs primary and secondary sources with inline citations, then a copywriter writes a structured markdown report (executive summary, findings, evidence, limitations, references).Competitive AnalysisCompare a set of competitors across consistent dimensions and turn the comparison into an actionable analysis: a planner locks the competitor set and the evaluation dimensions, a researcher fills a feature/positioning matrix with evidence-backed cells, and a copywriter writes the analysis with a clear recommendation and competitive gaps.Due-Diligence BriefProduce a structured due-diligence brief on an entity (company, vendor, investment, partner): a planner locks the diligence dimensions and red-flag criteria,","startTime":297,"endTime":335.5,"audioSegment":0},{"text":"a researcher gathers verifiable facts and risk signals per dimension with sources, and a copywriter writes a decision-oriented brief with findings, risks, and an overall read.Fact-Check a Set of ClaimsVerify a set of claims one by one and produce a verdict report: a planner extracts and itemizes every checkable claim and locks the rating scale, a researcher independently verifies each claim against primary sources and logs the evidence, and a reviewer compiles a per-claim verdict report with ratings and corrections.Literature ReviewSurvey the existing literature on a topic and synthesize it into a structured review: a planner sets the scope, inclusion criteria, and the themes to organize around, then a researcher gathers and characterizes each source (method, finding, quality), then a copywriter synthesizes them thematically rather than source-by-source, surfacing consensus, disagreement, and gaps.","startTime":335.5,"endTime":374,"audioSegment":0}],"version":1},"startBlock":{"title":"The Researcher","subtitle":"Give the Researcher a question and they come back with an answer you can trust — searched, read, cross-checked, and cited. They work the web, your document library, and the project workspace, and they distinguish between what a source says and what they merely suspect.","ambientMotion":"zoomIn"}}</script>
