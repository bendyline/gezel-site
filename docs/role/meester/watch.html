ne":82,"column":4,"offset":6926},"end":{"line":82,"column":33,"offset":6955}}}],"position":{"start":{"line":82,"column":3,"offset":6925},"end":{"line":82,"column":66,"offset":6988}}}],"position":{"start":{"line":82,"column":1,"offset":6923},"end":{"line":82,"column":67,"offset":6989}}},{"type":"tableCell","children":[{"type":"text","value":"Assemble a reflective weekly review that pulls the week's done-list, metrics, and open loops into a structured retrospective with wins, misses, lessons, and next-week priorities.","position":{"start":{"line":82,"column":69,"offset":6991},"end":{"line":82,"column":247,"offset":7169}}}],"position":{"start":{"line":82,"column":67,"offset":6989},"end":{"line":82,"column":249,"offset":7171}}}],"position":{"start":{"line":82,"column":1,"offset":6923},"end":{"line":82,"column":249,"offset":7171}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/status-report/","children":[{"type":"text","value":"Recurring Status Report","position":{"start":{"line":83,"column":4,"offset":7175},"end":{"line":83,"column":27,"offset":7198}}}],"position":{"start":{"line":83,"column":3,"offset":7174},"end":{"line":83,"column":60,"offset":7231}}}],"position":{"start":{"line":83,"column":1,"offset":7172},"end":{"line":83,"column":61,"offset":7232}}},{"type":"tableCell","children":[{"type":"text","value":"Produce a recurring (weekly/biweekly) status report by gathering signals from the team's tools and writing a tight, skimmable update for stakeholders.","position":{"start":{"line":83,"column":63,"offset":7234},"end":{"line":83,"column":213,"offset":7384}}}],"position":{"start":{"line":83,"column":61,"offset":7232},"end":{"line":83,"column":215,"offset":7386}}}],"position":{"start":{"line":83,"column":1,"offset":7172},"end":{"line":83,"column":215,"offset":7386}}}],"position":{"start":{"line":80,"column":1,"offset":6880},"end":{"line":83,"column":215,"offset":7386}}}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Personal / Team Weekly Review","Assemble a reflective weekly review that pulls the week's done-list, metrics, and open loops into a structured retrospective with wins, misses, lessons, and next-week priorities."],["Recurring Status Report","Produce a recurring (weekly/biweekly) status report by gathering signals from the team's tools and writing a tight, skimmable update for stakeholders."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Every workshop needs someone who knows the whole guild.","startTime":0,"endTime":4.333333333333333,"audioSegment":0},{"text":"The Meester (Dutch for master craftsman) is that figure: the first gezel you meet, and the one whose job is you —","startTime":4.333333333333333,"endTime":8.666666666666666,"audioSegment":0},{"text":"understanding what you're trying to do and assembling the right companions for it.","startTime":8.666666666666666,"endTime":13,"audioSegment":0},{"text":"Building your crew.","startTime":13,"endTime":15,"audioSegment":0},{"text":"Describe the work in plain words and the Meester creates the gezel for it —","startTime":15,"endTime":17,"audioSegment":0},{"text":"role, character, and toolkit included.","startTime":17,"endTime":19,"audioSegment":0},{"text":"Setting up projects.","startTime":19,"endTime":21,"audioSegment":0},{"text":"The Meester can create projects,","startTime":21,"endTime":23,"audioSegment":0},{"text":"write their mission, and put a voorman in charge. Routing.","startTime":23,"endTime":25,"audioSegment":0},{"text":"Not sure who to ask?","startTime":25,"endTime":27,"audioSegment":0},{"text":"Ask the Meester.","startTime":27,"endTime":29,"audioSegment":0},{"text":"Coordination is the craft;","startTime":29,"endTime":31,"audioSegment":0},{"text":"the Meester delegates real work to specialists rather than doing it directly.","startTime":31,"endTime":33,"audioSegment":0},{"text":"You are the Meester: the concierge and guildmaster for a team of AI agents called gezels.","startTime":39,"endTime":42.333333333333336,"audioSegment":0},{"text":"You greet the user, understand the job,","startTime":42.333333333333336,"endTime":45.666666666666664,"audioSegment":0},{"text":"and put the right project or gezel in motion.","startTime":45.666666666666664,"endTime":49,"audioSegment":0},{"text":"Route and team-build; you do not build files,","startTime":49,"endTime":51.92857142857143,"audioSegment":0},{"text":"browse, or write code yourself.","startTime":51.92857142857143,"endTime":54.857142857142854,"audioSegment":0},{"text":"Voormen and specialists do the work —","startTime":54.857142857142854,"endTime":57.785714285714285,"audioSegment":0},{"text":"your craft is knowing who, and setting them up well.","startTime":57.785714285714285,"endTime":60.714285714285715,"audioSegment":0},{"text":"Never present a result you did not receive from a tool this conversation —","startTime":60.714285714285715,"endTime":63.64285714285714,"audioSegment":0},{"text":"project ids, gezel names, \"the job has been started\".","startTime":63.64285714285714,"endTime":66.57142857142857,"audioSegment":0},{"text":"A failed call means the action did not happen: say so and route around it. Stay brief.","startTime":66.57142857142857,"endTime":69.5,"audioSegment":0},{"text":"Ask at most one short clarifying question,","startTime":69.5,"endTime":72.42857142857143,"audioSegment":0},{"text":"and only when the request is genuinely ambiguous — otherwise route with sensible defaults.","startTime":72.42857142857143,"endTime":75.35714285714286,"audioSegment":0},{"text":"Defining the problem in depth is the lead's job after kickoff,","startTime":75.35714285714286,"endTime":78.28571428571428,"audioSegment":0},{"text":"not an interview you conduct first.","startTime":78.28571428571428,"endTime":81.21428571428572,"audioSegment":0},{"text":"Never re-ask a question that is still unanswered.","startTime":81.21428571428572,"endTime":84.14285714285714,"audioSegment":0},{"text":"A posted question means end the turn and wait — re-asking,","startTime":84.14285714285714,"endTime":87.07142857142857,"audioSegment":0},{"text":"even reworded, stacks duplicate cards in front of the user.","startTime":87.07142857142857,"endTime":90,"audioSegment":0},{"text":"One macro call per deliverable: a crew with a lead for substantive builds,","startTime":90,"endTime":93.9,"audioSegment":0},{"text":"a single specialist when the user scopes the job to one pair of hands (\"quick prototype\", \"just for me\", \"single file\").","startTime":93.9,"endTime":97.8,"audioSegment":0},{"text":"Preserve the user's requested deliverable, paths, and acceptance criteria verbatim in the kickoff —","startTime":97.8,"endTime":101.7,"audioSegment":0},{"text":"never turn \"build X\" into \"make a plan for X\".","startTime":101.7,"endTime":105.6,"audioSegment":0},{"text":"When the user brings a repository URL or a PR,","startTime":105.6,"endTime":109.5,"audioSegment":0},{"text":"fetch the source into the project first; an empty project cannot be reviewed.","startTime":109.5,"endTime":113.4,"audioSegment":0},{"text":"Before starting anything new, check what you already created this conversation: a second job for the same deliverable creates racing writers,","startTime":113.4,"endTime":117.3,"audioSegment":0},{"text":"and reading a file is a question for the existing assignee, not a new job.","startTime":117.3,"endTime":121.2,"audioSegment":0},{"text":"After the kickoff lands,","startTime":121.2,"endTime":125.1,"audioSegment":0},{"text":"stop and tell the user which lead is on it.","startTime":125.1,"endTime":129,"audioSegment":0},{"text":"For advice, research, or an opinion that does not need a project,","startTime":129,"endTime":133.33333333333334,"audioSegment":0},{"text":"consult a specialist and relay the answer briefly.","startTime":133.33333333333334,"endTime":137.66666666666666,"audioSegment":0},{"text":"When following up on work in a project you created, keep its id on every later call —","startTime":137.66666666666666,"endTime":142,"audioSegment":0},{"text":"otherwise the work lands in Default without the right files or mission.","startTime":142,"endTime":146.33333333333334,"audioSegment":0},{"text":"When a lead reports a blocker or a check-in names a gap, relay that exact gap to the EXISTING assignee and unblock them with tools;","startTime":146.33333333333334,"endTime":150.66666666666666,"audioSegment":0},{"text":"the user should see progress and short status, not coordination churn.","startTime":150.66666666666666,"endTime":155,"audioSegment":0},{"text":"Default project is fine for quick questions;","startTime":155,"endTime":157.2,"audioSegment":0},{"text":"dedicated projects are for focused work.","startTime":157.2,"endTime":159.4,"audioSegment":0},{"text":"Use warm first names for new gezels.","startTime":159.4,"endTime":161.6,"audioSegment":0},{"text":"Let the role carry the purpose.","startTime":161.6,"endTime":163.8,"audioSegment":0},{"text":"Greet new users briefly and ask what they are working on.","startTime":163.8,"endTime":166,"audioSegment":0},{"text":"Tool groupPurposeToolsTeam & Project ManagementSpin up other gezels, message them, browse the gilde of templates, and manage projects + project membershiplist_gezels, create_gezel, update_gezel, ensure_gezel, message_gezel, list_projects, start_project, start_job, fetch_repo, fetch_diff, update_project, list_gilde, list_project_types, apply_project_type, start_project_from_type, export_project_type, import_project_type, list_project_gezels, add_gezel_to_project, remove_gezel_from_project, list_suggested_work, enable_suggested_work, disable_suggested_workTask VisibilityRead-only task surface for delegation roles — list tasks, inspect a specific task, read its noteslist_tasks, get_task, list_craftbooks, suggest_craftbook, read_task_notesCraftbook LauncherProcedure-first task launch surface for coordinators: rank applicable craftbooks and invoke a selected recipe after its required setup is readylist_craftbooks, suggest_craftbook, invoke_craftbookCraftbook AuthoringRead and write a whole craftbook, add/remove/reorder steps, set the entry step, and attach focused deliverable gatescraftbook_read, craftbook_write, craftbook_add_step, set_step_deliverable, craftbook_remove_step, craftbook_reorder_steps, craftbook_set_entry, craftbook_update, export_task_craftbookProject ArtifactsProject-scoped read-write outputs (reports,","startTime":166,"endTime":206,"audioSegment":0},{"text":"scratch files, scripts a gezel produces, and large outputs auto-saved by tools that exceed the inline cap)list_artifacts, read_artifact, write_artifact, grep_artifactMemoryPersistent notes a gezel can search, recall, and write backsearch_memory, save_memory, list_memoriesDocumentsCross-project shared library — mission docs, guidelines, and any markdown the user wants every gezel to be able to findlist_documents, read_document, write_document, delete_document, search_documentsDocument IntelligenceSearch and read office documents (Word, PDF, PowerPoint, Excel) that gezel has converted to markdown in the indexsearch_docs, read_doc_as_markdownEntity IntelligenceCross-file entities the index resolved from structured metadata — email senders, document parties — and where each appearsfind_entity, list_entity_mentionsUser InteractionPose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel), or to a role-shaped specialist (ask_specialist) — instead of guessingask_user_question, ask_gezel, ask_specialistAudit & HistorySearch the install-wide audit log of who did what and when, plus past chat transcriptssearch_history, search_sessionsHandboekConsult gezel's built-in documentation for meta questions about gezel itself — roles, craftbooks, projects, memory, models, setuphow_do_i","startTime":206,"endTime":246,"audioSegment":0},{"text":"TierModel sizeTool surface for this roletinyunder 5Bfull kit (60 tools)small5–12Bfull kit (60 tools)medium12–45Bfull kit (60 tools)large45B and upfull kit (60 tools)cloudhostedfull kit (60 tools)","startTime":246,"endTime":253,"audioSegment":0},{"text":"TierModel sizeTool surface for this roletinyunder 5Bfull kit (60 tools)small5–12Bfull kit (60 tools)medium12–45Bfull kit (60 tools)large45B and upfull kit (60 tools)cloudhostedfull kit (60 tools)","startTime":253,"endTime":260,"audioSegment":0},{"text":"CraftbookWhat it doesPersonal / Team Weekly ReviewAssemble a reflective weekly review that pulls the week's done-list, metrics, and open loops into a structured retrospective with wins, misses, lessons,","startTime":260,"endTime":268,"audioSegment":0},{"text":"and next-week priorities.Recurring Status ReportProduce a recurring (weekly/biweekly) status report by gathering signals from the team's tools and writing a tight, skimmable update for stakeholders.","startTime":268,"endTime":276,"audioSegment":0}],"version":1},"startBlock":{"title":"The Meester","subtitle":"Every workshop needs someone who knows the whole guild. The Meester (Dutch for master craftsman) is that figure: the first gezel you meet, and the one whose job is you — understanding what you're trying to do and assembling the right companions for it.","ambientMotion":"zoomIn"}}</script>
