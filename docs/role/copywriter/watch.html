t line, preview text, and body to its single goal, then builds the sequence into a client-safe, inline-styled HTML email set ready to load into an ESP.","position":{"start":{"line":68,"column":65,"offset":5817},"end":{"line":68,"column":521,"offset":6273}}}],"position":{"start":{"line":68,"column":63,"offset":5815},"end":{"line":68,"column":523,"offset":6275}}}],"position":{"start":{"line":68,"column":1,"offset":5753},"end":{"line":68,"column":523,"offset":6275}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/press-release/","children":[{"type":"text","value":"Press Release","position":{"start":{"line":69,"column":4,"offset":6279},"end":{"line":69,"column":17,"offset":6292}}}],"position":{"start":{"line":69,"column":3,"offset":6278},"end":{"line":69,"column":50,"offset":6325}}}],"position":{"start":{"line":69,"column":1,"offset":6276},"end":{"line":69,"column":51,"offset":6326}}},{"type":"tableCell","children":[{"type":"text","value":"Write a professional, AP-style press release ready to send to journalists: it first locks the news angle, the five W's, the approved quote(s), and the boilerplate, then drafts the release in the standard format — dateline, inverted-pyramid lede, supporting body, quotes, boilerplate, and media contact — then a review pass enforces newsworthiness, factual accuracy, and house style.","position":{"start":{"line":69,"column":53,"offset":6328},"end":{"line":69,"column":435,"offset":6710}}}],"position":{"start":{"line":69,"column":51,"offset":6326},"end":{"line":69,"column":437,"offset":6712}}}],"position":{"start":{"line":69,"column":1,"offset":6276},"end":{"line":69,"column":437,"offset":6712}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../../craftbook/blog-post/","children":[{"type":"text","value":"SEO Blog Post","position":{"start":{"line":70,"column":4,"offset":6716},"end":{"line":70,"column":17,"offset":6729}}}],"position":{"start":{"line":70,"column":3,"offset":6715},"end":{"line":70,"column":46,"offset":6758}}}],"position":{"start":{"line":70,"column":1,"offset":6713},"end":{"line":70,"column":47,"offset":6759}}},{"type":"tableCell","children":[{"type":"text","value":"Write a complete, SEO-aware blog post that ranks and reads well: it locks the primary keyword, search intent, target reader, and a heading-by-heading outline FIRST, then drafts the full article in a single human voice with the keyword woven naturally into the title, intro, and H2s, and finally runs an editorial pass for clarity, flow, factual accuracy, and on-page SEO.","position":{"start":{"line":70,"column":49,"offset":6761},"end":{"line":70,"column":420,"offset":7132}}}],"position":{"start":{"line":70,"column":47,"offset":6759},"end":{"line":70,"column":422,"offset":7134}}}],"position":{"start":{"line":70,"column":1,"offset":6713},"end":{"line":70,"column":422,"offset":7134}}}],"position":{"start":{"line":64,"column":1,"offset":4883},"end":{"line":70,"column":422,"offset":7134}}}],"autoTemplate":true,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Bulk Product Descriptions","Generate consistent, on-brand product descriptions in bulk from a list of products and their attributes: it first locks the brand voice, the field schema (title, short blurb, long description, bullet features, SEO meta), and a worked exemplar, then drafts every product to that exact template so the whole catalog reads as one voice."],["Landing Page Copy","Write conversion-focused copy for a single landing page: it first locks the offer, the one primary audience, the single desired action, and the core promise, then drafts a full message hierarchy — hero headline and subhead, value props, social proof, objection handling, and one repeated CTA — then edits ruthlessly for clarity, specificity, and persuasive flow."],["Lifecycle Email Sequence","Design and build a multi-email lifecycle sequence (welcome, onboarding, nurture, re-engagement) that moves a subscriber from one stage to the next: it first maps the customer journey — entry trigger, the goal of each email, send timing/cadence, and the one CTA per email — then drafts every email's subject line, preview text, and body to its single goal, then builds the sequence into a client-safe, inline-styled HTML email set ready to load into an ESP."],["Press Release","Write a professional, AP-style press release ready to send to journalists: it first locks the news angle, the five W's, the approved quote(s), and the boilerplate, then drafts the release in the standard format — dateline, inverted-pyramid lede, supporting body, quotes, boilerplate, and media contact — then a review pass enforces newsworthiness, factual accuracy, and house style."],["SEO Blog Post","Write a complete, SEO-aware blog post that ranks and reads well: it locks the primary keyword, search intent, target reader, and a heading-by-heading outline FIRST, then drafts the full article in a single human voice with the keyword woven naturally into the title, intro, and H2s, and finally runs an editorial pass for clarity, flow, factual accuracy, and on-page SEO."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Copywriter turns briefs into words: newsletters, product copy,","startTime":0,"endTime":3.4285714285714284,"audioSegment":0},{"text":"announcements, scripts, the awkward email you've been putting off.","startTime":3.4285714285714284,"endTime":6.857142857142857,"audioSegment":0},{"text":"They work to constraints — length, tone, audience —","startTime":6.857142857142857,"endTime":10.285714285714285,"audioSegment":0},{"text":"and they revise without ego when you push back.","startTime":10.285714285714285,"endTime":13.714285714285714,"audioSegment":0},{"text":"Copywriters do their best work when the library gives them something to stand on: a style guide in Documents,","startTime":13.714285714285714,"endTime":17.142857142857142,"audioSegment":0},{"text":"a project About that names the audience, a Researcher's notes to draw from.","startTime":17.142857142857142,"endTime":20.57142857142857,"audioSegment":0},{"text":"Feed the context once and every draft after starts closer to right.","startTime":20.57142857142857,"endTime":24,"audioSegment":0},{"text":"You are a Copywriter.","startTime":30,"endTime":32,"audioSegment":0},{"text":"You write for a specific reader and a specific job —","startTime":32,"endTime":34,"audioSegment":0},{"text":"never in the abstract.","startTime":34,"endTime":36,"audioSegment":0},{"text":"Lead with the reader, not the product.","startTime":36,"endTime":38.125,"audioSegment":0},{"text":"\"What's the one thing this person needs to know in the first five seconds?\"","startTime":38.125,"endTime":40.25,"audioSegment":0},{"text":"Cut every sentence that's decorative.","startTime":40.25,"endTime":42.375,"audioSegment":0},{"text":"Length earns its keep.","startTime":42.375,"endTime":44.5,"audioSegment":0},{"text":"Show, don't declare.","startTime":44.5,"endTime":46.625,"audioSegment":0},{"text":"\"Fast\" is weak; \"2s build, 12ms frame time\" is evidence.","startTime":46.625,"endTime":48.75,"audioSegment":0},{"text":"Offer versions at different lengths.","startTime":48.75,"endTime":50.875,"audioSegment":0},{"text":"A headline, a subheading, a paragraph — the designer picks.","startTime":50.875,"endTime":53,"audioSegment":0},{"text":"Default to a conversational register (not marketing-speak) unless the brand requires otherwise.","startTime":53,"endTime":56.25,"audioSegment":0},{"text":"Prefer short words to long ones, concrete nouns to abstract ones.","startTime":56.25,"endTime":59.5,"audioSegment":0},{"text":"When the copy is for a product,","startTime":59.5,"endTime":62.75,"audioSegment":0},{"text":"read the relevant about.md or project docs first — voice consistency matters.","startTime":62.75,"endTime":66,"audioSegment":0},{"text":"Tool groupPurposeToolsWorkspace File ted CTA — then edits ruthlessly for clarity, specificity, and persuasive flow.Lifecycle Email SequenceDesign and build a multi-email lifecycle sequence (welcome, onboarding, nurture, re-engagement) that moves a subscriber from one stage to the next: it first maps the customer journey — entry trigger, the goal of each email,","startTime":175,"endTime":221,"audioSegment":0},{"text":"send timing/cadence, and the one CTA per email — then drafts every email's subject line, preview text, and body to its single goal, then builds the sequence into a client-safe, inline-styled HTML email set ready to load into an ESP.Press ReleaseWrite a professional, AP-style press release ready to send to journalists: it first locks the news angle, the five W's, the approved quote(s), and the boilerplate, then drafts the release in the standard format — dateline, inverted-pyramid lede, supporting body, quotes, boilerplate, and media contact — then a review pass enforces newsworthiness, factual accuracy, and house style.SEO Blog PostWrite a complete, SEO-aware blog post that ranks and reads well: it locks the primary keyword, search intent, target reader, and a heading-by-heading outline FIRST, then drafts the full article in a single human voice with the keyword woven naturally into the title, intro, and H2s, and finally runs an editorial pass for clarity, flow, factual accuracy, and on-page SEO.","startTime":221,"endTime":267,"audioSegment":0}],"version":1},"startBlock":{"title":"The Copywriter","subtitle":"The Copywriter turns briefs into words: newsletters, product copy, announcements, scripts, the awkward email you've been putting off. They work to constraints — length, tone, audience — and they revise without ego when you push back.","ambientMotion":"zoomIn"}}</script>
