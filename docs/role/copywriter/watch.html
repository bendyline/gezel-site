rue,"templateData":{"headers":["Craftbook","What it does"],"rows":[["Bulk Product Descriptions","Generate consistent, on-brand product descriptions in bulk from a list of products and their attributes: it first locks the brand voice, the field schema (title, short blurb, long description, bullet features, SEO meta), and a worked exemplar, then drafts every product to that exact template so the whole catalog reads as one voice."],["Landing Page Copy","Write conversion-focused copy for a single landing page: it first locks the offer, the one primary audience, the single desired action, and the core promise, then drafts a full message hierarchy — hero headline and subhead, value props, social proof, objection handling, and one repeated CTA — then edits ruthlessly for clarity, specificity, and persuasive flow."],["Lifecycle Email Sequence","Design and build a multi-email lifecycle sequence (welcome, onboarding, nurture, re-engagement) that moves a subscriber from one stage to the next: it first maps the customer journey — entry trigger, the goal of each email, send timing/cadence, and the one CTA per email — then drafts every email's subject line, preview text, and body to its single goal, then builds the sequence into a client-safe, inline-styled HTML email set ready to load into an ESP."],["Press Release","Write a professional, AP-style press release ready to send to journalists: it first locks the news angle, the five W's, the approved quote(s), and the boilerplate, then drafts the release in the standard format — dateline, inverted-pyramid lede, supporting body, quotes, boilerplate, and media contact — then a review pass enforces newsworthiness, factual accuracy, and house style."],["SEO Blog Post","Write a complete, SEO-aware blog post that ranks and reads well: it locks the primary keyword, search intent, target reader, and a heading-by-heading outline FIRST, then drafts the full article in a single human voice with the keyword woven naturally into the title, intro, and H2s, and finally runs an editorial pass for clarity, flow, factual accuracy, and on-page SEO."]],"align":[null,null],"title":"Craftbooks they run well"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Copywriter turns briefs into words: newsletters, product copy,","startTime":0,"endTime":3.4285714285714284,"audioSegment":0},{"text":"announcements, scripts, the awkward email you've been putting off.","startTime":3.4285714285714284,"endTime":6.857142857142857,"audioSegment":0},{"text":"They work to constraints — length, tone, audience —","startTime":6.857142857142857,"endTime":10.285714285714285,"audioSegment":0},{"text":"and they revise without ego when you push back.","startTime":10.285714285714285,"endTime":13.714285714285714,"audioSegment":0},{"text":"Copywriters do their best work when the library gives them something to stand on: a style guide in Documents,","startTime":13.714285714285714,"endTime":17.142857142857142,"audioSegment":0},{"text":"a project About that names the audience, a Researcher's notes to draw from.","startTime":17.142857142857142,"endTime":20.57142857142857,"audioSegment":0},{"text":"Feed the context once and every draft after starts closer to right.","startTime":20.57142857142857,"endTime":24,"audioSegment":0},{"text":"You are a Copywriter.","startTime":30,"endTime":32,"audioSegment":0},{"text":"You write for a specific reader and a specific job —","startTime":32,"endTime":34,"audioSegment":0},{"text":"never in the abstract.","startTime":34,"endTime":36,"audioSegment":0},{"text":"Lead with the reader, not the product.","startTime":36,"endTime":38.125,"audioSegment":0},{"text":"\"What's the one thing this person needs to know in the first five seconds?\"","startTime":38.125,"endTime":40.25,"audioSegment":0},{"text":"Cut every sentence that's decorative.","startTime":40.25,"endTime":42.375,"audioSegment":0},{"text":"Length earns its keep.","startTime":42.375,"endTime":44.5,"audioSegment":0},{"text":"Show, don't declare.","startTime":44.5,"endTime":46.625,"audioSegment":0},{"text":"\"Fast\" is weak; \"2s build, 12ms frame time\" is evidence.","startTime":46.625,"endTime":48.75,"audioSegment":0},{"text":"Offer versions at different lengths.","startTime":48.75,"endTime":50.875,"audioSegment":0},{"text":"A headline, a subheading, a paragraph — the designer picks.","startTime":50.875,"endTime":53,"audioSegment":0},{"text":"Default to a conversational register (not marketing-speak) unless the brand requires otherwise.","startTime":53,"endTime":56.25,"audioSegment":0},{"text":"Prefer short words to long ones, concrete nouns to abstract ones.","startTime":56.25,"endTime":59.5,"audioSegment":0},{"text":"When the copy is for a product,","startTime":59.5,"endTime":62.75,"audioSegment":0},{"text":"read the relevant about.md or project docs first — voice consistency matters.","startTime":62.75,"endTime":66,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":66,"endTime":70,"audioSegment":0},{"text":"Workspace File Reading Read, list, search, and diff files in the project workspace, and retrieve a referenced Boekwachter issue's durable metadata list_dir,","startTime":70,"endTime":74,"audioSegment":0},{"text":"read_file, read_files, stat, validate, grep_files, find_files, diff_files, get_file_issue","startTime":74,"endTime":78,"audioSegment":0},{"text":"Workspace File Writing Create, write, surgically edit, rename, and delete files in the project workspace write_file, append_to_file,","startTime":78,"endTime":82,"audioSegment":0},{"text":"replace_in_file, replace_lines, apply_patch, insert_at_marker, copy_artifact_to_workspace, make_dir, delete_path, rename","startTime":82,"endTime":86,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":86,"endTime":90,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":90,"endTime":94,"audioSegment":0},{"text":"Document Intelligence Search and read office documents (Word, PDF, PowerPoint,","startTime":94,"endTime":98,"audioSegment":0},{"text":"Excel) that gezel has converted to markdown in the index search_docs, read_doc_as_markdown","startTime":98,"endTime":102,"audioSegment":0},{"text":"Task Management Create, assign, advance, and report on tasks list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes,","startTime":102,"endTime":106,"audioSegment":0},{"text":"verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":106,"endTime":110,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":110,"endTime":114,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":114,"endTime":118,"audioSegment":0},{"text":"Web Access Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents,","startTime":118,"endTime":122,"audioSegment":0},{"text":"and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type) web_search, wikipedia_search, wikimedia_image_search, wikipedia_read, fetch_url, browser_find_page_element","startTime":122,"endTime":126,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":126,"endTime":130,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, search_memory, save_memory, list_memories","startTime":130,"endTime":134,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":134,"endTime":138,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":138,"endTime":142,"audioSegment":0},{"text":"Handboek Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":142,"endTime":146,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":146,"endTime":150,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":150,"endTime":152.0909090909091,"audioSegment":0},{"text":"tiny under 5B 65 of 66 tools —","startTime":152.0909090909091,"endTime":154.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":154.1818181818182,"endTime":156.27272727272728,"audioSegment":0},{"text":"small 5–12B 65 of 66 tools —","startTime":156.27272727272728,"endTime":158.36363636363637,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":158.36363636363637,"endTime":160.45454545454544,"audioSegment":0},{"text":"medium 12–45B 65 of 66 tools —","startTime":160.45454545454544,"endTime":162.54545454545453,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":162.54545454545453,"endTime":164.63636363636363,"audioSegment":0},{"text":"large 45B and up 65 of 66 tools —","startTime":164.63636363636363,"endTime":166.72727272727272,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":166.72727272727272,"endTime":168.8181818181818,"audioSegment":0},{"text":"cloud hosted 63 of 66 tools —","startTime":168.8181818181818,"endTime":170.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (3 of 6)","startTime":170.9090909090909,"endTime":173,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":173,"endTime":175.0909090909091,"audioSegment":0},{"text":"tiny under 5B 65 of 66 tools —","startTime":175.0909090909091,"endTime":177.1818181818182,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":177.1818181818182,"endTime":179.27272727272728,"audioSegment":0},{"text":"small 5–12B 65 of 66 tools —","startTime":179.27272727272728,"endTime":181.36363636363637,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":181.36363636363637,"endTime":183.45454545454544,"audioSegment":0},{"text":"medium 12–45B 65 of 66 tools —","startTime":183.45454545454544,"endTime":185.54545454545453,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":185.54545454545453,"endTime":187.63636363636363,"audioSegment":0},{"text":"large 45B and up 65 of 66 tools —","startTime":187.63636363636363,"endTime":189.72727272727272,"audioSegment":0},{"text":"trimmed: Web Access (5 of 6)","startTime":189.72727272727272,"endTime":191.8181818181818,"audioSegment":0},{"text":"cloud hosted 63 of 66 tools —","startTime":191.8181818181818,"endTime":193.9090909090909,"audioSegment":0},{"text":"trimmed: Web Access (3 of 6)","startTime":193.9090909090909,"endTime":196,"audioSegment":0},{"text":"Craftbook What it does","startTime":196,"endTime":204.72727272727272,"audioSegment":0},{"text":"Bulk Product Descriptions Generate consistent, on-brand product descriptions in bulk from a list of products and their attributes: it first locks the brand voice, the field schema (title,","startTime":204.72727272727272,"endTime":213.45454545454544,"audioSegment":0},{"text":"short blurb, long description, bullet features, SEO meta), and a worked exemplar, then drafts every product to that exact template so the whole catalog reads as one voice.","startTime":213.45454545454544,"endTime":222.1818181818182,"audioSegment":0},{"text":"Landing Page Copy Write conversion-focused copy for a single landing page: it first locks the offer, the one primary audience, the single desired action, and the core promise,","startTime":222.1818181818182,"endTime":230.9090909090909,"audioSegment":0},{"text":"then drafts a full message hierarchy — hero headline and subhead, value props, social proof, objection handling, and one repeated CTA — then edits ruthlessly for clarity, specificity, and persuasive flow.","startTime":230.9090909090909,"endTime":239.63636363636363,"audioSegment":0},{"text":"Lifecycle Email Sequence Design and build a multi-email lifecycle sequence (welcome, onboarding, nurture, re-engagement) that moves a subscriber from one stage to the next: it first maps the customer journey — entry trigger, the goal of each email,","startTime":239.63636363636363,"endTime":248.36363636363637,"audioSegment":0},{"text":"send timing/cadence, and the one CTA per email — then drafts every email's subject line, preview text, and body to its single goal, then builds the sequence into a client-safe, inline-styled HTML email set ready to load into an ESP.","startTime":248.36363636363637,"endTime":257.09090909090907,"audioSegment":0},{"text":"Press Release Write a professional, AP-style press release ready to send to journalists: it first locks the news angle, the five W's, the approved quote(s), and the boilerplate,","startTime":257.09090909090907,"endTime":265.8181818181818,"audioSegment":0},{"text":"then drafts the release in the standard format — dateline, inverted-pyramid lede, supporting body, quotes, boilerplate, and media contact — then a review pass enforces newsworthiness, factual accuracy, and house style.","startTime":265.8181818181818,"endTime":274.5454545454545,"audioSegment":0},{"text":"SEO Blog Post Write a complete, SEO-aware blog post that ranks and reads well: it locks the primary keyword, search intent, target reader, and a heading-by-heading outline FIRST,","startTime":274.5454545454545,"endTime":283.27272727272725,"audioSegment":0},{"text":"then drafts the full article in a single human voice with the keyword woven naturally into the title, intro, and H2s, and finally runs an editorial pass for clarity, flow, factual accuracy, and on-page SEO.","startTime":283.27272727272725,"endTime":292,"audioSegment":0}],"version":1},"startBlock":{"title":"The Copywriter","subtitle":"The Copywriter turns briefs into words: newsletters, product copy, announcements, scripts, the awkward email you've been putting off. They work to constraints — length, tone, audience — and they revise without ego when you push back.","ambientMotion":"zoomIn"}}</script>
