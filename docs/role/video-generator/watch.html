"endTime":9.375,"audioSegment":0},{"text":"generated on whatever video model your device or provider offers, delivered into the project's artifacts.","startTime":9.375,"endTime":12.5,"audioSegment":0},{"text":"Like its sibling, it's fixed-function by design: no file editing,","startTime":12.5,"endTime":15.625,"audioSegment":0},{"text":"no workspace access, just generation.","startTime":15.625,"endTime":18.75,"audioSegment":0},{"text":"Short clips take real compute — on local hardware expect renders to be measured in minutes,","startTime":18.75,"endTime":21.875,"audioSegment":0},{"text":"not seconds, and lean on the smallest length that sells the idea.","startTime":21.875,"endTime":25,"audioSegment":0},{"text":"This gezel is a direct line to video generation.","startTime":31,"endTime":35,"audioSegment":0},{"text":"There's no chatbot in the middle — when you @mention it with a prompt,","startTime":35,"endTime":39,"audioSegment":0},{"text":"your text goes straight to the video engine on your machine and the finished clip lands in chat.","startTime":39,"endTime":43,"audioSegment":0},{"text":"Type the prompt as a plain description of the clip you want:","startTime":43,"endTime":45.888888888888886,"audioSegment":0},{"text":"@{name} a paper boat sailing down a rain gutter,","startTime":45.888888888888886,"endTime":48.77777777777778,"audioSegment":0},{"text":"golden hour, slow motion","startTime":48.77777777777778,"endTime":51.666666666666664,"audioSegment":0},{"text":"The clip is saved into your project's artifacts/generated/ folder,","startTime":51.666666666666664,"endTime":54.55555555555556,"audioSegment":0},{"text":"and a poster frame shows inline in the chat bubble.","startTime":54.55555555555556,"endTime":57.44444444444444,"audioSegment":0},{"text":"To iterate, ask again with a new prompt — it doesn't remember earlier messages,","startTime":57.44444444444444,"endTime":60.33333333333333,"audioSegment":0},{"text":"since there's no chatbot on this side.","startTime":60.33333333333333,"endTime":63.22222222222222,"audioSegment":0},{"text":"To animate a starting image,","startTime":63.22222222222222,"endTime":66.11111111111111,"audioSegment":0},{"text":"attach an image to your message (on models that support it, like Wan 2.2 TI2V-5B).","startTime":66.11111111111111,"endTime":69,"audioSegment":0},{"text":"The video model is picked in Settings → Video generation.","startTime":69,"endTime":72,"audioSegment":0},{"text":"Per-gezel defaults — width, height, frame count, frame rate, and model —","startTime":72,"endTime":75,"audioSegment":0},{"text":"are editable in the gezel's edit dialog under \"Default arguments\".","startTime":75,"endTime":78,"audioSegment":0},{"text":"Note that video generation is slow and uses the GPU exclusively,","startTime":78,"endTime":81,"audioSegment":0},{"text":"pausing the chat model while it runs.","startTime":81,"endTime":84,"audioSegment":0},{"text":"Tool groupPurposeToolsVideo ToolsGenerate short video clips via the configured local video model (LTX / WAN)generate_videoTask ManagementCreate, assign, advance, and report on taskslist_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes, verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instancesProject ArtifactsProject-scoped read-write outputs (reports, scratch files, scripts a gezel produces, and large outputs auto-saved by tools that exceed the inline cap)list_artifacts, read_artifact, write_artifact,","startTime":84,"endTime":107,"audioSegment":0},{"text":"grep_artifactShared document libraryCross-project shared library — mission docs, guidelines, and any markdown the user wants every gezel to be able to findlist_documents, read_document, write_document, delete_document, search_documentsMemorySearch indexed project knowledge through one unified
