<script type="application/json" id="squisq-doc" data-squisq-doc="1">{"articleId":"role/video-generator","duration":215,"blocks":[{"id":"the-video-generator","startTime":0,"duration":25,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":1,"children":[{"type":"text","value":"The Video Generator","position":{"start":{"line":1,"column":3,"offset":2},"end":{"line":1,"column":22,"offset":21}}}],"position":{"start":{"line":1,"column":1,"offset":0},"end":{"line":1,"column":22,"offset":21}}},"title":"The Video Generator","contents":[{"type":"paragraph","children":[{"type":"text","value":"The ","position":{"start":{"line":3,"column":1,"offset":23},"end":{"line":3,"column":5,"offset":27}}},{"type":"strong","children":[{"type":"text","value":"Video Generator","position":{"start":{"line":3,"column":7,"offset":29},"end":{"line":3,"column":22,"offset":44}}}],"position":{"start":{"line":3,"column":5,"offset":27},"end":{"line":3,"column":24,"offset":46}}},{"type":"text","value":" is the moving-picture sibling of the Image Generator: describe a shot, get a short clip. Product teasers, animated backgrounds, little social moments — generated on whatever video model your device or provider offers, delivered into the project's artifacts.","position":{"start":{"line":3,"column":24,"offset":46},"end":{"line":3,"column":282,"offset":304}}}],"position":{"start":{"line":3,"column":1,"offset":23},"end":{"line":3,"column":282,"offset":304}}},{"type":"paragraph","children":[{"type":"text","value":"Like its sibling, it's fixed-function by design: no file editing, no workspace access, just generation. Short clips take real compute — on local hardware expect renders to be measured in minutes, not seconds, and lean on the smallest length that sells the idea.","position":{"start":{"line":5,"column":1,"offset":306},"end":{"line":5,"column":262,"offset":567}}}],"position":{"start":{"line":5,"column":1,"offset":306},"end":{"line":5,"column":262,"offset":567}}}],"childr pe":"text","value":"Some video models come in compact builds that run on your graphics card, whether that's Apple Silicon, NVIDIA, AMD or Intel, in a fraction of the memory the full models need. They save clips as WebM, which Gezel plays. If ffmpeg is installed on your computer, Gezel also saves an MP4 copy, which PowerPoint, Keynote and phones play.","position":{"start":{"line":15,"column":1,"offset":1168},"end":{"line":15,"column":333,"offset":1500}}}],"position":{"start":{"line":15,"column":1,"offset":1168},"end":{"line":15,"column":333,"offset":1500}}}]},{"id":"their-character","startTime":72,"duration":6,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Their character","position":{"start":{"line":18,"column":4,"offset":1506},"end":{"line":18,"column":19,"offset":1521}}}],"position":{"start":{"line":18,"column":1,"offset":1503},"end":{"line":18,"column":19,"offset":1521}}},"title":"Their character","children":[{"id":"what-this-gezel-does","startTime":78,"duration":12,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"What this gezel does","position":{"start":{"line":20,"column":5,"offset":1527},"end":{"line":20,"column":25,"offset":1547}}}],"position":{"start":{"line":20,"column":1,"offset":1523},"end":{"line":20,"column":25,"offset":1547}}},"title":"What this gezel does","contents":[{"type":"paragraph","children":[{"type":"text","value":"This gezel is a direct line to video generation. There's no chatbot in the middle — when you @mention it with a prompt, your text goes straight to the video engine on your machine and the finished clip lands in chat.","position":{"start":{"line":22,"column":1,"offset":1549},"end":{"line":22,"column":217,"offset":1765}}}],"position":{"start":{"line":22,"column":1,"offset":1549},"end":{"line":22,"column":217,"offset":1765}}}]},{"id":"how-to-use-it","startTime":90,"duration":26,"audioS question), to a specific gezel (ask_gezel), or to a role-shaped specialist (ask_specialist) — instead of guessing","ask_user_question, ask_gezel, ask_specialist"],["Help","Consult gezel's built-in documentation for meta questions about gezel itself — roles, craftbooks, projects, memory, models, setup","how_do_i"]],"align":[null,null,null],"title":"What they can do"}},{"id":"plans-they-run-well","startTime":209,"duration":6,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Plans they run well","position":{"start":{"line":70,"column":4,"offset":4964},"end":{"line":70,"column":23,"offset":4983}}}],"position":{"start":{"line":70,"column":1,"offset":4961},"end":{"line":70,"column":23,"offset":4983}}},"title":"Plans they run well"}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Video Generator is the moving-picture sibling of the Image Generator: describe a shot,","startTime":0,"endTime":3.125,"audioSegment":0},{"text":"get a short clip.","startTime":3.125,"endTime":6.25,"audioSegment":0},{"text":"Product teasers, animated backgrounds, little social moments —","startTime":6.25,"endTime":9.375,"audioSegment":0},{"text":"generated on whatever video model your device or provider offers, delivered into the project's artifacts.","startTime":9.375,"endTime":12.5,"audioSegment":0},{"text":"Like its sibling, it's fixed-function by design: no file editing,","startTime":12.5,"endTime":15.625,"audioSegment":0},{"text":"no workspace access, just generation.","startTime":15.625,"endTime":18.75,"audioSegment":0},{"text":"Short clips take real compute — on local hardware expect renders to be measured in minutes,","startTime":18.75,"endTime":21.875,"audioSegment":0},{"text":"not seconds, and lean on the smallest length that sells the idea.","startTime":21.875,"endTime":25,"audioSegment":0},{"text":"Attach a picture to your message and the Video Generator animates it: the picture becomes the clip's first frame and sets its shape,","startTime":25,"endTime":28.75,"audioSegment":0},{"text":"and your words say how it should move (\"the waves roll in, the camera drifts closer\").","startTime":28.75,"endTime":32.5,"audioSegment":0},{"text":"Send a picture with no words and it moves gently,","startTime":32.5,"endTime":36.25,"audioSegment":0},{"text":"with a slow push in.","startTime":36.25,"endTime":40,"audioSegment":0},{"text":"Not every video model can start from a picture.","startTime":40,"endTime":43.75,"audioSegment":0},{"text":"When the model you use makes clips from words only,","startTime":43.75,"endTime":47.5,"audioSegment":0},{"text":"the Video Generator says so rather than quietly ignoring your picture.","startTime":47.5,"endTime":51.25,"audioSegment":0},{"text":"A model's description in Settings → Video generation says whether it starts from a picture.","startTime":51.25,"endTime":55,"audioSegment":0},{"text":"Some video models come in compact builds that run on your graphics card, whether that's Apple Silicon,","startTime":55,"endTime":58.4,"audioSegment":0},{"text":"NVIDIA, AMD or Intel, in a fraction of the memory the full models need.","startTime":58.4,"endTime":61.8,"audioSegment":0},{"text":"They save clips as WebM, which Gezel plays.","startTime":61.8,"endTime":65.2,"audioSegment":0},{"text":"If ffmpeg is installed on your computer, Gezel also saves an MP4 copy,","startTime":65.2,"endTime":68.6,"audioSegment":0},{"text":"which PowerPoint, Keynote and phones play.","startTime":68.6,"endTime":72,"audioSegment":0},{"text":"This gezel is a direct line to video generation.","startTime":78,"endTime":82,"audioSegment":0},{"text":"There's no chatbot in the middle — when you @mention it with a prompt,","startTime":82,"endTime":86,"audioSegment":0},{"text":"your text goes straight to the video engine on your machine and the finished clip lands in chat.","startTime":86,"endTime":90,"audioSegment":0},{"text":"Type the prompt as a plain description of the clip you want:","startTime":90,"endTime":92.88888888888889,"audioSegment":0},{"text":"@{name} a paper boat sailing down a rain gutter,","startTime":92.88888888888889,"endTime":95.77777777777777,"audioSegment":0},{"text":"golden hour, slow motion","startTime":95.77777777777777,"endTime":98.66666666666667,"audioSegment":0},{"text":"The clip is saved into your project's artifacts/generated/ folder,","startTime":98.66666666666667,"endTime":101.55555555555556,"audioSegment":0},{"text":"and a poster frame shows inline in the chat bubble.","startTime":101.55555555555556,"endTime":104.44444444444444,"audioSegment":0},{"text":"To iterate, ask again with a new prompt — it doesn't remember earlier messages,","startTime":104.44444444444444,"endTime":107.33333333333333,"audioSegment":0},{"text":"since there's no chatbot on this side.","startTime":107.33333333333333,"endTime":110.22222222222223,"audioSegment":0},{"text":"To animate a starting image,","startTime":110.22222222222223,"endTime":113.11111111111111,"audioSegment":0},{"text":"attach an image to your message (on models that support it, like Wan 2.2 TI2V-5B).","startTime":113.11111111111111,"endTime":116,"audioSegment":0},{"text":"The video model is picked in Settings → Video generation.","startTime":116,"endTime":119,"audioSegment":0},{"text":"Per-gezel defaults — width, height, frame count, frame rate, and model —","startTime":119,"endTime":122,"audioSegment":0},{"text":"are editable in the gezel's edit dialog under \"Default arguments\".","startTime":122,"endTime":125,"audioSegment":0},{"text":"Note that video generation is slow and uses the GPU exclusively,","startTime":125,"endTime":128,"audioSegment":0},{"text":"pausing the chat model while it runs.","startTime":128,"endTime":131,"audioSegment":0},{"text":"Tool group Purpose Tools","startTime":131,"endTime":134.85714285714286,"audioSegment":0},{"text":"Video Tools Generate short video clips via the configured local video model (LTX / WAN) generate_video","startTime":134.85714285714286,"endTime":138.71428571428572,"audioSegment":0},{"text":"Task Management Create, assign, advance, and report on tasks list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes,","startTime":138.71428571428572,"endTime":142.57142857142858,"audioSegment":0},{"text":"verify_outcome, add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":142.57142857142858,"endTime":146.42857142857142,"audioSegment":0},{"text":"Project Artifacts Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":146.42857142857142,"endTime":150.28571428571428,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap) list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":150.28571428571428,"endTime":154.14285714285714,"audioSegment":0},{"text":"Shared document library Cross-project shared library — mission docs, guidelines,","startTime":154.14285714285714,"endTime":158,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find list_documents, read_document, write_document, delete_document, search_documents","startTime":158,"endTime":161.85714285714286,"audioSegment":0},{"text":"Memory Search indexed project knowledge through one unified surface,","startTime":161.85714285714286,"endTime":165.71428571428572,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":165.71428571428572,"endTime":169.57142857142856,"audioSegment":0},{"text":"User Interaction Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":169.57142857142856,"endTime":173.42857142857144,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing ask_user_question, ask_gezel, ask_specialist","startTime":173.42857142857144,"endTime":177.28571428571428,"audioSegment":0},{"text":"Help Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":177.28571428571428,"endTime":181.14285714285714,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup how_do_i","startTime":181.14285714285714,"endTime":185,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":185,"endTime":187,"audioSegment":0},{"text":"tiny under 5B full kit (41 tools)","startTime":187,"endTime":189,"audioSegment":0},{"text":"small 5–12B full kit (41 tools)","startTime":189,"endTime":191,"audioSegment":0},{"text":"medium 12–45B full kit (41 tools)","startTime":191,"endTime":193,"audioSegment":0},{"text":"large 45B and up full kit (41 tools)","startTime":193,"endTime":195,"audioSegment":0},{"text":"cloud hosted full kit (41 tools)","startTime":195,"endTime":197,"audioSegment":0},{"text":"Tier Model size Tool surface for this role","startTime":197,"endTime":199,"audioSegment":0},{"text":"tiny under 5B full kit (41 tools)","startTime":199,"endTime":201,"audioSegment":0},{"text":"small 5–12B full kit (41 tools)","startTime":201,"endTime":203,"audioSegment":0},{"text":"medium 12–45B full kit (41 tools)","startTime":203,"endTime":205,"audioSegment":0},{"text":"large 45B and up full kit (41 tools)","startTime":205,"endTime":207,"audioSegment":0},{"text":"cloud hosted full kit (41 tools)","startTime":207,"endTime":209,"audioSegment":0}],"version":1},"startBlock":{"title":"The Video Generator","subtitle":"The Video Generator is the moving-picture sibling of the Image Generator: describe a shot, get a short clip. Product teasers, animated backgrounds, little social moments — generated on whatever video model your device or provider offers, delivered into the project's artifacts.","ambientMotion":"
