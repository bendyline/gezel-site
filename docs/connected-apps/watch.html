ram on this computer can use your models without asking first. Gezel keeps this off unless you turn it on, only ever answers your own machine, and refuses to take the port if the real Ollama is already running.","position":{"start":{"line":138,"column":1,"offset":17512},"end":{"line":138,"column":329,"offset":17840}}}],"position":{"start":{"line":138,"column":1,"offset":17512},"end":{"line":138,"column":329,"offset":17840}}}]},{"id":"keeping-an-eye-on-things","startTime":852,"duration":19,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Keeping an eye on things","position":{"start":{"line":140,"column":4,"offset":17845},"end":{"line":140,"column":28,"offset":17869}}}],"position":{"start":{"line":140,"column":1,"offset":17842},"end":{"line":140,"column":28,"offset":17869}}},"title":"Keeping an eye on things","contents":[{"type":"paragraph","children":[{"type":"text","value":"Every chat an app completes through these endpoints is recorded in the ","position":{"start":{"line":142,"column":1,"offset":17871},"end":{"line":142,"column":72,"offset":17942}}},{"type":"strong","children":[{"type":"text","value":"History","position":{"start":{"line":142,"column":74,"offset":17944},"end":{"line":142,"column":81,"offset":17951}}}],"position":{"start":{"line":142,"column":72,"offset":17942},"end":{"line":142,"column":83,"offset":17953}}},{"type":"text","value":" tab (look for \"App chat\" entries), and the tokens they consume count in the ","position":{"start":{"line":142,"column":83,"offset":17953},"end":{"line":142,"column":160,"offset":18030}}},{"type":"strong","children":[{"type":"text","value":"Usage","position":{"start":{"line":142,"column":162,"offset":18032},"end":{"line":142,"column":167,"offset":18037}}}],"position":{"start":{"line":142,"column":160,"offset":18030},"end":{"line":142,"column":169,"offset":18039}}},{"type":"text","value":" view — so you can always see who has been using your models, and how much.","position":{"start":{"line":142,"column":169,"offset":18039},"end":{"line":142,"column":244,"offset":18114}}}],"position":{"start":{"line":142,"column":1,"offset":17871},"end":{"line":142,"column":244,"offset":18114}}},{"type":"paragraph","children":[{"type":"text","value":"If you are developing one of these applications, continue with the technical guide ","position":{"start":{"line":144,"column":1,"offset":18116},"end":{"line":144,"column":84,"offset":18199}}},{"type":"link","url":"../building-connected-apps-with-gezel-app-sdk/","children":[{"type":"text","value":"Building connected apps with gezel-app-sdk","position":{"start":{"line":144,"column":85,"offset":18200},"end":{"line":144,"column":127,"offset":18242}}}],"position":{"start":{"line":144,"column":84,"offset":18199},"end":{"line":144,"column":176,"offset":18291}}},{"type":"text","value":".","position":{"start":{"line":144,"column":176,"offset":18291},"end":{"line":144,"column":177,"offset":18292}}}],"position":{"start":{"line":144,"column":1,"offset":18116},"end":{"line":144,"column":177,"offset":18292}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel isn't only a place you visit —","startTime":0,"endTime":4,"audioSegment":0},{"text":"it can also serve your models and gezellen to other programs on your computer.","startTime":4,"endTime":8,"audioSegment":0},{"text":"A code editor, a writing tool, or a browser extension that knows how to talk to an AI service can talk to gezel instead,","startTime":8,"endTime":12,"audioSegment":0},{"text":"and get your local models with all of gezel's know-how applied.","startTime":12,"endTime":16,"audioSegment":0},{"text":"Everything described here lives in Settings → Connected Apps.","startTime":16,"endTime":20,"audioSegment":0},{"text":"Apps speak to gezel using the same \"OpenAI-style\" language most AI tools already know.","startTime":20,"endTime":23.4,"audioSegment":0},{"text":"Two things make it work: An address.","startTime":23.4,"endTime":26.8,"audioSegment":0},{"text":"The address panel in Settings → Connected Apps shows where gezel is listening on your machine.","startTime":26.8,"endTime":30.2,"audioSegment":0},{"text":"On most personal installs that is https://127.0.0.1:6228/v1; when the Gezel machine service is installed,","startTime":30.2,"endTime":33.6,"audioSegment":0},{"text":"the app API moves to a per-launch port (shown in the panel) because the machine service holds 6228.","startTime":33.6,"endTime":37,"audioSegment":0},{"text":"For apps that need an address that never changes,","startTime":37,"endTime":40.4,"audioSegment":0},{"text":"turn on Ollama emulation — it always answers at http://127.0.0.1:11434. Permission.","startTime":40.4,"endTime":43.8,"audioSegment":0},{"text":"The first time an app asks for access,","startTime":43.8,"endTime":47.2,"audioSegment":0},{"text":"gezel shows you an approval request — who is asking, and for what.","startTime":47.2,"endTime":50.599999999999994,"audioSegment":0},{"text":"Nothing gets through until you approve,","startTime":50.599999999999994,"endTime":54,"audioSegment":0},{"text":"and you can revoke any app later from the same panel.","startTime":54,"endTime":57.4,"audioSegment":0},{"text":"Gezel's own add-ins for Word, Excel, PowerPoint, LibreOffice,","startTime":57.4,"endTime":60.8,"audioSegment":0},{"text":"and VS Code are the exception: they can prove they run as you on this computer, so they connect without asking.","startTime":60.8,"endTime":64.19999999999999,"audioSegment":0},{"text":"Revoking one of them only resets it;","startTime":64.19999999999999,"endTime":67.6,"audioSegment":0},{"text":"to disconnect it for good, remove the add-in.","startTime":67.6,"endTime":71,"audioSegment":0},{"text":"The authenticated address also serves the OpenAI Responses API at /v1/responses.","startTime":71,"endTime":74.85106382978724,"audioSegment":0},{"text":"That lets a harness such as Codex keep ownership of its coding tools, sandbox, approvals,","startTime":74.85106382978724,"endTime":78.70212765957447,"audioSegment":0},{"text":"and conversation loop while a model installed in gezel supplies the inference.","startTime":78.70212765957447,"endTime":82.5531914893617,"audioSegment":0},{"text":"VS Code, OpenCode, and pi connect the same way through the chat endpoint —","startTime":82.5531914893617,"endTime":86.40425531914893,"audioSegment":0},{"text":"see VS Code, OpenCode, and pi below.","startTime":86.40425531914893,"endTime":90.25531914893617,"audioSegment":0},{"text":"Word, Excel, PowerPoint, and LibreOffice connect differently: they open real conversations in a project rather than borrowing a model —","startTime":90.25531914893617,"endTime":94.1063829787234,"audioSegment":0},{"text":"see Word, Excel, and PowerPoint and LibreOffice.","startTime":94.1063829787234,"endTime":97.95744680851064,"audioSegment":0},{"text":"For Codex, use Use Gezel in Codex in this Settings screen.","startTime":97.95744680851064,"endTime":101.80851063829788,"audioSegment":0},{"text":"Gezel creates an isolated gezel-local Codex profile,","startTime":101.80851063829788,"endTime":105.65957446808511,"audioSegment":0},{"text":"a model catalog, and a dedicated revocable credential.","startTime":105.65957446808511,"endTime":109.51063829787233,"audioSegment":0},{"text":"It does not edit Codex's main configuration, authentication,","startTime":109.51063829787233,"endTime":113.36170212765958,"audioSegment":0},{"text":"conversations, sandbox rules, or approval settings.","startTime":113.36170212765958,"endTime":117.2127659574468,"audioSegment":0},{"text":"Start Codex with the command shown on the card (codex --profile gezel-local).","startTime":117.2127659574468,"endTime":121.06382978723404,"audioSegment":0},{"text":"If the card says Needs attention,","startTime":121.06382978723404,"endTime":124.91489361702128,"audioSegment":0},{"text":"the gezel-local profile on disk was hand-edited or was written by a different Gezel installation, so gezel will not touch it.","startTime":124.91489361702128,"endTime":128.7659574468085,"audioSegment":0},{"text":"Repair Codex setup writes a fresh profile pointed at this copy of gezel and keeps the old file beside it as gezel-local.config.toml.backup.","startTime":128.7659574468085,"endTime":132.61702127659575,"audioSegment":0},{"text":"The one conflict repair cannot resolve is another connected app holding the Codex credential identity —","startTime":132.61702127659575,"endTime":136.46808510638297,"audioSegment":0},{"text":"revoke that app first.","startTime":136.46808510638297,"endTime":140.31914893617022,"audioSegment":0},{"text":"Keep Gezel running while Codex uses the local model.","startTime":140.31914893617022,"endTime":144.17021276595744,"audioSegment":0},{"text":"If you want the model bridge available without keeping the desktop window open,","startTime":144.17021276595744,"endTime":148.02127659574467,"audioSegment":0},{"text":"turn on Gezel's daemon autostart setting.","startTime":148.02127659574467,"endTime":151.87234042553192,"audioSegment":0},{"text":"The managed profile talks to a narrow, authenticated loopback bridge.","startTime":151.87234042553192,"endTime":155.72340425531917,"audioSegment":0},{"text":"Operationally it provides the stable address that an Ollama-style integration needs, but it keeps bearer authentication: only the Responses and model-discovery routes are present,","startTime":155.72340425531917,"endTime":159.5744680851064,"audioSegment":0},{"text":"and the credential grants no access to Gezel projects, files, terminals, or settings.","startTime":159.5744680851064,"endTime":163.4255319148936,"audioSegment":0},{"text":"The token is read by Codex through a command-backed provider credential rather than copied into a project or shell profile.","startTime":163.4255319148936,"endTime":167.27659574468083,"audioSegment":0},{"text":"Revoking the Codex entry under Connected Apps immediately stops it from using the bridge.","startTime":167.27659574468083,"endTime":171.12765957446808,"audioSegment":0},{"text":"One-click setup is available only when the desktop and the Gezel service are on the same computer.","startTime":171.12765957446808,"endTime":174.97872340425533,"audioSegment":0},{"text":"In remote-service mode the card stays read-only,","startTime":174.97872340425533,"endTime":178.82978723404256,"audioSegment":0},{"text":"because writing a profile on the service host would not configure Codex on the computer in front of you.","startTime":178.82978723404256,"endTime":182.68085106382978,"audioSegment":0},{"text":"Codex custom providers use wire_api = \"responses\".","startTime":182.68085106382978,"endTime":186.531914893617,"audioSegment":0},{"text":"The managed profile also sets the top-level web_search = \"disabled\": Codex otherwise advertises a provider-hosted search tool that a local inference server cannot truthfully execute.","startTime":186.531914893617,"endTime":190.38297872340425,"audioSegment":0},{"text":"Do not combine the Gezel profile with Codex's --search flag,","startTime":190.38297872340425,"endTime":194.2340425531915,"audioSegment":0},{"text":"which explicitly turns that hosted tool back on.","startTime":194.2340425531915,"endTime":198.08510638297872,"audioSegment":0},{"text":"Ordinary Codex tools such as shell commands, patching,","startTime":198.08510638297872,"endTime":201.93617021276594,"audioSegment":0},{"text":"and helper-agent namespaces remain available because Codex executes those itself.","startTime":201.93617021276594,"endTime":205.7872340425532,"audioSegment":0},{"text":"The setup card puts eligible gezels first.","startTime":205.7872340425532,"endTime":209.63829787234042,"audioSegment":0},{"text":"Choosing one gives Codex that gezel's character (about.md), effective local model,","startTime":209.63829787234042,"endTime":213.48936170212767,"audioSegment":0},{"text":"and tuning while Codex keeps its own tools, sandbox, approvals, and conversation loop.","startTime":213.48936170212767,"endTime":217.3404255319149,"audioSegment":0},{"text":"The profile stores the stable gezel id,","startTime":217.3404255319149,"endTime":221.1914893617021,"audioSegment":0},{"text":"so renaming the gezel does not break the connection.","startTime":221.1914893617021,"endTime":225.04255319148936,"audioSegment":0},{"text":"Raw installed models remain available in a separate fallback group for users who want inference without a gezel persona.","startTime":225.04255319148936,"endTime":228.89361702127658,"audioSegment":0},{"text":"The gezel you choose on the card is the profile's default, not its only option: gezel writes a model catalog listing every eligible gezel and local model,","startTime":228.89361702127658,"endTime":232.74468085106383,"audioSegment":0},{"text":"so Codex's own model picker shows the whole crew and you can switch between them inside a Codex session.","startTime":232.74468085106383,"endTime":236.59574468085106,"audioSegment":0},{"text":"A gezel appears here only when its effective local model is installed and can participate in Codex's caller-executed tool loop.","startTime":236.59574468085106,"endTime":240.4468085106383,"audioSegment":0},{"text":"The facade does not attach Gezel chat sessions, memories, project context, or MCP tools,","startTime":240.4468085106383,"endTime":244.29787234042553,"audioSegment":0},{"text":"and it does not silently route unknown aliases through the fallback gezel.","startTime":244.29787234042553,"endTime":248.14893617021275,"audioSegment":0},{"text":"It also refuses codex-cli: / anthropic-cli: targets because those are full nested agent harnesses rather than inference providers.","startTime":248.14893617021275,"endTime":252,"audioSegment":0},{"text":"Use Gezel in VS Code uses VS Code's built-in custom-endpoint support,","startTime":252,"endTime":255.25806451612902,"audioSegment":0},{"text":"so it does not install or require the Gezel VSIX.","startTime":255.25806451612902,"endTime":258.51612903225805,"audioSegment":0},{"text":"Gezel adds one provider named Gezel to the selected VS Code profile's chatLanguageModels.json.","startTime":258.51612903225805,"endTime":261.7741935483871,"audioSegment":0},{"text":"Every eligible gezel and raw local model then appears in VS Code's native model picker while VS Code keeps control of its agent tools,","startTime":261.7741935483871,"endTime":265.03225806451616,"audioSegment":0},{"text":"permissions, and conversations.","startTime":265.03225806451616,"endTime":268.2903225806452,"audioSegment":0},{"text":"This is a shared profile file, so setup uses a narrow merge: entries belonging to other providers are preserved,","startTime":268.2903225806452,"endTime":271.5483870967742,"audioSegment":0},{"text":"and Remove setup removes only Gezel's entry.","startTime":271.5483870967742,"endTime":274.80645161290323,"audioSegment":0},{"text":"Named VS Code profiles have separate files;","startTime":274.80645161290323,"endTime":278.06451612903226,"audioSegment":0},{"text":"choose the profile you want before setup.","startTime":278.06451612903226,"endTime":281.3225806451613,"audioSegment":0},{"text":"To move the integration later,","startTime":281.3225806451613,"endTime":284.5806451612903,"audioSegment":0},{"text":"clear it and set up the other profile.","startTime":284.5806451612903,"endTime":287.8387096774194,"audioSegment":0},{"text":"There is one important tradeoff.","startTime":287.8387096774194,"endTime":291.0967741935484,"audioSegment":0},{"text":"Without an extension,","startTime":291.0967741935484,"endTime":294.35483870967744,"audioSegment":0},{"text":"VS Code cannot give Gezel access to its encrypted extension secret store.","startTime":294.35483870967744,"endTime":297.61290322580646,"audioSegment":0},{"text":"The dedicated VS Code credential is therefore written as plain text in chatLanguageModels.json.","startTime":297.61290322580646,"endTime":300.8709677419355,"audioSegment":0},{"text":"Gezel limits the effect of that exposure: the credential has inference-only scope, talks to a VS Code-only listener on 127.0.0.1,","startTime":300.8709677419355,"endTime":304.1290322580645,"audioSegment":0},{"text":"reaches only chat completions and model discovery, and is individually revocable.","startTime":304.1290322580645,"endTime":307.38709677419354,"audioSegment":0},{"text":"It cannot read Gezel projects, files, terminals, chats, or settings.","startTime":307.38709677419354,"endTime":310.64516129032256,"audioSegment":0},{"text":"The profile file is written with private file permissions where the operating system supports them.","startTime":310.64516129032256,"endTime":313.9032258064516,"audioSegment":0},{"text":"The listener's port stays stable even though the ordinary Gezel daemon port can rotate.","startTime":313.9032258064516,"endTime":317.16129032258067,"audioSegment":0},{"text":"Keep Gezel running while VS Code uses the models;","startTime":317.16129032258067,"endTime":320.4193548387097,"audioSegment":0},{"text":"daemon autostart makes that available without keeping the desktop window open.","startTime":320.4193548387097,"endTime":323.6774193548387,"audioSegment":0},{"text":"Gezel periodically reconciles the provider entry, so installing or removing a model, changing a gezel,","startTime":323.6774193548387,"endTime":326.93548387096774,"audioSegment":0},{"text":"or changing an effective context limit updates VS Code's model picker automatically.","startTime":326.93548387096774,"endTime":330.19354838709677,"audioSegment":0},{"text":"If the card says Needs attention,","startTime":330.19354838709677,"endTime":333.4516129032258,"audioSegment":0},{"text":"Gezel could not prove it owns the existing provider entry or could not safely parse the shared file.","startTime":333.4516129032258,"endTime":336.7096774193549,"audioSegment":0},{"text":"Repair VS Code setup first saves the complete existing file beside it as chatLanguageModels.json.backup,","startTime":336.7096774193549,"endTime":339.9677419354839,"audioSegment":0},{"text":"then replaces the conflicting Gezel entry.","startTime":339.9677419354839,"endTime":343.2258064516129,"audioSegment":0},{"text":"Other parseable provider entries remain in place.","startTime":343.2258064516129,"endTime":346.48387096774195,"audioSegment":0},{"text":"If the entire file is damaged,","startTime":346.48387096774195,"endTime":349.741935483871,"audioSegment":0},{"text":"the backup is the recoverable original and the repaired file contains only the working Gezel provider.","startTime":349.741935483871,"endTime":353,"audioSegment":0},{"text":"OpenCode connects the same way,","startTime":353,"endTime":356.46666666666664,"audioSegment":0},{"text":"through Use Gezel in OpenCode in this Settings screen.","startTime":356.46666666666664,"endTime":359.93333333333334,"audioSegment":0},{"text":"Gezel writes its own settings file, a model list covering your eligible crew,","startTime":359.93333333333334,"endTime":363.4,"audioSegment":0},{"text":"and a dedicated revocable credential.","startTime":363.4,"endTime":366.8666666666667,"audioSegment":0},{"text":"It never edits your own OpenCode configuration, sessions, or permissions —","startTime":366.8666666666667,"endTime":370.3333333333333,"audioSegment":0},{"text":"instead it hands you a command that points OpenCode at the Gezel-owned file for that run:","startTime":370.3333333333333,"endTime":373.8,"audioSegment":0},{"text":"OPENCODE_CONFIG=<path shown on the card> opencode","startTime":373.8,"endTime":377.26666666666665,"audioSegment":0},{"text":"On Windows the card shows the PowerShell form of the same command.","startTime":377.26666666666665,"endTime":380.73333333333335,"audioSegment":0},{"text":"OpenCode merges configuration files rather than replacing them,","startTime":380.73333333333335,"endTime":384.2,"audioSegment":0},{"text":"so your own settings still apply; Gezel only adds a provider named gezel.","startTime":384.2,"endTime":387.6666666666667,"audioSegment":0},{"text":"The gezel you choose is the one OpenCode starts with.","startTime":387.6666666666667,"endTime":391.1333333333333,"audioSegment":0},{"text":"Every eligible gezel and local model is listed in the file,","startTime":391.1333333333333,"endTime":394.6,"audioSegment":0},{"text":"so OpenCode's own model picker shows the whole crew and you can switch inside a session.","startTime":394.6,"endTime":398.06666666666666,"audioSegment":0},{"text":"Gezel also pins OpenCode's small model — the one it uses for titles and summaries — to the same choice,","startTime":398.06666666666666,"endTime":401.5333333333333,"audioSegment":0},{"text":"so a machine set up for local inference never quietly reaches for a cloud provider you have not configured.","startTime":401.5333333333333,"endTime":405,"audioSegment":0},{"text":"Add to OpenCode writes one further file — gezel.js, in OpenCode's own plugins folder —","startTime":405,"endTime":409.14814814814815,"audioSegment":0},{"text":"and from then on the gezel provider is in every OpenCode session on that computer, no command needed.","startTime":409.14814814814815,"endTime":413.2962962962963,"audioSegment":0},{"text":"This is the one file Gezel places outside its own home,","startTime":413.2962962962963,"endTime":417.44444444444446,"audioSegment":0},{"text":"so it is worth being precise about what it is: a file Gezel adds and owns, never an edit to a file of yours.","startTime":417.44444444444446,"endTime":421.5925925925926,"audioSegment":0},{"text":"It holds no password.","startTime":421.5925925925926,"endTime":425.74074074074076,"audioSegment":0},{"text":"It reads Gezel's settings and credential when OpenCode starts, and does nothing at all when Gezel is not running or not set up —","startTime":425.74074074074076,"endTime":429.8888888888889,"audioSegment":0},{"text":"an unrelated OpenCode session is never affected either way.","startTime":429.8888888888889,"endTime":434.037037037037,"audioSegment":0},{"text":"opencode --pure starts without it, and without any other plugin.","startTime":434.037037037037,"endTime":438.18518518518516,"audioSegment":0},{"text":"It deliberately does not change which model OpenCode starts with: that stays your choice in OpenCode's own model picker,","startTime":438.18518518518516,"endTime":442.3333333333333,"audioSegment":0},{"text":"because this file loads in every project.","startTime":442.3333333333333,"endTime":446.48148148148147,"audioSegment":0},{"text":"To check it took effect, run opencode models —","startTime":446.48148148148147,"endTime":450.6296296296296,"audioSegment":0},{"text":"the crew appears under gezel/.","startTime":450.6296296296296,"endTime":454.77777777777777,"audioSegment":0},{"text":"Remove from OpenCode deletes it,","startTime":454.77777777777777,"endTime":458.9259259259259,"audioSegment":0},{"text":"and removing the whole setup deletes it too.","startTime":458.9259259259259,"endTime":463.0740740740741,"audioSegment":0},{"text":"If a gezel.js written by a different Gezel installation — or edited by hand — is already there,","startTime":463.0740740740741,"endTime":467.22222222222223,"audioSegment":0},{"text":"Gezel says so and leaves it exactly as it is; Replace OpenCode plugin keeps the old one beside it as gezel.js.backup.","startTime":467.22222222222223,"endTime":471.3703703703704,"audioSegment":0},{"text":"If the card says Needs attention,","startTime":471.3703703703704,"endTime":475.51851851851853,"audioSegment":0},{"text":"the managed file was hand-edited or was written by a different Gezel installation, so gezel will not touch it.","startTime":475.51851851851853,"endTime":479.66666666666663,"audioSegment":0},{"text":"Repair OpenCode setup writes a fresh file and keeps the old one beside it as opencode.json.backup.","startTime":479.66666666666663,"endTime":483.8148148148148,"audioSegment":0},{"text":"The one conflict repair cannot resolve is another connected app holding the OpenCode credential identity —","startTime":483.8148148148148,"endTime":487.96296296296293,"audioSegment":0},{"text":"revoke that app first.","startTime":487.96296296296293,"endTime":492.1111111111111,"audioSegment":0},{"text":"Because the credential lives in its own file and the config references it by path,","startTime":492.1111111111111,"endTime":496.25925925925924,"audioSegment":0},{"text":"revoking the OpenCode entry under Connected Apps immediately stops it from using the bridge, and no secret is ever copied into a project or shell profile.","startTime":496.25925925925924,"endTime":500.4074074074074,"audioSegment":0},{"text":"As with Codex, a gezel appears here only when its effective local model is installed and can take part in a caller-executed tool loop,","startTime":500.4074074074074,"endTime":504.55555555555554,"audioSegment":0},{"text":"one-click setup needs the desktop and the Gezel service on the same computer, and Gezel must stay running while OpenCode uses the model.","startTime":504.55555555555554,"endTime":508.7037037037037,"audioSegment":0},{"text":"The bridge carries only inference: the credential grants no access to Gezel projects,","startTime":508.7037037037037,"endTime":512.8518518518518,"audioSegment":0},{"text":"files, terminals, or settings.","startTime":512.8518518518518,"endTime":517,"audioSegment":0},{"text":"pi is a coding agent that keeps its own tools, permissions,","startTime":517,"endTime":520.2222222222222,"audioSegment":0},{"text":"and conversation loop, and lets a provider supply the model.","startTime":520.2222222222222,"endTime":523.4444444444445,"audioSegment":0},{"text":"Gezel writes a small extension of its own — plus the model list that extension reads —","startTime":523.4444444444445,"endTime":526.6666666666666,"audioSegment":0},{"text":"and hands you a command that loads it for that run:","startTime":526.6666666666666,"endTime":529.8888888888889,"audioSegment":0},{"text":"pi -e <path shown on the card>","startTime":529.8888888888889,"endTime":533.1111111111111,"audioSegment":0},{"text":"Both files live in Gezel's own folder,","startTime":533.1111111111111,"endTime":536.3333333333334,"audioSegment":0},{"text":"so this mode writes nothing into pi at all.","startTime":536.3333333333334,"endTime":539.5555555555555,"audioSegment":0},{"text":"pi merges what an extension registers with your own configuration;","startTime":539.5555555555555,"endTime":542.7777777777778,"audioSegment":0},{"text":"Gezel only adds a provider named gezel, and never touches your models.json, settings, or sessions.","startTime":542.7777777777778,"endTime":546,"audioSegment":0},{"text":"Add to pi copies that same extension into pi's own extensions folder,","startTime":546,"endTime":549.8,"audioSegment":0},{"text":"and from then on the gezel provider is in every pi session on that computer.","startTime":549.8,"endTime":553.6,"audioSegment":0},{"text":"It is a file Gezel adds and owns,","startTime":553.6,"endTime":557.4,"audioSegment":0},{"text":"never an edit to a file of yours.","startTime":557.4,"endTime":561.2,"audioSegment":0},{"text":"It holds no password: it reads Gezel's model list and credential when pi starts,","startTime":561.2,"endTime":565,"audioSegment":0},{"text":"and quietly does nothing when Gezel is not running.","startTime":565,"endTime":568.8,"audioSegment":0},{"text":"pi -ne starts without it, and without any other extension.","startTime":568.8,"endTime":572.6,"audioSegment":0},{"text":"To check it took effect, run pi --list-models —","startTime":572.6,"endTime":576.4,"audioSegment":0},{"text":"the crew appears under gezel/.","startTime":576.4,"endTime":580.2,"audioSegment":0},{"text":"Remove from pi deletes it,","startTime":580.2,"endTime":584,"audioSegment":0},{"text":"and removing the whole setup deletes it too.","startTime":584,"endTime":587.8,"audioSegment":0},{"text":"If a gezel.js written by a different Gezel installation — or edited by hand — is already there,","startTime":587.8,"endTime":591.6,"audioSegment":0},{"text":"Gezel says so and leaves it alone; Replace pi extension keeps the old one beside it as gezel.js.backup.","startTime":591.6,"endTime":595.4,"audioSegment":0},{"text":"Unlike the Codex profile, nothing here pins pi's own default model.","startTime":595.4,"endTime":599.2,"audioSegment":0},{"text":"The extension loads in every project,","startTime":599.2,"endTime":603,"audioSegment":0},{"text":"so which model pi starts with stays your choice in its model picker.","startTime":603,"endTime":606.8,"audioSegment":0},{"text":"If you point pi somewhere else with PI_CODING_AGENT_DIR in your shell,","startTime":606.8,"endTime":610.6,"audioSegment":0},{"text":"note that the gezel service cannot see a variable set only in your login shell — the card shows the folder it actually resolved.","startTime":610.6,"endTime":614.4,"audioSegment":0},{"text":"As with the others, a gezel appears here only when its effective local model is installed and can take part in a caller-executed tool loop,","startTime":614.4,"endTime":618.2,"audioSegment":0},{"text":"one-click setup needs the desktop and the Gezel service on the same computer, and Gezel must stay running while pi uses the model.","startTime":618.2,"endTime":622,"audioSegment":0},{"text":"Use Gezel in Word, Excel,","startTime":622,"endTime":625.7142857142857,"audioSegment":0},{"text":"and PowerPoint adds a Gezel button to the Home tab of the desktop Office apps on Windows and macOS.","startTime":625.7142857142857,"endTime":629.4285714285714,"audioSegment":0},{"text":"It opens a pane beside your document where you chat with your gezels about it.","startTime":629.4285714285714,"endTime":633.1428571428571,"audioSegment":0},{"text":"While the pane is open, the gezels in that project can read the document and, when you allow it,","startTime":633.1428571428571,"endTime":636.8571428571429,"audioSegment":0},{"text":"edit it: insert and replace text in Word, read and write cells in Excel, and add slides in PowerPoint.","startTime":636.8571428571429,"endTime":640.5714285714286,"audioSegment":0},{"text":"No store is involved.","startTime":640.5714285714286,"endTime":644.2857142857143,"audioSegment":0},{"text":"Gezel serves the pane itself, from this computer,","startTime":644.2857142857143,"endTime":648,"audioSegment":0},{"text":"and registers it with each Office app for your account only.","startTime":648,"endTime":651.7142857142857,"audioSegment":0},{"text":"Office only opens add-ins over a secure connection that your computer trusts.","startTime":651.7142857142857,"endTime":655.4285714285714,"audioSegment":0},{"text":"So during setup Gezel creates its own security certificate for this computer and asks your system to trust it.","startTime":655.4285714285714,"endTime":659.1428571428571,"audioSegment":0},{"text":"That certificate:","startTime":659.1428571428571,"endTime":662.8571428571429,"audioSegment":0},{"text":"works only for this computer's own address (localhost),","startTime":662.8571428571429,"endTime":666.5714285714286,"audioSegment":0},{"text":"so it cannot vouch for any website;","startTime":666.5714285714286,"endTime":670.2857142857143,"audioSegment":0},{"text":"is trusted for your account only, not every account on the machine;","startTime":670.2857142857143,"endTime":674,"audioSegment":0},{"text":"is removed when you remove the setup.","startTime":674,"endTime":677.7142857142857,"audioSegment":0},{"text":"Your system asks you to confirm once.","startTime":677.7142857142857,"endTime":681.4285714285714,"audioSegment":0},{"text":"On a Mac that means your password, and macOS may also ask whether Gezel may access data from other apps;","startTime":681.4285714285714,"endTime":685.1428571428571,"audioSegment":0},{"text":"allow it so Gezel can add itself to Office. After setup,","startTime":685.1428571428571,"endTime":688.8571428571429,"audioSegment":0},{"text":"restart any Office app that was open and choose Gezel on the Home tab.","startTime":688.8571428571429,"endTime":692.5714285714286,"audioSegment":0},{"text":"On a Mac, the first time,","startTime":692.5714285714286,"endTime":696.2857142857143,"audioSegment":0},{"text":"choose Add-ins on the Home tab and then Gezel: Office shows the button only after an add-in has been opened once from that menu.","startTime":696.2857142857143,"endTime":700,"audioSegment":0},{"text":"The pane connects to Gezel on its own, with no connection code to type,","startTime":700,"endTime":703.7142857142858,"audioSegment":0},{"text":"because Gezel set it up for your account.","startTime":703.7142857142858,"endTime":707.4285714285714,"audioSegment":0},{"text":"The pane works in the project that owns the document's folder.","startTime":707.4285714285714,"endTime":711.1428571428571,"audioSegment":0},{"text":"If there isn't one yet, Gezel creates one for that folder.","startTime":711.1428571428571,"endTime":714.8571428571429,"audioSegment":0},{"text":"It picks the folder sensibly: your Documents folder for a loose document there,","startTime":714.8571428571429,"endTime":718.5714285714286,"audioSegment":0},{"text":"a folder like engineeringdocs when the document sits in one of several work folders inside it, or the Default project for a document saved directly in your home folder.","startTime":718.5714285714286,"endTime":722.2857142857143,"audioSegment":0},{"text":"Projects created this way are read-only: gezels cannot change files in the folder,","startTime":722.2857142857143,"endTime":726,"audioSegment":0},{"text":"only the document you have open, through the pane.","startTime":726,"endTime":729.7142857142858,"audioSegment":0},{"text":"You can allow file changes later in the project's settings.","startTime":729.7142857142858,"endTime":733.4285714285714,"audioSegment":0},{"text":"The Allow edits switch in the pane controls whether gezels may change the open document at all.","startTime":733.4285714285714,"endTime":737.1428571428571,"audioSegment":0},{"text":"Turn it off and they can still read it.","startTime":737.1428571428571,"endTime":740.8571428571429,"audioSegment":0},{"text":"If the Gezel button does not appear, check that optional connected experiences are turned on in Office's privacy settings,","startTime":740.8571428571429,"endTime":744.5714285714286,"audioSegment":0},{"text":"then use Clear Office cache on the card with Office closed.","startTime":744.5714285714286,"endTime":748.2857142857143,"audioSegment":0},{"text":"Office on the web and Outlook are not supported.","startTime":748.2857142857143,"endTime":752,"audioSegment":0},{"text":"Use Gezel in LibreOffice installs Gezel's extension into LibreOffice Writer,","startTime":752,"endTime":754.6923076923077,"audioSegment":0},{"text":"Calc, and Impress for your account, using LibreOffice's own installer.","startTime":754.6923076923077,"endTime":757.3846153846154,"audioSegment":0},{"text":"Close LibreOffice before installing.","startTime":757.3846153846154,"endTime":760.0769230769231,"audioSegment":0},{"text":"Afterwards choose Tools > Gezel,","startTime":760.0769230769231,"endTime":762.7692307692307,"audioSegment":0},{"text":"or open the Gezel panel in the sidebar.","startTime":762.7692307692307,"endTime":765.4615384615385,"audioSegment":0},{"text":"The panel connects to Gezel on its own,","startTime":765.4615384615385,"endTime":768.1538461538462,"audioSegment":0},{"text":"with no connection code to type.","startTime":768.1538461538462,"endTime":770.8461538461538,"audioSegment":0},{"text":"It then works like the Office pane: it finds the project for the document's folder,","startTime":770.8461538461538,"endTime":773.5384615384615,"audioSegment":0},{"text":"lets you pick which gezel to talk to, and offers the same document tools, with an Allow edits switch.","startTime":773.5384615384615,"endTime":776.2307692307693,"audioSegment":0},{"text":"LibreOffice needs no certificate setup,","startTime":776.2307692307693,"endTime":778.9230769230769,"audioSegment":0},{"text":"because the extension runs inside LibreOffice and connects to Gezel directly.","startTime":778.9230769230769,"endTime":781.6153846153846,"audioSegment":0},{"text":"On Linux, some distributions ship LibreOffice's Python support separately;","startTime":781.6153846153846,"endTime":784.3076923076923,"audioSegment":0},{"text":"install it if the panel does not appear.","startTime":784.3076923076923,"endTime":787,"audioSegment":0},{"text":"Gezel presents your crew to connected apps as model choices,","startTime":787,"endTime":789.875,"audioSegment":0},{"text":"including each gezel's name and role.","startTime":789.875,"endTime":792.75,"audioSegment":0},{"text":"When an app chooses one,","startTime":792.75,"endTime":795.625,"audioSegment":0},{"text":"that gezel answers with their character, model, and settings.","startTime":795.625,"endTime":798.5,"audioSegment":0},{"text":"Some apps cannot choose from that list and ask for a hardcoded model such as gpt-4o.","startTime":798.5,"endTime":801.375,"audioSegment":0},{"text":"The fallback gezel answers those requests.","startTime":801.375,"endTime":804.25,"audioSegment":0},{"text":"It defaults to your Meester, so there is always a useful front door;","startTime":804.25,"endTime":807.125,"audioSegment":0},{"text":"you can choose another gezel from Settings → Connected Apps.","startTime":807.125,"endTime":810,"audioSegment":0},{"text":"Gezel knows how to get the best out of each model — catching runaway rambling,","startTime":810,"endTime":812.8,"audioSegment":0},{"text":"tidying leaked reasoning, applying model-specific fixes.","startTime":812.8,"endTime":815.6,"audioSegment":0},{"text":"The Supporting behaviors switch controls whether connected apps get that help too.","startTime":815.6,"endTime":818.4,"audioSegment":0},{"text":"On (the default) is recommended;","startTime":818.4,"endTime":821.2,"audioSegment":0},{"text":"off gives plain serving with just the model's tuned settings.","startTime":821.2,"endTime":824,"audioSegment":0},{"text":"Some tools don't ask where your AI lives —","startTime":824,"endTime":826.8,"audioSegment":0},{"text":"they simply look for Ollama on its standard port.","startTime":826.8,"endTime":829.6,"audioSegment":0},{"text":"The Emulate Ollama switch makes gezel answer there,","startTime":829.6,"endTime":832.4,"audioSegment":0},{"text":"so those tools discover your crew with zero setup.","startTime":832.4,"endTime":835.2,"audioSegment":0},{"text":"One honest caveat,","startTime":835.2,"endTime":838,"audioSegment":0},{"text":"spelled out next to the switch: Ollama's convention is no password.","startTime":838,"endTime":840.8,"audioSegment":0},{"text":"While emulation is on,","startTime":840.8,"endTime":843.6,"audioSegment":0},{"text":"any program on this computer can use your models without asking first.","startTime":843.6,"endTime":846.4,"audioSegment":0},{"text":"Gezel keeps this off unless you turn it on, only ever answers your own machine,","startTime":846.4,"endTime":849.2,"audioSegment":0},{"text":"and refuses to take the port if the real Ollama is already running.","startTime":849.2,"endTime":852,"audioSegment":0},{"text":"Every chat an app completes through these endpoints is recorded in the History tab (look for \"App chat\" entries),","startTime":852,"endTime":856.75,"audioSegment":0},{"text":"and the tokens they consume count in the Usage view — so you can always see who has been using your models, and how much.","startTime":856.75,"endTime":861.5,"audioSegment":0},{"text":"If you are developing one of these applications,","startTime":861.5,"endTime":866.25,"audioSegment":0},{"text":"continue with the technical guide Building connected apps with gezel-app-sdk.","startTime":866.25,"endTime":871,"audioSegment":0}],"version":1},"startBlock":{"title":"Connected apps","subtitle":"Gezel isn't only a place you visit — it can also serve your models and gezellen to other programs on your computer. A code editor, a writing tool, or a browser extension that knows how to talk to an AI service can talk to gezel instead, and get your local models with all of gezel's know-how applied.","ambientMotion":"zoomIn"}}</script>
