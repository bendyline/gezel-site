20,"endTime":22.875,"audioSegment":0},{"text":"Two things make it work: An address.","startTime":22.875,"endTime":25.75,"audioSegment":0},{"text":"Gezel listens at https://127.0.0.1:6228/v1 on your machine.","startTime":25.75,"endTime":28.625,"audioSegment":0},{"text":"Apps that let you set a custom AI server go here. Permission.","startTime":28.625,"endTime":31.5,"audioSegment":0},{"text":"The first time an app asks for access,","startTime":31.5,"endTime":34.375,"audioSegment":0},{"text":"gezel shows you an approval request — who is asking, and for what.","startTime":34.375,"endTime":37.25,"audioSegment":0},{"text":"Nothing gets through until you approve,","startTime":37.25,"endTime":40.125,"audioSegment":0},{"text":"and you can revoke any app later from the same panel.","startTime":40.125,"endTime":43,"audioSegment":0},{"text":"Gezel presents your crew to connected apps as model choices,","startTime":43,"endTime":45.875,"audioSegment":0},{"text":"including each gezel's name and role.","startTime":45.875,"endTime":48.75,"audioSegment":0},{"text":"When an app chooses one,","startTime":48.75,"endTime":51.625,"audioSegment":0},{"text":"that gezel answers with their character, model, and settings.","startTime":51.625,"endTime":54.5,"audioSegment":0},{"text":"Some apps cannot choose from that list and ask for a hardcoded model such as gpt-4o.","startTime":54.5,"endTime":57.375,"audioSegment":0},{"text":"The fallback gezel answers those requests.","startTime":57.375,"endTime":60.25,"audioSegment":0},{"text":"It defaults to your Meester, so there is always a useful front door;","startTime":60.25,"endTime":63.125,"audioSegment":0},{"text":"you can choose another gezel from Settings → Connected Apps.","startTime":63.125,"endTime":66,"audioSegment":0},{"text":"Gezel knows how to get the best out of each model — catching runaway rambling,","startTime":66,"endTime":68.8,"audioSegment":0},{"text":"tidying leaked reasoning, applying model-specific fixes.","startTime":68.8,"endTime":71.6,"audioSegment":0},{"text":"The Supporting behaviors switch controls whether connected apps get that help too.","startTime":71.6,"endTime":74.4,"audioSegment":0},{"text":"On (the default) is recommended;","startTime":74.4,"endTime":77.2,"audioSegment":0},{"text":"off gives plain serving with just the model's tuned settings.","startTime":77.2,"endTime":80,"audioSegment":0},{"text":"Some tools don't ask where your AI lives —","startTime":80,"endTime":82.8,"audioSegment":0},{"text":"they simply look for Ollama on its standard port.","startTime":82.8,"endTime":85.6,"audioSegment":0},{"text":"The Emulate Ollama switch makes gezel answer there,","startTime":85.6,"endTime":88.4,"audioSegment":0},{"text":"so those tools discover your crew with zero setup.","startTime":88.4,"endTime":91.2,"audioSegment":0},{"text":"One honest caveat,","startTime":91.2,"endTime":94,"audioSegment":0},{"text":"spelled out next to the switch: Ollama's convention is no password.","startTime":94,"endTime":96.8,"audioSegment":0},{"text":"While emulation is on,","startTime":96.8,"endTime":99.6,"audioSegment":0},{"text":"any program on this computer can use your models without asking first.","startTime":99.6,"endTime":102.4,"audioSegment":0},{"text":"Gezel keeps this off unless you turn it on, only ever answers your own machine,","startTime":102.4,"endTime":105.2,"audioSegment":0},{"text":"and refuses to take the port if the real Ollama is already running.","startTime":105.2,"endTime":108,"audioSegment":0},{"text":"Every chat an app completes through these endpoints is recorded in the History tab (look for \"App chat\" entries),","startTime":108,"endTime":114.5,"audioSegment":0},{"text":"and the tokens they consume count in the Usage view — so you can always see who has been using your models, and how much.","startTime":114.5,"endTime":121,"audioSegment":0}],"version":1},"startBlock":{"title":"Connected apps","subtitle":"Gezel isn't only a place you visit — it can also serve your models and gezellen to other programs on your computer. A code editor, a writing tool, or a browser extension that knows how to talk to an AI service can talk to gezel instead, and get your local models with all of gezel's know-how applied.","ambientMotion":"zoomIn"}}</script>
