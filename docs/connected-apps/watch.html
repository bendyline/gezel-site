"line":161,"column":94,"offset":22522},"end":{"line":161,"column":114,"offset":22542}}}],"position":{"start":{"line":161,"column":92,"offset":22520},"end":{"line":161,"column":116,"offset":22544}}},{"type":"text","value":" answers those requests. It defaults to your Meester, so there is always a useful front door; you can choose someone else from ","position":{"start":{"line":161,"column":116,"offset":22544},"end":{"line":161,"column":243,"offset":22671}}},{"type":"strong","children":[{"type":"text","value":"Settings → Integrations","position":{"start":{"line":161,"column":245,"offset":22673},"end":{"line":161,"column":268,"offset":22696}}}],"position":{"start":{"line":161,"column":243,"offset":22671},"end":{"line":161,"column":270,"offset":22698}}},{"type":"text","value":".","position":{"start":{"line":161,"column":270,"offset":22698},"end":{"line":161,"column":271,"offset":22699}}}],"position":{"start":{"line":161,"column":1,"offset":22429},"end":{"line":161,"column":271,"offset":22699}}}]},{"id":"supporting-behaviors","startTime":1115,"duration":14,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Supporting behaviors","position":{"start":{"line":163,"column":4,"offset":22704},"end":{"line":163,"column":24,"offset":22724}}}],"position":{"start":{"line":163,"column":1,"offset":22701},"end":{"line":163,"column":24,"offset":22724}}},"title":"Supporting behaviors","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel knows how to get the best out of each model — catching runaway rambling, tidying leaked reasoning, applying model-specific fixes. The ","position":{"start":{"line":165,"column":1,"offset":22726},"end":{"line":165,"column":141,"offset":22866}}},{"type":"strong","children":[{"type":"text","value":"Supporting behaviors","position":{"start":{"line":165,"column":143,"offset":22868},"end":{"line":165,"column":163,"offset":22888}}}],"position":{"start":{"line":165,"column":141,"offset":22866},"end":{"line":165,"column":165,"offset":22890}}},{"type":"text","value":" switch controls whether connected apps get that help too. On (the default) is recommended; off gives plain serving with just the model's tuned settings.","position":{"start":{"line":165,"column":165,"offset":22890},"end":{"line":165,"column":318,"offset":23043}}}],"position":{"start":{"line":165,"column":1,"offset":22726},"end":{"line":165,"column":318,"offset":23043}}}]},{"id":"emulating-ollama","startTime":1129,"duration":28,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Emulating Ollama","position":{"start":{"line":167,"column":4,"offset":23048},"end":{"line":167,"column":20,"offset":23064}}}],"position":{"start":{"line":167,"column":1,"offset":23045},"end":{"line":167,"column":20,"offset":23064}}},"title":"Emulating Ollama","contents":[{"type":"paragraph","children":[{"type":"text","value":"Some tools don't ask where your AI lives — they simply look for ","position":{"start":{"line":169,"column":1,"offset":23066},"end":{"line":169,"column":65,"offset":23130}}},{"type":"link","url":"https://ollama.com","children":[{"type":"text","value":"Ollama","position":{"start":{"line":169,"column":66,"offset":23131},"end":{"line":169,"column":72,"offset":23137}}}],"position":{"start":{"line":169,"column":65,"offset":23130},"end":{"line":169,"column":93,"offset":23158}}},{"type":"text","value":" on its standard port. The ","position":{"start":{"line":169,"column":93,"offset":23158},"end":{"line":169,"column":120,"offset":23185}}},{"type":"strong","children":[{"type":"text","value":"Emulate Ollama","position":{"start":{"line":169,"column":122,"offset":23187},"end":{"line":169,"column":136,"offset":23201}}}],"position":{"start":{"line":169,"column":120,"offset":23185},"end":{"line":169,"column":138,"offset":23203}}},{"type":"text","value":" switch makes gezel answer there, so those tools discover your crew with zero setup.","position":{"start":{"line":169,"column":138,"offset":23203},"end":{"line":169,"column":222,"offset":23287}}}],"position":{"start":{"line":169,"column":1,"offset":23066},"end":{"line":169,"column":222,"offset":23287}}},{"type":"paragraph","children":[{"type":"text","value":"One honest caveat, spelled out next to the switch: Ollama's convention is no password. While emulation is on, any program on this computer can use your models without asking first. Gezel keeps this off unless you turn it on, only ever answers your own machine, and refuses to take the port if the real Ollama is already running.","position":{"start":{"line":171,"column":1,"offset":23289},"end":{"line":171,"column":329,"offset":23617}}}],"position":{"start":{"line":171,"column":1,"offset":23289},"end":{"line":171,"column":329,"offset":23617}}}]},{"id":"keeping-an-eye-on-things","startTime":1157,"duration":25,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Keeping an eye on things","position":{"start":{"line":173,"column":4,"offset":23622},"end":{"line":173,"column":28,"offset":23646}}}],"position":{"start":{"line":173,"column":1,"offset":23619},"end":{"line":173,"column":28,"offset":23646}}},"title":"Keeping an eye on things","contents":[{"type":"paragraph","children":[{"type":"text","value":"Every chat an app completes through these endpoints is recorded in the ","position":{"start":{"line":175,"column":1,"offset":23648},"end":{"line":175,"column":72,"offset":23719}}},{"type":"strong","children":[{"type":"text","value":"History","position":{"start":{"line":175,"column":74,"offset":23721},"end":{"line":175,"column":81,"offset":23728}}}],"position":{"start":{"line":175,"column":72,"offset":23719},"end":{"line":175,"column":83,"offset":23730}}},{"type":"text","value":" tab (look for \"App chat\" entries), and the tokens they consume count in the ","position":{"start":{"line":175,"column":83,"offset":23730},"end":{"line":175,"column":160,"offset":23807}}},{"type":"strong","children":[{"type":"text","value":"Usage","position":{"start":{"line":175,"column":162,"offset":23809},"end":{"line":175,"column":167,"offset":23814}}}],"position":{"start":{"line":175,"column":160,"offset":23807},"end":{"line":175,"column":169,"offset":23816}}},{"type":"text","value":" view — so you can always see who has been using your models, and how much.","position":{"start":{"line":175,"column":169,"offset":23816},"end":{"line":175,"column":244,"offset":23891}}}],"position":{"start":{"line":175,"column":1,"offset":23648},"end":{"line":175,"column":244,"offset":23891}}},{"type":"paragraph","children":[{"type":"text","value":"If you are developing one of these applications, continue with the technical guide ","position":{"start":{"line":177,"column":1,"offset":23893},"end":{"line":177,"column":84,"offset":23976}}},{"type":"link","url":"../building-connected-apps-with-gezel-app-sdk/","children":[{"type":"text","value":"Building connected apps with gezel-app-sdk","position":{"start":{"line":177,"column":85,"offset":23977},"end":{"line":177,"column":127,"offset":24019}}}],"position":{"start":{"line":177,"column":84,"offset":23976},"end":{"line":177,"column":176,"offset":24068}}},{"type":"text","value":". It opens with a ","position":{"start":{"line":177,"column":176,"offset":24068},"end":{"line":177,"column":194,"offset":24086}}},{"type":"link","url":"../building-connected-apps-with-gezel-app-sdk/#quick-start-with-curl","children":[{"type":"text","value":"quick start","position":{"start":{"line":177,"column":195,"offset":24087},"end":{"line":177,"column":206,"offset":24098}}}],"position":{"start":{"line":177,"column":194,"offset":24086},"end":{"line":177,"column":277,"offset":24169}}},{"type":"text","value":": three commands, ending in one ","position":{"start":{"line":177,"column":277,"offset":24169},"end":{"line":177,"column":309,"offset":24201}}},{"type":"inlineCode","value":"curl","position":{"start":{"line":177,"column":309,"offset":24201},"end":{"line":177,"column":315,"offset":24207}}},{"type":"text","value":" call that gets a reply from a local model.","position":{"start":{"line":177,"column":315,"offset":24207},"end":{"line":177,"column":358,"offset":24250}}}],"position":{"start":{"line":177,"column":1,"offset":23893},"end":{"line":177,"column":358,"offset":24250}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel isn't only a place you visit —","startTime":0,"endTime":4,"audioSegment":0},{"text":"it can also serve your models and crew to other programs on your computer.","startTime":4,"endTime":8,"audioSegment":0},{"text":"A code editor, a writing tool, or a browser extension that knows how to talk to an AI service can talk to gezel instead,","startTime":8,"endTime":12,"audioSegment":0},{"text":"and get your local models with all of gezel's know-how applied.","startTime":12,"endTime":16,"audioSegment":0},{"text":"Everything described here lives in Settings → Integrations.","startTime":16,"endTime":20,"audioSegment":0},{"text":"Apps speak to gezel using the same \"OpenAI-style\" language most AI tools already know.","startTime":20,"endTime":23.705882352941178,"audioSegment":0},{"text":"Two things make it work: An address.","startTime":23.705882352941178,"endTime":27.411764705882355,"audioSegment":0},{"text":"The address panel in Settings → Integrations shows where gezel is listening on your machine.","startTime":27.411764705882355,"endTime":31.11764705882353,"audioSegment":0},{"text":"On most personal installs that is https://127.0.0.1:6228/v1; when the Gezel machine service is installed,","startTime":31.11764705882353,"endTime":34.82352941176471,"audioSegment":0},{"text":"the app API moves to a per-launch port (shown in the panel) because the machine service holds 6228.","startTime":34.82352941176471,"endTime":38.529411764705884,"audioSegment":0},{"text":"For apps that need an address that never changes, turn on Ollama emulation — it always answers at http://127.0.0.1:11434,","startTime":38.529411764705884,"endTime":42.23529411764706,"audioSegment":0},{"text":"over plain HTTP and without a key, so any program on this computer can use your models while it is on.","startTime":42.23529411764706,"endTime":45.94117647058823,"audioSegment":0},{"text":"From a terminal,","startTime":45.94117647058823,"endTime":49.64705882352941,"audioSegment":0},{"text":"gezel integrations address prints every address and gezel integrations ollama on turns the emulation on. Permission.","startTime":49.64705882352941,"endTime":53.35294117647059,"audioSegment":0},{"text":"The first time an app asks for access,","startTime":53.35294117647059,"endTime":57.05882352941177,"audioSegment":0},{"text":"gezel shows you an approval request — who is asking, and for what.","startTime":57.05882352941177,"endTime":60.76470588235294,"audioSegment":0},{"text":"Nothing gets through until you approve,","startTime":60.76470588235294,"endTime":64.47058823529412,"audioSegment":0},{"text":"and you can revoke any app later from the same panel.","startTime":64.47058823529412,"endTime":68.1764705882353,"audioSegment":0},{"text":"Gezel's own add-ins for Word, Excel, PowerPoint, LibreOffice,","startTime":68.1764705882353,"endTime":71.88235294117646,"audioSegment":0},{"text":"and VS Code are the exception: they can prove they run as you on this computer, so they connect without asking.","startTime":71.88235294117646,"endTime":75.58823529411765,"audioSegment":0},{"text":"Revoking one of them only resets it;","startTime":75.58823529411765,"endTime":79.29411764705883,"audioSegment":0},{"text":"to disconnect it for good, remove the add-in.","startTime":79.29411764705883,"endTime":83,"audioSegment":0},{"text":"The rest of this page is about other apps using your crew and models.","startTime":83,"endTime":86.4342105263158,"audioSegment":0},{"text":"This part is the reverse: AI apps that already have their own model — Claude Code,","startTime":86.4342105263158,"endTime":89.86842105263158,"audioSegment":0},{"text":"Claude Desktop, Codex, Cursor and VS Code — can use what Gezel knows and does:","startTime":89.86842105263158,"endTime":93.30263157894737,"audioSegment":0},{"text":"Search the folder they are working in (its files, and the text inside its Word, PDF, PowerPoint and Excel files),","startTime":93.30263157894737,"endTime":96.73684210526315,"audioSegment":0},{"text":"your shared document library, your saved memories, and the knowledge catalogs you installed.","startTime":96.73684210526315,"endTime":100.17105263157895,"audioSegment":0},{"text":"Read Word, PDF, PowerPoint and Excel files as text.","startTime":100.17105263157895,"endTime":103.60526315789474,"audioSegment":0},{"text":"Describe an image on this computer, or read the text in it.","startTime":103.60526315789474,"endTime":107.03947368421052,"audioSegment":0},{"text":"Make an image with the image engine you chose in Gezel.","startTime":107.03947368421052,"endTime":110.47368421052632,"audioSegment":0},{"text":"Make a Word, PowerPoint, PDF or Excel file from what the app writes,","startTime":110.47368421052632,"endTime":113.90789473684211,"audioSegment":0},{"text":"with the same document maker Gezel uses.","startTime":113.90789473684211,"endTime":117.34210526315789,"audioSegment":0},{"text":"Gezel keeps the file in the project's artifacts,","startTime":117.34210526315789,"endTime":120.77631578947368,"audioSegment":0},{"text":"and the app copies it into your folder.","startTime":120.77631578947368,"endTime":124.21052631578948,"audioSegment":0},{"text":"Remember a decision or a preference,","startTime":124.21052631578948,"endTime":127.64473684210526,"audioSegment":0},{"text":"so Gezel and every other app see it later.","startTime":127.64473684210526,"endTime":131.07894736842104,"audioSegment":0},{"text":"Check the issues Gezel's night shift found: say which are real,","startTime":131.07894736842104,"endTime":134.51315789473685,"audioSegment":0},{"text":"and fix them if you ask.","startTime":134.51315789473685,"endTime":137.94736842105263,"audioSegment":0},{"text":"Set an app up on its own tab: Gezel's tools in Claude Code, and so on.","startTime":137.94736842105263,"endTime":141.3815789473684,"audioSegment":0},{"text":"Gezel adds a server called gezel to that app's own settings and changes nothing else there.","startTime":141.3815789473684,"endTime":144.81578947368422,"audioSegment":0},{"text":"Claude Code and Codex are set up through their own commands;","startTime":144.81578947368422,"endTime":148.25,"audioSegment":0},{"text":"when Gezel cannot find the command, the tab shows the line to run yourself.","startTime":148.25,"endTime":151.68421052631578,"audioSegment":0},{"text":"If you use the Gezel extension for VS Code,","startTime":151.68421052631578,"endTime":155.11842105263156,"audioSegment":0},{"text":"it adds the tools to each workspace on its own.","startTime":155.11842105263156,"endTime":158.55263157894737,"audioSegment":0},{"text":"Getting the app to use it.","startTime":158.55263157894737,"endTime":161.98684210526315,"audioSegment":0},{"text":"An app with Gezel's tools still reaches for its own search first.","startTime":161.98684210526315,"endTime":165.42105263157896,"audioSegment":0},{"text":"Once it's set up, its tab shows one line to add near the top of the instructions file in a folder you work in: CLAUDE.md for Claude Code,","startTime":165.42105263157896,"endTime":168.85526315789474,"audioSegment":0},{"text":"AGENTS.md for Codex, Cursor and VS Code.","startTime":168.85526315789474,"endTime":172.28947368421052,"audioSegment":0},{"text":"Put it near the top: at the end of a long file,","startTime":172.28947368421052,"endTime":175.7236842105263,"audioSegment":0},{"text":"apps overlook it.","startTime":175.7236842105263,"endTime":179.1578947368421,"audioSegment":0},{"text":"With that line, the apps usually reach for Gezel's search first.","startTime":179.1578947368421,"endTime":182.5921052631579,"audioSegment":0},{"text":"How much it helps depends on the model.","startTime":182.5921052631579,"endTime":186.0263157894737,"audioSegment":0},{"text":"In our tests, Claude Code on Sonnet 5 answered questions about the code about a quarter faster,","startTime":186.0263157894737,"endTime":189.46052631578948,"audioSegment":0},{"text":"and up to twice as fast on large, little-documented codebases.","startTime":189.46052631578948,"endTime":192.89473684210526,"audioSegment":0},{"text":"Newer models that already find their way quickly (Sonnet 5.5,","startTime":192.89473684210526,"endTime":196.32894736842104,"audioSegment":0},{"text":"Opus 5.5, and Codex) were no faster.","startTime":196.32894736842104,"endTime":199.76315789473682,"audioSegment":0},{"text":"Gezel shows the line for you to copy;","startTime":199.76315789473682,"endTime":203.19736842105263,"audioSegment":0},{"text":"it never changes your files. Which folder.","startTime":203.19736842105263,"endTime":206.6315789473684,"audioSegment":0},{"text":"An app works with the Gezel project for the folder it was started in.","startTime":206.6315789473684,"endTime":210.06578947368422,"audioSegment":0},{"text":"A folder Gezel does not know yet becomes a read-only project the first time the app uses Gezel's tools there,","startTime":210.06578947368422,"endTime":213.5,"audioSegment":0},{"text":"so Gezel can index it; Gezel never writes into it.","startTime":213.5,"endTime":216.93421052631578,"audioSegment":0},{"text":"If you would rather not, choose Only folders already in Gezel: in other folders the app still reaches your library,","startTime":216.93421052631578,"endTime":220.36842105263156,"audioSegment":0},{"text":"memories and knowledge.","startTime":220.36842105263156,"endTime":223.80263157894737,"audioSegment":0},{"text":"Claude Desktop has no folder,","startTime":223.80263157894737,"endTime":227.23684210526315,"audioSegment":0},{"text":"so you pick its project on its tab.","startTime":227.23684210526315,"endTime":230.67105263157893,"audioSegment":0},{"text":"What they may do.","startTime":230.67105263157893,"endTime":234.10526315789474,"audioSegment":0},{"text":"On the Overview tab, under Gezel's tools in other apps:","startTime":234.10526315789474,"endTime":237.53947368421052,"audioSegment":0},{"text":"Let other apps use Gezel's tools turns all of it off or on.","startTime":237.53947368421052,"endTime":240.9736842105263,"audioSegment":0},{"text":"Memory: Off, Read, or Save to the project.","startTime":240.9736842105263,"endTime":244.4078947368421,"audioSegment":0},{"text":"A saved memory goes to the project the app is working in,","startTime":244.4078947368421,"endTime":247.8421052631579,"audioSegment":0},{"text":"labeled with the app's name, and everyone working in that project sees it.","startTime":247.8421052631579,"endTime":251.27631578947367,"audioSegment":0},{"text":"Apps never save to your own \"About you\" memories.","startTime":251.27631578947367,"endTime":254.71052631578948,"audioSegment":0},{"text":"Images: Off, On this computer (the default), or Any image engine.","startTime":254.71052631578948,"endTime":258.14473684210526,"audioSegment":0},{"text":"With Any image engine an app can use a cloud engine you set up,","startTime":258.14473684210526,"endTime":261.57894736842104,"audioSegment":0},{"text":"which may charge for each image without asking you first.","startTime":261.57894736842104,"endTime":265.0131578947369,"audioSegment":0},{"text":"Images are saved in Gezel;","startTime":265.0131578947369,"endTime":268.4473684210526,"audioSegment":0},{"text":"the app copies one into its folder when it needs it there.","startTime":268.4473684210526,"endTime":271.88157894736844,"audioSegment":0},{"text":"Issues: Off, List them, or List and judge them (the default). See below.","startTime":271.88157894736844,"endTime":275.3157894736842,"audioSegment":0},{"text":"Checking the night shift's issues. Overnight,","startTime":275.3157894736842,"endTime":278.75,"audioSegment":0},{"text":"a small model on this computer reads your code and flags things that look wrong.","startTime":278.75,"endTime":282.1842105263158,"audioSegment":0},{"text":"Many of them aren't,","startTime":282.1842105263158,"endTime":285.61842105263156,"audioSegment":0},{"text":"and a stronger model like the one in Claude Code is good at telling which.","startTime":285.61842105263156,"endTime":289.0526315789474,"audioSegment":0},{"text":"Once Claude Code is set up, run /mcp__gezel__triage_issues in a folder Gezel knows (add a number for how many),","startTime":289.0526315789474,"endTime":292.4868421052631,"audioSegment":0},{"text":"or /mcp__gezel__fix_issues to have it fix the real ones too; in VS Code it's /mcp.gezel.triage_issues.","startTime":292.4868421052631,"endTime":295.92105263157896,"audioSegment":0},{"text":"The app reads the code at each issue and tells Gezel what it found: fixed,","startTime":295.92105263157896,"endTime":299.35526315789474,"audioSegment":0},{"text":"real, not a bug, true but not worth fixing, and so on.","startTime":299.35526315789474,"endTime":302.7894736842105,"audioSegment":0},{"text":"Each issue then shows the answer and which app gave it,","startTime":302.7894736842105,"endTime":306.2236842105263,"audioSegment":0},{"text":"and you can reopen any of them.","startTime":306.2236842105263,"endTime":309.6578947368421,"audioSegment":0},{"text":"Gezel also learns from the answers: a lead judged not a bug stops coming back the next night in different words.","startTime":309.6578947368421,"endTime":313.0921052631579,"audioSegment":0},{"text":"For an app without Gezel's tools, open Reports → Issues for review, copy or save the list,","startTime":313.0921052631579,"endTime":316.52631578947364,"audioSegment":0},{"text":"let the app fill in the answer under each issue, and use Import answers.","startTime":316.52631578947364,"endTime":319.9605263157895,"audioSegment":0},{"text":"The same section lists the apps using Gezel's tools right now and the folder each is working in.","startTime":319.9605263157895,"endTime":323.39473684210526,"audioSegment":0},{"text":"Stop for this folder stops that app there until you turn it back on.","startTime":323.39473684210526,"endTime":326.82894736842104,"audioSegment":0},{"text":"Under the strictest security level, Super Lockdown,","startTime":326.82894736842104,"endTime":330.2631578947368,"audioSegment":0},{"text":"no app can use Gezel's tools: Gezel cannot see whether an outside app's model runs on this computer.","startTime":330.2631578947368,"endTime":333.6973684210526,"audioSegment":0},{"text":"The tools work only while Gezel is running.","startTime":333.6973684210526,"endTime":337.13157894736844,"audioSegment":0},{"text":"From a terminal, gezel mcp status,","startTime":337.13157894736844,"endTime":340.5657894736842,"audioSegment":0},{"text":"gezel mcp install <app> and gezel mcp remove <app> do the same as these tabs.","startTime":340.5657894736842,"endTime":344,"audioSegment":0},{"text":"The authenticated address also serves the OpenAI Responses API at /v1/responses.","startTime":344,"endTime":347.8775510204082,"audioSegment":0},{"text":"That lets a harness such as Codex keep ownership of its coding tools, sandbox, approvals,","startTime":347.8775510204082,"endTime":351.7551020408163,"audioSegment":0},{"text":"and conversation loop while a model installed in gezel supplies the inference.","startTime":351.7551020408163,"endTime":355.6326530612245,"audioSegment":0},{"text":"VS Code, OpenCode, and pi connect the same way through the chat endpoint —","startTime":355.6326530612245,"endTime":359.51020408163265,"audioSegment":0},{"text":"see VS Code, OpenCode, and pi below.","startTime":359.51020408163265,"endTime":363.38775510204084,"audioSegment":0},{"text":"Word, Excel, PowerPoint, and LibreOffice connect differently: they open real conversations in a project rather than borrowing a model —","startTime":363.38775510204084,"endTime":367.265306122449,"audioSegment":0},{"text":"see Word, Excel, and PowerPoint and LibreOffice.","startTime":367.265306122449,"endTime":371.14285714285717,"audioSegment":0},{"text":"For Codex, use Gezel's models in Codex on the Codex tab.","startTime":371.14285714285717,"endTime":375.0204081632653,"audioSegment":0},{"text":"Gezel creates an isolated gezel-local Codex profile,","startTime":375.0204081632653,"endTime":378.8979591836735,"audioSegment":0},{"text":"a model catalog, and a dedicated revocable credential.","startTime":378.8979591836735,"endTime":382.7755102040816,"audioSegment":0},{"text":"It does not edit Codex's main configuration, authentication,","startTime":382.7755102040816,"endTime":386.6530612244898,"audioSegment":0},{"text":"conversations, sandbox rules, or approval settings.","startTime":386.6530612244898,"endTime":390.53061224489795,"audioSegment":0},{"text":"Start Codex with the command shown on the card (codex --profile gezel-local).","startTime":390.53061224489795,"endTime":394.40816326530614,"audioSegment":0},{"text":"If the card says Needs attention,","startTime":394.40816326530614,"endTime":398.2857142857143,"audioSegment":0},{"text":"the gezel-local profile on disk was hand-edited or was written by a different Gezel installation, so gezel will not touch it.","startTime":398.2857142857143,"endTime":402.16326530612247,"audioSegment":0},{"text":"Repair Codex setup writes a fresh profile pointed at this copy of gezel and keeps the old file beside it as gezel-local.config.toml.backup.","startTime":402.16326530612247,"endTime":406.0408163265306,"audioSegment":0},{"text":"The one conflict repair cannot resolve is another connected app holding the Codex credential identity —","startTime":406.0408163265306,"endTime":409.9183673469388,"audioSegment":0},{"text":"revoke that app first.","startTime":409.9183673469388,"endTime":413.7959183673469,"audioSegment":0},{"text":"Keep Gezel running while Codex uses the local model.","startTime":413.7959183673469,"endTime":417.6734693877551,"audioSegment":0},{"text":"If you want the model bridge available without keeping the desktop window open,","startTime":417.6734693877551,"endTime":421.55102040816325,"audioSegment":0},{"text":"turn on Gezel's daemon autostart setting.","startTime":421.55102040816325,"endTime":425.42857142857144,"audioSegment":0},{"text":"The managed profile talks to a narrow, authenticated loopback bridge.","startTime":425.42857142857144,"endTime":429.3061224489796,"audioSegment":0},{"text":"Operationally it provides the stable address that an Ollama-style integration needs, but it keeps bearer authentication: only the Responses and model-discovery routes are present,","startTime":429.3061224489796,"endTime":433.18367346938777,"audioSegment":0},{"text":"and the credential grants no access to Gezel projects, files, terminals, or settings.","startTime":433.18367346938777,"endTime":437.0612244897959,"audioSegment":0},{"text":"The token is read by Codex through a command-backed provider credential rather than copied into a project or shell profile.","startTime":437.0612244897959,"endTime":440.9387755102041,"audioSegment":0},{"text":"Revoking the Codex entry under Integrations immediately stops it from using the bridge.","startTime":440.9387755102041,"endTime":444.81632653061223,"audioSegment":0},{"text":"One-click setup is available only when the desktop and the Gezel service are on the same computer.","startTime":444.81632653061223,"endTime":448.6938775510204,"audioSegment":0},{"text":"In remote-service mode the card stays read-only,","startTime":448.6938775510204,"endTime":452.57142857142856,"audioSegment":0},{"text":"because writing a profile on the service host would not configure Codex on the computer in front of you.","startTime":452.57142857142856,"endTime":456.44897959183675,"audioSegment":0},{"text":"Codex custom providers use wire_api = \"responses\".","startTime":456.44897959183675,"endTime":460.3265306122449,"audioSegment":0},{"text":"The managed profile also sets the top-level web_search = \"disabled\": Codex otherwise advertises a provider-hosted search tool that a local inference server cannot truthfully execute.","startTime":460.3265306122449,"endTime":464.2040816326531,"audioSegment":0},{"text":"Do not combine the Gezel profile with Codex's --search flag,","startTime":464.2040816326531,"endTime":468.0816326530612,"audioSegment":0},{"text":"which explicitly turns that hosted tool back on.","startTime":468.0816326530612,"endTime":471.9591836734694,"audioSegment":0},{"text":"Ordinary Codex tools such as shell commands, patching,","startTime":471.9591836734694,"endTime":475.8367346938776,"audioSegment":0},{"text":"and helper-agent namespaces remain available because Codex executes those itself.","startTime":475.8367346938776,"endTime":479.7142857142857,"audioSegment":0},{"text":"The setup card puts eligible crew members first.","startTime":479.7142857142857,"endTime":483.59183673469386,"audioSegment":0},{"text":"Choosing one gives Codex that crew member's character (about.md), effective local model,","startTime":483.59183673469386,"endTime":487.46938775510205,"audioSegment":0},{"text":"and tuning while Codex keeps its own tools, sandbox, approvals, and conversation loop.","startTime":487.46938775510205,"endTime":491.34693877551024,"audioSegment":0},{"text":"The profile stores their stable id,","startTime":491.34693877551024,"endTime":495.2244897959184,"audioSegment":0},{"text":"so renaming them does not break the connection.","startTime":495.2244897959184,"endTime":499.1020408163265,"audioSegment":0},{"text":"Raw installed models remain available in a separate fallback group for users who want inference without a persona.","startTime":499.1020408163265,"endTime":502.9795918367347,"audioSegment":0},{"text":"The crew member you choose on the card is the profile's default, not its only option: gezel writes a model catalog listing every eligible crew member and local model,","startTime":502.9795918367347,"endTime":506.8571428571429,"audioSegment":0},{"text":"so Codex's own model picker shows the whole crew and you can switch between them inside a Codex session.","startTime":506.8571428571429,"endTime":510.734693877551,"audioSegment":0},{"text":"A crew member appears here only when their effective local model is installed and can participate in Codex's caller-executed tool loop.","startTime":510.734693877551,"endTime":514.6122448979592,"audioSegment":0},{"text":"The facade does not attach Gezel chat sessions, memories, project context, or MCP tools,","startTime":514.6122448979592,"endTime":518.4897959183673,"audioSegment":0},{"text":"and it does not silently route unknown aliases through the fallback crew member.","startTime":518.4897959183673,"endTime":522.3673469387755,"audioSegment":0},{"text":"It also refuses codex-cli: / anthropic-cli: targets because those are full nested agent harnesses rather than inference providers.","startTime":522.3673469387755,"endTime":526.2448979591836,"audioSegment":0},{"text":"Gezel's search, memories, Office reading and images come to Codex the other way,","startTime":526.2448979591836,"endTime":530.1224489795918,"audioSegment":0},{"text":"through Gezel's tools in Codex on the same tab; see Gezel's tools in other AI apps.","startTime":530.1224489795918,"endTime":534,"audioSegment":0},{"text":"Gezel's models in VS Code uses VS Code's built-in custom-endpoint support,","startTime":534,"endTime":537.2903225806451,"audioSegment":0},{"text":"so it does not install or require the Gezel VSIX.","startTime":537.2903225806451,"endTime":540.5806451612904,"audioSegment":0},{"text":"Gezel adds one provider named Gezel to the selected VS Code profile's chatLanguageModels.json.","startTime":540.5806451612904,"endTime":543.8709677419355,"audioSegment":0},{"text":"Every eligible crew member and raw local model then appears in VS Code's native model picker while VS Code keeps control of its agent tools,","startTime":543.8709677419355,"endTime":547.1612903225806,"audioSegment":0},{"text":"permissions, and conversations.","startTime":547.1612903225806,"endTime":550.4516129032259,"audioSegment":0},{"text":"This is a shared profile file, so setup uses a narrow merge: entries belonging to other providers are preserved,","startTime":550.4516129032259,"endTime":553.741935483871,"audioSegment":0},{"text":"and Remove setup removes only Gezel's entry.","startTime":553.741935483871,"endTime":557.0322580645161,"audioSegment":0},{"text":"Named VS Code profiles have separate files;","startTime":557.0322580645161,"endTime":560.3225806451613,"audioSegment":0},{"text":"choose the profile you want before setup.","startTime":560.3225806451613,"endTime":563.6129032258065,"audioSegment":0},{"text":"To move the integration later,","startTime":563.6129032258065,"endTime":566.9032258064516,"audioSegment":0},{"text":"clear it and set up the other profile.","startTime":566.9032258064516,"endTime":570.1935483870968,"audioSegment":0},{"text":"There is one important tradeoff.","startTime":570.1935483870968,"endTime":573.483870967742,"audioSegment":0},{"text":"Without an extension,","startTime":573.483870967742,"endTime":576.7741935483871,"audioSegment":0},{"text":"VS Code cannot give Gezel access to its encrypted extension secret store.","startTime":576.7741935483871,"endTime":580.0645161290323,"audioSegment":0},{"text":"The dedicated VS Code credential is therefore written as plain text in chatLanguageModels.json.","startTime":580.0645161290323,"endTime":583.3548387096774,"audioSegment":0},{"text":"Gezel limits the effect of that exposure: the credential has inference-only scope, talks to a VS Code-only listener on 127.0.0.1,","startTime":583.3548387096774,"endTime":586.6451612903226,"audioSegment":0},{"text":"reaches only chat completions and model discovery, and is individually revocable.","startTime":586.6451612903226,"endTime":589.9354838709678,"audioSegment":0},{"text":"It cannot read Gezel projects, files, terminals, chats, or settings.","startTime":589.9354838709678,"endTime":593.2258064516129,"audioSegment":0},{"text":"The profile file is written with private file permissions where the operating system supports them.","startTime":593.2258064516129,"endTime":596.516129032258,"audioSegment":0},{"text":"The listener's port stays stable even though the ordinary Gezel daemon port can rotate.","startTime":596.516129032258,"endTime":599.8064516129032,"audioSegment":0},{"text":"Keep Gezel running while VS Code uses the models;","startTime":599.8064516129032,"endTime":603.0967741935484,"audioSegment":0},{"text":"daemon autostart makes that available without keeping the desktop window open.","startTime":603.0967741935484,"endTime":606.3870967741935,"audioSegment":0},{"text":"Gezel periodically reconciles the provider entry, so installing or removing a model, changing a crew member,","startTime":606.3870967741935,"endTime":609.6774193548388,"audioSegment":0},{"text":"or changing an effective context limit updates VS Code's model picker automatically.","startTime":609.6774193548388,"endTime":612.9677419354839,"audioSegment":0},{"text":"If the card says Needs attention,","startTime":612.9677419354839,"endTime":616.258064516129,"audioSegment":0},{"text":"Gezel could not prove it owns the existing provider entry or could not safely parse the shared file.","startTime":616.258064516129,"endTime":619.5483870967741,"audioSegment":0},{"text":"Repair VS Code setup first saves the complete existing file beside it as chatLanguageModels.json.backup,","startTime":619.5483870967741,"endTime":622.8387096774194,"audioSegment":0},{"text":"then replaces the conflicting Gezel entry.","startTime":622.8387096774194,"endTime":626.1290322580645,"audioSegment":0},{"text":"Other parseable provider entries remain in place.","startTime":626.1290322580645,"endTime":629.4193548387096,"audioSegment":0},{"text":"If the entire file is damaged,","startTime":629.4193548387096,"endTime":632.7096774193549,"audioSegment":0},{"text":"the backup is the recoverable original and the repaired file contains only the working Gezel provider.","startTime":632.7096774193549,"endTime":636,"audioSegment":0},{"text":"OpenCode connects the same way,","startTime":636,"endTime":639.5333333333333,"audioSegment":0},{"text":"through Use Gezel in OpenCode in this Settings screen.","startTime":639.5333333333333,"endTime":643.0666666666667,"audioSegment":0},{"text":"Gezel writes its own settings file, a model list covering your eligible crew,","startTime":643.0666666666667,"endTime":646.6,"audioSegment":0},{"text":"and a dedicated revocable credential.","startTime":646.6,"endTime":650.1333333333333,"audioSegment":0},{"text":"It never edits your own OpenCode configuration, sessions, or permissions —","startTime":650.1333333333333,"endTime":653.6666666666666,"audioSegment":0},{"text":"instead it hands you a command that points OpenCode at the Gezel-owned file for that run:","startTime":653.6666666666666,"endTime":657.2,"audioSegment":0},{"text":"OPENCODE_CONFIG=<path shown on the card> opencode","startTime":657.2,"endTime":660.7333333333333,"audioSegment":0},{"text":"On Windows the card shows the PowerShell form of the same command.","startTime":660.7333333333333,"endTime":664.2666666666667,"audioSegment":0},{"text":"OpenCode merges configuration files rather than replacing them,","startTime":664.2666666666667,"endTime":667.8,"audioSegment":0},{"text":"so your own settings still apply; Gezel only adds a provider named gezel.","startTime":667.8,"endTime":671.3333333333334,"audioSegment":0},{"text":"The crew member you choose is the one OpenCode starts with.","startTime":671.3333333333334,"endTime":674.8666666666667,"audioSegment":0},{"text":"Every eligible crew member and local model is listed in the file,","startTime":674.8666666666667,"endTime":678.4,"audioSegment":0},{"text":"so OpenCode's own model picker shows the whole crew and you can switch inside a session.","startTime":678.4,"endTime":681.9333333333333,"audioSegment":0},{"text":"Gezel also pins OpenCode's small model — the one it uses for titles and summaries — to the same choice,","startTime":681.9333333333333,"endTime":685.4666666666667,"audioSegment":0},{"text":"so a machine set up for local inference never quietly reaches for a cloud provider you have not configured.","startTime":685.4666666666667,"endTime":689,"audioSegment":0},{"text":"Add to OpenCode writes one further file — gezel.js, in OpenCode's own plugins folder —","startTime":689,"endTime":693.1481481481482,"audioSegment":0},{"text":"and from then on the gezel provider is in every OpenCode session on that computer, no command needed.","startTime":693.1481481481482,"endTime":697.2962962962963,"audioSegment":0},{"text":"This is the one file Gezel places outside its own home,","startTime":697.2962962962963,"endTime":701.4444444444445,"audioSegment":0},{"text":"so it is worth being precise about what it is: a file Gezel adds and owns, never an edit to a file of yours.","startTime":701.4444444444445,"endTime":705.5925925925926,"audioSegment":0},{"text":"It holds no password.","startTime":705.5925925925926,"endTime":709.7407407407408,"audioSegment":0},{"text":"It reads Gezel's settings and credential when OpenCode starts, and does nothing at all when Gezel is not running or not set up —","startTime":709.7407407407408,"endTime":713.8888888888889,"audioSegment":0},{"text":"an unrelated OpenCode session is never affected either way.","startTime":713.8888888888889,"endTime":718.0370370370371,"audioSegment":0},{"text":"opencode --pure starts without it, and without any other plugin.","startTime":718.0370370370371,"endTime":722.1851851851852,"audioSegment":0},{"text":"It deliberately does not change which model OpenCode starts with: that stays your choice in OpenCode's own model picker,","startTime":722.1851851851852,"endTime":726.3333333333334,"audioSegment":0},{"text":"because this file loads in every project.","startTime":726.3333333333334,"endTime":730.4814814814815,"audioSegment":0},{"text":"To check it took effect, run opencode models —","startTime":730.4814814814815,"endTime":734.6296296296297,"audioSegment":0},{"text":"the crew appears under gezel/.","startTime":734.6296296296297,"endTime":738.7777777777778,"audioSegment":0},{"text":"Remove from OpenCode deletes it,","startTime":738.7777777777778,"endTime":742.9259259259259,"audioSegment":0},{"text":"and removing the whole setup deletes it too.","startTime":742.9259259259259,"endTime":747.074074074074,"audioSegment":0},{"text":"If a gezel.js written by a different Gezel installation — or edited by hand — is already there,","startTime":747.074074074074,"endTime":751.2222222222222,"audioSegment":0},{"text":"Gezel says so and leaves it exactly as it is; Replace OpenCode plugin keeps the old one beside it as gezel.js.backup.","startTime":751.2222222222222,"endTime":755.3703703703703,"audioSegment":0},{"text":"If the card says Needs attention,","startTime":755.3703703703703,"endTime":759.5185185185185,"audioSegment":0},{"text":"the managed file was hand-edited or was written by a different Gezel installation, so gezel will not touch it.","startTime":759.5185185185185,"endTime":763.6666666666666,"audioSegment":0},{"text":"Repair OpenCode setup writes a fresh file and keeps the old one beside it as opencode.json.backup.","startTime":763.6666666666666,"endTime":767.8148148148148,"audioSegment":0},{"text":"The one conflict repair cannot resolve is another connected app holding the OpenCode credential identity —","startTime":767.8148148148148,"endTime":771.9629629629629,"audioSegment":0},{"text":"revoke that app first.","startTime":771.9629629629629,"endTime":776.1111111111111,"audioSegment":0},{"text":"Because the credential lives in its own file and the config references it by path,","startTime":776.1111111111111,"endTime":780.2592592592592,"audioSegment":0},{"text":"revoking the OpenCode entry under Integrations immediately stops it from using the bridge, and no secret is ever copied into a project or shell profile.","startTime":780.2592592592592,"endTime":784.4074074074074,"audioSegment":0},{"text":"As with Codex, a crew member appears here only when their effective local model is installed and can take part in a caller-executed tool loop,","startTime":784.4074074074074,"endTime":788.5555555555555,"audioSegment":0},{"text":"one-click setup needs the desktop and the Gezel service on the same computer, and Gezel must stay running while OpenCode uses the model.","startTime":788.5555555555555,"endTime":792.7037037037037,"audioSegment":0},{"text":"The bridge carries only inference: the credential grants no access to Gezel projects,","startTime":792.7037037037037,"endTime":796.8518518518518,"audioSegment":0},{"text":"files, terminals, or settings.","startTime":796.8518518518518,"endTime":801,"audioSegment":0},{"text":"pi is a coding agent that keeps its own tools, permissions,","startTime":801,"endTime":804.2222222222222,"audioSegment":0},{"text":"and conversation loop, and lets a provider supply the model.","startTime":804.2222222222222,"endTime":807.4444444444445,"audioSegment":0},{"text":"Gezel writes a small extension of its own — plus the model list that extension reads —","startTime":807.4444444444445,"endTime":810.6666666666666,"audioSegment":0},{"text":"and hands you a command that loads it for that run:","startTime":810.6666666666666,"endTime":813.8888888888889,"audioSegment":0},{"text":"pi -e <path shown on the card>","startTime":813.8888888888889,"endTime":817.1111111111111,"audioSegment":0},{"text":"Both files live in Gezel's own folder,","startTime":817.1111111111111,"endTime":820.3333333333334,"audioSegment":0},{"text":"so this mode writes nothing into pi at all.","startTime":820.3333333333334,"endTime":823.5555555555555,"audioSegment":0},{"text":"pi merges what an extension registers with your own configuration;","startTime":823.5555555555555,"endTime":826.7777777777778,"audioSegment":0},{"text":"Gezel only adds a provider named gezel, and never touches your models.json, settings, or sessions.","startTime":826.7777777777778,"endTime":830,"audioSegment":0},{"text":"Add to pi copies that same extension into pi's own extensions folder,","startTime":830,"endTime":833.8,"audioSegment":0},{"text":"and from then on the gezel provider is in every pi session on that computer.","startTime":833.8,"endTime":837.6,"audioSegment":0},{"text":"It is a file Gezel adds and owns,","startTime":837.6,"endTime":841.4,"audioSegment":0},{"text":"never an edit to a file of yours.","startTime":841.4,"endTime":845.2,"audioSegment":0},{"text":"It holds no password: it reads Gezel's model list and credential when pi starts,","startTime":845.2,"endTime":849,"audioSegment":0},{"text":"and quietly does nothing when Gezel is not running.","startTime":849,"endTime":852.8,"audioSegment":0},{"text":"pi -ne starts without it, and without any other extension.","startTime":852.8,"endTime":856.6,"audioSegment":0},{"text":"To check it took effect, run pi --list-models —","startTime":856.6,"endTime":860.4,"audioSegment":0},{"text":"the crew appears under gezel/.","startTime":860.4,"endTime":864.2,"audioSegment":0},{"text":"Remove from pi deletes it,","startTime":864.2,"endTime":868,"audioSegment":0},{"text":"and removing the whole setup deletes it too.","startTime":868,"endTime":871.8,"audioSegment":0},{"text":"If a gezel.js written by a different Gezel installation — or edited by hand — is already there,","startTime":871.8,"endTime":875.6,"audioSegment":0},{"text":"Gezel says so and leaves it alone; Replace pi extension keeps the old one beside it as gezel.js.backup.","startTime":875.6,"endTime":879.4,"audioSegment":0},{"text":"Unlike the Codex profile, nothing here pins pi's own default model.","startTime":879.4,"endTime":883.2,"audioSegment":0},{"text":"The extension loads in every project,","startTime":883.2,"endTime":887,"audioSegment":0},{"text":"so which model pi starts with stays your choice in its model picker.","startTime":887,"endTime":890.8,"audioSegment":0},{"text":"If you point pi somewhere else with PI_CODING_AGENT_DIR in your shell,","startTime":890.8,"endTime":894.6,"audioSegment":0},{"text":"note that the gezel service cannot see a variable set only in your login shell — the card shows the folder it actually resolved.","startTime":894.6,"endTime":898.4,"audioSegment":0},{"text":"As with the others, a crew member appears here only when their effective local model is installed and can take part in a caller-executed tool loop,","startTime":898.4,"endTime":902.2,"audioSegment":0},{"text":"one-click setup needs the desktop and the Gezel service on the same computer, and Gezel must stay running while pi uses the model.","startTime":902.2,"endTime":906,"audioSegment":0},{"text":"Use Gezel in Word, Excel,","startTime":906,"endTime":909.775,"audioSegment":0},{"text":"and PowerPoint adds a Gezel button to the Home tab of the desktop Office apps on Windows and macOS.","startTime":909.775,"endTime":913.55,"audioSegment":0},{"text":"It opens a pane beside your document where you chat about it with someone from the project's crew.","startTime":913.55,"endTime":917.325,"audioSegment":0},{"text":"While the pane is open, they can read the document and, when you allow it,","startTime":917.325,"endTime":921.1,"audioSegment":0},{"text":"edit it: insert and replace text in Word, read and write cells in Excel, and add slides in PowerPoint.","startTime":921.1,"endTime":924.875,"audioSegment":0},{"text":"No store is involved.","startTime":924.875,"endTime":928.65,"audioSegment":0},{"text":"Gezel serves the pane itself, from this computer,","startTime":928.65,"endTime":932.425,"audioSegment":0},{"text":"and registers it with each Office app for your account only.","startTime":932.425,"endTime":936.2,"audioSegment":0},{"text":"Office only opens add-ins over a secure connection that your computer trusts.","startTime":936.2,"endTime":939.975,"audioSegment":0},{"text":"So during setup Gezel creates its own security certificate for this computer and asks your system to trust it.","startTime":939.975,"endTime":943.75,"audioSegment":0},{"text":"That certificate:","startTime":943.75,"endTime":947.525,"audioSegment":0},{"text":"works only for this computer's own address (localhost),","startTime":947.525,"endTime":951.3,"audioSegment":0},{"text":"so it cannot vouch for any website;","startTime":951.3,"endTime":955.075,"audioSegment":0},{"text":"is trusted for your account only, not every account on the machine;","startTime":955.075,"endTime":958.85,"audioSegment":0},{"text":"is removed when you remove the setup.","startTime":958.85,"endTime":962.625,"audioSegment":0},{"text":"Your system asks you to confirm once.","startTime":962.625,"endTime":966.4,"audioSegment":0},{"text":"On a Mac that means your password, and macOS may also ask whether Gezel may access data from other apps;","startTime":966.4,"endTime":970.175,"audioSegment":0},{"text":"allow it so Gezel can add itself to Office.","startTime":970.175,"endTime":973.95,"audioSegment":0},{"text":"After setup, restart any Office app that was open.","startTime":973.95,"endTime":977.725,"audioSegment":0},{"text":"The first time,","startTime":977.725,"endTime":981.5,"audioSegment":0},{"text":"choose Add-ins on the Home tab and then Gezel (on Windows it is listed under Developer Add-ins): Office shows Gezel's button on the Home tab only after the add-in has been opened once from that menu.","startTime":981.5,"endTime":985.275,"audioSegment":0},{"text":"From then on, choose Gezel on the Home tab.","startTime":985.275,"endTime":989.05,"audioSegment":0},{"text":"The pane connects to Gezel on its own, with no connection code to type,","startTime":989.05,"endTime":992.825,"audioSegment":0},{"text":"because Gezel set it up for your account.","startTime":992.825,"endTime":996.6,"audioSegment":0},{"text":"The pane works in the project that owns the document's folder.","startTime":996.6,"endTime":1000.375,"audioSegment":0},{"text":"If there isn't one yet, Gezel creates one for that folder.","startTime":1000.375,"endTime":1004.15,"audioSegment":0},{"text":"It picks the folder sensibly: your Documents folder for a loose document there,","startTime":1004.15,"endTime":1007.925,"audioSegment":0},{"text":"a folder like engineeringdocs when the document sits in one of several work folders inside it, or the Default project for a document saved directly in your home folder.","startTime":1007.925,"endTime":1011.7,"audioSegment":0},{"text":"Projects created this way are read-only: Gezel cannot change files in the folder,","startTime":1011.7,"endTime":1015.475,"audioSegment":0},{"text":"only the document you have open, through the pane.","startTime":1015.475,"endTime":1019.25,"audioSegment":0},{"text":"You can allow file changes later in the project's settings.","startTime":1019.25,"endTime":1023.025,"audioSegment":0},{"text":"The Allow edits switch in the pane controls whether Gezel may change the open document at all.","startTime":1023.025,"endTime":1026.8,"audioSegment":0},{"text":"Turn it off and it can still read the document.","startTime":1026.8,"endTime":1030.575,"audioSegment":0},{"text":"Only the crew member you pick in the pane can use the document,","startTime":1030.575,"endTime":1034.35,"audioSegment":0},{"text":"and only while the pane is open; the rest of the project's crew never sees it.","startTime":1034.35,"endTime":1038.125,"audioSegment":0},{"text":"Someone who runs on GitHub Copilot, Claude CLI,","startTime":1038.125,"endTime":1041.9,"audioSegment":0},{"text":"or Codex CLI can chat with you but cannot read or change the document, and the pane says so when you pick them.","startTime":1041.9,"endTime":1045.675,"audioSegment":0},{"text":"If the Gezel button does not appear, check that optional connected experiences are turned on in Office's privacy settings,","startTime":1045.675,"endTime":1049.45,"audioSegment":0},{"text":"then use Clear Office cache on the card with Office closed.","startTime":1049.45,"endTime":1053.225,"audioSegment":0},{"text":"Office on the web and Outlook are not supported.","startTime":1053.225,"endTime":1057,"audioSegment":0},{"text":"Use Gezel in LibreOffice installs Gezel's extension into LibreOffice Writer,","startTime":1057,"endTime":1059.6923076923076,"audioSegment":0},{"text":"Calc, and Impress for your account, using LibreOffice's own installer.","startTime":1059.6923076923076,"endTime":1062.3846153846155,"audioSegment":0},{"text":"Close LibreOffice before installing.","startTime":1062.3846153846155,"endTime":1065.076923076923,"audioSegment":0},{"text":"Afterwards choose Tools > Gezel,","startTime":1065.076923076923,"endTime":1067.7692307692307,"audioSegment":0},{"text":"or open the Gezel panel in the sidebar.","startTime":1067.7692307692307,"endTime":1070.4615384615386,"audioSegment":0},{"text":"The panel connects to Gezel on its own,","startTime":1070.4615384615386,"endTime":1073.1538461538462,"audioSegment":0},{"text":"with no connection code to type.","startTime":1073.1538461538462,"endTime":1075.8461538461538,"audioSegment":0},{"text":"It then works like the Office pane: it finds the project for the document's folder,","startTime":1075.8461538461538,"endTime":1078.5384615384614,"audioSegment":0},{"text":"lets you pick who to talk to, and offers the same document tools, with an Allow edits switch.","startTime":1078.5384615384614,"endTime":1081.2307692307693,"audioSegment":0},{"text":"LibreOffice needs no certificate setup,","startTime":1081.2307692307693,"endTime":1083.923076923077,"audioSegment":0},{"text":"because the extension runs inside LibreOffice and connects to Gezel directly.","startTime":1083.923076923077,"endTime":1086.6153846153845,"audioSegment":0},{"text":"On Linux, some distributions ship LibreOffice's Python support separately;","startTime":1086.6153846153845,"endTime":1089.3076923076924,"audioSegment":0},{"text":"install it if the panel does not appear.","startTime":1089.3076923076924,"endTime":1092,"audioSegment":0},{"text":"Gezel presents your crew to connected apps as model choices,","startTime":1092,"endTime":1094.875,"audioSegment":0},{"text":"including each one's name and role.","startTime":1094.875,"endTime":1097.75,"audioSegment":0},{"text":"When an app chooses one,","startTime":1097.75,"endTime":1100.625,"audioSegment":0},{"text":"that crew member answers with their character, model, and settings.","startTime":1100.625,"endTime":1103.5,"audioSegment":0},{"text":"Some apps cannot choose from that list and ask for a hardcoded model such as gpt-4o.","startTime":1103.5,"endTime":1106.375,"audioSegment":0},{"text":"The fallback crew member answers those requests.","startTime":1106.375,"endTime":1109.25,"audioSegment":0},{"text":"It defaults to your Meester, so there is always a useful front door;","startTime":1109.25,"endTime":1112.125,"audioSegment":0},{"text":"you can choose someone else from Settings → Integrations.","startTime":1112.125,"endTime":1115,"audioSegment":0},{"text":"Gezel knows how to get the best out of each model — catching runaway rambling,","startTime":1115,"endTime":1117.8,"audioSegment":0},{"text":"tidying leaked reasoning, applying model-specific fixes.","startTime":1117.8,"endTime":1120.6,"audioSegment":0},{"text":"The Supporting behaviors switch controls whether connected apps get that help too.","startTime":1120.6,"endTime":1123.4,"audioSegment":0},{"text":"On (the default) is recommended;","startTime":1123.4,"endTime":1126.2,"audioSegment":0},{"text":"off gives plain serving with just the model's tuned settings.","startTime":1126.2,"endTime":1129,"audioSegment":0},{"text":"Some tools don't ask where your AI lives —","startTime":1129,"endTime":1131.8,"audioSegment":0},{"text":"they simply look for Ollama on its standard port.","startTime":1131.8,"endTime":1134.6,"audioSegment":0},{"text":"The Emulate Ollama switch makes gezel answer there,","startTime":1134.6,"endTime":1137.4,"audioSegment":0},{"text":"so those tools discover your crew with zero setup.","startTime":1137.4,"endTime":1140.2,"audioSegment":0},{"text":"One honest caveat,","startTime":1140.2,"endTime":1143,"audioSegment":0},{"text":"spelled out next to the switch: Ollama's convention is no password.","startTime":1143,"endTime":1145.8,"audioSegment":0},{"text":"While emulation is on,","startTime":1145.8,"endTime":1148.6,"audioSegment":0},{"text":"any program on this computer can use your models without asking first.","startTime":1148.6,"endTime":1151.4,"audioSegment":0},{"text":"Gezel keeps this off unless you turn it on, only ever answers your own machine,","startTime":1151.4,"endTime":1154.2,"audioSegment":0},{"text":"and refuses to take the port if the real Ollama is already running.","startTime":1154.2,"endTime":1157,"audioSegment":0},{"text":"Every chat an app completes through these endpoints is recorded in the History tab (look for \"App chat\" entries),","startTime":1157,"endTime":1161.1666666666667,"audioSegment":0},{"text":"and the tokens they consume count in the Usage view — so you can always see who has been using your models, and how much.","startTime":1161.1666666666667,"endTime":1165.3333333333333,"audioSegment":0},{"text":"If you are developing one of these applications,","startTime":1165.3333333333333,"endTime":1169.5,"audioSegment":0},{"text":"continue with the technical guide Building connected apps with gezel-app-sdk.","startTime":1169.5,"endTime":1173.6666666666667,"audioSegment":0},{"text":"It opens with a quick start: three commands,","startTime":1173.6666666666667,"endTime":1177.8333333333333,"audioSegment":0},{"text":"ending in one curl call that gets a reply from a local model.","startTime":1177.8333333333333,"endTime":1182,"audioSegment":0}],"version":1},"startBlock":{"title":"Integrations","subtitle":"Gezel isn't only a place you visit — it can also serve your models and crew to other programs on your computer. A code editor, a writing tool, or a browser extension that knows how to talk to an AI service can talk to gezel instead, and get your local models with all of gezel's know-how applied.","ambientMotion":"zoomIn"}}</script>
