 on things","contents":[{"type":"paragraph","children":[{"type":"text","value":"Every chat an app completes through these endpoints is recorded in the ","position":{"start":{"line":50,"column":1,"offset":5640},"end":{"line":50,"column":72,"offset":5711}}},{"type":"strong","children":[{"type":"text","value":"History","position":{"start":{"line":50,"column":74,"offset":5713},"end":{"line":50,"column":81,"offset":5720}}}],"position":{"start":{"line":50,"column":72,"offset":5711},"end":{"line":50,"column":83,"offset":5722}}},{"type":"text","value":" tab (look for \"App chat\" entries), and the tokens they consume count in the ","position":{"start":{"line":50,"column":83,"offset":5722},"end":{"line":50,"column":160,"offset":5799}}},{"type":"strong","children":[{"type":"text","value":"Usage","position":{"start":{"line":50,"column":162,"offset":5801},"end":{"line":50,"column":167,"offset":5806}}}],"position":{"start":{"line":50,"column":160,"offset":5799},"end":{"line":50,"column":169,"offset":5808}}},{"type":"text","value":" view — so you can always see who has been using your models, and how much.","position":{"start":{"line":50,"column":169,"offset":5808},"end":{"line":50,"column":244,"offset":5883}}}],"position":{"start":{"line":50,"column":1,"offset":5640},"end":{"line":50,"column":244,"offset":5883}}},{"type":"paragraph","children":[{"type":"text","value":"If you are developing one of these applications, continue with the technical guide ","position":{"start":{"line":52,"column":1,"offset":5885},"end":{"line":52,"column":84,"offset":5968}}},{"type":"link","url":"../building-connected-apps-with-gezel-app-sdk/","children":[{"type":"text","value":"Building connected apps with gezel-app-sdk","position":{"start":{"line":52,"column":85,"offset":5969},"end":{"line":52,"column":127,"offset":6011}}}],"position":{"start":{"line":52,"column":84,"offset":5968},"end":{"line":52,"column":176,"offset":6060}}},{"type":"text","value":".","position":{"start":{"line":52,"column":176,"offset":6060},"end":{"line":52,"column":177,"offset":6061}}}],"position":{"start":{"line":52,"column":1,"offset":5885},"end":{"line":52,"column":177,"offset":6061}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel isn't only a place you visit —","startTime":0,"endTime":4,"audioSegment":0},{"text":"it can also serve your models and gezellen to other programs on your computer.","startTime":4,"endTime":8,"audioSegment":0},{"text":"A code editor, a writing tool, or a browser extension that knows how to talk to an AI service can talk to gezel instead,","startTime":8,"endTime":12,"audioSegment":0},{"text":"and get your local models with all of gezel's know-how applied.","startTime":12,"endTime":16,"audioSegment":0},{"text":"Everything described here lives in Settings → Connected Apps.","startTime":16,"endTime":20,"audioSegment":0},{"text":"Apps speak to gezel using the same \"OpenAI-style\" language most AI tools already know.","startTime":20,"endTime":23.454545454545453,"audioSegment":0},{"text":"Two things make it work: An address.","startTime":23.454545454545453,"endTime":26.90909090909091,"audioSegment":0},{"text":"The address panel in Settings → Connected Apps shows where gezel is listening on your machine.","startTime":26.90909090909091,"endTime":30.363636363636363,"audioSegment":0},{"text":"On most personal installs that is https://127.0.0.1:6228/v1; when the Gezel machine service is installed,","startTime":30.363636363636363,"endTime":33.81818181818182,"audioSegment":0},{"text":"the app API moves to a per-launch port (shown in the panel) because the machine service holds 6228.","startTime":33.81818181818182,"endTime":37.27272727272727,"audioSegment":0},{"text":"For apps that need an address that never changes,","startTime":37.27272727272727,"endTime":40.72727272727273,"audioSegment":0},{"text":"turn on Ollama emulation — it always answers at http://127.0.0.1:11434. Permission.","startTime":40.72727272727273,"endTime":44.18181818181819,"audioSegment":0},{"text":"The first time an app asks for access,","startTime":44.18181818181819,"endTime":47.63636363636364,"audioSegment":0},{"text":"gezel shows you an approval request — who is asking, and for what.","startTime":47.63636363636364,"endTime":51.09090909090909,"audioSegment":0},{"text":"Nothing gets through until you approve,","startTime":51.09090909090909,"endTime":54.54545454545455,"audioSegment":0},{"text":"and you can revoke any app later from the same panel.","startTime":54.54545454545455,"endTime":58,"audioSegment":0},{"text":"The authenticated address also serves the OpenAI Responses API at /v1/responses.","startTime":58,"endTime":61.666666666666664,"audioSegment":0},{"text":"That lets a harness such as Codex keep ownership of its coding tools, sandbox, approvals,","startTime":61.666666666666664,"endTime":65.33333333333333,"audioSegment":0},{"text":"and conversation loop while a model installed in gezel supplies the inference.","startTime":65.33333333333333,"endTime":69,"audioSegment":0},{"text":"For Codex, use Use a gezel in Codex in this Settings screen.","startTime":69,"endTime":72.66666666666667,"audioSegment":0},{"text":"Gezel creates an isolated gezel-local Codex profile,","startTime":72.66666666666667,"endTime":76.33333333333333,"audioSegment":0},{"text":"a model catalog, and a dedicated revocable credential.","startTime":76.33333333333333,"endTime":80,"audioSegment":0},{"text":"It does not edit Codex's main configuration, authentication,","startTime":80,"endTime":83.66666666666666,"audioSegment":0},{"text":"conversations, sandbox rules, or approval settings.","startTime":83.66666666666666,"endTime":87.33333333333333,"audioSegment":0},{"text":"Start Codex with the command shown on the card (codex --profile gezel-local).","startTime":87.33333333333333,"endTime":91,"audioSegment":0},{"text":"Keep Gezel running while Codex uses the local model.","startTime":91,"endTime":94.66666666666666,"audioSegment":0},{"text":"If you want the model bridge available without keeping the desktop window open,","startTime":94.66666666666666,"endTime":98.33333333333333,"audioSegment":0},{"text":"turn on Gezel's daemon autostart setting.","startTime":98.33333333333333,"endTime":102,"audioSegment":0},{"text":"The managed profile talks to a narrow, authenticated loopback bridge.","startTime":102,"endTime":105.66666666666666,"audioSegment":0},{"text":"Operationally it provides the stable address that an Ollama-style integration needs, but it keeps bearer authentication: only the Responses and model-discovery routes are present,","startTime":105.66666666666666,"endTime":109.33333333333333,"audioSegment":0},{"text":"and the credential grants no access to Gezel projects, files, terminals, or settings.","startTime":109.33333333333333,"endTime":113,"audioSegment":0},{"text":"The token is read by Codex through a command-backed provider credential rather than copied into a project or shell profile.","startTime":113,"endTime":116.66666666666666,"audioSegment":0},{"text":"Revoking the Codex entry under Connected Apps immediately stops it from using the bridge.","startTime":116.66666666666666,"endTime":120.33333333333333,"audioSegment":0},{"text":"One-click setup is available only when the desktop and the Gezel service are on the same computer.","startTime":120.33333333333333,"endTime":124,"audioSegment":0},{"text":"In remote-service mode the card stays read-only,","startTime":124,"endTime":127.66666666666666,"audioSegment":0},{"text":"because writing a profile on the service host would not configure Codex on the computer in front of you.","startTime":127.66666666666666,"endTime":131.33333333333331,"audioSegment":0},{"text":"Codex custom providers use wire_api = \"responses\".","startTime":131.33333333333331,"endTime":135,"audioSegment":0},{"text":"The managed profile also sets the top-level web_search = \"disabled\": Codex otherwise advertises a provider-hosted search tool that a local inference server cannot truthfully execute.","startTime":135,"endTime":138.66666666666666,"audioSegment":0},{"text":"Do not combine the Gezel profile with Codex's --search flag,","startTime":138.66666666666666,"endTime":142.33333333333331,"audioSegment":0},{"text":"which explicitly turns that hosted tool back on.","startTime":142.33333333333331,"endTime":146,"audioSegment":0},{"text":"Ordinary Codex tools such as shell commands, patching,","startTime":146,"endTime":149.66666666666666,"audioSegment":0},{"text":"and helper-agent namespaces remain available because Codex executes those itself.","startTime":149.66666666666666,"endTime":153.33333333333331,"audioSegment":0},{"text":"The setup card puts eligible gezels first.","startTime":153.33333333333331,"endTime":157,"audioSegment":0},{"text":"Choosing one gives Codex that gezel's character (about.md), effective local model,","startTime":157,"endTime":160.66666666666666,"audioSegment":0},{"text":"and tuning while Codex keeps its own tools, sandbox, approvals, and conversation loop.","startTime":160.66666666666666,"endTime":164.33333333333331,"audioSegment":0},{"text":"The profile stores the stable gezel id,","startTime":164.33333333333331,"endTime":168,"audioSegment":0},{"text":"so renaming the gezel does not break the connection.","startTime":168,"endTime":171.66666666666666,"audioSegment":0},{"text":"Raw installed models remain available in a separate fallback group for users who want inference without a gezel persona.","startTime":171.66666666666666,"endTime":175.33333333333331,"audioSegment":0},{"text":"A gezel appears here only when its effective local model is installed and can participate in Codex's caller-executed tool loop.","startTime":175.33333333333331,"endTime":179,"audioSegment":0},{"text":"The facade does not attach Gezel chat sessions, memories, project context, or MCP tools,","startTime":179,"endTime":182.66666666666666,"audioSegment":0},{"text":"and it does not silently route unknown aliases through the fallback gezel.","startTime":182.66666666666666,"endTime":186.33333333333331,"audioSegment":0},{"text":"It also refuses codex-cli: / anthropic-cli: targets because those are full nested agent harnesses rather than inference providers.","startTime":186.33333333333331,"endTime":190,"audioSegment":0},{"text":"Gezel presents your crew to connected apps as model choices,","startTime":190,"endTime":192.875,"audioSegment":0},{"text":"including each gezel's name and role.","startTime":192.875,"endTime":195.75,"audioSegment":0},{"text":"When an app chooses one,","startTime":195.75,"endTime":198.625,"audioSegment":0},{"text":"that gezel answers with their character, model, and settings.","startTime":198.625,"endTime":201.5,"audioSegment":0},{"text":"Some apps cannot choose from that list and ask for a hardcoded model such as gpt-4o.","startTime":201.5,"endTime":204.375,"audioSegment":0},{"text":"The fallback gezel answers those requests.","startTime":204.375,"endTime":207.25,"audioSegment":0},{"text":"It defaults to your Meester, so there is always a useful front door;","startTime":207.25,"endTime":210.125,"audioSegment":0},{"text":"you can choose another gezel from Settings → Connected Apps.","startTime":210.125,"endTime":213,"audioSegment":0},{"text":"Gezel knows how to get the best out of each model — catching runaway rambling,","startTime":213,"endTime":215.8,"audioSegment":0},{"text":"tidying leaked reasoning, applying model-specific fixes.","startTime":215.8,"endTime":218.6,"audioSegment":0},{"text":"The Supporting behaviors switch controls whether connected apps get that help too.","startTime":218.6,"endTime":221.4,"audioSegment":0},{"text":"On (the default) is recommended;","startTime":221.4,"endTime":224.2,"audioSegment":0},{"text":"off gives plain serving with just the model's tuned settings.","startTime":224.2,"endTime":227,"audioSegment":0},{"text":"Some tools don't ask where your AI lives —","startTime":227,"endTime":229.8,"audioSegment":0},{"text":"they simply look for Ollama on its standard port.","startTime":229.8,"endTime":232.6,"audioSegment":0},{"text":"The Emulate Ollama switch makes gezel answer there,","startTime":232.6,"endTime":235.4,"audioSegment":0},{"text":"so those tools discover your crew with zero setup.","startTime":235.4,"endTime":238.2,"audioSegment":0},{"text":"One honest caveat,","startTime":238.2,"endTime":241,"audioSegment":0},{"text":"spelled out next to the switch: Ollama's convention is no password.","startTime":241,"endTime":243.8,"audioSegment":0},{"text":"While emulation is on,","startTime":243.8,"endTime":246.6,"audioSegment":0},{"text":"any program on this computer can use your models without asking first.","startTime":246.6,"endTime":249.4,"audioSegment":0},{"text":"Gezel keeps this off unless you turn it on, only ever answers your own machine,","startTime":249.4,"endTime":252.2,"audioSegment":0},{"text":"and refuses to take the port if the real Ollama is already running.","startTime":252.2,"endTime":255,"audioSegment":0},{"text":"Every chat an app completes through these endpoints is recorded in the History tab (look for \"App chat\" entries),","startTime":255,"endTime":259.75,"audioSegment":0},{"text":"and the tokens they consume count in the Usage view — so you can always see who has been using your models, and how much.","startTime":259.75,"endTime":264.5,"audioSegment":0},{"text":"If you are developing one of these applications,","startTime":264.5,"endTime":269.25,"audioSegment":0},{"text":"continue with the technical guide Building connected apps with gezel-app-sdk.","startTime":269.25,"endTime":274,"audioSegment":0}],"version":1},"startBlock":{"title":"Connected apps","subtitle":"Gezel isn't only a place you visit — it can also serve your models and gezellen to other programs on your computer. A code editor, a writing tool, or a browser extension that knows how to talk to an AI service can talk to gezel instead, and get your local models with all of gezel's know-how applied.","ambientMotion":"zoomIn"}}</script>
