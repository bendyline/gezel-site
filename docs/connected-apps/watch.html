12229}}},{"type":"text","value":" in your shell, note that the gezel service cannot see a variable set only in your login shell — the card shows the folder it actually resolved.","position":{"start":{"line":90,"column":233,"offset":12229},"end":{"line":90,"column":377,"offset":12373}}}],"position":{"start":{"line":90,"column":1,"offset":11997},"end":{"line":90,"column":377,"offset":12373}}},{"type":"paragraph","children":[{"type":"text","value":"As with the others, a gezel appears here only when its effective local model is installed and can take part in a caller-executed tool loop, one-click setup needs the desktop and the Gezel service on the same computer, and Gezel must stay running while pi uses the model.","position":{"start":{"line":92,"column":1,"offset":12375},"end":{"line":92,"column":271,"offset":12645}}}],"position":{"start":{"line":92,"column":1,"offset":12375},"end":{"line":92,"column":271,"offset":12645}}}]}]},{"id":"who-answers-gezel-choices-and-the-fallback","startTime":601,"duration":23,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Who answers: gezel choices and the fallback","position":{"start":{"line":94,"column":4,"offset":12650},"end":{"line":94,"column":47,"offset":12693}}}],"position":{"start":{"line":94,"column":1,"offset":12647},"end":{"line":94,"column":47,"offset":12693}}},"title":"Who answers: gezel choices and the fallback","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel presents your crew to connected apps as model choices, including each gezel's name and role. When an app chooses one, that gezel answers with their character, model, and settings.","position":{"start":{"line":96,"column":1,"offset":12695},"end":{"line":96,"column":186,"offset":12880}}}],"position":{"start":{"line":96,"column":1,"offset":12695},"end":{"line":96,"column":186,"offset":12880}}},{"type":"paragraph","children":[{"type":"text","value":"Some apps cannot choose from that list and ask for a hardcoded model such as ","position":{"start":{"line":98,"column":1,"offset":12882},"end":{"line":98,"column":78,"offset":12959}}},{"type":"inlineCode","value":"gpt-4o","position":{"start":{"line":98,"column":78,"offset":12959},"end":{"line":98,"column":86,"offset":12967}}},{"type":"text","value":". The ","position":{"start":{"line":98,"column":86,"offset":12967},"end":{"line":98,"column":92,"offset":12973}}},{"type":"strong","children":[{"type":"text","value":"fallback gezel","position":{"start":{"line":98,"column":94,"offset":12975},"end":{"line":98,"column":108,"offset":12989}}}],"position":{"start":{"line":98,"column":92,"offset":12973},"end":{"line":98,"column":110,"offset":12991}}},{"type":"text","value":" answers those requests. It defaults to your Meester, so there is always a useful front door; you can choose another gezel from ","position":{"start":{"line":98,"column":110,"offset":12991},"end":{"line":98,"column":238,"offset":13119}}},{"type":"strong","children":[{"type":"text","value":"Settings → Connected Apps","position":{"start":{"line":98,"column":240,"offset":13121},"end":{"line":98,"column":265,"offset":13146}}}],"position":{"start":{"line":98,"column":238,"offset":13119},"end":{"line":98,"column":267,"offset":13148}}},{"type":"text","value":".","position":{"start":{"line":98,"column":267,"offset":13148},"end":{"line":98,"column":268,"offset":13149}}}],"position":{"start":{"line":98,"column":1,"offset":12882},"end":{"line":98,"column":268,"offset":13149}}}]},{"id":"supporting-behaviors","startTime":624,"duration":14,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Supporting behaviors","position":{"start":{"line":100,"column":4,"offset":13154},"end":{"line":100,"column":24,"offset":13174}}}],"position":{"start":{"line":100,"column":1,"offset":13151},"end":{"line":100,"column":24,"offset":13174}}},"title":"Supporting behaviors","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel knows how to get the best out of each model — catching runaway rambling, tidying leaked reasoning, applying model-specific fixes. The ","position":{"start":{"line":102,"column":1,"offset":13176},"end":{"line":102,"column":141,"offset":13316}}},{"type":"strong","children":[{"type":"text","value":"Supporting behaviors","position":{"start":{"line":102,"column":143,"offset":13318},"end":{"line":102,"column":163,"offset":13338}}}],"position":{"start":{"line":102,"column":141,"offset":13316},"end":{"line":102,"column":165,"offset":13340}}},{"type":"text","value":" switch controls whether connected apps get that help too. On (the default) is recommended; off gives plain serving with just the model's tuned settings.","position":{"start":{"line":102,"column":165,"offset":13340},"end":{"line":102,"column":318,"offset":13493}}}],"position":{"start":{"line":102,"column":1,"offset":13176},"end":{"line":102,"column":318,"offset":13493}}}]},{"id":"emulating-ollama","startTime":638,"duration":28,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Emulating Ollama","position":{"start":{"line":104,"column":4,"offset":13498},"end":{"line":104,"column":20,"offset":13514}}}],"position":{"start":{"line":104,"column":1,"offset":13495},"end":{"line":104,"column":20,"offset":13514}}},"title":"Emulating Ollama","contents":[{"type":"paragraph","children":[{"type":"text","value":"Some tools don't ask where your AI lives — they simply look for ","position":{"start":{"line":106,"column":1,"offset":13516},"end":{"line":106,"column":65,"offset":13580}}},{"type":"link","url":"https://ollama.com","children":[{"type":"text","value":"Ollama","position":{"start":{"line":106,"column":66,"offset":13581},"end":{"line":106,"column":72,"offset":13587}}}],"position":{"start":{"line":106,"column":65,"offset":13580},"end":{"line":106,"column":93,"offset":13608}}},{"type":"text","value":" on its standard port. The ","position":{"start":{"line":106,"column":93,"offset":13608},"end":{"line":106,"column":120,"offset":13635}}},{"type":"strong","children":[{"type":"text","value":"Emulate Ollama","position":{"start":{"line":106,"column":122,"offset":13637},"end":{"line":106,"column":136,"offset":13651}}}],"position":{"start":{"line":106,"column":120,"offset":13635},"end":{"line":106,"column":138,"offset":13653}}},{"type":"text","value":" switch makes gezel answer there, so those tools discover your crew with zero setup.","position":{"start":{"line":106,"column":138,"offset":13653},"end":{"line":106,"column":222,"offset":13737}}}],"position":{"start":{"line":106,"column":1,"offset":13516},"end":{"line":106,"column":222,"offset":13737}}},{"type":"paragraph","children":[{"type":"text","value":"One honest caveat, spelled out next to the switch: Ollama's convention is no password. While emulation is on, any program on this computer can use your models without asking first. Gezel keeps this off unless you turn it on, only ever answers your own machine, and refuses to take the port if the real Ollama is already running.","position":{"start":{"line":108,"column":1,"offset":13739},"end":{"line":108,"column":329,"offset":14067}}}],"position":{"start":{"line":108,"column":1,"offset":13739},"end":{"line":108,"column":329,"offset":14067}}}]},{"id":"keeping-an-eye-on-things","startTime":666,"duration":19,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Keeping an eye on things","position":{"start":{"line":110,"column":4,"offset":14072},"end":{"line":110,"column":28,"offset":14096}}}],"position":{"start":{"line":110,"column":1,"offset":14069},"end":{"line":110,"column":28,"offset":14096}}},"title":"Keeping an eye on things","contents":[{"type":"paragraph","children":[{"type":"text","value":"Every chat an app completes through these endpoints is recorded in the ","position":{"start":{"line":112,"column":1,"offset":14098},"end":{"line":112,"column":72,"offset":14169}}},{"type":"strong","children":[{"type":"text","value":"History","position":{"start":{"line":112,"column":74,"offset":14171},"end":{"line":112,"column":81,"offset":14178}}}],"position":{"start":{"line":112,"column":72,"offset":14169},"end":{"line":112,"column":83,"offset":14180}}},{"type":"text","value":" tab (look for \"App chat\" entries), and the tokens they consume count in the ","position":{"start":{"line":112,"column":83,"offset":14180},"end":{"line":112,"column":160,"offset":14257}}},{"type":"strong","children":[{"type":"text","value":"Usage","position":{"start":{"line":112,"column":162,"offset":14259},"end":{"line":112,"column":167,"offset":14264}}}],"position":{"start":{"line":112,"column":160,"offset":14257},"end":{"line":112,"column":169,"offset":14266}}},{"type":"text","value":" view — so you can always see who has been using your models, and how much.","position":{"start":{"line":112,"column":169,"offset":14266},"end":{"line":112,"column":244,"offset":14341}}}],"position":{"start":{"line":112,"column":1,"offset":14098},"end":{"line":112,"column":244,"offset":14341}}},{"type":"paragraph","children":[{"type":"text","value":"If you are developing one of these applications, continue with the technical guide ","position":{"start":{"line":114,"column":1,"offset":14343},"end":{"line":114,"column":84,"offset":14426}}},{"type":"link","url":"../building-connected-apps-with-gezel-app-sdk/","children":[{"type":"text","value":"Building connected apps with gezel-app-sdk","position":{"start":{"line":114,"column":85,"offset":14427},"end":{"line":114,"column":127,"offset":14469}}}],"position":{"start":{"line":114,"column":84,"offset":14426},"end":{"line":114,"column":176,"offset":14518}}},{"type":"text","value":".","position":{"start":{"line":114,"column":176,"offset":14518},"end":{"line":114,"column":177,"offset":14519}}}],"position":{"start":{"line":114,"column":1,"offset":14343},"end":{"line":114,"column":177,"offset":14519}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel isn't only a place you visit —","startTime":0,"endTime":4,"audioSegment":0},{"text":"it can also serve your models and gezellen to other programs on your computer.","startTime":4,"endTime":8,"audioSegment":0},{"text":"A code editor, a writing tool, or a browser extension that knows how to talk to an AI service can talk to gezel instead,","startTime":8,"endTime":12,"audioSegment":0},{"text":"and get your local models with all of gezel's know-how applied.","startTime":12,"endTime":16,"audioSegment":0},{"text":"Everything described here lives in Settings → Connected Apps.","startTime":16,"endTime":20,"audioSegment":0},{"text":"Apps speak to gezel using the same \"OpenAI-style\" language most AI tools already know.","startTime":20,"endTime":23.454545454545453,"audioSegment":0},{"text":"Two things make it work: An address.","startTime":23.454545454545453,"endTime":26.90909090909091,"audioSegment":0},{"text":"The address panel in Settings → Connected Apps shows where gezel is listening on your machine.","startTime":26.90909090909091,"endTime":30.363636363636363,"audioSegment":0},{"text":"On most personal installs that is https://127.0.0.1:6228/v1; when the Gezel machine service is installed,","startTime":30.363636363636363,"endTime":33.81818181818182,"audioSegment":0},{"text":"the app API moves to a per-launch port (shown in the panel) because the machine service holds 6228.","startTime":33.81818181818182,"endTime":37.27272727272727,"audioSegment":0},{"text":"For apps that need an address that never changes,","startTime":37.27272727272727,"endTime":40.72727272727273,"audioSegment":0},{"text":"turn on Ollama emulation — it always answers at http://127.0.0.1:11434. Permission.","startTime":40.72727272727273,"endTime":44.18181818181819,"audioSegment":0},{"text":"The first time an app asks for access,","startTime":44.18181818181819,"endTime":47.63636363636364,"audioSegment":0},{"text":"gezel shows you an approval request — who is asking, and for what.","startTime":47.63636363636364,"endTime":51.09090909090909,"audioSegment":0},{"text":"Nothing gets through until you approve,","startTime":51.09090909090909,"endTime":54.54545454545455,"audioSegment":0},{"text":"and you can revoke any app later from the same panel.","startTime":54.54545454545455,"endTime":58,"audioSegment":0},{"text":"The authenticated address also serves the OpenAI Responses API at /v1/responses.","startTime":58,"endTime":61.84444444444444,"audioSegment":0},{"text":"That lets a harness such as Codex keep ownership of its coding tools, sandbox, approvals,","startTime":61.84444444444444,"endTime":65.68888888888888,"audioSegment":0},{"text":"and conversation loop while a model installed in gezel supplies the inference.","startTime":65.68888888888888,"endTime":69.53333333333333,"audioSegment":0},{"text":"VS Code, OpenCode, and pi connect the same way through the chat endpoint —","startTime":69.53333333333333,"endTime":73.37777777777778,"audioSegment":0},{"text":"see VS Code, OpenCode, and pi below.","startTime":73.37777777777778,"endTime":77.22222222222223,"audioSegment":0},{"text":"For Codex, use Use Gezel in Codex in this Settings screen.","startTime":77.22222222222223,"endTime":81.06666666666666,"audioSegment":0},{"text":"Gezel creates an isolated gezel-local Codex profile,","startTime":81.06666666666666,"endTime":84.91111111111111,"audioSegment":0},{"text":"a model catalog, and a dedicated revocable credential.","startTime":84.91111111111111,"endTime":88.75555555555556,"audioSegment":0},{"text":"It does not edit Codex's main configuration, authentication,","startTime":88.75555555555556,"endTime":92.6,"audioSegment":0},{"text":"conversations, sandbox rules, or approval settings.","startTime":92.6,"endTime":96.44444444444444,"audioSegment":0},{"text":"Start Codex with the command shown on the card (codex --profile gezel-local).","startTime":96.44444444444444,"endTime":100.28888888888889,"audioSegment":0},{"text":"If the card says Needs attention,","startTime":100.28888888888889,"endTime":104.13333333333333,"audioSegment":0},{"text":"the gezel-local profile on disk was hand-edited or was written by a different Gezel installation, so gezel will not touch it.","startTime":104.13333333333333,"endTime":107.97777777777779,"audioSegment":0},{"text":"Repair Codex setup writes a fresh profile pointed at this copy of gezel and keeps the old file beside it as gezel-local.config.toml.backup.","startTime":107.97777777777779,"endTime":111.82222222222222,"audioSegment":0},{"text":"The one conflict repair cannot resolve is another connected app holding the Codex credential identity —","startTime":111.82222222222222,"endTime":115.66666666666667,"audioSegment":0},{"text":"revoke that app first.","startTime":115.66666666666667,"endTime":119.51111111111112,"audioSegment":0},{"text":"Keep Gezel running while Codex uses the local model.","startTime":119.51111111111112,"endTime":123.35555555555555,"audioSegment":0},{"text":"If you want the model bridge available without keeping the desktop window open,","startTime":123.35555555555555,"endTime":127.2,"audioSegment":0},{"text":"turn on Gezel's daemon autostart setting.","startTime":127.2,"endTime":131.04444444444445,"audioSegment":0},{"text":"The managed profile talks to a narrow, authenticated loopback bridge.","startTime":131.04444444444445,"endTime":134.88888888888889,"audioSegment":0},{"text":"Operationally it provides the stable address that an Ollama-style integration needs, but it keeps bearer authentication: only the Responses and model-discovery routes are present,","startTime":134.88888888888889,"endTime":138.73333333333335,"audioSegment":0},{"text":"and the credential grants no access to Gezel projects, files, terminals, or settings.","startTime":138.73333333333335,"endTime":142.57777777777778,"audioSegment":0},{"text":"The token is read by Codex through a command-backed provider credential rather than copied into a project or shell profile.","startTime":142.57777777777778,"endTime":146.42222222222222,"audioSegment":0},{"text":"Revoking the Codex entry under Connected Apps immediately stops it from using the bridge.","startTime":146.42222222222222,"endTime":150.26666666666665,"audioSegment":0},{"text":"One-click setup is available only when the desktop and the Gezel service are on the same computer.","startTime":150.26666666666665,"endTime":154.11111111111111,"audioSegment":0},{"text":"In remote-service mode the card stays read-only,","startTime":154.11111111111111,"endTime":157.95555555555558,"audioSegment":0},{"text":"because writing a profile on the service host would not configure Codex on the computer in front of you.","startTime":157.95555555555558,"endTime":161.8,"audioSegment":0},{"text":"Codex custom providers use wire_api = \"responses\".","startTime":161.8,"endTime":165.64444444444445,"audioSegment":0},{"text":"The managed profile also sets the top-level web_search = \"disabled\": Codex otherwise advertises a provider-hosted search tool that a local inference server cannot truthfully execute.","startTime":165.64444444444445,"endTime":169.48888888888888,"audioSegment":0},{"text":"Do not combine the Gezel profile with Codex's --search flag,","startTime":169.48888888888888,"endTime":173.33333333333334,"audioSegment":0},{"text":"which explicitly turns that hosted tool back on.","startTime":173.33333333333334,"endTime":177.17777777777778,"audioSegment":0},{"text":"Ordinary Codex tools such as shell commands, patching,","startTime":177.17777777777778,"endTime":181.02222222222224,"audioSegment":0},{"text":"and helper-agent namespaces remain available because Codex executes those itself.","startTime":181.02222222222224,"endTime":184.86666666666667,"audioSegment":0},{"text":"The setup card puts eligible gezels first.","startTime":184.86666666666667,"endTime":188.7111111111111,"audioSegment":0},{"text":"Choosing one gives Codex that gezel's character (about.md), effective local model,","startTime":188.7111111111111,"endTime":192.55555555555557,"audioSegment":0},{"text":"and tuning while Codex keeps its own tools, sandbox, approvals, and conversation loop.","startTime":192.55555555555557,"endTime":196.4,"audioSegment":0},{"text":"The profile stores the stable gezel id,","startTime":196.4,"endTime":200.24444444444444,"audioSegment":0},{"text":"so renaming the gezel does not break the connection.","startTime":200.24444444444444,"endTime":204.0888888888889,"audioSegment":0},{"text":"Raw installed models remain available in a separate fallback group for users who want inference without a gezel persona.","startTime":204.0888888888889,"endTime":207.93333333333334,"audioSegment":0},{"text":"The gezel you choose on the card is the profile's default, not its only option: gezel writes a model catalog listing every eligible gezel and local model,","startTime":207.93333333333334,"endTime":211.77777777777777,"audioSegment":0},{"text":"so Codex's own model picker shows the whole crew and you can switch between them inside a Codex session.","startTime":211.77777777777777,"endTime":215.62222222222223,"audioSegment":0},{"text":"A gezel appears here only when its effective local model is installed and can participate in Codex's caller-executed tool loop.","startTime":215.62222222222223,"endTime":219.46666666666667,"audioSegment":0},{"text":"The facade does not attach Gezel chat sessions, memories, project context, or MCP tools,","startTime":219.46666666666667,"endTime":223.3111111111111,"audioSegment":0},{"text":"and it does not silently route unknown aliases through the fallback gezel.","startTime":223.3111111111111,"endTime":227.15555555555557,"audioSegment":0},{"text":"It also refuses codex-cli: / anthropic-cli: targets because those are full nested agent harnesses rather than inference providers.","startTime":227.15555555555557,"endTime":231,"audioSegment":0},{"text":"Use Gezel in VS Code uses VS Code's built-in custom-endpoint support,","startTime":231,"endTime":234.25806451612902,"audioSegment":0},{"text":"so it does not install or require the Gezel VSIX.","startTime":234.25806451612902,"endTime":237.51612903225808,"audioSegment":0},{"text":"Gezel adds one provider named Gezel to the selected VS Code profile's chatLanguageModels.json.","startTime":237.51612903225808,"endTime":240.7741935483871,"audioSegment":0},{"text":"Every eligible gezel and raw local model then appears in VS Code's native model picker while VS Code keeps control of its agent tools,","startTime":240.7741935483871,"endTime":244.03225806451613,"audioSegment":0},{"text":"permissions, and conversations.","startTime":244.03225806451613,"endTime":247.29032258064515,"audioSegment":0},{"text":"This is a shared profile file, so setup uses a narrow merge: entries belonging to other providers are preserved,","startTime":247.29032258064515,"endTime":250.5483870967742,"audioSegment":0},{"text":"and Remove setup removes only Gezel's entry.","startTime":250.5483870967742,"endTime":253.80645161290323,"audioSegment":0},{"text":"Named VS Code profiles have separate files;","startTime":253.80645161290323,"endTime":257.06451612903226,"audioSegment":0},{"text":"choose the profile you want before setup.","startTime":257.06451612903226,"endTime":260.3225806451613,"audioSegment":0},{"text":"To move the integration later,","startTime":260.3225806451613,"endTime":263.5806451612903,"audioSegment":0},{"text":"clear it and set up the other profile.","startTime":263.5806451612903,"endTime":266.8387096774194,"audioSegment":0},{"text":"There is one important tradeoff.","startTime":266.8387096774194,"endTime":270.0967741935484,"audioSegment":0},{"text":"Without an extension,","startTime":270.0967741935484,"endTime":273.35483870967744,"audioSegment":0},{"text":"VS Code cannot give Gezel access to its encrypted extension secret store.","startTime":273.35483870967744,"endTime":276.61290322580646,"audioSegment":0},{"text":"The dedicated VS Code credential is therefore written as plain text in chatLanguageModels.json.","startTime":276.61290322580646,"endTime":279.8709677419355,"audioSegment":0},{"text":"Gezel limits the effect of that exposure: the credential has inference-only scope, talks to a VS Code-only listener on 127.0.0.1,","startTime":279.8709677419355,"endTime":283.1290322580645,"audioSegment":0},{"text":"reaches only chat completions and model discovery, and is individually revocable.","startTime":283.1290322580645,"endTime":286.38709677419354,"audioSegment":0},{"text":"It cannot read Gezel projects, files, terminals, chats, or settings.","startTime":286.38709677419354,"endTime":289.64516129032256,"audioSegment":0},{"text":"The profile file is written with private file permissions where the operating system supports them.","startTime":289.64516129032256,"endTime":292.9032258064516,"audioSegment":0},{"text":"The listener's port stays stable even though the ordinary Gezel daemon port can rotate.","startTime":292.9032258064516,"endTime":296.16129032258067,"audioSegment":0},{"text":"Keep Gezel running while VS Code uses the models;","startTime":296.16129032258067,"endTime":299.4193548387097,"audioSegment":0},{"text":"daemon autostart makes that available without keeping the desktop window open.","startTime":299.4193548387097,"endTime":302.6774193548387,"audioSegment":0},{"text":"Gezel periodically reconciles the provider entry, so installing or removing a model, changing a gezel,","startTime":302.6774193548387,"endTime":305.93548387096774,"audioSegment":0},{"text":"or changing an effective context limit updates VS Code's model picker automatically.","startTime":305.93548387096774,"endTime":309.19354838709677,"audioSegment":0},{"text":"If the card says Needs attention,","startTime":309.19354838709677,"endTime":312.4516129032258,"audioSegment":0},{"text":"Gezel could not prove it owns the existing provider entry or could not safely parse the shared file.","startTime":312.4516129032258,"endTime":315.7096774193549,"audioSegment":0},{"text":"Repair VS Code setup first saves the complete existing file beside it as chatLanguageModels.json.backup,","startTime":315.7096774193549,"endTime":318.9677419354839,"audioSegment":0},{"text":"then replaces the conflicting Gezel entry.","startTime":318.9677419354839,"endTime":322.2258064516129,"audioSegment":0},{"text":"Other parseable provider entries remain in place.","startTime":322.2258064516129,"endTime":325.48387096774195,"audioSegment":0},{"text":"If the entire file is damaged,","startTime":325.48387096774195,"endTime":328.741935483871,"audioSegment":0},{"text":"the backup is the recoverable original and the repaired file contains only the working Gezel provider.","startTime":328.741935483871,"endTime":332,"audioSegment":0},{"text":"OpenCode connects the same way,","startTime":332,"endTime":335.46666666666664,"audioSegment":0},{"text":"through Use Gezel in OpenCode in this Settings screen.","startTime":335.46666666666664,"endTime":338.93333333333334,"audioSegment":0},{"text":"Gezel writes its own settings file, a model list covering your eligible crew,","startTime":338.93333333333334,"endTime":342.4,"audioSegment":0},{"text":"and a dedicated revocable credential.","startTime":342.4,"endTime":345.8666666666667,"audioSegment":0},{"text":"It never edits your own OpenCode configuration, sessions, or permissions —","startTime":345.8666666666667,"endTime":349.3333333333333,"audioSegment":0},{"text":"instead it hands you a command that points OpenCode at the Gezel-owned file for that run:","startTime":349.3333333333333,"endTime":352.8,"audioSegment":0},{"text":"OPENCODE_CONFIG=<path shown on the card> opencode","startTime":352.8,"endTime":356.26666666666665,"audioSegment":0},{"text":"On Windows the card shows the PowerShell form of the same command.","startTime":356.26666666666665,"endTime":359.73333333333335,"audioSegment":0},{"text":"OpenCode merges configuration files rather than replacing them,","startTime":359.73333333333335,"endTime":363.2,"audioSegment":0},{"text":"so your own settings still apply; Gezel only adds a provider named gezel.","startTime":363.2,"endTime":366.6666666666667,"audioSegment":0},{"text":"The gezel you choose is the one OpenCode starts with.","startTime":366.6666666666667,"endTime":370.1333333333333,"audioSegment":0},{"text":"Every eligible gezel and local model is listed in the file,","startTime":370.1333333333333,"endTime":373.6,"audioSegment":0},{"text":"so OpenCode's own model picker shows the whole crew and you can switch inside a session.","startTime":373.6,"endTime":377.06666666666666,"audioSegment":0},{"text":"Gezel also pins OpenCode's small model — the one it uses for titles and summaries — to the same choice,","startTime":377.06666666666666,"endTime":380.5333333333333,"audioSegment":0},{"text":"so a machine set up for local inference never quietly reaches for a cloud provider you have not configured.","startTime":380.5333333333333,"endTime":384,"audioSegment":0},{"text":"Add to OpenCode writes one further file — gezel.js, in OpenCode's own plugins folder —","startTime":384,"endTime":388.14814814814815,"audioSegment":0},{"text":"and from then on the gezel provider is in every OpenCode session on that computer, no command needed.","startTime":388.14814814814815,"endTime":392.2962962962963,"audioSegment":0},{"text":"This is the one file Gezel places outside its own home,","startTime":392.2962962962963,"endTime":396.44444444444446,"audioSegment":0},{"text":"so it is worth being precise about what it is: a file Gezel adds and owns, never an edit to a file of yours.","startTime":396.44444444444446,"endTime":400.5925925925926,"audioSegment":0},{"text":"It holds no password.","startTime":400.5925925925926,"endTime":404.74074074074076,"audioSegment":0},{"text":"It reads Gezel's settings and credential when OpenCode starts, and does nothing at all when Gezel is not running or not set up —","startTime":404.74074074074076,"endTime":408.8888888888889,"audioSegment":0},{"text":"an unrelated OpenCode session is never affected either way.","startTime":408.8888888888889,"endTime":413.037037037037,"audioSegment":0},{"text":"opencode --pure starts without it, and without any other plugin.","startTime":413.037037037037,"endTime":417.18518518518516,"audioSegment":0},{"text":"It deliberately does not change which model OpenCode starts with: that stays your choice in OpenCode's own model picker,","startTime":417.18518518518516,"endTime":421.3333333333333,"audioSegment":0},{"text":"because this file loads in every project.","startTime":421.3333333333333,"endTime":425.48148148148147,"audioSegment":0},{"text":"To check it took effect, run opencode models —","startTime":425.48148148148147,"endTime":429.6296296296296,"audioSegment":0},{"text":"the crew appears under gezel/.","startTime":429.6296296296296,"endTime":433.77777777777777,"audioSegment":0},{"text":"Remove from OpenCode deletes it,","startTime":433.77777777777777,"endTime":437.9259259259259,"audioSegment":0},{"text":"and removing the whole setup deletes it too.","startTime":437.9259259259259,"endTime":442.0740740740741,"audioSegment":0},{"text":"If a gezel.js written by a different Gezel installation — or edited by hand — is already there,","startTime":442.0740740740741,"endTime":446.22222222222223,"audioSegment":0},{"text":"Gezel says so and leaves it exactly as it is; Replace OpenCode plugin keeps the old one beside it as gezel.js.backup.","startTime":446.22222222222223,"endTime":450.3703703703704,"audioSegment":0},{"text":"If the card says Needs attention,","startTime":450.3703703703704,"endTime":454.51851851851853,"audioSegment":0},{"text":"the managed file was hand-edited or was written by a different Gezel installation, so gezel will not touch it.","startTime":454.51851851851853,"endTime":458.66666666666663,"audioSegment":0},{"text":"Repair OpenCode setup writes a fresh file and keeps the old one beside it as opencode.json.backup.","startTime":458.66666666666663,"endTime":462.8148148148148,"audioSegment":0},{"text":"The one conflict repair cannot resolve is another connected app holding the OpenCode credential identity —","startTime":462.8148148148148,"endTime":466.96296296296293,"audioSegment":0},{"text":"revoke that app first.","startTime":466.96296296296293,"endTime":471.1111111111111,"audioSegment":0},{"text":"Because the credential lives in its own file and the config references it by path,","startTime":471.1111111111111,"endTime":475.25925925925924,"audioSegment":0},{"text":"revoking the OpenCode entry under Connected Apps immediately stops it from using the bridge, and no secret is ever copied into a project or shell profile.","startTime":475.25925925925924,"endTime":479.4074074074074,"audioSegment":0},{"text":"As with Codex, a gezel appears here only when its effective local model is installed and can take part in a caller-executed tool loop,","startTime":479.4074074074074,"endTime":483.55555555555554,"audioSegment":0},{"text":"one-click setup needs the desktop and the Gezel service on the same computer, and Gezel must stay running while OpenCode uses the model.","startTime":483.55555555555554,"endTime":487.7037037037037,"audioSegment":0},{"text":"The bridge carries only inference: the credential grants no access to Gezel projects,","startTime":487.7037037037037,"endTime":491.85185185185185,"audioSegment":0},{"text":"files, terminals, or settings.","startTime":491.85185185185185,"endTime":496,"audioSegment":0},{"text":"pi is a coding agent that keeps its own tools, permissions,","startTime":496,"endTime":499.22222222222223,"audioSegment":0},{"text":"and conversation loop, and lets a provider supply the model.","startTime":499.22222222222223,"endTime":502.44444444444446,"audioSegment":0},{"text":"Gezel writes a small extension of its own — plus the model list that extension reads —","startTime":502.44444444444446,"endTime":505.6666666666667,"audioSegment":0},{"text":"and hands you a command that loads it for that run:","startTime":505.6666666666667,"endTime":508.8888888888889,"audioSegment":0},{"text":"pi -e <path shown on the card>","startTime":508.8888888888889,"endTime":512.1111111111111,"audioSegment":0},{"text":"Both files live in Gezel's own folder,","startTime":512.1111111111111,"endTime":515.3333333333334,"audioSegment":0},{"text":"so this mode writes nothing into pi at all.","startTime":515.3333333333334,"endTime":518.5555555555555,"audioSegment":0},{"text":"pi merges what an extension registers with your own configuration;","startTime":518.5555555555555,"endTime":521.7777777777778,"audioSegment":0},{"text":"Gezel only adds a provider named gezel, and never touches your models.json, settings, or sessions.","startTime":521.7777777777778,"endTime":525,"audioSegment":0},{"text":"Add to pi copies that same extension into pi's own extensions folder,","startTime":525,"endTime":528.8,"audioSegment":0},{"text":"and from then on the gezel provider is in every pi session on that computer.","startTime":528.8,"endTime":532.6,"audioSegment":0},{"text":"It is a file Gezel adds and owns,","startTime":532.6,"endTime":536.4,"audioSegment":0},{"text":"never an edit to a file of yours.","startTime":536.4,"endTime":540.2,"audioSegment":0},{"text":"It holds no password: it reads Gezel's model list and credential when pi starts,","startTime":540.2,"endTime":544,"audioSegment":0},{"text":"and quietly does nothing when Gezel is not running.","startTime":544,"endTime":547.8,"audioSegment":0},{"text":"pi -ne starts without it, and without any other extension.","startTime":547.8,"endTime":551.6,"audioSegment":0},{"text":"To check it took effect, run pi --list-models —","startTime":551.6,"endTime":555.4,"audioSegment":0},{"text":"the crew appears under gezel/.","startTime":555.4,"endTime":559.2,"audioSegment":0},{"text":"Remove from pi deletes it,","startTime":559.2,"endTime":563,"audioSegment":0},{"text":"and removing the whole setup deletes it too.","startTime":563,"endTime":566.8,"audioSegment":0},{"text":"If a gezel.js written by a different Gezel installation — or edited by hand — is already there,","startTime":566.8,"endTime":570.6,"audioSegment":0},{"text":"Gezel says so and leaves it alone; Replace pi extension keeps the old one beside it as gezel.js.backup.","startTime":570.6,"endTime":574.4,"audioSegment":0},{"text":"Unlike the Codex profile, nothing here pins pi's own default model.","startTime":574.4,"endTime":578.2,"audioSegment":0},{"text":"The extension loads in every project,","startTime":578.2,"endTime":582,"audioSegment":0},{"text":"so which model pi starts with stays your choice in its model picker.","startTime":582,"endTime":585.8,"audioSegment":0},{"text":"If you point pi somewhere else with PI_CODING_AGENT_DIR in your shell,","startTime":585.8,"endTime":589.6,"audioSegment":0},{"text":"note that the gezel service cannot see a variable set only in your login shell — the card shows the folder it actually resolved.","startTime":589.6,"endTime":593.4,"audioSegment":0},{"text":"As with the others, a gezel appears here only when its effective local model is installed and can take part in a caller-executed tool loop,","startTime":593.4,"endTime":597.2,"audioSegment":0},{"text":"one-click setup needs the desktop and the Gezel service on the same computer, and Gezel must stay running while pi uses the model.","startTime":597.2,"endTime":601,"audioSegment":0},{"text":"Gezel presents your crew to connected apps as model choices,","startTime":601,"endTime":603.875,"audioSegment":0},{"text":"including each gezel's name and role.","startTime":603.875,"endTime":606.75,"audioSegment":0},{"text":"When an app chooses one,","startTime":606.75,"endTime":609.625,"audioSegment":0},{"text":"that gezel answers with their character, model, and settings.","startTime":609.625,"endTime":612.5,"audioSegment":0},{"text":"Some apps cannot choose from that list and ask for a hardcoded model such as gpt-4o.","startTime":612.5,"endTime":615.375,"audioSegment":0},{"text":"The fallback gezel answers those requests.","startTime":615.375,"endTime":618.25,"audioSegment":0},{"text":"It defaults to your Meester, so there is always a useful front door;","startTime":618.25,"endTime":621.125,"audioSegment":0},{"text":"you can choose another gezel from Settings → Connected Apps.","startTime":621.125,"endTime":624,"audioSegment":0},{"text":"Gezel knows how to get the best out of each model — catching runaway rambling,","startTime":624,"endTime":626.8,"audioSegment":0},{"text":"tidying leaked reasoning, applying model-specific fixes.","startTime":626.8,"endTime":629.6,"audioSegment":0},{"text":"The Supporting behaviors switch controls whether connected apps get that help too.","startTime":629.6,"endTime":632.4,"audioSegment":0},{"text":"On (the default) is recommended;","startTime":632.4,"endTime":635.2,"audioSegment":0},{"text":"off gives plain serving with just the model's tuned settings.","startTime":635.2,"endTime":638,"audioSegment":0},{"text":"Some tools don't ask where your AI lives —","startTime":638,"endTime":640.8,"audioSegment":0},{"text":"they simply look for Ollama on its standard port.","startTime":640.8,"endTime":643.6,"audioSegment":0},{"text":"The Emulate Ollama switch makes gezel answer there,","startTime":643.6,"endTime":646.4,"audioSegment":0},{"text":"so those tools discover your crew with zero setup.","startTime":646.4,"endTime":649.2,"audioSegment":0},{"text":"One honest caveat,","startTime":649.2,"endTime":652,"audioSegment":0},{"text":"spelled out next to the switch: Ollama's convention is no password.","startTime":652,"endTime":654.8,"audioSegment":0},{"text":"While emulation is on,","startTime":654.8,"endTime":657.6,"audioSegment":0},{"text":"any program on this computer can use your models without asking first.","startTime":657.6,"endTime":660.4,"audioSegment":0},{"text":"Gezel keeps this off unless you turn it on, only ever answers your own machine,","startTime":660.4,"endTime":663.2,"audioSegment":0},{"text":"and refuses to take the port if the real Ollama is already running.","startTime":663.2,"endTime":666,"audioSegment":0},{"text":"Every chat an app completes through these endpoints is recorded in the History tab (look for \"App chat\" entries),","startTime":666,"endTime":670.75,"audioSegment":0},{"text":"and the tokens they consume count in the Usage view — so you can always see who has been using your models, and how much.","startTime":670.75,"endTime":675.5,"audioSegment":0},{"text":"If you are developing one of these applications,","startTime":675.5,"endTime":680.25,"audioSegment":0},{"text":"continue with the technical guide Building connected apps with gezel-app-sdk.","startTime":680.25,"endTime":685,"audioSegment":0}],"version":1},"startBlock":{"title":"Connected apps","subtitle":"Gezel isn't only a place you visit — it can also serve your models and gezellen to other programs on your computer. A code editor, a writing tool, or a browser extension that knows how to talk to an AI service can talk to gezel instead, and get your local models with all of gezel's know-how applied.","ambientMotion":"zoomIn"}}</script>
