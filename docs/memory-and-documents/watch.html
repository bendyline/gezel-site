0769231,"endTime":35.230769230769226,"audioSegment":0},{"text":"your preferences, what you're working toward.","startTime":35.230769230769226,"endTime":38.15384615384615,"audioSegment":0},{"text":"Every gezel reads these,","startTime":38.15384615384615,"endTime":41.07692307692307,"audioSegment":0},{"text":"so you don't have to tell each one again.","startTime":41.07692307692307,"endTime":44,"audioSegment":0},{"text":"Every gezel keeps the most recent things it knows about you in front of it all the time,","startTime":44,"endTime":46.92307692307692,"audioSegment":0},{"text":"so it doesn't have to ask again.","startTime":46.92307692307692,"endTime":49.84615384615385,"audioSegment":0},{"text":"Before answering a message, a gezel also looks for older notes that bear on it,","startTime":49.84615384615385,"endTime":52.76923076923077,"audioSegment":0},{"text":"preferring ones from the project at hand.","startTime":52.76923076923077,"endTime":55.692307692307686,"audioSegment":0},{"text":"This works on phones too,","startTime":55.692307692307686,"endTime":58.61538461538461,"audioSegment":0},{"text":"and keeps working while the search model is still loading.","startTime":58.61538461538461,"endTime":61.53846153846153,"audioSegment":0},{"text":"Everything is editable.","startTime":61.53846153846153,"endTime":64.46153846153845,"audioSegment":0},{"text":"Settings → About you shows what your gezels know about you;","startTime":64.46153846153845,"endTime":67.38461538461539,"audioSegment":0},{"text":"correct or remove anything there.","startTime":67.38461538461539,"endTime":70.3076923076923,"audioSegment":0},{"text":"A gezel's Memories tab holds its own notes and its lessons —","startTime":70.3076923076923,"endTime":73.23076923076923,"audioSegment":0},{"text":"the short list of habits it carries into every conversation.","startTime":73.23076923076923,"endTime":76.15384615384615,"audioSegment":0},{"text":"Lines you put under a ## Pinned heading in the lessons are kept exactly as you wrote them;","startTime":76.15384615384615,"endTime":79.07692307692307,"audioSegment":0},{"text":"the rest is refreshed as the gezel learns.","startTime":79.07692307692307,"endTime":82,"audioSegment":0},{"text":"Documents are shared knowledge — the things every gezel should know.","startTime":82,"endTime":84.875,"audioSegment":0},{"text":"Your company boilerplate, your house style guide, the family holiday schedule.","startTime":84.875,"endTime":87.75,"audioSegment":0},{"text":"The library has two levels:","startTime":87.75,"endTime":90.625,"audioSegment":0},{"text":"The shared library — available to every gezel in every project.","startTime":90.625,"endTime":93.5,"audioSegment":0},{"text":"Project documents — the About and Mission Objectives of each project,","startTime":93.5,"endTime":96.375,"audioSegment":0},{"text":"plus anything else scoped to just that work.","startTime":96.375,"endTime":99.25,"audioSegment":0},{"text":"Gezels can read and (where you allow it) write documents themselves,","startTime":99.25,"endTime":102.125,"audioSegment":0},{"text":"so the library grows as your crew works.","startTime":102.125,"endTime":105,"audioSegment":0},{"text":"You can also install knowledge catalogs: portable .gezk files containing reference documents and prepared search indexes.","startTime":105,"endTime":107.85714285714286,"audioSegment":0},{"text":"Your crew can search and cite them alongside project files and memories.","startTime":107.85714285714286,"endTime":110.71428571428571,"audioSegment":0},{"text":"The built-in Handboek uses this same format.","startTime":110.71428571428571,"endTime":113.57142857142857,"audioSegment":0},{"text":"Installing a catalog adds reference material;","startTime":113.57142857142857,"endTime":116.42857142857143,"audioSegment":0},{"text":"it does not train your chat model.","startTime":116.42857142857143,"endTime":119.28571428571429,"audioSegment":0},{"text":"For the technical details, see How knowledge works in Gezel.","startTime":119.28571428571429,"endTime":122.14285714285714,"audioSegment":0},{"text":"To make or install one, see Working with knowledge catalogs.","startTime":122.14285714285714,"endTime":125,"audioSegment":0},{"text":"Gezel keeps an audit log of meaningful events: who created which gezel,","startTime":125,"endTime":129.25,"audioSegment":0},{"text":"when a project's mission changed, which tools ran.","startTime":129.25,"endTime":133.5,"audioSegment":0},{"text":"The History tab lets you filter and search it — and your gezellen can search it too,","startTime":133.5,"endTime":137.75,"audioSegment":0},{"text":"which means \"did anyone change the mission this week?\" is a question they can answer truthfully rather than guess at.","startTime":137.75,"endTime":142,"audioSegment":0},{"text":"Memories are Markdown files, your library keeps its original documents,","startTime":142,"endTime":145.6,"audioSegment":0},{"text":"and the history log is a file.","startTime":145.6,"endTime":149.2,"audioSegment":0},{"text":"Reference catalogs carry their documents and indexes in portable .gezk archives built from SQLite and other open formats.","startTime":149.2,"endTime":152.8,"audioSegment":0},{"text":"If you want to inspect what Gezel knows,","startTime":152.8,"endTime":156.4,"audioSegment":0},{"text":"the Where files live and How knowledge works articles map the source files and search databases.","startTime":156.4,"endTime":160,"audioSegment":0}],"version":1},"startBlock":{"title":"Memory, documents, and the shared library","ambientMotion":"zoomIn"}}</script>
