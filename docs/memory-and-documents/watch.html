,"startTime":37.16666666666667,"endTime":40,"audioSegment":0},{"text":"so you don't have to tell each one again.","startTime":40,"endTime":42.833333333333336,"audioSegment":0},{"text":"Before answering a message, a gezel looks for notes that bear on it,","startTime":42.833333333333336,"endTime":45.66666666666667,"audioSegment":0},{"text":"preferring ones from the project at hand.","startTime":45.66666666666667,"endTime":48.5,"audioSegment":0},{"text":"This works on phones too,","startTime":48.5,"endTime":51.333333333333336,"audioSegment":0},{"text":"and keeps working while the search model is still loading.","startTime":51.333333333333336,"endTime":54.16666666666667,"audioSegment":0},{"text":"Everything is editable.","startTime":54.16666666666667,"endTime":57,"audioSegment":0},{"text":"Settings → About you shows what your gezels know about you;","startTime":57,"endTime":59.833333333333336,"audioSegment":0},{"text":"correct or remove anything there.","startTime":59.833333333333336,"endTime":62.66666666666667,"audioSegment":0},{"text":"A gezel's Memories tab holds its own notes and its lessons —","startTime":62.66666666666667,"endTime":65.5,"audioSegment":0},{"text":"the short list of habits it carries into every conversation.","startTime":65.5,"endTime":68.33333333333334,"audioSegment":0},{"text":"Lines you put under a ## Pinned heading in the lessons are kept exactly as you wrote them;","startTime":68.33333333333334,"endTime":71.16666666666667,"audioSegment":0},{"text":"the rest is refreshed as the gezel learns.","startTime":71.16666666666667,"endTime":74,"audioSegment":0},{"text":"Documents are shared knowledge — the things every gezel should know.","startTime":74,"endTime":76.875,"audioSegment":0},{"text":"Your company boilerplate, your house style guide, the family holiday schedule.","startTime":76.875,"endTime":79.75,"audioSegment":0},{"text":"The library has two levels:","startTime":79.75,"endTime":82.625,"audioSegment":0},{"text":"The shared library — available to every gezel in every project.","startTime":82.625,"endTime":85.5,"audioSegment":0},{"text":"Project documents — the About and Mission Objectives of each project,","startTime":85.5,"endTime":88.375,"audioSegment":0},{"text":"plus anything else scoped to just that work.","startTime":88.375,"endTime":91.25,"audioSegment":0},{"text":"Gezels can read and (where you allow it) write documents themselves,","startTime":91.25,"endTime":94.125,"audioSegment":0},{"text":"so the library grows as your crew works.","startTime":94.125,"endTime":97,"audioSegment":0},{"text":"You can also install knowledge catalogs: portable .gezk files containing reference documents and prepared search indexes.","startTime":97,"endTime":99.85714285714286,"audioSegment":0},{"text":"Your crew can search and cite them alongside project files and memories.","startTime":99.85714285714286,"endTime":102.71428571428571,"audioSegment":0},{"text":"The built-in Handboek uses this same format.","startTime":102.71428571428571,"endTime":105.57142857142857,"audioSegment":0},{"text":"Installing a catalog adds reference material;","startTime":105.57142857142857,"endTime":108.42857142857143,"audioSegment":0},{"text":"it does not train your chat model.","startTime":108.42857142857143,"endTime":111.28571428571429,"audioSegment":0},{"text":"For the technical details, see How knowledge works in Gezel.","startTime":111.28571428571429,"endTime":114.14285714285714,"audioSegment":0},{"text":"To make or install one, see Working with knowledge catalogs.","startTime":114.14285714285714,"endTime":117,"audioSegment":0},{"text":"Gezel keeps an audit log of meaningful events: who created which gezel,","startTime":117,"endTime":121.25,"audioSegment":0},{"text":"when a project's mission changed, which tools ran.","startTime":121.25,"endTime":125.5,"audioSegment":0},{"text":"The History tab lets you filter and search it — and your gezellen can search it too,","startTime":125.5,"endTime":129.75,"audioSegment":0},{"text":"which means \"did anyone change the mission this week?\" is a question they can answer truthfully rather than guess at.","startTime":129.75,"endTime":134,"audioSegment":0},{"text":"Memories are Markdown files, your library keeps its original documents,","startTime":134,"endTime":137.6,"audioSegment":0},{"text":"and the history log is a file.","startTime":137.6,"endTime":141.2,"audioSegment":0},{"text":"Reference catalogs carry their documents and indexes in portable .gezk archives built from SQLite and other open formats.","startTime":141.2,"endTime":144.8,"audioSegment":0},{"text":"If you want to inspect what Gezel knows,","startTime":144.8,"endTime":148.4,"audioSegment":0},{"text":"the Where files live and How knowledge works articles map the source files and search databases.","startTime":148.4,"endTime":152,"audioSegment":0}],"version":1},"startBlock":{"title":"Memory, documents, and the shared library","ambientMotion":"zoomIn"}}</script>
