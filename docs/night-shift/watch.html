n":[{"type":"text","value":"Reports can go further than prose. A recommendation that is genuinely one click away — fire a craftbook, delegate a fix, apply a reviewed set of file edits — appears ","position":{"start":{"line":83,"column":1,"offset":9045},"end":{"line":83,"column":167,"offset":9211}}},{"type":"strong","children":[{"type":"text","value":"inside the report as an action card","position":{"start":{"line":83,"column":169,"offset":9213},"end":{"line":83,"column":204,"offset":9248}}}],"position":{"start":{"line":83,"column":167,"offset":9211},"end":{"line":83,"column":206,"offset":9250}}},{"type":"text","value":". You see exactly what would run (including the full diff for file edits) and fire it, or dismiss it, right from the page. Nothing a report suggests ever runs on its own: firing is always your click, and Gezel records the resulting task and observed tool activity in History.","position":{"start":{"line":83,"column":206,"offset":9250},"end":{"line":83,"column":481,"offset":9525}}}],"position":{"start":{"line":83,"column":1,"offset":9045},"end":{"line":83,"column":481,"offset":9525}}},{"type":"paragraph","children":[{"type":"text","value":"A night gets a morning card when your crew made something: a change proposal, a report, or finished work. A night held back for a reason you can fix also gets one, once: it ran on battery, or the quota reserve held the work. The card says why and offers the fix. A night when the computer was asleep, Gezel wasn't running, or there was nothing to do gets no card and no notification. A card with reports or finished work stays until you dismiss it; a newer card replaces an older one only when it shows the same things again. If the nightly project review didn't finish, the card says so; it tries again the next night on its own.","position":{"start":{"line":85,"column":1,"offset":9527},"end":{"line":85,"column":631,"offset":10157}}}],"position":{"start":{"line":85,"column":1,"offset":9527},"end":{"line":85,"column":631,"offset":10157}}}]},{"id":"keeping-the-computer-ready","startTime":503,"duration":38,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Keeping the computer ready","position":{"start":{"line":87,"column":4,"offset":10162},"end":{"line":87,"column":30,"offset":10188}}}],"position":{"start":{"line":87,"column":1,"offset":10159},"end":{"line":87,"column":30,"offset":10188}}},"title":"Keeping the computer ready","contents":[{"type":"paragraph","children":[{"type":"text","value":"The night shift needs Gezel running and the computer awake. In Settings → Night Shift:","position":{"start":{"line":89,"column":1,"offset":10190},"end":{"line":89,"column":87,"offset":10276}}}],"position":{"start":{"line":89,"column":1,"offset":10190},"end":{"line":89,"column":87,"offset":10276}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Start Gezel when I log in, without opening a window","position":{"start":{"line":91,"column":5,"offset":10282},"end":{"line":91,"column":56,"offset":10333}}}],"position":{"start":{"line":91,"column":3,"offset":10280},"end":{"line":91,"column":58,"offset":10335}}},{"type":"text","value":" keeps the app in the tray (the menu bar on a Mac) from the moment you log in.","position":{"start":{"line":91,"column":58,"offset":10335},"end":{"line":91,"column":136,"offset":10413}}}],"position":{"start":{"line":91,"column":3,"offset":10280},"end":{"line":91,"column":136,"offset":10413}}}],"position":{"start":{"line":91,"column":1,"offset":10278},"end":{"line":91,"column":136,"offset":10413}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Keep this machine awake while night-shift work is running","position":{"start":{"line":92,"column":5,"offset":10418},"end":{"line":92,"column":62,"offset":10475}}}],"position":{"start":{"line":92,"column":3,"offset":10416},"end":{"line":92,"column":64,"offset":10477}}},{"type":"text","value":" stops it dozing off mid-shift.","position":{"start":{"line":92,"column":64,"offset":10477},"end":{"line":92,"column":95,"offset":10508}}}],"position":{"start":{"line":92,"column":3,"offset":10416},"end":{"line":92,"column":95,"offset":10508}}}],"position":{"start":{"line":92,"column":1,"offset":10414},"end":{"line":92,"column":95,"offset":10508}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Pause night work while this computer runs on battery","position":{"start":{"line":93,"column":5,"offset":10513},"end":{"line":93,"column":57,"offset":10565}}}],"position":{"start":{"line":93,"column":3,"offset":10511},"end":{"line":93,"column":59,"offset":10567}}},{"type":"text","value":" is on by default: unplug and the shift stands down, plug back in and it picks up where it left off.","position":{"start":{"line":93,"column":59,"offset":10567},"end":{"line":93,"column":159,"offset":10667}}}],"position":{"start":{"line":93,"column":3,"offset":10511},"end":{"line":93,"column":159,"offset":10667}}}],"position":{"start":{"line":93,"column":1,"offset":10509},"end":{"line":93,"column":159,"offset":10667}}}],"position":{"start":{"line":91,"column":1,"offset":10278},"end":{"line":93,"column":159,"offset":10667}}},{"type":"paragraph","children":[{"type":"text","value":"A Mac that's already asleep stays asleep: macOS lets only administrators schedule a wake, so leave it plugged in and awake for the night. To run night work with the app closed altogether, enable the background service in Settings.","position":{"start":{"line":95,"column":1,"offset":10669},"end":{"line":95,"column":231,"offset":10899}}}],"position":{"start":{"line":95,"column":1,"offset":10669},"end":{"line":95,"column":231,"offset":10899}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Night Shift is a window — 22:00 to 06:00 unless you change it in Settings —","startTime":0,"endTime":3.9375,"audioSegment":0},{"text":"when your crew is allowed to work on things that don't need you.","startTime":3.9375,"endTime":7.875,"audioSegment":0},{"text":"Reviews get written, indexes get refreshed, translations catch up.","startTime":7.875,"endTime":11.8125,"audioSegment":0},{"text":"In the morning there's a report waiting instead of a backlog.","startTime":11.8125,"endTime":15.75,"audioSegment":0},{"text":"The moon in the title bar shows when a shift is running and what it's working on.","startTime":15.75,"endTime":19.6875,"audioSegment":0},{"text":"It also says when the period started and when it ends — a scheduled shift closes with its window, a manual one runs until the work is done —","startTime":19.6875,"endTime":23.625,"audioSegment":0},{"text":"and keeps a running tally of what the shift has got through: tasks finished, files indexed and reviewed, files written, questions raised for you.","startTime":23.625,"endTime":27.5625,"audioSegment":0},{"text":"During the day the same line tells you when the next window opens.","startTime":27.5625,"endTime":31.5,"audioSegment":0},{"text":"You can start a shift manually too —","startTime":31.5,"endTime":35.4375,"audioSegment":0},{"text":"stepping out for lunch is a perfectly good night.","startTime":35.4375,"endTime":39.375,"audioSegment":0},{"text":"Default is excluded from automatic night work unless you explicitly turn its overnight work on.","startTime":39.375,"endTime":43.3125,"audioSegment":0},{"text":"Its one-off questions, scratch work,","startTime":43.3125,"endTime":47.25,"audioSegment":0},{"text":"and artifacts stay out of the nightly project review and content sweep.","startTime":47.25,"endTime":51.1875,"audioSegment":0},{"text":"The consolidated nightly report is still saved there;","startTime":51.1875,"endTime":55.125,"audioSegment":0},{"text":"storing it in Default does not put Default's contents in scope.","startTime":55.125,"endTime":59.0625,"audioSegment":0},{"text":"Tasks you deliberately queue for tonight still run.","startTime":59.0625,"endTime":63,"audioSegment":0},{"text":"Some work is better done while you sleep.","startTime":63,"endTime":66.25,"audioSegment":0},{"text":"When you attach a task to a message,","startTime":66.25,"endTime":69.5,"audioSegment":0},{"text":"press Tonight on it and it waits for the night shift instead of starting now.","startTime":69.5,"endTime":72.75,"audioSegment":0},{"text":"You can also just ask the Meester to do something tonight.","startTime":72.75,"endTime":76,"audioSegment":0},{"text":"Some roles come with a standing suggestion for recurring work that suits them.","startTime":76,"endTime":79.04166666666667,"audioSegment":0},{"text":"Add a Chief Security Officer to a project, and they'll suggest a nightly security review;","startTime":79.04166666666667,"endTime":82.08333333333333,"audioSegment":0},{"text":"a Translator suggests keeping a translated shadow of your content in the project's designated language.","startTime":82.08333333333333,"endTime":85.125,"audioSegment":0},{"text":"The same goes for project types —","startTime":85.125,"endTime":88.16666666666667,"audioSegment":0},{"text":"a project set up for a job hunt suggests its weekly pipeline review.","startTime":88.16666666666667,"endTime":91.20833333333333,"audioSegment":0},{"text":"These are suggestions, never surprises: nothing runs until you turn it on.","startTime":91.20833333333333,"endTime":94.25,"audioSegment":0},{"text":"The toggles live with the crew list in each project's Settings,","startTime":94.25,"endTime":97.29166666666666,"audioSegment":0},{"text":"and appear the moment a suggesting role joins.","startTime":97.29166666666666,"endTime":100.33333333333333,"audioSegment":0},{"text":"Turning one off pauses it — your run history stays —","startTime":100.33333333333333,"endTime":103.375,"audioSegment":0},{"text":"and \"don't suggest this\" hides it for that project.","startTime":103.375,"endTime":106.41666666666666,"audioSegment":0},{"text":"Role Suggested craftbook When","startTime":106.41666666666666,"endTime":109.45833333333333,"audioSegment":0},{"text":"Builder (Builder) bug-fix-tdd Night Shift, once per night","startTime":109.45833333333333,"endTime":112.5,"audioSegment":0},{"text":"Chief Security Officer (Chief Security Officer) security-architecture-review Night Shift, once per night","startTime":112.5,"endTime":115.54166666666666,"audioSegment":0},{"text":"Chief Security Officer (Chief Security Officer) dependency-audit Night Shift, once per night","startTime":115.54166666666666,"endTime":118.58333333333333,"audioSegment":0},{"text":"Curator (Curator) photo-library-nightly Night Shift, once per night","startTime":118.58333333333333,"endTime":121.625,"audioSegment":0},{"text":"Curator (Curator) album-curate on schedule (0 3 * * 0)","startTime":121.625,"endTime":124.66666666666666,"audioSegment":0},{"text":"Developer (Developer) bug-fix-tdd Night Shift, once per night","startTime":124.66666666666666,"endTime":127.70833333333333,"audioSegment":0},{"text":"Developer (Developer) test-suite-backfill Night Shift, once per night","startTime":127.70833333333333,"endTime":130.75,"audioSegment":0},{"text":"Librarian (Librarian) nightly-fix-sweep Night Shift, once per night","startTime":130.75,"endTime":133.79166666666666,"audioSegment":0},{"text":"Reviewer (Reviewer) codebase-refactoring-review Night Shift, once per night","startTime":133.79166666666666,"endTime":136.83333333333331,"audioSegment":0},{"text":"Reviewer (Reviewer) test-coverage-review Night Shift, once per night","startTime":136.83333333333331,"endTime":139.875,"audioSegment":0},{"text":"Social Media Writer (Social Media Writer) social-digest Night Shift, once per night","startTime":139.875,"endTime":142.91666666666666,"audioSegment":0},{"text":"Social Media Writer (Social Media Writer) reception-report on schedule (0 15 * * 1)","startTime":142.91666666666666,"endTime":145.95833333333331,"audioSegment":0},{"text":"Translator (Translator) translate-content Night Shift, once per night","startTime":145.95833333333331,"endTime":149,"audioSegment":0},{"text":"Night work is deliberately quiet-handed.","startTime":149,"endTime":153.28571428571428,"audioSegment":0},{"text":"The suggested craftbooks write reports, findings, and sidecar files — a security posture report in the artifacts drawer,","startTime":153.28571428571428,"endTime":157.57142857142858,"audioSegment":0},{"text":"translations beside the originals — rather than editing your work in place.","startTime":157.57142857142858,"endTime":161.85714285714286,"audioSegment":0},{"text":"Each enabled item runs at most once per night, inside the window.","startTime":161.85714285714286,"endTime":166.14285714285714,"audioSegment":0},{"text":"Its task transitions and tool completions that Gezel observes land in History like other work.","startTime":166.14285714285714,"endTime":170.42857142857142,"audioSegment":0},{"text":"Some values are shared across night work: the Translator's target language, for instance, is a project property —","startTime":170.42857142857142,"endTime":174.71428571428572,"audioSegment":0},{"text":"set once in project Settings (or the first time you enable the translation run) and reused by every run after that.","startTime":174.71428571428572,"endTime":179,"audioSegment":0},{"text":"Night work on a Claude, Codex, or Copilot subscription spends the same quota you use during the day,","startTime":179,"endTime":184.125,"audioSegment":0},{"text":"so the Night Shift keeps a quota reserve: by default it stops sending work to a subscription once you're within 20% of a quota, leaving the rest for you.","startTime":184.125,"endTime":189.25,"audioSegment":0},{"text":"You can adjust that floor in Settings → Night Shift, or add a daily reserve that scales with the time left —","startTime":189.25,"endTime":194.375,"audioSegment":0},{"text":"10% a day with four days until your quota resets keeps the last 40% for you.","startTime":194.375,"endTime":199.5,"audioSegment":0},{"text":"Work that's already running always finishes; only new work is held.","startTime":199.5,"endTime":204.625,"audioSegment":0},{"text":"Held work resumes on its own when a quota window resets (if the machine is awake) or the next night,","startTime":204.625,"endTime":209.75,"audioSegment":0},{"text":"and the moon menu says what's being protected and why.","startTime":209.75,"endTime":214.875,"audioSegment":0},{"text":"Gezels on local models spend nothing and are never held.","startTime":214.875,"endTime":220,"audioSegment":0},{"text":"A project with both a Librarian and a developer on its crew gets one more kind of night work: the Librarian finds problems in your files,","startTime":220,"endTime":223.26829268292684,"audioSegment":0},{"text":"and overnight the developer works through them.","startTime":223.26829268292684,"endTime":226.53658536585365,"audioSegment":0},{"text":"What arrives in the morning is not a changed project.","startTime":226.53658536585365,"endTime":229.8048780487805,"audioSegment":0},{"text":"It's a set of change proposals — one per group of problems the developer judged worth fixing together,","startTime":229.8048780487805,"endTime":233.0731707317073,"audioSegment":0},{"text":"each with the reasoning written out and the exact edits laid out line by line.","startTime":233.0731707317073,"endTime":236.34146341463415,"audioSegment":0},{"text":"Your files are untouched.","startTime":236.34146341463415,"endTime":239.609756097561,"audioSegment":0},{"text":"You read the proposal, look at the diff,","startTime":239.609756097561,"endTime":242.8780487804878,"audioSegment":0},{"text":"and apply it if you agree.","startTime":242.8780487804878,"endTime":246.14634146341464,"audioSegment":0},{"text":"That's deliberate,","startTime":246.14634146341464,"endTime":249.41463414634146,"audioSegment":0},{"text":"and it has a useful consequence: it works on folders your crew isn't allowed to edit.","startTime":249.41463414634146,"endTime":252.6829268292683,"audioSegment":0},{"text":"You never have to hand over write access to get a fix drafted.","startTime":252.6829268292683,"endTime":255.9512195121951,"audioSegment":0},{"text":"It also works with nothing but the model on your own machine —","startTime":255.9512195121951,"endTime":259.219512195122,"audioSegment":0},{"text":"no network, no service, nobody's cloud.","startTime":259.219512195122,"endTime":262.4878048780488,"audioSegment":0},{"text":"Proposals live in the project's Proposals tab,","startTime":262.4878048780488,"endTime":265.7560975609756,"audioSegment":0},{"text":"which appears once there's something in it.","startTime":265.7560975609756,"endTime":269.0243902439024,"audioSegment":0},{"text":"Each one shows:","startTime":269.0243902439024,"endTime":272.2926829268293,"audioSegment":0},{"text":"what the developer changed and why,","startTime":272.2926829268293,"endTime":275.5609756097561,"audioSegment":0},{"text":"what they were unsure of, and how to check it","startTime":275.5609756097561,"endTime":278.8292682926829,"audioSegment":0},{"text":"every file it touches, with the diff","startTime":278.8292682926829,"endTime":282.0975609756098,"audioSegment":0},{"text":"Apply (all of it, or one file at a time),","startTime":282.0975609756098,"endTime":285.3658536585366,"audioSegment":0},{"text":"Export (a zip of patches you can git apply yourself), or Dismiss","startTime":285.3658536585366,"endTime":288.6341463414634,"audioSegment":0},{"text":"Two things it will tell you plainly.","startTime":288.6341463414634,"endTime":291.9024390243902,"audioSegment":0},{"text":"If a file changed after the proposal was written — you edited it, or a teammate did —","startTime":291.9024390243902,"endTime":295.1707317073171,"audioSegment":0},{"text":"the proposal is marked out of date and applying it asks you to confirm first, naming the files that moved.","startTime":295.1707317073171,"endTime":298.4390243902439,"audioSegment":0},{"text":"And if two proposals touch the same file, both say so,","startTime":298.4390243902439,"endTime":301.7073170731707,"audioSegment":0},{"text":"because applying one will put the other out of date.","startTime":301.7073170731707,"endTime":304.9756097560976,"audioSegment":0},{"text":"You can start the same thing by hand any time: open a file the Librarian has flagged,","startTime":304.9756097560976,"endTime":308.2439024390244,"audioSegment":0},{"text":"and hit Fix on the issue.","startTime":308.2439024390244,"endTime":311.5121951219512,"audioSegment":0},{"text":"It doesn't wait for nightfall, and it produces the same reviewable proposal.","startTime":311.5121951219512,"endTime":314.780487804878,"audioSegment":0},{"text":"Proposed fixes are for code.","startTime":314.780487804878,"endTime":318.0487804878049,"audioSegment":0},{"text":"A folder of documents or photos gets its summaries, descriptions and reviews,","startTime":318.0487804878049,"endTime":321.3170731707317,"audioSegment":0},{"text":"but never a developer drafting edits to your Word files or captions.","startTime":321.3170731707317,"endTime":324.5853658536585,"audioSegment":0},{"text":"A proposal can also move things: put photos into folders,","startTime":324.5853658536585,"endTime":327.8536585365854,"audioSegment":0},{"text":"copy a set of files, make a new folder.","startTime":327.8536585365854,"endTime":331.1219512195122,"audioSegment":0},{"text":"Those appear after the edits as plain rows (\"Move Camera/IMG_0042.jpg → Birthday/IMG_0042.jpg\"),","startTime":331.1219512195122,"endTime":334.390243902439,"audioSegment":0},{"text":"grouped by the folder they land in when there are many, and they never replace a file that's already there.","startTime":334.390243902439,"endTime":337.6585365853658,"audioSegment":0},{"text":"A problem the Librarian found is marked fixed when you apply the proposal that fixes it,","startTime":337.6585365853658,"endTime":340.9268292682927,"audioSegment":0},{"text":"not when the fix is drafted, and goes back to open if you dismiss it.","startTime":340.9268292682927,"endTime":344.1951219512195,"audioSegment":0},{"text":"If you'd rather your crew didn't do this,","startTime":344.1951219512195,"endTime":347.4634146341463,"audioSegment":0},{"text":"turn off nightly fixing in the project's settings.","startTime":347.4634146341463,"endTime":350.7317073170732,"audioSegment":0},{"text":"It's on by default only because you assembled a crew that can do it.","startTime":350.7317073170732,"endTime":354,"audioSegment":0},{"text":"When the window closes, gezel gathers what the shift accomplished and puts it where you'll see it: one notification on your desktop,","startTime":354,"endTime":357.6341463414634,"audioSegment":0},{"text":"Home opens on This morning, and the moon menu grows a Done last night list.","startTime":357.6341463414634,"endTime":361.2682926829268,"audioSegment":0},{"text":"This morning leads with what needs a decision (change proposals, then new reports),","startTime":361.2682926829268,"endTime":364.9024390243902,"audioSegment":0},{"text":"then what finished and how much your crew read and described, then what is already queued for tonight.","startTime":364.9024390243902,"endTime":368.5365853658537,"audioSegment":0},{"text":"It stays until you dismiss it.","startTime":368.5365853658537,"endTime":372.1707317073171,"audioSegment":0},{"text":"On the first morning of a new week it also links Your crew's week,","startTime":372.1707317073171,"endTime":375.8048780487805,"audioSegment":0},{"text":"a one-page recap of every night and every folder's weekly digest.","startTime":375.8048780487805,"endTime":379.4390243902439,"audioSegment":0},{"text":"Every folder also leaves a short report of its own,","startTime":379.4390243902439,"endTime":383.0731707317073,"audioSegment":0},{"text":"written straight from the index, so it costs nothing and needs no model:","startTime":383.0731707317073,"endTime":386.7073170731707,"audioSegment":0},{"text":"Photos: recent outings, photos from this day in earlier years,","startTime":386.7073170731707,"endTime":390.3414634146342,"audioSegment":0},{"text":"and the photos that are exact copies of each other (with how much space they take).","startTime":390.3414634146342,"endTime":393.9756097560976,"audioSegment":0},{"text":"Where a photo was taken never appears in it.","startTime":393.9756097560976,"endTime":397.609756097561,"audioSegment":0},{"text":"Documents: what was added or changed,","startTime":397.609756097561,"endTime":401.2439024390244,"audioSegment":0},{"text":"each with a line saying what it is.","startTime":401.2439024390244,"endTime":404.8780487804878,"audioSegment":0},{"text":"Code: the hotspots (files that change often and carry problems),","startTime":404.8780487804878,"endTime":408.5121951219512,"audioSegment":0},{"text":"the files everything else depends on, and the open issues by severity.","startTime":408.5121951219512,"endTime":412.1463414634146,"audioSegment":0},{"text":"A photo folder's Curator can also leave albums: for each recent outing,","startTime":412.1463414634146,"endTime":415.780487804878,"audioSegment":0},{"text":"a slideshow of the frames that tell the day, in order, captioned, with gentle motion between them.","startTime":415.780487804878,"endTime":419.4146341463415,"audioSegment":0},{"text":"Open one from the folder's Overview or the morning view to play it, change it —","startTime":419.4146341463415,"endTime":423.0487804878049,"audioSegment":0},{"text":"reorder photos, rewrite a caption, pick a theme — or export it as a video.","startTime":423.0487804878049,"endTime":426.6829268292683,"audioSegment":0},{"text":"The album keeps its own smaller copies of the photos,","startTime":426.6829268292683,"endTime":430.3170731707317,"audioSegment":0},{"text":"made without where they were taken; your originals stay exactly where they are.","startTime":430.3170731707317,"endTime":433.9512195121951,"audioSegment":0},{"text":"Copy to a folder… gathers the full-size originals in one place when you want them.","startTime":433.9512195121951,"endTime":437.5853658536586,"audioSegment":0},{"text":"Reports can go further than prose.","startTime":437.5853658536586,"endTime":441.219512195122,"audioSegment":0},{"text":"A recommendation that is genuinely one click away — fire a craftbook, delegate a fix,","startTime":441.219512195122,"endTime":444.8536585365854,"audioSegment":0},{"text":"apply a reviewed set of file edits — appears inside the report as an action card.","startTime":444.8536585365854,"endTime":448.4878048780488,"audioSegment":0},{"text":"You see exactly what would run (including the full diff for file edits) and fire it,","startTime":448.4878048780488,"endTime":452.1219512195122,"audioSegment":0},{"text":"or dismiss it, right from the page.","startTime":452.1219512195122,"endTime":455.7560975609756,"audioSegment":0},{"text":"Nothing a report suggests ever runs on its own: firing is always your click,","startTime":455.7560975609756,"endTime":459.390243902439,"audioSegment":0},{"text":"and Gezel records the resulting task and observed tool activity in History.","startTime":459.390243902439,"endTime":463.0243902439024,"audioSegment":0},{"text":"A night gets a morning card when your crew made something: a change proposal,","startTime":463.0243902439024,"endTime":466.6585365853658,"audioSegment":0},{"text":"a report, or finished work.","startTime":466.6585365853658,"endTime":470.2926829268293,"audioSegment":0},{"text":"A night held back for a reason you can fix also gets one,","startTime":470.2926829268293,"endTime":473.9268292682927,"audioSegment":0},{"text":"once: it ran on battery, or the quota reserve held the work.","startTime":473.9268292682927,"endTime":477.5609756097561,"audioSegment":0},{"text":"The card says why and offers the fix.","startTime":477.5609756097561,"endTime":481.1951219512195,"audioSegment":0},{"text":"A night when the computer was asleep, Gezel wasn't running,","startTime":481.1951219512195,"endTime":484.82926829268297,"audioSegment":0},{"text":"or there was nothing to do gets no card and no notification.","startTime":484.82926829268297,"endTime":488.4634146341464,"audioSegment":0},{"text":"A card with reports or finished work stays until you dismiss it;","startTime":488.4634146341464,"endTime":492.0975609756098,"audioSegment":0},{"text":"a newer card replaces an older one only when it shows the same things again.","startTime":492.0975609756098,"endTime":495.7317073170732,"audioSegment":0},{"text":"If the nightly project review didn't finish,","startTime":495.7317073170732,"endTime":499.3658536585366,"audioSegment":0},{"text":"the card says so; it tries again the next night on its own.","startTime":499.3658536585366,"endTime":503,"audioSegment":0},{"text":"The night shift needs Gezel running and the computer awake.","startTime":503,"endTime":506.45454545454544,"audioSegment":0},{"text":"In Settings → Night Shift:","startTime":506.45454545454544,"endTime":509.90909090909093,"audioSegment":0},{"text":"Start Gezel when I log in,","startTime":509.90909090909093,"endTime":513.3636363636364,"audioSegment":0},{"text":"without opening a window keeps the app in the tray (the menu bar on a Mac) from the moment you log in.","startTime":513.3636363636364,"endTime":516.8181818181819,"audioSegment":0},{"text":"Keep this machine awake while night-shift work is running stops it dozing off mid-shift.","startTime":516.8181818181819,"endTime":520.2727272727273,"audioSegment":0},{"text":"Pause night work while this computer runs on battery is on by default: unplug and the shift stands down,","startTime":520.2727272727273,"endTime":523.7272727272727,"audioSegment":0},{"text":"plug back in and it picks up where it left off.","startTime":523.7272727272727,"endTime":527.1818181818181,"audioSegment":0},{"text":"A Mac that's already asleep stays asleep: macOS lets only administrators schedule a wake,","startTime":527.1818181818181,"endTime":530.6363636363636,"audioSegment":0},{"text":"so leave it plugged in and awake for the night.","startTime":530.6363636363636,"endTime":534.0909090909091,"audioSegment":0},{"text":"To run night work with the app closed altogether,","startTime":534.0909090909091,"endTime":537.5454545454545,"audioSegment":0},{"text":"enable the background service in Settings.","startTime":537.5454545454545,"endTime":541,"audioSegment":0}],"version":1},"startBlock":{"title":"The Night Shift: work your crew does while you sleep","subtitle":"The Night Shift is a window — 22:00 to 06:00 unless you change it in Settings — when your crew is allowed to work on things that don't need you. Reviews get written, indexes get refreshed, translations catch up. In the morning there's a report waiting instead of a backlog.","ambientMotion":"zoomIn"}}</script>
