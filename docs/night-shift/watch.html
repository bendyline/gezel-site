":[]},"captions":{"phrases":[{"text":"The Night Shift is a window — 22:00 to 06:00 unless you change it in Settings —","startTime":0,"endTime":4.5,"audioSegment":0},{"text":"when your crew is allowed to work on things that don't need you.","startTime":4.5,"endTime":9,"audioSegment":0},{"text":"Reviews get written, indexes get refreshed, translations catch up.","startTime":9,"endTime":13.5,"audioSegment":0},{"text":"In the morning there's a report waiting instead of a backlog.","startTime":13.5,"endTime":18,"audioSegment":0},{"text":"The moon in the title bar shows when a shift is running and what it's working on.","startTime":18,"endTime":22.5,"audioSegment":0},{"text":"It also says when the period started and when it ends — a scheduled shift closes with its window, a manual one runs until the work is done —","startTime":22.5,"endTime":27,"audioSegment":0},{"text":"and keeps a running tally of what the shift has got through: tasks finished, files indexed and reviewed, files written, questions raised for you.","startTime":27,"endTime":31.5,"audioSegment":0},{"text":"During the day the same line tells you when the next window opens.","startTime":31.5,"endTime":36,"audioSegment":0},{"text":"You can start a shift manually too —","startTime":36,"endTime":40.5,"audioSegment":0},{"text":"stepping out for lunch is a perfectly good night.","startTime":40.5,"endTime":45,"audioSegment":0},{"text":"Some roles come with a standing suggestion for recurring work that suits them.","startTime":45,"endTime":48.666666666666664,"audioSegment":0},{"text":"Add a Chief Security Officer to a project, and they'll suggest a nightly security review;","startTime":48.666666666666664,"endTime":52.333333333333336,"audioSegment":0},{"text":"a Translator suggests keeping a translated shadow of your content in the project's designated language.","startTime":52.333333333333336,"endTime":56,"audioSegment":0},{"text":"The same goes for project types —","startTime":56,"endTime":59.666666666666664,"audioSegment":0},{"text":"a project set up for a job hunt suggests its weekly pipeline review.","startTime":59.666666666666664,"endTime":63.33333333333333,"audioSegment":0},{"text":"These are suggestions, never surprises: nothing runs until you turn it on.","startTime":63.33333333333333,"endTime":67,"audioSegment":0},{"text":"The toggles live with the crew list in each project's Settings,","startTime":67,"endTime":70.66666666666666,"audioSegment":0},{"text":"and appear the moment a suggesting role joins.","startTime":70.66666666666666,"endTime":74.33333333333333,"audioSegment":0},{"text":"Turning one off pauses it — your run history stays —","startTime":74.33333333333333,"endTime":78,"audioSegment":0},{"text":"and \"don't suggest this\" hides it for that project.","startTime":78,"endTime":81.66666666666666,"audioSegment":0},{"text":"RoleSuggested craftbookWhenOmroeper (Omroeper)social-digestNight Shift, once per nightOmroeper (Omroeper)reception-reporton schedule (0 15 * * 1)Veiligheidsmeester (Chief Security Officer)security-architecture-reviewNight Shift,","startTime":81.66666666666666,"endTime":85.33333333333333,"audioSegment":0},{"text":"once per nightVeiligheidsmeester (Chief Security Officer)dependency-auditNight Shift, once per nightVertaler (Translator)translate-contentNight Shift, once per night","startTime":85.33333333333333,"endTime":89,"audioSegment":0},{"text":"Night work is deliberately quiet-handed.","startTime":89,"endTime":93.28571428571429,"audioSegment":0},{"text":"The suggested craftbooks write reports, findings, and sidecar files — a security posture report in the artifacts drawer,","startTime":93.28571428571429,"endTime":97.57142857142857,"audioSegment":0},{"text":"translations beside the originals — rather than editing your work in place.","startTime":97.57142857142857,"endTime":101.85714285714286,"audioSegment":0},{"text":"Each enabled item runs at most once per night, inside the window.","startTime":101.85714285714286,"endTime":106.14285714285714,"audioSegment":0},{"text":"Its task transitions and tool completions that Gezel observes land in History like other work.","startTime":106.14285714285714,"endTime":110.42857142857143,"audioSegment":0},{"text":"Some values are shared across night work: the Translator's target language, for instance, is a project property —","startTime":110.42857142857143,"endTime":114.71428571428572,"audioSegment":0},{"text":"set once in project Settings (or the first time you enable the translation run) and reused by every run after that.","startTime":114.71428571428572,"endTime":119,"audioSegment":0},{"text":"Night work on a Claude, Codex, or Copilot subscription spends the same quota you use during the day,","startTime":119,"endTime":124.125,"audioSegment":0},{"text":"so the Night Shift keeps a quota reserve: by default it stops sending work to a subscription once you're within 20% of a quota, leaving the rest for you.","startTime":124.125,"endTime":129.25,"audioSegment":0},{"text":"You can adjust that floor in Settings → Night Shift, or add a daily reserve that scales with the time left —","startTime":129.25,"endTime":134.375,"audioSegment":0},{"text":"10% a day with four days until your quota resets keeps the last 40% for you.","startTime":134.375,"endTime":139.5,"audioSegment":0},{"text":"Work that's already running always finishes; only new work is held.","startTime":139.5,"endTime":144.625,"audioSegment":0},{"text":"Held work resumes on its own when a quota window resets (if the machine is awake) or the next night,","startTime":144.625,"endTime":149.75,"audioSegment":0},{"text":"and the moon menu says what's being protected and why.","startTime":149.75,"endTime":154.875,"audioSegment":0},{"text":"Gezels on local models spend nothing and are never held.","startTime":154.875,"endTime":160,"audioSegment":0},{"text":"When the window closes, gezel gathers what the shift accomplished and puts it where you'll see it: the moon menu grows a Done last night list,","startTime":160,"endTime":164.0909090909091,"audioSegment":0},{"text":"the Home greeting gains a Last night tab, and a single question card summarizes the night with links to every report.","startTime":164.0909090909091,"endTime":168.1818181818182,"audioSegment":0},{"text":"Reports can go further than prose.","startTime":168.1818181818182,"endTime":172.27272727272728,"audioSegment":0},{"text":"A recommendation that is genuinely one click away — fire a craftbook, delegate a fix,","startTime":172.27272727272728,"endTime":176.36363636363637,"audioSegment":0},{"text":"apply a reviewed set of file edits — appears inside the report as an action card.","startTime":176.36363636363637,"endTime":180.45454545454544,"audioSegment":0},{"text":"You see exactly what would run (including the full diff for file edits) and fire it,","startTime":180.45454545454544,"endTime":184.54545454545456,"audioSegment":0},{"text":"or dismiss it, right from the page.","startTime":184.54545454545456,"endTime":188.63636363636363,"audioSegment":0},{"text":"Nothing a report suggests ever runs on its own: firing is always your click,","startTime":188.63636363636363,"endTime":192.72727272727272,"audioSegment":0},{"text":"and Gezel records the resulting task and observed tool activity in History.","startTime":192.72727272727272,"endTime":196.8181818181818,"audioSegment":0},{"text":"For the Night Shift to run while the app is closed,","startTime":196.8181818181818,"endTime":200.9090909090909,"audioSegment":0},{"text":"enable the background service in Settings.","startTime":200.9090909090909,"endTime":205,"audioSegment":0}],"version":1},"startBlock":{"title":"The Night Shift: work your crew does while you sleep","subtitle":"The Night Shift is a window — 22:00 to 06:00 unless you change it in Settings — when your crew is allowed to work on things that don't need you. Reviews get written, indexes get refreshed, translations catch up. In the morning there's a report waiting instead of a backlog.","ambientMotion":"zoomIn"}}</script>
