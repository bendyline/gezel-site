dren":[{"type":"text","value":"Two things it will tell you plainly. If a file changed after the proposal was written — you edited it, or a teammate did — the proposal is marked ","position":{"start":{"line":53,"column":1,"offset":5189},"end":{"line":53,"column":147,"offset":5335}}},{"type":"strong","children":[{"type":"text","value":"out of date","position":{"start":{"line":53,"column":149,"offset":5337},"end":{"line":53,"column":160,"offset":5348}}}],"position":{"start":{"line":53,"column":147,"offset":5335},"end":{"line":53,"column":162,"offset":5350}}},{"type":"text","value":" and applying it asks you to confirm first, naming the files that moved. And if two proposals touch the same file, both say so, because applying one will put the other out of date.","position":{"start":{"line":53,"column":162,"offset":5350},"end":{"line":53,"column":342,"offset":5530}}}],"position":{"start":{"line":53,"column":1,"offset":5189},"end":{"line":53,"column":342,"offset":5530}}},{"type":"paragraph","children":[{"type":"text","value":"You can start the same thing by hand any time: open a file the Boekwachter has flagged, and hit ","position":{"start":{"line":55,"column":1,"offset":5532},"end":{"line":55,"column":97,"offset":5628}}},{"type":"strong","children":[{"type":"text","value":"Fix","position":{"start":{"line":55,"column":99,"offset":5630},"end":{"line":55,"column":102,"offset":5633}}}],"position":{"start":{"line":55,"column":97,"offset":5628},"end":{"line":55,"column":104,"offset":5635}}},{"type":"text","value":" on the issue. It doesn't wait for nightfall, and it produces the same reviewable proposal.","position":{"start":{"line":55,"column":104,"offset":5635},"end":{"line":55,"column":195,"offset":5726}}}],"position":{"start":{"line":55,"column":1,"offset":5532},"end":{"line":55,"column":195,"offset":5726}}},{"type":"paragraph","children":[{"type":"text","value":"If you'd rather your crew didn't do this, turn off nightly fixing in the project's settings. It's on by default only because you assembled a crew that can do it.","position":{"start":{"line":57,"column":1,"offset":5728},"end":{"line":57,"column":162,"offset":5889}}}],"position":{"start":{"line":57,"column":1,"offset":5728},"end":{"line":57,"column":162,"offset":5889}}}]},{"id":"the-morning-review","startTime":281,"duration":47,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"The morning review","position":{"start":{"line":59,"column":4,"offset":5894},"end":{"line":59,"column":22,"offset":5912}}}],"position":{"start":{"line":59,"column":1,"offset":5891},"end":{"line":59,"column":22,"offset":5912}}},"title":"The morning review","contents":[{"type":"paragraph","children":[{"type":"text","value":"When the window closes, gezel gathers what the shift accomplished and puts it where you'll see it: the moon menu grows a ","position":{"start":{"line":61,"column":1,"offset":5914},"end":{"line":61,"column":122,"offset":6035}}},{"type":"strong","children":[{"type":"text","value":"Done last night","position":{"start":{"line":61,"column":124,"offset":6037},"end":{"line":61,"column":139,"offset":6052}}}],"position":{"start":{"line":61,"column":122,"offset":6035},"end":{"line":61,"column":141,"offset":6054}}},{"type":"text","value":" list, the Home greeting gains a ","position":{"start":{"line":61,"column":141,"offset":6054},"end":{"line":61,"column":174,"offset":6087}}},{"type":"strong","children":[{"type":"text","value":"Last night","position":{"start":{"line":61,"column":176,"offset":6089},"end":{"line":61,"column":186,"offset":6099}}}],"position":{"start":{"line":61,"column":174,"offset":6087},"end":{"line":61,"column":188,"offset":6101}}},{"type":"text","value":" tab, and a single question card summarizes the night with links to every report and every change proposal waiting on you.","position":{"start":{"line":61,"column":188,"offset":6101},"end":{"line":61,"column":310,"offset":6223}}}],"position":{"start":{"line":61,"column":1,"offset":5914},"end":{"line":61,"column":310,"offset":6223}}},{"type":"paragraph","children":[{"type":"text","value":"Reports can go further than prose. A recommendation that is genuinely one click away — fire a craftbook, delegate a fix, apply a reviewed set of file edits — appears ","position":{"start":{"line":63,"column":1,"offset":6225},"end":{"line":63,"column":167,"offset":6391}}},{"type":"strong","children":[{"type":"text","value":"inside the report as an action card","position":{"start":{"line":63,"column":169,"offset":6393},"end":{"line":63,"column":204,"offset":6428}}}],"position":{"start":{"line":63,"column":167,"offset":6391},"end":{"line":63,"column":206,"offset":6430}}},{"type":"text","value":". You see exactly what would run (including the full diff for file edits) and fire it, or dismiss it, right from the page. Nothing a report suggests ever runs on its own: firing is always your click, and Gezel records the resulting task and observed tool activity in History.","position":{"start":{"line":63,"column":206,"offset":6430},"end":{"line":63,"column":481,"offset":6705}}}],"position":{"start":{"line":63,"column":1,"offset":6225},"end":{"line":63,"column":481,"offset":6705}}},{"type":"paragraph","children":[{"type":"text","value":"For the Night Shift to run while the app is closed, enable the background service in Settings.","position":{"start":{"line":65,"column":1,"offset":6707},"end":{"line":65,"column":95,"offset":6801}}}],"position":{"start":{"line":65,"column":1,"offset":6707},"end":{"line":65,"column":95,"offset":6801}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Night Shift is a window — 22:00 to 06:00 unless you change it in Settings —","startTime":0,"endTime":4.5,"audioSegment":0},{"text":"when your crew is allowed to work on things that don't need you.","startTime":4.5,"endTime":9,"audioSegment":0},{"text":"Reviews get written, indexes get refreshed, translations catch up.","startTime":9,"endTime":13.5,"audioSegment":0},{"text":"In the morning there's a report waiting instead of a backlog.","startTime":13.5,"endTime":18,"audioSegment":0},{"text":"The moon in the title bar shows when a shift is running and what it's working on.","startTime":18,"endTime":22.5,"audioSegment":0},{"text":"It also says when the period started and when it ends — a scheduled shift closes with its window, a manual one runs until the work is done —","startTime":22.5,"endTime":27,"audioSegment":0},{"text":"and keeps a running tally of what the shift has got through: tasks finished, files indexed and reviewed, files written, questions raised for you.","startTime":27,"endTime":31.5,"audioSegment":0},{"text":"During the day the same line tells you when the next window opens.","startTime":31.5,"endTime":36,"audioSegment":0},{"text":"You can start a shift manually too —","startTime":36,"endTime":40.5,"audioSegment":0},{"text":"stepping out for lunch is a perfectly good night.","startTime":40.5,"endTime":45,"audioSegment":0},{"text":"Some roles come with a standing suggestion for recurring work that suits them.","startTime":45,"endTime":47.90909090909091,"audioSegment":0},{"text":"Add a Chief Security Officer to a project, and they'll suggest a nightly security review;","startTime":47.90909090909091,"endTime":50.81818181818182,"audioSegment":0},{"text":"a Translator suggests keeping a translated shadow of your content in the project's designated language.","startTime":50.81818181818182,"endTime":53.72727272727273,"audioSegment":0},{"text":"The same goes for project types —","startTime":53.72727272727273,"endTime":56.63636363636364,"audioSegment":0},{"text":"a project set up for a job hunt suggests its weekly pipeline review.","startTime":56.63636363636364,"endTime":59.54545454545455,"audioSegment":0},{"text":"These are suggestions, never surprises: nothing runs until you turn it on.","startTime":59.54545454545455,"endTime":62.45454545454545,"audioSegment":0},{"text":"The toggles live with the crew list in each project's Settings,","startTime":62.45454545454545,"endTime":65.36363636363636,"audioSegment":0},{"text":"and appear the moment a suggesting role joins.","startTime":65.36363636363636,"endTime":68.27272727272728,"audioSegment":0},{"text":"Turning one off pauses it — your run history stays —","startTime":68.27272727272728,"endTime":71.18181818181819,"audioSegment":0},{"text":"and \"don't suggest this\" hides it for that project.","startTime":71.18181818181819,"endTime":74.0909090909091,"audioSegment":0},{"text":"Role Suggested craftbook When","startTime":74.0909090909091,"endTime":77,"audioSegment":0},{"text":"Boekwachter (Boekwachter) nightly-fix-sweep Night Shift, once per night","startTime":77,"endTime":79.9090909090909,"audioSegment":0},{"text":"Builder (Builder) bug-fix-tdd Night Shift, once per night","startTime":79.9090909090909,"endTime":82.81818181818181,"audioSegment":0},{"text":"Developer (Developer) bug-fix-tdd Night Shift, once per night","startTime":82.81818181818181,"endTime":85.72727272727272,"audioSegment":0},{"text":"Developer (Developer) test-suite-backfill Night Shift, once per night","startTime":85.72727272727272,"endTime":88.63636363636364,"audioSegment":0},{"text":"Omroeper (Omroeper) social-digest Night Shift, once per night","startTime":88.63636363636364,"endTime":91.54545454545455,"audioSegment":0},{"text":"Omroeper (Omroeper) reception-report on schedule (0 15 * * 1)","startTime":91.54545454545455,"endTime":94.45454545454545,"audioSegment":0},{"text":"Reviewer (Reviewer) codebase-refactoring-review Night Shift, once per night","startTime":94.45454545454545,"endTime":97.36363636363637,"audioSegment":0},{"text":"Reviewer (Reviewer) test-coverage-review Night Shift, once per night","startTime":97.36363636363637,"endTime":100.27272727272728,"audioSegment":0},{"text":"Veiligheidsmeester (Chief Security Officer) security-architecture-review Night Shift, once per night","startTime":100.27272727272728,"endTime":103.18181818181819,"audioSegment":0},{"text":"Veiligheidsmeester (Chief Security Officer) dependency-audit Night Shift, once per night","startTime":103.18181818181819,"endTime":106.0909090909091,"audioSegment":0},{"text":"Vertaler (Translator) translate-content Night Shift, once per night","startTime":106.0909090909091,"endTime":109,"audioSegment":0},{"text":"Night work is deliberately quiet-handed.","startTime":109,"endTime":113.28571428571429,"audioSegment":0},{"text":"The suggested craftbooks write reports, findings, and sidecar files — a security posture report in the artifacts drawer,","startTime":113.28571428571429,"endTime":117.57142857142857,"audioSegment":0},{"text":"translations beside the originals — rather than editing your work in place.","startTime":117.57142857142857,"endTime":121.85714285714286,"audioSegment":0},{"text":"Each enabled item runs at most once per night, inside the window.","startTime":121.85714285714286,"endTime":126.14285714285714,"audioSegment":0},{"text":"Its task transitions and tool completions that Gezel observes land in History like other work.","startTime":126.14285714285714,"endTime":130.42857142857142,"audioSegment":0},{"text":"Some values are shared across night work: the Translator's target language, for instance, is a project property —","startTime":130.42857142857142,"endTime":134.71428571428572,"audioSegment":0},{"text":"set once in project Settings (or the first time you enable the translation run) and reused by every run after that.","startTime":134.71428571428572,"endTime":139,"audioSegment":0},{"text":"Night work on a Claude, Codex, or Copilot subscription spends the same quota you use during the day,","startTime":139,"endTime":144.125,"audioSegment":0},{"text":"so the Night Shift keeps a quota reserve: by default it stops sending work to a subscription once you're within 20% of a quota, leaving the rest for you.","startTime":144.125,"endTime":149.25,"audioSegment":0},{"text":"You can adjust that floor in Settings → Night Shift, or add a daily reserve that scales with the time left —","startTime":149.25,"endTime":154.375,"audioSegment":0},{"text":"10% a day with four days until your quota resets keeps the last 40% for you.","startTime":154.375,"endTime":159.5,"audioSegment":0},{"text":"Work that's already running always finishes; only new work is held.","startTime":159.5,"endTime":164.625,"audioSegment":0},{"text":"Held work resumes on its own when a quota window resets (if the machine is awake) or the next night,","startTime":164.625,"endTime":169.75,"audioSegment":0},{"text":"and the moon menu says what's being protected and why.","startTime":169.75,"endTime":174.875,"audioSegment":0},{"text":"Gezels on local models spend nothing and are never held.","startTime":174.875,"endTime":180,"audioSegment":0},{"text":"A project with both a Boekwachter and a developer on its crew gets one more kind of night work: the Boekwachter finds problems in your files,","startTime":180,"endTime":183.15625,"audioSegment":0},{"text":"and overnight the developer works through them.","startTime":183.15625,"endTime":186.3125,"audioSegment":0},{"text":"What arrives in the morning is not a changed project.","startTime":186.3125,"endTime":189.46875,"audioSegment":0},{"text":"It's a set of change proposals — one per group of problems the developer judged worth fixing together,","startTime":189.46875,"endTime":192.625,"audioSegment":0},{"text":"each with the reasoning written out and the exact edits laid out line by line.","startTime":192.625,"endTime":195.78125,"audioSegment":0},{"text":"Your files are untouched.","startTime":195.78125,"endTime":198.9375,"audioSegment":0},{"text":"You read the proposal, look at the diff,","startTime":198.9375,"endTime":202.09375,"audioSegment":0},{"text":"and apply it if you agree.","startTime":202.09375,"endTime":205.25,"audioSegment":0},{"text":"That's deliberate,","startTime":205.25,"endTime":208.40625,"audioSegment":0},{"text":"and it has a useful consequence: it works on folders your crew isn't allowed to edit.","startTime":208.40625,"endTime":211.5625,"audioSegment":0},{"text":"You never have to hand over write access to get a fix drafted.","startTime":211.5625,"endTime":214.71875,"audioSegment":0},{"text":"It also works with nothing but the model on your own machine —","startTime":214.71875,"endTime":217.875,"audioSegment":0},{"text":"no network, no service, nobody's cloud.","startTime":217.875,"endTime":221.03125,"audioSegment":0},{"text":"Proposals live in the project's Proposals tab,","startTime":221.03125,"endTime":224.1875,"audioSegment":0},{"text":"which appears once there's something in it.","startTime":224.1875,"endTime":227.34375,"audioSegment":0},{"text":"Each one shows:","startTime":227.34375,"endTime":230.5,"audioSegment":0},{"text":"what the developer changed and why,","startTime":230.5,"endTime":233.65625,"audioSegment":0},{"text":"what they were unsure of, and how to check it","startTime":233.65625,"endTime":236.8125,"audioSegment":0},{"text":"every file it touches, with the diff","startTime":236.8125,"endTime":239.96875,"audioSegment":0},{"text":"Apply (all of it, or one file at a time),","startTime":239.96875,"endTime":243.125,"audioSegment":0},{"text":"Export (a zip of patches you can git apply yourself), or Dismiss","startTime":243.125,"endTime":246.28125,"audioSegment":0},{"text":"Two things it will tell you plainly.","startTime":246.28125,"endTime":249.4375,"audioSegment":0},{"text":"If a file changed after the proposal was written — you edited it, or a teammate did —","startTime":249.4375,"endTime":252.59375,"audioSegment":0},{"text":"the proposal is marked out of date and applying it asks you to confirm first, naming the files that moved.","startTime":252.59375,"endTime":255.75,"audioSegment":0},{"text":"And if two proposals touch the same file, both say so,","startTime":255.75,"endTime":258.90625,"audioSegment":0},{"text":"because applying one will put the other out of date.","startTime":258.90625,"endTime":262.0625,"audioSegment":0},{"text":"You can start the same thing by hand any time: open a file the Boekwachter has flagged,","startTime":262.0625,"endTime":265.21875,"audioSegment":0},{"text":"and hit Fix on the issue.","startTime":265.21875,"endTime":268.375,"audioSegment":0},{"text":"It doesn't wait for nightfall, and it produces the same reviewable proposal.","startTime":268.375,"endTime":271.53125,"audioSegment":0},{"text":"If you'd rather your crew didn't do this,","startTime":271.53125,"endTime":274.6875,"audioSegment":0},{"text":"turn off nightly fixing in the project's settings.","startTime":274.6875,"endTime":277.84375,"audioSegment":0},{"text":"It's on by default only because you assembled a crew that can do it.","startTime":277.84375,"endTime":281,"audioSegment":0},{"text":"When the window closes, gezel gathers what the shift accomplished and puts it where you'll see it: the moon menu grows a Done last night list,","startTime":281,"endTime":285.27272727272725,"audioSegment":0},{"text":"the Home greeting gains a Last night tab, and a single question card summarizes the night with links to every report and every change proposal waiting on you.","startTime":285.27272727272725,"endTime":289.54545454545456,"audioSegment":0},{"text":"Reports can go further than prose.","startTime":289.54545454545456,"endTime":293.8181818181818,"audioSegment":0},{"text":"A recommendation that is genuinely one click away — fire a craftbook, delegate a fix,","startTime":293.8181818181818,"endTime":298.09090909090907,"audioSegment":0},{"text":"apply a reviewed set of file edits — appears inside the report as an action card.","startTime":298.09090909090907,"endTime":302.3636363636364,"audioSegment":0},{"text":"You see exactly what would run (including the full diff for file edits) and fire it,","startTime":302.3636363636364,"endTime":306.6363636363636,"audioSegment":0},{"text":"or dismiss it, right from the page.","startTime":306.6363636363636,"endTime":310.9090909090909,"audioSegment":0},{"text":"Nothing a report suggests ever runs on its own: firing is always your click,","startTime":310.9090909090909,"endTime":315.1818181818182,"audioSegment":0},{"text":"and Gezel records the resulting task and observed tool activity in History.","startTime":315.1818181818182,"endTime":319.45454545454544,"audioSegment":0},{"text":"For the Night Shift to run while the app is closed,","startTime":319.45454545454544,"endTime":323.72727272727275,"audioSegment":0},{"text":"enable the background service in Settings.","startTime":323.72727272727275,"endTime":328,"audioSegment":0}],"version":1},"startBlock":{"title":"The Night Shift: work your crew does while you sleep","subtitle":"The Night Shift is a window — 22:00 to 06:00 unless you change it in Settings — when your crew is allowed to work on things that don't need you. Reviews get written, indexes get refreshed, translations catch up. In the morning there's a report waiting instead of a backlog.","ambientMotion":"zoomIn"}}</script>
