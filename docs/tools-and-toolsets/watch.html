pe":"text","value":" — lets a specialist hand work or questions UP to their voorman or the meester. Gated by the ","position":{"start":{"line":220,"column":166,"offset":14081},"end":{"line":220,"column":259,"offset":14174}}},{"type":"inlineCode","value":"tools.gezels-as-roles","position":{"start":{"line":220,"column":259,"offset":14174},"end":{"line":220,"column":282,"offset":14197}}},{"type":"text","value":" behavior.","position":{"start":{"line":220,"column":282,"offset":14197},"end":{"line":220,"column":292,"offset":14207}}}],"position":{"start":{"line":220,"column":1,"offset":13916},"end":{"line":220,"column":292,"offset":14207}}},{"type":"paragraph","children":[{"type":"text","value":"Tools: ","position":{"start":{"line":222,"column":1,"offset":14209},"end":{"line":222,"column":8,"offset":14216}}},{"type":"inlineCode","value":"delegate_voorman","position":{"start":{"line":222,"column":8,"offset":14216},"end":{"line":222,"column":26,"offset":14234}}},{"type":"text","value":", ","position":{"start":{"line":222,"column":26,"offset":14234},"end":{"line":222,"column":28,"offset":14236}}},{"type":"inlineCode","value":"consult_voorman","position":{"start":{"line":222,"column":28,"offset":14236},"end":{"line":222,"column":45,"offset":14253}}},{"type":"text","value":", ","position":{"start":{"line":222,"column":45,"offset":14253},"end":{"line":222,"column":47,"offset":14255}}},{"type":"inlineCode","value":"delegate_meester","position":{"start":{"line":222,"column":47,"offset":14255},"end":{"line":222,"column":65,"offset":14273}}},{"type":"text","value":", ","position":{"start":{"line":222,"column":65,"offset":14273},"end":{"line":222,"column":67,"offset":14275}}},{"type":"inlineCode","value":"consult_meester","position":{"start":{"line":222,"column":67,"offset":14275},"end":{"line":222,"column":84,"offset":14292}}}],"position":{"start":{"line":222,"column":1,"offset":14209},"end":{"line":222,"column":84,"offset":14292}}}]}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Tools are a gezel's hands: without them,","startTime":0,"endTime":3,"audioSegment":0},{"text":"an AI model can only talk.","startTime":3,"endTime":6,"audioSegment":0},{"text":"Gezel's tools are bundled into named groups, and each role carries the groups that fit its trade —","startTime":6,"endTime":9,"audioSegment":0},{"text":"a reviewer gets file reading, a developer gets file writing and code execution, a coordinator gets team management.","startTime":9,"endTime":12,"audioSegment":0},{"text":"You can add or remove groups per gezel,","startTime":12,"endTime":15,"audioSegment":0},{"text":"and third-party toolsets from the gilde catalog extend the set further.","startTime":15,"endTime":18,"audioSegment":0},{"text":"The public Gezel Gilde toolset catalog collects first-party toolsets,","startTime":18,"endTime":21,"audioSegment":0},{"text":"connector types, and ready-made project types in one place.","startTime":21,"endTime":24,"audioSegment":0},{"text":"Calls through Gezel's built-in tool groups are mediated by its policy,","startTime":24,"endTime":27,"audioSegment":0},{"text":"consent, and audit layers.","startTime":27,"endTime":30,"audioSegment":0},{"text":"Provider-native tools, approved package commands,","startTime":30,"endTime":33,"audioSegment":0},{"text":"and third-party MCP servers have different boundaries; the security model explains those exceptions.","startTime":33,"endTime":36,"audioSegment":0},{"text":"In any Toolsets panel,","startTime":36,"endTime":39.23809523809524,"audioSegment":0},{"text":"choose Add toolset → Custom MCP to import a local JSON file or paste its contents.","startTime":39.23809523809524,"endTime":42.476190476190474,"audioSegment":0},{"text":"Gezel understands both common configuration envelopes:","startTime":42.476190476190474,"endTime":45.714285714285715,"audioSegment":0},{"text":"VS Code workspace format: a top-level servers object.","startTime":45.714285714285715,"endTime":48.95238095238095,"audioSegment":0},{"text":"Claude/Cursor format: a top-level mcpServers object.","startTime":48.95238095238095,"endTime":52.19047619047619,"audioSegment":0},{"text":"Both local stdio servers and remote Streamable HTTP/SSE servers are supported.","startTime":52.19047619047619,"endTime":55.42857142857143,"audioSegment":0},{"text":"Imported environment values and HTTP headers go into Gezel's secret store rather than the ordinary installed-toolsets JSON.","startTime":55.42857142857143,"endTime":58.66666666666667,"audioSegment":0},{"text":"Provider-native MCP integrations that only accept local processes (currently Copilot and Claude CLI) load the stdio entries and skip hosted entries.","startTime":58.66666666666667,"endTime":61.904761904761905,"audioSegment":0},{"text":"For third-party options, the Gilde community directory is searchable by category.","startTime":61.904761904761905,"endTime":65.14285714285714,"audioSegment":0},{"text":"Review a community server before adding it to a crew;","startTime":65.14285714285714,"endTime":68.38095238095238,"audioSegment":0},{"text":"these entries are outside Gezel's first-party toolsets.","startTime":68.38095238095238,"endTime":71.61904761904762,"audioSegment":0},{"text":"A project can also declare its approved MCP toolsets as files in its working folder.","startTime":71.61904761904762,"endTime":74.85714285714286,"audioSegment":0},{"text":"Gezel discovers .gezel/mcp.json, .vscode/mcp.json, and the common root .mcp.json automatically.","startTime":74.85714285714286,"endTime":78.0952380952381,"audioSegment":0},{"text":"When names overlap, the Gezel-specific file wins,","startTime":78.0952380952381,"endTime":81.33333333333334,"audioSegment":0},{"text":"then VS Code, then the root file.","startTime":81.33333333333334,"endTime":84.57142857142857,"audioSegment":0},{"text":"Changing one of these files rebuilds that project's MCP bridges,","startTime":84.57142857142857,"endTime":87.80952380952381,"audioSegment":0},{"text":"so the new set applies on the next turn.","startTime":87.80952380952381,"endTime":91.04761904761905,"audioSegment":0},{"text":"Project-file discovery is project consent,","startTime":91.04761904761905,"endTime":94.28571428571428,"audioSegment":0},{"text":"not a way around the install-wide security posture: unconfined third-party MCP servers remain available only when non-builtin toolsets are enabled by Settings → Security & Compliance.","startTime":94.28571428571428,"endTime":97.52380952380952,"audioSegment":0},{"text":"VS Code ${input:…} prompt variables are not imported because they need an interactive value;","startTime":97.52380952380952,"endTime":100.76190476190476,"audioSegment":0},{"text":"use an environment variable or literal value instead.","startTime":100.76190476190476,"endTime":104,"audioSegment":0},{"text":"Search indexed project knowledge through one unified surface,","startTime":110,"endTime":112.75,"audioSegment":0},{"text":"plus persistent notes a gezel can recall and write back.","startTime":112.75,"endTime":115.5,"audioSegment":0},{"text":"The generic search spans workspace content, artifacts, project/gezel memory, and shared documents.","startTime":115.5,"endTime":118.25,"audioSegment":0},{"text":"Tools: search, knowledge_nearby, search_memory, save_memory, list_memories","startTime":118.25,"endTime":121,"audioSegment":0},{"text":"Read, list, search, and diff files in the project workspace,","startTime":121,"endTime":123.6,"audioSegment":0},{"text":"and retrieve a referenced Boekwachter issue's durable metadata.","startTime":123.6,"endTime":126.2,"audioSegment":0},{"text":"Mirrors Node's fs reads plus content/glob search.","startTime":126.2,"endTime":128.8,"audioSegment":0},{"text":"Diagnose-only — pair with workspace-fs-write to actually mutate.","startTime":128.8,"endTime":131.4,"audioSegment":0},{"text":"Tools: list_dir, read_file, read_files, stat, validate, grep_files, find_files, diff_files, get_file_issue","startTime":131.4,"endTime":134,"audioSegment":0},{"text":"Navigate and understand the codebase via the workspace index instead of reading whole files: outline a file's symbols,","startTime":134,"endTime":138,"audioSegment":0},{"text":"jump to a definition, read just one symbol's source, find usages, and map the repo.","startTime":138,"endTime":142,"audioSegment":0},{"text":"Every result carries line ranges so the model reads only the span it needs —","startTime":142,"endTime":146,"audioSegment":0},{"text":"a big context saver for small/medium local models.","startTime":146,"endTime":150,"audioSegment":0},{"text":"Tools: outline_file, find_symbol, read_symbol, find_references, map_repo, search_code, file_review, list_file_issues, set_file_issue_status","startTime":150,"endTime":154,"audioSegment":0},{"text":"Static security analysis pushed into the index and reused as tools: run a whole-repo scan (dependency inventory + opportunistic semgrep/osv-scanner/gitleaks), get a posture overview with candidate systemic themes,","startTime":154,"endTime":159.25,"audioSegment":0},{"text":"list findings by severity/category, map the attack surface (entry points, routes, auth boundaries, secret touchpoints), inventory dependencies with advisories, and trace import-graph reachability for source→sink flows.","startTime":159.25,"endTime":164.5,"audioSegment":0},{"text":"The substrate for a deep, systemic security review.","startTime":164.5,"endTime":169.75,"audioSegment":0},{"text":"Tools: security_scan, security_overview, scan_findings, map_attack_surface, list_dependencies, trace_taint","startTime":169.75,"endTime":175,"audioSegment":0},{"text":"Search and read office documents (Word, PDF, PowerPoint,","startTime":175,"endTime":177.6,"audioSegment":0},{"text":"Excel) that gezel has converted to markdown in the index.","startTime":177.6,"endTime":180.2,"audioSegment":0},{"text":"Keyword-search across a document corpus and read any document as scannable markdown on demand —","startTime":180.2,"endTime":182.8,"audioSegment":0},{"text":"no need to wrestle with binary files.","startTime":182.8,"endTime":185.4,"audioSegment":0},{"text":"Tools: search_docs, read_doc_as_markdown","startTime":185.4,"endTime":188,"audioSegment":0},{"text":"Navigate an indexed image library: search images by filename/caption/dimensions,","startTime":188,"endTime":190.5,"audioSegment":0},{"text":"summarize a folder of images for review or reorganizing, and find visually similar images.","startTime":190.5,"endTime":193,"audioSegment":0},{"text":"Built for folder-operations over large image collections.","startTime":193,"endTime":195.5,"audioSegment":0},{"text":"Tools: search_images, find_similar_images, describe_folder","startTime":195.5,"endTime":198,"audioSegment":0},{"text":"Cross-file entities the index resolved from structured metadata —","startTime":198,"endTime":200.2,"audioSegment":0},{"text":"email senders, document parties — and where each appears.","startTime":200.2,"endTime":202.4,"audioSegment":0},{"text":"Ask \"every email from X\" or \"every contract naming Y\" and get a dated,","startTime":202.4,"endTime":204.6,"audioSegment":0},{"text":"cross-file view.","startTime":204.6,"endTime":206.8,"audioSegment":0},{"text":"Tools: find_entity, list_entity_mentions","startTime":206.8,"endTime":209,"audioSegment":0},{"text":"Create, write, surgically edit, rename, and delete files in the project workspace.","startTime":209,"endTime":212.75,"audioSegment":0},{"text":"Always paired with workspace-fs-read for the roles that build (developer, designer, reviewer);","startTime":212.75,"endTime":216.5,"audioSegment":0},{"text":"split out so coordinator roles (voorman) can investigate without being tempted to do the building themselves.","startTime":216.5,"endTime":220.25,"audioSegment":0},{"text":"Tools: write_file, append_to_file, replace_in_file, replace_lines, apply_patch, insert_at_marker, copy_artifact_to_workspace, make_dir, delete_path, rename","startTime":220.25,"endTime":224,"audioSegment":0},{"text":"List and extract zip / tar archives in the workspace.","startTime":224,"endTime":226,"audioSegment":0},{"text":"Tools: list_archive, extract_archive","startTime":226,"endTime":228,"audioSegment":0},{"text":"Read and search shared documents and knowledge sources without changing the library.","startTime":228,"endTime":230.5,"audioSegment":0},{"text":"Tools: list_documents, read_document, search_documents","startTime":230.5,"endTime":233,"audioSegment":0},{"text":"Cross-project shared library — mission docs, guidelines,","startTime":233,"endTime":235.66666666666666,"audioSegment":0},{"text":"and any markdown the user wants every gezel to be able to find.","startTime":235.66666666666666,"endTime":238.33333333333334,"audioSegment":0},{"text":"Tools: list_documents, read_document, write_document, delete_document, search_documents","startTime":238.33333333333334,"endTime":241,"audioSegment":0},{"text":"Project-scoped read-write outputs (reports, scratch files, scripts a gezel produces,","startTime":241,"endTime":243.66666666666666,"audioSegment":0},{"text":"and large outputs auto-saved by tools that exceed the inline cap).","startTime":243.66666666666666,"endTime":246.33333333333334,"audioSegment":0},{"text":"Tools: list_artifacts, read_artifact, read_artifacts, write_artifact, grep_artifact","startTime":246.33333333333334,"endTime":249,"audioSegment":0},{"text":"Read a project's mirrored data tables with SQL.","startTime":249,"endTime":253,"audioSegment":0},{"text":"list_tables shows what is there, describe_table explains a table's columns and units, and query_table runs one read-only query and returns the answer —","startTime":253,"endTime":257,"audioSegment":0},{"text":"never the underlying rows, which is what lets a table be far larger than the context window.","startTime":257,"endTime":261,"audioSegment":0},{"text":"Tools: list_tables, describe_table, query_table","startTime":261,"endTime":265,"audioSegment":0},{"text":"Create, assign, advance, and report on tasks.","startTime":265,"endTime":268,"audioSegment":0},{"text":"The full task surface including notes, steps, and child instance spawning.","startTime":268,"endTime":271,"audioSegment":0},{"text":"Tools: list_tasks, get_task, list_craftbooks, suggest_craftbook, import_skill, create_task, start_plan, invoke_craftbook, update_task, set_outcomes, verify_outcome,","startTime":271,"endTime":274,"audioSegment":0},{"text":"add_verification_step, set_task_status, activate_task, list_task_children, add_task_step, advance_task_step, assign_task, read_task_notes, write_task_note, spawn_task_instances","startTime":274,"endTime":277,"audioSegment":0},{"text":"Read and write a whole craftbook, add/remove/reorder steps,","startTime":277,"endTime":280,"audioSegment":0},{"text":"set the entry step, and attach focused deliverable gates.","startTime":280,"endTime":283,"audioSegment":0},{"text":"craftbook_write is the atomic create/replace path;","startTime":283,"endTime":286,"audioSegment":0},{"text":"the large surgical update schema is loaded only inside an explicit craftbook-editing session.","startTime":286,"endTime":289,"audioSegment":0},{"text":"The unified surface targets either a task's embedded craftbook or a standalone local template.","startTime":289,"endTime":292,"audioSegment":0},{"text":"Tools: craftbook_read, craftbook_write, craftbook_add_step, set_step_deliverable, craftbook_remove_step, craftbook_reorder_steps, craftbook_set_entry, craftbook_update, export_task_craftbook","startTime":292,"endTime":295,"audioSegment":0},{"text":"Read-only task surface for delegation roles —","startTime":295,"endTime":297.8333333333333,"audioSegment":0},{"text":"list tasks, inspect a specific task, read its notes.","startTime":297.8333333333333,"endTime":300.6666666666667,"audioSegment":0},{"text":"The \"ping projects to see status\" subset, without any of the mutation tools (create,","startTime":300.6666666666667,"endTime":303.5,"audioSegment":0},{"text":"update, assign, status, advance) that belong to the assignee or voorman.","startTime":303.5,"endTime":306.3333333333333,"audioSegment":0},{"text":"Pair with team-management for a complete delegation surface.","startTime":306.3333333333333,"endTime":309.1666666666667,"audioSegment":0},{"text":"Tools: list_tasks, get_task, list_craftbooks, suggest_craftbook, read_task_notes","startTime":309.1666666666667,"endTime":312,"audioSegment":0},{"text":"Coordinator controls for running work: pause,","startTime":312,"endTime":314.2,"audioSegment":0},{"text":"resume or cancel a task, reassign it, and leave it a note.","startTime":314.2,"endTime":316.4,"audioSegment":0},{"text":"Deliberately excludes authoring, advancing and completing —","startTime":316.4,"endTime":318.6,"audioSegment":0},{"text":"those stay with the assignee and its step gates.","startTime":318.6,"endTime":320.8,"audioSegment":0},{"text":"Tools: manage_task, assign_task, write_task_note","startTime":320.8,"endTime":323,"audioSegment":0},{"text":"Procedure-first task launch surface for coordinators: rank applicable craftbooks and invoke a selected recipe after its required setup is ready.","startTime":323,"endTime":326.5,"audioSegment":0},{"text":"Tools: list_craftbooks, suggest_craftbook, invoke_craftbook","startTime":326.5,"endTime":330,"audioSegment":0},{"text":"Spin up other gezels, message them, browse the gilde of templates,","startTime":330,"endTime":332.4,"audioSegment":0},{"text":"and manage projects + project membership.","startTime":332.4,"endTime":334.8,"audioSegment":0},{"text":"The Meester surface.","startTime":334.8,"endTime":337.2,"audioSegment":0},{"text":"Tools: list_gezels, create_gezel, update_gezel, ensure_gezel, message_gezel, list_projects, start_project, fetch_repo, fetch_diff, update_project, list_gilde, list_project_types,","startTime":337.2,"endTime":339.6,"audioSegment":0},{"text":"apply_project_type, start_project_from_type, list_project_gezels, add_gezel_to_project, remove_gezel_from_project, list_suggested_work, enable_suggested_work, disable_suggested_work","startTime":339.6,"endTime":342,"audioSegment":0},{"text":"Package a configured project into a shareable .gezapp bundle and install one back.","startTime":342,"endTime":345.4,"audioSegment":0},{"text":"Deliberately in no role default: this is a distribution chore the user drives from Settings or the gezel app CLI,","startTime":345.4,"endTime":348.8,"audioSegment":0},{"text":"not something a gezel reaches for mid-conversation.","startTime":348.8,"endTime":352.2,"audioSegment":0},{"text":"Install it on a gezel whose actual job is publishing app bundles.","startTime":352.2,"endTime":355.6,"audioSegment":0},{"text":"Tools: export_ai_app, import_ai_app","startTime":355.6,"endTime":359,"audioSegment":0},{"text":"Speech-to-text (transcribe_audio) and text-to-speech (synthesize_speech).","startTime":359,"endTime":360.6666666666667,"audioSegment":0},{"text":"Heavy — only useful for gezels that do voice work.","startTime":360.6666666666667,"endTime":362.3333333333333,"audioSegment":0},{"text":"Tools: transcribe_audio, synthesize_speech","startTime":362.3333333333333,"endTime":364,"audioSegment":0},{"text":"Run Node scripts, npm install, run package scripts, invoke npx.","startTime":364,"endTime":366.6666666666667,"audioSegment":0},{"text":"Sandboxed to the project workspace.","startTime":366.6666666666667,"endTime":369.3333333333333,"audioSegment":0},{"text":"Tools: run_nodejs_script, derive_file, npm_install, run_npx, run_installed_script, run_package_script, list_packages, list_package_scripts, list_scripts, get_script_run","startTime":369.3333333333333,"endTime":372,"audioSegment":0},{"text":"Drive a headless Chromium via Playwright scripts.","startTime":372,"endTime":374,"audioSegment":0},{"text":"Heavy — only useful for gezels that genuinely need browser work.","startTime":374,"endTime":376,"audioSegment":0},{"text":"Tools: run_playwright_script","startTime":376,"endTime":378,"audioSegment":0},{"text":"Run read-only git commands inside the project workspace, inspect GitHub pull requests,","startTime":378,"endTime":381.6666666666667,"audioSegment":0},{"text":"post review comments, open PRs, and check workflow status for linked project repositories.","startTime":381.6666666666667,"endTime":385.3333333333333,"audioSegment":0},{"text":"Tools: run_git, github_pr_list, github_pr_view, github_pr_files, github_pr_file, github_pr_diff, github_pr_comments, github_pr_comment, github_pr_create, github_workflow_runs, github_check_status","startTime":385.3333333333333,"endTime":389,"audioSegment":0},{"text":"Search the web (when a keyed backend like Brave is configured) or Wikipedia, fetch URL contents,","startTime":389,"endTime":392.57142857142856,"audioSegment":0},{"text":"and find interactive elements on a browser-controlled page (after a Playwright navigate / click / type).","startTime":392.57142857142856,"endTime":396.14285714285717,"audioSegment":0},{"text":"web_search only registers when a real keyed backend is configured;","startTime":396.14285714285717,"endTime":399.7142857142857,"audioSegment":0},{"text":"wikipedia_search / wikipedia_read only register for non-cloud models (cloud models already have Wikipedia in training).","startTime":399.7142857142857,"endTime":403.2857142857143,"audioSegment":0},{"text":"Wikipedia search results arrive with article lead text already included,","startTime":403.2857142857143,"endTime":406.85714285714283,"audioSegment":0},{"text":"so reading a result does not need a follow-up fetch.","startTime":406.85714285714283,"endTime":410.42857142857144,"audioSegment":0},{"text":"Tools: web_search, wikipedia_search, wikimedia_image_search, wikipedia_read, fetch_url, browser_find_page_element","startTime":410.42857142857144,"endTime":414,"audioSegment":0},{"text":"Render charts/diagrams, read and describe existing images,","startTime":414,"endTime":416.3333333333333,"audioSegment":0},{"text":"and generate new images via the configured image model.","startTime":416.3333333333333,"endTime":418.6666666666667,"audioSegment":0},{"text":"Tools: render_image, read_image_as_base64, generate_image, describe_image, read_image_metadata","startTime":418.6666666666667,"endTime":421,"audioSegment":0},{"text":"Generate short video clips via the configured local video model (LTX / WAN).","startTime":421,"endTime":423.5,"audioSegment":0},{"text":"Tools: generate_video","startTime":423.5,"endTime":426,"audioSegment":0},{"text":"Search the install-wide audit log of who did what and when,","startTime":426,"endTime":427.6666666666667,"audioSegment":0},{"text":"plus past chat transcripts.","startTime":427.6666666666667,"endTime":429.3333333333333,"audioSegment":0},{"text":"Tools: search_history, search_sessions","startTime":429.3333333333333,"endTime":431,"audioSegment":0},{"text":"Consult gezel's built-in documentation for meta questions about gezel itself —","startTime":431,"endTime":433.75,"audioSegment":0},{"text":"roles, craftbooks, projects, memory, models, setup.","startTime":433.75,"endTime":436.5,"audioSegment":0},{"text":"In every role's kit so a gezel answers 'how does gezel work?' from the real docs instead of guessing.","startTime":436.5,"endTime":439.25,"audioSegment":0},{"text":"Tools: how_do_i","startTime":439.25,"endTime":442,"audioSegment":0},{"text":"Ask an existing gezel or a specialist for advice to bring back into the conversation.","startTime":442,"endTime":445,"audioSegment":0},{"text":"Tools: list_gezels, ask_gezel, ask_specialist","startTime":445,"endTime":448,"audioSegment":0},{"text":"Pose a structured question mid-turn — to the user (ask_user_question), to a specific gezel (ask_gezel),","startTime":448,"endTime":451,"audioSegment":0},{"text":"or to a role-shaped specialist (ask_specialist) — instead of guessing.","startTime":451,"endTime":454,"audioSegment":0},{"text":"Tools: ask_user_question, ask_gezel, ask_specialist","startTime":454,"endTime":457,"audioSegment":0},{"text":"Hand work to a teammate by ROLE instead of by name: delegate_<role> (async hand-off) and consult_<role> (sync question) for each doer role —","startTime":457,"endTime":459.8888888888889,"audioSegment":0},{"text":"developer, designer, reviewer, planner, researcher, builder, writer, image-generator.","startTime":459.8888888888889,"endTime":462.77777777777777,"audioSegment":0},{"text":"The target lives in the tool identity (no free-text gezel/role argument),","startTime":462.77777777777777,"endTime":465.6666666666667,"audioSegment":0},{"text":"which small/medium local models route far more reliably.","startTime":465.6666666666667,"endTime":468.55555555555554,"audioSegment":0},{"text":"Each resolves to the project gezel of that role,","startTime":468.55555555555554,"endTime":471.44444444444446,"audioSegment":0},{"text":"creating one on demand.","startTime":471.44444444444446,"endTime":474.3333333333333,"audioSegment":0},{"text":"Orchestrator (meester/voorman) surface; gated by the tools.gezels-as-roles behavior.","startTime":474.3333333333333,"endTime":477.22222222222223,"audioSegment":0},{"text":"Tools: delegate_developer, consult_developer, delegate_designer, consult_designer, delegate_reviewer, consult_reviewer, delegate_planner, consult_planner,","startTime":477.22222222222223,"endTime":480.1111111111111,"audioSegment":0},{"text":"delegate_researcher, consult_researcher, delegate_builder, consult_builder, delegate_writer, consult_writer, delegate_image_generator, consult_image_generator","startTime":480.1111111111111,"endTime":483,"audioSegment":0},{"text":"Reach a coordination role by ROLE: delegate_voorman / consult_voorman and delegate_meester / consult_meester.","startTime":483,"endTime":485.6,"audioSegment":0},{"text":"The escalation counterpart to role-delegation —","startTime":485.6,"endTime":488.2,"audioSegment":0},{"text":"lets a specialist hand work or questions UP to their voorman or the meester.","startTime":488.2,"endTime":490.8,"audioSegment":0},{"text":"Gated by the tools.gezels-as-roles behavior.","startTime":490.8,"endTime":493.4,"audioSegment":0},{"text":"Tools: delegate_voorman, consult_voorman, delegate_meester, consult_meester","startTime":493.4,"endTime":496,"audioSegment":0}],"version":1},"startBlock":{"title":"Tools and toolsets","subtitle":"Tools are a gezel's hands: without them, an AI model can only talk. Gezel's tools are bundled into named groups, and each role carries the groups that fit its trade — a reviewer gets file reading, a developer gets file writing and code execution, a coordinator gets team management. You can add or remove groups per gezel, and third-party toolsets from the gilde catalog extend the set further.","ambientMotion":"zoomIn"}}</script>
