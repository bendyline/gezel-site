":"paragraph","children":[{"type":"text","value":"Show distinct loading, empty, permission-denied, unavailable, partial-result, and failed-action states. Keep useful content visible when an optional capability fails; a data dashboard can still list files without DuckDB, and a gallery can still list a file whose codec cannot play. Tell the person when a listing or query is truncated, or when a chart describes an indexed snapshot rather than the latest file bytes.","position":{"start":{"line":134,"column":1,"offset":10959},"end":{"line":134,"column":417,"offset":11375}}}],"position":{"start":{"line":134,"column":1,"offset":10959},"end":{"line":134,"column":417,"offset":11375}}},{"type":"paragraph","children":[{"type":"text","value":"Use ","position":{"start":{"line":136,"column":1,"offset":11377},"end":{"line":136,"column":5,"offset":11381}}},{"type":"inlineCode","value":"textContent","position":{"start":{"line":136,"column":5,"offset":11381},"end":{"line":136,"column":18,"offset":11394}}},{"type":"text","value":" for filenames and data labels. Read files through ","position":{"start":{"line":136,"column":18,"offset":11394},"end":{"line":136,"column":69,"offset":11445}}},{"type":"inlineCode","value":"gezel.data","position":{"start":{"line":136,"column":69,"offset":11445},"end":{"line":136,"column":81,"offset":11457}}},{"type":"text","value":", use ","position":{"start":{"line":136,"column":81,"offset":11457},"end":{"line":136,"column":87,"offset":11463}}},{"type":"inlineCode","value":"data.url()","position":{"start":{"line":136,"column":87,"offset":11463},"end":{"line":136,"column":99,"offset":11475}}},{"type":"text","value":" for media, and use declared tools for writes. Debounce refreshes, limit rendered cards, unsubscribe watches, stop players on close, and ignore stale asynchronous results after a selection changes.","position":{"start":{"line":136,"column":99,"offset":11475},"end":{"line":136,"column":296,"offset":11672}}}],"position":{"start":{"line":136,"column":1,"offset":11377},"end":{"line":136,"column":296,"offset":11672}}},{"type":"paragraph","children":[{"type":"text","value":"Standalone samples must be clearly labeled and deterministic. Keep their mutations in memory and provide Reset demo. Never substitute sample data after a live permission or query failure. The ","position":{"start":{"line":138,"column":1,"offset":11674},"end":{"line":138,"column":193,"offset":11866}}},{"type":"link","url":"../gezel-page-apis/","children":[{"type":"text","value":"page API guide","position":{"start":{"line":138,"column":194,"offset":11867},"end":{"line":138,"column":208,"offset":11881}}}],"position":{"start":{"line":138,"column":193,"offset":11866},"end":{"line":138,"column":230,"offset":11903}}},{"type":"text","value":" describes the host modes and the shared demo bootstrap.","position":{"start":{"line":138,"column":230,"offset":11903},"end":{"line":138,"column":286,"offset":11959}}}],"position":{"start":{"line":138,"column":1,"offset":11674},"end":{"line":138,"column":286,"offset":11959}}},{"type":"paragraph","children":[{"type":"text","value":"Before delivery, inspect light and dark mode, keyboard focus, long labels, an empty folder, a failed operation, narrow layouts, and the real host flow. Structural validation cannot establish that a page is usable.","position":{"start":{"line":140,"column":1,"offset":11961},"end":{"line":140,"column":214,"offset":12174}}}],"position":{"start":{"line":140,"column":1,"offset":11961},"end":{"line":140,"column":214,"offset":12174}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"An app page should feel like part of Gezel: readable,","startTime":0,"endTime":3.8333333333333335,"audioSegment":0},{"text":"warm, and focused on the person's work.","startTime":3.8333333333333335,"endTime":7.666666666666667,"audioSegment":0},{"text":"This guide applies to the HTML/CSS/JavaScript pages declared by a project type's pages block.","startTime":7.666666666666667,"endTime":11.5,"audioSegment":0},{"text":"Start with Building AI Apps inside Gezel for the composition and Using the Gezel page APIs for behavior.","startTime":11.5,"endTime":15.333333333333334,"audioSegment":0},{"text":"The app UX guide says how an app is organized: Home and noun tabs,","startTime":15.333333333333334,"endTime":19.166666666666668,"audioSegment":0},{"text":"actions as keys that open dialogs, and actions on the records themselves.","startTime":19.166666666666668,"endTime":23,"audioSegment":0},{"text":"Gezel injects a shared typography stylesheet into hosted project-type HTML,","startTime":23,"endTime":25.586206896551722,"audioSegment":0},{"text":"before the page's own styles.","startTime":25.586206896551722,"endTime":28.17241379310345,"audioSegment":0},{"text":"This works in desktop previews, app-serve, and the phone's offline page snapshot.","startTime":28.17241379310345,"endTime":30.758620689655174,"audioSegment":0},{"text":"It includes local font faces and these roles:","startTime":30.758620689655174,"endTime":33.3448275862069,"audioSegment":0},{"text":"Role Default Applied automatically to","startTime":33.3448275862069,"endTime":35.93103448275862,"audioSegment":0},{"text":"--font-body Hanken Grotesk, with system sans fallbacks The document root;","startTime":35.93103448275862,"endTime":38.51724137931035,"audioSegment":0},{"text":"ordinary body text inherits it","startTime":38.51724137931035,"endTime":41.10344827586207,"audioSegment":0},{"text":"--font-ui Hanken Grotesk, with system sans fallbacks Buttons,","startTime":41.10344827586207,"endTime":43.689655172413794,"audioSegment":0},{"text":"inputs, selects, textareas, options, and option groups","startTime":43.689655172413794,"endTime":46.275862068965516,"audioSegment":0},{"text":"--font-heading PT Serif, with serif fallbacks h1 through h6","startTime":46.275862068965516,"endTime":48.86206896551724,"audioSegment":0},{"text":"--font-display The heading family Compatibility alias used by --font-heading","startTime":48.86206896551724,"endTime":51.44827586206897,"audioSegment":0},{"text":"Hanken Grotesk has normal weights 400,","startTime":51.44827586206897,"endTime":54.03448275862069,"audioSegment":0},{"text":"500, 600, and 700 plus 400 italic.","startTime":54.03448275862069,"endTime":56.62068965517241,"audioSegment":0},{"text":"PT Serif has normal 400 and 700 plus 400 italic.","startTime":56.62068965517241,"endTime":59.20689655172414,"audioSegment":0},{"text":"Use those weights rather than requesting an intermediate serif weight that the browser must synthesize.","startTime":59.20689655172414,"endTime":61.793103448275865,"audioSegment":0},{"text":"Do not copy fonts, licenses, @font-face declarations,","startTime":61.793103448275865,"endTime":64.37931034482759,"audioSegment":0},{"text":"or a font CDN into each app.","startTime":64.37931034482759,"endTime":66.9655172413793,"audioSegment":0},{"text":"Gezel owns the hosted font assets.","startTime":66.9655172413793,"endTime":69.55172413793103,"audioSegment":0},{"text":"The defaults use low-specificity :where() selectors,","startTime":69.55172413793103,"endTime":72.13793103448276,"audioSegment":0},{"text":"so your authored styles can override them.","startTime":72.13793103448276,"endTime":74.72413793103448,"audioSegment":0},{"text":"A font: … system-ui shorthand on body also overrides them;","startTime":74.72413793103448,"endTime":77.3103448275862,"audioSegment":0},{"text":"avoid that accidental reset.","startTime":77.3103448275862,"endTime":79.89655172413794,"audioSegment":0},{"text":"The host supplies typography and an opt-in component kit,","startTime":79.89655172413794,"endTime":82.48275862068965,"audioSegment":0},{"text":"not a complete CSS framework.","startTime":82.48275862068965,"endTime":85.06896551724138,"audioSegment":0},{"text":"It does not inject the shell's color palette, spacing or radius tokens, a CSS reset,","startTime":85.06896551724138,"endTime":87.65517241379311,"audioSegment":0},{"text":"a body margin reset, a type size scale, general button styling, a chart library, or page layouts.","startTime":87.65517241379311,"endTime":90.24137931034483,"audioSegment":0},{"text":"Variables such as --bg and classes such as .primary have no built-in meaning inside the page.","startTime":90.24137931034483,"endTime":92.82758620689656,"audioSegment":0},{"text":"Define the ones your page uses.","startTime":92.82758620689656,"endTime":95.41379310344828,"audioSegment":0},{"text":"Shell CSS does not inherit through the sandboxed iframe.","startTime":95.41379310344828,"endTime":98,"audioSegment":0},{"text":"For a full application workspace,","startTime":98,"endTime":100.63934426229508,"audioSegment":0},{"text":"ui.components.appLayout wraps the existing main content and adds a responsive fullscreen conversation.","startTime":100.63934426229508,"endTime":103.27868852459017,"audioSegment":0},{"text":"It keeps the page mounted on restore, provides a conversation toggle,","startTime":103.27868852459017,"endTime":105.91803278688525,"audioSegment":0},{"text":"and suppresses its native chat slot while a page dialog is open.","startTime":105.91803278688525,"endTime":108.55737704918033,"audioSegment":0},{"text":"Use a specific companion title and a short description of useful work the person can do together.","startTime":108.55737704918033,"endTime":111.19672131147541,"audioSegment":0},{"text":"A file-only app can pass chat: false.","startTime":111.19672131147541,"endTime":113.8360655737705,"audioSegment":0},{"text":"Keep the content usable in the ordinary pane as well.","startTime":113.8360655737705,"endTime":116.47540983606558,"audioSegment":0},{"text":"In a standalone demo the same slot holds the sample conversation, drawn to match Gezel's chat: replies in the heading serif, the visitor's messages in an accent-tinted bubble,","startTime":116.47540983606558,"endTime":119.11475409836066,"audioSegment":0},{"text":"each tool the companion uses as a quiet step row with a check, and suggestions as bare keys under the conversation (one scrolling row on narrow screens).","startTime":119.11475409836066,"endTime":121.75409836065575,"audioSegment":0},{"text":"It lives in the component's shadow root,","startTime":121.75409836065575,"endTime":124.39344262295083,"audioSegment":0},{"text":"so restyle it only through the --gezel-component-* properties below.","startTime":124.39344262295083,"endTime":127.0327868852459,"audioSegment":0},{"text":"Keep its copy in the role's voice: short,","startTime":127.0327868852459,"endTime":129.672131147541,"audioSegment":0},{"text":"specific, American English, no emojis.","startTime":129.672131147541,"endTime":132.31147540983608,"audioSegment":0},{"text":"Use actionForm for declared edits: presentation: 'dialog' for an action key that opens a modal,","startTime":132.31147540983608,"endTime":134.95081967213116,"audioSegment":0},{"text":"'inline' for a settings panel.","startTime":134.95081967213116,"endTime":137.59016393442624,"audioSegment":0},{"text":"Use tabs for a workspace's Home, noun, and Settings panels,","startTime":137.59016393442624,"endTime":140.22950819672133,"audioSegment":0},{"text":"and collectionFilter for search over long lists of rendered records.","startTime":140.22950819672133,"endTime":142.8688524590164,"audioSegment":0},{"text":"These components supply controls and state handling, while the app owns field labels,","startTime":142.8688524590164,"endTime":145.5081967213115,"audioSegment":0},{"text":"domain data, allowed actions, and refresh behavior.","startTime":145.5081967213115,"endTime":148.14754098360658,"audioSegment":0},{"text":"Avoid duplicating the host's composer or building a separate persistence store.","startTime":148.14754098360658,"endTime":150.78688524590166,"audioSegment":0},{"text":"See workspace components.","startTime":150.78688524590166,"endTime":153.4262295081967,"audioSegment":0},{"text":"For a responsive game or other app,","startTime":153.4262295081967,"endTime":156.0655737704918,"audioSegment":0},{"text":"use gezel.ui.layout / ui.onLayout and data-gezel-fullscreen to adapt when the Output pane expands.","startTime":156.0655737704918,"endTime":158.70491803278688,"audioSegment":0},{"text":"Native chat slots use ui.components.chat;","startTime":158.70491803278688,"endTime":161.34426229508196,"audioSegment":0},{"text":"size their containing rectangle in page CSS and choose their controls through options.","startTime":161.34426229508196,"endTime":163.98360655737704,"audioSegment":0},{"text":"They inherit the shell's theme and fonts, not page CSS overrides.","startTime":163.98360655737704,"endTime":166.62295081967213,"audioSegment":0},{"text":"See fullscreen and chat for the layout example and clipping constraints.","startTime":166.62295081967213,"endTime":169.2622950819672,"audioSegment":0},{"text":"Prefer gezel.ui.components.fileCard for a file tile/row and fileAdder for uploads.","startTime":169.2622950819672,"endTime":171.9016393442623,"audioSegment":0},{"text":"The page API guide covers mounting, lifecycle,","startTime":171.9016393442623,"endTime":174.54098360655738,"audioSegment":0},{"text":"permission declarations and standalone demo setup.","startTime":174.54098360655738,"endTime":177.18032786885246,"audioSegment":0},{"text":"Both ship their own shadow-root styles, native buttons,","startTime":177.18032786885246,"endTime":179.81967213114754,"audioSegment":0},{"text":"focus outlines, status messages and light/dark colors.","startTime":179.81967213114754,"endTime":182.45901639344262,"audioSegment":0},{"text":"They inherit the host's --font-ui;","startTime":182.45901639344262,"endTime":185.0983606557377,"audioSegment":0},{"text":"published and exported demos receive the same fonts.","startTime":185.0983606557377,"endTime":187.7377049180328,"audioSegment":0},{"text":"A page's broad button or img rules do not change component internals.","startTime":187.7377049180328,"endTime":190.37704918032787,"audioSegment":0},{"text":"Pages own the containing grid/list, spacing and breakpoints.","startTime":190.37704918032787,"endTime":193.01639344262296,"audioSegment":0},{"text":"Choose variant: 'tile' or 'row'; use update when changing layouts.","startTime":193.01639344262296,"endTime":195.65573770491804,"audioSegment":0},{"text":"Keep filenames as the primary label and preserve keyboard access.","startTime":195.65573770491804,"endTime":198.29508196721312,"audioSegment":0},{"text":"The adder states where files go and what was saved,","startTime":198.29508196721312,"endTime":200.9344262295082,"audioSegment":0},{"text":"so do not hide that destination or status.","startTime":200.9344262295082,"endTime":203.5737704918033,"audioSegment":0},{"text":"Optional CSS custom properties on the mount element are --gezel-component-text, --gezel-component-surface,","startTime":203.5737704918033,"endTime":206.21311475409834,"audioSegment":0},{"text":"--gezel-component-border, --gezel-component-muted, and --gezel-component-accent.","startTime":206.21311475409834,"endTime":208.85245901639342,"audioSegment":0},{"text":"Set both light and dark values if overriding them,","startTime":208.85245901639342,"endTime":211.4918032786885,"audioSegment":0},{"text":"and maintain contrast and a visible focus outline.","startTime":211.4918032786885,"endTime":214.1311475409836,"audioSegment":0},{"text":"No copied fonts, CSS framework,","startTime":214.1311475409836,"endTime":216.77049180327867,"audioSegment":0},{"text":"external icon service or per-app component fork is needed.","startTime":216.77049180327867,"endTime":219.40983606557376,"audioSegment":0},{"text":"Ordinary workspace/artifact HTML keeps its own styles.","startTime":219.40983606557376,"endTime":222.04918032786884,"audioSegment":0},{"text":"The demo publisher/exporter supplies the same typography and components.","startTime":222.04918032786884,"endTime":224.68852459016392,"audioSegment":0},{"text":"Keep system fallbacks for degraded rendering without bundling a second font set into app source: body {","startTime":224.68852459016392,"endTime":227.327868852459,"audioSegment":0},{"text":"font-family: var(--font-body, system-ui, sans-serif);","startTime":227.327868852459,"endTime":229.9672131147541,"audioSegment":0},{"text":"font-size: 1rem;","startTime":229.9672131147541,"endTime":232.60655737704917,"audioSegment":0},{"text":"line-height: 1.5; }","startTime":232.60655737704917,"endTime":235.24590163934425,"audioSegment":0},{"text":"h1, h2, h3, h4, h5, h6 {","startTime":235.24590163934425,"endTime":237.88524590163934,"audioSegment":0},{"text":"font-family: var(--font-heading, Georgia, serif);","startTime":237.88524590163934,"endTime":240.52459016393442,"audioSegment":0},{"text":"font-weight: 400; }","startTime":240.52459016393442,"endTime":243.1639344262295,"audioSegment":0},{"text":"button, input, select, textarea {","startTime":243.1639344262295,"endTime":245.80327868852459,"audioSegment":0},{"text":"font-family: var(--font-ui, system-ui, sans-serif);","startTime":245.80327868852459,"endTime":248.44262295081967,"audioSegment":0},{"text":"font-size: inherit; }","startTime":248.44262295081967,"endTime":251.08196721311475,"audioSegment":0},{"text":"The implementation contract is in the typography roles,","startTime":251.08196721311475,"endTime":253.72131147540983,"audioSegment":0},{"text":"the injected defaults, and the font builder.","startTime":253.72131147540983,"endTime":256.3606557377049,"audioSegment":0},{"text":"Update this guide when that contract changes.","startTime":256.3606557377049,"endTime":259,"audioSegment":0},{"text":"Use parchment and warm ink in light mode,","startTime":259,"endTime":260.49056603773585,"audioSegment":0},{"text":"dark neutral surfaces in dark mode, and terracotta for actions.","startTime":260.49056603773585,"endTime":261.9811320754717,"audioSegment":0},{"text":"Sage is an identity color.","startTime":261.9811320754717,"endTime":263.47169811320754,"audioSegment":0},{"text":"Use semantic variables in component rules;","startTime":263.47169811320754,"endTime":264.9622641509434,"audioSegment":0},{"text":"retain content colors for photographs, illustrations, charts, and other data.","startTime":264.9622641509434,"endTime":266.45283018867923,"audioSegment":0},{"text":"Use both the system preference and the host theme.","startTime":266.45283018867923,"endTime":267.9433962264151,"audioSegment":0},{"text":"The media query gives the page a correct initial appearance and supports a raw standalone demo.","startTime":267.9433962264151,"endTime":269.4339622641509,"audioSegment":0},{"text":"An explicit host theme should win over the operating system preference.","startTime":269.4339622641509,"endTime":270.92452830188677,"audioSegment":0},{"text":"This small starter uses the shell's palette values,","startTime":270.92452830188677,"endTime":272.41509433962267,"audioSegment":0},{"text":"but these declarations belong to the page; they are not injected: :root {","startTime":272.41509433962267,"endTime":273.9056603773585,"audioSegment":0},{"text":"color-scheme: light dark;","startTime":273.9056603773585,"endTime":275.39622641509436,"audioSegment":0},{"text":"--page-bg: #eae5d6;","startTime":275.39622641509436,"endTime":276.8867924528302,"audioSegment":0},{"text":"--page-panel: #f3eddf;","startTime":276.8867924528302,"endTime":278.37735849056605,"audioSegment":0},{"text":"--page-text: #1c1c1c;","startTime":278.37735849056605,"endTime":279.8679245283019,"audioSegment":0},{"text":"--page-muted: #5a4f42;","startTime":279.8679245283019,"endTime":281.35849056603774,"audioSegment":0},{"text":"--page-border: #8b7e6b;","startTime":281.35849056603774,"endTime":282.8490566037736,"audioSegment":0},{"text":"--page-accent: #9a4e30; }","startTime":282.8490566037736,"endTime":284.33962264150944,"audioSegment":0},{"text":"@media (prefers-color-scheme: dark) {","startTime":284.33962264150944,"endTime":285.8301886792453,"audioSegment":0},{"text":":root:not([data-theme=\"light\"]) {","startTime":285.8301886792453,"endTime":287.3207547169811,"audioSegment":0},{"text":"--page-bg: #141517;","startTime":287.3207547169811,"endTime":288.811320754717,"audioSegment":0},{"text":"--page-panel: #1c1d20;","startTime":288.811320754717,"endTime":290.3018867924528,"audioSegment":0},{"text":"--page-text: #f0f0f0;","startTime":290.3018867924528,"endTime":291.79245283018867,"audioSegment":0},{"text":"--page-muted: #b9aea0;","startTime":291.79245283018867,"endTime":293.2830188679245,"audioSegment":0},{"text":"--page-border: #8b7e6b;","startTime":293.2830188679245,"endTime":294.77358490566036,"audioSegment":0},{"text":"--page-accent: #d5a07a; } }","startTime":294.77358490566036,"endTime":296.2641509433962,"audioSegment":0},{"text":":root[data-theme=\"dark\"] {","startTime":296.2641509433962,"endTime":297.75471698113205,"audioSegment":0},{"text":"color-scheme: dark;","startTime":297.75471698113205,"endTime":299.2452830188679,"audioSegment":0},{"text":"--page-bg: #141517;","startTime":299.2452830188679,"endTime":300.7358490566038,"audioSegment":0},{"text":"--page-panel: #1c1d20;","startTime":300.7358490566038,"endTime":302.22641509433964,"audioSegment":0},{"text":"--page-text: #f0f0f0;","startTime":302.22641509433964,"endTime":303.7169811320755,"audioSegment":0},{"text":"--page-muted: #b9aea0;","startTime":303.7169811320755,"endTime":305.20754716981133,"audioSegment":0},{"text":"--page-border: #8b7e6b;","startTime":305.20754716981133,"endTime":306.6981132075472,"audioSegment":0},{"text":"--page-accent: #d5a07a; }","startTime":306.6981132075472,"endTime":308.188679245283,"audioSegment":0},{"text":":root[data-theme=\"light\"] { color-scheme: light; }","startTime":308.188679245283,"endTime":309.6792452830189,"audioSegment":0},{"text":"* { box-sizing: border-box; }","startTime":309.6792452830189,"endTime":311.1698113207547,"audioSegment":0},{"text":"[hidden] { display: none !important; }","startTime":311.1698113207547,"endTime":312.66037735849056,"audioSegment":0},{"text":"body { margin: 0; background: var(--page-bg); color: var(--page-text); }","startTime":312.66037735849056,"endTime":314.1509433962264,"audioSegment":0},{"text":"main { max-width: 72rem; margin: auto; padding: clamp(1rem, 3vw, 2.5rem); }","startTime":314.1509433962264,"endTime":315.64150943396226,"audioSegment":0},{"text":"button, input, select, textarea {","startTime":315.64150943396226,"endTime":317.1320754716981,"audioSegment":0},{"text":"min-height: 44px;","startTime":317.1320754716981,"endTime":318.62264150943395,"audioSegment":0},{"text":"padding: .5rem .75rem;","startTime":318.62264150943395,"endTime":320.1132075471698,"audioSegment":0},{"text":"border: 1px solid var(--page-border);","startTime":320.1132075471698,"endTime":321.60377358490564,"audioSegment":0},{"text":"border-radius: 6px;","startTime":321.60377358490564,"endTime":323.0943396226415,"audioSegment":0},{"text":"background: var(--page-panel);","startTime":323.0943396226415,"endTime":324.58490566037733,"audioSegment":0},{"text":"color: var(--page-text); }","startTime":324.58490566037733,"endTime":326.07547169811323,"audioSegment":0},{"text":":focus-visible { outline: 2px solid var(--page-accent); outline-offset: 3px; }","startTime":326.07547169811323,"endTime":327.566037735849,"audioSegment":0},{"text":"a { font-family: var(--font-ui, system-ui, sans-serif); color: var(--page-accent); }","startTime":327.566037735849,"endTime":329.0566037735849,"audioSegment":0},{"text":"After the real API or shared demo bootstrap has initialized gezel,","startTime":329.0566037735849,"endTime":330.5471698113207,"audioSegment":0},{"text":"apply and subscribe to its theme:","startTime":330.5471698113207,"endTime":332.0377358490566,"audioSegment":0},{"text":"const applyTheme = ({ mode }) => { document.documentElement.dataset.theme = mode; };","startTime":332.0377358490566,"endTime":333.52830188679246,"audioSegment":0},{"text":"applyTheme(gezel.ui.theme);","startTime":333.52830188679246,"endTime":335.0188679245283,"audioSegment":0},{"text":"const stopTheme = gezel.ui.onTheme(applyTheme);","startTime":335.0188679245283,"endTime":336.50943396226415,"audioSegment":0},{"text":"window.addEventListener('pagehide', stopTheme, { once: true });","startTime":336.50943396226415,"endTime":338,"audioSegment":0},{"text":"Put the person's content first.","startTime":338,"endTime":340.6666666666667,"audioSegment":0},{"text":"Give the page one clear title, a short explanation when needed,","startTime":340.6666666666667,"endTime":343.3333333333333,"audioSegment":0},{"text":"and visible primary actions.","startTime":343.3333333333333,"endTime":346,"audioSegment":0},{"text":"Keep project ids, tool names, SQL,","startTime":346,"endTime":348.6666666666667,"audioSegment":0},{"text":"and host transport details out of ordinary flows.","startTime":348.6666666666667,"endTime":351.3333333333333,"audioSegment":0},{"text":"Use serif for headings and sans for body text, labels, and controls.","startTime":351.3333333333333,"endTime":354,"audioSegment":0},{"text":"Start body text around 16px with a comfortable line-height.","startTime":354,"endTime":356.6666666666667,"audioSegment":0},{"text":"Keep captions readable and avoid shrinking controls to fit a narrow pane.","startTime":356.6666666666667,"endTime":359.3333333333333,"audioSegment":0},{"text":"Use mostly-square controls: 4px for small badges,","startTime":359.3333333333333,"endTime":362,"audioSegment":0},{"text":"6px for buttons and inputs, and around 10px for trays and small surfaces.","startTime":362,"endTime":364.6666666666667,"audioSegment":0},{"text":"Choice controls are keys in a tray with a clear pressed state.","startTime":364.6666666666667,"endTime":367.3333333333333,"audioSegment":0},{"text":"Avoid capsule buttons, emoji navigation, and decorative dashboard clutter.","startTime":367.3333333333333,"endTime":370,"audioSegment":0},{"text":"Use native elements: a button for an action, an a for a real destination,","startTime":370,"endTime":372.6666666666667,"audioSegment":0},{"text":"labels for inputs, and a real table for tabular data.","startTime":372.6666666666667,"endTime":375.3333333333333,"audioSegment":0},{"text":"Give toggles aria-pressed and icon-only controls an accessible name.","startTime":375.3333333333333,"endTime":378,"audioSegment":0},{"text":"The embedded page sandbox permits scripts but not native form submissions.","startTime":378,"endTime":380.6666666666667,"audioSegment":0},{"text":"Use button type=\"button\" and explicit action handlers;","startTime":380.6666666666667,"endTime":383.3333333333333,"audioSegment":0},{"text":"support Enter in single-line inputs without relying on a form's submit event.","startTime":383.3333333333333,"endTime":386,"audioSegment":0},{"text":"Invoke declared tools through gezel.tools.invoke.","startTime":386,"endTime":388.6666666666667,"audioSegment":0},{"text":"Keep focus visible, support keyboard operation, and restore focus after closing dialogs.","startTime":388.6666666666667,"endTime":391.3333333333333,"audioSegment":0},{"text":"Native video/audio controls are a useful baseline.","startTime":391.3333333333333,"endTime":394,"audioSegment":0},{"text":"Do not autoplay media.","startTime":394,"endTime":396.6666666666667,"audioSegment":0},{"text":"Check contrast in both themes, including helper text and selected states.","startTime":396.6666666666667,"endTime":399.3333333333333,"audioSegment":0},{"text":"Communicate errors and chart series with text or shape as well as color.","startTime":399.3333333333333,"endTime":402,"audioSegment":0},{"text":"Honor reduced-motion preferences when adding animation.","startTime":402,"endTime":404.66666666666663,"audioSegment":0},{"text":"Check a narrow Output pane and a 320px viewport.","startTime":404.66666666666663,"endTime":407.3333333333333,"audioSegment":0},{"text":"Wrap filters, allow long filenames to break,","startTime":407.3333333333333,"endTime":410,"audioSegment":0},{"text":"and contain necessary table overflow within its region.","startTime":410,"endTime":412.66666666666663,"audioSegment":0},{"text":"A page should not force the whole host to scroll sideways.","startTime":412.66666666666663,"endTime":415.3333333333333,"audioSegment":0},{"text":"The full product direction remains in Gezel UX;","startTime":415.3333333333333,"endTime":418,"audioSegment":0},{"text":"the brand guidelines cover other surfaces.","startTime":418,"endTime":420.66666666666663,"audioSegment":0},{"text":"Their shell class names and token declarations are references,","startTime":420.66666666666663,"endTime":423.3333333333333,"audioSegment":0},{"text":"not automatically available page APIs.","startTime":423.3333333333333,"endTime":426,"audioSegment":0},{"text":"Show distinct loading, empty, permission-denied, unavailable, partial-result, and failed-action states.","startTime":426,"endTime":429.1764705882353,"audioSegment":0},{"text":"Keep useful content visible when an optional capability fails;","startTime":429.1764705882353,"endTime":432.3529411764706,"audioSegment":0},{"text":"a data dashboard can still list files without DuckDB, and a gallery can still list a file whose codec cannot play.","startTime":432.3529411764706,"endTime":435.52941176470586,"audioSegment":0},{"text":"Tell the person when a listing or query is truncated,","startTime":435.52941176470586,"endTime":438.70588235294116,"audioSegment":0},{"text":"or when a chart describes an indexed snapshot rather than the latest file bytes.","startTime":438.70588235294116,"endTime":441.88235294117646,"audioSegment":0},{"text":"Use textContent for filenames and data labels.","startTime":441.88235294117646,"endTime":445.05882352941177,"audioSegment":0},{"text":"Read files through gezel.data, use data.url() for media,","startTime":445.05882352941177,"endTime":448.2352941176471,"audioSegment":0},{"text":"and use declared tools for writes.","startTime":448.2352941176471,"endTime":451.4117647058824,"audioSegment":0},{"text":"Debounce refreshes, limit rendered cards, unsubscribe watches, stop players on close,","startTime":451.4117647058824,"endTime":454.5882352941176,"audioSegment":0},{"text":"and ignore stale asynchronous results after a selection changes.","startTime":454.5882352941176,"endTime":457.7647058823529,"audioSegment":0},{"text":"Standalone samples must be clearly labeled and deterministic.","startTime":457.7647058823529,"endTime":460.94117647058823,"audioSegment":0},{"text":"Keep their mutations in memory and provide Reset demo.","startTime":460.94117647058823,"endTime":464.11764705882354,"audioSegment":0},{"text":"Never substitute sample data after a live permission or query failure.","startTime":464.11764705882354,"endTime":467.29411764705884,"audioSegment":0},{"text":"The page API guide describes the host modes and the shared demo bootstrap.","startTime":467.29411764705884,"endTime":470.47058823529414,"audioSegment":0},{"text":"Before delivery, inspect light and dark mode, keyboard focus, long labels,","startTime":470.47058823529414,"endTime":473.6470588235294,"audioSegment":0},{"text":"an empty folder, a failed operation, narrow layouts, and the real host flow.","startTime":473.6470588235294,"endTime":476.8235294117647,"audioSegment":0},{"text":"Structural validation cannot establish that a page is usable.","startTime":476.8235294117647,"endTime":480,"audioSegment":0}],"version":1},"startBlock":{"title":"Gezel app page style guide","subtitle":"An app page should feel like part of Gezel: readable, warm, and focused on the person's work. This guide applies to the HTML/CSS/JavaScript pages declared by a project type's pages block. Start with Building AI Apps inside Gezel for the composition and Using the Gezel page APIs for behavior. The app UX guide says how an app is organized: Home and noun tabs, actions as keys that open dialogs, and actions on the records themselves.","ambientMotion":"zoomIn"}}</script>
