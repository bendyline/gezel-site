:{"line":53,"column":1,"offset":6052},"end":{"line":53,"column":69,"offset":6120}}},{"type":"text","value":" covers the same ground in plainer terms, and ","position":{"start":{"line":53,"column":69,"offset":6120},"end":{"line":53,"column":115,"offset":6166}}},{"type":"link","url":"../security-model/","children":[{"type":"text","value":"The security model","position":{"start":{"line":53,"column":116,"offset":6167},"end":{"line":53,"column":134,"offset":6185}}}],"position":{"start":{"line":53,"column":115,"offset":6166},"end":{"line":53,"column":155,"offset":6206}}},{"type":"text","value":" explains how each level is enforced.","position":{"start":{"line":53,"column":155,"offset":6206},"end":{"line":53,"column":192,"offset":6243}}}],"position":{"start":{"line":53,"column":1,"offset":6052},"end":{"line":53,"column":192,"offset":6243}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel has no Bendyline account and no Bendyline server between you and your work. Your projects,","startTime":0,"endTime":3.4285714285714284,"audioSegment":0},{"text":"chats and files stay on this machine unless something on this page sends them somewhere.","startTime":3.4285714285714284,"endTime":6.857142857142857,"audioSegment":0},{"text":"Below is every kind of traffic Gezel can make, what it carries,","startTime":6.857142857142857,"endTime":10.285714285714285,"audioSegment":0},{"text":"and which of the three security levels allows it.","startTime":10.285714285714285,"endTime":13.714285714285714,"audioSegment":0},{"text":"You choose the level in Settings → Security & compliance,","startTime":13.714285714285714,"endTime":17.142857142857142,"audioSegment":0},{"text":"or with gezel security level set <level> on the command line.","startTime":17.142857142857142,"endTime":20.57142857142857,"audioSegment":0},{"text":"A new install starts at lockdown.","startTime":20.57142857142857,"endTime":24,"audioSegment":0},{"text":"Traffic What it carries super-lockdown lockdown free","startTime":24,"endTime":27.571428571428573,"audioSegment":0},{"text":"Local models (llama.cpp, MLX, DwarfStar, Ollama) Nothing leaves;","startTime":27.571428571428573,"endTime":31.142857142857142,"audioSegment":0},{"text":"the model runs on this machine Allowed Allowed Allowed","startTime":31.142857142857142,"endTime":34.714285714285715,"audioSegment":0},{"text":"Cloud model providers (API keys, Claude and Codex command-line tools, Copilot) Your conversation,","startTime":34.714285714285715,"endTime":38.285714285714285,"audioSegment":0},{"text":"and any files Gezel reads in it, to the provider you chose Blocked Allowed Allowed Web search,","startTime":38.285714285714285,"endTime":41.85714285714286,"audioSegment":0},{"text":"page fetches and Wikipedia lookups What Gezel searches for or the address it opens Blocked Blocked Allowed","startTime":41.85714285714286,"endTime":45.42857142857143,"audioSegment":0},{"text":"Mail sync and sending Your mailbox,","startTime":45.42857142857143,"endTime":49,"audioSegment":0},{"text":"to and from your mail provider Blocked Blocked Allowed","startTime":49,"endTime":52.57142857142857,"audioSegment":0},{"text":"Connectors (mail, calendars, issue trackers and similar) The connected account's data,","startTime":52.57142857142857,"endTime":56.142857142857146,"audioSegment":0},{"text":"copied into the project Blocked: no data moves When you start a sync Also syncs in the background","startTime":56.142857142857146,"endTime":59.714285714285715,"audioSegment":0},{"text":"Third-party toolsets (community MCP servers) Whatever that toolset sends;","startTime":59.714285714285715,"endTime":63.285714285714285,"audioSegment":0},{"text":"it is outside code Gezel cannot confine Blocked Blocked Allowed","startTime":63.285714285714285,"endTime":66.85714285714286,"audioSegment":0},{"text":"Package scripts Gezel runs (npm run, npx) Whatever the script sends;","startTime":66.85714285714286,"endTime":70.42857142857143,"audioSegment":0},{"text":"package scripts run with network access Blocked Blocked Allowed","startTime":70.42857142857143,"endTime":74,"audioSegment":0},{"text":"Automatic update checks (the app,","startTime":74,"endTime":77.57142857142858,"audioSegment":0},{"text":"and live catalog updates if you turn them on) Version checks to Gezel's GitHub releases and to npm Blocked Allowed Allowed","startTime":77.57142857142858,"endTime":81.14285714285714,"audioSegment":0},{"text":"Downloads you start: models, on-device engines, knowledge catalogs Requests for those files,","startTime":81.14285714285714,"endTime":84.71428571428572,"audioSegment":0},{"text":"from Hugging Face and Gezel's GitHub releases Allowed Allowed Allowed","startTime":84.71428571428572,"endTime":88.28571428571429,"audioSegment":0},{"text":"Models Gezel downloads on its own when it first needs them: the text search model,","startTime":88.28571428571429,"endTime":91.85714285714286,"audioSegment":0},{"text":"and an image reader for an on-device chat model that cannot read images Requests for those model files, from Hugging Face Allowed Allowed Allowed","startTime":91.85714285714286,"endTime":95.42857142857143,"audioSegment":0},{"text":"Search models Gezel downloads on its own: the relevance model and the media-search model Requests for those model files,","startTime":95.42857142857143,"endTime":99,"audioSegment":0},{"text":"from Hugging Face Blocked Allowed Allowed","startTime":99,"endTime":102.57142857142857,"audioSegment":0},{"text":"Catalog updates you turn on: installed knowledge catalogs,","startTime":102.57142857142857,"endTime":106.14285714285715,"audioSegment":0},{"text":"and live catalog content Requests for the new versions, from Hugging Face and npm Blocked Allowed Allowed","startTime":106.14285714285715,"endTime":109.71428571428572,"audioSegment":0},{"text":"First-start tool setup Downloads of the browser-automation tools from npm and Playwright Allowed Allowed Allowed","startTime":109.71428571428572,"endTime":113.28571428571429,"audioSegment":0},{"text":"The levels are presets.","startTime":113.28571428571429,"endTime":116.85714285714286,"audioSegment":0},{"text":"Settings → Security & compliance can turn individual switches on or off;","startTime":116.85714285714286,"endTime":120.42857142857143,"audioSegment":0},{"text":"a combination that matches no preset is shown as Custom.","startTime":120.42857142857143,"endTime":124,"audioSegment":0},{"text":"Local models never send your words anywhere.","startTime":124,"endTime":127.27027027027027,"audioSegment":0},{"text":"A downloaded model runs in an engine on this machine,","startTime":127.27027027027027,"endTime":130.54054054054055,"audioSegment":0},{"text":"and Gezel treats Ollama, which you run yourself, the same way.","startTime":130.54054054054055,"endTime":133.8108108108108,"audioSegment":0},{"text":"Cloud model providers receive what you would send them using their own product,","startTime":133.8108108108108,"endTime":137.0810810810811,"audioSegment":0},{"text":"under their terms.","startTime":137.0810810810811,"endTime":140.35135135135135,"audioSegment":0},{"text":"Gezel talks to them directly from this machine and adds no middleman.","startTime":140.35135135135135,"endTime":143.6216216216216,"audioSegment":0},{"text":"At super-lockdown, the service refuses to start a cloud chat at all,","startTime":143.6216216216216,"endTime":146.8918918918919,"audioSegment":0},{"text":"whichever path asks for one.","startTime":146.8918918918919,"endTime":150.16216216216216,"audioSegment":0},{"text":"Web search and page fetches carry what Gezel is researching.","startTime":150.16216216216216,"endTime":153.43243243243242,"audioSegment":0},{"text":"They are the main reason lockdown and free differ: a model that can reach the open web can be steered by what it reads there,","startTime":153.43243243243242,"endTime":156.7027027027027,"audioSegment":0},{"text":"so this is off by default.","startTime":156.7027027027027,"endTime":159.97297297297297,"audioSegment":0},{"text":"Connectors are run by the service, not the model.","startTime":159.97297297297297,"endTime":163.24324324324323,"audioSegment":0},{"text":"The service holds the credential,","startTime":163.24324324324323,"endTime":166.51351351351352,"audioSegment":0},{"text":"fetches the data and writes it into the project as files Gezel reads.","startTime":166.51351351351352,"endTime":169.78378378378378,"audioSegment":0},{"text":"At lockdown they move data only when you ask;","startTime":169.78378378378378,"endTime":173.05405405405406,"audioSegment":0},{"text":"at free they also keep themselves in sync.","startTime":173.05405405405406,"endTime":176.32432432432432,"audioSegment":0},{"text":"Third-party toolsets and package scripts are code Gezel did not write and cannot sandbox,","startTime":176.32432432432432,"endTime":179.59459459459458,"audioSegment":0},{"text":"so they may reach the network whatever they like.","startTime":179.59459459459458,"endTime":182.86486486486487,"audioSegment":0},{"text":"They are available at free only.","startTime":182.86486486486487,"endTime":186.13513513513513,"audioSegment":0},{"text":"(One narrow exception: Gezel's own local preview browser may run at lower levels,","startTime":186.13513513513513,"endTime":189.40540540540542,"audioSegment":0},{"text":"locked to pages inside your project.)","startTime":189.40540540540542,"endTime":192.67567567567568,"audioSegment":0},{"text":"Update checks carry a version number, not your work.","startTime":192.67567567567568,"endTime":195.94594594594594,"audioSegment":0},{"text":"You can also turn off automatic update checks on their own,","startTime":195.94594594594594,"endTime":199.2162162162162,"audioSegment":0},{"text":"without changing the level.","startTime":199.2162162162162,"endTime":202.48648648648648,"audioSegment":0},{"text":"Downloads you start fetch files; they do not upload your work.","startTime":202.48648648648648,"endTime":205.75675675675677,"audioSegment":0},{"text":"Model files are checked against their published hashes,","startTime":205.75675675675677,"endTime":209.02702702702703,"audioSegment":0},{"text":"and the on-device engines against fingerprints built into the release you installed.","startTime":209.02702702702703,"endTime":212.2972972972973,"audioSegment":0},{"text":"Downloads Gezel starts on its own also fetch files and upload nothing.","startTime":212.2972972972973,"endTime":215.56756756756755,"audioSegment":0},{"text":"The text search model comes the first time Gezel needs it to search your files or memories by meaning.","startTime":215.56756756756755,"endTime":218.83783783783784,"audioSegment":0},{"text":"An image reader comes with an on-device chat model that cannot read images,","startTime":218.83783783783784,"endTime":222.1081081081081,"audioSegment":0},{"text":"unless Settings → Image recognition is set to Never.","startTime":222.1081081081081,"endTime":225.3783783783784,"audioSegment":0},{"text":"The relevance model is on for new installs, and the media-search model is on unless you turn media search off in Settings → Image recognition;","startTime":225.3783783783784,"endTime":228.64864864864865,"audioSegment":0},{"text":"a new install waits for its first project to finish, or for background work to begin, before fetching it.","startTime":228.64864864864865,"endTime":231.9189189189189,"audioSegment":0},{"text":"Those two follow the security level, so super-lockdown stops them.","startTime":231.9189189189189,"endTime":235.1891891891892,"audioSegment":0},{"text":"Catalog updates you turn on download new versions of your installed knowledge catalogs,","startTime":235.1891891891892,"endTime":238.45945945945945,"audioSegment":0},{"text":"and new catalog content when live catalog updates are on (Settings → About).","startTime":238.45945945945945,"endTime":241.72972972972974,"audioSegment":0},{"text":"Both are off until you turn them on.","startTime":241.72972972972974,"endTime":245,"audioSegment":0},{"text":"Nothing goes to Bendyline.","startTime":245,"endTime":248.16666666666666,"audioSegment":0},{"text":"No level sends your chats, files or usage to us.","startTime":248.16666666666666,"endTime":251.33333333333334,"audioSegment":0},{"text":"The Bendyline-published places Gezel contacts are its GitHub releases and its npm packages,","startTime":251.33333333333334,"endTime":254.5,"audioSegment":0},{"text":"for updates, engines and tools, and Bendyline's Hugging Face datasets, for knowledge catalogs.","startTime":254.5,"endTime":257.6666666666667,"audioSegment":0},{"text":"Keys go only to their own service.","startTime":257.6666666666667,"endTime":260.8333333333333,"audioSegment":0},{"text":"A provider key is sent to that provider and nowhere else.","startTime":260.8333333333333,"endTime":264,"audioSegment":0},{"text":"Gezel keeps keys in your operating system's keychain,","startTime":264,"endTime":267.1666666666667,"audioSegment":0},{"text":"or in an encrypted file in its own folder where no keychain exists.","startTime":267.1666666666667,"endTime":270.3333333333333,"audioSegment":0},{"text":"The service answers only on this machine.","startTime":270.3333333333333,"endTime":273.5,"audioSegment":0},{"text":"It listens on this computer alone unless you pair another device to it for remote inference.","startTime":273.5,"endTime":276.6666666666667,"audioSegment":0},{"text":"Local-first: your data stays on your disk covers the same ground in plainer terms,","startTime":276.6666666666667,"endTime":279.8333333333333,"audioSegment":0},{"text":"and The security model explains how each level is enforced.","startTime":279.8333333333333,"endTime":283,"audioSegment":0}],"version":1},"startBlock":{"title":"What leaves this computer","subtitle":"Gezel has no Bendyline account and no Bendyline server between you and your work. Your projects, chats and files stay on this machine unless something on this page sends them somewhere. Below is every kind of traffic Gezel can make, what it carries, and which of the three security levels allows it.","ambientMotion":"zoomIn"}}</script>
