50,"column":830,"offset":7253}}},{"type":"text","value":" stops them.","position":{"start":{"line":50,"column":830,"offset":7253},"end":{"line":50,"column":842,"offset":7265}}}],"position":{"start":{"line":50,"column":1,"offset":6424},"end":{"line":50,"column":842,"offset":7265}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Catalog updates you turn on","position":{"start":{"line":52,"column":3,"offset":7269},"end":{"line":52,"column":30,"offset":7296}}}],"position":{"start":{"line":52,"column":1,"offset":7267},"end":{"line":52,"column":32,"offset":7298}}},{"type":"text","value":" download new versions of your installed knowledge catalogs, and new catalog content when live catalog updates are on (","position":{"start":{"line":52,"column":32,"offset":7298},"end":{"line":52,"column":151,"offset":7417}}},{"type":"strong","children":[{"type":"text","value":"Settings → About","position":{"start":{"line":52,"column":153,"offset":7419},"end":{"line":52,"column":169,"offset":7435}}}],"position":{"start":{"line":52,"column":151,"offset":7417},"end":{"line":52,"column":171,"offset":7437}}},{"type":"text","value":"). Both are off until you turn them on.","position":{"start":{"line":52,"column":171,"offset":7437},"end":{"line":52,"column":210,"offset":7476}}}],"position":{"start":{"line":52,"column":1,"offset":7267},"end":{"line":52,"column":210,"offset":7476}}}]},{"id":"what-the-levels-do-not-change","startTime":353,"duration":38,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"What the levels do not change","position":{"start":{"line":54,"column":4,"offset":7481},"end":{"line":54,"column":33,"offset":7510}}}],"position":{"start":{"line":54,"column":1,"offset":7478},"end":{"line":54,"column":33,"offset":7510}}},"title":"What the levels do not change","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Nothing goes to Bendyline.","position":{"start":{"line":56,"column":5,"offset":7516},"end":{"line":56,"column":31,"offset":7542}}}],"position":{"start":{"line":56,"column":3,"offset":7514},"end":{"line":56,"column":33,"offset":7544}}},{"type":"text","value":" No level sends your chats, files or usage to us. The Bendyline-published places Gezel contacts are its GitHub releases and its npm packages, for updates, engines and tools, and Bendyline's Hugging Face datasets, for knowledge catalogs.","position":{"start":{"line":56,"column":33,"offset":7544},"end":{"line":56,"column":269,"offset":7780}}}],"position":{"start":{"line":56,"column":3,"offset":7514},"end":{"line":56,"column":269,"offset":7780}}}],"position":{"start":{"line":56,"column":1,"offset":7512},"end":{"line":56,"column":269,"offset":7780}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Keys go only to their own service.","position":{"start":{"line":57,"column":5,"offset":7785},"end":{"line":57,"column":39,"offset":7819}}}],"position":{"start":{"line":57,"column":3,"offset":7783},"end":{"line":57,"column":41,"offset":7821}}},{"type":"text","value":" A provider key is sent to that provider and nowhere else. Gezel keeps keys in your operating system's keychain, or in an encrypted file in its own folder where no keychain exists.","position":{"start":{"line":57,"column":41,"offset":7821},"end":{"line":57,"column":221,"offset":8001}}}],"position":{"start":{"line":57,"column":3,"offset":7783},"end":{"line":57,"column":221,"offset":8001}}}],"position":{"start":{"line":57,"column":1,"offset":7781},"end":{"line":57,"column":221,"offset":8001}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The service answers only on this machine.","position":{"start":{"line":58,"column":5,"offset":8006},"end":{"line":58,"column":46,"offset":8047}}}],"position":{"start":{"line":58,"column":3,"offset":8004},"end":{"line":58,"column":48,"offset":8049}}},{"type":"text","value":" It listens on this computer alone unless you pair another device to it for remote inference.","position":{"start":{"line":58,"column":48,"offset":8049},"end":{"line":58,"column":141,"offset":8142}}}],"position":{"start":{"line":58,"column":3,"offset":8004},"end":{"line":58,"column":141,"offset":8142}}}],"position":{"start":{"line":58,"column":1,"offset":8002},"end":{"line":58,"column":141,"offset":8142}}}],"position":{"start":{"line":56,"column":1,"offset":7512},"end":{"line":58,"column":141,"offset":8142}}},{"type":"paragraph","children":[{"type":"link","url":"../privacy-local-first/","children":[{"type":"text","value":"Local-first: your data stays on your disk","position":{"start":{"line":60,"column":2,"offset":8145},"end":{"line":60,"column":43,"offset":8186}}}],"position":{"start":{"line":60,"column":1,"offset":8144},"end":{"line":60,"column":69,"offset":8212}}},{"type":"text","value":" covers the same ground in plainer terms, and ","position":{"start":{"line":60,"column":69,"offset":8212},"end":{"line":60,"column":115,"offset":8258}}},{"type":"link","url":"../security-model/","children":[{"type":"text","value":"The security model","position":{"start":{"line":60,"column":116,"offset":8259},"end":{"line":60,"column":134,"offset":8277}}}],"position":{"start":{"line":60,"column":115,"offset":8258},"end":{"line":60,"column":155,"offset":8298}}},{"type":"text","value":" explains how each level is enforced.","position":{"start":{"line":60,"column":155,"offset":8298},"end":{"line":60,"column":192,"offset":8335}}}],"position":{"start":{"line":60,"column":1,"offset":8144},"end":{"line":60,"column":192,"offset":8335}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel has no Bendyline account and no Bendyline server between you and your work. Your projects,","startTime":0,"endTime":3.4285714285714284,"audioSegment":0},{"text":"chats and files stay on this machine unless something on this page sends them somewhere.","startTime":3.4285714285714284,"endTime":6.857142857142857,"audioSegment":0},{"text":"Below is every kind of traffic Gezel can make, what it carries,","startTime":6.857142857142857,"endTime":10.285714285714285,"audioSegment":0},{"text":"and which of the three security levels allows it.","startTime":10.285714285714285,"endTime":13.714285714285714,"audioSegment":0},{"text":"You choose the level in Settings → Security & compliance,","startTime":13.714285714285714,"endTime":17.142857142857142,"audioSegment":0},{"text":"or with gezel security level set <level> on the command line.","startTime":17.142857142857142,"endTime":20.57142857142857,"audioSegment":0},{"text":"A new install starts at lockdown.","startTime":20.57142857142857,"endTime":24,"audioSegment":0},{"text":"Traffic What it carries super-lockdown lockdown free","startTime":24,"endTime":27.97142857142857,"audioSegment":0},{"text":"Local models (llama.cpp, MLX, DwarfStar, Ollama) Nothing leaves;","startTime":27.97142857142857,"endTime":31.942857142857143,"audioSegment":0},{"text":"the model runs on this machine Allowed Allowed Allowed","startTime":31.942857142857143,"endTime":35.91428571428571,"audioSegment":0},{"text":"Cloud model providers (API keys, Claude and Codex command-line tools, Copilot) Your conversation,","startTime":35.91428571428571,"endTime":39.885714285714286,"audioSegment":0},{"text":"and any files Gezel reads in it, to the provider you chose Blocked Allowed Allowed","startTime":39.885714285714286,"endTime":43.85714285714286,"audioSegment":0},{"text":"Web search, Wikipedia lookups,","startTime":43.85714285714286,"endTime":47.82857142857143,"audioSegment":0},{"text":"and pages a gezel opens on its own What Gezel searches for or the address it opens Blocked Blocked Allowed","startTime":47.82857142857143,"endTime":51.8,"audioSegment":0},{"text":"Saved web pages: sites a project follows, a web address in a message you send, and links a gezel asks for from a followed site Requests for those pages,","startTime":51.8,"endTime":55.77142857142857,"audioSegment":0},{"text":"with your saved sign-in for a site you signed in to Blocked Allowed, and followed sites refresh on their own Allowed, and followed sites refresh on their own","startTime":55.77142857142857,"endTime":59.74285714285715,"audioSegment":0},{"text":"Mail sync and sending Your mailbox,","startTime":59.74285714285715,"endTime":63.714285714285715,"audioSegment":0},{"text":"to and from your mail provider Blocked Blocked Allowed","startTime":63.714285714285715,"endTime":67.68571428571428,"audioSegment":0},{"text":"Connectors (mail, calendars, issue trackers and similar) The connected account's data, copied into the project Blocked: no data moves When you start a sync;","startTime":67.68571428571428,"endTime":71.65714285714286,"audioSegment":0},{"text":"connections that only read, such as feeds and wikis, also refresh on their own Also syncs in the background","startTime":71.65714285714286,"endTime":75.62857142857143,"audioSegment":0},{"text":"Repositories a gezel clones The repository's address, to the code host Blocked Public code hosts only: GitHub,","startTime":75.62857142857143,"endTime":79.6,"audioSegment":0},{"text":"GitLab, Bitbucket, Codeberg, Gitea and SourceHut Any host","startTime":79.6,"endTime":83.57142857142857,"audioSegment":0},{"text":"Third-party toolsets (community MCP servers) Whatever that toolset sends;","startTime":83.57142857142857,"endTime":87.54285714285714,"audioSegment":0},{"text":"it is outside code Gezel cannot confine Blocked Blocked Allowed","startTime":87.54285714285714,"endTime":91.51428571428572,"audioSegment":0},{"text":"Package scripts Gezel runs (npm run, npx) Whatever the script sends;","startTime":91.51428571428572,"endTime":95.4857142857143,"audioSegment":0},{"text":"package scripts run with network access Blocked Blocked Allowed","startTime":95.4857142857143,"endTime":99.45714285714286,"audioSegment":0},{"text":"Automatic update checks (the app,","startTime":99.45714285714286,"endTime":103.42857142857143,"audioSegment":0},{"text":"and live catalog updates if you turn them on) Version checks to Gezel's GitHub releases and to npm Blocked Allowed Allowed","startTime":103.42857142857143,"endTime":107.4,"audioSegment":0},{"text":"Downloads you start: models, on-device engines, knowledge catalogs, page libraries Requests for those files,","startTime":107.4,"endTime":111.37142857142857,"audioSegment":0},{"text":"from Hugging Face, Gezel's GitHub releases and npm Allowed Allowed Allowed","startTime":111.37142857142857,"endTime":115.34285714285714,"audioSegment":0},{"text":"Models Gezel downloads on its own when it first needs them: the text search model,","startTime":115.34285714285714,"endTime":119.31428571428572,"audioSegment":0},{"text":"and an image reader for an on-device chat model that cannot read images Requests for those model files, from Hugging Face Allowed Allowed Allowed","startTime":119.31428571428572,"endTime":123.28571428571429,"audioSegment":0},{"text":"Search models Gezel downloads on its own: the relevance model and the media-search model Requests for those model files,","startTime":123.28571428571429,"endTime":127.25714285714287,"audioSegment":0},{"text":"from Hugging Face Blocked Allowed Allowed","startTime":127.25714285714287,"endTime":131.22857142857143,"audioSegment":0},{"text":"Page libraries Gezel downloads on its own the first time a page needs one (three.js,","startTime":131.22857142857143,"endTime":135.2,"audioSegment":0},{"text":"Chart.js, React and others) Requests for those packages, from npm Blocked Allowed Allowed","startTime":135.2,"endTime":139.17142857142858,"audioSegment":0},{"text":"Catalog updates you turn on: installed knowledge catalogs,","startTime":139.17142857142858,"endTime":143.14285714285714,"audioSegment":0},{"text":"and live catalog content Requests for the new versions, from Hugging Face and npm Blocked Allowed Allowed","startTime":143.14285714285714,"endTime":147.1142857142857,"audioSegment":0},{"text":"First-start tool setup Downloads of the browser-automation tools from npm and Playwright Allowed Allowed Allowed","startTime":147.1142857142857,"endTime":151.0857142857143,"audioSegment":0},{"text":"The levels are presets.","startTime":151.0857142857143,"endTime":155.05714285714285,"audioSegment":0},{"text":"Settings → Security & compliance can turn individual switches on or off;","startTime":155.05714285714285,"endTime":159.02857142857144,"audioSegment":0},{"text":"a combination that matches no preset is shown as Custom.","startTime":159.02857142857144,"endTime":163,"audioSegment":0},{"text":"Local models never send your words anywhere.","startTime":163,"endTime":166.5185185185185,"audioSegment":0},{"text":"A downloaded model runs in an engine on this machine,","startTime":166.5185185185185,"endTime":170.03703703703704,"audioSegment":0},{"text":"and Gezel treats Ollama, which you run yourself, the same way.","startTime":170.03703703703704,"endTime":173.55555555555554,"audioSegment":0},{"text":"Cloud model providers receive what you would send them using their own product,","startTime":173.55555555555554,"endTime":177.07407407407408,"audioSegment":0},{"text":"under their terms.","startTime":177.07407407407408,"endTime":180.59259259259258,"audioSegment":0},{"text":"Gezel talks to them directly from this machine and adds no middleman.","startTime":180.59259259259258,"endTime":184.11111111111111,"audioSegment":0},{"text":"At super-lockdown, the service refuses to start a cloud chat at all,","startTime":184.11111111111111,"endTime":187.62962962962962,"audioSegment":0},{"text":"whichever path asks for one.","startTime":187.62962962962962,"endTime":191.14814814814815,"audioSegment":0},{"text":"Web search and pages a gezel opens on its own carry what Gezel is researching.","startTime":191.14814814814815,"endTime":194.66666666666666,"audioSegment":0},{"text":"They are the main reason lockdown and free differ: a model that can reach the open web can be steered by what it reads there,","startTime":194.66666666666666,"endTime":198.1851851851852,"audioSegment":0},{"text":"so this is off by default.","startTime":198.1851851851852,"endTime":201.7037037037037,"audioSegment":0},{"text":"Saved web pages are fetched by the service,","startTime":201.7037037037037,"endTime":205.22222222222223,"audioSegment":0},{"text":"not the model, and Gezel works from the saved copies.","startTime":205.22222222222223,"endTime":208.74074074074073,"audioSegment":0},{"text":"At lockdown and free, sites a project follows refresh on a schedule.","startTime":208.74074074074073,"endTime":212.25925925925927,"audioSegment":0},{"text":"A web address you write in a message is saved when you send it,","startTime":212.25925925925927,"endTime":215.77777777777777,"audioSegment":0},{"text":"unless you press × on the line above the message box first.","startTime":215.77777777777777,"endTime":219.2962962962963,"audioSegment":0},{"text":"A gezel can ask for a page only when it is a link Gezel already found on a site the project follows,","startTime":219.2962962962963,"endTime":222.8148148148148,"audioSegment":0},{"text":"and you can make it ask you every time instead.","startTime":222.8148148148148,"endTime":226.33333333333334,"audioSegment":0},{"text":"Turning off App network in Settings → Security & compliance stops all of this.","startTime":226.33333333333334,"endTime":229.85185185185185,"audioSegment":0},{"text":"Saved web pages has the details.","startTime":229.85185185185185,"endTime":233.37037037037038,"audioSegment":0},{"text":"Connectors are run by the service, not the model.","startTime":233.37037037037038,"endTime":236.88888888888889,"audioSegment":0},{"text":"The service holds the credential,","startTime":236.88888888888889,"endTime":240.4074074074074,"audioSegment":0},{"text":"fetches the data and writes it into the project as files Gezel reads.","startTime":240.4074074074074,"endTime":243.92592592592592,"audioSegment":0},{"text":"At lockdown, a connection that can send or post moves data only when you start a sync,","startTime":243.92592592592592,"endTime":247.44444444444446,"audioSegment":0},{"text":"while one that only reads, such as a feed or a wiki, also refreshes on its own.","startTime":247.44444444444446,"endTime":250.96296296296296,"audioSegment":0},{"text":"At free every connection keeps itself in sync.","startTime":250.96296296296296,"endTime":254.48148148148147,"audioSegment":0},{"text":"Some connection types download the component they run from npm when you first connect them.","startTime":254.48148148148147,"endTime":258,"audioSegment":0},{"text":"Repositories a gezel clones go to the code host as an address.","startTime":258,"endTime":261.51851851851853,"audioSegment":0},{"text":"At lockdown a gezel can clone over https from the six public code hosts in the table,","startTime":261.51851851851853,"endTime":265.03703703703707,"audioSegment":0},{"text":"so reviewing a public repository keeps working; any other host needs free.","startTime":265.03703703703707,"endTime":268.55555555555554,"audioSegment":0},{"text":"Third-party toolsets and package scripts are code Gezel did not write and cannot sandbox,","startTime":268.55555555555554,"endTime":272.0740740740741,"audioSegment":0},{"text":"so they may reach the network whatever they like.","startTime":272.0740740740741,"endTime":275.5925925925926,"audioSegment":0},{"text":"They are available at free only.","startTime":275.5925925925926,"endTime":279.1111111111111,"audioSegment":0},{"text":"(One narrow exception: Gezel's own local preview browser may run at lower levels,","startTime":279.1111111111111,"endTime":282.6296296296296,"audioSegment":0},{"text":"locked to pages inside your project.)","startTime":282.6296296296296,"endTime":286.14814814814815,"audioSegment":0},{"text":"Update checks carry a version number, not your work.","startTime":286.14814814814815,"endTime":289.6666666666667,"audioSegment":0},{"text":"You can also turn off automatic update checks on their own,","startTime":289.6666666666667,"endTime":293.1851851851852,"audioSegment":0},{"text":"without changing the level.","startTime":293.1851851851852,"endTime":296.7037037037037,"audioSegment":0},{"text":"Downloads you start fetch files; they do not upload your work.","startTime":296.7037037037037,"endTime":300.22222222222223,"audioSegment":0},{"text":"Model files are checked against their published hashes,","startTime":300.22222222222223,"endTime":303.74074074074076,"audioSegment":0},{"text":"and the on-device engines against fingerprints built into the release you installed.","startTime":303.74074074074076,"endTime":307.25925925925924,"audioSegment":0},{"text":"Downloads Gezel starts on its own also fetch files and upload nothing.","startTime":307.25925925925924,"endTime":310.77777777777777,"audioSegment":0},{"text":"The text search model comes the first time Gezel needs it to search your files or memories by meaning.","startTime":310.77777777777777,"endTime":314.2962962962963,"audioSegment":0},{"text":"An image reader comes with an on-device chat model that cannot read images,","startTime":314.2962962962963,"endTime":317.8148148148148,"audioSegment":0},{"text":"unless Settings → Image recognition is set to Never.","startTime":317.8148148148148,"endTime":321.33333333333337,"audioSegment":0},{"text":"The relevance model is on for new installs, and the media-search model is on unless you turn media search off in Settings → Image recognition;","startTime":321.33333333333337,"endTime":324.85185185185185,"audioSegment":0},{"text":"a new install waits for its first project to finish, or for background work to begin, before fetching it.","startTime":324.85185185185185,"endTime":328.3703703703704,"audioSegment":0},{"text":"Libraries for pages a gezel writes, such as three.js or Chart.js,","startTime":328.3703703703704,"endTime":331.8888888888889,"audioSegment":0},{"text":"come from npm the first time a page needs one; Settings → More settings → Page libraries can turn that off.","startTime":331.8888888888889,"endTime":335.4074074074074,"audioSegment":0},{"text":"The search models and page libraries follow the security level,","startTime":335.4074074074074,"endTime":338.9259259259259,"audioSegment":0},{"text":"so super-lockdown stops them.","startTime":338.9259259259259,"endTime":342.44444444444446,"audioSegment":0},{"text":"Catalog updates you turn on download new versions of your installed knowledge catalogs,","startTime":342.44444444444446,"endTime":345.96296296296293,"audioSegment":0},{"text":"and new catalog content when live catalog updates are on (Settings → About).","startTime":345.96296296296293,"endTime":349.4814814814815,"audioSegment":0},{"text":"Both are off until you turn them on.","startTime":349.4814814814815,"endTime":353,"audioSegment":0},{"text":"Nothing goes to Bendyline.","startTime":353,"endTime":356.1666666666667,"audioSegment":0},{"text":"No level sends your chats, files or usage to us.","startTime":356.1666666666667,"endTime":359.3333333333333,"audioSegment":0},{"text":"The Bendyline-published places Gezel contacts are its GitHub releases and its npm packages,","startTime":359.3333333333333,"endTime":362.5,"audioSegment":0},{"text":"for updates, engines and tools, and Bendyline's Hugging Face datasets, for knowledge catalogs.","startTime":362.5,"endTime":365.6666666666667,"audioSegment":0},{"text":"Keys go only to their own service.","startTime":365.6666666666667,"endTime":368.8333333333333,"audioSegment":0},{"text":"A provider key is sent to that provider and nowhere else.","startTime":368.8333333333333,"endTime":372,"audioSegment":0},{"text":"Gezel keeps keys in your operating system's keychain,","startTime":372,"endTime":375.1666666666667,"audioSegment":0},{"text":"or in an encrypted file in its own folder where no keychain exists.","startTime":375.1666666666667,"endTime":378.3333333333333,"audioSegment":0},{"text":"The service answers only on this machine.","startTime":378.3333333333333,"endTime":381.5,"audioSegment":0},{"text":"It listens on this computer alone unless you pair another device to it for remote inference.","startTime":381.5,"endTime":384.6666666666667,"audioSegment":0},{"text":"Local-first: your data stays on your disk covers the same ground in plainer terms,","startTime":384.6666666666667,"endTime":387.8333333333333,"audioSegment":0},{"text":"and The security model explains how each level is enforced.","startTime":387.8333333333333,"endTime":391,"audioSegment":0}],"version":1},"startBlock":{"title":"What leaves this computer","subtitle":"Gezel has no Bendyline account and no Bendyline server between you and your work. Your projects, chats and files stay on this machine unless something on this page sends them somewhere. Below is every kind of traffic Gezel can make, what it carries, and which of the three security levels allows it.","ambientMotion":"zoomIn"}}</script>
