tion":{"start":{"line":44,"column":3,"offset":4399},"end":{"line":44,"column":48,"offset":4444}}},{"type":"text","value":" It listens on this computer alone unless you pair another device to it for remote inference.","position":{"start":{"line":44,"column":48,"offset":4444},"end":{"line":44,"column":141,"offset":4537}}}],"position":{"start":{"line":44,"column":3,"offset":4399},"end":{"line":44,"column":141,"offset":4537}}}],"position":{"start":{"line":44,"column":1,"offset":4397},"end":{"line":44,"column":141,"offset":4537}}}],"position":{"start":{"line":42,"column":1,"offset":3970},"end":{"line":44,"column":141,"offset":4537}}},{"type":"paragraph","children":[{"type":"link","url":"../privacy-local-first/","children":[{"type":"text","value":"Local-first: your data stays on your disk","position":{"start":{"line":46,"column":2,"offset":4540},"end":{"line":46,"column":43,"offset":4581}}}],"position":{"start":{"line":46,"column":1,"offset":4539},"end":{"line":46,"column":69,"offset":4607}}},{"type":"text","value":" covers the same ground in plainer terms, and ","position":{"start":{"line":46,"column":69,"offset":4607},"end":{"line":46,"column":115,"offset":4653}}},{"type":"link","url":"../security-model/","children":[{"type":"text","value":"The security model","position":{"start":{"line":46,"column":116,"offset":4654},"end":{"line":46,"column":134,"offset":4672}}}],"position":{"start":{"line":46,"column":115,"offset":4653},"end":{"line":46,"column":155,"offset":4693}}},{"type":"text","value":" explains how each level is enforced.","position":{"start":{"line":46,"column":155,"offset":4693},"end":{"line":46,"column":192,"offset":4730}}}],"position":{"start":{"line":46,"column":1,"offset":4539},"end":{"line":46,"column":192,"offset":4730}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel has no Bendyline account and no Bendyline server between you and your work. Your projects,","startTime":0,"endTime":3.4285714285714284,"audioSegment":0},{"text":"chats and files stay on this machine unless something on this page sends them somewhere.","startTime":3.4285714285714284,"endTime":6.857142857142857,"audioSegment":0},{"text":"Below is every kind of traffic Gezel can make, what it carries,","startTime":6.857142857142857,"endTime":10.285714285714285,"audioSegment":0},{"text":"and which of the three security levels allows it.","startTime":10.285714285714285,"endTime":13.714285714285714,"audioSegment":0},{"text":"You choose the level in Settings → Security & compliance,","startTime":13.714285714285714,"endTime":17.142857142857142,"audioSegment":0},{"text":"or with gezel security level set <level> on the command line.","startTime":17.142857142857142,"endTime":20.57142857142857,"audioSegment":0},{"text":"A new install starts at lockdown.","startTime":20.57142857142857,"endTime":24,"audioSegment":0},{"text":"Traffic What it carries super-lockdown lockdown free","startTime":24,"endTime":27.31818181818182,"audioSegment":0},{"text":"Local models (llama.cpp, MLX, DwarfStar, Ollama) Nothing leaves;","startTime":27.31818181818182,"endTime":30.636363636363637,"audioSegment":0},{"text":"the model runs on this machine Allowed Allowed Allowed","startTime":30.636363636363637,"endTime":33.95454545454545,"audioSegment":0},{"text":"Cloud model providers (API keys, Claude and Codex command-line tools, Copilot) Your conversation,","startTime":33.95454545454545,"endTime":37.27272727272727,"audioSegment":0},{"text":"and any files Gezel reads in it, to the provider you chose Blocked Allowed Allowed Web search,","startTime":37.27272727272727,"endTime":40.59090909090909,"audioSegment":0},{"text":"page fetches and Wikipedia lookups What Gezel searches for or the address it opens Blocked Blocked Allowed","startTime":40.59090909090909,"endTime":43.90909090909091,"audioSegment":0},{"text":"Mail sync and sending Your mailbox,","startTime":43.90909090909091,"endTime":47.22727272727273,"audioSegment":0},{"text":"to and from your mail provider Blocked Blocked Allowed","startTime":47.22727272727273,"endTime":50.54545454545455,"audioSegment":0},{"text":"Connectors (mail, calendars, issue trackers and similar) The connected account's data,","startTime":50.54545454545455,"endTime":53.86363636363637,"audioSegment":0},{"text":"copied into the project Blocked: no data moves When you start a sync Also syncs in the background","startTime":53.86363636363637,"endTime":57.18181818181819,"audioSegment":0},{"text":"Third-party toolsets (community MCP servers) Whatever that toolset sends;","startTime":57.18181818181819,"endTime":60.5,"audioSegment":0},{"text":"it is outside code Gezel cannot confine Blocked Blocked Allowed","startTime":60.5,"endTime":63.81818181818182,"audioSegment":0},{"text":"Package scripts Gezel runs (npm run, npx) Whatever the script sends;","startTime":63.81818181818182,"endTime":67.13636363636364,"audioSegment":0},{"text":"package scripts run with network access Blocked Blocked Allowed","startTime":67.13636363636364,"endTime":70.45454545454545,"audioSegment":0},{"text":"Automatic update checks (the app,","startTime":70.45454545454545,"endTime":73.77272727272728,"audioSegment":0},{"text":"and live catalog updates if you turn them on) Version checks to Gezel's GitHub releases and to npm Blocked Allowed Allowed","startTime":73.77272727272728,"endTime":77.0909090909091,"audioSegment":0},{"text":"Downloads you start: models, on-device engines, knowledge catalogs Requests for those files,","startTime":77.0909090909091,"endTime":80.4090909090909,"audioSegment":0},{"text":"from Hugging Face and Gezel's GitHub releases Allowed Allowed Allowed","startTime":80.4090909090909,"endTime":83.72727272727273,"audioSegment":0},{"text":"First-start tool setup Downloads of the browser-automation tools from npm and Playwright Allowed Allowed Allowed","startTime":83.72727272727273,"endTime":87.04545454545455,"audioSegment":0},{"text":"The levels are presets.","startTime":87.04545454545455,"endTime":90.36363636363637,"audioSegment":0},{"text":"Settings → Security & compliance can turn individual switches on or off;","startTime":90.36363636363637,"endTime":93.68181818181819,"audioSegment":0},{"text":"a combination that matches no preset is shown as Custom.","startTime":93.68181818181819,"endTime":97,"audioSegment":0},{"text":"Local models never send your words anywhere.","startTime":97,"endTime":99.88888888888889,"audioSegment":0},{"text":"A downloaded model runs in an engine on this machine,","startTime":99.88888888888889,"endTime":102.77777777777777,"audioSegment":0},{"text":"and Gezel treats Ollama, which you run yourself, the same way.","startTime":102.77777777777777,"endTime":105.66666666666667,"audioSegment":0},{"text":"Cloud model providers receive what you would send them using their own product,","startTime":105.66666666666667,"endTime":108.55555555555556,"audioSegment":0},{"text":"under their terms.","startTime":108.55555555555556,"endTime":111.44444444444444,"audioSegment":0},{"text":"Gezel talks to them directly from this machine and adds no middleman.","startTime":111.44444444444444,"endTime":114.33333333333333,"audioSegment":0},{"text":"At super-lockdown, the service refuses to start a cloud chat at all,","startTime":114.33333333333333,"endTime":117.22222222222223,"audioSegment":0},{"text":"whichever path asks for one.","startTime":117.22222222222223,"endTime":120.11111111111111,"audioSegment":0},{"text":"Web search and page fetches carry what Gezel is researching.","startTime":120.11111111111111,"endTime":123,"audioSegment":0},{"text":"They are the main reason lockdown and free differ: a model that can reach the open web can be steered by what it reads there,","startTime":123,"endTime":125.88888888888889,"audioSegment":0},{"text":"so this is off by default.","startTime":125.88888888888889,"endTime":128.77777777777777,"audioSegment":0},{"text":"Connectors are run by the service, not the model.","startTime":128.77777777777777,"endTime":131.66666666666666,"audioSegment":0},{"text":"The service holds the credential,","startTime":131.66666666666666,"endTime":134.55555555555554,"audioSegment":0},{"text":"fetches the data and writes it into the project as files Gezel reads.","startTime":134.55555555555554,"endTime":137.44444444444446,"audioSegment":0},{"text":"At lockdown they move data only when you ask;","startTime":137.44444444444446,"endTime":140.33333333333334,"audioSegment":0},{"text":"at free they also keep themselves in sync.","startTime":140.33333333333334,"endTime":143.22222222222223,"audioSegment":0},{"text":"Third-party toolsets and package scripts are code Gezel did not write and cannot sandbox,","startTime":143.22222222222223,"endTime":146.11111111111111,"audioSegment":0},{"text":"so they may reach the network whatever they like.","startTime":146.11111111111111,"endTime":149,"audioSegment":0},{"text":"They are available at free only.","startTime":149,"endTime":151.88888888888889,"audioSegment":0},{"text":"(One narrow exception: Gezel's own local preview browser may run at lower levels,","startTime":151.88888888888889,"endTime":154.77777777777777,"audioSegment":0},{"text":"locked to pages inside your project.)","startTime":154.77777777777777,"endTime":157.66666666666666,"audioSegment":0},{"text":"Update checks carry a version number, not your work.","startTime":157.66666666666666,"endTime":160.55555555555554,"audioSegment":0},{"text":"You can also turn off automatic update checks on their own,","startTime":160.55555555555554,"endTime":163.44444444444446,"audioSegment":0},{"text":"without changing the level.","startTime":163.44444444444446,"endTime":166.33333333333331,"audioSegment":0},{"text":"Downloads you start fetch files; they do not upload your work.","startTime":166.33333333333331,"endTime":169.22222222222223,"audioSegment":0},{"text":"Model files are checked against their published hashes,","startTime":169.22222222222223,"endTime":172.11111111111111,"audioSegment":0},{"text":"and the on-device engines against fingerprints built into the release you installed.","startTime":172.11111111111111,"endTime":175,"audioSegment":0},{"text":"Nothing goes to Bendyline.","startTime":175,"endTime":177.91666666666666,"audioSegment":0},{"text":"No level sends your chats, files or usage to us.","startTime":177.91666666666666,"endTime":180.83333333333334,"audioSegment":0},{"text":"The Bendyline-published places Gezel contacts are its GitHub releases and its npm packages,","startTime":180.83333333333334,"endTime":183.75,"audioSegment":0},{"text":"for updates, engines and tools.","startTime":183.75,"endTime":186.66666666666666,"audioSegment":0},{"text":"Keys go only to their own service.","startTime":186.66666666666666,"endTime":189.58333333333334,"audioSegment":0},{"text":"A provider key is sent to that provider and nowhere else.","startTime":189.58333333333334,"endTime":192.5,"audioSegment":0},{"text":"Gezel keeps keys in your operating system's keychain,","startTime":192.5,"endTime":195.41666666666666,"audioSegment":0},{"text":"or in an encrypted file in its own folder where no keychain exists.","startTime":195.41666666666666,"endTime":198.33333333333334,"audioSegment":0},{"text":"The service answers only on this machine.","startTime":198.33333333333334,"endTime":201.25,"audioSegment":0},{"text":"It listens on this computer alone unless you pair another device to it for remote inference.","startTime":201.25,"endTime":204.16666666666666,"audioSegment":0},{"text":"Local-first: your data stays on your disk covers the same ground in plainer terms,","startTime":204.16666666666666,"endTime":207.08333333333331,"audioSegment":0},{"text":"and The security model explains how each level is enforced.","startTime":207.08333333333331,"endTime":210,"audioSegment":0}],"version":1},"startBlock":{"title":"What leaves this computer","subtitle":"Gezel has no Bendyline account and no Bendyline server between you and your work. Your projects, chats and files stay on this machine unless something on this page sends them somewhere. Below is every kind of traffic Gezel can make, what it carries, and which of the three security levels allows it.","ambientMotion":"zoomIn"}}</script>
