pps-inside-gezel/","children":[{"type":"text","value":"Building AI Apps inside Gezel","position":{"start":{"line":123,"column":75,"offset":8339},"end":{"line":123,"column":104,"offset":8368}}}],"position":{"start":{"line":123,"column":74,"offset":8338},"end":{"line":123,"column":140,"offset":8404}}},{"type":"text","value":". If it lives in another application rather than inside Gezel's sandbox, use ","position":{"start":{"line":123,"column":140,"offset":8404},"end":{"line":123,"column":217,"offset":8481}}},{"type":"link","url":"../building-connected-apps-with-gezel-app-sdk/","children":[{"type":"text","value":"gezel-app-sdk","position":{"start":{"line":123,"column":218,"offset":8482},"end":{"line":123,"column":231,"offset":8495}}}],"position":{"start":{"line":123,"column":217,"offset":8481},"end":{"line":123,"column":280,"offset":8544}}},{"type":"text","value":" instead.","position":{"start":{"line":123,"column":280,"offset":8544},"end":{"line":123,"column":289,"offset":8553}}}],"position":{"start":{"line":123,"column":1,"offset":8265},"end":{"line":123,"column":289,"offset":8553}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A Gezel script is a small TypeScript automation that runs in a sandbox.","startTime":0,"endTime":3.857142857142857,"audioSegment":0},{"text":"It can inspect a project, create an artifact, update a task, ask a model a focused question,","startTime":3.857142857142857,"endTime":7.714285714285714,"audioSegment":0},{"text":"call an approved tool, or decide whether a craftbook step may advance.","startTime":7.714285714285714,"endTime":11.571428571428571,"audioSegment":0},{"text":"The @bendyline/gezel-sdk package is the typed bridge between that script and Gezel.","startTime":11.571428571428571,"endTime":15.428571428571429,"audioSegment":0},{"text":"Scripts are project-scoped by default and live as readable files under ~/.gezel/projects/{projectId}/scripts/.","startTime":15.428571428571429,"endTime":19.285714285714285,"audioSegment":0},{"text":"They can be run manually, attached to the start or end of a task step,","startTime":19.285714285714285,"endTime":23.142857142857142,"audioSegment":0},{"text":"used as a completion gate, or called by another script.","startTime":23.142857142857142,"endTime":27,"audioSegment":0},{"text":"Turn on Settings → About → Advanced → Show advanced features,","startTime":27,"endTime":30.416666666666668,"audioSegment":0},{"text":"then open Scripts from the sidebar.","startTime":30.416666666666668,"endTime":33.833333333333336,"audioSegment":0},{"text":"Choose a project and select New script.","startTime":33.833333333333336,"endTime":37.25,"audioSegment":0},{"text":"You can describe the automation for an AI draft,","startTime":37.25,"endTime":40.666666666666664,"audioSegment":0},{"text":"start from a working template, or begin with the blank skeleton.","startTime":40.666666666666664,"endTime":44.08333333333333,"audioSegment":0},{"text":"The built-in editor supplies autocomplete for the exact SDK version used by the running daemon.","startTime":44.08333333333333,"endTime":47.5,"audioSegment":0},{"text":"Saving checks the metadata, TypeScript syntax, and Node-compatible type syntax;","startTime":47.5,"endTime":50.916666666666664,"audioSegment":0},{"text":"Run supplies a form for the inputs declared by the script and shows its output, logs, calls, and errors.","startTime":50.916666666666664,"endTime":54.33333333333333,"audioSegment":0},{"text":"You do not need to install the SDK into each Gezel project.","startTime":54.33333333333333,"endTime":57.75,"audioSegment":0},{"text":"The daemon places its matching SDK in the sandbox at run time.","startTime":57.75,"endTime":61.166666666666664,"audioSegment":0},{"text":"Install @bendyline/gezel-sdk in a separate source repository only when that repository authors reusable scripts and should type-check them itself:","startTime":61.166666666666664,"endTime":64.58333333333333,"audioSegment":0},{"text":"npm install --save-dev @bendyline/gezel-sdk","startTime":64.58333333333333,"endTime":68,"audioSegment":0},{"text":"Every script exports a static meta block, reads validated input from gezel.input,","startTime":68,"endTime":70.03448275862068,"audioSegment":0},{"text":"and stamps one final result with gezel.output().","startTime":70.03448275862068,"endTime":72.06896551724138,"audioSegment":0},{"text":"This gate checks that a workspace contains a README with something in it before a task step can finish: import { defineScript, gezel,","startTime":72.06896551724138,"endTime":74.10344827586206,"audioSegment":0},{"text":"type GateScriptResult,","startTime":74.10344827586206,"endTime":76.13793103448276,"audioSegment":0},{"text":"type InferredInput,","startTime":76.13793103448276,"endTime":78.17241379310344,"audioSegment":0},{"text":"} from '@bendyline/gezel-sdk';","startTime":78.17241379310344,"endTime":80.20689655172414,"audioSegment":0},{"text":"export const meta = defineScript({","startTime":80.20689655172414,"endTime":82.24137931034483,"audioSegment":0},{"text":"name: 'require-readme',","startTime":82.24137931034483,"endTime":84.27586206896552,"audioSegment":0},{"text":"description: 'Require a README before this step can finish.', kind: 'gate', inputs: { path: {","startTime":84.27586206896552,"endTime":86.3103448275862,"audioSegment":0},{"text":"type: 'string',","startTime":86.3103448275862,"endTime":88.34482758620689,"audioSegment":0},{"text":"description: 'Workspace-relative README path.',","startTime":88.34482758620689,"endTime":90.37931034482759,"audioSegment":0},{"text":"default: 'README.md', }, },","startTime":90.37931034482759,"endTime":92.41379310344827,"audioSegment":0},{"text":"requires: ['workspace.read'], } as const);","startTime":92.41379310344827,"endTime":94.44827586206897,"audioSegment":0},{"text":"const input = gezel.input as InferredInput<typeof meta>;","startTime":94.44827586206897,"endTime":96.48275862068965,"audioSegment":0},{"text":"const files = await gezel.fs.listAll();","startTime":96.48275862068965,"endTime":98.51724137931035,"audioSegment":0},{"text":"const text = files.includes(input.path) ?","startTime":98.51724137931035,"endTime":100.55172413793103,"audioSegment":0},{"text":"await gezel.fs.read(input.path) : '';","startTime":100.55172413793103,"endTime":102.58620689655172,"audioSegment":0},{"text":"const result: GateScriptResult =","startTime":102.58620689655172,"endTime":104.62068965517241,"audioSegment":0},{"text":"text.trim().length > 0 ?","startTime":104.62068965517241,"endTime":106.65517241379311,"audioSegment":0},{"text":"{ decision: 'approve', message: `${input.path} is present.` } : {","startTime":106.65517241379311,"endTime":108.6896551724138,"audioSegment":0},{"text":"decision: 'reject',","startTime":108.6896551724138,"endTime":110.72413793103448,"audioSegment":0},{"text":"message: `Add ${input.path} with setup and usage instructions, then try again.`, };","startTime":110.72413793103448,"endTime":112.75862068965517,"audioSegment":0},{"text":"gezel.output(result);","startTime":112.75862068965517,"endTime":114.79310344827586,"audioSegment":0},{"text":"The file name is the script's invocation name,","startTime":114.79310344827586,"endTime":116.82758620689654,"audioSegment":0},{"text":"so keep it aligned with meta.name.","startTime":116.82758620689654,"endTime":118.86206896551724,"audioSegment":0},{"text":"Input descriptors drive the manual-run form and InferredInput;","startTime":118.86206896551724,"endTime":120.89655172413794,"audioSegment":0},{"text":"output descriptors document an action script's result.","startTime":120.89655172413794,"endTime":122.93103448275862,"audioSegment":0},{"text":"A gate instead returns approve or reject.","startTime":122.93103448275862,"endTime":124.9655172413793,"audioSegment":0},{"text":"A rejection must include a useful message because Gezel gives it directly to the working gezel as the repair instruction.","startTime":124.9655172413793,"endTime":127,"audioSegment":0},{"text":"The requires list is both documentation and an enforced permission boundary.","startTime":127,"endTime":129.9591836734694,"audioSegment":0},{"text":"A call fails with CAPABILITY_DENIED when the matching capability was not declared,","startTime":129.9591836734694,"endTime":132.91836734693877,"audioSegment":0},{"text":"and project or installation policy can still deny a declared capability.","startTime":132.91836734693877,"endTime":135.87755102040816,"audioSegment":0},{"text":"Capability SDK surface","startTime":135.87755102040816,"endTime":138.83673469387756,"audioSegment":0},{"text":"workspace.read, workspace.write gezel.fs for project workspace files: read,","startTime":138.83673469387756,"endTime":141.79591836734693,"audioSegment":0},{"text":"write, list, listAll, stat, rm, mkdir, rename","startTime":141.79591836734693,"endTime":144.75510204081633,"audioSegment":0},{"text":"artifacts.read, artifacts.write gezel.artifacts for generated project outputs","startTime":144.75510204081633,"endTime":147.71428571428572,"audioSegment":0},{"text":"documents.read, documents.write gezel.documents for the shared document library","startTime":147.71428571428572,"endTime":150.6734693877551,"audioSegment":0},{"text":"tasks.read, tasks.write gezel.task for task records, steps, and notes","startTime":150.6734693877551,"endTime":153.6326530612245,"audioSegment":0},{"text":"memory.read, memory.write gezel.memory for project memories","startTime":153.6326530612245,"endTime":156.59183673469389,"audioSegment":0},{"text":"index.read, index.refresh gezel.index for workspace-index status and the bounded make-it-fresh ensure","startTime":156.59183673469389,"endTime":159.55102040816325,"audioSegment":0},{"text":"reminders gezel.reminder.set() / clear() for the project's one reminder","startTime":159.55102040816325,"endTime":162.51020408163265,"audioSegment":0},{"text":"llm gezel.llm.oneShot()","startTime":162.51020408163265,"endTime":165.46938775510205,"audioSegment":0},{"text":"network gezel.mcp.call() and gezel.http","startTime":165.46938775510205,"endTime":168.42857142857144,"audioSegment":0},{"text":"credential:<name> plus network gezel.http.authed() with a project-approved named credential","startTime":168.42857142857144,"endTime":171.3877551020408,"audioSegment":0},{"text":"A reminder is for a time the script worked out from the project's own state,","startTime":171.3877551020408,"endTime":174.3469387755102,"audioSegment":0},{"text":"such as when the next flashcard comes due.","startTime":174.3469387755102,"endTime":177.30612244897958,"audioSegment":0},{"text":"It is never a time picked for its own sake.","startTime":177.30612244897958,"endTime":180.26530612244898,"audioSegment":0},{"text":"at must be in the future and at most 30 days ahead,","startTime":180.26530612244898,"endTime":183.22448979591837,"audioSegment":0},{"text":"the title is up to 80 characters, and the body up to 160.","startTime":183.22448979591837,"endTime":186.18367346938777,"audioSegment":0},{"text":"Setting a reminder replaces the project's earlier one.","startTime":186.18367346938777,"endTime":189.14285714285714,"audioSegment":0},{"text":"The app turns it into a notification, within the person's daily allowance.","startTime":189.14285714285714,"endTime":192.10204081632654,"audioSegment":0},{"text":"A register of due dates (permits, contract notice dates,","startTime":192.10204081632654,"endTime":195.0612244897959,"audioSegment":0},{"text":"certificates that expire) keeps its one reminder on the soonest open item.","startTime":195.0612244897959,"endTime":198.0204081632653,"audioSegment":0},{"text":"End every action that changes the register with the same step: find the earliest open item, take its due date minus the app's lead time,","startTime":198.0204081632653,"endTime":200.9795918367347,"audioSegment":0},{"text":"and set the reminder for that moment when it falls within the next 30 days; otherwise clear it.","startTime":200.9795918367347,"endTime":203.9387755102041,"audioSegment":0},{"text":"An item further out arms nothing yet.","startTime":203.9387755102041,"endTime":206.89795918367346,"audioSegment":0},{"text":"The next run of any of the register's tools re-arms it,","startTime":206.89795918367346,"endTime":209.85714285714286,"audioSegment":0},{"text":"so a status tool the page or the model calls routinely should run the step too.","startTime":209.85714285714286,"endTime":212.81632653061223,"audioSegment":0},{"text":"Wrap the call in try: a host without reminders still keeps the register.","startTime":212.81632653061223,"endTime":215.77551020408163,"audioSegment":0},{"text":"async function remindNextDue(items: Array<{ title: string;","startTime":215.77551020408163,"endTime":218.73469387755102,"audioSegment":0},{"text":"dueAt: string; open: boolean }>, leadDays: number) {","startTime":218.73469387755102,"endTime":221.69387755102042,"audioSegment":0},{"text":"const now = Date.now();","startTime":221.69387755102042,"endTime":224.6530612244898,"audioSegment":0},{"text":"const next = items","startTime":224.6530612244898,"endTime":227.6122448979592,"audioSegment":0},{"text":".filter((i) => i.open && Date.parse(i.dueAt) - leadDays * 86_400_000 > now)","startTime":227.6122448979592,"endTime":230.57142857142856,"audioSegment":0},{"text":".sort((a, b) => Date.parse(a.dueAt) - Date.parse(b.dueAt))[0];","startTime":230.57142857142856,"endTime":233.53061224489795,"audioSegment":0},{"text":"const at = next ?","startTime":233.53061224489795,"endTime":236.48979591836735,"audioSegment":0},{"text":"Date.parse(next.dueAt) - leadDays * 86_400_000 : NaN; try {","startTime":236.48979591836735,"endTime":239.44897959183675,"audioSegment":0},{"text":"if (!next || at - now > 30 * 86_400_000) await gezel.reminder.clear();","startTime":239.44897959183675,"endTime":242.40816326530611,"audioSegment":0},{"text":"else await gezel.reminder.set({ at: new Date(at).toISOString(),","startTime":242.40816326530611,"endTime":245.3673469387755,"audioSegment":0},{"text":"title: `${next.title} is due soon`, body: `Due ${next.dueAt.slice(0, 10)}.` }); } catch {","startTime":245.3673469387755,"endTime":248.32653061224488,"audioSegment":0},{"text":"// Reminders are a convenience; the register is the record. } }","startTime":248.32653061224488,"endTime":251.28571428571428,"audioSegment":0},{"text":"gezel.input, gezel.output(), gezel.log(), and gezel.script.run() need no capability.","startTime":251.28571428571428,"endTime":254.24489795918367,"audioSegment":0},{"text":"A nested script runs under its own metadata and permission set,","startTime":254.24489795918367,"endTime":257.2040816326531,"audioSegment":0},{"text":"and nesting is limited to four levels.","startTime":257.2040816326531,"endTime":260.1632653061224,"audioSegment":0},{"text":"Ask only for what the script needs. In particular,","startTime":260.1632653061224,"endTime":263.1224489795918,"audioSegment":0},{"text":"use gezel.fs for workspace I/O rather than importing Node's fs: raw filesystem code runs in an isolated scratch directory and cannot see the project workspace.","startTime":263.1224489795918,"endTime":266.0816326530612,"audioSegment":0},{"text":"For authenticated HTTP, the service attaches the named credential and scrubs it from the response;","startTime":266.0816326530612,"endTime":269.0408163265306,"audioSegment":0},{"text":"the secret value never enters the script.","startTime":269.0408163265306,"endTime":272,"audioSegment":0},{"text":"An action script produces ordinary structured output.","startTime":272,"endTime":274.7142857142857,"audioSegment":0},{"text":"Declare outputs in meta, then call gezel.output() exactly once with that shape.","startTime":274.7142857142857,"endTime":277.42857142857144,"audioSegment":0},{"text":"Actions are useful for reports, task updates, model-assisted transforms, and small integrations.","startTime":277.42857142857144,"endTime":280.14285714285717,"audioSegment":0},{"text":"A gate script sets kind: 'gate' and returns a GateScriptResult.","startTime":280.14285714285717,"endTime":282.85714285714283,"audioSegment":0},{"text":"approve allows the step to complete.","startTime":282.85714285714283,"endTime":285.57142857142856,"audioSegment":0},{"text":"reject holds the step and explains what must change.","startTime":285.57142857142856,"endTime":288.2857142857143,"audioSegment":0},{"text":"Optional goto routing can send work back to an earlier step,","startTime":288.2857142857143,"endTime":291,"audioSegment":0},{"text":"while an approved handoff can pass a message and parameters to the next step.","startTime":291,"endTime":293.7142857142857,"audioSegment":0},{"text":"After a script works manually,","startTime":293.7142857142857,"endTime":296.42857142857144,"audioSegment":0},{"text":"attach it from a task's step automation controls.","startTime":296.42857142857144,"endTime":299.14285714285717,"audioSegment":0},{"text":"Craftbooks can also ship scripts and connect them to step entry,","startTime":299.14285714285717,"endTime":301.85714285714283,"audioSegment":0},{"text":"exit, and gate moments.","startTime":301.85714285714283,"endTime":304.57142857142856,"audioSegment":0},{"text":"Gezel preserves a trace for each run: input, stamped output,","startTime":304.57142857142856,"endTime":307.2857142857143,"audioSegment":0},{"text":"logs, host calls, duration, trigger, and any error.","startTime":307.2857142857143,"endTime":310,"audioSegment":0},{"text":"The package has three public entry points: Import Purpose","startTime":310,"endTime":313,"audioSegment":0},{"text":"@bendyline/gezel-sdk defineScript, gezel, metadata types, inferred input/output types, and gate result types","startTime":313,"endTime":316,"audioSegment":0},{"text":"@bendyline/gezel-sdk/checks Reusable gate-check predicates, gateResult(),","startTime":316,"endTime":319,"audioSegment":0},{"text":"and workspaceFromGezel() for adapting gezel.fs to check helpers","startTime":319,"endTime":322,"audioSegment":0},{"text":"@bendyline/gezel-sdk/stores File-backed logStore, rosterStore,","startTime":322,"endTime":325,"audioSegment":0},{"text":"and integer-cents ledgerStore helpers for scripts that maintain structured project state","startTime":325,"endTime":328,"audioSegment":0},{"text":"The separate @bendyline/gezel-script-stdlib package contains Gezel's trusted standard gate scripts.","startTime":328,"endTime":331,"audioSegment":0},{"text":"Use those by their standard scope when they already express the check you need; write a project script when the behavior belongs to one project,","startTime":331,"endTime":334,"audioSegment":0},{"text":"and a reusable craftbook script when it belongs to a workflow others will install.","startTime":334,"endTime":337,"audioSegment":0},{"text":"If the code becomes part of a complete reusable in-Gezel experience,","startTime":337,"endTime":340,"audioSegment":0},{"text":"see Building AI Apps inside Gezel.","startTime":340,"endTime":343,"audioSegment":0},{"text":"If it lives in another application rather than inside Gezel's sandbox,","startTime":343,"endTime":346,"audioSegment":0},{"text":"use gezel-app-sdk instead.","startTime":346,"endTime":349,"audioSegment":0}],"version":1},"startBlock":{"title":"Writing scripts with gezel-sdk","subtitle":"A Gezel script is a small TypeScript automation that runs in a sandbox. It can inspect a project, create an artifact, update a task, ask a model a focused question, call an approved tool, or decide whether a craftbook step may advance. The @bendyline/gezel-sdk package is the typed bridge between that script and Gezel.","ambientMotion":"zoomIn"}}</script>
