n":332,"offset":6161}}}],"position":{"start":{"line":97,"column":1,"offset":5830},"end":{"line":97,"column":332,"offset":6161}}},{"type":"paragraph","children":[{"type":"text","value":"If the code becomes part of a complete reusable in-Gezel experience, see ","position":{"start":{"line":99,"column":1,"offset":6163},"end":{"line":99,"column":74,"offset":6236}}},{"type":"link","url":"../building-ai-apps-inside-gezel/","children":[{"type":"text","value":"Building AI Apps inside Gezel","position":{"start":{"line":99,"column":75,"offset":6237},"end":{"line":99,"column":104,"offset":6266}}}],"position":{"start":{"line":99,"column":74,"offset":6236},"end":{"line":99,"column":140,"offset":6302}}},{"type":"text","value":". If it lives in another application rather than inside Gezel's sandbox, use ","position":{"start":{"line":99,"column":140,"offset":6302},"end":{"line":99,"column":217,"offset":6379}}},{"type":"link","url":"../building-connected-apps-with-gezel-app-sdk/","children":[{"type":"text","value":"gezel-app-sdk","position":{"start":{"line":99,"column":218,"offset":6380},"end":{"line":99,"column":231,"offset":6393}}}],"position":{"start":{"line":99,"column":217,"offset":6379},"end":{"line":99,"column":280,"offset":6442}}},{"type":"text","value":" instead.","position":{"start":{"line":99,"column":280,"offset":6442},"end":{"line":99,"column":289,"offset":6451}}}],"position":{"start":{"line":99,"column":1,"offset":6163},"end":{"line":99,"column":289,"offset":6451}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A Gezel script is a small TypeScript automation that runs in a sandbox.","startTime":0,"endTime":3.857142857142857,"audioSegment":0},{"text":"It can inspect a project, create an artifact, update a task, ask a model a focused question,","startTime":3.857142857142857,"endTime":7.714285714285714,"audioSegment":0},{"text":"call an approved tool, or decide whether a craftbook step may advance.","startTime":7.714285714285714,"endTime":11.571428571428571,"audioSegment":0},{"text":"The @bendyline/gezel-sdk package is the typed bridge between that script and Gezel.","startTime":11.571428571428571,"endTime":15.428571428571429,"audioSegment":0},{"text":"Scripts are project-scoped by default and live as readable files under ~/.gezel/projects/{projectId}/scripts/.","startTime":15.428571428571429,"endTime":19.285714285714285,"audioSegment":0},{"text":"They can be run manually, attached to the start or end of a task step,","startTime":19.285714285714285,"endTime":23.142857142857142,"audioSegment":0},{"text":"used as a completion gate, or called by another script.","startTime":23.142857142857142,"endTime":27,"audioSegment":0},{"text":"Turn on Settings → About → Advanced → Show advanced features,","startTime":27,"endTime":30.416666666666668,"audioSegment":0},{"text":"then open Scripts from the sidebar.","startTime":30.416666666666668,"endTime":33.833333333333336,"audioSegment":0},{"text":"Choose a project and select New script.","startTime":33.833333333333336,"endTime":37.25,"audioSegment":0},{"text":"You can describe the automation for an AI draft,","startTime":37.25,"endTime":40.666666666666664,"audioSegment":0},{"text":"start from a working template, or begin with the blank skeleton.","startTime":40.666666666666664,"endTime":44.08333333333333,"audioSegment":0},{"text":"The built-in editor supplies autocomplete for the exact SDK version used by the running daemon.","startTime":44.08333333333333,"endTime":47.5,"audioSegment":0},{"text":"Saving checks the metadata, TypeScript syntax, and Node-compatible type syntax;","startTime":47.5,"endTime":50.916666666666664,"audioSegment":0},{"text":"Run supplies a form for the inputs declared by the script and shows its output, logs, calls, and errors.","startTime":50.916666666666664,"endTime":54.33333333333333,"audioSegment":0},{"text":"You do not need to install the SDK into each Gezel project.","startTime":54.33333333333333,"endTime":57.75,"audioSegment":0},{"text":"The daemon places its matching SDK in the sandbox at run time.","startTime":57.75,"endTime":61.166666666666664,"audioSegment":0},{"text":"Install @bendyline/gezel-sdk in a separate source repository only when that repository authors reusable scripts and should type-check them itself:","startTime":61.166666666666664,"endTime":64.58333333333333,"audioSegment":0},{"text":"npm install --save-dev @bendyline/gezel-sdk","startTime":64.58333333333333,"endTime":68,"audioSegment":0},{"text":"Every script exports a static meta block, reads validated input from gezel.input,","startTime":68,"endTime":70.07692307692308,"audioSegment":0},{"text":"and stamps one final result with gezel.output().","startTime":70.07692307692308,"endTime":72.15384615384616,"audioSegment":0},{"text":"This gate checks that a workspace contains a README before a task step can finish: import { defineScript, gezel,","startTime":72.15384615384616,"endTime":74.23076923076923,"audioSegment":0},{"text":"type GateScriptResult,","startTime":74.23076923076923,"endTime":76.3076923076923,"audioSegment":0},{"text":"type InferredInput,","startTime":76.3076923076923,"endTime":78.38461538461539,"audioSegment":0},{"text":"} from '@bendyline/gezel-sdk';","startTime":78.38461538461539,"endTime":80.46153846153847,"audioSegment":0},{"text":"export const meta = defineScript({","startTime":80.46153846153847,"endTime":82.53846153846155,"audioSegment":0},{"text":"name: 'require-readme',","startTime":82.53846153846155,"endTime":84.61538461538461,"audioSegment":0},{"text":"description: 'Require a README before this step can finish.', kind: 'gate', inputs: { path: {","startTime":84.61538461538461,"endTime":86.6923076923077,"audioSegment":0},{"text":"type: 'string',","startTime":86.6923076923077,"endTime":88.76923076923077,"audioSegment":0},{"text":"description: 'Workspace-relative README path.',","startTime":88.76923076923077,"endTime":90.84615384615384,"audioSegment":0},{"text":"default: 'README.md', }, },","startTime":90.84615384615384,"endTime":92.92307692307693,"audioSegment":0},{"text":"requires: ['workspace.read'], } as const);","startTime":92.92307692307693,"endTime":95,"audioSegment":0},{"text":"const input = gezel.input as InferredInput<typeof meta>;","startTime":95,"endTime":97.07692307692308,"audioSegment":0},{"text":"const files = await gezel.fs.listAll();","startTime":97.07692307692308,"endTime":99.15384615384616,"audioSegment":0},{"text":"const result: GateScriptResult = files.includes(input.path) ?","startTime":99.15384615384616,"endTime":101.23076923076923,"audioSegment":0},{"text":"{ decision: 'approve', message: `${input.path} is present.` } : {","startTime":101.23076923076923,"endTime":103.30769230769232,"audioSegment":0},{"text":"decision: 'reject',","startTime":103.30769230769232,"endTime":105.38461538461539,"audioSegment":0},{"text":"message: `Add ${input.path} with setup and usage instructions, then try again.`, };","startTime":105.38461538461539,"endTime":107.46153846153847,"audioSegment":0},{"text":"gezel.output(result);","startTime":107.46153846153847,"endTime":109.53846153846155,"audioSegment":0},{"text":"The file name is the script's invocation name,","startTime":109.53846153846155,"endTime":111.61538461538461,"audioSegment":0},{"text":"so keep it aligned with meta.name.","startTime":111.61538461538461,"endTime":113.6923076923077,"audioSegment":0},{"text":"Input descriptors drive the manual-run form and InferredInput;","startTime":113.6923076923077,"endTime":115.76923076923077,"audioSegment":0},{"text":"output descriptors document an action script's result.","startTime":115.76923076923077,"endTime":117.84615384615385,"audioSegment":0},{"text":"A gate instead returns approve or reject.","startTime":117.84615384615385,"endTime":119.92307692307693,"audioSegment":0},{"text":"A rejection must include a useful message because Gezel gives it directly to the working gezel as the repair instruction.","startTime":119.92307692307693,"endTime":122,"audioSegment":0},{"text":"The requires list is both documentation and an enforced permission boundary.","startTime":122,"endTime":125.83333333333333,"audioSegment":0},{"text":"A call fails with CAPABILITY_DENIED when the matching capability was not declared,","startTime":125.83333333333333,"endTime":129.66666666666666,"audioSegment":0},{"text":"and project or installation policy can still deny a declared capability.","startTime":129.66666666666666,"endTime":133.5,"audioSegment":0},{"text":"CapabilitySDK surfaceworkspace.read, workspace.writegezel.fs for project workspace filesartifacts.read, artifacts.writegezel.artifacts for generated project outputsdocuments.read, documents.writegezel.documents for the shared document librarytasks.read,","startTime":133.5,"endTime":137.33333333333334,"audioSegment":0},{"text":"tasks.writegezel.task for task records, steps, and notesmemory.read, memory.writegezel.memory for project memoriesllmgezel.llm.oneShot()networkgezel.mcp.call() and gezel.httpcredential:<name> plus networkgezel.http.authed() with a project-approved named credential","startTime":137.33333333333334,"endTime":141.16666666666666,"audioSegment":0},{"text":"gezel.input, gezel.output(), gezel.log(), and gezel.script.run() need no capability.","startTime":141.16666666666666,"endTime":145,"audioSegment":0},{"text":"A nested script runs under its own metadata and permission set,","startTime":145,"endTime":148.83333333333334,"audioSegment":0},{"text":"and nesting is limited to four levels.","startTime":148.83333333333334,"endTime":152.66666666666666,"audioSegment":0},{"text":"Ask only for what the script needs. In particular,","startTime":152.66666666666666,"endTime":156.5,"audioSegment":0},{"text":"use gezel.fs for workspace I/O rather than importing Node's fs: raw filesystem code runs in an isolated scratch directory and cannot see the project workspace.","startTime":156.5,"endTime":160.33333333333334,"audioSegment":0},{"text":"For authenticated HTTP, the service attaches the named credential and scrubs it from the response;","startTime":160.33333333333334,"endTime":164.16666666666669,"audioSegment":0},{"text":"the secret value never enters the script.","startTime":164.16666666666669,"endTime":168,"audioSegment":0},{"text":"An action script produces ordinary structured output.","startTime":168,"endTime":170.71428571428572,"audioSegment":0},{"text":"Declare outputs in meta, then call gezel.output() exactly once with that shape.","startTime":170.71428571428572,"endTime":173.42857142857142,"audioSegment":0},{"text":"Actions are useful for reports, task updates, model-assisted transforms, and small integrations.","startTime":173.42857142857142,"endTime":176.14285714285714,"audioSegment":0},{"text":"A gate script sets kind: 'gate' and returns a GateScriptResult.","startTime":176.14285714285714,"endTime":178.85714285714286,"audioSegment":0},{"text":"approve allows the step to complete.","startTime":178.85714285714286,"endTime":181.57142857142858,"audioSegment":0},{"text":"reject holds the step and explains what must change.","startTime":181.57142857142858,"endTime":184.28571428571428,"audioSegment":0},{"text":"Optional goto routing can send work back to an earlier step,","startTime":184.28571428571428,"endTime":187,"audioSegment":0},{"text":"while an approved handoff can pass a message and parameters to the next step.","startTime":187,"endTime":189.71428571428572,"audioSegment":0},{"text":"After a script works manually,","startTime":189.71428571428572,"endTime":192.42857142857144,"audioSegment":0},{"text":"attach it from a task's step automation controls.","startTime":192.42857142857144,"endTime":195.14285714285714,"audioSegment":0},{"text":"Craftbooks can also ship scripts and connect them to step entry,","startTime":195.14285714285714,"endTime":197.85714285714286,"audioSegment":0},{"text":"exit, and gate moments.","startTime":197.85714285714286,"endTime":200.57142857142856,"audioSegment":0},{"text":"Gezel preserves a trace for each run: input, stamped output,","startTime":200.57142857142856,"endTime":203.28571428571428,"audioSegment":0},{"text":"logs, host calls, duration, trigger, and any error.","startTime":203.28571428571428,"endTime":206,"audioSegment":0},{"text":"The package has three public entry points:","startTime":206,"endTime":209.7,"audioSegment":0},{"text":"ImportPurpose@bendyline/gezel-sdkdefineScript, gezel, metadata types, inferred input/output types, and gate result types@bendyline/gezel-sdk/checksReusable gate-check predicates, gateResult(),","startTime":209.7,"endTime":213.4,"audioSegment":0},{"text":"and workspaceFromGezel() for adapting gezel.fs to check helpers@bendyline/gezel-sdk/storesFile-backed logStore, rosterStore, and integer-cents ledgerStore helpers for scripts that maintain structured project state","startTime":213.4,"endTime":217.1,"audioSegment":0},{"text":"The separate @bendyline/gezel-script-stdlib package contains Gezel's trusted standard gate scripts.","startTime":217.1,"endTime":220.8,"audioSegment":0},{"text":"Use those by their standard scope when they already express the check you need; write a project script when the behavior belongs to one project,","startTime":220.8,"endTime":224.5,"audioSegment":0},{"text":"and a reusable craftbook script when it belongs to a workflow others will install.","startTime":224.5,"endTime":228.2,"audioSegment":0},{"text":"If the code becomes part of a complete reusable in-Gezel experience,","startTime":228.2,"endTime":231.9,"audioSegment":0},{"text":"see Building AI Apps inside Gezel.","startTime":231.9,"endTime":235.6,"audioSegment":0},{"text":"If it lives in another application rather than inside Gezel's sandbox,","startTime":235.6,"endTime":239.3,"audioSegment":0},{"text":"use gezel-app-sdk instead.","startTime":239.3,"endTime":243,"audioSegment":0}],"version":1},"startBlock":{"title":"Writing scripts with gezel-sdk","subtitle":"A Gezel script is a small TypeScript automation that runs in a sandbox. It can inspect a project, create an artifact, update a task, ask a model a focused question, call an approved tool, or decide whether a craftbook step may advance. The @bendyline/gezel-sdk package is the typed bridge between that script and Gezel.","ambientMotion":"zoomIn"}}</script>
