<script type="application/json" id="squisq-doc" data-squisq-doc="1">{"articleId":"gezel-in-docker","duration":328,"blocks":[{"id":"gezel-in-docker","startTime":0,"duration":27,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":1,"children":[{"type":"text","value":"Gezel in Docker","position":{"start":{"line":1,"column":3,"offset":2},"end":{"line":1,"column":18,"offset":17}}}],"position":{"start":{"line":1,"column":1,"offset":0},"end":{"line":1,"column":18,"offset":17}}},"title":"Gezel in Docker","contents":[{"type":"paragraph","children":[{"type":"text","value":"The Gezel image is the whole of Gezel in one container: the service, the web version of the app, the command line, and every engine that runs models on your own hardware. Nothing else needs installing. What it downloads is models: the one you choose, and smaller ones it uses to search your files and to read pictures, along with a web browser for tasks that visit websites.","position":{"start":{"line":3,"column":1,"offset":19},"end":{"line":3,"column":375,"offset":393}}}],"position":{"start":{"line":3,"column":1,"offset":19},"end":{"line":3,"column":375,"offset":393}}},{"type":"paragraph","children":[{"type":"text","value":"You need Docker. On Linux, Docker Engine; on Windows and macOS, Docker Desktop works too, with the limits under ","position":{"start":{"line":5,"column":1,"offset":395},"end":{"line":5,"column":113,"offset":507}}},{"type":"link","url":"#good-to-know","children":[{"type":"text","value":"Good to know","position":{"start":{"line":5,"column":114,"offset":508},"end":{"line":5,"column":126,"offset":520}}}],"position":{"start":{"line":5,"column":113,"offset":507},"end":{"line":5,"column":142,"offset":536}}},{"type":"text","value":".","position":{"start":{"line":5,"column":142,"offset":536},"end":{"line":5,"column":143,"offset":537}}}],"position":{"start":{"line":5,"column":1,"offset":395},"end":{"line":5,"column":143,"offset":537}}}],"children":[{"id":"gezel-in- [{"type":"text","value":"Then point the program at ","position":{"start":{"line":35,"column":1,"offset":1882},"end":{"line":35,"column":27,"offset":1908}}},{"type":"inlineCode","value":"http://localhost:6230/v1","position":{"start":{"line":35,"column":27,"offset":1908},"end":{"line":35,"column":53,"offset":1934}}},{"type":"text","value":" with that key. The key appears in Settings → Integrations, where you can see when it was last used and revoke it. To have a model ready without opening the app, name it when you start the container:","position":{"start":{"line":35,"column":53,"offset":1934},"end":{"line":35,"column":252,"offset":2133}}}],"position":{"start":{"line":35,"column":1,"offset":1882},"end":{"line":35,"column":252,"offset":2133}}},{"type":"code","lang":"sh","value":"docker run -d --name gezel -p 127.0.0.1:6230:6230 -v gezel:/gezel \\\n  -e GEZEL_PULL_MODEL=<model id> ghcr.io/bendyline/gezel","position":{"start":{"line":37,"column":1,"offset":2135},"end":{"line":40,"column":4,"offset":2269}}},{"type":"paragraph","children":[{"type":"inlineCode","value":"docker exec gezel gezel model list --available","position":{"start":{"line":42,"column":1,"offset":2271},"end":{"line":42,"column":49,"offset":2319}}},{"type":"text","value":" lists the model ids.","position":{"start":{"line":42,"column":49,"offset":2319},"end":{"line":42,"column":70,"offset":2340}}}],"position":{"start":{"line":42,"column":1,"offset":2271},"end":{"line":42,"column":70,"offset":2340}}}]},{"id":"put-gezel-to-work-on-a-folder","startTime":105,"duration":46,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Put Gezel to work on a folder","position":{"start":{"line":44,"column":4,"offset":2345},"end":{"line":44,"column":33,"offset":2374}}}],"position":{"start":{"line":44,"column":1,"offset":2342},"end":{"line":44,"column":33,"offset":2374}}},"title":"Put Gezel to work on a folder","contents":[{"type":"paragraph","children":[{"type":"text","value":"To run one craftbook on the folder you are in and collect what it makes:","position":{"start":{"line":46,"column":1,"offset":2376},"end":{"line":46,"column":73,"offset":2448}}}],"position":{"start":{"line":46,"column":1,"offset":2376},"end":{"line":46,"column":73,"offset":2448}}},{"type":"code","lang":"sh","value":"docker run --rm -v \"$PWD:$PWD\" -w \"$PWD\" -v gezel:/gezel ghcr.io/bendyline/gezel \\\n  do summarize-long \"Summarize these notes for the board\" --out ./gezel-out","position":{"start":{"line":48,"column":1,"offset":2450},"end":{"line":51,"column":4,"offset":2618}}},{"type":"paragraph","children":[{"type":"text","value":"Mounting the folder at the same path inside the container keeps each folder its own project. Gezel reads the folder and writes its results to ","position":{"start":{"line":53,"column":1,"offset":2620},"end":{"line":53,"column":143,"offset":2762}}},{"type":"inlineCode","value":"./gezel-out","position":{"start":{"line":53,"column":143,"offset":2762},"end":{"line":53,"column":156,"offset":2775}}},{"type":"text","value":"; it changes nothing else there.","position":{"start":{"line":53,"column":156,"offset":2775},"end":{"line":53,"column":188,"offset":2807}}}],"position":{"start":{"line":53,"column":1,"offset":2620},"end":{"line":53,"column":188,"offset":2807}}},{"type":"paragraph","children":[{"type":"text","value":"A Windows path cannot be used inside the container, so in PowerShell give the folder a path of its own there, named after it:","position":{"start":{"line":55,"column":1,"offset":2809},"end":{"line":55,"column":126,"offset":2934}}}],"position":{"start":{"line":55,"column":1,"offset":2809},"end":{"line":55,"column":126,"offset":2934}}},{"type":"code","lang":"powershell","value":"docker run --rm -v \"${PWD}:/projects/board-notes\" -w /projects/board-notes -v gezel:/gezel ghcr.io/bendyline/gezel `\n  do summarize-long \"Summarize these notes for the board\" --out ./gezel-out","position":{"start":{"line":57,"column":1,"offset":2936},"end":{"line":60,"column":4,"offset":3146}}},{"type":"paragraph","children":[{"type":"text","value":"If a Gezel container is already running on the same volume, use it instead of starting a second one (Gezel refuses to run twice on one volume): mount your folders when you start it, then run ","position":{"start":{"line":62,"column":1,"offset":3148},"end":{"line":62,"column":192,"offset":3339}}},{"type":"inlineCode","value":"docker exec gezel gezel do …","position":{"start":{"line":62,"column":192,"offset":3339},"end":{"line":62,"column":222,"offset":3369}}},{"type":"text","value":".","position":{"start":{"line":62,"column":222,"offset":3369},"end":{"line":62,"column":223,"offset":3370}}}],"position":{"start":{"line":62,"column":1,"offset":3148},"end":{"line":62,"column":223,"offset":3370}}}]},{"id":"people-and-passwords","startTime":151,"duration":40,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"People and passwords","position":{"start":{"line":64,"column":4,"offset":3375},"end":{"line":64,"column":24,"offset":3395}}}],"position":{"start":{"line":64,"column":1,"offset":3372},"end":{"line":64,"column":24,"offset":3395}}},"title":"People and passwords","contents":[{"type":"paragraph","children":[{"type":"text","value":"Everyone who signs in has an account. Add people in Settings → Accounts, or from the computer running Docker:","position":{"start":{"line":66,"column":1,"offset":3397},"end":{"line":66,"column":110,"offset":3506}}}],"position":{"start":{"line":66,"column":1,"offset":3397},"end":{"line":66,"column":110,"offset":3506}}},{"type":"code","lang":"sh","value":"docker exec -it gezel gezel account create Ana","position":{"start":{"line":68,"column":1,"offset":3508},"end":{"line":70,"column":4,"offset":3564}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Everyone you add can do everything you can","position":{"start":{"line":72,"column":3,"offset":3568},"end":{"line":72,"column":45,"offset":3610}}}],"position":{"start":{"line":72,"column":1,"offset":3566},"end":{"line":72,"column":47,"offset":3612}}},{"type":"text","value":", including open a terminal in the container. Add only people you would hand the keys to.","position":{"start":{"line":72,"column":47,"offset":3612},"end":{"line":72,"column":136,"offset":3701}}}],"position":{"start":{"line":72,"column":1,"offset":3566},"end":{"line":72,"column":136,"offset":3701}}},{"type":"paragraph","children":[{"type":"text","value":"If someone forgets their password, anyone who can sign in can set a new one in Settings → Accounts. If nobody can sign in, set one from the computer running Docker:","position":{"start":{"line":74,"column":1,"offset":3703},"end":{"line":74,"column":165,"offset":3867}}}],"position":{"start":{"line":74,"column":1,"offset":3703},"end":{"line":74,"column":165,"offset":3867}}},{"type":"code","lang":"sh","value":"docker exec -it gezel gezel account reset-password Ana","position":{"start":{"line":76,"column":1,"offset":3869},"end":{"line":78,"column":4,"offset":3933}}},{"type":"paragraph","children":[{"type":"text","value":"To start without the setup link (for a server you set up by script), give the first account's name and keep its password in a file:","position":{"start":{"line":80,"column":1,"offset":3935},"end":{"line":80,"column":132,"offset":4066}}}],"position":{"start":{"line":80,"column":1,"offset":3935},"end":{"line":80,"column":132,"offset":4066}}},{"type":"code","lang":"sh","value":"docker run -d --name gezel -p 127.0.0.1:6230:6230 -v gezel:/gezel \\\n  -e GEZEL_OWNER_NAME=you -e GEZEL_OWNER_PASSWORD_FILE=/run/secrets/owner \\\n  -v ./owner-password.txt:/run/secrets/owner:ro ghcr.io/bendyline/gezel","position":{"start":{"line":82,"column":1,"offset":4068},"end":{"line":86,"column":4,"offset":4293}}}]},{"id":"security-level-and-activity","startTime":191,"duration":26,"audioSegment":0,"template":"sectionHeader olumn":174,"offset":4500}}},{"type":"text","value":": Gezel answers, runs the tasks you start and keeps to schedules, but does not start work of its own, which on a server would compete with your requests. To start differently, set them for the first start:","position":{"start":{"line":90,"column":174,"offset":4500},"end":{"line":90,"column":379,"offset":4705}}}],"position":{"start":{"line":90,"column":1,"offset":4327},"end":{"line":90,"column":379,"offset":4705}}},{"type":"code","lang":"sh","value":"-e GEZEL_INITIAL_SECURITY_LEVEL=super-lockdown -e GEZEL_INITIAL_MODE=reactive+tasks","position":{"start":{"line":92,"column":1,"offset":4707},"end":{"line":94,"column":4,"offset":4800}}},{"type":"paragraph","children":[{"type":"text","value":"They apply only to a new volume. After that, change them in Settings or with ","position":{"start":{"line":96,"column":1,"offset":4802},"end":{"line":96,"column":78,"offset":4879}}},{"type":"inlineCode","value":"docker exec gezel gezel security level set …","position":{"start":{"line":96,"column":78,"offset":4879},"end":{"line":96,"column":124,"offset":4925}}},{"type":"text","value":" and ","position":{"start":{"line":96,"column":124,"offset":4925},"end":{"line":96,"column":129,"offset":4930}}},{"type":"inlineCode","value":"docker exec gezel gezel mode …","position":{"start":{"line":96,"column":129,"offset":4930},"end":{"line":96,"column":161,"offset":4962}}},{"type":"text","value":".","position":{"start":{"line":96,"column":161,"offset":4962},"end":{"line":96,"column":162,"offset":4963}}}],"position":{"start":{"line":96,"column":1,"offset":4802},"end":{"line":96,"column":162,"offset":4963}}}]},{"id":"reaching-it-from-other-devices","startTime":217,"duration":24,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Reaching it from other devices","position":{"start":{"line":98,"column":4,"offset":4968},"end":{"line":98,"column":34,"offset":4998}}}],"position":{"start":{"line":98,"column":1,"offset":4965},"end":{"line":98,"column":34,"offset":4998}}},"title":"Reaching it from other devices","contents":[{"type":"paragraph","children":[{"type":"text","value":"The commands above keep Gezel on the computer running Docker. To use it from a phone or another computer on your network, put HTTPS in front of it. The ","position":{"start":{"line":100,"column":1,"offset":5000},"end":{"line":100,"column":153,"offset":5152}}},{"type":"inlineCode","value":"docker/","position":{"start":{"line":100,"column":153,"offset":5152},"end":{"line":100,"column":162,"offset":5161}}},{"type":"text","value":" folder of the Gezel repository has a Compose setup that does this with Caddy:","position":{"start":{"line":100,"column":162,"offset":5161},"end":{"line":100,"column":240,"offset":5239}}}],"position":{"start":{"line":100,"column":1,"offset":5000},"end":{"line":100,"column":240,"offset":5239}}},{"type":"code","lang":"sh","value":"GEZEL_HOSTNAME=gezel.home docker compose -f compose.yaml -f compose.lan.yaml up -d","position":{"start":{"line":102,"column":1,"offset":5241},"end":{"line":104,"column":4,"offset":5333}}},{"type":"paragraph","children":[{"type":"text","value":"Caddy signs with its own certificate, which other devices warn about until you install Caddy's root certificate on them. Gezel answers only at the name you give it.","position":{"start":{"line":106,"column":1,"offset":5335},"end":{"line":106,"column":165,"offset":5499}}}],"position":{"start":{"line":106,"column":1,"offset":5335},"end":{"line":106,"column":165,"offset":5499}}}]},{"id":"updating","startTime":241,"duration":42,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Updating","position":{"start":{"line":108,"column":4,"offset":5504},"end":{"line":108,"column":12,"offset":5512}}}],"position":{"start":{"line":108,"column":1,"offset":5501},"end":{"line":108,"column":12,"offset":5512}}},"title":"Updating","contents":[{"type":"paragraph","children":[{"type":"text","value":"Pull the new image and start a new container on the same volume:","position":{"start":{"line":110,"column":1,"offset":5514},"end":{"line":110,"column":65,"offset":5578}}}],"position":{"start":{"line":110,"column":1,"offset":5514},"end":{"line":110,"column":65,"offset":5578}}},{"type":"code","lang":"sh","value":"docker pull ghcr.io/bendyline/gezel\ndocker rm -f gezel\ndocker run -d --name gezel -p 127.0.0.1:6230:6230 -v gezel:/gezel ghcr.io/bendyline/gezel","position":{"start":{"line":112,"column":1,"offset":5580},"end":{"line":116,"column":4,"offset":5734}}},{"type":"paragraph","children":[{"type":"text","value":"The 1.2.12 image answered on port 6228, and newer images answer on 6230. If you started Gezel with ","position":{"start":{"line":118,"column":1,"offset":5736},"end":{"line":118,"column":100,"offset":5835}}},{"type":"inlineCode","value":"-p 127.0.0.1:6228:6228","position":{"start":{"line":118,"column":100,"offset":5835},"end":{"line":118,"column":124,"offset":5859}}},{"type":"text","value":", start the new container with the command above. Everything in the volume carries over, accounts and keys included: sign in again at ","position":{"start":{"line":118,"column":124,"offset":5859},"end":{"line":118,"column":258,"offset":5993}}},{"type":"inlineCode","value":"http://localhost:6230","position":{"start":{"line":118,"column":258,"offset":5993},"end":{"line":118,"column":281,"offset":6016}}},{"type":"text","value":", and point programs that use Gezel's models at ","position":{"start":{"line":118,"column":281,"offset":6016},"end":{"line":118,"column":329,"offset":6064}}},{"type":"inlineCode","value":"http://localhost:6230/v1","position":{"start":{"line":118,"column":329,"offset":6064},"end":{"line":118,"column":355,"offset":6090}}},{"type":"text","value":". To keep using 6228, start it with ","position":{"start":{"line":118,"column":355,"offset":6090},"end":{"line":118,"column":391,"offset":6126}}},{"type":"inlineCode","value":"-p 127.0.0.1:6228:6228 -e GEZEL_CONTAINER_PORT=6228","position":{"start":{"line":118,"column":391,"offset":6126},"end":{"line":118,"column":444,"offset":6179}}},{"type":"text","value":" instead.","position":{"start":{"line":118,"column":444,"offset":6179},"end":{"line":118,"column":453,"offset":6188}}}],"position":{"start":{"line":118,"column":1,"offset":5736},"end":{"line":118,"column":453,"offset":6188}}},{"type":"paragraph","children":[{"type":"text","value":"Image versions match the ","position":{"start":{"line":120,"column":1,"offset":6190},"end":{"line":120,"column":26,"offset":6215}}},{"type":"link","url":"../cli-reference/","children":[{"type":"text","value":"command line's","position":{"start":{"line":120,"column":27,"offset":6216},"end":{"line":120,"column":41,"offset":6230}}}],"position":{"start":{"line":120,"column":26,"offset":6215},"end":{"line":120,"column":61,"offset":6250}}},{"type":"text","value":": ","position":{"start":{"line":120,"column":61,"offset":6250},"end":{"line":120,"column":63,"offset":6252}}},{"type":"inlineCode","value":"ghcr.io/bendyline/gezel:1.2.12","position":{"start":{"line":120,"column":63,"offset":6252},"end":{"line":120,"column":95,"offset":6284}}},{"type":"text","value":" is the same Gezel as ","position":{"start":{"line":120,"column":95,"offset":6284},"end":{"line":120,"column":117,"offset":6306}}},{"type":"inlineCode","value":"npm install -g @bendyline/gezel-cli@1.2.12","position":{"start":{"line":120,"column":117,"offset":6306},"end":{"line":120,"column":161,"offset":6350}}},{"type":"text","value":". The first image is 1.2.12. The same images are on Docker Hub as ","position":{"start":{"line":120,"column":161,"offset":6350},"end":{"line":120,"column":227,"offset":6416}}},{"type":"inlineCode","value":"bendyline/gezel","position":{"start":{"line":120,"column":227,"offset":6416},"end":{"line":120,"column":244,"offset":6433}}},{"type":"text","value":".","position":{"start":{"line":120,"column":244,"offset":6433},"end":{"line":120,"column":245,"offset":6434}}}],"position":{"start":{"line":120,"column":1,"offset":6190},"end":{"line":120,"column":245,"offset":6434}}},{"type":"paragraph","children":[{"type":"text","value":"Back up the ","position":{"start":{"line":122,"column":1,"offset":6436},"end":{"line":122,"column":13,"offset":6448}}},{"type":"inlineCode","value":"gezel","position":{"start":{"line":122,"column":13,"offset":6448},"end":{"line":122,"column":20,"offset":6455}}},{"type":"text","value":" volume like any other data. It holds plain files; see ","position":{"start":{"line":122,"column":20,"offset":6455},"end":{"line":122,"column":75,"offset":6510}}},{"type":"link","url":"../where-files-live/","children":[{"type":"text","value":"Where files live","position":{"start":{"line":122,"column":76,"offset":6511},"end":{"line":122,"column":92,"offset":6527}}}],"position":{"start":{"line":122,"column":75,"offset":6510},"end":{"line":122,"column":115,"offset":6550}}},{"type":"text","value":".","position":{"start":{"line":122,"column":115,"offset":6550},"end":{"line":122,"column":116,"offset":6551}}}],"position":{"start":{"line":122,"column":1,"offset":6436},"end":{"line":122,"column":116,"offset":6551}}}]},{"id":"good-to-know","startTime":283,"duration":45,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Good to know","position":{"start":{"line":124,"column":4,"offset":6556},"end":{"line":124,"column":16,"offset":6568}}}],"position":{"start":{"line":124,"column":1,"offset":6553},"end":{"line":124,"column":16,"offset":6568}}},"title":"Good to know","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The container uses port 6230, so it can run beside the Gezel app","position":{"start":{"line":126,"column":5,"offset":6574},"end":{"line":126,"column":69,"offset":6638}}}],"position":{"start":{"line":126,"column":3,"offset":6572},"end":{"line":126,"column":71,"offset":6640}}},{"type":"text","value":", which uses 6228. To publish another port, tell the container the address to print in its setup link: ","position":{"start":{"line":126,"column":71,"offset":6640},"end":{"line":126,"column":174,"offset":6743}}},{"type":"inlineCode","value":"-p 127.0.0.1:6300:6230 -e GEZEL_PUBLIC_URL=http://localhost:6300","position":{"start":{"line":126,"column":174,"offset":6743},"end":{"line":126,"column":240,"offset":6809}}},{"type":"text","value":", then open ","position":{"start":{"line":126,"column":240,"offset":6809},"end":{"line":126,"column":252,"offset":6821}}},{"type":"inlineCode","value":"http://localhost:6300","position":{"start":{"line":126,"column":252,"offset":6821},"end":{"line":126,"column":275,"offset":6844}}},{"type":"text","value":".","position":{"start":{"line":126,"column":275,"offset":6844},"end":{"line":126,"column":276,"offset":6845}}}],"position":{"start":{"line":126,"column":3,"offset":6572},"end":{"line":126,"column":276,"offset":6845}}}],"position":{"start":{"line":126,"column":1,"offset":6570},"end":{"line":126,"column":276,"offset":6845}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"On a Mac, Docker cannot use the graphics chip","position":{"start":{"line":127,"column":5,"offset":6850},"end":{"line":127,"column":50,"offset":6895}}}],"position":{"start":{"line":127,"column":3,"offset":6848},"end":{"line":127,"column":52,"offset":6897}}},{"type":"text","value":", so models run on the processor and are slow. Use the Gezel app on a Mac.","position":{"start":{"line":127,"column":52,"offset":6897},"end":{"line":127,"column":126,"offset":6971}}}],"position":{"start":{"line":127,"column":3,"offset":6848},"end":{"line":127,"column":126,"offset":6971}}}],"position":{"start":{"line":127,"column":1,"offset":6846},"end":{"line":127,"column":126,"offset":6971}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Docker Desktop on Windows","position":{"start":{"line":128,"column":5,"offset":6976},"end":{"line":128,"column":30,"offset":7001}}}],"position":{"start":{"line":128,"column":3,"offset":6974},"end":{"line":128,"column":32,"offset":7003}}},{"type":"text","value":" passes NVIDIA cards through; it has no Vulkan, so AMD and Intel cards are not used there.","position":{"start":{"line":128,"column":32,"offset":7003},"end":{"line":128,"column":122,"offset":7093}}}],"position":{"start":{"line":128,"column":3,"offset":6974},"end":{"line":128,"column":122,"offset":7093}}}],"position":{"start":{"line":128,"column":1,"offset":6972},"end":{"line":128,"column":122,"offset":7093}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The NVIDIA image for ARM computers","position":{"start":{"line":129,"column":5,"offset":7098},"end":{"line":129,"column":39,"offset":7132}}}],"position":{"start":{"line":129,"column":3,"offset":7096},"end":{"line":129,"column":41,"offset":7134}}},{"type":"text","value":" is built for DGX Spark (GB10).","position":{"start":{"line":129,"column":41,"offset":7134},"end":{"line":129,"column":72,"offset":7165}}}],"position":{"start":{"line":129,"column":3,"offset":7096},"end":{"line":129,"column":72,"offset":7165}}}],"position":{"start":{"line":129,"column":1,"offset":7094},"end":{"line":129,"column":72,"offset":7165}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Files Gezel writes into a folder you mounted","position":{"start":{"line":130,"column":5,"offset":7170},"end":{"line":130,"column":49,"offset":7214}}}],"position":{"start":{"line":130,"column":3,"offset":7168},"end":{"line":130,"column":51,"offset":7216}}},{"type":"text","value":" belong to user 10001. Add ","position":{"start":{"line":130,"column":51,"offset":7216},"end":{"line":130,"column":78,"offset":7243}}},{"type":"inlineCode","value":"--user \"$(id -u):$(id -g)\"","position":{"start":{"line":130,"column":78,"offset":7243},"end":{"line":130,"column":106,"offset":7271}}},{"type":"text","value":" to keep them yours.","position":{"start":{"line":130,"column":106,"offset":7271},"end":{"line":130,"column":126,"offset":7291}}}],"position":{"start":{"line":130,"column":3,"offset":7168},"end":{"line":130,"column":126,"offset":7291}}}],"position":{"start":{"line":130,"column":1,"offset":7166},"end":{"line":130,"column":126,"offset":7291}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Some craftbook steps run small scripts that must not reach the network.","position":{"start":{"line":131,"column":5,"offset":7296},"end":{"line":131,"column":76,"offset":7367}}}],"position":{"start":{"line":131,"column":3,"offset":7294},"end":{"line":131,"column":78,"offset":7369}}},{"type":"text","value":" The image runs them in a network sandbox. If a step says no sandbox is available, update to a newer image.","position":{"start":{"line":131,"column":78,"offset":7369},"end":{"line":131,"column":185,"offset":7476}}}],"position":{"start":{"line":131,"column":3,"offset":7294},"end":{"line":131,"column":185,"offset":7476}}}],"position":{"start":{"line":131,"column":1,"offset":7292},"end":{"line":131,"column":185,"offset":7476}}}],"position":{"start":{"line":126,"column":1,"offset":6570},"end":{"line":131,"column":185,"offset":7476}}}],"autoTemplate":true,"templateData":{"items":["The container uses port 6230, so it can run beside the Gezel app, which uses 6228. To publish another port, tell the container the address to print in its setup link: -p 127.0.0.1:6300:6230 -e GEZEL_PUBLIC_URL=http://localhost:6300, then open http://localhost:6300.","On a Mac, Docker cannot use the graphics chip, so models run on the processor and are slow. Use the Gezel app on a Mac.","Docker Desktop on Windows passes NVIDIA cards through; it has no Vulkan, so AMD and Intel cards are not used there.","The NVIDIA image for ARM computers is built for DGX Spark (GB10).","Files Gezel writes into a folder you mounted belong to user 10001. Add --user \"$(id -u):$(id -g)\" to keep them yours.","Some craftbook steps run small scripts that must not reach the network. The image runs them in a network sandbox. If a step says no sandbox is available, update to a newer image."],"ordered":false,"title":"Good to know"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Gezel image is the whole of Gezel in one container: the service, the web version of the app,","startTime":0,"endTime":3.375,"audioSegment":0},{"text":"the command line, and every engine that runs models on your own hardware.","startTime":3.375,"endTime":6.75,"audioSegment":0},{"text":"Nothing else needs installing.","startTime":6.75,"endTime":10.125,"audioSegment":0},{"text":"What it downloads is models: the one you choose, and smaller ones it uses to search your files and to read pictures,","startTime":10.125,"endTime":13.5,"audioSegment":0},{"text":"along with a web browser for tasks that visit websites.","startTime":13.5,"endTime":16.875,"audioSegment":0},{"text":"You need Docker.","startTime":16.875,"endTime":20.25,"audioSegment":0},{"text":"On Linux, Docker Engine; on Windows and macOS,","startTime":20.25,"endTime":23.625,"audioSegment":0},{"text":"Docker Desktop works too, with the limits under Good to know.","startTime":23.625,"endTime":27,"audioSegment":0},{"text":"docker run -d --name gezel -p 127.0.0.1:6230:6230 -v gezel:/gezel ghcr.io/bendyline/gezel","startTime":27,"endTime":30.11111111111111,"audioSegment":0},{"text":"docker logs gezel","startTime":30.11111111111111,"endTime":33.22222222222222,"audioSegment":0},{"text":"The log ends with a link like http://localhost:6230/?setup=….","startTime":33.22222222222222,"endTime":36.333333333333336,"audioSegment":0},{"text":"Open it, pick a name and a password,","startTime":36.333333333333336,"endTime":39.44444444444444,"audioSegment":0},{"text":"and you have the first account on this Gezel.","startTime":39.44444444444444,"endTime":42.55555555555556,"audioSegment":0},{"text":"The link works once, for an hour; if it runs out,","startTime":42.55555555555556,"endTime":45.66666666666667,"audioSegment":0},{"text":"run docker logs gezel again after opening http://localhost:6230, and a new one appears.","startTime":45.66666666666667,"endTime":48.77777777777778,"audioSegment":0},{"text":"Everything Gezel keeps (your crew, projects, chats, memories and models) lives in the gezel volume,","startTime":48.77777777777778,"endTime":51.888888888888886,"audioSegment":0},{"text":"so removing the container and starting a new one picks up where you left off.","startTime":51.888888888888886,"endTime":55,"audioSegment":0},{"text":"Your GPU Add to the command Use the image","startTime":55,"endTime":58.8,"audioSegment":0},{"text":"NVIDIA --gpus all ghcr.io/bendyline/gezel:cuda","startTime":58.8,"endTime":62.6,"audioSegment":0},{"text":"AMD or Intel --device /dev/dri --group-add video --group-add $(getent group render | cut -d: -f3) ghcr.io/bendyline/gezel:vulkan","startTime":62.6,"endTime":66.4,"audioSegment":0},{"text":"NVIDIA needs the NVIDIA driver and the NVIDIA Container Toolkit on the computer running Docker.","startTime":66.4,"endTime":70.2,"audioSegment":0},{"text":"Gezel checks the card when it starts and falls back to the processor when it cannot use it.","startTime":70.2,"endTime":74,"audioSegment":0},{"text":"Your other programs can use Gezel's models through the same kind of web address they would use for OpenAI.","startTime":74,"endTime":76.81818181818181,"audioSegment":0},{"text":"Make a key for each program:","startTime":76.81818181818181,"endTime":79.63636363636364,"audioSegment":0},{"text":"docker exec gezel gezel integrations token create my-notebook","startTime":79.63636363636364,"endTime":82.45454545454545,"audioSegment":0},{"text":"Then point the program at http://localhost:6230/v1 with that key.","startTime":82.45454545454545,"endTime":85.27272727272728,"audioSegment":0},{"text":"The key appears in Settings → Integrations,","startTime":85.27272727272728,"endTime":88.0909090909091,"audioSegment":0},{"text":"where you can see when it was last used and revoke it.","startTime":88.0909090909091,"endTime":90.9090909090909,"audioSegment":0},{"text":"To have a model ready without opening the app,","startTime":90.9090909090909,"endTime":93.72727272727272,"audioSegment":0},{"text":"name it when you start the container:","startTime":93.72727272727272,"endTime":96.54545454545455,"audioSegment":0},{"text":"docker run -d --name gezel -p 127.0.0.1:6230:6230 -v gezel:/gezel \\","startTime":96.54545454545455,"endTime":99.36363636363637,"audioSegment":0},{"text":"-e GEZEL_PULL_MODEL=<model id> ghcr.io/bendyline/gezel","startTime":99.36363636363637,"endTime":102.18181818181819,"audioSegment":0},{"text":"docker exec gezel gezel model list --available lists the model ids.","startTime":102.18181818181819,"endTime":105,"audioSegment":0},{"text":"To run one craftbook on the folder you are in and collect what it makes:","startTime":105,"endTime":108.83333333333333,"audioSegment":0},{"text":"docker run --rm -v \"$PWD:$PWD\" -w \"$PWD\" -v gezel:/gezel ghcr.io/bendyline/gezel \\","startTime":108.83333333333333,"endTime":112.66666666666667,"audioSegment":0},{"text":"do summarize-long \"Summarize these notes for the board\" --out ./gezel-out","startTime":112.66666666666667,"endTime":116.5,"audioSegment":0},{"text":"Mounting the folder at the same path inside the container keeps each folder its own project.","startTime":116.5,"endTime":120.33333333333333,"audioSegment":0},{"text":"Gezel reads the folder and writes its results to ./gezel-out;","startTime":120.33333333333333,"endTime":124.16666666666667,"audioSegment":0},{"text":"it changes nothing else there.","startTime":124.16666666666667,"endTime":128,"audioSegment":0},{"text":"A Windows path cannot be used inside the container,","startTime":128,"endTime":131.83333333333334,"audioSegment":0},{"text":"so in PowerShell give the folder a path of its own there, named after it:","startTime":131.83333333333334,"endTime":135.66666666666666,"audioSegment":0},{"text":"docker run --rm -v \"${PWD}:/projects/board-notes\" -w /projects/board-notes -v gezel:/gezel ghcr.io/bendyline/gezel `","startTime":135.66666666666666,"endTime":139.5,"audioSegment":0},{"text":"do summarize-long \"Summarize these notes for the board\" --out ./gezel-out","startTime":139.5,"endTime":143.33333333333334,"audioSegment":0},{"text":"If a Gezel container is already running on the same volume,","startTime":143.33333333333334,"endTime":147.16666666666669,"audioSegment":0},{"text":"use it instead of starting a second one (Gezel refuses to run twice on one volume): mount your folders when you start it, then run docker exec gezel gezel do ….","startTime":147.16666666666669,"endTime":151,"audioSegment":0},{"text":"Everyone who signs in has an account.","startTime":151,"endTime":153.66666666666666,"audioSegment":0},{"text":"Add people in Settings → Accounts, or from the computer running Docker:","startTime":153.66666666666666,"endTime":156.33333333333334,"audioSegment":0},{"text":"docker exec -it gezel gezel account create Ana","startTime":156.33333333333334,"endTime":159,"audioSegment":0},{"text":"Everyone you add can do everything you can,","startTime":159,"endTime":161.66666666666666,"audioSegment":0},{"text":"including open a terminal in the container.","startTime":161.66666666666666,"endTime":164.33333333333334,"audioSegment":0},{"text":"Add only people you would hand the keys to.","startTime":164.33333333333334,"endTime":167,"audioSegment":0},{"text":"If someone forgets their password,","startTime":167,"endTime":169.66666666666666,"audioSegment":0},{"text":"anyone who can sign in can set a new one in Settings → Accounts.","startTime":169.66666666666666,"endTime":172.33333333333334,"audioSegment":0},{"text":"If nobody can sign in, set one from the computer running Docker:","startTime":172.33333333333334,"endTime":175,"audioSegment":0},{"text":"docker exec -it gezel gezel account reset-password Ana","startTime":175,"endTime":177.66666666666666,"audioSegment":0},{"text":"To start without the setup link (for a server you set up by script),","startTime":177.66666666666666,"endTime":180.33333333333334,"audioSegment":0},{"text":"give the first account's name and keep its password in a file:","startTime":180.33333333333334,"endTime":183,"audioSegment":0},{"text":"docker run -d --name gezel -p 127.0.0.1:6230:6230 -v gezel:/gezel \\","startTime":183,"endTime":185.66666666666666,"audioSegment":0},{"text":"-e GEZEL_OWNER_NAME=you -e GEZEL_OWNER_PASSWORD_FILE=/run/secrets/owner \\","startTime":185.66666666666666,"endTime":188.33333333333331,"audioSegment":0},{"text":"-v ./owner-password.txt:/run/secrets/owner:ro ghcr.io/bendyline/gezel","startTime":188.33333333333331,"endTime":191,"audioSegment":0},{"text":"A new container starts at the lockdown security level and in the Reactive + tasks activity mode: Gezel answers,","startTime":191,"endTime":195.33333333333334,"audioSegment":0},{"text":"runs the tasks you start and keeps to schedules, but does not start work of its own, which on a server would compete with your requests.","startTime":195.33333333333334,"endTime":199.66666666666666,"audioSegment":0},{"text":"To start differently, set them for the first start:","startTime":199.66666666666666,"endTime":204,"audioSegment":0},{"text":"-e GEZEL_INITIAL_SECURITY_LEVEL=super-lockdown -e GEZEL_INITIAL_MODE=reactive+tasks","startTime":204,"endTime":208.33333333333334,"audioSegment":0},{"text":"They apply only to a new volume. After that,","startTime":208.33333333333334,"endTime":212.66666666666666,"audioSegment":0},{"text":"change them in Settings or with docker exec gezel gezel security level set … and docker exec gezel gezel mode ….","startTime":212.66666666666666,"endTime":217,"audioSegment":0},{"text":"The commands above keep Gezel on the computer running Docker.","startTime":217,"endTime":220,"audioSegment":0},{"text":"To use it from a phone or another computer on your network,","startTime":220,"endTime":223,"audioSegment":0},{"text":"put HTTPS in front of it.","startTime":223,"endTime":226,"audioSegment":0},{"text":"The docker/ folder of the Gezel repository has a Compose setup that does this with Caddy:","startTime":226,"endTime":229,"audioSegment":0},{"text":"GEZEL_HOSTNAME=gezel.home docker compose -f compose.yaml -f compose.lan.yaml up -d","startTime":229,"endTime":232,"audioSegment":0},{"text":"Caddy signs with its own certificate,","startTime":232,"endTime":235,"audioSegment":0},{"text":"which other devices warn about until you install Caddy's root certificate on them.","startTime":235,"endTime":238,"audioSegment":0},{"text":"Gezel answers only at the name you give it.","startTime":238,"endTime":241,"audioSegment":0},{"text":"Pull the new image and start a new container on the same volume:","startTime":241,"endTime":243.625,"audioSegment":0},{"text":"docker pull ghcr.io/bendyline/gezel","startTime":243.625,"endTime":246.25,"audioSegment":0},{"text":"docker rm -f gezel","startTime":246.25,"endTime":248.875,"audioSegment":0},{"text":"docker run -d --name gezel -p 127.0.0.1:6230:6230 -v gezel:/gezel ghcr.io/bendyline/gezel","startTime":248.875,"endTime":251.5,"audioSegment":0},{"text":"The 1.2.12 image answered on port 6228,","startTime":251.5,"endTime":254.125,"audioSegment":0},{"text":"and newer images answer on 6230.","startTime":254.125,"endTime":256.75,"audioSegment":0},{"text":"If you started Gezel with -p 127.0.0.1:6228:6228,","startTime":256.75,"endTime":259.375,"audioSegment":0},{"text":"start the new container with the command above.","startTime":259.375,"endTime":262,"audioSegment":0},{"text":"Everything in the volume carries over, accounts and keys included: sign in again at http://localhost:6230,","startTime":262,"endTime":264.625,"audioSegment":0},{"text":"and point programs that use Gezel's models at http://localhost:6230/v1.","startTime":264.625,"endTime":267.25,"audioSegment":0},{"text":"To keep using 6228, start it with -p 127.0.0.1:6228:6228 -e GEZEL_CONTAINER_PORT=6228 instead.","startTime":267.25,"endTime":269.875,"audioSegment":0},{"text":"Image versions match the command line's: ghcr.io/bendyline/gezel:1.2.12 is the same Gezel as npm install -g @bendyline/gezel-cli@1.2.12.","startTime":269.875,"endTime":272.5,"audioSegment":0},{"text":"The first image is 1.2.12.","startTime":272.5,"endTime":275.125,"audioSegment":0},{"text":"The same images are on Docker Hub as bendyline/gezel.","startTime":275.125,"endTime":277.75,"audioSegment":0},{"text":"Back up the gezel volume like any other data.","startTime":277.75,"endTime":280.375,"audioSegment":0},{"text":"It holds plain files; see Where files live.","startTime":280.375,"endTime":283,"audioSegment":0},{"text":"The container uses port 6230,","startTime":283,"endTime":285.8125,"audioSegment":0},{"text":"so it can run beside the Gezel app, which uses 6228.","startTime":285.8125,"endTime":288.625,"audioSegment":0},{"text":"To publish another port, tell the container the address to print in its setup link: -p 127.0.0.1:6300:6230 -e GEZEL_PUBLIC_URL=http://localhost:6300,","startTime":288.625,"endTime":291.4375,"audioSegment":0},{"text":"then open http://localhost:6300.","startTime":291.4375,"endTime":294.25,"audioSegment":0},{"text":"On a Mac, Docker cannot use the graphics chip,","startTime":294.25,"endTime":297.0625,"audioSegment":0},{"text":"so models run on the processor and are slow.","startTime":297.0625,"endTime":299.875,"audioSegment":0},{"text":"Use the Gezel app on a Mac.","startTime":299.875,"endTime":302.6875,"audioSegment":0},{"text":"Docker Desktop on Windows passes NVIDIA cards through;","startTime":302.6875,"endTime":305.5,"audioSegment":0},{"text":"it has no Vulkan, so AMD and Intel cards are not used there.","startTime":305.5,"endTime":308.3125,"audioSegment":0},{"text":"The NVIDIA image for ARM computers is built for DGX Spark (GB10).","startTime":308.3125,"endTime":311.125,"audioSegment":0},{"text":"Files Gezel writes into a folder you mounted belong to user 10001.","startTime":311.125,"endTime":313.9375,"audioSegment":0},{"text":"Add --user \"$(id -u):$(id -g)\" to keep them yours.","startTime":313.9375,"endTime":316.75,"audioSegment":0},{"text":"Some craftbook steps run small scripts that must not reach the network.","startTime":316.75,"endTime":319.5625,"audioSegment":0},{"text":"The image runs them in a network sandbox.","startTime":319.5625,"endTime":322.375,"audioSegment":0},{"text":"If a step says no sandbox is available,","startTime":322.375,"endTime":325.1875,"audioSegment":0},{"text":"update to a newer image.","startTime":325.1875,"endTime":328,"audioSegment":0}],"version":1},"startBlock":{"title":"Gezel in Docker","subtitle":"The Gezel image is the whole of Gezel in one container: the service, the web version of the app, the command line, and every engine that runs models on your own hardware. Nothing else needs installing. What it downloads is models: the one you choose, and smaller ones it uses to search your files and to read pictures, along with a web browser for tasks that visit websites.","ambientMotion":"zoomIn"}}</script>
