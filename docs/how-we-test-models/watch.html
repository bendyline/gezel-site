different things, and it is normal for a model to be strong on one and weak on the other. Plan and estimate and conflict synthesis deliberately appear in both sets because they test capabilities that matter to each.","position":{"start":{"line":61,"column":1,"offset":7187},"end":{"line":61,"column":263,"offset":7449}}}],"position":{"start":{"line":61,"column":1,"offset":7187},"end":{"line":61,"column":263,"offset":7449}}}]}]},{"id":"what-passed-means","startTime":326,"duration":39,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"What \"passed\" means","position":{"start":{"line":63,"column":4,"offset":7454},"end":{"line":63,"column":23,"offset":7473}}}],"position":{"start":{"line":63,"column":1,"offset":7451},"end":{"line":63,"column":23,"offset":7473}}},"title":"What \"passed\" means","contents":[{"type":"paragraph","children":[{"type":"text","value":"A task passes when the finished work meets every requirement that was stated in the instructions. Not most of them. There is no partial credit for a beautiful document with the wrong numbers in it — that is precisely the failure that costs you an afternoon.","position":{"start":{"line":65,"column":1,"offset":7475},"end":{"line":65,"column":258,"offset":7732}}}],"position":{"start":{"line":65,"column":1,"offset":7475},"end":{"line":65,"column":258,"offset":7732}}},{"type":"paragraph","children":[{"type":"text","value":"Some tasks are checked by arithmetic. For the A/B test read-out we know what the right answer is, because we made the data up: the conversion lift is 1.25 percentage points and the refund rate rose by 0.23. A model that reports different figures fails, however confident the prose sounds.","position":{"start":{"line":67,"column":1,"offset":7734},"end":{"line":67,"column":289,"offset":8022}}}],"position":{"start":{"line":67,"column":1,"offset":7734},"end":{"line":67,"column":289,"offset":8022}}},{"type":"paragraph","children":[{"type":"text","value":"Some are checked by opening the file. When a task asks for a PowerPoint, we check the result is really a PowerPoint file and not a text document with the wrong name on it.","position":{"start":{"line":69,"column":1,"offset":8024},"end":{"line":69,"column":172,"offset":8195}}}],"position":{"start":{"line":69,"column":1,"offset":8024},"end":{"line":69,"column":172,"offset":8195}}}]},{"id":"why-we-run-everything-three-times","startTime":365,"duration":23,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Why we run everything three times","position":{"start":{"line":71,"column":4,"offset":8200},"end":{"line":71,"column":37,"offset":8233}}}],"position":{"start":{"line":71,"column":1,"offset":8197},"end":{"line":71,"column":37,"offset":8233}}},"title":"Why we run everything three times","contents":[{"type":"paragraph","children":[{"type":"text","value":"Models are not perfectly consistent. The same model given the same job twice can succeed once and fail once.","position":{"start":{"line":73,"column":1,"offset":8235},"end":{"line":73,"column":109,"offset":8343}}}],"position":{"start":{"line":73,"column":1,"offset":8235},"end":{"line":73,"column":109,"offset":8343}}},{"type":"paragraph","children":[{"type":"text","value":"So each job is run three times, and we report how many succeeded. If a model has only been run once or twice we print the raw count — \"1 of 1\" — rather than a percentage, because \"100%\" from a single attempt is not a fact, it is a coin toss that happened to land well.","position":{"start":{"line":75,"column":1,"offset":8345},"end":{"line":75,"column":269,"offset":8613}}}],"position":{"start":{"line":75,"column":1,"offset":8345},"end":{"line":75,"column":269,"offset":8613}}}]},{"id":"when-the-machine-breaks-the-model-isnt-blamed","startTime":388,"duration":26,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"When the machine breaks, the model isn't blamed","position":{"start":{"line":77,"column":4,"offset":8618},"end":{"line":77,"column":51,"offset":8665}}}],"position":{"start":{"line":77,"column":1,"offset":8615},"end":{"line":77,"column":51,"offset":8665}}},"title":"When the machine breaks, the model isn't blamed","contents":[{"type":"paragraph","children":[{"type":"text","value":"Sometimes a run fails for reasons that have nothing to do with the model: the graphics driver falls over, the machine runs out of memory, someone stops the run. Those attempts are recorded and set aside rather than counted as failures.","position":{"start":{"line":79,"column":1,"offset":8667},"end":{"line":79,"column":236,"offset":8902}}}],"position":{"start":{"line":79,"column":1,"offset":8667},"end":{"line":79,"column":236,"offset":8902}}},{"type":"paragraph","children":[{"type":"text","value":"If enough of a model's attempts are lost that its results no longer stand up, we leave it out of the table rather than publish a score with a hole in it. A missing model means \"not measured properly yet\", never \"measured and found wanting\".","position":{"start":{"line":81,"column":1,"offset":8904},"end":{"line":81,"column":241,"offset":9144}}}],"position":{"start":{"line":81,"column":1,"offset":8904},"end":{"line":81,"column":241,"offset":9144}}}]},{"id":"what-we-deliberately-dont-claim","startTime":414,"duration":82,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"What we deliberately don't claim","position":{"start":{"line":83,"column":4,"offset":9149},"end":{"line":83,"column":36,"offset":9181}}}],"position":{"start":{"line":83,"column":1,"offset":9146},"end":{"line":83,"column":36,"offset":9181}}},"title":"What we deliberately don't claim","contents":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Scores from different rounds are not comparable.","position":{"start":{"line":85,"column":3,"offset":9185},"end":{"line":85,"column":51,"offset":9233}}}],"position":{"start":{"line":85,"column":1,"offset":9183},"end":{"line":85,"column":53,"offset":9235}}},{"type":"text","value":" Every number comes from one machine, on one day, with one version of gezel and one version of the task set. Change any of those and you have a different experiment. When a model was measured in an earlier round we list it separately and say why — we never quietly merge it into a newer table to make the list look fuller.","position":{"start":{"line":85,"column":53,"offset":9235},"end":{"line":85,"column":375,"offset":9557}}}],"position":{"start":{"line":85,"column":1,"offset":9183},"end":{"line":85,"column":375,"offset":9557}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Quality scores are an opinion, not a measurement.","position":{"start":{"line":87,"column":3,"offset":9561},"end":{"line":87,"column":52,"offset":9610}}}],"position":{"start":{"line":87,"column":1,"offset":9559},"end":{"line":87,"column":54,"offset":9612}}},{"type":"text","value":" Alongside the pass/fail checks we ask a large AI model to rate qualities like clarity, grounding and candour, and we publish that as a Quality column. Read it with two caveats.","position":{"start":{"line":87,"column":54,"offset":9612},"end":{"line":87,"column":231,"offset":9789}}}],"position":{"start":{"line":87,"column":1,"offset":9559},"end":{"line":87,"column":231,"offset":9789}}},{"type":"paragraph","children":[{"type":"text","value":"First, it only covers work that got ","position":{"start":{"line":89,"column":1,"offset":9791},"end":{"line":89,"column":37,"offset":9827}}},{"type":"emphasis","children":[{"type":"text","value":"produced","position":{"start":{"line":89,"column":38,"offset":9828},"end":{"line":89,"column":46,"offset":9836}}}],"position":{"start":{"line":89,"column":37,"offset":9827},"end":{"line":89,"column":47,"offset":9837}}},{"type":"text","value":". A model that gives up early is graded on the few pieces it did finish, so a high quality score over a small number of pieces can mean \"good when it manages it\" rather than \"good\". That is why the count always travels with the score — ","position":{"start":{"line":89,"column":47,"offset":9837},"end":{"line":89,"column":283,"offset":10073}}},{"type":"inlineCode","value":"6.5/10 (18 pieces)","position":{"start":{"line":89,"column":283,"offset":10073},"end":{"line":89,"column":303,"offset":10093}}},{"type":"text","value":" next to ","position":{"start":{"line":89,"column":303,"offset":10093},"end":{"line":89,"column":312,"offset":10102}}},{"type":"inlineCode","value":"6.5/10 (26 pieces)","position":{"start":{"line":89,"column":312,"offset":10102},"end":{"line":89,"column":332,"offset":10122}}},{"type":"text","value":" are not the same claim.","position":{"start":{"line":89,"column":332,"offset":10122},"end":{"line":89,"column":356,"offset":10146}}}],"position":{"start":{"line":89,"column":1,"offset":9791},"end":{"line":89,"column":356,"offset":10146}}},{"type":"paragraph","children":[{"type":"text","value":"Second, the rating model changes over time, so quality scores are comparable ","position":{"start":{"line":91,"column":1,"offset":10148},"end":{"line":91,"column":78,"offset":10225}}},{"type":"emphasis","children":[{"type":"text","value":"within","position":{"start":{"line":91,"column":79,"offset":10226},"end":{"line":91,"column":85,"offset":10232}}}],"position":{"start":{"line":91,"column":78,"offset":10225},"end":{"line":91,"column":86,"offset":10233}}},{"type":"text","value":" a round and not across rounds. The pass/fail results are the ones that track.","position":{"start":{"line":91,"column":86,"offset":10233},"end":{"line":91,"column":164,"offset":10311}}}],"position":{"start":{"line":91,"column":1,"offset":10148},"end":{"line":91,"column":164,"offset":10311}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A score is not a recommendation for your machine.","position":{"start":{"line":93,"column":3,"offset":10315},"end":{"line":93,"column":52,"offset":10364}}}],"position":{"start":{"line":93,"column":1,"offset":10313},"end":{"line":93,"column":54,"offset":10366}}},{"type":"text","value":" Results come from one particular computer. A model that scores well on a large desktop may not fit on a laptop at all. The Models catalogue in the app is what knows your hardware.","position":{"start":{"line":93,"column":54,"offset":10366},"end":{"line":93,"column":234,"offset":10546}}}],"position":{"start":{"line":93,"column":1,"offset":10313},"end":{"line":93,"column":234,"offset":10546}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A score is not a ceiling.","position":{"start":{"line":95,"column":3,"offset":10550},"end":{"line":95,"column":28,"offset":10575}}}],"position":{"start":{"line":95,"column":1,"offset":10548},"end":{"line":95,"column":30,"offset":10577}}},{"type":"text","value":" These are tasks we chose. A model that does poorly here may be excellent at something we didn't think to measure.","position":{"start":{"line":95,"column":30,"offset":10577},"end":{"line":95,"column":144,"offset":10691}}}],"position":{"start":{"line":95,"column":1,"offset":10548},"end":{"line":95,"column":144,"offset":10691}}}]},{"id":"adding-a-model","startTime":496,"duration":15,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Adding a model","position":{"start":{"line":97,"column":4,"offset":10696},"end":{"line":97,"column":18,"offset":10710}}}],"position":{"start":{"line":97,"column":1,"offset":10693},"end":{"line":97,"column":18,"offset":10710}}},"title":"Adding a model","contents":[{"type":"paragraph","children":[{"type":"text","value":"New models get added to the same rounds and run through the same jobs, with the same number of attempts, on the same machine. Nothing is graded on a curve, and nothing is added to a table it didn't actually run in.","position":{"start":{"line":99,"column":1,"offset":10712},"end":{"line":99,"column":215,"offset":10926}}}],"position":{"start":{"line":99,"column":1,"offset":10712},"end":{"line":99,"column":215,"offset":10926}}},{"type":"paragraph","children":[{"type":"text","value":"The current results are in ","position":{"start":{"line":101,"column":1,"offset":10928},"end":{"line":101,"column":28,"offset":10955}}},{"type":"link","url":"../model-scorecard/","children":[{"type":"text","value":"Model scorecard","position":{"start":{"line":101,"column":29,"offset":10956},"end":{"line":101,"column":44,"offset":10971}}}],"position":{"start":{"line":101,"column":28,"offset":10955},"end":{"line":101,"column":66,"offset":10993}}},{"type":"text","value":".","position":{"start":{"line":101,"column":66,"offset":10993},"end":{"line":101,"column":67,"offset":10994}}}],"position":{"start":{"line":101,"column":1,"offset":10928},"end":{"line":101,"column":67,"offset":10994}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel can run many different AI models,","startTime":0,"endTime":3.3333333333333335,"audioSegment":0},{"text":"and they are not equally good at the work.","startTime":3.3333333333333335,"endTime":6.666666666666667,"audioSegment":0},{"text":"A model that writes a lovely paragraph may be hopeless at filling in a spreadsheet correctly;","startTime":6.666666666666667,"endTime":10,"audioSegment":0},{"text":"a small one that fits comfortably on a laptop may quietly get dates wrong. So we measure.","startTime":10,"endTime":13.333333333333334,"audioSegment":0},{"text":"This article explains how,","startTime":13.333333333333334,"endTime":16.666666666666668,"audioSegment":0},{"text":"because a score is only worth something if you know what was counted.","startTime":16.666666666666668,"endTime":20,"audioSegment":0},{"text":"We don't quiz models with trivia.","startTime":20,"endTime":22.916666666666668,"audioSegment":0},{"text":"We give them real jobs and check the work they hand back.","startTime":22.916666666666668,"endTime":25.833333333333332,"audioSegment":0},{"text":"A job looks like this: here is a meeting transcript,","startTime":25.833333333333332,"endTime":28.75,"audioSegment":0},{"text":"an out-of-date agenda, and a list of who works here.","startTime":28.75,"endTime":31.666666666666664,"audioSegment":0},{"text":"Produce a written brief and a table of action items with the right owner,","startTime":31.666666666666664,"endTime":34.58333333333333,"audioSegment":0},{"text":"the right date, and the right dependencies.","startTime":34.58333333333333,"endTime":37.5,"audioSegment":0},{"text":"Then we open the files and check them.","startTime":37.5,"endTime":40.416666666666664,"audioSegment":0},{"text":"Did the September 14th decision survive?","startTime":40.416666666666664,"endTime":43.33333333333333,"audioSegment":0},{"text":"Did the cancelled proposal stay cancelled?","startTime":43.33333333333333,"endTime":46.25,"audioSegment":0},{"text":"Is the action assigned to someone who actually works here?","startTime":46.25,"endTime":49.166666666666664,"audioSegment":0},{"text":"Every task is checked the same way for every model, by a program rather than a person,","startTime":49.166666666666664,"endTime":52.08333333333333,"audioSegment":0},{"text":"so nobody's favourite gets the benefit of the doubt.","startTime":52.08333333333333,"endTime":55,"audioSegment":0},{"text":"The core set is general capability — writing a small working program, fixing a bug from a description of the symptoms,","startTime":55,"endTime":60.5,"audioSegment":0},{"text":"following a checklist and stopping when something looks wrong, turning several documents into one reconciled summary.","startTime":60.5,"endTime":66,"audioSegment":0},{"text":"Test What the task entails","startTime":66,"endTime":70.11428571428571,"audioSegment":0},{"text":"Tic-tac-toe (tictactoe) Create a new project and build a working two-player tic-tac-toe game in a single HTML file,","startTime":70.11428571428571,"endTime":74.22857142857143,"audioSegment":0},{"text":"including a clear win state.","startTime":74.22857142857143,"endTime":78.34285714285714,"audioSegment":0},{"text":"Pet shop (petshop) Build a single-page pet-shop website,","startTime":78.34285714285714,"endTime":82.45714285714286,"audioSegment":0},{"text":"generate a custom logo with the image tool, and make sure the page uses that logo.","startTime":82.45714285714286,"endTime":86.57142857142857,"audioSegment":0},{"text":"Tank combat (tankcombat) Build a playable top-down tank game in one HTML file,","startTime":86.57142857142857,"endTime":90.68571428571428,"audioSegment":0},{"text":"with keyboard controls, shooting, an enemy tank, and a visible score.","startTime":90.68571428571428,"endTime":94.8,"audioSegment":0},{"text":"Schema migration (schema-migration) Refactor a small multi-file TypeScript app from one name field to first and last names,","startTime":94.8,"endTime":98.91428571428571,"audioSegment":0},{"text":"preserve every record, add tests and notes, and pass the type check.","startTime":98.91428571428571,"endTime":103.02857142857142,"audioSegment":0},{"text":"Tests as the specification (failing-tests-spec) Work out an order-lifecycle state machine from its tests alone,","startTime":103.02857142857142,"endTime":107.14285714285714,"audioSegment":0},{"text":"implement it, and make every test pass without changing the tests.","startTime":107.14285714285714,"endTime":111.25714285714285,"audioSegment":0},{"text":"Debug from symptoms (symptom-debug) Diagnose an undocumented pagination error from the failing output,","startTime":111.25714285714285,"endTime":115.37142857142857,"audioSegment":0},{"text":"then fix the implementation without changing the acceptance check.","startTime":115.37142857142857,"endTime":119.48571428571428,"audioSegment":0},{"text":"Data wrangling (data-wrangle) Clean three messy CSV exports, standardise dates and email addresses,","startTime":119.48571428571428,"endTime":123.6,"audioSegment":0},{"text":"remove duplicates, sort the records, and produce the exact required JSON.","startTime":123.6,"endTime":127.71428571428571,"audioSegment":0},{"text":"Incident postmortem (incident-postmortem) Read five evidence files and write a structured,","startTime":127.71428571428571,"endTime":131.82857142857142,"audioSegment":0},{"text":"blame-free postmortem with accurate facts and citations, without inventing unmeasured impact.","startTime":131.82857142857142,"endTime":135.94285714285712,"audioSegment":0},{"text":"Runbook anomaly (ops-runbook-anomaly) Follow a maintenance checklist step by step,","startTime":135.94285714285712,"endTime":140.05714285714285,"audioSegment":0},{"text":"verify and record each action, and stop with a grounded report when a planted backup check fails.","startTime":140.05714285714285,"endTime":144.17142857142858,"audioSegment":0},{"text":"Plan and estimate (plan-and-estimate) Produce an office-relocation plan with valid owners,","startTime":144.17142857142858,"endTime":148.28571428571428,"audioSegment":0},{"text":"correctly ordered dependencies, risks, and a checkable definition of done for every task.","startTime":148.28571428571428,"endTime":152.39999999999998,"audioSegment":0},{"text":"Conflict synthesis (conflict-synthesis) Reconcile five documents that disagree about a launch date,","startTime":152.39999999999998,"endTime":156.5142857142857,"audioSegment":0},{"text":"budget, and owner; show each conflict and use the authoritative answer consistently.","startTime":156.5142857142857,"endTime":160.62857142857143,"audioSegment":0},{"text":"The engineering set is developer work,","startTime":160.62857142857143,"endTime":164.74285714285713,"audioSegment":0},{"text":"and it is deliberately harder than the first two.","startTime":164.74285714285713,"endTime":168.85714285714283,"audioSegment":0},{"text":"A model has to pick the right recipe out of a library of several hundred when two of them look almost identical,","startTime":168.85714285714283,"endTime":172.97142857142856,"audioSegment":0},{"text":"find real defects in a change set without flagging code that is perfectly correct, and prove a fix by running the tests rather than by claiming it works.","startTime":172.97142857142856,"endTime":177.0857142857143,"audioSegment":0},{"text":"The complex-workflow set asks a model to build the recipe, not just follow one: write a reusable procedure with its own quality gates,","startTime":177.0857142857143,"endTime":181.2,"audioSegment":0},{"text":"run it twice against different inputs, repair one that is broken, and turn a job it just did by hand into something the crew can run again next quarter.","startTime":181.2,"endTime":185.3142857142857,"audioSegment":0},{"text":"Nobody should expect full marks on either.","startTime":185.3142857142857,"endTime":189.42857142857142,"audioSegment":0},{"text":"They exist because the best models now score close to full marks on the first two sets,","startTime":189.42857142857142,"endTime":193.54285714285714,"audioSegment":0},{"text":"and a column of near-perfect scores cannot tell you which model to choose.","startTime":193.54285714285714,"endTime":197.65714285714284,"audioSegment":0},{"text":"Low numbers here are headroom, not breakage.","startTime":197.65714285714284,"endTime":201.77142857142854,"audioSegment":0},{"text":"The productivity set is office work — a customer notice written to a hard word limit, a meeting turned into an action register,","startTime":201.77142857142854,"endTime":205.88571428571427,"audioSegment":0},{"text":"a research brief with its sources cited, an A/B test read-out, a spreadsheet model, a slide deck, a Word document.","startTime":205.88571428571427,"endTime":210,"audioSegment":0},{"text":"Test What the task entails","startTime":210,"endTime":214.14285714285714,"audioSegment":0},{"text":"Constrained communications (constrained-comms) Write a 140–220 word customer outage notice containing the required facts and disclosures while avoiding banned or unsupported claims.","startTime":214.14285714285714,"endTime":218.28571428571428,"audioSegment":0},{"text":"Plan the week (craftbook-week-plan) Turn eight calendar events into a five-day plan,","startTime":218.28571428571428,"endTime":222.42857142857144,"audioSegment":0},{"text":"flag meetings that need preparation, resolve a Tuesday conflict, and protect focus time.","startTime":222.42857142857144,"endTime":226.57142857142858,"audioSegment":0},{"text":"A/B test read-out (craftbook-ab-test-readout) Calculate the experiment results correctly and apply a pre-set decision rule,","startTime":226.57142857142858,"endTime":230.71428571428572,"audioSegment":0},{"text":"including a safety measure that overrides an otherwise positive result.","startTime":230.71428571428572,"endTime":234.85714285714286,"audioSegment":0},{"text":"Annotated bibliography (craftbook-annotated-bibliography) Produce six consistently formatted source entries,","startTime":234.85714285714286,"endTime":239,"audioSegment":0},{"text":"each with a summary, an evaluation of the source, and its relevance to the question.","startTime":239,"endTime":243.14285714285714,"audioSegment":0},{"text":"Records intake (records-intake) Combine registrations from emails, phone notes,","startTime":243.14285714285714,"endTime":247.28571428571428,"audioSegment":0},{"text":"and an old CSV into one correctly shaped, deduplicated record set with standardised dates.","startTime":247.28571428571428,"endTime":251.42857142857144,"audioSegment":0},{"text":"Plan and estimate (plan-and-estimate) Produce an office-relocation plan with valid owners,","startTime":251.42857142857144,"endTime":255.57142857142858,"audioSegment":0},{"text":"correctly ordered dependencies, risks, and a checkable definition of done for every task.","startTime":255.57142857142858,"endTime":259.7142857142857,"audioSegment":0},{"text":"Meeting follow-up (meeting-followup) Reconcile a noisy transcript, stale agenda,","startTime":259.7142857142857,"endTime":263.8571428571429,"audioSegment":0},{"text":"and current staff list into a decision brief and an exact action register with owners, dates, dependencies, questions, and risks.","startTime":263.8571428571429,"endTime":268,"audioSegment":0},{"text":"Spreadsheet model (craftbook-spreadsheet-model) Calculate the correct roll-ups from seeded records and turn them into a useful spreadsheet-style model and read-out that highlights the main risk.","startTime":268,"endTime":272.14285714285717,"audioSegment":0},{"text":"Conflict synthesis (conflict-synthesis) Reconcile five documents that disagree about a launch date,","startTime":272.14285714285717,"endTime":276.2857142857143,"audioSegment":0},{"text":"budget, and owner; show each conflict and use the authoritative answer consistently.","startTime":276.2857142857143,"endTime":280.42857142857144,"audioSegment":0},{"text":"Theme round-trip (docblocks-theme-roundtrip) Read the theme from a brand document, apply it to a presentation,","startTime":280.42857142857144,"endTime":284.57142857142856,"audioSegment":0},{"text":"inspect the result, and report only fonts, colours, page counts, and unresolved styles returned by the document tools.","startTime":284.57142857142856,"endTime":288.7142857142857,"audioSegment":0},{"text":"Research to Word (craftbook-research-to-document) Turn reviewed,","startTime":288.7142857142857,"endTime":292.8571428571429,"audioSegment":0},{"text":"source-grounded Markdown into a real editable Word document, preview it, and save the finished .docx as an artifact.","startTime":292.8571428571429,"endTime":297,"audioSegment":0},{"text":"PowerPoint deck (craftbook-powerpoint-deck) Acquire and cite source material,","startTime":297,"endTime":301.14285714285717,"audioSegment":0},{"text":"create an outline, make every slide match it, and save a real editable .pptx presentation.","startTime":301.14285714285717,"endTime":305.2857142857143,"audioSegment":0},{"text":"Wikipedia research brief (wikipedia-research-brief) Use a closed local copy of Wikipedia to select the relevant sources and write a cited 700–1,500 word brief with correct chronology and careful treatment of a disputed claim.","startTime":305.2857142857143,"endTime":309.42857142857144,"audioSegment":0},{"text":"A model gets a score on each set.","startTime":309.42857142857144,"endTime":313.57142857142856,"audioSegment":0},{"text":"They measure different things,","startTime":313.57142857142856,"endTime":317.7142857142857,"audioSegment":0},{"text":"and it is normal for a model to be strong on one and weak on the other.","startTime":317.7142857142857,"endTime":321.8571428571429,"audioSegment":0},{"text":"Plan and estimate and conflict synthesis deliberately appear in both sets because they test capabilities that matter to each.","startTime":321.8571428571429,"endTime":326,"audioSegment":0},{"text":"A task passes when the finished work meets every requirement that was stated in the instructions.","startTime":326,"endTime":329.54545454545456,"audioSegment":0},{"text":"Not most of them.","startTime":329.54545454545456,"endTime":333.09090909090907,"audioSegment":0},{"text":"There is no partial credit for a beautiful document with the wrong numbers in it —","startTime":333.09090909090907,"endTime":336.6363636363636,"audioSegment":0},{"text":"that is precisely the failure that costs you an afternoon.","startTime":336.6363636363636,"endTime":340.1818181818182,"audioSegment":0},{"text":"Some tasks are checked by arithmetic.","startTime":340.1818181818182,"endTime":343.72727272727275,"audioSegment":0},{"text":"For the A/B test read-out we know what the right answer is,","startTime":343.72727272727275,"endTime":347.27272727272725,"audioSegment":0},{"text":"because we made the data up: the conversion lift is 1.25 percentage points and the refund rate rose by 0.23.","startTime":347.27272727272725,"endTime":350.8181818181818,"audioSegment":0},{"text":"A model that reports different figures fails, however confident the prose sounds.","startTime":350.8181818181818,"endTime":354.3636363636364,"audioSegment":0},{"text":"Some are checked by opening the file.","startTime":354.3636363636364,"endTime":357.90909090909093,"audioSegment":0},{"text":"When a task asks for a PowerPoint,","startTime":357.90909090909093,"endTime":361.45454545454544,"audioSegment":0},{"text":"we check the result is really a PowerPoint file and not a text document with the wrong name on it.","startTime":361.45454545454544,"endTime":365,"audioSegment":0},{"text":"Models are not perfectly consistent.","startTime":365,"endTime":368.8333333333333,"audioSegment":0},{"text":"The same model given the same job twice can succeed once and fail once.","startTime":368.8333333333333,"endTime":372.6666666666667,"audioSegment":0},{"text":"So each job is run three times,","startTime":372.6666666666667,"endTime":376.5,"audioSegment":0},{"text":"and we report how many succeeded.","startTime":376.5,"endTime":380.3333333333333,"audioSegment":0},{"text":"If a model has only been run once or twice we print the raw count — \"1 of 1\" — rather than a percentage,","startTime":380.3333333333333,"endTime":384.1666666666667,"audioSegment":0},{"text":"because \"100%\" from a single attempt is not a fact, it is a coin toss that happened to land well.","startTime":384.1666666666667,"endTime":388,"audioSegment":0},{"text":"Sometimes a run fails for reasons that have nothing to do with the model: the graphics driver falls over,","startTime":388,"endTime":391.7142857142857,"audioSegment":0},{"text":"the machine runs out of memory, someone stops the run.","startTime":391.7142857142857,"endTime":395.42857142857144,"audioSegment":0},{"text":"Those attempts are recorded and set aside rather than counted as failures.","startTime":395.42857142857144,"endTime":399.14285714285717,"audioSegment":0},{"text":"If enough of a model's attempts are lost that its results no longer stand up,","startTime":399.14285714285717,"endTime":402.85714285714283,"audioSegment":0},{"text":"we leave it out of the table rather than publish a score with a hole in it.","startTime":402.85714285714283,"endTime":406.57142857142856,"audioSegment":0},{"text":"A missing model means \"not measured properly yet\",","startTime":406.57142857142856,"endTime":410.2857142857143,"audioSegment":0},{"text":"never \"measured and found wanting\".","startTime":410.2857142857143,"endTime":414,"audioSegment":0},{"text":"Scores from different rounds are not comparable.","startTime":414,"endTime":417.28,"audioSegment":0},{"text":"Every number comes from one machine, on one day,","startTime":417.28,"endTime":420.56,"audioSegment":0},{"text":"with one version of gezel and one version of the task set.","startTime":420.56,"endTime":423.84,"audioSegment":0},{"text":"Change any of those and you have a different experiment.","startTime":423.84,"endTime":427.12,"audioSegment":0},{"text":"When a model was measured in an earlier round we list it separately and say why —","startTime":427.12,"endTime":430.4,"audioSegment":0},{"text":"we never quietly merge it into a newer table to make the list look fuller.","startTime":430.4,"endTime":433.68,"audioSegment":0},{"text":"Quality scores are an opinion, not a measurement.","startTime":433.68,"endTime":436.96,"audioSegment":0},{"text":"Alongside the pass/fail checks we ask a large AI model to rate qualities like clarity,","startTime":436.96,"endTime":440.24,"audioSegment":0},{"text":"grounding and candour, and we publish that as a Quality column.","startTime":440.24,"endTime":443.52,"audioSegment":0},{"text":"Read it with two caveats.","startTime":443.52,"endTime":446.8,"audioSegment":0},{"text":"First, it only covers work that got produced.","startTime":446.8,"endTime":450.08,"audioSegment":0},{"text":"A model that gives up early is graded on the few pieces it did finish,","startTime":450.08,"endTime":453.36,"audioSegment":0},{"text":"so a high quality score over a small number of pieces can mean \"good when it manages it\" rather than \"good\".","startTime":453.36,"endTime":456.64,"audioSegment":0},{"text":"That is why the count always travels with the score —","startTime":456.64,"endTime":459.92,"audioSegment":0},{"text":"6.5/10 (18 pieces) next to 6.5/10 (26 pieces) are not the same claim.","startTime":459.92,"endTime":463.2,"audioSegment":0},{"text":"Second, the rating model changes over time,","startTime":463.2,"endTime":466.48,"audioSegment":0},{"text":"so quality scores are comparable within a round and not across rounds.","startTime":466.48,"endTime":469.76,"audioSegment":0},{"text":"The pass/fail results are the ones that track.","startTime":469.76,"endTime":473.04,"audioSegment":0},{"text":"A score is not a recommendation for your machine.","startTime":473.04,"endTime":476.32,"audioSegment":0},{"text":"Results come from one particular computer.","startTime":476.32,"endTime":479.6,"audioSegment":0},{"text":"A model that scores well on a large desktop may not fit on a laptop at all.","startTime":479.6,"endTime":482.88,"audioSegment":0},{"text":"The Models catalogue in the app is what knows your hardware.","startTime":482.88,"endTime":486.15999999999997,"audioSegment":0},{"text":"A score is not a ceiling.","startTime":486.15999999999997,"endTime":489.44,"audioSegment":0},{"text":"These are tasks we chose.","startTime":489.44,"endTime":492.72,"audioSegment":0},{"text":"A model that does poorly here may be excellent at something we didn't think to measure.","startTime":492.72,"endTime":496,"audioSegment":0},{"text":"New models get added to the same rounds and run through the same jobs,","startTime":496,"endTime":499,"audioSegment":0},{"text":"with the same number of attempts, on the same machine.","startTime":499,"endTime":502,"audioSegment":0},{"text":"Nothing is graded on a curve,","startTime":502,"endTime":505,"audioSegment":0},{"text":"and nothing is added to a table it didn't actually run in.","startTime":505,"endTime":508,"audioSegment":0},{"text":"The current results are in Model scorecard.","startTime":508,"endTime":511,"audioSegment":0}],"version":1},"startBlock":{"title":"How we test models","subtitle":"Gezel can run many different AI models, and they are not equally good at the work. A model that writes a lovely paragraph may be hopeless at filling in a spreadsheet correctly; a small one that fits comfortably on a laptop may quietly get dates wrong.","ambientMotion":"zoomIn"}}</script>
