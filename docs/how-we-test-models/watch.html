e":86,"column":1,"offset":14379},"end":{"line":86,"column":157,"offset":14535}}},{"type":"tableCell","children":[{"type":"text","value":"Write one recipe that serves two regions through an input parameter rather than by editing the recipe between runs; the two outputs must differ.","position":{"start":{"line":86,"column":159,"offset":14537},"end":{"line":86,"column":303,"offset":14681}}}],"position":{"start":{"line":86,"column":157,"offset":14535},"end":{"line":86,"column":305,"offset":14683}}}],"position":{"start":{"line":86,"column":1,"offset":14379},"end":{"line":86,"column":305,"offset":14683}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Author a gate script (","position":{"start":{"line":87,"column":3,"offset":14686},"end":{"line":87,"column":25,"offset":14708}}},{"type":"link","url":"https://github.com/bendyline/gezel/blob/main/evals/src/craftbooks/authoring/gate-script.ts","children":[{"type":"inlineCode","value":"craftbook-author-gate-script","position":{"start":{"line":87,"column":26,"offset":14709},"end":{"line":87,"column":56,"offset":14739}}}],"position":{"start":{"line":87,"column":25,"offset":14708},"end":{"line":87,"column":149,"offset":14832}}},{"type":"text","value":")","position":{"start":{"line":87,"column":149,"offset":14832},"end":{"line":87,"column":150,"offset":14833}}}],"position":{"start":{"line":87,"column":1,"offset":14684},"end":{"line":87,"column":151,"offset":14834}}},{"type":"tableCell","children":[{"type":"text","value":"Write a recipe whose build step is checked by a custom script embedded in the recipe itself; a script that approves everything fails.","position":{"start":{"line":87,"column":153,"offset":14836},"end":{"line":87,"column":286,"offset":14969}}}],"position":{"start":{"line":87,"column":151,"offset":14834},"end":{"line":87,"column":288,"offset":14971}}}],"position":{"start":{"line":87,"column":1,"offset":14684},"end":{"line":87,"column":288,"offset":14971}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Author a fan-out recipe (","position":{"start":{"line":88,"column":3,"offset":14974},"end":{"line":88,"column":28,"offset":14999}}},{"type":"link","url":"https://github.com/bendyline/gezel/blob/main/evals/src/craftbooks/authoring/author-fanout.ts","children":[{"type":"inlineCode","value":"craftbook-author-fanout","position":{"start":{"line":88,"column":29,"offset":15000},"end":{"line":88,"column":54,"offset":15025}}}],"position":{"start":{"line":88,"column":28,"offset":14999},"end":{"line":88,"column":149,"offset":15120}}},{"type":"text","value":")","position":{"start":{"line":88,"column":149,"offset":15120},"end":{"line":88,"column":150,"offset":15121}}}],"position":{"start":{"line":88,"column":1,"offset":14972},"end":{"line":88,"column":151,"offset":15122}}},{"type":"tableCell","children":[{"type":"text","value":"Write a recipe whose spawn block reads a list and produces one child run per item, with no tool call driving it; repeating the steps once per item by hand does not score.","position":{"start":{"line":88,"column":153,"offset":15124},"end":{"line":88,"column":323,"offset":15294}}}],"position":{"start":{"line":88,"column":151,"offset":15122},"end":{"line":88,"column":325,"offset":15296}}}],"position":{"start":{"line":88,"column":1,"offset":14972},"end":{"line":88,"column":325,"offset":15296}}}],"position":{"start":{"line":78,"column":1,"offset":12598},"end":{"line":88,"column":325,"offset":15296}}},{"type":"paragraph","children":[{"type":"text","value":"Nobody should expect full marks on either of these two. They exist because the best models now score close to full marks on the first two sets, and a column of near-perfect scores cannot tell you which model to choose. Low numbers here are headroom, not breakage. Each task has a time limit, and at one attempt per task the limits add up to 10 hours for the engineering set and 11 hours 25 minutes for the complex-workflow set. They are run less often than the first two, so not every round in the scorecard includes them.","position":{"start":{"line":90,"column":1,"offset":15298},"end":{"line":90,"column":523,"offset":15820}}}],"position":{"start":{"line":90,"column":1,"offset":15298},"end":{"line":90,"column":523,"offset":15820}}},{"type":"paragraph","children":[{"type":"text","value":"A model gets a score on each set it was run on. The sets measure different things, and it is normal for a model to be strong on one and weak on another. Plan and estimate and conflict synthesis deliberately appear in both the core and productivity sets because they test capabilities that matter to each.","position":{"start":{"line":92,"column":1,"offset":15822},"end":{"line":92,"column":305,"offset":16126}}}],"position":{"start":{"line":92,"column":1,"offset":15822},"end":{"line":92,"column":305,"offset":16126}}}]}]},{"id":"what-passed-means","startTime":558,"duration":39,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"What \"passed\" means","position":{"start":{"line":94,"column":4,"offset":16131},"end":{"line":94,"column":23,"offset":16150}}}],"position":{"start":{"line":94,"column":1,"offset":16128},"end":{"line":94,"column":23,"offset":16150}}},"title":"What \"passed\" means","contents":[{"type":"paragraph","children":[{"type":"text","value":"A task passes when the finished work meets every requirement that was stated in the instructions. Not most of them. There is no partial credit for a beautiful document with the wrong numbers in it — that is precisely the failure that costs you an afternoon.","position":{"start":{"line":96,"column":1,"offset":16152},"end":{"line":96,"column":258,"offset":16409}}}],"position":{"start":{"line":96,"column":1,"offset":16152},"end":{"line":96,"column":258,"offset":16409}}},{"type":"paragraph","children":[{"type":"text","value":"Some tasks are checked by arithmetic. For the A/B test read-out we know what the right answer is, because we made the data up: the conversion lift is 1.25 percentage points and the refund rate rose by 0.23. A model that reports different figures fails, however confident the prose sounds.","position":{"start":{"line":98,"column":1,"offset":16411},"end":{"line":98,"column":289,"offset":16699}}}],"position":{"start":{"line":98,"column":1,"offset":16411},"end":{"line":98,"column":289,"offset":16699}}},{"type":"paragraph","children":[{"type":"text","value":"Some are checked by opening the file. When a task asks for a PowerPoint, we check the result is really a PowerPoint file and not a text document with the wrong name on it.","position":{"start":{"line":100,"column":1,"offset":16701},"end":{"line":100,"column":172,"offset":16872}}}],"position":{"start":{"line":100,"column":1,"offset":16701},"end":{"line":100,"column":172,"offset":16872}}}]},{"id":"why-we-run-everything-three-times","startTime":597,"duration":23,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Why we run everything three times","position":{"start":{"line":102,"column":4,"offset":16877},"end":{"line":102,"column":37,"offset":16910}}}],"position":{"start":{"line":102,"column":1,"offset":16874},"end":{"line":102,"column":37,"offset":16910}}},"title":"Why we run everything three times","contents":[{"type":"paragraph","children":[{"type":"text","value":"Models are not perfectly consistent. The same model given the same job twice can succeed once and fail once.","position":{"start":{"line":104,"column":1,"offset":16912},"end":{"line":104,"column":109,"offset":17020}}}],"position":{"start":{"line":104,"column":1,"offset":16912},"end":{"line":104,"column":109,"offset":17020}}},{"type":"paragraph","children":[{"type":"text","value":"So each job is run three times, and we report how many succeeded. If a model has only been run once or twice we print the raw count — \"1 of 1\" — rather than a percentage, because \"100%\" from a single attempt is not a fact, it is a coin toss that happened to land well.","position":{"start":{"line":106,"column":1,"offset":17022},"end":{"line":106,"column":269,"offset":17290}}}],"position":{"start":{"line":106,"column":1,"offset":17022},"end":{"line":106,"column":269,"offset":17290}}}]},{"id":"when-the-machine-breaks-the-model-isnt-blamed","startTime":620,"duration":26,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"When the machine breaks, the model isn't blamed","position":{"start":{"line":108,"column":4,"offset":17295},"end":{"line":108,"column":51,"offset":17342}}}],"position":{"start":{"line":108,"column":1,"offset":17292},"end":{"line":108,"column":51,"offset":17342}}},"title":"When the machine breaks, the model isn't blamed","contents":[{"type":"paragraph","children":[{"type":"text","value":"Sometimes a run fails for reasons that have nothing to do with the model: the graphics driver falls over, the machine runs out of memory, someone stops the run. Those attempts are recorded and set aside rather than counted as failures.","position":{"start":{"line":110,"column":1,"offset":17344},"end":{"line":110,"column":236,"offset":17579}}}],"position":{"start":{"line":110,"column":1,"offset":17344},"end":{"line":110,"column":236,"offset":17579}}},{"type":"paragraph","children":[{"type":"text","value":"If enough of a model's attempts are lost that its results no longer stand up, we leave it out of the table rather than publish a score with a hole in it. A missing model means \"not measured properly yet\", never \"measured and found wanting\".","position":{"start":{"line":112,"column":1,"offset":17581},"end":{"line":112,"column":241,"offset":17821}}}],"position":{"start":{"line":112,"column":1,"offset":17581},"end":{"line":112,"column":241,"offset":17821}}}]},{"id":"what-we-deliberately-dont-claim","startTime":646,"duration":82,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"What we deliberately don't claim","position":{"start":{"line":114,"column":4,"offset":17826},"end":{"line":114,"column":36,"offset":17858}}}],"position":{"start":{"line":114,"column":1,"offset":17823},"end":{"line":114,"column":36,"offset":17858}}},"title":"What we deliberately don't claim","contents":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Scores from different rounds are not comparable.","position":{"start":{"line":116,"column":3,"offset":17862},"end":{"line":116,"column":51,"offset":17910}}}],"position":{"start":{"line":116,"column":1,"offset":17860},"end":{"line":116,"column":53,"offset":17912}}},{"type":"text","value":" Every number comes from one machine, on one day, with one version of gezel and one version of the task set. Change any of those and you have a different experiment. When a model was measured in an earlier round we list it separately and say why — we never quietly merge it into a newer table to make the list look fuller.","position":{"start":{"line":116,"column":53,"offset":17912},"end":{"line":116,"column":375,"offset":18234}}}],"position":{"start":{"line":116,"column":1,"offset":17860},"end":{"line":116,"column":375,"offset":18234}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Quality scores are an opinion, not a measurement.","position":{"start":{"line":118,"column":3,"offset":18238},"end":{"line":118,"column":52,"offset":18287}}}],"position":{"start":{"line":118,"column":1,"offset":18236},"end":{"line":118,"column":54,"offset":18289}}},{"type":"text","value":" Alongside the pass/fail checks we ask a large AI model to rate qualities like clarity, grounding and candour, and we publish that as a Quality column. Read it with two caveats.","position":{"start":{"line":118,"column":54,"offset":18289},"end":{"line":118,"column":231,"offset":18466}}}],"position":{"start":{"line":118,"column":1,"offset":18236},"end":{"line":118,"column":231,"offset":18466}}},{"type":"paragraph","children":[{"type":"text","value":"First, it only covers work that got ","position":{"start":{"line":120,"column":1,"offset":18468},"end":{"line":120,"column":37,"offset":18504}}},{"type":"emphasis","children":[{"type":"text","value":"produced","position":{"start":{"line":120,"column":38,"offset":18505},"end":{"line":120,"column":46,"offset":18513}}}],"position":{"start":{"line":120,"column":37,"offset":18504},"end":{"line":120,"column":47,"offset":18514}}},{"type":"text","value":". A model that gives up early is graded on the few pieces it did finish, so a high quality score over a small number of pieces can mean \"good when it manages it\" rather than \"good\". That is why the count always travels with the score — ","position":{"start":{"line":120,"column":47,"offset":18514},"end":{"line":120,"column":283,"offset":18750}}},{"type":"inlineCode","value":"6.5/10 (18 pieces)","position":{"start":{"line":120,"column":283,"offset":18750},"end":{"line":120,"column":303,"offset":18770}}},{"type":"text","value":" next to ","position":{"start":{"line":120,"column":303,"offset":18770},"end":{"line":120,"column":312,"offset":18779}}},{"type":"inlineCode","value":"6.5/10 (26 pieces)","position":{"start":{"line":120,"column":312,"offset":18779},"end":{"line":120,"column":332,"offset":18799}}},{"type":"text","value":" are not the same claim.","position":{"start":{"line":120,"column":332,"offset":18799},"end":{"line":120,"column":356,"offset":18823}}}],"position":{"start":{"line":120,"column":1,"offset":18468},"end":{"line":120,"column":356,"offset":18823}}},{"type":"paragraph","children":[{"type":"text","value":"Second, the rating model changes over time, so quality scores are comparable ","position":{"start":{"line":122,"column":1,"offset":18825},"end":{"line":122,"column":78,"offset":18902}}},{"type":"emphasis","children":[{"type":"text","value":"within","position":{"start":{"line":122,"column":79,"offset":18903},"end":{"line":122,"column":85,"offset":18909}}}],"position":{"start":{"line":122,"column":78,"offset":18902},"end":{"line":122,"column":86,"offset":18910}}},{"type":"text","value":" a round and not across rounds. The pass/fail results are the ones that track.","position":{"start":{"line":122,"column":86,"offset":18910},"end":{"line":122,"column":164,"offset":18988}}}],"position":{"start":{"line":122,"column":1,"offset":18825},"end":{"line":122,"column":164,"offset":18988}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A score is not a recommendation for your machine.","position":{"start":{"line":124,"column":3,"offset":18992},"end":{"line":124,"column":52,"offset":19041}}}],"position":{"start":{"line":124,"column":1,"offset":18990},"end":{"line":124,"column":54,"offset":19043}}},{"type":"text","value":" Results come from one particular computer. A model that scores well on a large desktop may not fit on a laptop at all. The Models catalog in the app is what knows your hardware.","position":{"start":{"line":124,"column":54,"offset":19043},"end":{"line":124,"column":232,"offset":19221}}}],"position":{"start":{"line":124,"column":1,"offset":18990},"end":{"line":124,"column":232,"offset":19221}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A score is not a ceiling.","position":{"start":{"line":126,"column":3,"offset":19225},"end":{"line":126,"column":28,"offset":19250}}}],"position":{"start":{"line":126,"column":1,"offset":19223},"end":{"line":126,"column":30,"offset":19252}}},{"type":"text","value":" These are tasks we chose. A model that does poorly here may be excellent at something we didn't think to measure.","position":{"start":{"line":126,"column":30,"offset":19252},"end":{"line":126,"column":144,"offset":19366}}}],"position":{"start":{"line":126,"column":1,"offset":19223},"end":{"line":126,"column":144,"offset":19366}}}]},{"id":"run-the-same-tests-on-your-machine","startTime":728,"duration":42,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Run the same tests on your machine","position":{"start":{"line":128,"column":4,"offset":19371},"end":{"line":128,"column":38,"offset":19405}}}],"position":{"start":{"line":128,"column":1,"offset":19368},"end":{"line":128,"column":38,"offset":19405}}},"title":"Run the same tests on your machine","contents":[{"type":"paragraph","children":[{"type":"text","value":"Every install carries the test harness. ","position":{"start":{"line":130,"column":1,"offset":19407},"end":{"line":130,"column":41,"offset":19447}}},{"type":"strong","children":[{"type":"text","value":"Settings → Benchmarks","position":{"start":{"line":130,"column":43,"offset":19449},"end":{"line":130,"column":64,"offset":19470}}}],"position":{"start":{"line":130,"column":41,"offset":19447},"end":{"line":130,"column":66,"offset":19472}}},{"type":"text","value":", or ","position":{"start":{"line":130,"column":66,"offset":19472},"end":{"line":130,"column":71,"offset":19477}}},{"type":"inlineCode","value":"gezel bench","position":{"start":{"line":130,"column":71,"offset":19477},"end":{"line":130,"column":84,"offset":19490}}},{"type":"text","value":" in a terminal, runs any of the four sets against a model on your own computer, with the same scenarios, the same automatic checks and the same counting rules as the published scorecard. A run keeps going in the background, and the results stay on your disk. One trial of a set is a spot check and shows as counts; three trials is what it takes to quote a rate. The two harder sets take most of a day at three trials, so both show the worst-case time before anything starts. ","position":{"start":{"line":130,"column":84,"offset":19490},"end":{"line":130,"column":559,"offset":19965}}},{"type":"inlineCode","value":"gezel bench --json","position":{"start":{"line":130,"column":559,"offset":19965},"end":{"line":130,"column":579,"offset":19985}}},{"type":"text","value":" writes a results file in the scorecard's own format, and ","position":{"start":{"line":130,"column":579,"offset":19985},"end":{"line":130,"column":637,"offset":20043}}},{"type":"inlineCode","value":"gezel bench submit","position":{"start":{"line":130,"column":637,"offset":20043},"end":{"line":130,"column":657,"offset":20063}}},{"type":"text","value":" shares it as a GitHub issue; community rounds are shown separately from ours, with the hardware named beside every number.","position":{"start":{"line":130,"column":657,"offset":20063},"end":{"line":130,"column":780,"offset":20186}}}],"position":{"start":{"line":130,"column":1,"offset":19407},"end":{"line":130,"column":780,"offset":20186}}}]},{"id":"adding-a-model","startTime":770,"duration":15,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Adding a model","position":{"start":{"line":132,"column":4,"offset":20191},"end":{"line":132,"column":18,"offset":20205}}}],"position":{"start":{"line":132,"column":1,"offset":20188},"end":{"line":132,"column":18,"offset":20205}}},"title":"Adding a model","contents":[{"type":"paragraph","children":[{"type":"text","value":"New models get added to the same rounds and run through the same jobs, with the same number of attempts, on the same machine. Nothing is graded on a curve, and nothing is added to a table it didn't actually run in.","position":{"start":{"line":134,"column":1,"offset":20207},"end":{"line":134,"column":215,"offset":20421}}}],"position":{"start":{"line":134,"column":1,"offset":20207},"end":{"line":134,"column":215,"offset":20421}}},{"type":"paragraph","children":[{"type":"text","value":"The current results are in ","position":{"start":{"line":136,"column":1,"offset":20423},"end":{"line":136,"column":28,"offset":20450}}},{"type":"link","url":"../model-scorecard/","children":[{"type":"text","value":"Model scorecard","position":{"start":{"line":136,"column":29,"offset":20451},"end":{"line":136,"column":44,"offset":20466}}}],"position":{"start":{"line":136,"column":28,"offset":20450},"end":{"line":136,"column":66,"offset":20488}}},{"type":"text","value":".","position":{"start":{"line":136,"column":66,"offset":20488},"end":{"line":136,"column":67,"offset":20489}}}],"position":{"start":{"line":136,"column":1,"offset":20423},"end":{"line":136,"column":67,"offset":20489}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel can run many different AI models,","startTime":0,"endTime":3.3333333333333335,"audioSegment":0},{"text":"and they are not equally good at the work.","startTime":3.3333333333333335,"endTime":6.666666666666667,"audioSegment":0},{"text":"A model that writes a lovely paragraph may be hopeless at filling in a spreadsheet correctly;","startTime":6.666666666666667,"endTime":10,"audioSegment":0},{"text":"a small one that fits comfortably on a laptop may quietly get dates wrong. So we measure.","startTime":10,"endTime":13.333333333333334,"audioSegment":0},{"text":"This article explains how,","startTime":13.333333333333334,"endTime":16.666666666666668,"audioSegment":0},{"text":"because a score is only worth something if you know what was counted.","startTime":16.666666666666668,"endTime":20,"audioSegment":0},{"text":"We don't quiz models with trivia.","startTime":20,"endTime":22.916666666666668,"audioSegment":0},{"text":"We give them real jobs and check the work they hand back.","startTime":22.916666666666668,"endTime":25.833333333333332,"audioSegment":0},{"text":"A job looks like this: here is a meeting transcript,","startTime":25.833333333333332,"endTime":28.75,"audioSegment":0},{"text":"an out-of-date agenda, and a list of who works here.","startTime":28.75,"endTime":31.666666666666664,"audioSegment":0},{"text":"Produce a written brief and a table of action items with the right owner,","startTime":31.666666666666664,"endTime":34.58333333333333,"audioSegment":0},{"text":"the right date, and the right dependencies.","startTime":34.58333333333333,"endTime":37.5,"audioSegment":0},{"text":"Then we open the files and check them.","startTime":37.5,"endTime":40.416666666666664,"audioSegment":0},{"text":"Did the September 14th decision survive?","startTime":40.416666666666664,"endTime":43.33333333333333,"audioSegment":0},{"text":"Did the canceled proposal stay canceled?","startTime":43.33333333333333,"endTime":46.25,"audioSegment":0},{"text":"Is the action assigned to someone who actually works here?","startTime":46.25,"endTime":49.166666666666664,"audioSegment":0},{"text":"Every task is checked the same way for every model, by a program rather than a person,","startTime":49.166666666666664,"endTime":52.08333333333333,"audioSegment":0},{"text":"so nobody's favorite gets the benefit of the doubt.","startTime":52.08333333333333,"endTime":55,"audioSegment":0},{"text":"Every test below links to what defines it.","startTime":55,"endTime":60,"audioSegment":0},{"text":"Most link to the scenario's source in the repository: the files it starts from,","startTime":60,"endTime":65,"audioSegment":0},{"text":"the instructions, and the checks that decide a pass.","startTime":65,"endTime":70,"audioSegment":0},{"text":"A test named craftbook- followed by a craftbook's name runs that library craftbook as it ships, so it links to the craftbook's own page;","startTime":70,"endTime":75,"audioSegment":0},{"text":"its inputs and checks travel with the craftbook in the catalog as a test.json file, and the harness that runs them is in evals/src/craftbooks.","startTime":75,"endTime":80,"audioSegment":0},{"text":"The core set is general capability — writing a small working program, fixing a bug from a description of the symptoms,","startTime":80,"endTime":85,"audioSegment":0},{"text":"following a checklist and stopping when something looks wrong, turning several documents into one reconciled summary.","startTime":85,"endTime":90,"audioSegment":0},{"text":"Test What the task entails","startTime":90,"endTime":93.8,"audioSegment":0},{"text":"Tic-tac-toe (tictactoe) Create a new project and build a working two-player tic-tac-toe game in a single HTML file,","startTime":93.8,"endTime":97.6,"audioSegment":0},{"text":"including a clear win state.","startTime":97.6,"endTime":101.4,"audioSegment":0},{"text":"Pet shop (petshop) Build a single-page pet-shop website,","startTime":101.4,"endTime":105.2,"audioSegment":0},{"text":"generate a custom logo with the image tool, and make sure the page uses that logo.","startTime":105.2,"endTime":109,"audioSegment":0},{"text":"Tank combat (tankcombat) Build a playable top-down tank game in one HTML file,","startTime":109,"endTime":112.8,"audioSegment":0},{"text":"with keyboard controls, shooting, an enemy tank, and a visible score.","startTime":112.8,"endTime":116.6,"audioSegment":0},{"text":"Schema migration (schema-migration) Refactor a small multi-file TypeScript app from one name field to first and last names,","startTime":116.6,"endTime":120.4,"audioSegment":0},{"text":"preserve every record, add tests and notes, and pass the type check.","startTime":120.4,"endTime":124.19999999999999,"audioSegment":0},{"text":"Tests as the specification (failing-tests-spec) Work out an order-lifecycle state machine from its tests alone,","startTime":124.19999999999999,"endTime":128,"audioSegment":0},{"text":"implement it, and make every test pass without changing the tests.","startTime":128,"endTime":131.8,"audioSegment":0},{"text":"Debug from symptoms (symptom-debug) Diagnose an undocumented pagination error from the failing output,","startTime":131.8,"endTime":135.6,"audioSegment":0},{"text":"then fix the implementation without changing the acceptance check.","startTime":135.6,"endTime":139.4,"audioSegment":0},{"text":"Data wrangling (data-wrangle) Clean three messy CSV exports, standardize dates and email addresses,","startTime":139.4,"endTime":143.2,"audioSegment":0},{"text":"remove duplicates, sort the records, and produce the exact required JSON.","startTime":143.2,"endTime":147,"audioSegment":0},{"text":"Incident postmortem (incident-postmortem) Read five evidence files and write a structured,","startTime":147,"endTime":150.8,"audioSegment":0},{"text":"blame-free postmortem with accurate facts and citations, without inventing unmeasured impact.","startTime":150.8,"endTime":154.6,"audioSegment":0},{"text":"Runbook anomaly (ops-runbook-anomaly) Follow a maintenance checklist step by step,","startTime":154.6,"endTime":158.39999999999998,"audioSegment":0},{"text":"verify and record each action, and stop with a grounded report when a planted backup check fails.","startTime":158.39999999999998,"endTime":162.2,"audioSegment":0},{"text":"Plan and estimate (plan-and-estimate) Produce an office-relocation plan with valid owners,","startTime":162.2,"endTime":166,"audioSegment":0},{"text":"correctly ordered dependencies, risks, and a checkable definition of done for every task.","startTime":166,"endTime":169.8,"audioSegment":0},{"text":"Conflict synthesis (conflict-synthesis) Reconcile five documents that disagree about a launch date,","startTime":169.8,"endTime":173.6,"audioSegment":0},{"text":"budget, and owner; show each conflict and use the authoritative answer consistently.","startTime":173.6,"endTime":177.39999999999998,"audioSegment":0},{"text":"The productivity set is office work — a customer notice written to a hard word limit, a meeting turned into an action register,","startTime":177.39999999999998,"endTime":181.2,"audioSegment":0},{"text":"a research brief with its sources cited, an A/B test read-out, a spreadsheet model, a slide deck, a Word document.","startTime":181.2,"endTime":185,"audioSegment":0},{"text":"Test What the task entails","startTime":185,"endTime":189.35714285714286,"audioSegment":0},{"text":"Constrained communications (constrained-comms) Write a 140–220 word customer outage notice containing the required facts and disclosures while avoiding banned or unsupported claims.","startTime":189.35714285714286,"endTime":193.71428571428572,"audioSegment":0},{"text":"Plan the week (craftbook-week-plan) Turn eight calendar events into a five-day plan,","startTime":193.71428571428572,"endTime":198.07142857142856,"audioSegment":0},{"text":"flag meetings that need preparation, resolve a Tuesday conflict, and protect focus time.","startTime":198.07142857142856,"endTime":202.42857142857142,"audioSegment":0},{"text":"A/B test read-out (craftbook-ab-test-readout) Calculate the experiment results correctly and apply a pre-set decision rule,","startTime":202.42857142857142,"endTime":206.78571428571428,"audioSegment":0},{"text":"including a safety measure that overrides an otherwise positive result.","startTime":206.78571428571428,"endTime":211.14285714285714,"audioSegment":0},{"text":"Annotated bibliography (craftbook-annotated-bibliography) Produce six consistently formatted source entries,","startTime":211.14285714285714,"endTime":215.5,"audioSegment":0},{"text":"each with a summary, an evaluation of the source, and its relevance to the question.","startTime":215.5,"endTime":219.85714285714286,"audioSegment":0},{"text":"Records intake (records-intake) Combine registrations from emails, phone notes,","startTime":219.85714285714286,"endTime":224.21428571428572,"audioSegment":0},{"text":"and an old CSV into one correctly shaped, deduplicated record set with standardized dates.","startTime":224.21428571428572,"endTime":228.57142857142856,"audioSegment":0},{"text":"Plan and estimate (plan-and-estimate) Produce an office-relocation plan with valid owners,","startTime":228.57142857142856,"endTime":232.92857142857142,"audioSegment":0},{"text":"correctly ordered dependencies, risks, and a checkable definition of done for every task.","startTime":232.92857142857142,"endTime":237.28571428571428,"audioSegment":0},{"text":"Meeting follow-up (meeting-followup) Reconcile a noisy transcript, stale agenda,","startTime":237.28571428571428,"endTime":241.64285714285714,"audioSegment":0},{"text":"and current staff list into a decision brief and an exact action register with owners, dates, dependencies, questions, and risks.","startTime":241.64285714285714,"endTime":246,"audioSegment":0},{"text":"Spreadsheet model (craftbook-spreadsheet-model) Calculate the correct roll-ups from seeded records and turn them into a useful spreadsheet-style model and read-out that highlights the main risk.","startTime":246,"endTime":250.35714285714283,"audioSegment":0},{"text":"Conflict synthesis (conflict-synthesis) Reconcile five documents that disagree about a launch date,","startTime":250.35714285714283,"endTime":254.71428571428572,"audioSegment":0},{"text":"budget, and owner; show each conflict and use the authoritative answer consistently.","startTime":254.71428571428572,"endTime":259.07142857142856,"audioSegment":0},{"text":"Theme round-trip (docblocks-theme-roundtrip) Read the theme from a brand document, apply it to a presentation,","startTime":259.07142857142856,"endTime":263.42857142857144,"audioSegment":0},{"text":"inspect the result, and report only fonts, colors, page counts, and unresolved styles returned by the document tools.","startTime":263.42857142857144,"endTime":267.7857142857143,"audioSegment":0},{"text":"Research to Word (craftbook-research-to-document) Turn reviewed,","startTime":267.7857142857143,"endTime":272.1428571428571,"audioSegment":0},{"text":"source-grounded Markdown into a real editable Word document, preview it, and save the finished .docx as an artifact.","startTime":272.1428571428571,"endTime":276.5,"audioSegment":0},{"text":"PowerPoint deck (craftbook-powerpoint-deck) Acquire and cite source material,","startTime":276.5,"endTime":280.85714285714283,"audioSegment":0},{"text":"create an outline, make every slide match it, and save a real editable .pptx presentation.","startTime":280.85714285714283,"endTime":285.2142857142857,"audioSegment":0},{"text":"Wikipedia research brief (wikipedia-research-brief) Use a closed local copy of Wikipedia to select the relevant sources and write a cited 700–1,500 word brief with correct chronology and careful treatment of a disputed claim.","startTime":285.2142857142857,"endTime":289.57142857142856,"audioSegment":0},{"text":"The engineering set (10 tests) is developer work,","startTime":289.57142857142856,"endTime":293.92857142857144,"audioSegment":0},{"text":"and it is deliberately harder than the first two.","startTime":293.92857142857144,"endTime":298.2857142857143,"audioSegment":0},{"text":"A model has to pick the right recipe out of a library of several hundred when two of them look almost identical,","startTime":298.2857142857143,"endTime":302.6428571428571,"audioSegment":0},{"text":"find real defects in a change set without flagging code that is perfectly correct, and prove a fix by running the tests rather than by claiming it works.","startTime":302.6428571428571,"endTime":307,"audioSegment":0},{"text":"Test What the task entails","startTime":307,"endTime":312.2608695652174,"audioSegment":0},{"text":"Fix three documented bugs (fix-squisq-bugs) Find and fix three behavioral bugs in a seeded TypeScript codebase from its bug report — wrong distance math across the antimeridian,","startTime":312.2608695652174,"endTime":317.5217391304348,"audioSegment":0},{"text":"validation that only checks the top level, and functions that throw instead of returning safely — proven by running the code, with the type check as a guard.","startTime":317.5217391304348,"endTime":322.7826086956522,"audioSegment":0},{"text":"Pick the right recipe (dev-craftbook-routing) Given a plain developer brief,","startTime":322.7826086956522,"endTime":328.04347826086956,"audioSegment":0},{"text":"choose the one library recipe that fits out of three plausible ones that overlap (two share the trigger phrase \"fix this bug\"); a wrong-but-plausible pick fails.","startTime":328.04347826086956,"endTime":333.30434782608694,"audioSegment":0},{"text":"Agree on a shared interface (interface-contract) Two developers build the producer and consumer halves of a small event pipeline around a shared type module;","startTime":333.30434782608694,"endTime":338.5652173913044,"audioSegment":0},{"text":"the halves must type-check together and round-trip events through an integration script they never saw.","startTime":338.5652173913044,"endTime":343.82608695652175,"audioSegment":0},{"text":"Code review (craftbook-code-review) Review one staged change set from its snapshot and diff, write a gated report,","startTime":343.82608695652175,"endTime":349.0869565217391,"audioSegment":0},{"text":"and deliver a verdict — graded on finding the real defect without flagging code that is correct.","startTime":349.0869565217391,"endTime":354.3478260869565,"audioSegment":0},{"text":"API contract review (craftbook-api-contract-review) Reconcile an OpenAPI contract against the implemented routes,","startTime":354.3478260869565,"endTime":359.60869565217394,"audioSegment":0},{"text":"lock a design checklist, and produce a findings report.","startTime":359.60869565217394,"endTime":364.8695652173913,"audioSegment":0},{"text":"Deep security review (craftbook-deep-security-review) Audit a whole seeded codebase for systemic weaknesses, cluster the findings into themes,","startTime":364.8695652173913,"endTime":370.1304347826087,"audioSegment":0},{"text":"and write a report plus a structured findings file — graded on precision as well as recall against planted source-to-sink vulnerabilities.","startTime":370.1304347826087,"endTime":375.3913043478261,"audioSegment":0},{"text":"Large pull-request review (large-pr-review) Review a 120-file change set that contains one planted defect and one planted false-positive trap,","startTime":375.3913043478261,"endTime":380.6521739130435,"audioSegment":0},{"text":"and report coverage of every file.","startTime":380.6521739130435,"endTime":385.9130434782609,"audioSegment":0},{"text":"Codemod sweep (craftbook-codemod-sweep) Rename a function across nine files — the export, the re-export, every import,","startTime":385.9130434782609,"endTime":391.17391304347825,"audioSegment":0},{"text":"call site and log string — while leaving the CHANGELOG untouched, with every claim reconciled by a real search.","startTime":391.17391304347825,"endTime":396.4347826086956,"audioSegment":0},{"text":"Behavior-preserving refactor (craftbook-refactor-module) Extract duplicated,","startTime":396.4347826086956,"endTime":401.69565217391306,"audioSegment":0},{"text":"drifted logic into one shared module without changing behavior, proven by a behavior-equivalence matrix and a duplication check.","startTime":401.69565217391306,"endTime":406.95652173913044,"audioSegment":0},{"text":"Reproduce, then fix (craftbook-bug-fix-tdd) Write a failing test that reproduces a reported pricing bug, make the smallest fix,","startTime":406.95652173913044,"endTime":412.2173913043478,"audioSegment":0},{"text":"and prove red-then-green by running the suite, with a mutant check that the new test really catches the bug.","startTime":412.2173913043478,"endTime":417.47826086956525,"audioSegment":0},{"text":"The complex-workflow set (9 tests) asks a model to build the recipe, not just follow one: write a reusable procedure with its own quality gates,","startTime":417.47826086956525,"endTime":422.7391304347826,"audioSegment":0},{"text":"run it twice against different inputs, repair one that is broken, and turn a job it just did by hand into something that can be run again next quarter.","startTime":422.7391304347826,"endTime":428,"audioSegment":0},{"text":"Test What the task entails","startTime":428,"endTime":432.19354838709677,"audioSegment":0},{"text":"Find, don't write (craftbook-find-vs-create) Given a brief that paraphrases a bundled recipe's domain,","startTime":432.19354838709677,"endTime":436.38709677419354,"audioSegment":0},{"text":"find and start the library recipe instead of authoring a new one.","startTime":436.38709677419354,"endTime":440.5806451612903,"audioSegment":0},{"text":"Repair a stuck recipe (craftbook-edit-midtask) Diagnose a live task stuck on a quality gate it can never pass,","startTime":440.5806451612903,"endTime":444.7741935483871,"audioSegment":0},{"text":"rewrite the failing step of its recipe, add a verification step, and run it to completion.","startTime":444.7741935483871,"endTime":448.9677419354839,"audioSegment":0},{"text":"Monthly invoice run (craftbook-invoice-run) Run a fan-out recipe: one invoice per client from the ledger,","startTime":448.9677419354839,"endTime":453.16129032258067,"audioSegment":0},{"text":"numbering that continues the sequence without a skip or a repeat, due dates per client's terms, and a one-page summary.","startTime":453.16129032258067,"endTime":457.35483870967744,"audioSegment":0},{"text":"Author a recipe (craftbook-author-linear) Write a reusable three-step recipe from scratch,","startTime":457.35483870967744,"endTime":461.5483870967742,"audioSegment":0},{"text":"with a file deliverable gating every step, then run it to completion.","startTime":461.5483870967742,"endTime":465.741935483871,"audioSegment":0},{"text":"Select, then execute (craftbook-route-multi) Find the right library recipe and run it to a deliverable that holds up —","startTime":465.741935483871,"endTime":469.93548387096774,"audioSegment":0},{"text":"graded on both the route taken and the properties a real deliverable of that kind has.","startTime":469.93548387096774,"endTime":474.1290322580645,"audioSegment":0},{"text":"Generalize finished work (craftbook-export-generalize) Do one quarter's data clean-up by hand,","startTime":474.1290322580645,"endTime":478.3225806451613,"audioSegment":0},{"text":"then turn that one-off pass into a reusable recipe and run it on the next quarter's different data.","startTime":478.3225806451613,"endTime":482.51612903225805,"audioSegment":0},{"text":"Author a parameterized recipe (craftbook-author-params) Write one recipe that serves two regions through an input parameter rather than by editing the recipe between runs;","startTime":482.51612903225805,"endTime":486.7096774193548,"audioSegment":0},{"text":"the two outputs must differ.","startTime":486.7096774193548,"endTime":490.9032258064516,"audioSegment":0},{"text":"Author a gate script (craftbook-author-gate-script) Write a recipe whose build step is checked by a custom script embedded in the recipe itself;","startTime":490.9032258064516,"endTime":495.0967741935484,"audioSegment":0},{"text":"a script that approves everything fails.","startTime":495.0967741935484,"endTime":499.2903225806451,"audioSegment":0},{"text":"Author a fan-out recipe (craftbook-author-fanout) Write a recipe whose spawn block reads a list and produces one child run per item,","startTime":499.2903225806451,"endTime":503.48387096774195,"audioSegment":0},{"text":"with no tool call driving it; repeating the steps once per item by hand does not score.","startTime":503.48387096774195,"endTime":507.6774193548387,"audioSegment":0},{"text":"Nobody should expect full marks on either of these two.","startTime":507.6774193548387,"endTime":511.8709677419355,"audioSegment":0},{"text":"They exist because the best models now score close to full marks on the first two sets,","startTime":511.8709677419355,"endTime":516.0645161290322,"audioSegment":0},{"text":"and a column of near-perfect scores cannot tell you which model to choose.","startTime":516.0645161290322,"endTime":520.258064516129,"audioSegment":0},{"text":"Low numbers here are headroom, not breakage.","startTime":520.258064516129,"endTime":524.4516129032259,"audioSegment":0},{"text":"Each task has a time limit,","startTime":524.4516129032259,"endTime":528.6451612903226,"audioSegment":0},{"text":"and at one attempt per task the limits add up to 10 hours for the engineering set and 11 hours 25 minutes for the complex-workflow set.","startTime":528.6451612903226,"endTime":532.8387096774194,"audioSegment":0},{"text":"They are run less often than the first two,","startTime":532.8387096774194,"endTime":537.0322580645161,"audioSegment":0},{"text":"so not every round in the scorecard includes them.","startTime":537.0322580645161,"endTime":541.2258064516129,"audioSegment":0},{"text":"A model gets a score on each set it was run on.","startTime":541.2258064516129,"endTime":545.4193548387096,"audioSegment":0},{"text":"The sets measure different things,","startTime":545.4193548387096,"endTime":549.6129032258065,"audioSegment":0},{"text":"and it is normal for a model to be strong on one and weak on another.","startTime":549.6129032258065,"endTime":553.8064516129032,"audioSegment":0},{"text":"Plan and estimate and conflict synthesis deliberately appear in both the core and productivity sets because they test capabilities that matter to each.","startTime":553.8064516129032,"endTime":558,"audioSegment":0},{"text":"A task passes when the finished work meets every requirement that was stated in the instructions.","startTime":558,"endTime":561.5454545454545,"audioSegment":0},{"text":"Not most of them.","startTime":561.5454545454545,"endTime":565.0909090909091,"audioSegment":0},{"text":"There is no partial credit for a beautiful document with the wrong numbers in it —","startTime":565.0909090909091,"endTime":568.6363636363636,"audioSegment":0},{"text":"that is precisely the failure that costs you an afternoon.","startTime":568.6363636363636,"endTime":572.1818181818181,"audioSegment":0},{"text":"Some tasks are checked by arithmetic.","startTime":572.1818181818181,"endTime":575.7272727272727,"audioSegment":0},{"text":"For the A/B test read-out we know what the right answer is,","startTime":575.7272727272727,"endTime":579.2727272727273,"audioSegment":0},{"text":"because we made the data up: the conversion lift is 1.25 percentage points and the refund rate rose by 0.23.","startTime":579.2727272727273,"endTime":582.8181818181819,"audioSegment":0},{"text":"A model that reports different figures fails, however confident the prose sounds.","startTime":582.8181818181819,"endTime":586.3636363636364,"audioSegment":0},{"text":"Some are checked by opening the file.","startTime":586.3636363636364,"endTime":589.9090909090909,"audioSegment":0},{"text":"When a task asks for a PowerPoint,","startTime":589.9090909090909,"endTime":593.4545454545455,"audioSegment":0},{"text":"we check the result is really a PowerPoint file and not a text document with the wrong name on it.","startTime":593.4545454545455,"endTime":597,"audioSegment":0},{"text":"Models are not perfectly consistent.","startTime":597,"endTime":600.8333333333334,"audioSegment":0},{"text":"The same model given the same job twice can succeed once and fail once.","startTime":600.8333333333334,"endTime":604.6666666666666,"audioSegment":0},{"text":"So each job is run three times,","startTime":604.6666666666666,"endTime":608.5,"audioSegment":0},{"text":"and we report how many succeeded.","startTime":608.5,"endTime":612.3333333333334,"audioSegment":0},{"text":"If a model has only been run once or twice we print the raw count — \"1 of 1\" — rather than a percentage,","startTime":612.3333333333334,"endTime":616.1666666666666,"audioSegment":0},{"text":"because \"100%\" from a single attempt is not a fact, it is a coin toss that happened to land well.","startTime":616.1666666666666,"endTime":620,"audioSegment":0},{"text":"Sometimes a run fails for reasons that have nothing to do with the model: the graphics driver falls over,","startTime":620,"endTime":623.7142857142857,"audioSegment":0},{"text":"the machine runs out of memory, someone stops the run.","startTime":623.7142857142857,"endTime":627.4285714285714,"audioSegment":0},{"text":"Those attempts are recorded and set aside rather than counted as failures.","startTime":627.4285714285714,"endTime":631.1428571428571,"audioSegment":0},{"text":"If enough of a model's attempts are lost that its results no longer stand up,","startTime":631.1428571428571,"endTime":634.8571428571429,"audioSegment":0},{"text":"we leave it out of the table rather than publish a score with a hole in it.","startTime":634.8571428571429,"endTime":638.5714285714286,"audioSegment":0},{"text":"A missing model means \"not measured properly yet\",","startTime":638.5714285714286,"endTime":642.2857142857143,"audioSegment":0},{"text":"never \"measured and found wanting\".","startTime":642.2857142857143,"endTime":646,"audioSegment":0},{"text":"Scores from different rounds are not comparable.","startTime":646,"endTime":649.28,"audioSegment":0},{"text":"Every number comes from one machine, on one day,","startTime":649.28,"endTime":652.56,"audioSegment":0},{"text":"with one version of gezel and one version of the task set.","startTime":652.56,"endTime":655.84,"audioSegment":0},{"text":"Change any of those and you have a different experiment.","startTime":655.84,"endTime":659.12,"audioSegment":0},{"text":"When a model was measured in an earlier round we list it separately and say why —","startTime":659.12,"endTime":662.4,"audioSegment":0},{"text":"we never quietly merge it into a newer table to make the list look fuller.","startTime":662.4,"endTime":665.68,"audioSegment":0},{"text":"Quality scores are an opinion, not a measurement.","startTime":665.68,"endTime":668.96,"audioSegment":0},{"text":"Alongside the pass/fail checks we ask a large AI model to rate qualities like clarity,","startTime":668.96,"endTime":672.24,"audioSegment":0},{"text":"grounding and candour, and we publish that as a Quality column.","startTime":672.24,"endTime":675.52,"audioSegment":0},{"text":"Read it with two caveats.","startTime":675.52,"endTime":678.8,"audioSegment":0},{"text":"First, it only covers work that got produced.","startTime":678.8,"endTime":682.08,"audioSegment":0},{"text":"A model that gives up early is graded on the few pieces it did finish,","startTime":682.08,"endTime":685.36,"audioSegment":0},{"text":"so a high quality score over a small number of pieces can mean \"good when it manages it\" rather than \"good\".","startTime":685.36,"endTime":688.64,"audioSegment":0},{"text":"That is why the count always travels with the score —","startTime":688.64,"endTime":691.92,"audioSegment":0},{"text":"6.5/10 (18 pieces) next to 6.5/10 (26 pieces) are not the same claim.","startTime":691.92,"endTime":695.2,"audioSegment":0},{"text":"Second, the rating model changes over time,","startTime":695.2,"endTime":698.48,"audioSegment":0},{"text":"so quality scores are comparable within a round and not across rounds.","startTime":698.48,"endTime":701.76,"audioSegment":0},{"text":"The pass/fail results are the ones that track.","startTime":701.76,"endTime":705.04,"audioSegment":0},{"text":"A score is not a recommendation for your machine.","startTime":705.04,"endTime":708.3199999999999,"audioSegment":0},{"text":"Results come from one particular computer.","startTime":708.3199999999999,"endTime":711.6,"audioSegment":0},{"text":"A model that scores well on a large desktop may not fit on a laptop at all.","startTime":711.6,"endTime":714.88,"audioSegment":0},{"text":"The Models catalog in the app is what knows your hardware.","startTime":714.88,"endTime":718.16,"audioSegment":0},{"text":"A score is not a ceiling.","startTime":718.16,"endTime":721.44,"audioSegment":0},{"text":"These are tasks we chose.","startTime":721.44,"endTime":724.72,"audioSegment":0},{"text":"A model that does poorly here may be excellent at something we didn't think to measure.","startTime":724.72,"endTime":728,"audioSegment":0},{"text":"Every install carries the test harness.","startTime":728,"endTime":731.8181818181819,"audioSegment":0},{"text":"Settings → Benchmarks, or gezel bench in a terminal, runs any of the four sets against a model on your own computer,","startTime":731.8181818181819,"endTime":735.6363636363636,"audioSegment":0},{"text":"with the same scenarios, the same automatic checks and the same counting rules as the published scorecard.","startTime":735.6363636363636,"endTime":739.4545454545455,"audioSegment":0},{"text":"A run keeps going in the background,","startTime":739.4545454545455,"endTime":743.2727272727273,"audioSegment":0},{"text":"and the results stay on your disk.","startTime":743.2727272727273,"endTime":747.0909090909091,"audioSegment":0},{"text":"One trial of a set is a spot check and shows as counts;","startTime":747.0909090909091,"endTime":750.9090909090909,"audioSegment":0},{"text":"three trials is what it takes to quote a rate.","startTime":750.9090909090909,"endTime":754.7272727272727,"audioSegment":0},{"text":"The two harder sets take most of a day at three trials,","startTime":754.7272727272727,"endTime":758.5454545454545,"audioSegment":0},{"text":"so both show the worst-case time before anything starts.","startTime":758.5454545454545,"endTime":762.3636363636364,"audioSegment":0},{"text":"gezel bench --json writes a results file in the scorecard's own format, and gezel bench submit shares it as a GitHub issue;","startTime":762.3636363636364,"endTime":766.1818181818182,"audioSegment":0},{"text":"community rounds are shown separately from ours, with the hardware named beside every number.","startTime":766.1818181818182,"endTime":770,"audioSegment":0},{"text":"New models get added to the same rounds and run through the same jobs,","startTime":770,"endTime":773,"audioSegment":0},{"text":"with the same number of attempts, on the same machine.","startTime":773,"endTime":776,"audioSegment":0},{"text":"Nothing is graded on a curve,","startTime":776,"endTime":779,"audioSegment":0},{"text":"and nothing is added to a table it didn't actually run in.","startTime":779,"endTime":782,"audioSegment":0},{"text":"The current results are in Model scorecard.","startTime":782,"endTime":785,"audioSegment":0}],"version":1},"startBlock":{"title":"How we test models","subtitle":"Gezel can run many different AI models, and they are not equally good at the work. A model that writes a lovely paragraph may be hopeless at filling in a spreadsheet correctly; a small one that fits comfortably on a laptop may quietly get dates wrong.","ambientMotion":"zoomIn"}}</script>
