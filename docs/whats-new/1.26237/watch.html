<script type="application/json" id="squisq-doc" data-squisq-doc="1">{"articleId":"whats-new/1.26237","duration":536,"blocks":[{"id":"126237-25-august-2026","startTime":0,"duration":14,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":1,"children":[{"type":"text","value":"1.26237 — 25 August 2026","position":{"start":{"line":1,"column":3,"offset":2},"end":{"line":1,"column":27,"offset":26}}}],"position":{"start":{"line":1,"column":1,"offset":0},"end":{"line":1,"column":27,"offset":26}}},"title":"1.26237 — 25 August 2026","contents":[{"type":"paragraph","children":[{"type":"text","value":"This release is about work you get to look at before it lands.","position":{"start":{"line":3,"column":1,"offset":28},"end":{"line":3,"column":63,"offset":90}}}],"position":{"start":{"line":3,"column":1,"offset":28},"end":{"line":3,"column":63,"offset":90}}},{"type":"paragraph","children":[{"type":"text","value":"If you read only one thing: when a gezel fixes a problem in your files now, it doesn't change them. It writes the change up, you read it, and it happens when you say so.","position":{"start":{"line":5,"column":1,"offset":92},"end":{"line":5,"column":170,"offset":261}}}],"position":{"start":{"line":5,"column":1,"offset":92},"end":{"line":5,"column":170,"offset":261}}}],"children":[{"id":"your-crew-proposes-changes-instead-of-making-them","startTime":14,"duration":95,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Your crew proposes changes instead of making them","position":{"start":{"line":7,"column":4,"offset":266},"end":{"line":7,"column":53,"offset":315}}}],"position":{"start":{"line":7,"column":1,"offset":263},"end":{"line":7,"column":53,"offset":315}}},"title":"Your crew proposes changes instead of making them","contents":[{"type":"paragraph","children":[{"type":"text","value":"A ","position":{"start":{"line":9,"column":1,"offset":317},"end":{"line":9,"column":3,"offset":319}}},{"type":"strong","children":[{"type":"text","value":"gezel","position":{"start":{"line":9,"column":5,"offset":321},"end":{"line":9,"column":10,"offset":326}}}],"position":{"start":{"line":9,"column":3,"offset":319},"end":{"line":9,"column":12,"offset":328}}},{"type":"text","value":" — one of the AI workers on your crew — used to edit your files directly, or not at all. There was no third option, which meant every fix was a small act of trust: you found out what it did by looking at what it had already done.","position":{"start":{"line":9,"column":12,"offset":328},"end":{"line":9,"column":241,"offset":557}}}],"position":{"start":{"line":9,"column":1,"offset":317},"end":{"line":9,"column":241,"offset":557}}},{"type":"paragraph","children":[{"type":"text","value":"Now there is a third option. The gezel works exactly as before, but the edits are collected into a ","position":{"start":{"line":11,"column":1,"offset":559},"end":{"line":11,"column":100,"offset":658}}},{"type":"strong","children":[{"type":"text","value":"change proposal","position":{"start":{"line":11,"column":102,"offset":660},"end":{"line":11,"column":117,"offset":675}}}],"position":{"start":{"line":11,"column":100,"offset":658},"end":{"line":11,"column":119,"offset":677}}},{"type":"text","value":" instead of being written to your project. Your files are untouched. The proposal shows up in the project's ","position":{"start":{"line":11,"column":119,"offset":677},"end":{"line":11,"column":227,"offset":785}}},{"type":"strong","children":[{"type":"text","value":"Proposals","position":{"start":{"line":11,"column":229,"offset":787},"end":{"line":11,"column":238,"offset":796}}}],"position":{"start":{"line":11,"column":227,"offset":785},"end":{"line":11,"column":240,"offset":798}}},{"type":"text","value":" tab — which only appears once there's something in it — with the gezel's reasoning written out and every edit laid out line by line. You read it, and you press Apply. Or you don't.","position":{"start":{"line":11,"column":240,"offset":798},"end":{"line":11,"column":421,"offset":979}}}],"position":{"start":{"line":11,"column":1,"offset":559},"end":{"line":11,"column":421,"offset":979}}},{"type":"paragraph","children":[{"type":"text","value":"The useful consequence is that this works on folders your crew has no permission to write to. You never have to hand over edit access to get a fix drafted, and you don't have to give it to the night shift either.","position":{"start":{"line":13,"column":1,"offset":981},"end":{"line":13,"column":213,"offset":1193}}}],"position":{"start":{"line":13,"column":1,"offset":981},"end":{"line":13,"column":213,"offset":1193}}},{"type":"paragraph","children":[{"type":"text","value":"Two things a proposal will tell you plainly. If a file changed after the proposal was written — you edited it, or a teammate did — it's marked ","position":{"start":{"line":15,"column":1,"offset":1195},"end":{"line":15,"column":144,"offset":1338}}},{"type":"strong","children":[{"type":"text","value":"out of date","position":{"start":{"line":15,"column":146,"offset":1340},"end":{"line":15,"column":157,"offset":1351}}}],"position":{"start":{"line":15,"column":144,"offset":1338},"end":{"line":15,"column":159,"offset":1353}}},{"type":"text","value":", and applying it asks you to confirm first, naming the files that moved. And if two proposals touch the same file, both say so, because applying one puts the other out of date. If you'd rather read the change somewhere else entirely, every proposal exports as a zip with the diffs, the notes, and the ","position":{"start":{"line":15,"column":159,"offset":1353},"end":{"line":15,"column":461,"offset":1655}}},{"type":"inlineCode","value":"git apply","position":{"start":{"line":15,"column":461,"offset":1655},"end":{"line":15,"column":472,"offset":1666}}},{"type":"text","value":" line to use them.","position":{"start":{"line":15,"column":472,"offset":1666},"end":{"line":15,"column":490,"offset":1684}}}],"position":{"start":{"line":15,"column":1,"offset":1195},"end":{"line":15,"column":490,"offset":1684}}},{"type":"paragraph","children":[{"type":"text","value":"Fixes always arrive this way. Press ","position":{"start":{"line":17,"column":1,"offset":1686},"end":{"line":17,"column":37,"offset":1722}}},{"type":"strong","children":[{"type":"text","value":"Fix","position":{"start":{"line":17,"column":39,"offset":1724},"end":{"line":17,"column":42,"offset":1727}}}],"position":{"start":{"line":17,"column":37,"offset":1722},"end":{"line":17,"column":44,"offset":1729}}},{"type":"text","value":" on a problem your ","position":{"start":{"line":17,"column":44,"offset":1729},"end":{"line":17,"column":63,"offset":1748}}},{"type":"strong","children":[{"type":"text","value":"Librarian","position":{"start":{"line":17,"column":65,"offset":1750},"end":{"line":17,"column":74,"offset":1759}}}],"position":{"start":{"line":17,"column":63,"offset":1748},"end":{"line":17,"column":76,"offset":1761}}},{"type":"text","value":" has flagged, and what you get back is a proposal, not an edited file. Other work uses proposals where they fit: a task whose recipe supports drafting will propose rather than edit whenever it runs unattended, or whenever writing was never on the table.","position":{"start":{"line":17,"column":76,"offset":1761},"end":{"line":17,"column":329,"offset":2014}}}],"position":{"start":{"line":17,"column":1,"offset":1686},"end":{"line":17,"column":329,"offset":2014}}}]},{"id":"overnight-they-write-themselves","startTime":109,"duration":56,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Overnight, they write themselves","position":{"start":{"line":19,"column":4,"offset":2019},"end":{"line":19,"column":36,"offset":2051}}}],"position":{"start":{"line":19,"column":1,"offset":2016},"end":{"line":19,"column":36,"offset":2051}}},"title":"Overnight, they write themselves","contents":[{"type":"paragraph","children":[{"type":"text","value":"If a project has both a Librarian and a developer on its crew, the night shift now includes fixing. The Librarian finds the problems, and overnight the developer works through them — grouping related ones together and writing one proposal per group.","position":{"start":{"line":21,"column":1,"offset":2053},"end":{"line":21,"column":250,"offset":2302}}}],"position":{"start":{"line":21,"column":1,"offset":2053},"end":{"line":21,"column":250,"offset":2302}}},{"type":"paragraph","children":[{"type":"text","value":"What's waiting in the morning is a set of proposals, not a changed project. The home panel that summarizes the night now leads with them, since they're the part that's waiting on a decision rather than on being read, and each row says which project, how many files, and how many lines change.","position":{"start":{"line":23,"column":1,"offset":2304},"end":{"line":23,"column":293,"offset":2596}}}],"position":{"start":{"line":23,"column":1,"offset":2304},"end":{"line":23,"column":293,"offset":2596}}},{"type":"paragraph","children":[{"type":"text","value":"This is on by default, but only for projects that already have that pair on the crew — assembling one is the opt-in. Turn it off per project with ","position":{"start":{"line":25,"column":1,"offset":2598},"end":{"line":25,"column":147,"offset":2744}}},{"type":"strong","children":[{"type":"text","value":"Fix problems overnight","position":{"start":{"line":25,"column":149,"offset":2746},"end":{"line":25,"column":171,"offset":2768}}}],"position":{"start":{"line":25,"column":147,"offset":2744},"end":{"line":25,"column":173,"offset":2770}}},{"type":"text","value":" in the project's settings. There's a limit of 40 issues per project per night, deliberately: above that the developer spends the window triaging and you wake up to a queue nobody will get through. The whole thing runs on a model on your own machine if that's what you use — no network, nobody's cloud. More in ","position":{"start":{"line":25,"column":173,"offset":2770},"end":{"line":25,"column":484,"offset":3081}}},{"type":"link","url":"../../night-shift/","children":[{"type":"text","value":"The night shift","position":{"start":{"line":25,"column":485,"offset":3082},"end":{"line":25,"column":500,"offset":3097}}}],"position":{"start":{"line":25,"column":484,"offset":3081},"end":{"line":25,"column":521,"offset":3118}}},{"type":"text","value":".","position":{"start":{"line":25,"column":521,"offset":3118},"end":{"line":25,"column":522,"offset":3119}}}],"position":{"start":{"line":25,"column":1,"offset":2598},"end":{"line":25,"column":522,"offset":3119}}}]},{"id":"a-stuck-task-has-a-try-again-button","startTime":165,"duration":55,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"A stuck task has a Try again button","position":{"start":{"line":27,"column":4,"offset":3124},"end":{"line":27,"column":39,"offset":3159}}}],"position":{"start":{"line":27,"column":1,"offset":3121},"end":{"line":27,"column":39,"offset":3159}}},"title":"A stuck task has a Try again button","contents":[{"type":"paragraph","children":[{"type":"text","value":"When a task pauses to ask for help — it ran out of attempts on a step, or kept failing the same check — getting it moving again meant flipping its status back to active by hand. That usually did nothing. The counters that stopped it were still spent, so the scheduler would look at it on the next pass and pause it right back.","position":{"start":{"line":29,"column":1,"offset":3161},"end":{"line":29,"column":327,"offset":3487}}}],"position":{"start":{"line":29,"column":1,"offset":3161},"end":{"line":29,"column":327,"offset":3487}}},{"type":"paragraph","children":[{"type":"text","value":"The needs-input card now has ","position":{"start":{"line":31,"column":1,"offset":3489},"end":{"line":31,"column":30,"offset":3518}}},{"type":"strong","children":[{"type":"text","value":"Try again","position":{"start":{"line":31,"column":32,"offset":3520},"end":{"line":31,"column":41,"offset":3529}}}],"position":{"start":{"line":31,"column":30,"offset":3518},"end":{"line":31,"column":43,"offset":3531}}},{"type":"text","value":", and it does the three things that were actually required: clears the counters that tripped the pause, sets the task working again, and gets the assignee started immediately instead of waiting out a stall window. It continues the same conversation, so the gezel can see its own failed attempts, and it's pointed at the note explaining why it stopped — a retry that repeats the attempt word for word is a wasted turn.","position":{"start":{"line":31,"column":43,"offset":3531},"end":{"line":31,"column":460,"offset":3948}}}],"position":{"start":{"line":31,"column":1,"offset":3489},"end":{"line":31,"column":460,"offset":3948}}},{"type":"paragraph","children":[{"type":"text","value":"It doesn't try to judge whether retrying can work. If the fix was an edit you made between the pause and the click, refusing the button would just hide it from the person who already fixed the problem.","position":{"start":{"line":33,"column":1,"offset":3950},"end":{"line":33,"column":202,"offset":4151}}}],"position":{"start":{"line":33,"column":1,"offset":3950},"end":{"line":33,"column":202,"offset":4151}}}]},{"id":"craftbooks-are-shelved-by-subject","startTime":220,"duration":31,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Craftbooks are shelved by subject","position":{"start":{"line":35,"column":4,"offset":4156},"end":{"line":35,"column":37,"offset":4189}}}],"position":{"start":{"line":35,"column":1,"offset":4153},"end":{"line":35,"column":37,"offset":4189}}},"title":"Craftbooks are shelved by subject","contents":[{"type":"paragraph","children":[{"type":"text","value":"A ","position":{"start":{"line":37,"column":1,"offset":4191},"end":{"line":37,"column":3,"offset":4193}}},{"type":"strong","children":[{"type":"t l clock.","The script RPC channel handles backpressure. A large request over the inherited descriptor could short-write and raise EAGAIN while the parent drained the first chunk; writes now retry against a bounded synchronous pause instead of hanging until the runner's timeout.","New craftbook gate checks for codebase-review reports, corpus coverage provenance, and workspace existence, plus stdlib scripts to drive them.","Two new repo guards: one on layering direction, one on the resolved default provider."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":518,"duration":18,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":85,"column":4,"offset":10472},"end":{"line":85,"column":37,"offset":10505}}}],"position":{"start":{"line":85,"column":1,"offset":10469},"end":{"line":85,"column":37,"offset":10505}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Two places are worth a visit. If you have a project with a Librarian and a developer on the crew, look at ","position":{"start":{"line":87,"column":1,"offset":10507},"end":{"line":87,"column":107,"offset":10613}}},{"type":"strong","children":[{"type":"text","value":"Fix problems overnight","position":{"start":{"line":87,"column":109,"offset":10615},"end":{"line":87,"column":131,"offset":10637}}}],"position":{"start":{"line":87,"column":107,"offset":10613},"end":{"line":87,"column":133,"offset":10639}}},{"type":"text","value":" in that project's settings and decide whether you want it; it's on by default. And if you run local models, the model tables have more measured numbers on them than they did three days ago.","position":{"start":{"line":87,"column":133,"offset":10639},"end":{"line":87,"column":323,"offset":10829}}}],"position":{"start":{"line":87,"column":1,"offset":10507},"end":{"line":87,"column":323,"offset":10829}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"This release is about work you get to look at before it lands.","startTime":0,"endTime":2.8,"audioSegment":0},{"text":"If you read only one thing: when a gezel fixes a problem in your files now,","startTime":2.8,"endTime":5.6,"audioSegment":0},{"text":"it doesn't change them.","startTime":5.6,"endTime":8.399999999999999,"audioSegment":0},{"text":"It writes the change up, you read it,","startTime":8.399999999999999,"endTime":11.2,"audioSegment":0},{"text":"and it happens when you say so.","startTime":11.2,"endTime":14,"audioSegment":0},{"text":"A gezel — one of the AI workers on your crew —","startTime":14,"endTime":17.653846153846153,"audioSegment":0},{"text":"used to edit your files directly, or not at all.","startTime":17.653846153846153,"endTime":21.307692307692307,"audioSegment":0},{"text":"There was no third option,","startTime":21.307692307692307,"endTime":24.96153846153846,"audioSegment":0},{"text":"which meant every fix was a small act of trust: you found out what it did by looking at what it had already done.","startTime":24.96153846153846,"endTime":28.615384615384613,"audioSegment":0},{"text":"Now there is a third option.","startTime":28.615384615384613,"endTime":32.269230769230774,"audioSegment":0},{"text":"The gezel works exactly as before,","startTime":32.269230769230774,"endTime":35.92307692307692,"audioSegment":0},{"text":"but the edits are collected into a change proposal instead of being written to your project.","startTime":35.92307692307692,"endTime":39.57692307692308,"audioSegment":0},{"text":"Your files are untouched.","startTime":39.57692307692308,"endTime":43.230769230769226,"audioSegment":0},{"text":"The proposal shows up in the project's Proposals tab — which only appears once there's something in it —","startTime":43.230769230769226,"endTime":46.88461538461539,"audioSegment":0},{"text":"with the gezel's reasoning written out and every edit laid out line by line.","startTime":46.88461538461539,"endTime":50.53846153846154,"audioSegment":0},{"text":"You read it, and you press Apply. Or you don't.","startTime":50.53846153846154,"endTime":54.19230769230769,"audioSegment":0},{"text":"The useful consequence is that this works on folders your crew has no permission to write to.","startTime":54.19230769230769,"endTime":57.84615384615385,"audioSegment":0},{"text":"You never have to hand over edit access to get a fix drafted,","startTime":57.84615384615385,"endTime":61.5,"audioSegment":0},{"text":"and you don't have to give it to the night shift either.","startTime":61.5,"endTime":65.15384615384616,"audioSegment":0},{"text":"Two things a proposal will tell you plainly.","startTime":65.15384615384616,"endTime":68.8076923076923,"audioSegment":0},{"text":"If a file changed after the proposal was written — you edited it, or a teammate did —","startTime":68.8076923076923,"endTime":72.46153846153845,"audioSegment":0},{"text":"it's marked out of date, and applying it asks you to confirm first, naming the files that moved.","startTime":72.46153846153845,"endTime":76.11538461538461,"audioSegment":0},{"text":"And if two proposals touch the same file, both say so,","startTime":76.11538461538461,"endTime":79.76923076923077,"audioSegment":0},{"text":"because applying one puts the other out of date.","startTime":79.76923076923077,"endTime":83.42307692307692,"audioSegment":0},{"text":"If you'd rather read the change somewhere else entirely,","startTime":83.42307692307692,"endTime":87.07692307692308,"audioSegment":0},{"text":"every proposal exports as a zip with the diffs, the notes, and the git apply line to use them.","startTime":87.07692307692308,"endTime":90.73076923076923,"audioSegment":0},{"text":"Fixes always arrive this way.","startTime":90.73076923076923,"endTime":94.38461538461539,"audioSegment":0},{"text":"Press Fix on a problem your Librarian has flagged,","startTime":94.38461538461539,"endTime":98.03846153846153,"audioSegment":0},{"text":"and what you get back is a proposal, not an edited file.","startTime":98.03846153846153,"endTime":101.6923076923077,"audioSegment":0},{"text":"Other work uses proposals where they fit: a task whose recipe supports drafting will propose rather than edit whenever it runs unattended,","startTime":101.6923076923077,"endTime":105.34615384615384,"audioSegment":0},{"text":"or whenever writing was never on the table.","startTime":105.34615384615384,"endTime":109,"audioSegment":0},{"text":"If a project has both a Librarian and a developer on its crew,","startTime":109,"endTime":112.5,"audioSegment":0},{"text":"the night shift now includes fixing.","startTime":112.5,"endTime":116,"audioSegment":0},{"text":"The Librarian finds the problems, and overnight the developer works through them —","startTime":116,"endTime":119.5,"audioSegment":0},{"text":"grouping related ones together and writing one proposal per group.","startTime":119.5,"endTime":123,"audioSegment":0},{"text":"What's waiting in the morning is a set of proposals,","startTime":123,"endTime":126.5,"audioSegment":0},{"text":"not a changed project.","startTime":126.5,"endTime":130,"audioSegment":0},{"text":"The home panel that summarizes the night now leads with them, since they're the part that's waiting on a decision rather than on being read,","startTime":130,"endTime":133.5,"audioSegment":0},{"text":"and each row says which project, how many files, and how many lines change.","startTime":133.5,"endTime":137,"audioSegment":0},{"text":"This is on by default, but only for projects that already have that pair on the crew —","startTime":137,"endTime":140.5,"audioSegment":0},{"text":"assembling one is the opt-in.","startTime":140.5,"endTime":144,"audioSegment":0},{"text":"Turn it off per project with Fix problems overnight in the project's settings.","startTime":144,"endTime":147.5,"audioSegment":0},{"text":"There's a limit of 40 issues per project per night,","startTime":147.5,"endTime":151,"audioSegment":0},{"text":"deliberately: above that the developer spends the window triaging and you wake up to a queue nobody will get through.","startTime":151,"endTime":154.5,"audioSegment":0},{"text":"The whole thing runs on a model on your own machine if that's what you use —","startTime":154.5,"endTime":158,"audioSegment":0},{"text":"no network, nobody's cloud.","startTime":158,"endTime":161.5,"audioSegment":0},{"text":"More in The night shift.","startTime":161.5,"endTime":165,"audioSegment":0},{"text":"When a task pauses to ask for help — it ran out of attempts on a step, or kept failing the same check —","startTime":165,"endTime":169.58333333333334,"audioSegment":0},{"text":"getting it moving again meant flipping its status back to active by hand.","startTime":169.58333333333334,"endTime":174.16666666666666,"audioSegment":0},{"text":"That usually did nothing.","startTime":174.16666666666666,"endTime":178.75,"audioSegment":0},{"text":"The counters that stopped it were still spent,","startTime":178.75,"endTime":183.33333333333334,"audioSegment":0},{"text":"so the scheduler would look at it on the next pass and pause it right back.","startTime":183.33333333333334,"endTime":187.91666666666666,"audioSegment":0},{"text":"The needs-input card now has Try again, and it does the three things that were actually required: clears the counters that tripped the pause,","startTime":187.91666666666666,"endTime":192.5,"audioSegment":0},{"text":"sets the task working again, and gets the assignee started immediately instead of waiting out a stall window.","startTime":192.5,"endTime":197.08333333333331,"audioSegment":0},{"text":"It continues the same conversation, so the gezel can see its own failed attempts,","startTime":197.08333333333331,"endTime":201.66666666666666,"audioSegment":0},{"text":"and it's pointed at the note explaining why it stopped — a retry that repeats the attempt word for word is a wasted turn.","startTime":201.66666666666666,"endTime":206.25,"audioSegment":0},{"text":"It doesn't try to judge whether retrying can work.","startTime":206.25,"endTime":210.83333333333331,"audioSegment":0},{"text":"If the fix was an edit you made between the pause and the click,","startTime":210.83333333333331,"endTime":215.41666666666666,"audioSegment":0},{"text":"refusing the button would just hide it from the person who already fixed the problem.","startTime":215.41666666666666,"endTime":220,"audioSegment":0},{"text":"A craftbook is a saved recipe for a piece of work.","startTime":220,"endTime":223.875,"audioSegment":0},{"text":"There are close to 300 of them, and browsing was organized by where a recipe fits in a project's life —","startTime":223.875,"endTime":227.75,"audioSegment":0},{"text":"starters, maintenance, general.","startTime":227.75,"endTime":231.625,"audioSegment":0},{"text":"On a code project that collapsed into two enormous piles,","startTime":231.625,"endTime":235.5,"audioSegment":0},{"text":"the larger of which was called \"General work\" and was mostly recipes about writing, media, and household admin.","startTime":235.5,"endTime":239.375,"audioSegment":0},{"text":"The browse rail in the new-task dialog now shelves them by what the work is about,","startTime":239.375,"endTime":243.25,"audioSegment":0},{"text":"split into recipes for working on software and everything else.","startTime":243.25,"endTime":247.125,"audioSegment":0},{"text":"\"Recommended\" still sits on top and still knows what kind of project you're in.","startTime":247.125,"endTime":251,"audioSegment":0},{"text":"An AI App packages a project type, a crew, craftbooks,","startTime":251,"endTime":253.89285714285714,"audioSegment":0},{"text":"scripts, and pages into one reusable thing.","startTime":253.89285714285714,"endTime":256.7857142857143,"audioSegment":0},{"text":"Last release it got a written guide.","startTime":256.7857142857143,"endTime":259.67857142857144,"audioSegment":0},{"text":"This release it gets the full loop from the command line:","startTime":259.67857142857144,"endTime":262.57142857142856,"audioSegment":0},{"text":"gezel app new my-app        scaffold a source folder","startTime":262.57142857142856,"endTime":265.4642857142857,"audioSegment":0},{"text":"gezel app validate my-app   check it","startTime":265.4642857142857,"endTime":268.35714285714283,"audioSegment":0},{"text":"gezel app pack my-app       produce my-app-1.0.0.gezapp","startTime":268.35714285714283,"endTime":271.25,"audioSegment":0},{"text":"gezel app add <file> --yes  review and install one","startTime":271.25,"endTime":274.14285714285717,"audioSegment":0},{"text":"gezel app apply my-app      outfit the current folder with it","startTime":274.14285714285717,"endTime":277.0357142857143,"audioSegment":0},{"text":"gezel app serve my-app      share its pages as a mini-site","startTime":277.0357142857143,"endTime":279.92857142857144,"audioSegment":0},{"text":"serve is the new one worth knowing about.","startTime":279.92857142857144,"endTime":282.82142857142856,"audioSegment":0},{"text":"It turns an applied app into a small website — the app's pages,","startTime":282.82142857142856,"endTime":285.7142857142857,"audioSegment":0},{"text":"working the way they do in the Output pane — and prints a share link.","startTime":285.7142857142857,"endTime":288.60714285714283,"audioSegment":0},{"text":"Add --chat and visitors get their own conversation with the project's lead gezel.","startTime":288.60714285714283,"endTime":291.5,"audioSegment":0},{"text":"The site lives on your machine; putting it in front of anyone else means running a tunnel yourself,","startTime":291.5,"endTime":294.3928571428571,"audioSegment":0},{"text":"and the printed output tells you how.","startTime":294.3928571428571,"endTime":297.2857142857143,"audioSegment":0},{"text":"Visitors are not you.","startTime":297.2857142857143,"endTime":300.17857142857144,"audioSegment":0},{"text":"The share link mints a browser session that means nothing to the rest of gezel: no access to your projects,","startTime":300.17857142857144,"endTime":303.07142857142856,"audioSegment":0},{"text":"your files, or any other part of the daemon.","startTime":303.07142857142856,"endTime":305.9642857142857,"audioSegment":0},{"text":"Visitor chat has no tools at all, is rate-limited,","startTime":305.9642857142857,"endTime":308.85714285714283,"audioSegment":0},{"text":"and never feeds your gezel's memory.","startTime":308.85714285714283,"endTime":311.75,"audioSegment":0},{"text":"Pages can read and invoke only what the app's manifest declared.","startTime":311.75,"endTime":314.6428571428571,"audioSegment":0},{"text":"Sites are temporary —","startTime":314.6428571428571,"endTime":317.5357142857143,"audioSegment":0},{"text":"they end when you stop them or when the daemon restarts.","startTime":317.5357142857143,"endTime":320.42857142857144,"audioSegment":0},{"text":"All of this is command line only for now;","startTime":320.42857142857144,"endTime":323.32142857142856,"audioSegment":0},{"text":"there's no button in the app.","startTime":323.32142857142856,"endTime":326.2142857142857,"audioSegment":0},{"text":"Three worked example apps ship in the repo,","startTime":326.2142857142857,"endTime":329.1071428571429,"audioSegment":0},{"text":"and the details are in Building AI Apps inside Gezel and the CLI reference.","startTime":329.1071428571429,"endTime":332,"audioSegment":0},{"text":"Eleven more local models have measured scores — several Gemma 4 and Qwen 3.5 builds,","startTime":332,"endTime":335.5,"audioSegment":0},{"text":"Mistral 7B, and others — so the scoreboard covers more of what you might actually download.","startTime":335.5,"endTime":339,"audioSegment":0},{"text":"The fitness column reached the DwarfStar engine,","startTime":339,"endTime":342.5,"audioSegment":0},{"text":"which is where it matters most: those are the models where \"it loads\" and \"you can work with it\" are furthest apart.","startTime":342.5,"endTime":346,"audioSegment":0},{"text":"Each row now shows the measured reading speed alongside the badge,","startTime":346,"endTime":349.5,"audioSegment":0},{"text":"because on a large model the wait you feel is the prompt being read, not the reply being written.","startTime":349.5,"endTime":353,"audioSegment":0},{"text":"Models kept only for compatibility are marked as such,","startTime":353,"endTime":356.5,"audioSegment":0},{"text":"so they stop looking like a reasonable thing to download.","startTime":356.5,"endTime":360,"audioSegment":0},{"text":"Model sizes read more honestly.","startTime":360,"endTime":363.5,"audioSegment":0},{"text":"Bit-depth labels are approximate on purpose (~4, ~8) and now fall back to what the model file says about itself when the catalog text names no depth at all,","startTime":363.5,"endTime":367,"audioSegment":0},{"text":"and the memory figure beside the download size accounts for what the context window costs on your device.","startTime":367,"endTime":370.5,"audioSegment":0},{"text":"Your laptop stops cooking itself.","startTime":370.5,"endTime":374,"audioSegment":0},{"text":"When background summarizing kept timing out, it retried within milliseconds, forever —","startTime":374,"endTime":377.5,"audioSegment":0},{"text":"one captured morning spent four hours waking a large model on a closed-lid MacBook, overheating it, and timing out the call the heat had caused.","startTime":377.5,"endTime":381,"audioSegment":0},{"text":"A streak of timeouts now backs off for a while, measured on time the machine was actually awake,","startTime":381,"endTime":384.5,"audioSegment":0},{"text":"so sleeping through the cooldown doesn't count as recovering from it.","startTime":384.5,"endTime":388,"audioSegment":0},{"text":"Questions from Claude are real question cards.","startTime":388,"endTime":391.5,"audioSegment":0},{"text":"If you run Claude as your provider,","startTime":391.5,"endTime":395,"audioSegment":0},{"text":"its clarifying questions used to arrive as a generic Allow/Deny box.","startTime":395,"endTime":398.5,"audioSegment":0},{"text":"They now render as the question they are,","startTime":398.5,"endTime":402,"audioSegment":0},{"text":"with the options laid out.","startTime":402,"endTime":405.5,"audioSegment":0},{"text":"Rate-limit messages say something useful.","startTime":405.5,"endTime":409,"audioSegment":0},{"text":"\"Claude subscription rate limit (seven-day): allowed_warning.","startTime":409,"endTime":412.5,"audioSegment":0},{"text":"Resets 5:00:00 PM.\" is now stated in plain words with the reset given relative to now —","startTime":412.5,"endTime":416,"audioSegment":0},{"text":"a seven-day window resets on a future weekday, and a bare clock time was wrong by days.","startTime":416,"endTime":419.5,"audioSegment":0},{"text":"It also stops repeating on every reply.","startTime":419.5,"endTime":423,"audioSegment":0},{"text":"The Artificial Intelligence settings header shows which engine and model a new chat gets.","startTime":423,"endTime":426.5,"audioSegment":0},{"text":"Answering that used to mean opening the tab and reading two controls.","startTime":426.5,"endTime":430,"audioSegment":0},{"text":"Scripts have a shared library.","startTime":430,"endTime":433.5,"audioSegment":0},{"text":"The Scripts view's source picker now has one,","startTime":433.5,"endTime":437,"audioSegment":0},{"text":"for scripts every project can run.","startTime":437,"endTime":440.5,"audioSegment":0},{"text":"Git status says when it gave up.","startTime":440.5,"endTime":444,"audioSegment":0},{"text":"Repeated failures now read as \"Skipped after repeated failures\" rather than looking like nothing happened.","startTime":444,"endTime":447.5,"audioSegment":0},{"text":"Craftbooks that depend on an up-to-date index can now ensure one before they start,","startTime":447.5,"endTime":451,"audioSegment":0},{"text":"and say honestly in their report what could not be brought current.","startTime":451,"endTime":454.5,"audioSegment":0},{"text":"Catalog content moved to @bendyline/gilde 0.1.41.","startTime":454.5,"endTime":458,"audioSegment":0},{"text":"Change proposals have an HTTP surface: /api/projects/:id/diffpacks for the lifecycle,","startTime":458,"endTime":461.3333333333333,"audioSegment":0},{"text":"plus a zip export carrying the per-file diffs, notes, manifest, and an APPLY.md.","startTime":461.3333333333333,"endTime":464.6666666666667,"audioSegment":0},{"text":"The draft tree and sealed diffs are write-denied through the artifact store,","startTime":464.6666666666667,"endTime":468,"audioSegment":0},{"text":"so a model cannot forge a diff it never drafted.","startTime":468,"endTime":471.3333333333333,"audioSegment":0},{"text":"gezel app gained an authoring track — new, validate,","startTime":471.3333333333333,"endTime":474.6666666666667,"audioSegment":0},{"text":"pack, and schemas run locally without the daemon.","startTime":474.6666666666667,"endTime":478,"audioSegment":0},{"text":"gezel app serve's control surface is /api/app-serve, documented in the repo's docs/app-serve.md.","startTime":478,"endTime":481.3333333333333,"audioSegment":0},{"text":"Task retry is POST /api/projects/:id/tasks/:num/retry, exposed as retryTask on the typed client.","startTime":481.3333333333333,"endTime":484.6666666666667,"audioSegment":0},{"text":"It reports whether a turn was actually dispatched and why not.","startTime":484.6666666666667,"endTime":488,"audioSegment":0},{"text":"Keyed locking moved into core and replaced ad-hoc mutex patterns across a dozen modules;","startTime":488,"endTime":491.3333333333333,"audioSegment":0},{"text":"long-running deadlines that can outlive a laptop nap now budget in awake time rather than wall clock.","startTime":491.3333333333333,"endTime":494.6666666666667,"audioSegment":0},{"text":"The script RPC channel handles backpressure.","startTime":494.6666666666667,"endTime":498,"audioSegment":0},{"text":"A large request over the inherited descriptor could short-write and raise EAGAIN while the parent drained the first chunk;","startTime":498,"endTime":501.3333333333333,"audioSegment":0},{"text":"writes now retry against a bounded synchronous pause instead of hanging until the runner's timeout.","startTime":501.3333333333333,"endTime":504.6666666666667,"audioSegment":0},{"text":"New craftbook gate checks for codebase-review reports, corpus coverage provenance,","startTime":504.6666666666667,"endTime":508,"audioSegment":0},{"text":"and workspace existence, plus stdlib scripts to drive them.","startTime":508,"endTime":511.3333333333333,"audioSegment":0},{"text":"Two new repo guards: one on layering direction,","startTime":511.3333333333333,"endTime":514.6666666666666,"audioSegment":0},{"text":"one on the resolved default provider.","startTime":514.6666666666666,"endTime":518,"audioSegment":0},{"text":"Two places are worth a visit.","startTime":518,"endTime":521.6,"audioSegment":0},{"text":"If you have a project with a Librarian and a developer on the crew,","startTime":521.6,"endTime":525.2,"audioSegment":0},{"text":"look at Fix problems overnight in that project's settings and decide whether you want it; it's on by default.","startTime":525.2,"endTime":528.8,"audioSegment":0},{"text":"And if you run local models,","startTime":528.8,"endTime":532.4,"audioSegment":0},{"text":"the model tables have more measured numbers on them than they did three days ago.","startTime":532.4,"endTime":536,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26237 — 25 August 2026","subtitle":"This release is about work you get to look at before it lands.","ambientMotion":"zoomIn"}}</script>
