},"end":{"line":5,"column":51,"offset":549}}}],"position":{"start":{"line":5,"column":37,"offset":535},"end":{"line":5,"column":53,"offset":551}}},{"type":"text","value":", attach a photo, and say what to change.","position":{"start":{"line":5,"column":53,"offset":551},"end":{"line":5,"column":94,"offset":592}}}],"position":{"start":{"line":5,"column":1,"offset":499},"end":{"line":5,"column":94,"offset":592}}}],"children":[{"id":"change-a-picture-you-already-have","startTime":32,"duration":62,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Change a picture you already have","position":{"start":{"line":7,"column":4,"offset":597},"end":{"line":7,"column":37,"offset":630}}}],"position":{"start":{"line":7,"column":1,"offset":594},"end":{"line":7,"column":37,"offset":630}}},"title":"Change a picture you already have","contents":[{"type":"paragraph","children":[{"type":"text","value":"Asking for a picture used to mean starting from words, every time. The catalog now has an ","position":{"start":{"line":9,"column":1,"offset":632},"end":{"line":9,"column":91,"offset":722}}},{"type":"strong","children":[{"type":"text","value":"Image editor","position":{"start":{"line":9,"column":93,"offset":724},"end":{"line":9,"column":105,"offset":736}}}],"position":{"start":{"line":9,"column":91,"offset":722},"end":{"line":9,"column":107,"offset":738}}},{"type":"text","value":", a gezel that changes a picture you give it. Attach a picture and say what to change, such as \"remove the background\" or \"turn it into a watercolor.\" Your message goes straight to an image model that edits, with no chatbot in between, and each follow-up keeps editing the last result. A message without a picture gets a short reply asking for one, not a new picture drawn from your words.","position":{"start":{"line":9,"column":107,"offset":738},"end":{"line":9,"column":496,"offset":1127}}}],"position":{"start":{"line":9,"column":1,"offset end":{"line":17,"column":451,"offset":2267}}},{"type":"text","value":" picker. Choose ","position":{"start":{"line":17,"column":451,"offset":2267},"end":{"line":17,"column":467,"offset":2283}}},{"type":"strong","children":[{"type":"text","value":"No style","position":{"start":{"line":17,"column":469,"offset":2285},"end":{"line":17,"column":477,"offset":2293}}}],"position":{"start":{"line":17,"column":467,"offset":2283},"end":{"line":17,"column":479,"offset":2295}}},{"type":"text","value":" to go back to plain pictures.","position":{"start":{"line":17,"column":479,"offset":2295},"end":{"line":17,"column":509,"offset":2325}}}],"position":{"start":{"line":17,"column":1,"offset":1817},"end":{"line":17,"column":509,"offset":2325}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Fast mode","position":{"start":{"line":19,"column":3,"offset":2329},"end":{"line":19,"column":12,"offset":2338}}}],"position":{"start":{"line":19,"column":1,"offset":2327},"end":{"line":19,"column":14,"offset":2340}}},{"type":"text","value":" draws a picture in a few steps instead of dozens: 4 instead of 8 for Krea 2 Turbo, about 1.6 times faster, and 4 instead of 50 for MOSS-Image. Once installed, fast mode is on for its model. To turn it off for one model, use the ","position":{"start":{"line":19,"column":14,"offset":2340},"end":{"line":19,"column":243,"offset":2569}}},{"type":"strong","children":[{"type":"text","value":"Fast mode","position":{"start":{"line":19,"column":245,"offset":2571},"end":{"line":19,"column":254,"offset":2580}}}],"position":{"start":{"line":19,"column":243,"offset":2569},"end":{"line":19,"column":256,"offset":2582}}},{"type":"text","value":" switch in that model's row of the ","position":{"start":{"line":19,"column":256,"offset":2582},"end":{"line":19,"column":291,"offset":2617}}},{"type":"strong","children":[{"type":"text","value":"Local models","position":{"start":{"line":19,"column":293,"offset":2619},"end":{"line":19,"column":305,"offset":2631}}}],"position":{"start":{"line":19,"column":291,"offset":2617},"end":{"line":19,"column":307,"offset":2633}}},{"type":"text","value":" table.","position":{"start":{"line":19,"column":307,"offset":2633},"end":{"line":19,"column":314,"offset":2640}}}],"position":{"start":{"line":19,"column":1,"offset":2327},"end":{"line":19,"column":314,"offset":2640}}}]},{"id":"measure-a-model-on-your-own-computer","startTime":139,"duration":125,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Measure a model on your own computer","position":{"start":{"line":21,"column":4,"offset":2645},"end":{"line":21,"column":40,"offset":2681}}}],"position":{"start":{"line":21,"column":1,"offset":2642},"end":{"line":21,"column":40,"offset":2681}}},"title":"Measure a model on your own computer","contents":[{"type":"paragraph","children":[{"type":"text","value":"The published scorecard tells you how a model did on our computers. Now you can run the same tests on yours. In the terminal, ","position":{"start":{"line":23,"column":1,"offset":2683},"end":{"line":23,"column":127,"offset":2809}}},{"type":"inlineCode","value":"gezel bench","position":{"start":{"line":23,"column":127,"offset":2809},"end":{"line":23,"column":140,"offset":2822}}},{"type":"text","value":" runs the scorecard's core set on the model your chats use, and ","position":{"start":{"line":23,"column":140,"offset":2822},"end":{"line":23,"column":204,"offset":2886}}},{"type":"inlineCode","value":"gezel bench --suite all","position":{"start":{"line":23,"column":204,"offset":2886},"end":{"line":23,"column":229,"offset":2911}}},{"type":"text","value":" runs all four sets. ","position":{"start":{"line":23,"column":229,"offset":2911},"end":{"line":23,"column":250,"offset":2932}}},{"type":"strong","children":[{"type":"text","value":"Settings → Benchmarks","position":{"start":{"line":23,"column":252,"offset":2934},"end":{"line":23,"column":273,"offset":2955}}}],"position":{"start":{"line":23,"column":250,"offset":2932},"end":{"line":23,"column":275,"offset":2957}}},{"type":"text","value":" runs the same tests and is now there for everyone, where before it appeared only in debug mode. Both start by naming what they measure on: the hardware, the engine build and the gezel version. A job tried fewer than three times shows as a count, never a percentage, just as on the scorecard. In the terminal, a run that could take more than an hour asks before it starts.","position":{"start":{"line":23,"column":275,"offset":2957},"end":{"line":23,"column":647,"offset":3329}}}],"position":{"start":{"line":23,"column":1,"offset":2683},"end":{"line":23,"column":647,"offset":3329}}},{"type":"paragraph","children":[{"type":"text","value":"To share a result, ","position":{"start":{"line":25,"column":1,"offset":3331},"end":{"line":25,"column":20,"offset":3350}}},{"type":"inlineCode","value":"gezel bench submit <file>","position":{"start":{"line":25,"column":20,"offset":3350},"end":{"line":25,"column":47,"offset":3377}}},{"type":"text","value":" sends it to us as a GitHub issue. Results we accept appear on the ","position":{"start":{"line":25,"column":47,"offset":3377},"end":{"line":25,"column":114,"offset":3444}}},{"type":"link","url":"../../model-scorecard/","children":[{"type":"text","value":"model scorecard","position":{"start":{"line":25,"column":115,"offset":3445},"end":{"line":25,"column":130,"offset":3460}}}],"position":{"start":{"line":25,"column":114,"offset":3444},"end":{"line":25,"column":155,"offset":3485}}},{"type":"text","value":" under ","position":{"start":{"line":25,"column":155,"offset":3485},"end":{"line":25,"column":162,"offset":3492}}},{"type":"strong","children":[{"type":"text","value":"Community rounds","position":{"start":{"line":25,"column":164,"offset":3494},"end":{"line":25,"column":180,"offset":3510}}}],"position":{"start":{"line":25,"column":162,"offset":3492},"end":{"line":25,"column":182,"offset":3512}}},{"type":"text","value":". They stay apart from our own rounds, because we did not control the hardware.","position":{"start":{"line":25,"column":182,"offset":3512},"end":{"line":25,"column":261,"offset":3591}}}],"position":{"start":{"line":25,"column":1,"offset":3331},"end":{"line":25,"column":261,"offset":3591}}},{"type":"paragraph","children":[{"type":"text","value":"The scorecard itself has six new rounds. Three compare Qwen 3.8 27B with Gemma 4 12B on a different machine each: an NVIDIA DGX Spark on Linux, a Windows computer with an AMD Radeon R9700, and a Windows laptop with NVIDIA's RTX Spark N1X. On the DGX Spark, Qwen passed 106 of 129 attempts and Gemma 90. The fourth round runs Gemma 4 12B through every task set on a Windows laptop with an RTX 5070 Ti. The last two compare the two engines on an Apple M5 Max, MLX and llama.cpp, with Qwen 3.8 27B and Gemma 4 12B on each. In the larger one, 516 attempts across all four task sets, both models did better on llama.cpp: Qwen passed 104 of 129 there against 92 of 128 on MLX, and Gemma 86 of 128 against 67 of 129. A shorter follow-up after fixes ran 18 jobs per model on each engine, and both models passed 16 on MLX and all 18 on llama.cpp. A new table, ","position":{"start":{"line":27,"column":1,"offset":3593},"end":{"line":27,"column":852,"offset":4444}}},{"type":"strong","children":[{"type":"text","value":"Every result in one table","position":{"start":{"line":27,"column":854,"offset":4446},"end":{"line":27,"column":879,"offset":4471}}}],"position":{"start":{"line":27,"column":852,"offset":4444},"end":{"line":27,"column":881,"offset":4473}}},{"type":"text","value":", lines up every round side by side, and you can download all of it as one spreadsheet. ","position":{"start":{"line":27,"column":881,"offset":4473},"end":{"line":27,"column":969,"offset":4561}}},{"type":"link","url":"../../how-we-test-models/","children":[{"type":"text","value":"How we test models","position":{"start":{"line":27,"column":970,"offset":4562}," set":16684},"end":{"line":115,"column":277,"offset":16696}}}],"position":{"start":{"line":115,"column":263,"offset":16682},"end":{"line":115,"column":279,"offset":16698}}},{"type":"text","value":". And if you want to know how well your own computer does with the model you use, open ","position":{"start":{"line":115,"column":279,"offset":16698},"end":{"line":115,"column":366,"offset":16785}}},{"type":"strong","children":[{"type":"text","value":"Settings → Benchmarks","position":{"start":{"line":115,"column":368,"offset":16787},"end":{"line":115,"column":389,"offset":16808}}}],"position":{"start":{"line":115,"column":366,"offset":16785},"end":{"line":115,"column":391,"offset":16810}}},{"type":"text","value":" or run ","position":{"start":{"line":115,"column":391,"offset":16810},"end":{"line":115,"column":399,"offset":16818}}},{"type":"inlineCode","value":"gezel bench","position":{"start":{"line":115,"column":399,"offset":16818},"end":{"line":115,"column":412,"offset":16831}}},{"type":"text","value":". If you run a small business, open ","position":{"start":{"line":115,"column":412,"offset":16831},"end":{"line":115,"column":448,"offset":16867}}},{"type":"strong","children":[{"type":"text","value":"New Project","position":{"start":{"line":115,"column":450,"offset":16869},"end":{"line":115,"column":461,"offset":16880}}}],"position":{"start":{"line":115,"column":448,"offset":16867},"end":{"line":115,"column":463,"offset":16882}}},{"type":"text","value":" and look through the new project types. To run gezel on a server instead, start with ","position":{"start":{"line":115,"column":463,"offset":16882},"end":{"line":115,"column":549,"offset":16968}}},{"type":"link","url":"../../gezel-in-docker/","children":[{"type":"text","value":"Gezel in Docker","position":{"start":{"line":115,"column":550,"offset":16969},"end":{"line":115,"column":565,"offset":16984}}}],"position":{"start":{"line":115,"column":549,"offset":16968},"end":{"line":115,"column":590,"offset":17009}}},{"type":"text","value":".","position":{"start":{"line":115,"column":590,"offset":17009},"end":{"line":115,"column":591,"offset":17010}}}],"position":{"start":{"line":115,"column":1,"offset":16420},"end":{"line":115,"column":591,"offset":17010}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Until now,","startTime":0,"endTime":3.2,"audioSegment":0},{"text":"gezel could draw a new picture but could not change one you already had.","startTime":3.2,"endTime":6.4,"audioSegment":0},{"text":"Now it can, and any picture can have a style.","startTime":6.4,"endTime":9.600000000000001,"audioSegment":0},{"text":"You can also measure how well a model does real work on your own computer,","startTime":9.600000000000001,"endTime":12.8,"audioSegment":0},{"text":"with the same tests we use for the published scorecard.","startTime":12.8,"endTime":16,"audioSegment":0},{"text":"New Project has nineteen ready-made projects for running a small business.","startTime":16,"endTime":19.200000000000003,"audioSegment":0},{"text":"And gezel now comes as a Docker image too,","startTime":19.200000000000003,"endTime":22.400000000000002,"audioSegment":0},{"text":"so a server or a computer without a screen can run all of it, reached from a browser.","startTime":22.400000000000002,"endTime":25.6,"audioSegment":0},{"text":"If you read only one thing: add the Image editor,","startTime":25.6,"endTime":28.8,"audioSegment":0},{"text":"attach a photo, and say what to change.","startTime":28.8,"endTime":32,"audioSegment":0},{"text":"Asking for a picture used to mean starting from words, every time.","startTime":32,"endTime":35.44444444444444,"audioSegment":0},{"text":"The catalog now has an Image editor,","startTime":35.44444444444444,"endTime":38.888888888888886,"audioSegment":0},{"text":"a gezel that changes a picture you give it.","startTime":38.888888888888886,"endTime":42.333333333333336,"audioSegment":0},{"text":"Attach a picture and say what to change, such as \"remove the background\" or \"turn it into a watercolor.\" Your message goes straight to an image model that edits,","startTime":42.333333333333336,"endTime":45.77777777777778,"audioSegment":0},{"text":"with no chatbot in between, and each follow-up keeps editing the last result.","startTime":45.77777777777778,"endTime":49.22222222222222,"audioSegment":0},{"text":"A message without a picture gets a short reply asking for one,","startTime":49.22222222222222,"endTime":52.66666666666667,"audioSegment":0},{"text":"not a new picture drawn from your words.","startTime":52.66666666666667,"endTime":56.111111111111114,"audioSegment":0},{"text":"The catalog also adds a model made for this: Qwen Image Edit 2511.","startTime":56.111111111111114,"endTime":59.55555555555556,"audioSegment":0},{"text":"It changes what you ask for and keeps the rest.","startTime":59.55555555555556,"endTime":63,"audioSegment":0},{"text":"It holds faces steady across several edits, rewrites the text inside a picture,","startTime":63,"endTime":66.44444444444444,"audioSegment":0},{"text":"and can combine up to three pictures into one.","startTime":66.44444444444444,"endTime":69.88888888888889,"audioSegment":0},{"text":"It is about 19.5 GB to download,","startTime":69.88888888888889,"endTime":73.33333333333334,"audioSegment":0},{"text":"and it is slow: one edit takes several minutes.","startTime":73.33333333333334,"endTime":76.77777777777777,"audioSegment":0},{"text":"Its fast mode, below, cuts an edit from 20 steps to 4.","startTime":76.77777777777777,"endTime":80.22222222222223,"audioSegment":0},{"text":"Gezel now also keeps track of which of your image models can edit.","startTime":80.22222222222223,"endTime":83.66666666666667,"audioSegment":0},{"text":"A request that comes with a picture goes to one that can,","startTime":83.66666666666667,"endTime":87.11111111111111,"audioSegment":0},{"text":"and a model made only for editing is never used to draw from words alone.","startTime":87.11111111111111,"endTime":90.55555555555556,"audioSegment":0},{"text":"More in Image generator.","startTime":90.55555555555556,"endTime":94,"audioSegment":0},{"text":"Settings → Image generation has a new list: Styles and fast mode.","startTime":94,"endTime":97.46153846153847,"audioSegment":0},{"text":"A style gives every picture the same look.","startTime":97.46153846153847,"endTime":100.92307692307692,"audioSegment":0},{"text":"The first ones are pixel art, soft watercolor, ink wash, gouache, paper cut,","startTime":100.92307692307692,"endTime":104.38461538461539,"audioSegment":0},{"text":"coloring-book line art, a clean 3D render, an isometric 3D object and a child's drawing.","startTime":104.38461538461539,"endTime":107.84615384615384,"audioSegment":0},{"text":"Each works with particular models, and the list says which.","startTime":107.84615384615384,"endTime":111.3076923076923,"audioSegment":0},{"text":"Once one is installed for the model you use,","startTime":111.3076923076923,"endTime":114.76923076923077,"audioSegment":0},{"text":"the strip above the image gezel's message box gets a Style picker.","startTime":114.76923076923077,"endTime":118.23076923076923,"audioSegment":0},{"text":"Choose No style to go back to plain pictures.","startTime":118.23076923076923,"endTime":121.6923076923077,"audioSegment":0},{"text":"Fast mode draws a picture in a few steps instead of dozens: 4 instead of 8 for Krea 2 Turbo,","startTime":121.6923076923077,"endTime":125.15384615384616,"audioSegment":0},{"text":"about 1.6 times faster, and 4 instead of 50 for MOSS-Image.","startTime":125.15384615384616,"endTime":128.6153846153846,"audioSegment":0},{"text":"Once installed, fast mode is on for its model.","startTime":128.6153846153846,"endTime":132.0769230769231,"audioSegment":0},{"text":"To turn it off for one model,","startTime":132.0769230769231,"endTime":135.53846153846155,"audioSegment":0},{"text":"use the Fast mode switch in that model's row of the Local models table.","startTime":135.53846153846155,"endTime":139,"audioSegment":0},{"text":"The published scorecard tells you how a model did on our computers.","startTime":139,"endTime":142.47222222222223,"audioSegment":0},{"text":"Now you can run the same tests on yours.","startTime":142.47222222222223,"endTime":145.94444444444446,"audioSegment":0},{"text":"In the terminal, gezel bench runs the scorecard's core set on the model your chats use,","startTime":145.94444444444446,"endTime":149.41666666666666,"audioSegment":0},{"text":"and gezel bench --suite all runs all four sets.","startTime":149.41666666666666,"endTime":152.88888888888889,"audioSegment":0},{"text":"Settings → Benchmarks runs the same tests and is now there for everyone,","startTime":152.88888888888889,"endTime":156.36111111111111,"audioSegment":0},{"text":"where before it appeared only in debug mode.","startTime":156.36111111111111,"endTime":159.83333333333334,"audioSegment":0},{"text":"Both start by naming what they measure on: the hardware,","startTime":159.83333333333334,"endTime":163.30555555555554,"audioSegment":0},{"text":"the engine build and the gezel version.","startTime":163.30555555555554,"endTime":166.77777777777777,"audioSegment":0},{"text":"A job tried fewer than three times shows as a count,","startTime":166.77777777777777,"endTime":170.25,"audioSegment":0},{"text":"never a percentage, just as on the scorecard.","startTime":170.25,"endTime":173.72222222222223,"audioSegment":0},{"text":"In the terminal,","startTime":173.72222222222223,"endTime":177.19444444444446,"audioSegment":0},{"text":"a run that could take more than an hour asks before it starts.","startTime":177.19444444444446,"endTime":180.66666666666669,"audioSegment":0},{"text":"To share a result,","startTime":180.66666666666669,"endTime":184.13888888888889,"audioSegment":0},{"text":"gezel bench submit <file> sends it to us as a GitHub issue.","startTime":184.13888888888889,"endTime":187.61111111111111,"audioSegment":0},{"text":"Results we accept appear on the model scorecard under Community rounds.","startTime":187.61111111111111,"endTime":191.08333333333334,"audioSegment":0},{"text":"They stay apart from our own rounds,","startTime":191.08333333333334,"endTime":194.55555555555554,"audioSegment":0},{"text":"because we did not control the hardware.","startTime":194.55555555555554,"endTime":198.02777777777777,"audioSegment":0},{"text":"The scorecard itself has six new rounds.","startTime":198.02777777777777,"endTime":201.5,"audioSegment":0},{"text":"Three compare Qwen 3.8 27B with Gemma 4 12B on a different machine each: an NVIDIA DGX Spark on Linux,","startTime":201.5,"endTime":204.97222222222223,"audioSegment":0},{"text":"a Windows computer with an AMD Radeon R9700, and a Windows laptop with NVIDIA's RTX Spark N1X.","startTime":204.97222222222223,"endTime":208.44444444444446,"audioSegment":0},{"text":"On the DGX Spark,","startTime":208.44444444444446,"endTime":211.91666666666669,"audioSegment":0},{"text":"Qwen passed 106 of 129 attempts and Gemma 90.","startTime":211.91666666666669,"endTime":215.38888888888889,"audioSegment":0},{"text":"The fourth round runs Gemma 4 12B through every task set on a Windows laptop with an RTX 5070 Ti.","startTime":215.38888888888889,"endTime":218.86111111111111,"audioSegment":0},{"text":"The last two compare the two engines on an Apple M5 Max,","startTime":218.86111111111111,"endTime":222.33333333333334,"audioSegment":0},{"text":"MLX and llama.cpp, with Qwen 3.8 27B and Gemma 4 12B on each.","startTime":222.33333333333334,"endTime":225.80555555555554,"audioSegment":0},{"text":"In the larger one, 516 attempts across all four task sets,","startTime":225.80555555555554,"endTime":229.27777777777777,"audioSegment":0},{"text":"both models did better on llama.cpp: Qwen passed 104 of 129 there against 92 of 128 on MLX, and Gemma 86 of 128 against 67 of 129.","startTime":229.27777777777777,"endTime":232.75,"audioSegment":0},{"text":"A shorter follow-up after fixes ran 18 jobs per model on each engine,","startTime":232.75,"endTime":236.22222222222223,"audioSegment":0},{"text":"and both models passed 16 on MLX and all 18 on llama.cpp.","startTime":236.22222222222223,"endTime":239.69444444444446,"audioSegment":0},{"text":"A new table, Every result in one table, lines up every round side by side,","startTime":239.69444444444446,"endTime":243.16666666666669,"audioSegment":0},{"text":"and you can download all of it as one spreadsheet.","startTime":243.16666666666669,"endTime":246.63888888888889,"audioSegment":0},{"text":"How we test models now lists each test in each set.","startTime":246.63888888888889,"endTime":250.11111111111111,"audioSegment":0},{"text":"gezel doctor now also checks the model it will use.","startTime":250.11111111111111,"endTime":253.58333333333334,"audioSegment":0},{"text":"It says whether the model starts, answers a tool call, writes fast enough and has room for a prompt,","startTime":253.58333333333334,"endTime":257.05555555555554,"audioSegment":0},{"text":"and how often it finished real jobs on the scorecard, with the hardware named.","startTime":257.05555555555554,"endTime":260.52777777777777,"audioSegment":0},{"text":"gezel model list --available shows each model's measured pass rate beside its size.","startTime":260.52777777777777,"endTime":264,"audioSegment":0},{"text":"Starting with this release, gezel also comes as a container image,","startTime":264,"endTime":267.23809523809524,"audioSegment":0},{"text":"for a server or any computer that runs Docker.","startTime":267.23809523809524,"endTime":270.4761904761905,"audioSegment":0},{"text":"One command runs the whole of it,","startTime":270.4761904761905,"endTime":273.7142857142857,"audioSegment":0},{"text":"with every engine for local models already inside.","startTime":273.7142857142857,"endTime":276.95238095238096,"audioSegment":0},{"text":"Besides the models you choose,","startTime":276.95238095238096,"endTime":280.1904761904762,"audioSegment":0},{"text":"it downloads a browser for web pages and the small models it uses for search the first time it needs them.","startTime":280.1904761904762,"endTime":283.42857142857144,"audioSegment":0},{"text":"docker run -d --name gezel -p 127.0.0.1:6230:6230 -v gezel:/gezel ghcr.io/bendyline/gezel","startTime":283.42857142857144,"endTime":286.6666666666667,"audioSegment":0},{"text":"The container's log has a link that creates your account,","startTime":286.6666666666667,"endTime":289.9047619047619,"audioSegment":0},{"text":"and from then on you sign in with a name and password from your browser.","startTime":289.9047619047619,"endTime":293.14285714285717,"audioSegment":0},{"text":"The same container gives your other programs local AI through an OpenAI-style address: make a key with docker exec gezel gezel integrations token create <app>.","startTime":293.14285714285717,"endTime":296.3809523809524,"audioSegment":0},{"text":"It can also run one craftbook on a folder and hand back what it made,","startTime":296.3809523809524,"endTime":299.6190476190476,"audioSegment":0},{"text":"with gezel do … --out <folder>.","startTime":299.6190476190476,"endTime":302.8571428571429,"audioSegment":0},{"text":"There are images for NVIDIA cards (:cuda) and for AMD and Intel cards (:vulkan),","startTime":302.8571428571429,"endTime":306.0952380952381,"audioSegment":0},{"text":"on GitHub's registry and on Docker Hub as bendyline/gezel.","startTime":306.0952380952381,"endTime":309.3333333333333,"audioSegment":0},{"text":"A new image comes out with every release,","startTime":309.3333333333333,"endTime":312.57142857142856,"audioSegment":0},{"text":"tagged with the same version as the gezel command-line tool.","startTime":312.57142857142856,"endTime":315.8095238095238,"audioSegment":0},{"text":"Craftbook steps that run small scripts with no network access run inside the container too,","startTime":315.8095238095238,"endTime":319.04761904761904,"audioSegment":0},{"text":"in a network sandbox of their own.","startTime":319.04761904761904,"endTime":322.2857142857143,"audioSegment":0},{"text":"Everyone you add in Settings → Accounts can do everything you can,","startTime":322.2857142857143,"endTime":325.5238095238095,"audioSegment":0},{"text":"so add only people you trust.","startTime":325.5238095238095,"endTime":328.76190476190476,"audioSegment":0},{"text":"More in Gezel in Docker.","startTime":328.76190476190476,"endTime":332,"audioSegment":0},{"text":"New Project has nineteen new project types for the everyday work of a small business.","startTime":332,"endTime":337.3076923076923,"audioSegment":0},{"text":"Each comes with its own crew and a page that keeps the work in view.","startTime":337.3076923076923,"endTime":342.61538461538464,"audioSegment":0},{"text":"For money: Books & Month Close, which books every receipt into a categorized ledger and works through a month-close checklist with you,","startTime":342.61538461538464,"endTime":347.9230769230769,"audioSegment":0},{"text":"Cash Flow Planner, which keeps a 13-week forecast from the invoices and bills you expect, and Grants & Proposals.","startTime":347.9230769230769,"endTime":353.2307692307692,"audioSegment":0},{"text":"For customers: Quotes & Bids, Support Desk, Customer Voice and Client Delivery.","startTime":353.2307692307692,"endTime":358.53846153846155,"audioSegment":0},{"text":"For your team: Hiring Desk, New Hire Onboarding,","startTime":358.53846153846155,"endTime":363.84615384615387,"audioSegment":0},{"text":"Shift Roster, Training Tracker and Team Goals.","startTime":363.84615384615387,"endTime":369.15384615384613,"audioSegment":0},{"text":"And for the rest of the business: Campaign Room, Content Studio, Event Desk,","startTime":369.15384615384613,"endTime":374.46153846153845,"audioSegment":0},{"text":"Inventory & Reorder, Vendor & Contract Desk, Compliance Register and SOP Library.","startTime":374.46153846153845,"endTime":379.7692307692308,"audioSegment":0},{"text":"A twentieth, Sales Pipeline, appears once you turn on Show preview features in Settings → About,","startTime":379.7692307692308,"endTime":385.0769230769231,"audioSegment":0},{"text":"because one of its craftbooks can read your calendar through a connector, and connectors are still a preview.","startTime":385.0769230769231,"endTime":390.38461538461536,"audioSegment":0},{"text":"They bring eleven new crew roles, among them the Bookkeeper, Recruiter, Estimator and Stock Keeper, and six craftbooks for jobs that come back every week or month: a reorder run that turns a stock check into purchase orders,","startTime":390.38461538461536,"endTime":395.6923076923077,"audioSegment":0},{"text":"replies to customer reviews in your own voice, a structured interview kit for a role, a week's shift schedule, a run of show for an event, and an audit evidence pack from the compliance register.","startTime":395.6923076923077,"endTime":401,"audioSegment":0},{"text":"The AI assist in the craftbook editor is for improving a craftbook.","startTime":401,"endTime":404.53333333333336,"audioSegment":0},{"text":"It used to have the full set of tools,","startTime":404.53333333333336,"endTime":408.06666666666666,"audioSegment":0},{"text":"and it sometimes ran the craftbook or moved on to other work instead of editing it.","startTime":408.06666666666666,"endTime":411.6,"audioSegment":0},{"text":"Now it has only the tools for editing craftbooks,","startTime":411.6,"endTime":415.1333333333333,"audioSegment":0},{"text":"looking up other craftbooks and the crew, reading the Handboek, and asking you questions.","startTime":415.1333333333333,"endTime":418.6666666666667,"audioSegment":0},{"text":"Each message to it now starts with the craftbook's current outline and a short checkup.","startTime":418.6666666666667,"endTime":422.2,"audioSegment":0},{"text":"The checkup flags a step with no check that proves its work, a step with no role assigned,","startTime":422.2,"endTime":425.73333333333335,"audioSegment":0},{"text":"an input that asks you to type a file path, and a missing description or trigger phrases.","startTime":425.73333333333335,"endTime":429.26666666666665,"audioSegment":0},{"text":"So suggestions are based on the craftbook as it stands,","startTime":429.26666666666665,"endTime":432.8,"audioSegment":0},{"text":"and the checkup shows when a change has fixed a problem.","startTime":432.8,"endTime":436.3333333333333,"audioSegment":0},{"text":"Overview and AI assist now sit in the same row of tabs as the steps.","startTime":436.3333333333333,"endTime":439.8666666666667,"audioSegment":0},{"text":"When you go back to Chat,","startTime":439.8666666666667,"endTime":443.4,"audioSegment":0},{"text":"it no longer reopens a craftbook conversation.","startTime":443.4,"endTime":446.93333333333334,"audioSegment":0},{"text":"When you edit one of a craftbook's scripts,","startTime":446.93333333333334,"endTime":450.4666666666667,"audioSegment":0},{"text":"Back to craftbook asks first if you have unsaved changes.","startTime":450.4666666666667,"endTime":454,"audioSegment":0},{"text":"None of these need anything from you.","startTime":454,"endTime":457.05882352941177,"audioSegment":0},{"text":"Camera pictures.","startTime":457.05882352941177,"endTime":460.11764705882354,"audioSegment":0},{"text":"The last release noted one exception: asking a cloud gezel or a cloud image engine to make a new image from a camera moment's pictures still sent those pictures.","startTime":460.11764705882354,"endTime":463.1764705882353,"audioSegment":0},{"text":"That gap is closed.","startTime":463.1764705882353,"endTime":466.2352941176471,"audioSegment":0},{"text":"Unless you let cloud AI see a camera's pictures, a cloud image engine is refused,","startTime":466.2352941176471,"endTime":469.29411764705884,"audioSegment":0},{"text":"and the message says to pick an on-device model or change that camera's setting.","startTime":469.29411764705884,"endTime":472.3529411764706,"audioSegment":0},{"text":"More in Cameras and lookouts.","startTime":472.3529411764706,"endTime":475.4117647058824,"audioSegment":0},{"text":"No usage reports from ONNX Runtime.","startTime":475.4117647058824,"endTime":478.47058823529414,"audioSegment":0},{"text":"ONNX Runtime is the library gezel uses for search,","startTime":478.47058823529414,"endTime":481.52941176470586,"audioSegment":0},{"text":"face and photo recognition, and speech.","startTime":481.52941176470586,"endTime":484.5882352941176,"audioSegment":0},{"text":"On a Mac and on Linux it queued usage reports for Microsoft that named the computer model,","startTime":484.5882352941176,"endTime":487.6470588235294,"audioSegment":0},{"text":"the operating system and a device id.","startTime":487.6470588235294,"endTime":490.70588235294116,"audioSegment":0},{"text":"Gezel now switches that off before the library starts.","startTime":490.70588235294116,"endTime":493.7647058823529,"audioSegment":0},{"text":"On Windows it follows your Windows diagnostic-data setting, as before.","startTime":493.7647058823529,"endTime":496.8235294117647,"audioSegment":0},{"text":"Updated components.","startTime":496.8235294117647,"endTime":499.88235294117646,"audioSegment":0},{"text":"The MCP SDK, undici, Hono and nodemailer are on newer versions,","startTime":499.88235294117646,"endTime":502.94117647058823,"audioSegment":0},{"text":"and our release checks now stop a release if any published package has a high or critical security advisory.","startTime":502.94117647058823,"endTime":506,"audioSegment":0},{"text":"What leaves this computer lists every kind of network traffic gezel can make,","startTime":506,"endTime":509.5,"audioSegment":0},{"text":"what it carries, and which security level allows it.","startTime":509.5,"endTime":513,"audioSegment":0},{"text":"Governance explains who writes gezel,","startTime":513,"endTime":516.5,"audioSegment":0},{"text":"how an idea from outside reaches a release, and what keeps working if we stop.","startTime":516.5,"endTime":520,"audioSegment":0},{"text":"Gezel on a server covers running gezel without a screen, on a computer of its own,","startTime":520,"endTime":523.5,"audioSegment":0},{"text":"with the security level and activity mode a server should have.","startTime":523.5,"endTime":527,"audioSegment":0},{"text":"Gezel in Docker covers the container: the workshop in a browser,","startTime":527,"endTime":530.5,"audioSegment":0},{"text":"keys for your other programs, folder jobs, graphics cards, accounts and updates.","startTime":530.5,"endTime":534,"audioSegment":0},{"text":"Windows updates land.","startTime":534,"endTime":537.05,"audioSegment":0},{"text":"Before installing an update, Windows checks its signature,","startTime":537.05,"endTime":540.1,"audioSegment":0},{"text":"and on a 1 GB installer that check could take longer than the 20 seconds it was given.","startTime":540.1,"endTime":543.15,"audioSegment":0},{"text":"The download was then thrown away and fetched again at the next launch,","startTime":543.15,"endTime":546.2,"audioSegment":0},{"text":"so some updates never installed.","startTime":546.2,"endTime":549.25,"audioSegment":0},{"text":"The check now has time to finish.","startTime":549.25,"endTime":552.3,"audioSegment":0},{"text":"A step that needs to run tests says so straight away.","startTime":552.3,"endTime":555.35,"audioSegment":0},{"text":"Some craftbook steps prove their work by running the project's own tests,","startTime":555.35,"endTime":558.4,"audioSegment":0},{"text":"such as npm run test.","startTime":558.4,"endTime":561.45,"audioSegment":0},{"text":"While Run package scripts is off, which it is below Unrestricted,","startTime":561.45,"endTime":564.5,"audioSegment":0},{"text":"no gezel can run them, and such a task used to keep retrying for up to an hour.","startTime":564.5,"endTime":567.55,"audioSegment":0},{"text":"Now it pauses at once and names the switch in Settings → Security & Compliance that would let it go on.","startTime":567.55,"endTime":570.6,"audioSegment":0},{"text":"Clearer pause messages.","startTime":570.6,"endTime":573.65,"audioSegment":0},{"text":"A paused task's card now gives the reason in one plain sentence,","startTime":573.65,"endTime":576.7,"audioSegment":0},{"text":"such as \"The work stopped getting closer to passing its checks,\" instead of quoting the check that failed.","startTime":576.7,"endTime":579.75,"audioSegment":0},{"text":"No false \"started\" message.","startTime":579.75,"endTime":582.8,"audioSegment":0},{"text":"When the Meester starts a craftbook whose first step has no one assigned,","startTime":582.8,"endTime":585.85,"audioSegment":0},{"text":"the task waits for you, and the reply now says so instead of reporting the work as underway.","startTime":585.85,"endTime":588.9,"audioSegment":0},{"text":"The request card reads properly.","startTime":588.9,"endTime":591.95,"audioSegment":0},{"text":"It used to say things like \"Soren is acquiring and verify sources.\" Now it says \"acquiring and verifying sources.\"","startTime":591.95,"endTime":595,"audioSegment":0},{"text":"Pictures for a task.","startTime":595,"endTime":598.05,"audioSegment":0},{"text":"When a task step goes to the image gezel, the picture now matches the brief,","startTime":598.05,"endTime":601.1,"audioSegment":0},{"text":"not the wording of the handoff message.","startTime":601.1,"endTime":604.15,"audioSegment":0},{"text":"Tasks stay in view when Windows locks a file.","startTime":604.15,"endTime":607.2,"audioSegment":0},{"text":"If another program, such as a sync or antivirus program,","startTime":607.2,"endTime":610.25,"audioSegment":0},{"text":"holds a file for a moment, active work no longer drops out of view.","startTime":610.25,"endTime":613.3,"audioSegment":0},{"text":"Project settings are grouped.","startTime":613.3,"endTime":616.35,"audioSegment":0},{"text":"A project's Settings tab sorts its settings into Workspace,","startTime":616.35,"endTime":619.4,"audioSegment":0},{"text":"Access, Toolsets, Preferences and History.","startTime":619.4,"endTime":622.45,"audioSegment":0},{"text":"Files, not References.","startTime":622.45,"endTime":625.5,"audioSegment":0},{"text":"In the chat rail,","startTime":625.5,"endTime":628.55,"audioSegment":0},{"text":"the tab that lists the files a conversation used or made is now called Files.","startTime":628.55,"endTime":631.6,"audioSegment":0},{"text":"One fewer badge in the titlebar.","startTime":631.6,"endTime":634.65,"audioSegment":0},{"text":"Background indexing now shows in Activity with everything else,","startTime":634.65,"endTime":637.7,"audioSegment":0},{"text":"not in a badge of its own.","startTime":637.7,"endTime":640.75,"audioSegment":0},{"text":"DocBlocks is no longer downloaded again for a project when the copy bundled with gezel is as new or newer.","startTime":640.75,"endTime":643.8,"audioSegment":0},{"text":"The setting that turns on early features is now called Show preview features.","startTime":643.8,"endTime":646.85,"audioSegment":0},{"text":"New in the catalog.","startTime":646.85,"endTime":649.9,"audioSegment":0},{"text":"Wikipedia: General Knowledge covers concepts, organizations, awards,","startTime":649.9,"endTime":652.95,"audioSegment":0},{"text":"events and schools that no subject catalog covers, and the Wikipedia subject and people catalogs are refreshed.","startTime":652.95,"endTime":656,"audioSegment":0},{"text":"gezel bench runs the scorecard's tests on this computer.","startTime":656,"endTime":659.0526315789474,"audioSegment":0},{"text":"gezel bench list shows every set and how long it can take,","startTime":659.0526315789474,"endTime":662.1052631578947,"audioSegment":0},{"text":"gezel bench results shows finished runs, and gezel bench submit <file> shares one.","startTime":662.1052631578947,"endTime":665.1578947368421,"audioSegment":0},{"text":"gezel security level shows the security level and what it allows.","startTime":665.1578947368421,"endTime":668.2105263157895,"audioSegment":0},{"text":"gezel security level set super-lockdown|lockdown|free switches to a preset.","startTime":668.2105263157895,"endTime":671.2631578947369,"audioSegment":0},{"text":"free is called Unrestricted in Settings.","startTime":671.2631578947369,"endTime":674.3157894736842,"audioSegment":0},{"text":"gezel doctor checks whether the model it will use can do the work,","startTime":674.3157894736842,"endTime":677.3684210526316,"audioSegment":0},{"text":"as described above.","startTime":677.3684210526316,"endTime":680.421052631579,"audioSegment":0},{"text":"gezel model list --available shows each model's measured pass rate.","startTime":680.421052631579,"endTime":683.4736842105264,"audioSegment":0},{"text":"--no-start on gezel craftbook list and gezel model list answers only from a service that is already running and never starts one.","startTime":683.4736842105264,"endTime":686.5263157894736,"audioSegment":0},{"text":"gezel account adds, disables,","startTime":686.5263157894736,"endTime":689.578947368421,"audioSegment":0},{"text":"removes and resets the passwords of the people who sign in from a browser.","startTime":689.578947368421,"endTime":692.6315789473684,"audioSegment":0},{"text":"gezel start --web --accounts uses those sign-ins instead of a one-time link.","startTime":692.6315789473684,"endTime":695.6842105263158,"audioSegment":0},{"text":"gezel integrations token create <app> makes a key for another program without the approval prompt;","startTime":695.6842105263158,"endTime":698.7368421052631,"audioSegment":0},{"text":"revoke takes it back.","startTime":698.7368421052631,"endTime":701.7894736842105,"audioSegment":0},{"text":"gezel do … --out <folder> waits for the task and copies what it made into that folder.","startTime":701.7894736842105,"endTime":704.8421052631579,"audioSegment":0},{"text":"The reference now shows how to install Node.js 24 on macOS,","startTime":704.8421052631579,"endTime":707.8947368421053,"audioSegment":0},{"text":"Windows and Linux.","startTime":707.8947368421053,"endTime":710.9473684210526,"audioSegment":0},{"text":"See the CLI reference.","startTime":710.9473684210526,"endTime":714,"audioSegment":0},{"text":"Pages.","startTime":714,"endTime":716.8620689655172,"audioSegment":0},{"text":"gezel.ui.components.chat(element, options) puts gezel's own chat inside a project-type page,","startTime":716.8620689655172,"endTime":719.7241379310345,"audioSegment":0},{"text":"and can lock it to one role from the project's crew.","startTime":719.7241379310345,"endTime":722.5862068965517,"audioSegment":0},{"text":"gezel.ui.layout and gezel.ui.onLayout() tell a page whether it fills the window,","startTime":722.5862068965517,"endTime":725.448275862069,"audioSegment":0},{"text":"so it can lay itself out differently when maximized. See Page APIs. App SDK.","startTime":725.448275862069,"endTime":728.3103448275862,"audioSegment":0},{"text":"The images client lists the catalog's styles and installs one through /v1/images/styles and /v1/images/styles/ensure.","startTime":728.3103448275862,"endTime":731.1724137931035,"audioSegment":0},{"text":"Callers name a style by id and never pass a path,","startTime":731.1724137931035,"endTime":734.0344827586207,"audioSegment":0},{"text":"URL or engine argument.","startTime":734.0344827586207,"endTime":736.8965517241379,"audioSegment":0},{"text":"ONNX telemetry.","startTime":736.8965517241379,"endTime":739.7586206896551,"audioSegment":0},{"text":"The service, inference and knowledge packages set ORT_DISABLE_TELEMETRY=1 before ONNX Runtime first loads,","startTime":739.7586206896551,"endTime":742.6206896551724,"audioSegment":0},{"text":"unless you have set it yourself.","startTime":742.6206896551724,"endTime":745.4827586206897,"audioSegment":0},{"text":"Containers and accounts.","startTime":745.4827586206897,"endTime":748.3448275862069,"audioSegment":0},{"text":"With GEZEL_CONTAINER=1 inside a container, the service adds a listener on the container's network that admits only signed-in accounts and app keys,","startTime":748.3448275862069,"endTime":751.2068965517242,"audioSegment":0},{"text":"and leaves out the routes that trust a local caller.","startTime":751.2068965517242,"endTime":754.0689655172414,"audioSegment":0},{"text":"Accounts live in accounts.json and account-sessions.json,","startTime":754.0689655172414,"endTime":756.9310344827586,"audioSegment":0},{"text":"apart from tokens.json; History records which account did what.","startTime":756.9310344827586,"endTime":759.7931034482758,"audioSegment":0},{"text":"A home shared by two containers now refuses the second,","startTime":759.7931034482758,"endTime":762.6551724137931,"audioSegment":0},{"text":"and memory and thread counts follow the container's limits.","startTime":762.6551724137931,"endTime":765.5172413793103,"audioSegment":0},{"text":"See docs/container.md and docs/accounts.md in the repository.","startTime":765.5172413793103,"endTime":768.3793103448276,"audioSegment":0},{"text":"Task strategies.","startTime":768.3793103448276,"endTime":771.2413793103449,"audioSegment":0},{"text":"A chat model's catalog entry can now name the strategy it does its best task work under (tuning.taskStrategy),","startTime":771.2413793103449,"endTime":774.1034482758621,"audioSegment":0},{"text":"and the auto task strategy uses it for the model that will run the task.","startTime":774.1034482758621,"endTime":776.9655172413793,"audioSegment":0},{"text":"An explicit generalist-mode setting still wins.","startTime":776.9655172413793,"endTime":779.8275862068965,"audioSegment":0},{"text":"See docs/task-strategies.md in the repository. Chat events.","startTime":779.8275862068965,"endTime":782.6896551724138,"audioSegment":0},{"text":"The usage chat event adds ttftMs, promptTokensPerSec and cachedPromptTokens where the engine reports them,","startTime":782.6896551724138,"endTime":785.551724137931,"audioSegment":0},{"text":"including through a paired server.","startTime":785.551724137931,"endTime":788.4137931034483,"audioSegment":0},{"text":"Native engines are pinned to release 0.1.57,","startTime":788.4137931034483,"endTime":791.2758620689656,"audioSegment":0},{"text":"with a newer llama.cpp and the gezel-sandbox helper that confines no-network scripts in a container. Content.","startTime":791.2758620689656,"endTime":794.1379310344828,"audioSegment":0},{"text":"The catalog is @bendyline/gilde 0.3.5, and the document editor is Squisq 2.13.10.","startTime":794.1379310344828,"endTime":797,"audioSegment":0},{"text":"Open Settings → Image generation and look at Styles and fast mode.","startTime":797,"endTime":800.2,"audioSegment":0},{"text":"If the model you draw with has a fast mode, install it,","startTime":800.2,"endTime":803.4,"audioSegment":0},{"text":"and pick a style from the strip the next time you ask for a picture.","startTime":803.4,"endTime":806.6,"audioSegment":0},{"text":"To change a picture you already have,","startTime":806.6,"endTime":809.8,"audioSegment":0},{"text":"ask the Meester for the Image editor.","startTime":809.8,"endTime":813,"audioSegment":0},{"text":"And if you want to know how well your own computer does with the model you use,","startTime":813,"endTime":816.2,"audioSegment":0},{"text":"open Settings → Benchmarks or run gezel bench.","startTime":816.2,"endTime":819.4,"audioSegment":0},{"text":"If you run a small business,","startTime":819.4,"endTime":822.6,"audioSegment":0},{"text":"open New Project and look through the new project types.","startTime":822.6,"endTime":825.8,"audioSegment":0},{"text":"To run gezel on a server instead, start with Gezel in Docker.","startTime":825.8,"endTime":829,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26307 — 3 November 2026","subtitle":"Until now, gezel could draw a new picture but could not change one you already had. Now it can, and any picture can have a style. You can also measure how well a model does real work on your own computer, with the same tests we use for the published scorecard. New Project has nineteen ready-made projects for running a small business. And gezel now comes as a Docker image too, so a server or a computer without a screen can run all of it, reached from a browser.","ambientMotion":"zoomIn"}}</script>
