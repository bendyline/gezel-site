position":{"start":{"line":52,"column":3,"offset":5401},"end":{"line":52,"column":47,"offset":5445}}},{"type":"text","value":" A setup card in Settings writes a dedicated profile for the OpenAI Codex command-line tool that points it at gezel, so a coding tool you already use can run against a model on your own machine.","position":{"start":{"line":52,"column":47,"offset":5445},"end":{"line":52,"column":241,"offset":5639}}}],"position":{"start":{"line":52,"column":3,"offset":5401},"end":{"line":52,"column":241,"offset":5639}}}],"position":{"start":{"line":52,"column":1,"offset":5399},"end":{"line":52,"column":241,"offset":5639}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"New GitHub connectors","position":{"start":{"line":53,"column":5,"offset":5644},"end":{"line":53,"column":26,"offset":5665}}}],"position":{"start":{"line":53,"column":3,"offset":5642},"end":{"line":53,"column":28,"offset":5667}}},{"type":"text","value":" bring pull requests, releases and wiki pages in as project material, alongside the existing Google Calendar connector. Connector output now lands in the project's artifacts, where the rest of your work lives.","position":{"start":{"line":53,"column":28,"offset":5667},"end":{"line":53,"column":237,"offset":5876}}}],"position":{"start":{"line":53,"column":3,"offset":5642},"end":{"line":53,"column":237,"offset":5876}}}],"position":{"start":{"line":53,"column":1,"offset":5640},"end":{"line":53,"column":237,"offset":5876}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The OpenAI-compatible endpoint speaks the Responses API","position":{"start":{"line":54,"column":5,"offset":5881},"end":{"line":54,"column":60,"offset":5936}}}],"position":{"start":{"line":54,"column":3,"offset":5879},"end":{"line":54,"column":62,"offset":5938}}},{"type":"text","value":", including streaming — so apps built against the newer OpenAI shape work against gezel without a translation layer of their own.","position":{"start":{"line":54,"column":62,"offset":5938},"end":{"line":54,"column":191,"offset":6067}}}],"position":{"start":{"line":54,"column":3,"offset":5879},"end":{"line":54,"column":191,"offset":6067}}}],"position":{"start":{"line":54,"column":1,"offset":5877},"end":{"line":54,"column":191,"offset":6067}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Four new Handboek articles document all of this for developers: the npm package map, writing scripts with the gezel SDK, building connected apps with the app SDK, and how we test models.","position":{"start":{"line":55,"column":3,"offset":6070},"end":{"line":55,"column":189,"offset":6256}}}],"position":{"start":{"line":55,"column":3,"offset":6070},"end":{"line":55,"column":189,"offset":6256}}}],"position":{"start":{"line":55,"column":1,"offset":6068},"end":{"line":55,"column":189,"offset":6256}}}],"position":{"start":{"line":52,"column":1,"offset":5399},"end":{"line":55,"column":189,"offset":6256}}}],"autoTemplate":true,"templateData":{"items":["Codex CLI can now use your local models. A setup card in Settings writes a dedicated profile for the OpenAI Codex command-line tool that points it at gezel, so a coding tool you already use can run against a model on your own machine.","New GitHub connectors bring pull requests, releases and wiki pages in as project material, alongside the existing Google Calendar connector. Connector output now lands in the project's artifacts, where the rest of your work lives.","The OpenAI-compatible endpoint speaks the Responses API, including streaming — so apps built against the newer OpenAI shape work against gezel without a translation layer of their own.","Four new Handboek articles document all of this for developers: the npm package map, writing scripts with the gezel SDK, building connected apps with the app SDK, and how we test models."],"title":"Connecting gezel to other things"}},{"id":"catalog-updates-without-an-app-update","startTime":302,"duration":25,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Catalog updates without an app update","position":{"start":{"line":57,"column":4,"offset":6261},"end":{"line":57,"column":41,"offset":6298}}}],"position":{"start":{"line":57,"column":1,"offset":6258},"end":{"line":57,"column":41,"offset":6298}}},"title":"Catalog updates without an app update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel's descriptions of models, craftbooks and roles — the ","position":{"start":{"line":59,"column":1,"offset":6300},"end":{"line":59,"column":60,"offset":6359}}},{"type":"emphasis","children":[{"type":"text","value":"gilde","position":{"start":{"line":59,"column":61,"offset":6360},"end":{"line":59,"column":66,"offset":6365}}}],"position":{"start":{"line":59,"column":60,"offset":6359},"end":{"line":59,"column":67,"offset":6366}}},{"type":"text","value":" content — can now be refreshed on its own, without waiting for a new version of the app. It checks about once a day, verifies what it downloads, and only switches over after confirming that everything that worked before still works.","position":{"start":{"line":59,"column":67,"offset":6366},"end":{"line":59,"column":300,"offset":6599}}}],"position":{"start":{"line":59,"column":1,"offset":6300},"end":{"line":59,"column":300,"offset":6599}}},{"type":"paragraph","children":[{"type":"text","value":"It is ","position":{"start":{"line":61,"column":1,"offset":6601},"end":{"line":61,"column":7,"offset":6607}}},{"type":"strong","children":[{"type":"text","value":"off unless you turn it on","position":{"start":{"line":61,"column":9,"offset":6609},"end":{"line":61,"column":34,"offset":6634}}}],"position":{"start":{"line":61,"column":7,"offset":6607},"end":{"line":61,"column":36,"offset":6636}}},{"type":"text","value":", under Settings → About → Catalog content, and it will never touch a machine that has been pointed at a local content folder.","position":{"start":{"line":61,"column":36,"offset":6636},"end":{"line":61,"column":162,"offset":6762}}}],"position":{"start":{"line":61,"column":1,"offset":6601},"end":{"line":61,"column":162,"offset":6762}}}]},{"id":"smaller-things","startTime":327,"duration":32,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Smaller things","position":{"start":{"line":63,"column":4,"offset":6767},"end":{"line":63,"column":18,"offset":6781}}}],"position":{"start":{"line":63,"column":1,"offset":6764},"end":{"line":63,"column":18,"offset":6781}}},"title":"Smaller things","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Windows machines without a working CUDA setup no longer get probed for one.","position":{"start":{"line":65,"column":3,"offset":6785},"end":{"line":65,"column":78,"offset":6860}}}],"position":{"start":{"line":65,"column":3,"offset":6785},"end":{"line":65,"column":78,"offset":6860}}}],"position":{"start":{"line":65,"column":1,"offset":6783},"end":{"line":65,"column":78,"offset":6860}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"The Nemotron model family is recognized under its aliases and given the right tool format.","position":{"start":{"line":66,"column":3,"offset":6863},"end":{"line":66,"column":93,"offset":6953}}}],"position":{"start":{"line":66,"column":3,"offset":6863},"end":{"line":66,"column":93,"offset":6953}}}],"position":{"start":{"line":66,"column":1,"offset":6861},"end":{"line":66,"column":93,"offset":6953}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Installing gezel from npm no longer runs any install-time scripts; a permission repair that used to happen at install time now happens once, lazily, the first time it is needed.","position":{"start":{"line":67,"column":3,"offset":6956},"end":{"line":67,"column":180,"offset":7133}}}],"position":{"start":{"line":67,"column":3,"offset":6956},"end":{"line":67,"column":180,"offset":7133}}}],"position":{"start":{"line":67,"column":1,"offset":6954},"end":{"line":67,"column":180,"offset":7133}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Refreshed underlying editor and content packages (squisq 2.7.1, gilde 0.1.21).","position":{"start":{"line":68,"column":3,"offset":7136},"end":{"line":68,"column":81,"offset":7214}}}],"position":{"start":{"line":68,"column":3,"offset":7136},"end":{"line":68,"column":81,"offset":7214}}}],"position":{"start":{"line":68,"column":1,"offset":7134},"end":{"line":68,"column":81,"offset":7214}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"A large set of new automated tests covering everyday office work — meeting follow-ups, research briefs, document round-trips, and whether a gezel reaches for the right tool — so regressions in ordinary tasks get caught before you meet them.","position":{"start":{"line":69,"column":3,"offset":7217},"end":{"line":69,"column":243,"offset":7457}}}],"position":{"start":{"line":69,"column":3,"offset":7217},"end":{"line":69,"column":243,"offset":7457}}}],"position":{"start":{"line":69,"column":1,"offset":7215},"end":{"line":69,"column":243,"offset":7457}}}],"position":{"start":{"line":65,"column":1,"offset":6783},"end":{"line":69,"column":243,"offset":7457}}}],"autoTemplate":true,"templateData":{"items":["Windows machines without a working CUDA setup no longer get probed for one.","The Nemotron model family is recognized under its aliases and given the right tool format.","Installing gezel from npm no longer runs any install-time scripts; a permission repair that used to happen at install time now happens once, lazily, the first time it is needed.","Refreshed underlying editor and content packages (squisq 2.7.1, gilde 0.1.21).","A large set of new automated tests covering everyday office work — meeting follow-ups, research briefs, document round-trips, and whether a gezel reaches for the right tool — so regressions in ordinary tasks get caught before you meet them."],"title":"Smaller things"}},{"id":"things-to-see-and-do-after-update","startTime":359,"duration":14,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":71,"column":4,"offset":7462},"end":{"line":71,"column":37,"offset":7495}}}],"position":{"start":{"line":71,"column":1,"offset":7459},"end":{"line":71,"column":37,"offset":7495}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"If you run local models and have been fighting for memory, it is worth a visit to the model manager for the new per-model context and memory settings. And if you want to see which model to trust with what, start at the ","position":{"start":{"line":73,"column":1,"offset":7497},"end":{"line":73,"column":220,"offset":7716}}},{"type":"link","url":"../../model-scorecard/","children":[{"type":"text","value":"Model scorecard","position":{"start":{"line":73,"column":221,"offset":7717},"end":{"line":73,"column":236,"offset":7732}}}],"position":{"start":{"line":73,"column":220,"offset":7716},"end":{"line":73,"column":261,"offset":7757}}},{"type":"text","value":".","position":{"start":{"line":73,"column":261,"offset":7757},"end":{"line":73,"column":262,"offset":7758}}}],"position":{"start":{"line":73,"column":1,"offset":7497},"end":{"line":73,"column":262,"offset":7758}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"This is the first release with written release notes,","startTime":0,"endTime":5,"audioSegment":0},{"text":"so it covers everything since 1.26219 on 7 August.","startTime":5,"endTime":10,"audioSegment":0},{"text":"If you read only one thing: gezel now publishes measured scores for the models it ships, your gezellen are much more tightly fenced in about what they may install on your machine,","startTime":10,"endTime":15,"audioSegment":0},{"text":"and Word, PowerPoint, Excel and PDF files in a project can now be edited as ordinary text.","startTime":15,"endTime":20,"audioSegment":0},{"text":"Choosing a local model used to mean guessing.","startTime":20,"endTime":23.933333333333334,"audioSegment":0},{"text":"Now there is a scoreboard.","startTime":23.933333333333334,"endTime":27.866666666666667,"audioSegment":0},{"text":"The new Model scorecard in the Technical section of this Handboek lists every model we have tested and how many jobs it actually finished correctly — writing a small working program,","startTime":27.866666666666667,"endTime":31.799999999999997,"audioSegment":0},{"text":"fixing a bug from its symptoms, following a procedure and stopping when something is wrong, turning a pile of documents into one summary, and a set of everyday office and knowledge tasks.","startTime":31.799999999999997,"endTime":35.733333333333334,"audioSegment":0},{"text":"Each job is run three times on a real machine and checked by a program,","startTime":35.733333333333334,"endTime":39.666666666666664,"audioSegment":0},{"text":"not by an opinion.","startTime":39.666666666666664,"endTime":43.599999999999994,"audioSegment":0},{"text":"A companion article, How we test models,","startTime":43.599999999999994,"endTime":47.53333333333333,"audioSegment":0},{"text":"explains what was counted and what the numbers do not tell you.","startTime":47.53333333333333,"endTime":51.46666666666667,"audioSegment":0},{"text":"The first published set covers four models measured on an M4 Max: gemma4-e4b,","startTime":51.46666666666667,"endTime":55.4,"audioSegment":0},{"text":"gemma4-12b, gemma4-31b and ornith-9b, on both task sets.","startTime":55.4,"endTime":59.33333333333333,"audioSegment":0},{"text":"Alongside the pass counts you now also get speed, how much memory a model needed in practice,","startTime":59.33333333333333,"endTime":63.266666666666666,"audioSegment":0},{"text":"and a separate quality read from a judging pass.","startTime":63.266666666666666,"endTime":67.19999999999999,"audioSegment":0},{"text":"Two rules keep the board honest.","startTime":67.19999999999999,"endTime":71.13333333333333,"audioSegment":0},{"text":"A model that was only partly measured is withheld rather than shown with a flattering gap,","startTime":71.13333333333333,"endTime":75.06666666666666,"audioSegment":0},{"text":"and earlier rounds of testing are kept visible separately instead of being quietly overwritten.","startTime":75.06666666666666,"endTime":79,"audioSegment":0},{"text":"A gezel that can install software is useful.","startTime":79,"endTime":82.25,"audioSegment":0},{"text":"A gezel that can install anything,","startTime":82.25,"endTime":85.5,"audioSegment":0},{"text":"anywhere is not something you should have to think about.","startTime":85.5,"endTime":88.75,"audioSegment":0},{"text":"This release closes that gap.","startTime":88.75,"endTime":92,"audioSegment":0},{"text":"Installing packages is now registry-only and tied to one project.","startTime":92,"endTime":95.25,"audioSegment":0},{"text":"A gezel can ask for a published package by name and version,","startTime":95.25,"endTime":98.5,"audioSegment":0},{"text":"into a project that already exists, and nothing else.","startTime":98.5,"endTime":101.75,"audioSegment":0},{"text":"Names, versions and destinations are all checked before anything runs.","startTime":101.75,"endTime":105,"audioSegment":0},{"text":"Approving a command now approves that exact command.","startTime":105,"endTime":108.25,"audioSegment":0},{"text":"Previously, approving a script meant approving the words in it.","startTime":108.25,"endTime":111.5,"audioSegment":0},{"text":"Now gezel takes a fingerprint of the actual files the command would read — the script, its wrapper, the files it imports —","startTime":111.5,"endTime":114.75,"audioSegment":0},{"text":"so an approval you gave yesterday cannot be reused tomorrow for a script whose contents have changed underneath it.","startTime":114.75,"endTime":118,"audioSegment":0},{"text":"Names are checked everywhere.","startTime":118,"endTime":121.25,"audioSegment":0},{"text":"Gezel, project, session and document identifiers now go through one shared rule, applied on disk,","startTime":121.25,"endTime":124.5,"audioSegment":0},{"text":"in the schemas, and on every web request, so a hand-crafted name cannot walk out of the folder it belongs in.","startTime":124.5,"endTime":127.75,"audioSegment":0},{"text":"On Linux and macOS,","startTime":127.75,"endTime":131,"audioSegment":0},{"text":"gezel's home folder is now locked to your account (0700).","startTime":131,"endTime":134.25,"audioSegment":0},{"text":"Other accounts on the same machine can no longer read your conversations or files.","startTime":134.25,"endTime":137.5,"audioSegment":0},{"text":"None of this changes anything you do day to day.","startTime":137.5,"endTime":140.75,"audioSegment":0},{"text":"It changes what happens when something goes wrong.","startTime":140.75,"endTime":144,"audioSegment":0},{"text":"Open a project and select a .docx, .pptx, .xlsx, .pdf or .html file,","startTime":144,"endTime":147.85714285714286,"audioSegment":0},{"text":"and gezel shows you its contents as clean Markdown you can read and search.","startTime":147.85714285714286,"endTime":151.71428571428572,"audioSegment":0},{"text":"The original file stays exactly where it was.","startTime":151.71428571428572,"endTime":155.57142857142858,"audioSegment":0},{"text":"Editing is deliberately a second step.","startTime":155.57142857142858,"endTime":159.42857142857142,"audioSegment":0},{"text":"The imported text is read-only until you choose Allow editing via markdown from the file's menu,","startTime":159.42857142857142,"endTime":163.28571428571428,"audioSegment":0},{"text":"and the first time you do, gezel takes a copy of the untouched original and keeps it.","startTime":163.28571428571428,"endTime":167.14285714285714,"audioSegment":0},{"text":"It is opt-in because rewriting someone's PowerPoint should never be something that happens by accident.","startTime":167.14285714285714,"endTime":171,"audioSegment":0},{"text":"If you run models on your own machine,","startTime":171,"endTime":175.1818181818182,"audioSegment":0},{"text":"this is the release where the machine stops being a mystery.","startTime":175.1818181818182,"endTime":179.36363636363637,"audioSegment":0},{"text":"Set the context size per model.","startTime":179.36363636363637,"endTime":183.54545454545453,"audioSegment":0},{"text":"A slider in each model manager, instead of one setting for everything.","startTime":183.54545454545453,"endTime":187.72727272727272,"audioSegment":0},{"text":"Set a memory budget, decide whether a model may spill into ordinary RAM when it does not fit on the graphics card,","startTime":187.72727272727272,"endTime":191.9090909090909,"audioSegment":0},{"text":"and have models unload themselves when idle so a forgotten model stops holding your machine hostage.","startTime":191.9090909090909,"endTime":196.0909090909091,"audioSegment":0},{"text":"An emergency stop.","startTime":196.0909090909091,"endTime":200.27272727272728,"audioSegment":0},{"text":"The engine pill now has a \"stop everything\" action that cancels every chat in flight, clears anything queued,","startTime":200.27272727272728,"endTime":204.45454545454544,"audioSegment":0},{"text":"and drops gezel back into reactive mode — one place to press when something has run away from you.","startTime":204.45454545454544,"endTime":208.63636363636363,"audioSegment":0},{"text":"Behind those controls, gezel is better at fitting a model into the memory you actually have: it will trade parallel capacity down to two lanes when doing so buys a meaningfully larger context,","startTime":208.63636363636363,"endTime":212.8181818181818,"audioSegment":0},{"text":"rather than refusing or thrashing.","startTime":212.8181818181818,"endTime":217,"audioSegment":0},{"text":"Thread titles are derived the same way everywhere.","startTime":217,"endTime":220.9090909090909,"audioSegment":0},{"text":"The name you see in the sidebar, in search and in the thread list is now the same name,","startTime":220.9090909090909,"endTime":224.8181818181818,"audioSegment":0},{"text":"worked out once instead of three times slightly differently.","startTime":224.8181818181818,"endTime":228.72727272727272,"audioSegment":0},{"text":"Recent threads appear as pills above the conversation,","startTime":228.72727272727272,"endTime":232.63636363636363,"audioSegment":0},{"text":"so hopping between the two or three things you have going takes one click and puts you back where you were looking.","startTime":232.63636363636363,"endTime":236.54545454545456,"audioSegment":0},{"text":"Threads that are working, or that hit an error, are shown first —","startTime":236.54545454545456,"endTime":240.45454545454544,"audioSegment":0},{"text":"you should not have to go hunting for the one that needs you.","startTime":240.45454545454544,"endTime":244.36363636363637,"audioSegment":0},{"text":"Terminal threads show their last command in the list,","startTime":244.36363636363637,"endTime":248.27272727272728,"audioSegment":0},{"text":"so you can tell them apart at a glance.","startTime":248.27272727272728,"endTime":252.1818181818182,"audioSegment":0},{"text":"Chat references are more compact, the file tree and sidebar behave more predictably,","startTime":252.1818181818182,"endTime":256.0909090909091,"audioSegment":0},{"text":"and the Handboek's own table of contents now collapses by section, with craftbooks grouped into shelves rather than one long list.","startTime":256.0909090909091,"endTime":260,"audioSegment":0},{"text":"Codex CLI can now use your local models.","startTime":260,"endTime":263.8181818181818,"audioSegment":0},{"text":"A setup card in Settings writes a dedicated profile for the OpenAI Codex command-line tool that points it at gezel,","startTime":263.8181818181818,"endTime":267.6363636363636,"audioSegment":0},{"text":"so a coding tool you already use can run against a model on your own machine.","startTime":267.6363636363636,"endTime":271.45454545454544,"audioSegment":0},{"text":"New GitHub connectors bring pull requests, releases and wiki pages in as project material,","startTime":271.45454545454544,"endTime":275.27272727272725,"audioSegment":0},{"text":"alongside the existing Google Calendar connector.","startTime":275.27272727272725,"endTime":279.0909090909091,"audioSegment":0},{"text":"Connector output now lands in the project's artifacts,","startTime":279.0909090909091,"endTime":282.90909090909093,"audioSegment":0},{"text":"where the rest of your work lives.","startTime":282.90909090909093,"endTime":286.72727272727275,"audioSegment":0},{"text":"The OpenAI-compatible endpoint speaks the Responses API, including streaming —","startTime":286.72727272727275,"endTime":290.54545454545456,"audioSegment":0},{"text":"so apps built against the newer OpenAI shape work against gezel without a translation layer of their own.","startTime":290.54545454545456,"endTime":294.3636363636364,"audioSegment":0},{"text":"Four new Handboek articles document all of this for developers: the npm package map,","startTime":294.3636363636364,"endTime":298.1818181818182,"audioSegment":0},{"text":"writing scripts with the gezel SDK, building connected apps with the app SDK, and how we test models.","startTime":298.1818181818182,"endTime":302,"audioSegment":0},{"text":"Gezel's descriptions of models, craftbooks and roles — the gilde content —","startTime":302,"endTime":306.1666666666667,"audioSegment":0},{"text":"can now be refreshed on its own, without waiting for a new version of the app.","startTime":306.1666666666667,"endTime":310.3333333333333,"audioSegment":0},{"text":"It checks about once a day, verifies what it downloads,","startTime":310.3333333333333,"endTime":314.5,"audioSegment":0},{"text":"and only switches over after confirming that everything that worked before still works.","startTime":314.5,"endTime":318.6666666666667,"audioSegment":0},{"text":"It is off unless you turn it on, under Settings → About → Catalog content,","startTime":318.6666666666667,"endTime":322.8333333333333,"audioSegment":0},{"text":"and it will never touch a machine that has been pointed at a local content folder.","startTime":322.8333333333333,"endTime":327,"audioSegment":0},{"text":"Windows machines without a working CUDA setup no longer get probed for one.","startTime":327,"endTime":331.57142857142856,"audioSegment":0},{"text":"The Nemotron model family is recognized under its aliases and given the right tool format.","startTime":331.57142857142856,"endTime":336.14285714285717,"audioSegment":0},{"text":"Installing gezel from npm no longer runs any install-time scripts;","startTime":336.14285714285717,"endTime":340.7142857142857,"audioSegment":0},{"text":"a permission repair that used to happen at install time now happens once, lazily, the first time it is needed.","startTime":340.7142857142857,"endTime":345.2857142857143,"audioSegment":0},{"text":"Refreshed underlying editor and content packages (squisq 2.7.1, gilde 0.1.21).","startTime":345.2857142857143,"endTime":349.85714285714283,"audioSegment":0},{"text":"A large set of new automated tests covering everyday office work — meeting follow-ups, research briefs, document round-trips,","startTime":349.85714285714283,"endTime":354.42857142857144,"audioSegment":0},{"text":"and whether a gezel reaches for the right tool — so regressions in ordinary tasks get caught before you meet them.","startTime":354.42857142857144,"endTime":359,"audioSegment":0},{"text":"If you run local models and have been fighting for memory,","startTime":359,"endTime":362.5,"audioSegment":0},{"text":"it is worth a visit to the model manager for the new per-model context and memory settings.","startTime":362.5,"endTime":366,"audioSegment":0},{"text":"And if you want to see which model to trust with what,","startTime":366,"endTime":369.5,"audioSegment":0},{"text":"start at the Model scorecard.","startTime":369.5,"endTime":373,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26224 — 12 August 2026","subtitle":"This is the first release with written release notes, so it covers everything since 1.26219 on 7 August.","ambientMotion":"zoomIn"}}</script>
