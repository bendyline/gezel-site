:[{"type":"text","value":"A review can't cost you work that had already passed. If the revised work fails the checks and the task would otherwise pause, the work goes back to how it stood before the review, and the task finishes on that version as long as it still passes. The revision is kept with the review's records.","position":{"start":{"line":13,"column":1,"offset":1533},"end":{"line":13,"column":295,"offset":1827}}}],"position":{"start":{"line":13,"column":1,"offset":1533},"end":{"line":13,"column":295,"offset":1827}}},{"type":"paragraph","children":[{"type":"text","value":"While the review runs, Activity shows the work as being checked. You can turn it off under ","position":{"start":{"line":15,"column":1,"offset":1829},"end":{"line":15,"column":92,"offset":1920}}},{"type":"strong","children":[{"type":"text","value":"Settings → Artificial intelligence → Check work before handing it in","position":{"start":{"line":15,"column":94,"offset":1922},"end":{"line":15,"column":162,"offset":1990}}}],"position":{"start":{"line":15,"column":92,"offset":1920},"end":{"line":15,"column":164,"offset":1992}}},{"type":"text","value":". A change there applies to work you start afterwards, never to work already under way.","position":{"start":{"line":15,"column":164,"offset":1992},"end":{"line":15,"column":251,"offset":2079}}}],"position":{"start":{"line":15,"column":1,"offset":1829},"end":{"line":15,"column":251,"offset":2079}}}]},{"id":"views-that-keep-your-place","startTime":114,"duration":55,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Views that keep your place","position":{"start":{"line":17,"column":4,"offset":2084},"end":{"line":17,"column":30,"offset":2110}}}],"position":{"start":{"line":17,"column":1,"offset":2081},"end":{"line":17,"column":30,"offset":2110}}},"title":"Views that keep your place","contents":[{"type":"paragraph","children":[{"type":"text","value":"Moving between parts of the S 20B now skips its reasoning when an app asks it to. It used to reason anyway and run out of room mid-answer.","When a model you added fails its tryout because it wrote its tool call as plain text, the result says so, instead of \"fitness check failed\". A small model stuck that way no longer fills the reply with junk until it is stopped.","Python packages downloaded for on-device engines are now kept inside Gezel's own folder, where storage in Settings and gezel cleanup count them. They used to go to ~/.cache/uv, which neither could see.","When an app's own setup command fails while Gezel adds its tools to that app, such as claude mcp add, Settings → Integrations shows what that command said, instead of only \"Gezel could not change this app\".","Model downloads from Hugging Face hold up on an unsteady connection. A dropped connection now picks up where it stopped instead of throwing away hundreds of megabytes already received, the progress bar no longer jumps back, and a few drops in a row no longer end the download.","The Use this model link on Hugging Face now fills the model in under Add a model… and waits for you to choose Check model. Any web page can send that link, so Gezel doesn't contact Hugging Face until you ask.","Adding an MLX model now also checks its video settings for program code, and turns the model away when a settings file is too large to check, instead of letting it through unchecked.","The tryout after a model download now waits until no other model has worked for three minutes. It had unloaded a model a task was still using, between two of the task's turns.","An on-device model that gets stuck repeating itself now has only that reply stopped, and the engine keeps serving your other chats and tasks. A second time on the same engine within half an hour restarts it.","When a crew member opens several files at once, an Office document among them is now converted to text, as it is when opened alone. A review had reported a finished deck as one that would not open.","A plan's citation check no longer counts a report that cites itself as a source.","After making a picture, a crew member is now told how to animate it when an installed video model can. A permission check had kept that hint from ever appearing.","When a video render fails on a paired server, the message no longer shows file paths from that computer. It gives a request number to look up in that server's log.","An app update keeps a schedule time you changed. It used to reset the time to the one in the new version.","An app in an archived or read-only project, or one shared by every account on this computer, now offers its update for you to apply. Its update line used to say \"An update is being applied.\" and never finish.","In a narrow window, a project's Output page now moves aside on the Settings tab, as it already did on Tasks.","Apps connected to Gezel, such as DocBlocks, now list the recommended image models first, instead of whichever model's id sorts first. After a chat model downloads, they keep showing its name, such as \"Qwen 3.5 (0.8B, Q4)\", instead of its id.","Catalog content updated (gilde 0.3.10)."],"ordered":false,"title":"Smaller things"}},{"id":"in-documents","startTime":507,"duration":69,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"In documents","position":{"start":{"line":72,"column":4,"offset":9485},"end":{"line":72,"column":16,"offset":9497}}}],"position":{"start":{"line":72,"column":1,"offset":9482},"end":{"line":72,"column":16,"offset":9497}}},"title":"In documents","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Exporting a document to PowerPoint puts its footnotes in the speaker notes of the slides that cite them, instead of leaving them out or printing them on the slide.","position":{"start":{"line":74,"column":3,"offset":9501 ":241,"offset":13080}}}],"position":{"start":{"line":103,"column":3,"offset":12842},"end":{"line":103,"column":241,"offset":13080}}}],"position":{"start":{"line":103,"column":1,"offset":12840},"end":{"line":103,"column":241,"offset":13080}}}],"position":{"start":{"line":101,"column":1,"offset":12493},"end":{"line":103,"column":241,"offset":13080}}}],"autoTemplate":true,"templateData":{"items":["Each downloadable entry in /v1/models carries its docbench score and a docbench_recommendation that ranks models for document work on this machine. The phone's catalog carries the same.","Installed catalog models in /v1/models carry the catalog's display name, and /v1/images/models lists the curated image models first, best first.","A @bendyline/gezel-capacitor release no longer waits for a native build when native/runtime has moved past the pinned release. It ships the pinned release as built, and still refuses a plugin that calls runtime API that release lacks."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":686,"duration":16,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":105,"column":4,"offset":13085},"end":{"line":105,"column":37,"offset":13118}}}],"position":{"start":{"line":105,"column":1,"offset":13082},"end":{"line":105,"column":37,"offset":13118}}},"title":"Things to see and do after update","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"If you run Qwen 3.8 27B, start a plan that writes a report and watch Activity show it being checked. To skip that step, use ","position":{"start":{"line":107,"column":3,"offset":13122},"end":{"line":107,"column":127,"offset":13246}}},{"type":"strong","children":[{"type":"text","value":"Settings → Artificial intelligence → Check work before handing it in","position":{"start":{"line":107,"column":129,"offset":13248},"end":{"line":107,"column":197,"offset":13316}}}],"position":{"start":{"line":107,"column":127,"offset":13246},"end":{"line":107,"column":199,"offset":13318}}},{"type":"text","value":".","position":{"start":{"line":107,"column":199,"offset":13318},"end":{"line":107,"column":200,"offset":13319}}}],"position":{"start":{"line":107,"column":3,"offset":13122},"end":{"line":107,"column":200,"offset":13319}}}],"position":{"start":{"line":107,"column":1,"offset":13120},"end":{"line":107,"column":200,"offset":13319}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Open a project's ","position":{"start":{"line":108,"column":3,"offset":13322},"end":{"line":108,"column":20,"offset":13339}}},{"type":"strong","children":[{"type":"text","value":"Settings → Preferences → Icon","position":{"start":{"line":108,"column":22,"offset":13341},"end":{"line":108,"column":51,"offset":13370}}}],"position":{"start":{"line":108,"column":20,"offset":13339},"end":{"line":108,"column":53,"offset":13372}}},{"type":"text","value":" and give it a mark of its own.","position":{"start":{"line":108,"column":53,"offset":13372},"end":{"line":108,"column":84,"offset":13403}}}],"position":{"start":{"line":108,"column":3,"offset":13322},"end":{"line":108,"column":84,"offset":13403}}}],"position":{"start":{"line":108,"column":1,"offset":13320},"end":{"line":108,"column":84,"offset":13403}}}],"position":{"start":{"line":107,"column":1,"offset":13120},"end":{"line":108,"column":84,"offset":13403}}}],"autoTemplate":true,"templateData":{"items":["If you run Qwen 3.8 27B, start a plan that writes a report and watch Activity show it being checked. To skip that step, use Settings → Artificial intelligence → Check work before handing it in.","Open a project's Settings → Preferences → Icon and give it a mark of its own."],"ordered":false,"title":"Things to see and do after update"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"On a model where it was shown to help, a report,","startTime":0,"endTime":3.875,"audioSegment":0},{"text":"document or spec now gets one more read against your request before it is handed in.","startTime":3.875,"endTime":7.75,"audioSegment":0},{"text":"Moving around the app is steadier: a project you come back to is where you left it,","startTime":7.75,"endTime":11.625,"audioSegment":0},{"text":"and views appear whole instead of filling in piece by piece.","startTime":11.625,"endTime":15.5,"audioSegment":0},{"text":"Projects can wear an icon of their own,","startTime":15.5,"endTime":19.375,"audioSegment":0},{"text":"drawn by a model or uploaded.","startTime":19.375,"endTime":23.25,"audioSegment":0},{"text":"And Help gains a scorecard for how well each local model does document work.","startTime":23.25,"endTime":27.125,"audioSegment":0},{"text":"If you read only one thing: look at Settings → Artificial intelligence → Check work before handing it in.","startTime":27.125,"endTime":31,"audioSegment":0},{"text":"A plan's checks confirm that the work exists and has the parts it should.","startTime":31,"endTime":34.77272727272727,"audioSegment":0},{"text":"They can't tell whether a report actually answers what you asked.","startTime":34.77272727272727,"endTime":38.54545454545455,"audioSegment":0},{"text":"So once a report, document or spec passes its checks,","startTime":38.54545454545455,"endTime":42.31818181818182,"audioSegment":0},{"text":"the crew member who wrote it now reads it again against your request and fixes what it can show is wrong.","startTime":42.31818181818182,"endTime":46.09090909090909,"audioSegment":0},{"text":"A fix may only remove or correct,","startTime":46.09090909090909,"endTime":49.86363636363636,"audioSegment":0},{"text":"or add what the sources say.","startTime":49.86363636363636,"endTime":53.63636363636364,"audioSegment":0},{"text":"The checks then run again, and there is one round.","startTime":53.63636363636364,"endTime":57.40909090909091,"audioSegment":0},{"text":"This happens only where it was measured to help.","startTime":57.40909090909091,"endTime":61.18181818181819,"audioSegment":0},{"text":"In our test with Qwen 3.8 27B, the reviewed reports were judged better than the same reports before the review,","startTime":61.18181818181819,"endTime":64.95454545454545,"audioSegment":0},{"text":"none got worse, and the review added a median of about a minute and a half.","startTime":64.95454545454545,"endTime":68.72727272727272,"audioSegment":0},{"text":"On Gemma 4 E4B it made no difference, so models like it skip the review, as do code,","startTime":68.72727272727272,"endTime":72.5,"audioSegment":0},{"text":"data files and slide decks, where a review mostly re-edited work the checks had already verified.","startTime":72.5,"endTime":76.27272727272728,"audioSegment":0},{"text":"Today that means the Q4 build of Qwen 3.8 27B,","startTime":76.27272727272728,"endTime":80.04545454545455,"audioSegment":0},{"text":"on plans it runs as one piece of work.","startTime":80.04545454545455,"endTime":83.81818181818181,"audioSegment":0},{"text":"A review can't cost you work that had already passed.","startTime":83.81818181818181,"endTime":87.5909090909091,"audioSegment":0},{"text":"If the revised work fails the checks and the task would otherwise pause,","startTime":87.5909090909091,"endTime":91.36363636363637,"audioSegment":0},{"text":"the work goes back to how it stood before the review, and the task finishes on that version as long as it still passes.","startTime":91.36363636363637,"endTime":95.13636363636364,"audioSegment":0},{"text":"The revision is kept with the review's records.","startTime":95.13636363636364,"endTime":98.9090909090909,"audioSegment":0},{"text":"While the review runs, Activity shows the work as being checked.","startTime":98.9090909090909,"endTime":102.68181818181819,"audioSegment":0},{"text":"You can turn it off under Settings → Artificial intelligence → Check work before handing it in.","startTime":102.68181818181819,"endTime":106.45454545454545,"audioSegment":0},{"text":"A change there applies to work you start afterwards,","startTime":106.45454545454545,"endTime":110.22727272727273,"audioSegment":0},{"text":"never to work already under way.","startTime":110.22727272727273,"endTime":114,"audioSegment":0},{"text":"Moving between parts of the app used to reset what you were looking at and draw the next view in stages. Now:","startTime":114,"endTime":117.23529411764706,"audioSegment":0},{"text":"Coming back is coming back.","startTime":117.23529411764706,"endTime":120.47058823529412,"audioSegment":0},{"text":"Home and the last few places you visited stay ready behind the one you are looking at.","startTime":120.47058823529412,"endTime":123.70588235294117,"audioSegment":0},{"text":"Return to a project and it is on the tab,","startTime":123.70588235294117,"endTime":126.94117647058823,"audioSegment":0},{"text":"the open file and the scroll position you left, not back on Chat.","startTime":126.94117647058823,"endTime":130.1764705882353,"audioSegment":0},{"text":"Settings and the editors still start fresh each time.","startTime":130.1764705882353,"endTime":133.41176470588235,"audioSegment":0},{"text":"Views appear whole.","startTime":133.41176470588235,"endTime":136.64705882352942,"audioSegment":0},{"text":"The navigation highlights your choice at once.","startTime":136.64705882352942,"endTime":139.88235294117646,"audioSegment":0},{"text":"When the next view's information is not ready yet, the current one stays up for a moment,","startTime":139.88235294117646,"endTime":143.11764705882354,"audioSegment":0},{"text":"at most about a tenth of a second, so the next one appears complete instead of popping in.","startTime":143.11764705882354,"endTime":146.35294117647058,"audioSegment":0},{"text":"A project's tabs no longer blank while the next one loads.","startTime":146.35294117647058,"endTime":149.58823529411765,"audioSegment":0},{"text":"Long chats stay smooth.","startTime":149.58823529411765,"endTime":152.8235294117647,"audioSegment":0},{"text":"A reply streaming in a chat you are not looking at waits to redraw until you open it,","startTime":152.8235294117647,"endTime":156.05882352941177,"audioSegment":0},{"text":"and long conversations redraw less while a reply arrives.","startTime":156.05882352941177,"endTime":159.29411764705884,"audioSegment":0},{"text":"The window has less to load at startup.","startTime":159.29411764705884,"endTime":162.52941176470588,"audioSegment":0},{"text":"Formatting for search results, for example,","startTime":162.52941176470588,"endTime":165.76470588235293,"audioSegment":0},{"text":"now loads when you first use search.","startTime":165.76470588235293,"endTime":169,"audioSegment":0},{"text":"Two projects of the same type used to look alike in the navigation: two code folders were both braces.","startTime":169,"endTime":172,"audioSegment":0},{"text":"A project's Settings → Preferences → Icon now offers every built-in mark to choose from,","startTime":172,"endTime":175,"audioSegment":0},{"text":"plus two ways to make one of your own:","startTime":175,"endTime":178,"audioSegment":0},{"text":"Draw one… asks a model for a small one-color mark from a description,","startTime":178,"endTime":181,"audioSegment":0},{"text":"which starts from the project's name and type and is yours to change.","startTime":181,"endTime":184,"audioSegment":0},{"text":"Generate as many as you like;","startTime":184,"endTime":187,"audioSegment":0},{"text":"nothing is saved until you choose Set this as the icon.","startTime":187,"endTime":190,"audioSegment":0},{"text":"Upload a picture… takes a PNG,","startTime":190,"endTime":193,"audioSegment":0},{"text":"JPEG or WebP and scales it down to a small square.","startTime":193,"endTime":196,"audioSegment":0},{"text":"A drawn mark takes the colors of your theme,","startTime":196,"endTime":199,"audioSegment":0},{"text":"so it sits beside the built-in marks in light and dark.","startTime":199,"endTime":202,"audioSegment":0},{"text":"Automatic goes back to the mark for the project's type.","startTime":202,"endTime":205,"audioSegment":0},{"text":"Drawing never happens on its own: it costs a model call,","startTime":205,"endTime":208,"audioSegment":0},{"text":"and a small on-device model draws poorly.","startTime":208,"endTime":211,"audioSegment":0},{"text":"In the navigation, project marks are now drawn in ink,","startTime":211,"endTime":214,"audioSegment":0},{"text":"like a document's file icon.","startTime":214,"endTime":217,"audioSegment":0},{"text":"In the accent color,","startTime":217,"endTime":220,"audioSegment":0},{"text":"a project row looked like one more group heading.","startTime":220,"endTime":223,"audioSegment":0},{"text":"The model scorecard asks whether a model can finish a job on its own.","startTime":223,"endTime":227,"audioSegment":0},{"text":"The new Docbench article in Help asks how good a model's answer is when DocBlocks hands it one piece of document work: a review,","startTime":227,"endTime":231,"audioSegment":0},{"text":"new or rewritten text, a diagram or illustration, slides, study aids, or a cleaned-up dictation.","startTime":231,"endTime":235,"audioSegment":0},{"text":"Each model gets a score from 0 to 100,","startTime":235,"endTime":239,"audioSegment":0},{"text":"with a range and a band that says which models are too close to tell apart.","startTime":239,"endTime":243,"audioSegment":0},{"text":"The first round covers 21 local models,","startTime":243,"endTime":247,"audioSegment":0},{"text":"with Qwen 3.8 27B and Gemma 4 12B at the top.","startTime":247,"endTime":251,"audioSegment":0},{"text":"Apps connected to Gezel can now read these scores from its model list,","startTime":251,"endTime":255,"audioSegment":0},{"text":"so DocBlocks can suggest the best measured model your computer can run.","startTime":255,"endTime":259,"audioSegment":0},{"text":"When a crew member asks another to make a picture,","startTime":259,"endTime":262.59420289855075,"audioSegment":0},{"text":"the picture now appears in the chat you are in, beside the reply.","startTime":262.59420289855075,"endTime":266.18840579710144,"audioSegment":0},{"text":"Before, it showed only in the other crew member's thread,","startTime":266.18840579710144,"endTime":269.7826086956522,"audioSegment":0},{"text":"and the reply could link to a picture that didn't exist.","startTime":269.7826086956522,"endTime":273.3768115942029,"audioSegment":0},{"text":"The dark theme no longer turns the chat brown.","startTime":273.3768115942029,"endTime":276.9710144927536,"audioSegment":0},{"text":"Your own messages, the message box,","startTime":276.9710144927536,"endTime":280.5652173913044,"audioSegment":0},{"text":"Home and hover highlights use a neutral gray at night.","startTime":280.5652173913044,"endTime":284.15942028985506,"audioSegment":0},{"text":"The accent color stays on buttons, selections,","startTime":284.15942028985506,"endTime":287.7536231884058,"audioSegment":0},{"text":"links and anything that is working.","startTime":287.7536231884058,"endTime":291.3478260869565,"audioSegment":0},{"text":"The number of prompt tokens beside a reply's progress bar appears only when you point at the reply's header,","startTime":291.3478260869565,"endTime":294.94202898550725,"audioSegment":0},{"text":"unless debug mode is on.","startTime":294.94202898550725,"endTime":298.536231884058,"audioSegment":0},{"text":"A presentation, document, spreadsheet or PDF that the side pane in a chat can't preview now says what it is,","startTime":298.536231884058,"endTime":302.1304347826087,"audioSegment":0},{"text":"instead of showing <Machine File>.","startTime":302.1304347826087,"endTime":305.72463768115944,"audioSegment":0},{"text":"In the memory details you open from This PC in the title bar,","startTime":305.72463768115944,"endTime":309.3188405797101,"audioSegment":0},{"text":"the list of programs using video memory folds into one line, Gezel against everything else.","startTime":309.3188405797101,"endTime":312.9130434782609,"audioSegment":0},{"text":"Open it for the full list.","startTime":312.9130434782609,"endTime":316.5072463768116,"audioSegment":0},{"text":"Two video requests now take turns.","startTime":316.5072463768116,"endTime":320.1014492753623,"audioSegment":0},{"text":"The second one shows \"Waiting for another video to finish…\" instead of stopping a long render already running on the other video engine.","startTime":320.1014492753623,"endTime":323.69565217391306,"audioSegment":0},{"text":"A plan's reference list leaves out catalog entries that share only one word with your request.","startTime":323.69565217391306,"endTime":327.28985507246375,"audioSegment":0},{"text":"\"For the board\" no longer cites a board game.","startTime":327.28985507246375,"endTime":330.8840579710145,"audioSegment":0},{"text":"An app that asks a local model for a structured answer gets one even from a model the engine can't hold to the format,","startTime":330.8840579710145,"endTime":334.47826086956525,"audioSegment":0},{"text":"such as Nanbeige 4.2 3B.","startTime":334.47826086956525,"endTime":338.07246376811594,"audioSegment":0},{"text":"Before, every such request to that model failed.","startTime":338.07246376811594,"endTime":341.6666666666667,"audioSegment":0},{"text":"GPT-OSS 20B now skips its reasoning when an app asks it to.","startTime":341.6666666666667,"endTime":345.2608695652174,"audioSegment":0},{"text":"It used to reason anyway and run out of room mid-answer.","startTime":345.2608695652174,"endTime":348.8550724637681,"audioSegment":0},{"text":"When a model you added fails its tryout because it wrote its tool call as plain text,","startTime":348.8550724637681,"endTime":352.4492753623189,"audioSegment":0},{"text":"the result says so, instead of \"fitness check failed\".","startTime":352.4492753623189,"endTime":356.04347826086956,"audioSegment":0},{"text":"A small model stuck that way no longer fills the reply with junk until it is stopped.","startTime":356.04347826086956,"endTime":359.63768115942025,"audioSegment":0},{"text":"Python packages downloaded for on-device engines are now kept inside Gezel's own folder,","startTime":359.63768115942025,"endTime":363.231884057971,"audioSegment":0},{"text":"where storage in Settings and gezel cleanup count them.","startTime":363.231884057971,"endTime":366.82608695652175,"audioSegment":0},{"text":"They used to go to ~/.cache/uv, which neither could see.","startTime":366.82608695652175,"endTime":370.4202898550725,"audioSegment":0},{"text":"When an app's own setup command fails while Gezel adds its tools to that app, such as claude mcp add,","startTime":370.4202898550725,"endTime":374.0144927536232,"audioSegment":0},{"text":"Settings → Integrations shows what that command said, instead of only \"Gezel could not change this app\".","startTime":374.0144927536232,"endTime":377.6086956521739,"audioSegment":0},{"text":"Model downloads from Hugging Face hold up on an unsteady connection.","startTime":377.6086956521739,"endTime":381.2028985507246,"audioSegment":0},{"text":"A dropped connection now picks up where it stopped instead of throwing away hundreds of megabytes already received,","startTime":381.2028985507246,"endTime":384.7971014492754,"audioSegment":0},{"text":"the progress bar no longer jumps back, and a few drops in a row no longer end the download.","startTime":384.7971014492754,"endTime":388.3913043478261,"audioSegment":0},{"text":"The Use this model link on Hugging Face now fills the model in under Add a model… and waits for you to choose Check model.","startTime":388.3913043478261,"endTime":391.9855072463768,"audioSegment":0},{"text":"Any web page can send that link,","startTime":391.9855072463768,"endTime":395.5797101449275,"audioSegment":0},{"text":"so Gezel doesn't contact Hugging Face until you ask.","startTime":395.5797101449275,"endTime":399.17391304347825,"audioSegment":0},{"text":"Adding an MLX model now also checks its video settings for program code,","startTime":399.17391304347825,"endTime":402.768115942029,"audioSegment":0},{"text":"and turns the model away when a settings file is too large to check, instead of letting it through unchecked.","startTime":402.768115942029,"endTime":406.36231884057975,"audioSegment":0},{"text":"The tryout after a model download now waits until no other model has worked for three minutes.","startTime":406.36231884057975,"endTime":409.95652173913044,"audioSegment":0},{"text":"It had unloaded a model a task was still using,","startTime":409.95652173913044,"endTime":413.5507246376811,"audioSegment":0},{"text":"between two of the task's turns.","startTime":413.5507246376811,"endTime":417.1449275362319,"audioSegment":0},{"text":"An on-device model that gets stuck repeating itself now has only that reply stopped,","startTime":417.1449275362319,"endTime":420.7391304347826,"audioSegment":0},{"text":"and the engine keeps serving your other chats and tasks.","startTime":420.7391304347826,"endTime":424.33333333333337,"audioSegment":0},{"text":"A second time on the same engine within half an hour restarts it.","startTime":424.33333333333337,"endTime":427.92753623188406,"audioSegment":0},{"text":"When a crew member opens several files at once,","startTime":427.92753623188406,"endTime":431.52173913043475,"audioSegment":0},{"text":"an Office document among them is now converted to text, as it is when opened alone.","startTime":431.52173913043475,"endTime":435.1159420289855,"audioSegment":0},{"text":"A review had reported a finished deck as one that would not open.","startTime":435.1159420289855,"endTime":438.71014492753625,"audioSegment":0},{"text":"A plan's citation check no longer counts a report that cites itself as a source.","startTime":438.71014492753625,"endTime":442.304347826087,"audioSegment":0},{"text":"After making a picture,","startTime":442.304347826087,"endTime":445.8985507246377,"audioSegment":0},{"text":"a crew member is now told how to animate it when an installed video model can.","startTime":445.8985507246377,"endTime":449.4927536231884,"audioSegment":0},{"text":"A permission check had kept that hint from ever appearing.","startTime":449.4927536231884,"endTime":453.0869565217391,"audioSegment":0},{"text":"When a video render fails on a paired server,","startTime":453.0869565217391,"endTime":456.6811594202899,"audioSegment":0},{"text":"the message no longer shows file paths from that computer.","startTime":456.6811594202899,"endTime":460.27536231884056,"audioSegment":0},{"text":"It gives a request number to look up in that server's log.","startTime":460.27536231884056,"endTime":463.8695652173913,"audioSegment":0},{"text":"An app update keeps a schedule time you changed.","startTime":463.8695652173913,"endTime":467.463768115942,"audioSegment":0},{"text":"It used to reset the time to the one in the new version.","startTime":467.463768115942,"endTime":471.05797101449275,"audioSegment":0},{"text":"An app in an archived or read-only project,","startTime":471.05797101449275,"endTime":474.6521739130435,"audioSegment":0},{"text":"or one shared by every account on this computer, now offers its update for you to apply.","startTime":474.6521739130435,"endTime":478.2463768115942,"audioSegment":0},{"text":"Its update line used to say \"An update is being applied.\" and never finish.","startTime":478.2463768115942,"endTime":481.84057971014494,"audioSegment":0},{"text":"In a narrow window, a project's Output page now moves aside on the Settings tab,","startTime":481.84057971014494,"endTime":485.4347826086956,"audioSegment":0},{"text":"as it already did on Tasks.","startTime":485.4347826086956,"endTime":489.0289855072464,"audioSegment":0},{"text":"Apps connected to Gezel, such as DocBlocks, now list the recommended image models first,","startTime":489.0289855072464,"endTime":492.6231884057971,"audioSegment":0},{"text":"instead of whichever model's id sorts first.","startTime":492.6231884057971,"endTime":496.2173913043478,"audioSegment":0},{"text":"After a chat model downloads, they keep showing its name,","startTime":496.2173913043478,"endTime":499.81159420289856,"audioSegment":0},{"text":"such as \"Qwen 3.5 (0.8B, Q4)\", instead of its id.","startTime":499.81159420289856,"endTime":503.40579710144925,"audioSegment":0},{"text":"Catalog content updated (gilde 0.3.10).","startTime":503.40579710144925,"endTime":507,"audioSegment":0},{"text":"Exporting a document to PowerPoint puts its footnotes in the speaker notes of the slides that cite them,","startTime":507,"endTime":510.8333333333333,"audioSegment":0},{"text":"instead of leaving them out or printing them on the slide.","startTime":510.8333333333333,"endTime":514.6666666666666,"audioSegment":0},{"text":"In a slideshow, a slide with a video stays up until the video has played,","startTime":514.6666666666666,"endTime":518.5,"audioSegment":0},{"text":"trims and cuts included, instead of moving on partway through. A table,","startTime":518.5,"endTime":522.3333333333334,"audioSegment":0},{"text":"diagram or scene at the end of a document now fills the space left in the window instead of stopping at a fixed height.","startTime":522.3333333333334,"endTime":526.1666666666666,"audioSegment":0},{"text":"Short tables and diagrams you sized yourself keep their size.","startTime":526.1666666666666,"endTime":530,"audioSegment":0},{"text":"A document that ends in a diagram, table or code block always has a place after it to keep typing,","startTime":530,"endTime":533.8333333333334,"audioSegment":0},{"text":"without an extra blank line in the file.","startTime":533.8333333333334,"endTime":537.6666666666666,"audioSegment":0},{"text":"Checklists on slides show check boxes instead of [ ] and [x],","startTime":537.6666666666666,"endTime":541.5,"audioSegment":0},{"text":"and an empty checklist item is no longer dropped when the document is saved.","startTime":541.5,"endTime":545.3333333333334,"audioSegment":0},{"text":"A data file shown in a document shows its name with spaces,","startTime":545.3333333333334,"endTime":549.1666666666666,"audioSegment":0},{"text":"such as sales 2.csv, instead of sales%202.csv.","startTime":549.1666666666666,"endTime":553,"audioSegment":0},{"text":"A slide deck a crew member makes now draws a short list as a picture of how its items relate: a numbered list as steps,","startTime":553,"endTime":556.8333333333334,"audioSegment":0},{"text":"Label: detail items as cards, dated items as a timeline.","startTime":556.8333333333334,"endTime":560.6666666666666,"audioSegment":0},{"text":"Only a list that is a slide's whole body is drawn,","startTime":560.6666666666666,"endTime":564.5,"audioSegment":0},{"text":"and the shapes stay editable in PowerPoint.","startTime":564.5,"endTime":568.3333333333334,"audioSegment":0},{"text":"Document editor updated (Squisq 2.13.16),","startTime":568.3333333333334,"endTime":572.1666666666666,"audioSegment":0},{"text":"and the document maker crew members use (DocBlocks 2.7.16).","startTime":572.1666666666666,"endTime":576,"audioSegment":0},{"text":"gezel task wait <ref> and gezel do … --wait now print where a finished task's result is: the main file,","startTime":576,"endTime":580.0588235294117,"audioSegment":0},{"text":"what else it made, and its folder.","startTime":580.0588235294117,"endTime":584.1176470588235,"audioSegment":0},{"text":"gezel task wait <ref> --out <dir> copies it into that folder.","startTime":584.1176470588235,"endTime":588.1764705882352,"audioSegment":0},{"text":"gezel run sends text you pipe or redirect to it after the prompt: gezel run \"Summarize these notes for the board\" < notes.txt,","startTime":588.1764705882352,"endTime":592.2352941176471,"audioSegment":0},{"text":"or git diff | gezel run \"Write a commit message for this change\".","startTime":592.2352941176471,"endTime":596.2941176470588,"audioSegment":0},{"text":"gezel run no longer prints the service's warnings above the reply.","startTime":596.2941176470588,"endTime":600.3529411764706,"audioSegment":0},{"text":"They go to the service log, and only errors reach the terminal.","startTime":600.3529411764706,"endTime":604.4117647058823,"audioSegment":0},{"text":"gezel model list marks the model chats use and the models another Gezel on this computer shares.","startTime":604.4117647058823,"endTime":608.4705882352941,"audioSegment":0},{"text":"gezel model pull downloads nothing when a shared copy is already here.","startTime":608.4705882352941,"endTime":612.5294117647059,"audioSegment":0},{"text":"gezel agent show and gezel agent output-limit take a crew member's name as well as an id.","startTime":612.5294117647059,"endTime":616.5882352941177,"audioSegment":0},{"text":"When you let gezel do change a folder's files, with --allow-edits or by answering yes,","startTime":616.5882352941177,"endTime":620.6470588235294,"audioSegment":0},{"text":"and the task then fails to start, the folder goes back to how it was.","startTime":620.6470588235294,"endTime":624.7058823529412,"audioSegment":0},{"text":"gezel knowledge export-parquet downloads DuckDB when it is missing and you add --download.","startTime":624.7058823529412,"endTime":628.7647058823529,"audioSegment":0},{"text":"Without it, the message names the command that gets DuckDB,","startTime":628.7647058823529,"endTime":632.8235294117648,"audioSegment":0},{"text":"instead of pointing at the desktop app.","startTime":632.8235294117648,"endTime":636.8823529411765,"audioSegment":0},{"text":"Download progress written to a file or a log shows the size once and then 25,","startTime":636.8823529411765,"endTime":640.9411764705883,"audioSegment":0},{"text":"50 and 75%, instead of hundreds of updates on one line.","startTime":640.9411764705883,"endTime":645,"audioSegment":0},{"text":"Docbench: models for document work — what is measured, how to read a score,","startTime":645,"endTime":649,"audioSegment":0},{"text":"and how the AI reviewer is checked before a round is published.","startTime":649,"endTime":653,"audioSegment":0},{"text":"What leaves this computer now lists the models Gezel downloads on its own and the catalog updates you turn on,","startTime":653,"endTime":657,"audioSegment":0},{"text":"and which security levels stop them.","startTime":657,"endTime":661,"audioSegment":0},{"text":"Each downloadable entry in /v1/models carries its docbench score and a docbench_recommendation that ranks models for document work on this machine.","startTime":661,"endTime":664.5714285714286,"audioSegment":0},{"text":"The phone's catalog carries the same.","startTime":664.5714285714286,"endTime":668.1428571428571,"audioSegment":0},{"text":"Installed catalog models in /v1/models carry the catalog's display name,","startTime":668.1428571428571,"endTime":671.7142857142857,"audioSegment":0},{"text":"and /v1/images/models lists the curated image models first, best first.","startTime":671.7142857142857,"endTime":675.2857142857143,"audioSegment":0},{"text":"A @bendyline/gezel-capacitor release no longer waits for a native build when native/runtime has moved past the pinned release.","startTime":675.2857142857143,"endTime":678.8571428571429,"audioSegment":0},{"text":"It ships the pinned release as built,","startTime":678.8571428571429,"endTime":682.4285714285714,"audioSegment":0},{"text":"and still refuses a plugin that calls runtime API that release lacks.","startTime":682.4285714285714,"endTime":686,"audioSegment":0},{"text":"If you run Qwen 3.8 27B,","startTime":686,"endTime":689.2,"audioSegment":0},{"text":"start a plan that writes a report and watch Activity show it being checked.","startTime":689.2,"endTime":692.4,"audioSegment":0},{"text":"To skip that step,","startTime":692.4,"endTime":695.6,"audioSegment":0},{"text":"use Settings → Artificial intelligence → Check work before handing it in.","startTime":695.6,"endTime":698.8,"audioSegment":0},{"text":"Open a project's Settings → Preferences → Icon and give it a mark of its own.","startTime":698.8,"endTime":702,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26317 — 13 November 2026","subtitle":"On a model where it was shown to help, a report, document or spec now gets one more read against your request before it is handed in. Moving around the app is steadier: a project you come back to is where you left it, and views appear whole instead of filling in piece by piece. Projects can wear an icon of their own, drawn by a model or uploaded. And Help gains a scorecard for how well each local model does document work.","ambientMotion":"zoomIn"}}</script>
