t":8813},"end":{"line":76,"column":130,"offset":8940}}}],"position":{"start":{"line":76,"column":1,"offset":8811},"end":{"line":76,"column":130,"offset":8940}}}],"position":{"start":{"line":73,"column":1,"offset":7989},"end":{"line":76,"column":130,"offset":8940}}}],"autoTemplate":true,"templateData":{"items":["The Output Pane API (window.gezel) is documented and at version 1. Interactive pages pinned into a project's Output pane get a frozen gezel object with page, tools, data and ui — reads are declared in the project type's manifest and enforced per request on the server, so a page can never read past its declaration. The earlier hand-rolled postMessage pattern keeps working.","Pull request files and diffs are properly paginated for tools that read them, so a large PR no longer silently loses its later files.","Dependency operations in the repository are leased. pnpm deps:status diagnoses, pnpm deps:install adds only what is genuinely missing, and pnpm deps:repair is the one explicit reconciliation path; builds and tests hold a shared read lease and can run alongside each other.","node-pty is now an optional dependency, so an npm install of gezel no longer fails on machines without a build toolchain."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":432,"duration":18,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":78,"column":4,"offset":8945},"end":{"line":78,"column":37,"offset":8978}}}],"position":{"start":{"line":78,"column":1,"offset":8942},"end":{"line":78,"column":37,"offset":8978}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Two settings are worth a visit. If connectors disappeared from your projects, they are behind ","position":{"start":{"line":80,"column":1,"offset":8980},"end":{"line":80,"column":95,"offset":9074}}},{"type":"strong","children":[{"type":"text","value":"Settings → Advanced → Show very early work-in-progress features","position":{"start":{"line":80,"column":97,"offset":9076},"end":{"line":80,"column":160,"offset":9139}}}],"position":{"start":{"line":80,"column":95,"offset":9074},"end":{"line":80,"column":162,"offset":9141}}},{"type":"text","value":" — turn it on and they come back exactly as they were. And if you run models on your own machine, the new scorecard entries may change which one you want: start at the ","position":{"start":{"line":80,"column":162,"offset":9141},"end":{"line":80,"column":330,"offset":9309}}},{"type":"link","url":"../../model-scorecard/","children":[{"type":"text","value":"Model scorecard","position":{"start":{"line":80,"column":331,"offset":9310},"end":{"line":80,"column":346,"offset":9325}}}],"position":{"start":{"line":80,"column":330,"offset":9309},"end":{"line":80,"column":371,"offset":9350}}},{"type":"text","value":".","position":{"start":{"line":80,"column":371,"offset":9350},"end":{"line":80,"column":372,"offset":9351}}}],"position":{"start":{"line":80,"column":1,"offset":8980},"end":{"line":80,"column":372,"offset":9351}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Two days of work since 1.26224, and a dense two days.","startTime":0,"endTime":4.6,"audioSegment":0},{"text":"If you read only one thing: the problems gezel finds in your files stopped being a list you read and became work you can hand to someone,","startTime":4.6,"endTime":9.2,"audioSegment":0},{"text":"the terminal version of gezel caught up with the app, and the model scoreboard more than doubled.","startTime":9.2,"endTime":13.799999999999999,"audioSegment":0},{"text":"Also new: Qwen 3.8 27B (Q4) is now available,","startTime":13.799999999999999,"endTime":18.4,"audioSegment":0},{"text":"with further testing and tuning to follow over the next few days.","startTime":18.4,"endTime":23,"audioSegment":0},{"text":"Gezel's boekwachter — the keeper of the books,","startTime":23,"endTime":27.142857142857142,"audioSegment":0},{"text":"the crew member who reads through a project and notes what looks wrong — used to produce a list.","startTime":27.142857142857142,"endTime":31.285714285714285,"audioSegment":0},{"text":"You read it, and then it was on you.","startTime":31.285714285714285,"endTime":35.42857142857143,"audioSegment":0},{"text":"Now each finding is a tracked issue with its own reference (BW-1,","startTime":35.42857142857143,"endTime":39.57142857142857,"audioSegment":0},{"text":"BW-2, and so on) that survives restarts and re-scans.","startTime":39.57142857142857,"endTime":43.714285714285715,"audioSegment":0},{"text":"Each one is open, in progress, resolved or dismissed,","startTime":43.714285714285715,"endTime":47.85714285714286,"audioSegment":0},{"text":"and you move it between those yourself.","startTime":47.85714285714286,"endTime":52,"audioSegment":0},{"text":"Closed ones fold away until you ask to see them.","startTime":52,"endTime":56.142857142857146,"audioSegment":0},{"text":"The part that matters: there is now a Fix this button.","startTime":56.142857142857146,"endTime":60.28571428571429,"audioSegment":0},{"text":"Press it and gezel opens a dialog that has already worked out what kind of gezel this file needs — a writer for a document,","startTime":60.28571428571429,"endTime":64.42857142857143,"audioSegment":0},{"text":"a designer for an image, a developer for code, a researcher for a spreadsheet — and offers you the ones on your crew who fit.","startTime":64.42857142857143,"endTime":68.57142857142858,"audioSegment":0},{"text":"Choose one and it becomes a task, linked back to the issue, so the file,","startTime":68.57142857142858,"endTime":72.71428571428572,"audioSegment":0},{"text":"the finding and the work are the same thread rather than three things you hold in your head.","startTime":72.71428571428572,"endTime":76.85714285714286,"audioSegment":0},{"text":"Each file also shows a plain health score out of ten and the reason behind it.","startTime":76.85714285714286,"endTime":81,"audioSegment":0},{"text":"If you use gezel from a terminal,","startTime":81,"endTime":84.33333333333333,"audioSegment":0},{"text":"this release is mostly for you.","startTime":84.33333333333333,"endTime":87.66666666666667,"audioSegment":0},{"text":"Many stability fixes for the npm '@bendyline/gezel-cli' package and command line.","startTime":87.66666666666667,"endTime":91,"audioSegment":0},{"text":"See the docs at https://gezel.com/docs/cli-reference/ for more information.","startTime":91,"endTime":94.33333333333333,"audioSegment":0},{"text":"/open — type it in a chat and gezel offers you the files that conversation just touched,","startTime":94.33333333333333,"endTime":97.66666666666667,"audioSegment":0},{"text":"plus the project's artifacts and workspace folders, and opens the one you pick.","startTime":97.66666666666667,"endTime":101,"audioSegment":0},{"text":"This works in the desktop app's message box too.","startTime":101,"endTime":104.33333333333334,"audioSegment":0},{"text":"gezel mode <read-only|reactive|reactive+tasks|full-play>, or /mode inside a session —","startTime":104.33333333333334,"endTime":107.66666666666667,"audioSegment":0},{"text":"the same four settings for how much gezel is allowed to do on its own that the app has, now in one word from the command line.","startTime":107.66666666666667,"endTime":111,"audioSegment":0},{"text":"gezel do <craftbook> and /do —","startTime":111,"endTime":114.33333333333334,"audioSegment":0},{"text":"start a piece of standard work (a craftbook is gezel's word for a written-down procedure) without leaving the terminal.","startTime":114.33333333333334,"endTime":117.66666666666667,"audioSegment":0},{"text":"/allow and /disallow —","startTime":117.66666666666667,"endTime":121,"audioSegment":0},{"text":"turn a project's write permissions on and off in place.","startTime":121,"endTime":124.33333333333334,"audioSegment":0},{"text":"/model download —","startTime":124.33333333333334,"endTime":127.66666666666667,"audioSegment":0},{"text":"pick and fetch a new on-device model from inside a session.","startTime":127.66666666666667,"endTime":131,"audioSegment":0},{"text":"First-run setup in the terminal now shows the same model information the app does,","startTime":131,"endTime":134.33333333333334,"audioSegment":0},{"text":"and pressing Ctrl+C actually shuts down the background service it started instead of leaving it running.","startTime":134.33333333333334,"endTime":137.66666666666669,"audioSegment":0},{"text":"The rest of the commands are in the command-line reference.","startTime":137.66666666666669,"endTime":141,"audioSegment":0},{"text":"Your gezels' memories are ordinary Markdown files,","startTime":141,"endTime":144.63636363636363,"audioSegment":0},{"text":"and a search index sits on top of them to make recall fast.","startTime":144.63636363636363,"endTime":148.27272727272728,"audioSegment":0},{"text":"Previously, trouble with the index could take memory down with it —","startTime":148.27272727272728,"endTime":151.9090909090909,"audioSegment":0},{"text":"a first-time download of the search model failing because you were offline was enough to turn memory off for the rest of the session.","startTime":151.9090909090909,"endTime":155.54545454545453,"audioSegment":0},{"text":"That is fixed in three places.","startTime":155.54545454545453,"endTime":159.1818181818182,"audioSegment":0},{"text":"Saving a memory now always writes the Markdown first,","startTime":159.1818181818182,"endTime":162.8181818181818,"audioSegment":0},{"text":"and reports the indexing as deferred rather than failing; the index catches up on its own afterwards.","startTime":162.8181818181818,"endTime":166.45454545454544,"audioSegment":0},{"text":"Searching falls back to plain text search when the fast path is unavailable,","startTime":166.45454545454544,"endTime":170.0909090909091,"audioSegment":0},{"text":"and tells you it did.","startTime":170.0909090909091,"endTime":173.72727272727272,"audioSegment":0},{"text":"And a failed model download is now treated as something that might clear —","startTime":173.72727272727272,"endTime":177.36363636363637,"audioSegment":0},{"text":"gezel waits a minute and tries again, instead of concluding that memory is broken.","startTime":177.36363636363637,"endTime":181,"audioSegment":0},{"text":"Connectors — the things that pull a calendar, a repository or a social account into a project —","startTime":181,"endTime":185.76923076923077,"audioSegment":0},{"text":"have moved behind a switch in Settings → Advanced → Show very early work-in-progress features, and it is off.","startTime":185.76923076923077,"endTime":190.53846153846155,"audioSegment":0},{"text":"So are the project types and craftbooks that depend on them.","startTime":190.53846153846155,"endTime":195.30769230769232,"audioSegment":0},{"text":"This is a step back in visibility and a step forward in honesty.","startTime":195.30769230769232,"endTime":200.07692307692307,"audioSegment":0},{"text":"They are not finished, they change shape between releases,","startTime":200.07692307692307,"endTime":204.84615384615384,"audioSegment":0},{"text":"and having them sitting in every project's settings implied a stability they do not have yet.","startTime":204.84615384615384,"endTime":209.6153846153846,"audioSegment":0},{"text":"Behind that switch, they got considerably better.","startTime":209.6153846153846,"endTime":214.3846153846154,"audioSegment":0},{"text":"Bluesky, X, LinkedIn and Instagram joined the connectors gezel can talk to, with a deliberate three-step path to publishing anything: a gezel drafts a post,","startTime":214.3846153846154,"endTime":219.15384615384616,"audioSegment":0},{"text":"queues it, and only then can publish it — and publishing is denied unless you have said otherwise, one time at a time.","startTime":219.15384615384616,"endTime":223.9230769230769,"audioSegment":0},{"text":"Overnight work never publishes; it leaves things in the outbox for you.","startTime":223.9230769230769,"endTime":228.69230769230768,"audioSegment":0},{"text":"Gezel ships no social-media app credentials of its own, so connecting an account means registering your own developer app,","startTime":228.69230769230768,"endTime":233.46153846153845,"audioSegment":0},{"text":"which the connection panel now walks you through and stores the secret in your operating system's keychain.","startTime":233.46153846153845,"endTime":238.23076923076923,"audioSegment":0},{"text":"Posts and mentions that come back land in the project's artifacts and are searchable alongside everything else.","startTime":238.23076923076923,"endTime":243,"audioSegment":0},{"text":"The Model scorecard went from four models to nine.","startTime":243,"endTime":246.5625,"audioSegment":0},{"text":"The new entries are gemma4-26b, qwen3.6-27b, qwen3.6-35b-a3b, muse-glimmer-30b and nemotron3.5-lightning-30b,","startTime":246.5625,"endTime":250.125,"audioSegment":0},{"text":"all measured the same way as the first four: every job run three times on a real machine and checked by a program.","startTime":250.125,"endTime":253.6875,"audioSegment":0},{"text":"The picture that emerges is more interesting than \"bigger is better\".","startTime":253.6875,"endTime":257.25,"audioSegment":0},{"text":"On general capability, gemma4-26b and qwen3.6-27b both finished every job.","startTime":257.25,"endTime":260.8125,"audioSegment":0},{"text":"On the office and knowledge set,","startTime":260.8125,"endTime":264.375,"audioSegment":0},{"text":"the small ornith-9b still beats several models three times its size.","startTime":264.375,"endTime":267.9375,"audioSegment":0},{"text":"And qwen3.6-27b and qwen3.6-35b-a3b earn the highest marks from the separate quality read,","startTime":267.9375,"endTime":271.5,"audioSegment":0},{"text":"at a fraction of the memory gemma4-26b needs.","startTime":271.5,"endTime":275.0625,"audioSegment":0},{"text":"How we test models explains what the numbers do and do not tell you.","startTime":275.0625,"endTime":278.625,"audioSegment":0},{"text":"It is worth five minutes before you pick.","startTime":278.625,"endTime":282.1875,"audioSegment":0},{"text":"While you are on the models screen,","startTime":282.1875,"endTime":285.75,"audioSegment":0},{"text":"every catalog model now says who made it and who prepared the version you download.","startTime":285.75,"endTime":289.3125,"audioSegment":0},{"text":"Those are often different organizations — a company trains the model,","startTime":289.3125,"endTime":292.875,"audioSegment":0},{"text":"someone else converts and compresses it so it runs on your machine — and until now gezel showed you only one name.","startTime":292.875,"endTime":296.4375,"audioSegment":0},{"text":"The terminal app shows the same line when it offers you a model.","startTime":296.4375,"endTime":300,"audioSegment":0},{"text":"A job's single gezel is now called the Builder rather than the Ambachtsman.","startTime":300,"endTime":303.6666666666667,"audioSegment":0},{"text":"Same gezel, a simpler word.","startTime":303.6666666666667,"endTime":307.3333333333333,"audioSegment":0},{"text":"Codex and Claude sessions have their own permission setting per project,","startTime":307.3333333333333,"endTime":311,"audioSegment":0},{"text":"separate from what gezel's own tools may do — so you can let one edit and keep the other reading.","startTime":311,"endTime":314.6666666666667,"audioSegment":0},{"text":"Settings → About lists your running local engines and,","startTime":314.6666666666667,"endTime":318.3333333333333,"audioSegment":0},{"text":"for each, the context window it actually got at launch.","startTime":318.3333333333333,"endTime":322,"audioSegment":0},{"text":"A model that suddenly seems to have lost the plot is very often one whose window came out smaller than the instructions it carries;","startTime":322,"endTime":325.6666666666667,"audioSegment":0},{"text":"this turns that from a log hunt into a glance.","startTime":325.6666666666667,"endTime":329.3333333333333,"audioSegment":0},{"text":"The \"stop everything\" button now also unloads local engines and drops gezel to Reactive,","startTime":329.3333333333333,"endTime":333,"audioSegment":0},{"text":"and it is reachable from Settings as well as the engine pill.","startTime":333,"endTime":336.6666666666667,"audioSegment":0},{"text":"Model files gezel cannot read appear under \"Models needing attention\" with their size and an Update or Remove button,","startTime":336.6666666666667,"endTime":340.3333333333333,"audioSegment":0},{"text":"instead of vanishing while still using your disk.","startTime":340.3333333333333,"endTime":344,"audioSegment":0},{"text":"App updates show a real download progress bar rather than an unmoving \"downloading\".","startTime":344,"endTime":347.6666666666667,"audioSegment":0},{"text":"If gezel itself crashes,","startTime":347.6666666666667,"endTime":351.3333333333333,"audioSegment":0},{"text":"you get a plain dialog offering to open a pre-filled report in your browser.","startTime":351.3333333333333,"endTime":355,"audioSegment":0},{"text":"Nothing is sent anywhere unless you press it.","startTime":355,"endTime":358.6666666666667,"audioSegment":0},{"text":"Your graphics setup is re-checked at every launch,","startTime":358.6666666666667,"endTime":362.3333333333333,"audioSegment":0},{"text":"so installing or removing a driver is noticed instead of remembered wrongly from the first run.","startTime":362.3333333333333,"endTime":366,"audioSegment":0},{"text":"The prompt cache display no longer counts shared groundwork as conversations,","startTime":366,"endTime":369.66666666666663,"audioSegment":0},{"text":"so the number matches what you have open.","startTime":369.66666666666663,"endTime":373.3333333333333,"audioSegment":0},{"text":"Craftbooks now say what each step is supposed to produce,","startTime":373.3333333333333,"endTime":377,"audioSegment":0},{"text":"and the finished result is checked against that rather than against the attempt.","startTime":377,"endTime":380.66666666666663,"audioSegment":0},{"text":"Asking for the same piece of work twice in one turn returns the task already running instead of starting a duplicate.","startTime":380.66666666666663,"endTime":384.3333333333333,"audioSegment":0},{"text":"Refreshed underlying editor and catalog content packages (squisq 2.7.2, gilde 0.1.28).","startTime":384.3333333333333,"endTime":388,"audioSegment":0},{"text":"The Output Pane API (window.gezel) is documented and at version 1.","startTime":388,"endTime":392,"audioSegment":0},{"text":"Interactive pages pinned into a project's Output pane get a frozen gezel object with page, tools, data and ui —","startTime":392,"endTime":396,"audioSegment":0},{"text":"reads are declared in the project type's manifest and enforced per request on the server, so a page can never read past its declaration.","startTime":396,"endTime":400,"audioSegment":0},{"text":"The earlier hand-rolled postMessage pattern keeps working.","startTime":400,"endTime":404,"audioSegment":0},{"text":"Pull request files and diffs are properly paginated for tools that read them,","startTime":404,"endTime":408,"audioSegment":0},{"text":"so a large PR no longer silently loses its later files.","startTime":408,"endTime":412,"audioSegment":0},{"text":"Dependency operations in the repository are leased.","startTime":412,"endTime":416,"audioSegment":0},{"text":"pnpm deps:status diagnoses, pnpm deps:install adds only what is genuinely missing,","startTime":416,"endTime":420,"audioSegment":0},{"text":"and pnpm deps:repair is the one explicit reconciliation path; builds and tests hold a shared read lease and can run alongside each other.","startTime":420,"endTime":424,"audioSegment":0},{"text":"node-pty is now an optional dependency,","startTime":424,"endTime":428,"audioSegment":0},{"text":"so an npm install of gezel no longer fails on machines without a build toolchain.","startTime":428,"endTime":432,"audioSegment":0},{"text":"Two settings are worth a visit.","startTime":432,"endTime":435.6,"audioSegment":0},{"text":"If connectors disappeared from your projects, they are behind Settings → Advanced → Show very early work-in-progress features —","startTime":435.6,"endTime":439.2,"audioSegment":0},{"text":"turn it on and they come back exactly as they were.","startTime":439.2,"endTime":442.8,"audioSegment":0},{"text":"And if you run models on your own machine,","startTime":442.8,"endTime":446.4,"audioSegment":0},{"text":"the new scorecard entries may change which one you want: start at the Model scorecard.","startTime":446.4,"endTime":450,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26226 — 14 August 2026","subtitle":"Two days of work since 1.26224, and a dense two days.","ambientMotion":"zoomIn"}}</script>
