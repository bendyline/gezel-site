t":8233}}}],"position":{"start":{"line":79,"column":1,"offset":8197},"end":{"line":79,"column":37,"offset":8233}}},"title":"Things to see and do after update","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Open ","position":{"start":{"line":81,"column":3,"offset":8237},"end":{"line":81,"column":8,"offset":8242}}},{"type":"strong","children":[{"type":"text","value":"Settings → This PC (llama)","position":{"start":{"line":81,"column":10,"offset":8244},"end":{"line":81,"column":36,"offset":8270}}}],"position":{"start":{"line":81,"column":8,"offset":8242},"end":{"line":81,"column":38,"offset":8272}}},{"type":"text","value":" (or the MLX page on a Mac) and try ","position":{"start":{"line":81,"column":38,"offset":8272},"end":{"line":81,"column":74,"offset":8308}}},{"type":"strong","children":[{"type":"text","value":"Add a model…","position":{"start":{"line":81,"column":76,"offset":8310},"end":{"line":81,"column":88,"offset":8322}}}],"position":{"start":{"line":81,"column":74,"offset":8308},"end":{"line":81,"column":90,"offset":8324}}},{"type":"text","value":" with a model you have wanted to run.","position":{"start":{"line":81,"column":90,"offset":8324},"end":{"line":81,"column":127,"offset":8361}}}],"position":{"start":{"line":81,"column":3,"offset":8237},"end":{"line":81,"column":127,"offset":8361}}}],"position":{"start":{"line":81,"column":1,"offset":8235},"end":{"line":81,"column":127,"offset":8361}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"If you prefer the navigation on the right, set ","position":{"start":{"line":82,"column":3,"offset":8364},"end":{"line":82,"column":50,"offset":8411}}},{"type":"strong","children":[{"type":"text","value":"Settings → General → Sidebar position","position":{"start":{"line":82,"column":52,"offset":8413},"end":{"line":82,"column":89,"offset":8450}}}],"position":{"start":{"line":82,"column":50,"offset":8411},"end":{"line":82,"column":91,"offset":8452}}},{"type":"text","value":".","position":{"start":{"line":82,"column":91,"offset":8452},"end":{"line":82,"column":92,"offset":8453}}}],"position":{"start":{"line":82,"column":3,"offset":8364},"end":{"line":82,"column":92,"offset":8453}}}],"position":{"start":{"line":82,"column":1,"offset":8362},"end":{"line":82,"column":92,"offset":8453}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"If you use a project made from an app, look in its ","position":{"start":{"line":83,"column":3,"offset":8456},"end":{"line":83,"column":54,"offset":8507}}},{"type":"strong","children":[{"type":"text","value":"Settings","position":{"start":{"line":83,"column":56,"offset":8509},"end":{"line":83,"column":64,"offset":8517}}}],"position":{"start":{"line":83,"column":54,"offset":8507},"end":{"line":83,"column":66,"offset":8519}}},{"type":"text","value":" for ","position":{"start":{"line":83,"column":66,"offset":8519},"end":{"line":83,"column":71,"offset":8524}}},{"type":"strong","children":[{"type":"text","value":"An update is ready","position":{"start":{"line":83,"column":73,"offset":8526},"end":{"line":83,"column":91,"offset":8544}}}],"position":{"start":{"line":83,"column":71,"offset":8524},"end":{"line":83,"column":93,"offset":8546}}},{"type":"text","value":".","position":{"start":{"line":83,"column":93,"offset":8546},"end":{"line":83,"column":94,"offset":8547}}}],"position":{"start":{"line":83,"column":3,"offset":8456},"end":{"line":83,"column":94,"offset":8547}}}],"position":{"start":{"line":83,"column":1,"offset":8454},"end":{"line":83,"column":94,"offset":8547}}}],"position":{"start":{"line":81,"column":1,"offset":8235},"end":{"line":83,"column":94,"offset":8547}}}],"autoTemplate":true,"templateData":{"items":["Open Settings → This PC (llama) (or the MLX page on a Mac) and try Add a model… with a model you have wanted to run.","If you prefer the navigation on the right, set Settings → General → Sidebar position.","If you use a project made from an app, look in its Settings for An update is ready."],"ordered":false,"title":"Things to see and do after update"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"You can now add a chat model that isn't in Gezel's catalog,","startTime":0,"endTime":3.857142857142857,"audioSegment":0},{"text":"from a Hugging Face link or a .gguf file already on your computer.","startTime":3.857142857142857,"endTime":7.714285714285714,"audioSegment":0},{"text":"Gezel checks it before anything downloads and tries it once it is here.","startTime":7.714285714285714,"endTime":11.571428571428571,"audioSegment":0},{"text":"Apps in your projects now update themselves when an update changes nothing of yours.","startTime":11.571428571428571,"endTime":15.428571428571429,"audioSegment":0},{"text":"The title bar gains Back and Forward,","startTime":15.428571428571429,"endTime":19.285714285714285,"audioSegment":0},{"text":"and a few names change: the manual is Help, and craftbooks are Plans.","startTime":19.285714285714285,"endTime":23.142857142857142,"audioSegment":0},{"text":"If you read only one thing: open your engine's page in Settings and look at Add a model….","startTime":23.142857142857142,"endTime":27,"audioSegment":0},{"text":"The catalog is a short list of models Gezel has tested.","startTime":27,"endTime":30.82608695652174,"audioSegment":0},{"text":"Until now, it was the only list you could choose from.","startTime":30.82608695652174,"endTime":34.65217391304348,"audioSegment":0},{"text":"On your engine's page in Settings (This PC (llama), or This Mac (Apple MLX) on a Mac),","startTime":34.65217391304348,"endTime":38.47826086956522,"audioSegment":0},{"text":"choose Add a model…, then From Hugging Face or a file….","startTime":38.47826086956522,"endTime":42.30434782608695,"audioSegment":0},{"text":"Paste a link to a model on Hugging Face,","startTime":42.30434782608695,"endTime":46.130434782608695,"audioSegment":0},{"text":"or choose a .gguf file you already downloaded with another app.","startTime":46.130434782608695,"endTime":49.95652173913044,"audioSegment":0},{"text":"Gezel runs GGUF models on every computer,","startTime":49.95652173913044,"endTime":53.78260869565217,"audioSegment":0},{"text":"and MLX models on Apple silicon Macs.","startTime":53.78260869565217,"endTime":57.608695652173914,"audioSegment":0},{"text":"Nothing downloads until you have read a review of the model and chosen Download.","startTime":57.608695652173914,"endTime":61.434782608695656,"audioSegment":0},{"text":"The review checks that anyone can download it and every file has a checksum, that it is a chat model and not an add-on part,","startTime":61.434782608695656,"endTime":65.26086956521739,"audioSegment":0},{"text":"that this version of Gezel's engine can run it, that it brings its own conversation format, and that it fits your computer's memory and disk.","startTime":65.26086956521739,"endTime":69.08695652173913,"audioSegment":0},{"text":"Gezel downloads only the model's data files, never program code,","startTime":69.08695652173913,"endTime":72.91304347826087,"audioSegment":0},{"text":"and turns away an MLX model whose settings ask to run code.","startTime":72.91304347826087,"endTime":76.73913043478261,"audioSegment":0},{"text":"If a check fails, the review says why,","startTime":76.73913043478261,"endTime":80.56521739130434,"audioSegment":0},{"text":"and a smaller size of the same model often fits where the largest does not.","startTime":80.56521739130434,"endTime":84.3913043478261,"audioSegment":0},{"text":"Once the model is here, Gezel tries it: it starts the model, asks for a short reply,","startTime":84.3913043478261,"endTime":88.21739130434783,"audioSegment":0},{"text":"checks that the reply reads as language, and asks it to use a tool.","startTime":88.21739130434783,"endTime":92.04347826086956,"audioSegment":0},{"text":"The result appears beside the model in the engine's Models list.","startTime":92.04347826086956,"endTime":95.86956521739131,"audioSegment":0},{"text":"Gezel doesn't pick a model that failed for work on its own,","startTime":95.86956521739131,"endTime":99.69565217391305,"audioSegment":0},{"text":"but you can still choose it yourself.","startTime":99.69565217391305,"endTime":103.52173913043478,"audioSegment":0},{"text":"A model you add uses the settings of a tested catalog model built from the same base model when there is one,","startTime":103.52173913043478,"endTime":107.34782608695653,"audioSegment":0},{"text":"and the settings its author recommends when there isn't.","startTime":107.34782608695653,"endTime":111.17391304347827,"audioSegment":0},{"text":"Local models and tiers has more on choosing one.","startTime":111.17391304347827,"endTime":115,"audioSegment":0},{"text":"A project made from an app now moves to the app's newer versions on its own,","startTime":115,"endTime":118.81818181818181,"audioSegment":0},{"text":"as long as the update changes nothing of yours.","startTime":118.81818181818181,"endTime":122.63636363636364,"audioSegment":0},{"text":"Your data, your About and mission text, plans you edited and settings you changed stay as they are,","startTime":122.63636363636364,"endTime":126.45454545454545,"audioSegment":0},{"text":"and an update never runs in the middle of work.","startTime":126.45454545454545,"endTime":130.27272727272728,"audioSegment":0},{"text":"Some updates wait for you instead.","startTime":130.27272727272728,"endTime":134.0909090909091,"audioSegment":0},{"text":"One that would replace a script you changed, add a crew member, start something on a schedule,","startTime":134.0909090909091,"endTime":137.9090909090909,"audioSegment":0},{"text":"or write into a folder Gezel has no permission for shows An update is ready in the project's Settings.","startTime":137.9090909090909,"endTime":141.72727272727272,"audioSegment":0},{"text":"The dialog lists what changes and what stays the same,","startTime":141.72727272727272,"endTime":145.54545454545456,"audioSegment":0},{"text":"and a script it replaces is saved first in the project's artifacts, under app-updates.","startTime":145.54545454545456,"endTime":149.36363636363637,"audioSegment":0},{"text":"An app you added from a file,","startTime":149.36363636363637,"endTime":153.1818181818182,"audioSegment":0},{"text":"and a project you set to stay on its version, always wait for you.","startTime":153.1818181818182,"endTime":157,"audioSegment":0},{"text":"The title bar has Back and Forward keys, like a browser,","startTime":157,"endTime":160.10526315789474,"audioSegment":0},{"text":"and the arrow beside them lists the views you visited.","startTime":160.10526315789474,"endTime":163.21052631578948,"audioSegment":0},{"text":"Alt+Left and Alt+Right work too (Cmd+[ and Cmd+] on a Mac),","startTime":163.21052631578948,"endTime":166.31578947368422,"audioSegment":0},{"text":"and so do the side buttons on a mouse.","startTime":166.31578947368422,"endTime":169.42105263157896,"audioSegment":0},{"text":"Some names change:","startTime":169.42105263157896,"endTime":172.52631578947367,"audioSegment":0},{"text":"The built-in manual is Help, everywhere it appears.","startTime":172.52631578947367,"endTime":175.6315789473684,"audioSegment":0},{"text":"Craftbooks are Plans in the navigation.","startTime":175.6315789473684,"endTime":178.73684210526315,"audioSegment":0},{"text":"In a project where one crew member does all the work,","startTime":178.73684210526315,"endTime":181.8421052631579,"audioSegment":0},{"text":"they are its Main crew member.","startTime":181.8421052631579,"endTime":184.94736842105263,"audioSegment":0},{"text":"A crew's lead is still the Crew Lead.","startTime":184.94736842105263,"endTime":188.05263157894737,"audioSegment":0},{"text":"The places you use to build with Gezel fold into a group called More at the bottom of the navigation.","startTime":188.05263157894737,"endTime":191.1578947368421,"audioSegment":0},{"text":"It starts open if you told Gezel you write software or turned on advanced features.","startTime":191.1578947368421,"endTime":194.26315789473685,"audioSegment":0},{"text":"The title bar and a project's status bar are quieter for everyone else,","startTime":194.26315789473685,"endTime":197.36842105263156,"audioSegment":0},{"text":"and This PC stays in the title bar while a local model is in use.","startTime":197.36842105263156,"endTime":200.4736842105263,"audioSegment":0},{"text":"The navigation now sits on the left unless you chose a side.","startTime":200.4736842105263,"endTime":203.57894736842104,"audioSegment":0},{"text":"If you liked it on the right,","startTime":203.57894736842104,"endTime":206.68421052631578,"audioSegment":0},{"text":"move it back in Settings → General → Sidebar position.","startTime":206.68421052631578,"endTime":209.78947368421052,"audioSegment":0},{"text":"While Gezel starts, the window shows its real frame and navigation from the first moment,","startTime":209.78947368421052,"endTime":212.89473684210526,"audioSegment":0},{"text":"so nothing jumps when the app takes over.","startTime":212.89473684210526,"endTime":216,"audioSegment":0},{"text":"Activity shows each thing you asked for as one row,","startTime":216,"endTime":219.5,"audioSegment":0},{"text":"with the work it caused folded inside.","startTime":219.5,"endTime":223,"audioSegment":0},{"text":"A finished result can be put away: it moves under Finished earlier instead of leaving the list.","startTime":223,"endTime":226.5,"audioSegment":0},{"text":"Settings is also shorter, with its less-used pages gathered under More settings.","startTime":226.5,"endTime":230,"audioSegment":0},{"text":"You can type and send while a model is still loading,","startTime":230,"endTime":233.47368421052633,"audioSegment":0},{"text":"including during the first download.","startTime":233.47368421052633,"endTime":236.94736842105263,"audioSegment":0},{"text":"The message waits, and the composer shows Sends when ready.","startTime":236.94736842105263,"endTime":240.42105263157896,"audioSegment":0},{"text":"In a reply, a sentence the fact check could not find in any source is highlighted,","startTime":240.42105263157896,"endTime":243.89473684210526,"audioSegment":0},{"text":"instead of being mentioned only in the line under the reply.","startTime":243.89473684210526,"endTime":247.3684210526316,"audioSegment":0},{"text":"Save a copy… suggests the work's title as the file name,","startTime":247.3684210526316,"endTime":250.8421052631579,"audioSegment":0},{"text":"instead of report.docx.","startTime":250.8421052631579,"endTime":254.31578947368422,"audioSegment":0},{"text":"Settings → This PC (llama) and the Mac's MLX page have a Parallel workers setting: how many chats one loaded model answers at once.","startTime":254.31578947368422,"endTime":257.7894736842105,"audioSegment":0},{"text":"Automatic runs as many as fit in memory.","startTime":257.7894736842105,"endTime":261.2631578947368,"audioSegment":0},{"text":"On Claude Sonnet 5.5 and GPT-6.1 Sol,","startTime":261.2631578947368,"endTime":264.7368421052632,"audioSegment":0},{"text":"a plan now runs as one piece of work toward its goal.","startTime":264.7368421052632,"endTime":268.2105263157895,"audioSegment":0},{"text":"One crew member does it from start to finish, with the plan's steps as advice,","startTime":268.2105263157895,"endTime":271.6842105263158,"audioSegment":0},{"text":"and the plan's checks still decide when it is done.","startTime":271.6842105263158,"endTime":275.1578947368421,"audioSegment":0},{"text":"When you don't choose, a new project starts with a crew or with one main crew member working alone,","startTime":275.1578947368421,"endTime":278.63157894736844,"audioSegment":0},{"text":"depending on the model you use.","startTime":278.63157894736844,"endTime":282.10526315789474,"audioSegment":0},{"text":"When a cloud service refuses requests for coming too fast,","startTime":282.10526315789474,"endTime":285.57894736842104,"audioSegment":0},{"text":"Gezel slows down and keeps going, instead of letting each request time out.","startTime":285.57894736842104,"endTime":289.0526315789474,"audioSegment":0},{"text":"A picture in chat has Make a video in its menu when a video model that animates pictures is installed.","startTime":289.0526315789474,"endTime":292.5263157894737,"audioSegment":0},{"text":"When the model can't use a picture,","startTime":292.5263157894737,"endTime":296,"audioSegment":0},{"text":"Gezel says so instead of making a clip from words alone.","startTime":296,"endTime":299.4736842105263,"audioSegment":0},{"text":"With ffmpeg installed,","startTime":299.4736842105263,"endTime":302.9473684210526,"audioSegment":0},{"text":"a finished video also arrives as an MP4 with a poster picture.","startTime":302.9473684210526,"endTime":306.42105263157896,"audioSegment":0},{"text":"The video model list marks models too large for this computer.","startTime":306.42105263157896,"endTime":309.89473684210526,"audioSegment":0},{"text":"An on-device engine that gets stuck repeating one character is now noticed and restarted.","startTime":309.89473684210526,"endTime":313.36842105263156,"audioSegment":0},{"text":"Before, it could fill every reply with \"/\" for hours.","startTime":313.36842105263156,"endTime":316.8421052631579,"audioSegment":0},{"text":"The first search on a new install no longer waits for the search model to download.","startTime":316.8421052631579,"endTime":320.3157894736842,"audioSegment":0},{"text":"When work passes to a crew member whose model is still making room in memory,","startTime":320.3157894736842,"endTime":323.7894736842105,"audioSegment":0},{"text":"the handoff waits, instead of pausing the task.","startTime":323.7894736842105,"endTime":327.2631578947369,"audioSegment":0},{"text":"Choosing an MLX model on a computer without Apple silicon now says why it can't run.","startTime":327.2631578947369,"endTime":330.7368421052632,"audioSegment":0},{"text":"Every CSV file with rows in it, even a small one,","startTime":330.7368421052632,"endTime":334.2105263157895,"audioSegment":0},{"text":"now becomes a table Gezel can query and add up correctly.","startTime":334.2105263157895,"endTime":337.6842105263158,"audioSegment":0},{"text":"A folder of code is the exception,","startTime":337.6842105263158,"endTime":341.1578947368421,"audioSegment":0},{"text":"where a small CSV is usually test data.","startTime":341.1578947368421,"endTime":344.63157894736844,"audioSegment":0},{"text":"The morning review of the night's work handles projects with very many tasks.","startTime":344.63157894736844,"endTime":348.10526315789474,"audioSegment":0},{"text":"Turn it on in Project Settings opens the right page, and creating a Meester, Scribe,","startTime":348.10526315789474,"endTime":351.57894736842104,"audioSegment":0},{"text":"Librarian or Inspector in Settings now shows what went wrong when it fails.","startTime":351.57894736842104,"endTime":355.0526315789474,"audioSegment":0},{"text":"On Linux, the .deb and .rpm give Gezel's shared engine access to the graphics card themselves,","startTime":355.0526315789474,"endTime":358.5263157894737,"audioSegment":0},{"text":"so local models can use an AMD card right after you install.","startTime":358.5263157894737,"endTime":362,"audioSegment":0},{"text":"Camera pictures and paired computers.","startTime":362,"endTime":364.8333333333333,"audioSegment":0},{"text":"A paired server's video engine now follows the same rule as its picture engine: unless you let cloud AI see a camera's pictures,","startTime":364.8333333333333,"endTime":367.6666666666667,"audioSegment":0},{"text":"it does not get them.","startTime":367.6666666666667,"endTime":370.5,"audioSegment":0},{"text":"More in Cameras and lookouts.","startTime":370.5,"endTime":373.3333333333333,"audioSegment":0},{"text":"App updates need you.","startTime":373.3333333333333,"endTime":376.1666666666667,"audioSegment":0},{"text":"A gezel can't approve an app update or apply one that waits for you.","startTime":376.1666666666667,"endTime":379,"audioSegment":0},{"text":"gezel integrations address shows where other programs reach this Gezel's models.","startTime":379,"endTime":382.875,"audioSegment":0},{"text":"gezel integrations ollama on or off opens or closes the port without a key that apps looking for Ollama use on this computer.","startTime":382.875,"endTime":386.75,"audioSegment":0},{"text":"gezel integrations list, approve and deny handle apps asking to connect.","startTime":386.75,"endTime":390.625,"audioSegment":0},{"text":"gezel project edits on or off lets Gezel change files in the current project's folder, or stops it.","startTime":390.625,"endTime":394.5,"audioSegment":0},{"text":"gezel do --allow-edits turns edits on for the project's folder before it starts the plan,","startTime":394.5,"endTime":398.375,"audioSegment":0},{"text":"and they stay on for that project.","startTime":398.375,"endTime":402.25,"audioSegment":0},{"text":"gezel craftbook show <name> shows what a plan does,","startTime":402.25,"endTime":406.125,"audioSegment":0},{"text":"what it takes, and the command that starts it.","startTime":406.125,"endTime":410,"audioSegment":0},{"text":"A new scorecard round measures a 27B model on a laptop with a 12 GB graphics card,","startTime":410,"endTime":414,"audioSegment":0},{"text":"with part of the model in system memory.","startTime":414,"endTime":418,"audioSegment":0},{"text":"Open Settings → This PC (llama) (or the MLX page on a Mac) and try Add a model… with a model you have wanted to run.","startTime":418,"endTime":421.6,"audioSegment":0},{"text":"If you prefer the navigation on the right,","startTime":421.6,"endTime":425.2,"audioSegment":0},{"text":"set Settings → General → Sidebar position.","startTime":425.2,"endTime":428.8,"audioSegment":0},{"text":"If you use a project made from an app,","startTime":428.8,"endTime":432.4,"audioSegment":0},{"text":"look in its Settings for An update is ready.","startTime":432.4,"endTime":436,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26315 — 11 November 2026","subtitle":"You can now add a chat model that isn't in Gezel's catalog, from a Hugging Face link or a .gguf file already on your computer. Gezel checks it before anything downloads and tries it once it is here. Apps in your projects now update themselves when an update changes nothing of yours. The title bar gains Back and Forward, and a few names change: the manual is Help, and craftbooks are Plans.","ambientMotion":"zoomIn"}}</script>
