ion":{"start":{"line":57,"column":33,"offset":9048},"end":{"line":57,"column":433,"offset":9448}}},{"type":"strong","children":[{"type":"text","value":"Add a device","position":{"start":{"line":57,"column":435,"offset":9450},"end":{"line":57,"column":447,"offset":9462}}}],"position":{"start":{"line":57,"column":433,"offset":9448},"end":{"line":57,"column":449,"offset":9464}}},{"type":"text","value":". ","position":{"start":{"line":57,"column":449,"offset":9464},"end":{"line":57,"column":451,"offset":9466}}},{"type":"strong","children":[{"type":"text","value":"Connect by IP address","position":{"start":{"line":57,"column":453,"offset":9468},"end":{"line":57,"column":474,"offset":9489}}}],"position":{"start":{"line":57,"column":451,"offset":9466},"end":{"line":57,"column":476,"offset":9491}}},{"type":"text","value":" is still there for networks that hide devices from each other.","position":{"start":{"line":57,"column":476,"offset":9491},"end":{"line":57,"column":539,"offset":9554}}}],"position":{"start":{"line":57,"column":1,"offset":9016},"end":{"line":57,"column":539,"offset":9554}}},{"type":"paragraph","children":[{"type":"text","value":"When a paired computer goes to sleep or you leave its network, your gezels carry on with this computer's own model, and the reply says so. Once the other computer can be reached again, the next message goes back to it. Its models stay in the model list, marked ","position":{"start":{"line":59,"column":1,"offset":9556},"end":{"line":59,"column":262,"offset":9817}}},{"type":"strong","children":[{"type":"text","value":"(offline)","position":{"start":{"line":59,"column":264,"offset":9819},"end":{"line":59,"column":273,"offset":9828}}}],"position":{"start":{"line":59,"column":262,"offset":9817},"end":{"line":59,"column":275,"offset":9830}}},{"type":"text","value":". The phone app can pair with a computer the same way, under ","position":{"start":{"line":59,"column":275,"offset":9830},"end":{"line":59,"column":336,"offset":9891}}},{"typ query a project's tables, open data files with gezel.data.open(), accept scoped uploads declared in pages.imports, and reuse the shared fileCard and fileAdder components. They inherit the host's fonts. gezel app demo <folder> exports an offline demo of a private app. New guides: Page APIs and the page style guide.","App SDK. A new images grant and /v1/images/* routes with streamed progress. An app can add scopes to its grant without disconnecting. knowledgeContext() reports whether knowledge was used and returns the passages, and accepts an explicit query and numbered citations. In-process hosting takes logOutput, and embedded daemon logs go to stderr by default.","Grounding. The citation checker that gezel runs for factual writing is published as @bendyline/gezel/grounding.","OpenAI-compatible routes return typed error codes when an engine fails (capacity, busy, launch failure, crash, context overflow, not ready). Downloadable /v1/models entries say how well each model fits the device.","Remote serving. The /v1/remote/* wire contract and SPAKE2 pairing live in @bendyline/gezel/remote. New routes: /api/remotes/pair-with-code, /api/remotes/discover and /v1/apps/pair/start|finish.","API compatibility. /api/health publishes an apiCompat range. Clients decline a daemon outside that range with daemon_incompatible. It also reports the daemon's pid and hostedBy (app or standalone).","Native engines are pinned to release 0.1.54, which adds CUDA builds for Windows on ARM."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":1029,"duration":26,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":131,"column":4,"offset":20949},"end":{"line":131,"column":37,"offset":20982}}}],"position":{"start":{"line":131,"column":1,"offset":20946},"end":{"line":131,"column":37,"offset":20982}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Open a project that holds a folder and choose ","position":{"start":{"line":133,"column":1,"offset":20984},"end":{"line":133,"column":47,"offset":21030}}},{"type":"strong","children":[{"type":"text","value":"Views","position":{"start":{"line":133,"column":49,"offset":21032},"end":{"line":133,"column":54,"offset":21037}}}],"position":{"start":{"line":133,"column":47,"offset":21030},"end":{"line":133,"column":56,"offset":21039}}},{"type":"text","value":". Try the Gallery on your Pictures folder, or the Guide on a codebase. If you use Claude Code or Codex, set up ","position":{"start":{"line":133,"column":56,"offset":21039},"end":{"line":133,"column":167,"offset":21150}}},{"type":"strong","children":[{"type":"text","value":"Gezel's tools","position":{"start":{"line":133,"column":169,"offset":21152},"end":{"line":133,"column":182,"offset":21165}}}],"position":{"start":{"line":133,"column":167,"offset":21150},"end":{"line":133,"column":184,"offset":21167}}},{"type":"text","value":" for it in ","position":{"start":{"line":133,"column":184,"offset":21167},"end":{"line":133,"column":195,"offset":21178}}},{"type":"strong","children":[{"type":"text","value":"Settings → Integrations","position":{"start":{"line":133,"column":197,"offset":21180},"end":{"line":133,"column":220,"offset":21203}}}],"position":{"start":{"line":133,"column":195,"offset":21178},"end":{"line":133,"column":222,"offset":21205}}},{"type":"text","value":", and paste the line it shows into that folder's instructions file. If you have a second computer running gezel, pair the two in ","position":{"start":{"line":133,"column":222,"offset":21205},"end":{"line":133,"column":351,"offset":21334}}},{"type":"strong","children":[{"type":"text","value":"Settings → Remote Servers","position":{"start":{"line":133,"column":353,"offset":21336},"end":{"line":133,"column":378,"offset":21361}}}],"position":{"start":{"line":133,"column":351,"offset":21334},"end":{"line":133,"column":380,"offset":21363}}},{"type":"text","value":". And if there is a room you would like watched, add a ","position":{"start":{"line":133,"column":380,"offset":21363},"end":{"line":133,"column":435,"offset":21418}}},{"type":"strong","children":[{"type":"text","value":"Webcam","position":{"start":{"line":133,"column":437,"offset":21420},"end":{"line":133,"column":443,"offset":21426}}}],"position":{"start":{"line":133,"column":435,"offset":21418},"end":{"line":133,"column":445,"offset":21428}}},{"type":"text","value":" under a project's ","position":{"start":{"line":133,"column":445,"offset":21428},"end":{"line":133,"column":464,"offset":21447}}},{"type":"strong","children":[{"type":"text","value":"About → Connections","position":{"start":{"line":133,"column":466,"offset":21449},"end":{"line":133,"column":485,"offset":21468}}}],"position":{"start":{"line":133,"column":464,"offset":21447},"end":{"line":133,"column":487,"offset":21470}}},{"type":"text","value":".","position":{"start":{"line":133,"column":487,"offset":21470},"end":{"line":133,"column":488,"offset":21471}}}],"position":{"start":{"line":133,"column":1,"offset":20984},"end":{"line":133,"column":488,"offset":21471}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Thirteen days after 1.26287.","startTime":0,"endTime":3.5833333333333335,"audioSegment":0},{"text":"Your gezellen are the named AI craftspeople on your crew (one is a gezel).","startTime":3.5833333333333335,"endTime":7.166666666666667,"audioSegment":0},{"text":"They can now watch a room through a webcam and act on what they see,","startTime":7.166666666666667,"endTime":10.75,"audioSegment":0},{"text":"following rules you write as a sentence.","startTime":10.75,"endTime":14.333333333333334,"audioSegment":0},{"text":"A project that holds a folder gets a Views tab that shows what is in it: on shelves,","startTime":14.333333333333334,"endTime":17.916666666666668,"audioSegment":0},{"text":"on a timeline, as a diagram.","startTime":17.916666666666668,"endTime":21.5,"audioSegment":0},{"text":"And AI apps you already use, such as Claude Code and Codex,","startTime":21.5,"endTime":25.083333333333336,"audioSegment":0},{"text":"can now use Gezel's search, document reading and memory while they work.","startTime":25.083333333333336,"endTime":28.666666666666668,"audioSegment":0},{"text":"Smaller changes show up everywhere.","startTime":28.666666666666668,"endTime":32.25,"audioSegment":0},{"text":"The crew's titles are now in plain English, each request you send gets one card that runs from \"Got it\" to \"Ready\",","startTime":32.25,"endTime":35.833333333333336,"audioSegment":0},{"text":"and Home appears as soon as you open the app.","startTime":35.833333333333336,"endTime":39.41666666666667,"audioSegment":0},{"text":"If you read only one thing: open a project that holds a folder and choose its Views tab.","startTime":39.41666666666667,"endTime":43,"audioSegment":0},{"text":"A project can now watch a room through a webcam or the camera built into your computer.","startTime":43,"endTime":46.48275862068966,"audioSegment":0},{"text":"Gezel notices when something moves and can ask a vision model on this computer what it sees.","startTime":46.48275862068966,"endTime":49.96551724137931,"audioSegment":0},{"text":"It saves each thing that happens as a moment: a short note with up to three pictures,","startTime":49.96551724137931,"endTime":53.44827586206897,"audioSegment":0},{"text":"so you can ask later, \"when was the cat last in the mud room?\"","startTime":53.44827586206897,"endTime":56.93103448275862,"audioSegment":0},{"text":"A lookout says what to do about it,","startTime":56.93103448275862,"endTime":60.41379310344828,"audioSegment":0},{"text":"as a sentence you finish: when the mud room camera sees a cat squatting on the floor, then play the alarm and tell me.","startTime":60.41379310344828,"endTime":63.896551724137936,"audioSegment":0},{"text":"A lookout can tell you, play a sound, say something out loud,","startTime":63.896551724137936,"endTime":67.37931034482759,"audioSegment":0},{"text":"alert your phone, email you, ask a gezel to follow up, or run a craftbook.","startTime":67.37931034482759,"endTime":70.86206896551724,"audioSegment":0},{"text":"A craftbook is one of gezel's step-by-step recipes for a job.","startTime":70.86206896551724,"endTime":74.34482758620689,"audioSegment":0},{"text":"Each lookout acts at most once per moment,","startTime":74.34482758620689,"endTime":77.82758620689656,"audioSegment":0},{"text":"rests afterwards, and stops for the day at its limit.","startTime":77.82758620689656,"endTime":81.3103448275862,"audioSegment":0},{"text":"Test runs a lookout once: it plays its sounds and sends its alerts,","startTime":81.3103448275862,"endTime":84.79310344827587,"audioSegment":0},{"text":"marked as a test, but doesn't ask a gezel to follow up or start a craftbook.","startTime":84.79310344827587,"endTime":88.27586206896552,"audioSegment":0},{"text":"Not this marks a false alarm.","startTime":88.27586206896552,"endTime":91.75862068965517,"audioSegment":0},{"text":"The pictures stay on this computer unless you let cloud AI see them,","startTime":91.75862068965517,"endTime":95.24137931034483,"audioSegment":0},{"text":"which you choose for each camera.","startTime":95.24137931034483,"endTime":98.72413793103448,"audioSegment":0},{"text":"Until then, a gezel on a cloud model that looks at a moment gets a description made on this computer,","startTime":98.72413793103448,"endTime":102.20689655172414,"audioSegment":0},{"text":"not the pictures.","startTime":102.20689655172414,"endTime":105.6896551724138,"audioSegment":0},{"text":"One exception in this release: asking a cloud gezel or a cloud image engine to make a new image from a moment's pictures still sends those pictures,","startTime":105.6896551724138,"endTime":109.17241379310344,"audioSegment":0},{"text":"so use an on-device model for that.","startTime":109.17241379310344,"endTime":112.65517241379311,"audioSegment":0},{"text":"While any camera is watching,","startTime":112.65517241379311,"endTime":116.13793103448276,"audioSegment":0},{"text":"the titlebar names it (\"Mud room is on\"), and its menu pauses it.","startTime":116.13793103448276,"endTime":119.62068965517241,"audioSegment":0},{"text":"A gezel can suggest a lookout,","startTime":119.62068965517241,"endTime":123.10344827586206,"audioSegment":0},{"text":"but the lookout stays off until you approve it.","startTime":123.10344827586206,"endTime":126.58620689655173,"audioSegment":0},{"text":"To add a camera,","startTime":126.58620689655173,"endTime":130.0689655172414,"audioSegment":0},{"text":"open a project's About → Connections → Add connection and choose Webcam.","startTime":130.0689655172414,"endTime":133.55172413793105,"audioSegment":0},{"text":"Gezel reads cameras through ffmpeg,","startTime":133.55172413793105,"endTime":137.0344827586207,"audioSegment":0},{"text":"and the setup shows how to install it if it is missing.","startTime":137.0344827586207,"endTime":140.51724137931035,"audioSegment":0},{"text":"More in Cameras and lookouts.","startTime":140.51724137931035,"endTime":144,"audioSegment":0},{"text":"Once gezel has read a folder you added,","startTime":144,"endTime":147.14285714285714,"audioSegment":0},{"text":"the project's new Views tab shows what it found.","startTime":147.14285714285714,"endTime":150.28571428571428,"audioSegment":0},{"text":"The Village, the map that draws a codebase as a town,","startTime":150.28571428571428,"endTime":153.42857142857142,"audioSegment":0},{"text":"now sits there beside five new views:","startTime":153.42857142857142,"endTime":156.57142857142858,"audioSegment":0},{"text":"Gallery puts the files on shelves by type or by folder,","startTime":156.57142857142858,"endTime":159.71428571428572,"audioSegment":0},{"text":"and a photo folder by outing.","startTime":159.71428571428572,"endTime":162.85714285714286,"audioSegment":0},{"text":"A photo folder starts with its exact copies and look-alikes.","startTime":162.85714285714286,"endTime":166,"audioSegment":0},{"text":"Timeline shows what changed when, as bars by week, month or year.","startTime":166,"endTime":169.14285714285714,"audioSegment":0},{"text":"For a code folder the bars count commits.","startTime":169.14285714285714,"endTime":172.28571428571428,"audioSegment":0},{"text":"A photo sits at the time it was taken.","startTime":172.28571428571428,"endTime":175.42857142857142,"audioSegment":0},{"text":"Diagram draws files as boxes, with arrows to the files they use.","startTime":175.42857142857142,"endTime":178.57142857142856,"audioSegment":0},{"text":"Guide says what each folder of a codebase is for and which files the rest of it depends on.","startTime":178.57142857142856,"endTime":181.71428571428572,"audioSegment":0},{"text":"Reports gathers everything gezel has written about the project: overnight reports,","startTime":181.71428571428572,"endTime":184.85714285714286,"audioSegment":0},{"text":"code reviews, the codebase map.","startTime":184.85714285714286,"endTime":188,"audioSegment":0},{"text":"Write … now writes one straight away,","startTime":188,"endTime":191.14285714285714,"audioSegment":0},{"text":"so you don't have to wait for the night.","startTime":191.14285714285714,"endTime":194.28571428571428,"audioSegment":0},{"text":"Choose a file in any view and a panel on the right shows a preview and says what the file is,","startTime":194.28571428571428,"endTime":197.42857142857144,"audioSegment":0},{"text":"what uses it, and any problems the Librarian (the crew member who reads your files) found.","startTime":197.42857142857144,"endTime":200.57142857142856,"audioSegment":0},{"text":"The file stays chosen when you switch views.","startTime":200.57142857142856,"endTime":203.71428571428572,"audioSegment":0},{"text":"Drawing a view never opens or changes your files,","startTime":203.71428571428572,"endTime":206.85714285714286,"audioSegment":0},{"text":"because every view comes from gezel's index of the folder. More in Views.","startTime":206.85714285714286,"endTime":210,"audioSegment":0},{"text":"Until now, other apps could use your gezels and your models.","startTime":210,"endTime":213.57142857142858,"audioSegment":0},{"text":"This release also works the other way round.","startTime":213.57142857142858,"endTime":217.14285714285714,"audioSegment":0},{"text":"Claude Code, Claude Desktop, Codex,","startTime":217.14285714285714,"endTime":220.71428571428572,"audioSegment":0},{"text":"Cursor and VS Code can now use what Gezel knows and does.","startTime":220.71428571428572,"endTime":224.28571428571428,"audioSegment":0},{"text":"They can search the folder they work in (including the text inside Word, PDF,","startTime":224.28571428571428,"endTime":227.85714285714286,"audioSegment":0},{"text":"PowerPoint and Excel files), your document library, your memories and your knowledge catalogs.","startTime":227.85714285714286,"endTime":231.42857142857144,"audioSegment":0},{"text":"They can read Office files and images, make images and Word, PowerPoint, PDF or Excel files,","startTime":231.42857142857144,"endTime":235,"audioSegment":0},{"text":"and save a decision as a memory that Gezel and every other app will see.","startTime":235,"endTime":238.57142857142858,"audioSegment":0},{"text":"Set up each app on its own tab in Settings → Integrations,","startTime":238.57142857142858,"endTime":242.14285714285714,"audioSegment":0},{"text":"which used to be called Connected Apps.","startTime":242.14285714285714,"endTime":245.71428571428572,"audioSegment":0},{"text":"Gezel adds one server called gezel to that app's settings and changes nothing else there.","startTime":245.71428571428572,"endTime":249.28571428571428,"audioSegment":0},{"text":"The tab also shows a line to paste near the top of the folder's CLAUDE.md or AGENTS.md.","startTime":249.28571428571428,"endTime":252.85714285714286,"audioSegment":0},{"text":"Without that line, apps tend to use their own search first.","startTime":252.85714285714286,"endTime":256.42857142857144,"audioSegment":0},{"text":"In our tests, the line made Claude Code on Sonnet 5 answer questions about code about a quarter faster,","startTime":256.42857142857144,"endTime":260,"audioSegment":0},{"text":"and up to twice as fast on large codebases with little documentation.","startTime":260,"endTime":263.57142857142856,"audioSegment":0},{"text":"Newer models that already find their way quickly were no faster.","startTime":263.57142857142856,"endTime":267.14285714285717,"audioSegment":0},{"text":"You decide what these apps may do,","startTime":267.14285714285717,"endTime":270.7142857142857,"audioSegment":0},{"text":"under Gezel's tools in other apps on the Overview tab.","startTime":270.7142857142857,"endTime":274.2857142857143,"audioSegment":0},{"text":"Memory can be off, read-only, or saved to the project.","startTime":274.2857142857143,"endTime":277.8571428571429,"audioSegment":0},{"text":"Images can be limited to this computer (the default) or use any image engine you set up.","startTime":277.8571428571429,"endTime":281.42857142857144,"audioSegment":0},{"text":"A third setting decides whether apps may judge the night shift's issues.","startTime":281.42857142857144,"endTime":285,"audioSegment":0},{"text":"Apps never write to your own \"About you\" memories, and under Super Lockdown,","startTime":285,"endTime":288.57142857142856,"audioSegment":0},{"text":"the strictest security level, none of these tools are available.","startTime":288.57142857142856,"endTime":292.14285714285717,"audioSegment":0},{"text":"Checking the night shift's issues. Overnight,","startTime":292.14285714285717,"endTime":295.7142857142857,"audioSegment":0},{"text":"a small model on this computer reads your code and flags what looks wrong.","startTime":295.7142857142857,"endTime":299.2857142857143,"audioSegment":0},{"text":"Many of those flags are not real bugs,","startTime":299.2857142857143,"endTime":302.8571428571429,"audioSegment":0},{"text":"and a stronger model can tell which ones are.","startTime":302.8571428571429,"endTime":306.42857142857144,"audioSegment":0},{"text":"In Claude Code, /mcp__gezel__triage_issues reads the code at each issue and records a verdict: fixed,","startTime":306.42857142857144,"endTime":310,"audioSegment":0},{"text":"real, not a bug, true but not worth fixing.","startTime":310,"endTime":313.57142857142856,"audioSegment":0},{"text":"/mcp__gezel__fix_issues also fixes the real ones.","startTime":313.57142857142856,"endTime":317.14285714285717,"audioSegment":0},{"text":"Each issue then shows the verdict and which app gave it.","startTime":317.14285714285717,"endTime":320.7142857142857,"audioSegment":0},{"text":"An issue judged not a bug no longer comes back the next night in different words.","startTime":320.7142857142857,"endTime":324.2857142857143,"audioSegment":0},{"text":"Kinds of issue that are almost never worth fixing are marked low confidence and left out of the counts and the morning review.","startTime":324.2857142857143,"endTime":327.8571428571429,"audioSegment":0},{"text":"An app without Gezel's tools can do the same through Reports → Issues for review and Import answers.","startTime":327.8571428571429,"endTime":331.42857142857144,"audioSegment":0},{"text":"More in Integrations.","startTime":331.42857142857144,"endTime":335,"audioSegment":0},{"text":"The crew's titles are now in plain English.","startTime":335,"endTime":338.11764705882354,"audioSegment":0},{"text":"The voorman is now the Crew Lead, the Boekwachter the Librarian,","startTime":338.11764705882354,"endTime":341.2352941176471,"audioSegment":0},{"text":"the Klerk the Scribe, and the Keurmeester the Inspector.","startTime":341.2352941176471,"endTime":344.3529411764706,"audioSegment":0},{"text":"Roles from the catalog follow suit: a Reisleider is now a Trip Planner.","startTime":344.3529411764706,"endTime":347.47058823529414,"audioSegment":0},{"text":"Only the Meester, the guildmaster who greets you and builds your crew,","startTime":347.47058823529414,"endTime":350.5882352941176,"audioSegment":0},{"text":"keeps a Dutch title.","startTime":350.5882352941176,"endTime":353.70588235294116,"audioSegment":0},{"text":"Existing gezels are renamed for you,","startTime":353.70588235294116,"endTime":356.8235294117647,"audioSegment":0},{"text":"and what they can do does not change. See Your crew.","startTime":356.8235294117647,"endTime":359.94117647058823,"audioSegment":0},{"text":"When you ask for something that takes real work,","startTime":359.94117647058823,"endTime":363.05882352941177,"audioSegment":0},{"text":"the conversation now shows one card for it.","startTime":363.05882352941177,"endTime":366.1764705882353,"audioSegment":0},{"text":"Before, it showed a trail of task cards, crew introductions and receipts.","startTime":366.1764705882353,"endTime":369.29411764705884,"audioSegment":0},{"text":"The card moves through four stops: Got it,","startTime":369.29411764705884,"endTime":372.4117647058824,"audioSegment":0},{"text":"Making it, Checking it and Ready.","startTime":372.4117647058824,"endTime":375.52941176470586,"audioSegment":0},{"text":"It has one plain line in the voice of the gezel leading the work (\"Dejan is drafting the invoices\") and an estimate based on how long similar work took on this computer.","startTime":375.52941176470586,"endTime":378.6470588235294,"audioSegment":0},{"text":"At Ready, it holds the finished file. Who's helping?","startTime":378.6470588235294,"endTime":381.7647058823529,"audioSegment":0},{"text":"shows the crew working on it.","startTime":381.7647058823529,"endTime":384.88235294117646,"audioSegment":0},{"text":"When a review sends work back, the card never moves backwards.","startTime":384.88235294117646,"endTime":388,"audioSegment":0},{"text":"The message box now has a sparkle key beside Task and Send.","startTime":388,"endTime":390.7142857142857,"audioSegment":0},{"text":"It can Make it clearer,","startTime":390.7142857142857,"endTime":393.42857142857144,"audioSegment":0},{"text":"Shorten or Fix spelling and grammar in the message you are writing.","startTime":393.42857142857144,"endTime":396.14285714285717,"audioSegment":0},{"text":"Review my message suggests changes without making them.","startTime":396.14285714285717,"endTime":398.85714285714283,"audioSegment":0},{"text":"The result appears in the message box for you to read and edit,","startTime":398.85714285714283,"endTime":401.57142857142856,"audioSegment":0},{"text":"and nothing is sent until you press Send.","startTime":401.57142857142856,"endTime":404.2857142857143,"audioSegment":0},{"text":"Undo puts your words back.","startTime":404.2857142857143,"endTime":407,"audioSegment":0},{"text":"The image gezel, which makes pictures directly from your message,","startTime":407,"endTime":410.4375,"audioSegment":0},{"text":"now has a strip above its message box.","startTime":410.4375,"endTime":413.875,"audioSegment":0},{"text":"In it you choose the shape, the size (Draft for a quick look,","startTime":413.875,"endTime":417.3125,"audioSegment":0},{"text":"Standard, or High) and the image model.","startTime":417.3125,"endTime":420.75,"audioSegment":0},{"text":"You can also say the shape in your message.","startTime":420.75,"endTime":424.1875,"audioSegment":0},{"text":"\"A lighthouse at dusk as a phone wallpaper\" now makes a tall picture of a lighthouse,","startTime":424.1875,"endTime":427.625,"audioSegment":0},{"text":"not a lighthouse next to a phone, and the strip shows what it understood before you send.","startTime":427.625,"endTime":431.0625,"audioSegment":0},{"text":"For image models that read whole sentences, the sparkle key adds Shape for that model,","startTime":431.0625,"endTime":434.5,"audioSegment":0},{"text":"which rewrites your idea in the way that model understands best.","startTime":434.5,"endTime":437.9375,"audioSegment":0},{"text":"The catalog adds two image helpers.","startTime":437.9375,"endTime":441.375,"audioSegment":0},{"text":"MOSS-Image is an on-device image model that writes clear,","startTime":441.375,"endTime":444.8125,"audioSegment":0},{"text":"correctly spelled text inside pictures, such as signs, posters and labeled diagrams.","startTime":444.8125,"endTime":448.25,"audioSegment":0},{"text":"The Illustrator is a gezel who turns a brief into a finished set of images,","startTime":448.25,"endTime":451.6875,"audioSegment":0},{"text":"such as logos, icons or character sheets.","startTime":451.6875,"endTime":455.125,"audioSegment":0},{"text":"They check the results and draw vector shapes by hand when the job calls for it.","startTime":455.125,"endTime":458.5625,"audioSegment":0},{"text":"Image work in tasks and craftbooks now goes to the Illustrator.","startTime":458.5625,"endTime":462,"audioSegment":0},{"text":"In Settings → Remote Servers, gezel can use the models on another of your computers,","startTime":462,"endTime":465.5,"audioSegment":0},{"text":"such as a desktop with a large graphics card, from your laptop.","startTime":465.5,"endTime":469,"audioSegment":0},{"text":"Pairing used to mean typing an address and then approving it on the other computer.","startTime":469,"endTime":472.5,"audioSegment":0},{"text":"Now it works like a network lobby in a game.","startTime":472.5,"endTime":476,"audioSegment":0},{"text":"Computers running gezel on your network appear in a list without any setup,","startTime":476,"endTime":479.5,"audioSegment":0},{"text":"and you connect by typing the 8-digit code the other computer shows under Add a device.","startTime":479.5,"endTime":483,"audioSegment":0},{"text":"Connect by IP address is still there for networks that hide devices from each other.","startTime":483,"endTime":486.5,"audioSegment":0},{"text":"When a paired computer goes to sleep or you leave its network,","startTime":486.5,"endTime":490,"audioSegment":0},{"text":"your gezels carry on with this computer's own model, and the reply says so.","startTime":490,"endTime":493.5,"audioSegment":0},{"text":"Once the other computer can be reached again,","startTime":493.5,"endTime":497,"audioSegment":0},{"text":"the next message goes back to it.","startTime":497,"endTime":500.5,"audioSegment":0},{"text":"Its models stay in the model list, marked (offline).","startTime":500.5,"endTime":504,"audioSegment":0},{"text":"The phone app can pair with a computer the same way,","startTime":504,"endTime":507.5,"audioSegment":0},{"text":"under Another device, and use its models.","startTime":507.5,"endTime":511,"audioSegment":0},{"text":"Gezel now has a Windows installer for computers with ARM processors.","startTime":511,"endTime":514.2857142857143,"audioSegment":0},{"text":"On a laptop with NVIDIA's RTX Spark (N1X) chip,","startTime":514.2857142857143,"endTime":517.5714285714286,"audioSegment":0},{"text":"on-device models run on its graphics processor.","startTime":517.5714285714286,"endTime":520.8571428571429,"audioSegment":0},{"text":"In our first test, a large 27-billion-parameter model read a prompt about thirty times faster than on the main processor alone,","startTime":520.8571428571429,"endTime":524.1428571428571,"audioSegment":0},{"text":"and wrote about fourteen times faster.","startTime":524.1428571428571,"endTime":527.4285714285714,"audioSegment":0},{"text":"Other ARM laptops run on-device models on the main processor for now.","startTime":527.4285714285714,"endTime":530.7142857142857,"audioSegment":0},{"text":"Searching your documents and memories works on all of them.","startTime":530.7142857142857,"endTime":534,"audioSegment":0},{"text":"Home now appears as soon as you open the app,","startTime":534,"endTime":537.2142857142857,"audioSegment":0},{"text":"before gezel's background service has finished starting.","startTime":537.2142857142857,"endTime":540.4285714285714,"audioSegment":0},{"text":"It shows the Meester,","startTime":540.4285714285714,"endTime":543.6428571428571,"audioSegment":0},{"text":"their latest status and your recent night shift reports, ready to read.","startTime":543.6428571428571,"endTime":546.8571428571429,"audioSegment":0},{"text":"When the service is ready,","startTime":546.8571428571429,"endTime":550.0714285714286,"audioSegment":0},{"text":"the full app takes over and leaves you where you were reading.","startTime":550.0714285714286,"endTime":553.2857142857143,"audioSegment":0},{"text":"Starting up is also quicker,","startTime":553.2857142857143,"endTime":556.5,"audioSegment":0},{"text":"because gezel no longer re-checks every bundled program byte by byte at each launch.","startTime":556.5,"endTime":559.7142857142857,"audioSegment":0},{"text":"It checks a file again only when the file has changed.","startTime":559.7142857142857,"endTime":562.9285714285714,"audioSegment":0},{"text":"On a new install, the photo-search model and the image reader now wait to download until your first project is finished,","startTime":562.9285714285714,"endTime":566.1428571428571,"audioSegment":0},{"text":"so your first few minutes aren't spent waiting for downloads.","startTime":566.1428571428571,"endTime":569.3571428571429,"audioSegment":0},{"text":"When the Meester starts a ready-made kind of project, such as a job-hunt board,","startTime":569.3571428571429,"endTime":572.5714285714286,"audioSegment":0},{"text":"the Crew Lead now has to fill in a first draft before calling the work done.","startTime":572.5714285714286,"endTime":575.7857142857143,"audioSegment":0},{"text":"An empty board no longer counts as finished.","startTime":575.7857142857143,"endTime":579,"audioSegment":0},{"text":"New sources for a project, under About → Connections.","startTime":579,"endTime":581.8148148148148,"audioSegment":0},{"text":"Outlook Calendar keeps a searchable copy of your calendars.","startTime":581.8148148148148,"endTime":584.6296296296297,"audioSegment":0},{"text":"OneDrive, SharePoint and Google Drive keep a searchable,","startTime":584.6296296296297,"endTime":587.4444444444445,"audioSegment":0},{"text":"read-only copy of the folders you choose.","startTime":587.4444444444445,"endTime":590.2592592592592,"audioSegment":0},{"text":"RSS and Atom feeds follow blogs,","startTime":590.2592592592592,"endTime":593.074074074074,"audioSegment":0},{"text":"news sites and podcasts without any sign-in.","startTime":593.074074074074,"endTime":595.8888888888889,"audioSegment":0},{"text":"YouTube keeps a copy of the videos on channels you run or follow,","startTime":595.8888888888889,"endTime":598.7037037037037,"audioSegment":0},{"text":"with a free API key.","startTime":598.7037037037037,"endTime":601.5185185185185,"audioSegment":0},{"text":"To connect Microsoft or Google, you first register an app with them yourself,","startTime":601.5185185185185,"endTime":604.3333333333334,"audioSegment":0},{"text":"and the setup walks you through it. Chat models.","startTime":604.3333333333334,"endTime":607.1481481481482,"audioSegment":0},{"text":"Liquid AI's LFM2.5 24B-A2B.","startTime":607.1481481481482,"endTime":609.9629629629629,"audioSegment":0},{"text":"NVIDIA's Nemotron 3.5 Bolt, in a 6 GB version and a 74B version that fits in about 24 GB,","startTime":609.9629629629629,"endTime":612.7777777777778,"audioSegment":0},{"text":"and Nemotron 3.5 Super VL 120B.","startTime":612.7777777777778,"endTime":615.5925925925926,"audioSegment":0},{"text":"A 2-bit DeepSeek V4.1 Flash for machines with a very large amount of memory. Project types.","startTime":615.5925925925926,"endTime":618.4074074074074,"audioSegment":0},{"text":"Data Analysis opens a folder's spreadsheets and data files in a live dashboard.","startTime":618.4074074074074,"endTime":621.2222222222222,"audioSegment":0},{"text":"Media Library lets you browse a folder of images,","startTime":621.2222222222222,"endTime":624.0370370370371,"audioSegment":0},{"text":"video and audio and play them where they are, without moving the originals.","startTime":624.0370370370371,"endTime":626.8518518518518,"audioSegment":0},{"text":"Knowledge catalogs.","startTime":626.8518518518518,"endTime":629.6666666666666,"audioSegment":0},{"text":"Wikipedia: History, Wikipedia: Geography & Places, and nine catalogs of notable people,","startTime":629.6666666666666,"endTime":632.4814814814815,"audioSegment":0},{"text":"including scientists, writers and artists, entertainers, sportspeople and politicians.","startTime":632.4814814814815,"endTime":635.2962962962963,"audioSegment":0},{"text":"Western Europe is now split into East and West.","startTime":635.2962962962963,"endTime":638.1111111111111,"audioSegment":0},{"text":"Model scorecard.","startTime":638.1111111111111,"endTime":640.9259259259259,"audioSegment":0},{"text":"Three new rounds: local models on an Apple M5 Max, eight small models on a Windows laptop with an RTX 5070 Ti,","startTime":640.9259259259259,"endTime":643.7407407407408,"audioSegment":0},{"text":"and NVIDIA's Nemotron 3.5 Bolt against four Gemma and Qwen models.","startTime":643.7407407407408,"endTime":646.5555555555555,"audioSegment":0},{"text":"Each round now includes a review of what every model actually made,","startTime":646.5555555555555,"endTime":649.3703703703703,"audioSegment":0},{"text":"not only whether it passed.","startTime":649.3703703703703,"endTime":652.1851851851852,"audioSegment":0},{"text":"See the model scorecard.","startTime":652.1851851851852,"endTime":655,"audioSegment":0},{"text":"Documents work right after you install.","startTime":655,"endTime":658.0612244897959,"audioSegment":0},{"text":"DocBlocks, the document maker behind gezel's Word,","startTime":658.0612244897959,"endTime":661.1224489795918,"audioSegment":0},{"text":"PowerPoint, PDF and Excel files, now comes inside gezel.","startTime":661.1224489795918,"endTime":664.1836734693877,"audioSegment":0},{"text":"Craftbooks that make documents work on a fresh install and without an internet connection.","startTime":664.1836734693877,"endTime":667.2448979591836,"audioSegment":0},{"text":"Search finds other forms of a word.","startTime":667.2448979591836,"endTime":670.3061224489796,"audioSegment":0},{"text":"Searching for \"transitions\" finds documents that say \"transition\", and \"rendered\" finds \"render\".","startTime":670.3061224489796,"endTime":673.3673469387755,"audioSegment":0},{"text":"Knowledge catalogs list their articles in one continuous list with an A to Z index beside it,","startTime":673.3673469387755,"endTime":676.4285714285714,"audioSegment":0},{"text":"and keep your place when you come back.","startTime":676.4285714285714,"endTime":679.4897959183673,"audioSegment":0},{"text":"Narration pronounces words the way they are meant.","startTime":679.4897959183673,"endTime":682.5510204081633,"audioSegment":0},{"text":"The on-device voice pronounces \"present\" differently in \"we present\" and \"at present\",","startTime":682.5510204081633,"endTime":685.6122448979592,"audioSegment":0},{"text":"reads capitalized acronyms properly, and now uses a higher-precision copy of its voice model.","startTime":685.6122448979592,"endTime":688.6734693877551,"audioSegment":0},{"text":"The Meester takes on work more reliably.","startTime":688.6734693877551,"endTime":691.734693877551,"audioSegment":0},{"text":"It now chooses from one ranked list of what suits a request (a craftbook,","startTime":691.734693877551,"endTime":694.795918367347,"audioSegment":0},{"text":"a kind of project, or a plain task), which on-device models get right more often.","startTime":694.795918367347,"endTime":697.8571428571429,"audioSegment":0},{"text":"Projects survive a crash.","startTime":697.8571428571429,"endTime":700.9183673469388,"audioSegment":0},{"text":"If a crash or power cut empties a project's settings file,","startTime":700.9183673469388,"endTime":703.9795918367347,"audioSegment":0},{"text":"gezel rebuilds it from the project's history instead of dropping the project from your list.","startTime":703.9795918367347,"endTime":707.0408163265306,"audioSegment":0},{"text":"Interrupted downloads repair themselves.","startTime":707.0408163265306,"endTime":710.1020408163265,"audioSegment":0},{"text":"If a model file was cut short during a download, gezel notices and downloads it again,","startTime":710.1020408163265,"endTime":713.1632653061224,"audioSegment":0},{"text":"instead of failing every time it loads the model.","startTime":713.1632653061224,"endTime":716.2244897959183,"audioSegment":0},{"text":"A model that downloads in several pieces at once shows one steady progress bar.","startTime":716.2244897959183,"endTime":719.2857142857142,"audioSegment":0},{"text":"Upgrades reach the background service.","startTime":719.2857142857142,"endTime":722.3469387755102,"audioSegment":0},{"text":"On a Mac or Linux computer where gezel starts at login,","startTime":722.3469387755102,"endTime":725.4081632653061,"audioSegment":0},{"text":"an upgrade could leave the old background service running.","startTime":725.4081632653061,"endTime":728.469387755102,"audioSegment":0},{"text":"Gezel now restarts it through the operating system until the new version is running.","startTime":728.469387755102,"endTime":731.530612244898,"audioSegment":0},{"text":"Plain warnings about your graphics card.","startTime":731.530612244898,"endTime":734.5918367346939,"audioSegment":0},{"text":"Sometimes an on-device engine can't use your graphics card.","startTime":734.5918367346939,"endTime":737.6530612244898,"audioSegment":0},{"text":"On Linux, the NVIDIA driver may need a restart or an update,","startTime":737.6530612244898,"endTime":740.7142857142857,"audioSegment":0},{"text":"or a build may have started without its graphics card.","startTime":740.7142857142857,"endTime":743.7755102040817,"audioSegment":0},{"text":"On Windows, the Visual C++ runtime may be missing.","startTime":743.7755102040817,"endTime":746.8367346938776,"audioSegment":0},{"text":"The sidebar now says so in one line, such as \"Restart to use your GPU\" or \"Install a Windows component\",","startTime":746.8367346938776,"endTime":749.8979591836735,"audioSegment":0},{"text":"instead of running slowly without telling you.","startTime":749.8979591836735,"endTime":752.9591836734694,"audioSegment":0},{"text":"If an engine build crashes three times in a row before it is ready,","startTime":752.9591836734694,"endTime":756.0204081632653,"audioSegment":0},{"text":"gezel switches it off and uses the next build.","startTime":756.0204081632653,"endTime":759.0816326530612,"audioSegment":0},{"text":"You can turn it back on from the engine's page in Settings.","startTime":759.0816326530612,"endTime":762.1428571428571,"audioSegment":0},{"text":"Built-in AMD graphics.","startTime":762.1428571428571,"endTime":765.204081632653,"audioSegment":0},{"text":"On AMD processors with built-in graphics, gezel now counts the memory set aside for graphics correctly,","startTime":765.204081632653,"endTime":768.2653061224489,"audioSegment":0},{"text":"so it no longer misjudges which models fit.","startTime":768.2653061224489,"endTime":771.3265306122449,"audioSegment":0},{"text":"NVIDIA on Windows.","startTime":771.3265306122449,"endTime":774.3877551020408,"audioSegment":0},{"text":"The Windows graphics build now includes code made for RTX 50-series cards.","startTime":774.3877551020408,"endTime":777.4489795918367,"audioSegment":0},{"text":"GTX 10-series cards still work but need driver version R570 or newer.","startTime":777.4489795918367,"endTime":780.5102040816327,"audioSegment":0},{"text":"Less disk space for Codex.","startTime":780.5102040816327,"endTime":783.5714285714286,"audioSegment":0},{"text":"Chats that use the Codex provider no longer leave a folder of 5–9 MB behind forever.","startTime":783.5714285714286,"endTime":786.6326530612245,"audioSegment":0},{"text":"Folders that haven't been used for 14 days are removed.","startTime":786.6326530612245,"endTime":789.6938775510204,"audioSegment":0},{"text":"Debug mode switches on and off in open conversations straight away,","startTime":789.6938775510204,"endTime":792.7551020408164,"audioSegment":0},{"text":"without reloading.","startTime":792.7551020408164,"endTime":795.8163265306123,"audioSegment":0},{"text":"The project picker in Chat now sits in the tab row, beside Chat.","startTime":795.8163265306123,"endTime":798.8775510204082,"audioSegment":0},{"text":"Poppetjes, the carved figures that represent each gezel,","startTime":798.8775510204082,"endTime":801.9387755102041,"audioSegment":0},{"text":"now have lighting and shading that look more like carved wood.","startTime":801.9387755102041,"endTime":805,"audioSegment":0},{"text":"Running a project's own scripts now has its own switch.","startTime":805,"endTime":808.6785714285714,"audioSegment":0},{"text":"Run package scripts lets gezellen run a project's npm scripts and installed command-line tools,","startTime":808.6785714285714,"endTime":812.3571428571429,"audioSegment":0},{"text":"such as npm run test.","startTime":812.3571428571429,"endTime":816.0357142857143,"audioSegment":0},{"text":"These run outside the sandbox, as your account.","startTime":816.0357142857143,"endTime":819.7142857142857,"audioSegment":0},{"text":"Edit package scripts lets them change the scripts in a project's package.json.","startTime":819.7142857142857,"endTime":823.3928571428571,"audioSegment":0},{"text":"Both are off below Unrestricted, including at Lockdown, the default,","startTime":823.3928571428571,"endTime":827.0714285714286,"audioSegment":0},{"text":"and Gezel still asks you before each new or changed command.","startTime":827.0714285714286,"endTime":830.75,"audioSegment":0},{"text":"Coding craftbooks that prove their work by running the tests need Run package scripts: turn it on in Settings → Security & Compliance before you start one.","startTime":830.75,"endTime":834.4285714285714,"audioSegment":0},{"text":"None of the other changes need anything from you.","startTime":834.4285714285714,"endTime":838.1071428571429,"audioSegment":0},{"text":"Gezel stops a tool call before it runs if it reaches for a cloud metadata service, a link-local address,","startTime":838.1071428571429,"endTime":841.7857142857143,"audioSegment":0},{"text":"a known data-drop or tunnel service, or a Linux namespace tool, and records it in History.","startTime":841.7857142857143,"endTime":845.4642857142857,"audioSegment":0},{"text":"It checks what a call runs or fetches,","startTime":845.4642857142857,"endTime":849.1428571428571,"audioSegment":0},{"text":"never the text a gezel writes into a document or file.","startTime":849.1428571428571,"endTime":852.8214285714286,"audioSegment":0},{"text":"This covers Gezel's own tools, toolsets you add,","startTime":852.8214285714286,"endTime":856.5,"audioSegment":0},{"text":"and the tool calls that apps such as Codex receive through Gezel's OpenAI-compatible endpoints.","startTime":856.5,"endTime":860.1785714285714,"audioSegment":0},{"text":"Pairing with another computer goes through a one-time code that ties together the identities of both computers.","startTime":860.1785714285714,"endTime":863.8571428571429,"audioSegment":0},{"text":"If a paired computer moves to a new network address,","startTime":863.8571428571429,"endTime":867.5357142857143,"audioSegment":0},{"text":"it has to prove it is the same computer before gezel connects to it there.","startTime":867.5357142857143,"endTime":871.2142857142857,"audioSegment":0},{"text":"Git and GitHub sign-ins are sent only to the site they belong to,","startTime":871.2142857142857,"endTime":874.8928571428571,"audioSegment":0},{"text":"and never appear on a command line where other programs could read them.","startTime":874.8928571428571,"endTime":878.5714285714286,"audioSegment":0},{"text":"Gezel asks the GitHub command-line tool for your sign-in only for projects linked to GitHub.","startTime":878.5714285714286,"endTime":882.25,"audioSegment":0},{"text":"Gezel treats what a camera's vision model writes as untrusted.","startTime":882.25,"endTime":885.9285714285714,"audioSegment":0},{"text":"A sign held up to the camera can't send an email or start work,","startTime":885.9285714285714,"endTime":889.6071428571429,"audioSegment":0},{"text":"because lookouts act only on yes-or-no answers and on your own instructions.","startTime":889.6071428571429,"endTime":893.2857142857142,"audioSegment":0},{"text":"The Windows installer repairs the permissions on gezel's service folder in a way that a folder link cannot redirect.","startTime":893.2857142857142,"endTime":896.9642857142857,"audioSegment":0},{"text":"If it can't finish the repair,","startTime":896.9642857142857,"endTime":900.6428571428571,"audioSegment":0},{"text":"it stops instead of leaving the permissions partly fixed.","startTime":900.6428571428571,"endTime":904.3214285714286,"audioSegment":0},{"text":"Upgrades are quicker when the folder hasn't been changed.","startTime":904.3214285714286,"endTime":908,"audioSegment":0},{"text":"gezel stop now shuts the service down,","startTime":908,"endTime":911.0526315789474,"audioSegment":0},{"text":"once it has confirmed the process is Gezel's.","startTime":911.0526315789474,"endTime":914.1052631578947,"audioSegment":0},{"text":"A service the Gezel app started gets the emergency brake instead,","startTime":914.1052631578947,"endTime":917.1578947368421,"audioSegment":0},{"text":"because the app would only start it again.","startTime":917.1578947368421,"endTime":920.2105263157895,"audioSegment":0},{"text":"A service that already stopped has its leftover files cleaned up,","startTime":920.2105263157895,"endTime":923.2631578947369,"audioSegment":0},{"text":"and a program that has since taken its old process number is left alone.","startTime":923.2631578947369,"endTime":926.3157894736842,"audioSegment":0},{"text":"gezel stop --keep-running is the emergency brake: it stops AI work but leaves the service running.","startTime":926.3157894736842,"endTime":929.3684210526316,"audioSegment":0},{"text":"gezel craftbook list [words] lists the craftbooks you can start in the current folder's project.","startTime":929.3684210526316,"endTime":932.421052631579,"audioSegment":0},{"text":"gezel mcp status,","startTime":932.421052631579,"endTime":935.4736842105264,"audioSegment":0},{"text":"gezel mcp install <app> and gezel mcp remove <app> manage Gezel's tools in other apps.","startTime":935.4736842105264,"endTime":938.5263157894736,"audioSegment":0},{"text":"gezel do --wait says why a task is blocked and points to gezel task notes <ref>.","startTime":938.5263157894736,"endTime":941.578947368421,"audioSegment":0},{"text":"gezel run --gezel accepts a gezel's name or role.","startTime":941.578947368421,"endTime":944.6315789473684,"audioSegment":0},{"text":"Install with npm install -g @bendyline/gezel-cli,","startTime":944.6315789473684,"endTime":947.6842105263158,"audioSegment":0},{"text":"or try it without installing with npx -p @bendyline/gezel-cli gezel.","startTime":947.6842105263158,"endTime":950.7368421052631,"audioSegment":0},{"text":"A bare npx gezel fetches an unrelated package.","startTime":950.7368421052631,"endTime":953.7894736842105,"audioSegment":0},{"text":"The terminal tool,","startTime":953.7894736842105,"endTime":956.8421052631579,"audioSegment":0},{"text":"the app SDK and the VS Code extension now check whether a running Gezel service speaks their version of the API.","startTime":956.8421052631579,"endTime":959.8947368421053,"audioSegment":0},{"text":"If it doesn't, they say which one to update.","startTime":959.8947368421053,"endTime":962.9473684210526,"audioSegment":0},{"text":"See the CLI reference.","startTime":962.9473684210526,"endTime":966,"audioSegment":0},{"text":"Pages.","startTime":966,"endTime":968.52,"audioSegment":0},{"text":"Project-type pages can query a project's tables, open data files with gezel.data.open(),","startTime":968.52,"endTime":971.04,"audioSegment":0},{"text":"accept scoped uploads declared in pages.imports, and reuse the shared fileCard and fileAdder components.","startTime":971.04,"endTime":973.56,"audioSegment":0},{"text":"They inherit the host's fonts.","startTime":973.56,"endTime":976.08,"audioSegment":0},{"text":"gezel app demo <folder> exports an offline demo of a private app.","startTime":976.08,"endTime":978.6,"audioSegment":0},{"text":"New guides: Page APIs and the page style guide. App SDK.","startTime":978.6,"endTime":981.12,"audioSegment":0},{"text":"A new images grant and /v1/images/* routes with streamed progress.","startTime":981.12,"endTime":983.64,"audioSegment":0},{"text":"An app can add scopes to its grant without disconnecting.","startTime":983.64,"endTime":986.16,"audioSegment":0},{"text":"knowledgeContext() reports whether knowledge was used and returns the passages,","startTime":986.16,"endTime":988.68,"audioSegment":0},{"text":"and accepts an explicit query and numbered citations.","startTime":988.68,"endTime":991.2,"audioSegment":0},{"text":"In-process hosting takes logOutput,","startTime":991.2,"endTime":993.72,"audioSegment":0},{"text":"and embedded daemon logs go to stderr by default. Grounding.","startTime":993.72,"endTime":996.24,"audioSegment":0},{"text":"The citation checker that gezel runs for factual writing is published as @bendyline/gezel/grounding.","startTime":996.24,"endTime":998.76,"audioSegment":0},{"text":"OpenAI-compatible routes return typed error codes when an engine fails (capacity,","startTime":998.76,"endTime":1001.28,"audioSegment":0},{"text":"busy, launch failure, crash, context overflow, not ready).","startTime":1001.28,"endTime":1003.8,"audioSegment":0},{"text":"Downloadable /v1/models entries say how well each model fits the device.","startTime":1003.8,"endTime":1006.32,"audioSegment":0},{"text":"Remote serving.","startTime":1006.32,"endTime":1008.84,"audioSegment":0},{"text":"The /v1/remote/* wire contract and SPAKE2 pairing live in @bendyline/gezel/remote.","startTime":1008.84,"endTime":1011.36,"audioSegment":0},{"text":"New routes: /api/remotes/pair-with-code, /api/remotes/discover and /v1/apps/pair/start|finish.","startTime":1011.36,"endTime":1013.88,"audioSegment":0},{"text":"API compatibility.","startTime":1013.88,"endTime":1016.4,"audioSegment":0},{"text":"/api/health publishes an apiCompat range.","startTime":1016.4,"endTime":1018.92,"audioSegment":0},{"text":"Clients decline a daemon outside that range with daemon_incompatible.","startTime":1018.92,"endTime":1021.44,"audioSegment":0},{"text":"It also reports the daemon's pid and hostedBy (app or standalone).","startTime":1021.44,"endTime":1023.96,"audioSegment":0},{"text":"Native engines are pinned to release 0.1.54,","startTime":1023.96,"endTime":1026.48,"audioSegment":0},{"text":"which adds CUDA builds for Windows on ARM.","startTime":1026.48,"endTime":1029,"audioSegment":0},{"text":"Open a project that holds a folder and choose Views.","startTime":1029,"endTime":1031.888888888889,"audioSegment":0},{"text":"Try the Gallery on your Pictures folder,","startTime":1031.888888888889,"endTime":1034.7777777777778,"audioSegment":0},{"text":"or the Guide on a codebase.","startTime":1034.7777777777778,"endTime":1037.6666666666667,"audioSegment":0},{"text":"If you use Claude Code or Codex, set up Gezel's tools for it in Settings → Integrations,","startTime":1037.6666666666667,"endTime":1040.5555555555557,"audioSegment":0},{"text":"and paste the line it shows into that folder's instructions file.","startTime":1040.5555555555557,"endTime":1043.4444444444443,"audioSegment":0},{"text":"If you have a second computer running gezel,","startTime":1043.4444444444443,"endTime":1046.3333333333333,"audioSegment":0},{"text":"pair the two in Settings → Remote Servers.","startTime":1046.3333333333333,"endTime":1049.2222222222222,"audioSegment":0},{"text":"And if there is a room you would like watched,","startTime":1049.2222222222222,"endTime":1052.111111111111,"audioSegment":0},{"text":"add a Webcam under a project's About → Connections.","startTime":1052.111111111111,"endTime":1055,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26300 — 27 October 2026","subtitle":"Thirteen days after 1.26287. Your gezellen are the named AI craftspeople on your crew (one is a gezel). They can now watch a room through a webcam and act on what they see, following rules you write as a sentence. A project that holds a folder gets a Views tab that shows what is in it: on shelves, on a timeline, as a diagram. And AI apps you already use, such as Claude Code and Codex, can now use Gezel's search, document reading and memory while they work.","ambientMotion":"zoomIn"}}</script>
