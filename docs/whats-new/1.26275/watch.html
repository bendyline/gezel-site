<script type="application/json" id="squisq-doc" data-squisq-doc="1">{"articleId":"whats-new/1.26275","duration":753,"blocks":[{"id":"126275-2-october-2026","startTime":0,"duration":26,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":1,"children":[{"type":"text","value":"1.26275 — 2 October 2026","position":{"start":{"line":1,"column":3,"offset":2},"end":{"line":1,"column":27,"offset":26}}}],"position":{"start":{"line":1,"column":1,"offset":0},"end":{"line":1,"column":27,"offset":26}}},"title":"1.26275 — 2 October 2026","contents":[{"type":"paragraph","children":[{"type":"text","value":"Your crew wastes less time and does less you did not ask for. A local model no longer re-reads a whole conversation it had already read. A review that sends work back now gets that work redone. A project you set to read-only now stays read-only. There is also a round of fixes for ways work could be lost.","position":{"start":{"line":3,"column":1,"offset":28},"end":{"line":3,"column":306,"offset":333}}}],"position":{"start":{"line":3,"column":1,"offset":28},"end":{"line":3,"column":306,"offset":333}}},{"type":"paragraph","children":[{"type":"text","value":"If you read only one thing: a gezel could change files in a project where you had turned workspace edits off. That is fixed. Nothing you do changes.","position":{"start":{"line":5,"column":1,"offset":335},"end":{"line":5,"column":149,"offset":483}}}],"position":{"start":{"line":5,"column":1,"offset":335},"end":{"line":5,"column":149,"offset":483}}}],"children":[{"id":"local-models-reply-sooner-in-an-ongoing-chat","startTime":26,"duration":92,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Local models reply sooner in an ongoing chat","position":{"start":{"line":7,"column":4,"offset":488},"end":{"line":7,"column":48,"offset":532}}}],"position":{"start":{"line":7,"column":1,"offset":485},"end":{"line":7,"column":48,"offset":532}}},"title":"Local models reply sooner in an ongoing chat","contents":[{"type":"paragraph","children":[{"type":"text","value":"Before a model on your computer can answer, it reads everything in front of it: its instructions, the list of tools it may use, and the conversation so far. Gezel keeps a copy of what it has already read, so the next message only has to read what is new. This release fixes three ways that copy was thrown away.","position":{"start":{"line":9,"column":1,"offset":534},"end":{"line":9,"column":312,"offset":845}}}],"position":{"start":{"line":9,"column":1,"offset":534},"end":{"line":9,"column":312,"offset":845}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The second message in a chat","position":{"start":{"line":11,"column":5,"offset":851},"end":{"line":11,"column":33,"offset":879}}}],"position":{"start":{"line":11,"column":3,"offset":849},"end":{"line":11,"column":35,"offset":881}}},{"type":"text","value":" (models on a Mac, through MLX). The first chat to save the shared part of the prompt saved only that part, so its own next message started over. On Gemma 4 E4B, with the ","position":{"start":{"line":11,"column":35,"offset":881},"end":{"line":11,"column":206,"offset":1052}}},{"type":"strong","children":[{"type":"text","value":"Meester's","position":{"start":{"line":11,"column":208,"offset":1054},"end":{"line":11,"column":217,"offset":1063}}}],"position":{"start":{"line":11,"column":206,"offset":1052},"end":{"line":11,"column":219,"offset":1065}}},{"type":"text","value":" 60 tools, that meant re-reading 7,313 of 8,604 tokens. Now one read saves both the shared part and the chat's own place.","position":{"start":{"line":11,"column":219,"offset":1065},"end":{"line":11,"column":340,"offset":1186}}}],"position":{"start":{"line":11,"column":3,"offset":849},"end":{"line":11,"column":340,"offset":1186}}}],"position":{"start":{"line":11,"column":1,"offset":847},"end":{"line":11,"column":340,"offset":1186}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Asking for something to be built partway through a chat","position":{"start":{"line":12,"column":5,"offset":1191},"end":{"line":12,"column":60,"offset":1246}}}],"position":{"start":{"line":12,"column":3,"offset":1189},"end":{"line":12,"column":62,"offset":1248}}},{"type":"text","value":" (also MLX). A request to build or to run a specific ","position":{"start":{"line":12,"column":62,"offset":1248},"end":{"line":12,"column":115,"offset":1301}}},{"type":"strong","children":[{"type":"text","value":"craftbook","position":{"start":{"line":12,"column":117,"offset":1303},"end":{"line":12,"column":126,"offset":1312}}}],"position":{"start":{"line":12,"column":115,"offset":1301},"end":{"line":12,"column":128,"offset":1314}}},{"type":"text","value":" narrowed the tool list. Narrowing rewrote the prompt from near its start, so the whole 6,420-token prompt was read again, and again on the next ordinary message. Now the full list stays in the prompt, and the engine limits which tools can actually be called. The one cost: a chat whose very first message asks for a build reads the full list once.","position":{"start":{"line":12,"column":128,"offset":1314},"end":{"line":12,"column":476,"offset":1662}}}],"position":{"start":{"line":12,"column":3,"offset":1189},"end":{"line":12,"column":476,"offset":1662}}}],"position":{"start":{"line":12,"column":1,"offset":1187},"end":{"line":12,"column":476,"offset":1662}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"After the engine unloads a model, or gezel restarts.","position":{"start":{"line":13,"column":5,"offset":1667},"end":{"line":13,"column":57,"offset":1719}}}],"position":{"start":{"line":13,"column":3,"offset":1665},"end":{"line":13,"column":59,"offset":1721}}},{"type":"text","value":" The resumed conversation used to differ slightly from what the engine had saved: the date line and the reference material added to each message were missing. So the engine read the whole conversation again from the first message. Each message now keeps those additions and replays them exactly, which lets llama.cpp and Anthropic's prompt cache pick up where they left off. That holds up to the first turn in which a gezel used a tool. Saved threads grow by a few KB on turns that drew in reference material.","position":{"start":{"line":13,"column":59,"offset":1721},"end":{"line":13,"column":568,"offset":2230}}}],"position":{"start":{"line":13,"column":3,"offset":1665},"end":{"line":13,"column":568,"offset":2230}}}],"position":{"start":{"line":13,"column":1,"offset":1663},"end":{"line":13,"column":568,"offset":2230}}}],"position":{"start":{"line":11,"column":1,"offset":847},"end":{"line":13,"column":568,"offset":2230}}}]},{"id":"reviews-that-send-work-back-now-get-it-redone","startTime":118,"duration":123,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Reviews that send work back now get it redone","position":{"start":{"line":15,"column":4,"offset":2235},"end":{"line":15,"column":49,"offset":2280}}}],"position":{"start":{"line":15,"column":1,"offset":2232},"end":{"line":15,"column":49,"offset":2280}}},"title":"Reviews that send work back now get it redone","contents":[{"type":"paragraph","children":[{"type":"text","value":"Some craftbooks end with a review step that can send the work back to be done again. When the work had been split into pieces that several gezels do at once, sending it back did nothing. The step marked itself done in the same instant, and the review ran again over the same unchanged pieces. Now a new round of the same pieces starts. Each one is marked \"(pass 2)\" and carries the review's verdict. The review's own limit still applies: after the third failed review the task pauses, and ","position":{"start":{"line":17,"column":1,"offset":2282},"end":{"line":17,"column":490,"offset":2771}}},{"type":"strong","children":[{"type":"text","value":"Try again","position":{"start":{"line":17,"column":492,"offset":2773},"end":{"line":17,"column":501,"offset":2782}}}],"position":{"start":{"line":17,"column":490,"offset":2771},"end":{"line":17,"column":503,"offset":2784}}},{"type":"text","value":" gives it a fresh set of attempts.","position":{"start":{"line":17,"column":503,"offset":2784},"end":{"line":17,"column":537,"offset":2818}}}],"position":{"start":{"line":17,"column":1,"offset":2282},"end":{"line":17,"column":537,"offset":2818}}},{"type":"paragraph","children":[{"type":"text","value":"Other fixes to craftbook tasks, each found in real runs:","position":{"start":{"line":19,"column":1,"offset":2820},"end":{"line":19,"column":57,"offset":2876}}}],"position":{"start":{"line":19,"column":1,"offset":2820},"end":{"line":19,"column":57,"offset":2876}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A reply left over from an earlier round can no longer pause or advance the task.","position":{"start":{"line":21,"column":5,"offset":2882},"end":{"line":21,"column":85,"offset":2962}}}],"position":{"start":{"line":21,"column":3,"offset":2880},"end":{"line":21,"column":87,"offset":2964}}},{"type":"text","value":" Last release stopped such a reply from finishing the task's current round on its own. It could still pause the task, or ask to move it on. In one run it paused the whole thing. Those requests are now refused. A gezel whose work was sent back also stops there, instead of being prompted for another reply.","position":{"start":{"line":21,"column":87,"offset":2964},"end":{"line":21,"column":392,"offset":3269}}}],"position":{"start":{"line":21,"column":3,"offset":2880},"end":{"line":21,"column":392,"offset":3269}}}],"position":{"start":{"line":21,"column":1,"offset":2878},"end":{"line":21,"column":392,"offset":3269}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Gezels are no longer offered tools only the Meester or a project lead may use.","position":{"start":{"line":22,"column":5,"offset":3274},"end":{"line":22,"column":83,"offset":3352}}}],"position":{"start":{"line":22,"column":3,"offset":3272},"end":{"line":22,"column":85,"offset":3354}}},{"type":"text","value":" A Developer called a tool for importing skills 21 times in one run, and was refused every time. Workers no longer see those tools at all. Every gezel can now look things up in Help, and a worker asking for \"my tasks\" gets its own project's list instead of a refusal.","position":{"start":{"line":22,"column":85,"offset":3354},"end":{"line":22,"column":352,"offset":3621}}}],"position":{"start":{"line":22,"column":3,"offset":3272},"end":{"line":22,"column":352,"offset":3621}}}],"position":{"start":{"line":22,"column":1,"offset":3270},"end":{"line":22,"column":352,"offset":3621}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A file saved in the wrong place gets a clear answer.","position":{"start":{"line":23,"column":5,"offset":3626},"end":{"line":23,"column":57,"offset":3678}}}],"position":{"start":{"line":23,"column":3,"offset":3624},"end":{"line":23,"column":59,"offset":3680}}},{"type":"text","value":" When a step's check could not find a file, it now says where it looked and where the file actually is. For example: \"it was saved as ","position":{"start":{"line":23,"column":59,"offset":3680},"end":{"line":23,"column":193,"offset":3814}}},{"type":"inlineCode","value":"1/handover.md","position":{"start":{"line":23,"column":193,"offset":3814},"end":{"line":23,"column":208,"offset":3829}}},{"type":"text","value":" instead. Save it at ","position":{"start":{"line":23,"column":208,"offset":3829},"end":{"line":23,"column":229,"offset":3850}}},{"type":"inlineCode","value":"handover.md","position":{"start":{"line":23,"column":229,"offset":3850},"end":{"line":23,"column":242,"offset":3863}}},{"type":"text","value":" in the artifacts drawer.\"","position":{"start":{"line":23,"column":242,"offset":3863},"end":{"line":23,"column":268,"offset":3889}}}],"position":{"start":{"line":23,"column":3,"offset":3624},"end":{"line":23,"column":268,"offset":3889}}}],"position":{"start":{"line":23,"column":1,"offset":3622},"end":{"line":23,"column":268,"offset":3889}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The Night Shift no longer asks about a task that never ran.","position":{"start":{"line":24,"column":5,"offset":3894},"end":{"line":24,"column":64,"offset":3953}}}],"position":{"start":{"line":24,"column":3,"offset":3892},"end":{"line":24,"column":66,"offset":3955}}},{"type":"text","value":" The Night Shift is the work gezel does overnight, while you are away (","position":{"start":{"line":24,"column":66,"offset":3955},"end":{"line":24,"column":137,"offset":4026}}},{"type":"link","url":"../../night-shift/","children":[{"type":"text","value":"Night Shift","position":{"start":{"line":24,"column":138,"offset":4027},"end":{"line":24,"column":149,"offset":4038}}}],"position":{"start":{"line":24,"column":137,"offset":4026},"end":{"line":24,"column":170,"offset":4059}}},{"type":"text","value":"). If you opened gezel a few times during the day, the Meester's Night Shift oversight task counted each launch as a failed restart, paused itself, and filed a \"Needs your input\" card. Launches while a task is only waiting for the night no longer count. One already paused this way is switched back on when you update. ","position":{"start":{"line":24,"column":170,"offset":4059},"end" olumn":1,"offset":4557},"end":{"line":27,"column":50,"offset":4606}}},"title":"A project you set to read-only stays read-only","contents":[{"type":"paragraph","children":[{"type":"text","value":"Each project has a setting, ","position":{"start":{"line":29,"column":1,"offset":4608},"end":{"line":29,"column":29,"offset":4636}}},{"type":"strong","children":[{"type":"text","value":"Allow built-in tools and background work to modify the workspace","position":{"start":{"line":29,"column":31,"offset":4638},"end":{"line":29,"column":95,"offset":4702}}}],"position":{"start":{"line":29,"column":29,"offset":4636},"end":{"line":29,"column":97,"offset":4704}}},{"type":"text","value":" in ","position":{"start":{"line":29,"column":97,"offset":4704},"end":{"line":29,"column":101,"offset":4708}}},{"type":"strong","children":[{"type":"text","value":"Project → Settings","position":{"start":{"line":29,"column":103,"offset":4710},"end":{"line":29,"column":121,"offset":4728}}}],"position":{"start":{"line":29,"column":101,"offset":4708},"end":{"line":29,"column":123,"offset":4730}}},{"type":"text","value":". With it off, gezels may not change the project's files. A gezel could get past it: a change that did not say who was making it was treated as yours, and raw file uploads did not record a writer at all. The same gap let a gezel edit your saved prompt drafts. Gezel now decides who is writing from the credentials the gezel's chat holds, not from what the request claims.","position":{"start":{"line":29,"column":123,"offset":4730},"end":{"line":29,"column":494,"offset":5101}}}],"position":{"start":{"line":29,"column":1,"offset":4608},"end":{"line":29,"column":494,"offset":5101}}},{"type":"paragraph","children":[{"type":"text","value":"Nothing you do changes for any of these.","position":{"start":{"line":31,"column":1,"offset":5103},"end":{"line":31,"column":41,"offset":5143}}}],"position":{"start":{"line":31,"column":1,"offset":5103},"end":{"line":31,"column":41,"offset":5143}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Git follows the same setting.","position":{"start":{"line":33,"column":5,"offset":5149},"end":{"line":33,"column":34,"offset":5178}}}],"position":{"start":{"line":33,"column":3,"offset":5147},"end":{"line":33,"column":36,"offset":5180}}},{"type":"text","value":" A gezel can no longer throw away your uncommitted changes or abandon a merge. Cloning, pulling, committing, pushing and the rest obey the project's edit setting.","position":{"start":{"line":33,"column":36,"offset":5180},"end":{"line":33,"column":198,"offset":5342}}}],"position":{"start":{"line":33,"column":3,"offset":5147},"end":{"line":33,"column":198,"offset":5342}}}],"position":{"start":{"line":33,"column":1,"offset":5145},"end":{"line":33,"column":198,"offset":5342}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A shortcut cannot carry a write outside its folder.","position":{"start":{"line":34,"column":5,"offset":5347},"end":{"line":34,"column":56,"offset":5398}}}],"position":{"start":{"line":34,"column":3,"offset":5345},"end":{"line":34,"column":58,"offset":5400}}},{"type":"text","value":" A symbolic link (a file system shortcut) inside a project, the artifacts drawer or your shared Documents library could send a write or a delete somewhere outside it. That is now refused.","position":{"start":{"line":34,"column":58,"offset":5400},"end":{"line":34,"column":245,"offset":5587}}}],"position":{"start":{"line":34,"column":3,"offset":5345},"end":{"line":34,"column":245,"offset":5587}}}],"position":{"start":{"line":34,"column":1,"offset":5343},"end":{"line":34,"column":245,"offset":5587}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"No folder can be deleted whole by a path like ","position":{"start":{"line":35,"column":5,"offset":5592},"end":{"line":35,"column":51,"offset":5638}}},{"type":"inlineCode","value":".","position":{"start":{"line":35,"column":51,"offset":5638},"end":{"line":35,"column":54,"offset":5641}}},{"type":"text","value":".","position":{"start":{"line":35,"column":54,"offset":5641},"end":{"line":35,"column":55,"offset":5642}}}],"position":{"start":{"line":35,"column":3,"offset":5590},"end":{"line":35,"column":57,"offset":5644}}},{"type":"text","value":" Last release stopped a path written as ","position":{"start":{"line":35,"column":57,"offset":5644},"end":{"line":35,"column":97,"offset":5684}}},{"type":"inlineCode","value":".","position":{"start":{"line":35,"column":97,"offset":5684},"end":{"line":35,"column":100,"offset":5687}}},{"type":"text","value":" or ","position":{"start":{"line":35,"column":100,"offset":5687},"end":{"line":35,"column":104,"offset":5691}}},{"type":"inlineCode","value":"notes/..","position":{"start":{"line":35,"column":104,"offset":5691},"end":{"line":35,"column":114,"offset":5701}}},{"type":"text","value":" from deleting the entire artifacts drawer. The same protection now covers the project's own folder and your shared Documents library.","position":{"start":{"line":35,"column":114,"offset":5701},"end":{"line":35,"column":248,"offset":5835}}}],"position":{"start":{"line":35,"column":3,"offset":5590},"end":{"line":35,"column":248,"offset":5835}}}],"position":{"start":{"line":35,"column":1,"offset":5588},"end":{"line":35,"column":248,"offset":5835}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"In Word, Excel, PowerPoint and LibreOffice, the document tools stay with the pane's own chat.","position":{"start":{"line":36,"column":5,"offset":5840},"end":{"line":36,"column":98,"offset":5933}}}],"position":{"start":{"line":36,"column":3,"offset":5838},"end":{"line":36,"column":100,"offset":5935}}},{"type" position":{"start":{"line":87,"column":80,"offset":14353},"end":{"line":87,"column":85,"offset":14358}}},{"type":"text","value":" changed while it was being edited. Reload it and retry.\"","position":{"start":{"line":87,"column":85,"offset":14358},"end":{"line":87,"column":142,"offset":14415}}}],"position":{"start":{"line":87,"column":3,"offset":14276},"end":{"line":87,"column":142,"offset":14415}}}],"position":{"start":{"line":87,"column":1,"offset":14274},"end":{"line":87,"column":142,"offset":14415}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Knowledge compiler.","position":{"start":{"line":88,"column":5,"offset":14420},"end":{"line":88,"column":24,"offset":14439}}}],"position":{"start":{"line":88,"column":3,"offset":14418},"end":{"line":88,"column":26,"offset":14441}}},{"type":"text","value":" docfx outlines (","position":{"start":{"line":88,"column":26,"offset":14441},"end":{"line":88,"column":43,"offset":14458}}},{"type":"inlineCode","value":"\"toc\": {\"format\": \"docfx\"}","position":{"start":{"line":88,"column":43,"offset":14458},"end":{"line":88,"column":71,"offset":14486}}},{"type":"text","value":"), outlines deeper than 15 levels folded into their parent with a warning, and repeated warnings capped at 20 examples.","position":{"start":{"line":88,"column":71,"offset":14486},"end":{"line":88,"column":190,"offset":14605}}}],"position":{"start":{"line":88,"column":3,"offset":14418},"end":{"line":88,"column":190,"offset":14605}}}],"position":{"start":{"line":88,"column":1,"offset":14416},"end":{"line":88,"column":190,"offset":14605}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Scripts.","position":{"start":{"line":89,"column":5,"offset":14610},"end":{"line":89,"column":13,"offset":14618}}}],"position":{"start":{"line":89,"column":3,"offset":14608},"end":{"line":89,"column":15,"offset" ion":{"start":{"line":89,"column":3,"offset":14608},"end":{"line":89,"column":239,"offset":14844}}}],"position":{"start":{"line":89,"column":1,"offset":14606},"end":{"line":89,"column":239,"offset":14844}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Dependencies: ","position":{"start":{"line":90,"column":3,"offset":14847},"end":{"line":90,"column":17,"offset":14861}}},{"type":"inlineCode","value":"@bendyline/gilde","position":{"start":{"line":90,"column":17,"offset":14861},"end":{"line":90,"column":35,"offset":14879}}},{"type":"text","value":" 0.1.80; ","position":{"start":{"line":90,"column":35,"offset":14879},"end":{"line":90,"column":44,"offset":14888}}},{"type":"inlineCode","value":"mermaid","position":{"start":{"line":90,"column":44,"offset":14888},"end":{"line":90,"column":53,"offset":14897}}},{"type":"text","value":" 11.16.1 joins the UI, loaded the first time a diagram is drawn.","position":{"start":{"line":90,"column":53,"offset":14897},"end":{"line":90,"column":117,"offset":14961}}}],"position":{"start":{"line":90,"column":3,"offset":14847},"end":{"line":90,"column":117,"offset":14961}}}],"position":{"start":{"line":90,"column":1,"offset":14845},"end":{"line":90,"column":117,"offset":14961}}}],"position":{"start":{"line":81,"column":1,"offset":12392},"end":{"line":90,"column":117,"offset":14961}}}],"autoTemplate":true,"templateData":{"items":["One-shot completions. POST /api/projects/:id/completions and client.completeInProject() make one bounded model call with no tools or transcript, on the project's engine queue. gezel workflow driver modules get it as complete(request), which takes a jsonSchema (grammar-constrained on local engines), thinking, maxTokens, timeoutMs and a queue label, and returns { content, json?, jsonError?, elapsedMs }. It waits out a busy engine, and a capacity refusal for up to 120 s. Errors are engine_busy, capacity_denied, model_not_installed, completion_timeout, completion_cancelled, provider_unavailable and output_aborted. Session tokens are refused.","Performance diagnostics. Every response carries Server-Timing. GET /api/system/perf returns event-loop stalls, slow requests and renderer navigation timings, which the UI reports through POST /api/system/perf/client. With debug mode or GEZEL_PERF_PROFILE=1, each stall saves logs/perf/stall-*.cpuprofile (newest 20).","App tools by surface. App SDK tool registrations take a surfaceId, and chat requests carry it in x-gezel-app-surface. A surface-scoped tool is offered only to a session whose latest human message came through that surface.","Write attribution. A session token's writes are attributed to its own gezel and session whatever the body claims. A session token without a gezel gets 403 session token has no mutation actor.","Web tool errors. fetch_url, web search and the Wikipedia and Wikimedia tools return upstream_timeout (504), upstream_unreachable or upstream_tls_failed (502) instead of internal_error. @bendyline/gezel-client keeps the whole cause chain on transport errors.","OpenAI-compatible reasoning_effort. none or minimal turns thinking off on local models. Other values pass through and never turn thinking on.","Tasks carry a revision. Concurrent writes retry, then answer 409 \"Task  changed while it was being edited. Reload it and retry.\"","Knowledge compiler. docfx outlines (\"toc\": {\"format\": \"docfx\"}), outlines deeper than 15 levels folded into their parent with a warning, and repeated warnings capped at 20 examples.","Scripts. run_installed_script without a scope looks in project, then user, then standard scope. storeRecords in single-file mode no longer turns root: \"repairs.json\" into repairs.json.json, and every action returns file.","Dependencies: @bendyline/gilde 0.1.80; mermaid 11.16.1 joins the UI, loaded the first time a diagram is drawn."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":738,"duration":15,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":92,"column":4,"offset":14966},"end":{"line":92,"column":37,"offset":14999}}}],"position":{"start":{"line":92,"column":1,"offset":14963},"end":{"line":92,"column":37,"offset":14999}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"If you keep any project read-only, open ","position":{"start":{"line":94,"column":1,"offset":15001},"end":{"line":94,"column":41,"offset":15041}}},{"type":"strong","children":[{"type":"text","value":"Project → Settings","position":{"start":{"line":94,"column":43,"offset":15043},"end":{"line":94,"column":61,"offset":15061}}}],"position":{"start":{"line":94,"column":41,"offset":15041},"end":{"line":94,"column":63,"offset":15063}}},{"type":"text","value":" and confirm ","position":{"start":{"line":94,"column":63,"offset":15063},"end":{"line":94,"column":76,"offset":15076}}},{"type":"strong","children":[{"type":"text","value":"Allow built-in tools and background work to modify the workspace","position":{"start":{"line":94,"column":78,"offset":15078},"end":{"line":94,"column":142,"offset":15142}}}],"position":{"start":{"line":94,"column":76,"offset":15076},"end":{"line":94,"column":144,"offset":15144}}},{"type":"text","value":" is set the way you want; it now holds. If you write in Word with the gezel add-in, ask its gezel for a flowchart of something you are describing.","position":{"start":{"line":94,"column":144,"offset":15144},"end":{"line":94,"column":290,"offset":15290}}}],"position":{"start":{"line":94,"column":1,"offset":15001},"end":{"line":94,"column":290,"offset":15290}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Your crew wastes less time and does less you did not ask for.","startTime":0,"endTime":3.7142857142857144,"audioSegment":0},{"text":"A local model no longer re-reads a whole conversation it had already read.","startTime":3.7142857142857144,"endTime":7.428571428571429,"audioSegment":0},{"text":"A review that sends work back now gets that work redone.","startTime":7.428571428571429,"endTime":11.142857142857142,"audioSegment":0},{"text":"A project you set to read-only now stays read-only.","startTime":11.142857142857142,"endTime":14.857142857142858,"audioSegment":0},{"text":"There is also a round of fixes for ways work could be lost.","startTime":14.857142857142858,"endTime":18.571428571428573,"audioSegment":0},{"text":"If you read only one thing: a gezel could change files in a project where you had turned workspace edits off. That is fixed.","startTime":18.571428571428573,"endTime":22.285714285714285,"audioSegment":0},{"text":"Nothing you do changes.","startTime":22.285714285714285,"endTime":26,"audioSegment":0},{"text":"Before a model on your computer can answer, it reads everything in front of it: its instructions,","startTime":26,"endTime":29.68,"audioSegment":0},{"text":"the list of tools it may use, and the conversation so far.","startTime":29.68,"endTime":33.36,"audioSegment":0},{"text":"Gezel keeps a copy of what it has already read,","startTime":33.36,"endTime":37.04,"audioSegment":0},{"text":"so the next message only has to read what is new.","startTime":37.04,"endTime":40.72,"audioSegment":0},{"text":"This release fixes three ways that copy was thrown away.","startTime":40.72,"endTime":44.400000000000006,"audioSegment":0},{"text":"The second message in a chat (models on a Mac, through MLX).","startTime":44.400000000000006,"endTime":48.08,"audioSegment":0},{"text":"The first chat to save the shared part of the prompt saved only that part,","startTime":48.08,"endTime":51.760000000000005,"audioSegment":0},{"text":"so its own next message started over.","startTime":51.760000000000005,"endTime":55.44,"audioSegment":0},{"text":"On Gemma 4 E4B, with the Meester's 60 tools,","startTime":55.44,"endTime":59.120000000000005,"audioSegment":0},{"text":"that meant re-reading 7,313 of 8,604 tokens.","startTime":59.120000000000005,"endTime":62.800000000000004,"audioSegment":0},{"text":"Now one read saves both the shared part and the chat's own place.","startTime":62.800000000000004,"endTime":66.48,"audioSegment":0},{"text":"Asking for something to be built partway through a chat (also MLX).","startTime":66.48,"endTime":70.16,"audioSegment":0},{"text":"A request to build or to run a specific craftbook narrowed the tool list.","startTime":70.16,"endTime":73.84,"audioSegment":0},{"text":"Narrowing rewrote the prompt from near its start,","startTime":73.84,"endTime":77.52000000000001,"audioSegment":0},{"text":"so the whole 6,420-token prompt was read again, and again on the next ordinary message.","startTime":77.52000000000001,"endTime":81.2,"audioSegment":0},{"text":"Now the full list stays in the prompt,","startTime":81.2,"endTime":84.88,"audioSegment":0},{"text":"and the engine limits which tools can actually be called.","startTime":84.88,"endTime":88.56,"audioSegment":0},{"text":"The one cost: a chat whose very first message asks for a build reads the full list once.","startTime":88.56,"endTime":92.24000000000001,"audioSegment":0},{"text":"After the engine unloads a model, or gezel restarts.","startTime":92.24000000000001,"endTime":95.92,"audioSegment":0},{"text":"The resumed conversation used to differ slightly from what the engine had saved: the date line and the reference material added to each message were missing.","startTime":95.92,"endTime":99.60000000000001,"audioSegment":0},{"text":"So the engine read the whole conversation again from the first message.","startTime":99.60000000000001,"endTime":103.28,"audioSegment":0},{"text":"Each message now keeps those additions and replays them exactly,","startTime":103.28,"endTime":106.96000000000001,"audioSegment":0},{"text":"which lets llama.cpp and Anthropic's prompt cache pick up where they left off.","startTime":106.96000000000001,"endTime":110.64,"audioSegment":0},{"text":"That holds up to the first turn in which a gezel used a tool.","startTime":110.64,"endTime":114.32000000000001,"audioSegment":0},{"text":"Saved threads grow by a few KB on turns that drew in reference material.","startTime":114.32000000000001,"endTime":118,"audioSegment":0},{"text":"Some craftbooks end with a review step that can send the work back to be done again.","startTime":118,"endTime":121.23684210526316,"audioSegment":0},{"text":"When the work had been split into pieces that several gezels do at once,","startTime":121.23684210526316,"endTime":124.47368421052632,"audioSegment":0},{"text":"sending it back did nothing.","startTime":124.47368421052632,"endTime":127.71052631578948,"audioSegment":0},{"text":"The step marked itself done in the same instant,","startTime":127.71052631578948,"endTime":130.94736842105263,"audioSegment":0},{"text":"and the review ran again over the same unchanged pieces.","startTime":130.94736842105263,"endTime":134.18421052631578,"audioSegment":0},{"text":"Now a new round of the same pieces starts.","startTime":134.18421052631578,"endTime":137.42105263157896,"audioSegment":0},{"text":"Each one is marked \"(pass 2)\" and carries the review's verdict.","startTime":137.42105263157896,"endTime":140.6578947368421,"audioSegment":0},{"text":"The review's own limit still applies: after the third failed review the task pauses,","startTime":140.6578947368421,"endTime":143.89473684210526,"audioSegment":0},{"text":"and Try again gives it a fresh set of attempts.","startTime":143.89473684210526,"endTime":147.1315789473684,"audioSegment":0},{"text":"Other fixes to craftbook tasks, each found in real runs:","startTime":147.1315789473684,"endTime":150.3684210526316,"audioSegment":0},{"text":"A reply left over from an earlier round can no longer pause or advance the task.","startTime":150.3684210526316,"endTime":153.60526315789474,"audioSegment":0},{"text":"Last release stopped such a reply from finishing the task's current round on its own.","startTime":153.60526315789474,"endTime":156.8421052631579,"audioSegment":0},{"text":"It could still pause the task, or ask to move it on.","startTime":156.8421052631579,"endTime":160.07894736842104,"audioSegment":0},{"text":"In one run it paused the whole thing.","startTime":160.07894736842104,"endTime":163.31578947368422,"audioSegment":0},{"text":"Those requests are now refused.","startTime":163.31578947368422,"endTime":166.55263157894737,"audioSegment":0},{"text":"A gezel whose work was sent back also stops there,","startTime":166.55263157894737,"endTime":169.78947368421052,"audioSegment":0},{"text":"instead of being prompted for another reply.","startTime":169.78947368421052,"endTime":173.0263157894737,"audioSegment":0},{"text":"Gezels are no longer offered tools only the Meester or a project lead may use.","startTime":173.0263157894737,"endTime":176.26315789473685,"audioSegment":0},{"text":"A Developer called a tool for importing skills 21 times in one run,","startTime":176.26315789473685,"endTime":179.5,"audioSegment":0},{"text":"and was refused every time.","startTime":179.5,"endTime":182.73684210526318,"audioSegment":0},{"text":"Workers no longer see those tools at all.","startTime":182.73684210526318,"endTime":185.9736842105263,"audioSegment":0},{"text":"Every gezel can now look things up in Help,","startTime":185.9736842105263,"endTime":189.21052631578948,"audioSegment":0},{"text":"and a worker asking for \"my tasks\" gets its own project's list instead of a refusal.","startTime":189.21052631578948,"endTime":192.44736842105263,"audioSegment":0},{"text":"A file saved in the wrong place gets a clear answer.","startTime":192.44736842105263,"endTime":195.68421052631578,"audioSegment":0},{"text":"When a step's check could not find a file,","startTime":195.68421052631578,"endTime":198.92105263157896,"audioSegment":0},{"text":"it now says where it looked and where the file actually is.","startTime":198.92105263157896,"endTime":202.1578947368421,"audioSegment":0},{"text":"For example: \"it was saved as 1/handover.md instead.","startTime":202.1578947368421,"endTime":205.39473684210526,"audioSegment":0},{"text":"Save it at handover.md in the artifacts drawer.\"","startTime":205.39473684210526,"endTime":208.63157894736844,"audioSegment":0},{"text":"The Night Shift no longer asks about a task that never ran.","startTime":208.63157894736844,"endTime":211.86842105263156,"audioSegment":0},{"text":"The Night Shift is the work gezel does overnight,","startTime":211.86842105263156,"endTime":215.10526315789474,"audioSegment":0},{"text":"while you are away (Night Shift).","startTime":215.10526315789474,"endTime":218.3421052631579,"audioSegment":0},{"text":"If you opened gezel a few times during the day, the Meester's Night Shift oversight task counted each launch as a failed restart,","startTime":218.3421052631579,"endTime":221.57894736842104,"audioSegment":0},{"text":"paused itself, and filed a \"Needs your input\" card.","startTime":221.57894736842104,"endTime":224.81578947368422,"audioSegment":0},{"text":"Launches while a task is only waiting for the night no longer count.","startTime":224.81578947368422,"endTime":228.05263157894737,"audioSegment":0},{"text":"One already paused this way is switched back on when you update.","startTime":228.05263157894737,"endTime":231.28947368421052,"audioSegment":0},{"text":"Try again now also clears the restart count.","startTime":231.28947368421052,"endTime":234.5263157894737,"audioSegment":0},{"text":"Two changes to one task no longer undo each other.","startTime":234.5263157894737,"endTime":237.76315789473685,"audioSegment":0},{"text":"Renaming a task while it was being paused could quietly undo the pause.","startTime":237.76315789473685,"endTime":241,"audioSegment":0},{"text":"Each project has a setting,","startTime":241,"endTime":244.10344827586206,"audioSegment":0},{"text":"Allow built-in tools and background work to modify the workspace in Project → Settings.","startTime":244.10344827586206,"endTime":247.20689655172413,"audioSegment":0},{"text":"With it off, gezels may not change the project's files.","startTime":247.20689655172413,"endTime":250.31034482758622,"audioSegment":0},{"text":"A gezel could get past it: a change that did not say who was making it was treated as yours,","startTime":250.31034482758622,"endTime":253.41379310344828,"audioSegment":0},{"text":"and raw file uploads did not record a writer at all.","startTime":253.41379310344828,"endTime":256.51724137931035,"audioSegment":0},{"text":"The same gap let a gezel edit your saved prompt drafts.","startTime":256.51724137931035,"endTime":259.62068965517244,"audioSegment":0},{"text":"Gezel now decides who is writing from the credentials the gezel's chat holds,","startTime":259.62068965517244,"endTime":262.7241379310345,"audioSegment":0},{"text":"not from what the request claims.","startTime":262.7241379310345,"endTime":265.82758620689657,"audioSegment":0},{"text":"Nothing you do changes for any of these.","startTime":265.82758620689657,"endTime":268.9310344827586,"audioSegment":0},{"text":"Git follows the same setting.","startTime":268.9310344827586,"endTime":272.0344827586207,"audioSegment":0},{"text":"A gezel can no longer throw away your uncommitted changes or abandon a merge.","startTime":272.0344827586207,"endTime":275.1379310344828,"audioSegment":0},{"text":"Cloning, pulling, committing, pushing and the rest obey the project's edit setting.","startTime":275.1379310344828,"endTime":278.2413793103448,"audioSegment":0},{"text":"A shortcut cannot carry a write outside its folder.","startTime":278.2413793103448,"endTime":281.3448275862069,"audioSegment":0},{"text":"A symbolic link (a file system shortcut) inside a project,","startTime":281.3448275862069,"endTime":284.44827586206895,"audioSegment":0},{"text":"the artifacts drawer or your shared Documents library could send a write or a delete somewhere outside it.","startTime":284.44827586206895,"endTime":287.55172413793105,"audioSegment":0},{"text":"That is now refused.","startTime":287.55172413793105,"endTime":290.6551724137931,"audioSegment":0},{"text":"No folder can be deleted whole by a path like ..","startTime":290.6551724137931,"endTime":293.7586206896552,"audioSegment":0},{"text":"Last release stopped a path written as . or notes/..","startTime":293.7586206896552,"endTime":296.8620689655172,"audioSegment":0},{"text":"from deleting the entire artifacts drawer.","startTime":296.8620689655172,"endTime":299.9655172413793,"audioSegment":0},{"text":"The same protection now covers the project's own folder and your shared Documents library.","startTime":299.9655172413793,"endTime":303.0689655172414,"audioSegment":0},{"text":"In Word, Excel, PowerPoint and LibreOffice,","startTime":303.0689655172414,"endTime":306.17241379310343,"audioSegment":0},{"text":"the document tools stay with the pane's own chat.","startTime":306.17241379310343,"endTime":309.2758620689655,"audioSegment":0},{"text":"Last release limited them to the gezel you picked in the pane.","startTime":309.2758620689655,"endTime":312.37931034482756,"audioSegment":0},{"text":"For a document not yet saved to a project,","startTime":312.37931034482756,"endTime":315.48275862068965,"audioSegment":0},{"text":"that gezel is the Meester.","startTime":315.48275862068965,"endTime":318.58620689655174,"audioSegment":0},{"text":"So the Meester's chat in the desktop app could also write into the open document.","startTime":318.58620689655174,"endTime":321.6896551724138,"audioSegment":0},{"text":"Now only the chat thread the pane is driving gets the tools.","startTime":321.6896551724138,"endTime":324.7931034482759,"audioSegment":0},{"text":"A thread that is also open in the desktop app loses them once you write to it there.","startTime":324.7931034482759,"endTime":327.8965517241379,"audioSegment":0},{"text":"See Connected apps.","startTime":327.8965517241379,"endTime":331,"audioSegment":0},{"text":"In the Word add-in,","startTime":331,"endTime":333.6363636363636,"audioSegment":0},{"text":"a gezel can now draw a diagram into your document.","startTime":333.6363636363636,"endTime":336.27272727272725,"audioSegment":0},{"text":"It writes the diagram as Mermaid, a short text format for flowcharts,","startTime":336.27272727272725,"endTime":338.90909090909093,"audioSegment":0},{"text":"sequences and timelines, and gezel draws it as a picture where the text goes.","startTime":338.90909090909093,"endTime":341.54545454545456,"audioSegment":0},{"text":"Lists can now be nested by indenting them,","startTime":341.54545454545456,"endTime":344.1818181818182,"audioSegment":0},{"text":"the way you would write them by hand.","startTime":344.1818181818182,"endTime":346.8181818181818,"audioSegment":0},{"text":"Every diagram is drawn before anything is inserted.","startTime":346.8181818181818,"endTime":349.45454545454544,"audioSegment":0},{"text":"If one cannot be drawn,","startTime":349.45454545454544,"endTime":352.09090909090907,"audioSegment":0},{"text":"the document is left untouched and the gezel is told what to fix.","startTime":352.09090909090907,"endTime":354.72727272727275,"audioSegment":0},{"text":"A Word too old to insert pictures,","startTime":354.72727272727275,"endTime":357.3636363636364,"audioSegment":0},{"text":"and LibreOffice Writer, keep the diagram as text.","startTime":357.3636363636364,"endTime":360,"audioSegment":0},{"text":"A message refused for lack of memory now stays put.","startTime":360,"endTime":363.1923076923077,"audioSegment":0},{"text":"When a model would not start because the computer was short of memory,","startTime":363.1923076923077,"endTime":366.38461538461536,"audioSegment":0},{"text":"your message showed briefly and then vanished on reload.","startTime":366.38461538461536,"endTime":369.5769230769231,"audioSegment":0},{"text":"There was no failure card and no Retry,","startTime":369.5769230769231,"endTime":372.7692307692308,"audioSegment":0},{"text":"which looked like a stuck app.","startTime":372.7692307692308,"endTime":375.96153846153845,"audioSegment":0},{"text":"The message is now saved with the reason and a Retry key.","startTime":375.96153846153845,"endTime":379.15384615384613,"audioSegment":0},{"text":"Change proposals hold up.","startTime":379.15384615384613,"endTime":382.34615384615387,"audioSegment":0},{"text":"A change proposal is a set of edits a gezel drafted for you to review before anything touches your files.","startTime":382.34615384615387,"endTime":385.53846153846155,"audioSegment":0},{"text":"A damaged proposals file used to be read as empty and then erased on the next change;","startTime":385.53846153846155,"endTime":388.7307692307692,"audioSegment":0},{"text":"gezel now stops and says the file needs repair.","startTime":388.7307692307692,"endTime":391.9230769230769,"audioSegment":0},{"text":"A proposal applied part way can be finished: Apply applies the remaining files,","startTime":391.9230769230769,"endTime":395.11538461538464,"audioSegment":0},{"text":"and each file already applied is marked Applied.","startTime":395.11538461538464,"endTime":398.3076923076923,"audioSegment":0},{"text":"Applying no longer overwrites a file created since the proposal was drafted,","startTime":398.3076923076923,"endTime":401.5,"audioSegment":0},{"text":"unless you choose to apply anyway.","startTime":401.5,"endTime":404.6923076923077,"audioSegment":0},{"text":"A new task can no longer overwrite an old one.","startTime":404.6923076923077,"endTime":407.88461538461536,"audioSegment":0},{"text":"If the file that numbers a project's tasks was missing or damaged, for instance after a restore,","startTime":407.88461538461536,"endTime":411.0769230769231,"audioSegment":0},{"text":"numbering started again from 1, and a new task could be written over an existing one.","startTime":411.0769230769231,"endTime":414.2692307692308,"audioSegment":0},{"text":"Numbering is now rebuilt from the tasks that exist,","startTime":414.2692307692308,"endTime":417.46153846153845,"audioSegment":0},{"text":"and a new task is never written over another.","startTime":417.46153846153845,"endTime":420.6538461538462,"audioSegment":0},{"text":"A task file gezel cannot read is now named in the log,","startTime":420.6538461538462,"endTime":423.84615384615387,"audioSegment":0},{"text":"with advice to repair or restore it, instead of quietly dropping out of the list.","startTime":423.84615384615387,"endTime":427.03846153846155,"audioSegment":0},{"text":"Restoring a backup does not overwrite what is new.","startTime":427.03846153846155,"endTime":430.2307692307692,"audioSegment":0},{"text":"Something created after you reviewed a restore is no longer replaced by it.","startTime":430.2307692307692,"endTime":433.4230769230769,"audioSegment":0},{"text":"Editing a file keeps its permissions.","startTime":433.4230769230769,"endTime":436.61538461538464,"audioSegment":0},{"text":"A script rewritten by a gezel stays runnable,","startTime":436.61538461538464,"endTime":439.8076923076923,"audioSegment":0},{"text":"and a private file stays private.","startTime":439.8076923076923,"endTime":443,"audioSegment":0},{"text":"Idle chats give their memory back.","startTime":443,"endTime":445.9824561403509,"audioSegment":0},{"text":"After 20 minutes without activity,","startTime":445.9824561403509,"endTime":448.96491228070175,"audioSegment":0},{"text":"a chat gives back the helper processes it holds.","startTime":448.96491228070175,"endTime":451.94736842105266,"audioSegment":0},{"text":"After a run of 27 tasks,","startTime":451.94736842105266,"endTime":454.9298245614035,"audioSegment":0},{"text":"29 of them used to stay alive, about 1.5 GB.","startTime":454.9298245614035,"endTime":457.9122807017544,"audioSegment":0},{"text":"The first reply when you come back to that chat may take a moment longer.","startTime":457.9122807017544,"endTime":460.89473684210526,"audioSegment":0},{"text":"Gezel is lighter while it sits open.","startTime":460.89473684210526,"endTime":463.87719298245617,"audioSegment":0},{"text":"Opening a project's chat no longer reads every saved thread four times,","startTime":463.87719298245617,"endTime":466.859649122807,"audioSegment":0},{"text":"which took about 110 ms each time with 300 threads.","startTime":466.859649122807,"endTime":469.8421052631579,"audioSegment":0},{"text":"Gezel no longer redraws the whole window every 10 seconds when nothing changed,","startTime":469.8421052631579,"endTime":472.82456140350877,"audioSegment":0},{"text":"and the knowledge catalog page no longer redraws every 2 seconds for nothing.","startTime":472.82456140350877,"endTime":475.8070175438597,"audioSegment":0},{"text":"On Windows, the check for Claude CLI and Codex CLI no longer looks at up to 576 files every 10 seconds;","startTime":475.8070175438597,"endTime":478.7894736842105,"audioSegment":0},{"text":"a newly installed one can take up to 30 seconds to appear.","startTime":478.7894736842105,"endTime":481.7719298245614,"audioSegment":0},{"text":"Knowledge catalog updates finish sooner.","startTime":481.7719298245614,"endTime":484.7543859649123,"audioSegment":0},{"text":"The catalog was fully checked a second time right after it was installed,","startTime":484.7543859649123,"endTime":487.7368421052632,"audioSegment":0},{"text":"roughly doubling the end of every update and holding up searches meanwhile.","startTime":487.7368421052632,"endTime":490.719298245614,"audioSegment":0},{"text":"If gezel freezes, the log says why.","startTime":490.719298245614,"endTime":493.70175438596493,"audioSegment":0},{"text":"A pause of a second or more is logged with what was running at the time,","startTime":493.70175438596493,"endTime":496.6842105263158,"audioSegment":0},{"text":"so a bug report can point at the cause.","startTime":496.6842105263158,"endTime":499.6666666666667,"audioSegment":0},{"text":"Dead websites read as dead websites.","startTime":499.6666666666667,"endTime":502.64912280701753,"audioSegment":0},{"text":"A site that timed out,","startTime":502.64912280701753,"endTime":505.63157894736844,"audioSegment":0},{"text":"could not be reached or had a bad certificate came back to the gezel as a generic error.","startTime":505.63157894736844,"endTime":508.6140350877193,"audioSegment":0},{"text":"It now says which,","startTime":508.6140350877193,"endTime":511.5964912280702,"audioSegment":0},{"text":"and to try another source instead of the same address.","startTime":511.5964912280702,"endTime":514.578947368421,"audioSegment":0},{"text":"Answers in a fixed format are no longer cut short.","startTime":514.578947368421,"endTime":517.561403508772,"audioSegment":0},{"text":"When a local model is asked for JSON,","startTime":517.561403508772,"endTime":520.5438596491229,"audioSegment":0},{"text":"the guard that stops runaway answers no longer cuts it off.","startTime":520.5438596491229,"endTime":523.5263157894736,"audioSegment":0},{"text":"A healthy 6.8 KB answer from Gemma 4 31B had been stopped halfway.","startTime":523.5263157894736,"endTime":526.5087719298245,"audioSegment":0},{"text":"Small models trip over paths less often.","startTime":526.5087719298245,"endTime":529.4912280701755,"audioSegment":0},{"text":"A leading workspace/ is dropped when there is no such folder,","startTime":529.4912280701755,"endTime":532.4736842105264,"audioSegment":0},{"text":"and listing a folder that does not exist says so and suggests close matches instead of \"Empty directory\".","startTime":532.4736842105264,"endTime":535.4561403508771,"audioSegment":0},{"text":"The Meester's openers go in once.","startTime":535.4561403508771,"endTime":538.438596491228,"audioSegment":0},{"text":"Tapping one of the Meester's suggested openers twice put the same sentence into your message twice.","startTime":538.438596491228,"endTime":541.421052631579,"audioSegment":0},{"text":"The Home greeting folds away while the Meester introduces itself,","startTime":541.421052631579,"endTime":544.4035087719299,"audioSegment":0},{"text":"so the introduction is not pushed below the fold.","startTime":544.4035087719299,"endTime":547.3859649122807,"audioSegment":0},{"text":"Settings in a narrow window uses a dropdown.","startTime":547.3859649122807,"endTime":550.3684210526316,"audioSegment":0},{"text":"Below about 760 pixels wide,","startTime":550.3684210526316,"endTime":553.3508771929825,"audioSegment":0},{"text":"Settings picks its section from one dropdown beside the heading.","startTime":553.3508771929825,"endTime":556.3333333333334,"audioSegment":0},{"text":"The list it replaces hid every section past the fourth.","startTime":556.3333333333334,"endTime":559.3157894736842,"audioSegment":0},{"text":"A status sits beside its heading.","startTime":559.3157894736842,"endTime":562.2982456140351,"audioSegment":0},{"text":"The Ready pill for Audio's speech engines no longer drops onto the line below.","startTime":562.2982456140351,"endTime":565.280701754386,"audioSegment":0},{"text":"Live updates survive a reload.","startTime":565.280701754386,"endTime":568.2631578947369,"audioSegment":0},{"text":"Reloading the window could leave a project's live updates connected but silent.","startTime":568.2631578947369,"endTime":571.2456140350878,"audioSegment":0},{"text":"Schedules accept 7 for Sunday.","startTime":571.2456140350878,"endTime":574.2280701754386,"audioSegment":0},{"text":"A schedule such as 0 9 * * 7 in the new-task dialog was rejected;","startTime":574.2280701754386,"endTime":577.2105263157895,"audioSegment":0},{"text":"7 now means Sunday, as 0 does.","startTime":577.2105263157895,"endTime":580.1929824561404,"audioSegment":0},{"text":"Lockdown says what it does.","startTime":580.1929824561404,"endTime":583.1754385964912,"audioSegment":0},{"text":"Super Lockdown used to promise that nothing leaves your machine,","startTime":583.1754385964912,"endTime":586.1578947368421,"audioSegment":0},{"text":"which was not true of a model or catalog download you start yourself.","startTime":586.1578947368421,"endTime":589.140350877193,"audioSegment":0},{"text":"It now says your work stays on your machine and gezel goes online only when you start something.","startTime":589.140350877193,"endTime":592.1228070175439,"audioSegment":0},{"text":"The app network setting's help text says the same.","startTime":592.1228070175439,"endTime":595.1052631578948,"audioSegment":0},{"text":"Templates no longer promise what depends on your model.","startTime":595.1052631578948,"endTime":598.0877192982456,"audioSegment":0},{"text":"The Caregiving binder, Household budget and Life binder project types,","startTime":598.0877192982456,"endTime":601.0701754385965,"audioSegment":0},{"text":"and the gezels that come with them, said nothing leaves your machine.","startTime":601.0701754385965,"endTime":604.0526315789474,"audioSegment":0},{"text":"That holds only with a model on your computer,","startTime":604.0526315789474,"endTime":607.0350877192982,"audioSegment":0},{"text":"so the claim is gone.","startTime":607.0350877192982,"endTime":610.0175438596491,"audioSegment":0},{"text":"The gezel catalog moved from 0.1.78 to 0.1.80.","startTime":610.0175438596491,"endTime":613,"audioSegment":0},{"text":"If you use the gezel command (The gezel command line covers it):","startTime":613,"endTime":616.8571428571429,"audioSegment":0},{"text":"gezel knowledge init in a folder that already holds Markdown catalogs it in place and prints the table of contents it found. Before,","startTime":616.8571428571429,"endTime":620.7142857142857,"audioSegment":0},{"text":"it created a content/ folder that hid the existing files from the build.","startTime":620.7142857142857,"endTime":624.5714285714286,"audioSegment":0},{"text":"docfx projects can be built into knowledge catalogs.","startTime":624.5714285714286,"endTime":628.4285714285714,"audioSegment":0},{"text":"Microsoft Learn trees such as azure-docs, recognized by docfx.json or a toc.yml at the top,","startTime":628.4285714285714,"endTime":632.2857142857143,"audioSegment":0},{"text":"keep docfx's own outline and publishing rules.","startTime":632.2857142857143,"endTime":636.1428571428571,"audioSegment":0},{"text":"gezel knowledge build prints the folder it read the content from.","startTime":636.1428571428571,"endTime":640,"audioSegment":0},{"text":"One-shot completions.","startTime":640,"endTime":642.45,"audioSegment":0},{"text":"POST /api/projects/:id/completions and client.completeInProject() make one bounded model call with no tools or transcript,","startTime":642.45,"endTime":644.9,"audioSegment":0},{"text":"on the project's engine queue.","startTime":644.9,"endTime":647.35,"audioSegment":0},{"text":"gezel workflow driver modules get it as complete(request), which takes a jsonSchema (grammar-constrained on local engines),","startTime":647.35,"endTime":649.8,"audioSegment":0},{"text":"thinking, maxTokens, timeoutMs and a queue label, and returns { content, json?, jsonError?, elapsedMs }.","startTime":649.8,"endTime":652.25,"audioSegment":0},{"text":"It waits out a busy engine,","startTime":652.25,"endTime":654.7,"audioSegment":0},{"text":"and a capacity refusal for up to 120 s.","startTime":654.7,"endTime":657.15,"audioSegment":0},{"text":"Errors are engine_busy, capacity_denied, model_not_installed, completion_timeout, completion_cancelled, provider_unavailable and output_aborted.","startTime":657.15,"endTime":659.6,"audioSegment":0},{"text":"Session tokens are refused.","startTime":659.6,"endTime":662.05,"audioSegment":0},{"text":"Performance diagnostics.","startTime":662.05,"endTime":664.5,"audioSegment":0},{"text":"Every response carries Server-Timing.","startTime":664.5,"endTime":666.95,"audioSegment":0},{"text":"GET /api/system/perf returns event-loop stalls, slow requests and renderer navigation timings,","startTime":666.95,"endTime":669.4,"audioSegment":0},{"text":"which the UI reports through POST /api/system/perf/client.","startTime":669.4,"endTime":671.85,"audioSegment":0},{"text":"With debug mode or GEZEL_PERF_PROFILE=1, each stall saves logs/perf/stall-*.cpuprofile (newest 20).","startTime":671.85,"endTime":674.3,"audioSegment":0},{"text":"App tools by surface.","startTime":674.3,"endTime":676.75,"audioSegment":0},{"text":"App SDK tool registrations take a surfaceId,","startTime":676.75,"endTime":679.2,"audioSegment":0},{"text":"and chat requests carry it in x-gezel-app-surface.","startTime":679.2,"endTime":681.65,"audioSegment":0},{"text":"A surface-scoped tool is offered only to a session whose latest human message came through that surface.","startTime":681.65,"endTime":684.1,"audioSegment":0},{"text":"Write attribution.","startTime":684.1,"endTime":686.55,"audioSegment":0},{"text":"A session token's writes are attributed to its own gezel and session whatever the body claims.","startTime":686.55,"endTime":689,"audioSegment":0},{"text":"A session token without a gezel gets 403 session token has no mutation actor.","startTime":689,"endTime":691.45,"audioSegment":0},{"text":"Web tool errors.","startTime":691.45,"endTime":693.9,"audioSegment":0},{"text":"fetch_url, web search and the Wikipedia and Wikimedia tools return upstream_timeout (504),","startTime":693.9,"endTime":696.35,"audioSegment":0},{"text":"upstream_unreachable or upstream_tls_failed (502) instead of internal_error.","startTime":696.35,"endTime":698.8,"audioSegment":0},{"text":"@bendyline/gezel-client keeps the whole cause chain on transport errors.","startTime":698.8,"endTime":701.25,"audioSegment":0},{"text":"OpenAI-compatible reasoning_effort.","startTime":701.25,"endTime":703.7,"audioSegment":0},{"text":"none or minimal turns thinking off on local models.","startTime":703.7,"endTime":706.15,"audioSegment":0},{"text":"Other values pass through and never turn thinking on.","startTime":706.15,"endTime":708.6,"audioSegment":0},{"text":"Tasks carry a revision.","startTime":708.6,"endTime":711.05,"audioSegment":0},{"text":"Concurrent writes retry,","startTime":711.05,"endTime":713.5,"audioSegment":0},{"text":"then answer 409 \"Task  changed while it was being edited.","startTime":713.5,"endTime":715.95,"audioSegment":0},{"text":"Reload it and retry.\"","startTime":715.95,"endTime":718.4,"audioSegment":0},{"text":"Knowledge compiler.","startTime":718.4,"endTime":720.85,"audioSegment":0},{"text":"docfx outlines (\"toc\": {\"format\": \"docfx\"}), outlines deeper than 15 levels folded into their parent with a warning,","startTime":720.85,"endTime":723.3,"audioSegment":0},{"text":"and repeated warnings capped at 20 examples. Scripts.","startTime":723.3,"endTime":725.75,"audioSegment":0},{"text":"run_installed_script without a scope looks in project, then user, then standard scope.","startTime":725.75,"endTime":728.2,"audioSegment":0},{"text":"storeRecords in single-file mode no longer turns root: \"repairs.json\" into repairs.json.json,","startTime":728.2,"endTime":730.65,"audioSegment":0},{"text":"and every action returns file.","startTime":730.65,"endTime":733.1,"audioSegment":0},{"text":"Dependencies: @bendyline/gilde 0.1.80; mermaid 11.16.1 joins the UI,","startTime":733.1,"endTime":735.55,"audioSegment":0},{"text":"loaded the first time a diagram is drawn.","startTime":735.55,"endTime":738,"audioSegment":0},{"text":"If you keep any project read-only,","startTime":738,"endTime":741.75,"audioSegment":0},{"text":"open Project → Settings and confirm Allow built-in tools and background work to modify the workspace is set the way you want; it now holds.","startTime":741.75,"endTime":745.5,"audioSegment":0},{"text":"If you write in Word with the gezel add-in,","startTime":745.5,"endTime":749.25,"audioSegment":0},{"text":"ask its gezel for a flowchart of something you are describing.","startTime":749.25,"endTime":753,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26275 — 2 October 2026","subtitle":"Your crew wastes less time and does less you did not ask for. A local model no longer re-reads a whole conversation it had already read. A review that sends work back now gets that work redone. A project you set to read-only now stays read-only. There is also a round of fixes for ways work could be lost.","ambientMotion":"zoomIn"}}</script>
