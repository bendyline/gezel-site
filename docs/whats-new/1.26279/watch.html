set":5318}}}],"position":{"start":{"line":40,"column":1,"offset":5257},"end":{"line":40,"column":64,"offset":5320}}},{"type":"text","value":" When gezels were working through a task, your question could sit behind them, labelled \"Processing prompt\", until it timed out without starting. In one case a 300-token question waited behind a 55,000-token task step for nearly seven minutes, then gave up. Now the model on your Mac (run through MLX, Apple's engine for its own chips) serves what you type, your answers to questions, and a gezel consulting another one for you ahead of task steps and other background work. Background work pauses between steps and resumes exactly where it left off. While you wait, the status reads \"Waiting for another chat to finish\" or, on the background reply, \"Paused while a chat goes first\". The one exception is a Mac already short of memory, where the background work keeps its place.","position":{"start":{"line":40,"column":64,"offset":5320},"end":{"line":40,"column":842,"offset":6098}}}],"position":{"start":{"line":40,"column":1,"offset":5257},"end":{"line":40,"column":842,"offset":6098}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Long conversations survive quitting, restarting and switching models.","position":{"start":{"line":42,"column":3,"offset":6102},"end":{"line":42,"column":72,"offset":6171}}}],"position":{"start":{"line":42,"column":1,"offset":6100},"end":{"line":42,"column":74,"offset":6173}}},{"type":"text","value":" The model keeps a copy of what it has already read, so the next message only reads what is new. That copy was often lost:","position":{"start":{"line":42,"column":74,"offset":6173},"end":{"line":42,"column":196,"offset":6295}}}],"position":{"start":{"line":42,"column":1,"offset":6100},"end":{"line":42,"column":196,"offset":6295}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"When gezel stopped the model.","position":{"start":{"line":44,"column":5,"offset":6301},"end":{"line":44,"column":34,"offset":6330}}}],"position":{"start":{"line":44,"column":3,"offset":6299},"end":{"line":44,"column":36,"offset":6332}}},{"type":"text","value":" The model had three seconds to save, and a 98,000-token conversation was lost that way. Gezel now asks it to save first, and waits up to 30 seconds.","position":{"start":{"line":44,"column":36,"offset":6332},"end":{"line":44,"column":185,"offset":6481}}}],"position":{"start":{"line":44,"column":3,"offset":6299},"end":{"line":44,"column":185,"offset":6481}}}],"position":{"start":{"line":44,"column":1,"offset":6297},"end":{"line":44,"column":185,"offset":6481}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"After a restart, once a gezel had used a tool.","position":{"start":{"line":45,"column":5,"offset":6486},"end":{"line":45,"column":51,"offset":6532}}}],"position":{"start":{"line":45,"column":3,"offset":6484},"end":{"line":45,"column":53,"offset":6534}}},{"type":"text","value":" Last release fixed this only up to the first time a gezel used a tool. On a Mac, gezel now saves the exact conversation the model saw, and replays it after a restart. A resumed 69,000-token task step used to read 55,000 tokens again, about four minutes on a 27B model.","position":{"start":{"line":45,"column":53,"offset":6534},"end":{"line":45,"column":322,"offset":6803}}}],"position":{"start":{"line":45,"column":3,"offset":6484},"end":{"line":45,"column":322,"offset":6803}}}],"position":{"start":{"line":45,"column":1,"offset":6482},"end":{"line":45,"column":322,"offset":6803}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"When you changed a setting.","position":{"start":{"line":46,"column":5,"offset":6808},"end":{"line":46,"column":32,"offset":6835}}}],"position":{"start":{"line":46,"column":3,"offset":6806},"end":{"line":46,"column":34,"offset":6837}}},{"type":"text","value":" Changing a setting no longer throws the copy away.","position":{"start":{"line":46,"column":34,"offset":6837},"end":{"line":46,"column":85,"offset":6888}}}],"position":{"start":{"line":46,"column":3,"offset":6806},"end":{"line":46,"column":85,"offset":6888}}}],"position":{"start":{"line":46,"column":1,"offset":6804},"end":{"line":46,"column":85,"offset":6888}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"When you stopped a reply.","position":{"start":{"line":47,"column":5,"offset":6893},"end":{"line":47,"column":30,"offset":6918}}}],"position":{"start":{"line":47,"column":3,"offset":6891},"end":{"line":47,"column":32,"offset":6920}}},{"type":"text","value":" A stopped or cancelled reply keeps what was read, so ","position":{"start":{"line":47,"column":32,"offset":6920},"end":{"line":47,"column":86,"offset":6974}}},{"type":"strong","children":[{"type":"text","value":"Retry","position":{"start":{"line":47,"column":88,"offset":6976},"end":{"line":47,"column":93,"offset":6981}}}],"position":{"start":{"line":47,"column":86,"offset":6974},"end":{"line":47,"column":95,"offset":6983}}},{"type":"text","value":" starts from there.","position":{"start":{"line":47,"column":95,"offset":6983},"end":{"line":47,"column":114,"offset":7002}}}],"position":{"start":{"line":47,"column":3,"offset":6891},"end":{"line":47,"column":114,"offset":7002}}}],"position":{"start":{"line":47,"column":1,"offset":6889},"end":{"line":47,"column":114,"offset":7002}}}],"position":{"start":{"line":44,"column":1,"offset":6297},"end":{"line":47,"column":114,"offset":7002}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Answers after a lookup are whole again.","position":{"start":{"line":49,"column":3,"offset":7006},"end":{"line":49,"column":42,"offset":7045}}}],"position":{"start":{"line":49,"column":1,"offset":7004},"end":{"line":49,"column":44,"offset":7047}}},{"type":"text","value":" Since 1.26274, some local models, Gemma among them, were cut short after using a tool. A reply longer than about 700 characters was reduced to its last paragraph, and the rest folded away as \"thinking\". This affected Macs and other computers alike. Replies after a search now keep their full answer.","position":{"start":{"line":49,"column":44,"offset":7047},"end":{"line":49,"column":344,"offset":7347}}}],"position":{"start":{"line":49,"column":1,"offset":7004},"end":{"line":49,"column":344,"offset":7347}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Search loops stop sooner.","position":{"start":{"line":51,"column":3,"offset":7351},"end":{"line":51,"column":28,"offset":7376}}}],"position":{"start":{"line":51,"column":1,"offset":7349},"end":{"line":51,"column":30,"offset":7378}}},{"type":"text","value":" A model that kept rewording a search could go round indefinitely, because each wording looked new. Gezel now compares the sources a search returns, not its words. On the third search that finds nothing new, the model is told to stop rephrasing; on the fourth, the turn ends.","position":{"start":{"line":51,"column":30,"offset":7378},"end":{"line":51,"column":305,"offset":7653}}}],"position":{"start":{"line":51,"column":1,"offset":7349},"end":{"line":51,"column":305,"offset":7653}}},{"type":"paragraph","children":[{"type":"text","value":"When a reply on a Mac does run out of time, the message now says why in plain words. For example: \"This message was waiting for the AI on your Mac to finish another chat, and it never got its turn. Nothing is wrong with the AI — send the message again.\"","position":{"start":{"line":53,"column":1,"offset":7655},"end":{"line":53,"column":254,"offset":7908}}}],"position":{"start":{"line":53,"column":1,"offset":7655},"end":{"line":53,"column":254,"offset":7908}}}]},{"id":"reference-catalogs-find-the-right-page","startTime":412,"duration":92,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Reference catalogs find the right page","position":{"start":{"line":55,"column":4,"offset":7913},"end":{"line":55,"column":42,"offset":7951}}}],"position":{"start":{"line":55,"column":1,"offset":7910},"end":{"line":55,"column":42,"offset":7951}}},"title":"Reference catalogs find the right page","contents":[{"type":"paragraph","children":[{"type":"text","value":"Knowledge catalogs are offline reference libraries, such as shelves of Wikipedia, that gezels search alongside your own files (","position":{"start":{"line":57,"column":1,"offset":7953},"end":{"line":57,"column":128,"offset":8080}}},{"type":"link","url":"../../how-knowledge-works/","children":[{"type":"text","value":"How knowledge works in Gezel","position":{"start":{"line":57,"column":129,"offset":8081},"end":{"line":57,"column":157,"offset":8109}}}],"position":{"start":{"line":57,"column":128,"offset":8080},"end":{"line":57,"column":186,"offset":8138}}},{"type":"text","value":"). Searching them got noticeably better.","position":{"start":{"line":57,"column":186,"offset":8138},"end":{"line":57,"column":226,"offset":8178}}}],"position":{"start":{"line":57,"column":1,"offset":7953},"end":{"line":57,"column":226,"offset":8178}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The first search after starting gezel no longer comes back empty.","position":{"start":{"line":59,"column":5,"offset":8184},"end":{"line":59,"column":70,"offset":8249}}}],"position":{"start":{"line":59,"column":3,"offset":8182},"end":{"line":59,"column":72,"offset":8251}}},{"type":"text","value":" That search used to load part of the catalog itself, run out of time, and return nothing at all. The catalog now loads in the background as soon as gezel starts.","position":{"start":{"line":59,"column":72,"offset":8251},"end":{"line":59,"column":234,"offset":8413}}}],"position":{"start":{"line":59,"column":3,"offset":8182},"end":{"line":59,"column":234,"offset":8413}}}],"position":{"start":{"line":59,"column":1,"offset":8180},"end":{"line":59,"column":234,"offset":8413}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Questions phrased the way people talk find the right pages.","position":{"start":{"line":60,"column":5,"offset":8418},"end":{"line":60,"column":64,"offset":8477}}}],"position":{"start":{"line":60,"column":3,"offset":8416},"end":{"line":60,"column":66,"offset":8479}}},{"type":"text","value":" Words like \"can you tell me how to\" used to steer the search: on an Azure documentation catalog, \"Can you tell me how to integrate Azure search with blob storage?\" put a page about \"eID-Me\" first. Those words are now ignored. A word found in most of a catalog, like \"azure\" in that one, no longer slows the search: that search took 550 ms and now takes 40 ms.","position":{"start":{"line":60,"column":66,"offset":8479},"end":{"line":60,"column":426,"offset":8839}}}],"position":{"start":{"line":60,"column":3,"offset":8416},"end":{"line":60,"column":426,"offset":8839}}}],"position":{"start":{"line":60,"column":1,"offset":8414},"end":{"line":60,"column":426,"offset":8839}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A question that names an article finds that article.","position":{"start":{"line":61,"column":5,"offset":8844},"end":{"line":61,"column":57,"offset":8896}}}],"position":{"start":{"line":61,"column":3,"offset":8842},"end":{"line":61,"column":59,"offset":8898}}},{"type":"text","value":" \"Who were the members of ABBA?\" did not show the ABBA article in its first six results. Now it is first. Looking up \"What is …?\" found the right article 92% of the time in the music catalog, up from 86%, and 91% in film and television, up from 84%.","position":{"start":{"line":61,"column":59,"offset":8898},"end":{"line":61,"column":308,"offset":9147}}}],"position":{"start":{"line":61,"column":3,"offset":8842},"end":{"line":61,"column":308,"offset":9147}}}],"position":{"start":{"line":61,"column":1,"offset":8840},"end":{"line":61,"column":308,"offset":9147}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Searching one catalog in the Knowledge area shows up to 20 results.","position":{"start":{"line":62,"column":5,"offset":9152},"end":{"line":62,"column":72,"offset":9219}}}],"position":{"start":{"line":62,"column":3,"offset":9150},"end":{"line":62,"column":74,"offset":9221}}},{"type":"text","value":" It stopped at six, even when hundreds of titles matched.","position":{"start":{"line":62,"column":74,"offset":9221},"end":{"line":62,"column":131,"offset":9278}}}],"position":{"start":{"line":62,"column":3,"offset":9150},"end":{"line":62,"column":131,"offset":9278}}}],"position":{"start":{"line":62,"column":1,"offset":9148},"end":{"line":62,"column":131,"offset":9278}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Three new Wikipedia shelves:","position":{"start":{"line":63,"column":5,"offset":9283},"end":{"line":63,"column":33,"offset":9311}}}],"position":{"start":{"line":63,"column":3,"offset":9281},"end":{"line":63,"column":35,"offset":9313}}},{"type":"text","value":" Film & Television (272,280 articles), Music (317,534) and Sports & Games (371,095), from the April 2026 English Wikipedia. There are now 20.","position":{"start":{"line":63,"column":35,"offset":9313},"end":{"line":63,"column":176,"offset":9454}}}],"position":{"start":{"line":63,"column":3,"offset":9281},"end":{"line":63,"column":176,"offset":9454}}}],"position":{"start":{"line":63,"column":1,"offset":9279},"end":{"line":63,"column":176,"offset":9454}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Installing is steadier.","position":{"start":{"line":64,"column":5,"offset":9459},"end":{"line":64,"column":28,"offset":9482}}}],"position":{"start":{"line":64,"column":3,"offset":9457},"end":{"line":64,"column":30,"offset":9484}}},{"type":"text","value":" An install no longer hangs when the search model's download stalls; after five minutes it finishes, and keyword search works until the model arrives. Progress now reads \"Verifying the catalog…\" and \"Checking the file…\". A ","position":{"start":{"line":64,"column":30,"offset":9484},"end":{"line":64,"column":253,"offset":9707}}},{"type":"strong","children":[{"type":"text","value":"+","position":{"start":{"line":64,"column":255,"offset":9709},"end":{"line":64,"column":256,"offset":9710}}}],"position":{"start":{"line":64,"column":253,"offset":9707},"end":{"line":64,"column":258,"offset":9712}}},{"type":"text","value":" beside the catalog picker, ","position":{"start":{"line":64,"column":258,"offset":9712},"end":{"line":64,"column":286,"offset":9740}}},{"type":"strong","children":[{"type":"text","value":"Add knowledge catalogs","position":{"start":{"line":64,"column":288,"offset":9742},"end":{"line":64,"column":310,"offset":9764}}}],"position":{"start":{"line":64,"column":286,"offset":9740},"end":{"line":64,"column":312,"offset":9766}}},{"type":"text","value":", opens Settings → Knowledge.","position":{"start":{"line":64,"column":312,"offset":9766},"end":{"line":64,"column":341,"offset":9795}}}],"position":{"start":{"line":64,"column":3,"offset":9457},"end":{"line":64,"column":341,"offset":9795}}}],"position":{"start":{"line":64,"column":1,"offset":9455},"end":{"line":64,"column":341,"offset":9795}}}],"position":{"start":{"line":59,"column":1,"offset":8180},"end":{"line":64,"column":341,"offset":9795}}}]},{"id":"a-gezel-can-ask-before-editing-a-read-only-project","startTime":504,"duration":49,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"A gezel can ask before editing a read-only project","position":{"start":{"line":66,"column":4,"offset":9800},"end":{"line":66,"column":54,"offset":9850}}}],"position":{"start":{"line":66,"column":1,"offset":9797},"end":{"line":66,"column":54,"offset":9850}}},"title":"A gezel can ask before editing a read-only project","contents":[{"type":"paragraph","children":[{"type":"text","value":"Last release made ","position":{"start":{"line":68,"column":1,"offset":9852},"end":{"line":68,"column":19,"offset":9870}}},{"type":"strong","children":[{"type":"text","value":"Allow built-in tools and background work to modify the workspace","position":{"start":{"line":68,"column":21,"offset":9872},"end":{"line":68,"column":85,"offset":9936}}}],"position":{"start":{"line":68,"column":19,"offset":9870},"end":{"line":68,"column":87,"offset":9938}}},{"type":"text","value":", in ","position":{"start":{"line":68,"column":87,"offset":9938},"end":{"line":68,"column":92,"offset":9943}}},{"type":"strong","children":[{"type":"text","value":"Project → Settings","position":{"start":{"line":68,"column":94,"offset":9945},"end":{"line":68,"column":112,"offset":9963}}}],"position":{"start":{"line":68,"column":92,"offset":9943},"end":{"line":68,"column":114,"offset":9965}}},{"type":"text","value":", hold. A gezel that needed to change files in such a project could only tell you it couldn't. Now it can ask.","position":{"start":{"line":68,"column":114,"offset":9965},"end":{"line":68,"column":224,"offset":10075}}}],"position":{"start":{"line":68,"column":1,"offset":9852},"end":{"line":68,"column":224,"offset":10075}}},{"type":"paragraph","children":[{"type":"text","value":"You see a ","position":{"start":{"line":70,"column":1,"offset":10077},"end":{"line":70,"column":11,"offset":10087}}},{"type":"strong","children":[{"type":"text","value":"Permission request","position":{"start":{"line":70,"column":13,"offset":10089},"end":{"line":70,"column":31,"offset":10107}}}],"position":{"start":{"line":70,"column":11,"offset":10087},"end":{"line":70,"column":33,"offset":10109}}},{"type":"text","value":" card in the chat and in Activity. It says exactly what would change: create, edit, rename and delete files in that project's folder, for all gezels, until you turn it off again, and where to turn it off. Choose ","position":{"start":{"line":70,"column":33,"offset":10109},"end":{"line":70,"column":245,"offset":10321}}},{"type":"strong","children":[{"type":"text","value":"Allow project file edits and continue","position":{"start":{"line":70,"column":247,"offset":10323},"end":{"line":70,"column":284,"offset":10360}}}],"position":{"start":{"line":70,"column":245,"offset":10321},"end":{"line":70,"column":286,"offset":10362}}},{"type":"text","value":" and the gezel carries on, or ","position":{"start":{"line":70,"column":286,"offset":10362},"end":{"line":70,"column":316,"offset":10392}}},{"type":"strong","children":[{"type":"text","value":"Keep current permissions","position":{"start":{"line":70,"column":318,"offset":10394},"end":{"line":70,"column":342,"offset":10418}}}],"position":{"start":{"line":70,"column":316,"offset":10392},"end":{"line":70,"column":344,"offset":10420}}},{"type":"text","value":" and it is told not to ask again.","position":{"start":{"line":70,"column":344,"offset":10420},"end":{"line":70,"column":377,"offset":10453}}}],"position":{"start":{"line":70,"column":1,"offset":10077},"end":{"line":70,"column":377,"offset":10453}}},{"type":"paragraph","children":[{"type":"text","value":"Only you can grant it, and only from the desktop app. A gezel cannot answer its own card, and a typed reply never grants anything. A meester or project lead can no longer switch the setting on by itself either. If the project's folder moved after the gezel asked, the request is void and must be made again.","position":{"start":{"line":72,"column":1,"offset":10455},"end":{"line":72,"column":308,"offset":10762}}}],"position":{"start":{"line":72,"column":1,"offset":10455},"end":{"line":72,"column":308,"offset":10762}}}]},{"id":"security","startTime":553,"duration":48,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Security","position":{"start":{"line":74,"column":4,"offset":10767},"end":{"line":74,"column":12,"offset":10775}}}],"position":{"start":{"line":74,"column":1,"offset":10764},"end":{"line":74,"column":12,"offset":10775}}},"title":"Security","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"On Windows, the background service that loads models can no longer change gezel's program files.","position":{"start":{"line":76,"column":5,"offset":10781},"end":{"line":76,"column":101,"offset":10877}}}],"position":{"start":{"line":76,"column":3,"offset":10779},"end":{"line":76,"column":103,"offset":10879}}},{"type":"text","value":" That service runs with few rights because it opens model files from the internet. Its folder sat inside one it could change, so it could have rewritten code that every account on the computer runs with that person's own rights. It can now only read that code, and every install, including a repair, unpacks a fresh copy instead of trusting the one it finds. Nothing you do changes.","position":{"start":{"line":76,"column":103,"offset":10879},"end":{"line":76,"column":485,"offset":11261}}}],"position":{"start":{"line":76,"column":3,"offset":10779},"end":{"line":76,"column":485,"offset":11261}}}],"position":{"start":{"line":76,"column":1,"offset":10777},"end":{"line":76,"column":485,"offset":11261}}},{"type":"listItem","spread":false,"ch umn":37,"offset":14937}}},{"type":"text","value":") moved from 0.1.80 to 0.1.83. Qwen3.8 27B uses a slightly smaller file on llama.cpp (16.5 GB, was 17.1 GB) and, on a Mac, gains a 239 MB draft model for speculative decoding. The PowerPoint deck craftbook now ends when the file is saved, in five steps instead of seven.","position":{"start":{"line":96,"column":37,"offset":14937},"end":{"line":96,"column":307,"offset":15207}}}],"position":{"start":{"line":96,"column":3,"offset":14903},"end":{"line":96,"column":307,"offset":15207}}}],"position":{"start":{"line":96,"column":1,"offset":14901},"end":{"line":96,"column":307,"offset":15207}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"llama.cpp moves to v0.6.0.","position":{"start":{"line":97,"column":5,"offset":15212},"end":{"line":97,"column":31,"offset":15238}}}],"position":{"start":{"line":97,"column":3,"offset":15210},"end":{"line":97,"column":33,"offset":15240}}},{"type":"text","value":" Its settings page (","position":{"start":{"line":97,"column":33,"offset":15240},"end":{"line":97,"column":53,"offset":15260}}},{"type":"strong","children":[{"type":"text","value":"This PC (llama)","position":{"start":{"line":97,"column":55,"offset":15262},"end":{"line":97,"column":70,"offset":15277}}}],"position":{"start":{"line":97,"column":53,"offset":15260},"end":{"line":97,"column":72,"offset":15279}}},{"type":"text","value":", or ","position":{"start":{"line":97,"column":72,"offset":15279},"end":{"line":97,"column":77,"offset":15284}}},{"type":"strong","children":[{"type":"text","value":"This Mac (llama)","position":{"start":{"line":97,"column":79,"offset":15286},"end":{"line":97,"column":95,"offset":15302}}}],"position":{"start":{"line":97,"column":77,"offset":15284},"end":{"line":97,"column":97,"offset":15304}}},{"type":"text","value":", under Artificial Intelligence) gains ","position":{"start":{"line":97,"column":97,"offset":15304},"end":{"line":97,"column":136,"offset":15343}}},{"type":"strong","children":[{"type":"text","value":"Draft sampling","position":{"start":{"line":97,"column":138,"offset":15345},"end":{"line":97,"column":152,"offset":15359}}}],"position":{"start":{"line":97,"column":136,"offset":15343},"end":{"line":97,"column":154,"offset":15361}}},{"type":"text","value":", an experimental choice for how a draft model's guesses are picked; the default is unchanged.","position":{"start":{"line":97,"column":154,"offset":15361},"end":{"line":97,"column":248,"offset":15455}}}],"position":{"start":{"line":97,"column":3,"offset":15210},"end":{"line":97,"column":248,"offset":15455}}}],"position":{"start":{"line":97,"column":1,"offset":15208},"end":{"line":97,"column":248,"offset":15455}}}],"position":{"start":{"line":82,"column":1,"offset":11752},"end":{"line":97,"column":248,"offset":15455}}}],"autoTemplate":true,"templateData":{"items":["Web previews run TypeScript without a build. A page in the workspace that loads .ts, .tsx or .jsx files used to show \"Preview cannot run unbuilt TypeScript/JSX\". The preview now converts them as they load and runs the page. A missing file, an npm package or a syntax error shows on the page with its file and line, instead of a blank frame.","Apple Intelligence on a Mac. On a Mac with Apple Intelligence turned on, Apple Intelligence is a choice under Settings → Artificial Intelligence, with a readiness line such as \"Ready · 8,192 tokens of context\" and Check again. Apple manages the model, so there is nothing to download, and it works offline. It is small with a short memory: good for chat, notes and short tasks.","A new gezel role, the Conversationalist, talks things through with you, looks things up, and brings in another gezel or a craftbook when that helps. A craftbook is one of gezel's saved recipes for a piece of work. A new Chat project now comes with one. See The Conversationalist.","The task page. Steps are now stops along a route, with the current one centred and marked with its gezel. Scroll or drag to move along it. In a task's Chat tab the message box stays at the bottom of the window. The latest file sits above the tabs, with Show in folder and Save a copy… as icons.","Documents open as documents everywhere. Opening a Word, PowerPoint or PDF file from a task's Open or from search now gives the same preview as the file list, instead of garbled text. A PowerPoint opens as a slideshow. Other binary files say there is no text preview.","Craftbook steps that update their own task can finish again. Since 1.26275, a step whose own check edited its task conflicted with itself and could never advance.","Try again is not undone by an old check. A check still running when you chose Try again could pause the task again moments later. Its result is now discarded.","A stray numbered folder no longer blocks new tasks. A folder a gezel created with a huge number in the task area made every new task in that project fail. Such folders are now ignored.","Restoring a backup that adds gezels or projects is quick again. Last release's careful copy took minutes for a large workspace, and a copy that died midway blocked every retry. New items are now moved into place in one step, still without overwriting anything newer.","In Word, a diagram that cannot be placed leaves the document as it was. Before, the text went in without the diagram, and a placeholder could be left behind.","Double-clicking an answer sends it once.","No more \"Loading…\" flashes. Across about 25 screens, gezel now keeps the frame still while it loads instead of flashing the word.","Gezel rests more when idle. The freeze detector added last release made an idle gezel wake about 59 times a second, against 13 before. It now checks four times a second.","Codex CLI sessions take less disk. Each one downloaded about 57 MB of plugins and catalogs it never used. Your own Codex setup is untouched.","Catalog content (the gilde) moved from 0.1.80 to 0.1.83. Qwen3.8 27B uses a slightly smaller file on llama.cpp (16.5 GB, was 17.1 GB) and, on a Mac, gains a 239 MB draft model for speculative decoding. The PowerPoint deck craftbook now ends when the file is saved, in five steps instead of seven.","llama.cpp moves to v0.6.0. Its settings page (This PC (llama), or This Mac (llama), under Artificial Intelligence) gains Draft sampling, an experimental choice for how a draft model's guesses are picked; the default is unchanged."],"ordered":false,"title":"Smaller things"}},{"id":"in-the-terminal-and-editor","startTime":788,"duration":73,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"In the terminal and editor","position":{"start":{"line":99,"column":4,"offset":15460},"end":{"line":99,"column":30,"offset":15486}}}],"position":{"start":{"line":99,"column":1,"offset":15457},"end":{"line":99,"column":30,"offset":15486}}},"title":"In the terminal and editor","contents":[{"type":"paragraph","children":[{"type":"text","value":"If you use the ","position":{"start":{"line":101,"column":1,"offset":15488},"end":{"line":101,"column":16,"offset":15503}}},{"type":"inlineCode","value":"gezel","position":{"start":{"line":101,"column":16,"offset":15503},"end":{"line":101,"column":23,"offset":15510}}},{"type":"text","value":" command (","position":{"start":{"line":101,"column":23,"offset":15510},"end":{"line":101,"column":33,"offset":15520}}},{"type":"link","url":"../../cli-reference/","children":[{"type":"text","value":"The gezel command line","position":{"start":{"line":101,"column":34,"offset":15521},"end":{"line":101,"column":56,"offset":15543}}}],"position":{"start":{"line":101,"column":33,"offset":15520},"end":{"line":101,"column":79,"offset":15566}}},{"type":"text","value":") or the VS Code extension:","position":{"start":{"line":101,"column":79,"offset":15566},"end":{"line":101,"column":106,"offset":15593}}}],"position":{"start":{"line":101,"column":1,"offset":15488},"end" ,"end":{"line":124,"column":37,"offset":19786}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Open ","position":{"start":{"line":126,"column":1,"offset":19788},"end":{"line":126,"column":6,"offset":19793}}},{"type":"strong","children":[{"type":"text","value":"Activity","position":{"start":{"line":126,"column":8,"offset":19795},"end":{"line":126,"column":16,"offset":19803}}}],"position":{"start":{"line":126,"column":6,"offset":19793},"end":{"line":126,"column":18,"offset":19805}}},{"type":"text","value":" at the top of the window and answer whatever is in ","position":{"start":{"line":126,"column":18,"offset":19805},"end":{"line":126,"column":70,"offset":19857}}},{"type":"strong","children":[{"type":"text","value":"Needs you","position":{"start":{"line":126,"column":72,"offset":19859},"end":{"line":126,"column":81,"offset":19868}}}],"position":{"start":{"line":126,"column":70,"offset":19857},"end":{"line":126,"column":83,"offset":19870}}},{"type":"text","value":". If a gezel writes for you, open its page and check ","position":{"start":{"line":126,"column":83,"offset":19870},"end":{"line":126,"column":136,"offset":19923}}},{"type":"strong","children":[{"type":"text","value":"Sources:","position":{"start":{"line":126,"column":138,"offset":19925},"end":{"line":126,"column":146,"offset":19933}}}],"position":{"start":{"line":126,"column":136,"offset":19923},"end":{"line":126,"column":148,"offset":19935}}},{"type":"text","value":" is set the way you want. If you use reference catalogs, the new Film & Television, Music and Sports & Games shelves are in ","position":{"start":{"line":126,"column":148,"offset":19935},"end":{"line":126,"column":272,"offset":20059}}},{"type":"strong","children":[{"type":"text","value":"Settings → Knowledge","position":{"start":{"line":126,"column":274,"offset":20061},"end":{"line":126,"column":294,"offset":20081}}}],"position":{"start":{"line":126,"column":272,"offset":20059},"end":{"line":126,"column":296,"offset":20083}}},{"type":"text","value":".","position":{"start":{"line":126,"column":296,"offset":20083},"end":{"line":126,"column":297,"offset":20084}}}],"position":{"start":{"line":126,"column":1,"offset":19788},"end":{"line":126,"column":297,"offset":20084}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Four days after 1.26275.","startTime":0,"endTime":2.909090909090909,"audioSegment":0},{"text":"This release is about seeing and trusting what your gezels do.","startTime":2.909090909090909,"endTime":5.818181818181818,"audioSegment":0},{"text":"Gezels are the named AI craftspeople on your crew.","startTime":5.818181818181818,"endTime":8.727272727272727,"audioSegment":0},{"text":"There is now one place that shows everything running,","startTime":8.727272727272727,"endTime":11.636363636363637,"audioSegment":0},{"text":"waiting, or waiting on you.","startTime":11.636363636363637,"endTime":14.545454545454547,"audioSegment":0},{"text":"Gezels that write for you cite where each fact came from,","startTime":14.545454545454547,"endTime":17.454545454545453,"audioSegment":0},{"text":"and refuse to put an unsourced fact into your document.","startTime":17.454545454545453,"endTime":20.363636363636363,"audioSegment":0},{"text":"On a Mac, your chat no longer waits behind background work.","startTime":20.363636363636363,"endTime":23.272727272727273,"audioSegment":0},{"text":"If you read only one thing: the Activity key at the top of the window replaces Updates.","startTime":23.272727272727273,"endTime":26.181818181818183,"audioSegment":0},{"text":"Open it to see what every gezel is doing,","startTime":26.181818181818183,"endTime":29.090909090909093,"audioSegment":0},{"text":"and answer what needs you without leaving the screen you are on.","startTime":29.090909090909093,"endTime":32,"audioSegment":0},{"text":"Before, what your crew was doing lived in three places.","startTime":32,"endTime":34.971428571428575,"audioSegment":0},{"text":"An Updates button appeared only when a gezel had a question.","startTime":34.971428571428575,"endTime":37.94285714285714,"audioSegment":0},{"text":"A queue meter appeared only while a model was busy.","startTime":37.94285714285714,"endTime":40.91428571428571,"audioSegment":0},{"text":"And a task waiting on you showed up nowhere until you opened it.","startTime":40.91428571428571,"endTime":43.885714285714286,"audioSegment":0},{"text":"Now one Activity key always sits at the top of the window.","startTime":43.885714285714286,"endTime":46.85714285714286,"audioSegment":0},{"text":"It summarises the moment, for example \"2 need you · 1 working\" or \"All quiet\",","startTime":46.85714285714286,"endTime":49.82857142857143,"audioSegment":0},{"text":"and shows an amber dot when something needs you.","startTime":49.82857142857143,"endTime":52.8,"audioSegment":0},{"text":"Opening it shows What's going on,","startTime":52.8,"endTime":55.77142857142857,"audioSegment":0},{"text":"across all your projects, in four sections: Needs you.","startTime":55.77142857142857,"endTime":58.74285714285715,"audioSegment":0},{"text":"Questions from gezels,","startTime":58.74285714285715,"endTime":61.714285714285715,"audioSegment":0},{"text":"which you answer in place: pick a choice or type a reply, then Submit.","startTime":61.714285714285715,"endTime":64.68571428571428,"audioSegment":0},{"text":"Text you have started is kept while you look elsewhere or switch projects,","startTime":64.68571428571428,"endTime":67.65714285714286,"audioSegment":0},{"text":"until you close gezel.","startTime":67.65714285714286,"endTime":70.62857142857143,"audioSegment":0},{"text":"A task step assigned to you also appears here.","startTime":70.62857142857143,"endTime":73.6,"audioSegment":0},{"text":"Type what should happen next and choose Continue task,","startTime":73.6,"endTime":76.57142857142857,"audioSegment":0},{"text":"or pause or cancel the task.","startTime":76.57142857142857,"endTime":79.54285714285714,"audioSegment":0},{"text":"You no longer have to open the task to move it on. Working.","startTime":79.54285714285714,"endTime":82.51428571428572,"audioSegment":0},{"text":"Each gezel using a model right now, with Stop. Next.","startTime":82.51428571428572,"endTime":85.4857142857143,"audioSegment":0},{"text":"Work waiting for a turn or scheduled for the Night Shift,","startTime":85.4857142857143,"endTime":88.45714285714286,"audioSegment":0},{"text":"the work gezels do overnight.","startTime":88.45714285714286,"endTime":91.42857142857143,"audioSegment":0},{"text":"You can move it up, move it down, or cancel it.","startTime":91.42857142857143,"endTime":94.4,"audioSegment":0},{"text":"When automatic work is paused by your AI engagement setting,","startTime":94.4,"endTime":97.37142857142857,"audioSegment":0},{"text":"the row says so and offers Activity settings. Ready.","startTime":97.37142857142857,"endTime":100.34285714285714,"audioSegment":0},{"text":"Finished work and Night Shift results to review.","startTime":100.34285714285714,"endTime":103.31428571428572,"audioSegment":0},{"text":"Each row says in plain words what is happening,","startTime":103.31428571428572,"endTime":106.28571428571429,"audioSegment":0},{"text":"such as \"Waiting for a free model slot\" or \"Still active.","startTime":106.28571428571429,"endTime":109.25714285714287,"audioSegment":0},{"text":"No new progress reported in the last two minutes.\" A task now shows as working only when something is actually running,","startTime":109.25714285714287,"endTime":112.22857142857143,"audioSegment":0},{"text":"not because it was once started.","startTime":112.22857142857143,"endTime":115.2,"audioSegment":0},{"text":"Paused tasks stay out of the list.","startTime":115.2,"endTime":118.17142857142858,"audioSegment":0},{"text":"If gezel cannot refresh the panel,","startTime":118.17142857142858,"endTime":121.14285714285714,"audioSegment":0},{"text":"it says so and keeps the last update.","startTime":121.14285714285714,"endTime":124.11428571428571,"audioSegment":0},{"text":"It never shows \"All quiet\" when it does not know. The ?","startTime":124.11428571428571,"endTime":127.08571428571429,"audioSegment":0},{"text":"beside a project in the side bar opens Activity for just that project,","startTime":127.08571428571429,"endTime":130.05714285714288,"audioSegment":0},{"text":"with Show all projects to widen it. On Home,","startTime":130.05714285714288,"endTime":133.02857142857144,"audioSegment":0},{"text":"the \"waiting on you\" and \"ready for you\" chips now say Open Activity.","startTime":133.02857142857144,"endTime":136,"audioSegment":0},{"text":"Local models are fluent with names,","startTime":136,"endTime":139.0222222222222,"audioSegment":0},{"text":"dates and family relationships, and often wrong about them.","startTime":139.0222222222222,"endTime":142.04444444444445,"audioSegment":0},{"text":"Asked for George Washington's family tree,","startTime":142.04444444444445,"endTime":145.06666666666666,"audioSegment":0},{"text":"a writer gezel produced several confident mistakes.","startTime":145.06666666666666,"endTime":148.0888888888889,"audioSegment":0},{"text":"Now a gezel that writes facts for people must cite them.","startTime":148.0888888888889,"endTime":151.11111111111111,"audioSegment":0},{"text":"It looks up what it does not have.","startTime":151.11111111111111,"endTime":154.13333333333333,"audioSegment":0},{"text":"Each source it reads gets a number,","startTime":154.13333333333333,"endTime":157.15555555555557,"audioSegment":0},{"text":"and its reply cites them, like this: [1].","startTime":157.15555555555557,"endTime":160.17777777777778,"audioSegment":0},{"text":"Unsourced facts are refused before they reach your document.","startTime":160.17777777777778,"endTime":163.2,"audioSegment":0},{"text":"A gezel writing into an open Word, PowerPoint or LibreOffice document is turned back when a sentence states a name,","startTime":163.2,"endTime":166.22222222222223,"audioSegment":0},{"text":"date, number or quote that none of its sources shows.","startTime":166.22222222222223,"endTime":169.24444444444444,"audioSegment":0},{"text":"It is told which lookup to make next.","startTime":169.24444444444444,"endTime":172.26666666666665,"audioSegment":0},{"text":"The same check covers prose files it saves,","startTime":172.26666666666665,"endTime":175.2888888888889,"audioSegment":0},{"text":"such as .md and .txt.","startTime":175.2888888888889,"endTime":178.3111111111111,"audioSegment":0},{"text":"A saved file that cites sources gets a Sources list at the end.","startTime":178.3111111111111,"endTime":181.33333333333331,"audioSegment":0},{"text":"Code and data files are never checked.","startTime":181.33333333333331,"endTime":184.35555555555555,"audioSegment":0},{"text":"After two refusals the gezel may write anyway,","startTime":184.35555555555555,"endTime":187.3777777777778,"audioSegment":0},{"text":"and its reply warns you how many statements could not be matched to a source.","startTime":187.3777777777778,"endTime":190.4,"audioSegment":0},{"text":"In chat, nothing is blocked; it is shown.","startTime":190.4,"endTime":193.42222222222222,"audioSegment":0},{"text":"Each [1] is a link to its source.","startTime":193.42222222222222,"endTime":196.44444444444446,"audioSegment":0},{"text":"Under the reply,","startTime":196.44444444444446,"endTime":199.46666666666667,"audioSegment":0},{"text":"a collapsed row such as \"3 sources · 1 statement not found in any source\" lists the sources and the sentences that did not match.","startTime":199.46666666666667,"endTime":202.48888888888888,"audioSegment":0},{"text":"The row is a quiet note, not a red error.","startTime":202.48888888888888,"endTime":205.51111111111112,"audioSegment":0},{"text":"This applies by role.","startTime":205.51111111111112,"endTime":208.53333333333333,"audioSegment":0},{"text":"Writers, researchers, reviewers, editors, journalists,","startTime":208.53333333333333,"endTime":211.55555555555554,"audioSegment":0},{"text":"historians and similar gezels work this way; novelists and poets do not.","startTime":211.55555555555554,"endTime":214.57777777777778,"audioSegment":0},{"text":"Any gezel writing into an open document works this way too.","startTime":214.57777777777778,"endTime":217.6,"audioSegment":0},{"text":"To change it, open the gezel's page and use Sources: to choose By role,","startTime":217.6,"endTime":220.6222222222222,"audioSegment":0},{"text":"Always cite or Off.","startTime":220.6222222222222,"endTime":223.64444444444445,"audioSegment":0},{"text":"In Word and LibreOffice,","startTime":223.64444444444445,"endTime":226.66666666666666,"audioSegment":0},{"text":"a pane with no gezel chosen yet now starts with one that cites its sources.","startTime":226.66666666666666,"endTime":229.68888888888887,"audioSegment":0},{"text":"Measured on Gemma 4 31B, with 20 questions about the Washington family each way: with sources on,","startTime":229.68888888888887,"endTime":232.7111111111111,"audioSegment":0},{"text":"3 of 147 statements were wrong, against 7 of 137 with them off, and 2 replies of 20 contained an error, against 6.","startTime":232.7111111111111,"endTime":235.73333333333335,"audioSegment":0},{"text":"Every reply looked something up.","startTime":235.73333333333335,"endTime":238.75555555555556,"audioSegment":0},{"text":"The cost was about 15 seconds more per answer at the median,","startTime":238.75555555555556,"endTime":241.77777777777777,"audioSegment":0},{"text":"and a gezel leaves out what it cannot find.","startTime":241.77777777777777,"endTime":244.8,"audioSegment":0},{"text":"That is one model, one topic and one run,","startTime":244.8,"endTime":247.82222222222222,"audioSegment":0},{"text":"so treat it as a direction, not a rate.","startTime":247.82222222222222,"endTime":250.84444444444443,"audioSegment":0},{"text":"The check is literal, so it has limits.","startTime":250.84444444444443,"endTime":253.86666666666667,"audioSegment":0},{"text":"It catches invented facts, but not a wrong fact copied faithfully from a wrong source,","startTime":253.86666666666667,"endTime":256.8888888888889,"audioSegment":0},{"text":"or two true names joined by a false relationship.","startTime":256.8888888888889,"endTime":259.9111111111111,"audioSegment":0},{"text":"With GitHub Copilot and the Claude and Codex command-line tools,","startTime":259.9111111111111,"endTime":262.93333333333334,"audioSegment":0},{"text":"gezel asks the model to name its sources but cannot check them.","startTime":262.93333333333334,"endTime":265.9555555555555,"audioSegment":0},{"text":"Separately, a link a gezel writes to a reference catalog passage (it begins knowledge://) is now clickable in any reply,","startTime":265.9555555555555,"endTime":268.97777777777776,"audioSegment":0},{"text":"and opens that passage in the Knowledge area.","startTime":268.97777777777776,"endTime":272,"audioSegment":0},{"text":"On a Mac, a message you type goes ahead of background work.","startTime":272,"endTime":274.85714285714283,"audioSegment":0},{"text":"When gezels were working through a task, your question could sit behind them,","startTime":274.85714285714283,"endTime":277.7142857142857,"audioSegment":0},{"text":"labelled \"Processing prompt\", until it timed out without starting.","startTime":277.7142857142857,"endTime":280.57142857142856,"audioSegment":0},{"text":"In one case a 300-token question waited behind a 55,000-token task step for nearly seven minutes, then gave up.","startTime":280.57142857142856,"endTime":283.42857142857144,"audioSegment":0},{"text":"Now the model on your Mac (run through MLX, Apple's engine for its own chips) serves what you type,","startTime":283.42857142857144,"endTime":286.2857142857143,"audioSegment":0},{"text":"your answers to questions, and a gezel consulting another one for you ahead of task steps and other background work.","startTime":286.2857142857143,"endTime":289.14285714285717,"audioSegment":0},{"text":"Background work pauses between steps and resumes exactly where it left off.","startTime":289.14285714285717,"endTime":292,"audioSegment":0},{"text":"While you wait, the status reads \"Waiting for another chat to finish\" or,","startTime":292,"endTime":294.85714285714283,"audioSegment":0},{"text":"on the background reply, \"Paused while a chat goes first\".","startTime":294.85714285714283,"endTime":297.7142857142857,"audioSegment":0},{"text":"The one exception is a Mac already short of memory,","startTime":297.7142857142857,"endTime":300.57142857142856,"audioSegment":0},{"text":"where the background work keeps its place.","startTime":300.57142857142856,"endTime":303.42857142857144,"audioSegment":0},{"text":"Long conversations survive quitting, restarting and switching models.","startTime":303.42857142857144,"endTime":306.2857142857143,"audioSegment":0},{"text":"The model keeps a copy of what it has already read,","startTime":306.2857142857143,"endTime":309.14285714285717,"audioSegment":0},{"text":"so the next message only reads what is new.","startTime":309.14285714285717,"endTime":312,"audioSegment":0},{"text":"That copy was often lost:","startTime":312,"endTime":314.8571428571429,"audioSegment":0},{"text":"When gezel stopped the model.","startTime":314.8571428571429,"endTime":317.7142857142857,"audioSegment":0},{"text":"The model had three seconds to save,","startTime":317.7142857142857,"endTime":320.57142857142856,"audioSegment":0},{"text":"and a 98,000-token conversation was lost that way.","startTime":320.57142857142856,"endTime":323.42857142857144,"audioSegment":0},{"text":"Gezel now asks it to save first,","startTime":323.42857142857144,"endTime":326.2857142857143,"audioSegment":0},{"text":"and waits up to 30 seconds.","startTime":326.2857142857143,"endTime":329.14285714285717,"audioSegment":0},{"text":"After a restart, once a gezel had used a tool.","startTime":329.14285714285717,"endTime":332,"audioSegment":0},{"text":"Last release fixed this only up to the first time a gezel used a tool.","startTime":332,"endTime":334.8571428571429,"audioSegment":0},{"text":"On a Mac, gezel now saves the exact conversation the model saw,","startTime":334.8571428571429,"endTime":337.7142857142857,"audioSegment":0},{"text":"and replays it after a restart.","startTime":337.7142857142857,"endTime":340.57142857142856,"audioSegment":0},{"text":"A resumed 69,000-token task step used to read 55,000 tokens again,","startTime":340.57142857142856,"endTime":343.42857142857144,"audioSegment":0},{"text":"about four minutes on a 27B model.","startTime":343.42857142857144,"endTime":346.2857142857143,"audioSegment":0},{"text":"When you changed a setting.","startTime":346.2857142857143,"endTime":349.1428571428571,"audioSegment":0},{"text":"Changing a setting no longer throws the copy away.","startTime":349.1428571428571,"endTime":352,"audioSegment":0},{"text":"When you stopped a reply.","startTime":352,"endTime":354.8571428571429,"audioSegment":0},{"text":"A stopped or cancelled reply keeps what was read,","startTime":354.8571428571429,"endTime":357.7142857142857,"audioSegment":0},{"text":"so Retry starts from there.","startTime":357.7142857142857,"endTime":360.57142857142856,"audioSegment":0},{"text":"Answers after a lookup are whole again.","startTime":360.57142857142856,"endTime":363.42857142857144,"audioSegment":0},{"text":"Since 1.26274, some local models, Gemma among them,","startTime":363.42857142857144,"endTime":366.2857142857143,"audioSegment":0},{"text":"were cut short after using a tool.","startTime":366.2857142857143,"endTime":369.1428571428571,"audioSegment":0},{"text":"A reply longer than about 700 characters was reduced to its last paragraph,","startTime":369.1428571428571,"endTime":372,"audioSegment":0},{"text":"and the rest folded away as \"thinking\".","startTime":372,"endTime":374.8571428571429,"audioSegment":0},{"text":"This affected Macs and other computers alike.","startTime":374.8571428571429,"endTime":377.7142857142857,"audioSegment":0},{"text":"Replies after a search now keep their full answer.","startTime":377.7142857142857,"endTime":380.57142857142856,"audioSegment":0},{"text":"Search loops stop sooner.","startTime":380.57142857142856,"endTime":383.42857142857144,"audioSegment":0},{"text":"A model that kept rewording a search could go round indefinitely,","startTime":383.42857142857144,"endTime":386.2857142857143,"audioSegment":0},{"text":"because each wording looked new.","startTime":386.2857142857143,"endTime":389.1428571428571,"audioSegment":0},{"text":"Gezel now compares the sources a search returns, not its words.","startTime":389.1428571428571,"endTime":392,"audioSegment":0},{"text":"On the third search that finds nothing new,","startTime":392,"endTime":394.8571428571429,"audioSegment":0},{"text":"the model is told to stop rephrasing; on the fourth, the turn ends.","startTime":394.8571428571429,"endTime":397.7142857142857,"audioSegment":0},{"text":"When a reply on a Mac does run out of time,","startTime":397.7142857142857,"endTime":400.57142857142856,"audioSegment":0},{"text":"the message now says why in plain words.","startTime":400.57142857142856,"endTime":403.42857142857144,"audioSegment":0},{"text":"For example: \"This message was waiting for the AI on your Mac to finish another chat,","startTime":403.42857142857144,"endTime":406.2857142857143,"audioSegment":0},{"text":"and it never got its turn.","startTime":406.2857142857143,"endTime":409.1428571428571,"audioSegment":0},{"text":"Nothing is wrong with the AI — send the message again.\"","startTime":409.1428571428571,"endTime":412,"audioSegment":0},{"text":"Knowledge catalogs are offline reference libraries, such as shelves of Wikipedia,","startTime":412,"endTime":415.17241379310343,"audioSegment":0},{"text":"that gezels search alongside your own files (How knowledge works in Gezel).","startTime":415.17241379310343,"endTime":418.3448275862069,"audioSegment":0},{"text":"Searching them got noticeably better.","startTime":418.3448275862069,"endTime":421.51724137931035,"audioSegment":0},{"text":"The first search after starting gezel no longer comes back empty.","startTime":421.51724137931035,"endTime":424.6896551724138,"audioSegment":0},{"text":"That search used to load part of the catalog itself,","startTime":424.6896551724138,"endTime":427.86206896551727,"audioSegment":0},{"text":"run out of time, and return nothing at all.","startTime":427.86206896551727,"endTime":431.0344827586207,"audioSegment":0},{"text":"The catalog now loads in the background as soon as gezel starts.","startTime":431.0344827586207,"endTime":434.2068965517241,"audioSegment":0},{"text":"Questions phrased the way people talk find the right pages.","startTime":434.2068965517241,"endTime":437.37931034482756,"audioSegment":0},{"text":"Words like \"can you tell me how to\" used to steer the search: on an Azure documentation catalog,","startTime":437.37931034482756,"endTime":440.55172413793105,"audioSegment":0},{"text":"\"Can you tell me how to integrate Azure search with blob storage?\" put a page about \"eID-Me\" first.","startTime":440.55172413793105,"endTime":443.7241379310345,"audioSegment":0},{"text":"Those words are now ignored.","startTime":443.7241379310345,"endTime":446.8965517241379,"audioSegment":0},{"text":"A word found in most of a catalog, like \"azure\" in that one,","startTime":446.8965517241379,"endTime":450.0689655172414,"audioSegment":0},{"text":"no longer slows the search: that search took 550 ms and now takes 40 ms.","startTime":450.0689655172414,"endTime":453.2413793103448,"audioSegment":0},{"text":"A question that names an article finds that article.","startTime":453.2413793103448,"endTime":456.41379310344826,"audioSegment":0},{"text":"\"Who were the members of ABBA?\" did not show the ABBA article in its first six results.","startTime":456.41379310344826,"endTime":459.58620689655174,"audioSegment":0},{"text":"Now it is first.","startTime":459.58620689655174,"endTime":462.7586206896552,"audioSegment":0},{"text":"Looking up \"What is …?\" found the right article 92% of the time in the music catalog,","startTime":462.7586206896552,"endTime":465.9310344827586,"audioSegment":0},{"text":"up from 86%, and 91% in film and television, up from 84%.","startTime":465.9310344827586,"endTime":469.1034482758621,"audioSegment":0},{"text":"Searching one catalog in the Knowledge area shows up to 20 results.","startTime":469.1034482758621,"endTime":472.2758620689655,"audioSegment":0},{"text":"It stopped at six, even when hundreds of titles matched.","startTime":472.2758620689655,"endTime":475.44827586206895,"audioSegment":0},{"text":"Three new Wikipedia shelves: Film & Television (272,280 articles),","startTime":475.44827586206895,"endTime":478.62068965517244,"audioSegment":0},{"text":"Music (317,534) and Sports & Games (371,095), from the April 2026 English Wikipedia.","startTime":478.62068965517244,"endTime":481.7931034482759,"audioSegment":0},{"text":"There are now 20.","startTime":481.7931034482759,"endTime":484.9655172413793,"audioSegment":0},{"text":"Installing is steadier.","startTime":484.9655172413793,"endTime":488.1379310344828,"audioSegment":0},{"text":"An install no longer hangs when the search model's download stalls;","startTime":488.1379310344828,"endTime":491.3103448275862,"audioSegment":0},{"text":"after five minutes it finishes, and keyword search works until the model arrives.","startTime":491.3103448275862,"endTime":494.48275862068965,"audioSegment":0},{"text":"Progress now reads \"Verifying the catalog…\" and \"Checking the file…\".","startTime":494.48275862068965,"endTime":497.65517241379314,"audioSegment":0},{"text":"A + beside the catalog picker,","startTime":497.65517241379314,"endTime":500.82758620689657,"audioSegment":0},{"text":"Add knowledge catalogs, opens Settings → Knowledge.","startTime":500.82758620689657,"endTime":504,"audioSegment":0},{"text":"Last release made Allow built-in tools and background work to modify the workspace,","startTime":504,"endTime":507.26666666666665,"audioSegment":0},{"text":"in Project → Settings, hold.","startTime":507.26666666666665,"endTime":510.53333333333336,"audioSegment":0},{"text":"A gezel that needed to change files in such a project could only tell you it couldn't.","startTime":510.53333333333336,"endTime":513.8,"audioSegment":0},{"text":"Now it can ask.","startTime":513.8,"endTime":517.0666666666667,"audioSegment":0},{"text":"You see a Permission request card in the chat and in Activity.","startTime":517.0666666666667,"endTime":520.3333333333334,"audioSegment":0},{"text":"It says exactly what would change: create, edit, rename and delete files in that project's folder,","startTime":520.3333333333334,"endTime":523.6,"audioSegment":0},{"text":"for all gezels, until you turn it off again, and where to turn it off.","startTime":523.6,"endTime":526.8666666666667,"audioSegment":0},{"text":"Choose Allow project file edits and continue and the gezel carries on,","startTime":526.8666666666667,"endTime":530.1333333333333,"audioSegment":0},{"text":"or Keep current permissions and it is told not to ask again.","startTime":530.1333333333333,"endTime":533.4,"audioSegment":0},{"text":"Only you can grant it, and only from the desktop app.","startTime":533.4,"endTime":536.6666666666666,"audioSegment":0},{"text":"A gezel cannot answer its own card,","startTime":536.6666666666666,"endTime":539.9333333333333,"audioSegment":0},{"text":"and a typed reply never grants anything.","startTime":539.9333333333333,"endTime":543.2,"audioSegment":0},{"text":"A meester or project lead can no longer switch the setting on by itself either.","startTime":543.2,"endTime":546.4666666666667,"audioSegment":0},{"text":"If the project's folder moved after the gezel asked,","startTime":546.4666666666667,"endTime":549.7333333333333,"audioSegment":0},{"text":"the request is void and must be made again.","startTime":549.7333333333333,"endTime":553,"audioSegment":0},{"text":"On Windows,","startTime":553,"endTime":556.6923076923077,"audioSegment":0},{"text":"the background service that loads models can no longer change gezel's program files.","startTime":556.6923076923077,"endTime":560.3846153846154,"audioSegment":0},{"text":"That service runs with few rights because it opens model files from the internet.","startTime":560.3846153846154,"endTime":564.0769230769231,"audioSegment":0},{"text":"Its folder sat inside one it could change,","startTime":564.0769230769231,"endTime":567.7692307692307,"audioSegment":0},{"text":"so it could have rewritten code that every account on the computer runs with that person's own rights.","startTime":567.7692307692307,"endTime":571.4615384615385,"audioSegment":0},{"text":"It can now only read that code, and every install, including a repair,","startTime":571.4615384615385,"endTime":575.1538461538462,"audioSegment":0},{"text":"unpacks a fresh copy instead of trusting the one it finds.","startTime":575.1538461538462,"endTime":578.8461538461538,"audioSegment":0},{"text":"Nothing you do changes.","startTime":578.8461538461538,"endTime":582.5384615384615,"audioSegment":0},{"text":"Private links stay out of diagnostics.","startTime":582.5384615384615,"endTime":586.2307692307693,"audioSegment":0},{"text":"Preview links and connected-app tokens are removed from the service log and from the freeze reports added last release.","startTime":586.2307692307693,"endTime":589.9230769230769,"audioSegment":0},{"text":"A shortcut that leads outside a folder is refused with a clear message.","startTime":589.9230769230769,"endTime":593.6153846153846,"audioSegment":0},{"text":"Changing a file through a shortcut that points outside your library or a project's artifacts used to show \"Something went wrong inside Gezel\".","startTime":593.6153846153846,"endTime":597.3076923076923,"audioSegment":0},{"text":"It now says the path goes through a shortcut to somewhere gezel won't change files.","startTime":597.3076923076923,"endTime":601,"audioSegment":0},{"text":"Web previews run TypeScript without a build.","startTime":601,"endTime":603.921875,"audioSegment":0},{"text":"A page in the workspace that loads .ts,","startTime":603.921875,"endTime":606.84375,"audioSegment":0},{"text":".tsx or .jsx files used to show \"Preview cannot run unbuilt TypeScript/JSX\".","startTime":606.84375,"endTime":609.765625,"audioSegment":0},{"text":"The preview now converts them as they load and runs the page.","startTime":609.765625,"endTime":612.6875,"audioSegment":0},{"text":"A missing file, an npm package or a syntax error shows on the page with its file and line,","startTime":612.6875,"endTime":615.609375,"audioSegment":0},{"text":"instead of a blank frame.","startTime":615.609375,"endTime":618.53125,"audioSegment":0},{"text":"Apple Intelligence on a Mac.","startTime":618.53125,"endTime":621.453125,"audioSegment":0},{"text":"On a Mac with Apple Intelligence turned on, Apple Intelligence is a choice under Settings → Artificial Intelligence,","startTime":621.453125,"endTime":624.375,"audioSegment":0},{"text":"with a readiness line such as \"Ready · 8,192 tokens of context\" and Check again.","startTime":624.375,"endTime":627.296875,"audioSegment":0},{"text":"Apple manages the model,","startTime":627.296875,"endTime":630.21875,"audioSegment":0},{"text":"so there is nothing to download, and it works offline.","startTime":630.21875,"endTime":633.140625,"audioSegment":0},{"text":"It is small with a short memory: good for chat,","startTime":633.140625,"endTime":636.0625,"audioSegment":0},{"text":"notes and short tasks.","startTime":636.0625,"endTime":638.984375,"audioSegment":0},{"text":"A new gezel role, the Conversationalist, talks things through with you,","startTime":638.984375,"endTime":641.90625,"audioSegment":0},{"text":"looks things up, and brings in another gezel or a craftbook when that helps.","startTime":641.90625,"endTime":644.828125,"audioSegment":0},{"text":"A craftbook is one of gezel's saved recipes for a piece of work.","startTime":644.828125,"endTime":647.75,"audioSegment":0},{"text":"A new Chat project now comes with one.","startTime":647.75,"endTime":650.671875,"audioSegment":0},{"text":"See The Conversationalist. The task page.","startTime":650.671875,"endTime":653.59375,"audioSegment":0},{"text":"Steps are now stops along a route,","startTime":653.59375,"endTime":656.515625,"audioSegment":0},{"text":"with the current one centred and marked with its gezel.","startTime":656.515625,"endTime":659.4375,"audioSegment":0},{"text":"Scroll or drag to move along it.","startTime":659.4375,"endTime":662.359375,"audioSegment":0},{"text":"In a task's Chat tab the message box stays at the bottom of the window.","startTime":662.359375,"endTime":665.28125,"audioSegment":0},{"text":"The latest file sits above the tabs,","startTime":665.28125,"endTime":668.203125,"audioSegment":0},{"text":"with Show in folder and Save a copy… as icons.","startTime":668.203125,"endTime":671.125,"audioSegment":0},{"text":"Documents open as documents everywhere.","startTime":671.125,"endTime":674.046875,"audioSegment":0},{"text":"Opening a Word, PowerPoint or PDF file from a task's Open or from search now gives the same preview as the file list,","startTime":674.046875,"endTime":676.96875,"audioSegment":0},{"text":"instead of garbled text.","startTime":676.96875,"endTime":679.890625,"audioSegment":0},{"text":"A PowerPoint opens as a slideshow.","startTime":679.890625,"endTime":682.8125,"audioSegment":0},{"text":"Other binary files say there is no text preview.","startTime":682.8125,"endTime":685.734375,"audioSegment":0},{"text":"Craftbook steps that update their own task can finish again. Since 1.26275,","startTime":685.734375,"endTime":688.65625,"audioSegment":0},{"text":"a step whose own check edited its task conflicted with itself and could never advance.","startTime":688.65625,"endTime":691.578125,"audioSegment":0},{"text":"Try again is not undone by an old check.","startTime":691.578125,"endTime":694.5,"audioSegment":0},{"text":"A check still running when you chose Try again could pause the task again moments later.","startTime":694.5,"endTime":697.421875,"audioSegment":0},{"text":"Its result is now discarded.","startTime":697.421875,"endTime":700.34375,"audioSegment":0},{"text":"A stray numbered folder no longer blocks new tasks.","startTime":700.34375,"endTime":703.265625,"audioSegment":0},{"text":"A folder a gezel created with a huge number in the task area made every new task in that project fail.","startTime":703.265625,"endTime":706.1875,"audioSegment":0},{"text":"Such folders are now ignored.","startTime":706.1875,"endTime":709.109375,"audioSegment":0},{"text":"Restoring a backup that adds gezels or projects is quick again.","startTime":709.109375,"endTime":712.03125,"audioSegment":0},{"text":"Last release's careful copy took minutes for a large workspace,","startTime":712.03125,"endTime":714.953125,"audioSegment":0},{"text":"and a copy that died midway blocked every retry.","startTime":714.953125,"endTime":717.875,"audioSegment":0},{"text":"New items are now moved into place in one step,","startTime":717.875,"endTime":720.796875,"audioSegment":0},{"text":"still without overwriting anything newer. In Word,","startTime":720.796875,"endTime":723.71875,"audioSegment":0},{"text":"a diagram that cannot be placed leaves the document as it was.","startTime":723.71875,"endTime":726.640625,"audioSegment":0},{"text":"Before, the text went in without the diagram,","startTime":726.640625,"endTime":729.5625,"audioSegment":0},{"text":"and a placeholder could be left behind.","startTime":729.5625,"endTime":732.484375,"audioSegment":0},{"text":"Double-clicking an answer sends it once.","startTime":732.484375,"endTime":735.40625,"audioSegment":0},{"text":"No more \"Loading…\" flashes.","startTime":735.40625,"endTime":738.328125,"audioSegment":0},{"text":"Across about 25 screens,","startTime":738.328125,"endTime":741.25,"audioSegment":0},{"text":"gezel now keeps the frame still while it loads instead of flashing the word.","startTime":741.25,"endTime":744.171875,"audioSegment":0},{"text":"Gezel rests more when idle.","startTime":744.171875,"endTime":747.09375,"audioSegment":0},{"text":"The freeze detector added last release made an idle gezel wake about 59 times a second,","startTime":747.09375,"endTime":750.015625,"audioSegment":0},{"text":"against 13 before.","startTime":750.015625,"endTime":752.9375,"audioSegment":0},{"text":"It now checks four times a second.","startTime":752.9375,"endTime":755.859375,"audioSegment":0},{"text":"Codex CLI sessions take less disk.","startTime":755.859375,"endTime":758.78125,"audioSegment":0},{"text":"Each one downloaded about 57 MB of plugins and catalogs it never used.","startTime":758.78125,"endTime":761.703125,"audioSegment":0},{"text":"Your own Codex setup is untouched.","startTime":761.703125,"endTime":764.625,"audioSegment":0},{"text":"Catalog content (the gilde) moved from 0.1.80 to 0.1.83.","startTime":764.625,"endTime":767.546875,"audioSegment":0},{"text":"Qwen3.8 27B uses a slightly smaller file on llama.cpp (16.5 GB, was 17.1 GB) and,","startTime":767.546875,"endTime":770.46875,"audioSegment":0},{"text":"on a Mac, gains a 239 MB draft model for speculative decoding.","startTime":770.46875,"endTime":773.390625,"audioSegment":0},{"text":"The PowerPoint deck craftbook now ends when the file is saved,","startTime":773.390625,"endTime":776.3125,"audioSegment":0},{"text":"in five steps instead of seven.","startTime":776.3125,"endTime":779.234375,"audioSegment":0},{"text":"llama.cpp moves to v0.6.0.","startTime":779.234375,"endTime":782.15625,"audioSegment":0},{"text":"Its settings page (This PC (llama), or This Mac (llama), under Artificial Intelligence) gains Draft sampling,","startTime":782.15625,"endTime":785.078125,"audioSegment":0},{"text":"an experimental choice for how a draft model's guesses are picked; the default is unchanged.","startTime":785.078125,"endTime":788,"audioSegment":0},{"text":"If you use the gezel command (The gezel command line) or the VS Code extension:","startTime":788,"endTime":790.8076923076923,"audioSegment":0},{"text":"Running gezel from your home folder works.","startTime":790.8076923076923,"endTime":793.6153846153846,"audioSegment":0},{"text":"Gezel never makes a project of your home folder,","startTime":793.6153846153846,"endTime":796.4230769230769,"audioSegment":0},{"text":"the temp folder or the top of a drive.","startTime":796.4230769230769,"endTime":799.2307692307693,"audioSegment":0},{"text":"The command used to stop with an error there.","startTime":799.2307692307693,"endTime":802.0384615384615,"audioSegment":0},{"text":"It now uses the Default project, says so,","startTime":802.0384615384615,"endTime":804.8461538461538,"audioSegment":0},{"text":"and tells you how to pick another.","startTime":804.8461538461538,"endTime":807.6538461538462,"audioSegment":0},{"text":"VS Code does the same when the open folder is your home folder.","startTime":807.6538461538462,"endTime":810.4615384615385,"audioSegment":0},{"text":"When gezel is not running,","startTime":810.4615384615385,"endTime":813.2692307692307,"audioSegment":0},{"text":"the message says what to do: \"Gezel is not running for this user.","startTime":813.2692307692307,"endTime":816.0769230769231,"audioSegment":0},{"text":"Start it from the Gezel app, or run gezel start.\"","startTime":816.0769230769231,"endTime":818.8846153846154,"audioSegment":0},{"text":"gezel run no longer prints a memory warning on every run.","startTime":818.8846153846154,"endTime":821.6923076923077,"audioSegment":0},{"text":"The memory step it interrupted now finishes on a later turn.","startTime":821.6923076923077,"endTime":824.5,"audioSegment":0},{"text":"Catalogs can find articles near a place.","startTime":824.5,"endTime":827.3076923076923,"audioSegment":0},{"text":"gezel knowledge nearby <catalog> --latitude … --longitude … --radius-meters … lists articles near a point,","startTime":827.3076923076923,"endTime":830.1153846153846,"audioSegment":0},{"text":"and gezel knowledge search takes the same three options.","startTime":830.1153846153846,"endTime":832.9230769230769,"audioSegment":0},{"text":"This needs a catalog that records places;","startTime":832.9230769230769,"endTime":835.7307692307693,"audioSegment":0},{"text":"none of the Wikipedia shelves do yet.","startTime":835.7307692307693,"endTime":838.5384615384615,"audioSegment":0},{"text":"See Working with knowledge catalogs.","startTime":838.5384615384615,"endTime":841.3461538461538,"audioSegment":0},{"text":"gezel knowledge build is more forgiving.","startTime":841.3461538461538,"endTime":844.1538461538462,"audioSegment":0},{"text":"--skip-images builds without images and keeps their descriptions,","startTime":844.1538461538462,"endTime":846.9615384615385,"audioSegment":0},{"text":"and an unusable image is skipped with a warning instead of stopping the build.","startTime":846.9615384615385,"endTime":849.7692307692307,"audioSegment":0},{"text":"A page listed in several sections of a table of contents now appears in each of them.","startTime":849.7692307692307,"endTime":852.5769230769231,"audioSegment":0},{"text":"Catalogs built with this version use format 0.7,","startTime":852.5769230769231,"endTime":855.3846153846154,"audioSegment":0},{"text":"which older gezel releases cannot open.","startTime":855.3846153846154,"endTime":858.1923076923077,"audioSegment":0},{"text":"Gezel still reads catalogs in 0.5 and 0.6.","startTime":858.1923076923077,"endTime":861,"audioSegment":0},{"text":"Activity.","startTime":861,"endTime":863.5,"audioSegment":0},{"text":"GET /api/activity returns each item's section, title, detail and links,","startTime":863.5,"endTime":866,"audioSegment":0},{"text":"plus questions and queues; client.getActivityStatus().","startTime":866,"endTime":868.5,"audioSegment":0},{"text":"The same resolver is exported from @bendyline/gezel as resolveActivity().","startTime":868.5,"endTime":871,"audioSegment":0},{"text":"Permission requests.","startTime":871,"endTime":873.5,"audioSegment":0},{"text":"ask_user_question takes permissionRequest: \"workspace-write\".","startTime":873.5,"endTime":876,"audioSegment":0},{"text":"The service builds the card; only the first-party app can answer it.","startTime":876,"endTime":878.5,"audioSegment":0},{"text":"A session token that tries to change managedWorkspaceWritePolicy or allowGezelWrites through PUT /api/projects/:id gets 403.","startTime":878.5,"endTime":881,"audioSegment":0},{"text":"Factual writing.","startTime":881,"endTime":883.5,"audioSegment":0},{"text":"factualWriting: true | false in gezel.md (also POST /api/gezels/:id/settings), GezelSummary.writesFactually,","startTime":883.5,"endTime":886,"audioSegment":0},{"text":"and ChatMessage.grounding (evidence, counts, and up to 20 unmatched statements).","startTime":886,"endTime":888.5,"audioSegment":0},{"text":"Craftbook citationsResolve gates now check knowledge:// citations against installed catalogs.","startTime":888.5,"endTime":891,"audioSegment":0},{"text":"Human steps with instructions.","startTime":891,"endTime":893.5,"audioSegment":0},{"text":"A task assignee can be { kind: \"user\", instructions: \"…\" };","startTime":893.5,"endTime":896,"audioSegment":0},{"text":"the instructions lead the Activity row and the review card.","startTime":896,"endTime":898.5,"audioSegment":0},{"text":"Knowledge for connected apps.","startTime":898.5,"endTime":901,"audioSegment":0},{"text":"/v1/knowledge/state, /update and /retrieve, behind a new grantable knowledge scope and the Connected Apps switch,","startTime":901,"endTime":903.5,"audioSegment":0},{"text":"return reranked, cited passages and never touch projects or files.","startTime":903.5,"endTime":906,"audioSegment":0},{"text":"Retrieval requires the relevance model (409 reranker_required otherwise).","startTime":906,"endTime":908.5,"audioSegment":0},{"text":"app.knowledge.* in @bendyline/gezel-app-sdk. Embedding.","startTime":908.5,"endTime":911,"audioSegment":0},{"text":"createDesktopEmbedding (@bendyline/gezel-app-sdk/host) and createMobileEmbedding (@bendyline/gezel-capacitor,","startTime":911,"endTime":913.5,"audioSegment":0},{"text":"still a private preview) own the AI lifecycle for an app that embeds gezel.","startTime":913.5,"endTime":916,"audioSegment":0},{"text":"A ModelManager lists, inspects, prepares and watches models,","startTime":916,"endTime":918.5,"audioSegment":0},{"text":"and never downloads without allowDownload: true.","startTime":918.5,"endTime":921,"audioSegment":0},{"text":"Packaging checks ship as @bendyline/gezel-service/packaging and @bendyline/gezel-capacitor/packaging. Client.","startTime":921,"endTime":923.5,"audioSegment":0},{"text":"connectToLocalGezel() reads the running service's port,","startTime":923.5,"endTime":926,"audioSegment":0},{"text":"token and certificate and pins the certificate; client.streamSessionEvents().","startTime":926,"endTime":928.5,"audioSegment":0},{"text":"The README quick start, which failed on the self-signed certificate,","startTime":928.5,"endTime":931,"audioSegment":0},{"text":"is rewritten and now runs in the package check.","startTime":931,"endTime":933.5,"audioSegment":0},{"text":"gezel-mcp started from an outside MCP client's config finds the running service by itself. Search tools.","startTime":933.5,"endTime":936,"audioSegment":0},{"text":"search takes catalogs (knowledge only) and spatial;","startTime":936,"endTime":938.5,"audioSegment":0},{"text":"a new knowledge_nearby tool and POST /api/knowledge/nearby.","startTime":938.5,"endTime":941,"audioSegment":0},{"text":"read_document on a passage citation opens that passage. gezk 0.7.","startTime":941,"endTime":943.5,"audioSegment":0},{"text":"Typed document locations, radius queries and shared table-of-contents placements,","startTime":943.5,"endTime":946,"audioSegment":0},{"text":"with JSON Schemas under packages/gezk/schemas/0.7/. Diagnostics.","startTime":946,"endTime":948.5,"audioSegment":0},{"text":"GEZEL_MEMORY_DIAGNOSTICS=1 logs memory use once a minute.","startTime":948.5,"endTime":951,"audioSegment":0},{"text":"A write through a shortcut that escapes its root is 403 with code symlink-escape.","startTime":951,"endTime":953.5,"audioSegment":0},{"text":"Dependencies: @bendyline/gilde 0.1.83; native engines 0.1.48, with llama.cpp v0.6.0.","startTime":953.5,"endTime":956,"audioSegment":0},{"text":"Open Activity at the top of the window and answer whatever is in Needs you.","startTime":956,"endTime":959.2,"audioSegment":0},{"text":"If a gezel writes for you,","startTime":959.2,"endTime":962.4,"audioSegment":0},{"text":"open its page and check Sources: is set the way you want.","startTime":962.4,"endTime":965.6,"audioSegment":0},{"text":"If you use reference catalogs, the new Film & Television,","startTime":965.6,"endTime":968.8,"audioSegment":0},{"text":"Music and Sports & Games shelves are in Settings → Knowledge.","startTime":968.8,"endTime":972,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26279 — 6 October 2026","subtitle":"Four days after 1.26275. This release is about seeing and trusting what your gezels do. Gezels are the named AI craftspeople on your crew. There is now one place that shows everything running, waiting, or waiting on you. Gezels that write for you cite where each fact came from, and refuse to put an unsourced fact into your document. On a Mac, your chat no longer waits behind background work.","ambientMotion":"zoomIn"}}</script>
