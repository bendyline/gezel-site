ng local models waits instead of failing.","startTime":1591.4468085106382,"endTime":1594.5212765957447,"audioSegment":0},{"text":"When a chat needs a different model on this computer and there is not enough memory for both,","startTime":1594.5212765957447,"endTime":1597.595744680851,"audioSegment":0},{"text":"it used to wait 30 seconds for the busy model and then fail.","startTime":1597.595744680851,"endTime":1600.6702127659573,"audioSegment":0},{"text":"Now it says \"Waiting for name to finish before switching models\" and switches as soon as that work is done.","startTime":1600.6702127659573,"endTime":1603.7446808510638,"audioSegment":0},{"text":"Stop ends the wait.","startTime":1603.7446808510638,"endTime":1606.8191489361702,"audioSegment":0},{"text":"A failed reply is shown once.","startTime":1606.8191489361702,"endTime":1609.8936170212767,"audioSegment":0},{"text":"It used to appear in the chat box as well as in the conversation,","startTime":1609.8936170212767,"endTime":1612.968085106383,"audioSegment":0},{"text":"so the same sentence could be on screen three times.","startTime":1612.968085106383,"endTime":1616.0425531914893,"audioSegment":0},{"text":"When the fix is to install or choose a model,","startTime":1616.0425531914893,"endTime":1619.1170212765958,"audioSegment":0},{"text":"the message now has a Set up a model or Choose a model button that takes you there.","startTime":1619.1170212765958,"endTime":1622.1914893617022,"audioSegment":0},{"text":"Notes that a long conversation was shortened to fit the model's memory no longer carry a warning sign,","startTime":1622.1914893617022,"endTime":1625.2659574468084,"audioSegment":0},{"text":"because nothing went wrong.","startTime":1625.2659574468084,"endTime":1628.340425531915,"audioSegment":0},{"text":"The window recovers from a crash.","startTime":1628.340425531915,"endTime":1631.4148936170213,"audioSegment":0},{"text":"If the window's contents crashed, for example after a long night of live updates,","startTime":1631.4148936170213,"endTime":1634.4893617021276,"audioSegment":0},{"text":"the window stayed blank until you quit gezel.","startTime":1634.4893617021276,"endTime":1637.563829787234,"audioSegment":0},{"text":"It now reloads itself, up to three times in ten minutes.","startTime":1637.563829787234,"endTime":1640.6382978723404,"audioSegment":0},{"text":"\"Waiting on you\" opens Activity in the right place.","startTime":1640.6382978723404,"endTime":1643.712765957447,"audioSegment":0},{"text":"On Home and beside a project in the sidebar,","startTime":1643.712765957447,"endTime":1646.787234042553,"audioSegment":0},{"text":"the counts open Activity at Needs you or Ready, rather than at the top.","startTime":1646.787234042553,"endTime":1649.8617021276596,"audioSegment":0},{"text":"A new local chat model, Underdog Saluki 1.0,","startTime":1649.8617021276596,"endTime":1652.936170212766,"audioSegment":0},{"text":"is in Settings → Artificial Intelligence.","startTime":1652.936170212766,"endTime":1656.0106382978724,"audioSegment":0},{"text":"It is Conway Research's compact edition of Qwen 3.8 27B,","startTime":1656.0106382978724,"endTime":1659.0851063829787,"audioSegment":0},{"text":"a 7.9 GB download tuned for using tools.","startTime":1659.0851063829787,"endTime":1662.159574468085,"audioSegment":0},{"text":"LFM2.5 24B gets more room to think.","startTime":1662.159574468085,"endTime":1665.2340425531916,"audioSegment":0},{"text":"This model always reasons before it acts,","startTime":1665.2340425531916,"endTime":1668.3085106382978,"audioSegment":0},{"text":"and while writing a file it was cut off after 1,024 characters of reasoning.","startTime":1668.3085106382978,"endTime":1671.3829787234042,"audioSegment":0},{"text":"It now gets three times as much.","startTime":1671.3829787234042,"endTime":1674.4574468085107,"audioSegment":0},{"text":"Fewer false alarms when a gezel writes facts.","startTime":1674.4574468085107,"endTime":1677.531914893617,"audioSegment":0},{"text":"The check that stops a gezel from writing a name, date or number no source shows no longer trips on the gezel's own name,","startTime":1677.531914893617,"endTime":1680.6063829787233,"audioSegment":0},{"text":"the project's name, bold headings or words in capitals.","startTime":1680.6063829787233,"endTime":1683.6808510638298,"audioSegment":0},{"text":"Craftbook steps told to write a file can write it.","startTime":1683.6808510638298,"endTime":1686.7553191489362,"audioSegment":0},{"text":"Some steps described a file to write in plain words,","startTime":1686.7553191489362,"endTime":1689.8297872340424,"audioSegment":0},{"text":"and were left without a tool that could write it, so they stalled.","startTime":1689.8297872340424,"endTime":1692.904255319149,"audioSegment":0},{"text":"Knowledge catalogs open in Knowledge.","startTime":1692.904255319149,"endTime":1695.9787234042553,"audioSegment":0},{"text":"The + beside the catalog picker and Browse knowledge catalogs open a dialog in place,","startTime":1695.9787234042553,"endTime":1699.0531914893618,"audioSegment":0},{"text":"instead of sending you to Settings.","startTime":1699.0531914893618,"endTime":1702.127659574468,"audioSegment":0},{"text":"Catalogs now have artwork.","startTime":1702.127659574468,"endTime":1705.2021276595744,"audioSegment":0},{"text":"OpenAI and Anthropic Claude with an API key are always listed under Settings → Artificial Intelligence.","startTime":1705.2021276595744,"endTime":1708.276595744681,"audioSegment":0},{"text":"Before, they were hidden until set up. With a key,","startTime":1708.276595744681,"endTime":1711.351063829787,"audioSegment":0},{"text":"Claude now starts on Claude Opus 5.5 and OpenAI on GPT-6.1 Sol.","startTime":1711.351063829787,"endTime":1714.4255319148936,"audioSegment":0},{"text":"Each model offers the reasoning efforts it supports,","startTime":1714.4255319148936,"endTime":1717.5,"audioSegment":0},{"text":"including xhigh and max on the newer Claude models.","startTime":1717.5,"endTime":1720.5744680851064,"audioSegment":0},{"text":"A saved effort that a model does not support moves to the nearest one it does.","startTime":1720.5744680851064,"endTime":1723.6489361702127,"audioSegment":0},{"text":"Claude Code and Codex.","startTime":1723.6489361702127,"endTime":1726.723404255319,"audioSegment":0},{"text":"Claude Code offers every reasoning effort for each of its models, Haiku included,","startTime":1726.723404255319,"endTime":1729.7978723404256,"audioSegment":0},{"text":"and can now use toolsets that run as a web service, such as DocBlocks.","startTime":1729.7978723404256,"endTime":1732.872340425532,"audioSegment":0},{"text":"Codex adds GPT-6.1 Sol, now its default,","startTime":1732.872340425532,"endTime":1735.9468085106382,"audioSegment":0},{"text":"and GPT-6 Astra, Sol and Luna.","startTime":1735.9468085106382,"endTime":1739.0212765957447,"audioSegment":0},{"text":"When either cannot reach a tool server it now says so,","startTime":1739.0212765957447,"endTime":1742.095744680851,"audioSegment":0},{"text":"and Codex tries again when its connection to gezel's tools fails.","startTime":1742.095744680851,"endTime":1745.1702127659573,"audioSegment":0},{"text":"Files they read and write with their own tools now count toward a craftbook step's checks.","startTime":1745.1702127659573,"endTime":1748.2446808510638,"audioSegment":0},{"text":"Before, those steps could never pass.","startTime":1748.2446808510638,"endTime":1751.3191489361702,"audioSegment":0},{"text":"Model downloads keep going when you leave the page.","startTime":1751.3191489361702,"endTime":1754.3936170212767,"audioSegment":0},{"text":"Speech, voice and image-recognition models now download in the background service.","startTime":1754.3936170212767,"endTime":1757.468085106383,"audioSegment":0},{"text":"A second click joins the running download, and Cancel really stops it.","startTime":1757.468085106383,"endTime":1760.5425531914893,"audioSegment":0},{"text":"Local models are faster on a graphics card.","startTime":1760.5425531914893,"endTime":1763.6170212765958,"audioSegment":0},{"text":"When a model fits entirely on the GPU,","startTime":1763.6170212765958,"endTime":1766.6914893617022,"audioSegment":0},{"text":"llama.cpp now uses at most four processor threads instead of all of them.","startTime":1766.6914893617022,"endTime":1769.7659574468084,"audioSegment":0},{"text":"On a DGX Spark,","startTime":1769.7659574468084,"endTime":1772.840425531915,"audioSegment":0},{"text":"a small Gemma model went from 72 to about 120 tokens a second.","startTime":1772.840425531915,"endTime":1775.9148936170213,"audioSegment":0},{"text":"A thread count you set yourself still wins.","startTime":1775.9148936170213,"endTime":1778.9893617021276,"audioSegment":0},{"text":"A busy index no longer holds things up.","startTime":1778.9893617021276,"endTime":1782.063829787234,"audioSegment":0},{"text":"Gezel used to stall for up to five seconds when its search index was busy,","startTime":1782.063829787234,"endTime":1785.1382978723404,"audioSegment":0},{"text":"and could lose the Boekwachter's file summaries.","startTime":1785.1382978723404,"endTime":1788.212765957447,"audioSegment":0},{"text":"It now waits its turn and retries.","startTime":1788.212765957447,"endTime":1791.287234042553,"audioSegment":0},{"text":"History search waits until you stop typing,","startTime":1791.287234042553,"endTime":1794.3617021276596,"audioSegment":0},{"text":"and no longer shows results from an earlier search.","startTime":1794.3617021276596,"endTime":1797.436170212766,"audioSegment":0},{"text":"Spelling and grammar checking no longer turns itself back on when you change an unrelated setting.","startTime":1797.436170212766,"endTime":1800.5106382978724,"audioSegment":0},{"text":"Restarting gezel no longer crashes.","startTime":1800.5106382978724,"endTime":1803.5851063829787,"audioSegment":0},{"text":"Restarting the service, for example from Settings,","startTime":1803.5851063829787,"endTime":1806.659574468085,"audioSegment":0},{"text":"could end in a crash report.","startTime":1806.659574468085,"endTime":1809.7340425531916,"audioSegment":0},{"text":"It now stops its model workers cleanly first.","startTime":1809.7340425531916,"endTime":1812.8085106382978,"audioSegment":0},{"text":"Tasks no longer disappear.","startTime":1812.8085106382978,"endTime":1815.8829787234042,"audioSegment":0},{"text":"A task gezel could not read back used to be created and then vanish.","startTime":1815.8829787234042,"endTime":1818.9574468085107,"audioSegment":0},{"text":"It is now refused when you create it, with the reason.","startTime":1818.9574468085107,"endTime":1822.0319148936169,"audioSegment":0},{"text":"New projects start reliably.","startTime":1822.0319148936169,"endTime":1825.1063829787233,"audioSegment":0},{"text":"Starting a ready-made kind of project could fail with \"gezel … already exists\" when a randomly chosen crew name was taken,","startTime":1825.1063829787233,"endTime":1828.1808510638298,"audioSegment":0},{"text":"and a new project could be labeled \"Social Media\" by mistake.","startTime":1828.1808510638298,"endTime":1831.2553191489362,"audioSegment":0},{"text":"Errors from OpenAI now show, instead of arriving as an empty answer.","startTime":1831.2553191489362,"endTime":1834.3297872340427,"audioSegment":0},{"text":"Mac ._ files are no longer indexed.","startTime":1834.3297872340427,"endTime":1837.404255319149,"audioSegment":0},{"text":"These hidden companion files failed to index and were tried again every night.","startTime":1837.404255319149,"endTime":1840.4787234042553,"audioSegment":0},{"text":"On Linux, the packages now list the system libraries gezel needs, so a system too old to run it,","startTime":1840.4787234042553,"endTime":1843.5531914893618,"audioSegment":0},{"text":"such as Ubuntu 22.04, Debian 12 or Fedora 39, refuses the install instead of gezel failing when it starts.","startTime":1843.5531914893618,"endTime":1846.627659574468,"audioSegment":0},{"text":"Installing under WSL, or in a container without systemd,","startTime":1846.627659574468,"endTime":1849.7021276595744,"audioSegment":0},{"text":"no longer leaves the package half set up.","startTime":1849.7021276595744,"endTime":1852.776595744681,"audioSegment":0},{"text":"Dependencies: @bendyline/gilde 0.2.0 and the Squisq document editor 2.11.25.","startTime":1852.776595744681,"endTime":1855.851063829787,"audioSegment":0},{"text":"The native engines move to 0.1.49,","startTime":1855.851063829787,"endTime":1858.9255319148936,"audioSegment":0},{"text":"which updates the image engine (stable-diffusion.cpp master-951) for the new image models.","startTime":1858.9255319148936,"endTime":1862,"audioSegment":0},{"text":"If you use the gezel command (The gezel command line):","startTime":1862,"endTime":1864.72,"audioSegment":0},{"text":"gezel <craftbook> is short for gezel do <craftbook>.","startTime":1864.72,"endTime":1867.44,"audioSegment":0},{"text":"Built-in commands always win,","startTime":1867.44,"endTime":1870.16,"audioSegment":0},{"text":"so a typo still says the command is unknown.","startTime":1870.16,"endTime":1872.88,"audioSegment":0},{"text":"gezel do keeps your request.","startTime":1872.88,"endTime":1875.6,"audioSegment":0},{"text":"Words without a key= used to fill the first parameter,","startTime":1875.6,"endTime":1878.32,"audioSegment":0},{"text":"usually the working folder.","startTime":1878.32,"endTime":1881.04,"audioSegment":0},{"text":"So gezel do summarize-long \"Summarize notes.txt\" named a folder after the sentence and lost the request.","startTime":1881.04,"endTime":1883.76,"audioSegment":0},{"text":"Words now fill only required settings with no default,","startTime":1883.76,"endTime":1886.48,"audioSegment":0},{"text":"and the rest becomes the request.","startTime":1886.48,"endTime":1889.2,"audioSegment":0},{"text":"key=value still sets anything.","startTime":1889.2,"endTime":1891.92,"audioSegment":0},{"text":"gezel do checks setup before it starts.","startTime":1891.92,"endTime":1894.64,"audioSegment":0},{"text":"If a craftbook needs External Services, web search or a model you haven't downloaded,","startTime":1894.64,"endTime":1897.36,"audioSegment":0},{"text":"a terminal asks yes or no for each, and a script stops before starting with the command that fixes it.","startTime":1897.36,"endTime":1900.08,"audioSegment":0},{"text":"gezel run - reads the prompt from standard input.","startTime":1900.08,"endTime":1902.8,"audioSegment":0},{"text":"gezel start --port and --web reuse a running service that already does that.","startTime":1902.8,"endTime":1905.52,"audioSegment":0},{"text":"--restart replaces one that doesn't.","startTime":1905.52,"endTime":1908.24,"audioSegment":0},{"text":"Catalogs can include video and sound.","startTime":1908.24,"endTime":1910.96,"audioSegment":0},{"text":"gezel knowledge build bundles MP4, MOV, WebM, MP3, M4A, WAV, FLAC and similar files,","startTime":1910.96,"endTime":1913.68,"audioSegment":0},{"text":"and with the embeddinggemma-2-512@1 profile and ffmpeg, they are searchable by what is in them.","startTime":1913.68,"endTime":1916.4,"audioSegment":0},{"text":"catalog.json can credit each file,","startTime":1916.4,"endTime":1919.12,"audioSegment":0},{"text":"and --skip-images now skips video and sound too.","startTime":1919.12,"endTime":1921.84,"audioSegment":0},{"text":"Catalogs with media use format 0.8, which older gezel releases cannot open.","startTime":1921.84,"endTime":1924.56,"audioSegment":0},{"text":"Other catalogs are still written as 0.7.","startTime":1924.56,"endTime":1927.28,"audioSegment":0},{"text":"See Working with knowledge catalogs.","startTime":1927.28,"endTime":1930,"audioSegment":0},{"text":"New package: @bendyline/gezel-inference.","startTime":1930,"endTime":1932.7555555555555,"audioSegment":0},{"text":"Gezel's on-device runtime is now its own npm package.","startTime":1932.7555555555555,"endTime":1935.5111111111112,"audioSegment":0},{"text":"An app that hosts gezel in-process with host: { inferenceOnly: true } installs it in place of the whole service,","startTime":1935.5111111111112,"endTime":1938.2666666666667,"audioSegment":0},{"text":"and gezeld serves the same restricted host in child mode.","startTime":1938.2666666666667,"endTime":1941.0222222222221,"audioSegment":0},{"text":"It serves only on-device models;","startTime":1941.0222222222221,"endTime":1943.7777777777778,"audioSegment":0},{"text":"a cloud model is refused with 403 provider_not_allowed. App SDK.","startTime":1943.7777777777778,"endTime":1946.5333333333333,"audioSegment":0},{"text":"streamText takes temperature, reasoningEffort, knowledge and responseFormat,","startTime":1946.5333333333333,"endTime":1949.2888888888888,"audioSegment":0},{"text":"emits progress events, and reports model, usage and appliedMaxTokens on done.","startTime":1949.2888888888888,"endTime":1952.0444444444445,"audioSegment":0},{"text":"New: withKnowledgeContext, connectDesktopEmbedding, and a knowledge-only grant (knowledge: true).","startTime":1952.0444444444445,"endTime":1954.8,"audioSegment":0},{"text":"registerAppTools takes a subject naming the document your app is about,","startTime":1954.8,"endTime":1957.5555555555557,"audioSegment":0},{"text":"which makes its threads conversations about that document, the way the Office pane works.","startTime":1957.5555555555557,"endTime":1960.3111111111111,"audioSegment":0},{"text":"DocBlocks: text AI with gezel walks through a real integration.","startTime":1960.3111111111111,"endTime":1963.0666666666666,"audioSegment":0},{"text":"OpenAI-compatible API.","startTime":1963.0666666666666,"endTime":1965.8222222222223,"audioSegment":0},{"text":"stream_options.include_progress adds gezel_progress events.","startTime":1965.8222222222223,"endTime":1968.5777777777778,"audioSegment":0},{"text":"On /v1/embeddings, model: \"gezel:embeddings\" runs the on-device text embedder.","startTime":1968.5777777777778,"endTime":1971.3333333333333,"audioSegment":0},{"text":"Apple Foundation Models now honors a response_format JSON Schema through Apple's guided generation,","startTime":1971.3333333333333,"endTime":1974.088888888889,"audioSegment":0},{"text":"and a reply cut at Apple's 1,024-token limit reports finish_reason: \"length\" with gezel_max_tokens.","startTime":1974.088888888889,"endTime":1976.8444444444444,"audioSegment":0},{"text":"Bundled catalogs such as the Handboek are no longer offered to connected apps. Scripts.","startTime":1976.8444444444444,"endTime":1979.6,"audioSegment":0},{"text":"A reminders capability: gezel.reminder.set({ at, title,","startTime":1979.6,"endTime":1982.3555555555556,"audioSegment":0},{"text":"body }) and clear(), at most 30 days ahead, one per project.","startTime":1982.3555555555556,"endTime":1985.111111111111,"audioSegment":0},{"text":"See Writing scripts. MCP tools. New copy_path,","startTime":1985.111111111111,"endTime":1987.8666666666666,"audioSegment":0},{"text":"list_photos and photo_groups (locations only for the person's app and on-device models).","startTime":1987.8666666666666,"endTime":1990.6222222222223,"audioSegment":0},{"text":"save_memory and list_memories take a user scope. HTTP.","startTime":1990.6222222222223,"endTime":1993.3777777777777,"audioSegment":0},{"text":"/api/reminders, /api/media-search (with install and ffmpeg re-check), project albums, index/thumb, overview, file-summary and night-work routes,","startTime":1993.3777777777777,"endTime":1996.1333333333332,"audioSegment":0},{"text":"PUT /api/memory/lessons (first-party only), and DELETE routes that cancel chat, speech and voice model downloads.","startTime":1996.1333333333332,"endTime":1998.888888888889,"audioSegment":0},{"text":"New fit checks: GET /api/sessions/:id/model-fit, /api/system/models-fit-now and /api/{image,video}-gen/models/fit.","startTime":1998.888888888889,"endTime":2001.6444444444444,"audioSegment":0},{"text":"Sessions and project timelines filter by ?subject=.","startTime":2001.6444444444444,"endTime":2004.4,"audioSegment":0},{"text":"gezk 0.8 adds media assets and per-asset attribution,","startTime":2004.4,"endTime":2007.1555555555556,"audioSegment":0},{"text":"with JSON Schemas under packages/gezk/schemas/0.8/.","startTime":2007.1555555555556,"endTime":2009.911111111111,"audioSegment":0},{"text":"The global CLI now needs @huggingface/transformers 4.3.1 or later.","startTime":2009.911111111111,"endTime":2012.6666666666667,"audioSegment":0},{"text":"onnxruntime moves to 1.30.0.","startTime":2012.6666666666667,"endTime":2015.4222222222222,"audioSegment":0},{"text":"Gilde 0.2 adds craftbook samples, interests on craftbooks and project types,","startTime":2015.4222222222222,"endTime":2018.1777777777777,"audioSegment":0},{"text":"and per-file tensors facts on image and video models, which gezel uses to work out how much memory they need.","startTime":2018.1777777777777,"endTime":2020.9333333333334,"audioSegment":0},{"text":"minRamGB and minVramGB are no longer required.","startTime":2020.9333333333334,"endTime":2023.6888888888889,"audioSegment":0},{"text":"Image model catalog entries can ship a tokenizer file,","startTime":2023.6888888888889,"endTime":2026.4444444444443,"audioSegment":0},{"text":"passed to the image engine as --tokenizer.","startTime":2026.4444444444443,"endTime":2029.2,"audioSegment":0},{"text":"Ming Image is the first to need one.","startTime":2029.2,"endTime":2031.9555555555555,"audioSegment":0},{"text":"Windows sandbox.","startTime":2031.9555555555555,"endTime":2034.7111111111112,"audioSegment":0},{"text":"/api/health reports scriptSandbox (its state,","startTime":2034.7111111111112,"endTime":2037.4666666666667,"audioSegment":0},{"text":"the reason when it is unavailable, and the isolation tier).","startTime":2037.4666666666667,"endTime":2040.2222222222222,"audioSegment":0},{"text":"GEZEL_MXC=off turns it off for one service,","startTime":2040.2222222222222,"endTime":2042.9777777777779,"audioSegment":0},{"text":"and GEZEL_MXC_EXEC points at a launcher of your own.","startTime":2042.9777777777779,"endTime":2045.7333333333333,"audioSegment":0},{"text":"Inside the sandbox,","startTime":2045.7333333333333,"endTime":2048.488888888889,"audioSegment":0},{"text":"a script talks to gezel over standard input and output instead of a fourth pipe.","startTime":2048.488888888889,"endTime":2051.2444444444445,"audioSegment":0},{"text":"The SDK handles this, so scripts need no change.","startTime":2051.2444444444445,"endTime":2054,"audioSegment":0},{"text":"Add a folder with File → Add Folder…,","startTime":2054,"endTime":2057.3846153846152,"audioSegment":0},{"text":"and check the Night shift tab on Home tomorrow.","startTime":2057.3846153846152,"endTime":2060.769230769231,"audioSegment":0},{"text":"If you use Word, Excel or PowerPoint,","startTime":2060.769230769231,"endTime":2064.153846153846,"audioSegment":0},{"text":"open the Gezel pane on a document and ask for a change.","startTime":2064.153846153846,"endTime":2067.5384615384614,"audioSegment":0},{"text":"Tell gezel what you want help with in Settings → General → What you use gezel for,","startTime":2067.5384615384614,"endTime":2070.923076923077,"audioSegment":0},{"text":"and Make something on Home will lead with it.","startTime":2070.923076923077,"endTime":2074.3076923076924,"audioSegment":0},{"text":"If your computer has a lot of memory,","startTime":2074.3076923076924,"endTime":2077.6923076923076,"audioSegment":0},{"text":"try Ming Image or Iris in Settings → Image generation.","startTime":2077.6923076923076,"endTime":2081.076923076923,"audioSegment":0},{"text":"On the desktop, if you liked watching your gezellen level up, turn on Social mode in Settings → General,","startTime":2081.076923076923,"endTime":2084.4615384615386,"audioSegment":0},{"text":"and set how many Notifications a day you want just below it.","startTime":2084.4615384615386,"endTime":2087.846153846154,"audioSegment":0},{"text":"To search video and sound as well as photos,","startTime":2087.846153846154,"endTime":2091.230769230769,"audioSegment":0},{"text":"install ffmpeg and look at Settings → Image recognition. On Windows,","startTime":2091.230769230769,"endTime":2094.6153846153848,"audioSegment":0},{"text":"open Settings → Security & Compliance to see whether the Windows sandbox is active on your PC.","startTime":2094.6153846153848,"endTime":2098,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26287 — 14 October 2026","subtitle":"Eight days after 1.26279. Until now, putting your gezellen to work on your own files meant setting up a project and deciding what to ask. Gezellen (one is a gezel) are the named AI craftspeople on your crew. Now you can hand them a folder, such as your Pictures, your Documents or a codebase. They read it, never change it, and work on it overnight. In the morning you find a short report, albums of your recent photos, and fixes for you to approve.","ambientMotion":"zoomIn"}}</script>
