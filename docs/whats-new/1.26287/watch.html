l with \"gezel … already exists\" when a randomly chosen crew name was taken, and a new project could be labeled \"Social Media\" by mistake.","position":{"start":{"line":204,"column":35,"offset":35551},"end":{"line":204,"column":220,"offset":35736}}}],"position":{"start":{"line":204,"column":3,"offset":35519},"end":{"line":204,"column":220,"offset":35736}}}],"position":{"start":{"line":204,"column":1,"offset":35517},"end":{"line":204,"column":220,"offset":35736}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Errors from OpenAI now show","position":{"start":{"line":205,"column":5,"offset":35741},"end":{"line":205,"column":32,"offset":35768}}}],"position":{"start":{"line":205,"column":3,"offset":35739},"end":{"line":205,"column":34,"offset":35770}}},{"type":"text","value":", instead of arriving as an empty answer.","position":{"start":{"line":205,"column":34,"offset":35770},"end":{"line":205,"column":75,"offset":35811}}}],"position":{"start":{"line":205,"column":3,"offset":35739},"end":{"line":205,"column":75,"offset":35811}}}],"position":{"start":{"line":205,"column":1,"offset":35737},"end":{"line":205,"column":75,"offset":35811}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Mac ","position":{"start":{"line":206,"column":5,"offset":35816},"end":{"line":206,"column":9,"offset":35820}}},{"type":"inlineCode","value":"._","position":{"start":{"line":206,"column":9,"offset":35820},"end":{"line":206,"column":13,"offset":35824}}},{"type":"text","value":" files are no longer indexed.","position":{"start":{"line":206,"column":13,"offset":35824},"end":{"line":206,"column":42,"offset":35853}}}],"position":{"start":{"line":206,"column":3,"offset":35814},"end":{"line":206,"column":44,"offset":35855}}},{"type":"text","value":" These hidden companion files failed to index and were tried again every night.","position":{"start":{"line":206,"column":44,"offset":35855},"end":{"line":206,"column":123,"offset":35934}}}],"position":{"start":{"line":206,"column":3,"offset":35814},"end":{"line":206,"column":123,"offset":35934}}}],"position":{"start":{"line":206,"column":1,"offset":35812},"end":{"line":206,"column":123,"offset":35934}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"On Linux, the packages now list the system libraries gezel needs","position":{"start":{"line":207,"column":5,"offset":35939},"end":{"line":207,"column":69,"offset":36003}}}],"position":{"start":{"line":207,"column":3,"offset":35937},"end":{"line":207,"column":71,"offset":36005}}},{"type":"text","value":", so a system too old to run it, such as Ubuntu 22.04, Debian 12 or Fedora 39, refuses the install instead of gezel failing when it starts. Installing under WSL, or in a container without systemd, no longer leaves the package half set up.","position":{"start":{"line":207,"column":71,"offset":36005},"end":{"line":207,"column":309,"offset":36243}}}],"position":{"start":{"line":207,"column":3,"offset":35937},"end":{"line":207,"column":309,"offset":36243}}}],"position":{"start":{"line":207,"column":1,"offset":35935},"end":{"line":207,"column":309,"offset":36243}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Dependencies: ","position":{"start":{"line":208,"column":3,"offset":36246},"end":{"line":208,"column":17,"offset":36260}}},{"type":"inlineCode","value":"@bendyline/gilde","position":{"start":{"line":208,"column":17,"offset":36260},"end":{"line":208,"column":35,"offset":36278}}},{"type":"text","value":" 0.2.0 and the Squisq document editor 2.11.25. The native engines move to 0.1.49, which updates the image engine (stable-diffusion.cpp ","position":{"start":{"line":208,"column":35,"offset":36278},"end":{"line":208,"column":170,"offset":36413}}},{"type":"inlineCode","value":"master-951","position":{"start":{"line":208,"column":170,"offset":36413},"end":{"line":208,"column":182,"offset":36425}}},{"type":"text","value":") for the new image models.","position":{"start":{"line":208,"column":182,"offset":36425},"end":{"line":208,"column":209,"offset":36452}}}],"position":{"start":{"line":208,"column":3,"offset":36246},"end":{"line":208,"column":209,"offset":36452}}}],"position":{"start":{"line":208,"column":1,"offset":36244},"end":{"line":208,"column":209,"offset":36452}}}],"position":{"start":{"line":184,"column":1,"offset":30856},"end":{"line":208,"column":209,"offset":36452}}}],"autoTemplate":true,"templateData":{"items":["Take a photo from the chat box. A camera key appears next to the picture key when a camera is attached. On the desktop it opens a viewfinder, with a camera picker if you have more than one. The photo is shrunk to 2048 pixels before it joins your message, and on the desktop it carries no location or camera details.","Switching local models waits instead of failing. When a chat needs a different model on this computer and there is not enough memory for both, it used to wait 30 seconds for the busy model and then fail. Now it says \"Waiting for name to finish before switching models\" and switches as soon as that work is done. Stop ends the wait.","A failed reply is shown once. It used to appear in the chat box as well as in the conversation, so the same sentence could be on screen three times. When the fix is to install or choose a model, the message now has a Set up a model or Choose a model button that takes you there.","Notes that a long conversation was shortened to fit the model's memory no longer carry a warning sign, because nothing went wrong.","The window recovers from a crash. If the window's contents crashed, for example after a long night of live updates, the window stayed blank until you quit gezel. It now reloads itself, up to three times in ten minutes.","\"Waiting on you\" opens Activity in the right place. On Home and beside a project in the sidebar, the counts open Activity at Needs you or Ready, rather than at the top.","A new local chat model, Underdog Saluki 1.0, is in Settings → Artificial Intelligence. It is Conway Research's compact edition of Qwen 3.8 27B, a 7.9 GB download tuned for using tools.","LFM2.5 24B gets more room to think. This model always reasons before it acts, and while writing a file it was cut off after 1,024 characters of reasoning. It now gets three times as much.","Fewer false alarms when a gezel writes facts. The check that stops a gezel from writing a name, date or number no source shows no longer trips on the gezel's own name, the project's name, bold headings or words in capitals.","Craftbook steps told to write a file can write it. Some steps described a file to write in plain words, and were left without a tool that could write it, so they stalled.","Knowledge catalogs open in Knowledge. The + beside the catalog picker and Browse knowledge catalogs open a dialog in place, instead of sending you to Settings. Catalogs now have artwork.","OpenAI and Anthropic Claude with an API key are always listed under Settings → Artificial Intelligence. Before, they were hidden until set up. With a key, Claude now starts on Claude Opus 5.5 and OpenAI on GPT-6.1 Sol. Each model offers the reasoning efforts it supports, including xhigh and max on the newer Claude models. A saved effort that a model does not support moves to the nearest one it does.","Claude Code and Codex. Claude Code offers every reasoning effort for each of its models, Haiku included, and can now use toolsets that run as a web service, such as DocBlocks. Codex adds GPT-6.1 Sol, now its default, and GPT-6 Astra, Sol and Luna. When either cannot reach a tool server it now says so, and Codex tries again when its connection to gezel's tools fails. Files they read and write with their own tools now count toward a craftbook step's checks. Before, those steps could never pass.","Model downloads keep going when you leave the page. Speech, voice and image-recognition models now download in the background service. A second click joins the running download, and Cancel really stops it.","Local models are faster on a graphics card. When a model fits entirely on the GPU, llama.cpp now uses at most four processor threads instead of all of them. On a DGX Spark, a small Gemma model went from 72 to about 120 tokens a second. A thread count you set yourself still wins.","A busy index no longer holds things up. Gezel used to stall for up to five seconds when its search index was busy, and could lose the Boekwachter's file summaries. It now waits its turn and retries.","History search waits until you stop typing, and no longer shows results from an earlier search.","Spelling and grammar checking no longer turns itself back on when you change an unrelated setting.","Restarting gezel no longer crashes. Restarting the service, for example from Settings, could end in a crash report. It now stops its model workers cleanly first.","Tasks no longer disappear. A task gezel could not read back used to be created and then vanish. It is now refused when you create it, with the reason.","New projects start reliably. Starting a ready-made kind of project could fail with \"gezel … already exists\" when a randomly chosen crew name was taken, and a new project could be labeled \"Social Media\" by mistake.","Errors from OpenAI now show, instead of arriving as an empty answer.","Mac ._ files are no longer indexed. These hidden companion files failed to index and were tried again every night.","On Linux, the packages now list the system libraries gezel needs, so a system too old to run it, such as Ubuntu 22.04, Debian 12 or Fedora 39, refuses the install instead of gezel failing when it starts. Installing under WSL, or in a container without systemd, no longer leaves the package half set up.","Dependencies: @bendyline/gilde 0.2.0 and the Squisq document editor 2.11.25. The n mn":1,"offset":41259},"end":{"line":236,"column":817,"offset":42075}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Eight days after 1.26279. Until now,","startTime":0,"endTime":3.2857142857142856,"audioSegment":0},{"text":"putting your gezellen to work on your own files meant setting up a project and deciding what to ask.","startTime":3.2857142857142856,"endTime":6.571428571428571,"audioSegment":0},{"text":"Gezellen (one is a gezel) are the named AI craftspeople on your crew.","startTime":6.571428571428571,"endTime":9.857142857142858,"audioSegment":0},{"text":"Now you can hand them a folder, such as your Pictures,","startTime":9.857142857142858,"endTime":13.142857142857142,"audioSegment":0},{"text":"your Documents or a codebase.","startTime":13.142857142857142,"endTime":16.428571428571427,"audioSegment":0},{"text":"They read it, never change it, and work on it overnight.","startTime":16.428571428571427,"endTime":19.714285714285715,"audioSegment":0},{"text":"In the morning you find a short report,","startTime":19.714285714285715,"endTime":23,"audioSegment":0},{"text":"albums of your recent photos, and fixes for you to approve.","startTime":23,"endTime":26.285714285714285,"audioSegment":0},{"text":"This release also rebuilds your first few minutes with gezel around one conversation with the Meester,","startTime":26.285714285714285,"endTime":29.57142857142857,"audioSegment":0},{"text":"the crew's guildmaster and the first gezel you meet.","startTime":29.57142857142857,"endTime":32.857142857142854,"audioSegment":0},{"text":"And in Word, Excel and PowerPoint,","startTime":32.857142857142854,"endTime":36.14285714285714,"audioSegment":0},{"text":"the Gezel pane is now a chat about the document you have open.","startTime":36.14285714285714,"endTime":39.42857142857143,"audioSegment":0},{"text":"If you read only one thing: choose File → Add Folder…,","startTime":39.42857142857143,"endTime":42.714285714285715,"audioSegment":0},{"text":"and see what your crew makes of your Pictures folder by tomorrow morning.","startTime":42.714285714285715,"endTime":46,"audioSegment":0},{"text":"Starting gezel for the first time used to open on a setup page.","startTime":46,"endTime":49.52,"audioSegment":0},{"text":"It asked about a security level, names and figures, social mode,","startTime":49.52,"endTime":53.04,"audioSegment":0},{"text":"a relevance check and optional downloads, all before you had said a word.","startTime":53.04,"endTime":56.56,"audioSegment":0},{"text":"Now the Meester introduces themselves and asks for one thing: \"Before we start,","startTime":56.56,"endTime":60.08,"audioSegment":0},{"text":"I need my tools: an AI that runs privately on this computer.\" One key fetches it and shows its size and roughly how long it will take.","startTime":60.08,"endTime":63.6,"audioSegment":0},{"text":"Below it are Use one already on this computer and Connect a cloud account instead.","startTime":63.6,"endTime":67.12,"audioSegment":0},{"text":"Everything else starts on its default.","startTime":67.12,"endTime":70.64,"audioSegment":0},{"text":"One line says what that means,","startTime":70.64,"endTime":74.16,"audioSegment":0},{"text":"with Change what I'm allowed to do if you want something else.","startTime":74.16,"endTime":77.68,"audioSegment":0},{"text":"The model offered is one that will start.","startTime":77.68,"endTime":81.2,"audioSegment":0},{"text":"Gezel now picks it by the memory free right now, not by the size of the computer,","startTime":81.2,"endTime":84.72,"audioSegment":0},{"text":"and ranks the most heavily compressed models lower. Before,","startTime":84.72,"endTime":88.24000000000001,"audioSegment":0},{"text":"a laptop with a 12 GB graphics card could be offered a model that was then refused on its first message.","startTime":88.24000000000001,"endTime":91.75999999999999,"audioSegment":0},{"text":"On Windows and Linux, the welcome also waits for the engine that runs the model (\"Setting up my workbench\"),","startTime":91.75999999999999,"endTime":95.28,"audioSegment":0},{"text":"so your first message no longer fails with \"the engine is downloading\".","startTime":95.28,"endTime":98.8,"audioSegment":0},{"text":"Until a model is ready,","startTime":98.8,"endTime":102.32,"audioSegment":0},{"text":"the chat box says \"name can start talking once a model is downloaded.\"","startTime":102.32,"endTime":105.84,"audioSegment":0},{"text":"Something to start with.","startTime":105.84,"endTime":109.36,"audioSegment":0},{"text":"An empty Meester chat offers four ways to start, such as Plan a trip,","startTime":109.36,"endTime":112.88,"audioSegment":0},{"text":"Practice a language or Make sense of a spreadsheet, led by what you said you want help with.","startTime":112.88,"endTime":116.4,"audioSegment":0},{"text":"Each fills in a sentence for you to change before you send it,","startTime":116.4,"endTime":119.92,"audioSegment":0},{"text":"such as \"Plan a trip to Lisbon next spring for the four of us, about a week.\"","startTime":119.92,"endTime":123.44,"audioSegment":0},{"text":"Goals go to the right kind of project.","startTime":123.44,"endTime":126.96,"audioSegment":0},{"text":"Some kinds of project come ready-made, with their own crew and board.","startTime":126.96,"endTime":130.48000000000002,"audioSegment":0},{"text":"A goal that clearly names one, such as a trip or learning a language,","startTime":130.48000000000002,"endTime":134,"audioSegment":0},{"text":"now starts a Trip Planner or a Language Trainer.","startTime":134,"endTime":137.51999999999998,"audioSegment":0},{"text":"Before, a trip could get a developer writing a web page.","startTime":137.51999999999998,"endTime":141.04000000000002,"audioSegment":0},{"text":"The task keeps your own sentence rather than the Meester's longer version of it.","startTime":141.04000000000002,"endTime":144.56,"audioSegment":0},{"text":"Thread titles keep it too: \"Plan a trip to Lisbon next spring for the four of us\",","startTime":144.56,"endTime":148.07999999999998,"audioSegment":0},{"text":"not \"Plan trip Lisbon next spring four week\".","startTime":148.07999999999998,"endTime":151.6,"audioSegment":0},{"text":"\"What would you like help with?\" The welcome asks once,","startTime":151.6,"endTime":155.12,"audioSegment":0},{"text":"with choices such as Writing software, Home and family and Games and play.","startTime":155.12,"endTime":158.64,"audioSegment":0},{"text":"Whatever you pick comes first in the starting suggestions, Make something on Home,","startTime":158.64,"endTime":162.16,"audioSegment":0},{"text":"a new For you shelf in New Task, New Project and suggested knowledge catalogs.","startTime":162.16,"endTime":165.68,"audioSegment":0},{"text":"Nothing is ever hidden because of it.","startTime":165.68,"endTime":169.2,"audioSegment":0},{"text":"Change your answer in Settings → General → What you use gezel for.","startTime":169.2,"endTime":172.72,"audioSegment":0},{"text":"Your crew is introduced.","startTime":172.72,"endTime":176.24,"audioSegment":0},{"text":"When work brings gezellen in, the thread shows who joined: their portrait,","startTime":176.24,"endTime":179.76,"audioSegment":0},{"text":"their role in plain words (such as \"Reisleider — trip planner\"), the step they start with, and Say hello.","startTime":179.76,"endTime":183.28,"audioSegment":0},{"text":"Before, they joined without a word.","startTime":183.28,"endTime":186.8,"audioSegment":0},{"text":"The welcome also names the two already at work: the Klerk,","startTime":186.8,"endTime":190.32,"audioSegment":0},{"text":"who handles titles and summaries, and the Boekwachter, who keeps track of your files.","startTime":190.32,"endTime":193.84,"audioSegment":0},{"text":"A new install starts quietly.","startTime":193.84,"endTime":197.36,"audioSegment":0},{"text":"For the first 30 minutes, and until a model can answer,","startTime":197.36,"endTime":200.88,"audioSegment":0},{"text":"gezel does no indexing in the background.","startTime":200.88,"endTime":204.4,"audioSegment":0},{"text":"Folders you add yourself are still indexed at once.","startTime":204.4,"endTime":207.92,"audioSegment":0},{"text":"The scheduled Night Shift waits the same way.","startTime":207.92,"endTime":211.44,"audioSegment":0},{"text":"The optional media models for pictures and speech are no longer offered during setup.","startTime":211.44,"endTime":214.96,"audioSegment":0},{"text":"They are in Settings → Artificial Intelligence → Media models,","startTime":214.96,"endTime":218.48,"audioSegment":0},{"text":"which offers only the ones this computer can run.","startTime":218.48,"endTime":222,"audioSegment":0},{"text":"There are three ways in.","startTime":222,"endTime":224.9655172413793,"audioSegment":0},{"text":"One is Add Folder… in the File menu (Cmd/Ctrl+Shift+O).","startTime":224.9655172413793,"endTime":227.93103448275863,"audioSegment":0},{"text":"Another is the Existing Folder choice under New Project.","startTime":227.93103448275863,"endTime":230.89655172413794,"audioSegment":0},{"text":"The third is the Meester: once your first piece of work is finished,","startTime":230.89655172413794,"endTime":233.86206896551724,"audioSegment":0},{"text":"they ask at the end of your conversation, \"Want me to look after a folder of yours too?","startTime":233.86206896551724,"endTime":236.82758620689654,"audioSegment":0},{"text":"I'll only read it.\" Pictures, Documents and any code folders gezel finds are listed there,","startTime":236.82758620689654,"endTime":239.79310344827587,"audioSegment":0},{"text":"and nothing is ticked for you.","startTime":239.79310344827587,"endTime":242.75862068965517,"audioSegment":0},{"text":"The question stays until you add a folder or choose Skip for now.","startTime":242.75862068965517,"endTime":245.72413793103448,"audioSegment":0},{"text":"Before anything is added, you see what the folder holds,","startTime":245.72413793103448,"endTime":248.68965517241378,"audioSegment":0},{"text":"such as \"12,480 photos · 1,204 only in the cloud\", and what your crew will do with it tonight.","startTime":248.68965517241378,"endTime":251.6551724137931,"audioSegment":0},{"text":"Read-only, always.","startTime":251.6551724137931,"endTime":254.6206896551724,"audioSegment":0},{"text":"Gezel reads the folder and builds a search index of it.","startTime":254.6206896551724,"endTime":257.58620689655174,"audioSegment":0},{"text":"It never changes,","startTime":257.58620689655174,"endTime":260.55172413793105,"audioSegment":0},{"text":"moves or deletes a file unless you ask and approve.","startTime":260.55172413793105,"endTime":263.51724137931035,"audioSegment":0},{"text":"That includes git's own housekeeping files in a code folder.","startTime":263.51724137931035,"endTime":266.48275862068965,"audioSegment":0},{"text":"Everything gezel learns about the folder, such as its index,","startTime":266.48275862068965,"endTime":269.44827586206895,"audioSegment":0},{"text":"photo descriptions and summaries, lives in gezel's own folder, not yours.","startTime":269.44827586206895,"endTime":272.41379310344826,"audioSegment":0},{"text":"Earlier versions kept a project's search index in a .gezel folder inside your folder.","startTime":272.41379310344826,"endTime":275.37931034482756,"audioSegment":0},{"text":"It is moved out the first time gezel starts,","startTime":275.37931034482756,"endTime":278.3448275862069,"audioSegment":0},{"text":"not rebuilt, so nothing is read again.","startTime":278.3448275862069,"endTime":281.3103448275862,"audioSegment":0},{"text":"Files that live only in the cloud stay there.","startTime":281.3103448275862,"endTime":284.2758620689655,"audioSegment":0},{"text":"With iCloud's Optimize Storage or OneDrive's Files On-Demand,","startTime":284.2758620689655,"endTime":287.2413793103448,"audioSegment":0},{"text":"files that are not on this computer are listed by name and date, and never downloaded.","startTime":287.2413793103448,"endTime":290.2068965517241,"audioSegment":0},{"text":"A Photos library belongs to the Photos app,","startTime":290.2068965517241,"endTime":293.1724137931035,"audioSegment":0},{"text":"so gezel leaves it alone.","startTime":293.1724137931035,"endTime":296.1379310344828,"audioSegment":0},{"text":"A crew comes with it.","startTime":296.1379310344828,"endTime":299.1034482758621,"audioSegment":0},{"text":"Every folder gets a Boekwachter, the crew member who reads a folder,","startTime":299.1034482758621,"endTime":302.0689655172414,"audioSegment":0},{"text":"describes it and files issues about it.","startTime":302.0689655172414,"endTime":305.0344827586207,"audioSegment":0},{"text":"A code folder also gets a Builder,","startTime":305.0344827586207,"endTime":308,"audioSegment":0},{"text":"which lets your crew draft fixes overnight.","startTime":308,"endTime":310.9655172413793,"audioSegment":0},{"text":"A photo folder gets a Curator,","startTime":310.9655172413793,"endTime":313.9310344827586,"audioSegment":0},{"text":"a new role that looks after your photos (The Curator).","startTime":313.9310344827586,"endTime":316.8965517241379,"audioSegment":0},{"text":"They are added once, when you add the folder.","startTime":316.8965517241379,"endTime":319.86206896551727,"audioSegment":0},{"text":"If you take one off, they stay off.","startTime":319.86206896551727,"endTime":322.82758620689657,"audioSegment":0},{"text":"The folder's Overview gives you a first look.","startTime":322.82758620689657,"endTime":325.7931034482759,"audioSegment":0},{"text":"For example: \"12,480 photos from 2009 to 2026 · about 3,100 look like duplicates · 840 screenshots\",","startTime":325.7931034482759,"endTime":328.7586206896552,"audioSegment":0},{"text":"and how long the first pass will take, when that is an hour or more.","startTime":328.7586206896552,"endTime":331.7241379310345,"audioSegment":0},{"text":"A file you open in the folder shows an About this file line with the Boekwachter's one-line summary.","startTime":331.7241379310345,"endTime":334.6896551724138,"audioSegment":0},{"text":"Changes arrive as proposals.","startTime":334.6896551724138,"endTime":337.65517241379314,"audioSegment":0},{"text":"When your crew wants to change something, say a fix for a problem in your code,","startTime":337.65517241379314,"endTime":340.62068965517244,"audioSegment":0},{"text":"you get a change proposal to read and apply yourself.","startTime":340.62068965517244,"endTime":343.58620689655174,"audioSegment":0},{"text":"Proposals can now also move and copy files and create folders.","startTime":343.58620689655174,"endTime":346.55172413793105,"audioSegment":0},{"text":"Each of these is its own row,","startTime":346.55172413793105,"endTime":349.51724137931035,"audioSegment":0},{"text":"applied after the edits and never over an existing file.","startTime":349.51724137931035,"endTime":352.48275862068965,"audioSegment":0},{"text":"A problem the Boekwachter found is marked fixed only when you apply its fix,","startTime":352.48275862068965,"endTime":355.44827586206895,"audioSegment":0},{"text":"and opens again if you dismiss the proposal.","startTime":355.44827586206895,"endTime":358.41379310344826,"audioSegment":0},{"text":"Folders you add from the File menu or New Project are worked on overnight by default,","startTime":358.41379310344826,"endTime":361.37931034482756,"audioSegment":0},{"text":"during the Night Shift, the work your crew does while you sleep.","startTime":361.37931034482756,"endTime":364.3448275862069,"audioSegment":0},{"text":"A code folder gets reviews of its structure, dependencies,","startTime":364.3448275862069,"endTime":367.3103448275862,"audioSegment":0},{"text":"security and tests, plus fixes drafted for what they find.","startTime":367.3103448275862,"endTime":370.2758620689655,"audioSegment":0},{"text":"Fixes are now drafted only for code folders.","startTime":370.2758620689655,"endTime":373.2413793103448,"audioSegment":0},{"text":"A photo folder gets albums.","startTime":373.2413793103448,"endTime":376.2068965517242,"audioSegment":0},{"text":"Overnight work is switched on only for gezellen that run on a model on this computer.","startTime":376.2068965517242,"endTime":379.1724137931035,"audioSegment":0},{"text":"Nothing that would send your files to a cloud model is switched on for you.","startTime":379.1724137931035,"endTime":382.1379310344828,"audioSegment":0},{"text":"To stop overnight work on a folder,","startTime":382.1379310344828,"endTime":385.1034482758621,"audioSegment":0},{"text":"turn off Work on this folder overnight on its Overview.","startTime":385.1034482758621,"endTime":388.0689655172414,"audioSegment":0},{"text":"The folder stays searchable.","startTime":388.0689655172414,"endTime":391.0344827586207,"audioSegment":0},{"text":"See Adding folders.","startTime":391.0344827586207,"endTime":394,"audioSegment":0},{"text":"When your crew worked overnight, Home opens on its Night shift tab.","startTime":394,"endTime":397.2549019607843,"audioSegment":0},{"text":"It leads with what needs a decision: change proposals,","startTime":397.2549019607843,"endTime":400.5098039215686,"audioSegment":0},{"text":"then the night's main report, shown in full.","startTime":400.5098039215686,"endTime":403.7647058823529,"audioSegment":0},{"text":"Then it shows what finished, new albums and On this day for your photo folders,","startTime":403.7647058823529,"endTime":407.01960784313724,"audioSegment":0},{"text":"and what is already queued for tonight.","startTime":407.01960784313724,"endTime":410.27450980392155,"audioSegment":0},{"text":"The morning card stays until you press Dismiss; after that,","startTime":410.27450980392155,"endTime":413.52941176470586,"audioSegment":0},{"text":"the tab keeps a summary of the night for about half a day.","startTime":413.52941176470586,"endTime":416.7843137254902,"audioSegment":0},{"text":"A quiet night stays quiet.","startTime":416.7843137254902,"endTime":420.03921568627453,"audioSegment":0},{"text":"A night when the computer was asleep,","startTime":420.03921568627453,"endTime":423.29411764705884,"audioSegment":0},{"text":"gezel was not running or there was nothing to do leaves no card and no notification.","startTime":423.29411764705884,"endTime":426.54901960784315,"audioSegment":0},{"text":"When work was held back for a reason you can fix (the computer was on battery,","startTime":426.54901960784315,"endTime":429.80392156862746,"audioSegment":0},{"text":"or your cloud quota was being saved), the card says so once and offers the fix.","startTime":429.80392156862746,"endTime":433.05882352941177,"audioSegment":0},{"text":"A night's reports and finished work stay on their card until you dismiss it;","startTime":433.05882352941177,"endTime":436.3137254901961,"audioSegment":0},{"text":"a newer card replaces an older one only when it shows the same things again.","startTime":436.3137254901961,"endTime":439.5686274509804,"audioSegment":0},{"text":"Each folder leaves a short report,","startTime":439.5686274509804,"endTime":442.8235294117647,"audioSegment":0},{"text":"made without a model, so it costs nothing.","startTime":442.8235294117647,"endTime":446.078431372549,"audioSegment":0},{"text":"Photos: recent outings, photos from this day in earlier years,","startTime":446.078431372549,"endTime":449.3333333333333,"audioSegment":0},{"text":"and exact duplicates.","startTime":449.3333333333333,"endTime":452.5882352941176,"audioSegment":0},{"text":"Documents: what was added or changed.","startTime":452.5882352941176,"endTime":455.843137254902,"audioSegment":0},{"text":"Code: the files that change often and carry problems,","startTime":455.843137254902,"endTime":459.0980392156863,"audioSegment":0},{"text":"the files everything else depends on, and open issues by severity.","startTime":459.0980392156863,"endTime":462.3529411764706,"audioSegment":0},{"text":"On the first morning of a new week,","startTime":462.3529411764706,"endTime":465.6078431372549,"audioSegment":0},{"text":"Your crew's week recaps every night.","startTime":465.6078431372549,"endTime":468.8627450980392,"audioSegment":0},{"text":"Queue something for tonight.","startTime":468.8627450980392,"endTime":472.11764705882354,"audioSegment":0},{"text":"While the Night Shift is on, a one-time craftbook (a written recipe of steps a crew follows) has a Tonight choice,","startTime":472.11764705882354,"endTime":475.37254901960785,"audioSegment":0},{"text":"in the chat's task bar and in the New Task dialog, so it runs during the Night Shift instead of now.","startTime":475.37254901960785,"endTime":478.62745098039215,"audioSegment":0},{"text":"In the New Task dialog, pressing Enter always starts it now.","startTime":478.62745098039215,"endTime":481.88235294117646,"audioSegment":0},{"text":"In the chat's task bar, Tonight is a switch: while it is on,","startTime":481.88235294117646,"endTime":485.1372549019608,"audioSegment":0},{"text":"sending queues the task for tonight.","startTime":485.1372549019608,"endTime":488.3921568627451,"audioSegment":0},{"text":"New in Settings → General → Night Shift: Start Gezel when I log in,","startTime":488.3921568627451,"endTime":491.6470588235294,"audioSegment":0},{"text":"without opening a window keeps gezel in the tray, or the menu bar on a Mac, from the moment you log in.","startTime":491.6470588235294,"endTime":494.9019607843137,"audioSegment":0},{"text":"It is available in the installed app only.","startTime":494.9019607843137,"endTime":498.156862745098,"audioSegment":0},{"text":"Pause night work while this computer runs on battery is on by default: unplug and the shift stops,","startTime":498.156862745098,"endTime":501.4117647058823,"audioSegment":0},{"text":"plug in and it continues.","startTime":501.4117647058823,"endTime":504.6666666666667,"audioSegment":0},{"text":"When the Meester asks about folders, answering Yes to \"Let your crew work while you sleep?\" turns both on,","startTime":504.6666666666667,"endTime":507.921568627451,"audioSegment":0},{"text":"along with the Night Shift itself and keeping the computer awake while it runs.","startTime":507.921568627451,"endTime":511.1764705882353,"audioSegment":0},{"text":"Nothing is answered for you: a folder added there gets overnight work only after a Yes.","startTime":511.1764705882353,"endTime":514.4313725490197,"audioSegment":0},{"text":"One Mac setting is gone.","startTime":514.4313725490197,"endTime":517.686274509804,"audioSegment":0},{"text":"Wake this machine when the window opens never worked,","startTime":517.686274509804,"endTime":520.9411764705883,"audioSegment":0},{"text":"because macOS lets only administrators schedule a wake.","startTime":520.9411764705883,"endTime":524.1960784313726,"audioSegment":0},{"text":"Settings now says so.","startTime":524.1960784313726,"endTime":527.4509803921569,"audioSegment":0},{"text":"Leave the Mac plugged in and awake for the night.","startTime":527.4509803921569,"endTime":530.7058823529412,"audioSegment":0},{"text":"The Default project rests at night.","startTime":530.7058823529412,"endTime":533.9607843137255,"audioSegment":0},{"text":"Default is where chats and tasks land when you have not picked a project.","startTime":533.9607843137255,"endTime":537.2156862745098,"audioSegment":0},{"text":"It no longer gets overnight work.","startTime":537.2156862745098,"endTime":540.4705882352941,"audioSegment":0},{"text":"The Meester's nightly review now looks only at projects that have overnight work on.","startTime":540.4705882352941,"endTime":543.7254901960785,"audioSegment":0},{"text":"Stalled fix runs are cleared the next night.","startTime":543.7254901960785,"endTime":546.9803921568628,"audioSegment":0},{"text":"A fix run left paused, or waiting on a question nobody was awake to answer,","startTime":546.9803921568628,"endTime":550.2352941176471,"audioSegment":0},{"text":"used to hold on to its problems for good.","startTime":550.2352941176471,"endTime":553.4901960784314,"audioSegment":0},{"text":"It is now cancelled the following night so the crew can try those problems again,","startTime":553.4901960784314,"endTime":556.7450980392157,"audioSegment":0},{"text":"and its question is removed from your list.","startTime":556.7450980392157,"endTime":560,"audioSegment":0},{"text":"The Gezel pane in Word, Excel and PowerPoint used to hold the whole project: its tabs,","startTime":560,"endTime":562.9736842105264,"audioSegment":0},{"text":"its tasks and every gezel's threads.","startTime":562.9736842105264,"endTime":565.9473684210526,"audioSegment":0},{"text":"The gezel in it often did not know which document you meant.","startTime":565.9473684210526,"endTime":568.921052631579,"audioSegment":0},{"text":"Ask it to \"add some content\" to an empty Word document and it could ask which file.","startTime":568.921052631579,"endTime":571.8947368421053,"audioSegment":0},{"text":"Now the pane is one conversation about the document in front of you,","startTime":571.8947368421053,"endTime":574.8684210526316,"audioSegment":0},{"text":"with the document's name at the top.","startTime":574.8684210526316,"endTime":577.8421052631579,"audioSegment":0},{"text":"The gezel sees what you have selected.","startTime":577.8421052631579,"endTime":580.8157894736842,"audioSegment":0},{"text":"Every message you send tells the gezel what is selected,","startTime":580.8157894736842,"endTime":583.7894736842105,"audioSegment":0},{"text":"or that nothing is, or that the document is empty.","startTime":583.7894736842105,"endTime":586.7631578947369,"audioSegment":0},{"text":"With edits allowed, \"add\",","startTime":586.7631578947369,"endTime":589.7368421052631,"audioSegment":0},{"text":"\"write\" or \"change\" goes in at the cursor without asking where.","startTime":589.7368421052631,"endTime":592.7105263157895,"audioSegment":0},{"text":"With edits off, the text comes back in the reply,","startTime":592.7105263157895,"endTime":595.6842105263158,"audioSegment":0},{"text":"with a reminder that you can allow edits in the pane.","startTime":595.6842105263158,"endTime":598.6578947368421,"audioSegment":0},{"text":"It keeps to the document.","startTime":598.6578947368421,"endTime":601.6315789473684,"audioSegment":0},{"text":"The gezel gets the document's own tools plus search, memory and web lookups,","startTime":601.6315789473684,"endTime":604.6052631578948,"audioSegment":0},{"text":"and other files in the project are no longer pulled into the conversation.","startTime":604.6052631578948,"endTime":607.578947368421,"audioSegment":0},{"text":"Your shared library, memories and knowledge catalogs still count.","startTime":607.578947368421,"endTime":610.5526315789474,"audioSegment":0},{"text":"With less to read before it answers, it starts sooner.","startTime":610.5526315789474,"endTime":613.5263157894736,"audioSegment":0},{"text":"Only this document's threads are listed,","startTime":613.5263157894736,"endTime":616.5,"audioSegment":0},{"text":"and they are still there after a Save As.","startTime":616.5,"endTime":619.4736842105264,"audioSegment":0},{"text":"Show project opens the full project when you want it,","startTime":619.4736842105264,"endTime":622.4473684210526,"audioSegment":0},{"text":"with a key to come back.","startTime":622.4473684210526,"endTime":625.421052631579,"audioSegment":0},{"text":"A writer answers by default.","startTime":625.421052631579,"endTime":628.3947368421052,"audioSegment":0},{"text":"The pane picks a writer from the crew,","startTime":628.3947368421052,"endTime":631.3684210526316,"audioSegment":0},{"text":"then the project's lead, then the Meester.","startTime":631.3684210526316,"endTime":634.3421052631579,"audioSegment":0},{"text":"The Boekwachter, Klerk and Keurmeester, who work in the background,","startTime":634.3421052631579,"endTime":637.3157894736842,"audioSegment":0},{"text":"are no longer picked for you and are hidden from Talk to.","startTime":637.3157894736842,"endTime":640.2894736842105,"audioSegment":0},{"text":"Setup on Windows says what to do.","startTime":640.2894736842105,"endTime":643.2631578947369,"audioSegment":0},{"text":"Office shows Gezel's button on the Home tab only after you have opened Gezel once from Add-ins → Developer Add-ins.","startTime":643.2631578947369,"endTime":646.2368421052631,"audioSegment":0},{"text":"The setup steps now say so on Windows,","startTime":646.2368421052631,"endTime":649.2105263157895,"audioSegment":0},{"text":"as they already did on a Mac.","startTime":649.2105263157895,"endTime":652.1842105263158,"audioSegment":0},{"text":"LibreOffice on Windows no longer refuses to install its extension with \"Close LibreOffice first\" when no LibreOffice window is open.","startTime":652.1842105263158,"endTime":655.1578947368421,"audioSegment":0},{"text":"Gezel used to leave a hidden copy of LibreOffice running each time it checked the version.","startTime":655.1578947368421,"endTime":658.1315789473684,"audioSegment":0},{"text":"Settings → Connected Apps has a tab for each app: Overview,","startTime":658.1315789473684,"endTime":661.1052631578948,"audioSegment":0},{"text":"Codex, VS Code, OpenCode, pi, Office, LibreOffice and Ollama.","startTime":661.1052631578948,"endTime":664.078947368421,"audioSegment":0},{"text":"A tab whose setup needs you shows a dot,","startTime":664.078947368421,"endTime":667.0526315789474,"audioSegment":0},{"text":"and requests waiting for your approval stay above the tabs.","startTime":667.0526315789474,"endTime":670.0263157894736,"audioSegment":0},{"text":"See Connected apps.","startTime":670.0263157894736,"endTime":673,"audioSegment":0},{"text":"Most screens got quieter in this release,","startTime":673,"endTime":676.051724137931,"audioSegment":0},{"text":"so that what you need stands out.","startTime":676.051724137931,"endTime":679.1034482758621,"audioSegment":0},{"text":"\"Task speed\" is now Crew activity.","startTime":679.1034482758621,"endTime":682.1551724137931,"audioSegment":0},{"text":"The control in the title bar opens a menu headed \"How much your gezellen do on their own\",","startTime":682.1551724137931,"endTime":685.2068965517242,"audioSegment":0},{"text":"with four keys: Off, Chat only, Tasks + chat and Proactive.","startTime":685.2068965517242,"endTime":688.2586206896551,"audioSegment":0},{"text":"These were called \"Reactive only\" and \"Tasks + Reactive\" before.","startTime":688.2586206896551,"endTime":691.3103448275862,"audioSegment":0},{"text":"Under them, one line says what the Night Shift is doing,","startTime":691.3103448275862,"endTime":694.3620689655172,"audioSegment":0},{"text":"such as when it ends or what it finished last night, and one key starts or stops it.","startTime":694.3620689655172,"endTime":697.4137931034483,"audioSegment":0},{"text":"Your setting is unchanged.","startTime":697.4137931034483,"endTime":700.4655172413793,"audioSegment":0},{"text":"Chats show less machinery.","startTime":700.4655172413793,"endTime":703.5172413793103,"audioSegment":0},{"text":"The list of steps,","startTime":703.5172413793103,"endTime":706.5689655172414,"audioSegment":0},{"text":"the model's thinking and its attempted tool calls fold behind Details on each reply.","startTime":706.5689655172414,"endTime":709.6206896551724,"audioSegment":0},{"text":"While a gezel works without saying anything,","startTime":709.6206896551724,"endTime":712.6724137931035,"audioSegment":0},{"text":"a hammer with a count shows that it is busy, not stuck.","startTime":712.6724137931035,"endTime":715.7241379310345,"audioSegment":0},{"text":"In the Meester's conversation on Home,","startTime":715.7241379310345,"endTime":718.7758620689656,"audioSegment":0},{"text":"a helper's whole transcript folds into one line, such as \"Mira is working…\".","startTime":718.7758620689656,"endTime":721.8275862068965,"audioSegment":0},{"text":"Night Shift and scheduled runs no longer appear in that conversation at all.","startTime":721.8275862068965,"endTime":724.8793103448276,"audioSegment":0},{"text":"Finished work arrives as a card: \"Name made this for you\".","startTime":724.8793103448276,"endTime":727.9310344827586,"audioSegment":0},{"text":"The card shows the document's title and opening lines,","startTime":727.9310344827586,"endTime":730.9827586206897,"audioSegment":0},{"text":"with Open, Make changes and Show in folder.","startTime":730.9827586206897,"endTime":734.0344827586207,"audioSegment":0},{"text":"When the result is a project's board, such as a trip plan,","startTime":734.0344827586207,"endTime":737.0862068965517,"audioSegment":0},{"text":"the card opens the project's Output page instead.","startTime":737.0862068965517,"endTime":740.1379310344828,"audioSegment":0},{"text":"A task's page lists everything it made,","startTime":740.1379310344828,"endTime":743.1896551724138,"audioSegment":0},{"text":"with Other files under the main result, and it updates as steps finish.","startTime":743.1896551724138,"endTime":746.2413793103449,"audioSegment":0},{"text":"Before, it could stay stuck on the first step.","startTime":746.2413793103449,"endTime":749.2931034482758,"audioSegment":0},{"text":"File names in a question are links.","startTime":749.2931034482758,"endTime":752.3448275862069,"audioSegment":0},{"text":"When a gezel asks you about a file, you can open it straight from the question,","startTime":752.3448275862069,"endTime":755.3965517241379,"audioSegment":0},{"text":"in Activity, on Home or in the project.","startTime":755.3965517241379,"endTime":758.448275862069,"audioSegment":0},{"text":"A gezel's model and tuning have their own Settings tab on the gezel's page: model,","startTime":758.448275862069,"endTime":761.5,"audioSegment":0},{"text":"reasoning effort, context, sources, and the sandbox or access choices for Copilot and Codex.","startTime":761.5,"endTime":764.551724137931,"audioSegment":0},{"text":"Each setting describes itself in full,","startTime":764.551724137931,"endTime":767.6034482758621,"audioSegment":0},{"text":"and a save that fails now says so.","startTime":767.6034482758621,"endTime":770.6551724137931,"audioSegment":0},{"text":"The gezel's header shows its model only when it differs from your default.","startTime":770.6551724137931,"endTime":773.7068965517242,"audioSegment":0},{"text":"Project controls.","startTime":773.7068965517242,"endTime":776.7586206896551,"audioSegment":0},{"text":"A project's status and its Can edit setting moved into More project controls,","startTime":776.7586206896551,"endTime":779.8103448275863,"audioSegment":0},{"text":"which also has Stop workspace edits.","startTime":779.8103448275863,"endTime":782.8620689655172,"audioSegment":0},{"text":"A read-only project still says so in the bar.","startTime":782.8620689655172,"endTime":785.9137931034483,"audioSegment":0},{"text":"Home is a row of tabs over the Meester chat: the greeting with the Meester's status report,","startTime":785.9137931034483,"endTime":788.9655172413793,"audioSegment":0},{"text":"Night shift, Make something and Handboek.","startTime":788.9655172413793,"endTime":792.0172413793103,"audioSegment":0},{"text":"Make something offers ready-made craftbooks, such as a research report, a Word document,","startTime":792.0172413793103,"endTime":795.0689655172414,"audioSegment":0},{"text":"a slide deck, a PDF report, a website or an animated slideshow, with See all for the rest.","startTime":795.0689655172414,"endTime":798.1206896551724,"audioSegment":0},{"text":"It puts what you said you want help with first,","startTime":798.1206896551724,"endTime":801.1724137931035,"audioSegment":0},{"text":"and leaves out what this computer cannot run.","startTime":801.1724137931035,"endTime":804.2241379310345,"audioSegment":0},{"text":"The greeting opens when you start gezel until you put it away;","startTime":804.2241379310345,"endTime":807.2758620689656,"audioSegment":0},{"text":"after that it stays behind its tab until you open it again.","startTime":807.2758620689656,"endTime":810.3275862068965,"audioSegment":0},{"text":"It also stays out of the way when your last message failed or a reply came in while you were away.","startTime":810.3275862068965,"endTime":813.3793103448276,"audioSegment":0},{"text":"To put it away, click the chat,","startTime":813.3793103448276,"endTime":816.4310344827586,"audioSegment":0},{"text":"press Escape, or click the open tab again. A new look.","startTime":816.4310344827586,"endTime":819.4827586206897,"audioSegment":0},{"text":"The app has a new icon, a cream workbench and vise on deep green,","startTime":819.4827586206897,"endTime":822.5344827586207,"audioSegment":0},{"text":"and redrawn tray and menu-bar icons.","startTime":822.5344827586207,"endTime":825.5862068965517,"audioSegment":0},{"text":"The green of the title bar is darker so its small labels are easier to read,","startTime":825.5862068965517,"endTime":828.6379310344828,"audioSegment":0},{"text":"and gray text has more contrast.","startTime":828.6379310344828,"endTime":831.6896551724138,"audioSegment":0},{"text":"Easier with a keyboard or a screen reader.","startTime":831.6896551724138,"endTime":834.7413793103449,"audioSegment":0},{"text":"Every row of choice keys moves with the arrow keys, Home and End.","startTime":834.7413793103449,"endTime":837.7931034482758,"audioSegment":0},{"text":"Text boxes and settings fields have names a screen reader can read out.","startTime":837.7931034482758,"endTime":840.844827586207,"audioSegment":0},{"text":"Reduced motion stops the pulsing dots.","startTime":840.844827586207,"endTime":843.8965517241379,"audioSegment":0},{"text":"In everything you read,","startTime":843.8965517241379,"endTime":846.948275862069,"audioSegment":0},{"text":"the plural of gezel is now gezellen, as in Dutch.","startTime":846.948275862069,"endTime":850,"audioSegment":0},{"text":"When a model on your computer was refused for lack of memory,","startTime":850,"endTime":853.2380952380952,"audioSegment":0},{"text":"the message offered Retry, which failed the same way every time. Now:","startTime":853.2380952380952,"endTime":856.4761904761905,"audioSegment":0},{"text":"Retry appears only when the model would start.","startTime":856.4761904761905,"endTime":859.7142857142857,"audioSegment":0},{"text":"Gezel checks again when you come back to the window.","startTime":859.7142857142857,"endTime":862.952380952381,"audioSegment":0},{"text":"If another model already on this computer would start,","startTime":862.952380952381,"endTime":866.1904761904761,"audioSegment":0},{"text":"Use name instead makes it your default and sends your message again.","startTime":866.1904761904761,"endTime":869.4285714285714,"audioSegment":0},{"text":"The list of local models agrees with that check.","startTime":869.4285714285714,"endTime":872.6666666666666,"audioSegment":0},{"text":"A model that would be refused right now is marked won't start right now,","startTime":872.6666666666666,"endTime":875.9047619047619,"audioSegment":0},{"text":"instead of being called a good match for this machine.","startTime":875.9047619047619,"endTime":879.1428571428571,"audioSegment":0},{"text":"Large models on a graphics card are refused less often.","startTime":879.1428571428571,"endTime":882.3809523809524,"audioSegment":0},{"text":"A model bigger than the card used to be charged for the whole card,","startTime":882.3809523809524,"endTime":885.6190476190476,"audioSegment":0},{"text":"so anything else using the card made it fail.","startTime":885.6190476190476,"endTime":888.8571428571429,"audioSegment":0},{"text":"Gezel now plans against the card's free memory and checks only the part it puts there.","startTime":888.8571428571429,"endTime":892.0952380952381,"audioSegment":0},{"text":"Image and video models are sized from their files.","startTime":892.0952380952381,"endTime":895.3333333333334,"audioSegment":0},{"text":"Each one shows the memory it needs,","startTime":895.3333333333334,"endTime":898.5714285714286,"audioSegment":0},{"text":"such as needs ~9 GB graphics memory.","startTime":898.5714285714286,"endTime":901.8095238095239,"audioSegment":0},{"text":"A model too large for this computer is hidden and cannot be downloaded.","startTime":901.8095238095239,"endTime":905.047619047619,"audioSegment":0},{"text":"Show all models lists it anyway, marked Too large.","startTime":905.047619047619,"endTime":908.2857142857143,"audioSegment":0},{"text":"A model that might not fit asks before it downloads.","startTime":908.2857142857143,"endTime":911.5238095238095,"audioSegment":0},{"text":"Installing an engine shows each stage: downloading, unpacking and checking.","startTime":911.5238095238095,"endTime":914.7619047619048,"audioSegment":0},{"text":"Unpacking the 641 MB Windows graphics-card engine no longer freezes the window for about 18 seconds.","startTime":914.7619047619048,"endTime":918,"audioSegment":0},{"text":"Finding a photo used to mean remembering its name or folder.","startTime":918,"endTime":921.0681818181819,"audioSegment":0},{"text":"Now the search box finds photos by what they show,","startTime":921.0681818181819,"endTime":924.1363636363636,"audioSegment":0},{"text":"such as \"dog on the beach\" or \"birthday cake\".","startTime":924.1363636363636,"endTime":927.2045454545455,"audioSegment":0},{"text":"It also finds the moment in a video or recording where something happens.","startTime":927.2045454545455,"endTime":930.2727272727273,"audioSegment":0},{"text":"Results say Photo, Video · 1:20–1:50 or Sound, photos show a thumbnail,","startTime":930.2727272727273,"endTime":933.3409090909091,"audioSegment":0},{"text":"and opening a video or recording plays it from the moment that matched.","startTime":933.3409090909091,"endTime":936.4090909090909,"audioSegment":0},{"text":"Your gezellen can search your photos the same way.","startTime":936.4090909090909,"endTime":939.4772727272727,"audioSegment":0},{"text":"This replaces the earlier image search with one model,","startTime":939.4772727272727,"endTime":942.5454545454545,"audioSegment":0},{"text":"Google's EmbeddingGemma 2, that understands photos, video and sound together.","startTime":942.5454545454545,"endTime":945.6136363636364,"audioSegment":0},{"text":"It reads photos only while your computer is idle or during the Night Shift,","startTime":945.6136363636364,"endTime":948.6818181818181,"audioSegment":0},{"text":"never during a chat.","startTime":948.6818181818181,"endTime":951.75,"audioSegment":0},{"text":"Photos you had already indexed are read again with the new model the same way.","startTime":951.75,"endTime":954.8181818181819,"audioSegment":0},{"text":"It is on by default, and it downloads about 540 MB the first time gezel starts,","startTime":954.8181818181819,"endTime":957.8863636363636,"audioSegment":0},{"text":"if your security settings allow gezel to use the network.","startTime":957.8863636363636,"endTime":960.9545454545455,"audioSegment":0},{"text":"If they don't, photos are found by name and description as before.","startTime":960.9545454545455,"endTime":964.0227272727273,"audioSegment":0},{"text":"Video and sound need two more things.","startTime":964.0227272727273,"endTime":967.0909090909091,"audioSegment":0},{"text":"Sound support is about 340 MB more.","startTime":967.0909090909091,"endTime":970.1590909090909,"audioSegment":0},{"text":"It downloads when gezel first indexes a video or recording,","startTime":970.1590909090909,"endTime":973.2272727272727,"audioSegment":0},{"text":"or when you press Download sound support now.","startTime":973.2272727272727,"endTime":976.2954545454545,"audioSegment":0},{"text":"You also need ffmpeg, which gezel does not include.","startTime":976.2954545454545,"endTime":979.3636363636364,"audioSegment":0},{"text":"Install it from ffmpeg.org, or with Homebrew on a Mac,","startTime":979.3636363636364,"endTime":982.4318181818182,"audioSegment":0},{"text":"then press Check for ffmpeg again.","startTime":982.4318181818182,"endTime":985.5,"audioSegment":0},{"text":"Photos work without either.","startTime":985.5,"endTime":988.5681818181819,"audioSegment":0},{"text":"Settings → Image recognition → Search photos, video and sound turns it off,","startTime":988.5681818181819,"endTime":991.6363636363636,"audioSegment":0},{"text":"and Photo detail chooses how closely each photo is read: Quick, Balanced, Detailed (the default) or Finest.","startTime":991.6363636363636,"endTime":994.7045454545455,"audioSegment":0},{"text":"At Detailed, a recent Mac reads about one photo every two seconds.","startTime":994.7045454545455,"endTime":997.7727272727273,"audioSegment":0},{"text":"Changing the level reads every photo again in the background.","startTime":997.7727272727273,"endTime":1000.8409090909091,"audioSegment":0},{"text":"More kinds of photo.","startTime":1000.8409090909091,"endTime":1003.9090909090909,"audioSegment":0},{"text":"On a Mac, HEIC photos from iPhones are read.","startTime":1003.9090909090909,"endTime":1006.9772727272727,"audioSegment":0},{"text":"On every computer, camera RAW files (DNG,","startTime":1006.9772727272727,"endTime":1010.0454545454545,"audioSegment":0},{"text":"CR2, NEF, ARW, RAF, ORF, RW2) are read too.","startTime":1010.0454545454545,"endTime":1013.1136363636364,"audioSegment":0},{"text":"For each photo,","startTime":1013.1136363636364,"endTime":1016.1818181818182,"audioSegment":0},{"text":"gezel records the date and the camera and lens it was taken with. Albums.","startTime":1016.1818181818182,"endTime":1019.25,"audioSegment":0},{"text":"Overnight, the Curator turns each recent outing into an album: a slideshow of the frames that tell the day,","startTime":1019.25,"endTime":1022.3181818181819,"audioSegment":0},{"text":"in order and captioned, with gentle motion between them.","startTime":1022.3181818181819,"endTime":1025.3863636363637,"audioSegment":0},{"text":"Open one from the folder's Overview or Home's Night shift tab to play it,","startTime":1025.3863636363637,"endTime":1028.4545454545455,"audioSegment":0},{"text":"edit it, or export it as a video.","startTime":1028.4545454545455,"endTime":1031.5227272727273,"audioSegment":0},{"text":"An album keeps its own smaller copies of the photos,","startTime":1031.5227272727273,"endTime":1034.590909090909,"audioSegment":0},{"text":"with where they were taken removed.","startTime":1034.590909090909,"endTime":1037.659090909091,"audioSegment":0},{"text":"Copy to a folder… gathers the full-size originals in one place and never replaces a file.","startTime":1037.659090909091,"endTime":1040.7272727272727,"audioSegment":0},{"text":"Where a photo was taken stays private.","startTime":1040.7272727272727,"endTime":1043.7954545454545,"audioSegment":0},{"text":"Gezel's photo search and photo tools never tell a gezel using a cloud model,","startTime":1043.7954545454545,"endTime":1046.8636363636365,"audioSegment":0},{"text":"and reports and albums never mention it.","startTime":1046.8636363636365,"endTime":1049.9318181818182,"audioSegment":0},{"text":"A picture you attach to a message yourself is sent as it is.","startTime":1049.9318181818182,"endTime":1053,"audioSegment":0},{"text":"Gezel can make pictures on your own computer,","startTime":1053,"endTime":1056.0588235294117,"audioSegment":0},{"text":"and two new models are in Settings → Image generation.","startTime":1056.0588235294117,"endTime":1059.1176470588234,"audioSegment":0},{"text":"Both are open-licensed and allow commercial use,","startTime":1059.1176470588234,"endTime":1062.1764705882354,"audioSegment":0},{"text":"both make pictures from a description (neither edits a picture you already have), and both start at 1024 by 1024 pixels.","startTime":1062.1764705882354,"endTime":1065.235294117647,"audioSegment":0},{"text":"Ming Image 0.1 Design makes posters, infographics,","startTime":1065.235294117647,"endTime":1068.2941176470588,"audioSegment":0},{"text":"app mockups and other designs that need readable text.","startTime":1068.2941176470588,"endTime":1071.3529411764705,"audioSegment":0},{"text":"It is a workstation model, about 49 GB to download.","startTime":1071.3529411764705,"endTime":1074.4117647058824,"audioSegment":0},{"text":"A 1024-pixel poster took five to seven minutes on a Mac with 128 GB of memory.","startTime":1074.4117647058824,"endTime":1077.4705882352941,"audioSegment":0},{"text":"Iris 3B makes photographs, illustrations and artwork at about one megapixel.","startTime":1077.4705882352941,"endTime":1080.5294117647059,"audioSegment":0},{"text":"It is about 14.5 GB to download.","startTime":1080.5294117647059,"endTime":1083.5882352941176,"audioSegment":0},{"text":"By default it takes 100 steps per picture, choosing detail over speed.","startTime":1083.5882352941176,"endTime":1086.6470588235295,"audioSegment":0},{"text":"A quicker 20-step test took about three minutes on the same Mac,","startTime":1086.6470588235295,"endTime":1089.7058823529412,"audioSegment":0},{"text":"so expect the default to take several times longer.","startTime":1089.7058823529412,"endTime":1092.764705882353,"audioSegment":0},{"text":"Each shows the memory it needs beside its download,","startTime":1092.764705882353,"endTime":1095.8235294117646,"audioSegment":0},{"text":"and is hidden on a computer that cannot run it.","startTime":1095.8235294117646,"endTime":1098.8823529411766,"audioSegment":0},{"text":"They need this release's updated image engine,","startTime":1098.8823529411766,"endTime":1101.9411764705883,"audioSegment":0},{"text":"so earlier versions of gezel do not list them.","startTime":1101.9411764705883,"endTime":1105,"audioSegment":0},{"text":"Telling one gezel your name,","startTime":1105,"endTime":1107.8333333333333,"audioSegment":0},{"text":"your job or that you prefer metric used to stay with that gezel.","startTime":1107.8333333333333,"endTime":1110.6666666666667,"audioSegment":0},{"text":"Now there is one shared set of notes about you,","startTime":1110.6666666666667,"endTime":1113.5,"audioSegment":0},{"text":"read by every gezel.","startTime":1113.5,"endTime":1116.3333333333333,"audioSegment":0},{"text":"It is in Settings → About You, listed by day.","startTime":1116.3333333333333,"endTime":1119.1666666666667,"audioSegment":0},{"text":"Correct or remove anything there,","startTime":1119.1666666666667,"endTime":1122,"audioSegment":0},{"text":"and gezellen read the new version from their next message.","startTime":1122,"endTime":1124.8333333333333,"audioSegment":0},{"text":"It starts empty: notes your gezellen made before this release stay in their own memories.","startTime":1124.8333333333333,"endTime":1127.6666666666667,"audioSegment":0},{"text":"A gezel's Memories tab can be edited,","startTime":1127.6666666666667,"endTime":1130.5,"audioSegment":0},{"text":"both its daily notes and its lessons.","startTime":1130.5,"endTime":1133.3333333333333,"audioSegment":0},{"text":"Lines you put under a ## Pinned heading in lessons are kept word for word when the gezel rewrites its lessons.","startTime":1133.3333333333333,"endTime":1136.1666666666667,"audioSegment":0},{"text":"Gezellen remember corrections.","startTime":1136.1666666666667,"endTime":1139,"audioSegment":0},{"text":"A mistake and its fix are saved as a correction.","startTime":1139,"endTime":1141.8333333333333,"audioSegment":0},{"text":"When a message repeats a mistake you have made before,","startTime":1141.8333333333333,"endTime":1144.6666666666667,"audioSegment":0},{"text":"the gezel sees that note first.","startTime":1144.6666666666667,"endTime":1147.5,"audioSegment":0},{"text":"The Language Trainer below uses this to keep working on what you get wrong.","startTime":1147.5,"endTime":1150.3333333333333,"audioSegment":0},{"text":"Notes about you show up in search, labeled \"Memory · About you\".","startTime":1150.3333333333333,"endTime":1153.1666666666667,"audioSegment":0},{"text":"See Memory, documents, and the shared library.","startTime":1153.1666666666667,"endTime":1156,"audioSegment":0},{"text":"Social mode is a new switch in Settings → General.","startTime":1156,"endTime":1159.16,"audioSegment":0},{"text":"With it on, your gezellen talk in their own character, you can watch them grow,","startTime":1159.16,"endTime":1162.32,"audioSegment":0},{"text":"and opening a chat shows what they have waiting for you.","startTime":1162.32,"endTime":1165.48,"audioSegment":0},{"text":"With it off, they work in a plain, even voice.","startTime":1165.48,"endTime":1168.64,"audioSegment":0},{"text":"It is off by default on the desktop.","startTime":1168.64,"endTime":1171.8,"audioSegment":0},{"text":"If you use the desktop, this changes what you see.","startTime":1171.8,"endTime":1174.96,"audioSegment":0},{"text":"The Growth tab, level badges,","startTime":1174.96,"endTime":1178.12,"audioSegment":0},{"text":"\"I just reached level 3!\" in chat and level-up notifications used to be always on.","startTime":1178.12,"endTime":1181.28,"audioSegment":0},{"text":"Now they show only with social mode on.","startTime":1181.28,"endTime":1184.44,"audioSegment":0},{"text":"Your gezellen keep earning experience either way,","startTime":1184.44,"endTime":1187.6,"audioSegment":0},{"text":"so turning it on brings everything back where it was.","startTime":1187.6,"endTime":1190.76,"audioSegment":0},{"text":"Every gezel has a character: a temperament (warm, calm, lively, precise, wry or patient), one of twelve quirks,","startTime":1190.76,"endTime":1193.92,"audioSegment":0},{"text":"a style (plain, playful or formal) and how much small talk they make, from Quiet to Talkative.","startTime":1193.92,"endTime":1197.08,"audioSegment":0},{"text":"Existing gezellen have been given one.","startTime":1197.08,"endTime":1200.24,"audioSegment":0},{"text":"With social mode on, change it on the gezel's Appearance tab,","startTime":1200.24,"endTime":1203.4,"audioSegment":0},{"text":"which shows the exact lines the gezel reads about itself.","startTime":1203.4,"endTime":1206.56,"audioSegment":0},{"text":"Character decides how a gezel talks,","startTime":1206.56,"endTime":1209.72,"audioSegment":0},{"text":"not what it does, and never makes it skip a step.","startTime":1209.72,"endTime":1212.88,"audioSegment":0},{"text":"Growth counts more of what a gezel learns: corrections it takes on board and worked examples now earn experience.","startTime":1212.88,"endTime":1216.04,"audioSegment":0},{"text":"Chatting more still earns nothing.","startTime":1216.04,"endTime":1219.2,"audioSegment":0},{"text":"\"What's waiting.\" Opening a gezel's chat, or a Just Chat project,","startTime":1219.2,"endTime":1222.36,"audioSegment":0},{"text":"shows at most one thing: a question it asked that you haven't answered, or work it finished in the last three days, with Open.","startTime":1222.36,"endTime":1225.52,"audioSegment":0},{"text":"If nothing is waiting, there is no card.","startTime":1225.52,"endTime":1228.68,"audioSegment":0},{"text":"Dismiss one and it stays gone.","startTime":1228.68,"endTime":1231.84,"audioSegment":0},{"text":"See Social mode.","startTime":1231.84,"endTime":1235,"audioSegment":0},{"text":"Four new craftbooks to try on your own files,","startTime":1235,"endTime":1238.025,"audioSegment":0},{"text":"each of which reads and never changes what you give it.","startTime":1238.025,"endTime":1241.05,"audioSegment":0},{"text":"Explain a code folder gives a plain-language tour: what the code does,","startTime":1241.05,"endTime":1244.075,"audioSegment":0},{"text":"how it is organized, how to run it, and the three files to read first.","startTime":1244.075,"endTime":1247.1,"audioSegment":0},{"text":"Review a code folder lists each real problem with its file and line,","startTime":1247.1,"endTime":1250.125,"audioSegment":0},{"text":"how serious it is and a suggested fix, plus what the code does well.","startTime":1250.125,"endTime":1253.15,"audioSegment":0},{"text":"Make sense of a spreadsheet reports what a CSV or Excel file holds and what stands out,","startTime":1253.15,"endTime":1256.175,"audioSegment":0},{"text":"quoting every number from the file.","startTime":1256.175,"endTime":1259.2,"audioSegment":0},{"text":"Tidy up a spreadsheet cleans a CSV file into a new copy,","startTime":1259.2,"endTime":1262.225,"audioSegment":0},{"text":"with a list of every change and anything it could not fix.","startTime":1262.225,"endTime":1265.25,"audioSegment":0},{"text":"It never guesses a missing value.","startTime":1265.25,"endTime":1268.275,"audioSegment":0},{"text":"Some kinds of project come with their own crew,","startTime":1268.275,"endTime":1271.3,"audioSegment":0},{"text":"tools and an Output tab you can play or practice in.","startTime":1271.3,"endTime":1274.325,"audioSegment":0},{"text":"Several got bigger:","startTime":1274.325,"endTime":1277.35,"audioSegment":0},{"text":"Word Clues is a new word game.","startTime":1277.35,"endTime":1280.375,"audioSegment":0},{"text":"Sixteen words are on the board: six are yours,","startTime":1280.375,"endTime":1283.4,"audioSegment":0},{"text":"nine are bystanders, and one is the trap.","startTime":1283.4,"endTime":1286.425,"audioSegment":0},{"text":"Two new gezellen take turns giving clues,","startTime":1286.425,"endTime":1289.45,"audioSegment":0},{"text":"the lively Woordsmid and the careful Puzzelaar.","startTime":1289.45,"endTime":1292.475,"audioSegment":0},{"text":"Language Trainer has role-play scenes on its Output tab, such as a café,","startTime":1292.475,"endTime":1295.5,"audioSegment":0},{"text":"a market, a pharmacy, lost luggage and a doctor's visit, over three levels.","startTime":1295.5,"endTime":1298.525,"audioSegment":0},{"text":"The tutor's corrections appear under each reply and come back as review cards after a day,","startTime":1298.525,"endTime":1301.55,"audioSegment":0},{"text":"three days and a week.","startTime":1301.55,"endTime":1304.575,"audioSegment":0},{"text":"The tab shows your level,","startTime":1304.575,"endTime":1307.6,"audioSegment":0},{"text":"your day streak and the reviews that are due.","startTime":1307.6,"endTime":1310.625,"audioSegment":0},{"text":"Trip Planner asks \"Who's going?\" and can plan Day 1,","startTime":1310.625,"endTime":1313.65,"audioSegment":0},{"text":"Day 2 and so on before you know the dates.","startTime":1313.65,"endTime":1316.675,"audioSegment":0},{"text":"Day plans are written as plain sentences.","startTime":1316.675,"endTime":1319.7,"audioSegment":0},{"text":"The Output tab shows who is going and dates such as \"Tue 3 Dec\",","startTime":1319.7,"endTime":1322.725,"audioSegment":0},{"text":"or \"Leaving next spring\" when there is no exact date yet.","startTime":1322.725,"endTime":1325.75,"audioSegment":0},{"text":"Flashcards can Make cards from notes: paste your notes and get four to eight cards.","startTime":1325.75,"endTime":1328.775,"audioSegment":0},{"text":"Fitness Coach has Log a session on its Output tab and a Weekly recap: the numbers come from your log,","startTime":1328.775,"endTime":1331.8,"audioSegment":0},{"text":"and the coach adds one suggestion.","startTime":1331.8,"endTime":1334.825,"audioSegment":0},{"text":"It asks before scheduling a Sunday recap.","startTime":1334.825,"endTime":1337.85,"audioSegment":0},{"text":"Checkers, Chess and Go have a new table-talk style, In-character,","startTime":1337.85,"endTime":1340.875,"audioSegment":0},{"text":"now the default, which follows your gezel's character.","startTime":1340.875,"endTime":1343.9,"audioSegment":0},{"text":"Moves are more reliable on small models.","startTime":1343.9,"endTime":1346.925,"audioSegment":0},{"text":"Output pages follow your light or dark theme.","startTime":1346.925,"endTime":1349.95,"audioSegment":0},{"text":"These apply to projects you start from now on.","startTime":1349.95,"endTime":1352.975,"audioSegment":0},{"text":"Projects you already have keep the version they were created with.","startTime":1352.975,"endTime":1356,"audioSegment":0},{"text":"Gezel now notifies you only when something actually happened: a gezel asked you a question, work you asked for is finished,","startTime":1356,"endTime":1358.764705882353,"audioSegment":0},{"text":"your crew worked overnight, a gezel reached a new level (with social mode on), or a project worked out that something is due.","startTime":1358.764705882353,"endTime":1361.5294117647059,"audioSegment":0},{"text":"Flashcards and the Language Trainer,","startTime":1361.5294117647059,"endTime":1364.2941176470588,"audioSegment":0},{"text":"for example, remind you when reviews come up.","startTime":1364.2941176470588,"endTime":1367.0588235294117,"audioSegment":0},{"text":"Gezel never notifies you just because time passed.","startTime":1367.0588235294117,"endTime":1369.8235294117646,"audioSegment":0},{"text":"Three a day at most, by default.","startTime":1369.8235294117646,"endTime":1372.5882352941176,"audioSegment":0},{"text":"Choose Off, 1, 3,","startTime":1372.5882352941176,"endTime":1375.3529411764705,"audioSegment":0},{"text":"5 or 10 in Settings → General → Notifications.","startTime":1375.3529411764705,"endTime":1378.1176470588234,"audioSegment":0},{"text":"Things that happen together arrive as one notification,","startTime":1378.1176470588234,"endTime":1380.8823529411766,"audioSegment":0},{"text":"such as \"3 things are waiting\".","startTime":1380.8823529411766,"endTime":1383.6470588235295,"audioSegment":0},{"text":"Anything over the limit is still waiting in Activity and in its chat.","startTime":1383.6470588235295,"endTime":1386.4117647058824,"audioSegment":0},{"text":"Nothing while you are looking.","startTime":1386.4117647058824,"endTime":1389.1764705882354,"audioSegment":0},{"text":"While a gezel window has focus, you get no notifications.","startTime":1389.1764705882354,"endTime":1391.9411764705883,"audioSegment":0},{"text":"They arrive with the window closed.","startTime":1391.9411764705883,"endTime":1394.7058823529412,"audioSegment":0},{"text":"The app now sends them itself,","startTime":1394.7058823529412,"endTime":1397.4705882352941,"audioSegment":0},{"text":"so they reach you as long as gezel is running, including from the tray.","startTime":1397.4705882352941,"endTime":1400.235294117647,"audioSegment":0},{"text":"See Notifications.","startTime":1400.235294117647,"endTime":1403,"audioSegment":0},{"text":"On a Mac,","startTime":1403,"endTime":1406,"audioSegment":0},{"text":"a script a gezel writes has always run inside a sandbox the operating system enforces.","startTime":1406,"endTime":1409,"audioSegment":0},{"text":"Windows had none, so gezel refused to run many of those scripts there,","startTime":1409,"endTime":1412,"audioSegment":0},{"text":"and at the default Lockdown level the tools for writing and running them were missing.","startTime":1412,"endTime":1415,"audioSegment":0},{"text":"Now Windows has one too: scripts run inside Microsoft's process container (MXC),","startTime":1415,"endTime":1418,"audioSegment":0},{"text":"a sandbox built into recent Windows 11.","startTime":1418,"endTime":1421,"audioSegment":0},{"text":"Scripts that were refused now run.","startTime":1421,"endTime":1424,"audioSegment":0},{"text":"That includes scripts a gezel writes and runs for you,","startTime":1424,"endTime":1427,"audioSegment":0},{"text":"craftbook steps that check their work with a script, and project scripts you or a gezel changed.","startTime":1427,"endTime":1430,"audioSegment":0},{"text":"A script reaches only its project's folder and its own scratch space.","startTime":1430,"endTime":1433,"audioSegment":0},{"text":"It cannot read the rest of your disk,","startTime":1433,"endTime":1436,"audioSegment":0},{"text":"reach the internet or touch the clipboard.","startTime":1436,"endTime":1439,"audioSegment":0},{"text":"When a gezel needs the web, it uses its web tools,","startTime":1439,"endTime":1442,"audioSegment":0},{"text":"which your security settings control and History records.","startTime":1442,"endTime":1445,"audioSegment":0},{"text":"One change if you use Free.","startTime":1445,"endTime":1448,"audioSegment":0},{"text":"On Windows these scripts used to get ordinary network access when External Services was on.","startTime":1448,"endTime":1451,"audioSegment":0},{"text":"Now they always run offline, as they do on a Mac.","startTime":1451,"endTime":1454,"audioSegment":0},{"text":"Reading documents moves inside too.","startTime":1454,"endTime":1457,"audioSegment":0},{"text":"Gezel reads Word, Excel and PowerPoint files in a separate process.","startTime":1457,"endTime":1460,"audioSegment":0},{"text":"On Windows, that process now runs in the sandbox as well.","startTime":1460,"endTime":1463,"audioSegment":0},{"text":"It costs a moment.","startTime":1463,"endTime":1466,"audioSegment":0},{"text":"A script starts about a twentieth of a second later.","startTime":1466,"endTime":1469,"audioSegment":0},{"text":"Settings → Security & Compliance has a Windows sandbox line that says whether it is active on your PC,","startTime":1469,"endTime":1472,"audioSegment":0},{"text":"and why not when it isn't.","startTime":1472,"endTime":1475,"audioSegment":0},{"text":"A switch turns it off.","startTime":1475,"endTime":1478,"audioSegment":0},{"text":"It needs Windows 11 24H2 or later with recent updates.","startTime":1478,"endTime":1481,"audioSegment":0},{"text":"Where your Windows cannot run it, gezel works exactly as before.","startTime":1481,"endTime":1484,"audioSegment":0},{"text":"The installed app includes Microsoft's signed launcher.","startTime":1484,"endTime":1487,"audioSegment":0},{"text":"If you installed gezel with npm, it downloads the launcher (about 38 MB) the first time it starts on Windows,","startTime":1487,"endTime":1490,"audioSegment":0},{"text":"if your security settings allow gezel to use the network.","startTime":1490,"endTime":1493,"audioSegment":0},{"text":"See The security model.","startTime":1493,"endTime":1496,"audioSegment":0},{"text":"None of these changes anything you do.","startTime":1496,"endTime":1499.2083333333333,"audioSegment":0},{"text":"A gezel using git can no longer write files,","startTime":1499.2083333333333,"endTime":1502.4166666666667,"audioSegment":0},{"text":"read files outside the project, or run programs your git settings name.","startTime":1502.4166666666667,"endTime":1505.625,"audioSegment":0},{"text":"Gezellen get a short list of git commands,","startTime":1505.625,"endTime":1508.8333333333333,"audioSegment":0},{"text":"each with its own allowed options.","startTime":1508.8333333333333,"endTime":1512.0416666666667,"audioSegment":0},{"text":"A browser script a gezel wants to run needs your approval of that exact script.","startTime":1512.0416666666667,"endTime":1515.25,"audioSegment":0},{"text":"Changing the script, or anything it loads, asks again.","startTime":1515.25,"endTime":1518.4583333333333,"audioSegment":0},{"text":"The script never gets gezel's own credentials,","startTime":1518.4583333333333,"endTime":1521.6666666666667,"audioSegment":0},{"text":"and it is unavailable while External Services is off.","startTime":1521.6666666666667,"endTime":1524.875,"audioSegment":0},{"text":"A project's own settings can no longer change how packages are installed.","startTime":1524.875,"endTime":1528.0833333333333,"audioSegment":0},{"text":"Installs ignore install-time plugins and hook files a project carries, never switch to a different installer version the project asks for,","startTime":1528.0833333333333,"endTime":1531.2916666666667,"audioSegment":0},{"text":"and always download from the public registry, whatever a planted .npmrc says.","startTime":1531.2916666666667,"endTime":1534.5,"audioSegment":0},{"text":"Photo search and photo tools never tell a cloud model where a photo was taken.","startTime":1534.5,"endTime":1537.7083333333333,"audioSegment":0},{"text":"A picture you attach to a message yourself is sent as it is,","startTime":1537.7083333333333,"endTime":1540.9166666666667,"audioSegment":0},{"text":"so remove its location first if that matters.","startTime":1540.9166666666667,"endTime":1544.125,"audioSegment":0},{"text":"The Windows installer can no longer be redirected.","startTime":1544.125,"endTime":1547.3333333333333,"audioSegment":0},{"text":"Before it sets permissions on gezel's data folders,","startTime":1547.3333333333333,"endTime":1550.5416666666667,"audioSegment":0},{"text":"it checks every link in them.","startTime":1550.5416666666667,"endTime":1553.75,"audioSegment":0},{"text":"Links that stay inside, such as those Python tools create, are kept.","startTime":1553.75,"endTime":1556.9583333333333,"audioSegment":0},{"text":"A link that points somewhere else on the disk is removed from gezel's private folder;","startTime":1556.9583333333333,"endTime":1560.1666666666667,"audioSegment":0},{"text":"in the folder every account shares, it stops the background service setup instead.","startTime":1560.1666666666667,"endTime":1563.375,"audioSegment":0},{"text":"Either way, permissions never change wherever such a link leads.","startTime":1563.375,"endTime":1566.5833333333333,"audioSegment":0},{"text":"Libraries gezel ships with were updated to close eight high-severity security advisories.","startTime":1566.5833333333333,"endTime":1569.7916666666667,"audioSegment":0},{"text":"Axios moves to 1.20.0 and the MCP SDK to 1.31.0.","startTime":1569.7916666666667,"endTime":1573,"audioSegment":0},{"text":"Take a photo from the chat box.","startTime":1573,"endTime":1576.0744680851064,"audioSegment":0},{"text":"A camera key appears next to the picture key when a camera is attached.","startTime":1576.0744680851064,"endTime":1579.1489361702127,"audioSegment":0},{"text":"On the desktop it opens a viewfinder,","startTime":1579.1489361702127,"endTime":1582.223404255319,"audioSegment":0},{"text":"with a camera picker if you have more than one.","startTime":1582.223404255319,"endTime":1585.2978723404256,"audioSegment":0},{"text":"The photo is shrunk to 2048 pixels before it joins your message,","startTime":1585.2978723404256,"endTime":1588.372340425532,"audioSegment":0},{"text":"and on the desktop it carries no location or camera details.","startTime":1588.372340425532,"endTime":1591.4468085106382,"audioSegment":0},{"text":"Switchi
