tion":{"start":{"line":87,"column":3,"offset":9350},"end":{"line":87,"column":230,"offset":9577}}}],"position":{"start":{"line":87,"column":1,"offset":9348},"end":{"line":87,"column":230,"offset":9577}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"New architecture notes: ","position":{"start":{"line":88,"column":3,"offset":9580},"end":{"line":88,"column":27,"offset":9604}}},{"type":"link","url":"../../decisions/0008-per-task-artifact-folders.md","children":[{"type":"text","value":"per-task artifact folders","position":{"start":{"line":88,"column":28,"offset":9605},"end":{"line":88,"column":53,"offset":9630}}}],"position":{"start":{"line":88,"column":27,"offset":9604},"end":{"line":88,"column":105,"offset":9682}}},{"type":"text","value":", the ","position":{"start":{"line":88,"column":105,"offset":9682},"end":{"line":88,"column":111,"offset":9688}}},{"type":"inlineCode","value":".gezk","position":{"start":{"line":88,"column":111,"offset":9688},"end":{"line":88,"column":118,"offset":9695}}},{"type":"text","value":" format, knowledge catalogs, project linking, and project retrieval.","position":{"start":{"line":88,"column":118,"offset":9695},"end":{"line":88,"column":186,"offset":9763}}}],"position":{"start":{"line":88,"column":3,"offset":9580},"end":{"line":88,"column":186,"offset":9763}}}],"position":{"start":{"line":88,"column":1,"offset":9578},"end":{"line":88,"column":186,"offset":9763}}}],"position":{"start":{"line":81,"column":1,"offset":7880},"end":{"line":88,"column":186,"offset":9763}}}],"autoTemplate":true,"templateData":{"items":[".gezk, the knowledge catalog format, is frozen as v1 and implemented in a new @bendyline/gezel-knowledge package: a deterministic compiler, verified archive reading, Ed25519 manifest signing, a Markdown adapter, and a read-only two-stage bit384+int8 retrieval handle. It depends only on core.","New endpoints: /api/knowledge/* for install, enable, quarantine, browse and search; /api/projects/:id/tools/find-similar-images; a people surface for face grouping; and machine-broker knowledge asset endpoints under /v1/remote/manage/knowledge/*. All with client methods.","AI Apps — a project type, crew, craftbooks, scripts, data, and an optional dashboard composed into one reusable experience — have a written guide: Building AI Apps inside Gezel. They package as .gezapp files, and a gezel can export or import one for you.","Retrieval is auditable. Every injected context block records the query hash, policy, estimated tokens, result scores, provenance, and citations as a history event. Raw queries and retrieved text are deliberately not copied into telemetry.","search_code and search_documents are now compatibility aliases for the unified search tool. grep_files remains the right tool for exact strings and regular expressions.","Craftbook steps can scope retrieval, including to knowledge alone, and address their task folder through the reserved {{task.dir}} token.","Embedding instructions are model-aware. The e5 family gets its required query: and passage: prefixes; other families are unchanged. There is a new cross-lingual calibration benchmark with a first Dutch/English baseline.","New architecture notes: per-task artifact folders, the .gezk format, knowledge catalogs, project linking, and project retrieval."],"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":459,"duration":20,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":90,"column":4,"offset":9768},"end":{"line":90,"column":37,"offset":9801}}}],"position":{"start":{"line":90,"column":1,"offset":9765},"end":{"line":90,"column":37,"offset":9801}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Two settings are worth a visit. ","position":{"start":{"line":92,"column":1,"offset":9803},"end":{"line":92,"column":33,"offset":9835}}},{"type":"strong","children":[{"type":"text","value":"Settings → Project knowledge & memory","position":{"start":{"line":92,"column":35,"offset":9837},"end":{"line":92,"column":72,"offset":9874}}}],"position":{"start":{"line":92,"column":33,"offset":9835},"end":{"line":92,"column":74,"offset":9876}}},{"type":"text","value":" is where you decide how much your gezels look up on their own; Balanced is a good place to start, and Lean is the better answer on a small local model. ","position":{"start":{"line":92,"column":74,"offset":9876},"end":{"line":92,"column":227,"offset":10029}}},{"type":"strong","children":[{"type":"text","value":"Settings → Knowledge","position":{"start":{"line":92,"column":229,"offset":10031},"end":{"line":92,"column":249,"offset":10051}}}],"position":{"start":{"line":92,"column":227,"offset":10029},"end":{"line":92,"column":251,"offset":10053}}},{"type":"text","value":" is empty until you install a catalog or build one, and it is the interesting half of this release.","position":{"start":{"line":92,"column":251,"offset":10053},"end":{"line":92,"column":350,"offset":10152}}}],"position":{"start":{"line":92,"column":1,"offset":9803},"end":{"line":92,"column":350,"offset":10152}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Three days after 1.26231, and this one is about knowing things.","startTime":0,"endTime":4.666666666666667,"audioSegment":0},{"text":"If you read only one thing: your gezels can now look things up — in your project, in your linked projects,","startTime":4.666666666666667,"endTime":9.333333333333334,"audioSegment":0},{"text":"and in reference libraries you install — and tell you where each answer came from.","startTime":9.333333333333334,"endTime":14,"audioSegment":0},{"text":"A knowledge catalog is a body of reference material packaged as a single file with a .gezk extension: an encyclopedia,","startTime":14,"endTime":17.705882352941178,"audioSegment":0},{"text":"a set of manuals, a standards library, your own notes.","startTime":17.705882352941178,"endTime":21.411764705882355,"audioSegment":0},{"text":"Install one and it becomes something your gezels — the named AI craftspeople you work with —","startTime":21.411764705882355,"endTime":25.11764705882353,"audioSegment":0},{"text":"can search and quote, with the source named every time.","startTime":25.11764705882353,"endTime":28.823529411764707,"audioSegment":0},{"text":"Install them from Settings → Knowledge, by file path,","startTime":28.823529411764707,"endTime":32.529411764705884,"audioSegment":0},{"text":"by https:// URL, or with a file picker.","startTime":32.529411764705884,"endTime":36.23529411764706,"audioSegment":0},{"text":"Once at least one catalog is registered, a Knowledge area appears in the sidebar: a catalog and topic list on the left,","startTime":36.23529411764706,"endTime":39.94117647058823,"audioSegment":0},{"text":"the documents in the middle, the article on the right, with its license, its origin, and a Copy citation button.","startTime":39.94117647058823,"endTime":43.64705882352941,"audioSegment":0},{"text":"There is also an Ask a gezel button on any article,","startTime":43.64705882352941,"endTime":47.35294117647059,"audioSegment":0},{"text":"so you can go from reading to asking without retyping what you were reading.","startTime":47.35294117647059,"endTime":51.05882352941177,"audioSegment":0},{"text":"Each project decides how much of this it sees.","startTime":51.05882352941177,"endTime":54.76470588235294,"audioSegment":0},{"text":"Project settings carry a knowledge row with three choices: all your catalogs,","startTime":54.76470588235294,"endTime":58.470588235294116,"audioSegment":0},{"text":"only the ones you pick, or none for this project.","startTime":58.470588235294116,"endTime":62.1764705882353,"audioSegment":0},{"text":"You can build your own.","startTime":62.1764705882353,"endTime":65.88235294117646,"audioSegment":0},{"text":"gezel knowledge init and gezel knowledge build turn a folder of Markdown into a catalog,","startTime":65.88235294117646,"endTime":69.58823529411765,"audioSegment":0},{"text":"entirely offline — no daemon, no account, nothing uploaded.","startTime":69.58823529411765,"endTime":73.29411764705883,"audioSegment":0},{"text":"The whole thing stays on your device, including the search.","startTime":73.29411764705883,"endTime":77,"audioSegment":0},{"text":"Until this release,","startTime":77,"endTime":80.54166666666667,"audioSegment":0},{"text":"a gezel knew what was in the conversation and what you had told it.","startTime":80.54166666666667,"endTime":84.08333333333333,"audioSegment":0},{"text":"If the answer was in a file three folders away,","startTime":84.08333333333333,"endTime":87.625,"audioSegment":0},{"text":"it had to guess that the file existed and go read it.","startTime":87.625,"endTime":91.16666666666667,"audioSegment":0},{"text":"Now there is a general search tool covering the active project's workspace and artifacts, the project's memory, the gezel's own memory,","startTime":91.16666666666667,"endTime":94.70833333333333,"audioSegment":0},{"text":"folder and architecture summaries, and your shared documents library — ranked together, with a citation on every result.","startTime":94.70833333333333,"endTime":98.25,"audioSegment":0},{"text":"Alongside it, gezel can put a small block of relevant material onto a turn before the model answers,","startTime":98.25,"endTime":101.79166666666666,"audioSegment":0},{"text":"so it starts with the right context instead of hunting for it.","startTime":101.79166666666666,"endTime":105.33333333333333,"audioSegment":0},{"text":"Settings → Project knowledge & memory controls how much:","startTime":105.33333333333333,"endTime":108.875,"audioSegment":0},{"text":"Off — nothing is added.","startTime":108.875,"endTime":112.41666666666666,"audioSegment":0},{"text":"The gezel can still call search itself.","startTime":112.41666666666666,"endTime":115.95833333333333,"audioSegment":0},{"text":"Lean — paths and short hints, about 320 tokens.","startTime":115.95833333333333,"endTime":119.5,"audioSegment":0},{"text":"Balanced — a diversified set of excerpts, about 1,000 tokens.","startTime":119.5,"endTime":123.04166666666666,"audioSegment":0},{"text":"This is the default.","startTime":123.04166666666666,"endTime":126.58333333333333,"audioSegment":0},{"text":"Deep — broader excerpts including project and area summaries, about 2,800 tokens.","startTime":126.58333333333333,"endTime":130.125,"audioSegment":0},{"text":"There is an optional token cap if you want a specific number, and gezel applies a second ceiling based on your model's context window,","startTime":130.125,"endTime":133.66666666666666,"audioSegment":0},{"text":"so a small local model is never crowded out of its own answer.","startTime":133.66666666666666,"endTime":137.20833333333331,"audioSegment":0},{"text":"That is the reason the modes are worth knowing about: on a memory-constrained model,","startTime":137.20833333333331,"endTime":140.75,"audioSegment":0},{"text":"Lean genuinely answers better than Deep.","startTime":140.75,"endTime":144.29166666666666,"audioSegment":0},{"text":"Two habits of the feature are worth stating plainly.","startTime":144.29166666666666,"endTime":147.83333333333331,"audioSegment":0},{"text":"Retrieved text is labeled untrusted evidence in the prompt —","startTime":147.83333333333331,"endTime":151.375,"audioSegment":0},{"text":"it is material to consider, and it cannot instruct the gezel or override you.","startTime":151.375,"endTime":154.91666666666666,"audioSegment":0},{"text":"And model-facing search is bound to the project you are in: a gezel cannot reach into your other projects,","startTime":154.91666666666666,"endTime":158.45833333333331,"audioSegment":0},{"text":"other gezels' memories, or your conversation history to answer a question.","startTime":158.45833333333331,"endTime":162,"audioSegment":0},{"text":"Sometimes a project genuinely needs a neighbour's material.","startTime":162,"endTime":165.375,"audioSegment":0},{"text":"Project settings now have a Linked projects list — pick up to 32.","startTime":165.375,"endTime":168.75,"audioSegment":0},{"text":"A link is one-way and it does not chain.","startTime":168.75,"endTime":172.125,"audioSegment":0},{"text":"Linking A to B lets work in A search and read B; it does not give B anything,","startTime":172.125,"endTime":175.5,"audioSegment":0},{"text":"and it does not reach whatever B is linked to.","startTime":175.5,"endTime":178.875,"audioSegment":0},{"text":"Linked files show up under a ../project-id/...","startTime":178.875,"endTime":182.25,"audioSegment":0},{"text":"path so it is always obvious which side a result came from,","startTime":182.25,"endTime":185.625,"audioSegment":0},{"text":"and the whole arrangement is visible on the one screen where you granted it.","startTime":185.625,"endTime":189,"audioSegment":0},{"text":"Turn on Recognize people in photos in Settings and gezel looks for faces in the photos it has indexed and groups the same person across them.","startTime":189,"endTime":193,"audioSegment":0},{"text":"Name someone once and you can find them anywhere.","startTime":193,"endTime":197,"audioSegment":0},{"text":"A People panel appears in each project's overview.","startTime":197,"endTime":201,"audioSegment":0},{"text":"This runs entirely on your machine — the photos and the face data never leave it —","startTime":201,"endTime":205,"audioSegment":0},{"text":"and turning it on downloads the face models once, about 260 MB.","startTime":205,"endTime":209,"audioSegment":0},{"text":"It is off until you ask, and there is a Turn off and erase face data button that deletes every stored face signature,","startTime":209,"endTime":213,"audioSegment":0},{"text":"person, and name across every project.","startTime":213,"endTime":217,"audioSegment":0},{"text":"Your photos are not touched by that;","startTime":217,"endTime":221,"audioSegment":0},{"text":"only what gezel worked out about them. Separately,","startTime":221,"endTime":225,"audioSegment":0},{"text":"the file browser can now show visually similar images in a project from any image you are previewing.","startTime":225,"endTime":229,"audioSegment":0},{"text":"Small change, and it removes a whole class of quiet damage.","startTime":229,"endTime":233,"audioSegment":0},{"text":"Work a gezel does for you lands in the project's artifacts drawer.","startTime":233,"endTime":237,"audioSegment":0},{"text":"Until now, two runs of the same procedure — a craftbook, gezel's word for a repeatable recipe —","startTime":237,"endTime":241,"audioSegment":0},{"text":"wrote to the same filenames and silently overwrote each other's working notes.","startTime":241,"endTime":245,"audioSegment":0},{"text":"Two tasks running at once could do it to each other.","startTime":245,"endTime":249,"audioSegment":0},{"text":"Every task now gets artifacts/tasks/<number>/ as its own working folder,","startTime":249,"endTime":253,"audioSegment":0},{"text":"created when the task is created, and shared by the shards of a task that fans out into parallel work.","startTime":253,"endTime":257,"audioSegment":0},{"text":"Nothing to configure; a task's material simply stays a task's material.","startTime":257,"endTime":261,"audioSegment":0},{"text":"Opening gezel for the first time used to mean an empty composer while a multi-gigabyte model downloaded in the background.","startTime":261,"endTime":265.7142857142857,"audioSegment":0},{"text":"The meester — the guildmaster gezel who is your front door — now greets you with a short introduction,","startTime":265.7142857142857,"endTime":270.42857142857144,"audioSegment":0},{"text":"an explanation of their role, and a few openers you can press instead of thinking of an opening line.","startTime":270.42857142857144,"endTime":275.14285714285717,"audioSegment":0},{"text":"It is a written introduction, clearly presented as one,","startTime":275.14285714285717,"endTime":279.85714285714283,"audioSegment":0},{"text":"not words put in the meester's mouth.","startTime":279.85714285714283,"endTime":284.57142857142856,"audioSegment":0},{"text":"And if you send a message while the model is still arriving, gezel now says \"43% downloaded —","startTime":284.57142857142856,"endTime":289.2857142857143,"audioSegment":0},{"text":"hang tight\" instead of telling you to download a model from a list that is not on screen.","startTime":289.2857142857143,"endTime":294,"audioSegment":0},{"text":"Chat reads like people talking.","startTime":294,"endTime":297.39285714285717,"audioSegment":0},{"text":"Hand-offs between gezels now render as a short line — who passed what to whom, and about which task —","startTime":297.39285714285717,"endTime":300.7857142857143,"audioSegment":0},{"text":"instead of the paragraph of tool-calling instructions the model was actually sent.","startTime":300.7857142857143,"endTime":304.17857142857144,"audioSegment":0},{"text":"Thread previews are readable.","startTime":304.17857142857144,"endTime":307.57142857142856,"audioSegment":0},{"text":"The one-line summary under a thread no longer shows raw tool-call markup or hidden reasoning;","startTime":307.57142857142856,"endTime":310.9642857142857,"audioSegment":0},{"text":"it says what happened in words.","startTime":310.9642857142857,"endTime":314.35714285714283,"audioSegment":0},{"text":"Tool activity says what it touched,","startTime":314.35714285714283,"endTime":317.75,"audioSegment":0},{"text":"and file paths in it are clickable straight into References.","startTime":317.75,"endTime":321.14285714285717,"audioSegment":0},{"text":"Word and LibreOffice lock files are hidden.","startTime":321.14285714285717,"endTime":324.5357142857143,"audioSegment":0},{"text":"The stray ~$report.docx files that appear while a document is open no longer clutter the file browser.","startTime":324.5357142857143,"endTime":327.92857142857144,"audioSegment":0},{"text":"File references resolve properly.","startTime":327.92857142857144,"endTime":331.32142857142856,"audioSegment":0},{"text":"A reference to a specific path no longer falls back to matching some other file with the same name at the root,","startTime":331.32142857142856,"endTime":334.7142857142857,"audioSegment":0},{"text":"and old mis-resolved links in existing threads are repaired.","startTime":334.7142857142857,"endTime":338.10714285714283,"audioSegment":0},{"text":"/connect and /disconnect in the CLI hook VS Code, OpenCode, pi, and Codex up to your local models —","startTime":338.10714285714283,"endTime":341.5,"audioSegment":0},{"text":"the same thing Settings → Connected Apps does, from the terminal.","startTime":341.5,"endTime":344.8928571428571,"audioSegment":0},{"text":"Dates and times are consistent across cards, threads, and panels,","startTime":344.8928571428571,"endTime":348.2857142857143,"audioSegment":0},{"text":"and the local-engine setting says \"This Mac\" or \"This PC\" rather than a generic device label.","startTime":348.2857142857143,"endTime":351.67857142857144,"audioSegment":0},{"text":"Tasks can be updated in bulk —","startTime":351.67857142857144,"endTime":355.07142857142856,"audioSegment":0},{"text":"select several and set their status at once.","startTime":355.07142857142856,"endTime":358.4642857142857,"audioSegment":0},{"text":"Local models re-answer faster.","startTime":358.4642857142857,"endTime":361.8571428571429,"audioSegment":0},{"text":"The llama.cpp cache-reuse restriction that cost multi-slot setups their prompt cache is gone,","startTime":361.8571428571429,"endTime":365.25,"audioSegment":0},{"text":"and an MLX bug that made reasoning stay on for turns that had asked for it to be off — inflating both time and tokens — is fixed.","startTime":365.25,"endTime":368.6428571428571,"audioSegment":0},{"text":"Windows app updates are steadier.","startTime":368.6428571428571,"endTime":372.0357142857143,"audioSegment":0},{"text":"Staged runtime cleanup retries rather than failing when a virus scanner or indexer holds a file open,","startTime":372.0357142857143,"endTime":375.42857142857144,"audioSegment":0},{"text":"and installer-staged service trees are now verified and reused on Windows the way they already were elsewhere.","startTime":375.42857142857144,"endTime":378.82142857142856,"audioSegment":0},{"text":"The Handboek uses the warm light reading surface when your theme is light,","startTime":378.82142857142856,"endTime":382.2142857142857,"audioSegment":0},{"text":"in both document and video modes.","startTime":382.2142857142857,"endTime":385.6071428571429,"audioSegment":0},{"text":"Refreshed catalog content package (gilde 0.1.39).","startTime":385.6071428571429,"endTime":389,"audioSegment":0},{"text":".gezk, the knowledge catalog format, is frozen as v1 and implemented in a new @bendyline/gezel-knowledge package: a deterministic compiler,","startTime":389,"endTime":391.9166666666667,"audioSegment":0},{"text":"verified archive reading, Ed25519 manifest signing, a Markdown adapter, and a read-only two-stage bit384+int8 retrieval handle.","startTime":391.9166666666667,"endTime":394.8333333333333,"audioSegment":0},{"text":"It depends only on core.","startTime":394.8333333333333,"endTime":397.75,"audioSegment":0},{"text":"New endpoints: /api/knowledge/* for install, enable, quarantine, browse and search; /api/projects/:id/tools/find-similar-images;","startTime":397.75,"endTime":400.6666666666667,"audioSegment":0},{"text":"a people surface for face grouping; and machine-broker knowledge asset endpoints under /v1/remote/manage/knowledge/*.","startTime":400.6666666666667,"endTime":403.5833333333333,"audioSegment":0},{"text":"All with client methods.","startTime":403.5833333333333,"endTime":406.5,"audioSegment":0},{"text":"AI Apps — a project type, crew, craftbooks, scripts, data,","startTime":406.5,"endTime":409.4166666666667,"audioSegment":0},{"text":"and an optional dashboard composed into one reusable experience — have a written guide: Building AI Apps inside Gezel.","startTime":409.4166666666667,"endTime":412.3333333333333,"audioSegment":0},{"text":"They package as .gezapp files,","startTime":412.3333333333333,"endTime":415.25,"audioSegment":0},{"text":"and a gezel can export or import one for you.","startTime":415.25,"endTime":418.1666666666667,"audioSegment":0},{"text":"Retrieval is auditable.","startTime":418.1666666666667,"endTime":421.0833333333333,"audioSegment":0},{"text":"Every injected context block records the query hash, policy, estimated tokens,","startTime":421.0833333333333,"endTime":424,"audioSegment":0},{"text":"result scores, provenance, and citations as a history event.","startTime":424,"endTime":426.9166666666667,"audioSegment":0},{"text":"Raw queries and retrieved text are deliberately not copied into telemetry.","startTime":426.9166666666667,"endTime":429.8333333333333,"audioSegment":0},{"text":"search_code and search_documents are now compatibility aliases for the unified search tool.","startTime":429.8333333333333,"endTime":432.75,"audioSegment":0},{"text":"grep_files remains the right tool for exact strings and regular expressions.","startTime":432.75,"endTime":435.6666666666667,"audioSegment":0},{"text":"Craftbook steps can scope retrieval, including to knowledge alone,","startTime":435.6666666666667,"endTime":438.5833333333333,"audioSegment":0},{"text":"and address their task folder through the reserved {{task.dir}} token.","startTime":438.5833333333333,"endTime":441.5,"audioSegment":0},{"text":"Embedding instructions are model-aware.","startTime":441.5,"endTime":444.4166666666667,"audioSegment":0},{"text":"The e5 family gets its required query: and passage: prefixes;","startTime":444.4166666666667,"endTime":447.3333333333333,"audioSegment":0},{"text":"other families are unchanged.","startTime":447.3333333333333,"endTime":450.25,"audioSegment":0},{"text":"There is a new cross-lingual calibration benchmark with a first Dutch/English baseline.","startTime":450.25,"endTime":453.16666666666663,"audioSegment":0},{"text":"New architecture notes: per-task artifact folders, the .gezk format,","startTime":453.16666666666663,"endTime":456.0833333333333,"audioSegment":0},{"text":"knowledge catalogs, project linking, and project retrieval.","startTime":456.0833333333333,"endTime":459,"audioSegment":0},{"text":"Two settings are worth a visit.","startTime":459,"endTime":463,"audioSegment":0},{"text":"Settings → Project knowledge & memory is where you decide how much your gezels look up on their own;","startTime":463,"endTime":467,"audioSegment":0},{"text":"Balanced is a good place to start, and Lean is the better answer on a small local model.","startTime":467,"endTime":471,"audioSegment":0},{"text":"Settings → Knowledge is empty until you install a catalog or build one,","startTime":471,"endTime":475,"audioSegment":0},{"text":"and it is the interesting half of this release.","startTime":475,"endTime":479,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26234 — 22 August 2026","subtitle":"Three days after 1.26231, and this one is about knowing things.","ambientMotion":"zoomIn"}}</script>
