<script type="application/json" id="squisq-doc" data-squisq-doc="1">{"articleId":"whats-new/1.26274","duration":728,"blocks":[{"id":"126274-1-october-2026","startTime":0,"duration":33,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":1,"children":[{"type":"text","value":"1.26274 — 1 October 2026","position":{"start":{"line":1,"column":3,"offset":2},"end":{"line":1,"column":27,"offset":26}}}],"position":{"start":{"line":1,"column":1,"offset":0},"end":{"line":1,"column":27,"offset":26}}},"title":"1.26274 — 1 October 2026","contents":[{"type":"paragraph","children":[{"type":"text","value":"This release is about steadiness. Most of it fixes the ways a task could stall or stop for good partway through. When the work does finish, you get the file itself instead of a path buried in a list. Narration reads the whole reply and no longer holds up the rest of the app. Chats pick up far less unrelated reference material, and there is a round of safety fixes.","position":{"start":{"line":3,"column":1,"offset":28},"end":{"line":3,"column":367,"offset":394}}}],"position":{"start":{"line":3,"column":1,"offset":28},"end":{"line":3,"column":367,"offset":394}}},{"type":"paragraph","children":[{"type":"text","value":"If you read only one thing: craftbook tasks running on a model on your own computer get stuck much less often, and when one finishes, its closing message ends with a card for the file it made and an ","position":{"start":{"line":5,"column":1,"offset":396},"end":{"line":5,"column":200,"offset":595}}},{"type":"strong","children":[{"type":"text","value":"Open","position":{"start":{"line":5,"column":202,"offset":597},"end":{"line":5,"column":206,"offset":601}}}],"position":{"start":{"line":5,"column":200,"offset":595},"end":{"line":5,"column":208,"offset":603}}},{"type":"text","value":" key.","position":{"start":{"line":5,"column":208,"offset":603},"end":{"line":5,"column":213,"offset":608}}}],"position":{"start":{"line":5,"column":1,"offset":396},"end":{"line":5,"column":213,"offset":608}}}],"children":[{"id":"tasks-that-used-to-stall-now-finish","startTime":33,"duration":112,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Tasks that used to stall now finish","position":{"start":{"line":7,"column":4,"offset":613},"end":{"line":7,"column":39,"offset":648}}}],"position":{"start":{"line":7,"column":1,"offset":610},"end":{"line":7,"column":39,"offset":648}}},"title":"Tasks that used to stall now finish","contents":[{"type":"paragraph","children":[{"type":"text","value":"Craftbooks run as tasks, one step at a time. Last release made those tasks easier to start. This one fixes many of the ways they could stall, each found in real runs:","position":{"start":{"line":9,"column":1,"offset":650},"end":{"line":9,"column":167,"offset":816}}}],"position":{"start":{"line":9,"column":1,"offset":650},"end":{"line":9,"column":167,"offset":816}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Polishing a finished file.","position":{"start":{"line":11,"column":5,"offset":822},"end":{"line":11,"column":31,"offset":848}}}],"position":{"start":{"line":11,"column":3,"offset":820},"end":{"line":11,"column":33,"offset":850}}},{"type":"text","value":" On an on-device model (llama.cpp, MLX or Ollama), a step whose file already passed its check could keep editing it for 12 to 20 minutes in a single turn, risking breaking it. The gezel is now told the file is done and to move on. If it keeps going, the turn ends and the step's check takes over.","position":{"start":{"line":11,"column":33,"offset":850},"end":{"line":11,"column":329,"offset":1146}}}],"position":{"start":{"line":11,"column":3,"offset":820},"end":{"line":11,"column":329,"offset":1146}}}],"position":{"start":{"line":11,"column":1,"offset":818},"end":{"line":11,"column":329,"offset":1146}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A follow-up message that took away the step's tools.","position":{"start":{"line":12,"column":5,"offset":1151},"end":{"line":12,"column":57,"offset":1203}}}],"position":{"start":{"line":12,"column":3,"offset":1149},"end":{"line":12,"column":59,"offset":1205}}},{"type":"text","value":" A message such as \"save it to the drafts folder\" could narrow a step's tools so far that it lost its only way to save its work. The gezel then paused the task, and it could not resume the task itself. A step now always keeps its saving tool and every tool its own instructions name.","position":{"start":{"line":12,"column":59,"offset":1205},"end":{"line":12,"column":342,"offset":1488}}}],"position":{"start":{"line":12,"column":3,"offset":1149},"end":{"line":12,"column":342,"offset":1488}}}],"position":{"start":{"line":12,"column":1,"offset":1147},"end":{"line":12,"column":342,"offset":1488}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A save that was too long.","position":{"start":{"line":13,"column":5,"offset":1493},"end":{"line":13,"column":30,"offset":1518}}}],"position":{"start":{"line":13,"column":3,"offset":1491},"end":{"line":13,"column":32,"offset":1520}}},{"type":"text","value":" When a local model's save ran past the most it may write in one reply, it was told to pause the task, which had the same dead end. It is now told to write a shorter version that keeps every required section.","position":{"start":{"line":13,"column":32,"offset":1520},"end":{"line":13,"column":240,"offset":1728}}}],"position":{"start":{"line":13,"column":3,"offset":1491},"end":{"line":13,"column":240,"offset":1728}}}],"position":{"start":{"line":13,"column":1,"offset":1489},"end":{"line":13,"column":240,"offset":1728}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Several edits mistaken for a loop.","position":{"start":{"line":14,"column":5,"offset":1733},"end":{"line":14,"column":39,"offset":1767}}}],"position":{"start":{"line":14,"column":3,"offset":1731},"end":{"line":14,"column":41,"offset":1769}}},{"type":"text","value":" Seven different heading fixes to one file were cut off at five as \"not making progress\", leaving slides unfixed. Different successful edits now count as progress; only failed edits are counted.","position":{"start":{"line":14,"column":41,"offset":1769},"end":{"line":14,"column":235,"offset":1963}}}],"position":{"start":{"line":14,"column":3,"offset":1731},"end":{"line":14,"column":235,"offset":1963}}}],"position":{"start":{"line":14,"column":1,"offset":1729},"end":{"line":14,"column":235,"offset":1963}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Reviews rejected for made-up sources that were not sources.","position":{"start":{"line":15,"column":5,"offset":1968},"end":{"line":15,"column":64,"offset":2027}}}],"position":{"start":{"line":15,"column":3,"offset":1966},"end":{"line":15,"column":66,"offset":2029}}},{"type":"text","value":" A reviewer who described the citation format, writing something like ","position":{"start":{"line":15,"column":66,"offset":2029},"end":{"line":15,"column":136,"offset":2099}}},{"type":"inlineCode","value":"<path/URL>","position":{"start":{"line":15,"column":136,"offset":2099},"end":{"line":15,"column":148,"offset":2111}}},{"type":"text","value":" or \"n/a\", had its review rejected three times and the task paused. Placeholders like those are no longer read as citations.","position":{"start":{"line":15,"column":148,"offset":2111},"end":{"line":15,"column":272,"offset":2235}}}],"position":{"start":{"line":15,"column":3,"offset":1966},"end":{"line":15,"column":272,"offset":2235}}}],"position":{"start":{"line":15,"column":1,"offset":1964},"end":{"line":15,"column":272,"offset":2235}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"An old round of a looping recipe finishing the new one.","position":{"start":{"line":16,"column":5,"offset":2240},"end":{"line":16,"column":60,"offset":2295}}}],"position":{"start":{"line":16,"column":3,"offset":2238},"end":{"line":16,"column":62,"offset":2297}}},{"type":"text","value":" In a recipe that goes review, revise, review, a chat left over from an earlier round could mark the current round done, against an unchanged file. Each round now belongs to its own session.","position":{"start":{"line":16,"column":62,"offset":2297},"end":{"line":16,"column":252,"offset":2487}}}],"position":{"start":{"line":16,"column":3,"offset":2238},"end":{"line":16,"column":252,"offset":2487}}}],"position":{"start":{"line":16,"column":1,"offset":2236},"end":{"line":16,"column":252,"offset":2487}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"DeepSeek V4 thinking through the whole turn.","position":{"start":{"line":17,"column":5,"offset":2492},"end":{"line":17,"column":49,"offset":2536}}}],"position":{"start":{"line":17,"column":3,"offset":2490},"end":{"line":17,"column":51,"offset":2538}}},{"type":"text","value":" On the ds4 engine, it could spend about 18 minutes thinking and write nothing. Gezel now stops the thinking at its budget, keeps what it thought on screen, and retries that reply with thinking off.","position":{"start":{"line":17,"column":51,"offset":2538},"end":{"line":17,"column":249,"offset":2736}}}],"position":{"start":{"line":17,"column":3,"offset":2490},"end":{"line":17,"column":249,"offset":2736}}}],"position":{"start":{"line":17,"column":1,"offset":2488},"end":{"line":17,"column":249,"offset":2736}}}],"position":{"start":{"line":11,"column":1,"offset":818},"end":{"line":17,"column":249,"offset":2736}}}]},{"id":"finished-work-comes-back-as-a-file-you-can-open","startTime":145,"duration":62,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Finished work comes back as a file you can open","position":{"start":{"line":19,"column":4,"offset":2741},"end":{"line":19,"column":51,"offset":2788}}}],"position":{"start":{"line":19,"column":1,"offset":2738},"end":{"line":19,"column":51,"offset":2788}}},"title":"Finished work comes back as a file you can open","contents":[{"type":"paragraph","children":[{"type":"text","value":"When a task made a deck or a document, its closing message used to list the deck as one unlinked path among the working files, sometimes under \"…and 3 more\", and the card in Updates previewed the outline rather than the result.","position":{"start":{"line":21,"column":1,"offset":2790},"end":{"line":21,"column":228,"offset":3017}}}],"position":{"start":{"line":21,"column":1,"offset":2790},"end":{"line":21,"column":228,"offset":3017}}},{"type":"paragraph","children":[{"type":"text","value":"Now the closing message starts with \"Here's your PowerPoint deck\" (or whatever it made) and ends with a card for that file: its type, its name, whether it is in the project folder or the artifacts drawer, and its size. ","position":{"start":{"line":23,"column":1,"offset":3019},"end":{"line":23,"column":220,"offset":3238}}},{"type":"strong","children":[{"type":"text","value":"Open","position":{"start":{"line":23,"column":222,"offset":3240},"end":{"line":23,"column":226,"offset":3244}}}],"position":{"start":{"line":23,"column":220,"offset":3238},"end":{"line":23,"column":228,"offset":3246}}},{"type":"text","value":" opens it, ","position":{"start":{"line":23,"column":228,"offset":3246},"end":{"line":23,"column":239,"offset":3257}}},{"type":"strong","children":[{"type":"text","value":"Show in folder","position":{"start":{"line":23,"column":241,"offset":3259},"end":{"line":23,"column":255,"offset":3273}}}],"position":{"start":{"line":23,"column":239,"offset":3257},"end":{"line":23,"column":257,"offset":3275}}},{"type":"text","value":" shows it where it is saved, and ","position":{"start":{"line":23,"column":257,"offset":3275},"end":{"line":23,"column":290,"offset":3308}}},{"type":"strong","children":[{"type":"text","value":"Save a copy…","position":{"start":{"line":23,"column":292,"offset":3310},"end":{"line":23,"column":304,"offset":3322}}}],"position":{"start":{"line":23,"column":290,"offset":3308},"end":{"line":23,"column":306,"offset":3324}}},{"type":"text","value":" saves it wherever you like. The same card sits under the step tracker on the task's page and in the Task card in the chat rail, where it appears with a dashed border, marked \"in progress\", as soon as the file exists. The card only names a file that is really there, and never a working paper such as an outline.","position":{"start":{"line":23,"column":306,"offset":3324},"end":{"line":23,"column":618,"offset":3636}}}],"position":{"start":{"line":23,"column":1,"offset":3019},"end":{"line":23,"column":618,"offset":3636}}},{"type":"paragraph","children":[{"type":"text","value":"The Task card in the chat rail also follows the run as it goes, instead of staying as it was when you opened it. File names in its notes are links, and a reply that names a file the gezel wrote moments earlier now links to it too.","position":{"start":{"line":25,"column":1,"offset":3638},"end":{"line":25,"column":231,"offset":3868}}}],"position":{"start":{"line":25,"column":1,"offset":3638},"end":{"line":25,"column":231,"offset":3868}}}]},{"id":"narration-reads-the-whole-reply-as-it-arrives","startTime":207,"duration":49,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Narration reads the whole reply, as it arrives","position":{"start":{"line":27,"column":4,"offset":3873},"end":{"line":27,"column":50,"offset":3919}}}],"position":{"start":{"line":27,"column":1,"offset":3870},"end":{"line":27,"column":50,"offset":3919}}},"title":"Narration reads the whole reply, as it arrives","contents":[{"type":"paragraph","children":[{"type":"text","value":"Narration, the setting that reads gezels' replies aloud, used to stop after roughly the first 280 characters. It now reads the whole reply.","position":{"start":{"line":29,"column":1,"offset":3921},"end":{"line":29,"column":140,"offset":4060}}}],"position":{"start":{"line":29,"column":1,"offset":3921},"end":{"line":29,"column":140,"offset":4060}}},{"type":"paragraph","children":[{"type":"text","value":"With ","position":{"start":{"line":31,"column":1,"offset":4062},"end":{"line":31,"column":6,"offset":4067}}},{"type":"strong","children":[{"type":"text","value":"Settings → Audio → Include progress updates","position":{"start":{"line":31,"column":8,"offset":4069},"end":{"line":31,"column":51,"offset":4112}}}],"position":{"start":{"line":31,"column":6,"offset":4067},"end":{"line":31,"column":53,"offset":4114}}},{"type":"text","value":" on, the voice starts at the first finished sentence and keeps pace while the reply is still being written. Without it, the reply is read once it is finished, but playback starts as soon as the first sentence is ready.","position":{"start":{"line":31,"column":53,"offset":4114},"end":{"line":31,"column":271,"offset":4332}}}],"position":{"start":{"line":31,"column":1,"offset":4062},"end":{"line":31,"column":271,"offset":4332}}},{"type":"paragraph","children":[{"type":"text","value":"While a gezel is speaking, a ","position":{"start":{"line":33,"column":1,"offset":4334},"end":{"line":33,"column":30,"offset":4363}}},{"type":"strong","children":[{"type":"text","value":"Stop narration","position":{"start":{"line":33,"column":32,"offset":4365},"end":{"line":33,"column":46,"offset":4379}}}],"position":{"start":{"line":33,"column":30,"offset":4363},"end":{"line":33,"column":48,"offset":4381}}},{"type":"text","value":" key appears in the title bar. It stops the rest of that reply, and the next one is read as usual. Stopping a chat reply now stops its voice too.","position":{"start":{"line":33,"column":48,"offset":4381},"end":{"line":33,"column":193,"offset":4526}}}],"position":{"start":{"line":33,"column":1,"offset":4334},"end":{"line":33,"column":193,"offset":4526}}},{"type":"paragraph","children":[{"type":"text","value":"Two fixes you may have noticed without knowing why. Speech now runs on its own thread, so reading a reply aloud no longer holds up the rest of gezel for a moment on every sentence. And narration no longer saves a sound file into the project's artifacts drawer for every sentence it reads.","position":{"start":{"line":35,"column":1,"offset":4528},"end":{"line":35,"column":289,"offset":4816}}}],"position":{"start":{"line":35,"column":1,"offset":4528},"end":{"line":35,"column":289,"offset":4816}}}]},{"id":"less-unrelated-reference-material-in-your-chats","startTime":256,"duration":65,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Less unrelated reference material in your chats","position":{"start":{"line":37,"column":4,"offset":4821},"end":{"line":37,"column":51,"offset":4868}}}],"position":{"start":{"line":37,"column":1,"offset":4818},"end":{"line":37,"column":51,"offset":4868}}},"title":"Less unrelated reference material in your chats","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel adds passages from Help and from any knowledge catalogs you installed to a conversation when they look relevant. Too often they did not need to be relevant: almost any message picked something up, so \"What is 17 times 23?\" came with an old release's notes.","position":{"start":{"line":39,"column":1,"offset":4870},"end":{"line":39,"column":263,"offset":5132}}}],"position":{"start":{"line":39,"column":1,"offset":4870},"end":{"line":39,"column":263,"offset":5132}}},{"type":"paragraph","children":[{"type":"text","value":"Each catalog now has a cut-off measured against labeled questions, and a passage matched only on a shared word is no longer added unless the relevance check approved it. In our tests, off-topic messages that picked up a passage went from 25 out of 25 to 2 out of 25, and on-topic answers were unchanged.","position":{"start":{"line":41,"column":1,"offset":5134},"end":{"line":41,"column":304,"offset":5437}}}],"position":{"start":{"line":41,"column":1,"offset":5134},"end":{"line":41,"column":304,"offset":5437}}},{"type":"paragraph","children":[{"type":"text","value":"The ","position":{"start":{"line":43,"column":1,"offset":5439},"end":{"line":43,"column":5,"offset":5443}}},{"type":"strong","children":[{"type":"text","value":"relevance check","position":{"start":{"line":43,"column":7,"offset":5445},"end":{"line":43,"column":22,"offset":5460}}}],"position":{"start":{"line":43,"column":5,"offset":5443},"end":{"line":43,"column":24,"offset":5462}}},{"type":"text","value":" is a small model on your device, about 24 MB, that reads each passage before a gezel uses it. It is now on for new installs, with a checkbox in first-run setup to turn it off. If you already use gezel, your setting stays as it was. It is under ","position":{"start":{"line":43,"column":24,"offset":5462},"end":{"line":43,"column":269,"offset":5707}}},{"type":"strong","children":[{"type":"text","value":"Settings → Artificial Intelligence → Check that indexed context is on topic before using it","position":{"start":{"line":43,"column":271,"offset":5709},"end":{"line":43,"column":362,"offset":5800}}}],"position":{"start":{"line":43,"column":269,"offset":5707},"end":{"line":43,"column":364,"offset":5802}}},{"type":"text","value":".","position":{"start":{"line":43,"column":364,"offset":5802},"end":{"line":43,"column":365,"offset":5803}}}],"position":{"start":{"line":43,"column":1,"offset":5439},"end":{"line":43,"column":365,"offset":5803}}},{"type":"paragraph","chi alue":"Dependencies: Electron 43.7.7, ","position":{"start":{"line":101,"column":3,"offset":14445},"end":{"line":101,"column":34,"offset":14476}}},{"type":"inlineCode","value":"fast-uri","position":{"start":{"line":101,"column":34,"offset":14476},"end":{"line":101,"column":44,"offset":14486}}},{"type":"text","value":" 3.1.8.","position":{"start":{"line":101,"column":44,"offset":14486},"end":{"line":101,"column":51,"offset":14493}}}],"position":{"start":{"line":101,"column":3,"offset":14445},"end":{"line":101,"column":51,"offset":14493}}}],"position":{"start":{"line":101,"column":1,"offset":14443},"end":{"line":101,"column":51,"offset":14493}}}],"position":{"start":{"line":92,"column":1,"offset":12498},"end":{"line":101,"column":51,"offset":14493}}}],"autoTemplate":true,"templateData":{"items":["Task outputs. GET /api/projects/:id/tasks/:num/outputs and client.getTaskOutputs() return a task's deliverable and its other files; the taskOutputs runtime capability says whether a host serves it. listTaskNotes(..., { withFileReferences }) (?refs=1) returns notes with their file references resolved.","Audio synthesis takes persist: false to skip writing the utterance to the artifacts drawer, and artifactPath in the response is now optional. The SSE stream always delivers at least one chunk.","CreateProjectRequest.lead takes 'auto' | 'none'; the Meester's kickoff paths pass 'none'.","Search results carry similarity, and so does the retrieval trace. Per-catalog vector floors can be overridden with GEZEL_KNOWLEDGE_VECTOR_FLOORS, and the knowledge relevance bar with GEZEL_RELEVANCE_KNOWLEDGE_KEEP. Measure a new catalog or embedder with pnpm --filter @bendyline/gezel-evals run knowledge-calibration.","Knowledge install routes no longer return 403 network-blocked. They still refuse session tokens.","@bendyline/gezel-knowledge's compiler accepts shardFill: 'semantic', which raised routed recall@8 from 82.6% to 85.7% at six shards in our measurements.","@bendyline/gezel-client exports apiErrorMessage. The queue-status types now live in @bendyline/gezel/queue-status and are still re-exported from the client.","The local-model turn loop, the model-profile behaviors and the prompt builder moved into @bendyline/gezel/local-loop. The service re-exports them from their old paths.","gezeld answers --help and --version (which used to start a full daemon) and warns about unknown arguments. GEZEL_DAEMON_LOG_FILE=1 makes a daemon write the rolling service log, which the client sets for daemons it starts detached. GEZEL_WASM_BASELINE=1 starts a spawned daemon with --liftoff-only --no-wasm-tier-up, a workaround for V8 out-of-memory crashes.","Dependencies: Electron 43.7.7, fast-uri 3.1.8."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":704,"duration":24,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":103,"column":4,"offset":14498},"end":{"line":103,"column":37,"offset":14531}}}],"position":{"start":{"line":103,"column":1,"offset":14495},"end":{"line":103,"column":37,"offset":14531}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Run a craftbook that stalled for you last week, and open what it hands back from the card at the end of the thread. If you like replies read aloud, turn on ","position":{"start":{"line":105,"column":1,"offset":14533},"end":{"line":105,"column":157,"offset":14689}}},{"type":"strong","children":[{"type":"text","value":"Settings → Audio → Include progress updates","position":{"start":{"line":105,"column":159,"offset":14691},"end":{"line":105,"column":202,"offset":14734}}}],"position":{"start":{"line":105,"column":157,"offset":14689},"end":{"line":105,"column":204,"offset":14736}}},{"type":"text","value":" to hear them as they arrive. If you installed gezel before today, look at ","position":{"start":{"line":105,"column":204,"offset":14736},"end":{"line":105,"column":279,"offset":14811}}},{"type":"strong","children":[{"type":"text","value":"Settings → Artificial Intelligence → Check that indexed context is on topic before using it","position":{"start":{"line":105,"column":281,"offset":14813},"end":{"line":105,"column":372,"offset":14904}}}],"position":{"start":{"line":105,"column":279,"offset":14811},"end":{"line":105,"column":374,"offset":14906}}},{"type":"text","value":"; it costs about 24 MB and keeps unrelated articles out of your conversations.","position":{"start":{"line":105,"column":374,"offset":14906},"end":{"line":105,"column":452,"offset":14984}}}],"position":{"start":{"line":105,"column":1,"offset":14533},"end":{"line":105,"column":452,"offset":14984}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"This release is about steadiness.","startTime":0,"endTime":3.6666666666666665,"audioSegment":0},{"text":"Most of it fixes the ways a task could stall or stop for good partway through.","startTime":3.6666666666666665,"endTime":7.333333333333333,"audioSegment":0},{"text":"When the work does finish,","startTime":7.333333333333333,"endTime":11,"audioSegment":0},{"text":"you get the file itself instead of a path buried in a list.","startTime":11,"endTime":14.666666666666666,"audioSegment":0},{"text":"Narration reads the whole reply and no longer holds up the rest of the app.","startTime":14.666666666666666,"endTime":18.333333333333332,"audioSegment":0},{"text":"Chats pick up far less unrelated reference material,","startTime":18.333333333333332,"endTime":22,"audioSegment":0},{"text":"and there is a round of safety fixes.","startTime":22,"endTime":25.666666666666664,"audioSegment":0},{"text":"If you read only one thing: craftbook tasks running on a model on your own computer get stuck much less often,","startTime":25.666666666666664,"endTime":29.333333333333332,"audioSegment":0},{"text":"and when one finishes, its closing message ends with a card for the file it made and an Open key.","startTime":29.333333333333332,"endTime":33,"audioSegment":0},{"text":"Craftbooks run as tasks, one step at a time.","startTime":33,"endTime":36.111111111111114,"audioSegment":0},{"text":"Last release made those tasks easier to start.","startTime":36.111111111111114,"endTime":39.22222222222222,"audioSegment":0},{"text":"This one fixes many of the ways they could stall,","startTime":39.22222222222222,"endTime":42.333333333333336,"audioSegment":0},{"text":"each found in real runs:","startTime":42.333333333333336,"endTime":45.44444444444444,"audioSegment":0},{"text":"Polishing a finished file.","startTime":45.44444444444444,"endTime":48.55555555555556,"audioSegment":0},{"text":"On an on-device model (llama.cpp, MLX or Ollama),","startTime":48.55555555555556,"endTime":51.66666666666667,"audioSegment":0},{"text":"a step whose file already passed its check could keep editing it for 12 to 20 minutes in a single turn, risking breaking it.","startTime":51.66666666666667,"endTime":54.77777777777778,"audioSegment":0},{"text":"The gezel is now told the file is done and to move on.","startTime":54.77777777777778,"endTime":57.888888888888886,"audioSegment":0},{"text":"If it keeps going,","startTime":57.888888888888886,"endTime":61,"audioSegment":0},{"text":"the turn ends and the step's check takes over.","startTime":61,"endTime":64.11111111111111,"audioSegment":0},{"text":"A follow-up message that took away the step's tools.","startTime":64.11111111111111,"endTime":67.22222222222223,"audioSegment":0},{"text":"A message such as \"save it to the drafts folder\" could narrow a step's tools so far that it lost its only way to save its work.","startTime":67.22222222222223,"endTime":70.33333333333334,"audioSegment":0},{"text":"The gezel then paused the task,","startTime":70.33333333333334,"endTime":73.44444444444444,"audioSegment":0},{"text":"and it could not resume the task itself.","startTime":73.44444444444444,"endTime":76.55555555555556,"audioSegment":0},{"text":"A step now always keeps its saving tool and every tool its own instructions name.","startTime":76.55555555555556,"endTime":79.66666666666666,"audioSegment":0},{"text":"A save that was too long.","startTime":79.66666666666666,"endTime":82.77777777777777,"audioSegment":0},{"text":"When a local model's save ran past the most it may write in one reply,","startTime":82.77777777777777,"endTime":85.88888888888889,"audioSegment":0},{"text":"it was told to pause the task, which had the same dead end.","startTime":85.88888888888889,"endTime":89,"audioSegment":0},{"text":"It is now told to write a shorter version that keeps every required section.","startTime":89,"endTime":92.11111111111111,"audioSegment":0},{"text":"Several edits mistaken for a loop.","startTime":92.11111111111111,"endTime":95.22222222222223,"audioSegment":0},{"text":"Seven different heading fixes to one file were cut off at five as \"not making progress\",","startTime":95.22222222222223,"endTime":98.33333333333333,"audioSegment":0},{"text":"leaving slides unfixed.","startTime":98.33333333333333,"endTime":101.44444444444444,"audioSegment":0},{"text":"Different successful edits now count as progress; only failed edits are counted.","startTime":101.44444444444444,"endTime":104.55555555555556,"audioSegment":0},{"text":"Reviews rejected for made-up sources that were not sources.","startTime":104.55555555555556,"endTime":107.66666666666667,"audioSegment":0},{"text":"A reviewer who described the citation format, writing something like <path/URL> or \"n/a\",","startTime":107.66666666666667,"endTime":110.77777777777779,"audioSegment":0},{"text":"had its review rejected three times and the task paused.","startTime":110.77777777777779,"endTime":113.88888888888889,"audioSegment":0},{"text":"Placeholders like those are no longer read as citations.","startTime":113.88888888888889,"endTime":117,"audioSegment":0},{"text":"An old round of a looping recipe finishing the new one.","startTime":117,"endTime":120.11111111111111,"audioSegment":0},{"text":"In a recipe that goes review, revise, review,","startTime":120.11111111111111,"endTime":123.22222222222223,"audioSegment":0},{"text":"a chat left over from an earlier round could mark the current round done, against an unchanged file.","startTime":123.22222222222223,"endTime":126.33333333333333,"audioSegment":0},{"text":"Each round now belongs to its own session.","startTime":126.33333333333333,"endTime":129.44444444444446,"audioSegment":0},{"text":"DeepSeek V4 thinking through the whole turn.","startTime":129.44444444444446,"endTime":132.55555555555554,"audioSegment":0},{"text":"On the ds4 engine,","startTime":132.55555555555554,"endTime":135.66666666666669,"audioSegment":0},{"text":"it could spend about 18 minutes thinking and write nothing.","startTime":135.66666666666669,"endTime":138.77777777777777,"audioSegment":0},{"text":"Gezel now stops the thinking at its budget, keeps what it thought on screen,","startTime":138.77777777777777,"endTime":141.88888888888889,"audioSegment":0},{"text":"and retries that reply with thinking off.","startTime":141.88888888888889,"endTime":145,"audioSegment":0},{"text":"When a task made a deck or a document, its closing message used to list the deck as one unlinked path among the working files,","startTime":145,"endTime":149.42857142857142,"audioSegment":0},{"text":"sometimes under \"…and 3 more\", and the card in Updates previewed the outline rather than the result.","startTime":149.42857142857142,"endTime":153.85714285714286,"audioSegment":0},{"text":"Now the closing message starts with \"Here's your PowerPoint deck\" (or whatever it made) and ends with a card for that file: its type,","startTime":153.85714285714286,"endTime":158.28571428571428,"audioSegment":0},{"text":"its name, whether it is in the project folder or the artifacts drawer, and its size.","startTime":158.28571428571428,"endTime":162.71428571428572,"audioSegment":0},{"text":"Open opens it, Show in folder shows it where it is saved,","startTime":162.71428571428572,"endTime":167.14285714285714,"audioSegment":0},{"text":"and Save a copy… saves it wherever you like.","startTime":167.14285714285714,"endTime":171.57142857142858,"audioSegment":0},{"text":"The same card sits under the step tracker on the task's page and in the Task card in the chat rail,","startTime":171.57142857142858,"endTime":176,"audioSegment":0},{"text":"where it appears with a dashed border, marked \"in progress\", as soon as the file exists.","startTime":176,"endTime":180.42857142857144,"audioSegment":0},{"text":"The card only names a file that is really there,","startTime":180.42857142857144,"endTime":184.85714285714286,"audioSegment":0},{"text":"and never a working paper such as an outline.","startTime":184.85714285714286,"endTime":189.28571428571428,"audioSegment":0},{"text":"The Task card in the chat rail also follows the run as it goes,","startTime":189.28571428571428,"endTime":193.71428571428572,"audioSegment":0},{"text":"instead of staying as it was when you opened it.","startTime":193.71428571428572,"endTime":198.14285714285714,"audioSegment":0},{"text":"File names in its notes are links,","startTime":198.14285714285714,"endTime":202.57142857142858,"audioSegment":0},{"text":"and a reply that names a file the gezel wrote moments earlier now links to it too.","startTime":202.57142857142858,"endTime":207,"audioSegment":0},{"text":"Narration, the setting that reads gezels' replies aloud,","startTime":207,"endTime":210.0625,"audioSegment":0},{"text":"used to stop after roughly the first 280 characters.","startTime":210.0625,"endTime":213.125,"audioSegment":0},{"text":"It now reads the whole reply.","startTime":213.125,"endTime":216.1875,"audioSegment":0},{"text":"With Settings → Audio → Include progress updates on,","startTime":216.1875,"endTime":219.25,"audioSegment":0},{"text":"the voice starts at the first finished sentence and keeps pace while the reply is still being written.","startTime":219.25,"endTime":222.3125,"audioSegment":0},{"text":"Without it, the reply is read once it is finished,","startTime":222.3125,"endTime":225.375,"audioSegment":0},{"text":"but playback starts as soon as the first sentence is ready.","startTime":225.375,"endTime":228.4375,"audioSegment":0},{"text":"While a gezel is speaking,","startTime":228.4375,"endTime":231.5,"audioSegment":0},{"text":"a Stop narration key appears in the title bar.","startTime":231.5,"endTime":234.5625,"audioSegment":0},{"text":"It stops the rest of that reply,","startTime":234.5625,"endTime":237.625,"audioSegment":0},{"text":"and the next one is read as usual.","startTime":237.625,"endTime":240.6875,"audioSegment":0},{"text":"Stopping a chat reply now stops its voice too.","startTime":240.6875,"endTime":243.75,"audioSegment":0},{"text":"Two fixes you may have noticed without knowing why.","startTime":243.75,"endTime":246.8125,"audioSegment":0},{"text":"Speech now runs on its own thread,","startTime":246.8125,"endTime":249.875,"audioSegment":0},{"text":"so reading a reply aloud no longer holds up the rest of gezel for a moment on every sentence.","startTime":249.875,"endTime":252.9375,"audioSegment":0},{"text":"And narration no longer saves a sound file into the project's artifacts drawer for every sentence it reads.","startTime":252.9375,"endTime":256,"audioSegment":0},{"text":"Gezel adds passages from Help and from any knowledge catalogs you installed to a conversation when they look relevant.","startTime":256,"endTime":259.8235294117647,"audioSegment":0},{"text":"Too often they did not need to be relevant: almost any message picked something up,","startTime":259.8235294117647,"endTime":263.6470588235294,"audioSegment":0},{"text":"so \"What is 17 times 23?\" came with an old release's notes.","startTime":263.6470588235294,"endTime":267.47058823529414,"audioSegment":0},{"text":"Each catalog now has a cut-off measured against labeled questions,","startTime":267.47058823529414,"endTime":271.29411764705884,"audioSegment":0},{"text":"and a passage matched only on a shared word is no longer added unless the relevance check approved it.","startTime":271.29411764705884,"endTime":275.11764705882354,"audioSegment":0},{"text":"In our tests, off-topic messages that picked up a passage went from 25 out of 25 to 2 out of 25,","startTime":275.11764705882354,"endTime":278.94117647058823,"audioSegment":0},{"text":"and on-topic answers were unchanged.","startTime":278.94117647058823,"endTime":282.7647058823529,"audioSegment":0},{"text":"The relevance check is a small model on your device,","startTime":282.7647058823529,"endTime":286.5882352941176,"audioSegment":0},{"text":"about 24 MB, that reads each passage before a gezel uses it.","startTime":286.5882352941176,"endTime":290.4117647058824,"audioSegment":0},{"text":"It is now on for new installs,","startTime":290.4117647058824,"endTime":294.2352941176471,"audioSegment":0},{"text":"with a checkbox in first-run setup to turn it off.","startTime":294.2352941176471,"endTime":298.05882352941177,"audioSegment":0},{"text":"If you already use gezel, your setting stays as it was.","startTime":298.05882352941177,"endTime":301.88235294117646,"audioSegment":0},{"text":"It is under Settings → Artificial Intelligence → Check that indexed context is on topic before using it.","startTime":301.88235294117646,"endTime":305.70588235294116,"audioSegment":0},{"text":"One related change to your security settings: a catalog download you start yourself in Settings → Knowledge now goes ahead even when they turn off app network access.","startTime":305.70588235294116,"endTime":309.52941176470586,"audioSegment":0},{"text":"Those settings govern what gezels do,","startTime":309.52941176470586,"endTime":313.3529411764706,"audioSegment":0},{"text":"and a gezel still cannot start a download.","startTime":313.3529411764706,"endTime":317.1764705882353,"audioSegment":0},{"text":"Automatic update checks still follow the setting.","startTime":317.1764705882353,"endTime":321,"audioSegment":0},{"text":"Nothing you do changes for any of these.","startTime":321,"endTime":323.92,"audioSegment":0},{"text":"The artifacts drawer can no longer be deleted whole.","startTime":323.92,"endTime":326.84,"audioSegment":0},{"text":"Deleting or renaming a path written as . or notes/..","startTime":326.84,"endTime":329.76,"audioSegment":0},{"text":"removed the entire drawer: task inputs, prompt drafts, change proposals and data.","startTime":329.76,"endTime":332.68,"audioSegment":0},{"text":"That was possible from the app and from a gezel's tools.","startTime":332.68,"endTime":335.6,"audioSegment":0},{"text":"Both are now refused.","startTime":335.6,"endTime":338.52,"audioSegment":0},{"text":"Web fetches cannot be pointed at your own network.","startTime":338.52,"endTime":341.44,"audioSegment":0},{"text":"An address written in a disguised form, such as [::ffff:127.0.0.1],","startTime":341.44,"endTime":344.36,"audioSegment":0},{"text":"could get past the guard that keeps fetches away from your computer, your local network and cloud metadata addresses.","startTime":344.36,"endTime":347.28,"audioSegment":0},{"text":"Those forms are now blocked.","startTime":347.28,"endTime":350.2,"audioSegment":0},{"text":"Websites cannot read your device's gezel id.","startTime":350.2,"endTime":353.12,"audioSegment":0},{"text":"A web page could read it from the local service.","startTime":353.12,"endTime":356.04,"audioSegment":0},{"text":"The listener for the Office add-in, whose certificate your browsers trust,","startTime":356.04,"endTime":358.96,"audioSegment":0},{"text":"now answers only the add-in itself.","startTime":358.96,"endTime":361.88,"audioSegment":0},{"text":"In Word, Excel and PowerPoint,","startTime":361.88,"endTime":364.8,"audioSegment":0},{"text":"only the gezel you picked can use the document.","startTime":364.8,"endTime":367.72,"audioSegment":0},{"text":"The document tools were offered to every gezel in the project,","startTime":367.72,"endTime":370.64,"audioSegment":0},{"text":"including background work.","startTime":370.64,"endTime":373.56,"audioSegment":0},{"text":"The pane names the gezel that can read the document,","startTime":373.56,"endTime":376.48,"audioSegment":0},{"text":"and warns you if that gezel's provider cannot reach it (GitHub Copilot, Claude CLI and Codex CLI).","startTime":376.48,"endTime":379.4,"audioSegment":0},{"text":"Uninstalling on Windows removes the Office certificate.","startTime":379.4,"endTime":382.32,"audioSegment":0},{"text":"The \"Gezel Office Local CA\" was left in your trusted certificates after an uninstall.","startTime":382.32,"endTime":385.24,"audioSegment":0},{"text":"Installing on Linux leaves other programs alone.","startTime":385.24,"endTime":388.15999999999997,"audioSegment":0},{"text":"The installer stopped every process running under the same user number as gezel's account,","startTime":388.15999999999997,"endTime":391.08,"audioSegment":0},{"text":"which could include a database in a Docker container, and then failed when they restarted.","startTime":391.08,"endTime":394,"audioSegment":0},{"text":"Memory refusals are plain.","startTime":394,"endTime":397.3018867924528,"audioSegment":0},{"text":"A model that does not fit now says \"There is not enough memory to run this model.","startTime":397.3018867924528,"endTime":400.60377358490564,"audioSegment":0},{"text":"Please select another model or close some applications on this device.\" The arithmetic went to the log.","startTime":400.60377358490564,"endTime":403.9056603773585,"audioSegment":0},{"text":"Gemma 4's E-series models on MLX were estimated to need about 1.75 times the memory they use,","startTime":403.9056603773585,"endTime":407.20754716981133,"audioSegment":0},{"text":"so they are refused less often on smaller Macs, and DeepSeek V4 Flash q2 is no longer refused full memory on the NVIDIA DGX Spark.","startTime":407.20754716981133,"endTime":410.50943396226415,"audioSegment":0},{"text":"Your installed model is remembered.","startTime":410.50943396226415,"endTime":413.811320754717,"audioSegment":0},{"text":"Where gezel's engine runs as a system service,","startTime":413.811320754717,"endTime":417.1132075471698,"audioSegment":0},{"text":"the first-run check could keep an old model choice and offer to download the recommended model you already had.","startTime":417.1132075471698,"endTime":420.41509433962267,"audioSegment":0},{"text":"Pictures from tools stay out of the way of text-only models.","startTime":420.41509433962267,"endTime":423.7169811320755,"audioSegment":0},{"text":"A tool that returns images, such as slide previews,","startTime":423.7169811320755,"endTime":427.0188679245283,"audioSegment":0},{"text":"no longer fails the reply on a model that cannot see; the reply goes on without them and says so.","startTime":427.0188679245283,"endTime":430.3207547169811,"audioSegment":0},{"text":"On models that can see, the images now arrive,","startTime":430.3207547169811,"endTime":433.62264150943395,"audioSegment":0},{"text":"and are sent once rather than with every later request.","startTime":433.62264150943395,"endTime":436.92452830188677,"audioSegment":0},{"text":"The Meester runs the recipe even when it gets the version wrong.","startTime":436.92452830188677,"endTime":440.22641509433964,"audioSegment":0},{"text":"The Meester sometimes asked for a craftbook version that does not exist,","startTime":440.22641509433964,"endTime":443.52830188679246,"audioSegment":0},{"text":"such as a \"1.0\" copied from your message.","startTime":443.52830188679246,"endTime":446.8301886792453,"audioSegment":0},{"text":"The task failed and the Meester made the document by hand outside the recipe.","startTime":446.8301886792453,"endTime":450.1320754716981,"audioSegment":0},{"text":"The latest version now runs.","startTime":450.1320754716981,"endTime":453.4339622641509,"audioSegment":0},{"text":"Document tools find files by their plain path.","startTime":453.4339622641509,"endTime":456.7358490566038,"audioSegment":0},{"text":"A reviewer opening powerpoint/task-13/deck.pptx was refused with \"Ambiguous MCP root\".","startTime":456.7358490566038,"endTime":460.0377358490566,"audioSegment":0},{"text":"The tools now find the file,","startTime":460.0377358490566,"endTime":463.33962264150944,"audioSegment":0},{"text":"or name the folders they looked in.","startTime":463.33962264150944,"endTime":466.64150943396226,"audioSegment":0},{"text":"One Crew Lead per project.","startTime":466.64150943396226,"endTime":469.9433962264151,"audioSegment":0},{"text":"Projects the Meester starts no longer get a second, idle Crew Lead.","startTime":469.9433962264151,"endTime":473.2452830188679,"audioSegment":0},{"text":"Codex CLI replies that go silent end after 10 minutes instead of waiting out a much longer limit,","startTime":473.2452830188679,"endTime":476.54716981132077,"audioSegment":0},{"text":"and time your computer spends asleep no longer counts.","startTime":476.54716981132077,"endTime":479.8490566037736,"audioSegment":0},{"text":"New thread means a new thread.","startTime":479.8490566037736,"endTime":483.1509433962264,"audioSegment":0},{"text":"Sending quickly right after choosing New thread could land the message in the most recent old thread.","startTime":483.1509433962264,"endTime":486.45283018867923,"audioSegment":0},{"text":"The Home greeting stays folded after your first message,","startTime":486.45283018867923,"endTime":489.7547169811321,"audioSegment":0},{"text":"instead of opening again.","startTime":489.7547169811321,"endTime":493.0566037735849,"audioSegment":0},{"text":"The engine indicator shows the reply actually running,","startTime":493.0566037735849,"endTime":496.35849056603774,"audioSegment":0},{"text":"not the newest one still waiting its turn, and the queue indicator opens on the first click.","startTime":496.35849056603774,"endTime":499.66037735849056,"audioSegment":0},{"text":"The Office pane is steadier.","startTime":499.66037735849056,"endTime":502.9622641509434,"audioSegment":0},{"text":"Approving its connection code works after the computer has slept, Allow edits switched on while it is connecting takes effect,","startTime":502.9622641509434,"endTime":506.2641509433962,"audioSegment":0},{"text":"and errors read as a sentence instead of \"Gezel answered 500.\" The Office and LibreOffice setup cards, the chat box and the new-task dialog likewise show a sentence instead of \"Gezel API error 409\".","startTime":506.2641509433962,"endTime":509.566037735849,"audioSegment":0},{"text":"Settings lists look like lists.","startTime":509.566037735849,"endTime":512.8679245283018,"audioSegment":0},{"text":"Pending apps in Connected Apps, Remote Servers,","startTime":512.8679245283018,"endTime":516.1698113207547,"audioSegment":0},{"text":"and a project's Connections tab are bordered rows with their buttons on the right, instead of bullet points.","startTime":516.1698113207547,"endTime":519.4716981132076,"audioSegment":0},{"text":"Markdown source fields have room.","startTime":519.4716981132076,"endTime":522.7735849056604,"audioSegment":0},{"text":"The source view of a task step, a craftbook step,","startTime":522.7735849056604,"endTime":526.0754716981132,"audioSegment":0},{"text":"a change proposal or a code review showed about one line; it is now several lines tall.","startTime":526.0754716981132,"endTime":529.377358490566,"audioSegment":0},{"text":"Narrow windows keep their controls.","startTime":529.377358490566,"endTime":532.6792452830189,"audioSegment":0},{"text":"Below about 760 pixels wide, the title bar keeps the queue,","startTime":532.6792452830189,"endTime":535.9811320754717,"audioSegment":0},{"text":"engine and stop-narration keys instead of hiding them.","startTime":535.9811320754717,"endTime":539.2830188679245,"audioSegment":0},{"text":"History and Craftbooks show the list first and then the item,","startTime":539.2830188679245,"endTime":542.5849056603773,"audioSegment":0},{"text":"with a Back key, when there is no room for both.","startTime":542.5849056603773,"endTime":545.8867924528302,"audioSegment":0},{"text":"A gezel's Model, Context,","startTime":545.8867924528302,"endTime":549.1886792452831,"audioSegment":0},{"text":"Sandbox and Access settings wrap together instead of splitting a label from its value.","startTime":549.1886792452831,"endTime":552.4905660377358,"audioSegment":0},{"text":"Gezel loads about a fifth less styling before its first screen.","startTime":552.4905660377358,"endTime":555.7924528301887,"audioSegment":0},{"text":"What's new is current.","startTime":555.7924528301887,"endTime":559.0943396226415,"audioSegment":0},{"text":"In 1.26273, Help's What's new still opened on the previous release's notes.","startTime":559.0943396226415,"endTime":562.3962264150944,"audioSegment":0},{"text":"The build now checks for that.","startTime":562.3962264150944,"endTime":565.6981132075472,"audioSegment":0},{"text":"Electron moved from 43.7.5 to 43.7.7.","startTime":565.6981132075472,"endTime":569,"audioSegment":0},{"text":"If you use the gezel command (The gezel command line covers it):","startTime":569,"endTime":572.15,"audioSegment":0},{"text":"An older Node.js gets a clear message.","startTime":572.15,"endTime":575.3,"audioSegment":0},{"text":"On Node.js older than 24,","startTime":575.3,"endTime":578.45,"audioSegment":0},{"text":"gezel and gezeld say \"Gezel needs Node.js 24 or newer\" and where to get it, instead of crashing.","startTime":578.45,"endTime":581.6,"audioSegment":0},{"text":"You are told when a command starts the background service.","startTime":581.6,"endTime":584.75,"audioSegment":0},{"text":"A command that has to start it prints \"Started the Gezel background service (pid N);","startTime":584.75,"endTime":587.9,"audioSegment":0},{"text":"it keeps running after this command.","startTime":587.9,"endTime":591.05,"audioSegment":0},{"text":"Stop it with gezel stop --daemon.\" Before,","startTime":591.05,"endTime":594.2,"audioSegment":0},{"text":"about 350 MB kept running without a word.","startTime":594.2,"endTime":597.35,"audioSegment":0},{"text":"gezel native status and gezel native list leave nothing running.","startTime":597.35,"endTime":600.5,"audioSegment":0},{"text":"They used to start a background service that stayed up for twenty minutes or more.","startTime":600.5,"endTime":603.65,"audioSegment":0},{"text":"gezel knowledge install is no longer refused by your security settings,","startTime":603.65,"endTime":606.8,"audioSegment":0},{"text":"matching the app.","startTime":606.8,"endTime":609.95,"audioSegment":0},{"text":"gezel knowledge build and gezel knowledge search --semantic say how to install the embedding runtime when an npm install of gezel lacks it.","startTime":609.95,"endTime":613.1,"audioSegment":0},{"text":"gezel do <craftbook> --wait,","startTime":613.1,"endTime":616.25,"audioSegment":0},{"text":"gezel task wait and gezel task resume are no longer held up by an old \"task paused\" notice after the task resumed.","startTime":616.25,"endTime":619.4,"audioSegment":0},{"text":"Questions and permission prompts still stop them.","startTime":619.4,"endTime":622.55,"audioSegment":0},{"text":"A background service the command line starts now keeps a log in ~/.gezel/logs/,","startTime":622.55,"endTime":625.7,"audioSegment":0},{"text":"rolled at 10 MB and kept for seven days.","startTime":625.7,"endTime":628.85,"audioSegment":0},{"text":"Before, its output went nowhere.","startTime":628.85,"endTime":632,"audioSegment":0},{"text":"Task outputs.","startTime":632,"endTime":634.6666666666666,"audioSegment":0},{"text":"GET /api/projects/:id/tasks/:num/outputs and client.getTaskOutputs() return a task's deliverable and its other files;","startTime":634.6666666666666,"endTime":637.3333333333334,"audioSegment":0},{"text":"the taskOutputs runtime capability says whether a host serves it.","startTime":637.3333333333334,"endTime":640,"audioSegment":0},{"text":"listTaskNotes(..., { withFileReferences }) (?refs=1) returns notes with their file references resolved.","startTime":640,"endTime":642.6666666666666,"audioSegment":0},{"text":"Audio synthesis takes persist: false to skip writing the utterance to the artifacts drawer,","startTime":642.6666666666666,"endTime":645.3333333333334,"audioSegment":0},{"text":"and artifactPath in the response is now optional.","startTime":645.3333333333334,"endTime":648,"audioSegment":0},{"text":"The SSE stream always delivers at least one chunk.","startTime":648,"endTime":650.6666666666666,"audioSegment":0},{"text":"CreateProjectRequest.lead takes 'auto' | 'none'; the Meester's kickoff paths pass 'none'.","startTime":650.6666666666666,"endTime":653.3333333333334,"audioSegment":0},{"text":"Search results carry similarity, and so does the retrieval trace.","startTime":653.3333333333334,"endTime":656,"audioSegment":0},{"text":"Per-catalog vector floors can be overridden with GEZEL_KNOWLEDGE_VECTOR_FLOORS,","startTime":656,"endTime":658.6666666666666,"audioSegment":0},{"text":"and the knowledge relevance bar with GEZEL_RELEVANCE_KNOWLEDGE_KEEP.","startTime":658.6666666666666,"endTime":661.3333333333334,"audioSegment":0},{"text":"Measure a new catalog or embedder with pnpm --filter @bendyline/gezel-evals run knowledge-calibration.","startTime":661.3333333333334,"endTime":664,"audioSegment":0},{"text":"Knowledge install routes no longer return 403 network-blocked.","startTime":664,"endTime":666.6666666666666,"audioSegment":0},{"text":"They still refuse session tokens.","startTime":666.6666666666666,"endTime":669.3333333333334,"audioSegment":0},{"text":"@bendyline/gezel-knowledge's compiler accepts shardFill: 'semantic',","startTime":669.3333333333334,"endTime":672,"audioSegment":0},{"text":"which raised routed recall@8 from 82.6% to 85.7% at six shards in our measurements.","startTime":672,"endTime":674.6666666666666,"audioSegment":0},{"text":"@bendyline/gezel-client exports apiErrorMessage.","startTime":674.6666666666666,"endTime":677.3333333333334,"audioSegment":0},{"text":"The queue-status types now live in @bendyline/gezel/queue-status and are still re-exported from the client.","startTime":677.3333333333334,"endTime":680,"audioSegment":0},{"text":"The local-model turn loop,","startTime":680,"endTime":682.6666666666666,"audioSegment":0},{"text":"the model-profile behaviors and the prompt builder moved into @bendyline/gezel/local-loop.","startTime":682.6666666666666,"endTime":685.3333333333334,"audioSegment":0},{"text":"The service re-exports them from their old paths.","startTime":685.3333333333334,"endTime":688,"audioSegment":0},{"text":"gezeld answers --help and --version (which used to start a full daemon) and warns about unknown arguments.","startTime":688,"endTime":690.6666666666666,"audioSegment":0},{"text":"GEZEL_DAEMON_LOG_FILE=1 makes a daemon write the rolling service log,","startTime":690.6666666666666,"endTime":693.3333333333334,"audioSegment":0},{"text":"which the client sets for daemons it starts detached.","startTime":693.3333333333334,"endTime":696,"audioSegment":0},{"text":"GEZEL_WASM_BASELINE=1 starts a spawned daemon with --liftoff-only --no-wasm-tier-up,","startTime":696,"endTime":698.6666666666666,"audioSegment":0},{"text":"a workaround for V8 out-of-memory crashes.","startTime":698.6666666666666,"endTime":701.3333333333334,"audioSegment":0},{"text":"Dependencies: Electron 43.7.7, fast-uri 3.1.8.","startTime":701.3333333333334,"endTime":704,"audioSegment":0},{"text":"Run a craftbook that stalled for you last week,","startTime":704,"endTime":708,"audioSegment":0},{"text":"and open what it hands back from the card at the end of the thread.","startTime":708,"endTime":712,"audioSegment":0},{"text":"If you like replies read aloud,","startTime":712,"endTime":716,"audioSegment":0},{"text":"turn on Settings → Audio → Include progress updates to hear them as they arrive.","startTime":716,"endTime":720,"audioSegment":0},{"text":"If you installed gezel before today, look at Settings → Artificial Intelligence → Check that indexed context is on topic before using it;","startTime":720,"endTime":724,"audioSegment":0},{"text":"it costs about 24 MB and keeps unrelated articles out of your conversations.","startTime":724,"endTime":728,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26274 — 1 October 2026","subtitle":"This release is about steadiness. Most of it fixes the ways a task could stall or stop for good partway through. When the work does finish, you get the file itself instead of a path buried in a list. Narration reads the whole reply and no longer holds up the rest of the app. Chats pick up far less unrelated reference material, and there is a round of safety fixes.","ambientMotion":"zoomIn"}}</script>
