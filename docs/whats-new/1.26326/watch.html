<script type="application/json" id="squisq-doc" data-squisq-doc="1">{"articleId":"whats-new/1.26326","duration":754,"blocks":[{"id":"126326-22-november-2026","startTime":0,"duration":32,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":1,"children":[{"type":"text","value":"1.26326 — 22 November 2026","position":{"start":{"line":1,"column":3,"offset":2},"end":{"line":1,"column":29,"offset":28}}}],"position":{"start":{"line":1,"column":1,"offset":0},"end":{"line":1,"column":29,"offset":28}}},"title":"1.26326 — 22 November 2026","contents":[{"type":"paragraph","children":[{"type":"text","value":"A project can now follow web pages and keep its own copies of them, and a web address you write in a message is saved and handed to the gezel with your words. Pages a gezel builds can now use three.js, Chart.js, React and other popular libraries with no internet connection, and you can export a page to share it. Connecting a calendar, OneDrive or SharePoint no longer needs a developer app of your own, and connections now show plainly when you're offline instead of failing. Claude Code, Codex and Copilot gezels now run commands through Gezel's own tools unless your security level is ","position":{"start":{"line":3,"column":1,"offset":30},"end":{"line":3,"column":590,"offset":619}}},{"type":"strong","children":[{"type":"text","value":"Unrestricted","position":{"start":{"line":3,"column":592,"offset":621},"end":{"line":3,"column":604,"offset":633}}}],"position":{"start":{"line":3,"column":590,"offset":619},"end":{"line":3,"column":606,"offset":635}}},{"type":"text","value":".","position":{"start":{"line":3,"column":606,"offset":635},"end":{"line":3,"column":607,"offset":636}}}],"position":{"start":{"line":3,"column":1,"offset":30},"end":{"line":3,"column":607,"offset":636}}}],"children":[{"id":"follow-web-pages-from-a-project","startTime":32,"duration":95,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"ch hen a page that changed, a new page, or words that appear (such as \"sold out\"), and what should happen next.","position":{"start":{"line":15,"column":61,"offset":2114},"end":{"line":15,"column":189,"offset":2242}}}],"position":{"start":{"line":15,"column":1,"offset":2054},"end":{"line":15,"column":189,"offset":2242}}},{"type":"paragraph","children":[{"type":"text","value":"Gezel never clicks, types or fills in anything on a page, never downloads files from one, and never replaces a good copy with a bot check or a sign-in form. ","position":{"start":{"line":17,"column":1,"offset":2244},"end":{"line":17,"column":158,"offset":2401}}},{"type":"link","url":"../../saved-web-pages/","children":[{"type":"text","value":"Saved web pages","position":{"start":{"line":17,"column":159,"offset":2402},"end":{"line":17,"column":174,"offset":2417}}}],"position":{"start":{"line":17,"column":158,"offset":2401},"end":{"line":17,"column":199,"offset":2442}}},{"type":"text","value":" covers the rest.","position":{"start":{"line":17,"column":199,"offset":2442},"end":{"line":17,"column":216,"offset":2459}}}],"position":{"start":{"line":17,"column":1,"offset":2244},"end":{"line":17,"column":216,"offset":2459}}}]},{"id":"links-in-a-message-are-saved-and-included","startTime":127,"duration":41,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Links in a message are saved and included","position":{"start":{"line":19,"column":4,"offset":2464},"end":{"line":19,"column":45,"offset":2505}}}],"position":{"start":{"line":19,"column":1,"offset":2461},"end":{"line":19,"column":45,"offset":2505}}},"title":"Links in a message are saved and included","contents":[{"type":"paragraph","children":[{"type":"text","value":"Asking \"Can you summarize ","position":{"start":{"line":21,"column":1,"offset":2507},"end":{"line":21,"column":27,"offset":2533}}},{"type":"link","url":"https://example.com/pricing","children":[{"type":"text","value" ve now","position":{"start":{"line":23,"column":67,"offset":2948},"end":{"line":23,"column":75,"offset":2956}}}],"position":{"start":{"line":23,"column":65,"offset":2946},"end":{"line":23,"column":77,"offset":2958}}},{"type":"text","value":" to save it while you're still writing. Under your sent message, a row with the page's title opens the saved copy, and a page that couldn't be saved shows the reason. Only your own messages do this. An address in a gezel's message, an app's request or a scheduled nudge is never fetched this way.","position":{"start":{"line":23,"column":77,"offset":2958},"end":{"line":23,"column":373,"offset":3254}}}],"position":{"start":{"line":23,"column":1,"offset":2882},"end":{"line":23,"column":373,"offset":3254}}}]},{"id":"pages-can-use-popular-libraries-with-no-internet","startTime":168,"duration":101,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Pages can use popular libraries, with no internet","position":{"start":{"line":25,"column":4,"offset":3259},"end":{"line":25,"column":53,"offset":3308}}}],"position":{"start":{"line":25,"column":1,"offset":3256},"end":{"line":25,"column":53,"offset":3308}}},"title":"Pages can use popular libraries, with no internet","contents":[{"type":"paragraph","children":[{"type":"text","value":"A page a gezel builds runs in a preview with no network below ","position":{"start":{"line":27,"column":1,"offset":3310},"end":{"line":27,"column":63,"offset":3372}}},{"type":"strong","children":[{"type":"text","value":"Unrestricted","position":{"start":{"line":27,"column":65,"offset":3374},"end":{"line":27,"column":77,"offset":3386}}}],"position":{"start":{"line":27,"column":63,"offset":3372},"end":{"line":27,"column":79,"offset":3388}}},{"type":"text","value":", so a 3D scene, a chart or a React interface had to be written from scratch, and a page that loaded a library from the web simply broke. Gezel now keeps popular libraries on your computer and hands them to the page from there: three.js for 3D, Chart.js and D3 for charts, and React, Preact and Vue for interfaces. The page names the library the ordinary way, by its package or its usual web address. Export the page and the library goes with it, so the copy opens anywhere.","position":{"start":{"line":27,"column":79,"offset":3388},"end":{"line":27,"column":553,"offset":3862}}}],"position":{"start":{"line":27,"column":1,"offset":3310},"end":{"line":27,"column":553,"offset":3862}}},{"type":"paragraph","children":[{"type":"text","value":"A library downloads the first time a page uses it, at the exact version Gezel's catalog lists, and is checked before any page loads it. Automatic downloads happen only when your security level lets Gezel use the network. ","position":{"start":{"line":29,"column":1,"offset":3864},"end":{"line":29,"column":222,"offset":4085}}},{"type":"strong","children":[{"type":"text","value":"Settings → More settings → Page libraries","position":{"start":{"line":29,"column":224,"offset":4087},"end":{"line":29,"column":265,"offset":4128}}}],"position":{"start":{"line":29,"column":222,"offset":4085},"end":{"line":29,"column":267,"offset":4130}}},{"type":"text","value":" lists what's on this computer, downloads one ahead of time, removes one, or turns automatic downloads off. The Mac App Store and Microsoft Store versions come with a fixed set and never download.","position":{"start":{"line":29,"column":267,"offset":4130},"end":{"line":29,"column":463,"offset":4326}}}],"position":{"start":{"line":29,"column":1,"offset":3864},"end":{"line":29,"column":463,"offset":4326}}},{"type":"paragraph","children":[{"type":"text","value":"Gezels are told which libraries are on hand and stay with plain JavaScript unless one clearly helps. The chart and dashboard craftbooks can now draw with Chart.js instead of plotting axes by hand, and the game and app craftbooks may use a library where it fits.","position":{"start":{"line":31,"column":1,"offset":4328},"end":{"line":31,"column":262,"offset":4589}}}],"position":{"start":{"line":31,"column":1,"offset":4328},"end":{"line":31,"column":262,"offset":4589}}},{"type":"paragraph","children":[{"type":"text","value":"React pages written for Babel's in-browser compiler now run without downloading it, because Gezel compiles the page's JSX itself. React 19 is included, and a component file that uses JSX without importing React works as it does in a Vite project.","position":{"start":{"line":33,"column":1,"offset":4591},"end":{"line":33,"column":247,"offset":4837}}}],"position":{"start":{"line":33,"column":1,"offset":4591},"end":{"line":33,"column":247,"offset":4837}}},{"type":"paragraph","children":[{"type":"text","value":"To share a page, press the download arrow above it in the project's output pane, beside the button that opens it in your browser. ","position":{"start":{"line":35,"column":1,"offset":4839},"end":{"line":35,"column":131,"offset":4969}}},{"type":"strong","children":[{"type":"text","value":"One file (.html)","position":{"start":{"line":35,"column":133,"offset":4971},"end":{"line":35,"column":149,"offset":4987}}}],"position":{"start":{"line":35,"column":131,"offset":4969},"end":{"line":35,"column":151,"offset":4989}}},{"type":"text","value":" puts the libraries, styles and images inside a single file that opens by double-clicking and can be emailed. ","position":{"start":{"line":35,"column":151,"offset":4989},"end":{"line":35,"column":261,"offset":5099}}},{"type":"strong","children":[{"type":"text","value":"Folder (.zip)","position":{"start":{"line":35,"column":263,"offset":5101},"end":{"line":35,"column":276,"offset":5114}}}],"position":{"start":{"line":35,"column":261,"offset":5099},"end":{"line":35,"column":278,"offset":5116}}},{"type":"text","value":" keeps the files side by side, ready for a website. Either way, the libraries' license notices go with the copy.","position":{"start":{"line":35,"column":278,"offset":5116},"end":{"line":35,"column":390,"offse 3,"column":194,"offset":14927}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"If a Claude Code or Codex gezel needs its own shell, check your level in ","position":{"start":{"line":94,"column":3,"offset":14930},"end":{"line":94,"column":76,"offset":15003}}},{"type":"strong","children":[{"type":"text","value":"Settings → Security & compliance","position":{"start":{"line":94,"column":78,"offset":15005},"end":{"line":94,"column":110,"offset":15037}}}],"position":{"start":{"line":94,"column":76,"offset":15003},"end":{"line":94,"column":112,"offset":15039}}},{"type":"text","value":". Below ","position":{"start":{"line":94,"column":112,"offset":15039},"end":{"line":94,"column":120,"offset":15047}}},{"type":"strong","children":[{"type":"text","value":"Unrestricted","position":{"start":{"line":94,"column":122,"offset":15049},"end":{"line":94,"column":134,"offset":15061}}}],"position":{"start":{"line":94,"column":120,"offset":15047},"end":{"line":94,"column":136,"offset":15063}}},{"type":"text","value":", it now works through Gezel's tools.","position":{"start":{"line":94,"column":136,"offset":15063},"end":{"line":94,"column":173,"offset":15100}}}],"position":{"start":{"line":94,"column":3,"offset":14930},"end":{"line":94,"column":173,"offset":15100}}}],"position":{"start":{"line":94,"column":1,"offset":14928},"end":{"line":94,"column":173,"offset":15100}}}],"position":{"start":{"line":92,"column":1,"offset":14607},"end":{"line":94,"column":173,"offset":15100}}}],"autoTemplate":true,"templateData":{"items":["Add a website to a project from Connections → Add connection → Websites, then open the project's Web pages view tab.","Ask for a page with a 3D scene or a chart, then press the download arrow above it in the output pane to export it. Settings → More settings → Page libraries shows what's on this computer.","If a Claude Code or Codex gezel needs its own shell, check your level in Settings → Security & compliance. Below Unrestricted, it now works through Gezel's tools."],"ordered":false,"title":"Things to see and do after update"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A project can now follow web pages and keep its own copies of them,","startTime":0,"endTime":4.571428571428571,"audioSegment":0},{"text":"and a web address you write in a message is saved and handed to the gezel with your words.","startTime":4.571428571428571,"endTime":9.142857142857142,"audioSegment":0},{"text":"Pages a gezel builds can now use three.js, Chart.js,","startTime":9.142857142857142,"endTime":13.714285714285714,"audioSegment":0},{"text":"React and other popular libraries with no internet connection, and you can export a page to share it.","startTime":13.714285714285714,"endTime":18.285714285714285,"audioSegment":0},{"text":"Connecting a calendar, OneDrive or SharePoint no longer needs a developer app of your own,","startTime":18.285714285714285,"endTime":22.857142857142854,"audioSegment":0},{"text":"and connections now show plainly when you're offline instead of failing. Claude Code,","startTime":22.857142857142854,"endTime":27.428571428571427,"audioSegment":0},{"text":"Codex and Copilot gezels now run commands through Gezel's own tools unless your security level is Unrestricted.","startTime":27.428571428571427,"endTime":32,"audioSegment":0},{"text":"A gezel that needed something from the web used to browse for it while it worked, or do without.","startTime":32,"endTime":35.166666666666664,"audioSegment":0},{"text":"A project can now follow web pages instead: a product's documentation,","startTime":35.166666666666664,"endTime":38.333333333333336,"audioSegment":0},{"text":"a supplier's price list, a team wiki.","startTime":38.333333333333336,"endTime":41.5,"audioSegment":0},{"text":"Gezel visits each page in a browser of its own,","startTime":41.5,"endTime":44.666666666666664,"audioSegment":0},{"text":"keeps its text and a few screenshots, and checks again on a schedule.","startTime":44.666666666666664,"endTime":47.83333333333333,"audioSegment":0},{"text":"Gezels read those copies and never browse while they work,","startTime":47.83333333333333,"endTime":51,"audioSegment":0},{"text":"so a page can't send them anywhere.","startTime":51,"endTime":54.166666666666664,"audioSegment":0},{"text":"Open the project's Connections tab, choose Add connection,","startTime":54.166666666666664,"endTime":57.33333333333333,"audioSegment":0},{"text":"then Websites, and paste one or more addresses.","startTime":57.33333333333333,"endTime":60.5,"audioSegment":0},{"text":"You choose how far to follow links,","startTime":60.5,"endTime":63.666666666666664,"audioSegment":0},{"text":"how many pages to keep and how often to check for changes.","startTime":63.666666666666664,"endTime":66.83333333333333,"audioSegment":0},{"text":"Gezel visits at most one page every second or two and follows each site's rules for crawlers.","startTime":66.83333333333333,"endTime":70,"audioSegment":0},{"text":"The project's Web pages view tab lists the saved pages by site.","startTime":70,"endTime":73.16666666666666,"audioSegment":0},{"text":"Each row leads with what you'd want to know,","startTime":73.16666666666666,"endTime":76.33333333333333,"audioSegment":0},{"text":"such as \"Changed 2 days ago\" or why a page couldn't be saved.","startTime":76.33333333333333,"endTime":79.5,"audioSegment":0},{"text":"Reading shows a page's text and Screenshots shows how it looked.","startTime":79.5,"endTime":82.66666666666666,"audioSegment":0},{"text":"Each site also gets an overview of its pages and a monthly change log,","startTime":82.66666666666666,"endTime":85.83333333333333,"audioSegment":0},{"text":"both of which gezels read.","startTime":85.83333333333333,"endTime":89,"audioSegment":0},{"text":"For a site you sign in to,","startTime":89,"endTime":92.16666666666666,"audioSegment":0},{"text":"press Sign in… on its connection and sign in in the window Gezel opens.","startTime":92.16666666666666,"endTime":95.33333333333333,"audioSegment":0},{"text":"The sign-in is kept for that connection only,","startTime":95.33333333333333,"endTime":98.5,"audioSegment":0},{"text":"encrypted on your computer, and Gezel never sees your password.","startTime":98.5,"endTime":101.66666666666666,"audioSegment":0},{"text":"If the site signs you out later,","startTime":101.66666666666666,"endTime":104.83333333333333,"audioSegment":0},{"text":"Gezel stops refreshing it and keeps everything it saved.","startTime":104.83333333333333,"endTime":108,"audioSegment":0},{"text":"Lookouts can watch a site too.","startTime":108,"endTime":111.16666666666666,"audioSegment":0},{"text":"In Connections → Lookouts, choose the site, then a page that changed, a new page,","startTime":111.16666666666666,"endTime":114.33333333333333,"audioSegment":0},{"text":"or words that appear (such as \"sold out\"), and what should happen next.","startTime":114.33333333333333,"endTime":117.5,"audioSegment":0},{"text":"Gezel never clicks, types or fills in anything on a page, never downloads files from one,","startTime":117.5,"endTime":120.66666666666666,"audioSegment":0},{"text":"and never replaces a good copy with a bot check or a sign-in form.","startTime":120.66666666666666,"endTime":123.83333333333333,"audioSegment":0},{"text":"Saved web pages covers the rest.","startTime":123.83333333333333,"endTime":127,"audioSegment":0},{"text":"Asking \"Can you summarize https://example.com/pricing?\" used to depend on whether the gezel could reach the web at all.","startTime":127,"endTime":130.72727272727272,"audioSegment":0},{"text":"Now, when you write a web address that starts with https:// or www.,","startTime":130.72727272727272,"endTime":134.45454545454547,"audioSegment":0},{"text":"a line above the message box says the page will be saved here and included in the chat. When you send,","startTime":134.45454545454547,"endTime":138.1818181818182,"audioSegment":0},{"text":"Gezel saves the page first and gives it to the gezel along with your message.","startTime":138.1818181818182,"endTime":141.9090909090909,"audioSegment":0},{"text":"Press × on that line if you don't want the page fetched,","startTime":141.9090909090909,"endTime":145.63636363636363,"audioSegment":0},{"text":"or Save now to save it while you're still writing.","startTime":145.63636363636363,"endTime":149.36363636363637,"audioSegment":0},{"text":"Under your sent message, a row with the page's title opens the saved copy,","startTime":149.36363636363637,"endTime":153.0909090909091,"audioSegment":0},{"text":"and a page that couldn't be saved shows the reason.","startTime":153.0909090909091,"endTime":156.8181818181818,"audioSegment":0},{"text":"Only your own messages do this.","startTime":156.8181818181818,"endTime":160.54545454545456,"audioSegment":0},{"text":"An address in a gezel's message,","startTime":160.54545454545456,"endTime":164.27272727272728,"audioSegment":0},{"text":"an app's request or a scheduled nudge is never fetched this way.","startTime":164.27272727272728,"endTime":168,"audioSegment":0},{"text":"A page a gezel builds runs in a preview with no network below Unrestricted, so a 3D scene,","startTime":168,"endTime":171.74074074074073,"audioSegment":0},{"text":"a chart or a React interface had to be written from scratch, and a page that loaded a library from the web simply broke.","startTime":171.74074074074073,"endTime":175.4814814814815,"audioSegment":0},{"text":"Gezel now keeps popular libraries on your computer and hands them to the page from there: three.js for 3D,","startTime":175.4814814814815,"endTime":179.22222222222223,"audioSegment":0},{"text":"Chart.js and D3 for charts, and React, Preact and Vue for interfaces.","startTime":179.22222222222223,"endTime":182.96296296296296,"audioSegment":0},{"text":"The page names the library the ordinary way,","startTime":182.96296296296296,"endTime":186.7037037037037,"audioSegment":0},{"text":"by its package or its usual web address.","startTime":186.7037037037037,"endTime":190.44444444444446,"audioSegment":0},{"text":"Export the page and the library goes with it,","startTime":190.44444444444446,"endTime":194.1851851851852,"audioSegment":0},{"text":"so the copy opens anywhere.","startTime":194.1851851851852,"endTime":197.92592592592592,"audioSegment":0},{"text":"A library downloads the first time a page uses it,","startTime":197.92592592592592,"endTime":201.66666666666669,"audioSegment":0},{"text":"at the exact version Gezel's catalog lists, and is checked before any page loads it.","startTime":201.66666666666669,"endTime":205.40740740740742,"audioSegment":0},{"text":"Automatic downloads happen only when your security level lets Gezel use the network.","startTime":205.40740740740742,"endTime":209.14814814814815,"audioSegment":0},{"text":"Settings → More settings → Page libraries lists what's on this computer,","startTime":209.14814814814815,"endTime":212.88888888888889,"audioSegment":0},{"text":"downloads one ahead of time, removes one, or turns automatic downloads off.","startTime":212.88888888888889,"endTime":216.62962962962962,"audioSegment":0},{"text":"The Mac App Store and Microsoft Store versions come with a fixed set and never download.","startTime":216.62962962962962,"endTime":220.37037037037038,"audioSegment":0},{"text":"Gezels are told which libraries are on hand and stay with plain JavaScript unless one clearly helps.","startTime":220.37037037037038,"endTime":224.11111111111111,"audioSegment":0},{"text":"The chart and dashboard craftbooks can now draw with Chart.js instead of plotting axes by hand,","startTime":224.11111111111111,"endTime":227.85185185185185,"audioSegment":0},{"text":"and the game and app craftbooks may use a library where it fits.","startTime":227.85185185185185,"endTime":231.5925925925926,"audioSegment":0},{"text":"React pages written for Babel's in-browser compiler now run without downloading it,","startTime":231.5925925925926,"endTime":235.33333333333334,"audioSegment":0},{"text":"because Gezel compiles the page's JSX itself.","startTime":235.33333333333334,"endTime":239.07407407407408,"audioSegment":0},{"text":"React 19 is included,","startTime":239.07407407407408,"endTime":242.81481481481484,"audioSegment":0},{"text":"and a component file that uses JSX without importing React works as it does in a Vite project.","startTime":242.81481481481484,"endTime":246.55555555555554,"audioSegment":0},{"text":"To share a page, press the download arrow above it in the project's output pane,","startTime":246.55555555555554,"endTime":250.2962962962963,"audioSegment":0},{"text":"beside the button that opens it in your browser.","startTime":250.2962962962963,"endTime":254.03703703703704,"audioSegment":0},{"text":"One file (.html) puts the libraries,","startTime":254.03703703703704,"endTime":257.77777777777777,"audioSegment":0},{"text":"styles and images inside a single file that opens by double-clicking and can be emailed.","startTime":257.77777777777777,"endTime":261.51851851851853,"audioSegment":0},{"text":"Folder (.zip) keeps the files side by side, ready for a website.","startTime":261.51851851851853,"endTime":265.25925925925924,"audioSegment":0},{"text":"Either way, the libraries' license notices go with the copy.","startTime":265.25925925925924,"endTime":269,"audioSegment":0},{"text":"No developer app for calendars and Microsoft files.","startTime":269,"endTime":272.06976744186045,"audioSegment":0},{"text":"Connecting a Google or Microsoft calendar,","startTime":272.06976744186045,"endTime":275.13953488372096,"audioSegment":0},{"text":"OneDrive or SharePoint used to mean registering a developer app with Google or Microsoft first.","startTime":275.13953488372096,"endTime":278.2093023255814,"audioSegment":0},{"text":"In the desktop app these now connect through Gezel's own sign-in apps,","startTime":278.2093023255814,"endTime":281.27906976744185,"audioSegment":0},{"text":"both named \"Gezel (read-only)\", which can only read.","startTime":281.27906976744185,"endTime":284.3488372093023,"audioSegment":0},{"text":"The connect form shows which app it will use. Mail,","startTime":284.3488372093023,"endTime":287.4186046511628,"audioSegment":0},{"text":"Google Drive and services such as X and LinkedIn still need an app of your own.","startTime":287.4186046511628,"endTime":290.48837209302326,"audioSegment":0},{"text":"If you have saved one, it is still used,","startTime":290.48837209302326,"endTime":293.5581395348837,"audioSegment":0},{"text":"and Use Gezel's app switches back.","startTime":293.5581395348837,"endTime":296.62790697674416,"audioSegment":0},{"text":"Your saved app also serves mail and Drive, so Gezel first names the kinds of connection that would need it added again;","startTime":296.62790697674416,"endTime":299.69767441860466,"audioSegment":0},{"text":"connections you already have keep working.","startTime":299.69767441860466,"endTime":302.7674418604651,"audioSegment":0},{"text":"The right account.","startTime":302.7674418604651,"endTime":305.83720930232556,"audioSegment":0},{"text":"Google and Microsoft sign you in to whichever account your browser is already using,","startTime":305.83720930232556,"endTime":308.90697674418607,"audioSegment":0},{"text":"so a connection meant for one mailbox could end up copying another.","startTime":308.90697674418607,"endTime":311.9767441860465,"audioSegment":0},{"text":"Gezel now asks for the account named on the connection,","startTime":311.9767441860465,"endTime":315.04651162790697,"audioSegment":0},{"text":"checks which account actually signed in, and refuses the connection if they differ.","startTime":315.04651162790697,"endTime":318.1162790697674,"audioSegment":0},{"text":"The connection's row then reads \"Signed in as …\".","startTime":318.1162790697674,"endTime":321.1860465116279,"audioSegment":0},{"text":"A clearer Add connection.","startTime":321.1860465116279,"endTime":324.25581395348837,"audioSegment":0},{"text":"It is now a two-step dialog that groups services by kind (mail, calendars, files, code,","startTime":324.25581395348837,"endTime":327.3255813953488,"audioSegment":0},{"text":"social, the web), each with its own mark, and opens the setup form on its own page.","startTime":327.3255813953488,"endTime":330.3953488372093,"audioSegment":0},{"text":"Counts you can see.","startTime":330.3953488372093,"endTime":333.4651162790698,"audioSegment":0},{"text":"Each connection shows how many records it holds (\"1,204 emails\"),","startTime":333.4651162790698,"endTime":336.5348837209302,"audioSegment":0},{"text":"counting up while it syncs.","startTime":336.5348837209302,"endTime":339.6046511627907,"audioSegment":0},{"text":"Open shows its folder in the Artifacts tab.","startTime":339.6046511627907,"endTime":342.6744186046512,"audioSegment":0},{"text":"Offline isn't an error.","startTime":342.6744186046512,"endTime":345.74418604651163,"audioSegment":0},{"text":"On a plane or with the cable unplugged,","startTime":345.74418604651163,"endTime":348.8139534883721,"audioSegment":0},{"text":"every connection used to fail at once in red.","startTime":348.8139534883721,"endTime":351.8837209302326,"audioSegment":0},{"text":"Now a connection that can't reach its service reads \"Offline since 10:45 AM\" in gray,","startTime":351.8837209302326,"endTime":354.95348837209303,"audioSegment":0},{"text":"and a line above the list says everything already downloaded is still here.","startTime":354.95348837209303,"endTime":358.0232558139535,"audioSegment":0},{"text":"Connections catch up on their own within seconds of the network coming back.","startTime":358.0232558139535,"endTime":361.09302325581393,"audioSegment":0},{"text":"Removing can delete what was downloaded.","startTime":361.09302325581393,"endTime":364.16279069767444,"audioSegment":0},{"text":"Remove now offers Also delete what it downloaded,","startTime":364.16279069767444,"endTime":367.2325581395349,"audioSegment":0},{"text":"with how much that is.","startTime":367.2325581395349,"endTime":370.30232558139534,"audioSegment":0},{"text":"The box starts unchecked,","startTime":370.30232558139534,"endTime":373.37209302325584,"audioSegment":0},{"text":"because for a feed or a social account the copy may be the only one left.","startTime":373.37209302325584,"endTime":376.4418604651163,"audioSegment":0},{"text":"Read-only connections refresh at the default level.","startTime":376.4418604651163,"endTime":379.51162790697674,"audioSegment":0},{"text":"Connections that only read, such as websites, feeds and wikis,","startTime":379.51162790697674,"endTime":382.5813953488372,"audioSegment":0},{"text":"now refresh on their own at Lockdown, as long as Gezel may use the network for you.","startTime":382.5813953488372,"endTime":385.6511627906977,"audioSegment":0},{"text":"Connections that can send or post still refresh on their own only where external services are allowed.","startTime":385.6511627906977,"endTime":388.72093023255815,"audioSegment":0},{"text":"Email arrives more completely.","startTime":388.72093023255815,"endTime":391.7906976744186,"audioSegment":0},{"text":"A reply written below or between the quoted lines is kept, a forwarded message is kept whole,","startTime":391.7906976744186,"endTime":394.8604651162791,"audioSegment":0},{"text":"and mail that arrived during a long outage is no longer skipped when the connection catches up.","startTime":394.8604651162791,"endTime":397.93023255813955,"audioSegment":0},{"text":"An IMAP connection that drops partway through reconnects.","startTime":397.93023255813955,"endTime":401,"audioSegment":0},{"text":"Two of these change what you might notice: Claude Code and Codex gezels at the default level now work through Gezel's tools,","startTime":401,"endTime":404.46666666666664,"audioSegment":0},{"text":"and a send you didn't start waits in the outbox for your approval.","startTime":404.46666666666664,"endTime":407.93333333333334,"audioSegment":0},{"text":"Claude Code, Codex and Copilot keep to Gezel's tools below Unrestricted.","startTime":407.93333333333334,"endTime":411.4,"audioSegment":0},{"text":"These agents bring a shell of their own that runs as your account,","startTime":411.4,"endTime":414.8666666666667,"audioSegment":0},{"text":"so it could read anything you can, including Gezel's own connection details.","startTime":414.8666666666667,"endTime":418.3333333333333,"audioSegment":0},{"text":"Below Unrestricted, Gezel now turns that shell off, keeps Copilot's sandbox on,","startTime":418.3333333333333,"endTime":421.8,"audioSegment":0},{"text":"and runs Claude's bypass mode and Codex's Full mode as Edit.","startTime":421.8,"endTime":425.26666666666665,"audioSegment":0},{"text":"Those gezels run commands through Gezel's own tools instead.","startTime":425.26666666666665,"endTime":428.73333333333335,"audioSegment":0},{"text":"At every level, the settings files those agents read no longer hold a live Gezel credential,","startTime":428.73333333333335,"endTime":432.2,"audioSegment":0},{"text":"and Claude Code's file tools can't open the files that do.","startTime":432.2,"endTime":435.6666666666667,"audioSegment":0},{"text":"Unattended sends wait for you.","startTime":435.6666666666667,"endTime":439.1333333333333,"audioSegment":0},{"text":"A connection that can send or post now sends only when you press Approve or the gezel is working on a turn you started.","startTime":439.1333333333333,"endTime":442.6,"audioSegment":0},{"text":"A scheduled task by day, the night shift,","startTime":442.6,"endTime":446.06666666666666,"audioSegment":0},{"text":"a nudge or another gezel's request puts the message in the outbox for you to approve.","startTime":446.06666666666666,"endTime":449.5333333333333,"audioSegment":0},{"text":"Before, only the night shift waited.","startTime":449.5333333333333,"endTime":453,"audioSegment":0},{"text":"Previews stay in their pane.","startTime":453,"endTime":456.4666666666667,"audioSegment":0},{"text":"A page a gezel made can no longer replace the app's own window,","startTime":456.4666666666667,"endTime":459.93333333333334,"audioSegment":0},{"text":"even if you open a link to it from a chat.","startTime":459.93333333333334,"endTime":463.4,"audioSegment":0},{"text":"Git no longer runs a repository's hooks for gezels.","startTime":463.4,"endTime":466.8666666666667,"audioSegment":0},{"text":"A repository's settings can name programs for git to run: hooks,","startTime":466.8666666666667,"endTime":470.33333333333337,"audioSegment":0},{"text":"a file monitor, diff helpers.","startTime":470.33333333333337,"endTime":473.8,"audioSegment":0},{"text":"Gezel now turns them off whenever a gezel uses git or Gezel runs it on its own.","startTime":473.8,"endTime":477.26666666666665,"audioSegment":0},{"text":"A commit, merge or push you start still runs the repository's hooks,","startTime":477.26666666666665,"endTime":480.73333333333335,"audioSegment":0},{"text":"so Git LFS uploads and pre-commit checks work as before.","startTime":480.73333333333335,"endTime":484.2,"audioSegment":0},{"text":"A gezel's file tools never change anything inside a .git folder, under any spelling of the name,","startTime":484.2,"endTime":487.6666666666667,"audioSegment":0},{"text":"and when a gezel's script changes git's settings or hooks, Gezel puts them back.","startTime":487.6666666666667,"endTime":491.1333333333333,"audioSegment":0},{"text":"If a gezel's script makes a new repository,","startTime":491.1333333333333,"endTime":494.6,"audioSegment":0},{"text":"Gezel renames its .git folder to .git.gezel-set-aside so git doesn't read it, and you can rename it back.","startTime":494.6,"endTime":498.06666666666666,"audioSegment":0},{"text":"Clones at Lockdown come from public code hosts.","startTime":498.06666666666666,"endTime":501.5333333333333,"audioSegment":0},{"text":"At Lockdown, a gezel can still clone from GitHub, GitLab,","startTime":501.5333333333333,"endTime":505,"audioSegment":0},{"text":"Bitbucket, Codeberg, Gitea or SourceHut over https.","startTime":505,"endTime":508.4666666666667,"audioSegment":0},{"text":"Any other host needs web services on.","startTime":508.4666666666667,"endTime":511.93333333333334,"audioSegment":0},{"text":"Agent CLIs stay yours.","startTime":511.93333333333334,"endTime":515.4,"audioSegment":0},{"text":"Other apps that use Gezel's OpenAI-compatible or Ollama endpoints can no longer reach a Claude Code or Codex gezel,","startTime":515.4,"endTime":518.8666666666667,"audioSegment":0},{"text":"and a paired device can use only this computer's on-device models, not your cloud accounts.","startTime":518.8666666666667,"endTime":522.3333333333334,"audioSegment":0},{"text":"Machine-wide projects can't reach your files.","startTime":522.3333333333334,"endTime":525.8,"audioSegment":0},{"text":"A project that every account on the computer shares can no longer point your Gezel at your folders,","startTime":525.8,"endTime":529.2666666666667,"audioSegment":0},{"text":"saved sign-ins or connections, and nothing starts there without someone starting it.","startTime":529.2666666666667,"endTime":532.7333333333333,"audioSegment":0},{"text":"Terminal runs trust only catalog craftbooks.","startTime":532.7333333333333,"endTime":536.2,"audioSegment":0},{"text":"gezel do used to trust the scripts in any craftbook it started.","startTime":536.2,"endTime":539.6666666666667,"audioSegment":0},{"text":"A craftbook from your own folder or a project's,","startTime":539.6666666666667,"endTime":543.1333333333333,"audioSegment":0},{"text":"which gezels can edit, now needs --trust-scripts.","startTime":543.1333333333333,"endTime":546.6,"audioSegment":0},{"text":"A crafted data query can no longer run a command, a script can no longer write outside its folder through a link,","startTime":546.6,"endTime":550.0666666666666,"audioSegment":0},{"text":"and a crafted email can no longer stall Gezel for an hour.","startTime":550.0666666666666,"endTime":553.5333333333333,"audioSegment":0},{"text":"IMAP mail connections now insist on encryption.","startTime":553.5333333333333,"endTime":557,"audioSegment":0},{"text":"Activity now lists Needs you, then Working, Next and Ready,","startTime":557,"endTime":560.6129032258065,"audioSegment":0},{"text":"so work about to start sits right under the work running now.","startTime":560.6129032258065,"endTime":564.2258064516129,"audioSegment":0},{"text":"The engine status in the title bar reads \"Working\" instead of \"Generating\",","startTime":564.2258064516129,"endTime":567.8387096774194,"audioSegment":0},{"text":"and \"3 working\" when several chats share the engine.","startTime":567.8387096774194,"endTime":571.4516129032259,"audioSegment":0},{"text":"A step waiting for parts it sent out now reads \"working through it in parts (0 of 15 done)\" instead of naming a job it hasn't started.","startTime":571.4516129032259,"endTime":575.0645161290322,"audioSegment":0},{"text":"In a project where one gezel works alone,","startTime":575.0645161290322,"endTime":578.6774193548387,"audioSegment":0},{"text":"a task handed to a specialist is shown under that specialist's name.","startTime":578.6774193548387,"endTime":582.2903225806451,"audioSegment":0},{"text":"The Say hello button on crew cards in a thread is gone.","startTime":582.2903225806451,"endTime":585.9032258064516,"audioSegment":0},{"text":"The Artifacts tab now shows on every project,","startTime":585.9032258064516,"endTime":589.516129032258,"audioSegment":0},{"text":"since it is where finished work lands.","startTime":589.516129032258,"endTime":593.1290322580645,"audioSegment":0},{"text":"An app with nothing to keep there can still turn it off.","startTime":593.1290322580645,"endTime":596.741935483871,"audioSegment":0},{"text":"A step sent back by its check is retried with a shorter thinking budget,","startTime":596.741935483871,"endTime":600.3548387096774,"audioSegment":0},{"text":"so the fix starts sooner.","startTime":600.3548387096774,"endTime":603.9677419354839,"audioSegment":0},{"text":"Pull Request Review shows each patch line with its line number, a rejected finding names the rule it broke and quotes the words,","startTime":603.9677419354839,"endTime":607.5806451612904,"audioSegment":0},{"text":"and lockfiles and third-party notices are summarized by a script instead of read line by line.","startTime":607.5806451612904,"endTime":611.1935483870968,"audioSegment":0},{"text":"In a code project, fact checking no longer refuses line numbers or wording in quotation marks,","startTime":611.1935483870968,"endTime":614.8064516129032,"audioSegment":0},{"text":"and it stops asking for a file to be read again once every source has been read in full.","startTime":614.8064516129032,"endTime":618.4193548387096,"audioSegment":0},{"text":"On the smallest local models,","startTime":618.4193548387096,"endTime":622.0322580645161,"audioSegment":0},{"text":"the Illustrator and video roles keep their generation tools.","startTime":622.0322580645161,"endTime":625.6451612903226,"audioSegment":0},{"text":"New in the catalog: Spark-X2.6 4B, a small model for tool use,","startTime":625.6451612903226,"endTime":629.258064516129,"audioSegment":0},{"text":"coding and multi-step tasks, on the llama.cpp engine (3.5 GB download).","startTime":629.258064516129,"endTime":632.8709677419355,"audioSegment":0},{"text":"Reports and documents written on Gemma 4 E4B now get a second look before they reach you.","startTime":632.8709677419355,"endTime":636.483870967742,"audioSegment":0},{"text":"In the terminal,","startTime":636.483870967742,"endTime":640.0967741935484,"audioSegment":0},{"text":"first-run setup no longer offers a 153 MB download of optional engines when chat already works.","startTime":640.0967741935484,"endTime":643.7096774193549,"audioSegment":0},{"text":"gezel native install still adds them.","startTime":643.7096774193549,"endTime":647.3225806451612,"audioSegment":0},{"text":"In the phone app, Narrate's Pop out button is hidden,","startTime":647.3225806451612,"endTime":650.9354838709678,"audioSegment":0},{"text":"since the app can't open one.","startTime":650.9354838709678,"endTime":654.5483870967741,"audioSegment":0},{"text":"On a phone, a gezel asked to browse now says plainly that it can't open web pages in the app,","startTime":654.5483870967741,"endTime":658.1612903225806,"audioSegment":0},{"text":"instead of pointing you to a desktop Settings screen.","startTime":658.1612903225806,"endTime":661.7741935483871,"audioSegment":0},{"text":"A build step that doesn't include the page check no longer asks the gezel to run it.","startTime":661.7741935483871,"endTime":665.3870967741935,"audioSegment":0},{"text":"Document editor updated (Squisq 2.14.0), and catalog content (Gilde 0.3.14).","startTime":665.3870967741935,"endTime":669,"audioSegment":0},{"text":"New package: @bendyline/gezel-retrieval 1.0.0, a browser-safe retrieval index for documents an app owns,","startTime":669,"endTime":672.2777777777778,"audioSegment":0},{"text":"with SQLite FTS5 and optional vectors over node:sqlite or sqlite-wasm.","startTime":672.2777777777778,"endTime":675.5555555555555,"audioSegment":0},{"text":"@bendyline/gezel-capacitor adds createMobileTextEmbedder() for app-owned text embeddings,","startTime":675.5555555555555,"endTime":678.8333333333334,"audioSegment":0},{"text":"and the app SDK and phone retrieval accept app-owned knowledge passages beside catalog results.","startTime":678.8333333333334,"endTime":682.1111111111111,"audioSegment":0},{"text":"Spectral connectors now run Prismatic's published npm components,","startTime":682.1111111111111,"endTime":685.3888888888889,"audioSegment":0},{"text":"pinned by version and hash and downloaded when a connection is made (connectors:draft-spectral drafts a manifest).","startTime":685.3888888888889,"endTime":688.6666666666666,"audioSegment":0},{"text":"See docs/connectors.md and ADR 0033 in the repository.","startTime":688.6666666666666,"endTime":691.9444444444445,"audioSegment":0},{"text":"Observation-corpus tables can declare a dedupeKey for sources that deliver rows again.","startTime":691.9444444444445,"endTime":695.2222222222222,"audioSegment":0},{"text":"Page libraries come from a new catalog kind, page-library,","startTime":695.2222222222222,"endTime":698.5,"audioSegment":0},{"text":"which pins each library's npm release by hash.","startTime":698.5,"endTime":701.7777777777778,"audioSegment":0},{"text":"The logic that reads CDN addresses, builds import maps and exports pages is in @bendyline/gezel/pages,","startTime":701.7777777777778,"endTime":705.0555555555555,"audioSegment":0},{"text":"with zod as its only dependency, for other apps that let a model write pages.","startTime":705.0555555555555,"endTime":708.3333333333334,"audioSegment":0},{"text":"gezel page export <project> <path> <out> [--single] exports a page from the terminal.","startTime":708.3333333333334,"endTime":711.6111111111111,"audioSegment":0},{"text":"See docs/page-libraries.md and ADR 0034 in the repository.","startTime":711.6111111111111,"endTime":714.8888888888889,"audioSegment":0},{"text":"The /v1 streaming route no longer warns about a client that disconnects after the final chunk.","startTime":714.8888888888889,"endTime":718.1666666666666,"audioSegment":0},{"text":"Gezel's own builds no longer run onnxruntime-node's install script,","startTime":718.1666666666666,"endTime":721.4444444444445,"audioSegment":0},{"text":"so they never download its optional CUDA providers.","startTime":721.4444444444445,"endTime":724.7222222222222,"audioSegment":0},{"text":"An npm install of the service still runs it.","startTime":724.7222222222222,"endTime":728,"audioSegment":0},{"text":"Add a website to a project from Connections → Add connection → Websites,","startTime":728,"endTime":731.25,"audioSegment":0},{"text":"then open the project's Web pages view tab.","startTime":731.25,"endTime":734.5,"audioSegment":0},{"text":"Ask for a page with a 3D scene or a chart,","startTime":734.5,"endTime":737.75,"audioSegment":0},{"text":"then press the download arrow above it in the output pane to export it.","startTime":737.75,"endTime":741,"audioSegment":0},{"text":"Settings → More settings → Page libraries shows what's on this computer.","startTime":741,"endTime":744.25,"audioSegment":0},{"text":"If a Claude Code or Codex gezel needs its own shell,","startTime":744.25,"endTime":747.5,"audioSegment":0},{"text":"check your level in Settings → Security & compliance.","startTime":747.5,"endTime":750.75,"audioSegment":0},{"text":"Below Unrestricted, it now works through Gezel's tools.","startTime":750.75,"endTime":754,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26326 — 22 November 2026","subtitle":"A project can now follow web pages and keep its own copies of them, and a web address you write in a message is saved and handed to the gezel with your words. Pages a gezel builds can now use three.js, Chart.js, React and other popular libraries with no internet connection, and you can export a page to share it. Connecting a calendar, OneDrive or SharePoint no longer needs a developer app of your own, and connections now show plainly when you're offline instead of failing. Claude Code, Codex and Copilot gezels now run commands through Gezel's own tools unless your security level is Unrestricted.","ambientMotion":"zoomIn"}}</script>
