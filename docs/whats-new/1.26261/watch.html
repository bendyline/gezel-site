make first run work offline. The contract and examples are in Building connected apps with gezel-app-sdk.","Application tools cross the daemon boundary explicitly. A host registers a JSON-schema tool and handles the call in its own process; arguments are validated before they leave the daemon, disconnects have a bounded grace period, and a closed application cannot leave a tool hanging in the model's menu.","The App SDK has a smaller stable surface. Node, browser and host entry points are separated; request-shaped calls take AbortSignal; product access uses the typed client behind an approved product scope; and stateful grants require a verification code visible in the requesting application.","Knowledge catalogs gained a revised multilingual embedding profile. multilingual-e5-small@2 changes the sign-bit prefilter while keeping the same full vector space, so older catalogs remain readable and readers can tell which fast-search encoding a catalog carries.","Task and craftbook evaluation got stricter. Fixed-action reads can advance from durable evidence without another model turn, hand-off sends have bounded recovery, and pull-request-review batches retain their observations instead of grading only the final file."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":338,"duration":12,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":48,"column":4,"offset":7502},"end":{"line":48,"column":37,"offset":7535}}}],"position":{"start":{"line":48,"column":1,"offset":7499},"end":{"line":48,"column":37,"offset":7535}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Ask your meester for a PowerPoint or PDF and watch the planned route appear beside the composer before you send it. After the reply, expand ","position":{"start":{"line":50,"column":1,"offset":7537},"end":{"line":50,"column":141,"offset":7677}}},{"type":"strong","children":[{"type":"text","value":"Consulted sources","position":{"start":{"line":50,"column":143,"offset":7679},"end":{"line":50,"column":160,"offset":7696}}}],"position":{"start":{"line":50,"column":141,"offset":7677},"end":{"line":50,"column":162,"offset":7698}}},{"type":"text","value":" to see the exact excerpts that went into the answer and open the originals.","position":{"start":{"line":50,"column":162,"offset":7698},"end":{"line":50,"column":238,"offset":7774}}}],"position":{"start":{"line":50,"column":1,"offset":7537},"end":{"line":50,"column":238,"offset":7774}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Seven days after 1.26254, and this release makes longer pieces of work easier to start and easier to inspect: you can see where a request is going before you send it,","startTime":0,"endTime":6.4,"audioSegment":0},{"text":"search is better at finding the source you named, and command-line batches can stay with a task until it finishes.","startTime":6.4,"endTime":12.8,"audioSegment":0},{"text":"If you read only one thing: ask your meester — the guildmaster who coordinates your crew — for a PowerPoint,","startTime":12.8,"endTime":19.200000000000003,"audioSegment":0},{"text":"Word document, PDF report, MP4 or GIF and the composer now shows the planned route before you press Send.","startTime":19.200000000000003,"endTime":25.6,"audioSegment":0},{"text":"The same route guides the model to the procedure that can make the real file.","startTime":25.6,"endTime":32,"audioSegment":0},{"text":"Asking for a file used to have an awkward failure mode: the meester or project voorman (foreman) could understand that you wanted a presentation,","startTime":32,"endTime":36,"audioSegment":0},{"text":"inspect their own immediate tools, and conclude that making one was impossible — even though the right craftbook was already on the shelf.","startTime":36,"endTime":40,"audioSegment":0},{"text":"For clear requests,","startTime":40,"endTime":44,"audioSegment":0},{"text":"the composer now shows the route while you are still typing.","startTime":44,"endTime":48,"audioSegment":0},{"text":"Ask for a PowerPoint, Word document, PDF report,","startTime":48,"endTime":52,"audioSegment":0},{"text":"or an animated slideshow as MP4 or GIF and a small label names the planned output.","startTime":52,"endTime":56,"audioSegment":0},{"text":"Ask a coordinator to implement or fix code and it shows that the work will go to a Developer.","startTime":56,"endTime":60,"audioSegment":0},{"text":"Ordinary conversation stays ordinary and shows no label.","startTime":60,"endTime":64,"audioSegment":0},{"text":"That preview is not decoration.","startTime":64,"endTime":68,"audioSegment":0},{"text":"The same plan is attached when you press Send, narrows the turn to the exact procedure where the output is unambiguous,","startTime":68,"endTime":72,"audioSegment":0},{"text":"and gives the coordinator one corrective chance if it claims the capability is unavailable instead of starting the work.","startTime":72,"endTime":76,"audioSegment":0},{"text":"You see the decision before the model acts,","startTime":76,"endTime":80,"audioSegment":0},{"text":"and the model sees the same decision you saw.","startTime":80,"endTime":84,"audioSegment":0},{"text":"Knowledge search used to compare scores that did not mean the same thing.","startTime":84,"endTime":88,"audioSegment":0},{"text":"A vaguely related semantic match could outrank the document whose title exactly matched the question,","startTime":88,"endTime":92,"audioSegment":0},{"text":"and the fast first pass over a large catalog could discard the right passage before the more accurate comparison ever saw it.","startTime":92,"endTime":96,"audioSegment":0},{"text":"The search now combines title matches,","startTime":96,"endTime":100,"audioSegment":0},{"text":"body matches and semantic matches by their rank instead of pretending their raw scores are interchangeable.","startTime":100,"endTime":104,"audioSegment":0},{"text":"The binary first pass for multilingual catalogs was recalibrated as well.","startTime":104,"endTime":108,"audioSegment":0},{"text":"In practical terms,","startTime":108,"endTime":112,"audioSegment":0},{"text":"asking about a named person or work is much more likely to put that article first instead of three neighbouring articles that mention it.","startTime":112,"endTime":116,"audioSegment":0},{"text":"The answer is easier to audit too.","startTime":116,"endTime":120,"audioSegment":0},{"text":"Expand Consulted sources under a reply and you can see the exact excerpt that was placed in the model's context,","startTime":120,"endTime":124,"audioSegment":0},{"text":"its estimated token cost, and a button to open the source.","startTime":124,"endTime":128,"audioSegment":0},{"text":"The total includes the labels and safety framing around those excerpts,","startTime":128,"endTime":132,"audioSegment":0},{"text":"and the text is still marked as untrusted evidence rather than as instructions.","startTime":132,"endTime":136,"audioSegment":0},{"text":"gezel do is now usable as part of a real shell workflow.","startTime":136,"endTime":140.07142857142858,"audioSegment":0},{"text":"A craftbook is a saved recipe for a piece of work; the command accepts its positional or named parameters, can wait for the task,","startTime":140.07142857142858,"endTime":144.14285714285714,"audioSegment":0},{"text":"emits one machine-readable result with --json, and returns distinct exit codes for completion, cancellation, a task that needs help, and a timeout.","startTime":144.14285714285714,"endTime":148.21428571428572,"audioSegment":0},{"text":"A timeout stops waiting;","startTime":148.21428571428572,"endTime":152.28571428571428,"audioSegment":0},{"text":"it does not cancel the work in the daemon.","startTime":152.28571428571428,"endTime":156.35714285714286,"audioSegment":0},{"text":"You can also follow or recover work directly: gezel task wait, gezel task resume,","startTime":156.35714285714286,"endTime":160.42857142857142,"audioSegment":0},{"text":"and gezel task notes --warnings cover the ordinary unattended loop.","startTime":160.42857142857142,"endTime":164.5,"audioSegment":0},{"text":"Repository-owned .gezel/workflows/*.mjs drivers can coordinate several project craftbooks, checkpoint their task references,","startTime":164.5,"endTime":168.57142857142856,"audioSegment":0},{"text":"bound concurrency, and resume without turning that orchestration into model-authored code.","startTime":168.57142857142856,"endTime":172.64285714285714,"audioSegment":0},{"text":"The supporting controls are there now too.","startTime":172.64285714285714,"endTime":176.71428571428572,"audioSegment":0},{"text":"Provider credentials can be written from standard input or an environment variable without printing their values;","startTime":176.71428571428572,"endTime":180.78571428571428,"audioSegment":0},{"text":"local model context and concurrency can be bounded for a batch; project indexing can be paused when a generated dataset would only create background work.","startTime":180.78571428571428,"endTime":184.85714285714286,"audioSegment":0},{"text":"A command-line craftbook launch trusts the exact script snapshot it started with,","startTime":184.85714285714286,"endTime":188.92857142857142,"audioSegment":0},{"text":"and --strict-sandbox is available when the operating system must enforce the network boundary.","startTime":188.92857142857142,"endTime":193,"audioSegment":0},{"text":"Model memory waits distinguish a queue from a shortage.","startTime":193,"endTime":197.2941176470588,"audioSegment":0},{"text":"Work waiting behind another gezel-owned engine can remain queued until that work finishes; when an unrelated application is holding the missing memory,","startTime":197.2941176470588,"endTime":201.58823529411765,"audioSegment":0},{"text":"the request now fails in seconds with the amount needed and the amount available instead of waiting five minutes for a queue that cannot move.","startTime":201.58823529411765,"endTime":205.88235294117646,"audioSegment":0},{"text":"Child tasks tell the truth about their parent.","startTime":205.88235294117646,"endTime":210.1764705882353,"audioSegment":0},{"text":"A paused, completed or canceled parent now gives its children that effective state without rewriting their own records;","startTime":210.1764705882353,"endTime":214.47058823529412,"audioSegment":0},{"text":"the task view labels the relationship and prevents edits that could not take effect.","startTime":214.47058823529412,"endTime":218.76470588235293,"audioSegment":0},{"text":"Fan-out children also get useful titles such as their file batch or invoice client instead of a bare number.","startTime":218.76470588235293,"endTime":223.05882352941177,"audioSegment":0},{"text":"Office-document research steps stop rejecting the read they asked for.","startTime":223.05882352941177,"endTime":227.35294117647058,"audioSegment":0},{"text":"Opening a Word, PowerPoint, PDF or spreadsheet through the document reader now counts as acquiring the source,","startTime":227.35294117647058,"endTime":231.64705882352942,"audioSegment":0},{"text":"so a task no longer pauses after correctly reading a file through the only tool capable of opening it.","startTime":231.64705882352942,"endTime":235.94117647058823,"audioSegment":0},{"text":"Lists in replies stay lists.","startTime":235.94117647058823,"endTime":240.23529411764707,"audioSegment":0},{"text":"A short year or statistic inside a list no longer makes the whole block turn into one oversized statistic or flatten into a section heading.","startTime":240.23529411764707,"endTime":244.52941176470588,"audioSegment":0},{"text":"Local engines moved forward.","startTime":244.52941176470588,"endTime":248.8235294117647,"audioSegment":0},{"text":"llama.cpp is now v0.4.1, the native bundle is 0.1.43,","startTime":248.8235294117647,"endTime":253.11764705882354,"audioSegment":0},{"text":"and DwarfStar can use model-embedded multi-token prediction for catalog models that declare it, including Qwen 3.8 Flash Next and GLM 5.3.","startTime":253.11764705882354,"endTime":257.4117647058823,"audioSegment":0},{"text":"Memory-constrained machines also start DwarfStar with a more conservative context window.","startTime":257.4117647058823,"endTime":261.70588235294116,"audioSegment":0},{"text":"Catalog content moved from @bendyline/gilde 0.1.61 to 0.1.67.","startTime":261.70588235294116,"endTime":266,"audioSegment":0},{"text":"A connected application can now bring Gezel with it.","startTime":266,"endTime":269.7894736842105,"audioSegment":0},{"text":"@bendyline/gezel-app-sdk/host first connects to the user's running Gezel and can otherwise start an isolated daemon for the application.","startTime":269.7894736842105,"endTime":273.57894736842104,"audioSegment":0},{"text":"Its projects and gezels live under the application's own home,","startTime":273.57894736842104,"endTime":277.36842105263156,"audioSegment":0},{"text":"while installed model weights are reused rather than downloaded twice.","startTime":277.36842105263156,"endTime":281.1578947368421,"audioSegment":0},{"text":"ensureModel, ensureProject, project-scoped chats and app-owned tools cover the complete embedded flow;","startTime":281.1578947368421,"endTime":284.9473684210526,"audioSegment":0},{"text":"model bundles can make first run work offline.","startTime":284.9473684210526,"endTime":288.7368421052632,"audioSegment":0},{"text":"The contract and examples are in Building connected apps with gezel-app-sdk.","startTime":288.7368421052632,"endTime":292.5263157894737,"audioSegment":0},{"text":"Application tools cross the daemon boundary explicitly.","startTime":292.5263157894737,"endTime":296.3157894736842,"audioSegment":0},{"text":"A host registers a JSON-schema tool and handles the call in its own process; arguments are validated before they leave the daemon,","startTime":296.3157894736842,"endTime":300.10526315789474,"audioSegment":0},{"text":"disconnects have a bounded grace period, and a closed application cannot leave a tool hanging in the model's menu.","startTime":300.10526315789474,"endTime":303.89473684210526,"audioSegment":0},{"text":"The App SDK has a smaller stable surface.","startTime":303.89473684210526,"endTime":307.6842105263158,"audioSegment":0},{"text":"Node, browser and host entry points are separated; request-shaped calls take AbortSignal;","startTime":307.6842105263158,"endTime":311.4736842105263,"audioSegment":0},{"text":"product access uses the typed client behind an approved product scope; and stateful grants require a verification code visible in the requesting application.","startTime":311.4736842105263,"endTime":315.2631578947368,"audioSegment":0},{"text":"Knowledge catalogs gained a revised multilingual embedding profile.","startTime":315.2631578947368,"endTime":319.05263157894734,"audioSegment":0},{"text":"multilingual-e5-small@2 changes the sign-bit prefilter while keeping the same full vector space,","startTime":319.05263157894734,"endTime":322.8421052631579,"audioSegment":0},{"text":"so older catalogs remain readable and readers can tell which fast-search encoding a catalog carries.","startTime":322.8421052631579,"endTime":326.63157894736844,"audioSegment":0},{"text":"Task and craftbook evaluation got stricter.","startTime":326.63157894736844,"endTime":330.42105263157896,"audioSegment":0},{"text":"Fixed-action reads can advance from durable evidence without another model turn, hand-off sends have bounded recovery,","startTime":330.42105263157896,"endTime":334.2105263157895,"audioSegment":0},{"text":"and pull-request-review batches retain their observations instead of grading only the final file.","startTime":334.2105263157895,"endTime":338,"audioSegment":0},{"text":"Ask your meester for a PowerPoint or PDF and watch the planned route appear beside the composer before you send it.","startTime":338,"endTime":342,"audioSegment":0},{"text":"After the reply,","startTime":342,"endTime":346,"audioSegment":0},{"text":"expand Consulted sources to see the exact excerpts that went into the answer and open the originals.","startTime":346,"endTime":350,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26261 — 18 September 2026","subtitle":"Seven days after 1.26254, and this release makes longer pieces of work easier to start and easier to inspect: you can see where a request is going before you send it, search is better at finding the source you named, and command-line batches can stay with a task until it finishes.","ambientMotion":"zoomIn"}}</script>
