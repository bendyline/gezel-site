<script type="application/json" id="squisq-doc" data-squisq-doc="1">{"articleId":"whats-new/1.26320","duration":377,"blocks":[{"id":"126320-16-november-2026","startTime":0,"duration":22,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":1,"children":[{"type":"text","value":"1.26320 — 16 November 2026","position":{"start":{"line":1,"column":3,"offset":2},"end":{"line":1,"column":29,"offset":28}}}],"position":{"start":{"line":1,"column":1,"offset":0},"end":{"line":1,"column":29,"offset":28}}},"title":"1.26320 — 16 November 2026","contents":[{"type":"paragraph","children":[{"type":"text","value":"On a Windows or Linux PC with a graphics card, local models that don't fit on the card read long prompts faster, and on Windows models load faster too. You don't need to change a setting. On a Mac, an update now finishes by restarting into the new version. Documents keep the View menu choices you make, everywhere you open them, and several toolbars are rebuilt so each reads as one row.","position":{"start":{"line":3,"column":1,"offset":30},"end":{"line":3,"column":389,"offset":418}}}],"position":{"start":{"line":3,"column":1,"offset":30},"end":{"line":3,"column":389,"offset":418}}}],"children":[{"id":"faster-local-models-on-pcs-with-a-graphics-card","startTime":22,"duration":80,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Faster local models on PCs with a graphics card","position":{"start":{"line":5,"column":4,"offset":423},"end":{"line":5,"column":51,"offset":470}}}],"position":{"start":{"line":5,"column":1,"offset":420},"end":{"line":5,"column":51,"offset":470}}},"title":"Faster local models on PCs with a graphics card","contents":[{"type":"paragraph","children":[{"type":"text","value":"When a model is too big for your graphics card, part of it stays in your computer's ordinary memory, and the card copies that part across while it reads a long prompt. That part used to be read from the model file only as needed, which the card can copy only slowly. Gezel now reads it into memory the card can copy from directly.","position":{"start":{"line":7,"column":1,"offset":472},"end":{"line":7,"column":331,"offset":802}}}],"position":{"start":{"line":7,"column":1,"offset":472},"end":{"line":7,"column":331,"offset":802}}},{"type":"paragraph","children":[{"type":"text","value":"In our measurements on an AMD Radeon card, long prompts were read between a third faster and four and a half times faster, depending on the model. Qwen 3.8 Flash Next read them 2.6 times faster. Replies are written at the same speed as before.","position":{"start":{"line":9,"column":1,"offset":804},"end":{"line":9,"column":244,"offset":1047}}}],"position":{"start":{"line":9,"column":1,"offset":804},"end":{"line":9,"column":244,"offset":1047}}},{"type":"paragraph","children":[{"type":"text","value":"Memory used this way can't be moved out to disk when the computer runs short, so Gezel does this only when it knows exactly how much the model needs and that much memory is free, with 4 GB to spare. Otherwise the model loads as before. If a model fails to start this way, Gezel starts it the old way.","position":{"start":{"line":11,"column":1,"offset":1049},"end":{"line":11,"column":301,"offset":1349}}}],"position":{"start":{"line":11,"column":1,"offset":1049},"end":{"line":11,"column":301,"offset":1349}}},{"type":"paragraph","children":[{"type":"text","value":"On Windows, models are also read from disk a faster way. A 17 GB model that fits on the card loaded in 3.6 seconds instead of 8 to 11, and Qwen 3.8 Flash Next loaded in 16 seconds instead of 26.","position":{"start":{"line":13,"column":1,"offset":1351},"end":{"line":13,"column":195,"offset":1545}}}],"position":{"start":{"line":13,"column":1,"offset":1351},"end":{"line":13,"column":195,"offset":1545}}},{"type":"paragraph","children":[{"type":"text","value":"This applies to the llama.cpp engine on a Windows or Linux rt":{"line":47,"column":30,"offset":6259},"end":{"line":47,"column":38,"offset":6267}}}],"position":{"start":{"line":47,"column":28,"offset":6257},"end":{"line":47,"column":40,"offset":6269}}},{"type":"text","value":" no longer shows Write and Source tabs. Its formatting buttons stay.","position":{"start":{"line":47,"column":40,"offset":6269},"end":{"line":47,"column":108,"offset":6337}}}],"position":{"start":{"line":47,"column":3,"offset":6232},"end":{"line":47,"column":108,"offset":6337}}}],"position":{"start":{"line":47,"column":1,"offset":6230},"end":{"line":47,"column":108,"offset":6337}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"The AI button in the document editor now uses the same sparkles as DocBlocks.","position":{"start":{"line":48,"column":3,"offset":6340},"end":{"line":48,"column":80,"offset":6417}}}],"position":{"start":{"line":48,"column":3,"offset":6340},"end":{"line":48,"column":80,"offset":6417}}}],"position":{"start":{"line":48,"column":1,"offset":6338},"end":{"line":48,"column":80,"offset":6417}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Document editor updated (Squisq 2.13.17), and diagrams (Mermaid 11.17.2).","position":{"start":{"line":49,"column":3,"offset":6420},"end":{"line":49,"column":76,"offset":6493}}}],"position":{"start":{"line":49,"column":3,"offset":6420},"end":{"line":49,"column":76,"offset":6493}}}],"position":{"start":{"line":49,"column":1,"offset":6418},"end":{"line":49,"column":76,"offset":6493}}}],"position":{"start":{"line":40,"column":1,"offset":4898},"end":{"line":49,"column":76,"offset":6493}}}],"autoTemplate":true,"templateData":{"items":["Gemma 4 26B is now split correctly between a smaller graphics card and system memory. Gezel had miscounted about 8 GB of the model as being on the card, so its plan for where each part goes was wrong.","A media review whose check requires looking at the picture keeps the tool to look at it when the step is tried again. Without it, a reviewer refused to finish until the task paused.","When a step is finished twice in quick succession, with a file saved again in between, the second attempt is now judged on its own. It used to get the first attempt's verdict, such as a file \"not found\", and the step sat idle until the task paused.","With the Codex provider, time spent reconnecting after a dropped connection no longer counts against a turn's time limit, up to a bound. A turn that runs out of time while reconnecting is no longer reported as rate limited.","The seconds counter beside a reply that is still being written now shows only in debug mode. The notice that appears when a reply stalls still shows for everyone.","Home no longer shows a separate \"ready for you\" count. The Activity button in the title bar already counts finished work.","In Projects, the navigation rail folds to its icons while the project list is open, so only one list of projects shows at a time. Fold the project list and the rail comes back.","The description field in New task no longer shows Write and Source tabs. Its formatting buttons stay.","The AI button in the document editor now uses the same sparkles as DocBlocks.","Document editor updated (Squisq 2.13.17), and diagrams (Mermaid 11.17.2)."],"ordered":false,"title":"Smaller things"}},{"id":"for-developers","startTime":338,"duration":25,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"For developers","position":{"start":{"line":51,"column":4,"offset":6498},"end":{"line":51,"column":18,"offset":6512}}}],"position":{"start":{"line":51,"column":1,"offset":6495},"end":{"line":51,"column":18,"offset":6512}}},"title":"For developers","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"The container image is built from the npm release run's final commit instead of the CLI's tag, so it carries every package's version bump. The build stops if core's version at that commit differs from the one the published CLI depends on. See ","position":{"start":{"line":53,"column":3,"offset":6516},"end":{"line":53,"column":246,"offset":6759}}},{"type":"inlineCode","value":"docs/container.md","position":{"start":{"line":53,"column":246,"offset":6759},"end":{"line":53,"column":265,"offset":6778}}},{"type":"text","value":" in the repository.","position":{"start":{"line":53,"column":265,"offset":6778},"end":{"line":53,"column":284,"offset":6797}}}],"position":{"start":{"line":53,"column":3,"offset":6516},"end":{"line":53,"column":284,"offset":6797}}}],"position":{"start":{"line":53,"column":1,"offset":6514},"end":{"line":53,"column":284,"offset":6797}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"inlineCode","value":"@bendyline/gezel-capacitor","position":{"start":{"line":54,"column":3,"offset":6800},"end":{"line":54,"column":31,"offset":6828}}},{"type":"text","value":"'s bundled catalog now matches the pinned catalog content (gilde 0.3.10), where it had been left on 0.1.80. It now carries the docbench scores described for 1.26317, and adds LFM3 1.7B.","position":{"start":{"line":54,"column":31,"offset":6828},"end":{"line":54,"column":216,"offset":7013}}}],"position":{"start":{"line":54,"column":3,"offset":6800},"end":{"line":54,"column":216,"offset":7013}}}],"position":{"start":{"line":54,"column":1,"offset":6798},"end":{"line":54,"column":216,"offset":7013}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Hono updated to 4.13.16.","position":{"start":{"line":55,"column":3,"offset":7016},"end":{"line":55,"column":27,"offset":7040}}}],"position":{"start":{"line":55,"column":3,"offset":7016},"end":{"line":55,"column":27,"offset":7040}}}],"position":{"start":{"line":55,"column":1,"offset":7014},"end":{"line":55,"column":27,"offset":7040}}}],"position":{"start":{"line":53,"column":1,"offset":6514},"end":{"line":55,"column":27,"offset":7040}}}],"autoTemplate":true,"templateData":{"items":["The container image is built from the npm release run's final commit instead of the CLI's tag, so it carries every package's version bump. The build stops if core's version at that commit differs from the one the published CLI depends on. See docs/container.md in the repository.","@bendyline/gezel-capacitor's bundled catalog now matches the pinned catalog content (gilde 0.3.10), where it had been left on 0.1.80. It now carries the docbench scores described for 1.26317, and adds LFM3 1.7B.","Hono updated to 4.13.16."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":363,"duration":14,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":57,"column":4,"offset":7045},"end":{"line":57,"column":37,"offset":7078}}}],"position":{"start":{"line":57,"column":1,"offset":7042},"end":{"line":57,"column":37,"offset":7078}}},"title":"Things to see and do after update","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"If you run local models on a Windows or Linux PC with a graphics card, check that ","position":{"start":{"line":59,"column":3,"offset":7082},"end":{"line":59,"column":85,"offset":7164}}},{"type":"strong","children":[{"type":"text","value":"Model loading","position":{"start":{"line":59,"column":87,"offset":7166},"end":{"line":59,"column":100,"offset":7179}}}],"position":{"start":{"line":59,"column":85,"offset":7164},"end":{"line":59,"column":102,"offset":7181}}},{"type":"text","value":" under ","position":{"start":{"line":59,"column":102,"offset":7181},"end":{"line":59,"column":109,"offset":7188}}},{"type":"strong","children":[{"type":"text","value":"Settings → This PC (llama)","position":{"start":{"line":59,"column":111,"offset":7190},"end":{"line":59,"column":137,"offset":7216}}}],"position":{"start":{"line":59,"column":109,"offset":7188},"end":{"line":59,"column":139,"offset":7218}}},{"type":"text","value":" is on ","position":{"start":{"line":59,"column":139,"offset":7218},"end":{"line":59,"column":146,"offset":7225}}},{"type":"strong","children":[{"type":"text","value":"Auto","position":{"start":{"line":59,"column":148,"offset":7227},"end":{"line":59,"column":152,"offset":7231}}}],"position":{"start":{"line":59,"column":146,"offset":7225},"end":{"line":59,"column":154,"offset":7233}}},{"type":"text","value":".","position":{"start":{"line":59,"column":154,"offset":7233},"end":{"line":59,"column":155,"offset":7234}}}],"position":{"start":{"line":59,"column":3,"offset":7082},"end":{"line":59,"column":155,"offset":7234}}}],"position":{"start":{"line":59,"column":1,"offset":7080},"end":{"line":59,"column":155,"offset":7234}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Open a document and turn on the outline from its ","position":{"start":{"line":60,"column":3,"offset":7237},"end":{"line":60,"column":52,"offset":7286}}},{"type":"strong","children":[{"type":"text","value":"View","position":{"start":{"line":60,"column":54,"offset":7288},"end":{"line":60,"column":58,"offset":7292}}}],"position":{"start":{"line":60,"column":52,"offset":7286},"end":{"line":60,"column":60,"offset":7294}}},{"type":"text","value":" menu. It stays on everywhere you read your files.","position":{"start":{"line":60,"column":60,"offset":7294},"end":{"line":60,"column":110,"offset":7344}}}],"position":{"start":{"line":60,"column":3,"offset":7237},"end":{"line":60,"column":110,"offset":7344}}}],"position":{"start":{"line":60,"column":1,"offset":7235},"end":{"line":60,"column":110,"offset":7344}}}],"position":{"start":{"line":59,"column":1,"offset":7080},"end":{"line":60,"column":110,"offset":7344}}}],"autoTemplate":true,"templateData":{"items":["If you run local models on a Windows or Linux PC with a graphics card, check that Model loading under Settings → This PC (llama) is on Auto.","Open a document and turn on the outline from its View menu. It stays on everywhere you read your files."],"ordered":false,"title":"Things to see and do after update"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"On a Windows or Linux PC with a graphics card,","startTime":0,"endTime":3.6666666666666665,"audioSegment":0},{"text":"local models that don't fit on the card read long prompts faster, and on Windows models load faster too.","startTime":3.6666666666666665,"endTime":7.333333333333333,"audioSegment":0},{"text":"You don't need to change a setting. On a Mac,","startTime":7.333333333333333,"endTime":11,"audioSegment":0},{"text":"an update now finishes by restarting into the new version.","startTime":11,"endTime":14.666666666666666,"audioSegment":0},{"text":"Documents keep the View menu choices you make, everywhere you open them,","startTime":14.666666666666666,"endTime":18.333333333333332,"audioSegment":0},{"text":"and several toolbars are rebuilt so each reads as one row.","startTime":18.333333333333332,"endTime":22,"audioSegment":0},{"text":"When a model is too big for your graphics card, part of it stays in your computer's ordinary memory,","startTime":22,"endTime":25.636363636363637,"audioSegment":0},{"text":"and the card copies that part across while it reads a long prompt.","startTime":25.636363636363637,"endTime":29.272727272727273,"audioSegment":0},{"text":"That part used to be read from the model file only as needed,","startTime":29.272727272727273,"endTime":32.90909090909091,"audioSegment":0},{"text":"which the card can copy only slowly.","startTime":32.90909090909091,"endTime":36.54545454545455,"audioSegment":0},{"text":"Gezel now reads it into memory the card can copy from directly.","startTime":36.54545454545455,"endTime":40.18181818181818,"audioSegment":0},{"text":"In our measurements on an AMD Radeon card,","startTime":40.18181818181818,"endTime":43.81818181818181,"audioSegment":0},{"text":"long prompts were read between a third faster and four and a half times faster, depending on the model.","startTime":43.81818181818181,"endTime":47.45454545454545,"audioSegment":0},{"text":"Qwen 3.8 Flash Next read them 2.6 times faster.","startTime":47.45454545454545,"endTime":51.09090909090909,"audioSegment":0},{"text":"Replies are written at the same speed as before.","startTime":51.09090909090909,"endTime":54.72727272727273,"audioSegment":0},{"text":"Memory used this way can't be moved out to disk when the computer runs short,","startTime":54.72727272727273,"endTime":58.36363636363636,"audioSegment":0},{"text":"so Gezel does this only when it knows exactly how much the model needs and that much memory is free, with 4 GB to spare.","startTime":58.36363636363636,"endTime":62,"audioSegment":0},{"text":"Otherwise the model loads as before.","startTime":62,"endTime":65.63636363636363,"audioSegment":0},{"text":"If a model fails to start this way,","startTime":65.63636363636363,"endTime":69.27272727272728,"audioSegment":0},{"text":"Gezel starts it the old way.","startTime":69.27272727272728,"endTime":72.9090909090909,"audioSegment":0},{"text":"On Windows, models are also read from disk a faster way.","startTime":72.9090909090909,"endTime":76.54545454545455,"audioSegment":0},{"text":"A 17 GB model that fits on the card loaded in 3.6 seconds instead of 8 to 11,","startTime":76.54545454545455,"endTime":80.18181818181819,"audioSegment":0},{"text":"and Qwen 3.8 Flash Next loaded in 16 seconds instead of 26.","startTime":80.18181818181819,"endTime":83.81818181818181,"audioSegment":0},{"text":"This applies to the llama.cpp engine on a Windows or Linux PC whenever it runs on the graphics card,","startTime":83.81818181818181,"endTime":87.45454545454545,"audioSegment":0},{"text":"whether NVIDIA, AMD, or another card through Vulkan.","startTime":87.45454545454545,"endTime":91.0909090909091,"audioSegment":0},{"text":"Macs are unchanged.","startTime":91.0909090909091,"endTime":94.72727272727272,"audioSegment":0},{"text":"It happens when Model loading in Settings → This PC (llama) is on Auto, the default.","startTime":94.72727272727272,"endTime":98.36363636363636,"audioSegment":0},{"text":"A loading mode you chose there yourself still applies.","startTime":98.36363636363636,"endTime":102,"audioSegment":0},{"text":"On a Mac, an update installs through the macOS installer.","startTime":102,"endTime":105.75,"audioSegment":0},{"text":"Gezel used to hand the package over and hear nothing back: the installer replaced the app and restarted its background service while the window still said \"Opening installer…\".","startTime":105.75,"endTime":109.5,"audioSegment":0},{"text":"Now Gezel watches for the installer to finish its last step,","startTime":109.5,"endTime":113.25,"audioSegment":0},{"text":"then restarts into the new version on its own.","startTime":113.25,"endTime":117,"audioSegment":0},{"text":"While the installer is open, Home and Settings → About say that Gezel is installing,","startTime":117,"endTime":120.75,"audioSegment":0},{"text":"with a Show installer button in case its window went behind another one.","startTime":120.75,"endTime":124.5,"audioSegment":0},{"text":"Gezel doesn't check for other updates while one is installing.","startTime":124.5,"endTime":128.25,"audioSegment":0},{"text":"If the app was updated some other way, such as a package you opened yourself,","startTime":128.25,"endTime":132,"audioSegment":0},{"text":"Gezel says the new version is installed and offers Restart Gezel.","startTime":132,"endTime":135.75,"audioSegment":0},{"text":"Your crew, projects and chats are not affected either way.","startTime":135.75,"endTime":139.5,"audioSegment":0},{"text":"The version you update from runs the installer,","startTime":139.5,"endTime":143.25,"audioSegment":0},{"text":"so you'll see this starting with the update after this one.","startTime":143.25,"endTime":147,"audioSegment":0},{"text":"A file now opens with its outline hidden.","startTime":147,"endTime":150.75,"audioSegment":0},{"text":"Turn the outline on from the View menu and it stays on wherever you read your files: a project's files and Artifacts drawer,","startTime":150.75,"endTime":154.5,"audioSegment":0},{"text":"the Documents library, a document opened from outside Gezel, and a file a chat links to.","startTime":154.5,"endTime":158.25,"audioSegment":0},{"text":"Documents you already have open change too.","startTime":158.25,"endTime":162,"audioSegment":0},{"text":"The rest of the View menu (previews, the status bar, block tags,","startTime":162,"endTime":165.75,"audioSegment":0},{"text":"theme styling) and the Document or Block choice are remembered the same way, and they hold after a restart.","startTime":165.75,"endTime":169.5,"audioSegment":0},{"text":"Small editors, such as the message box and note fields,","startTime":169.5,"endTime":173.25,"audioSegment":0},{"text":"keep their own layout.","startTime":173.25,"endTime":177,"audioSegment":0},{"text":"Several toolbars had grown into rows of small boxes at different heights.","startTime":177,"endTime":180.45454545454547,"audioSegment":0},{"text":"They now follow one pattern:","startTime":180.45454545454547,"endTime":183.9090909090909,"audioSegment":0},{"text":"The message box.","startTime":183.9090909090909,"endTime":187.36363636363637,"audioSegment":0},{"text":"The attach buttons and Send now sit in a row under what you write,","startTime":187.36363636363637,"endTime":190.8181818181818,"audioSegment":0},{"text":"so you write first and send from below, and Tab moves in that order.","startTime":190.8181818181818,"endTime":194.27272727272728,"audioSegment":0},{"text":"The box's border turns copper while you are typing in it.","startTime":194.27272727272728,"endTime":197.72727272727272,"audioSegment":0},{"text":"In the terminal, Fire sits in the same place under the command. File panes.","startTime":197.72727272727272,"endTime":201.1818181818182,"audioSegment":0},{"text":"The title names the place: Artifacts drawer,","startTime":201.1818181818182,"endTime":204.63636363636363,"audioSegment":0},{"text":"or the folder's own name, with its full path when you point at it. New folder,","startTime":204.63636363636363,"endTime":208.0909090909091,"audioSegment":0},{"text":"New file and the fold arrow are quiet buttons beside the title.","startTime":208.0909090909091,"endTime":211.54545454545456,"audioSegment":0},{"text":"The view modes,","startTime":211.54545454545456,"endTime":215,"audioSegment":0},{"text":"show hidden files and the button that opens the folder in your file manager share one strip under it.","startTime":215,"endTime":218.45454545454544,"audioSegment":0},{"text":"When the pane is folded to its narrow rail,","startTime":218.45454545454544,"endTime":221.9090909090909,"audioSegment":0},{"text":"New file and the file-manager button stay at the bottom. Tasks.","startTime":221.9090909090909,"endTime":225.36363636363637,"audioSegment":0},{"text":"One group holds everything that decides which tasks are listed: One-time, Scheduled and Night Shift,","startTime":225.36363636363637,"endTime":228.8181818181818,"audioSegment":0},{"text":"then the project, status and assignee pickers, which turn the accent color while they narrow the list.","startTime":228.8181818181818,"endTime":232.27272727272728,"audioSegment":0},{"text":"New task stands alone at the end.","startTime":232.27272727272728,"endTime":235.72727272727272,"audioSegment":0},{"text":"On a task, the status buttons and the assignee share one group,","startTime":235.72727272727272,"endTime":239.1818181818182,"audioSegment":0},{"text":"and the filled button (Start task, or Try again on a paused task) always comes last.","startTime":239.1818181818182,"endTime":242.63636363636363,"audioSegment":0},{"text":"Discard on a draft no longer looks like a second Start button. Activity.","startTime":242.63636363636363,"endTime":246.0909090909091,"audioSegment":0},{"text":"Each question and each night's review is now its own card,","startTime":246.0909090909091,"endTime":249.54545454545456,"audioSegment":0},{"text":"so a stack of night reports no longer reads as one long document.","startTime":249.54545454545456,"endTime":253,"audioSegment":0},{"text":"Gemma 4 26B is now split correctly between a smaller graphics card and system memory.","startTime":253,"endTime":256.69565217391306,"audioSegment":0},{"text":"Gezel had miscounted about 8 GB of the model as being on the card,","startTime":256.69565217391306,"endTime":260.39130434782606,"audioSegment":0},{"text":"so its plan for where each part goes was wrong.","startTime":260.39130434782606,"endTime":264.0869565217391,"audioSegment":0},{"text":"A media review whose check requires looking at the picture keeps the tool to look at it when the step is tried again.","startTime":264.0869565217391,"endTime":267.7826086956522,"audioSegment":0},{"text":"Without it, a reviewer refused to finish until the task paused.","startTime":267.7826086956522,"endTime":271.47826086956525,"audioSegment":0},{"text":"When a step is finished twice in quick succession,","startTime":271.47826086956525,"endTime":275.17391304347825,"audioSegment":0},{"text":"with a file saved again in between, the second attempt is now judged on its own.","startTime":275.17391304347825,"endTime":278.8695652173913,"audioSegment":0},{"text":"It used to get the first attempt's verdict, such as a file \"not found\",","startTime":278.8695652173913,"endTime":282.5652173913044,"audioSegment":0},{"text":"and the step sat idle until the task paused.","startTime":282.5652173913044,"endTime":286.2608695652174,"audioSegment":0},{"text":"With the Codex provider,","startTime":286.2608695652174,"endTime":289.95652173913044,"audioSegment":0},{"text":"time spent reconnecting after a dropped connection no longer counts against a turn's time limit, up to a bound.","startTime":289.95652173913044,"endTime":293.6521739130435,"audioSegment":0},{"text":"A turn that runs out of time while reconnecting is no longer reported as rate limited.","startTime":293.6521739130435,"endTime":297.3478260869565,"audioSegment":0},{"text":"The seconds counter beside a reply that is still being written now shows only in debug mode.","startTime":297.3478260869565,"endTime":301.04347826086956,"audioSegment":0},{"text":"The notice that appears when a reply stalls still shows for everyone.","startTime":301.04347826086956,"endTime":304.7391304347826,"audioSegment":0},{"text":"Home no longer shows a separate \"ready for you\" count.","startTime":304.7391304347826,"endTime":308.4347826086956,"audioSegment":0},{"text":"The Activity button in the title bar already counts finished work.","startTime":308.4347826086956,"endTime":312.1304347826087,"audioSegment":0},{"text":"In Projects, the navigation rail folds to its icons while the project list is open,","startTime":312.1304347826087,"endTime":315.82608695652175,"audioSegment":0},{"text":"so only one list of projects shows at a time.","startTime":315.82608695652175,"endTime":319.52173913043475,"audioSegment":0},{"text":"Fold the project list and the rail comes back.","startTime":319.52173913043475,"endTime":323.2173913043478,"audioSegment":0},{"text":"The description field in New task no longer shows Write and Source tabs.","startTime":323.2173913043478,"endTime":326.9130434782609,"audioSegment":0},{"text":"Its formatting buttons stay.","startTime":326.9130434782609,"endTime":330.6086956521739,"audioSegment":0},{"text":"The AI button in the document editor now uses the same sparkles as DocBlocks.","startTime":330.6086956521739,"endTime":334.30434782608694,"audioSegment":0},{"text":"Document editor updated (Squisq 2.13.17), and diagrams (Mermaid 11.17.2).","startTime":334.30434782608694,"endTime":338,"audioSegment":0},{"text":"The container image is built from the npm release run's final commit instead of the CLI's tag,","startTime":338,"endTime":340.77777777777777,"audioSegment":0},{"text":"so it carries every package's version bump.","startTime":340.77777777777777,"endTime":343.55555555555554,"audioSegment":0},{"text":"The build stops if core's version at that commit differs from the one the published CLI depends on.","startTime":343.55555555555554,"endTime":346.3333333333333,"audioSegment":0},{"text":"See docs/container.md in the repository.","startTime":346.3333333333333,"endTime":349.1111111111111,"audioSegment":0},{"text":"@bendyline/gezel-capacitor's bundled catalog now matches the pinned catalog content (gilde 0.3.10),","startTime":349.1111111111111,"endTime":351.8888888888889,"audioSegment":0},{"text":"where it had been left on 0.1.80.","startTime":351.8888888888889,"endTime":354.6666666666667,"audioSegment":0},{"text":"It now carries the docbench scores described for 1.26317,","startTime":354.6666666666667,"endTime":357.44444444444446,"audioSegment":0},{"text":"and adds LFM3 1.7B.","startTime":357.44444444444446,"endTime":360.22222222222223,"audioSegment":0},{"text":"Hono updated to 4.13.16.","startTime":360.22222222222223,"endTime":363,"audioSegment":0},{"text":"If you run local models on a Windows or Linux PC with a graphics card,","startTime":363,"endTime":366.5,"audioSegment":0},{"text":"check that Model loading under Settings → This PC (llama) is on Auto.","startTime":366.5,"endTime":370,"audioSegment":0},{"text":"Open a document and turn on the outline from its View menu.","startTime":370,"endTime":373.5,"audioSegment":0},{"text":"It stays on everywhere you read your files.","startTime":373.5,"endTime":377,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26320 — 16 November 2026","subtitle":"On a Windows or Linux PC with a graphics card, local models that don't fit on the card read long prompts faster, and on Windows models load faster too. You don't need to change a setting. On a Mac, an update now finishes by restarting into the new version. Documents keep the View menu choices you make, everywhere you open them, and several toolbars are rebuilt so each reads as one row.","ambientMotion":"zoomIn"}}</script>
