lse,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Linux ","position":{"start":{"line":87,"column":5,"offset":11133},"end":{"line":87,"column":11,"offset":11139}}},{"type":"inlineCode","value":".deb","position":{"start":{"line":87,"column":11,"offset":11139},"end":{"line":87,"column":17,"offset":11145}}},{"type":"text","value":" packages are verified to be zstd-compressed","position":{"start":{"line":87,"column":17,"offset":11145},"end":{"line":87,"column":61,"offset":11189}}}],"position":{"start":{"line":87,"column":3,"offset":11131},"end":{"line":87,"column":63,"offset":11191}}},{"type":"text","value":" at release time, and release manifests are formatted by a script rather than by hand.","position":{"start":{"line":87,"column":63,"offset":11191},"end":{"line":87,"column":149,"offset":11277}}}],"position":{"start":{"line":87,"column":3,"offset":11131},"end":{"line":87,"column":149,"offset":11277}}}],"position":{"start":{"line":87,"column":1,"offset":11129},"end":{"line":87,"column":149,"offset":11277}}}],"position":{"start":{"line":81,"column":1,"offset":9783},"end":{"line":87,"column":149,"offset":11277}}}],"autoTemplate":true,"templateData":{"items":["Multi-turn file edits. MCP file-edit tools take partial: true to open a path as a draft: intermediate states are not validated, so a model can build a file larger than one turn's output — and advance_task_step / verify_outcome stay blocked until the file parses again.","Task gates got much stricter. Launch parameters interpolate through every gate field, an unresolved {{param}} is now an infrastructure error rather than a silent miss, gate attempt budgets survive self-loop reactivation, and a tool failure that never recovered is surfaced in the thread instead of being inferred from a stalled step.","Deterministic fan-out work moved out of prompts. publishCorpusBatches in the script standard library replaces asking a model to retype a batch manifest, and the fan-out input is checked against its source.","Catalog schemas have one export source plus a freshness test, so a core schema change can no longer drift from committed gilde schemas without failing.","Packaged POSIX launches reuse the installer's service tree when it matches the shipped bundle and is not writable by the calling account, instead of unpacking a byte-identical copy per account.","New endpoints: /api/ambient-dashboard, /api/storage/*, /api/vscode-setup, /api/opencode-setup, /api/pi-setup, all with client methods.","Linux .deb packages are verified to be zstd-compressed at release time, and release manifests are formatted by a script rather than by hand."],"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":552,"duration":22,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":89,"column":4,"offset":11282},"end":{"line":89,"column":37,"offset":11315}}}],"position":{"start":{"line":89,"column":1,"offset":11279},"end":{"line":89,"column":37,"offset":11315}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Three things are worth a visit. ","position":{"start":{"line":91,"column":1,"offset":11317},"end":{"line":91,"column":33,"offset":11349}}},{"type":"strong","children":[{"type":"text","value":"Settings → About","position":{"start":{"line":91,"column":35,"offset":11351},"end":{"line":91,"column":51,"offset":11367}}}],"position":{"start":{"line":91,"column":33,"offset":11349},"end":{"line":91,"column":53,"offset":11369}}},{"type":"text","value":" now tells you what gezel is using on disk, and it is worth a look if you have been downloading models. ","position":{"start":{"line":91,"column":53,"offset":11369},"end":{"line":91,"column":157,"offset":11473}}},{"type":"strong","children":[{"type":"text","value":"Settings → Ambient dashboard","position":{"start":{"line":91,"column":159,"offset":11475},"end":{"line":91,"column":187,"offset":11503}}}],"position":{"start":{"line":91,"column":157,"offset":11473},"end":{"line":91,"column":189,"offset":11505}}},{"type":"text","value":" is the new wallpaper feature, and it is off until you turn it on. And if you use VS Code, OpenCode or pi, ","position":{"start":{"line":91,"column":189,"offset":11505},"end":{"line":91,"column":296,"offset":11612}}},{"type":"strong","children":[{"type":"text","value":"Settings → Connected Apps","position":{"start":{"line":91,"column":298,"offset":11614},"end":{"line":91,"column":323,"offset":11639}}}],"position":{"start":{"line":91,"column":296,"offset":11612},"end":{"line":91,"column":325,"offset":11641}}},{"type":"text","value":" will put your own models in them in about one click.","position":{"start":{"line":91,"column":325,"offset":11641},"end":{"line":91,"column":378,"offset":11694}}}],"position":{"start":{"line":91,"column":1,"offset":11317},"end":{"line":91,"column":378,"offset":11694}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Five days since 1.26226, and a big five days.","startTime":0,"endTime":6.333333333333333,"audioSegment":0},{"text":"If you read only one thing: gezel can now paint a picture of your whole workshop onto your desktop wallpaper, you can finally see what is using your disk and get it back,","startTime":6.333333333333333,"endTime":12.666666666666666,"audioSegment":0},{"text":"and the models running on your own machine can be used from VS Code, OpenCode and pi without leaving those apps.","startTime":12.666666666666666,"endTime":19,"audioSegment":0},{"text":"This is new, and it is easier to see than to describe.","startTime":19,"endTime":23,"audioSegment":0},{"text":"Turn on Settings → Ambient dashboard and the meester — the gezel who acts as your guildmaster and front door —","startTime":23,"endTime":27,"audioSegment":0},{"text":"periodically composes a single-page summary of everything going on: your projects, what the crew has been doing, what is waiting on you.","startTime":27,"endTime":31,"audioSegment":0},{"text":"It renders to an image.","startTime":31,"endTime":35,"audioSegment":0},{"text":"On the desktop app, that image then becomes your wallpaper,","startTime":35,"endTime":39,"audioSegment":0},{"text":"and it keeps itself current.","startTime":39,"endTime":43,"audioSegment":0},{"text":"It is off by default and stays off until you ask,","startTime":43,"endTime":47,"audioSegment":0},{"text":"because each render costs a model call and a page render.","startTime":47,"endTime":51,"audioSegment":0},{"text":"When you do turn it on,","startTime":51,"endTime":55,"audioSegment":0},{"text":"gezel captures your existing wallpaper first and puts it back if you ever turn the feature off.","startTime":55,"endTime":59,"audioSegment":0},{"text":"It also takes the picture seriously.","startTime":59,"endTime":63,"audioSegment":0},{"text":"The image is built at your primary display's exact physical pixel size, so your desktop's Fill or Zoom setting cannot crop it,","startTime":63,"endTime":67,"audioSegment":0},{"text":"and the content is kept clear of menu bars, notches, docks and taskbars while the artwork still runs to the edges.","startTime":67,"endTime":71,"audioSegment":0},{"text":"There are eleven visual themes to pick from — the default is gezellig, a warm dark one —","startTime":71,"endTime":75,"audioSegment":0},{"text":"and you can choose the refresh interval, starting at every fifteen minutes.","startTime":75,"endTime":79,"audioSegment":0},{"text":"Gezel keeps models, engines, caches, projects and conversations on your computer, which is the point,","startTime":79,"endTime":83.0625,"audioSegment":0},{"text":"but until now the only way to find out what that cost you was to go looking in folders.","startTime":83.0625,"endTime":87.125,"audioSegment":0},{"text":"Settings → About now has a storage card that breaks the whole install down by category — downloaded models, native engines,","startTime":87.125,"endTime":91.1875,"audioSegment":0},{"text":"engine caches, toolsets, projects, gezels, documents, git checkouts, derived caches, backups — with a size against each. From there:","startTime":91.1875,"endTime":95.25,"audioSegment":0},{"text":"Clean up walks you through what is safe to remove, category by category,","startTime":95.25,"endTime":99.3125,"audioSegment":0},{"text":"with the space you would get back shown before you commit.","startTime":99.3125,"endTime":103.375,"audioSegment":0},{"text":"Anything gezel can rebuild on its own is offered first;","startTime":103.375,"endTime":107.4375,"audioSegment":0},{"text":"the things that are genuinely yours are the ones it asks hardest about.","startTime":107.4375,"endTime":111.5,"audioSegment":0},{"text":"Back up writes your crew, projects,","startTime":111.5,"endTime":115.5625,"audioSegment":0},{"text":"documents and settings to a single file you choose.","startTime":115.5625,"endTime":119.625,"audioSegment":0},{"text":"Restore reads one of those files back,","startTime":119.625,"endTime":123.6875,"audioSegment":0},{"text":"shows you exactly what it found and what it would change, and only then applies it.","startTime":123.6875,"endTime":127.75,"audioSegment":0},{"text":"If you use gezel from a terminal, the same three are there as gezel cleanup, gezel backup <file> and gezel restore <file>,","startTime":127.75,"endTime":131.8125,"audioSegment":0},{"text":"each with a preview and a confirmation before anything is written or deleted.","startTime":131.8125,"endTime":135.875,"audioSegment":0},{"text":"And if you ever uninstall gezel, the prompts now point you at both of these first,","startTime":135.875,"endTime":139.9375,"audioSegment":0},{"text":"rather than letting you find out afterwards.","startTime":139.9375,"endTime":144,"audioSegment":0},{"text":"The shared document library — the folder where you keep the things that should be true for every project,","startTime":144,"endTime":148,"audioSegment":0},{"text":"like a mission statement or house style — used to be indexed by a separate, thinner mechanism than your projects were. That is gone.","startTime":148,"endTime":152,"audioSegment":0},{"text":"The library is now a project in its own right,","startTime":152,"endTime":156,"audioSegment":0},{"text":"and inherits everything projects get.","startTime":156,"endTime":160,"audioSegment":0},{"text":"In practice that means library documents are searched the same way project files are: full content indexing, Office documents converted so their text is findable,","startTime":160,"endTime":164,"audioSegment":0},{"text":"meaning-based search alongside keyword search, a watcher that notices your edits, and idle-time enrichment.","startTime":164,"endTime":168,"audioSegment":0},{"text":"A Boekwachter — a librarian gezel — is recruited to the library once,","startTime":168,"endTime":172,"audioSegment":0},{"text":"and its presence is what opts the library into the parts that use a model.","startTime":172,"endTime":176,"audioSegment":0},{"text":"Two deliberate limits.","startTime":176,"endTime":180,"audioSegment":0},{"text":"The library cannot be deleted or archived,","startTime":180,"endTime":184,"audioSegment":0},{"text":"and it does not appear in your list of projects, because it is not a job you work on.","startTime":184,"endTime":188,"audioSegment":0},{"text":"And nothing gezel generates is ever written into your documents folder —","startTime":188,"endTime":192,"audioSegment":0},{"text":"the search index and any converted copies are kept in gezel's own home.","startTime":192,"endTime":196,"audioSegment":0},{"text":"That matters if your documents folder is synced to a cloud drive,","startTime":196,"endTime":200,"audioSegment":0},{"text":"which is a normal thing to want and was previously a way to get a database file synced across your machines.","startTime":200,"endTime":204,"audioSegment":0},{"text":"Alongside this,","startTime":204,"endTime":208,"audioSegment":0},{"text":"the file browsers throughout the app are now one thing rather than three.","startTime":208,"endTime":212,"audioSegment":0},{"text":"Documents, a project's workspace and a project's artifacts all use the same pane, so drag-and-drop import, resizing and collapsing,","startTime":212,"endTime":216,"audioSegment":0},{"text":"the list and grid views, previews for files that are not text, and editing with autosave work identically wherever you are.","startTime":216,"endTime":220,"audioSegment":0},{"text":"There is also a show hidden files toggle,","startTime":220,"endTime":224,"audioSegment":0},{"text":"and it remembers your choice.","startTime":224,"endTime":228,"audioSegment":0},{"text":"Gezel could already lend a model to Codex.","startTime":228,"endTime":232.14285714285714,"audioSegment":0},{"text":"Three more join it,","startTime":232.14285714285714,"endTime":236.28571428571428,"audioSegment":0},{"text":"each set up from Settings → Connected Apps with one button.","startTime":236.28571428571428,"endTime":240.42857142857144,"audioSegment":0},{"text":"VS Code needs no extension — it uses VS Code's own support for custom model endpoints,","startTime":240.42857142857144,"endTime":244.57142857142858,"audioSegment":0},{"text":"so your crew simply appears in VS Code's native model picker while VS Code keeps its own tools, permissions and conversations.","startTime":244.57142857142858,"endTime":248.71428571428572,"audioSegment":0},{"text":"Gezel adds exactly one provider entry to the profile you choose and leaves every other entry alone.","startTime":248.71428571428572,"endTime":252.85714285714286,"audioSegment":0},{"text":"One tradeoff is worth knowing before you press it: without an extension,","startTime":252.85714285714286,"endTime":257,"audioSegment":0},{"text":"VS Code cannot offer gezel its encrypted secret store, so the credential is written in plain text.","startTime":257,"endTime":261.14285714285717,"audioSegment":0},{"text":"Gezel keeps that credential inference-only — it can ask for a completion and list models,","startTime":261.14285714285717,"endTime":265.2857142857143,"audioSegment":0},{"text":"and it cannot read your projects, files, terminals, chats or settings — and you can revoke it on its own at any time.","startTime":265.2857142857143,"endTime":269.42857142857144,"audioSegment":0},{"text":"OpenCode and pi work the same way, and both offer a choice.","startTime":269.42857142857144,"endTime":273.57142857142856,"audioSegment":0},{"text":"By default gezel writes its own configuration file and hands you a command that points the tool at it for that run,","startTime":273.57142857142856,"endTime":277.7142857142857,"audioSegment":0},{"text":"touching nothing of yours.","startTime":277.7142857142857,"endTime":281.8571428571429,"audioSegment":0},{"text":"Or you can press Add to OpenCode / Add to pi,","startTime":281.8571428571429,"endTime":286,"audioSegment":0},{"text":"which installs one small gezel-owned file into that tool's own plugin folder so your crew is available in every session without a command.","startTime":286,"endTime":290.14285714285717,"audioSegment":0},{"text":"That file holds no password, does nothing when gezel is not running,","startTime":290.14285714285717,"endTime":294.2857142857143,"audioSegment":0},{"text":"and is removed when you remove the setup. For all four,","startTime":294.2857142857143,"endTime":298.42857142857144,"audioSegment":0},{"text":"gezel will not silently overwrite something it did not write.","startTime":298.42857142857144,"endTime":302.57142857142856,"audioSegment":0},{"text":"If a file was hand-edited or came from a different gezel installation,","startTime":302.57142857142856,"endTime":306.7142857142857,"audioSegment":0},{"text":"the card says Needs attention and does nothing until you pick Repair, which keeps the original beside it as a .backup.","startTime":306.7142857142857,"endTime":310.8571428571429,"audioSegment":0},{"text":"The full detail is in Connected apps.","startTime":310.8571428571429,"endTime":315,"audioSegment":0},{"text":"The model scorecard has a tenth entry, and it is the new best on the board: qwen3.8-27b-q4 scores 8.2 on the general set and 7.1 on the office-and-knowledge set,","startTime":315,"endTime":320.6666666666667,"audioSegment":0},{"text":"ahead of every other model measured on both.","startTime":320.6666666666667,"endTime":326.3333333333333,"audioSegment":0},{"text":"That is the follow-up promised in the last release, run the same way as the rest —","startTime":326.3333333333333,"endTime":332,"audioSegment":0},{"text":"every job three times on a real machine, checked by a program and read by a separate judge.","startTime":332,"endTime":337.6666666666667,"audioSegment":0},{"text":"Its speed is ordinary for its size, so the choice against something like gemma4-26b is still the usual one: gemma4-26b answers roughly four times faster,","startTime":337.6666666666667,"endTime":343.3333333333333,"audioSegment":0},{"text":"qwen3.8-27b answers considerably better.","startTime":343.3333333333333,"endTime":349,"audioSegment":0},{"text":"How we test models explains what these numbers do and do not tell you.","startTime":349,"endTime":354.6666666666667,"audioSegment":0},{"text":"Two accuracy fixes land with it.","startTime":354.6666666666667,"endTime":360.3333333333333,"audioSegment":0},{"text":"Gezel's estimate of how much memory a model will actually need is now measured rather than assumed on Apple Silicon,","startTime":360.3333333333333,"endTime":366,"audioSegment":0},{"text":"and on the other engines it accounts for the extra memory an image-capable model needs — so a model that fits now reliably fits, and one that does not is refused before it wastes your time.","startTime":366,"endTime":371.6666666666667,"audioSegment":0},{"text":"And on Apple Silicon, a model's private \"thinking\" no longer leaks into the answer you read, and no longer runs several times longer than it should have;","startTime":371.6666666666667,"endTime":377.3333333333333,"audioSegment":0},{"text":"on one measured model that was seven times more thinking than the same model on the other engine, for no benefit.","startTime":377.3333333333333,"endTime":383,"audioSegment":0},{"text":"Projects have icons.","startTime":383,"endTime":386.25,"audioSegment":0},{"text":"A small maker's mark by project type, inherited automatically and overridable per project,","startTime":386.25,"endTime":389.5,"audioSegment":0},{"text":"in the sidebar and everywhere a project is named.","startTime":389.5,"endTime":392.75,"audioSegment":0},{"text":"Messages gezel wrote to itself are labeled \"System\", not \"You\" —","startTime":392.75,"endTime":396,"audioSegment":0},{"text":"handoffs and dispatched work no longer look like something you typed.","startTime":396,"endTime":399.25,"audioSegment":0},{"text":"Search from the title bar opens instantly with a loading state, finds names before it finishes searching content,","startTime":399.25,"endTime":402.5,"audioSegment":0},{"text":"tells you when a lookup failed rather than showing an empty result, matches on a gezel's role as well as its name, and stops repeating the same memory snippet back at you.","startTime":402.5,"endTime":405.75,"audioSegment":0},{"text":"The History detail pane is readable.","startTime":405.75,"endTime":409,"audioSegment":0},{"text":"Labeled sections for context, details, changes and timing,","startTime":409,"endTime":412.25,"audioSegment":0},{"text":"with real dates and durations, instead of a block of raw data.","startTime":412.25,"endTime":415.5,"audioSegment":0},{"text":"Night Shift shows a tally of what the crew actually got through,","startTime":415.5,"endTime":418.75,"audioSegment":0},{"text":"both so far tonight and last night, in the moon menu.","startTime":418.75,"endTime":422,"audioSegment":0},{"text":"Task descriptions save as you type,","startTime":422,"endTime":425.25,"audioSegment":0},{"text":"like every other long-form editor in the app.","startTime":425.25,"endTime":428.5,"audioSegment":0},{"text":"No more losing a description to a missed Save button.","startTime":428.5,"endTime":431.75,"audioSegment":0},{"text":"File mentions in chat now cover workspace files, not only artifacts —","startTime":431.75,"endTime":435,"audioSegment":0},{"text":"gezel links what it names, and you can open it from the message.","startTime":435,"endTime":438.25,"audioSegment":0},{"text":"Live speed readings are exact,","startTime":438.25,"endTime":441.5,"audioSegment":0},{"text":"per model and per engine, rather than estimated.","startTime":441.5,"endTime":444.75,"audioSegment":0},{"text":"Changing a setting no longer kills a running model.","startTime":444.75,"endTime":448,"audioSegment":0},{"text":"Idle engines are released; work in progress is left alone.","startTime":448,"endTime":451.25,"audioSegment":0},{"text":"Only emergency stop and shutdown still stop everything,","startTime":451.25,"endTime":454.5,"audioSegment":0},{"text":"and if an engine does go away mid-answer the message now says whether gezel stopped it or it crashed.","startTime":454.5,"endTime":457.75,"audioSegment":0},{"text":"Models installed for the whole machine are shown as read-only rather than offering you a Delete that could not work.","startTime":457.75,"endTime":461,"audioSegment":0},{"text":"Preview panes follow your theme,","startTime":461,"endTime":464.25,"audioSegment":0},{"text":"including when it is set to follow the system.","startTime":464.25,"endTime":467.5,"audioSegment":0},{"text":"Voice output no longer hangs on a stalled load or stream;","startTime":467.5,"endTime":470.75,"audioSegment":0},{"text":"it gives up and says so.","startTime":470.75,"endTime":474,"audioSegment":0},{"text":"Folder moves keep a snapshot, listed in Settings with the details openable.","startTime":474,"endTime":477.25,"audioSegment":0},{"text":"A stale meester pointer now prefers an existing gezel who has the Meester role,","startTime":477.25,"endTime":480.5,"audioSegment":0},{"text":"instead of picking whoever came first.","startTime":480.5,"endTime":483.75,"audioSegment":0},{"text":"Refreshed editor and catalog content packages (squisq 2.8.0, gilde 0.1.36).","startTime":483.75,"endTime":487,"audioSegment":0},{"text":"Multi-turn file edits.","startTime":487,"endTime":491.0625,"audioSegment":0},{"text":"MCP file-edit tools take partial: true to open a path as a draft: intermediate states are not validated,","startTime":491.0625,"endTime":495.125,"audioSegment":0},{"text":"so a model can build a file larger than one turn's output — and advance_task_step / verify_outcome stay blocked until the file parses again.","startTime":495.125,"endTime":499.1875,"audioSegment":0},{"text":"Task gates got much stricter.","startTime":499.1875,"endTime":503.25,"audioSegment":0},{"text":"Launch parameters interpolate through every gate field, an unresolved {{param}} is now an infrastructure error rather than a silent miss,","startTime":503.25,"endTime":507.3125,"audioSegment":0},{"text":"gate attempt budgets survive self-loop reactivation, and a tool failure that never recovered is surfaced in the thread instead of being inferred from a stalled step.","startTime":507.3125,"endTime":511.375,"audioSegment":0},{"text":"Deterministic fan-out work moved out of prompts.","startTime":511.375,"endTime":515.4375,"audioSegment":0},{"text":"publishCorpusBatches in the script standard library replaces asking a model to retype a batch manifest,","startTime":515.4375,"endTime":519.5,"audioSegment":0},{"text":"and the fan-out input is checked against its source.","startTime":519.5,"endTime":523.5625,"audioSegment":0},{"text":"Catalog schemas have one export source plus a freshness test,","startTime":523.5625,"endTime":527.625,"audioSegment":0},{"text":"so a core schema change can no longer drift from committed gilde schemas without failing.","startTime":527.625,"endTime":531.6875,"audioSegment":0},{"text":"Packaged POSIX launches reuse the installer's service tree when it matches the shipped bundle and is not writable by the calling account,","startTime":531.6875,"endTime":535.75,"audioSegment":0},{"text":"instead of unpacking a byte-identical copy per account.","startTime":535.75,"endTime":539.8125,"audioSegment":0},{"text":"New endpoints: /api/ambient-dashboard, /api/storage/*, /api/vscode-setup, /api/opencode-setup, /api/pi-setup, all with client methods.","startTime":539.8125,"endTime":543.875,"audioSegment":0},{"text":"Linux .deb packages are verified to be zstd-compressed at release time,","startTime":543.875,"endTime":547.9375,"audioSegment":0},{"text":"and release manifests are formatted by a script rather than by hand.","startTime":547.9375,"endTime":552,"audioSegment":0},{"text":"Three things are worth a visit.","startTime":552,"endTime":555.1428571428571,"audioSegment":0},{"text":"Settings → About now tells you what gezel is using on disk,","startTime":555.1428571428571,"endTime":558.2857142857143,"audioSegment":0},{"text":"and it is worth a look if you have been downloading models.","startTime":558.2857142857143,"endTime":561.4285714285714,"audioSegment":0},{"text":"Settings → Ambient dashboard is the new wallpaper feature,","startTime":561.4285714285714,"endTime":564.5714285714286,"audioSegment":0},{"text":"and it is off until you turn it on.","startTime":564.5714285714286,"endTime":567.7142857142857,"audioSegment":0},{"text":"And if you use VS Code, OpenCode or pi,","startTime":567.7142857142857,"endTime":570.8571428571429,"audioSegment":0},{"text":"Settings → Connected Apps will put your own models in them in about one click.","startTime":570.8571428571429,"endTime":574,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26231 — 19 August 2026","subtitle":"Five days since 1.26226, and a big five days.","ambientMotion":"zoomIn"}}</script>
