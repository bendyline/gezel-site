fixes a specific old failure. A large table used to be pasted into the document as markdown, which is fine at twenty rows and hopeless at two thousand — the editor re-reads the whole document as you type, so a big table made writing sluggish and reading impossible. Anything past about a hundred rows now stays in its own file and appears as a grid.","position":{"start":{"line":13,"column":1,"offset":1004},"end":{"line":13,"column":365,"offset":1368}}}],"position":{"start":{"line":13,"column":1,"offset":1004},"end":{"line":13,"column":365,"offset":1368}}},{"type":"paragraph","children":[{"type":"text","value":"Workbooks are editable, not just readable. Type in a cell and the change is written back into the file behind the document, and only the sheet you touched is rewritten — charts, formatting, and everything else in the workbook survive byte-for-byte. Formula cells show in italic, edit as the formula rather than the result, and everything depending on them recalculates the moment you commit. Around 460 functions are covered, ","position":{"start":{"line":15,"column":1,"offset":1370},"end":{"line":15,"column":427,"offset":1796}}},{"type":"inlineCode","value":"XLOOKUP","position":{"start":{"line":15,"column":427,"offset":1796},"end":{"line":15,"column":436,"offset":1805}}},{"type":"text","value":" and ","position":{"start":{"line":15,"column":436,"offset":1805},"end":{"line":15,"column":441,"offset":1810}}},{"type":"inlineCode","value":"LET","position":{"start":{"line":15,"column":441,"offset":1810},"end":{"line":15,"column":446,"offset":1815}}},{"type":"text","value":" included; a workbook too big to recalculate inside a sensible budget drops back to editing values rather than locking up. You can paste a block copied straight out of Excel or Sheets and it lands as a single undo step, and the previous version of the file is kept before each save.","position":{"start":{"line":15,"column":446,"offset":1815},"end":{"line":15,"column":728,"offset":2097}}}],"position":{"s olumn":1,"offset":2454},"end":{"line":23,"column":199,"offset":2652}}}],"position":{"start":{"line":23,"column":1,"offset":2454},"end":{"line":23,"column":199,"offset":2652}}},{"type":"paragraph","children":[{"type":"text","value":"There are now two things where there used to be nothing useful. Beside the thread picker sits a small ring that fills as the thread does — click it and you get the real numbers, the model's capacity, and how full ","position":{"start":{"line":25,"column":1,"offset":2654},"end":{"line":25,"column":214,"offset":2867}}},{"type":"strong","children":[{"type":"text","value":"this thread","position":{"start":{"line":25,"column":216,"offset":2869},"end":{"line":25,"column":227,"offset":2880}}}],"position":{"start":{"line":25,"column":214,"offset":2867},"end":{"line":25,"column":229,"offset":2882}}},{"type":"text","value":" is. And when the thread reaches about 70% full, gezel summarizes the older part of it by itself and carries on, leaving a marker in the conversation saying so. Open the marker and you can read exactly what was kept: the decisions made, what you asked for, what has already been tried and didn't work, and what's still outstanding. That last part is the point — a summary that loses it makes the model repeat work you already watched it abandon.","position":{"start":{"line":25,"column":229,"offset":2882},"end":{"line":25,"column":674,"offset":3327}}}],"position":{"start":{"line":25,"column":1,"offset":2654},"end":{"line":25,"column":674,"offset":3327}}},{"type":"paragraph","children":[{"type":"text","value":"You can also run that collapse yourself, from ","position":{"start":{"line":27,"column":1,"offset":3329},"end":{"line":27,"column":47,"offset":3375}}},{"type":"strong","children":[{"type":"text","value":"Compact now","position":{"start":{"line":27,"column":49,"offset":3377},"end":{"line":27,"column":60,"offset":3388}}}],"position":{"start":{"line":27,"column":47,"offset":3375},"end":{"line":27,"column":62,"offset":3390}}},{"type":"text","value":" in the ring's popover, rather than sending a throwaway message and hoping the threshold trips. If it can't — the thread is mid-turn, or there is nothing old enough to summarize — it says so in a sentence, where the button is.","position":{"start":{"line":27,"column":62,"offset":3390},"end":{"line":27,"column":288,"offset":3616}}}],"position":{"start":{"line":27,"column":1,"offset":3329},"end":{"line":27,"column":288,"offset":3616}}},{"type":"paragraph","children":[{"type":"text","value":"The ring replaces a strip that used to run the width of the window telling you the model's capacity and gezel's policy, which were the same on the first turn and the fiftieth, and never once told you how full the thread was.","position":{"start":{"line":29,"column":1,"offset":3618},"end":{"line":29,"column":225,"offset":3842}}}],"position":{"start":{"line":29,"column":1,"offset":3618},"end":{"line":29,"column":225,"offset":3842}}}]},{"id":"an-unsent-message-is-a-thing-you-own","startTime":203,"duration":81,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"An unsent message is a thing you own","position":{"start":{"line":31,"column":4,"offset":3847},"end":{"line":31,"column":40,"offset":3883}}}],"position":{"start":{"line":31,"column":1,"offset":3844},"end":{"line":31,"column":40,"offset":3883}}},"title":"An unsent message is a thing you own","contents":[{"type":"paragraph","children":[{"type":"text","value":"A message you are still writing is now a real object with a place to live, not scratch in a box that empties when you look away.","position":{"start":{"line":33,"column":1,"offset":3885},"end":{"line":33,"column":129,"offset":4013}}}],"position":{"start":{"line":33,"column":1,"offset":3885},"end":{"line":33,"column":129,"offset":4013}}},{"type":"paragraph","children":[{"type":"text","value":"Drafts survive a restart. They keep their attachments. They appear in the thread picker — under " he composer changed alongside it, and you will notice the first one immediately:","position":{"start":{"line":37,"column":1,"offset":4644},"end":{"line":37,"column":99,"offset":4742}}}],"position":{"start":{"line":37,"column":1,"offset":4644},"end":{"line":37,"column":99,"offset":4742}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Enter now makes a new line. Shift+Enter sends.","position":{"start":{"line":39,"column":5,"offset":4748},"end":{"line":39,"column":51,"offset":4794}}}],"position":{"start":{"line":39,"column":3,"offset":4746},"end":{"line":39,"column":53,"offset":4796}}},{"type":"text","value":" It used to be the other way around, which meant writing anything longer than a sentence involved dodging the key that makes a paragraph. The terminal is unchanged — a command is a line, and a line ends with Enter.","position":{"start":{"line":39,"column":53,"offset":4796},"end":{"line":39,"column":267,"offset":5010}}}],"position":{"start":{"line":39,"column":3,"offset":4746},"end":{"line":39,"column":267,"offset":5010}}}],"position":{"start":{"line":39,"column":1,"offset":4744},"end":{"line":39,"column":267,"offset":5010}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The draft can take the window.","position":{"start":{"line":40,"column":5,"offset":5015},"end":{"line":40,"column":35,"offset":5045}}}],"position":{"start":{"line":40,"column":3,"offset":5013},"end":{"line":40,"column":37,"offset":5047}}},{"type":"text","value":" The key just left of Send grows the composer from its three-line strip to about four-fifths of the chat column, and back. Nothing else moves and nothing is lost; it's a size, not a mode, so it never has to be a decision.","position":{"start":{"line":40,"column":37,"offset":5047},"end":{"line":40,"column":258,"offset "children":[{"type":"text","value":"Roads also meet each other now. Streets used to stop a few units short of the road they turned onto, which is the single most artificial-looking thing a map can do.","position":{"start":{"line":48,"column":1,"offset":5957},"end":{"line":48,"column":165,"offset":6121}}}],"position":{"start":{"line":48,"column":1,"offset":5957},"end":{"line":48,"column":165,"offset":6121}}},{"type":"paragraph","children":[{"type":"text","value":"And a file's ","position":{"start":{"line":50,"column":1,"offset":6123},"end":{"line":50,"column":14,"offset":6136}}},{"type":"emphasis","children":[{"type":"text","value":"purpose","position":{"start":{"line":50,"column":15,"offset":6137},"end":{"line":50,"column":22,"offset":6144}}}],"position":{"start":{"line":50,"column":14,"offset":6136},"end":{"line":50,"column":23,"offset":6145}}},{"type":"text","value":" now decides what kind of place it gets, before anything else. Data files are fields, furrowed and under crop. Configuration is a signal tower — a squat municipal block with a glazed control cab on the roof. Stylesheets are parks, with lawns, paths, a flowerbed and a bandstand. Everything else is a building, as before. A big data fixture is a big field rather than the largest structure in town.","position":{"start":{"line":50,"column":23,"offset":6145},"end":{"line":50,"column":420,"offset":6542}}}],"position":{"start":{"line":50,"column":1,"offset":6123},"end":{"line":50,"column":420,"offset":6542}}}]},{"id":"knowledge-catalogs-opened-up","startTime":347,"duration":41,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Knowledge catalogs, opened up","position":{"start":{"line":52,"column":4,"offset":6547},"end":{"line":52,"column":33,"offset":6576}}}],"position":{"start":{"line":52,"column":1,"offset":6544},"end":{"line":52,"column":33,"offset":6576}}},"title":"Knowledge catalogs, opened up","contents":[{"type":"paragraph","child ":{"start":{"line":61,"column":3,"offset":7610},"end":{"line":61,"column":40,"offset":7647}}},{"type":"text","value":", with the ones you use most listed and any of them pinnable, plus a right-click route to the folder in Explorer or Finder.","position":{"start":{"line":61,"column":40,"offset":7647},"end":{"line":61,"column":163,"offset":7770}}}],"position":{"start":{"line":61,"column":3,"offset":7610},"end":{"line":61,"column":163,"offset":7770}}}],"position":{"start":{"line":61,"column":1,"offset":7608},"end":{"line":61,"column":163,"offset":7770}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Indexing stopped looking like a job you should worry about.","position":{"start":{"line":62,"column":5,"offset":7775},"end":{"line":62,"column":64,"offset":7834}}}],"position":{"start":{"line":62,"column":3,"offset":7773},"end":{"line":62,"column":66,"offset":7836}}},{"type":"text","value":" The background pass that reads your files used to appear in chat as a stream of engineering; it now settles into one quiet line saying what was read and when it finished.","position":{"start":{"line":62,"column":66,"offset":7836},"end":{"line":62,"column":237,"offset":8007}}}],"position":{"start":{"line":62,"column":3,"offset":7773},"end":{"line":62,"column":237,"offset":8007}}}],"position":{"start":{"line":62,"column":1,"offset":7771},"end":{"line":62,"column":237,"offset":8007}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A long conversation keeps its bearings.","position":{"start":{"line":63,"column":5,"offset":8012},"end":{"line":63,"column":44,"offset":8051}}}],"position":{"start":{"line":63,"column":3,"offset":8010},"end":{"line":63,"column":46,"offset":8053}}},{"type":"text","value":" A header stays at the top of the transcript naming the message the current stretch of work came from, so scrolling through a long turn doesn't leave you wondering what was asked.","position":{"start":{"line":63,"column":46,"offset":8053},"end":{"line":63,"column":225,"offset":8232}}}],"position":{"start":{"line":63,"column":3,"offset":8010},"end":{"line":63,"column":225,"offset":8232}}}],"position":{"start":{"line":63,"column":1,"offset":8008},"end":{"line":63,"column":225,"offset":8232}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Craftbook steps carry only the tools they need.","position":{"start":{"line":64,"column":5,"offset":8237},"end":{"line":64,"column":52,"offset":8284}}}],"position":{"start":{"line":64,"column":3,"offset":8235},"end":{"line":64,"column":54,"offset":8286}}},{"type":"text","value":" A ","position":{"start":{"line":64,"column":54,"offset":8286},"end":{"line":64,"column":57,"offset":8289}}},{"type":"strong","children":[{"type":"text","value":"craftbook","position":{"start":{"line":64,"column":59,"offset":8291},"end":{"line":64,"column":68,"offset":8300}}}],"position":{"start":{"line":64,"column":57,"offset":8289},"end":{"line":64,"column":70,"offset":8302}}},{"type":"text","value":" — a saved recipe for a piece of work — can now say per step which sets of tools it has no business touching, which keeps a model from wandering into browser automation when it was asked to write a paragraph.","position":{"start":{"line":64,"column":70,"offset":8302},"end":{"line":64,"column":278,"offset":8510}}}],"position":{"start":{"line":64,"column":3,"offset":8235},"end":{"line":64,"column":278,"offset":8510}}}],"position":{"start":{"line":64,"column":1,"offset":8233},"end":{"line":64,"column":278,"offset":8510}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Model downloads use Hugging Face's newer chunked transfer","position":{"start":{"line":65,"column":5,"offset":8515},"end":{"line":65,"column":62,"offset":8572}}}],"position":{"start":{"line":65,"column":3,"offset":8513},"end":{"line":65,"column":64,"offset":8574}}},{"type":"text","value":" where it's offered, which resumes more reliably on a bad connection.","position":{"start":{"line":65,"column":64,"offset":8574},"end":{"line":65,"column":133,"offset":8643}}}],"position":{"start":{"line":65,"column":3,"offset":8513},"end":{"line":65,"column":133,"offset":8643}}}],"position":{"start":{"line":65,"column":1,"offset":8511},"end":{"line":65,"column":133,"offset":8643}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A deliverable that must be a real file says so more firmly.","position":{"start":{"line":66,"column":5,"offset":8648},"end":{"line":66,"column":64,"offset":8707}}}],"position":{"start":{"line":66,"column":3,"offset":8646},"end":{"line":66,"column":66,"offset":8709}}},{"type":"text","value":" Asked for a ","position":{"start":{"line":66,"column":66,"offset":8709},"end":{"line":66,"column":79,"offset":8722}}},{"type":"inlineCode","value":".pptx","position":{"start":{"line":66,"column":79,"offset":8722},"end":{"line":66,"column":86,"offset":8729}}},{"type":"text","value":", a gezel is now told plainly that a markdown outline with the right name is not the thing, and to report itself blocked rather than substitute a format.","position":{"start":{"line":66,"column":86,"offset":8729},"end":{"line":66,"column":239,"offset":8882}}}],"position":{"start":{"line":66,"column":3,"offset":8646},"end":{"line":66,"column":239,"offset":8882}}}],"position":{"start":{"line":66,"column":1,"offset":8644},"end":{"line":66,"column":239,"offset":8882}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Nanbeige models are supported","position":{"start":{"line":67,"column":5,"offset":8887},"end":{"line":67,"column":34,"offset":8916}}}],"position":{"start":{"line":67,"column":3,"offset":8885},"end":{"line":67,"column":36,"offset":8918}}},{"type":"text","value":", and memory planning now accounts for models that run their layer stack more than once — the estimate used to come out several times too small on those.","position":{"start":{"line":67,"column":36,"offset":8918},"end":{"line":67,"column":189,"offset":9071}}}],"position":{"start":{"line":67,"column":3,"offset":8885},"end":{"line":67,"column":189,"offset":9071}}}],"position":{"start":{"line":67,"column":1,"offset":8883},"end":{"line":67,"column":189,"offset":9071}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Catalog content moved to ","position":{"start":{"line":68,"column":3,"offset":9074},"end":{"line":68,"column":28,"offset":9099}}},{"type":"inlineCode","value":"@bendyline/gilde","position":{"start":{"line":68,"column":28,"offset":9099},"end":{"line":68,"column":46,"offset":9117}}},{"type":"text","value":" 0.1.54, and the editor libraries to squisq 2.11.","position":{"start":{"line":68,"column":46,"offset":9117},"end":{"line":68,"column":95,"offset":9166}}}],"position":{"start":{"line":68,"column":3,"offset":9074},"end":{"line":68,"column":95,"offset":9166}}}],"position":{"start":{"line":68,"column":1,"offset":9072},"end":{"line":68,"column":95,"offset":9166}}}],"position":{"start":{"line":60,"column":1,"offset":7390},"end":{"line":68,"column":95,"offset":9166}}}],"autoTemplate":true,"templateData":{"items":["First run tells you what this is. The setup screen now carries the \"What is gezel?\" introduction beside it, rather than opening as a settings form and leaving the explanation somewhere you had to go looking for.","Your documents are in the sidebar, with the ones you use most listed and any of them pinnable, plus a right-click route to the folder in Explorer or Finder.","Indexing stopped looking like a job you should worry about. The background pass that reads your files used to appear in chat as a stream of engineering; it now settles into one quiet line saying what was read and when it finished.","A long conversation keeps its bearings. A header stays at the top of the transcript naming the message the current stretch of work came from, so scrolling through a long turn doesn't leave you wondering what was asked.","Craftbook steps carry only the tools they need. A craftbook — a saved recipe for a piece of work — can now say per step which sets of tools it has no business touching, which keeps a model from wandering into browser automation when it was asked to write a paragraph.","Model downloads use Hugging Face's newer chunked transfer where it's offered, which resumes more reliably on a bad connection.","A deliverable that must be a real file says so more firmly. Asked for a .pptx, a gezel is now told plainly that a markdown outline with the right name is not the thing, and to report itself blocked rather than substitute a format.","Nanbeige models are supported, and memory planning now accounts for models that run their layer stack more than once — the estimate used to come out several times too small on those.","Catalog content moved to @bendyline/gilde 0.1.54, and the editor libraries to squisq 2.11."],"title":"Smaller things"}},{"id":"for-developers","startTime":480,"duration":95,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"For developers","position":{"start":{"line":70,"column":4,"offset":9171},"end":{"line":70,"column":18,"offset":9185}}}],"position":{"start":{"line":70,"column":1,"offset":9168},"end":{"line":70,"column":18,"offset":9185}}},"title":"For developers","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"inlineCode","value":".gezk","position":{"start":{"line":72,"column":5,"offset":9191},"end":{"line":72,"column":12,"offset":9198}}},{"type":"text","value":" 0.5 is an open format","position":{"start":{"line":72,"column":12,"offset":9198},"end":{"line":72,"column":34,"offset":9220}}}],"position":{"start":{"line":72,"column":3,"offset":9189},"end":{"line":72,"column":36,"offset":9222}}},{"type":"text","value":", specified in a repository of its own: the spec under CC BY 4.0, JSON Schemas generated from the definitions, a conformance fixture with test vectors, and a Python reference reader. Vectors are plain BLOB tables rather than a pre-1.0 extension's private layout, archives store their entries uncompressed so builds are byte-identical, and references are publisher-qualified. There is no compatibility with the previous generation — a reader refuses it with a typed reason. ","position":{"start":{"line":72,"column":36,"offset":9222},"end":{"line":72,"column":509,"offset":9695}}},{"type":"inlineCode","value":"@bendyline/gezk","position":{"start":{"line":72,"column":509,"offset":9695},"end":{"line":72,"column":526,"offset":9712}}},{"type":"text","value":" is a new published package carrying the format alone, with no dependency on gezel; the reasoning is recorded in decision 0012.","position":{"start":{"line":72,"column":526,"offset":9712},"end":{"line":72,"column":653,"offset":9839}}}],"position":{"start":{"line":72,"column":3,"offset":9189},"end":{"line":72,"column":653,"offset":9839}}}],"position":{"start":{"line":72,"column":1,"offset":9187},"end":{"line":72,"column":653,"offset":9839}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Two store lanes exist","position":{"start":{"line":73,"column":5,"offset":9844},"end":{"line":73,"column":26,"offset":9865}}}],"position":{"start":{"line":73,"column":3,"offset":9842},"end":{"line":73,"column":28,"offset":9867}}},{"type":"text","value":", for the Microsoft Store and the Mac App Store, alongside the direct download rather than instead of it. Neither is submitted yet. They follow one rule with wide consequences: a store build may not download or install executable code, so engine downloads, the Copilot SDK, Playwright and npm installs are all refused by a distribution profile that sits beside the security policy and cannot be argued out of its own restrictions by an inherited environment variable. Model weights and catalogs are data, which is what makes a packed-in starter model legal — a store build answers its first prompt, speaks and transcribes with nothing downloaded.","position":{"start":{"line":73,"column":28,"offset":9867},"end":{"line":73,"column":674,"offset":10513}}}],"position":{"start":{"line":73,"column":3,"offset":9842},"end":{"line":73,"column":674,"offset":10513}}}],"position":{"start":{"line":73,"column":1,"offset":9840},"end":{"line":73,"column":674,"offset":10513}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Sessions record their parent.","position":{"start":{"line":74,"column":5,"offset":10518},"end":{"line":74,"column":34,"offset":10547}}}],"position":{"start":{"line":74,"column":3,"offset":10516},"end":{"line":74,"column":36,"offset":10549}}},{"type":"text","value":" A thread opened by a delegation, a consultation, a task entry or a handoff now stamps which session opened it, and each message stamps which session sent it, so a session tree reconstructs identically from a live timeline or from disk.","position":{"start":{"line":74,"column":36,"offset":10549},"end":{"line":74,"column":272,"offset":10785}}}],"position":{"start":{"line":74,"column":3,"offset":10516},"end":{"line":74,"column":272,"offset":10785}}}],"position":{"start":{"line":74,"column":1,"offset":10514},"end":{"line":74,"column":272,"offset":10785}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Eval runs record themselves","position":{"start":{"line":75,"column":5,"offset":10790},"end":{"line":75,"column":32,"offset":10817}}}],"position":{"start":{"line":75,"column":3,"offset":10788},"end":{"line":75,"column":34,"offset":10819}}},{"type":"text","value":" and distill into a scene-by-scene walkthrough in the eval viewer — the first thing built on run recordings.","position":{"start":{"line":75,"column":34,"offset":10819},"end":{"line":75,"column":142,"offset":10927}}}],"position":{"start":{"line":75,"column":3,"offset":10788},"end":{"line":75,"column":142,"offset":10927}}}],"position":{"start":{"line":75,"column":1,"offset":10786},"end":{"line":75,"column":142,"offset":10927}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A screenshot-grounded UX review of the whole app","position":{"start":{"line":76,"column":5,"offset":10932},"end":{"line":76,"column":53,"offset":10980}}}],"position":{"start":{"line":76,"column":3,"offset":10930},"end":{"line":76,"column":55,"offset":10982}}},{"type":"text","value":" was produced, driven by two new permanent Playwright specs that boot a genuinely fresh home and then build a warm world through the UI itself. Most of the interface changes above answer it.","position":{"start":{"line":76,"column":55,"offset":10982},"end":{"line":76,"column":245,"offset":11172}}}],"position":{"start":{"line":76,"column":3,"offset":10930},"end":{"line":76,"column":245,"offset":11172}}}],"position":{"start":{"line":76,"column":1,"offset":10928},"end":{"line":76,"column":245,"offset":11172}}}],"position":{"start":{"line":72,"column":1,"offset":9187},"end":{"line":76,"column":245,"offset":11172}}}],"autoTemplate":true,"templateData":{"items":[".gezk 0.5 is an open format, specified in a repository of its own: the spec under CC BY 4.0, JSON Schemas generated from the definitions, a conformance fixture with test vectors, and a Python reference reader. Vectors are plain BLOB tables rather than a pre-1.0 extension's private layout, archives store their entries uncompressed so builds are byte-identical, and references are publisher-qualified. There is no compatibility with the previous generation — a reader refuses it with a typed reason. @bendyline/gezk is a new published package carrying the format alone, with no dependency on gezel; the reasoning is recorded in decision 0012.","Two store lanes exist, for the Microsoft Store and the Mac App Store, alongside the direct download rather than instead of it. Neither is submitted yet. They follow one rule with wide consequences: a store build may not download or install executable code, so engine downloads, the Copilot SDK, Playwright and npm installs are all refused by a distribution profile that sits beside the security policy and cannot be argued out of its own restrictions by an inherited environment variable. Model weights and catalogs are data, which is what makes a packed-in starter model legal — a store build answers its first prompt, speaks and transcribes with nothing downloaded.","Sessions record their parent. A thread opened by a delegation, a consultation, a task entry or a handoff now stamps which session opened it, and each message stamps which session sent it, so a session tree reconstructs identically from a live timeline or from disk.","Eval runs record themselves and distill into a scene-by-scene walkthrough in the eval viewer — the first thing built on run recordings.","A screenshot-grounded UX review of the whole app was produced, driven by two new permanent Playwright specs that boot a genuinely fresh home and then build a warm world through the UI itself. Most of the interface changes above answer it."],"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":575,"duration":21,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":78,"column":4,"offset":11177},"end":{"line":78,"column":37,"offset":11210}}}],"position":{"start":{"line":78,"column":1,"offset":11174},"end":{"line":78,"column":37,"offset":11210}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Open a spreadsheet. Any ","position":{"start":{"line":80,"column":1,"offset":11212},"end":{"line":80,"column":25,"offset":11236}}},{"type":"inlineCode","value":".xlsx","position":{"start":{"line":80,"column":25,"offset":11236},"end":{"line":80,"column":32,"offset":11243}}},{"type":"text","value":" in a project or in your document library will do — it will look like a spreadsheet now, and you can sort it, filter it and type in it. And if you keep long conversations with a local model, look for the small ring beside the thread picker: it tells you how much room the thread has left, and gives you the button that makes more.","position":{"start":{"line":80,"column":32,"offset":11243},"end":{"line":80,"column":362,"offset":11573}}}],"position":{"start":{"line":80,"column":1,"offset":11212},"end":{"line":80,"column":362,"offset":11573}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Three days after 1.26244, and a short release by the calendar —","startTime":0,"endTime":4.75,"audioSegment":0},{"text":"but two of these change something you do every day, and one of them changes a key you press.","startTime":4.75,"endTime":9.5,"audioSegment":0},{"text":"If you read only one thing: a spreadsheet in gezel is now a spreadsheet on screen,","startTime":9.5,"endTime":14.25,"audioSegment":0},{"text":"with sortable columns, filters and cells you can type into, instead of a table flattened into prose.","startTime":14.25,"endTime":19,"audioSegment":0},{"text":"Last release taught your crew to count your data.","startTime":19,"endTime":23.153846153846153,"audioSegment":0},{"text":"This one lets you look at it.","startTime":23.153846153846153,"endTime":27.307692307692307,"audioSegment":0},{"text":"Open an .xlsx or a .csv — from a project's files,","startTime":27.307692307692307,"endTime":31.461538461538463,"audioSegment":0},{"text":"or from your document library — and you get a real grid. Columns sort.","startTime":31.461538461538463,"endTime":35.61538461538461,"audioSegment":0},{"text":"Each one has a filter with the operators you'd expect (contains, starts with, greater than,","startTime":35.61538461538461,"endTime":39.769230769230774,"audioSegment":0},{"text":"is empty) and a picker listing the values actually in that column, so you don't have to remember how a region was spelled.","startTime":39.769230769230774,"endTime":43.92307692307693,"audioSegment":0},{"text":"It scrolls a hundred thousand rows without complaining,","startTime":43.92307692307693,"endTime":48.07692307692308,"audioSegment":0},{"text":"because the rows never enter the document: the file stays where it is and the document carries a reference to it.","startTime":48.07692307692308,"endTime":52.23076923076923,"audioSegment":0},{"text":"That last part fixes a specific old failure.","startTime":52.23076923076923,"endTime":56.38461538461539,"audioSegment":0},{"text":"A large table used to be pasted into the document as markdown, which is fine at twenty rows and hopeless at two thousand —","startTime":56.38461538461539,"endTime":60.53846153846154,"audioSegment":0},{"text":"the editor re-reads the whole document as you type, so a big table made writing sluggish and reading impossible.","startTime":60.53846153846154,"endTime":64.6923076923077,"audioSegment":0},{"text":"Anything past about a hundred rows now stays in its own file and appears as a grid.","startTime":64.6923076923077,"endTime":68.84615384615385,"audioSegment":0},{"text":"Workbooks are editable, not just readable.","startTime":68.84615384615385,"endTime":73,"audioSegment":0},{"text":"Type in a cell and the change is written back into the file behind the document, and only the sheet you touched is rewritten —","startTime":73,"endTime":77.15384615384616,"audioSegment":0},{"text":"charts, formatting, and everything else in the workbook survive byte-for-byte.","startTime":77.15384615384616,"endTime":81.30769230769232,"audioSegment":0},{"text":"Formula cells show in italic, edit as the formula rather than the result,","startTime":81.30769230769232,"endTime":85.46153846153847,"audioSegment":0},{"text":"and everything depending on them recalculates the moment you commit.","startTime":85.46153846153847,"endTime":89.61538461538463,"audioSegment":0},{"text":"Around 460 functions are covered, XLOOKUP and LET included;","startTime":89.61538461538463,"endTime":93.76923076923077,"audioSegment":0},{"text":"a workbook too big to recalculate inside a sensible budget drops back to editing values rather than locking up.","startTime":93.76923076923077,"endTime":97.92307692307693,"audioSegment":0},{"text":"You can paste a block copied straight out of Excel or Sheets and it lands as a single undo step,","startTime":97.92307692307693,"endTime":102.07692307692308,"audioSegment":0},{"text":"and the previous version of the file is kept before each save.","startTime":102.07692307692308,"endTime":106.23076923076924,"audioSegment":0},{"text":"CSV files are read-only for now.","startTime":106.23076923076924,"endTime":110.38461538461539,"audioSegment":0},{"text":"They open in the same grid and sort and filter the same way,","startTime":110.38461538461539,"endTime":114.53846153846155,"audioSegment":0},{"text":"but writing your edits back out to the .csv itself is still to come.","startTime":114.53846153846155,"endTime":118.69230769230771,"audioSegment":0},{"text":"Most of this comes from the editor gezel is built on,","startTime":118.69230769230771,"endTime":122.84615384615385,"audioSegment":0},{"text":"which also brought sharper contrast in its menus and a proper right-click menu of its own.","startTime":122.84615384615385,"endTime":127.00000000000001,"audioSegment":0},{"text":"A conversation with a local model has a ceiling.","startTime":127,"endTime":131.22222222222223,"audioSegment":0},{"text":"Every message, every file it read, and the standing instructions it carries all sit in the same window,","startTime":131.22222222222223,"endTime":135.44444444444446,"audioSegment":0},{"text":"and when that window fills, the thread stops.","startTime":135.44444444444446,"endTime":139.66666666666666,"audioSegment":0},{"text":"There are now two things where there used to be nothing useful.","startTime":139.66666666666666,"endTime":143.88888888888889,"audioSegment":0},{"text":"Beside the thread picker sits a small ring that fills as the thread does —","startTime":143.88888888888889,"endTime":148.11111111111111,"audioSegment":0},{"text":"click it and you get the real numbers, the model's capacity, and how full this thread is.","startTime":148.11111111111111,"endTime":152.33333333333334,"audioSegment":0},{"text":"And when the thread reaches about 70% full, gezel summarizes the older part of it by itself and carries on,","startTime":152.33333333333334,"endTime":156.55555555555554,"audioSegment":0},{"text":"leaving a marker in the conversation saying so.","startTime":156.55555555555554,"endTime":160.77777777777777,"audioSegment":0},{"text":"Open the marker and you can read exactly what was kept: the decisions made, what you asked for,","startTime":160.77777777777777,"endTime":165,"audioSegment":0},{"text":"what has already been tried and didn't work, and what's still outstanding.","startTime":165,"endTime":169.22222222222223,"audioSegment":0},{"text":"That last part is the point —","startTime":169.22222222222223,"endTime":173.44444444444446,"audioSegment":0},{"text":"a summary that loses it makes the model repeat work you already watched it abandon.","startTime":173.44444444444446,"endTime":177.66666666666669,"audioSegment":0},{"text":"You can also run that collapse yourself, from Compact now in the ring's popover,","startTime":177.66666666666669,"endTime":181.88888888888889,"audioSegment":0},{"text":"rather than sending a throwaway message and hoping the threshold trips.","startTime":181.88888888888889,"endTime":186.11111111111111,"audioSegment":0},{"text":"If it can't — the thread is mid-turn, or there is nothing old enough to summarize —","startTime":186.11111111111111,"endTime":190.33333333333334,"audioSegment":0},{"text":"it says so in a sentence, where the button is.","startTime":190.33333333333334,"endTime":194.55555555555554,"audioSegment":0},{"text":"The ring replaces a strip that used to run the width of the window telling you the model's capacity and gezel's policy,","startTime":194.55555555555554,"endTime":198.77777777777777,"audioSegment":0},{"text":"which were the same on the first turn and the fiftieth, and never once told you how full the thread was.","startTime":198.77777777777777,"endTime":203,"audioSegment":0},{"text":"A message you are still writing is now a real object with a place to live,","startTime":203,"endTime":206.375,"audioSegment":0},{"text":"not scratch in a box that empties when you look away.","startTime":206.375,"endTime":209.75,"audioSegment":0},{"text":"Drafts survive a restart.","startTime":209.75,"endTime":213.125,"audioSegment":0},{"text":"They keep their attachments.","startTime":213.125,"endTime":216.5,"audioSegment":0},{"text":"They appear in the thread picker — under Not sent yet if they aren't attached to a conversation yet,","startTime":216.5,"endTime":219.875,"audioSegment":0},{"text":"or behind a thread's own Drafts key if they are — so a brief you started yesterday is where you'd look for it rather than gone.","startTime":219.875,"endTime":223.25,"audioSegment":0},{"text":"The picker's + New still starts a conversation; the new + Draft starts only a message,","startTime":223.25,"endTime":226.625,"audioSegment":0},{"text":"because those are different intentions and running them together is what left empty threads lying around.","startTime":226.625,"endTime":230,"audioSegment":0},{"text":"While you type,","startTime":230,"endTime":233.375,"audioSegment":0},{"text":"a quiet dot in the toolbar is the whole of the save indicator: someone writing should not be told that writing is working.","startTime":233.375,"endTime":236.75,"audioSegment":0},{"text":"Two things about the composer changed alongside it,","startTime":236.75,"endTime":240.125,"audioSegment":0},{"text":"and you will notice the first one immediately:","startTime":240.125,"endTime":243.5,"audioSegment":0},{"text":"Enter now makes a new line.","startTime":243.5,"endTime":246.875,"audioSegment":0},{"text":"Shift+Enter sends.","startTime":246.875,"endTime":250.25,"audioSegment":0},{"text":"It used to be the other way around,","startTime":250.25,"endTime":253.625,"audioSegment":0},{"text":"which meant writing anything longer than a sentence involved dodging the key that makes a paragraph.","startTime":253.625,"endTime":257,"audioSegment":0},{"text":"The terminal is unchanged — a command is a line,","startTime":257,"endTime":260.375,"audioSegment":0},{"text":"and a line ends with Enter.","startTime":260.375,"endTime":263.75,"audioSegment":0},{"text":"The draft can take the window.","startTime":263.75,"endTime":267.125,"audioSegment":0},{"text":"The key just left of Send grows the composer from its three-line strip to about four-fifths of the chat column, and back.","startTime":267.125,"endTime":270.5,"audioSegment":0},{"text":"Nothing else moves and nothing is lost; it's a size,","startTime":270.5,"endTime":273.875,"audioSegment":0},{"text":"not a mode, so it never has to be a decision.","startTime":273.875,"endTime":277.25,"audioSegment":0},{"text":"Sent drafts are cleared out after 90 days by default.","startTime":277.25,"endTime":280.625,"audioSegment":0},{"text":"Unsent ones are never deleted on their own.","startTime":280.625,"endTime":284,"audioSegment":0},{"text":"The Village — the map that draws your codebase as a town —","startTime":284,"endTime":287.3157894736842,"audioSegment":0},{"text":"used to run every street as the same strip of ground.","startTime":287.3157894736842,"endTime":290.63157894736844,"audioSegment":0},{"text":"Now each one is built to the traffic it carries: the files fronting it,","startTime":290.63157894736844,"endTime":293.94736842105266,"audioSegment":0},{"text":"the connections travelling along it, and everything leaving the folders it bounds.","startTime":293.94736842105266,"endTime":297.2631578947368,"audioSegment":0},{"text":"That comes out as eight grades,","startTime":297.2631578947368,"endTime":300.57894736842104,"audioSegment":0},{"text":"from a dirt track with grass verges up to a broad avenue with a trolley line, rails and overhead wire.","startTime":300.57894736842104,"endTime":303.89473684210526,"audioSegment":0},{"text":"The road you see is a reading of how busy that part of the codebase actually is,","startTime":303.89473684210526,"endTime":307.2105263157895,"audioSegment":0},{"text":"and at street zoom there are carts, walkers and trolleys moving along it.","startTime":307.2105263157895,"endTime":310.5263157894737,"audioSegment":0},{"text":"Roads also meet each other now.","startTime":310.5263157894737,"endTime":313.8421052631579,"audioSegment":0},{"text":"Streets used to stop a few units short of the road they turned onto,","startTime":313.8421052631579,"endTime":317.1578947368421,"audioSegment":0},{"text":"which is the single most artificial-looking thing a map can do.","startTime":317.1578947368421,"endTime":320.4736842105263,"audioSegment":0},{"text":"And a file's purpose now decides what kind of place it gets,","startTime":320.4736842105263,"endTime":323.7894736842105,"audioSegment":0},{"text":"before anything else.","startTime":323.7894736842105,"endTime":327.10526315789474,"audioSegment":0},{"text":"Data files are fields, furrowed and under crop.","startTime":327.10526315789474,"endTime":330.42105263157896,"audioSegment":0},{"text":"Configuration is a signal tower —","startTime":330.42105263157896,"endTime":333.7368421052632,"audioSegment":0},{"text":"a squat municipal block with a glazed control cab on the roof.","startTime":333.7368421052632,"endTime":337.0526315789474,"audioSegment":0},{"text":"Stylesheets are parks, with lawns, paths, a flowerbed and a bandstand.","startTime":337.0526315789474,"endTime":340.36842105263156,"audioSegment":0},{"text":"Everything else is a building, as before.","startTime":340.36842105263156,"endTime":343.6842105263158,"audioSegment":0},{"text":"A big data fixture is a big field rather than the largest structure in town.","startTime":343.6842105263158,"endTime":347,"audioSegment":0},{"text":"The .gezk format that packages a body of knowledge for your crew is now an open format, specified outside gezel entirely,","startTime":347,"endTime":350.72727272727275,"audioSegment":0},{"text":"with a published specification, a conformance suite and a second reader written in Python.","startTime":350.72727272727275,"endTime":354.45454545454544,"audioSegment":0},{"text":"Anyone can build, host and read a catalog without this app,","startTime":354.45454545454544,"endTime":358.1818181818182,"audioSegment":0},{"text":"and a catalog is plain SQLite that any client can open.","startTime":358.1818181818182,"endTime":361.90909090909093,"audioSegment":0},{"text":"Gezel is the reference implementation rather than the only one.","startTime":361.90909090909093,"endTime":365.6363636363636,"audioSegment":0},{"text":"The visible half is Settings → Knowledge.","startTime":365.6363636363636,"endTime":369.3636363636364,"audioSegment":0},{"text":"It used to want a URL pasted into a box.","startTime":369.3636363636364,"endTime":373.09090909090907,"audioSegment":0},{"text":"It is now the same browser the model downloader uses: catalogs as cards, progress while one installs,","startTime":373.09090909090907,"endTime":376.8181818181818,"audioSegment":0},{"text":"cancel, and downloads that resume where they stopped instead of starting over.","startTime":376.8181818181818,"endTime":380.54545454545456,"audioSegment":0},{"text":"On a shared machine a catalog can be installed once for everyone rather than once per account,","startTime":380.54545454545456,"endTime":384.27272727272725,"audioSegment":0},{"text":"the way models already were.","startTime":384.27272727272725,"endTime":388,"audioSegment":0},{"text":"First run tells you what this is.","startTime":388,"endTime":392,"audioSegment":0},{"text":"The setup screen now carries the \"What is gezel?\" introduction beside it,","startTime":392,"endTime":396,"audioSegment":0},{"text":"rather than opening as a settings form and leaving the explanation somewhere you had to go looking for.","startTime":396,"endTime":400,"audioSegment":0},{"text":"Your documents are in the sidebar, with the ones you use most listed and any of them pinnable,","startTime":400,"endTime":404,"audioSegment":0},{"text":"plus a right-click route to the folder in Explorer or Finder.","startTime":404,"endTime":408,"audioSegment":0},{"text":"Indexing stopped looking like a job you should worry about.","startTime":408,"endTime":412,"audioSegment":0},{"text":"The background pass that reads your files used to appear in chat as a stream of engineering;","startTime":412,"endTime":416,"audioSegment":0},{"text":"it now settles into one quiet line saying what was read and when it finished.","startTime":416,"endTime":420,"audioSegment":0},{"text":"A long conversation keeps its bearings.","startTime":420,"endTime":424,"audioSegment":0},{"text":"A header stays at the top of the transcript naming the message the current stretch of work came from,","startTime":424,"endTime":428,"audioSegment":0},{"text":"so scrolling through a long turn doesn't leave you wondering what was asked.","startTime":428,"endTime":432,"audioSegment":0},{"text":"Craftbook steps carry only the tools they need.","startTime":432,"endTime":436,"audioSegment":0},{"text":"A craftbook — a saved recipe for a piece of work — can now say per step which sets of tools it has no business touching,","startTime":436,"endTime":440,"audioSegment":0},{"text":"which keeps a model from wandering into browser automation when it was asked to write a paragraph.","startTime":440,"endTime":444,"audioSegment":0},{"text":"Model downloads use Hugging Face's newer chunked transfer where it's offered,","startTime":444,"endTime":448,"audioSegment":0},{"text":"which resumes more reliably on a bad connection.","startTime":448,"endTime":452,"audioSegment":0},{"text":"A deliverable that must be a real file says so more firmly.","startTime":452,"endTime":456,"audioSegment":0},{"text":"Asked for a .pptx, a gezel is now told plainly that a markdown outline with the right name is not the thing,","startTime":456,"endTime":460,"audioSegment":0},{"text":"and to report itself blocked rather than substitute a format.","startTime":460,"endTime":464,"audioSegment":0},{"text":"Nanbeige models are supported, and memory planning now accounts for models that run their layer stack more than once —","startTime":464,"endTime":468,"audioSegment":0},{"text":"the estimate used to come out several times too small on those.","startTime":468,"endTime":472,"audioSegment":0},{"text":"Catalog content moved to @bendyline/gilde 0.1.54,","startTime":472,"endTime":476,"audioSegment":0},{"text":"and the editor libraries to squisq 2.11.","startTime":476,"endTime":480,"audioSegment":0},{"text":".gezk 0.5 is an open format, specified in a repository of its own: the spec under CC BY 4.0,","startTime":480,"endTime":484.1304347826087,"audioSegment":0},{"text":"JSON Schemas generated from the definitions, a conformance fixture with test vectors, and a Python reference reader.","startTime":484.1304347826087,"endTime":488.2608695652174,"audioSegment":0},{"text":"Vectors are plain BLOB tables rather than a pre-1.0 extension's private layout,","startTime":488.2608695652174,"endTime":492.39130434782606,"audioSegment":0},{"text":"archives store their entries uncompressed so builds are byte-identical, and references are publisher-qualified.","startTime":492.39130434782606,"endTime":496.52173913043475,"audioSegment":0},{"text":"There is no compatibility with the previous generation —","startTime":496.52173913043475,"endTime":500.6521739130435,"audioSegment":0},{"text":"a reader refuses it with a typed reason.","startTime":500.6521739130435,"endTime":504.7826086956522,"audioSegment":0},{"text":"@bendyline/gezk is a new published package carrying the format alone,","startTime":504.7826086956522,"endTime":508.9130434782609,"audioSegment":0},{"text":"with no dependency on gezel; the reasoning is recorded in decision 0012.","startTime":508.9130434782609,"endTime":513.0434782608695,"audioSegment":0},{"text":"Two store lanes exist, for the Microsoft Store and the Mac App Store,","startTime":513.0434782608695,"endTime":517.1739130434783,"audioSegment":0},{"text":"alongside the direct download rather than instead of it.","startTime":517.1739130434783,"endTime":521.304347826087,"audioSegment":0},{"text":"Neither is submitted yet.","startTime":521.304347826087,"endTime":525.4347826086956,"audioSegment":0},{"text":"They follow one rule with wide consequences: a store build may not download or install executable code, so engine downloads, the Copilot SDK,","startTime":525.4347826086956,"endTime":529.5652173913044,"audioSegment":0},{"text":"Playwright and npm installs are all refused by a distribution profile that sits beside the security policy and cannot be argued out of its own restrictions by an inherited environment variable.","startTime":529.5652173913044,"endTime":533.695652173913,"audioSegment":0},{"text":"Model weights and catalogs are data, which is what makes a packed-in starter model legal —","startTime":533.695652173913,"endTime":537.8260869565217,"audioSegment":0},{"text":"a store build answers its first prompt, speaks and transcribes with nothing downloaded.","startTime":537.8260869565217,"endTime":541.9565217391304,"audioSegment":0},{"text":"Sessions record their parent.","startTime":541.9565217391304,"endTime":546.0869565217391,"audioSegment":0},{"text":"A thread opened by a delegation, a consultation, a task entry or a handoff now stamps which session opened it,","startTime":546.0869565217391,"endTime":550.2173913043478,"audioSegment":0},{"text":"and each message stamps which session sent it, so a session tree reconstructs identically from a live timeline or from disk.","startTime":550.2173913043478,"endTime":554.3478260869565,"audioSegment":0},{"text":"Eval runs record themselves and distill into a scene-by-scene walkthrough in the eval viewer —","startTime":554.3478260869565,"endTime":558.4782608695652,"audioSegment":0},{"text":"the first thing built on run recordings.","startTime":558.4782608695652,"endTime":562.6086956521739,"audioSegment":0},{"text":"A screenshot-grounded UX review of the whole app was produced,","startTime":562.6086956521739,"endTime":566.7391304347826,"audioSegment":0},{"text":"driven by two new permanent Playwright specs that boot a genuinely fresh home and then build a warm world through the UI itself.","startTime":566.7391304347826,"endTime":570.8695652173913,"audioSegment":0},{"text":"Most of the interface changes above answer it.","startTime":570.8695652173913,"endTime":575,"audioSegment":0},{"text":"Open a spreadsheet.","startTime":575,"endTime":579.2,"audioSegment":0},{"text":"Any .xlsx in a project or in your document library will do —","startTime":579.2,"endTime":583.4,"audioSegment":0},{"text":"it will look like a spreadsheet now, and you can sort it, filter it and type in it.","startTime":583.4,"endTime":587.6,"audioSegment":0},{"text":"And if you keep long conversations with a local model,","startTime":587.6,"endTime":591.8,"audioSegment":0},{"text":"look for the small ring beside the thread picker: it tells you how much room the thread has left, and gives you the button that makes more.","startTime":591.8,"endTime":596,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26247 — 4 September 2026","subtitle":"Three days after 1.26244, and a short release by the calendar — but two of these change something you do every day, and one of them changes a key you press.","ambientMotion":"zoomIn"}}</script>
