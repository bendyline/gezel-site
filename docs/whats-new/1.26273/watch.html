ext","value":"A task in gezel is a craftbook walked one step at a time, with a check at the end of each step. Until now each step went to a specialist for that trade — a researcher, a writer, a reviewer — each starting a fresh conversation and picking up from the notes the last one left. That is the right shape for small models on your own device, which do best in short, focused conversations. For large hosted models it mostly meant re-reading.","position":{"start":{"line":55,"column":1,"offset":7122},"end":{"line":55,"column":435,"offset":7556}}}],"position":{"start":{"line":55,"column":1,"offset":7122},"end":{"line":55,"column":435,"offset":7556}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Generalist mode","position":{"start":{"line":57,"column":3,"offset":7560},"end":{"line":57,"column":18,"offset":7575}}}],"position":{"start":{"line":57,"column":1,"offset":7558},"end":{"line":57,"column":20,"offset":7577}}},{"type":"text","value":" puts one gezel, the ","position":{"start":{"line":57,"column":20,"offset":7577},"end":{"line":57,"column":41,"offset":7598}}},{"type":"link","url":"../gezel-roles/role-generalist.md","children":[{"type":"text","value":"Generalist","position":{"start":{"line":57,"column":42,"offset":7599},"end":{"line":57,"column":52,"offset":7609}}}],"position":{"start":{"line":57,"column":41,"offset":7598},"end":{"line":57,"column":88,"offset":7645}}},{"type":"text","value":", on the whole task in a single conversation. It sees the full outline, works the active step, passes that step's check and moves on, so what it learned in step two is still in front of it in step five. Nothing is skipped: every step and every check is the one a crew would walk, work that fans out into many small tasks still runs in parallel, a task you assigned to a particular gezel stays theirs, and a step that is yours to approve stays yours.","position":{"start":{"line":57,"column":88,"offset":7645},"end":{"line":57,"column":537,"off {"id":"the-meester-sees-its-own-work-through","startTime":463,"duration":94,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"The Meester sees its own work through","position":{"start":{"line":63,"column":4,"offset":9078},"end":{"line":63,"column":41,"offset":9115}}}],"position":{"start":{"line":63,"column":1,"offset":9075},"end":{"line":63,"column":41,"offset":9115}}},"title":"The Meester sees its own work through","contents":[{"type":"paragraph","children":[{"type":"text","value":"More of what you ask the Meester for — a deck, a report, an invoice run — now runs as a task in the ","position":{"start":{"line":65,"column":1,"offset":9117},"end":{"line":65,"column":101,"offset":9217}}},{"type":"strong","children":[{"type":"text","value":"Default","position":{"start":{"line":65,"column":103,"offset":9219},"end":{"line":65,"column":110,"offset":9226}}}],"position":{"start":{"line":65,"column":101,"offset":9217},"end":{"line":65,"column":112,"offset":9228}}},{"type":"text","value":" project, the one gezel uses when you have not picked another. Several things there were built for a time when Default held no real work, and they got in the way:","position":{"start":{"line":65,"column":112,"offset":9228},"end":{"line":65,"column":274,"offset":9390}}}],"position":{"start":{"line":65,"column":1,"offset":9117},"end":{"line":65,"column":274,"offset":9390}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"A step that finishes by saving its file now moves on when the file is saved. In Default it could not, and the task paused after doing the work correctly. A step that is yours to approve is the exception: it waits for you (see below).","position":{"start":{"line":67,"column":3,"offset":9394},"end":{"line":67,"column":236,"offset":9627}}}],"position":{"start":{"line":67,"column":3,"offset":9394},"  Meester about that work. \"Cancel the PowerPoint task\" or \"how is the deck going?\" now reaches the task already under way instead of starting a second one, and the Meester can pause, resume or cancel the runs it launched. It restarts or cancels a task only when you ask, never on its own initiative, since canceling cannot be undone. A request for \"some slides for our team\" stays in the project you are in instead of turning into a new project, and asking twice for the same thing no longer launches two crews.","position":{"start":{"line":72,"column":1,"offset":10042},"end":{"line":72,"column":536,"offset":10577}}}],"position":{"start":{"line":72,"column":1,"offset":10042},"end":{"line":72,"column":536,"offset":10577}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Stop means stop.","position":{"start":{"line":74,"column":3,"offset":10581},"end":{"line":74,"column":19,"offset":10597}}}],"position":{"start":{"line":74,"column":1,"offset":10579},"end":{"line":74,"column":21,"offset":10599}}},{"type":"text","value":" Pressing Stop while a task's step is running now pauses the task. Before, the step was sent again, so the work you stopped started over. Press ","position":{"start":{"line":74,"column":21,"offset":10599},"end":{"line":74,"column":165,"offset":10743}}},{"type":"strong","children":[{"type":"text","value":"Try again","position":{"start":{"line":74,"column":167,"offset":10745},"end":{"line":74,"column":176,"offset":10754}}}],"position":{"start":{"line":74,"column":165,"offset":10743},"end":{"line":74,"column":178,"offset":10756}}},{"type":"text","value":" on the task when you want it to go on.","position":{"start":{"line":74,"column":178,"offset":10756},"end":{"line":74,"column":217,"offset":10795}}}],"position":{"start":{"line":74,"column":1,"offset":10579},"end":{"line":74,"column":217,"offset":10795}}}]},{"id":"finished-work-comes-back-to-you","startTime":557,"duration":95,"audioSegment":0,"template":"sectionHeader", mn":343,"offset":29087}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Catalog content moved from ","position":{"start":{"line":156,"column":3,"offset":29090},"end":{"line":156,"column":30,"offset":29117}}},{"type":"inlineCode","value":"@bendyline/gilde","position":{"start":{"line":156,"column":30,"offset":29117},"end":{"line":156,"column":48,"offset":29135}}},{"type":"text","value":" 0.1.67 to 0.1.76.","position":{"start":{"line":156,"column":48,"offset":29135},"end":{"line":156,"column":66,"offset":29153}}}],"position":{"start":{"line":156,"column":3,"offset":29090},"end":{"line":156,"column":66,"offset":29153}}}],"position":{"start":{"line":156,"column":1,"offset":29088},"end":{"line":156,"column":66,"offset":29153}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"The on-device engines moved from native release 0.1.43 to 0.1.46, which brings the image engine up from stable-diffusion.cpp master-789 to master-919.","position":{"start":{"line":157,"column":3,"offset":29156},"end":{"line":157,"column":153,"offset":29306}}}],"position":{"start":{"line":157,"column":3,"offset":29156},"end":{"line":157,"column":153,"offset":29306}}}],"position":{"start":{"line":157,"column":1,"offset":29154},"end":{"line":157,"column":153,"offset":29306}}}],"position":{"start":{"line":108,"column":1,"offset":15434},"end":{"line":157,"column":153,"offset":29306}}}],"autoTemplate":true,"templateData":{"items":["Restoring a backup never deletes your documents. A restore used to replace your whole shared library with the backup's copy, removing anything you had filed since, and in a cloud-synced folder that removal reached every device. The backup's documents are now added to yours: a missing one comes back, an identical one is left alone, and a different version is saved beside yours, marked \"from backup\" with the backup's date. You can also leave the backup's documents out, and replacing a project from a backup made without its working files keeps the files already on this device.","Restoring a backup can bring back your settings, if you ask. The restore dialog has an Also restore settings box, off by default. It restores which gezels hold roles such as your Meester. Your AI providers, models, folders and security level stay as they are on this device, so a backup made elsewhere, or one someone sends you, cannot change them. Ticking one item to replace no longer ticks an unrelated item of another kind, choosing a different backup clears the earlier choices, and a restore that fails says so.","Setting up your first model is clearer. Home says when it is checking your computer for AI models, which can take a few minutes the first time, and offers up to three models already on your computer as an alternative to downloading one. The download shows its speed and the time left, and when progress pauses it says why instead of sitting still.","The first launch is faster, above all on Windows. About 30,000 small catalog files now ship as one. A test build spent almost five minutes unpacking files on its first launch, more than half of them these.","Local vision models can look at images they open themselves. On llama.cpp, a gezel whose model has its vision component loaded now sees an image it opens; without one, it is told plainly that no image was delivered instead of being told the call succeeded.","Narration can speak progress updates. Settings → Audio → Include progress updates also reads out the short notes a gezel gives while it works, like \"Now I'll draft the outline.\" It is on by default and matters only when narration is on, so if you already use narration you will start hearing these. Updates that fall behind are dropped rather than read minutes late.","Spoken replies use a new pronunciation dictionary. Text-to-speech no longer depends on eSpeak NG; gezel carries its own American and British English dictionaries, and the British voices now speak British English. Some words will sound different, and a bug where the last sentence of a reply sometimes never played is gone.","A free source of reference photos. The Web Access toolset gains a Wikimedia Commons image search that needs no account or key and returns the credit and license for each picture. It stays off wherever your security settings block outside services.","Small talk stays small. A greeting like \"Hey, how's it going?\" no longer pulls unrelated files from your workspace into the reply, and a task's automatic context no longer draws on files from the project's other tasks.","Gezel's own words are no longer marked as misspellings. The spell checker knows gezel, meester, voorman, craftbook and the rest of the product's vocabulary, and the starter document in your shared library opens clean.","At the Free security level on Windows, a gezel can run scripts it writes. These script tools used to be missing on Windows, which has no way to keep a script offline. At Free, where gezels may use outside services anyway, they now run with the usual file limits and ordinary network access. Lockdown, the default, is unchanged. The security model explains the difference; the same applies to Linux machines without systemd.","Document search says when it cannot answer. Instead of an empty list, the Documents area tells you when a search failed, when search is unavailable, or when results may be incomplete.","Local models start more reliably when other apps are using the graphics card. On a PC with a separate graphics card, gezel now plans a model's memory against what is actually free rather than the card's total.","A long local turn is no longer cut short because the engine was too busy to answer a health check. One such restart threw away twenty minutes of work.","The llama.cpp engine's saved-state cache is capped at 8 GB and skips saving when your disk is nearly full; it used to grow without limit.","Tasks keep moving. A step that fanned out into child tasks picks up as soon as the children finish instead of several minutes later; a step waiting for a busy engine gets its turn within a minute; a step's check no longer repeats an old \"file not found\" after the file has been written; and a task that cannot be started pauses and asks for help instead of sitting silent.","Claude CLI and Codex CLI can pass craftbooks that check the test run. Those checks look for a record gezel's own script runners write, and both providers used to have those runners hidden.","The Meester's Home chat opens on a fresh thread when you start gezel instead of reopening the last one; unsent drafts are still there. A launch with first-run setup unfinished always lands on Home.","Scripts cut off by closing gezel are marked failed at the next start, with a note that their actions were not replayed. With advanced features on, the Scripts view can also browse and run the built-in Standard library.","Keyboard focus returns to the button that opened a dialog when the dialog closes, and a gezel's name is now a proper Rename gezel button.","Craftbook steps can use the tools their own instructions name. More than 600 steps in the catalog could not open the working files an earlier step had left, such as the scope a review step is told to check against, and a build step asked for a picture or a data file could not call the image or script tool it was told to use. Both work now.","Automatic context follows what you asked for. A craftbook task now looks up the subject you gave it, so \"a PowerPoint about quiche\" searches for quiche rather than for the recipe's own wording, which pulled in unrelated material.","Catalog searches answer while they warm up. A catalog whose search model is still loading returns its keyword matches instead of nothing, and a gezel is told the results are incomplete rather than that the catalog has nothing on the topic.","Pictures and chat share the machine. Making an image no longer waits for a loaded chat model to go idle, and the next chat turn no longer unloads the image engine, so a run of pictures stops paying for a fresh load each time. The two run side by side whenever memory allows.","More Linux machines draw pictures on the graphics card. With an NVIDIA card, the image engine now uses CUDA, and the NVIDIA DGX Spark, which drew pictures on its processor at several minutes each, now uses its graphics chip too. Gezel picks the right build on its own; the Linux download is larger because it carries both.","On the NVIDIA DGX Spark, memory is counted once. Gezel counted the Spark's shared memory twice, so it could start a picture beside a large chat model when the two did not fit, and the image engine crashed. The on-device engines there also move to CUDA 13, under which pictures rendered faster in our measurements; it needs NVIDIA driver R580 or newer, which every DGX OS image already has.","Reports read like documents. Files in the References rail, task notes, night reviews, status reports, and plans or reports shown beside a question now appear with a left-aligned title and headings that follow the text's own levels, instead of in a web-page style with a large centered cover. Chat replies lose the large centered title too; Help and Knowledge articles keep the richer style.","Chat replies show what the model wrote. Dollar amounts such as \"$300 … 3.50\" are no longer swallowed into code formatting, math-style symbols such as `\\rightarrow$` show as the real characters (→, ×, ≤), and a wide table scrolls instead of breaking words in half. A turn made only of tool calls says what the last action was instead of \"(continued in the next turn)\".","Side conversations stay beside the message that started them. When a gezel consults or hands off to another, that exchange now sits under the turn it belongs to, instead of piling up below your newest message and pushing the reply out of view.","Project files open in their project. Opening a file from a question card or a night review used to open it in the shared library's editor, whose autosave could quietly save a lossy copy into your library. It now opens in the project's Artifacts view, with a Back to the question bar to return.","Documents look the way they are stored. Library documents, project files, a gezel's about text and a project's description no longer show stray backslashes such as \\$3.50, and a task's description no longer says Unsaved changes just from being opened.","Community toolsets are labeled. Most of the toolset catalog is imported automatically from the public MCP registry, and those entries now carry a Community badge and a \"Shared by\" line naming who published them. They are listed after the toolsets gezel reviews, and their setup form warns you never to enter a wallet's private key or recovery phrase. The imported list also leaves out honeypots, prompt-injection demos, gambling and adult entries, and tools that ask for a wallet's key.","Tighter limits on what a gezel can do on your behalf. A gezel can no longer apply or dismiss its own change proposals, force a task step past its check, create a task that trusts custom scripts, or fire the actions in a report; those stay your clicks. A script a gezel runs is recorded as the gezel's, so turning scripts off in your security settings now stops it too. Nothing you do changes.","Mail goes only where you allowed it. An address written to look like an allowed one could get mail delivered to a different address. Gezel now checks the address the mail is actually sent to, including copies and blind copies. It is also no longer possible to add a hidden recipient through the subject line.","On Linux and macOS, the installed service's program files belong to the system. They could end up owned by whichever local account happened to share an id number with our build machine's account, which could then change them. They are now owned by the system and read-only. Nothing you do changes.","New projects reuse your crew. A project that brings its own team, such as a social feed, now reuses a copywriter or other gezel you already have instead of hiring a second one. The Default project and the shared library no longer get a project type of their own, so Default's recipe shelf stops being titled after something like an email inbox.","A document you name is saved under that name. Ask for plan.md and get the plan pasted into chat, and the gezel is told to save it as plan.md, not under a name made from its first heading.","Error buttons go where they say. A chat error saying no model is installed offers Set up a model, which goes to Home, and an engine error's Choose a model opens that engine's models page instead of Settings → General.","Narrow windows keep every tab in view. When a project's tabs no longer fit, they shrink to icons, keeping the current tab's name for as long as there is room, instead of scrolling sideways. Everything is a little more compact below about 760 pixels wide, and a window driven by a mouse keeps its desktop-sized rows.","Home steps aside once you start. The greeting at the top of Home folds away after you send a message, for that visit.","A gezel's growth updates within seconds of finished work instead of waiting for the daily recount, so a gezel who has just finished a step no longer shows 0 XP.","Quitting during first-run setup no longer leaves work behind. A download under way is stopped and started again at the next launch, and an interrupted download of the search model no longer keeps memory switched off for hours.","Settings → About → Legal and privacy links to how gezel handles your data, its license, the third-party notices and the end user license agreement.","Small new models and a video model with sound. The catalog adds MiniCPM5 1B and 2B and Qwen 3.5 0.8B (which can also see images), the smallest chat models gezel offers. In Settings → Video generation, LTX-2.3 and its faster distilled version make clips with matching sound; both need a machine with around 128 GB of memory and are about a 95 GB download.","The engine indicator in the title bar is shorter. It names the engine and what it is doing; the model's name is in the panel that opens when you click it.","A project's Approvals tab is now called Tools, in three parts: the packages installed in the project, the scripts a gezel can ask to run, and the answers you gave when a gezel asked.","The Knowledge settings table is simpler. A catalog installed for everyone on this device is marked Shared, and one that cannot be used says Not available instead of offering an Enable box.","Local-first: your data stays on your disk now lists every reason gezel goes online: the downloads you start, the tools it sets up, update checks, and web searches you allow. It also says where your provider keys are kept, and what the pass that guards gezel's background service does and does not keep out.","Catalog content moved from @bendyline/gilde 0.1.67 to 0.1.76.","The on-device engines moved from native release 0.1.43 to 0.1.46, which brings the image engine up from stable-diffusion.cpp master-789 to master-919."],"ordered":false,"title":"Smaller things"}},{"id":"in-the-terminal","startTime":1505,"duration":82,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"In the terminal","position":{"start":{"line":159,"column":4,"offset":29311},"end":{"line":159,"column":19,"offset":29326}}}],"position":{"start":{"line":159,"column":1,"offset":29308},"end":{"line":159,"column":19,"offset":29326}}},"title":"In the terminal","contents":[{"type":"paragraph","children":[{"type":"text","value":"If you use the ","position":{"start":{"line":161,"column":1,"offset":29328},"end":{"line":161,"column":16,"offset":29343}}},{"type":"inlineCode","value":"gezel","position":{"start":{"line":161,"column":16,"offset":29343},"end":{"line":161,"column":23,"offset":29350}}},{"type":"text","value":" command, it now does a better job of telling you ng turnIntent: 'off' stands the turn-intent routing down for that turn.","New gate check artifactReadEvidence, and a terminal step may complete when its deliverable is saved.","New MCP tools: manage_task (pause, resume, cancel; resume and cancel only on a user-directed turn) in the Meester's task-oversight kit, and wikimedia_image_search.","/v1/models lists models that are not downloaded yet. Connected Apps now see every model gezel can run, each with a non-standard availability field: available, or download-required for one that must be fetched first. An app that picks the first listed model should check it.","A launch missing a parameter its craftbook needs answers 422 with code: 'craftbook_params_missing' and the fields to fill, instead of a 500.","Generalist mode is config.generalistMode: 'auto' | 'on' | 'off'; the older executionDensity key is migrated once, and each task is stamped with executionMode at creation.","App SDK hosting. A saved grant is reused before hosting, hostWhenRefused hosts a private daemon even after the user declines, a hosted daemon always takes an ephemeral port, and host.nativeBinDir with the new @bendyline/gezel-service/native-release export lets an application ship its own engines. See Building connected apps with gezel-app-sdk.","gezel status exits 1 when the service is not running or not healthy, so scripts can test it directly.","@bendyline/gezel-script-runtime joins the npm packages at 0.1.0: the host-neutral script executor with a QuickJS (WebAssembly) implementation. Gezel on npm now also lists @bendyline/gezk and @bendyline/gezel-knowledge.","The @bendyline/gezel-service package is about 7.5 MB smaller. gezeld now launches the package's own dist/index.js instead of carrying a second copy of the daemon.","An npm install of the service ignores a pnpm-workspace.yaml above it. The eval runner used to accept any such file as a gezel source checkout, so one planted in a shared parent folder could have the daemon run a program from that folder with its credentials. It now accepts only a real gezel checkout. Nothing you do changes.","New craftbook lint rule policy-denies-instructed-tool flags a step whose own toolPolicy removes a tool its procedure tells the model to use. A group-level artifacts denial now withdraws only the drawer's writer, never its read tools.","search reports truncationReason: 'incomplete' when a source did not answer in time.","Owner steps. A step with no assignee whose name reads as the owner's sign-off (owner|client|customer + review|approval|sign-off, or final approval|sign-off) is assigned to the user by the catalog loader, the document compiler and the JSON craftbook routes. No gezel is dispatched; a step-awaits-owner question carries the review, and a session token completing the step gets 409 code: 'owner_step'.","Step runWhen ({ answerOf, choiceAnyOf?, writeInMatches?, onMissing? }) skips a step, with a note and no model turn, unless an earlier answer asked for it. Questions now record stepId so the answer can be matched.","New gate checks listedFiles (one file per value in a frontmatter list) and figures (sums, quantity × price, weekday against date). The Meester suggests both when it authors a craftbook.","New events task_settled and growth_updated, a task-finished question intent, and ChatSession.servedModel, which names the model that actually answered when a stand-in served an uninstalled pin.","Session tokens are refused applying or dismissing diffpacks, firing or dismissing report actions, forcing a step past its gate, and creating a task with trustScripts (including through the task.create script). Retrying or resuming a paused task is admitted only inside a turn the user started, and a session-token /scripts/run is recorded as a chat run, never manual.","Project types reuse the roster. reuseRosterGezels now defaults to true, matching by template and then by exact role title, and gezelsCreated[].reused says which were reused.","@bendyline/gezel-client retries GET requests up to three times on a transient connection failure. GEZEL_HTTP_VERSION=1.1 forces HTTP/1.1.","Packaged builds lock down Electron. The app and every Electron-as-Node process ignore NODE_OPTIONS and NODE_EXTRA_CA_CERTS, and --inspect is off. If you relied on NODE_EXTRA_CA_CERTS to trust a corporate proxy with the packaged app, that no longer applies. DevTools are off in packaged builds unless you launch with GEZEL_DEVTOOLS=1.","MiniCPM5's tool-call format (<function name=…><param …>) is parsed.","Licenses and SBOM. The license texts for the DirectML, DirectX shader compiler and ONNX Runtime files already shipped on Windows are now included and named in the end user license agreement, and the release SBOM carries file hashes and SPDX license ids.","Dependencies: @bendyline/squisq 2.11.11, @bendyline/squisq-react 2.11.13, @bendyline/squisq-editor-react 2.11.14, hono 4.13.9, adm-zip 0.6.1, nodemailer 9.1.1 (a denial-of-service fix reachable through inbound mail), undici 8.11.2, bundled pnpm 11.27.1, Electron 43.7.5."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":1841,"duration":32,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":200,"column":4,"offset":37177},"end":{"line":200,"column":37,"offset":37210}}}],"position":{"start":{"line":200,"column":1,"offset":37174},"end":{"line":200,"column":37,"offset":37210}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Open a fresh thread with your Meester, press ","position":{"start":{"line":202,"column":1,"offset":37212},"end":{"line":202,"column":46,"offset":37257}}},{"type":"strong","children":[{"type":"text","value":"Task","position":{"start":{"line":202,"column":48,"offset":37259},"end":{"line":202,"column":52,"offset":37263}}}],"position":{"start":{"line":202,"column":46,"offset":37257},"end":{"line":202,"column":54,"offset":37265}}},{"type":"text","value":" and pick a craftbook — or just describe what you want and watch for a suggested task above your message. When it finishes, look for the closing message in that thread and read anything listed under \"Before you send anything, check:\". Visit ","position":{"start":{"line":202,"column":54,"offset":37265},"end":{"line":202,"column":295,"offset":37506}}},{"type":"strong","children":[{"type":"text","value":"Settings → Knowledge","position":{"start":{"line":202,"column":297,"offset":37508},"end":{"line":202,"column":317,"offset":37528}}}],"position":{"start":{"line":202,"column":295,"offset":37506},"end":{"line":202,"column":319,"offset":37530}}},{"type":"text","value":" and install a Wikipedia shelf or two for the subjects you work in. If you use a hosted model, look at ","position":{"start":{"line":202,"column":319,"offset":37530},"end":{"line":202,"column":422,"offset":37633}}},{"type":"strong","children":[{"type":"text","value":"Settings → Artificial Intelligence → Run in generalist mode","position":{"start":{"line":202,"column":424,"offset":37635},"end":{"line":202,"column":483,"offset":37694}}}],"position":{"start":{"line":202,"column":422,"offset":37633},"end":{"line":202,"column":485,"offset":37696}}},{"type":"text","value":"; Automatic is a good place to stay. On a Mac still running macOS 13, update to macOS 14 before installing this release.","position":{"start":{"line":202,"column":485,"offset":37696},"end":{"line":202,"column":605,"offset":37816}}}],"position":{"start":{"line":202,"column":1,"offset":37212},"end":{"line":202,"column":605,"offset":37816}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"This release is about getting work started without a detour and then seeing it through: you can attach a recipe to the message you are about to send,","startTime":0,"endTime":4.6,"audioSegment":0},{"text":"hand it the files it should work on, and let a single gezel carry the job from the first step to the last.","startTime":4.6,"endTime":9.2,"audioSegment":0},{"text":"When the work is done, it comes back to you in the conversation where you asked for it,","startTime":9.2,"endTime":13.799999999999999,"audioSegment":0},{"text":"with its numbers and dates checked, and any step that is yours to approve waits for you.","startTime":13.799999999999999,"endTime":18.4,"audioSegment":0},{"text":"The first ready-made knowledge catalogs also arrive —","startTime":18.4,"endTime":23,"audioSegment":0},{"text":"seventeen subject shelves drawn from Wikipedia that your crew can search without going online.","startTime":23,"endTime":27.599999999999998,"audioSegment":0},{"text":"If you read only one thing: the chat box now has a Task key.","startTime":27.599999999999998,"endTime":32.199999999999996,"audioSegment":0},{"text":"Pick a craftbook and the message you are writing becomes its brief.","startTime":32.199999999999996,"endTime":36.8,"audioSegment":0},{"text":"Press Start the task and the work begins right away,","startTime":36.8,"endTime":41.4,"audioSegment":0},{"text":"without waiting for a model to decide what you meant.","startTime":41.4,"endTime":46,"audioSegment":0},{"text":"Until now,","startTime":46,"endTime":49.51428571428571,"audioSegment":0},{"text":"starting a craftbook from chat meant asking the Meester and hoping the model reached for the right recipe.","startTime":49.51428571428571,"endTime":53.028571428571425,"audioSegment":0},{"text":"The only sure route was Tasks → New task,","startTime":53.028571428571425,"endTime":56.542857142857144,"audioSegment":0},{"text":"away from the conversation you were in.","startTime":56.542857142857144,"endTime":60.05714285714286,"audioSegment":0},{"text":"On a fresh thread,","startTime":60.05714285714286,"endTime":63.57142857142857,"audioSegment":0},{"text":"the composer now has a Task key beside Send.","startTime":63.57142857142857,"endTime":67.08571428571429,"audioSegment":0},{"text":"It opens Task for this message,","startTime":67.08571428571429,"endTime":70.6,"audioSegment":0},{"text":"where you choose a craftbook and fill in anything it needs.","startTime":70.6,"endTime":74.11428571428571,"audioSegment":0},{"text":"The message you were typing is shown as the brief,","startTime":74.11428571428571,"endTime":77.62857142857143,"audioSegment":0},{"text":"and editing it there edits the chat box too.","startTime":77.62857142857143,"endTime":81.14285714285714,"audioSegment":0},{"text":"Use in chat attaches it: a strip appears above your message with the craftbook's artwork,","startTime":81.14285714285714,"endTime":84.65714285714286,"audioSegment":0},{"text":"its name and the settings you chose.","startTime":84.65714285714286,"endTime":88.17142857142858,"audioSegment":0},{"text":"Click the strip to change them,","startTime":88.17142857142858,"endTime":91.68571428571428,"audioSegment":0},{"text":"or the × to take the task off.","startTime":91.68571428571428,"endTime":95.2,"audioSegment":0},{"text":"Nothing runs until you send.","startTime":95.2,"endTime":98.71428571428572,"audioSegment":0},{"text":"With a craftbook attached, Send becomes Start the task.","startTime":98.71428571428572,"endTime":102.22857142857143,"audioSegment":0},{"text":"The task is created on the spot with your message as its description,","startTime":102.22857142857143,"endTime":105.74285714285713,"audioSegment":0},{"text":"and the thread keeps a receipt naming the new task.","startTime":105.74285714285713,"endTime":109.25714285714285,"audioSegment":0},{"text":"A double click or a retried send reuses that task instead of starting a second one,","startTime":109.25714285714285,"endTime":112.77142857142857,"audioSegment":0},{"text":"and the attachment is saved with your draft, so it survives closing the app.","startTime":112.77142857142857,"endTime":116.28571428571428,"audioSegment":0},{"text":"Gezel will also suggest one.","startTime":116.28571428571428,"endTime":119.8,"audioSegment":0},{"text":"Last release showed a small label naming where a request for a PowerPoint or PDF would go;","startTime":119.8,"endTime":123.31428571428572,"audioSegment":0},{"text":"that label is now a dashed Suggested task strip you can start with Send or dismiss with ×.","startTime":123.31428571428572,"endTime":126.82857142857142,"audioSegment":0},{"text":"Suggestions are no longer limited to document formats.","startTime":126.82857142857142,"endTime":130.34285714285716,"audioSegment":0},{"text":"Nearly every craftbook in the catalog lists a few phrases it answers to — \"make an invoice\", \"board deck\", \"prep me for the meeting\" —","startTime":130.34285714285716,"endTime":133.85714285714286,"audioSegment":0},{"text":"and on a fresh thread with the Meester or a project's Crew Lead, gezel offers the matching book when your message alone is enough to start it.","startTime":133.85714285714286,"endTime":137.37142857142857,"audioSegment":0},{"text":"In a conversation already under way nothing is suggested,","startTime":137.37142857142857,"endTime":140.8857142857143,"audioSegment":0},{"text":"because \"turn this into slides\" there is a reply to the gezel.","startTime":140.8857142857143,"endTime":144.4,"audioSegment":0},{"text":"Dismiss a suggestion and the message goes as ordinary chat;","startTime":144.4,"endTime":147.9142857142857,"audioSegment":0},{"text":"that craftbook is not suggested again while you finish the message.","startTime":147.9142857142857,"endTime":151.42857142857144,"audioSegment":0},{"text":"Send waits until the task has what it needs and says what is missing,","startTime":151.42857142857144,"endTime":154.94285714285712,"audioSegment":0},{"text":"such as a message to say what the task is about.","startTime":154.94285714285712,"endTime":158.45714285714286,"audioSegment":0},{"text":"Launch forms are shorter, too.","startTime":158.45714285714286,"endTime":161.9714285714286,"audioSegment":0},{"text":"A form now asks only what a person can answer: settings gezel fills in itself, such as the task's working folder, are no longer shown,","startTime":161.9714285714286,"endTime":165.48571428571427,"audioSegment":0},{"text":"and a recipe that needs a source file, a topic, or source material shows all three as ordinary fields and tells you to fill in one.","startTime":165.48571428571427,"endTime":169,"audioSegment":0},{"text":"Some recipes work on something: a folder of meeting notes to turn into minutes,","startTime":169,"endTime":173.3125,"audioSegment":0},{"text":"a set of chapters to compile into an ebook, a pile of source documents to turn into an FAQ.","startTime":173.3125,"endTime":177.625,"audioSegment":0},{"text":"Until now the only way to say which files was to type a path,","startTime":177.625,"endTime":181.9375,"audioSegment":0},{"text":"and some of these craftbooks had nowhere to say it at all.","startTime":181.9375,"endTime":186.25,"audioSegment":0},{"text":"Those craftbooks now have a Works on section in their launch form, with two keys.","startTime":186.25,"endTime":190.5625,"audioSegment":0},{"text":"In this project lets you choose a folder or file from the project's workspace,","startTime":190.5625,"endTime":194.875,"audioSegment":0},{"text":"read where it is, with a live count of how many files and how much data you picked.","startTime":194.875,"endTime":199.1875,"audioSegment":0},{"text":"From your computer lets you choose or drag in files and folders from anywhere on your machine.","startTime":199.1875,"endTime":203.5,"audioSegment":0},{"text":"Gezel copies them into the task's own folder, so your originals are never touched,","startTime":203.5,"endTime":207.8125,"audioSegment":0},{"text":"and lists anything it left out and why — too large, or not a type the craftbook reads.","startTime":207.8125,"endTime":212.125,"audioSegment":0},{"text":"A recurring task can use only files in the project,","startTime":212.125,"endTime":216.4375,"audioSegment":0},{"text":"because it reads them fresh on every run.","startTime":216.4375,"endTime":220.75,"audioSegment":0},{"text":"Every step of the task is told where the files are and how to open them,","startTime":220.75,"endTime":225.0625,"audioSegment":0},{"text":"and no gezel can change the copy it was handed.","startTime":225.0625,"endTime":229.375,"audioSegment":0},{"text":"Craftbooks that use this today include Meeting Minutes & Actions, Meeting Notes to Action Items,","startTime":229.375,"endTime":233.6875,"audioSegment":0},{"text":"Standup / Team Update Summary, FAQ from Source Docs, Ebook Compile and Content Accuracy Review.","startTime":233.6875,"endTime":238,"audioSegment":0},{"text":"A knowledge catalog is a packaged body of reference material your crew can search and quote,","startTime":238,"endTime":241.1891891891892,"audioSegment":0},{"text":"naming the source every time.","startTime":241.1891891891892,"endTime":244.3783783783784,"audioSegment":0},{"text":"Catalogs arrived a few releases ago (see 1.26234),","startTime":244.3783783783784,"endTime":247.56756756756758,"audioSegment":0},{"text":"but until now you had to build or find one yourself.","startTime":247.56756756756758,"endTime":250.75675675675674,"audioSegment":0},{"text":"Settings → Knowledge now offers seventeen ready to install,","startTime":250.75675675675674,"endTime":253.94594594594594,"audioSegment":0},{"text":"each a subject shelf drawn from the English Wikipedia as of April 2026:","startTime":253.94594594594594,"endTime":257.13513513513516,"audioSegment":0},{"text":"Arts & Architecture — painting, sculpture, movements, dance","startTime":257.13513513513516,"endTime":260.3243243243243,"audioSegment":0},{"text":"Astronomy & Space — the solar system, stars, galaxies, spaceflight","startTime":260.3243243243243,"endTime":263.5135135135135,"audioSegment":0},{"text":"Biology & Nature — plants, animals and fossils, genes and cells","startTime":263.5135135135135,"endTime":266.7027027027027,"audioSegment":0},{"text":"Business & Economics — companies and brands,","startTime":266.7027027027027,"endTime":269.8918918918919,"audioSegment":0},{"text":"banks and finance, shops, hotels and restaurants","startTime":269.8918918918919,"endTime":273.0810810810811,"audioSegment":0},{"text":"Food & Drink — dishes, ingredients, drinks, cuisines","startTime":273.0810810810811,"endTime":276.27027027027026,"audioSegment":0},{"text":"Games — video games, board and tabletop games, card games","startTime":276.27027027027026,"endTime":279.4594594594595,"audioSegment":0},{"text":"Language & Linguistics — languages and their families, dialects, writing systems","startTime":279.4594594594595,"endTime":282.64864864864865,"audioSegment":0},{"text":"Law — legislation, treaties, courts, legal concepts","startTime":282.64864864864865,"endTime":285.8378378378378,"audioSegment":0},{"text":"Literature — novels, poetry and drama, short stories, comics and manga","startTime":285.8378378378378,"endTime":289.02702702702703,"audioSegment":0},{"text":"Mathematics — theorems, structures, numbers, algorithms, statistics","startTime":289.02702702702703,"endTime":292.2162162162162,"audioSegment":0},{"text":"Medicine & Health — conditions, anatomy, medications, mental health","startTime":292.2162162162162,"endTime":295.4054054054054,"audioSegment":0},{"text":"Military — battles and campaigns, wars, units, weapons and equipment","startTime":295.4054054054054,"endTime":298.5945945945946,"audioSegment":0},{"text":"Politics & Government — elections, parties, government bodies and offices, international organizations","startTime":298.5945945945946,"endTime":301.7837837837838,"audioSegment":0},{"text":"Religion & Philosophy — religions, scripture, mythology, philosophy","startTime":301.7837837837838,"endTime":304.97297297297297,"audioSegment":0},{"text":"Science — chemistry, physics, earth and life sciences","startTime":304.97297297297297,"endTime":308.1621621621622,"audioSegment":0},{"text":"Technology — software, computers and devices,","startTime":308.1621621621622,"endTime":311.35135135135135,"audioSegment":0},{"text":"the internet, radio, television and the press","startTime":311.35135135135135,"endTime":314.5405405405405,"audioSegment":0},{"text":"Transportation — railways and transit, roads, bridges and tunnels, aviation, ships","startTime":314.5405405405405,"endTime":317.72972972972974,"audioSegment":0},{"text":"Together they hold about 1.1 million articles.","startTime":317.72972972972974,"endTime":320.9189189189189,"audioSegment":0},{"text":"Each shelf is a single download of between roughly 180 MB and 2.3 GB,","startTime":320.9189189189189,"endTime":324.1081081081081,"audioSegment":0},{"text":"so install the subjects you care about rather than all of them; the first one also fetches a small search model.","startTime":324.1081081081081,"endTime":327.2972972972973,"audioSegment":0},{"text":"Once installed, the search runs entirely on your device,","startTime":327.2972972972973,"endTime":330.48648648648646,"audioSegment":0},{"text":"so a gezel can look something up with no internet connection and no account.","startTime":330.48648648648646,"endTime":333.6756756756757,"audioSegment":0},{"text":"Searching for an article by its exact name finds that article first,","startTime":333.6756756756757,"endTime":336.86486486486484,"audioSegment":0},{"text":"rather than a longer one that happens to repeat its words.","startTime":336.86486486486484,"endTime":340.05405405405406,"audioSegment":0},{"text":"A Knowledge area appears in the sidebar where you can browse the shelf yourself, with a Copy citation button on every article,","startTime":340.05405405405406,"endTime":343.2432432432432,"audioSegment":0},{"text":"and when catalog excerpts are put in front of a reply, they are listed under your message so you can see exactly what the model read.","startTime":343.2432432432432,"endTime":346.4324324324324,"audioSegment":0},{"text":"Each project decides which catalogs it sees in its settings.","startTime":346.4324324324324,"endTime":349.6216216216216,"audioSegment":0},{"text":"The articles are licensed CC BY-SA 4.0,","startTime":349.6216216216216,"endTime":352.81081081081084,"audioSegment":0},{"text":"which is why the source travels with every quote.","startTime":352.81081081081084,"endTime":356,"audioSegment":0},{"text":"A task in gezel is a craftbook walked one step at a time,","startTime":356,"endTime":359.82142857142856,"audioSegment":0},{"text":"with a check at the end of each step.","startTime":359.82142857142856,"endTime":363.64285714285717,"audioSegment":0},{"text":"Until now each step went to a specialist for that trade — a researcher, a writer, a reviewer —","startTime":363.64285714285717,"endTime":367.4642857142857,"audioSegment":0},{"text":"each starting a fresh conversation and picking up from the notes the last one left.","startTime":367.4642857142857,"endTime":371.2857142857143,"audioSegment":0},{"text":"That is the right shape for small models on your own device,","startTime":371.2857142857143,"endTime":375.10714285714283,"audioSegment":0},{"text":"which do best in short, focused conversations.","startTime":375.10714285714283,"endTime":378.92857142857144,"audioSegment":0},{"text":"For large hosted models it mostly meant re-reading.","startTime":378.92857142857144,"endTime":382.75,"audioSegment":0},{"text":"Generalist mode puts one gezel, the Generalist,","startTime":382.75,"endTime":386.57142857142856,"audioSegment":0},{"text":"on the whole task in a single conversation.","startTime":386.57142857142856,"endTime":390.39285714285717,"audioSegment":0},{"text":"It sees the full outline, works the active step, passes that step's check and moves on,","startTime":390.39285714285717,"endTime":394.2142857142857,"audioSegment":0},{"text":"so what it learned in step two is still in front of it in step five.","startTime":394.2142857142857,"endTime":398.0357142857143,"audioSegment":0},{"text":"Nothing is skipped: every step and every check is the one a crew would walk, work that fans out into many small tasks still runs in parallel,","startTime":398.0357142857143,"endTime":401.8571428571429,"audioSegment":0},{"text":"a task you assigned to a particular gezel stays theirs, and a step that is yours to approve stays yours.","startTime":401.8571428571429,"endTime":405.67857142857144,"audioSegment":0},{"text":"It lives in Settings → Artificial Intelligence → Run in generalist mode.","startTime":405.67857142857144,"endTime":409.5,"audioSegment":0},{"text":"Automatic, the default, turns it on for Claude, ChatGPT and Codex,","startTime":409.5,"endTime":413.32142857142856,"audioSegment":0},{"text":"and GitHub Copilot, and leaves it off for models running on this device.","startTime":413.32142857142856,"endTime":417.14285714285717,"audioSegment":0},{"text":"On and Off force it either way.","startTime":417.14285714285717,"endTime":420.9642857142857,"audioSegment":0},{"text":"The choice is made when a task is created,","startTime":420.9642857142857,"endTime":424.7857142857143,"audioSegment":0},{"text":"so changing it never disturbs work already under way.","startTime":424.7857142857143,"endTime":428.6071428571429,"audioSegment":0},{"text":"If you reach Claude or ChatGPT with your own API key, a new project the Meester starts for you on Automatic now begins with one lead gezel rather than a full crew,","startTime":428.6071428571429,"endTime":432.42857142857144,"audioSegment":0},{"text":"as it already did for Copilot; choose Off if you prefer the crew.","startTime":432.42857142857144,"endTime":436.25,"audioSegment":0},{"text":"Generalist mode has the details.","startTime":436.25,"endTime":440.07142857142856,"audioSegment":0},{"text":"If you pay for a hosted model by use,","startTime":440.07142857142856,"endTime":443.89285714285717,"audioSegment":0},{"text":"expect some change in what tasks cost.","startTime":443.89285714285717,"endTime":447.7142857142857,"audioSegment":0},{"text":"Gezel adds the Generalist to your crew the first time it is needed,","startTime":447.7142857142857,"endTime":451.5357142857143,"audioSegment":0},{"text":"and each of its turns carries the whole outline, so prompts are longer.","startTime":451.5357142857143,"endTime":455.3571428571429,"audioSegment":0},{"text":"The crew members it stands in for do not work on the task,","startTime":455.3571428571429,"endTime":459.17857142857144,"audioSegment":0},{"text":"so a model you chose for one of them is not used.","startTime":459.17857142857144,"endTime":463,"audioSegment":0},{"text":"More of what you ask the Meester for — a deck, a report, an invoice run —","startTime":463,"endTime":466.76,"audioSegment":0},{"text":"now runs as a task in the Default project, the one gezel uses when you have not picked another.","startTime":466.76,"endTime":470.52,"audioSegment":0},{"text":"Several things there were built for a time when Default held no real work,","startTime":470.52,"endTime":474.28,"audioSegment":0},{"text":"and they got in the way:","startTime":474.28,"endTime":478.04,"audioSegment":0},{"text":"A step that finishes by saving its file now moves on when the file is saved.","startTime":478.04,"endTime":481.8,"audioSegment":0},{"text":"In Default it could not,","startTime":481.8,"endTime":485.56,"audioSegment":0},{"text":"and the task paused after doing the work correctly.","startTime":485.56,"endTime":489.32,"audioSegment":0},{"text":"A step that is yours to approve is the exception: it waits for you (see below).","startTime":489.32,"endTime":493.08,"audioSegment":0},{"text":"One unanswered question in the Meester's chat no longer freezes every task in Default,","startTime":493.08,"endTime":496.84,"audioSegment":0},{"text":"and an unrelated failed chat no longer pauses a healthy one.","startTime":496.84,"endTime":500.6,"audioSegment":0},{"text":"A step the Meester owns that goes quiet now gets a nudge,","startTime":500.6,"endTime":504.36,"audioSegment":0},{"text":"and pauses to ask for help if it stays stuck, instead of waiting indefinitely.","startTime":504.36,"endTime":508.12,"audioSegment":0},{"text":"A craftbook that names no particular trade now goes to the Meester instead of sitting \"active\" with nobody working on it.","startTime":508.12,"endTime":511.88,"audioSegment":0},{"text":"You can also talk to the Meester about that work.","startTime":511.88,"endTime":515.64,"audioSegment":0},{"text":"\"Cancel the PowerPoint task\" or \"how is the deck going?\" now reaches the task already under way instead of starting a second one,","startTime":515.64,"endTime":519.4,"audioSegment":0},{"text":"and the Meester can pause, resume or cancel the runs it launched.","startTime":519.4,"endTime":523.16,"audioSegment":0},{"text":"It restarts or cancels a task only when you ask,","startTime":523.16,"endTime":526.92,"audioSegment":0},{"text":"never on its own initiative, since canceling cannot be undone.","startTime":526.92,"endTime":530.68,"audioSegment":0},{"text":"A request for \"some slides for our team\" stays in the project you are in instead of turning into a new project,","startTime":530.68,"endTime":534.44,"audioSegment":0},{"text":"and asking twice for the same thing no longer launches two crews.","startTime":534.44,"endTime":538.2,"audioSegment":0},{"text":"Stop means stop.","startTime":538.2,"endTime":541.96,"audioSegment":0},{"text":"Pressing Stop while a task's step is running now pauses the task.","startTime":541.96,"endTime":545.72,"audioSegment":0},{"text":"Before, the step was sent again,","startTime":545.72,"endTime":549.48,"audioSegment":0},{"text":"so the work you stopped started over.","startTime":549.48,"endTime":553.24,"audioSegment":0},{"text":"Press Try again on the task when you want it to go on.","startTime":553.24,"endTime":557,"audioSegment":0},{"text":"When a task you started from a chat finished,","startTime":557,"endTime":560.3928571428571,"audioSegment":0},{"text":"the last thing in that thread used to be a line of bookkeeping — Completed step \"finish\" on default/2.","startTime":560.3928571428571,"endTime":563.7857142857143,"audioSegment":0},{"text":"Active step is now \"(none)\" —","startTime":563.7857142857143,"endTime":567.1785714285714,"audioSegment":0},{"text":"and you had to go looking for what it had made.","startTime":567.1785714285714,"endTime":570.5714285714286,"audioSegment":0},{"text":"Now the thread gets a closing message,","startTime":570.5714285714286,"endTime":573.9642857142857,"audioSegment":0},{"text":"\"All done — Weekly posts is finished.","startTime":573.9642857142857,"endTime":577.3571428571429,"audioSegment":0},{"text":"Here's what it made:\",","startTime":577.3571428571429,"endTime":580.75,"audioSegment":0},{"text":"with links to up to six files the task actually wrote.","startTime":580.75,"endTime":584.1428571428571,"audioSegment":0},{"text":"The same news arrives as a card in Updates that you can open in chat or dismiss, Home shows a ready for you count beside waiting on you,","startTime":584.1428571428571,"endTime":587.5357142857143,"audioSegment":0},{"text":"and if gezel's window is hidden, your computer shows a Your work is ready notification.","startTime":587.5357142857143,"endTime":590.9285714285714,"audioSegment":0},{"text":"Scheduled and Night Shift work still finishes quietly.","startTime":590.9285714285714,"endTime":594.3214285714286,"audioSegment":0},{"text":"While the work is under way, the thread speaks plainly too.","startTime":594.3214285714286,"endTime":597.7142857142857,"audioSegment":0},{"text":"A step that ends reads \"Finished \"Scope the Week\".","startTime":597.7142857142857,"endTime":601.1071428571429,"audioSegment":0},{"text":"Next: \"Draft posts\".\" instead of a status code, a gezel brought onto the crew partway through is introduced (\"I've brought Sanne onto the crew as your copywriter\"),","startTime":601.1071428571429,"endTime":604.5,"audioSegment":0},{"text":"and the task's thread is named after the task.","startTime":604.5,"endTime":607.8928571428571,"audioSegment":0},{"text":"The waiting on you count on Home can now be clicked,","startTime":607.8928571428571,"endTime":611.2857142857143,"audioSegment":0},{"text":"and it no longer counts gezel's own system jobs.","startTime":611.2857142857143,"endTime":614.6785714285714,"audioSegment":0},{"text":"Approval steps are yours.","startTime":614.6785714285714,"endTime":618.0714285714286,"audioSegment":0},{"text":"A craftbook step named for your own sign-off — Owner review, Client approval,","startTime":618.0714285714286,"endTime":621.4642857142857,"audioSegment":0},{"text":"Customer sign-off, Final approval — now waits for you instead of going to a gezel.","startTime":621.4642857142857,"endTime":624.8571428571429,"audioSegment":0},{"text":"A card says the step \"is waiting for you\",","startTime":624.8571428571429,"endTime":628.25,"audioSegment":0},{"text":"lists the files to look at, and offers Approve.","startTime":628.25,"endTime":631.6428571428571,"audioSegment":0},{"text":"Write what should change instead,","startTime":631.6428571428571,"endTime":635.0357142857142,"audioSegment":0},{"text":"and the work goes back to the step before with your note attached.","startTime":635.0357142857142,"endTime":638.4285714285714,"audioSegment":0},{"text":"A gezel cannot complete one of these steps for you,","startTime":638.4285714285714,"endTime":641.8214285714286,"audioSegment":0},{"text":"and saving a file never moves past one.","startTime":641.8214285714286,"endTime":645.2142857142857,"audioSegment":0},{"text":"A step called simply \"Review\" is still gezel work.","startTime":645.2142857142857,"endTime":648.6071428571429,"audioSegment":0},{"text":"This came from a run where a model did the owner's review itself and approved a deliverable that did not exist.","startTime":648.6071428571429,"endTime":652,"audioSegment":0},{"text":"Gezels know what day it is.","startTime":652,"endTime":655.578947368421,"audioSegment":0},{"text":"Every message a gezel receives now starts with the current date and time in your time zone.","startTime":655.578947368421,"endTime":659.1578947368421,"audioSegment":0},{"text":"Before, a model went by its own sense of the date,","startTime":659.1578947368421,"endTime":662.7368421052631,"audioSegment":0},{"text":"and one planned \"the week of May 20th\" in September; the wrong date ended up in a customer quote.","startTime":662.7368421052631,"endTime":666.3157894736842,"audioSegment":0},{"text":"The numbers get a second look.","startTime":666.3157894736842,"endTime":669.8947368421053,"audioSegment":0},{"text":"When a task finishes, and when an approval step asks for you,","startTime":669.8947368421053,"endTime":673.4736842105264,"audioSegment":0},{"text":"gezel reads the text files the task made — documents, notes, CSV tables — and checks:","startTime":673.4736842105264,"endTime":677.0526315789474,"audioSegment":0},{"text":"that subtotals match their items and quantity times price is right;","startTime":677.0526315789474,"endTime":680.6315789473684,"audioSegment":0},{"text":"that each weekday matches its date,","startTime":680.6315789473684,"endTime":684.2105263157895,"audioSegment":0},{"text":"so a Saturday is not called a Friday;","startTime":684.2105263157895,"endTime":687.7894736842105,"audioSegment":0},{"text":"dates that have already passed, including in file names;","startTime":687.7894736842105,"endTime":691.3684210526316,"audioSegment":0},{"text":"prices that appear nowhere in what you gave it: your messages, your notes and answers on the task,","startTime":691.3684210526316,"endTime":694.9473684210526,"audioSegment":0},{"text":"the project's description, or a price list or menu in the project folder.","startTime":694.9473684210526,"endTime":698.5263157894736,"audioSegment":0},{"text":"Anything it finds is listed under \"Before you send anything,","startTime":698.5263157894736,"endTime":702.1052631578948,"audioSegment":0},{"text":"check:\" on the closing message, or \"Before you approve, check:\" on the approval card.","startTime":702.1052631578948,"endTime":705.6842105263158,"audioSegment":0},{"text":"When everything holds up, it says what it checked.","startTime":705.6842105263158,"endTime":709.2631578947369,"audioSegment":0},{"text":"It points problems out; it never changes the files.","startTime":709.2631578947369,"endTime":712.8421052631579,"audioSegment":0},{"text":"This came from a quote a crew prepared with a $297 subtotal over items that added up to $197,","startTime":712.8421052631579,"endTime":716.421052631579,"audioSegment":0},{"text":"a Friday that was a Saturday, and two prices nobody had given it.","startTime":716.421052631579,"endTime":720,"audioSegment":0},{"text":"Gezel now needs macOS 14 Sonoma or newer.","startTime":720,"endTime":723.08,"audioSegment":0},{"text":"The last release said it ran on macOS 13.5, but the parts behind memory and search need macOS 14,","startTime":723.08,"endTime":726.16,"audioSegment":0},{"text":"so on 13 gezel opened with them unable to start.","startTime":726.16,"endTime":729.24,"audioSegment":0},{"text":"The installer now refuses macOS 13,","startTime":729.24,"endTime":732.32,"audioSegment":0},{"text":"and a copy already installed there is not offered this update.","startTime":732.32,"endTime":735.4,"audioSegment":0},{"text":"The chat box's microphone works.","startTime":735.4,"endTime":738.48,"audioSegment":0},{"text":"Narrate prompt, the microphone key in the chat box,","startTime":738.48,"endTime":741.56,"audioSegment":0},{"text":"did nothing on a Mac: macOS turned the microphone down without ever asking you.","startTime":741.56,"endTime":744.64,"audioSegment":0},{"text":"It now asks for permission the first time, as it should.","startTime":744.64,"endTime":747.72,"audioSegment":0},{"text":"Automatic wallpaper works.","startTime":747.72,"endTime":750.8,"audioSegment":0},{"text":"Letting gezel set its dashboard as your desktop wallpaper failed the same way,","startTime":750.8,"endTime":753.88,"audioSegment":0},{"text":"refused before macOS asked you.","startTime":753.88,"endTime":756.96,"audioSegment":0},{"text":"macOS now shows its permission prompt.","startTime":756.96,"endTime":760.04,"audioSegment":0},{"text":"Upgrades install faster and no longer start the background service twice.","startTime":760.04,"endTime":763.12,"audioSegment":0},{"text":"One step of the installer,","startTime":763.12,"endTime":766.2,"audioSegment":0},{"text":"which could take more than seven minutes on an upgrade, is gone.","startTime":766.2,"endTime":769.28,"audioSegment":0},{"text":"On-device models that can see now see your images.","startTime":769.28,"endTime":772.36,"audioSegment":0},{"text":"An MLX model with a vision component receives the pictures you attach,","startTime":772.36,"endTime":775.44,"audioSegment":0},{"text":"and the ones a gezel opens itself, as images rather than as a written description.","startTime":775.44,"endTime":778.52,"audioSegment":0},{"text":"The vision component loads the first time a conversation carries a picture,","startTime":778.52,"endTime":781.6,"audioSegment":0},{"text":"which takes a moment; until then replies use the faster text-only engine.","startTime":781.6,"endTime":784.6800000000001,"audioSegment":0},{"text":"Turns with images run a little slower because they skip the prompt cache.","startTime":784.6800000000001,"endTime":787.76,"audioSegment":0},{"text":"There is nothing to switch on.","startTime":787.76,"endTime":790.84,"audioSegment":0},{"text":"On-device models stop when their tool call is done instead of repeating closing markup until they hit their length limit,","startTime":790.84,"endTime":793.92,"audioSegment":0},{"text":"and Gemma 4 tool calls are garbled less often.","startTime":793.92,"endTime":797,"audioSegment":0},{"text":"Restoring a backup never deletes your documents.","startTime":797,"endTime":800.7068062827225,"audioSegment":0},{"text":"A restore used to replace your whole shared library with the backup's copy,","startTime":800.7068062827225,"endTime":804.4136125654451,"audioSegment":0},{"text":"removing anything you had filed since, and in a cloud-synced folder that removal reached every device.","startTime":804.4136125654451,"endTime":808.1204188481676,"audioSegment":0},{"text":"The backup's documents are now added to yours: a missing one comes back, an identical one is left alone,","startTime":808.1204188481676,"endTime":811.82722513089,"audioSegment":0},{"text":"and a different version is saved beside yours, marked \"from backup\" with the backup's date.","startTime":811.82722513089,"endTime":815.5340314136125,"audioSegment":0},{"text":"You can also leave the backup's documents out,","startTime":815.5340314136125,"endTime":819.2408376963351,"audioSegment":0},{"text":"and replacing a project from a backup made without its working files keeps the files already on this device.","startTime":819.2408376963351,"endTime":822.9476439790576,"audioSegment":0},{"text":"Restoring a backup can bring back your settings, if you ask.","startTime":822.9476439790576,"endTime":826.6544502617801,"audioSegment":0},{"text":"The restore dialog has an Also restore settings box, off by default.","startTime":826.6544502617801,"endTime":830.3612565445026,"audioSegment":0},{"text":"It restores which gezels hold roles such as your Meester.","startTime":830.3612565445026,"endTime":834.0680628272252,"audioSegment":0},{"text":"Your AI providers, models, folders and security level stay as they are on this device,","startTime":834.0680628272252,"endTime":837.7748691099476,"audioSegment":0},{"text":"so a backup made elsewhere, or one someone sends you, cannot change them.","startTime":837.7748691099476,"endTime":841.4816753926701,"audioSegment":0},{"text":"Ticking one item to replace no longer ticks an unrelated item of another kind,","startTime":841.4816753926701,"endTime":845.1884816753927,"audioSegment":0},{"text":"choosing a different backup clears the earlier choices, and a restore that fails says so.","startTime":845.1884816753927,"endTime":848.8952879581152,"audioSegment":0},{"text":"Setting up your first model is clearer.","startTime":848.8952879581152,"endTime":852.6020942408377,"audioSegment":0},{"text":"Home says when it is checking your computer for AI models, which can take a few minutes the first time,","startTime":852.6020942408377,"endTime":856.3089005235602,"audioSegment":0},{"text":"and offers up to three models already on your computer as an alternative to downloading one.","startTime":856.3089005235602,"endTime":860.0157068062828,"audioSegment":0},{"text":"The download shows its speed and the time left,","startTime":860.0157068062828,"endTime":863.7225130890052,"audioSegment":0},{"text":"and when progress pauses it says why instead of sitting still.","startTime":863.7225130890052,"endTime":867.4293193717277,"audioSegment":0},{"text":"The first launch is faster, above all on Windows.","startTime":867.4293193717277,"endTime":871.1361256544503,"audioSegment":0},{"text":"About 30,000 small catalog files now ship as one.","startTime":871.1361256544503,"endTime":874.8429319371728,"audioSegment":0},{"text":"A test build spent almost five minutes unpacking files on its first launch,","startTime":874.8429319371728,"endTime":878.5497382198953,"audioSegment":0},{"text":"more than half of them these.","startTime":878.5497382198953,"endTime":882.2565445026178,"audioSegment":0},{"text":"Local vision models can look at images they open themselves.","startTime":882.2565445026178,"endTime":885.9633507853403,"audioSegment":0},{"text":"On llama.cpp, a gezel whose model has its vision component loaded now sees an image it opens;","startTime":885.9633507853403,"endTime":889.6701570680628,"audioSegment":0},{"text":"without one, it is told plainly that no image was delivered instead of being told the call succeeded.","startTime":889.6701570680628,"endTime":893.3769633507853,"audioSegment":0},{"text":"Narration can speak progress updates.","startTime":893.3769633507853,"endTime":897.0837696335078,"audioSegment":0},{"text":"Settings → Audio → Include progress updates also reads out the short notes a gezel gives while it works,","startTime":897.0837696335078,"endTime":900.7905759162304,"audioSegment":0},{"text":"like \"Now I'll draft the outline.\" It is on by default and matters only when narration is on, so if you already use narration you will start hearing these.","startTime":900.7905759162304,"endTime":904.4973821989529,"audioSegment":0},{"text":"Updates that fall behind are dropped rather than read minutes late.","startTime":904.4973821989529,"endTime":908.2041884816754,"audioSegment":0},{"text":"Spoken replies use a new pronunciation dictionary.","startTime":908.2041884816754,"endTime":911.9109947643979,"audioSegment":0},{"text":"Text-to-speech no longer depends on eSpeak NG; gezel carries its own American and British English dictionaries,","startTime":911.9109947643979,"endTime":915.6178010471205,"audioSegment":0},{"text":"and the British voices now speak British English.","startTime":915.6178010471205,"endTime":919.3246073298429,"audioSegment":0},{"text":"Some words will sound different,","startTime":919.3246073298429,"endTime":923.0314136125654,"audioSegment":0},{"text":"and a bug where the last sentence of a reply sometimes never played is gone.","startTime":923.0314136125654,"endTime":926.738219895288,"audioSegment":0},{"text":"A free source of reference photos.","startTime":926.738219895288,"endTime":930.4450261780105,"audioSegment":0},{"text":"The Web Access toolset gains a Wikimedia Commons image search that needs no account or key and returns the credit and license for each picture.","startTime":930.4450261780105,"endTime":934.151832460733,"audioSegment":0},{"text":"It stays off wherever your security settings block outside services.","startTime":934.151832460733,"endTime":937.8586387434555,"audioSegment":0},{"text":"Small talk stays small.","startTime":937.8586387434555,"endTime":941.565445026178,"audioSegment":0},{"text":"A greeting like \"Hey, how's it going?\" no longer pulls unrelated files from your workspace into the reply,","startTime":941.565445026178,"endTime":945.2722513089005,"audioSegment":0},{"text":"and a task's automatic context no longer draws on files from the project's other tasks.","startTime":945.2722513089005,"endTime":948.979057591623,"audioSegment":0},{"text":"Gezel's own words are no longer marked as misspellings.","startTime":948.979057591623,"endTime":952.6858638743456,"audioSegment":0},{"text":"The spell checker knows gezel, meester, voorman, craftbook and the rest of the product's vocabulary,","startTime":952.6858638743456,"endTime":956.3926701570681,"audioSegment":0},{"text":"and the starter document in your shared library opens clean.","startTime":956.3926701570681,"endTime":960.0994764397906,"audioSegment":0},{"text":"At the Free security level on Windows,","startTime":960.0994764397906,"endTime":963.8062827225131,"audioSegment":0},{"text":"a gezel can run scripts it writes.","startTime":963.8062827225131,"endTime":967.5130890052355,"audioSegment":0},{"text":"These script tools used to be missing on Windows,","startTime":967.5130890052355,"endTime":971.2198952879581,"audioSegment":0},{"text":"which has no way to keep a script offline.","startTime":971.2198952879581,"endTime":974.9267015706806,"audioSegment":0},{"text":"At Free, where gezels may use outside services anyway,","startTime":974.9267015706806,"endTime":978.6335078534032,"audioSegment":0},{"text":"they now run with the usual file limits and ordinary network access.","startTime":978.6335078534032,"endTime":982.3403141361257,"audioSegment":0},{"text":"Lockdown, the default, is unchanged.","startTime":982.3403141361257,"endTime":986.0471204188482,"audioSegment":0},{"text":"The security model explains the difference;","startTime":986.0471204188482,"endTime":989.7539267015707,"audioSegment":0},{"text":"the same applies to Linux machines without systemd.","startTime":989.7539267015707,"endTime":993.4607329842931,"audioSegment":0},{"text":"Document search says when it cannot answer.","startTime":993.4607329842931,"endTime":997.1675392670157,"audioSegment":0},{"text":"Instead of an empty list, the Documents area tells you when a search failed,","startTime":997.1675392670157,"endTime":1000.8743455497382,"audioSegment":0},{"text":"when search is unavailable, or when results may be incomplete.","startTime":1000.8743455497382,"endTime":1004.5811518324607,"audioSegment":0},{"text":"Local models start more reliably when other apps are using the graphics card.","startTime":1004.5811518324607,"endTime":1008.2879581151833,"audioSegment":0},{"text":"On a PC with a separate graphics card,","startTime":1008.2879581151833,"endTime":1011.9947643979058,"audioSegment":0},{"text":"gezel now plans a model's memory against what is actually free rather than the card's total.","startTime":1011.9947643979058,"endTime":1015.7015706806283,"audioSegment":0},{"text":"A long local turn is no longer cut short because the engine was too busy to answer a health check.","startTime":1015.7015706806283,"endTime":1019.4083769633507,"audioSegment":0},{"text":"One such restart threw away twenty minutes of work.","startTime":1019.4083769633507,"endTime":1023.1151832460733,"audioSegment":0},{"text":"The llama.cpp engine's saved-state cache is capped at 8 GB and skips saving when your disk is nearly full;","startTime":1023.1151832460733,"endTime":1026.8219895287957,"audioSegment":0},{"text":"it used to grow without limit.","startTime":1026.8219895287957,"endTime":1030.5287958115184,"audioSegment":0},{"text":"Tasks keep moving.","startTime":1030.5287958115184,"endTime":1034.235602094241,"audioSegment":0},{"text":"A step that fanned out into child tasks picks up as soon as the children finish instead of several minutes later; a step waiting for a busy engine gets its turn within a minute;","startTime":1034.235602094241,"endTime":1037.9424083769634,"audioSegment":0},{"text":"a step's check no longer repeats an old \"file not found\" after the file has been written; and a task that cannot be started pauses and asks for help instead of sitting silent.","startTime":1037.9424083769634,"endTime":1041.6492146596859,"audioSegment":0},{"text":"Claude CLI and Codex CLI can pass craftbooks that check the test run.","startTime":1041.6492146596859,"endTime":1045.3560209424083,"audioSegment":0},{"text":"Those checks look for a record gezel's own script runners write,","startTime":1045.3560209424083,"endTime":1049.0628272251308,"audioSegment":0},{"text":"and both providers used to have those runners hidden.","startTime":1049.0628272251308,"endTime":1052.7696335078533,"audioSegment":0},{"text":"The Meester's Home chat opens on a fresh thread when you start gezel instead of reopening the last one;","startTime":1052.7696335078533,"endTime":1056.476439790576,"audioSegment":0},{"text":"unsent drafts are still there.","startTime":1056.476439790576,"endTime":1060.1832460732985,"audioSegment":0},{"text":"A launch with first-run setup unfinished always lands on Home.","startTime":1060.1832460732985,"endTime":1063.890052356021,"audioSegment":0},{"text":"Scripts cut off by closing gezel are marked failed at the next start,","startTime":1063.890052356021,"endTime":1067.5968586387435,"audioSegment":0},{"text":"with a note that their actions were not replayed.","startTime":1067.5968586387435,"endTime":1071.303664921466,"audioSegment":0},{"text":"With advanced features on,","startTime":1071.303664921466,"endTime":1075.0104712041884,"audioSegment":0},{"text":"the Scripts view can also browse and run the built-in Standard library.","startTime":1075.0104712041884,"endTime":1078.717277486911,"audioSegment":0},{"text":"Keyboard focus returns to the button that opened a dialog when the dialog closes,","startTime":1078.717277486911,"endTime":1082.4240837696334,"audioSegment":0},{"text":"and a gezel's name is now a proper Rename gezel button.","startTime":1082.4240837696334,"endTime":1086.130890052356,"audioSegment":0},{"text":"Craftbook steps can use the tools their own instructions name.","startTime":1086.130890052356,"endTime":1089.8376963350786,"audioSegment":0},{"text":"More than 600 steps in the catalog could not open the working files an earlier step had left, such as the scope a review step is told to check against,","startTime":1089.8376963350786,"endTime":1093.544502617801,"audioSegment":0},{"text":"and a build step asked for a picture or a data file could not call the image or script tool it was told to use. Both work now.","startTime":1093.544502617801,"endTime":1097.2513089005236,"audioSegment":0},{"text":"Automatic context follows what you asked for.","startTime":1097.2513089005236,"endTime":1100.958115183246,"audioSegment":0},{"text":"A craftbook task now looks up the subject you gave it,","startTime":1100.958115183246,"endTime":1104.6649214659685,"audioSegment":0},{"text":"so \"a PowerPoint about quiche\" searches for quiche rather than for the recipe's own wording, which pulled in unrelated material.","startTime":1104.6649214659685,"endTime":1108.3717277486912,"audioSegment":0},{"text":"Catalog searches answer while they warm up.","startTime":1108.3717277486912,"endTime":1112.0785340314137,"audioSegment":0},{"text":"A catalog whose search model is still loading returns its keyword matches instead of nothing,","startTime":1112.0785340314137,"endTime":1115.7853403141362,"audioSegment":0},{"text":"and a gezel is told the results are incomplete rather than that the catalog has nothing on the topic.","startTime":1115.7853403141362,"endTime":1119.4921465968587,"audioSegment":0},{"text":"Pictures and chat share the machine.","startTime":1119.4921465968587,"endTime":1123.1989528795812,"audioSegment":0},{"text":"Making an image no longer waits for a loaded chat model to go idle,","startTime":1123.1989528795812,"endTime":1126.9057591623036,"audioSegment":0},{"text":"and the next chat turn no longer unloads the image engine, so a run of pictures stops paying for a fresh load each time.","startTime":1126.9057591623036,"endTime":1130.6125654450261,"audioSegment":0},{"text":"The two run side by side whenever memory allows.","startTime":1130.6125654450261,"endTime":1134.3193717277486,"audioSegment":0},{"text":"More Linux machines draw pictures on the graphics card.","startTime":1134.3193717277486,"endTime":1138.026178010471,"audioSegment":0},{"text":"With an NVIDIA card, the image engine now uses CUDA, and the NVIDIA DGX Spark,","startTime":1138.026178010471,"endTime":1141.7329842931938,"audioSegment":0},{"text":"which drew pictures on its processor at several minutes each, now uses its graphics chip too.","startTime":1141.7329842931938,"endTime":1145.4397905759163,"audioSegment":0},{"text":"Gezel picks the right build on its own;","startTime":1145.4397905759163,"endTime":1149.1465968586388,"audioSegment":0},{"text":"the Linux download is larger because it carries both.","startTime":1149.1465968586388,"endTime":1152.8534031413612,"audioSegment":0},{"text":"On the NVIDIA DGX Spark, memory is counted once.","startTime":1152.8534031413612,"endTime":1156.5602094240837,"audioSegment":0},{"text":"Gezel counted the Spark's shared memory twice,","startTime":1156.5602094240837,"endTime":1160.2670157068064,"audioSegment":0},{"text":"so it could start a picture beside a large chat model when the two did not fit, and the image engine crashed.","startTime":1160.2670157068064,"endTime":1163.973821989529,"audioSegment":0},{"text":"The on-device engines there also move to CUDA 13, under which pictures rendered faster in our measurements;","startTime":1163.973821989529,"endTime":1167.6806282722514,"audioSegment":0},{"text":"it needs NVIDIA driver R580 or newer, which every DGX OS image already has.","startTime":1167.6806282722514,"endTime":1171.3874345549739,"audioSegment":0},{"text":"Reports read like documents.","startTime":1171.3874345549739,"endTime":1175.0942408376964,"audioSegment":0},{"text":"Files in the References rail, task notes, night reviews, status reports,","startTime":1175.0942408376964,"endTime":1178.8010471204188,"audioSegment":0},{"text":"and plans or reports shown beside a question now appear with a left-aligned title and headings that follow the text's own levels, instead of in a web-page style with a large centered cover.","startTime":1178.8010471204188,"endTime":1182.5078534031413,"audioSegment":0},{"text":"Chat replies lose the large centered title too;","startTime":1182.5078534031413,"endTime":1186.2146596858638,"audioSegment":0},{"text":"Help and Knowledge articles keep the richer style.","startTime":1186.2146596858638,"endTime":1189.9214659685863,"audioSegment":0},{"text":"Chat replies show what the model wrote.","startTime":1189.9214659685863,"endTime":1193.628272251309,"audioSegment":0},{"text":"Dollar amounts such as \"$300 … 3.50\" are no longer swallowed into code formatting,","startTime":1193.628272251309,"endTime":1197.3350785340315,"audioSegment":0},{"text":"math-style symbols such as `\\rightarrow$` show as the real characters (→, ×, ≤), and a wide table scrolls instead of breaking words in half.","startTime":1197.3350785340315,"endTime":1201.041884816754,"audioSegment":0},{"text":"A turn made only of tool calls says what the last action was instead of \"(continued in the next turn)\".","startTime":1201.041884816754,"endTime":1204.7486910994764,"audioSegment":0},{"text":"Side conversations stay beside the message that started them.","startTime":1204.7486910994764,"endTime":1208.455497382199,"audioSegment":0},{"text":"When a gezel consults or hands off to another, that exchange now sits under the turn it belongs to,","startTime":1208.455497382199,"endTime":1212.1623036649214,"audioSegment":0},{"text":"instead of piling up below your newest message and pushing the reply out of view.","startTime":1212.1623036649214,"endTime":1215.8691099476441,"audioSegment":0},{"text":"Project files open in their project.","startTime":1215.8691099476441,"endTime":1219.5759162303666,"audioSegment":0},{"text":"Opening a file from a question card or
