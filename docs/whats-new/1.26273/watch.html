 a night review used to open it in the shared library's editor,","startTime":1219.5759162303666,"endTime":1223.282722513089,"audioSegment":0},{"text":"whose autosave could quietly save a lossy copy into your library.","startTime":1223.282722513089,"endTime":1226.9895287958116,"audioSegment":0},{"text":"It now opens in the project's Artifacts view,","startTime":1226.9895287958116,"endTime":1230.696335078534,"audioSegment":0},{"text":"with a Back to the question bar to return.","startTime":1230.696335078534,"endTime":1234.4031413612565,"audioSegment":0},{"text":"Documents look the way they are stored.","startTime":1234.4031413612565,"endTime":1238.109947643979,"audioSegment":0},{"text":"Library documents, project files, a gezel's about text and a project's description no longer show stray backslashes such as \\$3.50,","startTime":1238.109947643979,"endTime":1241.8167539267015,"audioSegment":0},{"text":"and a task's description no longer says Unsaved changes just from being opened.","startTime":1241.8167539267015,"endTime":1245.523560209424,"audioSegment":0},{"text":"Community toolsets are labeled.","startTime":1245.523560209424,"endTime":1249.2303664921467,"audioSegment":0},{"text":"Most of the toolset catalog is imported automatically from the public MCP registry,","startTime":1249.2303664921467,"endTime":1252.9371727748692,"audioSegment":0},{"text":"and those entries now carry a Community badge and a \"Shared by\" line naming who published them.","startTime":1252.9371727748692,"endTime":1256.6439790575917,"audioSegment":0},{"text":"They are listed after the toolsets gezel reviews,","startTime":1256.6439790575917,"endTime":1260.3507853403141,"audioSegment":0},{"text":"and their setup form warns you never to enter a wallet's private key or recovery phrase.","startTime":1260.3507853403141,"endTime":1264.0575916230366,"audioSegment":0},{"text":"The imported list also leaves out honeypots, prompt-injection demos,","startTime":1264.0575916230366,"endTime":1267.764397905759,"audioSegment":0},{"text":"gambling and adult entries, and tools that ask for a wallet's key.","startTime":1267.764397905759,"endTime":1271.4712041884818,"audioSegment":0},{"text":"Tighter limits on what a gezel can do on your behalf.","startTime":1271.4712041884818,"endTime":1275.1780104712043,"audioSegment":0},{"text":"A gezel can no longer apply or dismiss its own change proposals, force a task step past its check,","startTime":1275.1780104712043,"endTime":1278.8848167539268,"audioSegment":0},{"text":"create a task that trusts custom scripts, or fire the actions in a report; those stay your clicks.","startTime":1278.8848167539268,"endTime":1282.5916230366493,"audioSegment":0},{"text":"A script a gezel runs is recorded as the gezel's,","startTime":1282.5916230366493,"endTime":1286.2984293193717,"audioSegment":0},{"text":"so turning scripts off in your security settings now stops it too.","startTime":1286.2984293193717,"endTime":1290.0052356020942,"audioSegment":0},{"text":"Nothing you do changes.","startTime":1290.0052356020942,"endTime":1293.7120418848167,"audioSegment":0},{"text":"Mail goes only where you allowed it.","startTime":1293.7120418848167,"endTime":1297.4188481675392,"audioSegment":0},{"text":"An address written to look like an allowed one could get mail delivered to a different address.","startTime":1297.4188481675392,"endTime":1301.1256544502617,"audioSegment":0},{"text":"Gezel now checks the address the mail is actually sent to,","startTime":1301.1256544502617,"endTime":1304.8324607329844,"audioSegment":0},{"text":"including copies and blind copies.","startTime":1304.8324607329844,"endTime":1308.5392670157069,"audioSegment":0},{"text":"It is also no longer possible to add a hidden recipient through the subject line.","startTime":1308.5392670157069,"endTime":1312.2460732984293,"audioSegment":0},{"text":"On Linux and macOS,","startTime":1312.2460732984293,"endTime":1315.9528795811518,"audioSegment":0},{"text":"the installed service's program files belong to the system.","startTime":1315.9528795811518,"endTime":1319.6596858638745,"audioSegment":0},{"text":"They could end up owned by whichever local account happened to share an id number with our build machine's account,","startTime":1319.6596858638745,"endTime":1323.366492146597,"audioSegment":0},{"text":"which could then change them.","startTime":1323.366492146597,"endTime":1327.0732984293195,"audioSegment":0},{"text":"They are now owned by the system and read-only.","startTime":1327.0732984293195,"endTime":1330.780104712042,"audioSegment":0},{"text":"Nothing you do changes.","startTime":1330.780104712042,"endTime":1334.4869109947645,"audioSegment":0},{"text":"New projects reuse your crew.","startTime":1334.4869109947645,"endTime":1338.193717277487,"audioSegment":0},{"text":"A project that brings its own team, such as a social feed,","startTime":1338.193717277487,"endTime":1341.9005235602094,"audioSegment":0},{"text":"now reuses a copywriter or other gezel you already have instead of hiring a second one.","startTime":1341.9005235602094,"endTime":1345.607329842932,"audioSegment":0},{"text":"The Default project and the shared library no longer get a project type of their own,","startTime":1345.607329842932,"endTime":1349.3141361256544,"audioSegment":0},{"text":"so Default's recipe shelf stops being titled after something like an email inbox.","startTime":1349.3141361256544,"endTime":1353.0209424083769,"audioSegment":0},{"text":"A document you name is saved under that name.","startTime":1353.0209424083769,"endTime":1356.7277486910994,"audioSegment":0},{"text":"Ask for plan.md and get the plan pasted into chat,","startTime":1356.7277486910994,"endTime":1360.434554973822,"audioSegment":0},{"text":"and the gezel is told to save it as plan.md, not under a name made from its first heading.","startTime":1360.434554973822,"endTime":1364.1413612565445,"audioSegment":0},{"text":"Error buttons go where they say.","startTime":1364.1413612565445,"endTime":1367.848167539267,"audioSegment":0},{"text":"A chat error saying no model is installed offers Set up a model, which goes to Home,","startTime":1367.848167539267,"endTime":1371.5549738219895,"audioSegment":0},{"text":"and an engine error's Choose a model opens that engine's models page instead of Settings → General.","startTime":1371.5549738219895,"endTime":1375.2617801047122,"audioSegment":0},{"text":"Narrow windows keep every tab in view.","startTime":1375.2617801047122,"endTime":1378.9685863874347,"audioSegment":0},{"text":"When a project's tabs no longer fit, they shrink to icons,","startTime":1378.9685863874347,"endTime":1382.6753926701572,"audioSegment":0},{"text":"keeping the current tab's name for as long as there is room, instead of scrolling sideways.","startTime":1382.6753926701572,"endTime":1386.3821989528797,"audioSegment":0},{"text":"Everything is a little more compact below about 760 pixels wide,","startTime":1386.3821989528797,"endTime":1390.0890052356021,"audioSegment":0},{"text":"and a window driven by a mouse keeps its desktop-sized rows.","startTime":1390.0890052356021,"endTime":1393.7958115183246,"audioSegment":0},{"text":"Home steps aside once you start.","startTime":1393.7958115183246,"endTime":1397.502617801047,"audioSegment":0},{"text":"The greeting at the top of Home folds away after you send a message,","startTime":1397.502617801047,"endTime":1401.2094240837696,"audioSegment":0},{"text":"for that visit.","startTime":1401.2094240837696,"endTime":1404.916230366492,"audioSegment":0},{"text":"A gezel's growth updates within seconds of finished work instead of waiting for the daily recount,","startTime":1404.916230366492,"endTime":1408.6230366492146,"audioSegment":0},{"text":"so a gezel who has just finished a step no longer shows 0 XP.","startTime":1408.6230366492146,"endTime":1412.329842931937,"audioSegment":0},{"text":"Quitting during first-run setup no longer leaves work behind.","startTime":1412.329842931937,"endTime":1416.0366492146597,"audioSegment":0},{"text":"A download under way is stopped and started again at the next launch,","startTime":1416.0366492146597,"endTime":1419.7434554973822,"audioSegment":0},{"text":"and an interrupted download of the search model no longer keeps memory switched off for hours.","startTime":1419.7434554973822,"endTime":1423.4502617801047,"audioSegment":0},{"text":"Settings → About → Legal and privacy links to how gezel handles your data,","startTime":1423.4502617801047,"endTime":1427.1570680628272,"audioSegment":0},{"text":"its license, the third-party notices and the end user license agreement.","startTime":1427.1570680628272,"endTime":1430.86387434555,"audioSegment":0},{"text":"Small new models and a video model with sound.","startTime":1430.86387434555,"endTime":1434.5706806282724,"audioSegment":0},{"text":"The catalog adds MiniCPM5 1B and 2B and Qwen 3.5 0.8B (which can also see images),","startTime":1434.5706806282724,"endTime":1438.2774869109949,"audioSegment":0},{"text":"the smallest chat models gezel offers.","startTime":1438.2774869109949,"endTime":1441.9842931937173,"audioSegment":0},{"text":"In Settings → Video generation, LTX-2.3 and its faster distilled version make clips with matching sound;","startTime":1441.9842931937173,"endTime":1445.6910994764398,"audioSegment":0},{"text":"both need a machine with around 128 GB of memory and are about a 95 GB download.","startTime":1445.6910994764398,"endTime":1449.3979057591623,"audioSegment":0},{"text":"The engine indicator in the title bar is shorter.","startTime":1449.3979057591623,"endTime":1453.1047120418848,"audioSegment":0},{"text":"It names the engine and what it is doing;","startTime":1453.1047120418848,"endTime":1456.8115183246073,"audioSegment":0},{"text":"the model's name is in the panel that opens when you click it.","startTime":1456.8115183246073,"endTime":1460.5183246073298,"audioSegment":0},{"text":"A project's Approvals tab is now called Tools, in three parts: the packages installed in the project,","startTime":1460.5183246073298,"endTime":1464.2251308900522,"audioSegment":0},{"text":"the scripts a gezel can ask to run, and the answers you gave when a gezel asked.","startTime":1464.2251308900522,"endTime":1467.9319371727747,"audioSegment":0},{"text":"The Knowledge settings table is simpler.","startTime":1467.9319371727747,"endTime":1471.6387434554974,"audioSegment":0},{"text":"A catalog installed for everyone on this device is marked Shared,","startTime":1471.6387434554974,"endTime":1475.34554973822,"audioSegment":0},{"text":"and one that cannot be used says Not available instead of offering an Enable box.","startTime":1475.34554973822,"endTime":1479.0523560209424,"audioSegment":0},{"text":"Local-first: your data stays on your disk now lists every reason gezel goes online: the downloads you start,","startTime":1479.0523560209424,"endTime":1482.759162303665,"audioSegment":0},{"text":"the tools it sets up, update checks, and web searches you allow.","startTime":1482.759162303665,"endTime":1486.4659685863876,"audioSegment":0},{"text":"It also says where your provider keys are kept,","startTime":1486.4659685863876,"endTime":1490.17277486911,"audioSegment":0},{"text":"and what the pass that guards gezel's background service does and does not keep out.","startTime":1490.17277486911,"endTime":1493.8795811518326,"audioSegment":0},{"text":"Catalog content moved from @bendyline/gilde 0.1.67 to 0.1.76.","startTime":1493.8795811518326,"endTime":1497.586387434555,"audioSegment":0},{"text":"The on-device engines moved from native release 0.1.43 to 0.1.46,","startTime":1497.586387434555,"endTime":1501.2931937172775,"audioSegment":0},{"text":"which brings the image engine up from stable-diffusion.cpp master-789 to master-919.","startTime":1501.2931937172775,"endTime":1505,"audioSegment":0},{"text":"If you use the gezel command,","startTime":1505,"endTime":1508.1538461538462,"audioSegment":0},{"text":"it now does a better job of telling you what is missing and what to type.","startTime":1508.1538461538462,"endTime":1511.3076923076924,"audioSegment":0},{"text":"The gezel command line covers the everyday commands,","startTime":1511.3076923076924,"endTime":1514.4615384615386,"audioSegment":0},{"text":"models, knowledge catalogs, keys, and backups.","startTime":1514.4615384615386,"endTime":1517.6153846153845,"audioSegment":0},{"text":"gezel run checks first that a model is ready.","startTime":1517.6153846153845,"endTime":1520.7692307692307,"audioSegment":0},{"text":"On a new machine it says what is missing and which commands set it up,","startTime":1520.7692307692307,"endTime":1523.923076923077,"audioSegment":0},{"text":"instead of starting a download it could not finish and asking you to try again.","startTime":1523.923076923077,"endTime":1527.076923076923,"audioSegment":0},{"text":"It downloads nothing on its own,","startTime":1527.076923076923,"endTime":1530.2307692307693,"audioSegment":0},{"text":"and its reply is no longer buried under the service's startup messages.","startTime":1530.2307692307693,"endTime":1533.3846153846155,"audioSegment":0},{"text":"Typos get a suggestion.","startTime":1533.3846153846155,"endTime":1536.5384615384614,"audioSegment":0},{"text":"A mistyped command names the one you probably meant,","startTime":1536.5384615384614,"endTime":1539.6923076923076,"audioSegment":0},{"text":"and a sentence typed without run points you to gezel run \"<prompt>\".","startTime":1539.6923076923076,"endTime":1542.8461538461538,"audioSegment":0},{"text":"Bare gezel run somewhere that is not an interactive terminal says so instead of printing a crash.","startTime":1542.8461538461538,"endTime":1546,"audioSegment":0},{"text":"Errors fit on one line.","startTime":1546,"endTime":1549.1538461538462,"audioSegment":0},{"text":"A wrong gezel id or task reference says there is no such gezel or task and how to list them,","startTime":1549.1538461538462,"endTime":1552.3076923076924,"audioSegment":0},{"text":"instead of printing a stack trace.","startTime":1552.3076923076924,"endTime":1555.4615384615386,"audioSegment":0},{"text":"Set GEZEL_DEBUG=1 to see the full error.","startTime":1555.4615384615386,"endTime":1558.6153846153845,"audioSegment":0},{"text":"gezel project is another name for gezel env,","startTime":1558.6153846153845,"endTime":1561.7692307692307,"audioSegment":0},{"text":"and gezel native install --engine duckdb installs just the data query engine.","startTime":1561.7692307692307,"endTime":1564.923076923077,"audioSegment":0},{"text":"After gezel stop --daemon,","startTime":1564.923076923077,"endTime":1568.076923076923,"audioSegment":0},{"text":"gezel status says the service is not running instead of listing a stopped process.","startTime":1568.076923076923,"endTime":1571.2307692307693,"audioSegment":0},{"text":"--http1 makes any command talk to the service over HTTP/1.1, still checking its certificate,","startTime":1571.2307692307693,"endTime":1574.3846153846155,"audioSegment":0},{"text":"and gezel do --wait rides out a brief dropped connection instead of failing.","startTime":1574.3846153846155,"endTime":1577.5384615384614,"audioSegment":0},{"text":"gezel secret set tavilyApiKey --use-for-search is refused for now: Tavily search is not available yet,","startTime":1577.5384615384614,"endTime":1580.6923076923076,"audioSegment":0},{"text":"and the option used to switch web search to a service that always failed.","startTime":1580.6923076923076,"endTime":1583.8461538461538,"audioSegment":0},{"text":"The key itself can still be saved.","startTime":1583.8461538461538,"endTime":1587,"audioSegment":0},{"text":"Craftbook inputs.","startTime":1587,"endTime":1590.2987012987012,"audioSegment":0},{"text":"A paramSchema property with \"input\": { \"kind\": \"folder\" } (or a file kind) gets the Works on picker.","startTime":1590.2987012987012,"endTime":1593.5974025974026,"audioSegment":0},{"text":"TaskManager.create resolves it before interpolation, writes a manifest, stamps Task.inputs,","startTime":1593.5974025974026,"endTime":1596.8961038961038,"audioSegment":0},{"text":"and names the drawer and its tools in every step prompt; the adopted folder is write-denied to gezels.","startTime":1596.8961038961038,"endTime":1600.1948051948052,"audioSegment":0},{"text":"Launch-form annotations.","startTime":1600.1948051948052,"endTime":1603.4935064935064,"audioSegment":0},{"text":"askUser: false hides a param another surface fills and askUser: true forces one back;","startTime":1603.4935064935064,"endTime":1606.7922077922078,"audioSegment":0},{"text":"a param whose default is a runtime template ({{task.dir}}) is never shown.","startTime":1606.7922077922078,"endTime":1610.090909090909,"audioSegment":0},{"text":"fromMessage: true names the param a chat message fills,","startTime":1610.090909090909,"endTime":1613.3896103896104,"audioSegment":0},{"text":"and a book's triggers feed the suggestion strip.","startTime":1613.3896103896104,"endTime":1616.6883116883116,"audioSegment":0},{"text":"POST /api/sessions/:id/launch-task creates a craftbook task from a chat message with no model turn,","startTime":1616.6883116883116,"endTime":1619.987012987013,"audioSegment":0},{"text":"sharing invocation-key dedupe with the MCP invoke_craftbook tool.","startTime":1619.987012987013,"endTime":1623.2857142857142,"audioSegment":0},{"text":"A send carrying turnIntent: 'off' stands the turn-intent routing down for that turn.","startTime":1623.2857142857142,"endTime":1626.5844155844156,"audioSegment":0},{"text":"New gate check artifactReadEvidence,","startTime":1626.5844155844156,"endTime":1629.8831168831168,"audioSegment":0},{"text":"and a terminal step may complete when its deliverable is saved.","startTime":1629.8831168831168,"endTime":1633.1818181818182,"audioSegment":0},{"text":"New MCP tools: manage_task (pause, resume, cancel;","startTime":1633.1818181818182,"endTime":1636.4805194805194,"audioSegment":0},{"text":"resume and cancel only on a user-directed turn) in the Meester's task-oversight kit, and wikimedia_image_search.","startTime":1636.4805194805194,"endTime":1639.7792207792209,"audioSegment":0},{"text":"/v1/models lists models that are not downloaded yet.","startTime":1639.7792207792209,"endTime":1643.077922077922,"audioSegment":0},{"text":"Connected Apps now see every model gezel can run, each with a non-standard availability field: available,","startTime":1643.077922077922,"endTime":1646.3766233766235,"audioSegment":0},{"text":"or download-required for one that must be fetched first.","startTime":1646.3766233766235,"endTime":1649.6753246753246,"audioSegment":0},{"text":"An app that picks the first listed model should check it.","startTime":1649.6753246753246,"endTime":1652.974025974026,"audioSegment":0},{"text":"A launch missing a parameter its craftbook needs answers 422 with code: 'craftbook_params_missing' and the fields to fill,","startTime":1652.974025974026,"endTime":1656.2727272727273,"audioSegment":0},{"text":"instead of a 500.","startTime":1656.2727272727273,"endTime":1659.5714285714287,"audioSegment":0},{"text":"Generalist mode is config.generalistMode: 'auto' | 'on' | 'off';","startTime":1659.5714285714287,"endTime":1662.8701298701299,"audioSegment":0},{"text":"the older executionDensity key is migrated once, and each task is stamped with executionMode at creation.","startTime":1662.8701298701299,"endTime":1666.1688311688313,"audioSegment":0},{"text":"App SDK hosting.","startTime":1666.1688311688313,"endTime":1669.4675324675325,"audioSegment":0},{"text":"A saved grant is reused before hosting, hostWhenRefused hosts a private daemon even after the user declines, a hosted daemon always takes an ephemeral port,","startTime":1669.4675324675325,"endTime":1672.7662337662337,"audioSegment":0},{"text":"and host.nativeBinDir with the new @bendyline/gezel-service/native-release export lets an application ship its own engines.","startTime":1672.7662337662337,"endTime":1676.064935064935,"audioSegment":0},{"text":"See Building connected apps with gezel-app-sdk.","startTime":1676.064935064935,"endTime":1679.3636363636363,"audioSegment":0},{"text":"gezel status exits 1 when the service is not running or not healthy,","startTime":1679.3636363636363,"endTime":1682.6623376623377,"audioSegment":0},{"text":"so scripts can test it directly.","startTime":1682.6623376623377,"endTime":1685.9610389610389,"audioSegment":0},{"text":"@bendyline/gezel-script-runtime joins the npm packages at 0.1.0: the host-neutral script executor with a QuickJS (WebAssembly) implementation.","startTime":1685.9610389610389,"endTime":1689.2597402597403,"audioSegment":0},{"text":"Gezel on npm now also lists @bendyline/gezk and @bendyline/gezel-knowledge.","startTime":1689.2597402597403,"endTime":1692.5584415584415,"audioSegment":0},{"text":"The @bendyline/gezel-service package is about 7.5 MB smaller.","startTime":1692.5584415584415,"endTime":1695.857142857143,"audioSegment":0},{"text":"gezeld now launches the package's own dist/index.js instead of carrying a second copy of the daemon.","startTime":1695.857142857143,"endTime":1699.155844155844,"audioSegment":0},{"text":"An npm install of the service ignores a pnpm-workspace.yaml above it.","startTime":1699.155844155844,"endTime":1702.4545454545455,"audioSegment":0},{"text":"The eval runner used to accept any such file as a gezel source checkout,","startTime":1702.4545454545455,"endTime":1705.7532467532467,"audioSegment":0},{"text":"so one planted in a shared parent folder could have the daemon run a program from that folder with its credentials.","startTime":1705.7532467532467,"endTime":1709.051948051948,"audioSegment":0},{"text":"It now accepts only a real gezel checkout.","startTime":1709.051948051948,"endTime":1712.3506493506493,"audioSegment":0},{"text":"Nothing you do changes.","startTime":1712.3506493506493,"endTime":1715.6493506493507,"audioSegment":0},{"text":"New craftbook lint rule policy-denies-instructed-tool flags a step whose own toolPolicy removes a tool its procedure tells the model to use.","startTime":1715.6493506493507,"endTime":1718.948051948052,"audioSegment":0},{"text":"A group-level artifacts denial now withdraws only the drawer's writer,","startTime":1718.948051948052,"endTime":1722.2467532467533,"audioSegment":0},{"text":"never its read tools.","startTime":1722.2467532467533,"endTime":1725.5454545454545,"audioSegment":0},{"text":"search reports truncationReason: 'incomplete' when a source did not answer in time. Owner steps.","startTime":1725.5454545454545,"endTime":1728.844155844156,"audioSegment":0},{"text":"A step with no assignee whose name reads as the owner's sign-off (owner|client|customer + review|approval|sign-off,","startTime":1728.844155844156,"endTime":1732.142857142857,"audioSegment":0},{"text":"or final approval|sign-off) is assigned to the user by the catalog loader, the document compiler and the JSON craftbook routes.","startTime":1732.142857142857,"endTime":1735.4415584415585,"audioSegment":0},{"text":"No gezel is dispatched; a step-awaits-owner question carries the review,","startTime":1735.4415584415585,"endTime":1738.7402597402597,"audioSegment":0},{"text":"and a session token completing the step gets 409 code: 'owner_step'.","startTime":1738.7402597402597,"endTime":1742.0389610389611,"audioSegment":0},{"text":"Step runWhen ({ answerOf, choiceAnyOf?, writeInMatches?, onMissing?","startTime":1742.0389610389611,"endTime":1745.3376623376623,"audioSegment":0},{"text":"}) skips a step, with a note and no model turn,","startTime":1745.3376623376623,"endTime":1748.6363636363635,"audioSegment":0},{"text":"unless an earlier answer asked for it.","startTime":1748.6363636363635,"endTime":1751.935064935065,"audioSegment":0},{"text":"Questions now record stepId so the answer can be matched.","startTime":1751.935064935065,"endTime":1755.2337662337663,"audioSegment":0},{"text":"New gate checks listedFiles (one file per value in a frontmatter list) and figures (sums,","startTime":1755.2337662337663,"endTime":1758.5324675324675,"audioSegment":0},{"text":"quantity × price, weekday against date).","startTime":1758.5324675324675,"endTime":1761.8311688311687,"audioSegment":0},{"text":"The Meester suggests both when it authors a craftbook.","startTime":1761.8311688311687,"endTime":1765.1298701298701,"audioSegment":0},{"text":"New events task_settled and growth_updated, a task-finished question intent, and ChatSession.servedModel,","startTime":1765.1298701298701,"endTime":1768.4285714285713,"audioSegment":0},{"text":"which names the model that actually answered when a stand-in served an uninstalled pin.","startTime":1768.4285714285713,"endTime":1771.7272727272727,"audioSegment":0},{"text":"Session tokens are refused applying or dismissing diffpacks, firing or dismissing report actions,","startTime":1771.7272727272727,"endTime":1775.025974025974,"audioSegment":0},{"text":"forcing a step past its gate, and creating a task with trustScripts (including through the task.create script).","startTime":1775.025974025974,"endTime":1778.3246753246754,"audioSegment":0},{"text":"Retrying or resuming a paused task is admitted only inside a turn the user started,","startTime":1778.3246753246754,"endTime":1781.6233766233765,"audioSegment":0},{"text":"and a session-token /scripts/run is recorded as a chat run, never manual.","startTime":1781.6233766233765,"endTime":1784.922077922078,"audioSegment":0},{"text":"Project types reuse the roster.","startTime":1784.922077922078,"endTime":1788.2207792207791,"audioSegment":0},{"text":"reuseRosterGezels now defaults to true, matching by template and then by exact role title,","startTime":1788.2207792207791,"endTime":1791.5194805194806,"audioSegment":0},{"text":"and gezelsCreated[].reused says which were reused.","startTime":1791.5194805194806,"endTime":1794.8181818181818,"audioSegment":0},{"text":"@bendyline/gezel-client retries GET requests up to three times on a transient connection failure.","startTime":1794.8181818181818,"endTime":1798.1168831168832,"audioSegment":0},{"text":"GEZEL_HTTP_VERSION=1.1 forces HTTP/1.1.","startTime":1798.1168831168832,"endTime":1801.4155844155844,"audioSegment":0},{"text":"Packaged builds lock down Electron.","startTime":1801.4155844155844,"endTime":1804.7142857142858,"audioSegment":0},{"text":"The app and every Electron-as-Node process ignore NODE_OPTIONS and NODE_EXTRA_CA_CERTS,","startTime":1804.7142857142858,"endTime":1808.012987012987,"audioSegment":0},{"text":"and --inspect is off.","startTime":1808.012987012987,"endTime":1811.3116883116884,"audioSegment":0},{"text":"If you relied on NODE_EXTRA_CA_CERTS to trust a corporate proxy with the packaged app,","startTime":1811.3116883116884,"endTime":1814.6103896103896,"audioSegment":0},{"text":"that no longer applies.","startTime":1814.6103896103896,"endTime":1817.909090909091,"audioSegment":0},{"text":"DevTools are off in packaged builds unless you launch with GEZEL_DEVTOOLS=1.","startTime":1817.909090909091,"endTime":1821.2077922077922,"audioSegment":0},{"text":"MiniCPM5's tool-call format (<function name=…><param …>) is parsed.","startTime":1821.2077922077922,"endTime":1824.5064935064936,"audioSegment":0},{"text":"Licenses and SBOM.","startTime":1824.5064935064936,"endTime":1827.8051948051948,"audioSegment":0},{"text":"The license texts for the DirectML, DirectX shader compiler and ONNX Runtime files already shipped on Windows are now included and named in the end user license agreement,","startTime":1827.8051948051948,"endTime":1831.1038961038962,"audioSegment":0},{"text":"and the release SBOM carries file hashes and SPDX license ids.","startTime":1831.1038961038962,"endTime":1834.4025974025974,"audioSegment":0},{"text":"Dependencies: @bendyline/squisq 2.11.11, @bendyline/squisq-react 2.11.13, @bendyline/squisq-editor-react 2.11.14, hono 4.13.9, adm-zip 0.6.1,","startTime":1834.4025974025974,"endTime":1837.7012987012986,"audioSegment":0},{"text":"nodemailer 9.1.1 (a denial-of-service fix reachable through inbound mail), undici 8.11.2, bundled pnpm 11.27.1, Electron 43.7.5.","startTime":1837.7012987012986,"endTime":1841,"audioSegment":0},{"text":"Open a fresh thread with your Meester, press Task and pick a craftbook —","startTime":1841,"endTime":1844.5555555555557,"audioSegment":0},{"text":"or just describe what you want and watch for a suggested task above your message.","startTime":1844.5555555555557,"endTime":1848.111111111111,"audioSegment":0},{"text":"When it finishes,","startTime":1848.111111111111,"endTime":1851.6666666666667,"audioSegment":0},{"text":"look for the closing message in that thread and read anything listed under \"Before you send anything, check:\".","startTime":1851.6666666666667,"endTime":1855.2222222222222,"audioSegment":0},{"text":"Visit Settings → Knowledge and install a Wikipedia shelf or two for the subjects you work in.","startTime":1855.2222222222222,"endTime":1858.7777777777778,"audioSegment":0},{"text":"If you use a hosted model, look at Settings → Artificial Intelligence → Run in generalist mode;","startTime":1858.7777777777778,"endTime":1862.3333333333333,"audioSegment":0},{"text":"Automatic is a good place to stay.","startTime":1862.3333333333333,"endTime":1865.888888888889,"audioSegment":0},{"text":"On a Mac still running macOS 13,","startTime":1865.888888888889,"endTime":1869.4444444444443,"audioSegment":0},{"text":"update to macOS 14 before installing this release.","startTime":1869.4444444444443,"endTime":1873,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26273 — 30 September 2026","subtitle":"This release is about getting work started without a detour and then seeing it through: you can attach a recipe to the message you are about to send, hand it the files it should work on, and let a single gezel carry the job from the first step to the last. When the work is done, it comes back to you in the conversation where you asked for it, with its numbers and dates checked, and any step that is yours to approve waits for you. The first ready-made knowledge catalogs also arrive — seventeen subject shelves drawn from Wikipedia that your crew can search without going online.","ambientMotion":"zoomIn"}}</script>
