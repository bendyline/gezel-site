wer. Not the rows. That distinction is the whole point: because the answer is what comes back, the size of the file stops mattering. A 200 MB export and a 20-row list work the same way.","position":{"start":{"line":13,"column":68,"offset":901},"end":{"line":13,"column":456,"offset":1289}}}],"position":{"start":{"line":13,"column":1,"offset":834},"end":{"line":13,"column":456,"offset":1289}}},{"type":"paragraph","children":[{"type":"text","value":"Tables keep themselves current. Edit the file and the table is rebuilt; delete the file and the table goes. A very large file may be handed to the overnight pass rather than done while you wait.","position":{"start":{"line":15,"column":1,"offset":1291},"end":{"line":15,"column":195,"offset":1485}}}],"position":{"start":{"line":15,"column":1,"offset":1291},"end":{"line":15,"column":195,"offset":1485}}},{"type":"paragraph","children":[{"type":"text","value":"The same machinery now backs ","position":{"start":{"line":17,"column":1,"offset":1487},"end":{"line":17,"column":30,"offset":1516}}},{"type":"strong","children":[{"type":"text","value":"connectors","position":{"start":{"line":17,"column":32,"offset":1518},"end":{"line":17,"column":42,"offset":1528}}}],"position":{"start":{"line":17,"column":30,"offset":1516},"end":{"line":17,"column":44,"offset":1530}}},{"type":"text","value":", the synced copies of outside sources like a mailbox or an issue tracker. Sources that produce rows rather than documents — server logs, request traces, billing exports — can land as tables instead, which is what makes millions of records possible at all; the document-shaped mirror tops out around twenty thousand. Azure Monitor logs are the first of these.","position":{"start":{"line":17,"column":44,"offset":1530},"end":{"line":17,"column":403,"offset":1889}}}],"position":{"start":{"line":17,"column":1,"offset":1487},"end":{"line":17,"column":403,"offset":1889}}},{"type":"paragraph","children":[{"type":"text","value":"A project's ","position":{"start":{"line":19,"column":1,"offset":1891},"end":{"line":19,"column":13,"offset":1903}}},{"type":"strong","children":[{"type":"text","value":"Overview","position":{"start":{"line":19,"column":15,"offset":1905},"end":{"line":19,"column":23,"offset":1913}}}],"position":{"start":{"line":19,"column":13,"offset":1903},"end":{"line":19,"column":25,"offset":1915}}},{"type":"text","value":" lists whatever became a table, and the ","position":{"start":{"line":19,"column":25,"offset":1915},"end":{"line":19,"column":65,"offset":1955}}},{"type":"strong","children":[{"type":"text","value":"Connections","position":{"start":{"line":19,"column":67,"offset":1957},"end":{"line":19,"column":78,"offset":1968}}}],"position":{"start":{"line":19,"column":65,"offset":1955},"end":{"line":19,"column":80,"offset":1970}}},{"type":"text","value":" tab shows each synced source with its row count and the stretch of time it covers.","position":{"start":{"line":19,"column":80,"offset":1970},"end":{"line":19,"column":163,"offset":2053}}}],"position":{"start":{"line":19,"column":1,"offset":1891},"end":{"line":19,"column":163,"offset":2053}}},{"type":"paragraph","children":[{"type":"text","value":"Reading is all your crew can do here. A gezel may ask a question; it may not change, add to, or delete anything in a table, and it doesn't get handed the rows unless it explicitly asks for a few.","position":{"start":{"line":21,"column":1,"offset":2055},"end":{"line":21,"column":196,"offset":2250}}}],"position":{"start":{"line":21,"column":1,"offset":2055},"end":{"line":21,"column":196,"offset":2250}}}]},{"id":"documents-that-read-themselves-aloud","startTime":118,"duration":26,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Documents that read themselves aloud","position":{"start":{"line":23,"column":4,"offset":2255},"end":{"line":23,"column":40,"offset":2291}}}],"position":{"start":{"line":23,"column":1,"offset":2252},"end":{"line":23,"column":40,"offset":2291}}},"title":"Documents that read themselves aloud","contents":[{"type":"paragraph","children":[{"type":"text","value":"Any document, artifact or project file can now be read out loud. Open it and press narrate — the whole thing, or just the part you've selected. When it's done you can save the audio as an MP3 and take it with you.","position":{"start":{"line":25,"column":1,"offset":2293},"end":{"line":25,"column":214,"offset":2506}}}],"position":{"start":{"line":25,"column":1,"offset":2293},"end":{"line":25,"column":214,"offset":2506}}},{"type":"paragraph","children":[{"type":"text","value":"This needs the text-to-speech engine, a one-time download in ","position":{"start":{"line":27,"column":1,"offset":2508},"end":{"line":27,"column":62,"offset":2569}}},{"type":"strong","children":[{"type":"text","value":"Settings → Audio","position":{"start":{"line":27,"column":64,"offset":2571},"end":{"line":27,"column":80,"offset":2587}}}],"position":{"start":{"line":27,"column":62,"offset":2569},"end":{"line":27,"column":82,"offset":2589}}},{"type":"text","value":", where you can also listen to the available voices before you pick one. Like everything else here it runs on your own machine; nothing is sent anywhere to be spoken.","position":{"start":{"line":27,"column":82,"offset":2589},"end":{"line":27,"column":248,"offset":2755}}}],"position":{"start":{"line":27,"column":1,"offset":2508},"end":{"line":27,"column":248,"offset":2755}}}]},{"id":"talk-to-your-crew-instead-of-typing","startTime":144,"duration":19,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Talk to your crew instead of typing","position":{"start":{"line":29,"column":4,"offset":2760},"end":{"line":29,"column":39,"offset":2795}}}],"position":{"start":{"line":29,"column":1,"offset":2757},"end":{"line":29,"column":39,"offset":2795}}},"title":"Talk to your crew instead of typing","contents":[{"type":"paragraph","children":[{"type":"text","value":"The chat box has a microphone. Press it and speak, and your words appear in the box as you say them rather than all at once when you stop — so you can see it getting you right, and fix a word without starting over.","position":{"start":{"line":31,"column":1,"offset":2797},"end":{"line":31,"column":215,"offset":3011}}}],"position":{"start":{"line":31,"column":1,"offset":2797},"end":{"line":31,"column":215,"offset":3011}}},{"type":"paragraph","children":[{"type":"text","value":"Speech recognition is the other half of that Audio settings pair, also a one-time download, also entirely local.","position":{"start":{"line":33,"column":1,"offset":3013},"end":{"line":33,"column":113,"offset":3125}}}],"position":{"start":{"line":33,"column":1,"offset":3013},"end":{"line":33,"column":113,"offset":3125}}}]},{"id":"spelling-and-grammar-with-no-network","startTime":163,"duration":23,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Spelling and grammar, with no network","position":{"start":{"line":35,"column":4,"offset":3130},"end":{"line":35,"column":41,"offset":3167}}}],"position":{"start":{"line":35,"column":1,"offset":3127},"end":{"line":35,"column":41,"offset":3167}}},"title":"Spelling and grammar, with no network","contents":[{"type":"paragraph","children":[{"type":"text","value":"Markdown documents in the editor are now proofed as you write: misspellings and grammar problems are underlined, with suggestions, and a word you accept into your own dictionary stays accepted. It's English only for now, and it runs inside the app — there's no service being asked about your writing.","position":{"start":{"line":37,"column":1,"offset":3169},"end":{"line":37,"column":301,"offset":3469}}}],"position":{"start":{"line":37,"column":1,"offset":3169},"end":{"line":37,"column":301,"offset":3469}}},{"type":"paragraph","children":[{"type":"text","value":"Separately, right-clicking in any text box in the desktop app now gives you the ordinary editing menu you'd expect, including the system's own spelling suggestions.","position":{"start":{"line":39,"column":1,"offset":3471},"end":{"line":39,"column":165,"offset":3635}}}],"position":{"start":{"line":39,"column":1,"offset":3471},"end":{"line":39,"column":165,"offset":3635}}}]},{"id":"local-models-stop-stalling-out-at-five-minutes","startTime":186,"duration":70,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Local models stop stalling out at five minutes","position":{"start":{"line":41,"column":4,"offset":3640},"end":{"line":41,"column":50,"offset":3686}}}],"position":{"start":{"line":41,"column":1,"offset":3637},"end":{"line":41,"column":50,"offset":3686}}},"title":"Local models stop stalling out at five minutes","contents":[{"type":"paragraph","children":[{"type":"text","value":"A long prompt on a large local model is genuinely slow before it says anything at all — a 27B model reading seventy thousand tokens can take a quarter of an hour to produce its first word. Underneath the deadline gezel had set for that work sat a second, invisible five-minute one, and it was always the shorter of the two. It killed long turns and then blamed the model, reporting that the engine had crashed or run out of memory and suggesting you try again — advice that could never work, because the same prompt hit the same wall every time.","position":{"start":{"line":43,"column":1,"offset":3688},"end":{"line":43,"column":546,"offset":4233}}}],"position":{"start":{"line":43,"column":1,"offset":3688},"end":{"line":43,"column":546,"offset":4233}}},{"type":"paragraph","children":[{"type":"text","value":"That second deadline is gone. The only limit on a local turn now is the one gezel set for it, sized to how much there is to read.","position":{"start":{"line":45,"column":1,"offset":4235},"end":{"line":45,"column":130,"offset":4364}}}],"position":{"start":{"line":45,"column":1,"offset":4235},"end":{"line":45,"column":130,"offset":4364}}},{"type":"paragraph","children":[{"type":"text","value":"Batch work also got faster. When a job fans out into several pieces running at once — a review split across a few dozen files at a time — those pieces share the same crew member, the same project and the same recipe, and differ only in which files they're looking at. They used to each read the identical shared preamble from cold. Now the first one through warms it and the rest inherit it: in a matched before-and-after, 22,500 tokens read cold became 12,800. On the llama.cpp engine, models that can predict several tokens at once now do so by default.","position":{"start":{"line":47,"column":1,"offset":4366},"end":{"line":47,"column":556,"offset":4921}}}],"position":{"start":{"line":47,"column":1,"offset":4366},"end":{"line":47,"column":556,"offset":4921}}}]},{"id":"chat-shows-what-your-crew-is-actually-doing","startTime":256,"duration":23,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Chat shows what your crew is actually doing","position":{"start":{"line":49,"column":4,"offset":4926},"end":{"line":49,"column":47,"offset":4969}}}],"position":{"start":{"line":49,"column":1,"offset":4923},"end":{"line":49,"column":47,"offset":4969}}},"title":"Chat shows what your crew is actually doing","contents":[{"type":"paragraph","children":[{"type":"text","value":"When a gezel starts a ","position":{"start":{"line":51,"column":1,"offset":4971},"end":{"line":51,"column":23,"offset":4993}}},{"type":"strong","children":[{"type":"text","value":"craftbook","position":{"start":{"line":51,"column":25,"offset":4995},"end":{"line":51,"column":34,"offset":5004}}}],"position":{"start":{"line":51,"column":23,"offset":4993},"end":{"line":51,"column":36,"offset":5006}}},{"type":"text","value":", the conversation now shows a card for it: which recipe, what its steps are, and how f :{"start":{"line":62,"column":3,"offset":6902},"end":{"line":62,"column":35,"offset":6934}}},{"type":"text","value":", and DGX Spark machines have experimental support through the ds4 engine.","position":{"start":{"line":62,"column":35,"offset":6934},"end":{"line":62,"column":109,"offset":7008}}}],"position":{"start":{"line":62,"column":3,"offset":6902},"end":{"line":62,"column":109,"offset":7008}}}],"position":{"start":{"line":62,"column":1,"offset":6900},"end":{"line":62,"column":109,"offset":7008}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"When a gezel is told it has rambled","position":{"start":{"line":63,"column":5,"offset":7013},"end":{"line":63,"column":40,"offset":7048}}}],"position":{"start":{"line":63,"column":3,"offset":7011},"end":{"line":63,"column":42,"offset":7050}}},{"type":"text","value":", the correction it reads now names only tools that turn actually has. It used to recommend file-writing tools to sessions that had none, which is a hard instruction to follow.","position":{"start":{"line":63,"column":42,"offset":7050},"end":{"line":63,"column":218,"offset":7226}}}],"position":{"start":{"line":63,"column":3,"offset":7011},"end":{"line":63,"column":218,"offset":7226}}}],"position":{"start":{"line":63,"column":1,"offset":7009},"end":{"line":63,"column":218,"offset":7226}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Files show what they are in the file lists","position":{"start":{"line":64,"column":5,"offset":7231},"end":{"line":64,"column":47,"offset":7273}}}],"position":{"start":{"line":64,"column":3,"offset":7229},"end":{"line":64,"column":49,"offset":7275}}},{"type":"text","value":", with an icon per type.","position":{"start":{"line":64,"column":49,"offset":7275},"end":{"line":64,"column":73,"offset":7299}}}],"position":{"start":{"line":64,"column":3,"offset":7229},"end":{"line":64,"column":73,"offset":7299}}}],"position":{"start":{"line":64,"column":1,"offset":7227},"end":{"line":64,"column":73,"offset":7299}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Catalog content moved to ","position":{"start":{"line":65,"column":3,"offset":7302},"end":{"line":65,"column":28,"offset":7327}}},{"type":"inlineCode","value":"@bendyline/gilde","position":{"start":{"line":65,"column":28,"offset":7327},"end":{"line":65,"column":46,"offset":7345}}},{"type":"text","value":" 0.1.51.","position":{"start":{"line":65,"column":46,"offset":7345},"end":{"line":65,"column":54,"offset":7353}}}],"position":{"start":{"line":65,"column":3,"offset":7302},"end":{"line":65,"column":54,"offset":7353}}}],"position":{"start":{"line":65,"column":1,"offset":7300},"end":{"line":65,"column":54,"offset":7353}}}],"position":{"start":{"line":57,"column":1,"offset":5396},"end":{"line":65,"column":54,"offset":7353}}}],"autoTemplate":true,"templateData":{"items":["You can check that your download is really ours. Verifying your download is a new page explaining the two things published beside every release: a list of checksums, and a signed record naming the build that produced them. Most people never need it — macOS and Windows check our signature for you. On Linux it's the only verification there is, because .deb and .rpm files carry no signature your package manager looks at.","Knowledge catalogs are verified before they install. Publisher keys are built into the app, and settings can add trust but never remove it, so nothing you configure can quietly turn the check off.","The scoreboard on gezel.com can be filtered. Pick a machine, a model, a size class or a date and the model scorecard narrows to it — useful now that the rounds span a Mac, a Windows desktop with a Radeon card, and a DGX Spark. Inside the app it stays a plain stack of rounds.","How we test models explains the two hard sets. One is developer work; the other asks a model to write the recipe rather than follow it. Nobody scores full marks on either, and the article now says so — a low number there is headroom, not breakage.","A finished document typed into the chat gets saved anyway. Caught in the wild: twelve kilobytes of completed review that the model wrote out in conversation instead of saving to a file, and which was then thrown away. It's recovered now.","Granite models are supported, and DGX Spark machines have experimental support through the ds4 engine.","When a gezel is told it has rambled, the correction it reads now names only tools that turn actually has. It used to recommend file-writing tools to sessions that had none, which is a hard instruction to follow.","Files show what they are in the file lists, with an icon per type.","Catalog content moved to @bendyline/gilde 0.1.51."],"ordered":false,"title":"Smaller things"}},{"id":"for-developers","startTime":376,"duration":55,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"For developers","position":{"start":{"line":67,"column":4,"offset":7358},"end":{"line":67,"column":18,"offset":7372}}}],"position":{"start":{"line":67,"column":1,"offset":7355},"end":{"line":67,"column":18,"offset":7372}}},"title":"For developers","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Three new tools — ","position":{"start":{"line":69,"column":5,"offset":7378},"end":{"line":69,"column":23,"offset":7396}}},{"type":"inlineCode","value":"list_tables","position":{"start":{"line":69,"column":23,"offset":7396},"end":{"line":69,"column":36,"offset":7409}}},{"type":"text","value":", ","position":{"start":{"line":69,"column":36,"offset":7409},"end":{"line":69,"column":38,"offset":7411}}},{"type":"inlineCode","value":"describe_table","position":{"start":{"line":69,"column":38,"offset":7411},"end":{"line":69,"column":54,"offset":7427}}},{"type":"text","value":", ","position":{"start":{"line":69,"column":54,"offset":7427},"end":{"line":69,"column":56,"offset":7429}}},{"type":"inlineCode","value":"query_table","position":{"start":{"line":69,"column":56,"offset":7429},"end":{"line":69,"column":69,"offset":7442}}}],"position":{"start":{"line":69,"column":3,"offset":7376},"end":{"line":69,"column":71,"offset":7444}}},{"type":"text","value":" — registered only for projects that actually have a table, which is why role tool counts move from 82 to 85 there and stay put elsewhere. Queries are checked by DuckDB's own parser rather than a keyword list, and only a single ","position":{"start":{"line":69,"column":71,"offset":7444},"end":{"line":69,"column":299,"offset":7672}}},{"type":"inlineCode","value":"SELECT","position":{"start":{"line":69,"column":299,"offset":7672},"end":{"line":69,"column":307,"offset":7680}}},{"type":"text","value":" is accepted; ","position":{"start":{"line":69,"column":307,"offset":7680},"end":{"line":69,"column":321,"offset":7694}}},{"type":"inlineCode","value":"WITH … INSERT","position":{"start":{"line":69,"column":321,"offset":7694},"end":{"line":69,"column":336,"offset":7709}}},{"type":"text","value":" and every ","position":{"start":{"line":69,"column":336,"offset":7709},"end":{"line":69,"column":347,"offset":7720}}},{"type":"inlineCode","value":"EXPLAIN","position":{"start":{"line":69,"column":347,"offset":7720},"end":{"line":69,"column":356,"offset":7729}}},{"type":"text","value":" form are refused.","position":{"start":{"line":69,"column":356,"offset":7729},"end":{"line":69,"column":374,"offset":7747}}}],"position":{"start":{"line":69,"column":3,"offset":7376},"end":{"line":69,"column":374,"offset":7747}}}],"position":{"start":{"line":69,"column":1,"offset":7374},"end":{"line":69,"column":374,"offset":7747}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Two data layouts, deliberately different.","position":{"start":{"line":70,"column":5,"offset":7752},"end":{"line":70,"column":46,"offset":7793}}}],"position":{"start":{"line":70,"column":3,"offset":7750},"end":{"line":70,"column":48,"offset":7795}}},{"type":"text","value":" Connector corpora live at ","position":{"start":{"line":70,"column":48,"offset":7795},"end":{"line":70,"column":75,"offset":7822}}},{"type":"inlineCode","value":"artifacts/data/<corpus>/tables/","position":{"start":{"line":70,"column":75,"offset":7822},"end":{"line":70,"column":108,"offset":7855}}},{"type":"text","value":" and are append-only, time-partitioned, compacted and retained. Workspace tables live at ","position":{"start":{"line":70,"column":108,"offset":7855},"end":{"line":70,"column":197,"offset":7944}}},{"type":"inlineCode","value":"artifacts/tabular/","position":{"start":{"line":70,"column":197,"offset":7944},"end":{"line":70,"column":217,"offset":7964}}},{"type":"text","value":" and are snapshots — one content hash, one materialization, replaced wholesale. Both are write-denied to gezels and neither is text- or vector-indexed.","position":{"start":{"line":70,"column":217,"offset":7964},"end":{"line":70,"column":368,"offset":8115}}}],"position":{"start":{"line":70,"column":3,"offset":7750},"end":{"line":70,"column":368,"offset":8115}}}],"position":{"start":{"line":70,"column":1,"offset":7748},"end":{"line":70,"column":368,"offset":8115}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"inlineCode","value":"patientFetch()","position":{"start":{"line":71,"column":5,"offset":8120},"end":{"line":71,"column":21,"offset":8136}}},{"type":"text","value":" is the only dispatcher local engines may use.","position":{"start":{"line":71,"column":21,"offset":8136},"end":{"line":71,"column":67,"offset":8182}}}],"position":{"start":{"line":71,"column":3,"offset":8118},"end":{"line":71,"column":69,"offset":8184}}},{"type":"text","value":" Node's undici caps header and body timeouts at five minutes, which was the invisible deadline above; a repo guard now fails the build when an engine provider builder forgets it.","position":{"start":{"line":71,"column":69,"offset":8184},"end":{"line":71,"column":247,"offset":8362}}}],"position":{"start":{"line":71,"column":3,"offset":8118},"end":{"line":71,"column":247,"offset":8362}}}],"position":{"start":{"line":71,"column":1,"offset":8116},"end":{"line":71,"column":247,"offset":8362}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Shared-band prompt-prefix reuse is on by default on MLX","position":{"start":{"line":72,"column":5,"offset":8367},"end":{"line":72,"column":60,"offset":8422}}}],"position":{"start":{"line":72,"column":3,"offset":8365},"end":{"line":72,"column":62,"offset":8424}}},{"type":"text","value":", with ","position":{"start":{"line":72,"column":62,"offset":8424},"end":{"line":72,"column":69,"offset":8431}}},{"type":"inlineCode","value":"mlxSharedBandPrefix.enabled: false","position":{"start":{"line":72,"column":69,"offset":8431},"end":{"line":72,"column":105,"offset":8467}}},{"type":"text","value":" to opt out.","position":{"start":{"line":72,"column":105,"offset":8467},"end":{"line":72,"column":117,"offset":8479}}}],"position":{"start":{"line":72,"column":3,"offset":8365},"end":{"line":72,"column":117,"offset":8479}}}],"position":{"start":{"line":72,"column":1,"offset":8363},"end":{"line":72,"column":117,"offset":8479}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Three architecture decisions are written down: observation corpora, shared-band prefix reuse, and workspace tables, alongside a full contract document for the tabular connector shape.","position":{"start":{"line":73,"column":3,"offset":8482},"end":{"line":73,"column":186,"offset":8665}}}],"position":{"start":{"line":73,"column":3,"offset":8482},"end":{"line":73,"column":186,"offset":8665}}}],"position":{"start":{"line":73,"column":1,"offset":8480},"end":{"line":73,"column":186,"offset":8665}}}],"position":{"start":{"line":69,"column":1,"offset":7374},"end":{"line":73,"column":186,"offset":8665}}}],"autoTemplate":true,"templateData":{"items":["Three new tools — list_tables, describe_table, query_table — registered only for projects that actually have a table, which is why role tool counts move from 82 to 85 there and stay put elsewhere. Queries are checked by DuckDB's own parser rather than a keyword list, and only a single SELECT is accepted; WITH … INSERT and every EXPLAIN form are refused.","Two data layouts, deliberately different. Connector corpora live at artifacts/data/<corpus>/tables/ and are append-only, time-partitioned, compacted and retained. Workspace tables live at artifacts/tabular/ and are snapshots — one content hash, one materialization, replaced wholesale. Both are write-denied to gezels and neither is text- or vector-indexed.","patientFetch() is the only dispatcher local engines may use. Node's undici caps header and body timeouts at five minutes, which was the invisible deadline above; a repo guard now fails the build when an engine provider builder forgets it.","Shared-band prompt-prefix reuse is on by default on MLX, with mlxSharedBandPrefix.enabled: false to opt out.","Three architecture decisions are written down: observation corpora, shared-band prefix reuse, and workspace tables, alongside a full contract document for the tabular connector shape."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":431,"duration":23,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":75,"column":4,"offset":8670},"end":{"line":75,"column":37,"offset":8703}}}],"position":{"start":{"line":75,"column":1,"offset":8667},"end":{"line":75,"column":37,"offset":8703}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"Two places are worth a visit. If you want documents read aloud or want to dictate instead of type, ","position":{"start":{"line":77,"column":1,"offset":8705},"end":{"line":77,"column":100,"offset":8804}}},{"type":"strong","children":[{"type":"text","value":"Settings → Audio","position":{"start":{"line":77,"column":102,"offset":8806},"end":{"line":77,"column":118,"offset":8822}}}],"position":{"start":{"line":77,"column":100,"offset":8804},"end":{"line":77,"column":120,"offset":8824}}},{"type":"text","value":" has both engines and a voice preview; they're one-time downloads and they run on your machine. And if any of your projects has a spreadsheet or a large CSV in it, open that project's ","position":{"start":{"line":77,"column":120,"offset":8824},"end":{"line":77,"column":304,"offset":9008}}},{"type":"strong","children":[{"type":"text","value":"Overview","position":{"start":{"line":77,"column":306,"offset":9010},"end":{"line":77,"column":314,"offset":9018}}}],"position":{"start":{"line":77,"column":304,"offset":9008},"end":{"line":77,"column":316,"offset":9020}}},{"type":"text","value":" — whatever became a table is listed there, and your crew can be asked about it straight away.","position":{"start":{"line":77,"column":316,"offset":9020},"end":{"line":77,"column":410,"offset":9114}}}],"position":{"start":{"line":77,"column":1,"offset":8705},"end":{"line":77,"column":410,"offset":9114}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"This release is mostly about data you already had and couldn't use.","startTime":0,"endTime":5.666666666666667,"audioSegment":0},{"text":"If you read only one thing: a spreadsheet or a big CSV sitting in your project is now something a gezel —","startTime":5.666666666666667,"endTime":11.333333333333334,"audioSegment":0},{"text":"one of the AI workers on your crew — can count, group and total, rather than something it can only read prose about.","startTime":11.333333333333334,"endTime":17,"audioSegment":0},{"text":"Two kinds of file were handled badly,","startTime":17,"endTime":20.366666666666667,"audioSegment":0},{"text":"at exactly the sizes where it hurt.","startTime":20.366666666666667,"endTime":23.733333333333334,"audioSegment":0},{"text":"A CSV too large to read was effectively invisible.","startTime":23.733333333333334,"endTime":27.1,"audioSegment":0},{"text":"It was too big to open in a conversation,","startTime":27.1,"endTime":30.46666666666667,"audioSegment":0},{"text":"and nothing indexed it, so asking about it got you nothing.","startTime":30.46666666666667,"endTime":33.83333333333333,"audioSegment":0},{"text":"And a spreadsheet was converted to prose —","startTime":33.83333333333333,"endTime":37.2,"audioSegment":0},{"text":"which meant a gezel could describe your numbers but could not add them up.","startTime":37.2,"endTime":40.56666666666666,"audioSegment":0},{"text":"Both failures were quiet.","startTime":40.56666666666666,"endTime":43.93333333333334,"audioSegment":0},{"text":"You'd ask a question about a file that was right there and get an apology.","startTime":43.93333333333334,"endTime":47.3,"audioSegment":0},{"text":"Now CSV, TSV and XLSX files in a project's folder become tables,","startTime":47.3,"endTime":50.666666666666664,"audioSegment":0},{"text":"in the background, without you setting anything up.","startTime":50.666666666666664,"endTime":54.03333333333333,"audioSegment":0},{"text":"A gezel asks the table a question — how many orders per region last quarter,","startTime":54.03333333333333,"endTime":57.4,"audioSegment":0},{"text":"which customers appear twice, what the median is — and gets back the answer. Not the rows.","startTime":57.4,"endTime":60.766666666666666,"audioSegment":0},{"text":"That distinction is the whole point: because the answer is what comes back,","startTime":60.766666666666666,"endTime":64.13333333333333,"audioSegment":0},{"text":"the size of the file stops mattering.","startTime":64.13333333333333,"endTime":67.5,"audioSegment":0},{"text":"A 200 MB export and a 20-row list work the same way.","startTime":67.5,"endTime":70.86666666666667,"audioSegment":0},{"text":"Tables keep themselves current.","startTime":70.86666666666667,"endTime":74.23333333333333,"audioSegment":0},{"text":"Edit the file and the table is rebuilt;","startTime":74.23333333333333,"endTime":77.6,"audioSegment":0},{"text":"delete the file and the table goes.","startTime":77.6,"endTime":80.96666666666667,"audioSegment":0},{"text":"A very large file may be handed to the overnight pass rather than done while you wait.","startTime":80.96666666666667,"endTime":84.33333333333333,"audioSegment":0},{"text":"The same machinery now backs connectors,","startTime":84.33333333333333,"endTime":87.7,"audioSegment":0},{"text":"the synced copies of outside sources like a mailbox or an issue tracker.","startTime":87.7,"endTime":91.06666666666666,"audioSegment":0},{"text":"Sources that produce rows rather than documents — server logs, request traces, billing exports — can land as tables instead,","startTime":91.06666666666666,"endTime":94.43333333333334,"audioSegment":0},{"text":"which is what makes millions of records possible at all; the document-shaped mirror tops out around twenty thousand.","startTime":94.43333333333334,"endTime":97.8,"audioSegment":0},{"text":"Azure Monitor logs are the first of these.","startTime":97.8,"endTime":101.16666666666667,"audioSegment":0},{"text":"A project's Overview lists whatever became a table,","startTime":101.16666666666667,"endTime":104.53333333333333,"audioSegment":0},{"text":"and the Connections tab shows each synced source with its row count and the stretch of time it covers.","startTime":104.53333333333333,"endTime":107.9,"audioSegment":0},{"text":"Reading is all your crew can do here.","startTime":107.9,"endTime":111.26666666666667,"audioSegment":0},{"text":"A gezel may ask a question; it may not change, add to, or delete anything in a table,","startTime":111.26666666666667,"endTime":114.63333333333334,"audioSegment":0},{"text":"and it doesn't get handed the rows unless it explicitly asks for a few.","startTime":114.63333333333334,"endTime":118,"audioSegment":0},{"text":"Any document, artifact or project file can now be read out loud.","startTime":118,"endTime":121.25,"audioSegment":0},{"text":"Open it and press narrate — the whole thing,","startTime":121.25,"endTime":124.5,"audioSegment":0},{"text":"or just the part you've selected.","startTime":124.5,"endTime":127.75,"audioSegment":0},{"text":"When it's done you can save the audio as an MP3 and take it with you.","startTime":127.75,"endTime":131,"audioSegment":0},{"text":"This needs the text-to-speech engine, a one-time download in Settings → Audio,","startTime":131,"endTime":134.25,"audioSegment":0},{"text":"where you can also listen to the available voices before you pick one.","startTime":134.25,"endTime":137.5,"audioSegment":0},{"text":"Like everything else here it runs on your own machine;","startTime":137.5,"endTime":140.75,"audioSegment":0},{"text":"nothing is sent anywhere to be spoken.","startTime":140.75,"endTime":144,"audioSegment":0},{"text":"The chat box has a microphone.","startTime":144,"endTime":147.8,"audioSegment":0},{"text":"Press it and speak, and your words appear in the box as you say them rather than all at once when you stop —","startTime":147.8,"endTime":151.6,"audioSegment":0},{"text":"so you can see it getting you right, and fix a word without starting over.","startTime":151.6,"endTime":155.4,"audioSegment":0},{"text":"Speech recognition is the other half of that Audio settings pair,","startTime":155.4,"endTime":159.2,"audioSegment":0},{"text":"also a one-time download, also entirely local.","startTime":159.2,"endTime":163,"audioSegment":0},{"text":"Markdown documents in the editor are now proofed as you write: misspellings and grammar problems are underlined,","startTime":163,"endTime":166.83333333333334,"audioSegment":0},{"text":"with suggestions, and a word you accept into your own dictionary stays accepted.","startTime":166.83333333333334,"endTime":170.66666666666666,"audioSegment":0},{"text":"It's English only for now, and it runs inside the app —","startTime":170.66666666666666,"endTime":174.5,"audioSegment":0},{"text":"there's no service being asked about your writing.","startTime":174.5,"endTime":178.33333333333334,"audioSegment":0},{"text":"Separately, right-clicking in any text box in the desktop app now gives you the ordinary editing menu you'd expect,","startTime":178.33333333333334,"endTime":182.16666666666666,"audioSegment":0},{"text":"including the system's own spelling suggestions.","startTime":182.16666666666666,"endTime":186,"audioSegment":0},{"text":"A long prompt on a large local model is genuinely slow before it says anything at all —","startTime":186,"endTime":190.11764705882354,"audioSegment":0},{"text":"a 27B model reading seventy thousand tokens can take a quarter of an hour to produce its first word.","startTime":190.11764705882354,"endTime":194.23529411764707,"audioSegment":0},{"text":"Underneath the deadline gezel had set for that work sat a second,","startTime":194.23529411764707,"endTime":198.35294117647058,"audioSegment":0},{"text":"invisible five-minute one, and it was always the shorter of the two.","startTime":198.35294117647058,"endTime":202.47058823529412,"audioSegment":0},{"text":"It killed long turns and then blamed the model, reporting that the engine had crashed or run out of memory and suggesting you try again —","startTime":202.47058823529412,"endTime":206.58823529411765,"audioSegment":0},{"text":"advice that could never work, because the same prompt hit the same wall every time.","startTime":206.58823529411765,"endTime":210.70588235294116,"audioSegment":0},{"text":"That second deadline is gone.","startTime":210.70588235294116,"endTime":214.8235294117647,"audioSegment":0},{"text":"The only limit on a local turn now is the one gezel set for it,","startTime":214.8235294117647,"endTime":218.94117647058823,"audioSegment":0},{"text":"sized to how much there is to read.","startTime":218.94117647058823,"endTime":223.05882352941177,"audioSegment":0},{"text":"Batch work also got faster.","startTime":223.05882352941177,"endTime":227.1764705882353,"audioSegment":0},{"text":"When a job fans out into several pieces running at once — a review split across a few dozen files at a time —","startTime":227.1764705882353,"endTime":231.2941176470588,"audioSegment":0},{"text":"those pieces share the same crew member, the same project and the same recipe, and differ only in which files they're looking at.","startTime":231.2941176470588,"endTime":235.41176470588235,"audioSegment":0},{"text":"They used to each read the identical shared preamble from cold.","startTime":235.41176470588235,"endTime":239.52941176470588,"audioSegment":0},{"text":"Now the first one through warms it and the rest inherit it: in a matched before-and-after,","startTime":239.52941176470588,"endTime":243.6470588235294,"audioSegment":0},{"text":"22,500 tokens read cold became 12,800.","startTime":243.6470588235294,"endTime":247.76470588235293,"audioSegment":0},{"text":"On the llama.cpp engine,","startTime":247.76470588235293,"endTime":251.88235294117646,"audioSegment":0},{"text":"models that can predict several tokens at once now do so by default.","startTime":251.88235294117646,"endTime":256,"audioSegment":0},{"text":"When a gezel starts a craftbook, the conversation now shows a card for it: which recipe,","startTime":256,"endTime":259.8333333333333,"audioSegment":0},{"text":"what its steps are, and how far along it is. Before,","startTime":259.8333333333333,"endTime":263.6666666666667,"audioSegment":0},{"text":"that arrived as a line of tool output that told you a tool had been called and little else.","startTime":263.6666666666667,"endTime":267.5,"audioSegment":0},{"text":"Half-written messages also survive now.","startTime":267.5,"endTime":271.3333333333333,"audioSegment":0},{"text":"The chat box used to lose a draft the moment you went to Settings and came back,","startTime":271.3333333333333,"endTime":275.1666666666667,"audioSegment":0},{"text":"or switched to another gezel. It keeps them.","startTime":275.1666666666667,"endTime":279,"audioSegment":0},{"text":"You can check that your download is really ours.","startTime":279,"endTime":282.03125,"audioSegment":0},{"text":"Verifying your download is a new page explaining the two things published beside every release: a list of checksums,","startTime":282.03125,"endTime":285.0625,"audioSegment":0},{"text":"and a signed record naming the build that produced them.","startTime":285.0625,"endTime":288.09375,"audioSegment":0},{"text":"Most people never need it —","startTime":288.09375,"endTime":291.125,"audioSegment":0},{"text":"macOS and Windows check our signature for you.","startTime":291.125,"endTime":294.15625,"audioSegment":0},{"text":"On Linux it's the only verification there is,","startTime":294.15625,"endTime":297.1875,"audioSegment":0},{"text":"because .deb and .rpm files carry no signature your package manager looks at.","startTime":297.1875,"endTime":300.21875,"audioSegment":0},{"text":"Knowledge catalogs are verified before they install.","startTime":300.21875,"endTime":303.25,"audioSegment":0},{"text":"Publisher keys are built into the app, and settings can add trust but never remove it,","startTime":303.25,"endTime":306.28125,"audioSegment":0},{"text":"so nothing you configure can quietly turn the check off.","startTime":306.28125,"endTime":309.3125,"audioSegment":0},{"text":"The scoreboard on gezel.com can be filtered.","startTime":309.3125,"endTime":312.34375,"audioSegment":0},{"text":"Pick a machine, a model, a size class or a date and the model scorecard narrows to it —","startTime":312.34375,"endTime":315.375,"audioSegment":0},{"text":"useful now that the rounds span a Mac, a Windows desktop with a Radeon card, and a DGX Spark.","startTime":315.375,"endTime":318.40625,"audioSegment":0},{"text":"Inside the app it stays a plain stack of rounds.","startTime":318.40625,"endTime":321.4375,"audioSegment":0},{"text":"How we test models explains the two hard sets.","startTime":321.4375,"endTime":324.46875,"audioSegment":0},{"text":"One is developer work;","startTime":324.46875,"endTime":327.5,"audioSegment":0},{"text":"the other asks a model to write the recipe rather than follow it.","startTime":327.5,"endTime":330.53125,"audioSegment":0},{"text":"Nobody scores full marks on either, and the article now says so —","startTime":330.53125,"endTime":333.5625,"audioSegment":0},{"text":"a low number there is headroom, not breakage.","startTime":333.5625,"endTime":336.59375,"audioSegment":0},{"text":"A finished document typed into the chat gets saved anyway.","startTime":336.59375,"endTime":339.625,"audioSegment":0},{"text":"Caught in the wild: twelve kilobytes of completed review that the model wrote out in conversation instead of saving to a file,","startTime":339.625,"endTime":342.65625,"audioSegment":0},{"text":"and which was then thrown away.","startTime":342.65625,"endTime":345.6875,"audioSegment":0},{"text":"It's recovered now.","startTime":345.6875,"endTime":348.71875,"audioSegment":0},{"text":"Granite models are supported,","startTime":348.71875,"endTime":351.75,"audioSegment":0},{"text":"and DGX Spark machines have experimental support through the ds4 engine.","startTime":351.75,"endTime":354.78125,"audioSegment":0},{"text":"When a gezel is told it has rambled,","startTime":354.78125,"endTime":357.8125,"audioSegment":0},{"text":"the correction it reads now names only tools that turn actually has.","startTime":357.8125,"endTime":360.84375,"audioSegment":0},{"text":"It used to recommend file-writing tools to sessions that had none,","startTime":360.84375,"endTime":363.875,"audioSegment":0},{"text":"which is a hard instruction to follow.","startTime":363.875,"endTime":366.90625,"audioSegment":0},{"text":"Files show what they are in the file lists,","startTime":366.90625,"endTime":369.9375,"audioSegment":0},{"text":"with an icon per type.","startTime":369.9375,"endTime":372.96875,"audioSegment":0},{"text":"Catalog content moved to @bendyline/gilde 0.1.51.","startTime":372.96875,"endTime":376,"audioSegment":0},{"text":"Three new tools — list_tables, describe_table, query_table — registered only for projects that actually have a table,","startTime":376,"endTime":379.4375,"audioSegment":0},{"text":"which is why role tool counts move from 82 to 85 there and stay put elsewhere.","startTime":379.4375,"endTime":382.875,"audioSegment":0},{"text":"Queries are checked by DuckDB's own parser rather than a keyword list,","startTime":382.875,"endTime":386.3125,"audioSegment":0},{"text":"and only a single SELECT is accepted; WITH … INSERT and every EXPLAIN form are refused.","startTime":386.3125,"endTime":389.75,"audioSegment":0},{"text":"Two data layouts, deliberately different.","startTime":389.75,"endTime":393.1875,"audioSegment":0},{"text":"Connector corpora live at artifacts/data/<corpus>/tables/ and are append-only, time-partitioned, compacted and retained.","startTime":393.1875,"endTime":396.625,"audioSegment":0},{"text":"Workspace tables live at artifacts/tabular/ and are snapshots —","startTime":396.625,"endTime":400.0625,"audioSegment":0},{"text":"one content hash, one materialization, replaced wholesale.","startTime":400.0625,"endTime":403.5,"audioSegment":0},{"text":"Both are write-denied to gezels and neither is text- or vector-indexed.","startTime":403.5,"endTime":406.9375,"audioSegment":0},{"text":"patientFetch() is the only dispatcher local engines may use.","startTime":406.9375,"endTime":410.375,"audioSegment":0},{"text":"Node's undici caps header and body timeouts at five minutes, which was the invisible deadline above;","startTime":410.375,"endTime":413.8125,"audioSegment":0},{"text":"a repo guard now fails the build when an engine provider builder forgets it.","startTime":413.8125,"endTime":417.25,"audioSegment":0},{"text":"Shared-band prompt-prefix reuse is on by default on MLX,","startTime":417.25,"endTime":420.6875,"audioSegment":0},{"text":"with mlxSharedBandPrefix.enabled: false to opt out.","startTime":420.6875,"endTime":424.125,"audioSegment":0},{"text":"Three architecture decisions are written down: observation corpora, shared-band prefix reuse,","startTime":424.125,"endTime":427.5625,"audioSegment":0},{"text":"and workspace tables, alongside a full contract document for the tabular connector shape.","startTime":427.5625,"endTime":431,"audioSegment":0},{"text":"Two places are worth a visit.","startTime":431,"endTime":435.6,"audioSegment":0},{"text":"If you want documents read aloud or want to dictate instead of type,","startTime":435.6,"endTime":440.2,"audioSegment":0},{"text":"Settings → Audio has both engines and a voice preview; they're one-time downloads and they run on your machine.","startTime":440.2,"endTime":444.8,"audioSegment":0},{"text":"And if any of your projects has a spreadsheet or a large CSV in it, open that project's Overview —","startTime":444.8,"endTime":449.4,"audioSegment":0},{"text":"whatever became a table is listed there, and your crew can be asked about it straight away.","startTime":449.4,"endTime":454,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26244 — 1 September 2026","subtitle":"This release is mostly about data you already had and couldn't use.","ambientMotion":"zoomIn"}}</script>
