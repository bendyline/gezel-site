<script type="application/json" id="squisq-doc" data-squisq-doc="1">{"articleId":"whats-new/1.26251","duration":641,"blocks":[{"id":"126251-8-september-2026","startTime":0,"duration":17,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":1,"children":[{"type":"text","value":"1.26251 — 8 September 2026","position":{"start":{"line":1,"column":3,"offset":2},"end":{"line":1,"column":29,"offset":28}}}],"position":{"start":{"line":1,"column":1,"offset":0},"end":{"line":1,"column":29,"offset":28}}},"title":"1.26251 — 8 September 2026","contents":[{"type":"paragraph","children":[{"type":"text","value":"This release lives mostly under the floor. The visible half is a set of new controls over how a local model loads; the invisible half is the reason those controls are now safe to use.","position":{"start":{"line":3,"column":1,"offset":30},"end":{"line":3,"column":184,"offset":213}}}],"position":{"start":{"line":3,"column":1,"offset":30},"end":{"line":3,"column":184,"offset":213}}},{"type":"paragraph","children":[{"type":"text","value":"If you read only one thing: when two things on your machine both want the memory, they now take turns instead of colliding.","position":{"start":{"line":5,"column":1,"offset":215},"end":{"line":5,"column":124,"offset":338}}}],"position":{"start":{"line":5,"column":1,"offset":215},"end":{"line":5,"column":124,"offset":338}}}],"children":[{"id":"engines-take-turns-with-your-memory","startTime":17,"duration":128,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Engines take turns with your memory","position":{"start":{"line":7,"column":4,"offset":343},"end":{"line":7,"column":39,"offset":378}}}],"position":{"start":{"line":7,"column":1,"offset":340},"end":{"line":7,"column":39,"offset":378}}},"title":"Engines take turns with your memory","contents":[{"type":"paragraph","children":[{"type":"text","value":"Every model gezel starts on your own hardware — a chat model, the image reader, image and video generation, transcription — is a separate program that wants a large, specific amount of memory, and until now each of them found out whether that memory existed by trying to take it. When two of them tried at once, one of them lost, usually loudly and usually in the middle of something. On a machine with a frontier-sized model already resident, an ordinary background job asking for a second one was enough.","position":{"start":{"line":9,"column":1,"offset":380},"end":{"line":9,"column":507,"offset":886}}}],"position":{"start":{"line":9,"column":1,"offset":380},"end":{"line":9,"column":507,"offset":886}}},{"type":"paragraph","children":[{"type":"text","value":"Each of those programs now reserves its memory before it starts allocating, from a single ledger. If the room is there, it loads as before. If it isn't, it waits — and says so: the engine status reads ","position":{"start":{"line":11,"column":1,"offset":888},"end":{"line":11,"column":202,"offset":1089}}},{"type":"strong","children":[{"type":"text","value":"Waiting for available memory","position":{"start":{"line":11,"column":204,"offset":1091},"end":{"line":11,"column":232,"offset":1119}}}],"position":{"start":{"line":11,"column":202,"offset":1089},"end":{"line":11,"column":234,"offset":1121}}},{"type":"text","value":" rather than going quiet or failing. A wait gives up after five minutes with an error that tells you what wouldn't fit, and waiting never counts against the restarts gezel allows a crashed engine.","position":{"start":{"line":11,"column":234,"offset":1121},"end":{"line":11,"column":430,"offset":1317}}}],"position":{"start":{"line":11,"column":1,"offset":888},"end":{"line":11,"column":430,"offset":1317}}},{"type":"paragraph","children":[{"type":"text","value":"The ledger is shared by every gezel process on the machine, not just the one you are looking at. If you have the installed shared service running and also start a development copy, they book against the same budget instead of each believing the memory is free. Two accelerator rules ride along with it: the total and the graphics budget must both fit, and on machines where the processor and graphics share one pool, graphics commitments are capped at 75% of physical memory even if you set a larger overall budget.","position":{"start":{"line":13,"column":1,"offset":1319},"end":{"line":13,"column":516,"offset":1834}}}],"position":{"start":{"line":13,"column":1,"offset":1319},"end":{"line":13,"column":516,"offset":1834}}},{"type":"paragraph","children":[{"type":"text","value":"Queueing is fair rather than first-come. A large request that keeps getting passed over takes precedence once four newer, smaller ones have gone ahead of it, so a big model can actually accumulate the room it needs instead of starving behind a stream of small ones. When a resident engine is standing between a waiting request and its memory, it stops accepting new work, finishes what it has, and unloads.","position":{"start":{"line":15,"column":1,"offset":1836},"end":{"line":15,"column":407,"offset":2242}}}],"position":{"start":{"line":15,"column":1,"offset":1836},"end":{"line":15,"column":407,"offset":2242}}},{"type":"paragraph","children":[{"type":"text","value":"Two honest limits. This is cooperation, not a fence: other applications on your machine can still take memory without asking anyone, and gezel can only watch the pressure and react to it. And it works per machine account — two people logged into the same computer coordinate only if the shared service is installed.","position":{"start":{"line":17,"column":1,"offset":2244},"end":{"line":17,"column":316,"offset":2559}}}],"position":{"start":{"line":17,"column":1,"offset":2244},"end":{"line":17,"column":316,"offset":2559}}},{"type":"paragraph","children":[{"type":"text","value":"If your installed shared service is older than the app you just updated, you now find out at startup, in a dialog offering to continue without it or to go and get the current installer — rather than discovering it when a chat turn fails.","position":{"start":{"line":19,"column":1,"offset":2561},"end":{"line":19,"column":238,"offset":2798}}}],"position":{"start":{"line":19,"column":1,"offset":2561},"end":{"line":19,"column":238,"offset":2798}}}]},{"id":"llamacpp-v04-and-the-controls-it-brought","startTime":145,"duration":79,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"llama.cpp v0.4, and the controls it brought","position":{"start":{"line":21,"column":4,"offset":2803},"end":{"line":21,"column":47,"offset":2846}}}],"position":{"start":{"line":21,"column":1,"offset":2800},"end":{"line":21,"column":47,"offset":2846}}},"title":"llama.cpp v0.4, and the controls it brought","contents":[{"type":"paragraph","children":[{"type":"text","value":"The main local engine moved from v0.3 to v0.4, which brings a set of loading choices that used to be one all-or-nothing checkbox. They are in ","position":{"start":{"line":23,"column":1,"offset":2848},"end":{"line":23,"column":143,"offset":2990}}},{"type":"strong","children":[{"type":"text","value":"Settings → llama.cpp","position":{"start":{"line":23,"column":145,"offset":2992},"end":{"line":23,"column":165,"offset":3012}}}],"position":{"start":{"line":23,"column":143,"offset":2990},"end":{"line":23,"column":167,"offset":3014}}},{"type":"text","value":", they all default to Auto, and they are all worth leaving alone unless you have a reason.","position":{"start":{"line":23,"column":167,"offset":3014},"end":{"line":23,"column":257,"offset":3104}}}],"position":{"start":{"line":23,"column":1,"offset":2848},"end":{"line":23,"column":257,"offset":3104}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"How the model file is read.","position":{"start":{"line":25,"column":5,"offset":3110},"end":{"line":25,"column":32,"offset":3137}}}],"position":{"start":{"line":25,"column":3,"offset":3108},"end":{"line":25,"column":34,"offset":3139}}},{"type":"text","value":" Memory-mapped, read fully into memory, locked in memory, both, or direct I/O. This is a storage and platform question — a network drive, an unusual filesystem, a machine that pages badly — and it is now answerable without editing anything. Existing lock-in-memory settings carry over.","position":{"start":{"line":25,"column":34,"offset":3139},"end":{"line":25,"column":319,"offset":3424}}}],"position":{"start":{"line":25,"column":3,"offset":3108},"end":{"line":25,"column":319,"offset":3424}}}],"position":{"start":{"line":25,"column":1,"offset":3106},"end":{"line":25,"column":319,"offset":3424}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"On-demand loading for very large tensors.","position":{"start":{"line":26,"column":5,"offset":3429},"end":{"line":26,"column":46,"offset":3470}}}],"position":{"start":{"line":26,"column":3,"offset":3427},"end":{"line":26,"column":48,"offset":3472}}},{"type":"text","value":" Some of the newest models carry a single enormous table that most turns barely touch. Left on Auto, anything over 4 GiB is now loaded as it is used, which is what lets a model whose weights exceed your memory start at all.","position":{"start":{"line":26,"column":48,"offset":3472},"end":{"line":26,"column":271,"offset":3695}}}],"position":{"start":{"line":26,"column":3,"offset":3427},"end":{"line":26,"column":271,"offset":3695}}}],"position":{"start":{"line":26,"column":1,"offset":3425},"end":{"line":26,"column":271,"offset":3695}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Keeping the first layers in main memory.","position":{"start":{"line":27,"column":5,"offset":3700},"end":{"line":27,"column":45,"offset":3740}}}],"position":{"start":{"line":27,"column":3,"offset":3698},"end":{"line":27,"column":47,"offset":3742}}},{"type":"text","value":" For models split across processor and graphics card, you can pin the dense part of the first few blocks rather than leaving it to the planner.","position":{"start":{"line":27,"column":47,"offset":3742},"end":{"line":27,"column":190,"offset":3885}}}],"position":{"start":{"line":27,"column":3,"offset":3698},"end":{"line":27,"column":190,"offset":3885}}}],"position":{"start":{"line":27,"column":1,"offset":3696},"end":{"line":27,"column":190,"offset":3885}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Speculative decoding.","position":{"start":{"line":28,"column":5,"offset":3890},"end":{"line":28,"column":26,"offset":3911}}}],"position":{"start":{"line":28,"column":3,"offset":3888},"end":{"line":28,"column":28,"offset":3913}}},{"type":"text","value":" Where a model ships its own draft head — a small predictor that guesses several tokens so the big model can check them in one pass — gezel can use it. Auto turns it on only where it has been measured to pay.","position":{"start":{"line":28,"column":28,"offset":3913},"end":{"line":28,"column":236,"offset":4121}}}],"position":{"start":{"line":28,"column":3,"offset":3888},"end":{"line":28,"column":236,"offset":4121}}}],"position":{"start":{"line":28,"column":1,"offset":3886},"end":{"line":28,"column":236,"offset":4121}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Whether private reasoning is kept.","position":{"start":{"line":29,"column":5,"offset":4126},"end":{"line":29,"column":39,"offset":4160}}}],"position":{"start":{"line":29,"column":3,"offset":4124},"end":{"line":29,"column":41,"offset":4162}}},{"type":"text","value":" A thinking model's internal working is discarded between turns by default. You can now ask for it to be retained and replayed instead, which costs room in the conversation and helps on long, multi-step work.","position":{"start":{"line":29,"column":41,"offset":4162},"end":{"line":29,"column":249,"offset":4370}}}],"position":{"start":{"line":29,"column":3,"offset":4124},"end":{"line":29,"column":249,"offset":4370}}}],"position":{"start":{"line":29,"column":1,"offset":4122},"end":{"line":29,"column":249,"offset":4370}}}],"position":{"start":{"line":25,"column":1,"offset":3106},"end":{"line":29,"column":249,"offset":4370}}}]},{"id":"dwarfstar-learns-glm-53-and-can-see","startTime":224,"duration":69,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"DwarfStar learns GLM 5.3, and can see","position":{"start":{"line":31,"column":4,"offset":4375},"end":{"line":31,"column":41,"offset":4412}}}],"position":{"start":{"line":31,"column":1,"offset":4372},"end":{"line":31,"column":41,"offset":4412}}},"title":"DwarfStar learns GLM 5.3, and can see","contents":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"DwarfStar","position":{"start":{"line":33,"column":3,"offset":4416},"end":{"line":33,"column":12,"offset":4425}}}],"position":{"start":{"line":33,"column":1,"offset":4414},"end":{"line":33,"column":14,"offset":4427}}},{"type":"text","value":" is the engine gezel uses for the very largest mixture-of-experts models — the ones that run at all only because it streams their expert weights off your SSD instead of holding them in memory. It now supports ","position":{"start":{"line":33,"column":14,"offset":4427},"end":{"line":33,"column":223,"offset":4636}}},{"type":"strong","children":[{"type":"text","value":"GLM 5.3 Flash","position":{"start":{"line":33,"column":225,"offset":4638},"end":{"line":33,"column":238,"offset":4651}}}],"position":{"start":{"line":33,"column":223,"offset":4636},"end":{"line":33,"column":240,"offset":4653}}},{"type":"text","value":", a 320-billion-parameter model with 18 billion active per token and a one-million-token context window, in a 91 GiB two-bit build. It is aimed at a 128 GB Mac or a DGX Spark-class machine; it is not a laptop model.","position":{"start":{"line":33,"column":240,"offset":4653},"end":{"line":33,"column":455,"offset":4868}}}],"position":{"start":{"line":33,"column":1,"offset":4414},"end":{"line":33,"column":455,"offset":4868}}},{"type":"paragraph","children":[{"type":"text","value":"It is also the first DwarfStar model that can look at pictures. Its image encoder is a separate download that gezel fetches and verifies alongside the weights, counts in the memory reservation above, and hands to the engine — and images go straight to the model only when that exact matched encoder is loaded. A mismatched pair is worse than an honest text-only model, so gezel will not improvise one.","position":{"start":{"line":35,"column":1,"offset":4870},"end":{"line":35,"column":402,"offset":5271}}}],"position":{"start":{"line":35,"column":1,"offset":4870},"end":{"line":35,"column":402,"offset":5271}}},{"type":"paragraph","children":[{"type":"text","value":"Also new in the catalog: ","position":{"start":{"line":37,"column":1,"offset":5273},"end":{"line":37,"column":26,"offset":5298}}},{"type":"strong","children":[{"type":"text","value":"Qwen 3.8 Flash Next","position":{"start":{"line":37,"column":28,"offset":5300},"end":{"line":37,"column":47,"offset":5319}}}],"position":{"start":{"line":37,"column":26,"offset":5298},"end":{"line":37,"column":49,"offset":5321}}},{"type":"text","value":", in a smaller and a higher-fidelity build. It is a preview of the architecture behind Qwen 4, and it is the model the on-demand tensor loading above was built for — a 27 GiB lookup table that can be paged in as needed rather than held resident the whole time. The lighter build is aimed at 64 GB of system memory alongside a large graphics card; the better one wants 96 GB.","position":{"start":{"line":37,"column":49,"offset":5321},"end":{"line":37,"column":423,"offset":5695}}}],"position":{"start":{"line":37,"column":1,"offset":5273},"end":{"line":37,"column":423,"offset":5695}}}]},{"id":"what-a-giant-model-is-actually-worth","startTime":293,"duration":54,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"What a giant model is actually worth","position":{"start":{"line":39,"column":4,"offset":5700},"end":{"line":39,"column":40,"offset":5736}}}],"position":{"start":{"line":39,"column":1,"offset":5697},"end":{"line":39,"column":40,"offset":5736}}},"title":"What a giant model is actually worth","contents":[{"type":"paragraph","children":[{"type":"text","value":"Two more measured rounds landed on the ","position":{"start":{"line":41,"column":1,"offset":5738},"end":{"line":41,"column":40,"offset":5777}}},{"type":"link","url":"../../model-scorecard/","children":[{"type":"text","value":"model scorecard","position":{"start":{"line":41,"column":41,"offset":5778},"end":{"line":41,"column":56,"offset":5793}}}],"position":{"start":{"line":41,"column":40,"offset":5777},"end":{"line":41,"column":81,"offset":5818}}},{"type":"text","value":", and one of them answers a question people keep asking: on a machine big enough to run a 284-billion-parameter model, should you?","position":{"start":{"line":41,"column":81,"offset":5818},"end":{"line":41,"column":211,"offset":5948}}}],"position":{"start":{"line":41,"column":1,"offset":5738},"end":{"line":41,"column":211,"offset":5948}}},{"type":"paragraph","children":[{"type":"text","value":"Measured on a DGX Spark-class machine, DeepSeek V4 Flash at two bits was tested head to head against two ordinary mid-sized models — a 27B and a 35B — across the same four suites. On the basic suite the giant model came out marginally ahead: 8.0 against 7.8 and 7.7. On developer work it came out clearly behind: 5.9 against 6.9 and 6.1. On everyday productivity work it was behind as well: 6.6 against 7.2 and 7.0. And it produced words at 17 per second against 29 and 43.","position":{"start":{"line":43,"column":1,"offset":5950},"end":{"line":43,"column":474,"offset":6423}}}],"position":{"start":{"line":43,"column":1,"offset":5950},"end":{"line":43,"column":474,"offset":6423}}},{"type":"paragraph","children":[{"type":"text","value":"That is one machine, one quantization and one harness, not a law of nature. But it is exactly what the scorecard exists for: the enormous model is the interesting one to own and the slower, weaker choice for most of what you would actually do with it. The other new round measures a Windows desktop on a Ryzen 9 7950X3D.","position":{"start":{"line":45,"column":1,"offset":6425},"end":{"line":45,"column":321,"offset":6745}}}],"position":{"start":{"line":45,"column":1,"offset":6425},"end":{"line":45,"column":321,"offset":6745}}}]},{"id":"catalogs-built-from-a-folder-of-markdown","startTime":347,"duration":64,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Catalogs built from a folder of Markdown","position":{"start":{"line":47,"column":4,"offset":6750},"end":{"line":47,"column":44,"offset":6790}}}],"position":{"start":{"line":47,"column":1,"offset":6747},"end":{"line":47,"column":44,"offset":6790}}},"title":"Catalogs built from a folder of Markdown","contents":[{"type":"paragraph","children":[{"type":"text","value":"A ","position":{"start":{"line":49,"column":1,"offset":6792},"end":{"line":49,"column":3,"offset":6794}}},{"type":"strong","children":[{"type":"text","value":"knowledge catalog","position":{"start":{"line":49,"column":5,"offset":6796},"end":{"line":49,"column":22,"offset":6813}}}],"position":{"start":{"line":49,"column":3,"offset":6794},"end":{"line":49,"column":24,"offset":6815}}},{"type":"text","value":" is a packaged body of reference material your crew can search — the format went open last release. Building one no longer means writing any ,"offset":7664}}},{"type":"text","value":", and Hugo's section pages and weights are all understood, including their nesting and their ordering. A page the outline forgot still ships, in its folder, with a warning.","position":{"start":{"line":53,"column":166,"offset":7664},"end":{"line":53,"column":338,"offset":7836}}}],"position":{"start":{"line":53,"column":1,"offset":7499},"end":{"line":53,"column":338,"offset":7836}}},{"type":"paragraph","children":[{"type":"text","value":"And catalogs can carry pictures now — images travel inside the catalog and appear in the reader, served from the catalog itself rather than fetched from wherever they used to live. The format is version 0.6; readers still open 0.5 catalogs.","position":{"start":{"line":55,"column":1,"offset":7838},"end":{"line":55,"column":241,"offset":8078}}}],"position":{"start":{"line":55,"column":1,"offset":7838},"end":{"line":55,"column":241,"offset":8078}}}]},{"id":"smaller-things","startTime":411,"duration":86,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Smaller things","position":{"start":{"line":57,"column":4,"offset":8083},"end":{"line":57,"column":18,"offset":8097}}}],"position":{"start":{"line":57,"column":1,"offset":8080},"end":{"line":57,"column":18,"offset":8097}}},"title":"Smaller things","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Codex has permission levels you can set","position":{"start":{"line":59,"column":5,"offset":8103},"end":{"line":59,"column":44,"offset":8142}}}],"position":{"start":{"line":59,"column":3,"offset":8101},"end":{"line":59,"column":46,"offset":8144}}},{"type":"text","value":", the way the Claude CLI already did: Plan, Edit, Reviewed and Full, each with a sentence saying what it lets the agent do. Reviewed is the interesting one — it works like Edi independent reviewer first.","Starting a fresh conversation is a labeled thing, both in the thread picker and on the button beside it, rather than something you inferred from an empty list.","Gezels have hair you can choose. Style, bangs and part, picked from tiles that show the actual figure instead of naming a shape you have to imagine.","Topics in the knowledge browser show how much is in them, counting the documents nested underneath rather than only the ones filed at that level.","The reasoning-effort row disappears for models that have no levels, instead of sitting there as an empty control that reads as broken.","A video model install stops freezing at 100%. The finished signal could be cut off before it reached the screen, leaving a full progress bar on a job that had already completed.","Craftbook checks find their source data. A check comparing a finished report against the data behind it used to fail when the report lived in the artifacts drawer and the data lived in the project files. It now looks in both. A craftbook is a saved recipe for a piece of work.","The document toolset moved to 2.6.1, which returns preview images inline, so a gezel reviewing a slide deck or a PDF can look at what it made rather than describing it from memory.","Catalog content moved to @bendyline/gilde 0.1.60, and the editor libraries to squisq 2.11.3."],"ordered":false,"title":"Smaller things"}},{"id":"for-developers","startTime":497,"duration":123,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"For developers","position":{"start":{"line":69,"column":4,"offset":9786},"end":{"line":69,"column":18,"offset":9800}}}],"position":{"start":{"line":69,"column":1,"offset":9783},"end":{"line":69,"column":18,"offset":9800}}},"title":"For developers","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children" ,"end":{"line":77,"column":36,"offset":11488}}}],"position":{"start":{"line":77,"column":3,"offset":11455},"end":{"line":77,"column":38,"offset":11490}}},{"type":"text","value":", and the knowledge format moved to 0.6: documents file at the leaf of their topic path with readers rolling descendants up, ordinals order a topic, opaque producer metadata rides along, and image assets are declared, hashed and magic-byte checked.","position":{"start":{"line":77,"column":38,"offset":11490},"end":{"line":77,"column":286,"offset":11738}}}],"position":{"start":{"line":77,"column":3,"offset":11455},"end":{"line":77,"column":286,"offset":11738}}}],"position":{"start":{"line":77,"column":1,"offset":11453},"end":{"line":77,"column":286,"offset":11738}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A visual regression harness","position":{"start":{"line":78,"column":5,"offset":11743},"end":{"line":78,"column":32,"offset":11770}}}],"position":{"start":{"line":78,"column":3,"offset":11741},"end":{"line":78,"column":34,"offset":11772}}},{"type":"text","value":" snapshots the app's main surfaces at desktop, tablet and phone widths in both themes.","position":{"start":{"line":78,"column":34,"offset":11772},"end":{"line":78,"column":120,"offset":11858}}}],"position":{"start":{"line":78,"column":3,"offset":11741},"end":{"line":78,"column":120,"offset":11858}}}],"position":{"start":{"line":78,"column":1,"offset":11739},"end":{"line":78,"column":120,"offset":11858}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"A document toolset eval suite that uses the real thing.","position":{"start":{"line":79,"column":5,"offset":11863},"end":{"line":79,"column":60,"offset":11918}}}],"position":{"start":{"line":79,"column":3,"offset":11861},"end":{"line":79,"column":62,"offset":11920}}},{"type":"text","value":" The hermetic simulators stay for orchestration, but a separate suite installs the actual toolset and requires real conversions, previews and valid saved binary containers — a fake conversion cannot prove an integration.","position":{"start":{"line":79,"column":62,"offset":11920},"end":{"line":79,"column":282,"offset":12140}}}],"position":{"start":{"line":79,"column":3,"offset":11861},"end":{"line":79,"column":282,"offset":12140}}}],"position":{"start":{"line":79,"column":1,"offset":11859},"end":{"line":79,"column":282,"offset":12140}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Locally built llama.cpp binaries are checked against the checkout pin","position":{"start":{"line":80,"column":5,"offset":12145},"end":{"line":80,"column":74,"offset":12214}}}],"position":{"start":{"line":80,"column":3,"offset":12143},"end":{"line":80,"column":76,"offset":12216}}},{"type":"text","value":" in development, so a stale build cannot quietly answer for a newer engine.","position":{"start":{"line":80,"column":76,"offset":12216},"end":{"line":80,"column":151,"offset":12291}}}],"position":{"start":{"line":80,"column":3,"offset":12143},"end":{"line":80,"column":151,"offset":12291}}}],"position":{"start":{"line":80,"column":1,"offset":12141},"end":{"line":80,"column":151,"offset":12291}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"An investigation into a 96-token thinking cap that can end a model's reasoning mid-sentence landed, along with an A/B harness for choosing budgets. No budget change ships in this release.","position":{"start":{"line":81,"column":3,"offset":12294},"end":{"line":81,"column":190,"offset":12481}}}],"position":{"start":{"line":81,"column":3,"offset":12294},"end":{"line":81,"column":190,"offset":12481}}}],"position":{"start":{"line":81,"column":1,"offset":12292},"end":{"line":81,"column":190,"offset":12481}}}],"position":{"start":{"line":71,"column":1,"offset":9802},"end":{"line":81,"column":190,"offset":12481}}}],"autoTemplate":true,"templateData":{"items":["The engine daemon and the product daemon are separate compositions now. The shared machine broker builds an engine context with no Store, no chat manager, no tasks, no terminals, no content index and no credential store — the narrow inference contract it holds cannot resolve a session, run a tool, or start background work. Adding a product endpoint no longer requires remembering to exclude it from the broker.","Memory admission has a documented contract: a loopback-only capacity endpoint carrying reservation ids, byte counts, priorities and process ids and nothing else, over a SQLite lease ledger that makes check-and-reserve atomic across processes and survives a coordinator restart. Broker discovery verifies the signed device identity and pins TLS.","llama.cpp and MLX share their local-turn policy — task classification, repair tool surfaces, retry allowances, history compaction at 70% pressure, and text salvage — with one contract suite run against both real provider loops, so a fix to how one engine handles a turn now reaches the other too.","Four more copied areas got single owners: provider construction and retirement, the Node TLS transport, model inventory and install control in the interface, and document container I/O, each with a thin adapter per caller.","One daemon owns a gezel home, enforced by a single-instance lock taken before any config or store is opened, and config writes serialize per home across store instances. Patch only the fields you mean to change.","The scorecard is one file per sweep, so results measured on different machines can be added independently without colliding.","@bendyline/gezk reached 1.0.0, and the knowledge format moved to 0.6: documents file at the leaf of their topic path with readers rolling descendants up, ordinals order a topic, opaque producer metadata rides along, and image assets are declared, hashed and magic-byte checked.","A visual regression harness snapshots the app's main surfaces at desktop, tablet and phone widths in both themes.","A document toolset eval suite that uses the real thing. The hermetic simulators stay for orchestration, but a separate suite installs the actual toolset and requires real conversions, previews and valid saved binary containers — a fake conversion cannot prove an integration.","Locally built llama.cpp binaries are checked against the checkout pin in development, so a stale build cannot quietly answer for a newer engine.","An investigation into a 96-token thinking cap that can end a model's reasoning mid-sentence landed, along with an A/B harness for choosing budgets. No budget change ships in this release."],"ordered":false,"title":"For developers"}},{"id":"things-to-see-and-do-after-update","startTime":620,"duration":21,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":83,"column":4,"offset":12486},"end":{"line":83,"column":37,"offset":12519}}}],"position":{"start":{"line":83,"column":1,"offset":12483},"end":{"line":83,"column":37,"offset":12519}}},"title":"Things to see and do after update","contents":[{"type":"paragraph","children":[{"type":"text","value":"If you run models on your own hardware, open ","position":{"start":{"line":85,"column":1,"offset":12521},"end":{"line":85,"column":46,"offset":12566}}},{"type":"strong","children":[{"type":"text","value":"Settings → llama.cpp","position":{"start":{"line":85,"column":48,"offset":12568},"end":{"line":85,"column":68,"offset":12588}}}],"position":{"start":{"line":85,"column":46,"offset":12566},"end":{"line":85,"column":70,"offset":12590}}},{"type":"text","value":" and read the new loading options — you probably want them all left on Auto, but the on-demand tensor setting is what makes the newest oversized models startable at all. And if you have ever wondered whether the biggest model your machine can hold is the one you should be using, the ","position":{"start":{"line":85,"column":70,"offset":12590},"end":{"line":85,"column":354,"offset":12874}}},{"type":"link","url":"../../model-scorecard/","children":[{"type":"text","value":"model scorecard","position":{"start":{"line":85,"column":355,"offset":12875},"end":{"line":85,"column":370,"offset":12890}}}],"position":{"start":{"line":85,"column":354,"offset":12874},"end":{"line":85,"column":395,"offset":12915}}},{"type":"text","value":" now has a direct comparison.","position":{"start":{"line":85,"column":395,"offset":12915},"end":{"line":85,"column":424,"offset":12944}}}],"position":{"start":{"line":85,"column":1,"offset":12521},"end":{"line":85,"column":424,"offset":12944}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"This release lives mostly under the floor.","startTime":0,"endTime":3.4,"audioSegment":0},{"text":"The visible half is a set of new controls over how a local model loads;","startTime":3.4,"endTime":6.8,"audioSegment":0},{"text":"the invisible half is the reason those controls are now safe to use.","startTime":6.8,"endTime":10.2,"audioSegment":0},{"text":"If you read only one thing: when two things on your machine both want the memory,","startTime":10.2,"endTime":13.6,"audioSegment":0},{"text":"they now take turns instead of colliding.","startTime":13.6,"endTime":17,"audioSegment":0},{"text":"Every model gezel starts on your own hardware — a chat model, the image reader, image and video generation, transcription —","startTime":17,"endTime":21.129032258064516,"audioSegment":0},{"text":"is a separate program that wants a large, specific amount of memory, and until now each of them found out whether that memory existed by trying to take it.","startTime":21.129032258064516,"endTime":25.258064516129032,"audioSegment":0},{"text":"When two of them tried at once, one of them lost,","startTime":25.258064516129032,"endTime":29.387096774193548,"audioSegment":0},{"text":"usually loudly and usually in the middle of something.","startTime":29.387096774193548,"endTime":33.516129032258064,"audioSegment":0},{"text":"On a machine with a frontier-sized model already resident,","startTime":33.516129032258064,"endTime":37.64516129032258,"audioSegment":0},{"text":"an ordinary background job asking for a second one was enough.","startTime":37.64516129032258,"endTime":41.774193548387096,"audioSegment":0},{"text":"Each of those programs now reserves its memory before it starts allocating,","startTime":41.774193548387096,"endTime":45.903225806451616,"audioSegment":0},{"text":"from a single ledger.","startTime":45.903225806451616,"endTime":50.03225806451613,"audioSegment":0},{"text":"If the room is there, it loads as before.","startTime":50.03225806451613,"endTime":54.16129032258064,"audioSegment":0},{"text":"If it isn't, it waits —","startTime":54.16129032258064,"endTime":58.29032258064516,"audioSegment":0},{"text":"and says so: the engine status reads Waiting for available memory rather than going quiet or failing.","startTime":58.29032258064516,"endTime":62.41935483870968,"audioSegment":0},{"text":"A wait gives up after five minutes with an error that tells you what wouldn't fit,","startTime":62.41935483870968,"endTime":66.54838709677419,"audioSegment":0},{"text":"and waiting never counts against the restarts gezel allows a crashed engine.","startTime":66.54838709677419,"endTime":70.6774193548387,"audioSegment":0},{"text":"The ledger is shared by every gezel process on the machine,","startTime":70.6774193548387,"endTime":74.80645161290323,"audioSegment":0},{"text":"not just the one you are looking at.","startTime":74.80645161290323,"endTime":78.93548387096774,"audioSegment":0},{"text":"If you have the installed shared service running and also start a development copy,","startTime":78.93548387096774,"endTime":83.06451612903226,"audioSegment":0},{"text":"they book against the same budget instead of each believing the memory is free.","startTime":83.06451612903226,"endTime":87.19354838709677,"audioSegment":0},{"text":"Two accelerator rules ride along with it: the total and the graphics budget must both fit, and on machines where the processor and graphics share one pool,","startTime":87.19354838709677,"endTime":91.32258064516128,"audioSegment":0},{"text":"graphics commitments are capped at 75% of physical memory even if you set a larger overall budget.","startTime":91.32258064516128,"endTime":95.45161290322581,"audioSegment":0},{"text":"Queueing is fair rather than first-come.","startTime":95.45161290322581,"endTime":99.58064516129032,"audioSegment":0},{"text":"A large request that keeps getting passed over takes precedence once four newer, smaller ones have gone ahead of it,","startTime":99.58064516129032,"endTime":103.70967741935483,"audioSegment":0},{"text":"so a big model can actually accumulate the room it needs instead of starving behind a stream of small ones.","startTime":103.70967741935483,"endTime":107.83870967741936,"audioSegment":0},{"text":"When a resident engine is standing between a waiting request and its memory,","startTime":107.83870967741936,"endTime":111.96774193548387,"audioSegment":0},{"text":"it stops accepting new work, finishes what it has, and unloads.","startTime":111.96774193548387,"endTime":116.09677419354838,"audioSegment":0},{"text":"Two honest limits.","startTime":116.09677419354838,"endTime":120.2258064516129,"audioSegment":0},{"text":"This is cooperation, not a fence: other applications on your machine can still take memory without asking anyone,","startTime":120.2258064516129,"endTime":124.35483870967741,"audioSegment":0},{"text":"and gezel can only watch the pressure and react to it.","startTime":124.35483870967741,"endTime":128.48387096774195,"audioSegment":0},{"text":"And it works per machine account —","startTime":128.48387096774195,"endTime":132.61290322580646,"audioSegment":0},{"text":"two people logged into the same computer coordinate only if the shared service is installed.","startTime":132.61290322580646,"endTime":136.74193548387098,"audioSegment":0},{"text":"If your installed shared service is older than the app you just updated, you now find out at startup,","startTime":136.74193548387098,"endTime":140.8709677419355,"audioSegment":0},{"text":"in a dialog offering to continue without it or to go and get the current installer — rather than discovering it when a chat turn fails.","startTime":140.8709677419355,"endTime":145,"audioSegment":0},{"text":"The main local engine moved from v0.3 to v0.4,","startTime":145,"endTime":148.29166666666666,"audioSegment":0},{"text":"which brings a set of loading choices that used to be one all-or-nothing checkbox.","startTime":148.29166666666666,"endTime":151.58333333333334,"audioSegment":0},{"text":"They are in Settings → llama.cpp, they all default to Auto,","startTime":151.58333333333334,"endTime":154.875,"audioSegment":0},{"text":"and they are all worth leaving alone unless you have a reason.","startTime":154.875,"endTime":158.16666666666666,"audioSegment":0},{"text":"How the model file is read.","startTime":158.16666666666666,"endTime":161.45833333333334,"audioSegment":0},{"text":"Memory-mapped, read fully into memory, locked in memory, both, or direct I/O.","startTime":161.45833333333334,"endTime":164.75,"audioSegment":0},{"text":"This is a storage and platform question — a network drive, an unusual filesystem,","startTime":164.75,"endTime":168.04166666666666,"audioSegment":0},{"text":"a machine that pages badly — and it is now answerable without editing anything.","startTime":168.04166666666666,"endTime":171.33333333333334,"audioSegment":0},{"text":"Existing lock-in-memory settings carry over.","startTime":171.33333333333334,"endTime":174.625,"audioSegment":0},{"text":"On-demand loading for very large tensors.","startTime":174.625,"endTime":177.91666666666666,"audioSegment":0},{"text":"Some of the newest models carry a single enormous table that most turns barely touch.","startTime":177.91666666666666,"endTime":181.20833333333331,"audioSegment":0},{"text":"Left on Auto, anything over 4 GiB is now loaded as it is used,","startTime":181.20833333333331,"endTime":184.5,"audioSegment":0},{"text":"which is what lets a model whose weights exceed your memory start at all.","startTime":184.5,"endTime":187.79166666666666,"audioSegment":0},{"text":"Keeping the first layers in main memory.","startTime":187.79166666666666,"endTime":191.08333333333331,"audioSegment":0},{"text":"For models split across processor and graphics card,","startTime":191.08333333333331,"endTime":194.375,"audioSegment":0},{"text":"you can pin the dense part of the first few blocks rather than leaving it to the planner.","startTime":194.375,"endTime":197.66666666666666,"audioSegment":0},{"text":"Speculative decoding.","startTime":197.66666666666666,"endTime":200.95833333333331,"audioSegment":0},{"text":"Where a model ships its own draft head —","startTime":200.95833333333331,"endTime":204.25,"audioSegment":0},{"text":"a small predictor that guesses several tokens so the big model can check them in one pass — gezel can use it.","startTime":204.25,"endTime":207.54166666666666,"audioSegment":0},{"text":"Auto turns it on only where it has been measured to pay.","startTime":207.54166666666666,"endTime":210.83333333333331,"audioSegment":0},{"text":"Whether private reasoning is kept.","startTime":210.83333333333331,"endTime":214.125,"audioSegment":0},{"text":"A thinking model's internal working is discarded between turns by default.","startTime":214.125,"endTime":217.41666666666666,"audioSegment":0},{"text":"You can now ask for it to be retained and replayed instead,","startTime":217.41666666666666,"endTime":220.70833333333331,"audioSegment":0},{"text":"which costs room in the conversation and helps on long, multi-step work.","startTime":220.70833333333331,"endTime":224,"audioSegment":0},{"text":"DwarfStar is the engine gezel uses for the very largest mixture-of-experts models —","startTime":224,"endTime":228.05882352941177,"audioSegment":0},{"text":"the ones that run at all only because it streams their expert weights off your SSD instead of holding them in memory.","startTime":228.05882352941177,"endTime":232.11764705882354,"audioSegment":0},{"text":"It now supports GLM 5.3 Flash,","startTime":232.11764705882354,"endTime":236.1764705882353,"audioSegment":0},{"text":"a 320-billion-parameter model with 18 billion active per token and a one-million-token context window, in a 91 GiB two-bit build.","startTime":236.1764705882353,"endTime":240.23529411764707,"audioSegment":0},{"text":"It is aimed at a 128 GB Mac or a DGX Spark-class machine;","startTime":240.23529411764707,"endTime":244.2941176470588,"audioSegment":0},{"text":"it is not a laptop model.","startTime":244.2941176470588,"endTime":248.35294117647058,"audioSegment":0},{"text":"It is also the first DwarfStar model that can look at pictures.","startTime":248.35294117647058,"endTime":252.41176470588235,"audioSegment":0},{"text":"Its image encoder is a separate download that gezel fetches and verifies alongside the weights, counts in the memory reservation above,","startTime":252.41176470588235,"endTime":256.47058823529414,"audioSegment":0},{"text":"and hands to the engine — and images go straight to the model only when that exact matched encoder is loaded.","startTime":256.47058823529414,"endTime":260.52941176470586,"audioSegment":0},{"text":"A mismatched pair is worse than an honest text-only model,","startTime":260.52941176470586,"endTime":264.5882352941176,"audioSegment":0},{"text":"so gezel will not improvise one.","startTime":264.5882352941176,"endTime":268.6470588235294,"audioSegment":0},{"text":"Also new in the catalog: Qwen 3.8 Flash Next,","startTime":268.6470588235294,"endTime":272.70588235294116,"audioSegment":0},{"text":"in a smaller and a higher-fidelity build.","startTime":272.70588235294116,"endTime":276.7647058823529,"audioSegment":0},{"text":"It is a preview of the architecture behind Qwen 4, and it is the model the on-demand tensor loading above was built for —","startTime":276.7647058823529,"endTime":280.8235294117647,"audioSegment":0},{"text":"a 27 GiB lookup table that can be paged in as needed rather than held resident the whole time.","startTime":280.8235294117647,"endTime":284.88235294117646,"audioSegment":0},{"text":"The lighter build is aimed at 64 GB of system memory alongside a large graphics card;","startTime":284.88235294117646,"endTime":288.94117647058823,"audioSegment":0},{"text":"the better one wants 96 GB.","startTime":288.94117647058823,"endTime":293,"audioSegment":0},{"text":"Two more measured rounds landed on the model scorecard,","startTime":293,"endTime":297.15384615384613,"audioSegment":0},{"text":"and one of them answers a question people keep asking: on a machine big enough to run a 284-billion-parameter model, should you?","startTime":297.15384615384613,"endTime":301.3076923076923,"audioSegment":0},{"text":"Measured on a DGX Spark-class machine, DeepSeek V4 Flash at two bits was tested head to head against two ordinary mid-sized models —","startTime":301.3076923076923,"endTime":305.46153846153845,"audioSegment":0},{"text":"a 27B and a 35B — across the same four suites.","startTime":305.46153846153845,"endTime":309.61538461538464,"audioSegment":0},{"text":"On the basic suite the giant model came out marginally ahead: 8.0 against 7.8 and 7.7.","startTime":309.61538461538464,"endTime":313.7692307692308,"audioSegment":0},{"text":"On developer work it came out clearly behind: 5.9 against 6.9 and 6.1.","startTime":313.7692307692308,"endTime":317.9230769230769,"audioSegment":0},{"text":"On everyday productivity work it was behind as well: 6.6 against 7.2 and 7.0.","startTime":317.9230769230769,"endTime":322.0769230769231,"audioSegment":0},{"text":"And it produced words at 17 per second against 29 and 43.","startTime":322.0769230769231,"endTime":326.2307692307692,"audioSegment":0},{"text":"That is one machine, one quantization and one harness,","startTime":326.2307692307692,"endTime":330.38461538461536,"audioSegment":0},{"text":"not a law of nature.","startTime":330.38461538461536,"endTime":334.53846153846155,"audioSegment":0},{"text":"But it is exactly what the scorecard exists for: the enormous model is the interesting one to own and the slower,","startTime":334.53846153846155,"endTime":338.6923076923077,"audioSegment":0},{"text":"weaker choice for most of what you would actually do with it.","startTime":338.6923076923077,"endTime":342.84615384615387,"audioSegment":0},{"text":"The other new round measures a Windows desktop on a Ryzen 9 7950X3D.","startTime":342.84615384615387,"endTime":347,"audioSegment":0},{"text":"A knowledge catalog is a packaged body of reference material your crew can search —","startTime":347,"endTime":350.36842105263156,"audioSegment":0},{"text":"the format went open last release.","startTime":350.36842105263156,"endTime":353.7368421052632,"audioSegment":0},{"text":"Building one no longer means writing anything by hand: point gezel at a folder of Markdown and it reads the folder as a book.","startTime":353.7368421052632,"endTime":357.10526315789474,"audioSegment":0},{"text":"Front matter supplies what it has — id, title, summary, aliases,","startTime":357.10526315789474,"endTime":360.4736842105263,"audioSegment":0},{"text":"listing order — and anything else you put there is carried along untouched.","startTime":360.4736842105263,"endTime":363.8421052631579,"audioSegment":0},{"text":"Missing a title, it takes the first heading, then the filename.","startTime":363.8421052631579,"endTime":367.2105263157895,"audioSegment":0},{"text":"Folders become the table of contents with their names tidied up,","startTime":367.2105263157895,"endTime":370.57894736842104,"audioSegment":0},{"text":"and a small sidecar file lets you rename, reorder or describe one.","startTime":370.57894736842104,"endTime":373.9473684210526,"audioSegment":0},{"text":"Relative links between pages become real cross-references,","startTime":373.9473684210526,"endTime":377.3157894736842,"audioSegment":0},{"text":"and images beside your Markdown become part of the catalog.","startTime":377.3157894736842,"endTime":380.6842105263158,"audioSegment":0},{"text":"If your documentation tree already has an outline,","startTime":380.6842105263158,"endTime":384.0526315789474,"audioSegment":0},{"text":"gezel uses yours rather than inventing its own.","startTime":384.0526315789474,"endTime":387.42105263157896,"audioSegment":0},{"text":"GitBook's SUMMARY.md, an MkDocs nav, Jupyter Book's _toc.yml,","startTime":387.42105263157896,"endTime":390.7894736842105,"audioSegment":0},{"text":"and Hugo's section pages and weights are all understood, including their nesting and their ordering.","startTime":390.7894736842105,"endTime":394.1578947368421,"audioSegment":0},{"text":"A page the outline forgot still ships,","startTime":394.1578947368421,"endTime":397.5263157894737,"audioSegment":0},{"text":"in its folder, with a warning.","startTime":397.5263157894737,"endTime":400.89473684210526,"audioSegment":0},{"text":"And catalogs can carry pictures now — images travel inside the catalog and appear in the reader,","startTime":400.89473684210526,"endTime":404.2631578947368,"audioSegment":0},{"text":"served from the catalog itself rather than fetched from wherever they used to live.","startTime":404.2631578947368,"endTime":407.63157894736844,"audioSegment":0},{"text":"The format is version 0.6; readers still open 0.5 catalogs.","startTime":407.63157894736844,"endTime":411,"audioSegment":0},{"text":"Codex has permission levels you can set, the way the Claude CLI already did: Plan,","startTime":411,"endTime":414.5833333333333,"audioSegment":0},{"text":"Edit, Reviewed and Full, each with a sentence saying what it lets the agent do.","startTime":414.5833333333333,"endTime":418.1666666666667,"audioSegment":0},{"text":"Reviewed is the interesting one — it works like Edit,","startTime":418.1666666666667,"endTime":421.75,"audioSegment":0},{"text":"but anything that would reach outside the sandbox goes past an independent reviewer first.","startTime":421.75,"endTime":425.3333333333333,"audioSegment":0},{"text":"Starting a fresh conversation is a labeled thing, both in the thread picker and on the button beside it,","startTime":425.3333333333333,"endTime":428.9166666666667,"audioSegment":0},{"text":"rather than something you inferred from an empty list.","startTime":428.9166666666667,"endTime":432.5,"audioSegment":0},{"text":"Gezels have hair you can choose.","startTime":432.5,"endTime":436.0833333333333,"audioSegment":0},{"text":"Style, bangs and part,","startTime":436.0833333333333,"endTime":439.6666666666667,"audioSegment":0},{"text":"picked from tiles that show the actual figure instead of naming a shape you have to imagine.","startTime":439.6666666666667,"endTime":443.25,"audioSegment":0},{"text":"Topics in the knowledge browser show how much is in them,","startTime":443.25,"endTime":446.8333333333333,"audioSegment":0},{"text":"counting the documents nested underneath rather than only the ones filed at that level.","startTime":446.8333333333333,"endTime":450.4166666666667,"audioSegment":0},{"text":"The reasoning-effort row disappears for models that have no levels,","startTime":450.4166666666667,"endTime":454,"audioSegment":0},{"text":"instead of sitting there as an empty control that reads as broken.","startTime":454,"endTime":457.5833333333333,"audioSegment":0},{"text":"A video model install stops freezing at 100%.","startTime":457.5833333333333,"endTime":461.1666666666667,"audioSegment":0},{"text":"The finished signal could be cut off before it reached the screen,","startTime":461.1666666666667,"endTime":464.75,"audioSegment":0},{"text":"leaving a full progress bar on a job that had already completed.","startTime":464.75,"endTime":468.3333333333333,"audioSegment":0},{"text":"Craftbook checks find their source data.","startTime":468.3333333333333,"endTime":471.9166666666667,"audioSegment":0},{"text":"A check comparing a finished report against the data behind it used to fail when the report lived in the artifacts drawer and the data lived in the project files.","startTime":471.9166666666667,"endTime":475.5,"audioSegment":0},{"text":"It now looks in both.","startTime":475.5,"endTime":479.08333333333337,"audioSegment":0},{"text":"A craftbook is a saved recipe for a piece of work.","startTime":479.08333333333337,"endTime":482.6666666666667,"audioSegment":0},{"text":"The document toolset moved to 2.6.1, which returns preview images inline,","startTime":482.6666666666667,"endTime":486.25,"audioSegment":0},{"text":"so a gezel reviewing a slide deck or a PDF can look at what it made rather than describing it from memory.","startTime":486.25,"endTime":489.83333333333337,"audioSegment":0},{"text":"Catalog content moved to @bendyline/gilde 0.1.60,","startTime":489.83333333333337,"endTime":493.4166666666667,"audioSegment":0},{"text":"and the editor libraries to squisq 2.11.3.","startTime":493.4166666666667,"endTime":497,"audioSegment":0},{"text":"The engine daemon and the product daemon are separate compositions now.","startTime":497,"endTime":501.39285714285717,"audioSegment":0},{"text":"The shared machine broker builds an engine context with no Store, no chat manager, no tasks, no terminals,","startTime":501.39285714285717,"endTime":505.7857142857143,"audioSegment":0},{"text":"no content index and no credential store — the narrow inference contract it holds cannot resolve a session, run a tool, or start background work.","startTime":505.7857142857143,"endTime":510.17857142857144,"audioSegment":0},{"text":"Adding a product endpoint no longer requires remembering to exclude it from the broker.","startTime":510.17857142857144,"endTime":514.5714285714286,"audioSegment":0},{"text":"Memory admission has a documented contract: a loopback-only capacity endpoint carrying reservation ids, byte counts, priorities and process ids and nothing else,","startTime":514.5714285714286,"endTime":518.9642857142857,"audioSegment":0},{"text":"over a SQLite lease ledger that makes check-and-reserve atomic across processes and survives a coordinator restart.","startTime":518.9642857142857,"endTime":523.3571428571429,"audioSegment":0},{"text":"Broker discovery verifies the signed device identity and pins TLS.","startTime":523.3571428571429,"endTime":527.75,"audioSegment":0},{"text":"llama.cpp and MLX share their local-turn policy — task classification, repair tool surfaces, retry allowances, history compaction at 70% pressure,","startTime":527.75,"endTime":532.1428571428571,"audioSegment":0},{"text":"and text salvage — with one contract suite run against both real provider loops, so a fix to how one engine handles a turn now reaches the other too.","startTime":532.1428571428571,"endTime":536.5357142857143,"audioSegment":0},{"text":"Four more copied areas got single owners: provider construction and retirement, the Node TLS transport,","startTime":536.5357142857143,"endTime":540.9285714285714,"audioSegment":0},{"text":"model inventory and install control in the interface, and document container I/O, each with a thin adapter per caller.","startTime":540.9285714285714,"endTime":545.3214285714286,"audioSegment":0},{"text":"One daemon owns a gezel home, enforced by a single-instance lock taken before any config or store is opened,","startTime":545.3214285714286,"endTime":549.7142857142858,"audioSegment":0},{"text":"and config writes serialize per home across store instances.","startTime":549.7142857142858,"endTime":554.1071428571429,"audioSegment":0},{"text":"Patch only the fields you mean to change.","startTime":554.1071428571429,"endTime":558.5,"audioSegment":0},{"text":"The scorecard is one file per sweep,","startTime":558.5,"endTime":562.8928571428571,"audioSegment":0},{"text":"so results measured on different machines can be added independently without colliding.","startTime":562.8928571428571,"endTime":567.2857142857143,"audioSegment":0},{"text":"@bendyline/gezk reached 1.0.0, and the knowledge format moved to 0.6: documents file at the leaf of their topic path with readers rolling descendants up,","startTime":567.2857142857143,"endTime":571.6785714285714,"audioSegment":0},{"text":"ordinals order a topic, opaque producer metadata rides along, and image assets are declared, hashed and magic-byte checked.","startTime":571.6785714285714,"endTime":576.0714285714286,"audioSegment":0},{"text":"A visual regression harness snapshots the app's main surfaces at desktop,","startTime":576.0714285714286,"endTime":580.4642857142858,"audioSegment":0},{"text":"tablet and phone widths in both themes.","startTime":580.4642857142858,"endTime":584.8571428571429,"audioSegment":0},{"text":"A document toolset eval suite that uses the real thing.","startTime":584.8571428571429,"endTime":589.25,"audioSegment":0},{"text":"The hermetic simulators stay for orchestration, but a separate suite installs the actual toolset and requires real conversions,","startTime":589.25,"endTime":593.6428571428571,"audioSegment":0},{"text":"previews and valid saved binary containers — a fake conversion cannot prove an integration.","startTime":593.6428571428571,"endTime":598.0357142857143,"audioSegment":0},{"text":"Locally built llama.cpp binaries are checked against the checkout pin in development,","startTime":598.0357142857143,"endTime":602.4285714285714,"audioSegment":0},{"text":"so a stale build cannot quietly answer for a newer engine.","startTime":602.4285714285714,"endTime":606.8214285714286,"audioSegment":0},{"text":"An investigation into a 96-token thinking cap that can end a model's reasoning mid-sentence landed,","startTime":606.8214285714286,"endTime":611.2142857142858,"audioSegment":0},{"text":"along with an A/B harness for choosing budgets.","startTime":611.2142857142858,"endTime":615.6071428571429,"audioSegment":0},{"text":"No budget change ships in this release.","startTime":615.6071428571429,"endTime":620,"audioSegment":0},{"text":"If you run models on your own hardware, open Settings → llama.cpp and read the new loading options —","startTime":620,"endTime":625.25,"audioSegment":0},{"text":"you probably want them all left on Auto, but the on-demand tensor setting is what makes the newest oversized models startable at all.","startTime":625.25,"endTime":630.5,"audioSegment":0},{"text":"And if you have ever wondered whether the biggest model your machine can hold is the one you should be using,","startTime":630.5,"endTime":635.75,"audioSegment":0},{"text":"the model scorecard now has a direct comparison.","startTime":635.75,"endTime":641,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26251 — 8 September 2026","subtitle":"This release lives mostly under the floor. The visible half is a set of new controls over how a local model loads; the invisible half is the reason those controls are now safe to use.","ambientMotion":"zoomIn"}}</script>
