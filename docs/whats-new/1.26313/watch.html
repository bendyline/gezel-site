,"column":226,"offset":8449}}}],"position":{"start":{"line":78,"column":3,"offset":8226},"end":{"line":78,"column":226,"offset":8449}}}],"position":{"start":{"line":78,"column":1,"offset":8224},"end":{"line":78,"column":226,"offset":8449}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"On a Mac whose engine toolkit is missing its Python helper, ","position":{"start":{"line":79,"column":3,"offset":8452},"end":{"line":79,"column":63,"offset":8512}}},{"type":"inlineCode","value":"gezel run","position":{"start":{"line":79,"column":63,"offset":8512},"end":{"line":79,"column":74,"offset":8523}}},{"type":"text","value":" now says so and ","position":{"start":{"line":79,"column":74,"offset":8523},"end":{"line":79,"column":91,"offset":8540}}},{"type":"inlineCode","value":"--download","position":{"start":{"line":79,"column":91,"offset":8540},"end":{"line":79,"column":103,"offset":8552}}},{"type":"text","value":" fetches it, instead of every message failing.","position":{"start":{"line":79,"column":103,"offset":8552},"end":{"line":79,"column":149,"offset":8598}}}],"position":{"start":{"line":79,"column":3,"offset":8452},"end":{"line":79,"column":149,"offset":8598}}}],"position":{"start":{"line":79,"column":1,"offset":8450},"end":{"line":79,"column":149,"offset":8598}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"A craftbook name with a typo no longer starts the daemon before saying it found nothing.","position":{"start":{"line":80,"column":3,"offset":8601},"end":{"line":80,"column":91,"offset":8689}}}],"position":{"start":{"line":80,"column":3,"offset":8601},"end":{"line":80,"column":91,"offset":8689}}}],"position":{"start":{"line":80,"column":1,"offset":8599},"end":{"line":80,"column":91,"offset":8689}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"inlineCode","value":"gezel app guide","position":{"start":{"line":81,"column":3,"offset":8692},"end":{"line":81,"column":20,"offset":8709}}},{"type":"text","value":" prints the guide to building a Gezel app for the version you installed.","position":{"start":{"line":81,"column":20,"offset":8709},"end":{"line":81,"column":92,"offset":8781}}}],"position":{"start":{"line":81,"column":3,"offset":8692},"end":{"line":81,"column":92,"offset":8781}}}],"position":{"start":{"line":81,"column":1,"offset":8690},"end":{"line":81,"column":92,"offset":8781}}}],"position":{"start":{"line":77,"column":1,"offset":8084},"end":{"line":81,"column":92,"offset":8781}}}],"autoTemplate":true,"templateData":{"items":["The command line installs with a short name: npx gezel-cli. gezeld and gezel-mcp are short names for the daemon and the MCP server.","Add --download, or set GEZEL_AUTO_DOWNLOAD=1, and a command that needs a model downloads the engine and the model that fits this computer without asking. It suits scripts, containers and AI agents running Gezel for you.","On a Mac whose engine toolkit is missing its Python helper, gezel run now says so and --download fetches it, instead of every message failing.","A craftbook name with a typo no longer starts the daemon before saying it found nothing.","gezel app guide prints the guide to building a Gezel app for the version you installed."],"ordered":false,"title":"In the terminal"}},{"id":"for-developers","startTime":434,"duration":29,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"For developers","position":{"start":{"line":83,"column":4,"offset":8786},"end":{"line":83,"column":18,"offset":8800}}}],"position":{"start":{"line":83,"column":1,"offset":8783},"end":{"line":83,"column":18,"offset":8800}}},"title":"For developers","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Pages in Gezel apps get version 2 of the shared components: ation":17,"audioSegment":0,"template":"list","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Things to see and do after update","position":{"start":{"line":89,"column":4,"offset":9433},"end":{"line":89,"column":37,"offset":9466}}}],"position":{"start":{"line":89,"column":1,"offset":9430},"end":{"line":89,"column":37,"offset":9466}}},"title":"Things to see and do after update","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Open a project's ","position":{"start":{"line":91,"column":3,"offset":9470},"end":{"line":91,"column":20,"offset":9487}}},{"type":"strong","children":[{"type":"text","value":"Connections","position":{"start":{"line":91,"column":22,"offset":9489},"end":{"line":91,"column":33,"offset":9500}}}],"position":{"start":{"line":91,"column":20,"offset":9487},"end":{"line":91,"column":35,"offset":9502}}},{"type":"text","value":" tab and connect the mailbox, folder or tracker its work depends on.","position":{"start":{"line":91,"column":35,"offset":9502},"end":{"line":91,"column":103,"offset":9570}}}],"position":{"start":{"line":91,"column":3,"offset":9470},"end":{"line":91,"column":103,"offset":9570}}}],"position":{"start":{"line":91,"column":1,"offset":9468},"end":{"line":91,"column":103,"offset":9570}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"On a Windows or Linux PC with an AMD Radeon card, look at ","position":{"start":{"line":92,"column":3,"offset":9573},"end":{"line":92,"column":61,"offset":9631}}},{"type":"strong","children":[{"type":"text","value":"Settings → This PC (llama)","position":{"start":{"line":92,"column":63,"offset":9633},"end":{"line":92,"column":89,"offset":9659}}}],"position":{"start":{"line":92,"column":61,"offset":9631},"end":{"line":92,"column":91,"offset":9661}}},{"type":"text","value":" to see which engine runs your models.","position":{"start":{"line":92,"column":91,"offset":9661},"end":{"line":92,"column":129,"offset":9699}}}],"position":{"start":{"line":92,"column":3,"offset":9573},"end":{"line":92,"column":129,"offset":9699}}}],"position":{"start":{"line":92,"column":1,"offset":9571},"end":{"line":92,"column":129,"offset":9699}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"If you run Gezel in Docker, change the port to 6230 when you pull the new image.","position":{"start":{"line":93,"column":3,"offset":9702},"end":{"line":93,"column":83,"offset":9782}}}],"position":{"start":{"line":93,"column":3,"offset":9702},"end":{"line":93,"column":83,"offset":9782}}}],"position":{"start":{"line":93,"column":1,"offset":9700},"end":{"line":93,"column":83,"offset":9782}}}],"position":{"start":{"line":91,"column":1,"offset":9468},"end":{"line":93,"column":83,"offset":9782}}}],"autoTemplate":true,"templateData":{"items":["Open a project's Connections tab and connect the mailbox, folder or tracker its work depends on.","On a Windows or Linux PC with an AMD Radeon card, look at Settings → This PC (llama) to see which engine runs your models.","If you run Gezel in Docker, change the port to 6230 when you pull the new image."],"ordered":false,"title":"Things to see and do after update"}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Connectors are no longer a preview.","startTime":0,"endTime":4.333333333333333,"audioSegment":0},{"text":"Every project can now bring in your mail, files, calendar,","startTime":4.333333333333333,"endTime":8.666666666666666,"audioSegment":0},{"text":"issues and feeds as searchable files, from a new Connections tab.","startTime":8.666666666666666,"endTime":13,"audioSegment":0},{"text":"Local models also run on AMD Radeon graphics through AMD's own ROCm engine,","startTime":13,"endTime":17.333333333333332,"audioSegment":0},{"text":"Qwen 3.8 Flash Next fits on Macs with far less memory, and a link on gezel.com can open the matching form in the app.","startTime":17.333333333333332,"endTime":21.666666666666664,"audioSegment":0},{"text":"If you read only one thing: open a project's Connections tab and add the mailbox or folder the work depends on.","startTime":21.666666666666664,"endTime":26,"audioSegment":0},{"text":"Until now, connectors appeared only after you turned on Show preview features.","startTime":26,"endTime":29.53846153846154,"audioSegment":0},{"text":"They are now part of every project.","startTime":29.53846153846154,"endTime":33.07692307692308,"audioSegment":0},{"text":"A project's new Connections tab lists its connections,","startTime":33.07692307692308,"endTime":36.61538461538461,"audioSegment":0},{"text":"its camera lookouts and its toolsets, which used to sit in the project's Settings tab.","startTime":36.61538461538461,"endTime":40.15384615384615,"audioSegment":0},{"text":"Add connection offers:","startTime":40.15384615384615,"endTime":43.69230769230769,"audioSegment":0},{"text":"Mail: Gmail, Outlook, Microsoft 365, and any mailbox that supports IMAP.","startTime":43.69230769230769,"endTime":47.230769230769226,"audioSegment":0},{"text":"Files and calendars: Google Drive, OneDrive, SharePoint, and Google and Microsoft calendars.","startTime":47.230769230769226,"endTime":50.76923076923077,"audioSegment":0},{"text":"Work trackers: GitHub issues, pull requests, releases and wikis, Linear, and Airtable.","startTime":50.76923076923077,"endTime":54.30769230769231,"audioSegment":0},{"text":"Feeds and posts: RSS feeds, YouTube, Bluesky, Instagram, LinkedIn and X.","startTime":54.30769230769231,"endTime":57.84615384615385,"audioSegment":0},{"text":"A connection copies what it reads into the project as ordinary files that your crew can search and cite,","startTime":57.84615384615385,"endTime":61.38461538461539,"audioSegment":0},{"text":"and keeps them up to date.","startTime":61.38461538461539,"endTime":64.92307692307692,"audioSegment":0},{"text":"Nothing connects until you add a connection,","startTime":64.92307692307692,"endTime":68.46153846153845,"audioSegment":0},{"text":"and each one fetches only from the account and folders you choose.","startTime":68.46153846153845,"endTime":72,"audioSegment":0},{"text":"Gezel ships no sign-in app of its own for Google and Microsoft,","startTime":72,"endTime":75.53846153846153,"audioSegment":0},{"text":"so those connections ask you to register one with the provider first; the form shows the steps and the address to paste.","startTime":75.53846153846153,"endTime":79.07692307692307,"audioSegment":0},{"text":"A mail connection sends only to the recipients and domains you allow,","startTime":79.07692307692307,"endTime":82.61538461538461,"audioSegment":0},{"text":"and a reply can be saved to your drafts for you to send yourself.","startTime":82.61538461538461,"endTime":86.15384615384616,"audioSegment":0},{"text":"What leaves this computer covers the network side.","startTime":86.15384615384616,"endTime":89.6923076923077,"audioSegment":0},{"text":"The projects and craftbooks that use a connector appear for everyone too.","startTime":89.6923076923077,"endTime":93.23076923076923,"audioSegment":0},{"text":"New Project now offers E-Mail, which links a mailbox and adds a Mail tab to the project,","startTime":93.23076923076923,"endTime":96.76923076923077,"audioSegment":0},{"text":"and Sales Pipeline, one of whose craftbooks can read your calendar.","startTime":96.76923076923077,"endTime":100.3076923076923,"audioSegment":0},{"text":"Pull Request Review, Meeting Prep Brief, Plan the Week,","startTime":100.3076923076923,"endTime":103.84615384615384,"audioSegment":0},{"text":"Social Digest and the other craftbooks that can work from a connection now appear in New Task and on Home's Create tab.","startTime":103.84615384615384,"endTime":107.38461538461539,"audioSegment":0},{"text":"Show preview features in Settings → About stays.","startTime":107.38461538461539,"endTime":110.92307692307692,"audioSegment":0},{"text":"It now covers one preview, Channels,","startTime":110.92307692307692,"endTime":114.46153846153845,"audioSegment":0},{"text":"which lets your crew send messages to a webhook such as a Slack channel or a phone notification service.","startTime":114.46153846153845,"endTime":118,"audioSegment":0},{"text":"On a Windows or Linux computer with a recent AMD graphics card,","startTime":118,"endTime":122.18181818181819,"audioSegment":0},{"text":"the desktop app now runs local models on the card through ROCm, AMD's own compute engine.","startTime":122.18181818181819,"endTime":126.36363636363636,"audioSegment":0},{"text":"It covers the Radeon RX 7000 and Radeon Pro W7000 series, the Radeon RX 9000 series and Radeon AI PRO R9700,","startTime":126.36363636363636,"endTime":130.54545454545453,"audioSegment":0},{"text":"the Radeon 780M and 760M graphics built into many Ryzen laptops, and Ryzen AI processors such as Strix Halo.","startTime":130.54545454545453,"endTime":134.72727272727272,"audioSegment":0},{"text":"Older Radeon cards keep the Vulkan engine, which already ran them.","startTime":134.72727272727272,"endTime":138.9090909090909,"audioSegment":0},{"text":"When ROCm cannot be used,","startTime":138.9090909090909,"endTime":143.0909090909091,"audioSegment":0},{"text":"Vulkan runs instead and Settings → This PC (llama) says why.","startTime":143.0909090909091,"endTime":147.27272727272728,"audioSegment":0},{"text":"On Linux the usual reason is that your account is not yet in the render and video groups.","startTime":147.27272727272728,"endTime":151.45454545454544,"audioSegment":0},{"text":"On Windows, the command-line install uses ROCm too.","startTime":151.45454545454544,"endTime":155.63636363636363,"audioSegment":0},{"text":"The ROCm engine is why the Windows and Linux downloads for Intel and AMD computers are larger in this release,","startTime":155.63636363636363,"endTime":159.8181818181818,"audioSegment":0},{"text":"by about 140 MB on Windows and 160 to 240 MB on Linux.","startTime":159.8181818181818,"endTime":164,"audioSegment":0},{"text":"Qwen 3.8 Flash Next, the 180-billion-parameter Qwen that runs on the DwarfStar engine,","startTime":164,"endTime":167.8,"audioSegment":0},{"text":"can now run on a Mac that cannot hold all of it.","startTime":167.8,"endTime":171.6,"audioSegment":0},{"text":"Gezel keeps the parts it uses most in memory and reads the rest from the SSD as it works,","startTime":171.6,"endTime":175.4,"audioSegment":0},{"text":"so it needs about 23 GB of memory instead of nearly 50 GB.","startTime":175.4,"endTime":179.2,"audioSegment":0},{"text":"On a Mac with room for the whole model,","startTime":179.2,"endTime":183,"audioSegment":0},{"text":"it still loads all of it.","startTime":183,"endTime":186.8,"audioSegment":0},{"text":"Gezel now plans memory for the large DwarfStar models from measurements of how much each really uses,","startTime":186.8,"endTime":190.6,"audioSegment":0},{"text":"with the whole model in memory and when streaming.","startTime":190.6,"endTime":194.4,"audioSegment":0},{"text":"It sizes the cache to fit, and declines a model the computer cannot hold,","startTime":194.4,"endTime":198.2,"audioSegment":0},{"text":"with a message saying so, instead of starting it and running out of memory.","startTime":198.2,"endTime":202,"audioSegment":0},{"text":"Gezel now opens gezel:// links.","startTime":202,"endTime":204.75,"audioSegment":0},{"text":"A link to a craftbook, a project type or a Help article opens that form or article in the app,","startTime":204.75,"endTime":207.5,"audioSegment":0},{"text":"so a page on gezel.com can take you straight to it.","startTime":207.5,"endTime":210.25,"audioSegment":0},{"text":"A link only opens the form.","startTime":210.25,"endTime":213,"audioSegment":0},{"text":"You still choose to start, and a link never runs,","startTime":213,"endTime":215.75,"audioSegment":0},{"text":"installs or downloads anything.","startTime":215.75,"endTime":218.5,"audioSegment":0},{"text":"On Windows, the app registers the link type for your account when it runs,","startTime":218.5,"endTime":221.25,"audioSegment":0},{"text":"and uninstalling removes it.","startTime":221.25,"endTime":224,"audioSegment":0},{"text":"Home's Make something tab is now called Create.","startTime":224,"endTime":227.27272727272728,"audioSegment":0},{"text":"The Activity panel reads at a glance: what needs you is tinted rose,","startTime":227.27272727272728,"endTime":230.54545454545453,"audioSegment":0},{"text":"work underway and next is amber, and what is ready is green.","startTime":230.54545454545453,"endTime":233.8181818181818,"audioSegment":0},{"text":"A section's light is on only when it holds something.","startTime":233.8181818181818,"endTime":237.0909090909091,"audioSegment":0},{"text":"The message box keeps its expanded size when you switch between chat and the terminal.","startTime":237.0909090909091,"endTime":240.36363636363637,"audioSegment":0},{"text":"Files a conversation used or made show a thumbnail when they are pictures.","startTime":240.36363636363637,"endTime":243.63636363636363,"audioSegment":0},{"text":"Model lists can group models under headings and describe each one.","startTime":243.63636363636363,"endTime":246.9090909090909,"audioSegment":0},{"text":"Claude's list is the first to use it.","startTime":246.9090909090909,"endTime":250.1818181818182,"audioSegment":0},{"text":"File lists have a Copy file path action,","startTime":250.1818181818182,"endTime":253.45454545454547,"audioSegment":0},{"text":"and documents can be shown in Finder or File Explorer.","startTime":253.45454545454547,"endTime":256.72727272727275,"audioSegment":0},{"text":"A task that is running opens on its chat,","startTime":256.72727272727275,"endTime":260,"audioSegment":0},{"text":"where the work is happening. Code,","startTime":260,"endTime":263.27272727272725,"audioSegment":0},{"text":"keyboard shortcuts and error messages can be selected and copied anywhere they appear.","startTime":263.27272727272725,"endTime":266.54545454545456,"audioSegment":0},{"text":"Background indexing shows one row per project in Activity.","startTime":266.54545454545456,"endTime":269.8181818181818,"audioSegment":0},{"text":"While you edit a document, it uses the app's own font.","startTime":269.8181818181818,"endTime":273.0909090909091,"audioSegment":0},{"text":"Its theme still applies when you play, preview or export it.","startTime":273.0909090909091,"endTime":276.3636363636364,"audioSegment":0},{"text":"Picture models that can only edit, such as Qwen Image Edit,","startTime":276.3636363636364,"endTime":279.6363636363636,"audioSegment":0},{"text":"are no longer used to draw a new picture. On a Mac,","startTime":279.6363636363636,"endTime":282.90909090909093,"audioSegment":0},{"text":"a conversation with pictures no longer looks full long before it is.","startTime":282.90909090909093,"endTime":286.1818181818182,"audioSegment":0},{"text":"A folder with Swift code no longer crashes gezel's indexing,","startTime":286.1818181818182,"endTime":289.45454545454544,"audioSegment":0},{"text":"which could restart it many times a day.","startTime":289.45454545454544,"endTime":292.72727272727275,"audioSegment":0},{"text":"Opening a project no longer sometimes shows \"Gezel API transport unavailable … Failed to fetch\".","startTime":292.72727272727275,"endTime":296,"audioSegment":0},{"text":"The Toolsets panel now loads only the toolsets it shows instead of the whole community registry,","startTime":296,"endTime":299.27272727272725,"audioSegment":0},{"text":"and large lists arrive compressed.","startTime":299.27272727272725,"endTime":302.54545454545456,"audioSegment":0},{"text":"A scheduled job whose first step names no specialist now starts with the schedule's gezel,","startTime":302.54545454545456,"endTime":305.8181818181818,"audioSegment":0},{"text":"instead of sitting idle and holding back every later run.","startTime":305.8181818181818,"endTime":309.0909090909091,"audioSegment":0},{"text":"A review that marks a check FAIL under a heading such as Sources or References now fails,","startTime":309.0909090909091,"endTime":312.3636363636364,"audioSegment":0},{"text":"where before that line could be skipped.","startTime":312.3636363636364,"endTime":315.6363636363636,"audioSegment":0},{"text":"On a Mac, when a gezel running on the computer's own model hands work to others,","startTime":315.6363636363636,"endTime":318.90909090909093,"audioSegment":0},{"text":"its closing message names them.","startTime":318.90909090909093,"endTime":322.1818181818182,"audioSegment":0},{"text":"Toolsets you add from an online server now work in GitHub Copilot and Claude Code sessions too.","startTime":322.1818181818182,"endTime":325.4545454545455,"audioSegment":0},{"text":"The on-device engines are updated: llama.cpp 0.9.0,","startTime":325.4545454545455,"endTime":328.72727272727275,"audioSegment":0},{"text":"stable-diffusion.cpp master-1050 for pictures, and mlx-vlm 0.7.12 on Macs.","startTime":328.72727272727275,"endTime":332,"audioSegment":0},{"text":"Camera pictures and paired computers.","startTime":332,"endTime":335.3636363636364,"audioSegment":0},{"text":"A paired server is now treated like a cloud engine: unless you let cloud AI see a camera's pictures,","startTime":335.3636363636364,"endTime":338.72727272727275,"audioSegment":0},{"text":"it does not get them when a gezel asks it for a picture.","startTime":338.72727272727275,"endTime":342.09090909090907,"audioSegment":0},{"text":"More in Cameras and lookouts.","startTime":342.09090909090907,"endTime":345.45454545454544,"audioSegment":0},{"text":"Claude Code sessions use only Gezel's tools.","startTime":345.45454545454544,"endTime":348.8181818181818,"audioSegment":0},{"text":"A gezel running on Claude Code used to pick up your own MCP servers and claude.ai connectors,","startTime":348.8181818181818,"endTime":352.1818181818182,"audioSegment":0},{"text":"such as Gmail and Drive, past your security settings.","startTime":352.1818181818182,"endTime":355.54545454545456,"audioSegment":0},{"text":"It now gets only the tools Gezel gives it.","startTime":355.54545454545456,"endTime":358.90909090909093,"audioSegment":0},{"text":"Sign-in on a Docker install counts every attempt in a burst before checking the password,","startTime":358.90909090909093,"endTime":362.27272727272725,"audioSegment":0},{"text":"so a burst of guesses reaches the lockout like single tries do.","startTime":362.27272727272725,"endTime":365.6363636363636,"audioSegment":0},{"text":"A daily check now also scans our published Docker images for known vulnerabilities.","startTime":365.6363636363636,"endTime":369,"audioSegment":0},{"text":"The port is now 6230.","startTime":369,"endTime":372.3333333333333,"audioSegment":0},{"text":"Images before this one answered on 6228.","startTime":372.3333333333333,"endTime":375.6666666666667,"audioSegment":0},{"text":"Start the container with -p 127.0.0.1:6230:6230 and sign in at http://localhost:6230.","startTime":375.6666666666667,"endTime":379,"audioSegment":0},{"text":"To keep 6228, add -e GEZEL_CONTAINER_PORT=6228 and map 6228.","startTime":379,"endTime":382.3333333333333,"audioSegment":0},{"text":"Your accounts, keys and work carry over.","startTime":382.3333333333333,"endTime":385.6666666666667,"audioSegment":0},{"text":"Gezel in Docker has the full command.","startTime":385.6666666666667,"endTime":389,"audioSegment":0},{"text":"A second container started on a volume another container is using now stops with a message to run commands in the first one with docker exec.","startTime":389,"endTime":392.3333333333333,"audioSegment":0},{"text":"A bare docker exec gezel gezel run … now lands in the Default project,","startTime":392.3333333333333,"endTime":395.6666666666667,"audioSegment":0},{"text":"instead of creating a project named \"work\" with a crew of its own.","startTime":395.6666666666667,"endTime":399,"audioSegment":0},{"text":"The command line installs with a short name: npx gezel-cli.","startTime":399,"endTime":402.8888888888889,"audioSegment":0},{"text":"gezeld and gezel-mcp are short names for the daemon and the MCP server.","startTime":402.8888888888889,"endTime":406.77777777777777,"audioSegment":0},{"text":"Add --download, or set GEZEL_AUTO_DOWNLOAD=1,","startTime":406.77777777777777,"endTime":410.6666666666667,"audioSegment":0},{"text":"and a command that needs a model downloads the engine and the model that fits this computer without asking.","startTime":410.6666666666667,"endTime":414.55555555555554,"audioSegment":0},{"text":"It suits scripts, containers and AI agents running Gezel for you.","startTime":414.55555555555554,"endTime":418.44444444444446,"audioSegment":0},{"text":"On a Mac whose engine toolkit is missing its Python helper,","startTime":418.44444444444446,"endTime":422.3333333333333,"audioSegment":0},{"text":"gezel run now says so and --download fetches it, instead of every message failing.","startTime":422.3333333333333,"endTime":426.22222222222223,"audioSegment":0},{"text":"A craftbook name with a typo no longer starts the daemon before saying it found nothing.","startTime":426.22222222222223,"endTime":430.1111111111111,"audioSegment":0},{"text":"gezel app guide prints the guide to building a Gezel app for the version you installed.","startTime":430.1111111111111,"endTime":434,"audioSegment":0},{"text":"Pages in Gezel apps get version 2 of the shared components: tabs,","startTime":434,"endTime":437.22222222222223,"audioSegment":0},{"text":"action forms in a dialog or inline, and collection filters that appear once a list is long enough.","startTime":437.22222222222223,"endTime":440.44444444444446,"audioSegment":0},{"text":"Build a Gezel app gathers everything an outside builder or their agent needs,","startTime":440.44444444444446,"endTime":443.6666666666667,"audioSegment":0},{"text":"and the new Gezel app UX guide describes how an app page is organized.","startTime":443.6666666666667,"endTime":446.8888888888889,"audioSegment":0},{"text":"@bendyline/gezel-capacitor is now a public npm package,","startTime":446.8888888888889,"endTime":450.1111111111111,"audioSegment":0},{"text":"with offline speech and knowledge catalogs for phone apps.","startTime":450.1111111111111,"endTime":453.3333333333333,"audioSegment":0},{"text":"Its speech plugin is named GezelOfflineSpeech.","startTime":453.3333333333333,"endTime":456.55555555555554,"audioSegment":0},{"text":"In the app SDK,","startTime":456.55555555555554,"endTime":459.77777777777777,"audioSegment":0},{"text":"openChat() with no gezel or role now talks to the project's lead.","startTime":459.77777777777777,"endTime":463,"audioSegment":0},{"text":"Open a project's Connections tab and connect the mailbox,","startTime":463,"endTime":465.8333333333333,"audioSegment":0},{"text":"folder or tracker its work depends on.","startTime":465.8333333333333,"endTime":468.6666666666667,"audioSegment":0},{"text":"On a Windows or Linux PC with an AMD Radeon card,","startTime":468.6666666666667,"endTime":471.5,"audioSegment":0},{"text":"look at Settings → This PC (llama) to see which engine runs your models.","startTime":471.5,"endTime":474.3333333333333,"audioSegment":0},{"text":"If you run Gezel in Docker,","startTime":474.3333333333333,"endTime":477.1666666666667,"audioSegment":0},{"text":"change the port to 6230 when you pull the new image.","startTime":477.1666666666667,"endTime":480,"audioSegment":0}],"version":1},"startBlock":{"title":"1.26313 — 9 November 2026","subtitle":"Connectors are no longer a preview. Every project can now bring in your mail, files, calendar, issues and feeds as searchable files, from a new Connections tab. Local models also run on AMD Radeon graphics through AMD's own ROCm engine, Qwen 3.8 Flash Next fits on Macs with far less memory, and a link on gezel.com can open the matching form in the app.","ambientMotion":"zoomIn"}}</script>
