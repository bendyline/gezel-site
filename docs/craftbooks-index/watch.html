start":{"line":292,"column":1,"offset":78772},"end":{"line":292,"column":80,"offset":78851}}},{"type":"tableCell","children":[{"type":"text","value":"Turn supplied content or a researched question into a real Word document (.docx, plus PDF on request) with DocBlocks.","position":{"start":{"line":292,"column":82,"offset":78853},"end":{"line":292,"column":199,"offset":78970}}}],"position":{"start":{"line":292,"column":80,"offset":78851},"end":{"line":292,"column":201,"offset":78972}}}],"position":{"start":{"line":292,"column":1,"offset":78772},"end":{"line":292,"column":201,"offset":78972}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../craftbook/automation-recipe/","children":[{"type":"text","value":"Write an Automation Recipe","position":{"start":{"line":293,"column":4,"offset":78976},"end":{"line":293,"column":30,"offset":79002}}}],"position":{"start":{"line":293,"column":3,"offset":78975},"end":{"line":293,"column":64,"offset":79036}}}],"position":{"start":{"line":293,"column":1,"offset":78973},"end":{"line":293,"column":65,"offset":79037}}},{"type":"tableCell","children":[{"type":"text","value":"Turn 'I wish the house would...' into an inspectable, versioned automation: triggers and actions that name real devices from the house's own inventory, a dry run through the device tools before anything is armed, and a manual override always written in.","position":{"start":{"line":293,"column":67,"offset":79039},"end":{"line":293,"column":320,"offset":79292}}}],"position":{"start":{"line":293,"column":65,"offset":79037},"end":{"line":293,"column":322,"offset":79294}}}],"position":{"start":{"line":293,"column":1,"offset":78973},"end":{"line":293,"column":322,"offset":79294}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../craftbook/year-in-review/","children":[{"type":"text","value":"Year in Review","position":{"start":{"line":294,"column":4,"offset":79298},"end":{"line":294,"column":18,"offset":79312}}}],"position":{"start":{"line":294,"column":3,"offset":79297},"end":{"line":294,"column":49,"offset":79343}}}],"position":{"start":{"line":294,"column":1,"offset":79295},"end":{"line":294,"column":50,"offset":79344}}},{"type":"tableCell","children":[{"type":"text","value":"Build the year-in-review that makes someone cry the good way: every month represented or its gap acknowledged, the people balanced, the closing image chosen on purpose — the annual ritual the whole photo archive exists for.","position":{"start":{"line":294,"column":52,"offset":79346},"end":{"line":294,"column":275,"offset":79569}}}],"position":{"start":{"line":294,"column":50,"offset":79344},"end":{"line":294,"column":277,"offset":79571}}}],"position":{"start":{"line":294,"column":1,"offset":79295},"end":{"line":294,"column":277,"offset":79571}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"link","url":"../craftbook/youtube-chapters-seo/","children":[{"type":"text","value":"YouTube Chapters & SEO Metadata","position":{"start":{"line":295,"column":4,"offset":79575},"end":{"line":295,"column":35,"offset":79606}}}],"position":{"start":{"line":295,"column":3,"offset":79574},"end":{"line":295,"column":72,"offset":79643}}}],"position":{"start":{"line":295,"column":1,"offset":79572},"end":{"line":295,"column":73,"offset":79644}}},{"type":"tableCell","children":[{"type":"text","value":"Turn a video (or its transcript) into a complete, paste-ready YouTube publishing kit — SEO title options, an optimized description with timestamped chapters, tags/keywords, and thumbnail text ideas — so an upload ranks and is navigable.","position":{"start":{"line":295,"column":75,"offset":79646},"end":{"line":295,"column":311,"offset":79882}}}],"position":{"start":{"line":295,"column":73,"offset":79644},"end":{"line":295,"column":313,"offset":79884}}}],"position":{"start":{"line":295,"column":1,"offset":79572},"end":{"line":295,"column":313,"offset":79884}}}],"position":{"start":{"line":5,"column":1,"offset":188},"end":{"line":295,"column":313,"offset":79884}}}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Craftbooks are step-by-step procedures your crew can follow to produce a real deliverable —","startTime":0,"endTime":497.8333333333333,"audioSegment":0},{"text":"each one names its steps, who runs them, and the checks a result must pass.","startTime":497.8333333333333,"endTime":995.6666666666666,"audioSegment":0},{"text":"CraftbookWhat it doesA/B Ad Copy VariationsGenerate a set of distinct, testable ad-copy variations for one offer across the angles worth A/B testing: it first locks the platform and its constraints (headline/description character limits), the offer, audience, and the distinct messaging angles to test (benefit,","startTime":995.6666666666666,"endTime":1493.5,"audioSegment":0},{"text":"pain, social proof, urgency, curiosity), then drafts multiple complete variants per angle so each is a genuine test of a hypothesis rather than a trivial reword.A/B Test ReadoutAnalyze a controlled experiment and produce a decision-ready readout: does the variant beat control, by how much, and is it real?","startTime":1493.5,"endTime":1991.3333333333333,"audioSegment":0},{"text":"States the hypothesis, the primary metric, and the decision rule FIRST (to avoid p-hacking and metric-shopping), then computes lift, statistical significance, and confidence intervals as a data-analyst, then writes a plain-language ship/no-ship recommendation.Accessibility AuditAudit a web page or UI for accessibility against WCAG 2.1 AA and produce a prioritized remediation report.Accessibility Retrofit (WCAG AA)Take an existing HTML page and retrofit it to WCAG 2.1 AA — fixing semantic structure, alt text, color contrast, keyboard operability, focus visibility, form labels, ARIA, and landmarks — without changing the visual design.Alt-Text PassGenerate accurate, WCAG-appropriate alt text for every image referenced by a site or folder and apply it back into the markup.Animated Content SlideshowTurn written content into a real MP4 video and animated GIF with DocBlocks.Animated SVG / CSS HeroBuild a single-file animated SVG or CSS hero section — a looping illustrated scene, an animated logo, or a motion banner driven by CSS keyframes or SMIL with no JavaScript animation library.Anniversary CutBuild the highlight reel for the occasion: the archive queried for the person and the years that matter, clips chosen with stated reasons, assembled through the project's media pipeline with a run log, and delivered with a chapter list and a dedication — the reel that makes the birthday.Annotated BibliographyBuild a formal annotated bibliography for a research topic: a planner locks the scope, the citation style, and the annotation rubric (summary + evaluation + relevance), then a researcher locates each source and writes a consistent, properly-formatted annotation that summarizes, critically evaluates, and situates it for the research question.Annual Document ReviewWalk a life binder's document roster once a year: inventory what is present and missing, confirm each present document is still current (right beneficiaries, right address, not expired), record the review so staleness tracking resets, and produce a prioritized to-do for the gaps.Anomaly / Outlier ScanScan a dataset for anomalies and outliers and report what is genuinely unusual versus expected noise.Answer a Question with SQLAnswer a specific business question against a database or table set with a correct, readable SQL query and a short written answer.API Contract ReviewReview an API contract or specification (OpenAPI/REST/GraphQL) for correctness, consistency, and developer ergonomics, then produce a findings report.Artifact Integrity & Ship ReviewPerform an isolated ship-readiness review of the actual built artifacts of a project—sites, npm packages, archives, CLIs, binaries, installers, checksums, signatures, and release bundles—rather than trusting source or CI status.Audio Ad SpotProduce a short broadcast/podcast audio ad spot (15s/30s/60s) — a tightly-timed script with a hook, value, and a single call-to-action, synthesized into a finished, runtime-accurate voiced spot with optional music bed cue.Audio Highlight ReelCut a long recording (podcast, interview, talk, stream) down to a short highlight reel of its best moments, delivered as a single stitched audio clip plus a cue sheet of the segments used.Audit Recurring SubscriptionsAudit a set of transactions or a vendor list to find every recurring subscription, normalize each to a monthly cost, surface duplicates, price hikes, and zombie/unused services, and produce a prioritized cancel/keep recommendation report.Auth / Session ImplementationImplement an authentication and session flow — login, session/token issuance, verification, and logout — with the security fundamentals baked in.Automate a Booking or Checkout FlowAutomate a multi-step booking, reservation, or checkout flow end-to-end — select, fill details, choose options, confirm — with a hard dry-run/confirmation guard so it never accidentally commits a real transaction during development.Batch Image TransformApply a consistent transform across a whole folder of images — resize, crop to a ratio, convert format, compress, watermark, or recolor — and verify every file came out correct.Batch-Fill Forms from a DatasetAutomate filling a web or PDF form once per row of an input dataset — registrations, applications, data-entry portals, mail-merge into a form.Behavior-Preserving RefactorRefactor a module to improve its structure, readability, or design WITHOUT changing observable behavior — the defining constraint is that the tests stay green throughout.Board Meeting DeckBuild a board-meeting deck that briefs directors efficiently — an executive summary up top, KPI dashboard, financials, progress against goals, key risks/asks, and an appendix — structured so a director gets the state of the business in minutes.Brand Tone RewriteRe-voice existing content to a specific brand tone while preserving every fact and the original structure: it first codifies the target voice into a concrete style guide — adjectives, do's and don'ts, banned and preferred words, sentence-length feel, point of view — then rewrites the content line by line to that voice without changing what it says.Branding WebsiteBuild a small brand/marketing website where the visual identity leads.Browser ExtensionBuild a Manifest V3 browser extension scaffold — a popup, a content script, and the manifest — that does one concrete thing on the current page (highlight, count, extract, or toggle).Browser QA AuditExercise a running app in a real browser, triage what breaks, and produce a report-only QA findings list with a health score — no code changes.Build + Test a Tricky RegexBuild a regular expression that matches exactly the right strings and rejects the wrong ones — specified with concrete should-match and should-NOT-match cases before a single character is written.Build LoopGeneric make-something procedure: scope the work and lock concrete acceptance criteria, build it, evaluate the result against those criteria, and loop back to building until every criterion is met — then finish.Bulk CRM Update from NotesTurn unstructured notes (call logs, meeting recaps, email threads) into a batch of structured CRM updates: per-contact field changes, activity logs, and next-step tasks as a validated import file.Bulk Product DescriptionsGenerate consistent, on-brand product descriptions in bulk from a list of products and their attributes: it first locks the brand voice, the field schema (title, short blurb, long description, bullet features, SEO meta), and a worked exemplar, then drafts every product to that exact template so the whole catalog reads as one voice.Canvas Generative ArtBuild a single-file generative art piece on canvas — flow fields, particle systems, recursive trees, Voronoi, noise terrain, or geometric tilings — that produces a fresh composition each run from a seed, with parameters the viewer can tweak.Capture a Recipe CardRescue a handwritten recipe card without sanding off its soul: transcribe the original faithfully — spelling quirks, margin notes, and all — standardize quantities in a separate block alongside (never instead of) the original wording, and pin the provenance note: whose card, whose kitchen, what they always changed.Care Visit PrepPrepare a one-page brief for a medical or care appointment from the project's care record: compile everything logged since the last visit, the current medication list with doses, the changes and symptoms worth raising, and a prioritized question list — so the ten minutes in the room get spent on what matters.Careful ModeSafety guardrails for destructive commands.Catalog an ItemTake new arrivals from shoebox to catalog: identify each item from its photo notes, record it with condition and an honest value basis, and flag what needs a better photo or an expert eye — uncertain identification stays uncertain in the record instead of becoming confident fiction.Categorize TransactionsClassify a list of bank/card transactions into a fixed chart-of-accounts category set, with confidence and a review queue for the uncertain ones, producing a clean categorized ledger ready for bookkeeping or tax.Changelog CutCut a new versioned section into a Keep a Changelog / CHANGELOG.md style file for a release — moving entries out of the Unreleased section into a dated, semver-stamped version block under the standard Added / Changed / Deprecated / Removed / Fixed / Security headings, with a fresh empty Unreleased section left behind.Character SheetLock a character before the pages need them: reference images across the poses and expressions the story calls for, the palette and silhouette written down, and every seed and prompt persisted in a manifest — so page twelve's hero is page one's hero.Character TurnaroundGive one character the full turnaround treatment: front, side, back, and three-quarter views generated against the same style anchor, every view manifest-recorded with the seed and prompt that made it — the reference every future sprite leans on.Chart Pack from DataBuild a single interactive HTML page of charts that answers a defined set of questions about a dataset.CI Pipeline from ScratchBuild a continuous-integration pipeline that installs, lints, tests, and builds on every push/PR — fast, cached, and gating merges on green.Citation AuditAudit an existing document's claims against its citations and report every mismatch: a reviewer pairs each cited claim with the citation it depends on and locks the audit rubric, a researcher opens each cited source and verifies the claim is actually supported, and a reviewer compiles a per-citation audit report with verdicts and fixes.Cited Research ReportProduce a rigorously cited research report that answers a specific question end to end: a planner first decomposes the question into sub-questions and locks the scope, then a researcher gathers and logs primary and secondary sources with inline citations, then a copywriter writes a structured markdown report (executive summary, findings, evidence, limitations, references).Classify and Route Incoming DocumentsBuild a document-intake pipeline that classifies each incoming file (invoice, contract, resume, receipt, ID, support ticket, other) into a fixed type set, extracts a few key fields per type, and routes it to the right destination folder with a normalized filename.Clean a DatasetProfile, clean, and validate a messy CSV/TSV/JSON dataset into an analysis-ready table.Close the MonthClose out a month of household spending against the project's ledger: sweep the month's entries for category strays and surprises, compute the in/out/net totals and category breakdown, compare against the prior month, and write a short honest month summary with one concrete action for next month.Code ReviewSnapshot-driven code review.Codebase Refactoring ReviewReview an entire codebase for the least cogent, highest-leverage refactoring opportunities without changing source.Codebase UX ReviewReview the user experience implemented across a codebase and, when runnable, exercise the key flows in a real browser.Coherent Icon PackProduce a coherent set of UI icons that look like they belong to one family — consistent grid, stroke weight, corner radius, optical sizing, and metaphor language — from a named list of concepts.Cohort / Retention AnalysisAnalyze retention or behavior by cohort to reveal whether the product is getting stickier over time.Command-Line ToolBuild a command-line tool with subcommands, flags, arguments, help text, and proper exit codes.Company Research BriefA sharp, dated, sourced brief on a company before an interview or application — what they do and how they make money, recent signals, team and role context, culture as evidenced, likely interview themes, and five specific questions to ask THEM.Compatibility CheckAnswer 'does it still work on the new version?' with a matrix, not a shrug: the datapack's files checked against each target version's format rules, every break named with the exact file and the exact fix, and the upgrade path written down in order.Competitive AnalysisCompare a set of competitors across consistent dimensions and turn the comparison into an actionable analysis: a planner locks the competitor set and the evaluation dimensions, a researcher fills a feature/positioning matrix with evidence-backed cells, and a copywriter writes the analysis with a clear recommendation and competitive gaps.Containerize a ServiceContainerize an application with a production-grade Dockerfile — small, secure, reproducible, and buildable — plus the supporting files to run it.Content Accuracy ReviewFact-check a piece of content for accuracy and produce a claim-by-claim verification report.Contract Template (Non-Legal-Advice)Draft a reusable, plain-language agreement template — service agreement, NDA, freelance contract, or terms — with clearly marked fill-in fields, structured numbered clauses, and a prominent non-legal-advice disclaimer.Corpus SynthesisRead a provided corpus of documents and synthesize it into a single coherent overview: a planner sets the synthesis question and the extraction schema, a researcher reads every document and extracts structured notes keyed back to each source, and a copywriter synthesizes the extracts into a unified narrative organized by idea rather than by document.CRUD Web AppBuild a small single-file CRUD web app — a todo list, notes, contacts, or inventory manager — with create, read, update, and delete plus localStorage persistence so data survives a reload.CSV / Tabular TransformerReshape and convert tabular data from one schema to another: rename and reorder columns, split or merge fields, derive new columns, pivot/unpivot, change format (CSV<->JSON<->TSV), and filter rows.Curate an AlbumTurn a thousand camera-roll photos into the forty that tell the story: cull the near-duplicates, keep the keepers for honest reasons, caption what matters, and leave an album manifest the family will actually revisit.Curated Annotated Reading ListCurate an annotated reading list on a topic for a defined reader: a planner sets the reader, their goal, and the selection and ordering criteria, then a researcher curates and annotates each pick with why it matters, what it covers, and a suggested reading order.Customer Case StudyWrite a persuasive, evidence-backed customer success story in the classic challenge-solution-results arc: it first scopes the customer, the quantified before/after metrics, the approved customer quotes, and the single takeaway for prospects, then writes the case study with a results-forward summary, a relatable challenge, the solution narrative, and a measurable results section, then a review pass verifies every number and quote and the persuasive flow.Customer Case StudyWrite a persuasive customer/case-study writeup that turns a customer's results into a credible marketing asset — challenge, solution, and quantified results in the classic before/after arc, with a pull-quote and a clear CTA.Daily Calendar & Prep BriefAssemble a morning brief from the day's calendar: a chronological agenda with per-meeting prep notes, conflicts flagged, and a short focus-time/priorities summary.Daily Email Digest from a CorpusProduce an email-ready digest that summarizes a corpus of content (docs, feeds, notes) for a recurring send.Dashboard SpecificationSpecify a dashboard from the questions it must answer, before anyone builds it — the artifact that prevents a chart-salad dashboard nobody uses.Data DictionaryDocument a dataset's schema as a clear, complete data dictionary so others can use it without guessing.Data Quality AuditAudit a dataset against explicit data-quality rules and produce a scorecard of where it passes and fails across completeness, validity, consistency, uniqueness, and timeliness.Data Visualization ExplorerBuild a single interactive chart or data explorer page — bar, line, scatter, or pie — driven by sample or provided data, with controls to filter, switch series, or change the dimension and a tooltip on hover.Dataset to Narrative ReportTurn a dataset into a written, evidence-backed analytical report that a non-technical reader can act on.Decision Evidence BriefAnswer a specific decision question with a weighted, confidence-rated evidence brief: a planner frames the decision and the options, locks the evidence criteria and a confidence scale, a researcher gathers evidence for and against each option and rates the strength of each piece, and a copywriter writes a decision-oriented brief that states a recommendation with explicit confidence levels and the key uncertainties.Deep Security ReviewRun a slow, thorough, WHOLE-CODEBASE security audit that looks for SYSTEMIC weaknesses — a vulnerability class repeated across many routes, a missing control at an architectural layer, inconsistent authorization, ad-hoc secret handling, a trust-boundary violation — not just isolated issues in one file.Dependency AuditAudit a project's dependencies for security, staleness, license, and maintenance risk, then produce a prioritized remediation report.Deploy ChecklistAuthor and then actually execute a pre-deploy verification checklist for shipping a release to production — the concrete gates that must be green before the deploy button is pressed: tests passing, build clean, migrations reviewed, config/secrets present, feature flags set, rollback path confirmed, and observability/alerts ready.Design System ConsultationInterview for product context and taste, then propose a full design system — type, color, layout, motion — and capture it as a DESIGN.md with live preview pages.Design the InvitationsProduce the invitation the day deserves and get the facts beyond doubt: the date, time, venue, and RSVP instructions checked letter-for-letter against the event record — because a beautiful card with the wrong date is the classic disaster.Diagnose + Add Database IndexesDiagnose slow database queries and add the right indexes — driven by the query plan, not by hunches — then prove the speedup without harming writes.Diagram from TextRender a clear technical diagram — flowchart, architecture, sequence, ER, or org chart — from a plain-language description, as code-defined (Mermaid/Graphviz/SVG) so it is editable and version-controllable rather than a flat picture.Digital Board GameBuild a single-file web version of a turn-based board game such as tic-tac-toe, checkers, connect-four, reversi, or a simple chess variant, with two-player hotseat or a basic AI opponent.Documentation Drift ReviewReview project documentation against the code, configuration, commands, API surface, and shipped behavior to find stale or misleading guidance.Documentation RewriteRewrite confusing existing documentation into clear, scannable, task-oriented prose without losing any technical fact: it first audits the current doc to catalog every problem — buried steps, undefined jargon, missing prerequisites, broken structure — and locks a clarity checklist, then rewrites the doc to fix exactly those issues while preserving every accurate instruction.Documentation SiteBuild a single-page documentation site with a sidebar table of contents, anchored sections, code blocks, and in-page navigation — the kind of reference page a library or API ships.Domain GlossaryBuild a consistent, accurate glossary for a domain: a planner sets the domain scope, the term-selection criteria, and the entry template, a researcher gathers the canonical definition and usage for each term with sources, and a copywriter writes the alphabetized glossary with cross-references and consistent entries.Draft a Social PostDraft one social post from idea to approved copy.Due-Diligence BriefProduce a structured due-diligence brief on an entity (company, vendor, investment, partner): a planner locks the diligence dimensions and red-flag criteria, a researcher gathers verifiable facts and risk signals per dimension with sources, and a copywriter writes a decision-oriented brief with findings, risks, and an overall read.Ebook CompileCompile a collection of notes, articles, or chapter drafts into a coherent, readable ebook — with a title page, table of contents, consistently formatted chapters, and front/back matter — output as a single navigable HTML book.Edit Notes PassReview the footage like an editor: timestamped notes on pacing and cuts read against the transcript and the media index, then a machine-readable cut list the assembly step can execute — opinion upstream, precision downstream.Editorial & Tone ReviewRun an editorial review on a piece of content for clarity, correctness, and brand voice, then produce a line-edit report and a clean revised version.Embeddable Feedback WidgetBuild a single-file embeddable feedback, contact, or rating widget — a floating button that opens a small panel with a rating, a message field, and validation, then shows a thank-you state and persists submissions to localStorage.Engineering RetrospectiveBuild a data-grounded engineering retrospective from git history: activity, hotspots, review patterns, and per-person growth notes for a given window.Enrich a Leads ListTake a raw leads or contacts list and enrich each row with derived and looked-up attributes — company domain, industry, size band, role seniority, normalized location, and a quality/score flag — into a clean CRM-ready file.ETL / Ingest PipelineBuild an extract-transform-load pipeline that ingests source data, reshapes it to a target schema, and loads it with validation at every stage.Execute an Ops RunbookExecute a written operational procedure step by step with verification and a stop-on-anomaly rule.Executive-Level ReviewA strategic, executive-level review of a plan or scope: challenge the premise, weigh alternatives, and score each dimension before committing — the 'should we even build this' p...Fact-Check a Set of ClaimsVerify a set of claims one by one and produce a verdict report: a planner extracts and itemizes every checkable claim and locks the rating scale, a researcher independently verifies each claim against primary sources and logs the evidence, and a reviewer compiles a per-claim verdict report with ratings and corrections.Family Story ChapterWrite one chapter of the family story from the record you actually have — interviews and tree facts woven into narrative, speculation clearly dressed as speculation — the ritual that turns an archive into the book every family means to write.FAQ from Source DocsBuild a grounded FAQ page by mining real source documents for the questions users actually ask, then writing tight, accurate answers traced back to the source: it first researches the corpus to extract candidate questions, dedupes and groups them, and ranks by likely frequency, then writes clear question-and-answer pairs where every answer is supported by the docs.Favicon & App-Icon SetGenerate the complete favicon and app-icon set a modern site needs — the multi-size favicon, Apple touch icon, Android/maskable icons, and the web app manifest plus the exact HTML link/meta tags — from a single source mark, ensuring the icon stays legible at 16px and the maskable variant survives platform cropping.Feature Flag Release PlanPlan and document a progressive feature-flag rollout for shipping a change behind a flag — defining the flag and its default-off state, the staged ramp (internal → 1% → 10% → 50% → 100%) with the success and guardrail metrics that gate each step, the automatic rollback/kill-switch criteria, and the cleanup that removes the flag once fully rolled out.Flagged Feature RolloutAdd a new feature behind a feature flag so it can ship dark, be toggled per-environment/user, and roll back instantly without a deploy.Forge a CrosswordConstruct a personalized crossword and prove it works before anyone's pencil touches it: the grid actually interlocks, every entry sits in the grid exactly where its number says, every clue is tuned to the solver — and the whole thing ships as a printable page with the solution kept decently out of sight.Formatted ReportProduce a polished, print-ready PDF report from Markdown with DocBlocks — no hand-built HTML or browser print translator.Freeze ScopeConfine all workspace writes to one directory.Full Game with Title & Game-Over ScreensBuild a complete single-file HTML game with the full screen flow — a title/start screen, the gameplay screen, a game-over screen showing the score, and a restart back to a fresh game — wrapping any core arcade or survival mechanic.Fundraiser Wrap-UpClose a fundraising drive properly: verify the final numbers against the donation ledger, confirm every donor was thanked (or finish the thank-yous now), and write the wrap-up story — the total, what the money does, and the people who made it happen — ready to share with the community and hand to t  events.Reviewer LoopDraft → critique → revise (looped until approved) → publish.Rollback PlanAuthor a concrete, tested rollback plan for a release so that when a deploy goes wrong the team can revert FAST and safely without improvising under pressure — covering the trigger conditions that mean 'roll back', the exact reversal steps (redeploy previous artifact, down-migrations, flag flips, cache/CDN invalidation), data-safety and forward/backward-compatibility considerations, the recovery-time estimate, and a post-rollback verification.Root-Cause InvestigationDebug a defect or production incident down to its true root cause and document the diagnosis with evidence, instead of patching the first symptom.Root-Cause InvestigationDebug systematically: reproduce the failure and find the true root cause before changing any code, then fix and verify.Rough Cut AssemblyExecute the cut list and prove it ran: every clip verified against the media index before anything renders, the assembly driven through the project's media pipeline with a run log, and the result checked against the expected duration — an assembly you can trust unwatched.RSS / Feed DigestBuild a recurring digest from RSS/Atom feeds or news sources: fetch the latest items in the window, dedupe and cluster by topic, then write a scannable digest with one-line takes and source links.Scaffold a ModStart the mod right: a correctly-shaped Minecraft datapack — pack.mcmeta carrying the right format number for the target game version, namespaced folders laid out properly, and one working example of the mod's core idea — plus install steps a twelve-year-old can follow.Scheduled Backup or ExportBuild a scheduled, idempotent backup/export routine that snapshots data (files, a database, or an app export) to a timestamped, optionally compressed destination, prunes old backups by a retention policy, and verifies each backup is restorable.Scheduled Batch JobBuild a scheduled batch job that runs on a cadence, processes a unit of work, is safe to re-run, and reports its outcome.Schema / Type MigrationPlan and execute a multi-file schema or type migration safely — changing a data model, type definition, or interface across the codebase while keeping everything compiling and consistent.Scrape a Site to Structured DataTurn one or more web pages into a clean, structured dataset (JSON or CSV) with a fixed schema — product listings, directory entries, articles, tables, or job posts.Seasonal Maintenance SweepRun a season's home-care sweep against the project's systems roster: work out what care is due or overdue from each system's interval, plan the walkthrough in a sensible order with supplies, then log the completed care and flag what needs a professional — leaving the roster's due-tracking reset and a short sweep report.Security Architecture ReviewA structured security architecture review: walk the stack for secrets, dependencies, auth, and common vulnerability classes, then report findings ranked by severity and confidence.Security Review of a DiffPerform a focused security review of a code change or diff and produce a vulnerability report mapped to a threat checklist.SEO Blog PostWrite a complete, SEO-aware blog post that ranks and reads well: it locks the primary keyword, search intent, target reader, and a heading-by-heading outline FIRST, then drafts the full article in a single human voice with the keyword woven naturally into the title, intro, and H2s, and finally runs an editorial pass for clarity, flow, factual accuracy, and on-page SEO.SEO Metadata PackGenerate a complete on-page SEO metadata pack for a set of pages: it first scopes each page's primary keyword and search intent and the length/format rules (title tag, meta description, Open Graph, Twitter card, slug), then writes optimized, unique metadata for every page that respects pixel/character limits and front-loads the keyword, producing a structured JSON file ready to drop into a CMS or templating layer.ShipEnd-to-end release procedure: run tests, run a review pass, commit/push, open the PR, wait for CI to come back green, hand off for merge.Simple Forecast / Trend ModelBuild a simple, defensible forecast of a time series (revenue, demand, signups, usage) with the assumptions and method stated up front and the projection plus a confidence band as the output.Slide Deck from ContentTurn a body of source content into a presentation deck.Social DigestThe overnight read of your social feeds.Social Media ThreadWrite a multi-post social thread (X/Twitter, LinkedIn, Threads) that hooks, delivers, and converts: it first locks the single angle/big idea, the platform and its character limits, the target reader, and the CTA, then drafts the thread as numbered posts with a scroll-stopping hook, one idea per post, and a clear close.Source Quality AuditOnce a month, make the reading list earn its place: score each source on what it actually delivered — accuracy, originality, noise — and keep, demote, or drop with evidence, so the brief stays sharp as the feeds drift.Spec AuthoringTurn a rough intent into a backlog-ready spec: interrogate scope and requirements against the real code, then file a well-formed, unambiguous issue.Spreadsheet / Financial ModelBuild a working spreadsheet-style model (budget, forecast, unit economics, pricing, or scenario calculator) with clearly separated inputs, calculations, and outputs.Standup / Team Update SummaryCondense a pile of raw team updates (standup messages, async check-ins, channel dumps) into one clean summary grouped by person or workstream, surfacing blockers and decisions.Subtitle & Caption GeneratorGenerate time-synced subtitles/captions for a video in a standard caption format (SRT or WebVTT), so the video is accessible and watchable without sound.Summarize a Long DocumentDistill a long document into a faithful, well-structured summary at a chosen depth: it first scopes the audience, the target length and format (TL;DR line, executive summary, or bulleted key points), and what the reader must take away, then writes the summary capturing every major point and decision in proportion, with nothing invented and nothing critical dropped.Survey AnalysisAnalyze survey responses into a clear summary of what respondents actually said, across both quantitative (rating/multiple-choice) and open-text questions.Tailor Résumé to a PostingAdapt an EXISTING résumé to a specific job posting — a fit map of must-hit requirements first, then a tailored variant that re-orders and re-words real experience without inventing any.Tailored Cover LetterWrite a tailored, one-page cover letter that maps a candidate's real background to a specific job's requirements: it first scopes the role's key requirements, the company hook, and the 3-4 strongest matching proof points from the applicant's experience, then drafts a focused letter with a specific opening, evidence-backed body paragraphs, and a confident close.Targeted Performance FixMake a measured, targeted performance improvement — profile to find the real bottleneck, optimize it, then prove the speedup with before/after numbers while keeping behavior correct.Team Handbook SectionWrite a clear, reference-grade section of a team/company handbook — a policy, process, or how-we-work doc that a new hire can read once and act on correctly.Technical Design DocWrite a technical design document (RFC / engineering design doc) that gets a system change reviewed and approved — covering context and problem, goals and non-goals, the proposed design, alternatives considered, trade-offs, risks, and a rollout plan.Technical DocumentationGenerate a coherent documentation set from a codebase, organized by the Diataxis model (tutorials, how-to guides, reference, explanation), with cross-links and a coverage pass.Test Coverage ReviewReview a codebase or module's test suite for real coverage and quality, then produce a gap report and a prioritized backlog of tests to add.Test Suite BackfillAdd a meaningful test suite to existing untested (or under-tested) code, prioritizing the highest-risk behavior and edge cases over vanity coverage.Text-to-Speech a FolderTurn a folder of text files (articles, chapters, notes, markdown) into a set of spoken audio files using text-to-speech, so a reading list becomes a listening list.Thank-You Note BatchClear the owed-thanks list with notes that sound like you: read who is owed and for what from the correspondence roster, draft one note per person that names the actual gift or kindness — no template smell — then log every note so nobody who mattered goes unanswered.Thumbnail GeneratorDerive a consistent set of thumbnails or responsive size-variants from a folder of source images — square crops for grids, srcset widths for the web, smart-cropped to keep the subject centered — and emit them with predictable names.Tileset BatchProduce a style-locked batch of tiles and account for every one: named to the convention, sized to spec, generated against the library's style anchor, and appended to the manifest with tags — an asset library a game engine can trust, not a folder of maybes.Topic ExplainerExplain a complex topic clearly for a defined audience: a planner pins the audience, their assumed prior knowledge, and the concepts that must be taught, a researcher gathers accurate facts and good analogies with sources, and a copywriter writes a progressively-structured explainer that builds from fundamentals to the full picture.Track Prices Over TimeBuild a price tracker that records the price of one or more products/SKUs each time it runs, appending a timestamped history so you can see trends, drops, and the lowest price seen.Transcribe and Index a TapeGive one tape the ten-second-findability treatment: transcript on file, then every moment worth finding indexed with its timecode and people tags — so 'the clip of Opa's 80th toast' becomes a query, not an afternoon of scrubbing.Transcribe Audio or VideoConvert an audio or video recording into an accurate, readable transcript using speech-to-text, with speaker labels and timestamps.Transcript to ShownotesTake a finished recording from raw transcript to publishable shownotes: a clean transcript on file, timestamped chapters, a summary listeners actually read, and the links mentioned — the per-episode ritual that turns audio into an archive.Translate ContentTranslate the project's new and changed content into the designated language as sidecar files under translations//, mirroring the source structure and never modifying originals.Type-Safety PassTighten the types of a module — eliminate any/implicit-any, add precise annotations, narrow unions, and make illegal states unrepresentable — without changing runtime behavior.Typed SDK Wrapper for an External APIWrap a third-party HTTP API as a clean, typed client library — studying the real API surface first so the wrapper matches reality, not guesses.UX & Visual Design ReviewCritique a UI's user experience and visual design and produce a prioritized design-review report.Version BumpPerform a coordinated, semver-correct version bump across a project — deciding MAJOR/MINOR/PATCH from the actual change set, then updating every place the version is stamped in lockstep (package manifest(s), version constant, lockfile, badges, docs) plus the changelog header, so nothing drifts out of sync.Video Storyboard from a ScriptTurn a video script into a shot-by-shot storyboard — each scene broken into shots with a framing sketch/description, camera direction, on-screen action, the matching script line, and timing — so a shoot or animation has a clear visual plan.Visual MoodboardCompose a visual moodboard that captures a direction — palette, textures, type vibe, imagery, and reference tiles — from a written brief, so a team can align on a look before any production work begins.Voiceover / TTS ScriptWrite a voiceover script tuned for spoken delivery — by a human VO artist or a text-to-speech engine — for a video, ad, explainer, or narration, with pacing, pronunciation, and timing baked in.Watch a Page or API and AlertBuild a watcher that polls a web page or API endpoint on a schedule, detects a meaningful change or threshold breach, and fires an alert (and only alerts on real changes, not noise).Weak-Spot DrillStop practicing what you already know: read the review record, name the actual weak spots with the numbers as evidence, and build a short targeted drill plus the follow-up schedule that closes them.Weave a ChapterWeave the banked sessions into one memoir chapter in the teller's voice: every scene traceable to something actually said, gaps marked for a future session instead of invented — the ritual that turns interviews into a book.Weekly Garden WalkthroughWalk the beds once a week with a plan instead of a vague worry: what each bed needs this week derived from the plantings and the season, the walkthrough ordered so it actually gets done, and the observations and harvests logged so the almanac accrues.Weekly Pipeline ReviewThe weekly walk of a job-search pipeline — a grounded snapshot of every application (what moved in the last seven days, what went stale, which follow-ups are due), then a review that chases or consciously parks every stalled item and commits to exactly three concrete priorities for next week.WhitepaperAuthor a long-form, authoritative whitepaper that makes a researched argument — a technical position paper, industry analysis, or thought-leadership piece with citations.Word Document from Content or ResearchTurn supplied content or a researched question into a real Word document (.docx, plus PDF on request) with DocBlocks.Write an Automation RecipeTurn 'I wish the house would...' into an inspectable, versioned automation: triggers and actions that name real devices from the house's own inventory, a dry run through the device tools before anything is armed, and a manual override always written in.Year in ReviewBuild the year-in-review that makes someone cry the good way: every month represented or its gap acknowledged, the people balanced, the closing image chosen on purpose — the annual ritual the whole photo archive exists for.YouTube Chapters & SEO MetadataTurn a video (or its transcript) into a complete, paste-ready YouTube publishing kit — SEO title options, an optimized description with timestamped chapters, tags/keywords, and thumbnail text ideas — so an upload ranks and is navigable.","startTime":2489.1666666666665,"endTime":2987,"audioSegment":0}],"version":1},"startBlock":{"title":"Every craftbook","subtitle":"Craftbooks are step-by-step procedures your crew can follow to produce a real deliverable — each one names its steps, who runs them, and the checks a result must pass.","ambientMotion":"zoomIn"}}</script>
