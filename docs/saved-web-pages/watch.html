sition":{"start":{"line":53,"column":1,"offset":4626},"end":{"line":53,"column":196,"offset":4821}}}],"position":{"start":{"line":53,"column":1,"offset":4626},"end":{"line":53,"column":196,"offset":4821}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A project can follow web pages: a product's documentation,","startTime":0,"endTime":3.4285714285714284,"audioSegment":0},{"text":"a supplier's price list, a team wiki, a news section.","startTime":3.4285714285714284,"endTime":6.857142857142857,"audioSegment":0},{"text":"Gezel visits each page in its own browser,","startTime":6.857142857142857,"endTime":10.285714285714285,"audioSegment":0},{"text":"keeps a copy of what it says and a few screenshots of how it looked, and checks again on a schedule.","startTime":10.285714285714285,"endTime":13.714285714285714,"audioSegment":0},{"text":"When Gezel works on your project, it reads those copies.","startTime":13.714285714285714,"endTime":17.142857142857142,"audioSegment":0},{"text":"It never browses while it works, so a page can't steer it anywhere,","startTime":17.142857142857142,"endTime":20.57142857142857,"audioSegment":0},{"text":"and nothing it writes can leave through an address.","startTime":20.57142857142857,"endTime":24,"audioSegment":0},{"text":"Open the project's Connections tab, choose Add connection, then Websites.","startTime":24,"endTime":27.444444444444443,"audioSegment":0},{"text":"Paste one or more addresses, separated by commas.","startTime":27.444444444444443,"endTime":30.88888888888889,"audioSegment":0},{"text":"A bare site name like example.com works.","startTime":30.88888888888889,"endTime":34.333333333333336,"audioSegment":0},{"text":"Choose how far to follow links (2 means the pages it links to,","startTime":34.333333333333336,"endTime":37.77777777777778,"audioSegment":0},{"text":"and the pages those link to), how many pages to keep, and how often to check for changes. Press Add.","startTime":37.77777777777778,"endTime":41.22222222222222,"audioSegment":0},{"text":"Gezel saves the first pages right away and keeps going in the background.","startTime":41.22222222222222,"endTime":44.66666666666667,"audioSegment":0},{"text":"Links are followed inside the folder of each address: https://example.com/docs/ stays inside the docs.","startTime":44.66666666666667,"endTime":48.111111111111114,"audioSegment":0},{"text":"Gezel goes slowly, at most one page every second or two,","startTime":48.111111111111114,"endTime":51.55555555555556,"audioSegment":0},{"text":"and follows the site's rules for crawlers.","startTime":51.55555555555556,"endTime":55,"audioSegment":0},{"text":"To keep a single page, write its address in a chat, starting with https:// or www.,","startTime":55,"endTime":58.54545454545455,"audioSegment":0},{"text":"or press Save a page in Web pages once the project follows a site.","startTime":58.54545454545455,"endTime":62.09090909090909,"audioSegment":0},{"text":"A line above the message box says the page will be saved here and included in the chat.","startTime":62.09090909090909,"endTime":65.63636363636364,"audioSegment":0},{"text":"When you send the message, Gezel saves the page first and includes it with your message,","startTime":65.63636363636364,"endTime":69.18181818181819,"audioSegment":0},{"text":"so \"Can you summarize https://example.com/pricing?\" works as you'd expect.","startTime":69.18181818181819,"endTime":72.72727272727272,"audioSegment":0},{"text":"Press × on that line if you don't want the page fetched,","startTime":72.72727272727272,"endTime":76.27272727272728,"audioSegment":0},{"text":"or Save now to save it before you finish writing.","startTime":76.27272727272728,"endTime":79.81818181818181,"audioSegment":0},{"text":"Under your sent message,","startTime":79.81818181818181,"endTime":83.36363636363636,"audioSegment":0},{"text":"a row with the page's title opens the saved copy.","startTime":83.36363636363636,"endTime":86.9090909090909,"audioSegment":0},{"text":"A page saved this way isn't refreshed on its own;","startTime":86.9090909090909,"endTime":90.45454545454545,"audioSegment":0},{"text":"press Sync now on its connection when you want a fresh copy.","startTime":90.45454545454545,"endTime":94,"audioSegment":0},{"text":"The project's Web pages view tab lists the pages by site.","startTime":94,"endTime":97.22222222222223,"audioSegment":0},{"text":"Choose one to read it.","startTime":97.22222222222223,"endTime":100.44444444444444,"audioSegment":0},{"text":"Reading shows the page's text; Screenshots shows how it looked.","startTime":100.44444444444444,"endTime":103.66666666666667,"audioSegment":0},{"text":"A link to another saved page opens it here;","startTime":103.66666666666667,"endTime":106.88888888888889,"audioSegment":0},{"text":"any other link opens in your browser.","startTime":106.88888888888889,"endTime":110.11111111111111,"audioSegment":0},{"text":"When Gezel has written a short synopsis of a page,","startTime":110.11111111111111,"endTime":113.33333333333334,"audioSegment":0},{"text":"it appears at the top, marked as written from the page.","startTime":113.33333333333334,"endTime":116.55555555555556,"audioSegment":0},{"text":"Each site also gets two files Gezel reads: an overview of every saved page,","startTime":116.55555555555556,"endTime":119.77777777777777,"audioSegment":0},{"text":"and a change log for the month listing pages that appeared, changed (with the lines that changed) and disappeared.","startTime":119.77777777777777,"endTime":123,"audioSegment":0},{"text":"In Connections → Lookouts, choose the site and what to watch for: a page that changed,","startTime":123,"endTime":126.5,"audioSegment":0},{"text":"a new page, or words that appear (for example \"sold out\" or \"version 2.0\").","startTime":126.5,"endTime":130,"audioSegment":0},{"text":"You can limit it to part of the site, like /pricing.","startTime":130,"endTime":133.5,"audioSegment":0},{"text":"Then choose what happens: a notification, a sound,","startTime":133.5,"endTime":137,"audioSegment":0},{"text":"a message to your phone, an email, or having Gezel look into it.","startTime":137,"endTime":140.5,"audioSegment":0},{"text":"Gezel checks each time it refreshes the site.","startTime":140.5,"endTime":144,"audioSegment":0},{"text":"For pages behind a sign-in, press Sign in… on the site's connection.","startTime":144,"endTime":147.6,"audioSegment":0},{"text":"Gezel opens a browser window: check the address bar shows the site (or the sign-in service it uses),","startTime":147.6,"endTime":151.2,"audioSegment":0},{"text":"sign in as you normally would, then come back and press Done.","startTime":151.2,"endTime":154.8,"audioSegment":0},{"text":"Gezel keeps the sign-in for that connection only,","startTime":154.8,"endTime":158.4,"audioSegment":0},{"text":"encrypted on your computer, and never sees your password.","startTime":158.4,"endTime":162,"audioSegment":0},{"text":"If the site signs you out later, Gezel stops refreshing it,","startTime":162,"endTime":165.6,"audioSegment":0},{"text":"keeps every page it saved, and the connection says Signed out — sign in again.","startTime":165.6,"endTime":169.2,"audioSegment":0},{"text":"Press Sign out to forget the sign-in.","startTime":169.2,"endTime":172.8,"audioSegment":0},{"text":"When signed in, Gezel is stricter: it only follows links inside the addresses you gave,","startTime":172.8,"endTime":176.4,"audioSegment":0},{"text":"and never follows links that could change something (sign out, delete, buy, approve).","startTime":176.4,"endTime":180,"audioSegment":0},{"text":"While it works, Gezel can save a page it already found as a link on a site you follow,","startTime":180,"endTime":183,"audioSegment":0},{"text":"and then read it.","startTime":183,"endTime":186,"audioSegment":0},{"text":"For any other address it asks you first,","startTime":186,"endTime":189,"audioSegment":0},{"text":"and you decide whether to save it.","startTime":189,"endTime":192,"audioSegment":0},{"text":"You can make Gezel ask you every time from the connection's Edit.","startTime":192,"endTime":195,"audioSegment":0},{"text":"It never clicks, types or fills in anything on a page.","startTime":195,"endTime":197.88888888888889,"audioSegment":0},{"text":"Cookie banners are hidden, not accepted.","startTime":197.88888888888889,"endTime":200.77777777777777,"audioSegment":0},{"text":"It never downloads files from pages or grants a page any permission.","startTime":200.77777777777777,"endTime":203.66666666666666,"audioSegment":0},{"text":"It can't reach your home or office network from a page,","startTime":203.66666666666666,"endTime":206.55555555555554,"audioSegment":0},{"text":"except a private site you typed yourself, like an intranet wiki.","startTime":206.55555555555554,"endTime":209.44444444444446,"audioSegment":0},{"text":"A page that shows a bot check, a sign-in form,","startTime":209.44444444444446,"endTime":212.33333333333334,"audioSegment":0},{"text":"or almost nothing never replaces a copy Gezel already has.","startTime":212.33333333333334,"endTime":215.22222222222223,"audioSegment":0},{"text":"Some sites refuse automated visits.","startTime":215.22222222222223,"endTime":218.11111111111111,"audioSegment":0},{"text":"Those pages are listed as could not be saved, with the reason.","startTime":218.11111111111111,"endTime":221,"audioSegment":0},{"text":"At the default security level,","startTime":221,"endTime":224.33333333333334,"audioSegment":0},{"text":"sites refresh on their own whenever this computer may use the network for you (Settings → Security & compliance → App network).","startTime":224.33333333333334,"endTime":227.66666666666666,"audioSegment":0},{"text":"Turning that off stops a visit in progress.","startTime":227.66666666666666,"endTime":231,"audioSegment":0},{"text":"Gezel uses the browser it downloads for itself.","startTime":231,"endTime":234.33333333333334,"audioSegment":0},{"text":"Until that download finishes, or where the browser can't run safely,","startTime":234.33333333333334,"endTime":237.66666666666666,"audioSegment":0},{"text":"pages are saved as text only, without screenshots, and the connection says so.","startTime":237.66666666666666,"endTime":241,"audioSegment":0}],"version":1},"startBlock":{"title":"Saved web pages","subtitle":"A project can follow web pages: a product's documentation, a supplier's price list, a team wiki, a news section. Gezel visits each page in its own browser, keeps a copy of what it says and a few screenshots of how it looked, and checks again on a schedule. When Gezel works on your project, it reads those copies. It never browses while it works, so a page can't steer it anywhere, and nothing it writes can leave through an address.","ambientMotion":"zoomIn"}}</script>
