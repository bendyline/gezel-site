 working on it gets DocBlocks' tools for that conversation.","startTime":44.92307692307692,"endTime":48.230769230769226,"audioSegment":0},{"text":"It can write Word (.docx), PowerPoint (.pptx), Excel (.xlsx), PDF, CSV, web pages,","startTime":48.230769230769226,"endTime":51.53846153846153,"audioSegment":0},{"text":"and ebooks (.epub), and turn a deck into an animated slideshow (MP4 or GIF) or images.","startTime":51.53846153846153,"endTime":54.84615384615385,"audioSegment":0},{"text":"It works from Markdown, from Word, PowerPoint,","startTime":54.84615384615385,"endTime":58.15384615384615,"audioSegment":0},{"text":"and Excel files, and from files your crew already made.","startTime":58.15384615384615,"endTime":61.46153846153846,"audioSegment":0},{"text":"Data that isn't a document yet, such as JSON or a log, gets laid out as a readable document first and then converted,","startTime":61.46153846153846,"endTime":64.76923076923077,"audioSegment":0},{"text":"one file at a time or all together, whichever you asked for.","startTime":64.76923076923077,"endTime":68.07692307692307,"audioSegment":0},{"text":"Your crew can read documents too.","startTime":68.07692307692307,"endTime":71.38461538461539,"audioSegment":0},{"text":"Add Word, PowerPoint, Excel, or PDF files to a project and your crew can read them as text,","startTime":71.38461538461539,"endTime":74.6923076923077,"audioSegment":0},{"text":"to summarize, compare, or answer questions about them.","startTime":74.6923076923077,"endTime":78,"audioSegment":0},{"text":"Finished files land in the project's artifacts, listed in its Artifacts tab,","startTime":78,"endTime":81.25,"audioSegment":0},{"text":"next to everything else your crew makes (see Projects, threads, and where work lives).","startTime":81.25,"endTime":84.5,"audioSegment":0},{"text":"Converting never changes the files you started from,","startTime":84.5,"endTime":87.75,"audioSegment":0},{"text":"and a folder you've added read-only is never written to.","startTime":87.75,"endTime":91,"audioSegment":0},{"text":"For a deck or report that needs research, an outline,","startTime":91,"endTime":94,"audioSegment":0},{"text":"and a review before it's done, use a craftbook.","startTime":94,"endTime":97,"audioSegment":0},{"text":"PowerPoint from Content, Word Document from Content or Research,","startTime":97,"endTime":100,"audioSegment":0},{"text":"and Formatted Report each plan the document, write it, check it, and save the file.","startTime":100,"endTime":103,"audioSegment":0},{"text":"Ask the Meester for \"a PowerPoint about…\" and they'll start the right one;","startTime":103,"endTime":106,"audioSegment":0},{"text":"Craftbooks explains how they run.","startTime":106,"endTime":109,"audioSegment":0},{"text":"Small models on your own computer sometimes overlook a tool they have.","startTime":109,"endTime":113,"audioSegment":0},{"text":"If a gezel says it can't make a document,","startTime":113,"endTime":117,"audioSegment":0},{"text":"ask again and name the format and the files plainly: \"Convert the JSON files in this folder to .docx files.\"","startTime":117,"endTime":121,"audioSegment":0}],"version":1},"startBlock":{"title":"Making and converting documents","subtitle":"Your crew can hand you real files, not just text in a chat. Ask for a Word document, a PowerPoint deck, an Excel spreadsheet, or a PDF, and that's what you get back: a file you can open, send, and print.","ambientMotion":"zoomIn"}}</script>
