ins local daemon discovery helpers.","Integrations that already have an authorized connection and need more than the OpenAI-compatible app surface."],["@bendyline/gezel-sdk","The small, typed API available to TypeScript scripts inside Gezel's sandbox: defineScript, gezel.fs, gezel.task, gezel.llm, and the other capability-gated namespaces.","Script and craftbook authors. See Writing scripts with gezel-sdk."],["@bendyline/gezel-script-runtime","Portable, capability-mediated script execution: a host-neutral executor contract and a QuickJS (WebAssembly) implementation that runs Gezel scripts against the real SDK. The daemon still uses its Node sandbox by default.","Embedders and other hosts that need to run Gezel scripts themselves. Script authors use @bendyline/gezel-sdk instead."],["@bendyline/gezel-app-sdk","Local discovery, pinned TLS, user consent, scoped token storage, model setup, chat, embeddings, and model listing for third-party applications.","Desktop and Node application developers. See Building connected apps with gezel-app-sdk."],["@bendyline/gezel-plugin-sdk","The historical plugin helper surface. It remains supported for compatibility, but new extensions should use @bendyline/gezel-sdk.","Maintainers of existing Gezel plugins."],["@bendyline/gezel-catalog","Loads model definitions, toolsets, connector types, project types, gezel roles, and craftbooks from the separately released Gilde content.","Catalog tooling, tests, and embedders that need to resolve catalog items outside the daemon."],["@bendyline/gezel-knowledge","The .gezk toolchain: a deterministic catalog compiler, verified archive extraction, and a read-only catalog reader with full-text and vector search. The gezel knowledge commands are built on it.","Anyone building or reading knowledge catalogs from code."],["@bendyline/gezel-connectors-spectral","An isolated subprocess host for compatible Prismatic components. Keeping it out of the daemon process isolates its SDK and vendored connectors.","Usually nobody directly; @bendyline/gezel-service resolves and spawns it."],["@bendyline/gezel-script-stdlib","The trusted, read-only standard library of gate scripts that ships with Gezel. Its plain TypeScript sources run in place under the standard script scope.","Usually the daemon; craftbook authors may inspect it for reusable standard checks."],["@bendyline/gezel-mcp","The stdio Model Context Protocol server that exposes workspace, memory, artifact, document, task, team, execution, history, and media tools. It calls back into a running daemon.","MCP hosts and custom agent harnesses that need Gezel's tool surface."],["@bendyline/gezel-inference","The on-device inference runtime: native engines such as llama.cpp and MLX, model download and verification, the on-device embedder, knowledge search, and the OpenAI-compatible routes. It holds no product state: no gezels, projects, chats, or tools.","Applications that host on-device models in their own process through @bendyline/gezel-app-sdk (host: { inferenceOnly: true }). Everyone else receives it through @bendyline/gezel-service."],["@bendyline/gezel-service","gezeld, the local daemon. It owns state, provider routing, chat sessions, tools, tasks, engines, and the HTTP API, and includes the browser UI and Handboek.","Headless operators and applications deliberately embedding or managing a Gezel daemon."],["@bendyline/gezel-cli","The gezel terminal interface, one-shot runner, service manager, model and engine manager, media commands, and Handboek exporter. It does not expose a supported JavaScript API.","People using the gezel command line."],["gezel","The short name for @bendyline/gezel-cli, so npx gezel works. It installs that package and runs its gezel command.","People trying or installing the command line."],["gezel-cli, gezeld, gezel-mcp","Short names for @bendyline/gezel-cli, the gezeld command in @bendyline/gezel-service, and @bendyline/gezel-mcp. Each installs that package and runs its command.","Anyone who leaves off the @bendyline/ scope."]],"align":[null,null,null],"title":"Every published package"}},{"id":"packages-that-work-together","startTime":268,"duration":36,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Packages that work together","position":{"start":{"line":64,"column":4,"offset":7291},"end":{"line":64,"column":31,"offset":7318}}}],"position":{"start":{"line":64,"column":1,"offset":7288},"end":{"line":64,"column":31,"offset":7318}}},"title":"Packages that work together","contents":[{"type":"paragraph","children":[{"type":"inlineCode","value":"@bendyline/gezel-app-sdk","position":{"start":{"line":66,"column":1,"offset":7320},"end":{"line":66,"column":27,"offset":7346}}},{"type":"text","value":" and ","position":{"start":{"line":66,"column":27,"offset":7346},"end":{"line":66,"column":32,"offset":7351}}},{"type":"inlineCode","value":"@bendyline/gezel-client","position":{"start":{"line":66,"column":32,"offset":7351},"end":{"line":66,"column":57,"offset":7376}}},{"type":"text","value":" solve different halves of a connected application. The app SDK discovers the logged-in user's daemon, pins its loopback certificate, asks for consent, and returns a scoped connection. Pass that connection to ","position":{"start":{"line":66,"column":57,"offset":7376},"end":{"line":66,"column":266,"offset":7585}}},{"type":"inlineCode","value":"GezelClient","position":{"start":{"line":66,"column":266,"offset":7585},"end":{"line":66,"column":279,"offset":7598}}},{"type":"text","value":" when the application also needs the full product API.","position":{"start":{"line":66,"column":279,"offset":7598},"end":{"line":66,"column":333,"offset":7652}}}],"position":{"start":{"line":66,"column":1,"offset":7320},"end":{"line":66,"column":333,"offset":7652}}},{"type":"paragraph","children":[{"type":"inlineCode","value":"@bendyline/gezel-service","position":{"start":{"line":68,"column":1,"offset":7654},"end":{"line":68,"column":27,"offset":7680}}},{"type":"text","value":" is the runtime, while ","position":{"start":{"line":68,"column":27,"offset":7680},"end":{"line":68,"column":50,"offset":7703}}},{"type":"inlineCode","value":"@bendyline/gezel-client","position":{"start":{"line":68,"column":50,"offset":7703},"end":{"line":68,"column":75,"offset":7728}}},{"type":"text","value":" is its supported control surface. Prefer the client over hand-written ","position":{"start":{"line":68,"column":75,"offset":7728},"end":{"line":68,"column":146,"offset":7799}}},{"type":"inlineCode","value":"/api","position":{"start":{"line":68,"column":146,"offset":7799},"end":{"line":68,"column":152,"offset":7805}}},{"type":"text","value":" calls, and do not assume the service runs inside your process: the desktop app, CLI, and remote deployments all use the same HTTP boundary.","position":{"start":{"line":68,"column":152,"offset":7805},"end":{"line":68,"column":292,"offset":7945}}}],"position":{"start":{"line":68,"column":1,"offset":7654},"end":{"line":68,"column":292,"offset":7945}}},{"type":"paragraph","children":[{"type":"inlineCode","value":"@bendyline/gezel-sdk","position":{"start":{"line":70,"column":1,"offset":7947},"end":{"line":70,"column":23,"offset":7969}}},{"type":"text","value":" is different from both. Its code runs ","position":{"start":{"line":70,"column":23,"offset":7969},"end":{"line":70,"column":62,"offset":8008}}},{"type":"emphasis","children":[{"type":"text","value":"inside","position":{"start":{"line":70,"column":63,"offset":8009},"end":{"line":70,"column":69,"offset":8015}}}],"position":{"start":{"line":70,"column":62,"offset":8008},"end":{"line":70,"column":70,"offset":8016}}},{"type":"text","value":" Gezel's script sandbox and receives only the capabilities declared by the script. It is for automations attached to projects and craftbooks, not for connecting a separate application.","position":{"start":{"line":70,"column":70,"offset":8016},"end":{"line":70,"column":254,"offset":8200}}}],"position":{"start":{"line":70,"column":1,"offset":7947},"end":{"line":70,"column":254,"offset":8200}}}]},{"id":"the-companion-gilde-package","startTime":304,"duration":33,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"The companion Gilde package","position":{"start":{"line":72,"column":4,"offset":8205},"end":{"line":72,"column":31,"offset":8232}}}],"position":{"start":{"line":72,"column":1,"offset":8202},"end":{"line":72,"column":31,"offset":8232}}},"title":"The companion Gilde package","contents":[{"type":"paragraph","children":[{"type":"inlineCode","value":"@bendyline/gilde","position":{"start":{"line":74,"column":1,"offset":8234},"end":{"line":74,"column":19,"offset":8252}}},{"type":"text","value":" contains the catalog data: model entries, toolsets, roles, craftbooks, connector types, and project types. It is released from the separate Gilde repository. ","position":{"start":{"line":74,"column":19,"offset":8252},"end":{"line":74,"column":178,"offset":8411}}},{"type":"inlineCode","value":"@bendyline/gezel-service","position":{"start":{"line":74,"column":178,"offset":8411},"end":{"line":74,"column":204,"offset":8437}}},{"type":"text","value":" pins an exact version, so installing the CLI or the service brings it in. ","position":{"start":{"line":74,"column":204,"offset":8437},"end":{"line":74,"column":279,"offset":8512}}},{"type":"inlineCode","value":"@bendyline/gezel-catalog","position":{"start":{"line":74,"column":279,"offset":8512},"end":{"line":74,"column":305,"offset":8538}}},{"type":"text","value":" declares it only as an optional peer: when you use the catalog package on its own, install ","position":{"start":{"line":74,"column":305,"offset":8538},"end":{"line":74,"column":397,"offset":8630}}},{"type":"inlineCode","value":"@bendyline/gilde","position":{"start":{"line":74,"column":397,"offset":8630},"end":{"line":74,"column":415,"offset":8648}}},{"type":"text","value":" beside it.","position":{"start":{"line":74,"column":415,"offset":8648},"end":{"line":74,"column":426,"offset":8659}}}],"position":{"start":{"line":74,"column":1,"offset":8234},"end":{"line":74,"column":426,"offset":8659}}},{"type":"paragraph","children":[{"type":"text","value":"The Electron app, React UI, VS Code extension, evaluation viewer, and deployment-only ML runtime are private workspaces rather than public npm packages. The desktop app and extension have their own distribution paths, the React UI is bundled into ","position":{"start":{"line":76,"column":1,"offset":8661},"end":{"line":76,"column":248,"offset":8908}}},{"type":"inlineCode","value":"@bendyline/gezel-service","position":{"start":{"line":76,"column":248,"offset":8908},"end":{"line":76,"column":274,"offset":8934}}},{"type":"text","value":", and the evaluation and ML workspaces support development and complete application builds.","position":{"start":{"line":76,"column":274,"offset":8934},"end":{"line":76,"column":365,"offset":9025}}}],"position":{"start":{"line":76,"column":1,"offset":8661},"end":{"line":76,"column":365,"offset":9025}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The desktop app is the simplest way to use gezel,","startTime":0,"endTime":3.4,"audioSegment":0},{"text":"but the same system is also available as a family of npm packages.","startTime":3.4,"endTime":6.8,"audioSegment":0},{"text":"You can install the gezel command, write a repeatable script, connect another app to local models,","startTime":6.8,"endTime":10.2,"audioSegment":0},{"text":"embed the daemon, or reuse the schemas and clients that Gezel itself uses.","startTime":10.2,"endTime":13.6,"audioSegment":0},{"text":"Every package published from the Gezel repository exposes a public,","startTime":13.6,"endTime":17,"audioSegment":0},{"text":"semver-versioned contract and, on Node.js, needs version 24 or newer.","startTime":17,"endTime":20.4,"audioSegment":0},{"text":"The one exception is @bendyline/gezel-inference's ./internal/* entry,","startTime":20.4,"endTime":23.8,"audioSegment":0},{"text":"which only @bendyline/gezel-service uses and which is not covered by semver.","startTime":23.8,"endTime":27.2,"audioSegment":0},{"text":"You normally install only the package at the top of your use case;","startTime":27.2,"endTime":30.599999999999998,"audioSegment":0},{"text":"npm brings in its required Gezel dependencies for you.","startTime":30.599999999999998,"endTime":34,"audioSegment":0},{"text":"You want to… Start with","startTime":34,"endTime":36.5,"audioSegment":0},{"text":"Use gezel from a terminal or server gezel,","startTime":36.5,"endTime":39,"audioSegment":0},{"text":"the short name for @bendyline/gezel-cli","startTime":39,"endTime":41.5,"audioSegment":0},{"text":"Write an automation that runs inside Gezel @bendyline/gezel-sdk","startTime":41.5,"endTime":44,"audioSegment":0},{"text":"Let a desktop or Node app use the user's Gezel models @bendyline/gezel-app-sdk","startTime":44,"endTime":46.5,"audioSegment":0},{"text":"Run on-device models inside your own app,","startTime":46.5,"endTime":49,"audioSegment":0},{"text":"with or without Gezel installed @bendyline/gezel-app-sdk together with @bendyline/gezel-inference","startTime":49,"endTime":51.5,"audioSegment":0},{"text":"Call the full daemon API from TypeScript @bendyline/gezel-client","startTime":51.5,"endTime":54,"audioSegment":0},{"text":"Run or embed a daemon yourself @bendyline/gezel-service together with @bendyline/gezel-client","startTime":54,"endTime":56.5,"audioSegment":0},{"text":"Give an MCP client Gezel's tools @bendyline/gezel-mcp","startTime":56.5,"endTime":59,"audioSegment":0},{"text":"Build, check, or search .gezk knowledge catalogs in code @bendyline/gezel-knowledge","startTime":59,"endTime":61.5,"audioSegment":0},{"text":"Share Gezel's schemas or parse its files @bendyline/gezel","startTime":61.5,"endTime":64,"audioSegment":0},{"text":"For example, to try the command line without installing it: npx gezel To install it:","startTime":64,"endTime":66.5,"audioSegment":0},{"text":"npm install -g gezel gezel","startTime":66.5,"endTime":69,"audioSegment":0},{"text":"Install one of gezel and @bendyline/gezel-cli globally,","startTime":69,"endTime":71.5,"audioSegment":0},{"text":"not both: they are the same program and both provide the gezel command.","startTime":71.5,"endTime":74,"audioSegment":0},{"text":"A library belongs in the application that uses it:","startTime":74,"endTime":76.5,"audioSegment":0},{"text":"npm install @bendyline/gezel-app-sdk","startTime":76.5,"endTime":79,"audioSegment":0},{"text":"Package What it does Who normally installs it directly","startTime":79,"endTime":81.73913043478261,"audioSegment":0},{"text":"@bendyline/gezk The .gezk knowledge-catalog format on its own: manifest and registry schemas, id grammars,","startTime":81.73913043478261,"endTime":84.47826086956522,"audioSegment":0},{"text":"knowledge:// references, vector quantization, the SQLite table definitions, canonical JSON, and Ed25519 manifest signatures.","startTime":84.47826086956522,"endTime":87.21739130434783,"audioSegment":0},{"text":"It has no dependency on the rest of Gezel.","startTime":87.21739130434783,"endTime":89.95652173913044,"audioSegment":0},{"text":"Tools that read or write .gezk catalogs without Gezel itself;","startTime":89.95652173913044,"endTime":92.69565217391305,"audioSegment":0},{"text":"the other Gezel packages build on it.","startTime":92.69565217391305,"endTime":95.43478260869566,"audioSegment":0},{"text":"@bendyline/gezel Core TypeScript types, Zod schemas, path helpers,","startTime":95.43478260869566,"endTime":98.17391304347827,"audioSegment":0},{"text":"the gezel.md parser, native-platform helpers, and reusable gate checks.","startTime":98.17391304347827,"endTime":100.91304347826087,"audioSegment":0},{"text":"It is the shared wire-contract source of truth.","startTime":100.91304347826087,"endTime":103.65217391304348,"audioSegment":0},{"text":"Library authors who need Gezel's data contracts or on-disk formats.","startTime":103.65217391304348,"endTime":106.3913043478261,"audioSegment":0},{"text":"@bendyline/gezel-client Typed HTTP and event-stream client for the complete gezeld product API: projects,","startTime":106.3913043478261,"endTime":109.1304347826087,"audioSegment":0},{"text":"gezels, chats, tasks, scripts, models, memories, usage, and more.","startTime":109.1304347826087,"endTime":111.86956521739131,"audioSegment":0},{"text":"Its /node entry also contains local daemon discovery helpers.","startTime":111.86956521739131,"endTime":114.6086956521739,"audioSegment":0},{"text":"Integrations that already have an authorized connection and need more than the OpenAI-compatible app surface.","startTime":114.6086956521739,"endTime":117.34782608695653,"audioSegment":0},{"text":"@bendyline/gezel-sdk The small, typed API available to TypeScript scripts inside Gezel's sandbox: defineScript,","startTime":117.34782608695653,"endTime":120.08695652173913,"audioSegment":0},{"text":"gezel.fs, gezel.task, gezel.llm, and the other capability-gated namespaces.","startTime":120.08695652173913,"endTime":122.82608695652175,"audioSegment":0},{"text":"Script and craftbook authors.","startTime":122.82608695652175,"endTime":125.56521739130434,"audioSegment":0},{"text":"See Writing scripts with gezel-sdk.","startTime":125.56521739130434,"endTime":128.30434782608697,"audioSegment":0},{"text":"@bendyline/gezel-script-runtime Portable,","startTime":128.30434782608697,"endTime":131.04347826086956,"audioSegment":0},{"text":"capability-mediated script execution: a host-neutral executor contract and a QuickJS (WebAssembly) implementation that runs Gezel scripts against the real SDK.","startTime":131.04347826086956,"endTime":133.7826086956522,"audioSegment":0},{"text":"The daemon still uses its Node sandbox by default.","startTime":133.7826086956522,"endTime":136.52173913043478,"audioSegment":0},{"text":"Embedders and other hosts that need to run Gezel scripts themselves.","startTime":136.52173913043478,"endTime":139.2608695652174,"audioSegment":0},{"text":"Script authors use @bendyline/gezel-sdk instead.","startTime":139.2608695652174,"endTime":142,"audioSegment":0},{"text":"@bendyline/gezel-app-sdk Local discovery, pinned TLS, user consent, scoped token storage,","startTime":142,"endTime":144.73913043478262,"audioSegment":0},{"text":"model setup, chat, embeddings, and model listing for third-party applications.","startTime":144.73913043478262,"endTime":147.47826086956522,"audioSegment":0},{"text":"Desktop and Node application developers.","startTime":147.47826086956522,"endTime":150.2173913043478,"audioSegment":0},{"text":"See Building connected apps with gezel-app-sdk.","startTime":150.2173913043478,"endTime":152.95652173913044,"audioSegment":0},{"text":"@bendyline/gezel-plugin-sdk The historical plugin helper surface.","startTime":152.95652173913044,"endTime":155.69565217391306,"audioSegment":0},{"text":"It remains supported for compatibility, but new extensions should use @bendyline/gezel-sdk.","startTime":155.69565217391306,"endTime":158.43478260869566,"audioSegment":0},{"text":"Maintainers of existing Gezel plugins.","startTime":158.43478260869566,"endTime":161.17391304347825,"audioSegment":0},{"text":"@bendyline/gezel-catalog Loads model definitions, toolsets, connector types,","startTime":161.17391304347825,"endTime":163.91304347826087,"audioSegment":0},{"text":"project types, gezel roles, and craftbooks from the separately released Gilde content.","startTime":163.91304347826087,"endTime":166.6521739130435,"audioSegment":0},{"text":"Catalog tooling, tests,","startTime":166.6521739130435,"endTime":169.3913043478261,"audioSegment":0},{"text":"and embedders that need to resolve catalog items outside the daemon.","startTime":169.3913043478261,"endTime":172.1304347826087,"audioSegment":0},{"text":"@bendyline/gezel-knowledge The .gezk toolchain: a deterministic catalog compiler,","startTime":172.1304347826087,"endTime":174.8695652173913,"audioSegment":0},{"text":"verified archive extraction, and a read-only catalog reader with full-text and vector search.","startTime":174.8695652173913,"endTime":177.60869565217394,"audioSegment":0},{"text":"The gezel knowledge commands are built on it.","startTime":177.60869565217394,"endTime":180.34782608695653,"audioSegment":0},{"text":"Anyone building or reading knowledge catalogs from code.","startTime":180.34782608695653,"endTime":183.08695652173913,"audioSegment":0},{"text":"@bendyline/gezel-connectors-spectral An isolated subprocess host for compatible Prismatic components.","startTime":183.08695652173913,"endTime":185.82608695652175,"audioSegment":0},{"text":"Keeping it out of the daemon process isolates its SDK and vendored connectors.","startTime":185.82608695652175,"endTime":188.56521739130437,"audioSegment":0},{"text":"Usually nobody directly; @bendyline/gezel-service resolves and spawns it.","startTime":188.56521739130437,"endTime":191.30434782608697,"audioSegment":0},{"text":"@bendyline/gezel-script-stdlib The trusted,","startTime":191.30434782608697,"endTime":194.04347826086956,"audioSegment":0},{"text":"read-only standard library of gate scripts that ships with Gezel.","startTime":194.04347826086956,"endTime":196.7826086956522,"audioSegment":0},{"text":"Its plain TypeScript sources run in place under the standard script scope.","startTime":196.7826086956522,"endTime":199.5217391304348,"audioSegment":0},{"text":"Usually the daemon; craftbook authors may inspect it for reusable standard checks.","startTime":199.5217391304348,"endTime":202.2608695652174,"audioSegment":0},{"text":"@bendyline/gezel-mcp The stdio Model Context Protocol server that exposes workspace,","startTime":202.2608695652174,"endTime":205,"audioSegment":0},{"text":"memory, artifact, document, task, team, execution, history, and media tools.","startTime":205,"endTime":207.73913043478262,"audioSegment":0},{"text":"It calls back into a running daemon.","startTime":207.73913043478262,"endTime":210.47826086956522,"audioSegment":0},{"text":"MCP hosts and custom agent harnesses that need Gezel's tool surface.","startTime":210.47826086956522,"endTime":213.21739130434784,"audioSegment":0},{"text":"@bendyline/gezel-inference The on-device inference runtime: native engines such as llama.cpp and MLX,","startTime":213.21739130434784,"endTime":215.95652173913044,"audioSegment":0},{"text":"model download and verification, the on-device embedder, knowledge search, and the OpenAI-compatible routes.","startTime":215.95652173913044,"endTime":218.69565217391306,"audioSegment":0},{"text":"It holds no product state: no gezels, projects, chats, or tools.","startTime":218.69565217391306,"endTime":221.43478260869566,"audioSegment":0},{"text":"Applications that host on-device models in their own process through @bendyline/gezel-app-sdk (host: { inferenceOnly: true }).","startTime":221.43478260869566,"endTime":224.17391304347828,"audioSegment":0},{"text":"Everyone else receives it through @bendyline/gezel-service.","startTime":224.17391304347828,"endTime":226.91304347826087,"audioSegment":0},{"text":"@bendyline/gezel-service gezeld, the local daemon.","startTime":226.91304347826087,"endTime":229.6521739130435,"audioSegment":0},{"text":"It owns state, provider routing, chat sessions, tools, tasks, engines,","startTime":229.6521739130435,"endTime":232.3913043478261,"audioSegment":0},{"text":"and the HTTP API, and includes the browser UI and Handboek.","startTime":232.3913043478261,"endTime":235.13043478260872,"audioSegment":0},{"text":"Headless operators and applications deliberately embedding or managing a Gezel daemon.","startTime":235.13043478260872,"endTime":237.8695652173913,"audioSegment":0},{"text":"@bendyline/gezel-cli The gezel terminal interface, one-shot runner,","startTime":237.8695652173913,"endTime":240.60869565217394,"audioSegment":0},{"text":"service manager, model and engine manager, media commands, and Handboek exporter.","startTime":240.60869565217394,"endTime":243.34782608695653,"audioSegment":0},{"text":"It does not expose a supported JavaScript API.","startTime":243.34782608695653,"endTime":246.08695652173915,"audioSegment":0},{"text":"People using the gezel command line.","startTime":246.08695652173915,"endTime":248.82608695652175,"audioSegment":0},{"text":"gezel The short name for @bendyline/gezel-cli, so npx gezel works.","startTime":248.82608695652175,"endTime":251.56521739130437,"audioSegment":0},{"text":"It installs that package and runs its gezel command.","startTime":251.56521739130437,"endTime":254.30434782608697,"audioSegment":0},{"text":"People trying or installing the command line.","startTime":254.30434782608697,"endTime":257.04347826086956,"audioSegment":0},{"text":"gezel-cli, gezeld, gezel-mcp Short names for @bendyline/gezel-cli,","startTime":257.04347826086956,"endTime":259.7826086956522,"audioSegment":0},{"text":"the gezeld command in @bendyline/gezel-service, and @bendyline/gezel-mcp.","startTime":259.7826086956522,"endTime":262.52173913043475,"audioSegment":0},{"text":"Each installs that package and runs its command.","startTime":262.52173913043475,"endTime":265.2608695652174,"audioSegment":0},{"text":"Anyone who leaves off the @bendyline/ scope.","startTime":265.2608695652174,"endTime":268,"audioSegment":0},{"text":"@bendyline/gezel-app-sdk and @bendyline/gezel-client solve different halves of a connected application.","startTime":268,"endTime":271.27272727272725,"audioSegment":0},{"text":"The app SDK discovers the logged-in user's daemon, pins its loopback certificate,","startTime":271.27272727272725,"endTime":274.54545454545456,"audioSegment":0},{"text":"asks for consent, and returns a scoped connection.","startTime":274.54545454545456,"endTime":277.8181818181818,"audioSegment":0},{"text":"Pass that connection to GezelClient when the application also needs the full product API.","startTime":277.8181818181818,"endTime":281.09090909090907,"audioSegment":0},{"text":"@bendyline/gezel-service is the runtime, while @bendyline/gezel-client is its supported control surface.","startTime":281.09090909090907,"endTime":284.3636363636364,"audioSegment":0},{"text":"Prefer the client over hand-written /api calls, and do not assume the service runs inside your process: the desktop app,","startTime":284.3636363636364,"endTime":287.6363636363636,"audioSegment":0},{"text":"CLI, and remote deployments all use the same HTTP boundary.","startTime":287.6363636363636,"endTime":290.90909090909093,"audioSegment":0},{"text":"@bendyline/gezel-sdk is different from both.","startTime":290.90909090909093,"endTime":294.1818181818182,"audioSegment":0},{"text":"Its code runs inside Gezel's script sandbox and receives only the capabilities declared by the script.","startTime":294.1818181818182,"endTime":297.45454545454544,"audioSegment":0},{"text":"It is for automations attached to projects and craftbooks,","startTime":297.45454545454544,"endTime":300.72727272727275,"audioSegment":0},{"text":"not for connecting a separate application.","startTime":300.72727272727275,"endTime":304,"audioSegment":0},{"text":"@bendyline/gilde contains the catalog data: model entries,","startTime":304,"endTime":307,"audioSegment":0},{"text":"toolsets, roles, craftbooks, connector types, and project types.","startTime":307,"endTime":310,"audioSegment":0},{"text":"It is released from the separate Gilde repository.","startTime":310,"endTime":313,"audioSegment":0},{"text":"@bendyline/gezel-service pins an exact version,","startTime":313,"endTime":316,"audioSegment":0},{"text":"so installing the CLI or the service brings it in.","startTime":316,"endTime":319,"audioSegment":0},{"text":"@bendyline/gezel-catalog declares it only as an optional peer: when you use the catalog package on its own,","startTime":319,"endTime":322,"audioSegment":0},{"text":"install @bendyline/gilde beside it.","startTime":322,"endTime":325,"audioSegment":0},{"text":"The Electron app, React UI, VS Code extension, evaluation viewer,","startTime":325,"endTime":328,"audioSegment":0},{"text":"and deployment-only ML runtime are private workspaces rather than public npm packages.","startTime":328,"endTime":331,"audioSegment":0},{"text":"The desktop app and extension have their own distribution paths, the React UI is bundled into @bendyline/gezel-service,","startTime":331,"endTime":334,"audioSegment":0},{"text":"and the evaluation and ML workspaces support development and complete application builds.","startTime":334,"endTime":337,"audioSegment":0}],"version":1},"startBlock":{"title":"Gezel on npm","subtitle":"The desktop app is the simplest way to use gezel, but the same system is also available as a family of npm packages. You can install the gezel command, write a repeatable script, connect another app to local models, embed the daemon, or reuse the schemas and clients that Gezel itself uses.","ambientMotion":"zoomIn"}}</script>
