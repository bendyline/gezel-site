. It owns state, provider routing, chat sessions, tools, tasks, engines, and the HTTP API, and includes the browser UI and Handboek.","Headless operators and applications deliberately embedding or managing a Gezel daemon."],["@bendyline/gezel-cli","The gezel terminal interface, one-shot runner, service manager, model and engine manager, media commands, and Handboek exporter. It does not expose a supported JavaScript API.","People using the gezel command line."]],"align":[null,null,null],"title":"Every published package"}},{"id":"packages-that-work-together","startTime":154,"duration":36,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Packages that work together","position":{"start":{"line":48,"column":4,"offset":4696},"end":{"line":48,"column":31,"offset":4723}}}],"position":{"start":{"line":48,"column":1,"offset":4693},"end":{"line":48,"column":31,"offset":4723}}},"title":"Packages that work together","contents":[{"type":"paragraph","children":[{"type":"inlineCode","value":"@bendyline/gezel-app-sdk","position":{"start":{"line":50,"column":1,"offset":4725},"end":{"line":50,"column":27,"offset":4751}}},{"type":"text","value":" and ","position":{"start":{"line":50,"column":27,"offset":4751},"end":{"line":50,"column":32,"offset":4756}}},{"type":"inlineCode","value":"@bendyline/gezel-client","position":{"start":{"line":50,"column":32,"offset":4756},"end":{"line":50,"column":57,"offset":4781}}},{"type":"text","value":" solve different halves of a connected application. The app SDK discovers the logged-in user's daemon, pins its loopback certificate, asks for consent, and returns a scoped connection. Pass that connection to ","position":{"start":{"line":50,"column":57,"offset":4781},"end":{"line":50,"column":266,"offset":4990}}},{"type":"inlineCode","value":"GezelClient","position":{"start":{"line":50,"column":266,"offset":4990},"end":{"line":50,"column":279,"offset":5003}}},{"type":"text","value" offset":5420}}}],"position":{"start":{"line":54,"column":62,"offset":5413},"end":{"line":54,"column":70,"offset":5421}}},{"type":"text","value":" Gezel's script sandbox and receives only the capabilities declared by the script. It is for automations attached to projects and craftbooks, not for connecting a separate application.","position":{"start":{"line":54,"column":70,"offset":5421},"end":{"line":54,"column":254,"offset":5605}}}],"position":{"start":{"line":54,"column":1,"offset":5352},"end":{"line":54,"column":254,"offset":5605}}}]},{"id":"the-companion-gilde-package","startTime":190,"duration":31,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"The companion Gilde package","position":{"start":{"line":56,"column":4,"offset":5610},"end":{"line":56,"column":31,"offset":5637}}}],"position":{"start":{"line":56,"column":1,"offset":5607},"end":{"line":56,"column":31,"offset":5637}}},"title":"The companion Gilde package","contents":[{"type":"paragraph","children":[{"type":"inlineCode","value":"@bendyline/gilde","position":{"start":{"line":58,"column":1,"offset":5639},"end":{"line":58,"column":19,"offset":5657}}},{"type":"text","value":" contains the catalog data: model entries, toolsets, roles, craftbooks, connector types, and project types. It is released from the separate Gilde repository and consumed at an exact version by ","position":{"start":{"line":58,"column":19,"offset":5657},"end":{"line":58,"column":213,"offset":5851}}},{"type":"inlineCode","value":"@bendyline/gezel-catalog","position":{"start":{"line":58,"column":213,"offset":5851},"end":{"line":58,"column":239,"offset":5877}}},{"type":"text","value":". Install it directly only when you are working with the catalog content itself; ordinary Gezel consumers receive it through the catalog package.","position":{"start":{"line":58,"column":239,"offset":5877},"end":{"line":58,"column":384,"offset":6022}}}],"position":{"start":{"line":58,"column":1,"offset":5639},"end":{"line":58,"column":384,"offset":6022}}},{"type":"paragraph","children":[{"type":"text","value":"The Electron app, React UI, VS Code extension, evaluation viewer, and deployment-only ML runtime are private workspaces rather than public npm packages. The desktop app and extension have their own distribution paths, the React UI is bundled into ","position":{"start":{"line":60,"column":1,"offset":6024},"end":{"line":60,"column":248,"offset":6271}}},{"type":"inlineCode","value":"@bendyline/gezel-service","position":{"start":{"line":60,"column":248,"offset":6271},"end":{"line":60,"column":274,"offset":6297}}},{"type":"text","value":", and the evaluation and ML workspaces support development and complete application builds.","position":{"start":{"line":60,"column":274,"offset":6297},"end":{"line":60,"column":365,"offset":6388}}}],"position":{"start":{"line":60,"column":1,"offset":6024},"end":{"line":60,"column":365,"offset":6388}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The desktop app is the simplest way to use gezel,","startTime":0,"endTime":3.5,"audioSegment":0},{"text":"but the same system is also available as a family of npm packages.","startTime":3.5,"endTime":7,"audioSegment":0},{"text":"You can install the gezel command, write a repeatable script, connect another app to local models,","startTime":7,"endTime":10.5,"audioSegment":0},{"text":"embed the daemon, or reuse the schemas and clients that Gezel itself uses.","startTime":10.5,"endTime":14,"audioSegment":0},{"text":"All eleven packages published from the Gezel repository require Node.js 24 or newer and expose public,","startTime":14,"endTime":17.5,"audioSegment":0},{"text":"semver-versioned contracts.","startTime":17.5,"endTime":21,"audioSegment":0},{"text":"You normally install only the package at the top of your use case;","startTime":21,"endTime":24.5,"audioSegment":0},{"text":"npm brings in its required Gezel dependencies for you.","startTime":24.5,"endTime":28,"audioSegment":0},{"text":"You want to…Start withUse gezel from a terminal or server@bendyline/gezel-cliWrite an automation that runs inside Gezel@bendyline/gezel-sdkLet a desktop or Node app use the user's Gezel models@bendyline/gezel-app-sdkCall the full daemon API from TypeScript@bendyline/gezel-clientRun or embed a daemon yourself@bendyline/gezel-service together with @bendyline/gezel-clientGive an MCP client Gezel's tools@bendyline/gezel-mcpShare Gezel's schemas or parse its files@bendyline/gezel","startTime":28,"endTime":32.4,"audioSegment":0},{"text":"For example, the command-line install is:","startTime":32.4,"endTime":36.8,"audioSegment":0},{"text":"npm install @bendyline/gezel-cli npx gezel","startTime":36.8,"endTime":41.2,"audioSegment":0},{"text":"A library belongs in the application that uses it:","startTime":41.2,"endTime":45.6,"audioSegment":0},{"text":"npm install @bendyline/gezel-app-sdk","startTime":45.6,"endTime":50,"audioSegment":0},{"text":"PackageWhat it doesWho normally installs it directly@bendyline/gezelCore TypeScript types,","startTime":50,"endTime":55.2,"audioSegment":0},{"text":"Zod schemas, path helpers, the gezel.md parser, native-platform helpers, and reusable gate checks.","startTime":55.2,"endTime":60.4,"audioSegment":0},{"text":"It is the shared wire-contract source of truth.Library authors who need Gezel's data contracts or on-disk formats.@bendyline/gezel-clientTyped HTTP and event-stream client for the complete gezeld product API: projects,","startTime":60.4,"endTime":65.6,"audioSegment":0},{"text":"gezels, chats, tasks, scripts, models, memories, usage, and more.","startTime":65.6,"endTime":70.8,"audioSegment":0},{"text":"Its /node entry also contains local daemon discovery helpers.Integrations that already have an authorized connection and need more than the OpenAI-compatible app surface.@bendyline/gezel-sdkThe small,","startTime":70.8,"endTime":76,"audioSegment":0},{"text":"typed API available to TypeScript scripts inside Gezel's sandbox: defineScript, gezel.fs, gezel.task, gezel.llm, and the other capability-gated namespaces.Script and craftbook authors.","startTime":76,"endTime":81.2,"audioSegment":0},{"text":"See Writing scripts with gezel-sdk.@bendyline/gezel-app-sdkLocal discovery, pinned TLS, user consent, scoped token storage,","startTime":81.2,"endTime":86.4,"audioSegment":0},{"text":"model setup, chat, embeddings, and model listing for third-party applications.Desktop and Node application developers.","startTime":86.4,"endTime":91.6,"audioSegment":0},{"text":"See Building connected apps with gezel-app-sdk.@bendyline/gezel-plugin-sdkThe historical plugin helper surface.","startTime":91.6,"endTime":96.80000000000001,"audioSegment":0},{"text":"It remains supported for compatibility, but new extensions should use @bendyline/gezel-sdk.Maintainers of existing Gezel plugins.@bendyline/gezel-catalogLoads model definitions, toolsets, connector types, project types, gezel roles,","startTime":96.80000000000001,"endTime":102,"audioSegment":0},{"text":"and craftbooks from the separately released Gilde content.Catalog tooling, tests, and embedders that need to resolve catalog items outside the daemon.@bendyline/gezel-connectors-spectralAn isolated subprocess host for compatible Prismatic components.","startTime":102,"endTime":107.2,"audioSegment":0},{"text":"Keeping it out of the daemon process isolates its SDK and vendored connectors.Usually nobody directly;","startTime":107.2,"endTime":112.4,"audioSegment":0},{"text":"@bendyline/gezel-service resolves and spawns it.@bendyline/gezel-script-stdlibThe trusted, read-only standard library of gate scripts that ships with Gezel.","startTime":112.4,"endTime":117.60000000000001,"audioSegment":0},{"text":"Its plain TypeScript sources run in place under the standard script scope.Usually the daemon;","startTime":117.60000000000001,"endTime":122.8,"audioSegment":0},{"text":"craftbook authors may inspect it for reusable standard checks.@bendyline/gezel-mcpThe stdio Model Context Protocol server that exposes workspace, memory, artifact, document, task, team, execution, history, and media tools.","startTime":122.8,"endTime":128,"audioSegment":0},{"text":"It calls back into a running daemon.MCP hosts and custom agent harnesses that need Gezel's tool surface.@bendyline/gezel-servicegezeld,","startTime":128,"endTime":133.2,"audioSegment":0},{"text":"the local daemon.","startTime":133.2,"endTime":138.4,"audioSegment":0},{"text":"It owns state, provider routing, chat sessions, tools, tasks, engines, and the HTTP API, and includes the browser UI and Handboek.Headless operators and applications deliberately embedding or managing a Gezel daemon.@bendyline/gezel-cliThe gezel terminal interface,","startTime":138.4,"endTime":143.60000000000002,"audioSegment":0},{"text":"one-shot runner, service manager, model and engine manager, media commands, and Handboek exporter.","startTime":143.60000000000002,"endTime":148.8,"audioSegment":0},{"text":"It does not expose a supported JavaScript API.People using the gezel command line.","startTime":148.8,"endTime":154,"audioSegment":0},{"text":"@bendyline/gezel-app-sdk and @bendyline/gezel-client solve different halves of a connected application.","startTime":154,"endTime":157.27272727272728,"audioSegment":0},{"text":"The app SDK discovers the logged-in user's daemon, pins its loopback certificate,","startTime":157.27272727272728,"endTime":160.54545454545453,"audioSegment":0},{"text":"asks for consent, and returns a scoped connection.","startTime":160.54545454545453,"endTime":163.8181818181818,"audioSegment":0},{"text":"Pass that connection to GezelClient when the application also needs the full product API.","startTime":163.8181818181818,"endTime":167.0909090909091,"audioSegment":0},{"text":"@bendyline/gezel-service is the runtime, while @bendyline/gezel-client is its supported control surface.","startTime":167.0909090909091,"endTime":170.36363636363637,"audioSegment":0},{"text":"Prefer the client over hand-written /api calls, and do not assume the service runs inside your process: the desktop app,","startTime":170.36363636363637,"endTime":173.63636363636363,"audioSegment":0},{"text":"CLI, and remote deployments all use the same HTTP boundary.","startTime":173.63636363636363,"endTime":176.9090909090909,"audioSegment":0},{"text":"@bendyline/gezel-sdk is different from both.","startTime":176.9090909090909,"endTime":180.1818181818182,"audioSegment":0},{"text":"Its code runs inside Gezel's script sandbox and receives only the capabilities declared by the script.","startTime":180.1818181818182,"endTime":183.45454545454547,"audioSegment":0},{"text":"It is for automations attached to projects and craftbooks,","startTime":183.45454545454547,"endTime":186.72727272727272,"audioSegment":0},{"text":"not for connecting a separate application.","startTime":186.72727272727272,"endTime":190,"audioSegment":0},{"text":"@bendyline/gilde contains the catalog data: model entries,","startTime":190,"endTime":193.44444444444446,"audioSegment":0},{"text":"toolsets, roles, craftbooks, connector types, and project types.","startTime":193.44444444444446,"endTime":196.88888888888889,"audioSegment":0},{"text":"It is released from the separate Gilde repository and consumed at an exact version by @bendyline/gezel-catalog.","startTime":196.88888888888889,"endTime":200.33333333333334,"audioSegment":0},{"text":"Install it directly only when you are working with the catalog content itself;","startTime":200.33333333333334,"endTime":203.77777777777777,"audioSegment":0},{"text":"ordinary Gezel consumers receive it through the catalog package.","startTime":203.77777777777777,"endTime":207.22222222222223,"audioSegment":0},{"text":"The Electron app, React UI, VS Code extension, evaluation viewer,","startTime":207.22222222222223,"endTime":210.66666666666666,"audioSegment":0},{"text":"and deployment-only ML runtime are private workspaces rather than public npm packages.","startTime":210.66666666666666,"endTime":214.11111111111111,"audioSegment":0},{"text":"The desktop app and extension have their own distribution paths, the React UI is bundled into @bendyline/gezel-service,","startTime":214.11111111111111,"endTime":217.55555555555554,"audioSegment":0},{"text":"and the evaluation and ML workspaces support development and complete application builds.","startTime":217.55555555555554,"endTime":221,"audioSegment":0}],"version":1},"startBlock":{"title":"Gezel on npm","subtitle":"The desktop app is the simplest way to use gezel, but the same system is also available as a family of npm packages. You can install the gezel command, write a repeatable script, connect another app to local models, embed the daemon, or reuse the schemas and clients that Gezel itself uses.","ambientMotion":"zoomIn"}}</script>
