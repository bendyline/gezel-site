Catalog SQLite work runs on a dedicated knowledge worker thread, keeping synchronous shard scans off the daemon's main event loop. Shards are scanned sequentially within a request. Each catalog handle caches sign-bit arrays with a 256 MiB eviction budget; this is a cache budget per handle, not a total process memory guarantee.","position":{"start":{"line":168,"column":1,"offset":18212},"end":{"line":168,"column":329,"offset":18540}}}],"position":{"start":{"line":168,"column":1,"offset":18212},"end":{"line":168,"column":329,"offset":18540}}},{"type":"paragraph","children":[{"type":"text","value":"Routing and quantization trade exhaustive recall for bounded work. A relevant passage can be missed if its shard is not selected or its binary approximation falls outside the shortlist. Exact titles and keywords provide another retrieval path, and catalog producers can measure routed results against a scan of every shard. Large reference collections benefit from subject-focused catalogs rather than relying on a small shard budget to cover an arbitrarily broad corpus.","position":{"start":{"line":170,"column":1,"offset":18542},"end":{"line":170,"column":472,"offset":19013}}}],"position":{"start":{"line":170,"column":1,"offset":18542},"end":{"line":170,"column":472,"offset":19013}}}]},{"id":"hybrid-ranking-and-selecting-evidence","startTime":767,"duration":91,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Hybrid ranking and selecting evidence","position":{"start":{"line":172,"column":4,"offset":19018},"end":{"line":172,"column":41,"offset":19055}}}],"position":{"start":{"line":172,"column":1,"offset":19015},"end":{"line":172,"column":41,"offset":19055}}},"title":"Hybrid ranking and selecting evidence","contents":[{"type":"paragraph","children":[{"type":"text","value":"An explicit catalog search combines three ranked lists: vector passages, document title/summary/alias matches, and chunk-body keyword m ound inside a document do not gain authority to change the task or invoke tools. Installing a catalog changes the available reference material; it grants no workspace write permission.","position":{"start":{"line":200,"column":54,"offset":22517},"end":{"line":200,"column":299,"offset":22762}}}],"position":{"start":{"line":200,"column":1,"offset":22464},"end":{"line":200,"column":299,"offset":22762}}}]},{"id":"installation-integrity-and-updates","startTime":923,"duration":105,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Installation, integrity, and updates","position":{"start":{"line":202,"column":4,"offset":22767},"end":{"line":202,"column":40,"offset":22803}}}],"position":{"start":{"line":202,"column":1,"offset":22764},"end":{"line":202,"column":40,"offset":22803}}},"title":"Installation, integrity, and updates","contents":[{"type":"paragraph","children":[{"type":"text","value":"An installation resolves a catalog id, local archive, or URL; checks space and archive constraints; downloads or reads the bytes; verifies the archive and manifest; extracts into staging; validates the databases; then publishes an immutable version and updates the user registry. Downloads can retain partial data for a later resume. Install progress is streamed, and disconnecting a progress subscriber does not itself cancel the job.","position":{"start":{"line":204,"column":1,"offset":22805},"end":{"line":204,"column":436,"offset":23240}}}],"position":{"start":{"line":204,"column":1,"offset":22805},"end":{"line":204,"column":436,"offset":23240}}},{"type":"paragraph","children":[{"type":"text","value":"Archive checks reject unsafe paths and entries, reconcile declared files with actual files, and check sizes and SHA-256 digests. Deep validation additionally checks SQLite integrity, chunk/vector alignment, self-neighbor behavior, and declared keyword smoke queries. A mount failure quarantines the catalog instead of "line":236,"column":21,"offset":27319}}}],"position":{"start":{"line":236,"column":3,"offset":27301},"end":{"line":236,"column":82,"offset":27380}}},{"type":"text","value":": format schemas, identifiers, citation grammar, quantization, SQLite DDL, canonical JSON, and signing. It has no product dependency.","position":{"start":{"line":236,"column":82,"offset":27380},"end":{"line":236,"column":215,"offset":27513}}}],"position":{"start":{"line":236,"column":3,"offset":27301},"end":{"line":236,"column":215,"offset":27513}}}],"position":{"start":{"line":236,"column":1,"offset":27299},"end":{"line":236,"column":215,"offset":27513}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"link","url":"https://github.com/bendyline/gezel/tree/main/packages/knowledge","children":[{"type":"inlineCode","value":"@bendyline/gezel-knowledge","position":{"start":{"line":237,"column":4,"offset":27517},"end":{"line":237,"column":32,"offset":27545}}}],"position":{"start":{"line":237,"column":3,"offset":27516},"end":{"line":237,"column":98,"offset":27611}}},{"type":"text","value":": compiler, Markdown adapter, archive verification, profile embedders, catalog reader, and validator.","position":{"start":{"line":237,"column":98,"offset":27611},"end":{"line":237,"column":199,"offset":27712}}}],"position":{"start":{"line":237,"column":3,"offset":27516},"end":{"line":237,"column":199,"offset":27712}}}],"position":{"start":{"line":237,"column":1,"offset":27514},"end":{"line":237,"column":199,"offset":27712}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"link","url":"https://github.com/bendyline/gezel/tree/main/packages/service/src/knowledge","children":[{"type":"text","value":"The service knowledge manager","position":{"start":{"line":238,"column":4,"offset":27716},"end":{"line":238,"column":33,"offset":27745}}}],"position":{"start":{"line":238,"column":3,"offset":27715},"end":{"line":238,"column":111,"offset":27823}}},{"type":"text","value":": install jobs, user selection, machine asset coordination, worker ownership, and search integration. ","position":{"start":{"line":238,"column":111,"offset":27823},"end":{"line":238,"column":213,"offset":27925}}},{"type":"link","url":"https://github.com/bendyline/gezel/tree/main/packages/service/src/index-store","children":[{"type":"text","value":"Mutable index storage","position":{"start":{"line":238,"column":214,"offset":27926},"end":{"line":238,"column":235,"offset":27947}}}],"position":{"start":{"line":238,"column":213,"offset":27925},"end":{"line":238,"column":315,"offset":28027}}},{"type":"text","value":" and ","position":{"start":{"line":238,"column":315,"offset":28027},"end":{"line":238,"column":320,"offset":28032}}},{"type":"link","url":"https://github.com/bendyline/gezel/tree/main/packages/service/src/memory","children":[{"type":"text","value":"memory","position":{"start":{"line":238,"column":321,"offset":28033},"end":{"line":238,"column":327,"offset":28039}}}],"position":{"start":{"line":238,"column":320,"offset":28032},"end":{"line":238,"column":402,"offset":28114}}},{"type":"text","value":" implement the local, changing knowledge sources.","position":{"start":{"line":238,"column":402,"offset":28114},"end":{"line":238,"column":451,"offset":28163}}}],"position":{"start":{"line":238,"column":3,"offset":27715},"end":{"line":238,"column":451,"offset":28163}}}],"position":{"start":{"line":238,"column":1,"offset":27713},"end":{"line":238,"column":451,"offset":28163}}}],"position":{"start":{"line":236,"column":1,"offset":27299},"end":{"line":238,"column":451,"offset":28163}}},{"type":"paragraph","children":[{"type":"text","value":"For practical manipulation, continue with ","position":{"start":{"line":240,"column":1,"offset":28165},"end":{"line":240,"column":43,"offset":28207}}},{"type":"link","url":"../knowledge-command-line/","children":[{"type":"text","value":"Working with knowledge catalogs","position":{"start":{"line":240,"column":44,"offset":28208},"end":{"line":240,"column":75,"offset":28239}}}],"position":{"start":{"line":240,"column":43,"offset":28207},"end":{"line":240,"column":104,"offset":28268}}},{"type":"text","value":", or use ","position":{"start":{"line":240,"column":104,"offset":28268},"end":{"line":240,"column":113,"offset":28277}}},{"type":"link","url":"../writing-scripts-with-gezel-sdk/","children":[{"type":"text","value":"Writing scripts with gezel-sdk","position":{"start":{"line":240,"column":114,"offset":28278},"end":{"line":240,"column":144,"offset":28308}}}],"position":{"start":{"line":240,"column":113,"offset":28277},"end":{"line":240,"column":181,"offset":28345}}},{"type":"text","value":" when the work belongs inside a project.","position":{"start":{"line":240,"column":181,"offset":28345},"end":{"line":240,"column":221,"offset":28385}}}],"position":{"start":{"line":240,"column":1,"offset":28165},"end":{"line":240,"column":221,"offset":28385}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Gezel brings relevant information into a conversation from your files,","startTime":0,"endTime":2.7333333333333334,"audioSegment":0},{"text":"your crew's memories, and installed reference catalogs.","startTime":2.7333333333333334,"endTime":5.466666666666667,"audioSegment":0},{"text":"It stores that information locally, builds indexes to find it,","startTime":5.466666666666667,"endTime":8.2,"audioSegment":0},{"text":"and gives the language model selected excerpts with references to their sources.","startTime":8.2,"endTime":10.933333333333334,"audioSegment":0},{"text":"This is retrieval-augmented generation,","startTime":10.933333333333334,"endTime":13.666666666666668,"audioSegment":0},{"text":"usually shortened to RAG: search supplies evidence that the model can use when answering.","startTime":13.666666666666668,"endTime":16.4,"audioSegment":0},{"text":"An embedding is a numerical representation used to find related passages.","startTime":16.4,"endTime":19.133333333333333,"audioSegment":0},{"text":"It does not replace the original text,","startTime":19.133333333333333,"endTime":21.866666666666667,"audioSegment":0},{"text":"and installing a catalog does not train or change your chat model.","startTime":21.866666666666667,"endTime":24.6,"audioSegment":0},{"text":"You can inspect the source, search it with another model,","startTime":24.6,"endTime":27.333333333333336,"audioSegment":0},{"text":"or open a cited passage independently of the conversation.","startTime":27.333333333333336,"endTime":30.066666666666666,"audioSegment":0},{"text":"This article explains the implementation.","startTime":30.066666666666666,"endTime":32.8,"audioSegment":0},{"text":"For a working build–validate–install example and the full command reference,","startTime":32.8,"endTime":35.53333333333333,"audioSegment":0},{"text":"see Working with knowledge catalogs.","startTime":35.53333333333333,"endTime":38.266666666666666,"audioSegment":0},{"text":"For the everyday concepts, see Memory, documents, and the shared library.","startTime":38.266666666666666,"endTime":41,"audioSegment":0},{"text":"Several sources meet in search, but they have different owners and lifecycles:","startTime":41,"endTime":44.875,"audioSegment":0},{"text":"Source Authoritative content Search storage Scope","startTime":44.875,"endTime":48.75,"audioSegment":0},{"text":"Gezel memory Daily Markdown notes and lessons A rebuildable SQLite mem.db with text vectors The named gezel","startTime":48.75,"endTime":52.625,"audioSegment":0},{"text":"Project memory Daily Markdown notes and lessons A separate rebuildable mem.db The project","startTime":52.625,"endTime":56.5,"audioSegment":0},{"text":"Workspace and artifacts Your original files and produced artifacts Content indexes with structural data,","startTime":56.5,"endTime":60.375,"audioSegment":0},{"text":"full-text search, and, where supported, embeddings The active project and explicitly admitted sources","startTime":60.375,"endTime":64.25,"audioSegment":0},{"text":"Shared document library Your library files The shared library project's content index Available across projects","startTime":64.25,"endTime":68.125,"audioSegment":0},{"text":"Reference catalogs Documents, metadata,","startTime":68.125,"endTime":72,"audioSegment":0},{"text":"and indexes shipped in a .gezk file Immutable SQLite databases extracted from the catalog Installed and enabled catalogs, intersected with project selection","startTime":72,"endTime":75.875,"audioSegment":0},{"text":"Chat and history Session JSON and the append-only history log A rebuildable global full-text mirror The permitted session/history search surface","startTime":75.875,"endTime":79.75,"audioSegment":0},{"text":"The shared library is a project internally,","startTime":79.75,"endTime":83.625,"audioSegment":0},{"text":"so it uses the same document conversion and indexing machinery as a workspace.","startTime":83.625,"endTime":87.5,"audioSegment":0},{"text":"Its live project id is recorded in configuration;","startTime":87.5,"endTime":91.375,"audioSegment":0},{"text":"code resolves it rather than assuming the id is always shared.","startTime":91.375,"endTime":95.25,"audioSegment":0},{"text":"Project About and Mission Objectives are another path into the model's context: they are included directly in the standing instructions for a session.","startTime":95.25,"endTime":99.125,"audioSegment":0},{"text":"Searching a library or catalog is selective and happens separately.","startTime":99.125,"endTime":103,"audioSegment":0},{"text":"Gezel's vector database implementation is embedded in the service.","startTime":103,"endTime":105.74193548387096,"audioSegment":0},{"text":"Mutable memory and content indexes use Node's built-in node:sqlite,","startTime":105.74193548387096,"endTime":108.48387096774194,"audioSegment":0},{"text":"SQLite FTS5 for keyword search, and the sqlite-vec extension for text vector search.","startTime":108.48387096774194,"endTime":111.2258064516129,"audioSegment":0},{"text":"They do not require a separate database server.","startTime":111.2258064516129,"endTime":113.96774193548387,"audioSegment":0},{"text":"The main storage locations are:","startTime":113.96774193548387,"endTime":116.70967741935483,"audioSegment":0},{"text":"Location Contents","startTime":116.70967741935483,"endTime":119.45161290322581,"audioSegment":0},{"text":"~/.gezel/gezels/<id>/memories/index/mem.db Derived vector index for a gezel's memory","startTime":119.45161290322581,"endTime":122.19354838709677,"audioSegment":0},{"text":"~/.gezel/projects/<id>/memories/index/mem.db Account-local derived vector index for project memory","startTime":122.19354838709677,"endTime":124.93548387096774,"audioSegment":0},{"text":"<workspace>/.gezel/index/index.db Content index for an ordinary writable workspace","startTime":124.93548387096774,"endTime":127.6774193548387,"audioSegment":0},{"text":"~/.gezel/projects/<id>/index/index.db Content index when the workspace cannot host it,","startTime":127.6774193548387,"endTime":130.41935483870967,"audioSegment":0},{"text":"and for the shared library or machine-shared projects","startTime":130.41935483870967,"endTime":133.16129032258064,"audioSegment":0},{"text":"~/.gezel/index/global.db Full-text mirror of sessions and history;","startTime":133.16129032258064,"endTime":135.90322580645162,"audioSegment":0},{"text":"this database does not store embeddings","startTime":135.90322580645162,"endTime":138.64516129032256,"audioSegment":0},{"text":"~/.gezel/knowledge/registry.json Your installed catalog references and enabled state","startTime":138.64516129032256,"endTime":141.38709677419354,"audioSegment":0},{"text":"~/.gezel/knowledge/catalogs/<publisher>/<catalog>/<version>/<digest16>/ A private, immutable extracted catalog version","startTime":141.38709677419354,"endTime":144.1290322580645,"audioSegment":0},{"text":"Here ~/.gezel means the active Gezel home; GEZEL_HOME can change it.","startTime":144.1290322580645,"endTime":146.8709677419355,"audioSegment":0},{"text":"External folder settings can move canonical files,","startTime":146.8709677419355,"endTime":149.61290322580646,"audioSegment":0},{"text":"while account-local memory indexes remain in the private home.","startTime":149.61290322580646,"endTime":152.3548387096774,"audioSegment":0},{"text":"The digest segment in a catalog path is the first 16 hexadecimal characters of its archive SHA-256,","startTime":152.3548387096774,"endTime":155.09677419354838,"audioSegment":0},{"text":"so different bytes with the same version label occupy different directories.","startTime":155.09677419354838,"endTime":157.83870967741936,"audioSegment":0},{"text":"The mutable databases are derived caches.","startTime":157.83870967741936,"endTime":160.5806451612903,"audioSegment":0},{"text":"Daily memory files, workspace documents, sessions,","startTime":160.5806451612903,"endTime":163.32258064516128,"audioSegment":0},{"text":"and history remain the sources from which their indexes can be rebuilt.","startTime":163.32258064516128,"endTime":166.06451612903226,"audioSegment":0},{"text":"Catalog databases have a different role: they are part of a publisher's versioned artifact and are verified and opened without modification.","startTime":166.06451612903226,"endTime":168.80645161290323,"audioSegment":0},{"text":"Reinstalling or rebuilding a catalog replaces its version;","startTime":168.80645161290323,"endTime":171.5483870967742,"audioSegment":0},{"text":"the reader does not migrate it in place.","startTime":171.5483870967742,"endTime":174.29032258064515,"audioSegment":0},{"text":"The shared library's database stays outside your documents folder,","startTime":174.29032258064515,"endTime":177.03225806451613,"audioSegment":0},{"text":"even when that folder is writable.","startTime":177.03225806451613,"endTime":179.77419354838707,"audioSegment":0},{"text":"Derived document conversions live under the project's artifacts/shadow/.","startTime":179.77419354838707,"endTime":182.51612903225805,"audioSegment":0},{"text":"This keeps mutable SQLite and generated search machinery out of a library that may be synchronized by a cloud storage client.","startTime":182.51612903225805,"endTime":185.25806451612902,"audioSegment":0},{"text":"See Where files live for the wider layout.","startTime":185.25806451612902,"endTime":188,"audioSegment":0},{"text":"The content index has a deterministic structural pass and a separate enrichment pass.","startTime":188,"endTime":191.35,"audioSegment":0},{"text":"The structural pass discovers files, classifies them, checks modification time and size,","startTime":191.35,"endTime":194.7,"audioSegment":0},{"text":"then uses content hashes to avoid repeating work on unchanged content.","startTime":194.7,"endTime":198.05,"audioSegment":0},{"text":"It extracts supported code symbols and dependencies, Markdown headings,","startTime":198.05,"endTime":201.4,"audioSegment":0},{"text":"document text, and other searchable metadata without needing a language model.","startTime":201.4,"endTime":204.75,"audioSegment":0},{"text":"Office documents and other convertible formats get a Markdown representation for search while the original file remains the visible document.","startTime":204.75,"endTime":208.1,"audioSegment":0},{"text":"Image descriptions and audio transcripts can provide additional text when the corresponding enrichment features are available.","startTime":208.1,"endTime":211.45,"audioSegment":0},{"text":"The Boekwachter, the crew member responsible for keeping material organized,","startTime":211.45,"endTime":214.8,"audioSegment":0},{"text":"uses this indexing and enrichment stack.","startTime":214.8,"endTime":218.15,"audioSegment":0},{"text":"Enrichment can add summaries and text embeddings.","startTime":218.15,"endTime":221.5,"audioSegment":0},{"text":"Those operations have different costs: an embedding runs a local feature-extraction model,","startTime":221.5,"endTime":224.85,"audioSegment":0},{"text":"while an AI-written summary or description uses the configured inference path.","startTime":224.85,"endTime":228.2,"audioSegment":0},{"text":"A file can therefore be found by name or keyword before its semantic enrichment has completed.","startTime":228.2,"endTime":231.55,"audioSegment":0},{"text":"Disabling or losing the embedding runtime does not erase the original content.","startTime":231.55,"endTime":234.9,"audioSegment":0},{"text":"Long documents are split into passages, or chunks,","startTime":234.9,"endTime":238.25,"audioSegment":0},{"text":"so that a search returns the relevant section instead of one vector for an entire book.","startTime":238.25,"endTime":241.6,"audioSegment":0},{"text":"Chunks retain source locations and heading context.","startTime":241.6,"endTime":244.95,"audioSegment":0},{"text":"The workspace Markdown chunker uses character bounds;","startTime":244.95,"endTime":248.3,"audioSegment":0},{"text":"portable catalogs use their declared chunking profile and tokenizer.","startTime":248.3,"endTime":251.65,"audioSegment":0},{"text":"These are separate contracts and should not be treated as interchangeable.","startTime":251.65,"endTime":255,"audioSegment":0},{"text":"An embedding model maps text to a vector.","startTime":255,"endTime":257.95,"audioSegment":0},{"text":"Related meanings should produce vectors with similar directions,","startTime":257.95,"endTime":260.9,"audioSegment":0},{"text":"allowing a question such as “how do I keep a catalog private?” to retrieve a passage about per-user installation even when it uses different words.","startTime":260.9,"endTime":263.85,"audioSegment":0},{"text":"The default daemon text embedder is Xenova/bge-small-en-v1.5, producing 384-dimensional,","startTime":263.85,"endTime":266.8,"audioSegment":0},{"text":"mean-pooled, L2-normalized vectors through Transformers.js and ONNX.","startTime":266.8,"endTime":269.75,"audioSegment":0},{"text":"The model is loaded lazily,","startTime":269.75,"endTime":272.7,"audioSegment":0},{"text":"and inference uses bounded sub-batches to limit temporary memory use.","startTime":272.7,"endTime":275.65,"audioSegment":0},{"text":"Once its model files are cached,","startTime":275.65,"endTime":278.6,"audioSegment":0},{"text":"text embedding runs locally without sending the text to an embedding service.","startTime":278.6,"endTime":281.55,"audioSegment":0},{"text":"BGE has a query-side instruction: Represent this sentence for searching relevant passages: .","startTime":281.55,"endTime":284.5,"audioSegment":0},{"text":"Gezel prepends it to a search query,","startTime":284.5,"endTime":287.45,"audioSegment":0},{"text":"while indexed passages receive no prefix.","startTime":287.45,"endTime":290.4,"audioSegment":0},{"text":"The multilingual E5 family instead uses query:  and passage:  on the two sides.","startTime":290.4,"endTime":293.35,"audioSegment":0},{"text":"Pooling, normalization, tokenization, and these instructions all affect the vector space.","startTime":293.35,"endTime":296.3,"audioSegment":0},{"text":"Two vectors having the same length does not make them comparable.","startTime":296.3,"endTime":299.25,"audioSegment":0},{"text":"If you change the daemon embedder,","startTime":299.25,"endTime":302.2,"audioSegment":0},{"text":"the mutable indexes detect a changed embedder stamp and regenerate their embeddings.","startTime":302.2,"endTime":305.15,"audioSegment":0},{"text":"A change in dimensions also requires the matching GEZEL_EMBED_DIM setting for content indexes.","startTime":305.15,"endTime":308.1,"audioSegment":0},{"text":"Existing summaries can be reused;","startTime":308.1,"endTime":311.05,"audioSegment":0},{"text":"the source documents do not need to be rewritten.","startTime":311.05,"endTime":314,"audioSegment":0},{"text":"A .gezk embedding profile records enough information to reproduce its vectors: model repository and revision, ONNX graph path and digest,","startTime":314,"endTime":317.5,"audioSegment":0},{"text":"tokenizer identity and digest, query and passage instructions, pooling, normalization, dimensions, token limit, and quantization rules.","startTime":317.5,"endTime":321,"audioSegment":0},{"text":"The catalog echoes this profile in its manifest and database metadata.","startTime":321,"endTime":324.5,"audioSegment":0},{"text":"The current registered profiles are:","startTime":324.5,"endTime":328,"audioSegment":0},{"text":"Profile Language use Query / passage instructions Stage-one encoding","startTime":328,"endTime":331.5,"audioSegment":0},{"text":"bge-small-en-v1.5@1 English;","startTime":331.5,"endTime":335,"audioSegment":0},{"text":"default for local catalog builds and the Handboek BGE query instruction / no passage prefix Raw sign bits","startTime":335,"endTime":338.5,"audioSegment":0},{"text":"multilingual-e5-small@2 Multilingual reference catalogs query:  / passage:  Centered sign bits","startTime":338.5,"endTime":342,"audioSegment":0},{"text":"multilingual-e5-small@1 Existing catalogs using the earlier E5 profile query:  / passage:  Raw sign bits","startTime":342,"endTime":345.5,"audioSegment":0},{"text":"All three currently use 384 dimensions,","startTime":345.5,"endTime":349,"audioSegment":0},{"text":"a 512-token model window, and bit+int8 storage.","startTime":349,"endTime":352.5,"audioSegment":0},{"text":"E5 revisions 1 and 2 share the underlying float vector space and int8 rerank representation;","startTime":352.5,"endTime":356,"audioSegment":0},{"text":"revision 2 changes the binary prefilter.","startTime":356,"endTime":359.5,"audioSegment":0},{"text":"The reader takes the centering vector from the catalog's own profile.","startTime":359.5,"endTime":363,"audioSegment":0},{"text":"Gezel reuses the daemon query embedder for a catalog only when the declared vector space matches and the cached model and tokenizer bytes pass the profile's pinned hash checks.","startTime":363,"endTime":366.5,"audioSegment":0},{"text":"A different supported profile gets its own pinned query embedder.","startTime":366.5,"endTime":370,"audioSegment":0},{"text":"An unknown or unavailable profile leaves browsing and keyword search usable;","startTime":370,"endTime":373.5,"audioSegment":0},{"text":"Gezel does not substitute a same-sized vector from another model.","startTime":373.5,"endTime":377,"audioSegment":0},{"text":"Memory vectors are stored in a sqlite-vec vec_mem virtual table,","startTime":377,"endTime":380.36842105263156,"audioSegment":0},{"text":"joined by row id to the mem table containing text, scope, date, and memory kind.","startTime":380.36842105263156,"endTime":383.7368421052632,"audioSegment":0},{"text":"Text vectors in a content index use vec_text,","startTime":383.7368421052632,"endTime":387.10526315789474,"audioSegment":0},{"text":"joined to chunks and their source files.","startTime":387.10526315789474,"endTime":390.4736842105263,"audioSegment":0},{"text":"The vectors are float arrays;","startTime":390.4736842105263,"endTime":393.8421052631579,"audioSegment":0},{"text":"a default 384-dimensional float32 vector occupies 1,536 bytes before database overhead.","startTime":393.8421052631579,"endTime":397.2105263157895,"audioSegment":0},{"text":"New vector tables declare cosine distance.","startTime":397.2105263157895,"endTime":400.57894736842104,"audioSegment":0},{"text":"For those tables, similarity is 1 − distance.","startTime":400.57894736842104,"endTime":403.9473684210526,"audioSegment":0},{"text":"The content reader also handles older tables that used sqlite-vec's default distance metric,","startTime":403.9473684210526,"endTime":407.3157894736842,"audioSegment":0},{"text":"so legacy distances are interpreted according to the table's actual declaration.","startTime":407.3157894736842,"endTime":410.6842105263158,"audioSegment":0},{"text":"Content search combines the vector neighbors with FTS results over symbols,","startTime":410.6842105263158,"endTime":414.0526315789474,"audioSegment":0},{"text":"summaries, and document chunks.","startTime":414.0526315789474,"endTime":417.42105263157896,"audioSegment":0},{"text":"It uses rank fusion to combine independently ranked lists,","startTime":417.42105263157896,"endTime":420.7894736842105,"audioSegment":0},{"text":"deduplicates overlapping source locations, and limits how many results one path can contribute.","startTime":420.7894736842105,"endTime":424.1578947368421,"audioSegment":0},{"text":"This allows an exact symbol name and a semantically related explanation to support the same result without comparing a BM25 keyword score directly with a cosine score.","startTime":424.1578947368421,"endTime":427.5263157894737,"audioSegment":0},{"text":"Image embeddings have their own storage path: content indexes keep them in a plain BLOB table keyed by image content hash and search them with cosine scoring.","startTime":427.5263157894737,"endTime":430.89473684210526,"audioSegment":0},{"text":"They are independent of the text vec_text table and its dimensions.","startTime":430.89473684210526,"endTime":434.2631578947368,"audioSegment":0},{"text":"The portable catalog vectors described next also use plain BLOBs,","startTime":434.2631578947368,"endTime":437.63157894736844,"audioSegment":0},{"text":"but follow the .gezk format's separate encoding rules.","startTime":437.63157894736844,"endTime":441,"audioSegment":0},{"text":"A .gezk is a portable reference catalog containing its source documents and prepared search indexes.","startTime":441,"endTime":443.64864864864865,"audioSegment":0},{"text":"The open format is specified in bendyline/gezk.","startTime":443.64864864864865,"endTime":446.2972972972973,"audioSegment":0},{"text":"The current source implementation writes the 0.7 draft specification,","startTime":446.2972972972973,"endTime":448.94594594594594,"audioSegment":0},{"text":"paired with index schema 4, and retains reads of 0.5/schema 2 and 0.6/schema 3.","startTime":448.94594594594594,"endTime":451.5945945945946,"audioSegment":0},{"text":"Published reader packages may support earlier generations: check the supported format set of the reader you deploy.","startTime":451.5945945945946,"endTime":454.2432432432432,"audioSegment":0},{"text":"The format version, index schema version, catalog's content version,","startTime":454.2432432432432,"endTime":456.8918918918919,"audioSegment":0},{"text":"and npm package version are separate identifiers.","startTime":456.8918918918919,"endTime":459.5405405405405,"audioSegment":0},{"text":"While the format remains 0.x, a new minor format can be incompatible.","startTime":459.5405405405405,"endTime":462.18918918918916,"audioSegment":0},{"text":"Readers accept an explicit set of generations and refuse unsupported versions with a reported reason.","startTime":462.18918918918916,"endTime":464.8378378378378,"audioSegment":0},{"text":"my-reference.gezk","startTime":464.8378378378378,"endTime":467.4864864864865,"audioSegment":0},{"text":"mimetype                         application/vnd.gezk+zip","startTime":467.4864864864865,"endTime":470.13513513513516,"audioSegment":0},{"text":"manifest.json                    identity, profiles, counts, hashes, optional signature","startTime":470.13513513513516,"endTime":472.7837837837838,"audioSegment":0},{"text":"README.md                        provenance and description","startTime":472.7837837837838,"endTime":475.43243243243245,"audioSegment":0},{"text":"LICENSES/catalog.txt             content license","startTime":475.43243243243245,"endTime":478.0810810810811,"audioSegment":0},{"text":"LICENSES/source-notices.json      optional source attribution assets/...","startTime":478.0810810810811,"endTime":480.72972972972974,"audioSegment":0},{"text":"optional document images","startTime":480.72972972972974,"endTime":483.3783783783784,"audioSegment":0},{"text":"index/router.db                  topics, documents, bodies, locations, routing centroids","startTime":483.3783783783784,"endTime":486.02702702702703,"audioSegment":0},{"text":"index/shards/000.db               chunks, FTS5, binary and int8 vectors","startTime":486.02702702702703,"endTime":488.6756756756757,"audioSegment":0},{"text":"index/shards/001.db               additional shards when needed","startTime":488.6756756756757,"endTime":491.3243243243243,"audioSegment":0},{"text":"The container is a ZIP with a stored mimetype entry first.","startTime":491.3243243243243,"endTime":493.97297297297297,"audioSegment":0},{"text":"Entries are stored without ZIP compression;","startTime":493.97297297297297,"endTime":496.6216216216216,"audioSegment":0},{"text":"document Markdown bodies use either plain bytes or Brotli inside SQLite.","startTime":496.6216216216216,"endTime":499.27027027027026,"audioSegment":0},{"text":"Retrieval runs against verified, extracted databases rather than searching within the ZIP.","startTime":499.27027027027026,"endTime":501.9189189189189,"audioSegment":0},{"text":"The example shows the layout with external shards.","startTime":501.9189189189189,"endTime":504.56756756756755,"audioSegment":0},{"text":"A small catalog, with at most the 200,000-chunk target,","startTime":504.56756756756755,"endTime":507.2162162162162,"audioSegment":0},{"text":"embeds its single shard's tables in router.db and needs no separate shard file.","startTime":507.2162162162162,"endTime":509.8648648648649,"audioSegment":0},{"text":"The shard directory records that path,","startTime":509.8648648648649,"endTime":512.5135135135135,"audioSegment":0},{"text":"so readers follow the catalog's own shard map instead of assuming index/shards/000.db exists.","startTime":512.5135135135135,"endTime":515.1621621621622,"audioSegment":0},{"text":"The router contains the topic hierarchy, document directory,","startTime":515.1621621621622,"endTime":517.8108108108108,"audioSegment":0},{"text":"complete document bodies, aliases, and shard routing centroids.","startTime":517.8108108108108,"endTime":520.4594594594595,"audioSegment":0},{"text":"It has a document-level FTS5 index over titles, summaries, and aliases.","startTime":520.4594594594595,"endTime":523.1081081081081,"audioSegment":0},{"text":"Each shard contains chunk text, heading paths, inclusive source line ranges, content hashes,","startTime":523.1081081081081,"endTime":525.7567567567568,"audioSegment":0},{"text":"a chunk FTS5 index, and two vector tables: chunk_vectors_bit and chunk_vectors_int8.","startTime":525.7567567567568,"endTime":528.4054054054054,"audioSegment":0},{"text":"Catalog databases need stock SQLite with FTS5, without sqlite-vec.","startTime":528.4054054054054,"endTime":531.0540540540541,"audioSegment":0},{"text":"Vectors are ordinary BLOB columns and the reader performs their scoring.","startTime":531.0540540540541,"endTime":533.7027027027027,"audioSegment":0},{"text":"Chunk ids align with both vector tables and FTS row ids,","startTime":533.7027027027027,"endTime":536.3513513513514,"audioSegment":0},{"text":"making the rerank and source lookup direct.","startTime":536.3513513513514,"endTime":539,"audioSegment":0},{"text":"In the 0.7 draft,","startTime":539,"endTime":541.6428571428571,"audioSegment":0},{"text":"topic_documents lets one document appear under several table-of-contents topics.","startTime":541.6428571428571,"endTime":544.2857142857143,"audioSegment":0},{"text":"Its body, chunks, vectors, and citation identity remain canonical.","startTime":544.2857142857143,"endTime":546.9285714285714,"audioSegment":0},{"text":"A subtree listing deduplicates documents before counting and pagination,","startTime":546.9285714285714,"endTime":549.5714285714286,"audioSegment":0},{"text":"so a shared placement does not create another search result or another copy of a passage.","startTime":549.5714285714286,"endTime":552.2142857142857,"audioSegment":0},{"text":"The draft also carries typed geographic points in document_locations.","startTime":552.2142857142857,"endTime":554.8571428571429,"audioSegment":0},{"text":"A subject location describes what an article is about;","startTime":554.8571428571429,"endTime":557.5,"audioSegment":0},{"text":"an associated location records a related place.","startTime":557.5,"endTime":560.1428571428571,"audioSegment":0},{"text":"Radius discovery uses subject locations and the sphere-6371000 distance contract,","startTime":560.1428571428571,"endTime":562.7857142857143,"audioSegment":0},{"text":"not a guess based on place names in prose.","startTime":562.7857142857143,"endTime":565.4285714285714,"audioSegment":0},{"text":"A spatial search first restricts eligible documents,","startTime":565.4285714285714,"endTime":568.0714285714286,"audioSegment":0},{"text":"then searches passages in that set.","startTime":568.0714285714286,"endTime":570.7142857142857,"audioSegment":0},{"text":"Catalogs without usable subject coordinates can still be searched normally.","startTime":570.7142857142857,"endTime":573.3571428571429,"audioSegment":0},{"text":"See the companion reference for nearby and radius-filtered search.","startTime":573.3571428571429,"endTime":576,"audioSegment":0},{"text":"The compiler normalizes the input documents, assigns stable document and chunk identities,","startTime":576,"endTime":579.1333333333333,"audioSegment":0},{"text":"embeds passages, writes the router and shards, and emits the manifest and archive.","startTime":579.1333333333333,"endTime":582.2666666666667,"audioSegment":0},{"text":"The CLI accepts a Markdown tree and recognizes existing outlines such as GitBook SUMMARY.md,","startTime":582.2666666666667,"endTime":585.4,"audioSegment":0},{"text":"MkDocs navigation, Jupyter Book _toc.yml, DocFX TOCs, and Hugo conventions.","startTime":585.4,"endTime":588.5333333333333,"audioSegment":0},{"text":"Relative document links and supported image assets are adapted into catalog references.","startTime":588.5333333333333,"endTime":591.6666666666666,"audioSegment":0},{"text":"The default catalog chunking profile, markdown-chunks@2,","startTime":591.6666666666666,"endTime":594.8,"audioSegment":0},{"text":"targets 420 tokens with 64 tokens of overlap, counted by the embedding profile's tokenizer.","startTime":594.8,"endTime":597.9333333333333,"audioSegment":0},{"text":"It adds a bounded title and heading context header,","startTime":597.9333333333333,"endTime":601.0666666666667,"audioSegment":0},{"text":"recorded by the profile with a maximum of 64 tokens.","startTime":601.0666666666667,"endTime":604.2,"audioSegment":0},{"text":"Source line ranges refer to the normalized document body,","startTime":604.2,"endTime":607.3333333333334,"audioSegment":0},{"text":"allowing a retrieved passage to lead back to its surrounding text.","startTime":607.3333333333334,"endTime":610.4666666666667,"audioSegment":0},{"text":"The compiler uses deterministic ordering and encodings.","startTime":610.4666666666667,"endTime":613.6,"audioSegment":0},{"text":"Reproducible archive bytes also require stable inputs,","startTime":613.6,"endTime":616.7333333333333,"audioSegment":0},{"text":"including the declared creation time and the same pinned model artifacts.","startTime":616.7333333333333,"endTime":619.8666666666667,"audioSegment":0},{"text":"The CLI otherwise supplies the current creation time when you omit it.","startTime":619.8666666666667,"endTime":623,"audioSegment":0},{"text":"Portable catalogs store a compact approximation of each normalized passage vector in two forms:","startTime":623,"endTime":626.1304347826087,"audioSegment":0},{"text":"Representation Bytes for 384 dimensions Use","startTime":626.1304347826087,"endTime":629.2608695652174,"audioSegment":0},{"text":"Sign bits 48 Scan cheaply to shortlist candidates","startTime":629.2608695652174,"endTime":632.3913043478261,"audioSegment":0},{"text":"Signed int8 values 384 Rerank the shortlist against the float query","startTime":632.3913043478261,"endTime":635.5217391304348,"audioSegment":0},{"text":"Combined 432 Stored vector payload, excluding rows and indexes","startTime":635.5217391304348,"endTime":638.6521739130435,"audioSegment":0},{"text":"This is about 3.6 times smaller than a 1,536-byte float32 vector.","startTime":638.6521739130435,"endTime":641.7826086956521,"audioSegment":0},{"text":"A 200,000-chunk shard's sign-bit payload is 9.6 MB,","startTime":641.7826086956521,"endTime":644.9130434782609,"audioSegment":0},{"text":"so the reader can keep that stage in memory without hydrating all full vectors or document bodies.","startTime":644.9130434782609,"endTime":648.0434782608696,"audioSegment":0},{"text":"For each query, the catalog search path is: Question","startTime":648.0434782608696,"endTime":651.1739130434783,"audioSegment":0},{"text":"-> eligible catalogs grouped by compatible embedding profile","startTime":651.1739130434783,"endTime":654.304347826087,"audioSegment":0},{"text":"-> float query embedding in each required vector space","startTime":654.304347826087,"endTime":657.4347826086956,"audioSegment":0},{"text":"-> centroid routing selects shards","startTime":657.4347826086956,"endTime":660.5652173913044,"audioSegment":0},{"text":"-> sign-bit scan produces candidate chunk ids","startTime":660.5652173913044,"endTime":663.695652173913,"audioSegment":0},{"text":"-> int8 rerank reads the shortlisted vectors","startTime":663.695652173913,"endTime":666.8260869565217,"audioSegment":0},{"text":"-> keyword and vector rankings are fused per document","startTime":666.8260869565217,"endTime":669.9565217391305,"audioSegment":0},{"text":"-> selected passage + knowledge:// citation Routing.","startTime":669.9565217391305,"endTime":673.0869565217391,"audioSegment":0},{"text":"A shard is scored by its best matching routing centroid.","startTime":673.0869565217391,"endTime":676.2173913043479,"audioSegment":0},{"text":"The compiler targets 200,000 chunks per shard,","startTime":676.2173913043479,"endTime":679.3478260869565,"audioSegment":0},{"text":"with a maximum of 250,000, and builds multiple centroids for routing.","startTime":679.3478260869565,"endTime":682.4782608695652,"audioSegment":0},{"text":"The explicit search manager spends a six-shard vector budget across catalogs within each query-profile group.","startTime":682.4782608695652,"endTime":685.6086956521739,"audioSegment":0},{"text":"The reader also exposes a three-shard proactive routing default.","startTime":685.6086956521739,"endTime":688.7391304347826,"audioSegment":0},{"text":"Keyword title search is performed across the active catalogs independently of vector routing. Stage one.","startTime":688.7391304347826,"endTime":691.8695652173913,"audioSegment":0},{"text":"Gezel's optimized reader scores a float query against the stored sign bits with an asymmetric lookup-table scan.","startTime":691.8695652173913,"endTime":695,"audioSegment":0},{"text":"The specification also defines a binary-query Hamming baseline.","startTime":695,"endTime":698.1304347826087,"audioSegment":0},{"text":"With centered-sign, both the passage bits and the scan query use vector − center;","startTime":698.1304347826087,"endTime":701.2608695652174,"audioSegment":0},{"text":"the center removes a common direction that would otherwise dominate E5's binary representation.","startTime":701.2608695652174,"endTime":704.3913043478261,"audioSegment":0},{"text":"This centering applies only to the binary stage. Stage two.","startTime":704.3913043478261,"endTime":707.5217391304348,"audioSegment":0},{"text":"For each selected shard, the current candidate count is min(4096,","startTime":707.5217391304348,"endTime":710.6521739130435,"audioSegment":0},{"text":"max(1024, 32 × finalK), eligibleChunkCount).","startTime":710.6521739130435,"endTime":713.7826086956521,"audioSegment":0},{"text":"The ordinary finalK is 24, giving up to 1,024 candidates.","startTime":713.7826086956521,"endTime":716.9130434782609,"audioSegment":0},{"text":"The reader loads their int8 BLOBs by chunk id and scores the original,","startTime":716.9130434782609,"endTime":720.0434782608695,"audioSegment":0},{"text":"uncentered float query against the dequantized passage vectors.","startTime":720.0434782608695,"endTime":723.1739130434783,"audioSegment":0},{"text":"The int8 rule is clamp(round(127 × x), −127, 127) for a normalized component x,","startTime":723.1739130434783,"endTime":726.304347826087,"audioSegment":0},{"text":"with the specification's precise rounding semantics.","startTime":726.304347826087,"endTime":729.4347826086956,"audioSegment":0},{"text":"Dequantization divides by 127; the dot product approximates the original cosine similarity.","startTime":729.4347826086956,"endTime":732.5652173913044,"audioSegment":0},{"text":"No SQLite extension controls these formulas.","startTime":732.5652173913044,"endTime":735.695652173913,"audioSegment":0},{"text":"Catalog SQLite work runs on a dedicated knowledge worker thread,","startTime":735.695652173913,"endTime":738.8260869565217,"audioSegment":0},{"text":"keeping synchronous shard scans off the daemon's main event loop.","startTime":738.8260869565217,"endTime":741.9565217391305,"audioSegment":0},{"text":"Shards are scanned sequentially within a request.","startTime":741.9565217391305,"endTime":745.0869565217391,"audioSegment":0},{"text":"Each catalog handle caches sign-bit arrays with a 256 MiB eviction budget;","startTime":745.0869565217391,"endTime":748.2173913043479,"audioSegment":0},{"text":"this is a cache budget per handle, not a total process memory guarantee.","startTime":748.2173913043479,"endTime":751.3478260869565,"audioSegment":0},{"text":"Routing and quantization trade exhaustive recall for bounded work.","startTime":751.3478260869565,"endTime":754.4782608695652,"audioSegment":0},{"text":"A relevant passage can be missed if its shard is not selected or its binary approximation falls outside the shortlist.","startTime":754.4782608695652,"endTime":757.6086956521739,"audioSegment":0},{"text":"Exact titles and keywords provide another retrieval path,","startTime":757.6086956521739,"endTime":760.7391304347826,"audioSegment":0},{"text":"and catalog producers can measure routed results against a scan of every shard.","startTime":760.7391304347826,"endTime":763.8695652173913,"audioSegment":0},{"text":"Large reference collections benefit from subject-focused catalogs rather than relying on a small shard budget to cover an arbitrarily broad corpus.","startTime":763.8695652173913,"endTime":767,"audioSegment":0},{"text":"An explicit catalog search combines three ranked lists: vector passages,","startTime":767,"endTime":770.5,"audioSegment":0},{"text":"document title/summary/alias matches, and chunk-body keyword matches.","startTime":770.5,"endTime":774,"audioSegment":0},{"text":"These are fused per document using reciprocal rank fusion with k = 60 and weights 1 / 1 / 0.5, respectively.","startTime":774,"endTime":777.5,"audioSegment":0},{"text":"The selected document retains a representative passage when one is available.","startTime":777.5,"endTime":781,"audioSegment":0},{"text":"The fused ordering maps to relevance as 11 / (11 + rank),","startTime":781,"endTime":784.5,"audioSegment":0},{"text":"using a zero-based rank.","startTime":784.5,"endTime":788,"audioSegment":0},{"text":"This measures position in the result list,","startTime":788,"endTime":791.5,"audioSegment":0},{"text":"not the probability that a statement is true.","startTime":791.5,"endTime":795,"audioSegment":0},{"text":"Across the wider search surface, calibrated relevance is multiplied by a source-kind priority;","startTime":795,"endTime":798.5,"audioSegment":0},{"text":"generic reference knowledge has a lower priority than the user's project content.","startTime":798.5,"endTime":802,"audioSegment":0},{"text":"Nearest-neighbor search always has a nearest result, even for an unrelated question.","startTime":802,"endTime":805.5,"audioSegment":0},{"text":"Gezel therefore applies measured cosine floors by embedding profile or catalog before treating a vector match as useful evidence.","startTime":805.5,"endTime":809,"audioSegment":0},{"text":"Cosine ranges differ substantially between models and corpora;","startTime":809,"endTime":812.5,"audioSegment":0},{"text":"a single universal threshold would be misleading.","startTime":812.5,"endTime":816,"audioSegment":0},{"text":"When an optional calibrated relevance model is available, it can further judge and rerank candidates,","startTime":816,"endTime":819.5,"audioSegment":0},{"text":"with stricter admission rules for unsolicited catalog excerpts.","startTime":819.5,"endTime":823,"audioSegment":0},{"text":"Proactive retrieval is bounded separately from a full search.","startTime":823,"endTime":826.5,"audioSegment":0},{"text":"It diversifies sources so reference material does not consume the entire context window.","startTime":826.5,"endTime":830,"audioSegment":0},{"text":"Lean mode includes catalog citations without body text;","startTime":830,"endTime":833.5,"audioSegment":0},{"text":"Balanced admits at most two catalog chunks within 25% of the retrieval token budget; Deep admits at most four within 35%.","startTime":833.5,"endTime":837,"audioSegment":0},{"text":"These are ceilings: a turn with no qualifying catalog evidence includes none.","startTime":837,"endTime":840.5,"audioSegment":0},{"text":"Cold or unavailable embeddings can leave a turn with keyword results or no semantic recall while a model warms in the background.","startTime":840.5,"endTime":844,"audioSegment":0},{"text":"Memory recall has an additional time dimension.","startTime":844,"endTime":847.5,"audioSegment":0},{"text":"Durable facts, decisions, and preferences remain searchable,","startTime":847.5,"endTime":851,"audioSegment":0},{"text":"while status notes decay for automatic recall so an old “the build is broken” observation does not keep appearing as current state.","startTime":851,"endTime":854.5,"audioSegment":0},{"text":"Dates and source scope remain attached to recalled notes.","startTime":854.5,"endTime":858,"audioSegment":0},{"text":"Each session has a named gezel and a project.","startTime":858,"endTime":860.6,"audioSegment":0},{"text":"The model-facing search tool searches the admitted workspace, artifacts,","startTime":860.6,"endTime":863.2,"audioSegment":0},{"text":"project memory, that gezel's memory, shared library, and reference catalogs.","startTime":863.2,"endTime":865.8,"audioSegment":0},{"text":"It can restrict sources or catalog ids.","startTime":865.8,"endTime":868.4,"audioSegment":0},{"text":"Project catalog policy is inherit, selected, or off;","startTime":868.4,"endTime":871,"audioSegment":0},{"text":"a selected catalog must also be installed, enabled, and successfully mounted.","startTime":871,"endTime":873.6,"audioSegment":0},{"text":"The Knowledge browser and gezel knowledge find use the user's installed catalog search surface.","startTime":873.6,"endTime":876.2,"audioSegment":0},{"text":"They do not implicitly adopt the project policy of whichever directory the CLI runs in.","startTime":876.2,"endTime":878.8,"audioSegment":0},{"text":"Project-scoped retrieval applies that policy through the session's project context.","startTime":878.8,"endTime":881.4,"audioSegment":0},{"text":"Catalog citations use a parsed URI grammar:","startTime":881.4,"endTime":884,"audioSegment":0},{"text":"knowledge://publisher/catalog/document","startTime":884,"endTime":886.6,"audioSegment":0},{"text":"knowledge://publisher/catalog/document#line=3-9","startTime":886.6,"endTime":889.2,"audioSegment":0},{"text":"knowledge://publisher/catalog/document#chunk=0123456789abcdef0123456789abcdef","startTime":889.2,"endTime":891.8,"audioSegment":0},{"text":"The first form identifies a document, the second a line range,","startTime":891.8,"endTime":894.4,"audioSegment":0},{"text":"and the third a content-derived passage id.","startTime":894.4,"endTime":897,"audioSegment":0},{"text":"Gezel's read_document tool opens these references.","startTime":897,"endTime":899.6,"audioSegment":0},{"text":"Retrieval records carry the catalog version as provenance,","startTime":899.6,"endTime":902.2,"audioSegment":0},{"text":"but the URI itself does not pin a version: it resolves through the user's currently mounted catalog.","startTime":902.2,"endTime":904.8,"audioSegment":0},{"text":"After an update, a changed chunk can cease to resolve;","startTime":904.8,"endTime":907.4,"audioSegment":0},{"text":"exact reproducibility requires retaining the corresponding catalog version and archive digest.","startTime":907.4,"endTime":910,"audioSegment":0},{"text":"Retrieved text is presented as untrusted evidence with provenance.","startTime":910,"endTime":912.6,"audioSegment":0},{"text":"It can inform an answer,","startTime":912.6,"endTime":915.2,"audioSegment":0},{"text":"but instructions found inside a document do not gain authority to change the task or invoke tools.","startTime":915.2,"endTime":917.8,"audioSegment":0},{"text":"Installing a catalog changes the available reference material;","startTime":917.8,"endTime":920.4,"audioSegment":0},{"text":"it grants no workspace write permission.","startTime":920.4,"endTime":923,"audioSegment":0},{"text":"An installation resolves a catalog id, local archive, or URL; checks space and archive constraints; downloads or reads the bytes;","startTime":923,"endTime":926.0882352941177,"audioSegment":0},{"text":"verifies the archive and manifest; extracts into staging; validates the databases; then publishes an immutable version and updates the user registry.","startTime":926.0882352941177,"endTime":929.1764705882352,"audioSegment":0},{"text":"Downloads can retain partial data for a later resume.","startTime":929.1764705882352,"endTime":932.2647058823529,"audioSegment":0},{"text":"Install progress is streamed,","startTime":932.2647058823529,"endTime":935.3529411764706,"audioSegment":0},{"text":"and disconnecting a progress subscriber does not itself cancel the job.","startTime":935.3529411764706,"endTime":938.4411764705883,"audioSegment":0},{"text":"Archive checks reject unsafe paths and entries,","startTime":938.4411764705883,"endTime":941.5294117647059,"audioSegment":0},{"text":"reconcile declared files with actual files, and check sizes and SHA-256 digests.","startTime":941.5294117647059,"endTime":944.6176470588235,"audioSegment":0},{"text":"Deep validation additionally checks SQLite integrity, chunk/vector alignment,","startTime":944.6176470588235,"endTime":947.7058823529412,"audioSegment":0},{"text":"self-neighbor behavior, and declared keyword smoke queries.","startTime":947.7058823529412,"endTime":950.7941176470588,"audioSegment":0},{"text":"A mount failure quarantines the catalog instead of rewriting its databases or breaking unrelated search sources.","startTime":950.7941176470588,"endTime":953.8823529411765,"audioSegment":0},{"text":"The format supports Ed25519 manifest signatures over RFC 8785 canonical JSON.","startTime":953.8823529411765,"endTime":956.9705882352941,"audioSegment":0},{"text":"A signature is proof of origin only when verified against a trusted public key.","startTime":956.9705882352941,"endTime":960.0588235294117,"audioSegment":0},{"text":"File hashes establish consistency;","startTime":960.0588235294117,"endTime":963.1470588235294,"audioSegment":0},{"text":"they do not by themselves establish who published the content.","startTime":963.1470588235294,"endTime":966.2352941176471,"audioSegment":0},{"text":"The current Gilde install path trusts the archive identity and digest pinned by its catalog entry,","startTime":966.2352941176471,"endTime":969.3235294117648,"audioSegment":0},{"text":"and local file imports may be unsigned.","startTime":969.3235294117648,"endTime":972.4117647058823,"audioSegment":0},{"text":"Structural validation and a signature displayed by inspect should not be mistaken for an independent publisher-trust verdict.","startTime":972.4117647058823,"endTime":975.5,"audioSegment":0},{"text":"Trusted public catalog downloads can use the machine engine broker's immutable asset store,","startTime":975.5,"endTime":978.5882352941177,"audioSegment":0},{"text":"sharing the bytes once per computer.","startTime":978.5882352941177,"endTime":981.6764705882352,"audioSegment":0},{"text":"Your installed references, enabled state, and project selections remain per-user.","startTime":981.6764705882352,"endTime":984.7647058823529,"audioSegment":0},{"text":"Local imports and arbitrary URLs use private storage;","startTime":984.7647058823529,"endTime":987.8529411764706,"audioSegment":0},{"text":"a catalog-id install can also explicitly request private placement.","startTime":987.8529411764706,"endTime":990.9411764705883,"audioSegment":0},{"text":"If shared placement is unavailable, the user daemon can install privately.","startTime":990.9411764705883,"endTime":994.0294117647059,"audioSegment":0},{"text":"The broker receives a trusted catalog coordinate, not a user project path.","startTime":994.0294117647059,"endTime":997.1176470588235,"audioSegment":0},{"text":"It manages public immutable bytes; user documents, memories,","startTime":997.1176470588235,"endTime":1000.2058823529412,"audioSegment":0},{"text":"query embedding work, and retrieval remain product-daemon concerns.","startTime":1000.2058823529412,"endTime":1003.2941176470588,"audioSegment":0},{"text":"Removing a catalog removes your reference and private files,","startTime":1003.2941176470588,"endTime":1006.3823529411765,"audioSegment":0},{"text":"while shared public bytes are reclaimed separately.","startTime":1006.3823529411765,"endTime":1009.4705882352941,"audioSegment":0},{"text":"Background update work respects the app-network policy;","startTime":1009.4705882352941,"endTime":1012.5588235294117,"audioSegment":0},{"text":"an explicitly requested install is the user's own download.","startTime":1012.5588235294117,"endTime":1015.6470588235294,"audioSegment":0},{"text":"The built-in Handboek is itself a .gezk catalog.","startTime":1015.6470588235294,"endTime":1018.7352941176471,"audioSegment":0},{"text":"Gezel builds it from these documentation articles and generated catalog material,","startTime":1018.7352941176471,"endTime":1021.8235294117648,"audioSegment":0},{"text":"then installs the bundled archive through the normal knowledge machinery.","startTime":1021.8235294117648,"endTime":1024.9117647058824,"audioSegment":0},{"text":"Updates replace changed bundled bytes while preserving your enabled setting.","startTime":1024.9117647058824,"endTime":1028,"audioSegment":0},{"text":"Symptom What to check","startTime":1028,"endTime":1030.888888888889,"audioSegment":0},{"text":"A file appears by name but not by meaning Embedding readiness and project indexing/enrichment status;","startTime":1030.888888888889,"endTime":1033.7777777777778,"audioSegment":0},{"text":"the structural pass can finish first","startTime":1033.7777777777778,"endTime":1036.6666666666667,"audioSegment":0},{"text":"A memory cannot be recalled Correct gezel/project scope,","startTime":1036.6666666666667,"endTime":1039.5555555555557,"audioSegment":0},{"text":"saved Markdown, memory index health, and any status-note age","startTime":1039.5555555555557,"endTime":1042.4444444444443,"audioSegment":0},{"text":"A catalog appears installed but supplies no results Enabled/mounted state,","startTime":1042.4444444444443,"endTime":1045.3333333333333,"audioSegment":0},{"text":"quarantine reason, project selection, and the query profile's readiness","startTime":1045.3333333333333,"endTime":1048.2222222222222,"audioSegment":0},{"text":"Offline keyword search works but semantic search fails Embedding runtime installation,","startTime":1048.2222222222222,"endTime":1051.111111111111,"audioSegment":0},{"text":"cached pinned model files, and supported profile","startTime":1051.111111111111,"endTime":1054,"audioSegment":0},{"text":"A title is found but a related passage is missed Shard routing and candidate limits;","startTime":1054,"endTime":1056.888888888889,"audioSegment":0},{"text":"compare keyword and semantic results","startTime":1056.888888888889,"endTime":1059.7777777777778,"audioSegment":0},{"text":"A citation stops opening after an update Currently mounted version and whether the referenced document or chunk still exists","startTime":1059.7777777777778,"endTime":1062.6666666666667,"audioSegment":0},{"text":"A new catalog is refused by an older installation The reader's supported format/schema generations;","startTime":1062.6666666666667,"endTime":1065.5555555555557,"audioSegment":0},{"text":"readers do not migrate archives","startTime":1065.5555555555557,"endTime":1068.4444444444443,"audioSegment":0},{"text":"Start with knowledge inspect, validate, list, and search.","startTime":1068.4444444444443,"endTime":1071.3333333333333,"audioSegment":0},{"text":"Project /index/status and service /api/health also expose embedding readiness.","startTime":1071.3333333333333,"endTime":1074.2222222222222,"audioSegment":0},{"text":"A successful keyword query proves a lexical path works;","startTime":1074.2222222222222,"endTime":1077.111111111111,"audioSegment":0},{"text":"it does not prove the embedding pipeline is ready.","startTime":1077.111111111111,"endTime":1080,"audioSegment":0},{"text":"The public gezk specification repository contains the 0.7 draft,","startTime":1080,"endTime":1082.5384615384614,"audioSegment":0},{"text":"versioned JSON Schemas, conformance fixtures, and Python reference reader.","startTime":1082.5384615384614,"endTime":1085.076923076923,"audioSegment":0},{"text":"The earlier 0.6 and 0.5 specifications remain available.","startTime":1085.076923076923,"endTime":1087.6153846153845,"audioSegment":0},{"text":"The TypeScript implementation has three layers:","startTime":1087.6153846153845,"endTime":1090.1538461538462,"audioSegment":0},{"text":"@bendyline/gezk: format schemas, identifiers, citation grammar,","startTime":1090.1538461538462,"endTime":1092.6923076923076,"audioSegment":0},{"text":"quantization, SQLite DDL, canonical JSON, and signing.","startTime":1092.6923076923076,"endTime":1095.2307692307693,"audioSegment":0},{"text":"It has no product dependency.","startTime":1095.2307692307693,"endTime":1097.7692307692307,"audioSegment":0},{"text":"@bendyline/gezel-knowledge: compiler, Markdown adapter, archive verification, profile embedders, catalog reader, and validator.","startTime":1097.7692307692307,"endTime":1100.3076923076924,"audioSegment":0},{"text":"The service knowledge manager: install jobs, user selection,","startTime":1100.3076923076924,"endTime":1102.8461538461538,"audioSegment":0},{"text":"machine asset coordination, worker ownership, and search integration.","startTime":1102.8461538461538,"endTime":1105.3846153846155,"audioSegment":0},{"text":"Mutable index storage and memory implement the local, changing knowledge sources.","startTime":1105.3846153846155,"endTime":1107.923076923077,"audioSegment":0},{"text":"For practical manipulation, continue with Working with knowledge catalogs,","startTime":1107.923076923077,"endTime":1110.4615384615386,"audioSegment":0},{"text":"or use Writing scripts with gezel-sdk when the work belongs inside a project.","startTime":1110.4615384615386,"endTime":1113,"audioSegment":0}],"version":1},"startBlock":{"title":"How knowledge works in Gezel","subtitle":"Gezel brings relevant information into a conversation from your files, your crew's memories, and installed reference catalogs. It stores that information locally, builds indexes to find it, and gives the language model selected excerpts with references to their sources. This is retrieval-augmented generation, usually shortened to RAG: search supplies evidence that the model can use when answering.","ambientMotion":"zoomIn"}}</script>
