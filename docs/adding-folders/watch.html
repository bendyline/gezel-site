set":2631}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The quickest way to put your crew to work is to give them a folder: your Pictures,","startTime":0,"endTime":4.5,"audioSegment":0},{"text":"your Documents, a project you're writing, a codebase.","startTime":4.5,"endTime":9,"audioSegment":0},{"text":"Gezel asks which folders you'd like when you first start it,","startTime":9,"endTime":13.5,"audioSegment":0},{"text":"and you can add more any time with Add a folder (in the File menu, or the Existing Folder choice under New Project).","startTime":13.5,"endTime":18,"audioSegment":0},{"text":"A folder you add stays exactly as it is.","startTime":18,"endTime":21.375,"audioSegment":0},{"text":"Gezel reads it and builds a search index of it, but it never changes,","startTime":21.375,"endTime":24.75,"audioSegment":0},{"text":"moves or deletes a file unless you ask and approve.","startTime":24.75,"endTime":28.125,"audioSegment":0},{"text":"Everything gezel learns about the folder — the index,","startTime":28.125,"endTime":31.5,"audioSegment":0},{"text":"photo descriptions, summaries — lives in gezel's own folder, not yours.","startTime":31.5,"endTime":34.875,"audioSegment":0},{"text":"When your crew does want to change something, say a fix for a problem in your code,","startTime":34.875,"endTime":38.25,"audioSegment":0},{"text":"it arrives as a change proposal you read and apply yourself.","startTime":38.25,"endTime":41.625,"audioSegment":0},{"text":"Nothing reaches your files until you click Apply.","startTime":41.625,"endTime":45,"audioSegment":0},{"text":"Before anything is added,","startTime":45,"endTime":48.46153846153846,"audioSegment":0},{"text":"gezel shows you what the folder holds (\"12,480 photos · 1,204 only in iCloud\") and what your crew will do with it tonight:","startTime":48.46153846153846,"endTime":51.92307692307692,"audioSegment":0},{"text":"Pictures: read every file and describe your photos,","startTime":51.92307692307692,"endTime":55.38461538461539,"audioSegment":0},{"text":"so you can find one by what's in it, group them into outings, and propose albums.","startTime":55.38461538461539,"endTime":58.84615384615385,"audioSegment":0},{"text":"HEIC photos and camera RAW files (DNG, CR2, NEF, ARW, RAF, ORF,","startTime":58.84615384615385,"endTime":62.30769230769231,"audioSegment":0},{"text":"RW2) are read too, with the date, camera and lens each was taken with.","startTime":62.30769230769231,"endTime":65.76923076923077,"audioSegment":0},{"text":"Documents: read every file and summarize your documents.","startTime":65.76923076923077,"endTime":69.23076923076923,"audioSegment":0},{"text":"Code: read, summarize and review the code,","startTime":69.23076923076923,"endTime":72.6923076923077,"audioSegment":0},{"text":"and draft fixes for what the review finds, for you to approve.","startTime":72.6923076923077,"endTime":76.15384615384616,"audioSegment":0},{"text":"Files that live only in the cloud (iCloud's Optimize Storage,","startTime":76.15384615384616,"endTime":79.61538461538461,"audioSegment":0},{"text":"OneDrive's Files On-Demand) are listed by name and date and left in the cloud, so gezel never downloads them behind your back.","startTime":79.61538461538461,"endTime":83.07692307692308,"audioSegment":0},{"text":"A Photos library belongs to the Photos app,","startTime":83.07692307692308,"endTime":86.53846153846155,"audioSegment":0},{"text":"so gezel leaves it alone.","startTime":86.53846153846155,"endTime":90,"audioSegment":0},{"text":"Every folder gets the Boekwachter, who reads, describes and reviews it.","startTime":90,"endTime":93.4,"audioSegment":0},{"text":"A code folder also gets a Builder, which is what lets your crew draft fixes overnight,","startTime":93.4,"endTime":96.8,"audioSegment":0},{"text":"and a photo folder a Curator, who looks after your albums.","startTime":96.8,"endTime":100.2,"audioSegment":0},{"text":"Gezel adds them once, when you add the folder;","startTime":100.2,"endTime":103.6,"audioSegment":0},{"text":"if you later take one off the folder, they stay off.","startTime":103.6,"endTime":107,"audioSegment":0},{"text":"New folders are worked on overnight by default, during the Night Shift.","startTime":107,"endTime":110.28571428571429,"audioSegment":0},{"text":"The folder's Overview shows what it holds and what your crew will do tonight,","startTime":110.28571428571429,"endTime":113.57142857142857,"audioSegment":0},{"text":"with one switch, Work on this folder overnight, to turn that off.","startTime":113.57142857142857,"endTime":116.85714285714286,"audioSegment":0},{"text":"Turned off, the folder is still searchable;","startTime":116.85714285714286,"endTime":120.14285714285714,"audioSegment":0},{"text":"your crew just leaves it alone at night.","startTime":120.14285714285714,"endTime":123.42857142857143,"audioSegment":0},{"text":"Work that would send anything off this computer (a cloud model,","startTime":123.42857142857143,"endTime":126.71428571428572,"audioSegment":0},{"text":"a web search) is never switched on for you: it waits for your OK.","startTime":126.71428571428572,"endTime":130,"audioSegment":0}],"version":1},"startBlock":{"title":"Adding folders: give your crew something to look after","subtitle":"The quickest way to put your crew to work is to give them a folder: your Pictures, your Documents, a project you're writing, a codebase. Gezel asks which folders you'd like when you first start it, and you can add more any time with Add a folder (in the File menu, or the Existing Folder choice under New Project).","ambientMotion":"zoomIn"}}</script>
