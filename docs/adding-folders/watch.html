to change something, say a fix for a problem in your code,","startTime":33.25,"endTime":36.5,"audioSegment":0},{"text":"it arrives as a change proposal you read and apply yourself.","startTime":36.5,"endTime":39.75,"audioSegment":0},{"text":"Nothing reaches your files until you click Apply.","startTime":39.75,"endTime":43,"audioSegment":0},{"text":"Before anything is added,","startTime":43,"endTime":46.38461538461539,"audioSegment":0},{"text":"gezel shows you what the folder holds (\"12,480 photos · 1,204 only in iCloud\") and what it will do with it tonight:","startTime":46.38461538461539,"endTime":49.76923076923077,"audioSegment":0},{"text":"Pictures: read every file and describe your photos,","startTime":49.76923076923077,"endTime":53.15384615384615,"audioSegment":0},{"text":"so you can find one by what's in it, group them into outings, and propose albums.","startTime":53.15384615384615,"endTime":56.53846153846154,"audioSegment":0},{"text":"HEIC photos and camera RAW files (DNG, CR2, NEF, ARW, RAF, ORF,","startTime":56.53846153846154,"endTime":59.92307692307692,"audioSegment":0},{"text":"RW2) are read too, with the date, camera and lens each was taken with.","startTime":59.92307692307692,"endTime":63.30769230769231,"audioSegment":0},{"text":"Documents: read every file and summarize your documents.","startTime":63.30769230769231,"endTime":66.6923076923077,"audioSegment":0},{"text":"Code: read, summarize and review the code,","startTime":66.6923076923077,"endTime":70.07692307692308,"audioSegment":0},{"text":"and draft fixes for what the review finds, for you to approve.","startTime":70.07692307692308,"endTime":73.46153846153845,"audioSegment":0},{"text":"Files that live only in the cloud (iCloud's Optimize Storage,","startTime":73.46153846153845,"endTime":76.84615384615384,"audioSegment":0},{"text":"OneDrive's Files On-Demand) are listed by name and date and left in the cloud, so gezel never downloads them behind your back.","startTime":76.84615384615384,"endTime":80.23076923076923,"audioSegment":0},{"text":"A Photos library belongs to the Photos app,","startTime":80.23076923076923,"endTime":83.61538461538461,"audioSegment":0},{"text":"so gezel leaves it alone.","startTime":83.61538461538461,"endTime":87,"audioSegment":0},{"text":"Every folder gets the Librarian, who reads, describes and reviews it.","startTime":87,"endTime":90.2,"audioSegment":0},{"text":"A code folder also gets a Builder, who drafts fixes overnight,","startTime":90.2,"endTime":93.4,"audioSegment":0},{"text":"and a photo folder a Curator, who looks after your albums.","startTime":93.4,"endTime":96.6,"audioSegment":0},{"text":"Gezel adds them once, when you add the folder;","startTime":96.6,"endTime":99.8,"audioSegment":0},{"text":"if you later take one off the folder, they stay off.","startTime":99.8,"endTime":103,"audioSegment":0},{"text":"New folders are worked on overnight by default, during the Night Shift.","startTime":103,"endTime":106.44444444444444,"audioSegment":0},{"text":"The folder's Overview shows what it holds and what Gezel will do tonight,","startTime":106.44444444444444,"endTime":109.88888888888889,"audioSegment":0},{"text":"with one switch, Work on this folder overnight, to turn that off.","startTime":109.88888888888889,"endTime":113.33333333333333,"audioSegment":0},{"text":"Turned off, the folder is still searchable;","startTime":113.33333333333333,"endTime":116.77777777777777,"audioSegment":0},{"text":"Gezel just leaves it alone at night.","startTime":116.77777777777777,"endTime":120.22222222222223,"audioSegment":0},{"text":"Work that would send anything off this computer (a cloud model,","startTime":120.22222222222223,"endTime":123.66666666666667,"audioSegment":0},{"text":"a web search) is never switched on for you: it waits for your OK.","startTime":123.66666666666667,"endTime":127.11111111111111,"audioSegment":0},{"text":"To look through what Gezel found, open the project's Views tab: the files on shelves,","startTime":127.11111111111111,"endTime":130.55555555555554,"audioSegment":0},{"text":"a timeline of what changed when, and the reports written about them.","startTime":130.55555555555554,"endTime":134,"audioSegment":0}],"version":1},"startBlock":{"title":"Adding folders: give Gezel something to look after","subtitle":"The quickest way to put Gezel to work is to give it a folder: your Pictures, your Documents, a project you're writing, a codebase. Gezel asks which folders you'd like when you first start it, and you can add more any time with Add a folder (in the File menu, or the Existing Folder choice under New Project).","ambientMotion":"zoomIn"}}</script>
