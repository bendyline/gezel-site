ezel — the Generalist — reads the outline of the task, works the active step,","startTime":30.76923076923077,"endTime":34.61538461538461,"audioSegment":0},{"text":"passes its check, and moves to the next, all in one continuous conversation.","startTime":34.61538461538461,"endTime":38.46153846153846,"audioSegment":0},{"text":"What it learned in step two is still in front of it in step five.","startTime":38.46153846153846,"endTime":42.30769230769231,"audioSegment":0},{"text":"The steps and their checks are the same ones a crew would walk;","startTime":42.30769230769231,"endTime":46.15384615384615,"audioSegment":0},{"text":"nothing is skipped and nothing is merged.","startTime":46.15384615384615,"endTime":50,"audioSegment":0},{"text":"Settings → Artificial Intelligence → Run in generalist mode has three keys:","startTime":50,"endTime":53.375,"audioSegment":0},{"text":"Automatic (the default): on for hosted frontier models — Claude,","startTime":53.375,"endTime":56.75,"audioSegment":0},{"text":"ChatGPT and Codex, GitHub Copilot — and off for models running on this device.","startTime":56.75,"endTime":60.125,"audioSegment":0},{"text":"On: every task runs in generalist mode, whatever the model.","startTime":60.125,"endTime":63.5,"audioSegment":0},{"text":"Useful for trying a capable local model on a whole task.","startTime":63.5,"endTime":66.875,"audioSegment":0},{"text":"Off: every task runs stepwise, even on a frontier model.","startTime":66.875,"endTime":70.25,"audioSegment":0},{"text":"The choice is made once, when a task is created,","startTime":70.25,"endTime":73.625,"audioSegment":0},{"text":"so changing the setting never disturbs a task that is already under way.","startTime":73.625,"endTime":77,"audioSegment":0},{"text":"Every step, every check.","startTime":77,"endTime":80.11111111111111,"audioSegment":0},{"text":"The Generalist advances one step at a time and each step's check must pass before the next is revealed.","startTime":80.11111111111111,"endTime":83.22222222222223,"audioSegment":0},{"text":"Fan-out still fans out.","startTime":83.22222222222223,"endTime":86.33333333333333,"audioSegment":0},{"text":"When a step spawns one child task per item — one story per topic, one invoice per client —","startTime":86.33333333333333,"endTime":89.44444444444444,"audioSegment":0},{"text":"each child is its own conversation, so the work still happens in parallel.","startTime":89.44444444444444,"endTime":92.55555555555556,"audioSegment":0},{"text":"The Generalist collects the results when the children finish.","startTime":92.55555555555556,"endTime":95.66666666666667,"audioSegment":0},{"text":"Your choices win.","startTime":95.66666666666667,"endTime":98.77777777777777,"audioSegment":0},{"text":"If you assigned a task to a particular gezel, that gezel stays the owner;","startTime":98.77777777777777,"endTime":101.88888888888889,"audioSegment":0},{"text":"a step that is yours to approve stays yours.","startTime":101.88888888888889,"endTime":105,"audioSegment":0},{"text":"One owner, one conversation.","startTime":105,"endTime":107.44444444444444,"audioSegment":0},{"text":"No hand-offs between specialists,","startTime":107.44444444444444,"endTime":109.88888888888889,"audioSegment":0},{"text":"no re-reading of notes to reconstruct what the previous step found.","startTime":109.88888888888889,"endTime":112.33333333333333,"audioSegment":0},{"text":"The whole outline in view.","startTime":112.33333333333333,"endTime":114.77777777777777,"audioSegment":0},{"text":"The gezel sees the goal and every step, marked done,","startTime":114.77777777777777,"endTime":117.22222222222223,"audioSegment":0},{"text":"active or pending, so it can shape today's step for tomorrow's.","startTime":117.22222222222223,"endTime":119.66666666666667,"audioSegment":0},{"text":"The full bench.","startTime":119.66666666666667,"endTime":122.11111111111111,"audioSegment":0},{"text":"The tools every step in the recipe needs are available from the start.","startTime":122.11111111111111,"endTime":124.55555555555556,"audioSegment":0},{"text":"See also Tasks and supervision for how steps, checks and pauses work.","startTime":124.55555555555556,"endTime":127,"audioSegment":0}],"version":1},"startBlock":{"title":"Generalist mode","subtitle":"A task in gezel is a recipe — a craftbook — walked one step at a time, with a check at the end of each step. There are two ways to staff that walk.","ambientMotion":"zoomIn"}}</script>
