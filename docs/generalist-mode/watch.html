pecialists, no re-reading of notes to reconstruct what the previous step found.","position":{"start":{"line":31,"column":35,"offset":2744},"end":{"line":31,"column":137,"offset":2846}}}],"position":{"start":{"line":31,"column":3,"offset":2712},"end":{"line":31,"column":137,"offset":2846}}}],"position":{"start":{"line":31,"column":1,"offset":2710},"end":{"line":31,"column":137,"offset":2846}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The whole outline in view.","position":{"start":{"line":32,"column":5,"offset":2851},"end":{"line":32,"column":31,"offset":2877}}}],"position":{"start":{"line":32,"column":3,"offset":2849},"end":{"line":32,"column":33,"offset":2879}}},{"type":"text","value":" The owner sees the goal and every step, marked done, active or pending, and can shape today's step for tomorrow's.","position":{"start":{"line":32,"column":33,"offset":2879},"end":{"line":32,"column":148,"offset":2994}}}],"position":{"start":{"line":32,"column":3,"offset":2849},"end":{"line":32,"column":148,"offset":2994}}}],"position":{"start":{"line":32,"column":1,"offset":2847},"end":{"line":32,"column":148,"offset":2994}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"The full bench.","position":{"start":{"line":33,"column":5,"offset":2999},"end":{"line":33,"column":20,"offset":3014}}}],"position":{"start":{"line":33,"column":3,"offset":2997},"end":{"line":33,"column":22,"offset":3016}}},{"type":"text","value":" The tools every step in the plan needs are available from the start.","position":{"start":{"line":33,"column":22,"offset":3016},"end":{"line":33,"column":91,"offset":3085}}}],"position":{"start":{"line":33,"column":3,"offset":2997},"end":{"line":33,"column":91,"offset":3085}}}],"position":{"start":{"line":33,"column":1,"offset":2995},"end":{"line":33,"column":91,"offset":3085}}}],"position":{"start":{"line":31,"column":1,"offset":2710},"end":{"line":33,"column":91,"offset":3085}}},{"type":"paragraph","children":[{"type":"text","value":"See also ","position":{"start":{"line":35,"column":1,"offset":3087},"end":{"line":35,"column":10,"offset":3096}}},{"type":"link","url":"../tasks-and-supervision/","children":[{"type":"text","value":"Tasks and supervision","position":{"start":{"line":35,"column":11,"offset":3097},"end":{"line":35,"column":32,"offset":3118}}}],"position":{"start":{"line":35,"column":10,"offset":3096},"end":{"line":35,"column":60,"offset":3146}}},{"type":"text","value":" for how steps, checks and pauses work.","position":{"start":{"line":35,"column":60,"offset":3146},"end":{"line":35,"column":99,"offset":3185}}}],"position":{"start":{"line":35,"column":1,"offset":3087},"end":{"line":35,"column":99,"offset":3185}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A task in gezel is a plan walked one step at a time,","startTime":0,"endTime":3.769230769230769,"audioSegment":0},{"text":"with a check at the end of each step.","startTime":3.769230769230769,"endTime":7.538461538461538,"audioSegment":0},{"text":"There are two ways to staff that walk.","startTime":7.538461538461538,"endTime":11.307692307692307,"audioSegment":0},{"text":"Stepwise is the crew approach: each step names the trade it needs, a specialist for that trade picks it up in a fresh conversation,","startTime":11.307692307692307,"endTime":15.076923076923077,"audioSegment":0},{"text":"passes the step's check, and hands the next step to the next specialist.","startTime":15.076923076923077,"endTime":18.846153846153847,"audioSegment":0},{"text":"It is how small on-device models get the most out of a plan,","startTime":18.846153846153847,"endTime":22.615384615384613,"audioSegment":0},{"text":"because each conversation stays short and focused.","startTime":22.615384615384613,"endTime":26.384615384615383,"audioSegment":0},{"text":"Generalist mode puts one pair of hands on the whole task.","startTime":26.384615384615383,"endTime":30.153846153846153,"audioSegment":0},{"text":"One owner — the Generalist — reads the outline of the task, works the active step,","startTime":30.153846153846153,"endTime":33.92307692307692,"audioSegment":0},{"text":"passes its check, and moves to the next, all in one continuous conversation.","startTime":33.92307692307692,"endTime":37.69230769230769,"audioSegment":0},{"text":"What it learned in step two is still in front of it in step five.","startTime":37.69230769230769,"endTime":41.46153846153846,"audioSegment":0},{"text":"The steps and their checks are the same ones a crew would walk;","startTime":41.46153846153846,"endTime":45.230769230769226,"audioSegment":0},{"text":"nothing is skipped and nothing is merged.","startTime":45.230769230769226,"endTime":49,"audioSegment":0},{"text":"Settings → Artificial intelligence → Run in generalist mode has three keys:","startTime":49,"endTime":52.2,"audioSegment":0},{"text":"Automatic (the default): when the recipe states its goal,","startTime":52.2,"endTime":55.4,"audioSegment":0},{"text":"one gezel works from that goal (see below).","startTime":55.4,"endTime":58.6,"audioSegment":0},{"text":"Otherwise generalist mode is on for hosted frontier models — Claude,","startTime":58.6,"endTime":61.8,"audioSegment":0},{"text":"ChatGPT and Codex, GitHub Copilot — and off for models running on this device.","startTime":61.8,"endTime":65,"audioSegment":0},{"text":"On: every task runs in generalist mode, whatever the model.","startTime":65,"endTime":68.2,"audioSegment":0},{"text":"Useful for trying a capable local model on a whole task.","startTime":68.2,"endTime":71.4,"audioSegment":0},{"text":"Off: every task runs stepwise, even on a frontier model.","startTime":71.4,"endTime":74.6,"audioSegment":0},{"text":"The choice is made once, when a task is created,","startTime":74.6,"endTime":77.8,"audioSegment":0},{"text":"so changing the setting never disturbs a task that is already under way.","startTime":77.8,"endTime":81,"audioSegment":0},{"text":"Some recipes state their goal outright: what to deliver,","startTime":81,"endTime":84,"audioSegment":0},{"text":"and the bar it has to clear.","startTime":84,"endTime":87,"audioSegment":0},{"text":"For those, Automatic hands one gezel the goal,","startTime":87,"endTime":90,"audioSegment":0},{"text":"the files to deliver and the checks they must pass, and lets it decide the steps itself.","startTime":90,"endTime":93,"audioSegment":0},{"text":"The checks run on the finished work instead of after each step.","startTime":93,"endTime":96,"audioSegment":0},{"text":"In our tests this did about as well as walking the recipe step by step,","startTime":96,"endTime":99,"audioSegment":0},{"text":"in well under half the time.","startTime":99,"endTime":102,"audioSegment":0},{"text":"A few models we measured also get the recipe alongside,","startTime":102,"endTime":105,"audioSegment":0},{"text":"as advice they may follow or skip.","startTime":105,"endTime":108,"audioSegment":0},{"text":"Choosing On or Off brings back the step-by-step walk.","startTime":108,"endTime":111,"audioSegment":0},{"text":"Every step, every check.","startTime":111,"endTime":114.11111111111111,"audioSegment":0},{"text":"The Generalist advances one step at a time and each step's check must pass before the next is revealed.","startTime":114.11111111111111,"endTime":117.22222222222223,"audioSegment":0},{"text":"Fan-out still fans out.","startTime":117.22222222222223,"endTime":120.33333333333333,"audioSegment":0},{"text":"When a step spawns one child task per item — one story per topic, one invoice per client —","startTime":120.33333333333333,"endTime":123.44444444444444,"audioSegment":0},{"text":"each child is its own conversation, so the work still happens in parallel.","startTime":123.44444444444444,"endTime":126.55555555555556,"audioSegment":0},{"text":"The Generalist collects the results when the children finish.","startTime":126.55555555555556,"endTime":129.66666666666666,"audioSegment":0},{"text":"Your choices win.","startTime":129.66666666666666,"endTime":132.77777777777777,"audioSegment":0},{"text":"If you assigned a task to someone in particular,","startTime":132.77777777777777,"endTime":135.88888888888889,"audioSegment":0},{"text":"they stay the owner; a step that is yours to approve stays yours.","startTime":135.88888888888889,"endTime":139,"audioSegment":0},{"text":"One owner, one conversation.","startTime":139,"endTime":141.44444444444446,"audioSegment":0},{"text":"No hand-offs between specialists,","startTime":141.44444444444446,"endTime":143.88888888888889,"audioSegment":0},{"text":"no re-reading of notes to reconstruct what the previous step found.","startTime":143.88888888888889,"endTime":146.33333333333334,"audioSegment":0},{"text":"The whole outline in view.","startTime":146.33333333333334,"endTime":148.77777777777777,"audioSegment":0},{"text":"The owner sees the goal and every step, marked done,","startTime":148.77777777777777,"endTime":151.22222222222223,"audioSegment":0},{"text":"active or pending, and can shape today's step for tomorrow's.","startTime":151.22222222222223,"endTime":153.66666666666666,"audioSegment":0},{"text":"The full bench.","startTime":153.66666666666666,"endTime":156.11111111111111,"audioSegment":0},{"text":"The tools every step in the plan needs are available from the start.","startTime":156.11111111111111,"endTime":158.55555555555554,"audioSegment":0},{"text":"See also Tasks and supervision for how steps, checks and pauses work.","startTime":158.55555555555554,"endTime":161,"audioSegment":0}],"version":1},"startBlock":{"title":"Generalist mode","subtitle":"A task in gezel is a plan walked one step at a time, with a check at the end of each step. There are two ways to staff that walk.","ambientMotion":"zoomIn"}}</script>
