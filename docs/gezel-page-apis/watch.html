19,"column":74,"offset":9170}}}],"position":{"start":{"line":119,"column":1,"offset":9097},"end":{"line":119,"column":74,"offset":9170}}},{"type":"code","lang":"json","value":"{\n  \"pages\": {\n    \"entry\": \"index.html\",\n    \"api\": 1,\n    \"reads\": [{ \"source\": \"workspace\", \"path\": \"media\", \"subtree\": true }],\n    \"imports\": [{\n      \"id\": \"library\", \"source\": \"workspace\", \"path\": \"media\",\n      \"accept\": [\".jpg\", \".png\", \".mp4\"], \"maxFileBytes\": 268435456\n    }]\n  }\n}","position":{"start":{"line":121,"column":1,"offset":9172},"end":{"line":133,"column":4,"offset":9477}}},{"type":"paragraph","children":[{"type":"text","value":"Imports support workspace destinations only. ","position":{"start":{"line":135,"column":1,"offset":9479},"end":{"line":135,"column":46,"offset":9524}}},{"type":"inlineCode","value":"path: \".\"","position":{"start":{"line":135,"column":46,"offset":9524},"end":{"line":135,"column":57,"offset":9535}}},{"type":"text","value":" means the project's selected folder. ","position":{"start":{"line":135,"column":57,"offset":9535},"end":{"line":135,"column":95,"offset":9573}}},{"type":"inlineCode","value":"accept","position":{"start":{"line":135,"column":95,"offset":9573},"end":{"line":135,"column":103,"offset":9581}}},{"type":"text","value":" is an optional extension allowlist; the host enforces it and the byte limit independently of picker hints. An import declaration does not grant read access or override managed workspace writes. In particular, an external folder still needs the user's existing write opt-in in Project Settings. There is no page-facing bypass or permission toggle.","position":{"start":{"line":135,"column":103,"offset":9581},"end":{"line":135,"column":450,"offset":9928}}}],"position":{"start":{"line":135,"column":1,"offset":9479},"end":{"line":135,"column":450,"offset":9928}}},{"type":"paragraph","children":[{"type":"text","value":"Use the adder for the usual flow. A custom UI can call ls stay where the user selected them. Cancel stops pending work and does not undo files already saved. A file that finished committing as cancellation arrived may already exist; refresh the listing to reconcile.","position":{"start":{"line":137,"column":356,"offset":10285},"end":{"line":137,"column":618,"offset":10547}}}],"position":{"start":{"line":137,"column":1,"offset":9930},"end":{"line":137,"column":618,"offset":10547}}},{"type":"paragraph","children":[{"type":"text","value":"The current limits are 100 files per batch, 256 MiB per file (a target may lower it), two active uploads per project, four per daemon, 120 attempts per project per minute, and a five-minute upload deadline. The server streams bytes to private temporary storage, validates scopes and paths, rechecks the destination and write policy at commit, and publishes atomically through the Store. It rejects traversal, symlink escapes, hidden/reserved names, and alternate streams. Imports never accept host source paths from a page.","position":{"start":{"line":139,"column":1,"offset":10549},"end":{"line":139,"column":524,"offset":11072}}}],"position":{"start":{"line":139,"column":1,"offset":10549},"end":{"line":139,"column":524,"offset":11072}}},{"type":"paragraph","children":[{"type":"text","value":"Live imports currently require the embedded desktop host. Browser tabs, phone snapshots and app-serve visitors get an explicit unavailable state; a shareable site's read capability never grants uploads. Components themselves work across these hosts. Always handle unsupported hosts and permission failures without silently enabling demo mode.","position":{"start":{"line":141,"column":1,"offset":11074},"end":{"line":141,"column":343,"offset":11416}}}],"position":{"start":{"line":141,"column":1,"offset":11074},"end":{"line":141,"column":343,"offset":11416}}},{"type":"paragraph","children":[{"type":"text","value":"After ","position":{"start":{"line":143,"column":1,"offset":11418},"end":{"line":143,"column":7,"offset":11424}}},{"type":"inlineCode","value":"onAdded","position":{"start":{"line":143,"column":7,"offset":11424},"end":{"line":143,"column":16,"offset":11433}}},{"type":"text","value":", refresh the app's listing. Ordinary workspace indexing follows asynchronously, so a newly added spreadsheet may appear before its DuckDB tables are ready. Keep the indexing/empty state and normal table refresh behavior.","position":{"start":{"line":143,"column":16,"offset":11433},"end":{"line":143,"column":237,"offset":11654}}}],"position":{"start":{"line":143,"column":1,"offset":11418},"end":{"line":143,"column":237,"offset":11654}}}],"children":[{"id":"standalone-component-demos","startTime":448,"duration":74,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Standalone component demos","position":{"start":{"line":145,"column":5,"offset":11660},"end":{"line":145,"column":31,"offset":11686}}}],"position":{"start":{"line":145,"column":1,"offset":11656},"end":{"line":145,"column":31,"offset":11686}}},"title":"Standalone component demos","contents":[{"type":"paragraph","children":[{"type":"text","value":"The demo host supplies the components and shared fonts before app code. Keep the visible banner and Reset demo control. For Gilde, use ","position":{"start":{"line":147,"column":1,"offset":11688},"end":{"line":147,"column":136,"offset":11823}}},{"type":"inlineCode","value":"npm run demos","position":{"start":{"line":147,"column":136,"offset":11823},"end":{"line":147,"column":151,"offset":11838}}},{"type":"text","value":" or ","position":{"start":{"line":147,"column":151,"offset":11838},"end":{"line":147,"column":155,"offset":11842}}},{"type":"inlineCode","value":"npm run export-page-demo -- <id> --out <new-directory>","position":{"start":{"line":147,"column":155,"offset":11842},"end":{"line":147,"column":211,"offset":11898}}},{"type":"text","value":". For private source folders, run ","position":{"start":{"line":147,"column":211,"offset":11898},"end":{"line":147,"column":245,"offset":11932}}},{"type":"inlineCode","value":"gezel app demo . --out ../my-app-demo","position":{"start":{"line":147,"column":245,"offset":11932},"end":{"line":147,"column":284,"offset":11971}}},{"type":"text","value":" and open its generated entry under ","position":{"start":{"line":147,"column":284,"offset":11971},"end":{"line":147,"column":320,"offset":12007}}},{"type":"inlineCode","value":"pages/","position":{"start":{"line":147,"column":320,"offset":12007},"end":{"line":147,"column":328,"offset":12015}}},{"type":"text","value":"; the output works offline without a daemon. The website uses shared, content-hashed assets; each offline export contains its own generated asset set. Do not double-click the unprocessed source page or add platform files to its ","position":{"start":{"line":147,"column":328,"offset":12015},"end":{"line":147,"column":556,"offset":12243}}},{"type":"inlineCode","value":"pages/","position":{"start":{"line":147,"column":556,"offset":12243},"end":{"line":147,"column":564,"offset":12251}}},{"type":"text","value":" tree.","position":{"start":{"line":147,"column":564,"offset":12251},"end":{"line":147,"column":570,"offset":12257}}}],"position":{"start":{"line":147,"column":1,"offset":11688},"end":{"line":147,"column":570,"offset":12257}}},{"type":"code","lang":"js","value":"const api = window.gezel || window.makeDemoGezel({\n  page: { typeName: 'My library' },\n  existingPaths: samples.map(file => file.path),\n  // data and tools: app-owned sample handlers, when needed\n});\nconst components = api.ui.components;\n// Merge these into your representative sample listing after onAdded:\nconst added = components.demo?.files() ?? [];\n// In your Reset demo handler, clear imported descriptors and release object URLs:\ncomponents.demo?.reset();","position":{"start":{"line":149,"column":1,"offset":12259},"end":{"line":160,"column":4,"offset":12731}}},{"type":"paragraph","children":[{"type":"text","value":"Demo imports exercise the same picker, drop, validation, progress and cards. They retain browser Files/object URLs in this tab, use deterministic metadata, and never write to disk or invoke a model. ","position":{"start":{"line":162,"column":1,"offset":12733},"end":{"line":162,"column":200,"offset":12932}}},{"type":"inlineCode","value":"data.url","position":{"start":{"line":162,"column":200,"offset":12932},"end":{"line":162,"column":210,"offset":12942}}},{"type":"text","value":" resolves imported demo media. Reset the page's own sample state and remount the adder to clear its result list. Do not claim imported demo data was indexed: Data Analysis keeps its charts on labeled sample tables.","position":{"start":{"line":162,"column":210,"offset":12942},"end":{"line":162,"column":424,"offset":13156}}}],"position":{"start":{"line":162,"column":1,"offset":12733},"end":{"line":162,"column":424,"offset":13156}}},{"type":"paragraph","children":[{"type":"text","value":"React apps can mount either component in a ref inside an effect and call ","position":{"start":{"line":164,"column":1,"offset":13158},"end":{"line":164,"column":74,"offset":13231}}},{"type":"inlineCode","value":"destroy()","position":{"start":{"line":164,"column":74,"offset":13231},"end":{"line":164,"column":85,"offset":13242}}},{"type":"text","value":" in cleanup. There is no separate React component implementation to keep in sync.","position":{"start":{"line":164,"column":85,"offset":13242},"end":{"line":164,"column":166,"offset":13323}}}],"position":{"start":{"line":164,"column":1,"offset":13158},"end":{"line":164,"column":166,"offset":13323}}}]}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A project type can ship pages/index.html with relative JavaScript, CSS, and assets.","startTime":0,"endTime":4.125,"audioSegment":0},{"text":"Gezel hosts that page in the project's Output pane and injects window.gezel before its scripts run.","startTime":4.125,"endTime":8.25,"audioSegment":0},{"text":"You build a normal browser interface; Gezel supplies project identity,","startTime":8.25,"endTime":12.375,"audioSegment":0},{"text":"scoped file access, declared actions, and the theme.","startTime":12.375,"endTime":16.5,"audioSegment":0},{"text":"You do not need a React component inside the desktop shell or a new service for each app.","startTime":16.5,"endTime":20.625,"audioSegment":0},{"text":"Read Building AI Apps inside Gezel for the whole app and the app page style guide for injected fonts and page-owned styles.","startTime":20.625,"endTime":24.75,"audioSegment":0},{"text":"The complete Output Pane API reference owns method signatures, error codes, permissions, limits,","startTime":24.75,"endTime":28.875,"audioSegment":0},{"text":"and compatibility; the typed API is exported as @bendyline/gezel-sdk/page for authoring tools.","startTime":28.875,"endTime":33,"audioSegment":0},{"text":"This is a pages block inside a project type's version manifest: { \"pages\": {","startTime":33,"endTime":35.8235294117647,"audioSegment":0},{"text":"\"entry\": \"index.html\", \"api\": 1, \"reads\": [","startTime":35.8235294117647,"endTime":38.64705882352941,"audioSegment":0},{"text":"{ \"source\": \"workspace\", \"path\": \"media\", \"subtree\": true },","startTime":38.64705882352941,"endTime":41.470588235294116,"audioSegment":0},{"text":"{ \"source\": \"artifacts\", \"path\": \"summary.json\" } ],","startTime":41.470588235294116,"endTime":44.294117647058826,"audioSegment":0},{"text":"\"tools\": [\"page_refresh_summary\"] } }","startTime":44.294117647058826,"endTime":47.11764705882353,"audioSegment":0},{"text":"The entry is relative to pages/.","startTime":47.11764705882353,"endTime":49.94117647058823,"audioSegment":0},{"text":"Reads are project-relative; workspace and artifacts are different trees.","startTime":49.94117647058823,"endTime":52.76470588235294,"audioSegment":0},{"text":"An exact-file grant does not grant the surrounding directory.","startTime":52.76470588235294,"endTime":55.58823529411765,"audioSegment":0},{"text":"A folder explorer can deliberately grant {\"source\":\"workspace\",\"path\":\".\",\"subtree\":true} for the whole selected project folder.","startTime":55.58823529411765,"endTime":58.411764705882355,"audioSegment":0},{"text":"The host checks the grants and path containment.","startTime":58.411764705882355,"endTime":61.23529411764706,"audioSegment":0},{"text":"It binds the project;","startTime":61.23529411764706,"endTime":64.05882352941177,"audioSegment":0},{"text":"a page never supplies its own project id to escape that boundary.","startTime":64.05882352941177,"endTime":66.88235294117646,"audioSegment":0},{"text":"Every pages.tools name must also be declared in the type's tools array.","startTime":66.88235294117646,"endTime":69.70588235294119,"audioSegment":0},{"text":"Those names are page-only: they are removed from the model's tool roster.","startTime":69.70588235294119,"endTime":72.52941176470588,"audioSegment":0},{"text":"If both the page and a gezel need an action,","startTime":72.52941176470588,"endTime":75.3529411764706,"audioSegment":0},{"text":"declare two tool names sharing the same script and bound operation.","startTime":75.3529411764706,"endTime":78.1764705882353,"audioSegment":0},{"text":"A declared action still needs the script's capabilities and the user's project policy to permit it.","startTime":78.1764705882353,"endTime":81,"audioSegment":0},{"text":"Job API Important behavior","startTime":81,"endTime":83.38888888888889,"audioSegment":0},{"text":"Identify the app instance gezel.page Type name,","startTime":83.38888888888889,"endTime":85.77777777777777,"audioSegment":0},{"text":"params, project id, API version, and host mode","startTime":85.77777777777777,"endTime":88.16666666666667,"audioSegment":0},{"text":"List a folder gezel.data.list(path, opts?) One directory at a time;","startTime":88.16666666666667,"endTime":90.55555555555556,"audioSegment":0},{"text":"recursion and scan bounds belong to the page","startTime":90.55555555555556,"endTime":92.94444444444444,"audioSegment":0},{"text":"Read small state gezel.data.read(path, opts?) JSON, text, or bytes; bounded reads","startTime":92.94444444444444,"endTime":95.33333333333333,"audioSegment":0},{"text":"Follow changes gezel.data.watch(path, callback, opts?) Callback signals a change;","startTime":95.33333333333333,"endTime":97.72222222222223,"audioSegment":0},{"text":"re-read the data; retain the unsubscribe function","startTime":97.72222222222223,"endTime":100.11111111111111,"audioSegment":0},{"text":"Display media gezel.data.url(path, opts?) Assign to an image/audio/video element;","startTime":100.11111111111111,"endTime":102.5,"audioSegment":0},{"text":"hosted media can stream and seek","startTime":102.5,"endTime":104.88888888888889,"audioSegment":0},{"text":"Open the original in Gezel gezel.data.open(path,","startTime":104.88888888888889,"endTime":107.27777777777777,"audioSegment":0},{"text":"opts?) Navigates to the existing file rendition in embedded mode","startTime":107.27777777777777,"endTime":109.66666666666666,"audioSegment":0},{"text":"Render a consistent file tile or row gezel.ui.components.fileCard(mount,","startTime":109.66666666666666,"endTime":112.05555555555556,"audioSegment":0},{"text":"options) Thumbnail/fallback, metadata, keyboard action and existing file viewer","startTime":112.05555555555556,"endTime":114.44444444444444,"audioSegment":0},{"text":"Add files with a picker or drop gezel.ui.components.fileAdder(mount,","startTime":114.44444444444444,"endTime":116.83333333333334,"audioSegment":0},{"text":"options) Explicit destination, progress, cancellation and per-file results","startTime":116.83333333333334,"endTime":119.22222222222223,"audioSegment":0},{"text":"Discover upload destinations gezel.data.importTargets() Manifest targets plus current write permission","startTime":119.22222222222223,"endTime":121.61111111111111,"audioSegment":0},{"text":"Copy selected files into a destination gezel.data.importFiles(files,","startTime":121.61111111111111,"endTime":124,"audioSegment":0},{"text":"options) Scoped, create-only uploads; returns saved paths and partial failures","startTime":124,"endTime":126.38888888888889,"audioSegment":0},{"text":"Find indexed datasets gezel.tables.list() Only tables whose source files are within the page's readable scope","startTime":126.38888888888889,"endTime":128.77777777777777,"audioSegment":0},{"text":"Inspect columns gezel.tables.describe(tableName) Column types and available metadata","startTime":128.77777777777777,"endTime":131.16666666666666,"audioSegment":0},{"text":"Summarize or chart data gezel.tables.query(sql, opts?) Bounded,","startTime":131.16666666666666,"endTime":133.55555555555554,"audioSegment":0},{"text":"read-only DuckDB queries over permitted indexed tables","startTime":133.55555555555554,"endTime":135.94444444444446,"audioSegment":0},{"text":"Change state or run an action gezel.tools.invoke(name, input?) Schema-validated, declared script-backed action","startTime":135.94444444444446,"endTime":138.33333333333331,"audioSegment":0},{"text":"Follow the host theme gezel.ui.theme,","startTime":138.33333333333331,"endTime":140.72222222222223,"audioSegment":0},{"text":"gezel.ui.onTheme(callback) Apply at boot and keep the unsubscribe function","startTime":140.72222222222223,"endTime":143.11111111111111,"audioSegment":0},{"text":"Use the existing file rendition instead of rebuilding a spreadsheet or CSV editor in your page.","startTime":143.11111111111111,"endTime":145.5,"audioSegment":0},{"text":"Use the shared query API instead of bundling DuckDB or fetching observation storage files.","startTime":145.5,"endTime":147.88888888888889,"audioSegment":0},{"text":"Tables describe an indexed snapshot: listing a CSV does not guarantee a table is ready.","startTime":147.88888888888889,"endTime":150.27777777777777,"audioSegment":0},{"text":"Handle missing indexing and unavailable query engines explicitly.","startTime":150.27777777777777,"endTime":152.66666666666669,"audioSegment":0},{"text":"For a simple live list, wire a change signal to a fresh read,","startTime":152.66666666666669,"endTime":155.05555555555554,"audioSegment":0},{"text":"and treat filenames as text:","startTime":155.05555555555554,"endTime":157.44444444444446,"audioSegment":0},{"text":"// Use the injected host or initialize sample handlers through the demo bootstrap.","startTime":157.44444444444446,"endTime":159.83333333333331,"audioSegment":0},{"text":"const list = document.querySelector('#files');","startTime":159.83333333333331,"endTime":162.22222222222223,"audioSegment":0},{"text":"const status = document.querySelector('#status');","startTime":162.22222222222223,"endTime":164.61111111111111,"audioSegment":0},{"text":"let revision = 0;","startTime":164.61111111111111,"endTime":167,"audioSegment":0},{"text":"async function refresh() {","startTime":167,"endTime":169.38888888888889,"audioSegment":0},{"text":"const request = ++revision; try {","startTime":169.38888888888889,"endTime":171.77777777777777,"audioSegment":0},{"text":"const entries = await gezel.data.list('media');","startTime":171.77777777777777,"endTime":174.16666666666669,"audioSegment":0},{"text":"if (request !== revision) return;","startTime":174.16666666666669,"endTime":176.55555555555554,"audioSegment":0},{"text":"list.replaceChildren(...entries.map((entry) => {","startTime":176.55555555555554,"endTime":178.94444444444446,"audioSegment":0},{"text":"const row = document.createElement('li');","startTime":178.94444444444446,"endTime":181.33333333333331,"audioSegment":0},{"text":"row.textContent = entry.name; return row; }));","startTime":181.33333333333331,"endTime":183.72222222222223,"audioSegment":0},{"text":"status.textContent = entries.length ?","startTime":183.72222222222223,"endTime":186.11111111111111,"audioSegment":0},{"text":"`${entries.length} items` : 'This folder is empty.';","startTime":186.11111111111111,"endTime":188.5,"audioSegment":0},{"text":"} catch (error) {","startTime":188.5,"endTime":190.88888888888889,"audioSegment":0},{"text":"if (request === revision) status.textContent = `Could not read this folder: ${error.message}`; } }","startTime":190.88888888888889,"endTime":193.27777777777777,"audioSegment":0},{"text":"const stop = gezel.data.watch('media', refresh, { intervalMs: 15000 });","startTime":193.27777777777777,"endTime":195.66666666666666,"audioSegment":0},{"text":"window.addEventListener('pagehide', () => { revision++; stop(); }, { once: true });","startTime":195.66666666666666,"endTime":198.05555555555554,"audioSegment":0},{"text":"void refresh();","startTime":198.05555555555554,"endTime":200.44444444444446,"audioSegment":0},{"text":"Do not treat the watch callback's {path, etag} as the file's contents.","startTime":200.44444444444446,"endTime":202.83333333333331,"audioSegment":0},{"text":"Avoid overlapping whole-folder scans and unbounded watchers.","startTime":202.83333333333331,"endTime":205.22222222222223,"audioSegment":0},{"text":"The browser fallback interval is configurable;","startTime":205.22222222222223,"endTime":207.61111111111111,"audioSegment":0},{"text":"embedded watches use the host's shared mechanism.","startTime":207.61111111111111,"endTime":210,"audioSegment":0},{"text":"Host Files/media Tools File viewer Tables","startTime":210,"endTime":212.8846153846154,"audioSegment":0},{"text":"Desktop Output pane (embedded) Scoped access Declared actions data.open() When the query engine and index are available","startTime":212.8846153846154,"endTime":215.76923076923077,"audioSegment":0},{"text":"Authenticated mini-site (serve) Scoped access Declared actions Unavailable When the query engine and index are available","startTime":215.76923076923077,"endTime":218.65384615384616,"audioSegment":0},{"text":"Capability preview tab (browser) Capability-scoped fallback Unavailable Unavailable Unavailable","startTime":218.65384615384616,"endTime":221.53846153846155,"audioSegment":0},{"text":"Published or exported standalone demo (demo) Authored samples In-memory demo handlers Explain the live action Authored sample summaries, if provided","startTime":221.53846153846155,"endTime":224.42307692307693,"audioSegment":0},{"text":"Phone's embedded snapshot Scoped bridge with bounded media relay Supported portable actions Host-dependent;","startTime":224.42307692307693,"endTime":227.30769230769232,"audioSegment":0},{"text":"handle unavailable Unavailable in the portable runtime","startTime":227.30769230769232,"endTime":230.19230769230768,"audioSegment":0},{"text":"Feature-detect optional additions such as gezel.tables and gezel.data.open, then handle their errors.","startTime":230.19230769230768,"endTime":233.07692307692307,"audioSegment":0},{"text":"Mode alone is not a promise that every engine or codec is installed.","startTime":233.07692307692307,"endTime":235.96153846153845,"audioSegment":0},{"text":"Avoid offering an action that cannot work in the current mode.","startTime":235.96153846153845,"endTime":238.84615384615384,"audioSegment":0},{"text":"For standalone demos, the website publisher, local preview server,","startTime":238.84615384615384,"endTime":241.73076923076923,"audioSegment":0},{"text":"or offline exporter injects a shared bootstrap before app scripts.","startTime":241.73076923076923,"endTime":244.6153846153846,"audioSegment":0},{"text":"App source contains its UI and sample handlers,","startTime":244.6153846153846,"endTime":247.5,"audioSegment":0},{"text":"not a copied SDK, component runtime, or font set.","startTime":247.5,"endTime":250.3846153846154,"audioSegment":0},{"text":"Initialize with const api = window.gezel || window.makeDemoGezel({ page,","startTime":250.3846153846154,"endTime":253.26923076923077,"audioSegment":0},{"text":"tools, data, existingPaths });.","startTime":253.26923076923077,"endTime":256.15384615384613,"audioSegment":0},{"text":"In a real host the existing API wins; in a demo,","startTime":256.15384615384613,"endTime":259.03846153846155,"audioSegment":0},{"text":"the bootstrap installs the sample transport and api.ui.components.","startTime":259.03846153846155,"endTime":261.9230769230769,"audioSegment":0},{"text":"Import targets come from the manifest's pages.imports.","startTime":261.9230769230769,"endTime":264.8076923076923,"audioSegment":0},{"text":"Keep deterministic samples, a visible banner and Reset demo.","startTime":264.8076923076923,"endTime":267.6923076923077,"audioSegment":0},{"text":"A failed live call must remain a live error,","startTime":267.6923076923077,"endTime":270.5769230769231,"audioSegment":0},{"text":"not switch into demo mode.","startTime":270.5769230769231,"endTime":273.46153846153845,"audioSegment":0},{"text":"Pages have no daemon credentials, Node filesystem,","startTime":273.46153846153845,"endTime":276.3461538461538,"audioSegment":0},{"text":"unrestricted SQL connection, or arbitrary-path write API.","startTime":276.3461538461538,"endTime":279.2307692307692,"audioSegment":0},{"text":"Imports are a narrow exception for explicitly declared destinations.","startTime":279.2307692307692,"endTime":282.11538461538464,"audioSegment":0},{"text":"Stay on this shared surface.","startTime":282.11538461538464,"endTime":285,"audioSegment":0},{"text":"The host injects gezel.ui.components with the page API.","startTime":285,"endTime":287.71666666666664,"audioSegment":0},{"text":"It works with ordinary HTML and has no React dependency.","startTime":287.71666666666664,"endTime":290.43333333333334,"audioSegment":0},{"text":"Pass a selector or an element;","startTime":290.43333333333334,"endTime":293.15,"audioSegment":0},{"text":"the component appends its own custom element with a shadow root.","startTime":293.15,"endTime":295.8666666666667,"audioSegment":0},{"text":"Retain its handle and call destroy() before discarding it.","startTime":295.8666666666667,"endTime":298.5833333333333,"audioSegment":0},{"text":"update(partialOptions) updates an existing instance.","startTime":298.5833333333333,"endTime":301.3,"audioSegment":0},{"text":"File adder handles also provide refresh() to recheck destination availability after a settings change.","startTime":301.3,"endTime":304.01666666666665,"audioSegment":0},{"text":"<div id=\"add-files\"></div>","startTime":304.01666666666665,"endTime":306.73333333333335,"audioSegment":0},{"text":"<div id=\"selected-file\"></div>","startTime":306.73333333333335,"endTime":309.45,"audioSegment":0},{"text":"const card = gezel.ui.components.fileCard('#selected-file', {","startTime":309.45,"endTime":312.1666666666667,"audioSegment":0},{"text":"file: { source: 'workspace', path: 'media/garden.jpg', size: 24576 },","startTime":312.1666666666667,"endTime":314.8833333333333,"audioSegment":0},{"text":"variant: 'tile', // 'row' for a compact list });","startTime":314.8833333333333,"endTime":317.6,"audioSegment":0},{"text":"const adder = gezel.ui.components.fileAdder('#add-files', {","startTime":317.6,"endTime":320.31666666666666,"audioSegment":0},{"text":"target: 'library',","startTime":320.31666666666666,"endTime":323.0333333333333,"audioSegment":0},{"text":"onAdded: async (savedFiles) => { await refreshListing(); }, });","startTime":323.0333333333333,"endTime":325.75,"audioSegment":0},{"text":"window.addEventListener('pagehide', () => { card.destroy(); adder.destroy(); });","startTime":325.75,"endTime":328.4666666666667,"audioSegment":0},{"text":"By default a card calls data.open and displays an error if the host viewer is unavailable.","startTime":328.4666666666667,"endTime":331.18333333333334,"audioSegment":0},{"text":"A gallery can supply onActivate(file) to show its own media preview;","startTime":331.18333333333334,"endTime":333.9,"audioSegment":0},{"text":"do not replace Gezel's spreadsheet/document renditions.","startTime":333.9,"endTime":336.6166666666667,"audioSegment":0},{"text":"thumbnail: false disables automatic image thumbnails;","startTime":336.6166666666667,"endTime":339.3333333333333,"audioSegment":0},{"text":"an explicit URL selects a local demo illustration.","startTime":339.3333333333333,"endTime":342.05,"audioSegment":0},{"text":"Filenames render as text.","startTime":342.05,"endTime":344.76666666666665,"audioSegment":0},{"text":"Components inherit --font-ui and track ui.onTheme; see the style guide.","startTime":344.76666666666665,"endTime":347.48333333333335,"audioSegment":0},{"text":"Declare destinations in the project type, separately from readable files: { \"pages\": {","startTime":347.48333333333335,"endTime":350.2,"audioSegment":0},{"text":"\"entry\": \"index.html\", \"api\": 1,","startTime":350.2,"endTime":352.9166666666667,"audioSegment":0},{"text":"\"reads\": [{ \"source\": \"workspace\", \"path\": \"media\", \"subtree\": true }], \"imports\": [{","startTime":352.9166666666667,"endTime":355.6333333333333,"audioSegment":0},{"text":"\"id\": \"library\", \"source\": \"workspace\", \"path\": \"media\",","startTime":355.6333333333333,"endTime":358.35,"audioSegment":0},{"text":"\"accept\": [\".jpg\", \".png\", \".mp4\"], \"maxFileBytes\": 268435456 }] } }","startTime":358.35,"endTime":361.06666666666666,"audioSegment":0},{"text":"Imports support workspace destinations only.","startTime":361.06666666666666,"endTime":363.7833333333333,"audioSegment":0},{"text":"path: \".\" means the project's selected folder.","startTime":363.7833333333333,"endTime":366.5,"audioSegment":0},{"text":"accept is an optional extension allowlist;","startTime":366.5,"endTime":369.2166666666667,"audioSegment":0},{"text":"the host enforces it and the byte limit independently of picker hints.","startTime":369.2166666666667,"endTime":371.93333333333334,"audioSegment":0},{"text":"An import declaration does not grant read access or override managed workspace writes. In particular,","startTime":371.93333333333334,"endTime":374.65,"audioSegment":0},{"text":"an external folder still needs the user's existing write opt-in in Project Settings.","startTime":374.65,"endTime":377.3666666666667,"audioSegment":0},{"text":"There is no page-facing bypass or permission toggle.","startTime":377.3666666666667,"endTime":380.08333333333337,"audioSegment":0},{"text":"Use the adder for the usual flow.","startTime":380.08333333333337,"endTime":382.8,"audioSegment":0},{"text":"A custom UI can call data.importFiles(File[], { target, signal, onProgress }); each result is { ok: true,","startTime":382.8,"endTime":385.51666666666665,"audioSegment":0},{"text":"name, file: { source, path, name, size, mtime } } or { ok: false, name, error }.","startTime":385.51666666666665,"endTime":388.23333333333335,"audioSegment":0},{"text":"onProgress reports { completed, total, name } per file, not bytes.","startTime":388.23333333333335,"endTime":390.95,"audioSegment":0},{"text":"Save the returned paths: duplicates become name (1).ext,","startTime":390.95,"endTime":393.6666666666667,"audioSegment":0},{"text":"and existing files are never overwritten.","startTime":393.6666666666667,"endTime":396.3833333333333,"audioSegment":0},{"text":"Originals stay where the user selected them.","startTime":396.3833333333333,"endTime":399.1,"audioSegment":0},{"text":"Cancel stops pending work and does not undo files already saved.","startTime":399.1,"endTime":401.81666666666666,"audioSegment":0},{"text":"A file that finished committing as cancellation arrived may already exist;","startTime":401.81666666666666,"endTime":404.5333333333333,"audioSegment":0},{"text":"refresh the listing to reconcile.","startTime":404.5333333333333,"endTime":407.25,"audioSegment":0},{"text":"The current limits are 100 files per batch, 256 MiB per file (a target may lower it), two active uploads per project,","startTime":407.25,"endTime":409.9666666666667,"audioSegment":0},{"text":"four per daemon, 120 attempts per project per minute, and a five-minute upload deadline.","startTime":409.9666666666667,"endTime":412.68333333333334,"audioSegment":0},{"text":"The server streams bytes to private temporary storage, validates scopes and paths,","startTime":412.68333333333334,"endTime":415.4,"audioSegment":0},{"text":"rechecks the destination and write policy at commit, and publishes atomically through the Store.","startTime":415.4,"endTime":418.1166666666667,"audioSegment":0},{"text":"It rejects traversal, symlink escapes, hidden/reserved names, and alternate streams.","startTime":418.1166666666667,"endTime":420.83333333333337,"audioSegment":0},{"text":"Imports never accept host source paths from a page.","startTime":420.83333333333337,"endTime":423.55,"audioSegment":0},{"text":"Live imports currently require the embedded desktop host.","startTime":423.55,"endTime":426.26666666666665,"audioSegment":0},{"text":"Browser tabs, phone snapshots and app-serve visitors get an explicit unavailable state;","startTime":426.26666666666665,"endTime":428.98333333333335,"audioSegment":0},{"text":"a shareable site's read capability never grants uploads.","startTime":428.98333333333335,"endTime":431.70000000000005,"audioSegment":0},{"text":"Components themselves work across these hosts.","startTime":431.70000000000005,"endTime":434.4166666666667,"audioSegment":0},{"text":"Always handle unsupported hosts and permission failures without silently enabling demo mode.","startTime":434.4166666666667,"endTime":437.1333333333333,"audioSegment":0},{"text":"After onAdded, refresh the app's listing.","startTime":437.1333333333333,"endTime":439.85,"audioSegment":0},{"text":"Ordinary workspace indexing follows asynchronously,","startTime":439.85,"endTime":442.56666666666666,"audioSegment":0},{"text":"so a newly added spreadsheet may appear before its DuckDB tables are ready.","startTime":442.56666666666666,"endTime":445.2833333333333,"audioSegment":0},{"text":"Keep the indexing/empty state and normal table refresh behavior.","startTime":445.2833333333333,"endTime":448,"audioSegment":0},{"text":"The demo host supplies the components and shared fonts before app code.","startTime":448,"endTime":450.74074074074076,"audioSegment":0},{"text":"Keep the visible banner and Reset demo control. For Gilde,","startTime":450.74074074074076,"endTime":453.48148148148147,"audioSegment":0},{"text":"use npm run demos or npm run export-page-demo -- <id> --out <new-directory>.","startTime":453.48148148148147,"endTime":456.22222222222223,"audioSegment":0},{"text":"For private source folders, run gezel app demo .","startTime":456.22222222222223,"endTime":458.962962962963,"audioSegment":0},{"text":"--out ../my-app-demo and open its generated entry under pages/;","startTime":458.962962962963,"endTime":461.7037037037037,"audioSegment":0},{"text":"the output works offline without a daemon.","startTime":461.7037037037037,"endTime":464.44444444444446,"audioSegment":0},{"text":"The website uses shared, content-hashed assets;","startTime":464.44444444444446,"endTime":467.18518518518516,"audioSegment":0},{"text":"each offline export contains its own generated asset set.","startTime":467.18518518518516,"endTime":469.9259259259259,"audioSegment":0},{"text":"Do not double-click the unprocessed source page or add platform files to its pages/ tree.","startTime":469.9259259259259,"endTime":472.6666666666667,"audioSegment":0},{"text":"const api = window.gezel || window.makeDemoGezel({","startTime":472.6666666666667,"endTime":475.4074074074074,"audioSegment":0},{"text":"page: { typeName: 'My library' },","startTime":475.4074074074074,"endTime":478.14814814814815,"audioSegment":0},{"text":"existingPaths: samples.map(file => file.path),","startTime":478.14814814814815,"endTime":480.8888888888889,"audioSegment":0},{"text":"// data and tools: app-owned sample handlers, when needed });","startTime":480.8888888888889,"endTime":483.6296296296296,"audioSegment":0},{"text":"const components = api.ui.components;","startTime":483.6296296296296,"endTime":486.3703703703704,"audioSegment":0},{"text":"// Merge these into your representative sample listing after onAdded:","startTime":486.3703703703704,"endTime":489.1111111111111,"audioSegment":0},{"text":"const added = components.demo?.files() ?? [];","startTime":489.1111111111111,"endTime":491.85185185185185,"audioSegment":0},{"text":"// In your Reset demo handler,","startTime":491.85185185185185,"endTime":494.5925925925926,"audioSegment":0},{"text":"clear imported descriptors and release object URLs:","startTime":494.5925925925926,"endTime":497.3333333333333,"audioSegment":0},{"text":"components.demo?.reset();","startTime":497.3333333333333,"endTime":500.0740740740741,"audioSegment":0},{"text":"Demo imports exercise the same picker, drop, validation, progress and cards.","startTime":500.0740740740741,"endTime":502.81481481481484,"audioSegment":0},{"text":"They retain browser Files/object URLs in this tab,","startTime":502.81481481481484,"endTime":505.55555555555554,"audioSegment":0},{"text":"use deterministic metadata, and never write to disk or invoke a model.","startTime":505.55555555555554,"endTime":508.2962962962963,"audioSegment":0},{"text":"data.url resolves imported demo media.","startTime":508.2962962962963,"endTime":511.03703703703707,"audioSegment":0},{"text":"Reset the page's own sample state and remount the adder to clear its result list.","startTime":511.03703703703707,"endTime":513.7777777777778,"audioSegment":0},{"text":"Do not claim imported demo data was indexed: Data Analysis keeps its charts on labeled sample tables.","startTime":513.7777777777778,"endTime":516.5185185185185,"audioSegment":0},{"text":"React apps can mount either component in a ref inside an effect and call destroy() in cleanup.","startTime":516.5185185185185,"endTime":519.2592592592592,"audioSegment":0},{"text":"There is no separate React component implementation to keep in sync.","startTime":519.2592592592592,"endTime":522,"audioSegment":0}],"version":1},"startBlock":{"title":"Using the Gezel page APIs","subtitle":"A project type can ship pages/index.html with relative JavaScript, CSS, and assets. Gezel hosts that page in the project's Output pane and injects window.gezel before its scripts run. You build a normal browser interface; Gezel supplies project identity, scoped file access, declared actions, and the theme. You do not need a React component inside the desktop shell or a new service for each app.","ambientMotion":"zoomIn"}}</script>
