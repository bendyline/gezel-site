set":22821},"end":{"line":292,"column":555,"offset":22827}}},{"type":"text","value":" gives the shared answer that the preview follows a few sample requests. ","position":{"start":{"line":292,"column":555,"offset":22827},"end":{"line":292,"column":628,"offset":22900}}},{"type":"inlineCode","value":"reactions","position":{"start":{"line":292,"column":628,"offset":22900},"end":{"line":292,"column":639,"offset":22911}}},{"type":"text","value":", keyed by page tool, are the demo form of a manifest ","position":{"start":{"line":292,"column":639,"offset":22911},"end":{"line":292,"column":693,"offset":22965}}},{"type":"inlineCode","value":"reaction","position":{"start":{"line":292,"column":693,"offset":22965},"end":{"line":292,"column":703,"offset":22975}}},{"type":"text","value":": the person's page action summons a reply, and a game answers with the companion's move through its turn tool.","position":{"start":{"line":292,"column":703,"offset":22975},"end":{"line":292,"column":814,"offset":23086}}}],"position":{"start":{"line":292,"column":1,"offset":22273},"end":{"line":292,"column":814,"offset":23086}}},{"type":"paragraph","children":[{"type":"text","value":"The composer labels the replies as scripted, nothing leaves the page, and a live host never runs this code. Without a script the conversation greets the visitor and gives the shared answer, naming the crew lead's role when the exporter supplies it. A demo configured with ","position":{"start":{"line":294,"column":1,"offset":23088},"end":{"line":294,"column":273,"offset":23360}}},{"type":"inlineCode","value":"layout: 'pane'","position":{"start":{"line":294,"column":273,"offset":23360},"end":{"line":294,"column":289,"offset":23376}}},{"type":"text","value":" keeps the narrow Output-pane presentation.","position":{"start":{"line":294,"column":289,"offset":23376},"end":{"line":294,"column":332,"offset":23419}}}],"position":{"start":{"line":294,"column":1,"offset":23088},"end":{"line":294,"column":332,"offset":23419}}}]}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A project type can ship pages/index.html with relative JavaScript, CSS, and assets.","startTime":0,"endTime":4.125,"audioSegment":0},{"text":"Gezel hosts that page in the project's Output pane and injects window.gezel before its scripts run.","startTime":4.125,"endTime":8.25,"audioSegment":0},{"text":"You build a normal browser interface; Gezel supplies project identity,","startTime":8.25,"endTime":12.375,"audioSegment":0},{"text":"scoped file access, declared actions, and the theme.","startTime":12.375,"endTime":16.5,"audioSegment":0},{"text":"You do not need a React component inside the desktop shell or a new service for each app.","startTime":16.5,"endTime":20.625,"audioSegment":0},{"text":"Read Building AI Apps inside Gezel for the whole app and the app page style guide for injected fonts and page-owned styles.","startTime":20.625,"endTime":24.75,"audioSegment":0},{"text":"The complete Output Pane API reference owns method signatures, error codes, permissions, limits,","startTime":24.75,"endTime":28.875,"audioSegment":0},{"text":"and compatibility; the typed API is exported as @bendyline/gezel-sdk/page for authoring tools.","startTime":28.875,"endTime":33,"audioSegment":0},{"text":"This is a pages block inside a project type's version manifest: { \"pages\": {","startTime":33,"endTime":35.8235294117647,"audioSegment":0},{"text":"\"entry\": \"index.html\", \"api\": 1, \"reads\": [","startTime":35.8235294117647,"endTime":38.64705882352941,"audioSegment":0},{"text":"{ \"source\": \"workspace\", \"path\": \"media\", \"subtree\": true },","startTime":38.64705882352941,"endTime":41.470588235294116,"audioSegment":0},{"text":"{ \"source\": \"artifacts\", \"path\": \"summary.json\" } ],","startTime":41.470588235294116,"endTime":44.294117647058826,"audioSegment":0},{"text":"\"tools\": [\"page_refresh_summary\"] } }","startTime":44.294117647058826,"endTime":47.11764705882353,"audioSegment":0},{"text":"The entry is relative to pages/.","startTime":47.11764705882353,"endTime":49.94117647058823,"audioSegment":0},{"text":"Reads are project-relative; workspace and artifacts are different trees.","startTime":49.94117647058823,"endTime":52.76470588235294,"audioSegment":0},{"text":"An exact-file grant does not grant the surrounding directory.","startTime":52.76470588235294,"endTime":55.58823529411765,"audioSegment":0},{"text":"A folder explorer can deliberately grant {\"source\":\"workspace\",\"path\":\".\",\"subtree\":true} for the whole selected project folder.","startTime":55.58823529411765,"endTime":58.411764705882355,"audioSegment":0},{"text":"The host checks the grants and path containment.","startTime":58.411764705882355,"endTime":61.23529411764706,"audioSegment":0},{"text":"It binds the project;","startTime":61.23529411764706,"endTime":64.05882352941177,"audioSegment":0},{"text":"a page never supplies its own project id to escape that boundary.","startTime":64.05882352941177,"endTime":66.88235294117646,"audioSegment":0},{"text":"Every pages.tools name must also be declared in the type's tools array.","startTime":66.88235294117646,"endTime":69.70588235294119,"audioSegment":0},{"text":"Those names are page-only: they are removed from the model's tool roster.","startTime":69.70588235294119,"endTime":72.52941176470588,"audioSegment":0},{"text":"If both the page and the model need an action,","startTime":72.52941176470588,"endTime":75.3529411764706,"audioSegment":0},{"text":"declare two tool names sharing the same script and bound operation.","startTime":75.3529411764706,"endTime":78.1764705882353,"audioSegment":0},{"text":"A declared action still needs the script's capabilities and the user's project policy to permit it.","startTime":78.1764705882353,"endTime":81,"audioSegment":0},{"text":"Job API Important behavior","startTime":81,"endTime":83.38888888888889,"audioSegment":0},{"text":"Identify the app instance gezel.page Type name,","startTime":83.38888888888889,"endTime":85.77777777777777,"audioSegment":0},{"text":"params, project id, API version, and host mode","startTime":85.77777777777777,"endTime":88.16666666666667,"audioSegment":0},{"text":"List a folder gezel.data.list(path, opts?) One directory at a time;","startTime":88.16666666666667,"endTime":90.55555555555556,"audioSegment":0},{"text":"recursion and scan bounds belong to the page","startTime":90.55555555555556,"endTime":92.94444444444444,"audioSegment":0},{"text":"Read small state gezel.data.read(path, opts?) JSON, text, or bytes; bounded reads","startTime":92.94444444444444,"endTime":95.33333333333333,"audioSegment":0},{"text":"Follow changes gezel.data.watch(path, callback, opts?) Callback signals a change;","startTime":95.33333333333333,"endTime":97.72222222222223,"audioSegment":0},{"text":"re-read the data; retain the unsubscribe function","startTime":97.72222222222223,"endTime":100.11111111111111,"audioSegment":0},{"text":"Display media gezel.data.url(path, opts?) Assign to an image/audio/video element;","startTime":100.11111111111111,"endTime":102.5,"audioSegment":0},{"text":"hosted media can stream and seek","startTime":102.5,"endTime":104.88888888888889,"audioSegment":0},{"text":"Open the original in Gezel gezel.data.open(path,","startTime":104.88888888888889,"endTime":107.27777777777777,"audioSegment":0},{"text":"opts?) Navigates to the existing file rendition in embedded mode","startTime":107.27777777777777,"endTime":109.66666666666666,"audioSegment":0},{"text":"Render a consistent file tile or row gezel.ui.components.fileCard(mount,","startTime":109.66666666666666,"endTime":112.05555555555556,"audioSegment":0},{"text":"options) Thumbnail/fallback, metadata, keyboard action and existing file viewer","startTime":112.05555555555556,"endTime":114.44444444444444,"audioSegment":0},{"text":"Add files with a picker or drop gezel.ui.components.fileAdder(mount,","startTime":114.44444444444444,"endTime":116.83333333333334,"audioSegment":0},{"text":"options) Explicit destination, progress, cancellation and per-file results","startTime":116.83333333333334,"endTime":119.22222222222223,"audioSegment":0},{"text":"Discover upload destinations gezel.data.importTargets() Manifest targets plus current write permission","startTime":119.22222222222223,"endTime":121.61111111111111,"audioSegment":0},{"text":"Copy selected files into a destination gezel.data.importFiles(files,","startTime":121.61111111111111,"endTime":124,"audioSegment":0},{"text":"options) Scoped, create-only uploads; returns saved paths and partial failures","startTime":124,"endTime":126.38888888888889,"audioSegment":0},{"text":"Find indexed datasets gezel.tables.list() Only tables whose source files are within the page's readable scope","startTime":126.38888888888889,"endTime":128.77777777777777,"audioSegment":0},{"text":"Inspect columns gezel.tables.describe(tableName) Column types and available metadata","startTime":128.77777777777777,"endTime":131.16666666666666,"audioSegment":0},{"text":"Summarize or chart data gezel.tables.query(sql, opts?) Bounded,","startTime":131.16666666666666,"endTime":133.55555555555554,"audioSegment":0},{"text":"read-only DuckDB queries over permitted indexed tables","startTime":133.55555555555554,"endTime":135.94444444444446,"audioSegment":0},{"text":"Change state or run an action gezel.tools.invoke(name, input?) Schema-validated, declared script-backed action","startTime":135.94444444444446,"endTime":138.33333333333331,"audioSegment":0},{"text":"Follow the host theme gezel.ui.theme,","startTime":138.33333333333331,"endTime":140.72222222222223,"audioSegment":0},{"text":"gezel.ui.onTheme(callback) Apply at boot and keep the unsubscribe function","startTime":140.72222222222223,"endTime":143.11111111111111,"audioSegment":0},{"text":"Use the existing file rendition instead of rebuilding a spreadsheet or CSV editor in your page.","startTime":143.11111111111111,"endTime":145.5,"audioSegment":0},{"text":"Use the shared query API instead of bundling DuckDB or fetching observation storage files.","startTime":145.5,"endTime":147.88888888888889,"audioSegment":0},{"text":"Tables describe an indexed snapshot: listing a CSV does not guarantee a table is ready.","startTime":147.88888888888889,"endTime":150.27777777777777,"audioSegment":0},{"text":"Handle missing indexing and unavailable query engines explicitly.","startTime":150.27777777777777,"endTime":152.66666666666669,"audioSegment":0},{"text":"For a simple live list, wire a change signal to a fresh read,","startTime":152.66666666666669,"endTime":155.05555555555554,"audioSegment":0},{"text":"and treat filenames as text:","startTime":155.05555555555554,"endTime":157.44444444444446,"audioSegment":0},{"text":"// Use the injected host or initialize sample handlers through the demo bootstrap.","startTime":157.44444444444446,"endTime":159.83333333333331,"audioSegment":0},{"text":"const list = document.querySelector('#files');","startTime":159.83333333333331,"endTime":162.22222222222223,"audioSegment":0},{"text":"const status = document.querySelector('#status');","startTime":162.22222222222223,"endTime":164.61111111111111,"audioSegment":0},{"text":"let revision = 0;","startTime":164.61111111111111,"endTime":167,"audioSegment":0},{"text":"async function refresh() {","startTime":167,"endTime":169.38888888888889,"audioSegment":0},{"text":"const request = ++revision; try {","startTime":169.38888888888889,"endTime":171.77777777777777,"audioSegment":0},{"text":"const entries = await gezel.data.list('media');","startTime":171.77777777777777,"endTime":174.16666666666669,"audioSegment":0},{"text":"if (request !== revision) return;","startTime":174.16666666666669,"endTime":176.55555555555554,"audioSegment":0},{"text":"list.replaceChildren(...entries.map((entry) => {","startTime":176.55555555555554,"endTime":178.94444444444446,"audioSegment":0},{"text":"const row = document.createElement('li');","startTime":178.94444444444446,"endTime":181.33333333333331,"audioSegment":0},{"text":"row.textContent = entry.name; return row; }));","startTime":181.33333333333331,"endTime":183.72222222222223,"audioSegment":0},{"text":"status.textContent = entries.length ?","startTime":183.72222222222223,"endTime":186.11111111111111,"audioSegment":0},{"text":"`${entries.length} items` : 'This folder is empty.';","startTime":186.11111111111111,"endTime":188.5,"audioSegment":0},{"text":"} catch (error) {","startTime":188.5,"endTime":190.88888888888889,"audioSegment":0},{"text":"if (request === revision) status.textContent = `Could not read this folder: ${error.message}`; } }","startTime":190.88888888888889,"endTime":193.27777777777777,"audioSegment":0},{"text":"const stop = gezel.data.watch('media', refresh, { intervalMs: 15000 });","startTime":193.27777777777777,"endTime":195.66666666666666,"audioSegment":0},{"text":"window.addEventListener('pagehide', () => { revision++; stop(); }, { once: true });","startTime":195.66666666666666,"endTime":198.05555555555554,"audioSegment":0},{"text":"void refresh();","startTime":198.05555555555554,"endTime":200.44444444444446,"audioSegment":0},{"text":"Do not treat the watch callback's {path, etag} as the file's contents.","startTime":200.44444444444446,"endTime":202.83333333333331,"audioSegment":0},{"text":"Avoid overlapping whole-folder scans and unbounded watchers.","startTime":202.83333333333331,"endTime":205.22222222222223,"audioSegment":0},{"text":"The browser fallback interval is configurable;","startTime":205.22222222222223,"endTime":207.61111111111111,"audioSegment":0},{"text":"embedded watches use the host's shared mechanism.","startTime":207.61111111111111,"endTime":210,"audioSegment":0},{"text":"Host Files/media Tools File viewer Tables","startTime":210,"endTime":212.8846153846154,"audioSegment":0},{"text":"Desktop Output pane (embedded) Scoped access Declared actions data.open() When the query engine and index are available","startTime":212.8846153846154,"endTime":215.76923076923077,"audioSegment":0},{"text":"Authenticated mini-site (serve) Scoped access Declared actions Unavailable When the query engine and index are available","startTime":215.76923076923077,"endTime":218.65384615384616,"audioSegment":0},{"text":"Capability preview tab (browser) Capability-scoped fallback Unavailable Unavailable Unavailable","startTime":218.65384615384616,"endTime":221.53846153846155,"audioSegment":0},{"text":"Published or exported standalone demo (demo) Authored samples In-memory demo handlers Explain the live action Authored sample summaries, if provided","startTime":221.53846153846155,"endTime":224.42307692307693,"audioSegment":0},{"text":"Phone's embedded snapshot Scoped bridge with bounded media relay Supported portable actions Host-dependent;","startTime":224.42307692307693,"endTime":227.30769230769232,"audioSegment":0},{"text":"handle unavailable Unavailable in the portable runtime","startTime":227.30769230769232,"endTime":230.19230769230768,"audioSegment":0},{"text":"Feature-detect optional additions such as gezel.tables and gezel.data.open, then handle their errors.","startTime":230.19230769230768,"endTime":233.07692307692307,"audioSegment":0},{"text":"Mode alone is not a promise that every engine or codec is installed.","startTime":233.07692307692307,"endTime":235.96153846153845,"audioSegment":0},{"text":"Avoid offering an action that cannot work in the current mode.","startTime":235.96153846153845,"endTime":238.84615384615384,"audioSegment":0},{"text":"For standalone demos, the website publisher, local preview server,","startTime":238.84615384615384,"endTime":241.73076923076923,"audioSegment":0},{"text":"or offline exporter injects a shared bootstrap before app scripts.","startTime":241.73076923076923,"endTime":244.6153846153846,"audioSegment":0},{"text":"App source contains its UI and sample handlers,","startTime":244.6153846153846,"endTime":247.5,"audioSegment":0},{"text":"not a copied SDK, component runtime, or font set.","startTime":247.5,"endTime":250.3846153846154,"audioSegment":0},{"text":"Initialize with const api = window.gezel || window.makeDemoGezel({ page,","startTime":250.3846153846154,"endTime":253.26923076923077,"audioSegment":0},{"text":"tools, data, existingPaths });.","startTime":253.26923076923077,"endTime":256.15384615384613,"audioSegment":0},{"text":"In a real host the existing API wins; in a demo,","startTime":256.15384615384613,"endTime":259.03846153846155,"audioSegment":0},{"text":"the bootstrap installs the sample transport and api.ui.components.","startTime":259.03846153846155,"endTime":261.9230769230769,"audioSegment":0},{"text":"Import targets come from the manifest's pages.imports.","startTime":261.9230769230769,"endTime":264.8076923076923,"audioSegment":0},{"text":"Keep deterministic samples, a visible banner and Reset demo.","startTime":264.8076923076923,"endTime":267.6923076923077,"audioSegment":0},{"text":"A failed live call must remain a live error,","startTime":267.6923076923077,"endTime":270.5769230769231,"audioSegment":0},{"text":"not switch into demo mode.","startTime":270.5769230769231,"endTime":273.46153846153845,"audioSegment":0},{"text":"Pages have no daemon credentials, Node filesystem,","startTime":273.46153846153845,"endTime":276.3461538461538,"audioSegment":0},{"text":"unrestricted SQL connection, or arbitrary-path write API.","startTime":276.3461538461538,"endTime":279.2307692307692,"audioSegment":0},{"text":"Imports are a narrow exception for explicitly declared destinations.","startTime":279.2307692307692,"endTime":282.11538461538464,"audioSegment":0},{"text":"Stay on this shared surface.","startTime":282.11538461538464,"endTime":285,"audioSegment":0},{"text":"Read gezel.ui.layout at boot and subscribe with gezel.ui.onLayout(callback).","startTime":285,"endTime":287.48275862068965,"audioSegment":0},{"text":"The snapshot contains fullscreen, width, and height in CSS pixels.","startTime":287.48275862068965,"endTime":289.9655172413793,"audioSegment":0},{"text":"In the Output pane,","startTime":289.9655172413793,"endTime":292.44827586206895,"audioSegment":0},{"text":"fullscreen means the page is maximized inside the Gezel window's main workspace.","startTime":292.44827586206895,"endTime":294.9310344827586,"audioSegment":0},{"text":"The project sidebar stays available on its configured side,","startTime":294.9310344827586,"endTime":297.41379310344826,"audioSegment":0},{"text":"expanded or collapsed as the user left it.","startTime":297.41379310344826,"endTime":299.8965517241379,"audioSegment":0},{"text":"Each project remembers whether its page is closed, open,","startTime":299.8965517241379,"endTime":302.37931034482756,"audioSegment":0},{"text":"or fullscreen when revisited, including after a restart.","startTime":302.37931034482756,"endTime":304.86206896551727,"audioSegment":0},{"text":"It does not mean that the operating system window is maximized.","startTime":304.86206896551727,"endTime":307.3448275862069,"audioSegment":0},{"text":"The same page stays mounted across maximize/restore; game state and drafts survive.","startTime":307.3448275862069,"endTime":309.82758620689657,"audioSegment":0},{"text":"The initial fullscreen value is false until the host handshake arrives.","startTime":309.82758620689657,"endTime":312.3103448275862,"audioSegment":0},{"text":"Browser, serve, and demo pages follow the browser Fullscreen API instead.","startTime":312.3103448275862,"endTime":314.7931034482759,"audioSegment":0},{"text":"The root also receives data-gezel-fullscreen=\"true\" or \"false\" for CSS.","startTime":314.7931034482759,"endTime":317.2758620689655,"audioSegment":0},{"text":"Mount native chat with gezel.ui.components.chat(element, options).","startTime":317.2758620689655,"endTime":319.7586206896552,"audioSegment":0},{"text":"Give the mount an explicit height.","startTime":319.7586206896552,"endTime":322.2413793103448,"audioSegment":0},{"text":"The handle has element, update(partialOptions), destroy(),","startTime":322.2413793103448,"endTime":324.7241379310345,"audioSegment":0},{"text":"and ready (a promise that rejects when the host cannot mount it).","startTime":324.7241379310345,"endTime":327.2068965517241,"audioSegment":0},{"text":"Keep the mount in the document and hide it with CSS to preserve its current conversation.","startTime":327.2068965517241,"endTime":329.6896551724138,"audioSegment":0},{"text":"Destroy it when permanently discarding it.","startTime":329.6896551724138,"endTime":332.17241379310343,"audioSegment":0},{"text":"const chat = gezel.ui.components.chat('#game-chat', {","startTime":332.17241379310343,"endTime":334.6551724137931,"audioSegment":0},{"text":"gezelRole: 'Opponent', // resolve a role from this project's crew","startTime":334.6551724137931,"endTime":337.1379310344828,"audioSegment":0},{"text":"lockRecipient: true,","startTime":337.1379310344828,"endTime":339.62068965517244,"audioSegment":0},{"text":"showAddress: false,","startTime":339.62068965517244,"endTime":342.1034482758621,"audioSegment":0},{"text":"showThreads: false,","startTime":342.1034482758621,"endTime":344.58620689655174,"audioSegment":0},{"text":"placeholder: 'Ask about a move…', });","startTime":344.58620689655174,"endTime":347.0689655172414,"audioSegment":0},{"text":"const arrange = ({ fullscreen, width }) => {","startTime":347.0689655172414,"endTime":349.55172413793105,"audioSegment":0},{"text":"document.querySelector('#game').classList.toggle('with-chat', fullscreen && width >= 800); };","startTime":349.55172413793105,"endTime":352.0344827586207,"audioSegment":0},{"text":"arrange(gezel.ui.layout);","startTime":352.0344827586207,"endTime":354.51724137931035,"audioSegment":0},{"text":"const stopLayout = gezel.ui.onLayout(arrange);","startTime":354.51724137931035,"endTime":357,"audioSegment":0},{"text":"window.addEventListener('pagehide', () => { stopLayout(); chat.destroy(); });","startTime":357,"endTime":359.48275862068965,"audioSegment":0},{"text":"#game { display: grid; min-height: 0; }","startTime":359.48275862068965,"endTime":361.9655172413793,"audioSegment":0},{"text":"#game-chat { display: none; height: 70vh; min-width: 0; }","startTime":361.9655172413793,"endTime":364.44827586206895,"audioSegment":0},{"text":"#game.with-chat { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 16px; }","startTime":364.44827586206895,"endTime":366.9310344827586,"audioSegment":0},{"text":"#game.with-chat #game-chat { display: block; }","startTime":366.9310344827586,"endTime":369.41379310344826,"audioSegment":0},{"text":"Use gezelId for an exact crew member, gezelRole for a role,","startTime":369.41379310344826,"endTime":371.8965517241379,"audioSegment":0},{"text":"or omit both to use the project's crew lead (then its first member).","startTime":371.8965517241379,"endTime":374.37931034482756,"audioSegment":0},{"text":"An unavailable requested recipient displays an error rather than silently choosing someone else.","startTime":374.37931034482756,"endTime":376.8620689655172,"audioSegment":0},{"text":"lockRecipient defaults to true and disables recipient switching and mention fan-out.","startTime":376.8620689655172,"endTime":379.3448275862069,"audioSegment":0},{"text":"showAddress and showThreads default to true.","startTime":379.3448275862069,"endTime":381.82758620689657,"audioSegment":0},{"text":"variant: 'composer' omits the timeline;","startTime":381.82758620689657,"endTime":384.3103448275862,"audioSegment":0},{"text":"the default 'chat' shows that recipient's project history.","startTime":384.3103448275862,"endTime":386.7931034482759,"audioSegment":0},{"text":"attachments, dictation, promptAssist, and expand default to false and can be enabled individually,","startTime":386.7931034482759,"endTime":389.2758620689655,"audioSegment":0},{"text":"subject to the host's capabilities.","startTime":389.2758620689655,"endTime":391.7586206896552,"audioSegment":0},{"text":"Chat currently requires the embedded Gezel host.","startTime":391.7586206896552,"endTime":394.2413793103448,"audioSegment":0},{"text":"Browser previews, app-serve visitors,","startTime":394.2413793103448,"endTime":396.7241379310345,"audioSegment":0},{"text":"and standalone demos show an explicit unavailable message; demos never call a model.","startTime":396.7241379310345,"endTime":399.2068965517241,"audioSegment":0},{"text":"The parent owns the native chat and composer, including their theme,","startTime":399.2068965517241,"endTime":401.6896551724138,"audioSegment":0},{"text":"accessibility, sessions, and ordinary permission prompts.","startTime":401.6896551724138,"endTime":404.1724137931035,"audioSegment":0},{"text":"Page scripts receive no transcript, input text, credentials, or programmatic send method.","startTime":404.1724137931035,"endTime":406.65517241379314,"audioSegment":0},{"text":"Options change presentation, not the recipient's tool authority.","startTime":406.65517241379314,"endTime":409.1379310344828,"audioSegment":0},{"text":"The slot follows layout, scrolling, and hidden containers.","startTime":409.1379310344828,"endTime":411.62068965517244,"audioSegment":0},{"text":"Keep it rectangular and untransformed;","startTime":411.62068965517244,"endTime":414.1034482758621,"audioSegment":0},{"text":"the host clips it to the page viewport.","startTime":414.1034482758621,"endTime":416.58620689655174,"audioSegment":0},{"text":"Page CSS cannot restyle chat internals,","startTime":416.58620689655174,"endTime":419.0689655172414,"audioSegment":0},{"text":"and page popovers cannot cover native chat: hide the slot while showing a page dialog that overlaps it.","startTime":419.0689655172414,"endTime":421.55172413793105,"audioSegment":0},{"text":"At most four slots can be mounted per page.","startTime":421.55172413793105,"endTime":424.0344827586207,"audioSegment":0},{"text":"Removing a slot from the document destroys it;","startTime":424.0344827586207,"endTime":426.51724137931035,"audioSegment":0},{"text":"create a new handle if you need to mount it again.","startTime":426.51724137931035,"endTime":429,"audioSegment":0},{"text":"gezel.ui.components.appLayout(main, options) wraps an existing content element without replacing its DOM.","startTime":429,"endTime":431.6,"audioSegment":0},{"text":"In fullscreen it opens a companion beside the content;","startTime":431.6,"endTime":434.2,"audioSegment":0},{"text":"below 900 CSS pixels the conversation stacks beneath it.","startTime":434.2,"endTime":436.8,"audioSegment":0},{"text":"Restoring the pane, hiding the conversation,","startTime":436.8,"endTime":439.4,"audioSegment":0},{"text":"or opening a native page dialog retains the conversation and its draft.","startTime":439.4,"endTime":442,"audioSegment":0},{"text":"The component hides the native slot while a visible page dialog is open,","startTime":442,"endTime":444.6,"audioSegment":0},{"text":"since iframe content cannot cover host-owned chat.","startTime":444.6,"endTime":447.2,"audioSegment":0},{"text":"const workspace = gezel.ui.components.appLayout('main', {","startTime":447.2,"endTime":449.8,"audioSegment":0},{"text":"title: 'Practice with your tutor',","startTime":449.8,"endTime":452.4,"audioSegment":0},{"text":"description: 'Choose a scene, then talk here.',","startTime":452.4,"endTime":455,"audioSegment":0},{"text":"chat: { showAddress: false, lockRecipient: true, dictation: true }, });","startTime":455,"endTime":457.6,"audioSegment":0},{"text":"chat: false gives a file-only application room to expand without recruiting a companion.","startTime":457.6,"endTime":460.2,"audioSegment":0},{"text":"Multi-person crews can use lockRecipient: false, showAddress: true.","startTime":460.2,"endTime":462.8,"audioSegment":0},{"text":"The page still owns its content, typography choices, and domain layout.","startTime":462.8,"endTime":465.4,"audioSegment":0},{"text":"Feature detect appLayout when supporting older hosts.","startTime":465.4,"endTime":468,"audioSegment":0},{"text":"Retain the handle and call destroy() if discarding the workspace;","startTime":468,"endTime":470.6,"audioSegment":0},{"text":"it also cleans up on pagehide.","startTime":470.6,"endTime":473.2,"audioSegment":0},{"text":"Use actionForm for a compact,","startTime":473.2,"endTime":475.8,"audioSegment":0},{"text":"accessible form that invokes one declared page tool.","startTime":475.8,"endTime":478.4,"audioSegment":0},{"text":"It validates required fields, numbers and dates;","startTime":478.4,"endTime":481,"audioSegment":0},{"text":"serializes one save at a time; and retains entered values after a failure.","startTime":481,"endTime":483.6,"audioSegment":0},{"text":"Fields can be text, number, date, URL, multiline text, or a selection.","startTime":483.6,"endTime":486.2,"audioSegment":0},{"text":"mapInput can map a simple form into the tool's input schema.","startTime":486.2,"endTime":488.8,"audioSegment":0},{"text":"It does not change the page's authority.","startTime":488.8,"endTime":491.4,"audioSegment":0},{"text":"const form = gezel.ui.components.actionForm('#add-guest', {","startTime":491.4,"endTime":494,"audioSegment":0},{"text":"title: 'Add a guest', tool: 'page_add_guest', fields: [","startTime":494,"endTime":496.6,"audioSegment":0},{"text":"{ name: 'name', label: 'Guest or household', required: true },","startTime":496.6,"endTime":499.2,"audioSegment":0},{"text":"{ name: 'party', label: 'Party size',","startTime":499.2,"endTime":501.8,"audioSegment":0},{"text":"type: 'number', min: 1, step: 1, required: true }, ],","startTime":501.8,"endTime":504.4,"audioSegment":0},{"text":"onSaved: () => refreshGuests(), });","startTime":504.4,"endTime":507,"audioSegment":0},{"text":"On a current host, draw actions as keys that open dialogs,","startTime":507,"endTime":509.6,"audioSegment":0},{"text":"following the app UX guide.","startTime":509.6,"endTime":512.2,"audioSegment":0},{"text":"A row's own key can open the same dialog filled in for that record:","startTime":512.2,"endTime":514.8,"audioSegment":0},{"text":"const components = gezel.ui.components;","startTime":514.8,"endTime":517.4,"audioSegment":0},{"text":"const modern = components.version >= 2;","startTime":517.4,"endTime":520,"audioSegment":0},{"text":"const addGuest = components.actionForm('#guest-actions', {","startTime":520,"endTime":522.6,"audioSegment":0},{"text":"title: 'Add a guest', tool: 'page_add_guest', presentation: 'dialog', primary: true,","startTime":522.6,"endTime":525.2,"audioSegment":0},{"text":"submitLabel: 'Add guest', fields: [","startTime":525.2,"endTime":527.8,"audioSegment":0},{"text":"{ name: 'name', label: 'Guest or household', required: true },","startTime":527.8,"endTime":530.4,"audioSegment":0},{"text":"{ name: 'party', label: 'Party size',","startTime":530.4,"endTime":533,"audioSegment":0},{"text":"type: 'number', min: 1, step: 1, required: true }, ],","startTime":533,"endTime":535.6,"audioSegment":0},{"text":"onSaved: () => refreshGuests(), });","startTime":535.6,"endTime":538.2,"audioSegment":0},{"text":"function editParty(guest) {","startTime":538.2,"endTime":540.8,"audioSegment":0},{"text":"if (modern) addGuest.open({ name: guest.name, party: guest.party }); }","startTime":540.8,"endTime":543.4,"audioSegment":0},{"text":"presentation: 'inline' draws an always-open form for a settings panel;","startTime":543.4,"endTime":546,"audioSegment":0},{"text":"call reset(values) with the saved values after each read so it shows what is set now.","startTime":546,"endTime":548.6,"audioSegment":0},{"text":"Older hosts ignore presentation and draw a disclosure,","startTime":548.6,"endTime":551.2,"audioSegment":0},{"text":"so keep the action reachable there and feature-detect open.","startTime":551.2,"endTime":553.8,"audioSegment":0},{"text":"tabs organizes a workspace into page-owned panels.","startTime":553.8,"endTime":556.4,"audioSegment":0},{"text":"Put the summary tiles and main view on Home,","startTime":556.4,"endTime":559,"audioSegment":0},{"text":"one noun per tab, and Settings last:","startTime":559,"endTime":561.6,"audioSegment":0},{"text":"const tabs = gezel.ui.components.tabs('#tabs', {","startTime":561.6,"endTime":564.2,"audioSegment":0},{"text":"label: 'Guest list', tabs: [","startTime":564.2,"endTime":566.8,"audioSegment":0},{"text":"{ id: 'home', label: 'Home', panel: '#home' },","startTime":566.8,"endTime":569.4,"audioSegment":0},{"text":"{ id: 'guests', label: 'Guests', panel: '#guests', badge: awaitingReply },","startTime":569.4,"endTime":572,"audioSegment":0},{"text":"{ id: 'settings', label: 'Settings', panel: '#settings' }, ], });","startTime":572,"endTime":574.6,"audioSegment":0},{"text":"The component only labels, shows,","startTime":574.6,"endTime":577.2,"audioSegment":0},{"text":"and hides the panels; the page owns their content.","startTime":577.2,"endTime":579.8,"audioSegment":0},{"text":"tabs.update({ tabs }) with new badges keeps keyboard focus.","startTime":579.8,"endTime":582.4,"audioSegment":0},{"text":"Destroy the handle with the view.","startTime":582.4,"endTime":585,"audioSegment":0},{"text":"Give the page its own alias when a model already uses the action: page_add_guest and add_guest share the same script and bindings,","startTime":585,"endTime":587.6,"audioSegment":0},{"text":"while only the former appears in pages.tools.","startTime":587.6,"endTime":590.2,"audioSegment":0},{"text":"Workspace policy, tool schema validation, and script permissions still apply.","startTime":590.2,"endTime":592.8,"audioSegment":0},{"text":"Forms do not write files directly.","startTime":592.8,"endTime":595.4,"audioSegment":0},{"text":"Standalone demos provide in-memory handlers for the same aliases.","startTime":595.4,"endTime":598,"audioSegment":0},{"text":"collectionFilter('#search', { container: '#guests', selector: 'li:not(.empty)', label: 'Find a guest', placeholder: 'Name or household',","startTime":598,"endTime":600.6,"audioSegment":0},{"text":"minItems: 8 }) adds accent-insensitive search over rendered records, shown once the list reaches minItems.","startTime":600.6,"endTime":603.2,"audioSegment":0},{"text":"It updates when the collection changes and preserves existing buttons and controls.","startTime":603.2,"endTime":605.8,"audioSegment":0},{"text":"It searches only those rendered items; describe pagination or truncation honestly.","startTime":605.8,"endTime":608.4,"audioSegment":0},{"text":"Keep the handle and destroy it with the view.","startTime":608.4,"endTime":611,"audioSegment":0},{"text":"The host injects gezel.ui.components with the page API.","startTime":611,"endTime":613.7166666666667,"audioSegment":0},{"text":"It works with ordinary HTML and has no React dependency.","startTime":613.7166666666667,"endTime":616.4333333333333,"audioSegment":0},{"text":"Pass a selector or an element;","startTime":616.4333333333333,"endTime":619.15,"audioSegment":0},{"text":"the component appends its own custom element with a shadow root.","startTime":619.15,"endTime":621.8666666666667,"audioSegment":0},{"text":"Retain its handle and call destroy() before discarding it.","startTime":621.8666666666667,"endTime":624.5833333333334,"audioSegment":0},{"text":"update(partialOptions) updates an existing instance.","startTime":624.5833333333334,"endTime":627.3,"audioSegment":0},{"text":"File adder handles also provide refresh() to recheck destination availability after a settings change.","startTime":627.3,"endTime":630.0166666666667,"audioSegment":0},{"text":"<div id=\"add-files\"></div>","startTime":630.0166666666667,"endTime":632.7333333333333,"audioSegment":0},{"text":"<div id=\"selected-file\"></div>","startTime":632.7333333333333,"endTime":635.45,"audioSegment":0},{"text":"const card = gezel.ui.components.fileCard('#selected-file', {","startTime":635.45,"endTime":638.1666666666666,"audioSegment":0},{"text":"file: { source: 'workspace', path: 'media/garden.jpg', size: 24576 },","startTime":638.1666666666666,"endTime":640.8833333333333,"audioSegment":0},{"text":"variant: 'tile', // 'row' for a compact list });","startTime":640.8833333333333,"endTime":643.6,"audioSegment":0},{"text":"const adder = gezel.ui.components.fileAdder('#add-files', {","startTime":643.6,"endTime":646.3166666666667,"audioSegment":0},{"text":"target: 'library',","startTime":646.3166666666667,"endTime":649.0333333333333,"audioSegment":0},{"text":"onAdded: async (savedFiles) => { await refreshListing(); }, });","startTime":649.0333333333333,"endTime":651.75,"audioSegment":0},{"text":"window.addEventListener('pagehide', () => { card.destroy(); adder.destroy(); });","startTime":651.75,"endTime":654.4666666666667,"audioSegment":0},{"text":"By default a card calls data.open and displays an error if the host viewer is unavailable.","startTime":654.4666666666667,"endTime":657.1833333333334,"audioSegment":0},{"text":"A gallery can supply onActivate(file) to show its own media preview;","startTime":657.1833333333334,"endTime":659.9,"audioSegment":0},{"text":"do not replace Gezel's spreadsheet/document renditions.","startTime":659.9,"endTime":662.6166666666667,"audioSegment":0},{"text":"thumbnail: false disables automatic image thumbnails;","startTime":662.6166666666667,"endTime":665.3333333333334,"audioSegment":0},{"text":"an explicit URL selects a local demo illustration.","startTime":665.3333333333334,"endTime":668.05,"audioSegment":0},{"text":"Filenames render as text.","startTime":668.05,"endTime":670.7666666666667,"audioSegment":0},{"text":"Components inherit --font-ui and track ui.onTheme; see the style guide.","startTime":670.7666666666667,"endTime":673.4833333333333,"audioSegment":0},{"text":"Declare destinations in the project type, separately from readable files: { \"pages\": {","startTime":673.4833333333333,"endTime":676.2,"audioSegment":0},{"text":"\"entry\": \"index.html\", \"api\": 1,","startTime":676.2,"endTime":678.9166666666666,"audioSegment":0},{"text":"\"reads\": [{ \"source\": \"workspace\", \"path\": \"media\", \"subtree\": true }], \"imports\": [{","startTime":678.9166666666666,"endTime":681.6333333333333,"audioSegment":0},{"text":"\"id\": \"library\", \"source\": \"workspace\", \"path\": \"media\",","startTime":681.6333333333333,"endTime":684.35,"audioSegment":0},{"text":"\"accept\": [\".jpg\", \".png\", \".mp4\"], \"maxFileBytes\": 268435456 }] } }","startTime":684.35,"endTime":687.0666666666666,"audioSegment":0},{"text":"Imports support workspace destinations only.","startTime":687.0666666666666,"endTime":689.7833333333333,"audioSegment":0},{"text":"path: \".\" means the project's selected folder.","startTime":689.7833333333333,"endTime":692.5,"audioSegment":0},{"text":"accept is an optional extension allowlist;","startTime":692.5,"endTime":695.2166666666667,"audioSegment":0},{"text":"the host enforces it and the byte limit independently of picker hints.","startTime":695.2166666666667,"endTime":697.9333333333334,"audioSegment":0},{"text":"An import declaration does not grant read access or override managed workspace writes. In particular,","startTime":697.9333333333334,"endTime":700.65,"audioSegment":0},{"text":"an external folder still needs the user's existing write opt-in in Project Settings.","startTime":700.65,"endTime":703.3666666666667,"audioSegment":0},{"text":"There is no page-facing bypass or permission toggle.","startTime":703.3666666666667,"endTime":706.0833333333334,"audioSegment":0},{"text":"Use the adder for the usual flow.","startTime":706.0833333333334,"endTime":708.8,"audioSegment":0},{"text":"A custom UI can call data.importFiles(File[], { target, signal, onProgress }); each result is { ok: true,","startTime":708.8,"endTime":711.5166666666667,"audioSegment":0},{"text":"name, file: { source, path, name, size, mtime } } or { ok: false, name, error }.","startTime":711.5166666666667,"endTime":714.2333333333333,"audioSegment":0},{"text":"onProgress reports { completed, total, name } per file, not bytes.","startTime":714.2333333333333,"endTime":716.95,"audioSegment":0},{"text":"Save the returned paths: duplicates become name (1).ext,","startTime":716.95,"endTime":719.6666666666666,"audioSegment":0},{"text":"and existing files are never overwritten.","startTime":719.6666666666666,"endTime":722.3833333333333,"audioSegment":0},{"text":"Originals stay where the user selected them.","startTime":722.3833333333333,"endTime":725.1,"audioSegment":0},{"text":"Cancel stops pending work and does not undo files already saved.","startTime":725.1,"endTime":727.8166666666667,"audioSegment":0},{"text":"A file that finished committing as cancellation arrived may already exist;","startTime":727.8166666666667,"endTime":730.5333333333333,"audioSegment":0},{"text":"refresh the listing to reconcile.","startTime":730.5333333333333,"endTime":733.25,"audioSegment":0},{"text":"The current limits are 100 files per batch, 256 MiB per file (a target may lower it), two active uploads per project,","startTime":733.25,"endTime":735.9666666666667,"audioSegment":0},{"text":"four per daemon, 120 attempts per project per minute, and a five-minute upload deadline.","startTime":735.9666666666667,"endTime":738.6833333333334,"audioSegment":0},{"text":"The server streams bytes to private temporary storage, validates scopes and paths,","startTime":738.6833333333334,"endTime":741.4,"audioSegment":0},{"text":"rechecks the destination and write policy at commit, and publishes atomically through the Store.","startTime":741.4,"endTime":744.1166666666667,"audioSegment":0},{"text":"It rejects traversal, symlink escapes, hidden/reserved names, and alternate streams.","startTime":744.1166666666667,"endTime":746.8333333333334,"audioSegment":0},{"text":"Imports never accept host source paths from a page.","startTime":746.8333333333334,"endTime":749.55,"audioSegment":0},{"text":"Live imports currently require the embedded desktop host.","startTime":749.55,"endTime":752.2666666666667,"audioSegment":0},{"text":"Browser tabs, phone snapshots and app-serve visitors get an explicit unavailable state;","startTime":752.2666666666667,"endTime":754.9833333333333,"audioSegment":0},{"text":"a shareable site's read capability never grants uploads.","startTime":754.9833333333333,"endTime":757.7,"audioSegment":0},{"text":"Components themselves work across these hosts.","startTime":757.7,"endTime":760.4166666666667,"audioSegment":0},{"text":"Always handle unsupported hosts and permission failures without silently enabling demo mode.","startTime":760.4166666666667,"endTime":763.1333333333333,"audioSegment":0},{"text":"After onAdded, refresh the app's listing.","startTime":763.1333333333333,"endTime":765.85,"audioSegment":0},{"text":"Ordinary workspace indexing follows asynchronously,","startTime":765.85,"endTime":768.5666666666666,"audioSegment":0},{"text":"so a newly added spreadsheet may appear before its DuckDB tables are ready.","startTime":768.5666666666666,"endTime":771.2833333333333,"audioSegment":0},{"text":"Keep the indexing/empty state and normal table refresh behavior.","startTime":771.2833333333333,"endTime":774,"audioSegment":0},{"text":"The demo host supplies the components and shared fonts before app code.","startTime":774,"endTime":776.7407407407408,"audioSegment":0},{"text":"Keep the visible banner and Reset demo control. For Gilde,","startTime":776.7407407407408,"endTime":779.4814814814815,"audioSegment":0},{"text":"use npm run demos or npm run export-page-demo -- <id> --out <new-directory>.","startTime":779.4814814814815,"endTime":782.2222222222222,"audioSegment":0},{"text":"For private source folders, run gezel app demo .","startTime":782.2222222222222,"endTime":784.9629629629629,"audioSegment":0},{"text":"--out ../my-app-demo and open its generated entry under pages/;","startTime":784.9629629629629,"endTime":787.7037037037037,"audioSegment":0},{"text":"the output works offline without a daemon.","startTime":787.7037037037037,"endTime":790.4444444444445,"audioSegment":0},{"text":"The website uses shared, content-hashed assets;","startTime":790.4444444444445,"endTime":793.1851851851852,"audioSegment":0},{"text":"each offline export contains its own generated asset set.","startTime":793.1851851851852,"endTime":795.925925925926,"audioSegment":0},{"text":"Do not double-click the unprocessed source page or add platform files to its pages/ tree.","startTime":795.925925925926,"endTime":798.6666666666666,"audioSegment":0},{"text":"const api = window.gezel || window.makeDemoGezel({","startTime":798.6666666666666,"endTime":801.4074074074074,"audioSegment":0},{"text":"page: { typeName: 'My library' },","startTime":801.4074074074074,"endTime":804.1481481481482,"audioSegment":0},{"text":"existingPaths: samples.map(file => file.path),","startTime":804.1481481481482,"endTime":806.8888888888889,"audioSegment":0},{"text":"// data and tools: app-owned sample handlers, when needed });","startTime":806.8888888888889,"endTime":809.6296296296297,"audioSegment":0},{"text":"const components = api.ui.components;","startTime":809.6296296296297,"endTime":812.3703703703703,"audioSegment":0},{"text":"// Merge these into your representative sample listing after onAdded:","startTime":812.3703703703703,"endTime":815.1111111111111,"audioSegment":0},{"text":"const added = components.demo?.files() ?? [];","startTime":815.1111111111111,"endTime":817.8518518518518,"audioSegment":0},{"text":"// In your Reset demo handler,","startTime":817.8518518518518,"endTime":820.5925925925926,"audioSegment":0},{"text":"clear imported descriptors and release object URLs:","startTime":820.5925925925926,"endTime":823.3333333333334,"audioSegment":0},{"text":"components.demo?.reset();","startTime":823.3333333333334,"endTime":826.0740740740741,"audioSegment":0},{"text":"Demo imports exercise the same picker, drop, validation, progress and cards.","startTime":826.0740740740741,"endTime":828.8148148148148,"audioSegment":0},{"text":"They retain browser Files/object URLs in this tab,","startTime":828.8148148148148,"endTime":831.5555555555555,"audioSegment":0},{"text":"use deterministic metadata, and never write to disk or invoke a model.","startTime":831.5555555555555,"endTime":834.2962962962963,"audioSegment":0},{"text":"data.url resolves imported demo media.","startTime":834.2962962962963,"endTime":837.0370370370371,"audioSegment":0},{"text":"Reset the page's own sample state and remount the adder to clear its result list.","startTime":837.0370370370371,"endTime":839.7777777777778,"audioSegment":0},{"text":"Do not claim imported demo data was indexed: Data Analysis keeps its charts on labeled sample tables.","startTime":839.7777777777778,"endTime":842.5185185185185,"audioSegment":0},{"text":"React apps can mount either component in a ref inside an effect and call destroy() in cleanup.","startTime":842.5185185185185,"endTime":845.2592592592592,"audioSegment":0},{"text":"There is no separate React component implementation to keep in sync.","startTime":845.2592592592592,"endTime":848,"audioSegment":0},{"text":"In a standalone demo,","startTime":848,"endTime":850.9117647058823,"audioSegment":0},{"text":"appLayout (or a bare chat slot) draws a sample conversation where Gezel's chat would be.","startTime":850.9117647058823,"endTime":853.8235294117648,"audioSegment":0},{"text":"A demo opens as the whole window: the layout reports fullscreen: true without the Fullscreen API,","startTime":853.8235294117648,"endTime":856.7352941176471,"audioSegment":0},{"text":"so the companion sits beside the page, or beneath it below 900 CSS pixels.","startTime":856.7352941176471,"endTime":859.6470588235294,"audioSegment":0},{"text":"Script the conversation and pass it as chat:","startTime":859.6470588235294,"endTime":862.5588235294117,"audioSegment":0},{"text":"const api = window.gezel || window.makeDemoGezel({","startTime":862.5588235294117,"endTime":865.4705882352941,"audioSegment":0},{"text":"page: { typeName: 'Meal Planner' },","startTime":865.4705882352941,"endTime":868.3823529411765,"audioSegment":0},{"text":"tools: { page_set_menu: input => setDemoMenu(input), grocery_list: () => demoGroceries() },","startTime":868.3823529411765,"endTime":871.2941176470588,"audioSegment":0},{"text":"data: { 'menu.json': () => demoMenu }, chat: { name: 'Mila',","startTime":871.2941176470588,"endTime":874.2058823529412,"audioSegment":0},{"text":"role: 'Meal Planner',","startTime":874.2058823529412,"endTime":877.1176470588235,"audioSegment":0},{"text":"greeting: 'Hello, I’m Mila.","startTime":877.1176470588235,"endTime":880.0294117647059,"audioSegment":0},{"text":"Sunday is still open.',","startTime":880.0294117647059,"endTime":882.9411764705883,"audioSegment":0},{"text":"suggestions: ['Plan Sunday around what we have'],","startTime":882.9411764705883,"endTime":885.8529411764706,"audioSegment":0},{"text":"respond: async (text, ctx) => {","startTime":885.8529411764706,"endTime":888.7647058823529,"audioSegment":0},{"text":"if (!/sunday|plan/i.test(text)) return null;","startTime":888.7647058823529,"endTime":891.6764705882352,"audioSegment":0},{"text":"await ctx.invoke('set_menu', { day: 'sunday', meal: 'Shakshuka' }, 'Sunday: Shakshuka');","startTime":891.6764705882352,"endTime":894.5882352941177,"audioSegment":0},{"text":"return 'Sunday is shakshuka.","startTime":894.5882352941177,"endTime":897.5,"audioSegment":0},{"text":"Everything it needs is stocked.'; },","startTime":897.5,"endTime":900.4117647058823,"audioSegment":0},{"text":"reactions: { page_set_menu: input => `${input.day} is set.` }, }, });","startTime":900.4117647058823,"endTime":903.3235294117648,"audioSegment":0},{"text":"ctx.read(path) returns a snapshot of the sample data.","startTime":903.3235294117648,"endTime":906.2352941176471,"audioSegment":0},{"text":"ctx.invoke(tool, input, summary) runs the page's demo handler for the model's tool name, falling back to its page_ alias,","startTime":906.2352941176471,"endTime":909.1470588235294,"audioSegment":0},{"text":"shows the step in the conversation, fires the page's watches and gezel-app-data-changed, and briefly highlights page text that changed.","startTime":909.1470588235294,"endTime":912.0588235294117,"audioSegment":0},{"text":"ctx.say(text) adds a line mid-turn,","startTime":912.0588235294117,"endTime":914.9705882352941,"audioSegment":0},{"text":"and ctx.suggest(list) swaps the suggestions without a reply.","startTime":914.9705882352941,"endTime":917.8823529411765,"audioSegment":0},{"text":"A read-only tool that changes nothing repaints nothing.","startTime":917.8823529411765,"endTime":920.7941176470588,"audioSegment":0},{"text":"A reply is a string, an array of strings, or { reply, suggestions };","startTime":920.7941176470588,"endTime":923.7058823529412,"audioSegment":0},{"text":"null gives the shared answer that the preview follows a few sample requests.","startTime":923.7058823529412,"endTime":926.6176470588235,"audioSegment":0},{"text":"reactions, keyed by page tool, are the demo form of a manifest reaction: the person's page action summons a reply,","startTime":926.6176470588235,"endTime":929.5294117647059,"audioSegment":0},{"text":"and a game answers with the companion's move through its turn tool.","startTime":929.5294117647059,"endTime":932.4411764705883,"audioSegment":0},{"text":"The composer labels the replies as scripted,","startTime":932.4411764705883,"endTime":935.3529411764706,"audioSegment":0},{"text":"nothing leaves the page, and a live host never runs this code.","startTime":935.3529411764706,"endTime":938.2647058823529,"audioSegment":0},{"text":"Without a script the conversation greets the visitor and gives the shared answer,","startTime":938.2647058823529,"endTime":941.1764705882352,"audioSegment":0},{"text":"naming the crew lead's role when the exporter supplies it.","startTime":941.1764705882352,"endTime":944.0882352941177,"audioSegment":0},{"text":"A demo configured with layout: 'pane' keeps the narrow Output-pane presentation.","startTime":944.0882352941177,"endTime":947,"audioSegment":0}],"version":1},"startBlock":{"title":"Using the Gezel page APIs","subtitle":"A project type can ship pages/index.html with relative JavaScript, CSS, and assets. Gezel hosts that page in the project's Output pane and injects window.gezel before its scripts run. You build a normal browser interface; Gezel supplies project identity, scoped file access, declared actions, and the theme. You do not need a React component inside the desktop shell or a new service for each app.","ambientMotion":"zoomIn"}}</script>
