,"position":{"start":{"line":37,"column":1,"offset":3019},"end":{"line":37,"column":122,"offset":3140}}}],"position":{"start":{"line":37,"column":1,"offset":3019},"end":{"line":37,"column":122,"offset":3140}}}]}]},{"id":"local-engines","startTime":146,"duration":23,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Local engines","position":{"start":{"line":39,"column":4,"offset":3145},"end":{"line":39,"column":17,"offset":3158}}}],"position":{"start":{"line":39,"column":1,"offset":3142},"end":{"line":39,"column":17,"offset":3158}}},"title":"Local engines","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel bundles and manages native engines that run models directly on your machine — llama.cpp and friends, with Ollama supported too if you already use it. Local means private and free per use; the trade is that model quality depends on what your hardware can lift. The ","position":{"start":{"line":41,"column":1,"offset":3160},"end":{"line":41,"column":271,"offset":3430}}},{"type":"link","url":"../local-models-and-tiers/","children":[{"type":"text","value":"Models and tiers","position":{"start":{"line":41,"column":272,"offset":3431},"end":{"line":41,"column":288,"offset":3447}}}],"position":{"start":{"line":41,"column":271,"offset":3430},"end":{"line":41,"column":317,"offset":3476}}},{"type":"text","value":" article explains how gezel matches local models to roles, and the built-in fitness check (\"de proeve\") verifies a model actually behaves before your crew relies on it.","position":{"start":{"line":41,"column":317,"offset":3476},"end":{"line":41,"column":485,"offset":3644}}}],"position":{"start":{"line":41,"column":1,"offset":3160},"end":{"line":41,"column":485,"offset":3644}}}]},{"id":"mixing","startTime":169,"duration":12,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Mixing","position":{"start":{"line":43,"column":4,"offset":3649},"end":{"line":43,"column":10,"offset":3655}}}],"position":{"start":{"line":43,"column":1,"offset":3646},"end":{"line":43,"column":10,"offset":3655}}},"title":"Mixing","contents":[{"type":"paragraph","children":[{"type":"text","value":"Providers are per-gezel, not all-or-nothing. A common setup: a local model for everyday companions, a cloud model for the roles where judgment matters most (reviewer, developer). Set the install default in Settings and override an individual gezel from its detail page.","position":{"start":{"line":45,"column":1,"offset":3657},"end":{"line":45,"column":270,"offset":3926}}}],"position":{"start":{"line":45,"column":1,"offset":3657},"end":{"line":45,"column":270,"offset":3926}}}]},{"id":"credentials","startTime":181,"duration":20,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Credentials","position":{"start":{"line":47,"column":4,"offset":3931},"end":{"line":47,"column":15,"offset":3942}}}],"position":{"start":{"line":47,"column":1,"offset":3928},"end":{"line":47,"column":15,"offset":3942}}},"title":"Credentials","contents":[{"type":"paragraph","children":[{"type":"text","value":"The CLI providers store no credentials in gezel at all — auth stays with the CLI's own login. For the key-based providers, keys live in your operating system's keychain (or, where there is none, in an encrypted file in gezel's folder), not in the settings file. They are sent only to their own provider and are never proxied through any gezel server — there isn't one.","position":{"start":{"line":49,"column":1,"offset":3944},"end":{"line":49,"column":369,"offset":4312}}}],"position":{"start":{"line":49,"column":1,"offset":3944},"end":{"line":49,"column":369,"offset":4312}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A provider is where a gezel's intelligence comes from.","startTime":0,"endTime":2,"audioSegment":0},{"text":"Gezel supports both kinds:","startTime":2,"endTime":4,"audioSegment":0},{"text":"Gezel reaches cloud models three ways: through a coding CLI you already use,","startTime":4,"endTime":7.2,"audioSegment":0},{"text":"directly through the Claude and OpenAI APIs, or through GitHub Copilot.","startTime":7.2,"endTime":10.4,"audioSegment":0},{"text":"Cloud models are the strongest option and need no hardware to speak of.","startTime":10.4,"endTime":13.600000000000001,"audioSegment":0},{"text":"The trade is that conversation content goes to that provider to be processed,","startTime":13.600000000000001,"endTime":16.8,"audioSegment":0},{"text":"under their terms.","startTime":16.8,"endTime":20,"audioSegment":0},{"text":"The first-class way to reach cloud models is through a coding CLI you already have installed and signed in:","startTime":20,"endTime":23.642857142857142,"audioSegment":0},{"text":"Claude CLI — if Anthropic's claude command (Claude Code) is on your machine,","startTime":23.642857142857142,"endTime":27.285714285714285,"audioSegment":0},{"text":"gezel finds it automatically and drives it directly.","startTime":27.285714285714285,"endTime":30.92857142857143,"audioSegment":0},{"text":"Your existing login carries over —","startTime":30.92857142857143,"endTime":34.57142857142857,"audioSegment":0},{"text":"a Claude subscription works as-is, with no API key to manage.","startTime":34.57142857142857,"endTime":38.214285714285715,"audioSegment":0},{"text":"Gezel wires its own tools (memories, tasks, team management, documents,","startTime":38.214285714285715,"endTime":41.85714285714286,"audioSegment":0},{"text":"history) into each conversation, so your gezels keep their full craft while Claude does the thinking.","startTime":41.85714285714286,"endTime":45.5,"audioSegment":0},{"text":"Codex CLI — same idea for OpenAI's codex command.","startTime":45.5,"endTime":49.14285714285714,"audioSegment":0},{"text":"Whatever the CLI is signed in with (a ChatGPT account via codex login,","startTime":49.14285714285714,"endTime":52.785714285714285,"audioSegment":0},{"text":"or an API key in your environment) is what gezel uses.","startTime":52.785714285714285,"endTime":56.42857142857143,"audioSegment":0},{"text":"This interop is the recommended path because the account you already pay for keeps working,","startTime":56.42857142857143,"endTime":60.07142857142857,"audioSegment":0},{"text":"the CLIs bring their own strong agentic loop, and there's no separate credential to create or store.","startTime":60.07142857142857,"endTime":63.714285714285715,"audioSegment":0},{"text":"Settings shows whether each CLI was detected,","startTime":63.714285714285715,"endTime":67.35714285714286,"audioSegment":0},{"text":"and you can point gezel at a specific binary if it lives somewhere unusual.","startTime":67.35714285714286,"endTime":71,"audioSegment":0},{"text":"Gezel ends a Codex turn after ten minutes without a valid stream event when no tool is running.","startTime":71,"endTime":74.0909090909091,"audioSegment":0},{"text":"This catches silent model turns before the longer overall turn limit.","startTime":74.0909090909091,"endTime":77.18181818181819,"audioSegment":0},{"text":"Active tool calls keep their own limits and the overall turn limit;","startTime":77.18181818181819,"endTime":80.27272727272728,"audioSegment":0},{"text":"diagnostic heartbeats and stderr do not reset the inactivity timer.","startTime":80.27272727272728,"endTime":83.36363636363636,"audioSegment":0},{"text":"Both budgets count awake time,","startTime":83.36363636363636,"endTime":86.45454545454545,"audioSegment":0},{"text":"so a short machine sleep does not consume them.","startTime":86.45454545454545,"endTime":89.54545454545455,"audioSegment":0},{"text":"For task handoffs, a failed turn enters the existing bounded recovery: at most three sends,","startTime":89.54545454545455,"endTime":92.63636363636364,"audioSegment":0},{"text":"using the task's original procedure and completion gates.","startTime":92.63636363636364,"endTime":95.72727272727272,"audioSegment":0},{"text":"If recovery fails,","startTime":95.72727272727272,"endTime":98.81818181818181,"audioSegment":0},{"text":"the task pauses with a note containing the provider error.","startTime":98.81818181818181,"endTime":101.9090909090909,"audioSegment":0},{"text":"Retrying a paused task keeps its task identity and available session evidence.","startTime":101.9090909090909,"endTime":105,"audioSegment":0},{"text":"Gezel also talks to both APIs directly, with no CLI involved: Claude API —","startTime":105,"endTime":108.18181818181819,"audioSegment":0},{"text":"create a key at platform.claude.com and paste it in Settings → Anthropic Claude.","startTime":108.18181818181819,"endTime":111.36363636363636,"audioSegment":0},{"text":"OpenAI API, which serves the models behind ChatGPT —","startTime":111.36363636363636,"endTime":114.54545454545455,"audioSegment":0},{"text":"create a key at platform.openai.com and paste it in Settings → OpenAI.","startTime":114.54545454545455,"endTime":117.72727272727272,"audioSegment":0},{"text":"An organization ID is optional.","startTime":117.72727272727272,"endTime":120.9090909090909,"audioSegment":0},{"text":"Gezel runs its own tools in these conversations too,","startTime":120.9090909090909,"endTime":124.0909090909091,"audioSegment":0},{"text":"so a gezel on an API key keeps the same craft as one on a CLI.","startTime":124.0909090909091,"endTime":127.27272727272728,"audioSegment":0},{"text":"Usage is billed per token by Anthropic or OpenAI,","startTime":127.27272727272728,"endTime":130.45454545454544,"audioSegment":0},{"text":"separately from any Claude or ChatGPT subscription.","startTime":130.45454545454544,"endTime":133.63636363636363,"audioSegment":0},{"text":"Choose this route on a machine without the CLIs,","startTime":133.63636363636363,"endTime":136.8181818181818,"audioSegment":0},{"text":"or when you would rather pay per use than through a subscription.","startTime":136.8181818181818,"endTime":140,"audioSegment":0},{"text":"Sign in with your GitHub account from Settings;","startTime":140,"endTime":143,"audioSegment":0},{"text":"your Copilot plan's quota applies and gezel shows the real usage buckets.","startTime":143,"endTime":146,"audioSegment":0},{"text":"Gezel bundles and manages native engines that run models directly on your machine —","startTime":146,"endTime":149.83333333333334,"audioSegment":0},{"text":"llama.cpp and friends, with Ollama supported too if you already use it.","startTime":149.83333333333334,"endTime":153.66666666666666,"audioSegment":0},{"text":"Local means private and free per use;","startTime":153.66666666666666,"endTime":157.5,"audioSegment":0},{"text":"the trade is that model quality depends on what your hardware can lift.","startTime":157.5,"endTime":161.33333333333334,"audioSegment":0},{"text":"The Models and tiers article explains how gezel matches local models to roles,","startTime":161.33333333333334,"endTime":165.16666666666666,"audioSegment":0},{"text":"and the built-in fitness check (\"de proeve\") verifies a model actually behaves before your crew relies on it.","startTime":165.16666666666666,"endTime":169,"audioSegment":0},{"text":"Providers are per-gezel, not all-or-nothing.","startTime":169,"endTime":172,"audioSegment":0},{"text":"A common setup: a local model for everyday companions,","startTime":172,"endTime":175,"audioSegment":0},{"text":"a cloud model for the roles where judgment matters most (reviewer, developer).","startTime":175,"endTime":178,"audioSegment":0},{"text":"Set the install default in Settings and override an individual gezel from its detail page.","startTime":178,"endTime":181,"audioSegment":0},{"text":"The CLI providers store no credentials in gezel at all —","startTime":181,"endTime":184.33333333333334,"audioSegment":0},{"text":"auth stays with the CLI's own login.","startTime":184.33333333333334,"endTime":187.66666666666666,"audioSegment":0},{"text":"For the key-based providers,
