","position":{"start":{"line":10,"column":42,"offset":691},"end":{"line":10,"column":49,"offset":698}}},{"type":"text","value":" command. Whatever the CLI is signed in with (a ChatGPT account via ","position":{"start":{"line":10,"column":49,"offset":698},"end":{"line":10,"column":117,"offset":766}}},{"type":"inlineCode","value":"codex login","position":{"start":{"line":10,"column":117,"offset":766},"end":{"line":10,"column":130,"offset":779}}},{"type":"text","value":", or an API key in your environment) is what gezel uses.","position":{"start":{"line":10,"column":130,"offset":779},"end":{"line":10,"column":186,"offset":835}}}],"position":{"start":{"line":10,"column":3,"offset":652},"end":{"line":10,"column":186,"offset":835}}}],"position":{"start":{"line":10,"column":1,"offset":650},"end":{"line":10,"column":186,"offset":835}}}],"position":{"start":{"line":9,"column":1,"offset":241},"end":{"line":10,"column":186,"offset":835}}},{"type":"paragraph","children":[{"type":"text","value":"This interop is the recommended path because the account you already pay for keeps working, the CLIs bring their own strong agentic loop, and there's no separate credential to create or store. Settings shows whether each CLI was detected, and you can point gezel at a specific binary if it lives somewhere unusual.","position":{"start":{"line":12,"column":1,"offset":837},"end":{"line":12,"column":315,"offset":1151}}}],"position":{"start":{"line":12,"column":1,"offset":837},"end":{"line":12,"column":315,"offset":1151}}},{"type":"paragraph","children":[{"type":"text","value":"Two more cloud options:","position":{"start":{"line":14,"column":1,"offset":1153},"end":{"line":14,"column":24,"offset":1176}}}],"position":{"start":{"line":14,"column":1,"offset":1153},"end":{"line":14,"column":24,"offset":1176}}},{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"GitHub Copilot","position":{"start":{"line":16,"column":5,"offset":1182},"end":{"line":16,"column":19,"offset":1196}}}],"position":{"start":{"line":16,"column":3,"offset":1180},"end":{"line":16,"column":21,"offset":1198}}},{"type":"text","value":" — sign in with your GitHub account from Settings; your Copilot plan's quota applies and gezel shows the real usage buckets.","position":{"start":{"line":16,"column":21,"offset":1198},"end":{"line":16,"column":145,"offset":1322}}}],"position":{"start":{"line":16,"column":3,"offset":1180},"end":{"line":16,"column":145,"offset":1322}}}],"position":{"start":{"line":16,"column":1,"offset":1178},"end":{"line":16,"column":145,"offset":1322}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"OpenAI","position":{"start":{"line":17,"column":5,"offset":1327},"end":{"line":17,"column":11,"offset":1333}}}],"position":{"start":{"line":17,"column":3,"offset":1325},"end":{"line":17,"column":13,"offset":1335}}},{"type":"text","value":" and ","position":{"start":{"line":17,"column":13,"offset":1335},"end":{"line":17,"column":18,"offset":1340}}},{"type":"strong","children":[{"type":"text","value":"Anthropic","position":{"start":{"line":17,"column":20,"offset":1342},"end":{"line":17,"column":29,"offset":1351}}}],"position":{"start":{"line":17,"column":18,"offset":1340},"end":{"line":17,"column":31,"offset":1353}}},{"type":"text","value":" API keys — paste a key; usage is billed by the provider per token.","position":{"start":{"line":17,"column":31,"offset":1353},"end":{"line":17,"column":98,"offset":1420}}}],"position":{"start":{"line":17,"column":3,"offset":1325},"end":{"line":17,"column":98,"offset":1420}}}],"position":{"start":{"line":17,"column":1,"offset":1323},"end":{"line":17,"column":98,"offset":1420}}}],"position":{"start":{"line":16,"column":1,"offset":1178},"end":{"line":17,"column":98,"offset":1420}}},{"type":"paragraph","children":[{"type":"text","value":"Cloud models are the strongest option and need no hardware to speak of. The trade is that conversation content goes to that provider to be processed, under their terms.","position":{"start":{"line":19,"column":1,"offset":1422},"end":{"line":19,"column":169,"offset":1590}}}],"position":{"start":{"line":19,"column":1,"offset":1422},"end":{"line":19,"column":169,"offset":1590}}}],"children":[{"id":"codex-turn-recovery","startTime":77,"duration":34,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":3,"children":[{"type":"text","value":"Codex turn recovery","position":{"start":{"line":21,"column":5,"offset":1596},"end":{"line":21,"column":24,"offset":1615}}}],"position":{"start":{"line":21,"column":1,"offset":1592},"end":{"line":21,"column":24,"offset":1615}}},"title":"Codex turn recovery","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel ends a Codex turn after ten minutes without a valid stream event when no tool is running. This catches silent model turns before the longer overall turn limit. Active tool calls keep their own limits and the overall turn limit; diagnostic heartbeats and stderr do not reset the inactivity timer. Both budgets count awake time, so a short machine sleep does not consume them.","position":{"start":{"line":23,"column":1,"offset":1617},"end":{"line":23,"column":381,"offset":1997}}}],"position":{"start":{"line":23,"column":1,"offset":1617},"end":{"line":23,"column":381,"offset":1997}}},{"type":"paragraph","children":[{"type":"text","value":"For task handoffs, a failed turn enters the existing bounded recovery: at most three sends, using the task's original procedure and completion gates. If recovery fails, the task pauses with a note containing the provider error. Retrying a paused task keeps its task identity and available session evidence.","position":{"start":{"line":25,"column":1,"offset":1999},"end":{"line":25,"column":307,"offset":2305}}}],"position":{"start":{"line":25,"column":1,"offset":1999},"end":{"line":25,"column":307,"offset":2305}}}]}]},{"id":"local-engines","startTime":111,"duration":23,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Local engines","position":{"start":{"line":27,"column":4,"offset":2310},"end":{"line":27,"column":17,"offset":2323}}}],"position":{"start":{"line":27,"column":1,"offset":2307},"end":{"line":27,"column":17,"offset":2323}}},"title":"Local engines","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel bundles and manages native engines that run models directly on your machine — llama.cpp and friends, with Ollama supported too if you already use it. Local means private and free per use; the trade is that model quality depends on what your hardware can lift. The ","position":{"start":{"line":29,"column":1,"offset":2325},"end":{"line":29,"column":271,"offset":2595}}},{"type":"link","url":"../local-models-and-tiers/","children":[{"type":"text","value":"Models and tiers","position":{"start":{"line":29,"column":272,"offset":2596},"end":{"line":29,"column":288,"offset":2612}}}],"position":{"start":{"line":29,"column":271,"offset":2595},"end":{"line":29,"column":317,"offset":2641}}},{"type":"text","value":" article explains how gezel matches local models to roles, and the built-in fitness check (\"de proeve\") verifies a model actually behaves before your crew relies on it.","position":{"start":{"line":29,"column":317,"offset":2641},"end":{"line":29,"column":485,"offset":2809}}}],"position":{"start":{"line":29,"column":1,"offset":2325},"end":{"line":29,"column":485,"offset":2809}}}]},{"id":"mixing","startTime":134,"duration":12,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Mixing","position":{"start":{"line":31,"column":4,"offset":2814},"end":{"line":31,"column":10,"offset":2820}}}],"position":{"start":{"line":31,"column":1,"offset":2811},"end":{"line":31,"column":10,"offset":2820}}},"title":"Mixing","contents":[{"type":"paragraph","children":[{"type":"text","value":"Providers are per-gezel, not all-or-nothing. A common setup: a local model for everyday companions, a cloud model for the roles where judgment matters most (reviewer, developer). Set the install default in Settings and override an individual gezel from its detail page.","position":{"start":{"line":33,"column":1,"offset":2822},"end":{"line":33,"column":270,"offset":3091}}}],"position":{"start":{"line":33,"column":1,"offset":2822},"end":{"line":33,"column":270,"offset":3091}}}]},{"id":"credentials","startTime":146,"duration":20,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Credentials","position":{"start":{"line":35,"column":4,"offset":3096},"end":{"line":35,"column":15,"offset":3107}}}],"position":{"start":{"line":35,"column":1,"offset":3093},"end":{"line":35,"column":15,"offset":3107}}},"title":"Credentials","contents":[{"type":"paragraph","children":[{"type":"text","value":"The CLI providers store no credentials in gezel at all — auth stays with the CLI's own login. For the key-based providers, keys live in your operating system's keychain (or, where there is none, in an encrypted file in gezel's folder), not in the settings file. They are sent only to their own provider and are never proxied through any gezel server — there isn't one.","position":{"start":{"line":37,"column":1,"offset":3109},"end":{"line":37,"column":369,"offset":3477}}}],"position":{"start":{"line":37,"column":1,"offset":3109},"end":{"line":37,"column":369,"offset":3477}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"A provider is where a gezel's intelligence comes from.","startTime":0,"endTime":2,"audioSegment":0},{"text":"Gezel supports both kinds:","startTime":2,"endTime":4,"audioSegment":0},{"text":"The first-class way to reach cloud models is through a coding CLI you already have installed and signed in:","startTime":4,"endTime":7.318181818181818,"audioSegment":0},{"text":"Claude CLI — if Anthropic's claude command (Claude Code) is on your machine,","startTime":7.318181818181818,"endTime":10.636363636363637,"audioSegment":0},{"text":"gezel finds it automatically and drives it directly.","startTime":10.636363636363637,"endTime":13.954545454545455,"audioSegment":0},{"text":"Your existing login carries over —","startTime":13.954545454545455,"endTime":17.272727272727273,"audioSegment":0},{"text":"a Claude subscription works as-is, with no API key to manage.","startTime":17.272727272727273,"endTime":20.590909090909093,"audioSegment":0},{"text":"Gezel wires its own tools (memories, tasks, team management, documents,","startTime":20.590909090909093,"endTime":23.90909090909091,"audioSegment":0},{"text":"history) into each conversation, so your gezels keep their full craft while Claude does the thinking.","startTime":23.90909090909091,"endTime":27.227272727272727,"audioSegment":0},{"text":"Codex CLI — same idea for OpenAI's codex command.","startTime":27.227272727272727,"endTime":30.545454545454547,"audioSegment":0},{"text":"Whatever the CLI is signed in with (a ChatGPT account via codex login,","startTime":30.545454545454547,"endTime":33.86363636363637,"audioSegment":0},{"text":"or an API key in your environment) is what gezel uses.","startTime":33.86363636363637,"endTime":37.18181818181819,"audioSegment":0},{"text":"This interop is the recommended path because the account you already pay for keeps working,","startTime":37.18181818181819,"endTime":40.5,"audioSegment":0},{"text":"the CLIs bring their own strong agentic loop, and there's no separate credential to create or store.","startTime":40.5,"endTime":43.81818181818182,"audioSegment":0},{"text":"Settings shows whether each CLI was detected,","startTime":43.81818181818182,"endTime":47.13636363636364,"audioSegment":0},{"text":"and you can point gezel at a specific binary if it lives somewhere unusual.","startTime":47.13636363636364,"endTime":50.45454545454545,"audioSegment":0},{"text":"Two more cloud options:","startTime":50.45454545454545,"endTime":53.77272727272727,"audioSegment":0},{"text":"GitHub Copilot — sign in with your GitHub account from Settings;","startTime":53.77272727272727,"endTime":57.09090909090909,"audioSegment":0},{"text":"your Copilot plan's quota applies and gezel shows the real usage buckets.","startTime":57.09090909090909,"endTime":60.409090909090914,"audioSegment":0},{"text":"OpenAI and Anthropic API keys — paste a key;","startTime":60.409090909090914,"endTime":63.727272727272734,"audioSegment":0},{"text":"usage is billed by the provider per token.","startTime":63.727272727272734,"endTime":67.04545454545455,"audioSegment":0},{"text":"Cloud models are the strongest option and need no hardware to speak of.","startTime":67.04545454545455,"endTime":70.36363636363637,"audioSegment":0},{"text":"The trade is that conversation content goes to that provider to be processed,","startTime":70.36363636363637,"endTime":73.68181818181819,"audioSegment":0},{"text":"under their terms.","startTime":73.68181818181819,"endTime":77,"audioSegment":0},{"text":"Gezel ends a Codex turn after ten minutes without a valid stream event when no tool is running.","startTime":77,"endTime":80.0909090909091,"audioSegment":0},{"text":"This catches silent model turns before the longer overall turn limit.","startTime":80.0909090909091,"endTime":83.18181818181819,"audioSegment":0},{"text":"Active tool calls keep their own limits and the overall turn limit;","startTime":83.18181818181819,"endTime":86.27272727272728,"audioSegment":0},{"text":"diagnostic heartbeats and stderr do not reset the inactivity timer.","startTime":86.27272727272728,"endTime":89.36363636363636,"audioSegment":0},{"text":"Both budgets count awake time,","startTime":89.36363636363636,"endTime":92.45454545454545,"audioSegment":0},{"text":"so a short machine sleep does not consume them.","startTime":92.45454545454545,"endTime":95.54545454545455,"audioSegment":0},{"text":"For task handoffs, a failed turn enters the existing bounded recovery: at most three sends,","startTime":95.54545454545455,"endTime":98.63636363636364,"audioSegment":0},{"text":"using the task's original procedure and completion gates.","startTime":98.63636363636364,"endTime":101.72727272727272,"audioSegment":0},{"text":"If recovery fails,","startTime":101.72727272727272,"endTime":104.81818181818181,"audioSegment":0},{"text":"the task pauses with a note containing the provider error.","startTime":104.81818181818181,"endTime":107.9090909090909,"audioSegment":0},{"text":"Retrying a paused task keeps its task identity and available session evidence.","startTime":107.9090909090909,"endTime":111,"audioSegment":0},{"text":"Gezel bundles and manages native engines that run models directly on your machine —","startTime":111,"endTime":114.83333333333333,"audioSegment":0},{"text":"llama.cpp and friends, with Ollama supported too if you already use it.","startTime":114.83333333333333,"endTime":118.66666666666667,"audioSegment":0},{"text":"Local means private and free per use;","startTime":118.66666666666667,"endTime":122.5,"audioSegment":0},{"text":"the trade is that model quality depends on what your hardware can lift.","startTime":122.5,"endTime":126.33333333333333,"audioSegment":0},{"text":"The Models and tiers article explains how gezel matches local models to roles,","startTime":126.33333333333333,"endTime":130.16666666666666,"audioSegment":0},{"text":"and the built-in fitness check (\"de proeve\") verifies a model actually behaves before your crew relies on it.","startTime":130.16666666666666,"endTime":134,"audioSegment":0},{"text":"Providers are per-gezel, not all-or-nothing.","startTime":134,"endTime":137,"audioSegment":0},{"text":"A common setup: a local model for everyday companions,","startTime":137,"endTime":140,"audioSegment":0},{"text":"a cloud model for the roles where judgment matters most (reviewer, developer).","startTime":140,"endTime":143,"audioSegment":0},{"text":"Set the install default in Settings and override an individual gezel from its detail page.","startTime":143,"endTime":146,"audioSegment":0},{"text":"The CLI providers store no credentials in gezel at all —","startTime":146,"endTime":149.33333333333334,"audioSegment":0},{"text":"auth stays with the CLI's own login.","startTime":149.33333333333334,"endTime":152.66666666666666,"audioSegment":0},{"text":"For the key-based providers, keys live in your operating system's keychain (or,","startTime":152.66666666666666,"endTime":156,"audioSegment":0},{"text":"where there is none, in an encrypted file in gezel's folder), not in the settings file.","startTime":156,"endTime":159.33333333333334,"audioSegment":0},{"text":"They are sent only to their own provider and are never proxied through any gezel server —","startTime":159.33333333333334,"endTime":162.66666666666666,"audioSegment":0},{"text":"there isn't one.","startTime":162.66666666666666,"endTime":166,"audioSegment":0}],"version":1},"startBlock":{"title":"Providers and engines","subtitle":"A provider is where a gezel's intelligence comes from. Gezel supports both kinds:","ambientMotion":"zoomIn"}}</script>
