mn":169,"offset":3495}}},{"type":"text","value":" (the commit the release was built from).","position":{"start":{"line":60,"column":169,"offset":3495},"end":{"line":60,"column":210,"offset":3536}}}],"position":{"start":{"line":60,"column":1,"offset":3327},"end":{"line":60,"column":210,"offset":3536}}}]},{"id":"what-this-does-and-does-not-tell-you","startTime":154,"duration":33,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"What this does and does not tell you","position":{"start":{"line":62,"column":4,"offset":3541},"end":{"line":62,"column":40,"offset":3577}}}],"position":{"start":{"line":62,"column":1,"offset":3538},"end":{"line":62,"column":40,"offset":3577}}},"title":"What this does and does not tell you","contents":[{"type":"paragraph","children":[{"type":"text","value":"A passing check tells you the file is byte-for-byte the artifact our release pipeline produced from a named commit in a public repository. Nobody modified it in transit, and it was not built on someone's laptop.","position":{"start":{"line":64,"column":1,"offset":3579},"end":{"line":64,"column":212,"offset":3790}}}],"position":{"start":{"line":64,"column":1,"offset":3579},"end":{"line":64,"column":212,"offset":3790}}},{"type":"paragraph","children":[{"type":"text","value":"It does not tell you the software is free of bugs, and it does not replace reading what Gezel actually does with your data — ","position":{"start":{"line":66,"column":1,"offset":3792},"end":{"line":66,"column":126,"offset":3917}}},{"type":"link","url":"../security-model/","children":[{"type":"text","value":"the security model","position":{"start":{"line":66,"column":127,"offset":3918},"end":{"line":66,"column":145,"offset":3936}}}],"position":{"start":{"line":66,"column":126,"offset":3917},"end":{"line":66,"column":166,"offset":3957}}},{"type":"text","value":" covers that. It also cannot help if you downloaded from somewhere other than our releases page: a checksum file that travelled with a bad installer proves only that the two agree with each other. Get ","position":{"start":{"line":66,"column":166,"offset":3957},"end":{"line":66,"column":367,"offset":4158}}},{"type":"inlineCode","value":"SHA256SUMS","position":{"start":{"line":66,"column":367,"offset":4158},"end":{"line":66,"column":379,"offset":4170}}},{"type":"text","value":" from ","position":{"start":{"line":66,"column":379,"offset":4170},"end":{"line":66,"column":385,"offset":4176}}},{"type":"link","url":"https://github.com/bendyline/gezel/releases","children":[{"type":"text","value":"the release you are installing","position":{"start":{"line":66,"column":386,"offset":4177},"end":{"line":66,"column":416,"offset":4207}}}],"position":{"start":{"line":66,"column":385,"offset":4176},"end":{"line":66,"column":462,"offset":4253}}},{"type":"text","value":", not from a mirror.","position":{"start":{"line":66,"column":462,"offset":4253},"end":{"line":66,"column":482,"offset":4273}}}],"position":{"start":{"line":66,"column":1,"offset":3792},"end":{"line":66,"column":482,"offset":4273}}}]},{"id":"a-note-on-linux-packages","startTime":187,"duration":31,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"A note on Linux packages","position":{"start":{"line":68,"column":4,"offset":4278},"end":{"line":68,"column":28,"offset":4302}}}],"position":{"start":{"line":68,"column":1,"offset":4275},"end":{"line":68,"column":28,"offset":4302}}},"title":"A note on Linux packages","contents":[{"type":"paragraph","children":[{"type":"text","value":"Our ","position":{"start":{"line":70,"column":1,"offset":4304},"end":{"line":70,"column":5,"offset":4308}}},{"type":"inlineCode","value":".deb","position":{"start":{"line":70,"column":5,"offset":4308},"end":{"line":70,"column":11,"offset":4314}}},{"type":"text","value":" and ","position":{"start":{"line":70,"column":11,"offset":4314},"end":{"line":70,"column":16,"offset":4319}}},{"type":"inlineCode","value":".rpm","position":{"start":{"line":70,"column":16,"offset":4319},"end":{"line":70,"column":22,"offset":4325}}},{"type":"text","value":" files are not GPG-signed. That is a deliberate choice rather than an oversight, and it reflects how the ecosystem actually works: ","position":{"start":{"line":70,"column":22,"offset":4325},"end":{"line":70,"column":153,"offset":4456}}},{"type":"inlineCode","value":"dpkg","position":{"start":{"line":70,"column":153,"offset":4456},"end":{"line":70,"column":159,"offset":4462}}},{"type":"text","value":" does not verify signatures on standalone ","position":{"start":{"line":70,"column":159,"offset":4462},"end":{"line":70,"column":201,"offset":4504}}},{"type":"inlineCode","value":".deb","position":{"start":{"line":70,"column":201,"offset":4504},"end":{"line":70,"column":207,"offset":4510}}},{"type":"text","value":" files at all — in the Debian world that trust comes from a signed repository, not the package — and the other major applications distributed this way take the same approach.","position":{"start":{"line":70,"column":207,"offset":4510},"end":{"line":70,"column":381,"offset":4684}}}],"position":{"start":{"line":70,"column":1,"offset":4304},"end":{"line":70,"column":381,"offset":4684}}},{"type":"paragraph","children":[{"type":"text","value":"The consequence is that the two checks on this page are the real verification story for Linux, which is why they are documented rather than buried. If we later publish an apt or yum repository, signing arrives with it.","position":{"start":{"line":72,"column":1,"offset":4686},"end":{"line":72,"column":219,"offset":4904}}}],"position":{"start":{"line":72,"column":1,"offset":4686},"end":{"line":72,"column":219,"offset":4904}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Every Gezel release publishes two things alongside the installers so you can check that what landed on your disk is exactly what we built: a list of checksums,","startTime":0,"endTime":4.555555555555555,"audioSegment":0},{"text":"and a cryptographic record of the build itself.","startTime":4.555555555555555,"endTime":9.11111111111111,"audioSegment":0},{"text":"Most people never need to run these.","startTime":9.11111111111111,"endTime":13.666666666666666,"audioSegment":0},{"text":"On macOS and Windows the operating system already checks our signature before it lets the installer run —","startTime":13.666666666666666,"endTime":18.22222222222222,"audioSegment":0},{"text":"that is what Gatekeeper and SmartScreen are doing when you open it.","startTime":18.22222222222222,"endTime":22.77777777777778,"audioSegment":0},{"text":"Linux is the case where this page matters, because .deb and .rpm files carry no signature that your package manager checks,","startTime":22.77777777777778,"endTime":27.333333333333332,"audioSegment":0},{"text":"so the checks below are the only verification available there.","startTime":27.333333333333332,"endTime":31.888888888888886,"audioSegment":0},{"text":"They are also worth running on any platform if you downloaded through a mirror, a proxy,","startTime":31.888888888888886,"endTime":36.44444444444444,"audioSegment":0},{"text":"a corporate network you do not control, or anywhere else you would rather confirm than assume.","startTime":36.44444444444444,"endTime":41,"audioSegment":0},{"text":"SHA256SUMS lists a fingerprint for every file in the release.","startTime":41,"endTime":44.888888888888886,"audioSegment":0},{"text":"Recomputing the fingerprint of your download and comparing it proves the bytes arrived intact and unaltered.","startTime":44.888888888888886,"endTime":48.77777777777778,"audioSegment":0},{"text":"It is quick, needs no account,","startTime":48.77777777777778,"endTime":52.666666666666664,"audioSegment":0},{"text":"and works offline once you have the file.","startTime":52.666666666666664,"endTime":56.55555555555556,"audioSegment":0},{"text":"Build provenance is a signed statement, published to a public transparency log,","startTime":56.55555555555556,"endTime":60.44444444444444,"audioSegment":0},{"text":"saying that these exact bytes came out of Gezel's own build pipeline — naming the source commit, the workflow, and the run that produced them.","startTime":60.44444444444444,"endTime":64.33333333333333,"audioSegment":0},{"text":"It is a stronger claim than a checksum, because a checksum only tells you your copy matches the list;","startTime":64.33333333333333,"endTime":68.22222222222223,"audioSegment":0},{"text":"provenance tells you where the list's contents came from.","startTime":68.22222222222223,"endTime":72.11111111111111,"audioSegment":0},{"text":"Both are published for every file in the release, SHA256SUMS included.","startTime":72.11111111111111,"endTime":76,"audioSegment":0},{"text":"Download SHA256SUMS from the same release page as your installer,","startTime":76,"endTime":78.72222222222223,"audioSegment":0},{"text":"put it next to the file you downloaded, and run the command for your system.","startTime":78.72222222222223,"endTime":81.44444444444444,"audioSegment":0},{"text":"Filenames below carry a version number —","startTime":81.44444444444444,"endTime":84.16666666666667,"audioSegment":0},{"text":"use the one you actually downloaded.","startTime":84.16666666666667,"endTime":86.88888888888889,"audioSegment":0},{"text":"--ignore-missing matters: SHA256SUMS covers every platform's installer and you have only downloaded one.","startTime":86.88888888888889,"endTime":89.61111111111111,"audioSegment":0},{"text":"Without the flag you get a wall of \"No such file\" errors and an overall failure that means nothing. Linux","startTime":89.61111111111111,"endTime":92.33333333333334,"audioSegment":0},{"text":"sha256sum --ignore-missing -c SHA256SUMS macOS","startTime":92.33333333333334,"endTime":95.05555555555556,"audioSegment":0},{"text":"shasum -a 256 --ignore-missing -c SHA256SUMS","startTime":95.05555555555556,"endTime":97.77777777777777,"audioSegment":0},{"text":"Windows (PowerShell, from the folder holding both files)","startTime":97.77777777777777,"endTime":100.5,"audioSegment":0},{"text":"$file     = 'Gezel-1.26237.59-windows-x64.exe'","startTime":100.5,"endTime":103.22222222222223,"audioSegment":0},{"text":"$expected = ((Select-String -Path SHA256SUMS -Pattern $file).Line -split '\\s+')[0]","startTime":103.22222222222223,"endTime":105.94444444444444,"audioSegment":0},{"text":"$actual   = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()","startTime":105.94444444444444,"endTime":108.66666666666667,"audioSegment":0},{"text":"if ($actual -eq $expected) { 'OK' } else { 'MISMATCH —","startTime":108.66666666666667,"endTime":111.38888888888889,"audioSegment":0},{"text":"do not run this file' }","startTime":111.38888888888889,"endTime":114.11111111111111,"audioSegment":0},{"text":"You want to see OK next to your filename.","startTime":114.11111111111111,"endTime":116.83333333333334,"audioSegment":0},{"text":"Anything else — a FAILED line, a MISMATCH —","startTime":116.83333333333334,"endTime":119.55555555555556,"audioSegment":0},{"text":"means the file is not what we published.","startTime":119.55555555555556,"endTime":122.27777777777777,"audioSegment":0},{"text":"Delete it and download it again rather than trying to repair it.","startTime":122.27777777777777,"endTime":125,"audioSegment":0},{"text":"This one needs the GitHub CLI and a GitHub account.","startTime":125,"endTime":127.63636363636364,"audioSegment":0},{"text":"The command reads a public transparency log, but gh itself has to be signed in,","startTime":127.63636363636364,"endTime":130.27272727272728,"audioSegment":0},{"text":"so run gh auth login once first — any free account will do.","startTime":130.27272727272728,"endTime":132.9090909090909,"audioSegment":0},{"text":"gh attestation verify Gezel-1.26237.59-linux-amd64.deb --repo bendyline/gezel","startTime":132.9090909090909,"endTime":135.54545454545453,"audioSegment":0},{"text":"Substitute whichever file you downloaded.","startTime":135.54545454545453,"endTime":138.1818181818182,"audioSegment":0},{"text":"A silent exit means it verified;","startTime":138.1818181818182,"endTime":140.8181818181818,"audioSegment":0},{"text":"gh only speaks up when something is wrong.","startTime":140.8181818181818,"endTime":143.45454545454544,"audioSegment":0},{"text":"To see the detail it confirmed:","startTime":143.45454545454544,"endTime":146.0909090909091,"audioSegment":0},{"text":"gh attestation verify Gezel-1.26237.59-linux-amd64.deb --repo bendyline/gezel --format json","startTime":146.0909090909091,"endTime":148.72727272727272,"audioSegment":0},{"text":"The interesting fields are sourceRepositoryURI (should be https://github.com/bendyline/gezel),","startTime":148.72727272727272,"endTime":151.36363636363637,"audioSegment":0},{"text":"buildSignerURI (the release workflow), and sourceRepositoryDigest (the commit the release was built from).","startTime":151.36363636363637,"endTime":154,"audioSegment":0},{"text":"A passing check tells you the file is byte-for-byte the artifact our release pipeline produced from a named commit in a public repository.","startTime":154,"endTime":158.71428571428572,"audioSegment":0},{"text":"Nobody modified it in transit,","startTime":158.71428571428572,"endTime":163.42857142857142,"audioSegment":0},{"text":"and it was not built on someone's laptop.","startTime":163.42857142857142,"endTime":168.14285714285714,"audioSegment":0},{"text":"It does not tell you the software is free of bugs,","startTime":168.14285714285714,"endTime":172.85714285714286,"audioSegment":0},{"text":"and it does not replace reading what Gezel actually does with your data — the security model covers that.","startTime":172.85714285714286,"endTime":177.57142857142858,"audioSegment":0},{"text":"It also cannot help if you downloaded from somewhere other than our releases page: a checksum file that travelled with a bad installer proves only that the two agree with each other.","startTime":177.57142857142858,"endTime":182.28571428571428,"audioSegment":0},{"text":"Get SHA256SUMS from the release you are installing, not from a mirror.","startTime":182.28571428571428,"endTime":187,"audioSegment":0},{"text":"Our .deb and .rpm files are not GPG-signed.","startTime":187,"endTime":191.42857142857142,"audioSegment":0},{"text":"That is a deliberate choice rather than an oversight, and it reflects how the ecosystem actually works: dpkg does not verify signatures on standalone .deb files at all —","startTime":191.42857142857142,"endTime":195.85714285714286,"audioSegment":0},{"text":"in the Debian world that trust comes from a signed repository, not the package — and the other major applications distributed this way take the same approach.","startTime":195.85714285714286,"endTime":200.28571428571428,"audioSegment":0},{"text":"The consequence is that the two checks on this page are the real verification story for Linux,","startTime":200.28571428571428,"endTime":204.71428571428572,"audioSegment":0},{"text":"which is why they are documented rather than buried.","startTime":204.71428571428572,"endTime":209.14285714285714,"audioSegment":0},{"text":"If we later publish an apt or yum repository,","startTime":209.14285714285714,"endTime":213.57142857142858,"audioSegment":0},{"text":"signing arrives with it.","startTime":213.57142857142858,"endTime":218,"audioSegment":0}],"version":1},"startBlock":{"title":"Verifying your download","subtitle":"Every Gezel release publishes two things alongside the installers so you can check that what landed on your disk is exactly what we built: a list of checksums, and a cryptographic record of the build itself.","ambientMotion":"zoomIn"}}</script>
