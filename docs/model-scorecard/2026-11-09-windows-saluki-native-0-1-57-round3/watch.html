U,","startTime":31.10810810810811,"endTime":33.95945945945946,"audioSegment":0},{"text":"with substantial system RAM use; full GPU residency was not demonstrated.","startTime":33.95945945945946,"endTime":36.81081081081081,"audioSegment":0},{"text":"The requested three repetitions across core, productivity,","startTime":36.81081081081081,"endTime":39.66216216216216,"audioSegment":0},{"text":"developer and complex-work comprised 129 planned entries.","startTime":39.66216216216216,"endTime":42.513513513513516,"audioSegment":0},{"text":"There are 126 terminal runner results,","startTime":42.513513513513516,"endTime":45.36486486486486,"audioSegment":0},{"text":"two interrupted attempts without final scores, and one unattempted entry.","startTime":45.36486486486486,"endTime":48.21621621621622,"audioSegment":0},{"text":"Of the terminal results, 98 passed,","startTime":48.21621621621622,"endTime":51.067567567567565,"audioSegment":0},{"text":"27 were eligible task failures and one was excluded for unavailable sandbox infrastructure.","startTime":51.067567567567565,"endTime":53.91891891891892,"audioSegment":0},{"text":"Forty-one of the 43 suite entries have three eligible trials;","startTime":53.91891891891892,"endTime":56.77027027027027,"audioSegment":0},{"text":"gate-script authoring and fanout authoring each have only one.","startTime":56.77027027027027,"endTime":59.62162162162162,"audioSegment":0},{"text":"The automatic outcomes measure task gates,","startTime":59.62162162162162,"endTime":62.472972972972975,"audioSegment":0},{"text":"while the separate artifact reviews examine the quality of the resulting work.","startTime":62.472972972972975,"endTime":65.32432432432432,"audioSegment":0},{"text":"Task set Original passes / eligible Round 3 passes / eligible Other dispositions","startTime":65.32432432432432,"endTime":68.17567567567568,"audioSegment":0},{"text":"Core 19/22 11/11 None","startTime":68.17567567567568,"endTime":71.02702702702703,"audioSegment":0},{"text":"Productivity 20/26 8/13 None","startTime":71.02702702702703,"endTime":73.87837837837839,"audioSegment":0},{"text":"Developer 19/20 3/10 None","startTime":73.87837837837839,"endTime":76.72972972972973,"audioSegment":0},{"text":"Complex work 13/16 5/7 One infrastructure exclusion, two interruptions, one unattempted entry","startTime":76.72972972972973,"endTime":79.58108108108108,"audioSegment":0},{"text":"Total 71/84 27/41 Three excluded attempts and one unattempted entry","startTime":79.58108108108108,"endTime":82.43243243243244,"audioSegment":0},{"text":"The tables retain three separate records: 85 original terminal trials,","startTime":82.43243243243244,"endTime":85.28378378378379,"audioSegment":0},{"text":"the interrupted repetition-2 fanout attempt, and 42 round-3 attempts.","startTime":85.28378378378379,"endTime":88.13513513513513,"audioSegment":0},{"text":"The original and continuation environments differ only in the explicit path to an existing,","startTime":88.13513513513513,"endTime":90.98648648648648,"audioSegment":0},{"text":"verified Microsoft-signed sandbox launcher through GEZEL_MXC_EXEC.","startTime":90.98648648648648,"endTime":93.83783783783784,"audioSegment":0},{"text":"Source, service build, catalog, fixtures, native binaries,","startTime":93.83783783783784,"endTime":96.6891891891892,"audioSegment":0},{"text":"model, tuning and prompts remained identical.","startTime":96.6891891891892,"endTime":99.54054054054053,"audioSegment":0},{"text":"No completed task was retried.","startTime":99.54054054054053,"endTime":102.39189189189189,"audioSegment":0},{"text":"The original stopped journals and all fixed scores are preserved,","startTime":102.39189189189189,"endTime":105.24324324324324,"audioSegment":0},{"text":"including the stale running marker for the interrupted final attempt.","startTime":105.24324324324324,"endTime":108.0945945945946,"audioSegment":0},{"text":"The causes of the process interruptions remain unconfirmed.","startTime":108.0945945945946,"endTime":110.94594594594595,"audioSegment":0},{"text":"Median output generation was 8.35 tokens/s across the 126 terminal trials,","startTime":110.94594594594595,"endTime":113.79729729729729,"audioSegment":0},{"text":"with a range of 2.57–9.41.","startTime":113.79729729729729,"endTime":116.64864864864865,"audioSegment":0},{"text":"The original segment's median was 8.46; round 3's was 8.17.","startTime":116.64864864864865,"endTime":119.5,"audioSegment":0},{"text":"These are engine decoding rates summarized per trial,","startTime":119.5,"endTime":122.35135135135135,"audioSegment":0},{"text":"not output tokens divided by total task time.","startTime":122.35135135135135,"endTime":125.2027027027027,"audioSegment":0},{"text":"Round 3 also contained a slower period: its middle 23 terminal trials had a median of 2.79 tokens/s,","startTime":125.2027027027027,"endTime":128.05405405405406,"audioSegment":0},{"text":"compared with 8.585 in its first 16.","startTime":128.05405405405406,"endTime":130.90540540540542,"audioSegment":0},{"text":"The cause was not established.","startTime":130.90540540540542,"endTime":133.75675675675677,"audioSegment":0},{"text":"Median prompt processing across terminal trials was 369.47 tokens/s.","startTime":133.75675675675677,"endTime":136.60810810810813,"audioSegment":0},{"text":"Observed peaks were 10,654 MiB GPU memory, 17,260 MiB process-tree RSS,","startTime":136.60810810810813,"endTime":139.45945945945945,"audioSegment":0},{"text":"and 31,721 MiB whole-system RAM out of 31,865 MiB.","startTime":139.45945945945945,"endTime":142.3108108108108,"audioSegment":0},{"text":"These peaks came from different trials and must not be added;","startTime":142.3108108108108,"endTime":145.16216216216216,"audioSegment":0},{"text":"GPU measurements also include image-generation work.","startTime":145.16216216216216,"endTime":148.01351351351352,"audioSegment":0},{"text":"Shared GPU memory and paging were not measured.","startTime":148.01351351351352,"endTime":150.86486486486487,"audioSegment":0},{"text":"Logs contain eight recovered endpoint or nonzero-exit episodes,","startTime":150.86486486486487,"endTime":153.71621621621622,"audioSegment":0},{"text":"with no explicit CUDA out-of-memory or context-overflow message.","startTime":153.71621621621622,"endTime":156.56756756756758,"audioSegment":0},{"text":"Successful loading therefore does not establish reliable completion or quality across every task type.","startTime":156.56756756756758,"endTime":159.4189189189189,"audioSegment":0},{"text":"Claude CLI Sonnet 5.5 reviewed all 128 attempted results in an independent pass: 52 have numeric scores on their exact applicable axes,","startTime":159.4189189189189,"endTime":162.27027027027026,"audioSegment":0},{"text":"59 have qualitative reviews without invented numeric axes, and 17 record a missing declared artifact.","startTime":162.27027027027026,"endTime":165.1216216216216,"audioSegment":0},{"text":"The CLI response identifies claude-sonnet-5-5 for every review.","startTime":165.1216216216216,"endTime":167.97297297297297,"audioSegment":0},{"text":"Each supplied artifact was capped at 20 KiB,","startTime":167.97297297297297,"endTime":170.82432432432432,"audioSegment":0},{"text":"with up to 20 KiB of supporting source context.","startTime":170.82432432432432,"endTime":173.67567567567568,"audioSegment":0},{"text":"This was source inspection, without new rendering or execution.","startTime":173.67567567567568,"endTime":176.52702702702703,"audioSegment":0},{"text":"Prior scores were withheld from Sonnet.","startTime":176.52702702702703,"endTime":179.3783783783784,"audioSegment":0},{"text":"Its scores remain advisory and separate by rubric;","startTime":179.3783783783784,"endTime":182.22972972972974,"audioSegment":0},{"text":"the original 128 Codex reviews are retained separately.","startTime":182.22972972972974,"endTime":185.08108108108107,"audioSegment":0},{"text":"Neither judge changes the deterministic capability scores.","startTime":185.08108108108107,"endTime":187.93243243243242,"audioSegment":0},{"text":"The evidence shows both useful task execution and recurring weaknesses.","startTime":187.93243243243242,"endTime":190.78378378378378,"audioSegment":0},{"text":"Exact data cleanup and a successful test-driven repair contrast with later developer stalls,","startTime":190.78378378378378,"endTime":193.63513513513513,"audioSegment":0},{"text":"incomplete bookkeeping and fragile authored gate scripts.","startTime":193.63513513513513,"endTime":196.48648648648648,"audioSegment":0},{"text":"Some automatic passes accepted incomplete or incorrect work.","startTime":196.48648648648648,"endTime":199.33783783783784,"audioSegment":0},{"text":"Mock-tool startup and certificate failures, grounding checks,","startTime":199.33783783783784,"endTime":202.1891891891892,"audioSegment":0},{"text":"and a source section appended by the write tool also contributed to failures.","startTime":202.1891891891892,"endTime":205.04054054054055,"audioSegment":0},{"text":"The downloadable postmortems distinguish these framework and evaluator contributions from artifact defects.","startTime":205.04054054054055,"endTime":207.8918918918919,"audioSegment":0},{"text":"The observed change in developer results is descriptive;","startTime":207.8918918918919,"endTime":210.74324324324323,"audioSegment":0},{"text":"it does not establish a cause.","startTime":210.74324324324323,"endTime":213.59459459459458,"audioSegment":0},{"text":"Download the scorecard data, full trial and review evidence, final report,","startTime":213.59459459459458,"endTime":216.44594594594594,"audioSegment":0},{"text":"three-repetition trial table, Sonnet 5.5 reviews, and CPU-offload audit.","startTime":216.44594594594594,"endTime":219.2972972972973,"audioSegment":0},{"text":"Download notes and validation explain the separate baselines,","startTime":219.2972972972973,"endTime":222.14864864864865,"audioSegment":0},{"text":"exclusions, bounded reviews, reproducible export and evidence hashes.","startTime":222.14864864864865,"endTime":225,"audioSegment":0}],"version":1},"startBlock":{"title":"2026-11-09 · Windows x64 · RTX 5070 Ti Laptop (12 GB)","subtitle":"A focused rerun on AMD Ryzen AI 9 HX 370 w/ Radeon 890M · NVIDIA GeForce RTX 5070 Ti Laptop GPU · 31 GB: 1 model across 4 task sets. Every round is listed in the model scorecard, with its results side by side in one table.","ambientMotion":"zoomIn"}}</script>
