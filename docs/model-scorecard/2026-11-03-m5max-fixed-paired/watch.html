ot run.","startTime":25.71186440677966,"endTime":27.8135593220339,"audioSegment":0},{"text":"This chronological subset was selected after outcomes were visible,","startTime":27.8135593220339,"endTime":29.91525423728814,"audioSegment":0},{"text":"so the findings are exploratory.","startTime":29.91525423728814,"endTime":32.016949152542374,"audioSegment":0},{"text":"Both models passed 16/18 on MLX and 18/18 on llama.cpp. Practical","startTime":32.016949152542374,"endTime":34.11864406779661,"audioSegment":0},{"text":"equivalence within our chosen margin of ±5 percentage points is not established.","startTime":34.11864406779661,"endTime":36.22033898305085,"audioSegment":0},{"text":"The observed difference is −11.11 pp; the conservative paired","startTime":36.22033898305085,"endTime":38.32203389830509,"audioSegment":0},{"text":"95% interval is [−38.09, +20.66] pp and the scenario-cluster bootstrap interval","startTime":38.32203389830509,"endTime":40.42372881355932,"audioSegment":0},{"text":"is [−26.32, 0.00] pp for each model.","startTime":40.42372881355932,"endTime":42.525423728813564,"audioSegment":0},{"text":"These data also do not establish that the","startTime":42.525423728813564,"endTime":44.6271186440678,"audioSegment":0},{"text":"underlying gap exceeds 5 pp.","startTime":44.6271186440678,"endTime":46.728813559322035,"audioSegment":0},{"text":"The paired analysis documents assumptions,","startTime":46.728813559322035,"endTime":48.83050847457628,"audioSegment":0},{"text":"unavailable original pairs, sensitivity and nominal/adjusted tests.","startTime":48.83050847457628,"endTime":50.93220338983051,"audioSegment":0},{"text":"Median recorded decode was 34.00 tok/s on MLX versus 35.66 on llama.cpp","startTime":50.93220338983051,"endTime":53.03389830508475,"audioSegment":0},{"text":"for Qwen, and 59.00 versus 84.12 for Gemma.","startTime":53.03389830508475,"endTime":55.13559322033899,"audioSegment":0},{"text":"Gemma's roughly 30% lower","startTime":55.13559322033899,"endTime":57.237288135593225,"audioSegment":0},{"text":"MLX rate here does not reproduce the earlier twofold gap.","startTime":57.237288135593225,"endTime":59.33898305084746,"audioSegment":0},{"text":"These are complete","startTime":59.33898305084746,"endTime":61.4406779661017,"audioSegment":0},{"text":"integration measurements with different estimators, quantizations and","startTime":61.4406779661017,"endTime":63.54237288135594,"audioSegment":0},{"text":"speculative decoding,","startTime":63.54237288135594,"endTime":65.64406779661017,"audioSegment":0},{"text":"not an isolated engine benchmark or causal test of a fix.","startTime":65.64406779661017,"endTime":67.74576271186442,"audioSegment":0},{"text":"Gemma MLX used a staged assistant drafter candidate; Gilde remained 0.3.5.","startTime":67.74576271186442,"endTime":69.84745762711864,"audioSegment":0},{"text":"MLX prefill was recovered from first-token diagnostics: 121 rounded rate","startTime":69.84745762711864,"endTime":71.94915254237289,"audioSegment":0},{"text":"observations in the 36 included MLX trials.","startTime":71.94915254237289,"endTime":74.05084745762713,"audioSegment":0},{"text":"The medians of trial medians","startTime":74.05084745762713,"endTime":76.15254237288136,"audioSegment":0},{"text":"are 604.75 tok/s for Qwen and 1332.25 for Gemma.","startTime":76.15254237288136,"endTime":78.2542372881356,"audioSegment":0},{"text":"Tables mark these rates","startTime":78.2542372881356,"endTime":80.35593220338984,"audioSegment":0},{"text":"as observed: they cover partial provider turns and are not equivalent to","startTime":80.35593220338984,"endTime":82.45762711864407,"audioSegment":0},{"text":"llama.cpp's duration-weighted aggregate.","startTime":82.45762711864407,"endTime":84.55932203389831,"audioSegment":0},{"text":"Exact MLX prefill times remain unknown.","startTime":84.55932203389831,"endTime":86.66101694915255,"audioSegment":0},{"text":"The download preserves all 126 observations across all 37 recorded MLX trials,","startTime":86.66101694915255,"endTime":88.76271186440678,"audioSegment":0},{"text":"their source hashes and coverage limits.","startTime":88.76271186440678,"endTime":90.86440677966102,"audioSegment":0},{"text":"All four recorded failures remain unchanged.","startTime":90.86440677966102,"endTime":92.96610169491527,"audioSegment":0},{"text":"The diagnoses identify an","startTime":92.96610169491527,"endTime":95.0677966101695,"audioSegment":0},{"text":"image-tool workflow failure, unresolved duplicate data, a section-placement","startTime":95.0677966101695,"endTime":97.16949152542374,"audioSegment":0},{"text":"failure, and a conflict-synthesis gate false-positive.","startTime":97.16949152542374,"endTime":99.27118644067798,"audioSegment":0},{"text":"The last unpaired","startTime":99.27118644067798,"endTime":101.37288135593221,"audioSegment":0},{"text":"Gemma MLX PowerPoint trial passed its gate but encountered a fixture-identity","startTime":101.37288135593221,"endTime":103.47457627118645,"audioSegment":0},{"text":"flag; it is excluded from the matched comparison and retained in downloads.","startTime":103.47457627118645,"endTime":105.57627118644069,"audioSegment":0},{"text":"There are 25 artifact reviews, including that excluded trial's review;","startTime":105.57627118644069,"endTime":107.67796610169492,"audioSegment":0},{"text":"24 enter the displayed rubric means.","startTime":107.67796610169492,"endTime":109.77966101694916,"audioSegment":0},{"text":"The other 48 trials have no applicable rubric.","startTime":109.77966101694916,"endTime":111.8813559322034,"audioSegment":0},{"text":"Fixed scores and advisory quality remain separate.","startTime":111.8813559322034,"endTime":113.98305084745763,"audioSegment":0},{"text":"Download the report,","startTime":113.98305084745763,"endTime":116.08474576271188,"audioSegment":0},{"text":"paired analysis,","startTime":116.08474576271188,"endTime":118.1864406779661,"audioSegment":0},{"text":"performance CSV,","startTime":118.1864406779661,"endTime":120.28813559322035,"audioSegment":0},{"text":"performance data,","startTime":120.28813559322035,"endTime":122.38983050847459,"audioSegment":0},{"text":"MLX prefill observations,","startTime":122.38983050847459,"endTime":124.49152542372882,"audioSegment":0},{"text":"and judge data.","startTime":124.49152542372882,"endTime":126.59322033898306,"audioSegment":0},{"text":"The download index","startTime":126.59322033898306,"endTime":128.6949152542373,"audioSegment":0},{"text":"also links all 73 trial records, postmortems, provenance, verification and the","startTime":128.6949152542373,"endTime":130.79661016949154,"audioSegment":0},{"text":"scope amendment.","startTime":130.79661016949154,"endTime":132.89830508474577,"audioSegment":0},{"text":"The earlier native-0.1.54 round remains a separate record.","startTime":132.89830508474577,"endTime":135,"audioSegment":0}],"version":1},"startBlock":{"title":"2026-11-03 · Mac · Apple M5 Max","subtitle":"A focused rerun on M5 Max · Apple M5 Max (integrated GPU) · 128 GB: 2 models across 2 task sets. Every round is listed in the model scorecard, with its results side by side in one table.","ambientMotion":"zoomIn"}}</script>
