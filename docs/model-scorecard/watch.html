deepseek-v4-flash-284b-q2284B34/39 (87%)6.5/10 (26 pieces)16.9 tok/s output680 tok/s prefill——qwen3.6-27b-q8 (kv: q8_0)27B32/39 (82%)6.8/10 (27 pieces)7.8 tok/s output725 tok/s prefill256K29.2 GBbtl4-35b-q4 (kv: q8_0)35B31/39 (79%)6.7/10 (27 pieces)73.2 tok/s output1,608 tok/s prefill64K4.8 GBgemma4-e4b-q4 (kv: f16)8B31/39 (79%)5.2/10 (26 pieces)65.4 tok/s output4,698 tok/s prefill128K5.1 GB","startTime":179,"endTime":194,"audioSegment":0},{"text":"Tasks passed counts every attempt across every job in the set.","startTime":194,"endTime":197.85185185185185,"audioSegment":0},{"text":"A model with 24/33 (73%) finished 24 of 33 attempts correctly.","startTime":197.85185185185185,"endTime":201.7037037037037,"audioSegment":0},{"text":"If any job in the set ran fewer than three times you'll see a raw count instead of a percentage —","startTime":201.7037037037037,"endTime":205.55555555555554,"audioSegment":0},{"text":"too small a sample to quote as a rate.","startTime":205.55555555555554,"endTime":209.40740740740742,"audioSegment":0},{"text":"A model whose results were incomplete is left out of the table entirely rather than shown with a gap.","startTime":209.40740740740742,"endTime":213.25925925925927,"audioSegment":0},{"text":"Quality is an AI reviewer's opinion of the finished work,","startTime":213.25925925925927,"endTime":217.11111111111111,"audioSegment":0},{"text":"and the count beside it is how many pieces that opinion covers.","startTime":217.11111111111111,"endTime":220.96296296296296,"audioSegment":0},{"text":"It only grades work that was actually produced, so a model that fails often is judged on its successes alone —","startTime":220.96296296296296,"endTime":224.8148148148148,"audioSegment":0},{"text":"6.5/10 (18 pieces) is a weaker claim than 6.5/10 (26 pieces).","startTime":224.8148148148148,"endTime":228.66666666666666,"audioSegment":0},{"text":"Treat it as colour next to the pass rate,","startTime":228.66666666666666,"endTime":232.51851851851853,"audioSegment":0},{"text":"never as a substitute for it.","startTime":232.51851851851853,"endTime":236.37037037037038,"audioSegment":0},{"text":"Performance shows two measured speeds on the machine named above: output speed is how fast the model writes its answer,","startTime":236.37037037037038,"endTime":240.22222222222223,"audioSegment":0},{"text":"and prefill speed is how fast it takes in your prompt and documents.","startTime":240.22222222222223,"endTime":244.07407407407408,"audioSegment":0},{"text":"Both matter for how a gezel feels — prefill governs the pause before it starts,","startTime":244.07407407407408,"endTime":247.92592592592592,"audioSegment":0},{"text":"while output governs how fast text appears.","startTime":247.92592592592592,"endTime":251.77777777777777,"audioSegment":0},{"text":"A dash means that round did not record a throughput probe.","startTime":251.77777777777777,"endTime":255.62962962962962,"audioSegment":0},{"text":"Context is the working memory the model was given for these runs —","startTime":255.62962962962962,"endTime":259.48148148148147,"audioSegment":0},{"text":"how much it can hold at once.","startTime":259.48148148148147,"endTime":263.3333333333333,"audioSegment":0},{"text":"Memory used is the peak RAM the model and its engine actually occupied,","startTime":263.3333333333333,"endTime":267.18518518518516,"audioSegment":0},{"text":"which is the number to check against your own machine.","startTime":267.18518518518516,"endTime":271.03703703703707,"audioSegment":0},{"text":"When the engine reported its KV-cache precision,","startTime":271.03703703703707,"endTime":274.8888888888889,"audioSegment":0},{"text":"it appears beside the model name — for example, (kv: q8_0).","startTime":274.8888888888889,"endTime":278.74074074074076,"audioSegment":0},{"text":"Each test round keeps its General capability and Office and knowledge work tables together under one provenance stamp.","startTime":278.74074074074076,"endTime":282.5925925925926,"audioSegment":0},{"text":"Earlier rounds stay separate from the latest because a change to gezel or to the task set can move a score without any model changing.","startTime":282.5925925925926,"endTime":286.44444444444446,"audioSegment":0},{"text":"Size is the model's parameter count where we know it.","startTime":286.44444444444446,"endTime":290.2962962962963,"audioSegment":0},{"text":"Bigger is often but not always better: on office work in particular,","startTime":290.2962962962963,"endTime":294.14814814814815,"audioSegment":0},{"text":"some smaller models beat larger ones, and a model family's habits matter more than its size.","startTime":294.14814814814815,"endTime":298,"audioSegment":0},{"text":"A high score on the office set is the better guide for everyday document,","startTime":298,"endTime":301.6666666666667,"audioSegment":0},{"text":"planning, and analysis work.","startTime":301.6666666666667,"endTime":305.3333333333333,"audioSegment":0},{"text":"A high score on the general set matters more if you want a gezel writing or fixing code.","startTime":305.3333333333333,"endTime":309,"audioSegment":0},{"text":"If a model you're considering isn't listed,","startTime":309,"endTime":312.6666666666667,"audioSegment":0},{"text":"it hasn't been measured here yet — which is not a verdict on it either way.","startTime":312.6666666666667,"endTime":316.3333333333333,"audioSegment":0},{"text":"The Models catalogue in the app will still tell you whether it fits this machine.","startTime":316.3333333333333,"endTime":320,"audioSegment":0}],"version":1},"startBlock":{"title":"Model scorecard","subtitle":"These are measured results, not estimates. Each number is the count of jobs a model actually finished correctly, checked by a program on a real machine.","ambientMotion":"zoomIn"}}</script>
