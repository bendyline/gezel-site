value":"Choosing from this","position":{"start":{"line":150,"column":4,"offset":37594},"end":{"line":150,"column":22,"offset":37612}}}],"position":{"start":{"line":150,"column":1,"offset":37591},"end":{"line":150,"column":22,"offset":37612}}},"title":"Choosing from this","contents":[{"type":"paragraph","children":[{"type":"text","value":"A high score on the office set is the better guide for everyday document, planning, and analysis work. A high score on the general set matters more if you want a gezel writing or fixing code.","position":{"start":{"line":152,"column":1,"offset":37614},"end":{"line":152,"column":192,"offset":37805}}}],"position":{"start":{"line":152,"column":1,"offset":37614},"end":{"line":152,"column":192,"offset":37805}}},{"type":"paragraph","children":[{"type":"text","value":"If a model you're considering isn't listed, it hasn't been measured here yet — which is not a verdict on it either way. The Models catalogue in the app will still tell you whether it fits this machine.","position":{"start":{"line":154,"column":1,"offset":37807},"end":{"line":154,"column":202,"offset":38008}}}],"position":{"start":{"line":154,"column":1,"offset":37807},"end":{"line":154,"column":202,"offset":38008}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"These are measured results, not estimates.","startTime":0,"endTime":3.8333333333333335,"audioSegment":0},{"text":"Each number is the count of jobs a model actually finished correctly,","startTime":3.8333333333333335,"endTime":7.666666666666667,"audioSegment":0},{"text":"checked by a program on a real machine.","startTime":7.666666666666667,"endTime":11.5,"audioSegment":0},{"text":"How we test models explains what was counted and what these numbers do not tell you.","startTime":11.5,"endTime":15.333333333333334,"audioSegment":0},{"text":"The short version: each job is run three times, a job passes only when every requirement is met,","startTime":15.333333333333334,"endTime":19.166666666666668,"audioSegment":0},{"text":"and runs lost to machine trouble are set aside rather than blamed on the model.","startTime":19.166666666666668,"endTime":23,"audioSegment":0},{"text":"Each round has two tables measured on the same machine and build.","startTime":23,"endTime":27.8,"audioSegment":0},{"text":"General capability covers writing a small working program, fixing a bug from its symptoms,","startTime":27.8,"endTime":32.6,"audioSegment":0},{"text":"following a procedure and stopping at a problem, and turning several documents into one reconciled summary.","startTime":32.6,"endTime":37.4,"audioSegment":0},{"text":"Office and knowledge work covers a customer notice under a hard word limit, a meeting turned into an action register,","startTime":37.4,"endTime":42.2,"audioSegment":0},{"text":"a cited research brief, an experiment read-out, a spreadsheet model, a slide deck, and a Word document.","startTime":42.2,"endTime":47,"audioSegment":0},{"text":"Tasks passed counts every attempt across every job in the set.","startTime":47,"endTime":50.851851851851855,"audioSegment":0},{"text":"A model with 24/33 (73%) finished 24 of 33 attempts correctly.","startTime":50.851851851851855,"endTime":54.7037037037037,"audioSegment":0},{"text":"If any job in the set ran fewer than three times you'll see a raw count instead of a percentage —","startTime":54.7037037037037,"endTime":58.55555555555556,"audioSegment":0},{"text":"too small a sample to quote as a rate.","startTime":58.55555555555556,"endTime":62.407407407407405,"audioSegment":0},{"text":"A model whose results were incomplete is left out of the table entirely rather than shown with a gap.","startTime":62.407407407407405,"endTime":66.25925925925927,"audioSegment":0},{"text":"Quality is an AI reviewer's opinion of the finished work,","startTime":66.25925925925927,"endTime":70.11111111111111,"audioSegment":0},{"text":"and the count beside it is how many pieces that opinion covers.","startTime":70.11111111111111,"endTime":73.96296296296296,"audioSegment":0},{"text":"It only grades work that was actually produced, so a model that fails often is judged on its successes alone —","startTime":73.96296296296296,"endTime":77.81481481481481,"audioSegment":0},{"text":"6.5/10 (18 pieces) is a weaker claim than 6.5/10 (26 pieces).","startTime":77.81481481481481,"endTime":81.66666666666666,"audioSegment":0},{"text":"Treat it as colour next to the pass rate,","startTime":81.66666666666666,"endTime":85.51851851851852,"audioSegment":0},{"text":"never as a substitute for it.","startTime":85.51851851851852,"endTime":89.37037037037037,"audioSegment":0},{"text":"Performance shows two measured speeds on the machine named above: output speed is how fast the model writes its answer,","startTime":89.37037037037037,"endTime":93.22222222222223,"audioSegment":0},{"text":"and prefill speed is how fast it takes in your prompt and documents.","startTime":93.22222222222223,"endTime":97.07407407407408,"audioSegment":0},{"text":"Both matter for how a gezel feels — prefill governs the pause before it starts,","startTime":97.07407407407408,"endTime":100.92592592592592,"audioSegment":0},{"text":"while output governs how fast text appears.","startTime":100.92592592592592,"endTime":104.77777777777777,"audioSegment":0},{"text":"A dash means that round did not record a throughput probe.","startTime":104.77777777777777,"endTime":108.62962962962962,"audioSegment":0},{"text":"Context is the working memory the model was given for these runs —","startTime":108.62962962962962,"endTime":112.48148148148148,"audioSegment":0},{"text":"how much it can hold at once.","startTime":112.48148148148148,"endTime":116.33333333333333,"audioSegment":0},{"text":"Memory used is the peak RAM the model and its engine actually occupied,","startTime":116.33333333333333,"endTime":120.18518518518518,"audioSegment":0},{"text":"which is the number to check against your own machine.","startTime":120.18518518518518,"endTime":124.03703703703704,"audioSegment":0},{"text":"When the engine reported its KV-cache precision,","startTime":124.03703703703704,"endTime":127.88888888888889,"audioSegment":0},{"text":"it appears beside the model name — for example, (kv: q8_0).","startTime":127.88888888888889,"endTime":131.74074074074073,"audioSegment":0},{"text":"Each test round keeps its General capability and Office and knowledge work tables together under one provenance stamp.","startTime":131.74074074074073,"endTime":135.59259259259258,"audioSegment":0},{"text":"Earlier rounds stay separate from the latest because a change to gezel or to the task set can move a score without any model changing.","startTime":135.59259259259258,"endTime":139.44444444444446,"audioSegment":0},{"text":"Size is the model's parameter count where we know it.","startTime":139.44444444444446,"endTime":143.2962962962963,"audioSegment":0},{"text":"Bigger is often but not always better: on office work in particular,","startTime":143.2962962962963,"endTime":147.14814814814815,"audioSegment":0},{"text":"some smaller models beat larger ones, and a model family's habits matter more than its size.","startTime":147.14814814814815,"endTime":151,"audioSegment":0},{"text":"A high score on the office set is the better guide for everyday document,","startTime":151,"endTime":154.66666666666666,"audioSegment":0},{"text":"planning, and analysis work.","startTime":154.66666666666666,"endTime":158.33333333333334,"audioSegment":0},{"text":"A high score on the general set matters more if you want a gezel writing or fixing code.","startTime":158.33333333333334,"endTime":162,"audioSegment":0},{"text":"If a model you're considering isn't listed,","startTime":162,"endTime":165.66666666666666,"audioSegment":0},{"text":"it hasn't been measured here yet — which is not a verdict on it either way.","startTime":165.66666666666666,"endTime":169.33333333333334,"audioSegment":0},{"text":"The Models catalogue in the app will still tell you whether it fits this machine.","startTime":169.33333333333334,"endTime":173,"audioSegment":0}],"version":1},"startBlock":{"title":"Model scorecard","subtitle":"These are measured results, not estimates. Each number is the count of jobs a model actually finished correctly, checked by a program on a real machine.","ambientMotion":"zoomIn"}}</script>
