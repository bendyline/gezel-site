ents into one reconciled summary.","startTime":32.6,"endTime":37.4,"audioSegment":0},{"text":"Office and knowledge work covers a customer notice under a hard word limit, a meeting turned into an action register,","startTime":37.4,"endTime":42.2,"audioSegment":0},{"text":"a cited research brief, an experiment read-out, a spreadsheet model, a slide deck, and a Word document.","startTime":42.2,"endTime":47,"audioSegment":0},{"text":"M4 Max · 64 GB · llama-cpp + mlx · 3 trials per task · 2026-08-22 · gezel b3be0a7f · catalog 0.1.39","startTime":47,"endTime":54,"audioSegment":0},{"text":"ModelSizeTasks passedQualityPerformanceContextMemory usedgemma4-12b-q4 (kv: f16)12B31/33 (94%)6.9/10 (6 pieces)48.2 tok/s output508 tok/s prefill99K42.2 GBgemma4-12b-q8 (kv: f16)12B30/33 (91%)8.1/10 (3 pieces)30.3 tok/s output506 tok/s prefill83K42.0 GBbtl4-compact-iq2 (kv: q8_0)35B29/33 (88%)7.1/10 (9 pieces)80.4 tok/s output1,120 tok/s prefill256K14.6 GBornith1.5-9b-q8 (kv: q8_0)9B28/33 (85%)4.4/10 (5 pieces)47 tok/s output823 tok/s prefill256K15.9 GBqwen3.5-9b-q4 (kv: q8_0)9B28/33 (85%)5.3/10 (9 pieces)62.9 tok/s output787 tok/s prefill256K13.1 GBgemma4-e4b-q4 (kv: f16)8B26/33 (79%)5.4/10 (9 pieces)96.5 tok/s output1,442 tok/s prefill128K13.7 GBqwen3.5-4b-q4 (kv: q8_0)4B22/33 (67%)6.6/10 (9 pieces)89.3 tok/s output1,336 tok/s prefill256K11.5 GBgemma4-e2b-q4 (kv: f16)2.3B17/33 (52%)4.3/10 (9 pieces)144.1 tok/s output2,574 tok/s prefill128K6.9 GBlfm2.5-2.6b-q4 (kv: q8_0)2.6B13/33 (39%)3.6/10 (8 pieces)168.4 tok/s output2,125 tok/s prefill125K4.9 GBqwen3.5-2b-q4 (kv: q8_0)2B9/33 (27%)3.2/10 (9 pieces)155.3 tok/s output3,084 tok/s prefill256K5.2 GBmistral-7b-q4 (kv: q8_0)7B4/33 (12%)—76 tok/s output762 tok/s prefill32K9.6 GB","startTime":54,"endTime":87,"audioSegment":0},{"text":"ModelSizeTasks passedQualityPerformanceContextMemory usedgemma4-12b-q8 (kv: f16)12B35/39 (90%)5.8/10 (24 pieces)30.3 tok/s output506 tok/s prefill83K41.8 GBgemma4-12b-q4 (kv: f16)12B34/39 (87%)5.8/10 (24 pieces)4 725 tok/s prefill256K29.2 GBbtl4-35b-q4 (kv: q8_0)35B31/39 (79%)6.7/10 (27 pieces)73.2 tok/s output1,608 tok/s prefill64K4.8 GBgemma4-e4b-q4 (kv: f16)8B31/39 (79%)5.2/10 (26 pieces)65.4 tok/s output4,698 tok/s prefill128K5.1 GB","startTime":193,"endTime":208,"audioSegment":0},{"text":"Tasks passed counts every attempt across every job in the set.","startTime":208,"endTime":211.85185185185185,"audioSegment":0},{"text":"A model with 24/33 (73%) finished 24 of 33 attempts correctly.","startTime":211.85185185185185,"endTime":215.7037037037037,"audioSegment":0},{"text":"If any job in the set ran fewer than three times you'll see a raw count instead of a percentage —","startTime":215.7037037037037,"endTime":219.55555555555554,"audioSegment":0},{"text":"too small a sample to quote as a rate.","startTime":219.55555555555554,"endTime":223.40740740740742,"audioSegment":0},{"text":"A model whose results were incomplete is left out of the table entirely rather than shown with a gap.","startTime":223.40740740740742,"endTime":227.25925925925927,"audioSegment":0},{"text":"Quality is an AI reviewer's opinion of the finished work,","startTime":227.25925925925927,"endTime":231.11111111111111,"audioSegment":0},{"text":"and the count beside it is how many pieces that opinion covers.","startTime":231.11111111111111,"endTime":234.96296296296296,"audioSegment":0},{"text":"It only grades work that was actually produced, so a model that fails often is judged on its successes alone —","startTime":234.96296296296296,"endTime":238.8148148148148,"audioSegment":0},{"text":"6.5/10 (18 pieces) is a weaker claim than 6.5/10 (26 pieces).","startTime":238.8148148148148,"endTime":242.66666666666666,"audioSegment":0},{"text":"Treat it as colour next to the pass rate,","startTime":242.66666666666666,"endTime":246.51851851851853,"audioSegment":0},{"text":"never as a substitute for it.","startTime":246.51851851851853,"endTime":250.37037037037038,"audioSegment":0},{"text":"Performance shows two measured speeds on the machine named above: output speed is how fast the model writes its answer,","startTime":250.37037037037038,"endTime":254.22222222222223,"audioSegment":0},{"text":"and prefill speed is how fast it takes in your prompt and documents.","startTime":254.22222222222223,"endTime":258.0740740740741,"audioSegment":0},{"text":"Both matter for how a gezel feels — prefill governs the pause before it starts,","startTime":258.0740740740741,"endTime":261.9259259259259,"audioSegment":0},{"text":"while output governs how fast text appears.","startTime":261.9259259259259,"endTime":265.77777777777777,"audioSegment":0},{"text":"A dash means that round did not record a throughput probe.","startTime":265.77777777777777,"endTime":269.6296296296296,"audioSegment":0},{"text":"Context is the working memory the model was given for these runs —","startTime":269.6296296296296,"endTime":273.48148148148147,"audioSegment":0},{"text":"how much it can hold at once.","startTime":273.48148148148147,"endTime":277.3333333333333,"audioSegment":0},{"text":"Memory used is the peak RAM the model and its engine actually occupied,","startTime":277.3333333333333,"endTime":281.18518518518516,"audioSegment":0},{"text":"which is the number to check against your own machine.","startTime":281.18518518518516,"endTime":285.03703703703707,"audioSegment":0},{"text":"When the engine reported its KV-cache precision,","startTime":285.03703703703707,"endTime":288.8888888888889,"audioSegment":0},{"text":"it appears beside the model name — for example, (kv: q8_0).","startTime":288.8888888888889,"endTime":292.74074074074076,"audioSegment":0},{"text":"Each test round keeps its General capability and Office and knowledge work tables together under one provenance stamp.","startTime":292.74074074074076,"endTime":296.5925925925926,"audioSegment":0},{"text":"Earlier rounds stay separate from the latest because a change to gezel or to the task set can move a score without any model changing.","startTime":296.5925925925926,"endTime":300.44444444444446,"audioSegment":0},{"text":"Size is the model's parameter count where we know it.","startTime":300.44444444444446,"endTime":304.2962962962963,"audioSegment":0},{"text":"Bigger is often but not always better: on office work in particular,","startTime":304.2962962962963,"endTime":308.14814814814815,"audioSegment":0},{"text":"some smaller models beat larger ones, and a model family's habits matter more than its size.","startTime":308.14814814814815,"endTime":312,"audioSegment":0},{"text":"A high score on the office set is the better guide for everyday document,","startTime":312,"endTime":315.6666666666667,"audioSegment":0},{"text":"planning, and analysis work.","startTime":315.6666666666667,"endTime":319.3333333333333,"audioSegment":0},{"text":"A high score on the general set matters more if you want a gezel writing or fixing code.","startTime":319.3333333333333,"endTime":323,"audioSegment":0},{"text":"If a model you're considering isn't listed,","startTime":323,"endTime":326.6666666666667,"audioSegment":0},{"text":"it hasn't been measured here yet — which is not a verdict on it either way.","startTime":326.6666666666667,"endTime":330.3333333333333,"audioSegment":0},{"text":"The Models catalogue in the app will still tell you whether it fits this machine.","startTime":330.3333333333333,"endTime":334,"audioSegment":0}],"version":1},"startBlock":{"title":"Model scorecard","subtitle":"These are measured results, not estimates. Each number is the count of jobs a model actually finished correctly, checked by a program on a real machine.","ambientMotion":"zoomIn"}}</script>
