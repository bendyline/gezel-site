,"offset":61629}}}],"position":{"start":{"line":241,"column":1,"offset":61112},"end":{"line":243,"column":196,"offset":61629}}},{"type":"paragraph","children":[{"type":"text","value":"Treat these as a rough guide from one machine, not a promise about yours. The Models catalogue in the app is the better check for whether a model fits your computer. When the engine reported its KV-cache precision, it appears beside the model name — for example, ","position":{"start":{"line":245,"column":1,"offset":61631},"end":{"line":245,"column":264,"offset":61894}}},{"type":"inlineCode","value":"(kv: q8_0)","position":{"start":{"line":245,"column":264,"offset":61894},"end":{"line":245,"column":276,"offset":61906}}},{"type":"text","value":".","position":{"start":{"line":245,"column":276,"offset":61906},"end":{"line":245,"column":277,"offset":61907}}}],"position":{"start":{"line":245,"column":1,"offset":61631},"end":{"line":245,"column":277,"offset":61907}}},{"type":"paragraph","children":[{"type":"text","value":"Each ","position":{"start":{"line":247,"column":1,"offset":61909},"end":{"line":247,"column":6,"offset":61914}}},{"type":"strong","children":[{"type":"text","value":"test round","position":{"start":{"line":247,"column":8,"offset":61916},"end":{"line":247,"column":18,"offset":61926}}}],"position":{"start":{"line":247,"column":6,"offset":61914},"end":{"line":247,"column":20,"offset":61928}}},{"type":"text","value":" keeps all of its tables together under one provenance stamp. Earlier rounds stay separate from the latest because a change to gezel or to the task set can move a score without any model changing.","position":{"start":{"line":247,"column":20,"offset":61928},"end":{"line":247,"column":216,"offset":62124}}}],"position":{"start":{"line":247,"column":1,"offset":61909},"end":{"line":247,"column":216,"offset":62124}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Size","position":{"start":{"line":249,"column":3,"offset":62128},"end":{"line":249,"column":7,"offset":62132}}}],"position":{"start":{"line":249,"column":1,"offset":62126},"end":{"line":249,"column":9,"offset":62134}}},{"type":"text","value":" is the model's parameter count where we know it. Bigger is often but not always better: on office work in particular, some smaller models beat larger ones, and a model family's habits matter more than its size.","position":{"start":{"line":249,"column":9,"offset":62134},"end":{"line":249,"column":220,"offset":62345}}}],"position":{"start":{"line":249,"column":1,"offset":62126},"end":{"line":249,"column":220,"offset":62345}}}]},{"id":"choosing-from-this","startTime":204,"duration":27,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Choosing from this","position":{"start":{"line":251,"column":4,"offset":62350},"end":{"line":251,"column":22,"offset":62368}}}],"position":{"start":{"line":251,"column":1,"offset":62347},"end":{"line":251,"column":22,"offset":62368}}},"title":"Choosing from this","contents":[{"type":"paragraph","children":[{"type":"text","value":"A high score on the office set is the better guide for everyday document, planning, and analysis work. A high score on the general set matters more if you want a gezel writing or fixing code, and the engineering set, where a round has it, is the stricter test of that.","position":{"start":{"line":253,"column":1,"offset":62370},"end":{"line":253,"column":269,"offset":62638}}}],"position":{"start":{"line":253,"column":1,"offset":62370},"end":{"line":253,"column":269,"offset":62638}}},{"type":"paragraph","children":[{"type":"text","value":"If a model you're considering isn't listed, it hasn't been measured here yet — which is not a verdict on it either way. The Models catalogue in the app will still tell you whether it fits this machine.","position":{"start":{"line":255,"column":1,"offset":62640},"end":{"line":255,"column":202,"offset":62841}}}],"position":{"start":{"line":255,"column":1,"offset":62640},"end":{"line":255,"column":202,"offset":62841}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"These are measured results, not estimates.","startTime":0,"endTime":3.8333333333333335,"audioSegment":0},{"text":"Each number is the count of jobs a model actually finished correctly,","startTime":3.8333333333333335,"endTime":7.666666666666667,"audioSegment":0},{"text":"checked by a program on a real machine.","startTime":7.666666666666667,"endTime":11.5,"audioSegment":0},{"text":"How we test models explains what was counted and what these numbers do not tell you.","startTime":11.5,"endTime":15.333333333333334,"audioSegment":0},{"text":"The short version: each job is run three times, a job passes only when every requirement is met,","startTime":15.333333333333334,"endTime":19.166666666666668,"audioSegment":0},{"text":"and runs lost to machine trouble are set aside rather than blamed on the model.","startTime":19.166666666666668,"endTime":23,"audioSegment":0},{"text":"Each round has one table for each task set it ran,","startTime":23,"endTime":27.333333333333332,"audioSegment":0},{"text":"all measured on the same machine and build.","startTime":27.333333333333332,"endTime":31.666666666666664,"audioSegment":0},{"text":"Most rounds ran two sets.","startTime":31.666666666666664,"endTime":36,"audioSegment":0},{"text":"General capability covers writing a small working program, fixing a bug from its symptoms,","startTime":36,"endTime":40.33333333333333,"audioSegment":0},{"text":"following a procedure and stopping at a problem, and turning several documents into one reconciled summary.","startTime":40.33333333333333,"endTime":44.666666666666664,"audioSegment":0},{"text":"Office and knowledge work covers a customer notice under a hard word limit, a meeting turned into an action register,","startTime":44.666666666666664,"endTime":49,"audioSegment":0},{"text":"a cited research brief, an experiment read-out, a spreadsheet model, a slide deck, and a Word document.","startTime":49,"endTime":53.33333333333333,"audioSegment":0},{"text":"Some rounds add the two harder sets: Engineering work, which is developer work such as reviewing a change and proving a fix with tests,","startTime":53.33333333333333,"endTime":57.666666666666664,"audioSegment":0},{"text":"and Complex workflows, which asks a model to write and repair reusable recipes of its own.","startTime":57.666666666666664,"endTime":62,"audioSegment":0},{"text":"Tasks passed counts every attempt across every job in the set.","startTime":62,"endTime":65.64102564102564,"audioSegment":0},{"text":"A model with 24/33 (73%) finished 24 of 33 attempts correctly.","startTime":65.64102564102564,"endTime":69.28205128205128,"audioSegment":0},{"text":"If any job in the set ran fewer than three times you'll see a raw count instead of a percentage —","startTime":69.28205128205128,"endTime":72.92307692307692,"audioSegment":0},{"text":"too small a sample to quote as a rate.","startTime":72.92307692307692,"endTime":76.56410256410257,"audioSegment":0},{"text":"A model whose results were incomplete is left out of the table entirely rather than shown with a gap.","startTime":76.56410256410257,"endTime":80.2051282051282,"audioSegment":0},{"text":"Quality is an AI reviewer's opinion of the finished work,","startTime":80.2051282051282,"endTime":83.84615384615384,"audioSegment":0},{"text":"and the count beside it is how many pieces that opinion covers.","startTime":83.84615384615384,"endTime":87.48717948717949,"audioSegment":0},{"text":"It only grades work that was actually produced, so a model that fails often is judged on its successes alone —","startTime":87.48717948717949,"endTime":91.12820512820512,"audioSegment":0},{"text":"6.5/10 (18 pieces) is a weaker claim than 6.5/10 (26 pieces).","startTime":91.12820512820512,"endTime":94.76923076923077,"audioSegment":0},{"text":"Treat it as colour next to the pass rate,","startTime":94.76923076923077,"endTime":98.41025641025641,"audioSegment":0},{"text":"never as a substitute for it.","startTime":98.41025641025641,"endTime":102.05128205128204,"audioSegment":0},{"text":"Performance shows two measured speeds on the machine named above: output speed is how fast the model writes its answer,","startTime":102.05128205128204,"endTime":105.6923076923077,"audioSegment":0},{"text":"and prefill speed is how fast it takes in your prompt and documents.","startTime":105.6923076923077,"endTime":109.33333333333334,"audioSegment":0},{"text":"Both matter for how a gezel feels — prefill governs the pause before it starts,","startTime":109.33333333333334,"endTime":112.97435897435898,"audioSegment":0},{"text":"while output governs how fast text appears.","startTime":112.97435897435898,"endTime":116.61538461538461,"audioSegment":0},{"text":"A dash means that round did not record a throughput probe.","startTime":116.61538461538461,"endTime":120.25641025641025,"audioSegment":0},{"text":"Context is the working memory the model was given for these runs —","startTime":120.25641025641025,"endTime":123.8974358974359,"audioSegment":0},{"text":"how much it can hold at once.","startTime":123.8974358974359,"endTime":127.53846153846153,"audioSegment":0},{"text":"Memory used is the most memory the model and its engine held on the test machine.","startTime":127.53846153846153,"endTime":131.17948717948718,"audioSegment":0},{"text":"What that number covers depends on the machine,","startTime":131.17948717948718,"endTime":134.82051282051282,"audioSegment":0},{"text":"so each round says which one it measured:","startTime":134.82051282051282,"endTime":138.46153846153845,"audioSegment":0},{"text":"On a Mac the graphics chip shares the computer's memory and our measurement sees all of it,","startTime":138.46153846153845,"endTime":142.1025641025641,"audioSegment":0},{"text":"so Memory used is the model's whole footprint.","startTime":142.1025641025641,"endTime":145.74358974358972,"audioSegment":0},{"text":"On a PC with a separate graphics card the column is called System memory.","startTime":145.74358974358972,"endTime":149.3846153846154,"audioSegment":0},{"text":"It counts the computer's own memory only,","startTime":149.3846153846154,"endTime":153.02564102564102,"audioSegment":0},{"text":"not what the model keeps on the graphics card.","startTime":153.02564102564102,"endTime":156.66666666666669,"audioSegment":0},{"text":"On machines like the DGX Spark,","startTime":156.66666666666669,"endTime":160.30769230769232,"audioSegment":0},{"text":"where the graphics chip shares memory in a way our measurement can't see, the column is left out.","startTime":160.30769230769232,"endTime":163.94871794871796,"audioSegment":0},{"text":"The number would read far below what the model really uses.","startTime":163.94871794871796,"endTime":167.5897435897436,"audioSegment":0},{"text":"Treat these as a rough guide from one machine,","startTime":167.5897435897436,"endTime":171.23076923076923,"audioSegment":0},{"text":"not a promise about yours.","startTime":171.23076923076923,"endTime":174.87179487179486,"audioSegment":0},{"text":"The Models catalogue in the app is the better check for whether a model fits your computer.","startTime":174.87179487179486,"endTime":178.5128205128205,"audioSegment":0},{"text":"When the engine reported its KV-cache precision,","startTime":178.5128205128205,"endTime":182.15384615384613,"audioSegment":0},{"text":"it appears beside the model name — for example, (kv: q8_0).","startTime":182.15384615384613,"endTime":185.7948717948718,"audioSegment":0},{"text":"Each test round keeps all of its tables together under one provenance stamp.","startTime":185.7948717948718,"endTime":189.43589743589743,"audioSegment":0},{"text":"Earlier rounds stay separate from the latest because a change to gezel or to the task set can move a score without any model changing.","startTime":189.43589743589743,"endTime":193.07692307692307,"audioSegment":0},{"text":"Size is the model's parameter count where we know it.","startTime":193.07692307692307,"endTime":196.71794871794873,"audioSegment":0},{"text":"Bigger is often but not always better: on office work in particular,","startTime":196.71794871794873,"endTime":200.35897435897436,"audioSegment":0},{"text":"some smaller models beat larger ones, and a model family's habits matter more than its size.","startTime":200.35897435897436,"endTime":204,"audioSegment":0},{"text":"A high score on the office set is the better guide for everyday document,","startTime":204,"endTime":207.85714285714286,"audioSegment":0},{"text":"planning, and analysis work.","startTime":207.85714285714286,"endTime":211.71428571428572,"audioSegment":0},{"text":"A high score on the general set matters more if you want a gezel writing or fixing code,","startTime":211.71428571428572,"endTime":215.57142857142858,"audioSegment":0},{"text":"and the engineering set, where a round has it, is the stricter test of that.","startTime":215.57142857142858,"endTime":219.42857142857142,"audioSegment":0},{"text":"If a model you're considering isn't listed,","startTime":219.42857142857142,"endTime":223.28571428571428,"audioSegment":0},{"text":"it hasn't been measured here yet — which is not a verdict on it either way.","startTime":223.28571428571428,"endTime":227.14285714285714,"audioSegment":0},{"text":"The Models catalogue in the app will still tell you whether it fits this machine.","startTime":227.14285714285714,"endTime":231,"audioSegment":0}],"version":1},"startBlock":{"title":"Model scorecard","subtitle":"These are measured results, not estimates. Each number is the count of jobs a model actually finished correctly, checked by a program on a real machine.","ambientMotion":"zoomIn"}}</script>
