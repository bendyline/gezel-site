e":"heading","depth":2,"children":[{"type":"text","value":"Results by test round","position":{"start":{"line":7,"column":4,"offset":567},"end":{"line":7,"column":25,"offset":588}}}],"position":{"start":{"line":7,"column":1,"offset":564},"end":{"line":7,"column":25,"offset":588}}},"title":"Results by test round","contents":[{"type":"paragraph","children":[{"type":"text","value":"Focused reruns are labeled as subsets and retain their own round. They can verify a fix, but do not replace a full-suite comparison. Round notes explain unfinished coverage and documented evaluator failures; those failures remain recorded without being counted as model weaknesses.","position":{"start":{"line":9,"column":1,"offset":590},"end":{"line":9,"column":282,"offset":871}}}],"position":{"start":{"line":9,"column":1,"offset":590},"end":{"line":9,"column":282,"offset":871}}},{"type":"paragraph","children":[{"type":"text","value":"Each round has one table for each task set it ran, all measured on the same machine and build. Most rounds ran two sets. ","position":{"start":{"line":11,"column":1,"offset":873},"end":{"line":11,"column":122,"offset":994}}},{"type":"strong","children":[{"type":"text","value":"General capability","position":{"start":{"line":11,"column":124,"offset":996},"end":{"line":11,"column":142,"offset":1014}}}],"position":{"start":{"line":11,"column":122,"offset":994},"end":{"line":11,"column":144,"offset":1016}}},{"type":"text","value":" covers writing a small working program, fixing a bug from its symptoms, following a procedure and stopping at a problem, and turning several documents into one reconciled summary. ","position":{"start":{"line":11,"column":144,"offset":1016},"end":{"line":11,"column":325,"offset":1197}}},{"type":"strong","children":[{"type":"text","value":"Office and knowledge work","position":{"start":{"line":11,"column":327,"offset":1199},"end":{"line":11,"column":352,"offset":1224}}}],"position":{"start":{"line":11,"column":325,"offset":1197},"end":{"line":11,"column":354,"offset":1226}}},{"type":"text","value":" covers a customer notice under a hard word limit, a meeting turned into an action register, a cited research brief, an experiment read-out, a spreadsheet model, a slide deck, and a Word document. Some rounds add the two harder sets: ","position":{"start":{"line":11,"column":354,"offset":1226},"end":{"line":11,"column":588,"offset":1460}}},{"type":"strong","children":[{"type":"text","value":"Engineering work","position":{"start":{"line":11,"column":590,"offset":1462},"end":{"line":11,"column":606,"offset":1478}}}],"position":{"start":{"line":11,"column":588,"offset":1460},"end":{"line":11,"column":608,"offset":1480}}},{"type":"text","value":", which is developer work such as reviewing a change and proving a fix with tests, and ","position":{"start":{"line":11,"column":608,"offset":1480},"end":{"line":11,"column":695,"offset":1567}}},{"type":"strong","children":[{"type":"text","value":"Complex workflows","position":{"start":{"line":11,"column":697,"offset":1569},"end":{"line":11,"column":714,"offset":1586}}}],"position":{"start":{"line":11,"column":695,"offset":1567},"end":{"line":11,"column":716,"offset":1588}}},{"type":"text","value":", which asks a model to write and repair reusable recipes of its own.","position":{"start":{"line":11,"column":716,"offset":1588},"end":{"line":11,"column":785,"offset":1657}}}],"position":{"start":{"line":11,"column":1,"offset":873},"end":{"line":11,"column":785,"offset":1657}}},{"type":"htmlBlock","rawHtml":"<div class=\"hb-scorecard\" data-hb-scorecard=\"1\">\n<div class=\"hb-scorecard-controls\" data-hb-scorecard-controls=\"1\"></div>\n<div class=\"hb-scorecard-round\" data-hb-round=\"2026-10-25-m5max-bolt-five\" data-hb-round-label=\"2026-10-25\" data-hb-date=\"2026-10-25\" data-hb-hardware=\"mac\" data-hb-hardware-label=\"Mac\" data-hb-models=\"gemma4-12b gemma4-e2b gemma4-e4b nemotron3.5-bolt-e4b qwen3.5-9b\" data-hb-tiers=\"small medium tiny\" data-hb-latest=\"1\">\n<h4 class=\"hb-scorecard-round-title\">Latest round — 2026-10-25</h4>\n<p class=\"hb-scorecard-stamp\"><strong>M5 Max · Apple M5 Max (integrated GPU) · 128 GB · llama-cpp + mlx · 3 trials per task · 2026-10-25 · gezel 4f2c5491d9a1cbf6cdd645e708dd674a22615d15 · catalog 0.3.0</strong></p>\n<p class=\"hb-scorecard-round-note\">Complete five-model core comparison: 165 trials, 110 raw passes, 55 task failures; 158 artifact reviews and seven missing outputs. Bolt uses llama.cpp Metal; Gemma and Qwen use MLX. Four advisory rubrics remain separate. Bolt decode is request-derived; MLX output is an active-stream estimate and prefill is unavailable. Task observations include failed attempts and recovery, not admission probes. Known framework and evaluator defects remain in the frozen raw results; a gate pass does not certify artifact quality. See the October 25 M5 Max Bolt comparison JSON download for all judgments, performance coverage and 32 findings. Earlier old-build and interrupted trials are excluded.</p>\n<div class=\"hb-scorecard-suite\" data-hb-suite=\"core\">\n<h5 class=\"hb-scorecard-suite-title\">General capability</h5>\n<table><thead><tr><th>Model</th><th>Size</th><th>Tasks passed</th></tr></thead><tbody><tr data-hb-model=\"gemma4-e4b\" data-hb-tier=\"small\"><td>Gemma 4 (E4B, Q4)</td><td>small</td><td>26/33 (79%)</td></tr><tr data-hb-model=\"nemotron3.5-bolt-e4b\" data-hb-tier=\"small\"><td>Nemotron 3.5 Bolt (E4B, Q4)</td><td>small</td><td>26/33 (79%)</td></tr><tr data-hb-model=\"gemma4-12b\" data-hb-tier=\"medium\"><td>Gemma 4 (12B, Q4)</td><td>medium</td><td>23/33 (70%)</td></tr><tr data-hb-model=\"qwen3.5-9b\" data-hb-tier=\"small\"><td>Qwen 3.5 (9B, Q4)</td><td>small</td><td>21/33 (64%)</td></tr><tr data-hb-model=\"gemma4-e2b\" data-hb-tier=\"tiny\"><td>Gemma 4 (E2B, Q4)</td><td>tiny</td><td>14/33 (42%)</td></tr></tbody></table>\n<h6>Task performance</h6>\n<p>Task measurements across all attempted trials, including failures. Measurement methods and limits are stated in period labels and round notes. Values are per-trial medians (minimum–maximum; sample count), not admission probes. Wall time includes tools. System RSS and GPU memory are separate peak measurements; do not add their medians. Periods remain separate because hardware performance can change.</p>\n<table><thead><tr><th scope=\"col\">Model</th><th scope=\"col\">Period</th><th scope=\"col\">Trials</th><th scope=\"col\">Output (tok/s)</th><th scope=\"col\">Prefill (tok/s)</th><th scope=\"col\">Wall time (min)</th><th scope=\"col\">Peak system RSS (GiB)</th><th scope=\"col\">Peak GPU memory (GiB)</th></tr></thead><tbody>\n<tr data-hb-model=\"gemma4-e4b\" data-hb-tier=\"small\"><td>Gemma 4 (E4B, Q4)</td><td>Frozen run · MLX sampled decode estimate</td><td>33</td><td>79.00 (55.00–103.00; n=33)</td><td>—</td><td>2.3 (0.5–19.4; n=33)</td><td>8.11 (7.98–17.15; n=33)</td><td>—</td></tr>\n<tr data-hb-model=\"nemotron3.5-bolt-e4b\" data-hb-tier=\"small\"><td>Nemotron 3.5 Bolt (E4B, Q4)</td><td>Frozen run · llama.cpp request timings</td><td>33</td><td>72.00 (59.18–90.14; n=33)</td><td>2,513.96 (1,977.37–3,492.57; n=33)</td><td>2.6 (0.5–25.9; n=33)</td><td>10.04 (8.60–19.80; n=33)</td><td>—</td></tr>\n<tr data-hb-model=\"gemma4-12b\" data-hb-tier=\"medium\"><td>Gemma 4 (12B, Q4)</td><td>Frozen run · MLX sampled decode estimate</td><td>33</td><td>38.00 (30.00–49.00; n=33)</td><td>—</td><td>4.2 (0.7–19.2; n=33)</td><td>10.67 (10.31–14.21; n=33)</td><td>—</td></tr>\n<tr data-hb-model=\"qwen3.5-9b\" data-hb-tier=\"small\"><td>Qwen 3.5 (9B, Q4)</td><td>Frozen run · MLX sampled decode estimate</td><td>33</td><td>63.50 (30.00–87.00; n=30)</td><td>—</td><td>2.6 (0.7–44.5; n=33)</td><td>7.97 (7.20–20.80; n=33)</td><td>—</td></tr>\n<tr data-hb-model=\"gemma4-e2b\" data-hb-tier=\"tiny\"><td>Gemma 4 (E2B, Q4)</td><td>Frozen run · MLX sampled decode estimate</td><td>33</td><td>115.50 (96.00–136.00; n=32)</td><td>—</td><td>1.7 (0.5–19.9; n=33)</td><td>7.11 (7.03–10.38; n=33)</td><td>—</td></tr>\n</tbody></table>\n<h6>Artifact reviews</h6>\n<p>Advisory means out of 10, with eligible artifact counts. Rubrics are separate and are not a combined model score. A dash means no eligible artifact was scored under that rubric. Missing artifacts have no score; excluded reviews do not enter these means. Judge: codex-inline/current-session. Review identity and limitations are recorded with the evaluation.</p>\n<table><thead><tr><th scope=\"col\">Model</th><th scope=\"col\">Period</th><th scope=\"col\">Code quality</th><th scope=\"col\">Data quality</th><th scope=\"col\">Document quality</th><th scope=\"col\">HTML quality</th><th scope=\"col\">No artifact</th><th scope=\"col\">Excluded reviews</th></tr></thead><tbody>\n<tr data-hb-model=\"gemma4-e4b\" data-hb-tier=\"small\"><td>Gemma 4 (E4B, Q4)</td><td>Frozen run · MLX sampled decode estimate</td><td>4.84/10 (8 pieces)</td><td>4.50/10 (3 pieces)</td><td>4.02/10 (12 pieces)</td><td>2.56/10 (9 pieces)</td><td>1</td><td>0</td></tr>\n<tr data-hb-model=\"nemotron3.5-bolt-e4b\" data-hb-tier=\"small\"><td>Nemotron 3.5 Bolt (E4B, Q4)</td><td>Frozen run · llama.cpp request timings</td><td>4.78/10 (9 pieces)</td><td>4.00/10 (3 pieces)</td><td>4.17/10 (12 pieces)</td><td>2.58/10 (6 pieces)</td><td>3</td><td>0</td></tr>\n<tr data-hb-model=\"gemma4-12b\" data-hb-tier=\"medium\"><td>Gemma 4 (12B, Q4)</td><td>Frozen run · MLX sampled decode estimate</td><td>4.50/10 (9 pieces)</td><td>4.75/10 (2 pieces)</td><td>4.08/10 (12 pieces)</td><td>3.19/10 (9 pieces)</td><td>1</td><td>0</td></tr>\n<tr data-hb-model=\"qwen3.5-9b\" data-hb-tier=\"small\"><td>Qwen 3.5 (9B, Q4)</td><td>Frozen run · MLX sampled decode estimate</td><td>3.67/10 (9 pieces)</td><td>2.63/10 (2 pieces)</td><td>4.06/10 (12 pieces)</td><td>2.78/10 (9 pieces)</td><td>1</td><td>0</td></tr>\n<tr data-hb-model=\"gemma4-e2b\" data-hb-tier=\"tiny\"><td>Gemma 4 (E2B, Q4)</td><td>Frozen run · MLX sampled decode estimate</td><td>4.14/10 (9 pieces)</td><td>2.50/10 (3 pieces)</td><td>3.73/10 (12 pieces)</td><td>2.25/10 (8 pieces)</td><td>1</td><td>0</td></tr>\n</tbody></table>\n</div>\n</div>\n<div class=\"hb-scorecard-round\" data-hb-round=\"2026-10-21-m5max-ornith-observed-subset\" data-hb-round-label=\"2026-10-21\" data-hb-date=\"2026-10-21\" data-hb-hardware=\"mac\" data-hb-hardware-label=\"Mac\" data-hb-models=\"ornith1.5-35b-a3b\" data-hb-tiers=\"medium\">\n<h4 class=\"hb-scorecard-round-title\">Partial round — 2026-10-21</h4>\n<p class=\"hb-scorecard-stamp\"><strong>M5 Max · Apple M5 Max (integrated GPU) · 128 GB · llama-cpp · focused subset · 3 trials per task · 2026-10-21 · gezel bc4af5dc2649 · catalog 0.2.3</strong> — different gezel build, different catalog version, different task coverage</p>\n<p class=\"hb-scorecard-round-note\">PARTIAL OBSERVATIONS: Ornith recorded 85 of 129 planned trials; 84 stable-identity observations are included here. The final drift-flagged failure is retained in the 601-observation companion and omitted from these comparison cells. No third repetition was run; report counts, not rates. Nemotron and MiniCPM were not run. Four suites, 43 suite entries, three requested repetitions. Fixed classifications and scores are unchanged. No pooled qualitative judge score: see scorecard-details.json for exact per-task rubrics and 248 artifact reviews. Performance columns are arithmetic means of short admission probes (each under 256 decode tokens), not sustained in-trial speeds; prefer the companion in-trial distributions for throughput comparisons. Six frozen infrastructure exclusions remain recorded across the package. Models ran sequentially on one device, with model-specific frozen tuning.</p>\n<div class=\"hb-scorecard-suite\" data-hb-suite=\"core\">\n<h5 class=\"hb-scorecard-suite-title\">General capability</h5>\n<table><thead><tr><th>Model</th><th>Size</th><th>Tasks passed</th><th>Performance</th><th>Context</th><th>Memory used</th></tr></thead><tbody><tr data-hb-model=\"ornith1.5-35b-a3b\" data-hb-tier=\ umn":173,"offset":122748}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"On machines like the DGX Spark","position":{"start":{"line":519,"column":5,"offset":122753},"end":{"line":519,"column":35,"offset":122783}}}],"position":{"start":{"line":519,"column":3,"offset":122751},"end":{"line":519,"column":37,"offset":122785}}},{"type":"text","value":", where the graphics chip shares memory in a way our measurement can't see, the column is left out. The number would read far below what the model really uses.","position":{"start":{"line":519,"column":37,"offset":122785},"end":{"line":519,"column":196,"offset":122944}}}],"position":{"start":{"line":519,"column":3,"offset":122751},"end":{"line":519,"column":196,"offset":122944}}}],"position":{"start":{"line":519,"column":1,"offset":122749},"end":{"line":519,"column":196,"offset":122944}}}],"position":{"start":{"line":517,"column":1,"offset":122427},"end":{"line":519,"column":196,"offset":122944}}},{"type":"paragraph","children":[{"type":"text","value":"Treat these as a rough guide from one machine, not a promise about yours. The Models catalog in the app is the better check for whether a model fits your computer. When the engine reported its KV-cache precision, it appears beside the model name — for example, ","position":{"start":{"line":521,"column":1,"offset":122946},"end":{"line":521,"column":262,"offset":123207}}},{"type":"inlineCode","value":"(kv: q8_0)","position":{"start":{"line":521,"column":262,"offset":123207},"end":{"line":521,"column":274,"offset":123219}}},{"type":"text","value":".","position":{"start":{"line":521,"column":274,"offset":123219},"end":{"line":521,"column":275,"offset":123220}}}],"position":{"start":{"line":521,"column":1,"offset":122946},"end":{"line":521,"column":275,"offset":123220}}},{"type":"paragraph","children":[{"type":"text","value":"Each ","position":{"start":{"line":523,"column":1,"offset":123222},"end":{"line":523,"column":6,"offset":123227}}},{"type":"strong","children":[{"type":"text","value":"test round","position":{"start":{"line":523,"column":8,"offset":123229},"end":{"line":523,"column":18,"offset":123239}}}],"position":{"start":{"line":523,"column":6,"offset":123227},"end":{"line":523,"column":20,"offset":123241}}},{"type":"text","value":" keeps all of its tables together under one provenance stamp. Earlier rounds stay separate from the latest because a change to gezel or to the task set can move a score without any model changing.","position":{"start":{"line":523,"column":20,"offset":123241},"end":{"line":523,"column":216,"offset":123437}}}],"position":{"start":{"line":523,"column":1,"offset":123222},"end":{"line":523,"column":216,"offset":123437}}},{"type":"paragraph","children":[{"type":"strong","children":[{"type":"text","value":"Size","position":{"start":{"line":525,"column":3,"offset":123441},"end":{"line":525,"column":7,"offset":123445}}}],"position":{"start":{"line":525,"column":1,"offset":123439},"end":{"line":525,"column":9,"offset":123447}}},{"type":"text","value":" is the model's parameter count where we know it. Bigger is often but not always better: on office work in particular, some smaller models beat larger ones, and a model family's habits matter more than its size.","position":{"start":{"line":525,"column":9,"offset":123447},"end":{"line":525,"column":220,"offset":123658}}}],"position":{"start":{"line":525,"column":1,"offset":123439},"end":{"line":525,"column":220,"offset":123658}}}]},{"id":"choosing-from-this","startTime":426,"duration":27,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Choosing from this","position":{"start":{"line":527,"column":4,"offset":123663},"end":{"line":527,"column":22,"offset":123681}}}],"position":{"start":{"line":527,"column":1,"offset":123660},"end":{"line":527,"column":22,"offset":123681}}},"title":"Choosing from this","contents":[{"type":"paragraph","children":[{"type":"text","value":"A high score on the office set is the better guide for everyday document, planning, and analysis work. A high score on the general set matters more if you want a gezel writing or fixing code, and the engineering set, where a round has it, is the stricter test of that.","position":{"start":{"line":529,"column":1,"offset":123683},"end":{"line":529,"column":269,"offset":123951}}}],"position":{"start":{"line":529,"column":1,"offset":123683},"end":{"line":529,"column":269,"offset":123951}}},{"type":"paragraph","children":[{"type":"text","value":"If a model you're considering isn't listed, it hasn't been measured here yet — which is not a verdict on it either way. The Models catalog in the app will still tell you whether it fits this machine.","position":{"start":{"line":531,"column":1,"offset":123953},"end":{"line":531,"column":200,"offset":124152}}}],"position":{"start":{"line":531,"column":1,"offset":123953},"end":{"line":531,"column":200,"offset":124152}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"These are measured task outcomes.","startTime":0,"endTime":3.25,"audioSegment":0},{"text":"Each pass count records attempts that met the automatic checks on a real machine.","startTime":3.25,"endTime":6.5,"audioSegment":0},{"text":"Artifact reviews can reveal missing requirements or defects that those checks missed.","startTime":6.5,"endTime":9.75,"audioSegment":0},{"text":"How we test models explains what was counted and what these numbers do not tell you.","startTime":9.75,"endTime":13,"audioSegment":0},{"text":"Each round states its repeat count;","startTime":13,"endTime":16.25,"audioSegment":0},{"text":"jobs run fewer than three times show counts rather than percentages.","startTime":16.25,"endTime":19.5,"audioSegment":0},{"text":"A job passes when its automatic checks pass,","startTime":19.5,"endTime":22.75,"audioSegment":0},{"text":"and runs lost to machine trouble are set aside rather than blamed on the model.","startTime":22.75,"endTime":26,"audioSegment":0},{"text":"Focused reruns are labeled as subsets and retain their own round.","startTime":26,"endTime":30,"audioSegment":0},{"text":"They can verify a fix, but do not replace a full-suite comparison.","startTime":30,"endTime":34,"audioSegment":0},{"text":"Round notes explain unfinished coverage and documented evaluator failures;","startTime":34,"endTime":38,"audioSegment":0},{"text":"those failures remain recorded without being counted as model weaknesses.","startTime":38,"endTime":42,"audioSegment":0},{"text":"Each round has one table for each task set it ran,","startTime":42,"endTime":46,"audioSegment":0},{"text":"all measured on the same machine and build.","startTime":46,"endTime":50,"audioSegment":0},{"text":"Most rounds ran two sets.","startTime":50,"endTime":54,"audioSegment":0},{"text":"General capability covers writing a small working program, fixing a bug from its symptoms,","startTime":54,"endTime":58,"audioSegment":0},{"text":"following a procedure and stopping at a problem, and turning several documents into one reconciled summary.","startTime":58,"endTime":62,"audioSegment":0},{"text":"Office and knowledge work covers a customer notice under a hard word limit, a meeting turned into an action register,","startTime":62,"endTime":66,"audioSegment":0},{"text":"a cited research brief, an experiment read-out, a spreadsheet model, a slide deck, and a Word document.","startTime":66,"endTime":70,"audioSegment":0},{"text":"Some rounds add the two harder sets: Engineering work, which is developer work such as reviewing a change and proving a fix with tests,","startTime":70,"endTime":74,"audioSegment":0},{"text":"and Complex workflows, which asks a model to write and repair reusable recipes of its own.","startTime":74,"endTime":78,"audioSegment":0},{"text":"The five-model core campaign completed all 165 trials: 11 scenarios,","startTime":78,"endTime":80.5,"audioSegment":0},{"text":"three repeats, five models.","startTime":80.5,"endTime":83,"audioSegment":0},{"text":"Bolt and Gemma E4B each passed 26/33,","startTime":83,"endTime":85.5,"audioSegment":0},{"text":"Gemma E2B 14/33, Gemma 12B 23/33 and Qwen 9B 21/33.","startTime":85.5,"endTime":88,"audioSegment":0},{"text":"Every trial was reviewed,","startTime":88,"endTime":90.5,"audioSegment":0},{"text":"including failed outputs: 158 artifacts have advisory scores and seven missing outputs have no invented score.","startTime":90.5,"endTime":93,"audioSegment":0},{"text":"HTML, code, data and document quality remain separate.","startTime":93,"endTime":95.5,"audioSegment":0},{"text":"Download the scorecard data and full report JSON with judging and performance.","startTime":95.5,"endTime":98,"audioSegment":0},{"text":"The full report preserves exact review axes and rationales, per-trial timings, token coverage,","startTime":98,"endTime":100.5,"audioSegment":0},{"text":"fixed-score breakdowns, model identities and 32 documented framework/evaluator findings.","startTime":100.5,"endTime":103,"audioSegment":0},{"text":"Some gate passes contained incomplete or broken artifacts;","startTime":103,"endTime":105.5,"audioSegment":0},{"text":"some gates also rejected valid outputs.","startTime":105.5,"endTime":108,"audioSegment":0},{"text":"Raw verdicts remain unchanged,","startTime":108,"endTime":110.5,"audioSegment":0},{"text":"and these findings do not establish when a defect was introduced.","startTime":110.5,"endTime":113,"audioSegment":0},{"text":"Bolt ran on llama.cpp Metal using NVIDIA's October 23 revision;","startTime":113,"endTime":115.5,"audioSegment":0},{"text":"the other models used MLX.","startTime":115.5,"endTime":118,"audioSegment":0},{"text":"The Task performance rows show task medians,","startTime":118,"endTime":120.5,"audioSegment":0},{"text":"ranges and sample counts, including failed attempts and recovery.","startTime":120.5,"endTime":123,"audioSegment":0},{"text":"Bolt throughput is request-derived;","startTime":123,"endTime":125.5,"audioSegment":0},{"text":"MLX decode is an active-stream estimate and MLX prefill is unavailable.","startTime":125.5,"endTime":128,"audioSegment":0},{"text":"Token streams have incomplete coverage, first-write latency is not completed-output latency,","startTime":128,"endTime":130.5,"audioSegment":0},{"text":"and process RSS is not GPU telemetry.","startTime":130.5,"endTime":133,"audioSegment":0},{"text":"Download notes and validation explain the frozen comparison,","startTime":133,"endTime":135.5,"audioSegment":0},{"text":"measurement limits and excluded older trials.","startTime":135.5,"endTime":138,"audioSegment":0},{"text":"The eight-model core evaluation completed all 264 requested attempts on an RTX 5070 Ti laptop: 182 passed,","startTime":138,"endTime":141.43478260869566,"audioSegment":0},{"text":"70 failed their tasks, and 12 were excluded after exceeding Nanbeige's 32K context.","startTime":141.43478260869566,"endTime":144.8695652173913,"audioSegment":0},{"text":"These were context failures, not GPU out-of-memory failures.","startTime":144.8695652173913,"endTime":148.30434782608697,"audioSegment":0},{"text":"Every attempt has been reviewed.","startTime":148.30434782608697,"endTime":151.73913043478262,"audioSegment":0},{"text":"The tables preserve three runtime rounds: 49 original trials,","startTime":151.73913043478262,"endTime":155.17391304347825,"audioSegment":0},{"text":"182 trials after a runtime correction, and the separate 33-trial Nanbeige 32K rerun.","startTime":155.17391304347825,"endTime":158.6086956521739,"audioSegment":0},{"text":"The original and continuation rounds show counts because neither alone has three repeats of every task.","startTime":158.6086956521739,"endTime":162.04347826086956,"audioSegment":0},{"text":"Nanbeige's full-suite score is withheld because some tasks have no attributable results. Its 12 passes,","startTime":162.04347826086956,"endTime":165.47826086956522,"audioSegment":0},{"text":"nine model failures and 12 infrastructure exclusions remain available in the data.","startTime":165.47826086956522,"endTime":168.91304347826087,"audioSegment":0},{"text":"Download the scorecard data and full judging and performance data.","startTime":168.91304347826087,"endTime":172.34782608695653,"audioSegment":0},{"text":"The companion preserves all 254 artifact reviews: 247 eligible reviews,","startTime":172.34782608695653,"endTime":175.7826086956522,"audioSegment":0},{"text":"six infrastructure diagnostics and one excluded review that exceeded its input limit.","startTime":175.7826086956522,"endTime":179.2173913043478,"audioSegment":0},{"text":"Ten attempts produced no artifact to score.","startTime":179.2173913043478,"endTime":182.6521739130435,"audioSegment":0},{"text":"The four task rubrics stay separate: the Artifact reviews tables show HTML, code,","startTime":182.6521739130435,"endTime":186.08695652173913,"audioSegment":0},{"text":"data and document quality means with eligible artifact counts, plus counts for missing artifacts and excluded reviews.","startTime":186.08695652173913,"endTime":189.52173913043478,"audioSegment":0},{"text":"These were unblinded reviews by codex-inline/current-session; no combined quality score is calculated.","startTime":189.52173913043478,"endTime":192.95652173913044,"audioSegment":0},{"text":"The Task performance tables show output and prefill speed, wall time,","startTime":192.95652173913044,"endTime":196.3913043478261,"audioSegment":0},{"text":"peak system RSS and peak GPU memory as per-trial medians with ranges and sample counts.","startTime":196.3913043478261,"endTime":199.82608695652175,"audioSegment":0},{"text":"They include available observations from all attempts, including failures.","startTime":199.82608695652175,"endTime":203.26086956521738,"audioSegment":0},{"text":"These engine-log measurements are separate from admission probes.","startTime":203.26086956521738,"endTime":206.69565217391306,"audioSegment":0},{"text":"GPU performance changed during the run, so each journal keeps its own measurement period,","startTime":206.69565217391306,"endTime":210.1304347826087,"audioSegment":0},{"text":"including Nanbeige's slower and later faster periods.","startTime":210.1304347826087,"endTime":213.56521739130434,"audioSegment":0},{"text":"Download notes explain provenance, exclusions, memory headroom and validation.","startTime":213.56521739130434,"endTime":217,"audioSegment":0},{"text":"The Apple M5 Max campaign closed at 601 recorded attempts: 476 passed,","startTime":217,"endTime":219.95238095238096,"audioSegment":0},{"text":"119 failed their tasks, and six were excluded for infrastructure problems.","startTime":219.95238095238096,"endTime":222.9047619047619,"audioSegment":0},{"text":"LFM 2.5, Qwen 3.6, Qwen 3.8 and BTL4 each completed 129 attempts.","startTime":222.9047619047619,"endTime":225.85714285714286,"audioSegment":0},{"text":"Ornith completed 85 of 129 planned attempts;","startTime":225.85714285714286,"endTime":228.8095238095238,"audioSegment":0},{"text":"Nemotron and MiniCPM were not run.","startTime":228.8095238095238,"endTime":231.76190476190476,"audioSegment":0},{"text":"The tables retain 600 attempts in two separate rounds: four complete model arms and the partial Ornith round.","startTime":231.76190476190476,"endTime":234.71428571428572,"audioSegment":0},{"text":"One additional failed Ornith attempt had comparison-identity drift and remains in the evidence download with its original classification,","startTime":234.71428571428572,"endTime":237.66666666666666,"audioSegment":0},{"text":"outside the comparison tables.","startTime":237.66666666666666,"endTime":240.61904761904762,"audioSegment":0},{"text":"The scorecard data and full judging and performance data are available as JSON.","startTime":240.61904761904762,"endTime":243.57142857142858,"audioSegment":0},{"text":"The companion includes all 601 observations, 248 artifact reviews,","startTime":243.57142857142858,"endTime":246.52380952380952,"audioSegment":0},{"text":"each task's rubric and sample counts, and per-trial speed and memory measurements.","startTime":246.52380952380952,"endTime":249.47619047619048,"audioSegment":0},{"text":"Four declared artifacts were missing, 14 reviews had a mismatched rubric,","startTime":249.47619047619048,"endTime":252.42857142857144,"audioSegment":0},{"text":"and 335 tasks had no applicable declared rubric.","startTime":252.42857142857144,"endTime":255.38095238095238,"audioSegment":0},{"text":"No review is pending.","startTime":255.38095238095238,"endTime":258.3333333333333,"audioSegment":0},{"text":"Different task rubrics are kept separate,","startTime":258.3333333333333,"endTime":261.2857142857143,"audioSegment":0},{"text":"so this round has no combined quality score in the tables.","startTime":261.2857142857143,"endTime":264.23809523809524,"audioSegment":0},{"text":"All nine admission probes generated fewer than 256 output tokens;","startTime":264.23809523809524,"endTime":267.1904761904762,"audioSegment":0},{"text":"Ornith's single probe generated 84.","startTime":267.1904761904762,"endTime":270.14285714285717,"audioSegment":0},{"text":"Treat the table's speeds as preliminary.","startTime":270.14285714285717,"endTime":273.0952380952381,"audioSegment":0},{"text":"The companion also records engine-derived speeds during the actual tasks and their sample counts.","startTime":273.0952380952381,"endTime":276.04761904761904,"audioSegment":0},{"text":"Download notes and validation details explain the populations and caveats.","startTime":276.04761904761904,"endTime":279,"audioSegment":0},{"text":"Tasks passed counts every attempt across every job in the set.","startTime":279,"endTime":282.5,"audioSegment":0},{"text":"A model with 24/33 (73%) finished 24 of 33 attempts correctly.","startTime":282.5,"endTime":286,"audioSegment":0},{"text":"If any job in the set ran fewer than three times you'll see a raw count instead of a percentage —","startTime":286,"endTime":289.5,"audioSegment":0},{"text":"too small a sample to quote as a rate.","startTime":289.5,"endTime":293,"audioSegment":0},{"text":"A model whose results were incomplete is left out of the table entirely rather than shown with a gap.","startTime":293,"endTime":296.5,"audioSegment":0},{"text":"Quality is an AI reviewer's opinion of the finished work,","startTime":296.5,"endTime":300,"audioSegment":0},{"text":"and the count beside it is how many pieces that opinion covers.","startTime":300,"endTime":303.5,"audioSegment":0},{"text":"It only grades work that was actually produced,","startTime":303.5,"endTime":307,"audioSegment":0},{"text":"including declared artifacts from failed attempts where the round used inline judging.","startTime":307,"endTime":310.5,"audioSegment":0},{"text":"Missing artifacts receive no invented quality score —","startTime":310.5,"endTime":314,"audioSegment":0},{"text":"6.5/10 (18 pieces) is a weaker claim than 6.5/10 (26 pieces).","startTime":314,"endTime":317.5,"audioSegment":0},{"text":"Treat it as color next to the pass rate,","startTime":317.5,"endTime":321,"audioSegment":0},{"text":"never as a substitute for it.","startTime":321,"endTime":324.5,"audioSegment":0},{"text":"Task-specific rubrics stay separate rather than being averaged into one score.","startTime":324.5,"endTime":328,"audioSegment":0},{"text":"Performance shows two measured speeds on the machine named above: output speed is how fast the model writes its answer,","startTime":328,"endTime":331.5,"audioSegment":0},{"text":"and prefill speed is how fast it takes in your prompt and documents.","startTime":331.5,"endTime":335,"audioSegment":0},{"text":"Both matter for how a gezel feels — prefill governs the pause before it starts,","startTime":335,"endTime":338.5,"audioSegment":0},{"text":"while output governs how fast text appears.","startTime":338.5,"endTime":342,"audioSegment":0},{"text":"A dash means that round did not record a throughput probe.","startTime":342,"endTime":345.5,"audioSegment":0},{"text":"Context is the working memory the model was given for these runs —","startTime":345.5,"endTime":349,"audioSegment":0},{"text":"how much it can hold at once.","startTime":349,"endTime":352.5,"audioSegment":0},{"text":"Memory used is the most memory the model and its engine held on the test machine.","startTime":352.5,"endTime":356,"audioSegment":0},{"text":"What that number covers depends on the machine,","startTime":356,"endTime":359.5,"audioSegment":0},{"text":"so each round says which one it measured:","startTime":359.5,"endTime":363,"audioSegment":0},{"text":"On a Mac the graphics chip shares the computer's memory and our measurement sees all of it,","startTime":363,"endTime":366.5,"audioSegment":0},{"text":"so Memory used is the model's whole footprint.","startTime":366.5,"endTime":370,"audioSegment":0},{"text":"On a PC with a separate graphics card the column is called System memory.","startTime":370,"endTime":373.5,"audioSegment":0},{"text":"It counts the computer's own memory only,","startTime":373.5,"endTime":377,"audioSegment":0},{"text":"not what the model keeps on the graphics card.","startTime":377,"endTime":380.5,"audioSegment":0},{"text":"On machines like the DGX Spark,","startTime":380.5,"endTime":384,"audioSegment":0},{"text":"where the graphics chip shares memory in a way our measurement can't see, the column is left out.","startTime":384,"endTime":387.5,"audioSegment":0},{"text":"The number would read far below what the model really uses.","startTime":387.5,"endTime":391,"audioSegment":0},{"text":"Treat these as a rough guide from one machine,","startTime":391,"endTime":394.5,"audioSegment":0},{"text":"not a promise about yours.","startTime":394.5,"endTime":398,"audioSegment":0},{"text":"The Models catalog in the app is the better check for whether a model fits your computer.","startTime":398,"endTime":401.5,"audioSegment":0},{"text":"When the engine reported its KV-cache precision,","startTime":401.5,"endTime":405,"audioSegment":0},{"text":"it appears beside the model name — for example, (kv: q8_0).","startTime":405,"endTime":408.5,"audioSegment":0},{"text":"Each test round keeps all of its tables together under one provenance stamp.","startTime":408.5,"endTime":412,"audioSegment":0},{"text":"Earlier rounds stay separate from the latest because a change to gezel or to the task set can move a score without any model changing.","startTime":412,"endTime":415.5,"audioSegment":0},{"text":"Size is the model's parameter count where we know it.","startTime":415.5,"endTime":419,"audioSegment":0},{"text":"Bigger is often but not always better: on office work in particular,","startTime":419,"endTime":422.5,"audioSegment":0},{"text":"some smaller models beat larger ones, and a model family's habits matter more than its size.","startTime":422.5,"endTime":426,"audioSegment":0},{"text":"A high score on the office set is the better guide for everyday document,","startTime":426,"endTime":429.85714285714283,"audioSegment":0},{"text":"planning, and analysis work.","startTime":429.85714285714283,"endTime":433.7142857142857,"audioSegment":0},{"text":"A high score on the general set matters more if you want a gezel writing or fixing code,","startTime":433.7142857142857,"endTime":437.57142857142856,"audioSegment":0},{"text":"and the engineering set, where a round has it, is the stricter test of that.","startTime":437.57142857142856,"endTime":441.42857142857144,"audioSegment":0},{"text":"If a model you're considering isn't listed,","startTime":441.42857142857144,"endTime":445.2857142857143,"audioSegment":0},{"text":"it hasn't been measured here yet — which is not a verdict on it either way.","startTime":445.2857142857143,"endTime":449.14285714285717,"audioSegment":0},{"text":"The Models catalog in the app will still tell you whether it fits this machine.","startTime":449.14285714285717,"endTime":453,"audioSegment":0}],"version":1},"startBlock":{"title":"Model scorecard","subtitle":"These are measured task outcomes. Each pass count records attempts that met the automatic checks on a real machine. Artifact reviews can reveal missing requirements or defects that those checks missed.","ambientMotion":"zoomIn"}}</script>
