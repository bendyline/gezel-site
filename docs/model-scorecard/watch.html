art":{"line":196,"column":296,"offset":28006},"end":{"line":196,"column":619,"offset":28329}}},{"type":"inlineCode","value":"perf_source","position":{"start":{"line":196,"column":619,"offset":28329},"end":{"line":196,"column":632,"offset":28342}}},{"type":"text","value":" says, and a round measured across separate hardware periods has no single speed, so those cells stay empty. Focused reruns show ","position":{"start":{"line":196,"column":632,"offset":28342},"end":{"line":196,"column":761,"offset":28471}}},{"type":"inlineCode","value":"subset","position":{"start":{"line":196,"column":761,"offset":28471},"end":{"line":196,"column":769,"offset":28479}}},{"type":"text","value":" under ","position":{"start":{"line":196,"column":769,"offset":28479},"end":{"line":196,"column":776,"offset":28486}}},{"type":"inlineCode","value":"scope","position":{"start":{"line":196,"column":776,"offset":28486},"end":{"line":196,"column":783,"offset":28493}}},{"type":"text","value":".","position":{"start":{"line":196,"column":783,"offset":28493},"end":{"line":196,"column":784,"offset":28494}}}],"position":{"start":{"line":196,"column":1,"offset":27711},"end":{"line":196,"column":784,"offset":28494}}},{"type":"paragraph","children":[{"type":"text","value":"Where ","position":{"start":{"line":198,"column":1,"offset":28496},"end":{"line":198,"column":7,"offset":28502}}},{"type":"inlineCode","value":"perf_source","position":{"start":{"line":198,"column":7,"offset":28502},"end":{"line":198,"column":20,"offset":28515}}},{"type":"text","value":" says ","position":{"start":{"line":198,"column":20,"offset":28515},"end":{"line":198,"column":26,"offset":28521}}},{"type":"strong","children":[{"type":"text","value":"observed chat-event prefill","position":{"start":{"line":198,"column":28,"offset":28523},"end":{"line":198,"column":55,"offset":28550}}}],"position":{"start":{"line":198,"column":26,"offset":28521},"end":{"line":198,"column":57,"offset":28552}}},{"type":"text","value":", the prefill figure summarizes partial rate observations within each trial. These recovered figures are not duration-weighted throughput across every request or exact prefill times. The round's report gives coverage and keeps them separate from aggregate engine measurements.","position":{"start":{"line":198,"column":57,"offset":28552},"end":{"line":198,"column":333,"offset":28828}}}],"position":{"start":{"line":198,"column":1,"offset":28496},"end":{"line":198,"column":333,"offset":28828}}}]},{"id":"choosing-from-this","startTime":324,"duration":27,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Choosing from this","position":{"start":{"line":200,"column":4,"offset":28833},"end":{"line":200,"column":22,"offset":28851}}}],"position":{"start":{"line":200,"column":1,"offset":28830},"end":{"line":200,"column":22,"offset":28851}}},"title":"Choosing from this","contents":[{"type":"paragraph","children":[{"type":"text","value":"A high score on the office set is the better guide for everyday document, planning, and analysis work. A high score on the general set matters more if you want the model writing or fixing code, and the engineering set, where a round has it, is the stricter test of that.","position":{"start":{"line":202,"column":1,"offset":28853},"end":{"line":202,"column":271,"offset":29123}}}],"position":{"start":{"line":202,"column":1,"offset":28853},"end":{"line":202,"column":271,"offset":29123}}},{"type":"paragraph","children":[{"type":"text","value":"If a model you're considering isn't listed, it hasn't been measured here yet — which is not a verdict on it either way. The Models catalog in the app will still tell you whether it fits this machine.","position":{"start":{"line":204,"column":1,"offset":29125},"end":{"line":204,"column":200,"offset":29324}}}],"position":{"start":{"line":204,"column":1,"offset":29125},"end":{"line":204,"column":200,"offset":29324}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"These are measured task outcomes.","startTime":0,"endTime":3.25,"audioSegment":0},{"text":"Each pass count records attempts that met the automatic checks on a real machine.","startTime":3.25,"endTime":6.5,"audioSegment":0},{"text":"Artifact reviews can reveal missing requirements or defects that those checks missed.","startTime":6.5,"endTime":9.75,"audioSegment":0},{"text":"How we test models explains what was counted and what these numbers do not tell you.","startTime":9.75,"endTime":13,"audioSegment":0},{"text":"Each round states its repeat count;","startTime":13,"endTime":16.25,"audioSegment":0},{"text":"jobs run fewer than three times show counts rather than percentages.","startTime":16.25,"endTime":19.5,"audioSegment":0},{"text":"A job passes when its automatic checks pass,","startTime":19.5,"endTime":22.75,"audioSegment":0},{"text":"and runs lost to machine trouble are set aside rather than blamed on the model.","startTime":22.75,"endTime":26,"audioSegment":0},{"text":"Focused reruns are labeled as subsets and retain their own round.","startTime":26,"endTime":29.38888888888889,"audioSegment":0},{"text":"They can verify a fix, but do not replace a full-suite comparison.","startTime":29.38888888888889,"endTime":32.77777777777778,"audioSegment":0},{"text":"Round notes explain unfinished coverage and documented evaluator failures;","startTime":32.77777777777778,"endTime":36.166666666666664,"audioSegment":0},{"text":"those failures remain recorded without being counted as model weaknesses.","startTime":36.166666666666664,"endTime":39.55555555555556,"audioSegment":0},{"text":"Each round has one table for each task set it ran,","startTime":39.55555555555556,"endTime":42.94444444444444,"audioSegment":0},{"text":"all measured on the same machine and build.","startTime":42.94444444444444,"endTime":46.33333333333333,"audioSegment":0},{"text":"Most rounds ran two sets.","startTime":46.33333333333333,"endTime":49.72222222222222,"audioSegment":0},{"text":"General capability covers writing a small working program, fixing a bug from its symptoms,","startTime":49.72222222222222,"endTime":53.111111111111114,"audioSegment":0},{"text":"following a procedure and stopping at a problem, and turning several documents into one reconciled summary.","startTime":53.111111111111114,"endTime":56.5,"audioSegment":0},{"text":"Office and knowledge work covers a customer notice under a hard word limit, a meeting turned into an action register,","startTime":56.5,"endTime":59.888888888888886,"audioSegment":0},{"text":"a cited research brief, an experiment read-out, a spreadsheet model, a slide deck, and a Word document.","startTime":59.888888888888886,"endTime":63.27777777777778,"audioSegment":0},{"text":"Some rounds add the two harder sets: Engineering work, which is developer work such as reviewing a change and proving a fix with tests,","startTime":63.27777777777778,"endTime":66.66666666666666,"audioSegment":0},{"text":"and Complex workflows, which asks a model to write and repair reusable recipes of its own.","startTime":66.66666666666666,"endTime":70.05555555555556,"audioSegment":0},{"text":"What is in each set, test by test:","startTime":70.05555555555556,"endTime":73.44444444444444,"audioSegment":0},{"text":"General capability — 11 tests","startTime":73.44444444444444,"endTime":76.83333333333334,"audioSegment":0},{"text":"Office and knowledge work — 13 tests","startTime":76.83333333333334,"endTime":80.22222222222223,"audioSegment":0},{"text":"Engineering work — 10 tests","startTime":80.22222222222223,"endTime":83.61111111111111,"audioSegment":0},{"text":"Complex workflows — 9 tests","startTime":83.61111111111111,"endTime":87,"audioSegment":0},{"text":"Every round laid end to end, one row per round,","startTime":87,"endTime":89.75,"audioSegment":0},{"text":"task set, and model, grouped by round, newest first.","startTime":89.75,"endTime":92.5,"audioSegment":0},{"text":"Download every result as CSV; the file adds per-rubric judge scores,","startTime":92.5,"endTime":95.25,"audioSegment":0},{"text":"memory, context, and build details.","startTime":95.25,"endTime":98,"audioSegment":0},{"text":"Anyone can run the same tests on their own machine with gezel bench,","startTime":98,"endTime":101.375,"audioSegment":0},{"text":"and send the result in with gezel bench submit.","startTime":101.375,"endTime":104.75,"audioSegment":0},{"text":"Rounds we accept appear here, apart from ours: they are measured on hardware we do not control,","startTime":104.75,"endTime":108.125,"audioSegment":0},{"text":"so they never enter the tables above, the model pages, or the model catalog.","startTime":108.125,"endTime":111.5,"audioSegment":0},{"text":"Read each one against its own stamp, the same as any round.","startTime":111.5,"endTime":114.875,"audioSegment":0},{"text":"No community rounds have been published yet.","startTime":114.875,"endTime":118.25,"audioSegment":0},{"text":"Run gezel bench --json result.json on your own machine,","startTime":118.25,"endTime":121.625,"audioSegment":0},{"text":"then gezel bench submit result.json to send the round in.","startTime":121.625,"endTime":125,"audioSegment":0},{"text":"Tasks passed counts every attempt across every job in the set.","startTime":125,"endTime":128.61818181818182,"audioSegment":0},{"text":"A model with 24/33 (73%) finished 24 of 33 attempts correctly.","startTime":128.61818181818182,"endTime":132.23636363636365,"audioSegment":0},{"text":"If any job in the set ran fewer than three times you'll see a raw count instead of a percentage —","startTime":132.23636363636365,"endTime":135.85454545454544,"audioSegment":0},{"text":"too small a sample to quote as a rate.","startTime":135.85454545454544,"endTime":139.47272727272727,"audioSegment":0},{"text":"A model whose results were incomplete is left out of the table entirely rather than shown with a gap.","startTime":139.47272727272727,"endTime":143.0909090909091,"audioSegment":0},{"text":"Quality is an AI reviewer's opinion of the finished work,","startTime":143.0909090909091,"endTime":146.70909090909092,"audioSegment":0},{"text":"and the count beside it is how many pieces that opinion covers.","startTime":146.70909090909092,"endTime":150.3272727272727,"audioSegment":0},{"text":"It only grades work that was actually produced,","startTime":150.3272727272727,"endTime":153.94545454545454,"audioSegment":0},{"text":"including declared artifacts from failed attempts where the round used inline judging.","startTime":153.94545454545454,"endTime":157.56363636363636,"audioSegment":0},{"text":"Missing artifacts receive no invented quality score —","startTime":157.56363636363636,"endTime":161.1818181818182,"audioSegment":0},{"text":"6.5/10 (18 pieces) is a weaker claim than 6.5/10 (26 pieces).","startTime":161.1818181818182,"endTime":164.8,"audioSegment":0},{"text":"Treat it as color next to the pass rate,","startTime":164.8,"endTime":168.41818181818184,"audioSegment":0},{"text":"never as a substitute for it.","startTime":168.41818181818184,"endTime":172.03636363636363,"audioSegment":0},{"text":"Task-specific rubrics stay separate rather than being averaged into one score.","startTime":172.03636363636363,"endTime":175.65454545454546,"audioSegment":0},{"text":"Performance shows two measured speeds on the machine named above: output speed is how fast the model writes its answer,","startTime":175.65454545454546,"endTime":179.27272727272728,"audioSegment":0},{"text":"and prefill speed is how fast it takes in your prompt and documents.","startTime":179.27272727272728,"endTime":182.89090909090908,"audioSegment":0},{"text":"Both matter for how a chat feels — prefill governs the pause before it starts,","startTime":182.89090909090908,"endTime":186.5090909090909,"audioSegment":0},{"text":"while output governs how fast text appears.","startTime":186.5090909090909,"endTime":190.12727272727273,"audioSegment":0},{"text":"A dash means that round did not record a throughput probe.","startTime":190.12727272727273,"endTime":193.74545454545455,"audioSegment":0},{"text":"Context is the working memory the model was given for these runs —","startTime":193.74545454545455,"endTime":197.36363636363637,"audioSegment":0},{"text":"how much it can hold at once.","startTime":197.36363636363637,"endTime":200.9818181818182,"audioSegment":0},{"text":"Memory used is the most memory the model and its engine held on the test machine.","startTime":200.9818181818182,"endTime":204.6,"audioSegment":0},{"text":"What that number covers depends on the machine,","startTime":204.6,"endTime":208.21818181818182,"audioSegment":0},{"text":"so each round says which one it measured:","startTime":208.21818181818182,"endTime":211.83636363636364,"audioSegment":0},{"text":"On a Mac the graphics chip shares the computer's memory and our measurement sees all of it,","startTime":211.83636363636364,"endTime":215.45454545454544,"audioSegment":0},{"text":"so Memory used is the model's whole footprint.","startTime":215.45454545454544,"endTime":219.07272727272726,"audioSegment":0},{"text":"On a PC with a separate graphics card the column is called System memory.","startTime":219.07272727272726,"endTime":222.6909090909091,"audioSegment":0},{"text":"It counts the computer's own memory only,","startTime":222.6909090909091,"endTime":226.3090909090909,"audioSegment":0},{"text":"not what the model keeps on the graphics card.","startTime":226.3090909090909,"endTime":229.92727272727274,"audioSegment":0},{"text":"On machines like the DGX Spark,","startTime":229.92727272727274,"endTime":233.54545454545456,"audioSegment":0},{"text":"where the graphics chip shares memory in a way our measurement can't see, the column is left out.","startTime":233.54545454545456,"endTime":237.16363636363636,"audioSegment":0},{"text":"The number would read far below what the model really uses.","startTime":237.16363636363636,"endTime":240.78181818181818,"audioSegment":0},{"text":"Treat these as a rough guide from one machine,","startTime":240.78181818181818,"endTime":244.4,"audioSegment":0},{"text":"not a promise about yours.","startTime":244.4,"endTime":248.0181818181818,"audioSegment":0},{"text":"The Models catalog in the app is the better check for whether a model fits your computer.","startTime":248.0181818181818,"endTime":251.63636363636363,"audioSegment":0},{"text":"When the engine reported its KV-cache precision,","startTime":251.63636363636363,"endTime":255.25454545454545,"audioSegment":0},{"text":"it appears beside the model name — for example, (kv: q8_0).","startTime":255.25454545454545,"endTime":258.8727272727273,"audioSegment":0},{"text":"Each test round keeps all of its tables together under one provenance stamp.","startTime":258.8727272727273,"endTime":262.4909090909091,"audioSegment":0},{"text":"Earlier rounds stay separate from the latest because a change to gezel or to the task set can move a score without any model changing.","startTime":262.4909090909091,"endTime":266.1090909090909,"audioSegment":0},{"text":"Size is the model's parameter count where we know it.","startTime":266.1090909090909,"endTime":269.72727272727275,"audioSegment":0},{"text":"Bigger is often but not always better: on office work in particular,","startTime":269.72727272727275,"endTime":273.3454545454546,"audioSegment":0},{"text":"some smaller models beat larger ones, and a model family's habits matter more than its size.","startTime":273.3454545454546,"endTime":276.9636363636364,"audioSegment":0},{"text":"Every result in one table sets every round's rows side by side,","startTime":276.9636363636364,"endTime":280.5818181818182,"audioSegment":0},{"text":"under the column names the download uses.","startTime":280.5818181818182,"endTime":284.2,"audioSegment":0},{"text":"pass_rate_pct counts only the attempts the model was responsible for,","startTime":284.2,"endTime":287.8181818181818,"audioSegment":0},{"text":"and rate_quotable is no where a job ran fewer than three times, so read that figure as a count.","startTime":287.8181818181818,"endTime":291.43636363636364,"audioSegment":0},{"text":"judge_score is the one place task rubrics are averaged: a summary across a round's rubrics,","startTime":291.43636363636364,"endTime":295.05454545454546,"audioSegment":0},{"text":"weighted by how many pieces each covered, and fair to compare only within one judge; the download keeps each rubric's own score.","startTime":295.05454545454546,"endTime":298.6727272727273,"audioSegment":0},{"text":"Speeds are the median of each attempt's engine log where a round recorded them and the older probe otherwise,","startTime":298.6727272727273,"endTime":302.29090909090905,"audioSegment":0},{"text":"as perf_source says, and a round measured across separate hardware periods has no single speed, so those cells stay empty.","startTime":302.29090909090905,"endTime":305.9090909090909,"audioSegment":0},{"text":"Focused reruns show subset under scope.","startTime":305.9090909090909,"endTime":309.5272727272727,"audioSegment":0},{"text":"Where perf_source says observed chat-event prefill,","startTime":309.5272727272727,"endTime":313.1454545454545,"audioSegment":0},{"text":"the prefill figure summarizes partial rate observations within each trial.","startTime":313.1454545454545,"endTime":316.76363636363635,"audioSegment":0},{"text":"These recovered figures are not duration-weighted throughput across every request or exact prefill times.","startTime":316.76363636363635,"endTime":320.3818181818182,"audioSegment":0},{"text":"The round's report gives coverage and keeps them separate from aggregate engine measurements.","startTime":320.3818181818182,"endTime":324,"audioSegment":0},{"text":"A high score on the office set is the better guide for everyday document,","startTime":324,"endTime":327.85714285714283,"audioSegment":0},{"text":"planning, and analysis work.","startTime":327.85714285714283,"endTime":331.7142857142857,"audioSegment":0},{"text":"A high score on the general set matters more if you want the model writing or fixing code,","startTime":331.7142857142857,"endTime":335.57142857142856,"audioSegment":0},{"text":"and the engineering set, where a round has it, is the stricter test of that.","startTime":335.57142857142856,"endTime":339.42857142857144,"audioSegment":0},{"text":"If a model you're considering isn't listed,","startTime":339.42857142857144,"endTime":343.2857142857143,"audioSegment":0},{"text":"it hasn't been measured here yet — which is not a verdict on it either way.","startTime":343.2857142857143,"endTime":347.14285714285717,"audioSegment":0},{"text":"The Models catalog in the app will still tell you whether it fits this machine.","startTime":347.14285714285717,"endTime":351,"audioSegment":0}],"version":1},"startBlock":{"title":"Model scorecard","subtitle":"These are measured task outcomes. Each pass count records attempts that met the automatic checks on a real machine. Artifact reviews can reveal missing requirements or defects that those checks missed.","ambientMotion":"zoomIn"}}</script>
