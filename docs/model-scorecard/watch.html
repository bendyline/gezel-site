Time":148,"audioSegment":0},{"text":"ModelSizeTasks passedQualityPerformanceContextMemory usedqwen3.8-27b-q427B35/39 (90%)7.1/10 (26 pieces)22.4 tok/s output233 tok/s prefill256K27.3 GBqwen3.6-35b-a3b-q435B34/39 (87%)7/10 (27 pieces)78.5 tok/s output1,182 tok/s prefill256K25.5 GB","startTime":148,"endTime":151.66666666666666,"audioSegment":0},{"text":"Not published — some tasks could not be measured on this round:","startTime":151.66666666666666,"endTime":155.33333333333334,"audioSegment":0},{"text":"qwen3.6-27b-q4: 1 task(s) unmeasured","startTime":155.33333333333334,"endTime":159,"audioSegment":0},{"text":"Tasks passed counts every attempt across every job in the set.","startTime":159,"endTime":162.85185185185185,"audioSegment":0},{"text":"A model with 24/33 (73%) finished 24 of 33 attempts correctly.","startTime":162.85185185185185,"endTime":166.7037037037037,"audioSegment":0},{"text":"If any job in the set ran fewer than three times you'll see a raw count instead of a percentage —","startTime":166.7037037037037,"endTime":170.55555555555554,"audioSegment":0},{"text":"too small a sample to quote as a rate.","startTime":170.55555555555554,"endTime":174.40740740740742,"audioSegment":0},{"text":"A model whose results were incomplete is left out of the table entirely rather than shown with a gap.","startTime":174.40740740740742,"endTime":178.25925925925927,"audioSegment":0},{"text":"Quality is an AI reviewer's opinion of the finished work,","startTime":178.25925925925927,"endTime":182.11111111111111,"audioSegment":0},{"text":"and the count beside it is how many pieces that opinion covers.","startTime":182.11111111111111,"endTime":185.96296296296296,"audioSegment":0},{"text":"It only grades work that was actually produced, so a model that fails often is judged on its successes alone —","startTime":185.96296296296296,"endTime":189.8148148148148,"audioSegment":0},{"text":"6.5/10 (18 pieces) is a weaker claim than 6.5/10 (26 pieces).","startTime":189.8148148148148,"endTime":193.66666666666666,"audioSegment":0},{"text":"Treat it as colour next to the pass rate,","startTime":193.66666666666666,"endTime":197.51851851851853,"audioSegment":0},{"text":"never as a substitute for it.","startTime":197.51851851851853,"endTime":201.37037037037038,"audioSegment":0},{"text":"Performance shows two measured speeds on the machine named above: output speed is how fast the model writes its answer,","startTime":201.37037037037038,"endTime":205.22222222222223,"audioSegment":0},{"text":"and prefill speed is how fast it takes in your prompt and documents.","startTime":205.22222222222223,"endTime":209.07407407407408,"audioSegment":0},{"text":"Both matter for how a gezel feels — prefill governs the pause before it starts,","startTime":209.07407407407408,"endTime":212.92592592592592,"audioSegment":0},{"text":"while output governs how fast text appears.","startTime":212.92592592592592,"endTime":216.77777777777777,"audioSegment":0},{"text":"A dash means that round did not record a throughput probe.","startTime":216.77777777777777,"endTime":220.62962962962962,"audioSegment":0},{"text":"Context is the working memory the model was given for these runs —","startTime":220.62962962962962,"endTime":224.48148148148147,"audioSegment":0},{"text":"how much it can hold at once.","startTime":224.48148148148147,"endTime":228.33333333333331,"audioSegment":0},{"text":"Memory used is the peak RAM the model and its engine actually occupied,","startTime":228.33333333333331,"endTime":232.18518518518516,"audioSegment":0},{"text":"which is the number to check against your own machine.","startTime":232.18518518518516,"endTime":236.03703703703704,"audioSegment":0},{"text":"When the engine reported its KV-cache precision,","startTime":236.03703703703704,"endTime":239.88888888888889,"audioSegment":0},{"text":"it appears beside the model name — for example, (kv: q8_0).","startTime":239.88888888888889,"endTime":243.74074074074073,"audioSegment":0},{"text":"Each test round keeps its General capability and Office and knowledge work tables together under one provenance stamp.","startTime":243.74074074074073,"endTime":247.59259259259258,"audioSegment":0},{"text":"Earlier rounds stay separate from the latest because a change to gezel or to the task set can move a score without any model changing.","startTime":247.59259259259258,"endTime":251.44444444444446,"audioSegment":0},{"text":"Size is the model's parameter count where we know it.","startTime":251.44444444444446,"endTime":255.2962962962963,"audioSegment":0},{"text":"Bigger is often but not always better: on office work in particular,","startTime":255.2962962962963,"endTime":259.14814814814815,"audioSegment":0},{"text":"some smaller models beat larger ones, and a model family's habits matter more than its size.","startTime":259.14814814814815,"endTime":263,"audioSegment":0},{"text":"A high score on the office set is the better guide for everyday document,","startTime":263,"endTime":266.6666666666667,"audioSegment":0},{"text":"planning, and analysis work.","startTime":266.6666666666667,"endTime":270.3333333333333,"audioSegment":0},{"text":"A high score on the general set matters more if you want a gezel writing or fixing code.","startTime":270.3333333333333,"endTime":274,"audioSegment":0},{"text":"If a model you're considering isn't listed,","startTime":274,"endTime":277.6666666666667,"audioSegment":0},{"text":"it hasn't been measured here yet — which is not a verdict on it either way.","startTime":277.6666666666667,"endTime":281.3333333333333,"audioSegment":0},{"text":"The Models catalogue in the app will still tell you whether it fits this machine.","startTime":281.3333333333333,"endTime":285,"audioSegment":0}],"version":1},"startBlock":{"title":"Model scorecard","subtitle":"These are measured results, not estimates. Each number is the count of jobs a model actually finished correctly, checked by a program on a real machine.","ambientMotion":"zoomIn"}}</script>
