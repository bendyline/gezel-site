ndTime":193.08,"audioSegment":0},{"text":"writing speed governs how fast text appears.","startTime":193.08,"endTime":196.8,"audioSegment":0},{"text":"Context is the working memory the model was given for these runs —","startTime":196.8,"endTime":200.52,"audioSegment":0},{"text":"how much it can hold at once.","startTime":200.52,"endTime":204.24,"audioSegment":0},{"text":"Memory used is the peak RAM the model and its engine actually occupied,","startTime":204.24,"endTime":207.96,"audioSegment":0},{"text":"which is the number to check against your own machine.","startTime":207.96,"endTime":211.68,"audioSegment":0},{"text":"Earlier rounds appear as separate tables below each set,","startTime":211.68,"endTime":215.4,"audioSegment":0},{"text":"with their own stamps.","startTime":215.4,"endTime":219.12,"audioSegment":0},{"text":"They are kept apart rather than merged because a change to gezel or to the task set can move a score without any model changing.","startTime":219.12,"endTime":222.84,"audioSegment":0},{"text":"Size is the model's parameter count where we know it.","startTime":222.84,"endTime":226.56,"audioSegment":0},{"text":"Bigger is often but not always better: on office work in particular,","startTime":226.56,"endTime":230.28,"audioSegment":0},{"text":"some smaller models beat larger ones, and a model family's habits matter more than its size.","startTime":230.28,"endTime":234,"audioSegment":0},{"text":"A high score on the office set is the better guide for everyday document,","startTime":234,"endTime":237.66666666666666,"audioSegment":0},{"text":"planning, and analysis work.","startTime":237.66666666666666,"endTime":241.33333333333334,"audioSegment":0},{"text":"A high score on the general set matters more if you want a gezel writing or fixing code.","startTime":241.33333333333334,"endTime":245,"audioSegment":0},{"text":"If a model you're considering isn't listed,","startTime":245,"endTime":248.66666666666666,"audioSegment":0},{"text":"it hasn't been measured here yet — which is not a verdict on it either way.","startTime":248.66666666666666,"endTime":252.33333333333334,"audioSegment":0},{"text":"The Models catalogue in the app will still tell you whether it fits this machine.","startTime":252.33333333333334,"endTime":256,"audioSegment":0}],"version":1},"startBlock":{"title":"Model scorecard","subtitle":"These are measured results, not estimates. Each number is the count of jobs a model actually finished correctly, checked by a program on a real machine.","ambientMotion":"zoomIn"}}</script>
