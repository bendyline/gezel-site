335,"audioSegment":0},{"text":"Each number is the count of jobs a model actually finished correctly,","startTime":3.8333333333333335,"endTime":7.666666666666667,"audioSegment":0},{"text":"checked by a program on a real machine.","startTime":7.666666666666667,"endTime":11.5,"audioSegment":0},{"text":"How we test models explains what was counted and what these numbers do not tell you.","startTime":11.5,"endTime":15.333333333333334,"audioSegment":0},{"text":"The short version: each job is run three times, a job passes only when every requirement is met,","startTime":15.333333333333334,"endTime":19.166666666666668,"audioSegment":0},{"text":"and runs lost to machine trouble are set aside rather than blamed on the model.","startTime":19.166666666666668,"endTime":23,"audioSegment":0},{"text":"Writing a small working program, fixing a bug from its symptoms,","startTime":23,"endTime":29,"audioSegment":0},{"text":"following a procedure and stopping at a problem, turning several documents into one reconciled summary.","startTime":29,"endTime":35,"audioSegment":0},{"text":"M4 Max · 64 GB · llama-cpp · 3 trials per task · 2026-08-11 · gezel b2ea2819 · catalog 0.1.20","startTime":35,"endTime":41,"audioSegment":0},{"text":"ModelSizeTasks passedQualityReads atWrites atContextMemory usedgemma4-26b-q425.2B33/33 (100%)6.4/10 (9 pieces)1,093 tok/s89.6 tok/s118K40.9 GBqwen3.6-27b-q427B33/33 (100%)8/10 (9 pieces)198 tok/s18.5 tok/s256K26.4 GBqwen3.6-35b-a3b-q435B32/33 (97%)8.2/10 (9 pieces)1,125 tok/s76.4 tok/s256K26.5 GBgemma4-31b-q430.7B31/33 (94%)6.7/10 (9 pieces)202 tok/s23.3 tok/s256K43.1 GBgemma4-e4b-q48B31/33 (94%)4.7/10 (9 pieces)1,398 tok/s94.7 tok/s128K13.5 GB","startTime":41,"endTime":47,"audioSegment":0},{"text":"M4 Max · 64 GB · llama-cpp · 3 trials per task · 2026-08-09 · gezel e2859602 · catalog 0.1.17 —","startTime":47,"endTime":52.666666666666664,"audioSegment":0},{"text":"different gezel build, different catalog version","startTime":52.666666666666664,"endTime":58.333333333333336,"audioSegment":0},{"text":"ModelSizeTasks passedQualityReads atWrites atContextMemory usedgemma4-31b-q430.7B33/33 (100%)6.8/10 (9 pieces)195 tok/s22.3 tok/s64K31.0 GBgemma4-12b-q412B28/33 (85%)6.9/10 (9 pieces)543 tok/s50.9 tok/s64K30.6 GBgemma4-e4b-q48B24/33 (73%)4.6/10 (9 pieces)1,411 tok/s97.8 tok/s64K10.4 GBornith-9b-q49B24/33 (73%)6.7/10 (9 pieces)657 tok/s64.9 tok/s64K9.8 GB","startTime":58.333333333333336,"endTime":64,"audioSegment":0},{"text":"A customer notice under a hard word limit, a meeting turned into an action register,","startTime":64,"endTime":70.5,"audioSegment":0},{"text":"a cited research brief, an experiment read-out, a spreadsheet model, a slide deck, a Word document.","startTime":70.5,"endTime":77,"audioSegment":0},{"text":"M4 Max · 64 GB · llama-cpp · 3 trials per task · 2026-08-11 · gezel b2ea2819 · catalog 0.1.20","startTime":77,"endTime":83.5,"audioSegment":0},{"text":"ModelSizeTasks passedQualityReads atWrites atContextMemory usedqwen3.6-35b-a3b-q435B33/39 (85%)6.6/10 (26 pieces)1,125 tok/s76.4 tok/s256K25.6 GBgemma4-26b-q425.2B30/39 (77%)6.1/10 (20 pieces)1,093 tok/s89.6 tok/s118K40.2 GBgemma4-e4b-q48B29/39 (74%)5.4/10 (25 pieces)1,398 tok/s94.7 tok/s128K12.4 GBqwen3.6-27b-q427B29/39 (74%)5.6/10 (24 pieces)198 tok/s18.5 tok/s256K27.0 GBgemma4-31b-q430.7B28/39 (72%)6.1/10 (20 pieces)202 tok/s23.3 tok/s256K45.1 GB","startTime":83.5,"endTime":90,"audioSegment":0},{"text":"M4 Max · 64 GB · llama-cpp · 3 trials per task · 2026-08-09 · gezel e2859602 · catalog 0.1.17 —","startTime":90,"endTime":95.66666666666667,"audioSegment":0},{"text":"different gezel build, different catalog version","startTime":95.66666666666667,"endTime":101.33333333333333,"audioSegment":0},{"text":"ModelSizeTasks passedQualityReads atWrites atContextMemory usedornith-9b-q49B34/39 (87%)6.5/10 (26 pieces)657 tok/s64.9 tok/s64K8.9 GBgemma4-12b-q412B29/39 (74%)4.8/10 (26 pieces)543 tok/s50.9 tok/s64K29.7 GBgemma4-e4b-q48B28/39 (72%)5.2/10 (22 pieces)1,411 tok/s97.8 tok/s64K8.9 GBgemma4-31b-q430.7B25/39 (64%)6.5/10 (18 pieces)195 tok/s22.3 tok/s64K30.1 GB","startTime":101.33333333333333,"endTime":107,"audioSegment":0},{"text":"Tasks passed counts every attempt across every job in the set.","startTime":107,"endTime":110.72,"audioSegment":0},{"text":"A model with 24/33 (73%) finished 24 of 33 attempts correctly.","startTime":110.72,"endTime":114.44,"audioSegment":0},{"text":"If any job in the set ran fewer than three times you'll see a raw count instead of a percentage —","startTime":114.44,"endTime":118.16,"audioSegment":0},{"text":"too small a sample to quote as a rate.","startTime":118.16,"endTime":121.88,"audioSegment":0},{"text":"A model whose results were incomplete is left out of the table entirely rather than shown with a gap.","startTime":121.88,"endTime":125.6,"audioSegment":0},{"text":"Quality is an AI reviewer's opinion of the finished work,","startTime":125.6,"endTime":129.32,"audioSegment":0},{"text":"and the count beside it is how many pieces that opinion covers.","startTime":129.32,"endTime":133.04,"audioSegment":0},{"text":"It only grades work that was actually produced, so a model that fails often is judged on its successes alone —","startTime":133.04,"endTime":136.76,"audioSegment":0},{"text":"6.5/10 (18 pieces) is a weaker claim than 6.5/10 (26 pieces).","startTime":136.76,"endTime":140.48000000000002,"audioSegment":0},{"text":"Treat it as colour next to the pass rate,","startTime":140.48000000000002,"endTime":144.2,"audioSegment":0},{"text":"never as a substitute for it.","startTime":144.2,"endTime":147.92000000000002,"audioSegment":0},{"text":"Reads at / Writes at are measured speeds on the machine named above: how fast the model takes in your documents,","startTime":147.92000000000002,"endTime":151.64,"audioSegment":0},{"text":"and how fast it writes its answer.","startTime":151.64,"endTime":155.36,"audioSegment":0},{"text":"Both matter for how a gezel feels — reading speed governs the pause before it starts,","startTime":155.36,"endTime":159.08,"audioSegment":0},{"text":"writing speed governs how fast text appears.","startTime":159.08,"endTime":162.8,"audioSegment":0},{"text":"Context is the working memory the model was given for these runs —","startTime":162.8,"endTime":166.52,"audioSegment":0},{"text":"how much it can hold at once.","startTime":166.52,"endTime":170.24,"audioSegment":0},{"text":"Memory used is the peak RAM the model and its engine actually occupied,","startTime":170.24,"endTime":173.96,"audioSegment":0},{"text":"which is the number to check against your own machine.","startTime":173.96,"endTime":177.68,"audioSegment":0},{"text":"Earlier rounds appear as separate tables below each set,","startTime":177.68,"endTime":181.4,"audioSegment":0},{"text":"with their own stamps.","startTime":181.4,"endTime":185.12,"audioSegment":0},{"text":"They are kept apart rather than merged because a change to gezel or to the task set can move a score without any model changing.","startTime":185.12,"endTime":188.84,"audioSegment":0},{"text":"Size is the model's parameter count where we know it.","startTime":188.84,"endTime":192.56,"audioSegment":0},{"text":"Bigger is often but not always better: on office work in particular,","startTime":192.56,"endTime":196.28,"audioSegment":0},{"text":"some smaller models beat larger ones, and a model family's habits matter more than its size.","startTime":196.28,"endTime":200,"audioSegment":0},{"text":"A high score on the office set is the better guide for everyday document,","startTime":200,"endTime":203.66666666666666,"audioSegment":0},{"text":"planning, and analysis work.","startTime":203.66666666666666,"endTime":207.33333333333334,"audioSegment":0},{"text":"A high score on the general set matters more if you want a gezel writing or fixing code.","startTime":207.33333333333334,"endTime":211,"audioSegment":0},{"text":"If a model you're considering isn't listed,","startTime":211,"endTime":214.66666666666666,"audioSegment":0},{"text":"it hasn't been measured here yet — which is not a verdict on it either way.","startTime":214.66666666666666,"endTime":218.33333333333334,"audioSegment":0},{"text":"The Models catalogue in the app will still tell you whether it fits this machine.","startTime":218.33333333333334,"endTime":222,"audioSegment":0}],"version":1},"startBlock":{"title":"Model scorecard","subtitle":"These are measured results, not estimates. Each number is the count of jobs a model actually finished correctly, checked by a program on a real machine.","ambientMotion":"zoomIn"}}</script>
