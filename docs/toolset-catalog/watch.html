ime":106,"endTime":109.5,"audioSegment":0},{"text":"Linear Issues Mirror recent Linear issues into a searchable corpus via Linear's MCP server.","startTime":109.5,"endTime":113,"audioSegment":0},{"text":"LinkedIn Posts Publish to LinkedIn from Gezel: your crew drafts posts in your voice,","startTime":113,"endTime":116.5,"audioSegment":0},{"text":"and with your permission queues them — every publish still asks for your consent before anything goes out.","startTime":116.5,"endTime":120,"audioSegment":0},{"text":"Microsoft 365 Mail Mirror a Microsoft 365 (work/school) mailbox into a normalized,","startTime":120,"endTime":123.5,"audioSegment":0},{"text":"searchable corpus of messages (OAuth).","startTime":123.5,"endTime":127,"audioSegment":0},{"text":"Outlook.com Mail Mirror a personal Outlook.com mailbox into a normalized,","startTime":127,"endTime":130.5,"audioSegment":0},{"text":"searchable corpus of messages (OAuth).","startTime":130.5,"endTime":134,"audioSegment":0},{"text":"X Posts Keep a searchable copy of your X (Twitter) presence: your posts with their like, repost,","startTime":134,"endTime":137.5,"audioSegment":0},{"text":"and view counts and a daily engagement history, optional mentions, and a daily follower count.","startTime":137.5,"endTime":141,"audioSegment":0},{"text":"Gezel’s toolset browser also lists about 12,900 MCP servers from the public community registry,","startTime":141,"endTime":143.4,"audioSegment":0},{"text":"marked Community.","startTime":143.4,"endTime":145.8,"audioSegment":0},{"text":"They are third-party projects,","startTime":145.8,"endTime":148.2,"audioSegment":0},{"text":"so review one before you add it to a crew.","startTime":148.2,"endTime":150.6,"audioSegment":0},{"text":"You can also bring your own: see Custom MCP toolsets.","startTime":150.6,"endTime":153,"audioSegment":0}],"version":1},"startBlock":{"title":"Add-on toolsets and connectors","subtitle":"Every gezel starts with the built-in tool groups that fit its role, described in Tools and toolsets. This page lists what you can add on top.","ambientMotion":"zoomIn"}}</script>
