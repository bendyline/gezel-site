rceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Community servers","position":{"start":{"line":45,"column":4,"offset":4560},"end":{"line":45,"column":21,"offset":4577}}}],"position":{"start":{"line":45,"column":1,"offset":4557},"end":{"line":45,"column":21,"offset":4577}}},"title":"Community servers","contents":[{"type":"paragraph","children":[{"type":"text","value":"Gezel’s toolset browser also lists about 19,800 MCP servers from the public community registry, marked ","position":{"start":{"line":47,"column":1,"offset":4579},"end":{"line":47,"column":104,"offset":4682}}},{"type":"strong","children":[{"type":"text","value":"Community","position":{"start":{"line":47,"column":106,"offset":4684},"end":{"line":47,"column":115,"offset":4693}}}],"position":{"start":{"line":47,"column":104,"offset":4682},"end":{"line":47,"column":117,"offset":4695}}},{"type":"text","value":". They are third-party projects, so review one before you add it. You can also bring your own: see ","position":{"start":{"line":47,"column":117,"offset":4695},"end":{"line":47,"column":216,"offset":4794}}},{"type":"link","url":"../tools-and-toolsets/#custom-mcp-toolsets","children":[{"type":"text","value":"Custom MCP toolsets","position":{"start":{"line":47,"column":217,"offset":4795},"end":{"line":47,"column":236,"offset":4814}}}],"position":{"start":{"line":47,"column":216,"offset":4794},"end":{"line":47,"column":281,"offset":4859}}},{"type":"text","value":".","position":{"start":{"line":47,"column":281,"offset":4859},"end":{"line":47,"column":282,"offset":4860}}}],"position":{"start":{"line":47,"column":1,"offset":4579},"end":{"line":47,"column":282,"offset":4860}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Every crew member starts with the built-in tool groups that fit their role,","startTime":0,"endTime":2.6666666666666665,"audioSegment":0},{"text":"described in Tools and toolsets.","startTime":2.6666666666666665,"endTime":5.333333333333333,"audioSegment":0},{"text":"This page lists what you can add on top.","startTime":5.333333333333333,"endTime":8,"audioSegment":0},{"text":"Extra tools from Gezel’s own catalog.","startTime":8,"endTime":11,"audioSegment":0},{"text":"Add one to a crew member from their Toolsets tab.","startTime":11,"endTime":14,"audioSegment":0},{"text":"Toolset What it does","startTime":14,"endTime":17,"audioSegment":0},{"text":"DocBlocks Documents Create real documents and rendered media from markdown — Word (DOCX), PowerPoint (PPTX),","startTime":17,"endTime":20,"audioSegment":0},{"text":"PDF, Excel (XLSX), EPUB, HTML, MP4, animated GIF, and dashboard PNG images — via the DocBlocks MCP server.","startTime":20,"endTime":23,"audioSegment":0},{"text":"GitHub Browse and act on GitHub repositories, issues,","startTime":23,"endTime":26,"audioSegment":0},{"text":"and pull requests via the official @modelcontextprotocol/server-github MCP server.","startTime":26,"endTime":29,"audioSegment":0},{"text":"Connectors copy data from outside services, such as mail,","startTime":29,"endTime":32.93333333333333,"audioSegment":0},{"text":"calendars and issue trackers, into a project as searchable files.","startTime":32.93333333333333,"endTime":36.86666666666667,"audioSegment":0},{"text":"Gezel works on that local copy, never on the live account.","startTime":36.86666666666667,"endTime":40.8,"audioSegment":0},{"text":"Connector What it brings in","startTime":40.8,"endTime":44.733333333333334,"audioSegment":0},{"text":"Airtable Records Mirror an Airtable table into a searchable corpus — one file per record —","startTime":44.733333333333334,"endTime":48.666666666666664,"audioSegment":0},{"text":"via the Airtable API, hosted off-platform through a vendored Prismatic component.","startTime":48.666666666666664,"endTime":52.599999999999994,"audioSegment":0},{"text":"Azure Monitor Logs Mirror a Log Analytics workspace table — request logs,","startTime":52.599999999999994,"endTime":56.53333333333333,"audioSegment":0},{"text":"diagnostics, app telemetry — into a queryable data table.","startTime":56.53333333333333,"endTime":60.46666666666667,"audioSegment":0},{"text":"Bluesky Posts Keep a searchable copy of your Bluesky presence: your posts with their likes and reposts,","startTime":60.46666666666667,"endTime":64.4,"audioSegment":0},{"text":"mentions and replies from others, and a daily follower count.","startTime":64.4,"endTime":68.33333333333333,"audioSegment":0},{"text":"Email (IMAP) Sync any IMAP mailbox into a searchable corpus of messages: recent mail at first sync,","startTime":68.33333333333333,"endTime":72.26666666666667,"audioSegment":0},{"text":"then every new message.","startTime":72.26666666666667,"endTime":76.19999999999999,"audioSegment":0},{"text":"GitHub Issues Mirror recent issues from one GitHub repository into searchable project files.","startTime":76.19999999999999,"endTime":80.13333333333333,"audioSegment":0},{"text":"GitHub Pull Requests Mirror a project's open pull requests into local files: a summary,","startTime":80.13333333333333,"endTime":84.06666666666666,"audioSegment":0},{"text":"one file per changed file with its patch, and the complete unified diff.","startTime":84.06666666666666,"endTime":88,"audioSegment":0},{"text":"GitHub Releases Mirror GitHub release notes and uploaded release assets into local project files.","startTime":88,"endTime":91.93333333333334,"audioSegment":0},{"text":"GitHub Wiki Mirror a repository's wiki pages into searchable project files.","startTime":91.93333333333334,"endTime":95.86666666666666,"audioSegment":0},{"text":"Gmail Sync a Gmail mailbox into a searchable corpus of messages: recent mail at first sync,","startTime":95.86666666666666,"endTime":99.8,"audioSegment":0},{"text":"then every new message.","startTime":99.8,"endTime":103.73333333333333,"audioSegment":0},{"text":"Google Calendar Mirror Google Calendar events into a normalized, searchable corpus (OAuth).","startTime":103.73333333333333,"endTime":107.66666666666666,"audioSegment":0},{"text":"Google Drive Files Keep a local, searchable copy of the Google Drive folders you choose: Docs, Sheets,","startTime":107.66666666666666,"endTime":111.6,"audioSegment":0},{"text":"and Slides as readable text, text files inline, and PDFs, Office files, and images saved alongside up to a size limit.","startTime":111.6,"endTime":115.53333333333333,"audioSegment":0},{"text":"Instagram Media Keep a searchable copy of your Instagram presence: your posts, reels, and carousels with captions,","startTime":115.53333333333333,"endTime":119.46666666666667,"audioSegment":0},{"text":"links, like and comment counts and a daily engagement history, plus a daily follower count.","startTime":119.46666666666667,"endTime":123.39999999999999,"audioSegment":0},{"text":"JSON Rows over HTTP Mirror rows from any JSON or NDJSON HTTP endpoint into a queryable data table.","startTime":123.39999999999999,"endTime":127.33333333333333,"audioSegment":0},{"text":"Linear Issues Mirror recent Linear issues into a searchable corpus via Linear's MCP server.","startTime":127.33333333333333,"endTime":131.26666666666665,"audioSegment":0},{"text":"LinkedIn Posts Publish to LinkedIn from Gezel: your crew drafts posts in your voice,","startTime":131.26666666666665,"endTime":135.2,"audioSegment":0},{"text":"and with your permission queues them — every publish still asks for your consent before anything goes out.","startTime":135.2,"endTime":139.13333333333333,"audioSegment":0},{"text":"Microsoft 365 Mail Sync a Microsoft 365 (work/school) mailbox into a searchable corpus of messages: recent mail at first sync,","startTime":139.13333333333333,"endTime":143.06666666666666,"audioSegment":0},{"text":"then every new message.","startTime":143.06666666666666,"endTime":147,"audioSegment":0},{"text":"OneDrive Files Keep a local, searchable copy of a folder in your OneDrive (personal, work,","startTime":147,"endTime":150.93333333333334,"audioSegment":0},{"text":"or school): text files inline, and Word, Excel, PowerPoint, PDF, and image files saved alongside up to a size limit.","startTime":150.93333333333334,"endTime":154.86666666666667,"audioSegment":0},{"text":"Outlook Calendar Mirror Outlook calendars — Microsoft 365 work or school,","startTime":154.86666666666667,"endTime":158.79999999999998,"audioSegment":0},{"text":"or personal Outlook.com — into a normalized, searchable corpus of events (OAuth).","startTime":158.79999999999998,"endTime":162.73333333333332,"audioSegment":0},{"text":"Outlook.com Mail Sync a personal Outlook.com mailbox into a searchable corpus of messages: recent mail at first sync,","startTime":162.73333333333332,"endTime":166.66666666666666,"audioSegment":0},{"text":"then every new message.","startTime":166.66666666666666,"endTime":170.6,"audioSegment":0},{"text":"RSS and Atom Feeds Follow blogs, news sites,","startTime":170.6,"endTime":174.53333333333333,"audioSegment":0},{"text":"podcasts and newsletters through their RSS, Atom or JSON feeds.","startTime":174.53333333333333,"endTime":178.46666666666667,"audioSegment":0},{"text":"SharePoint Files Keep a local, searchable copy of a SharePoint document library, or one folder in it: text files inline,","startTime":178.46666666666667,"endTime":182.4,"audioSegment":0},{"text":"and Word, Excel, PowerPoint, PDF, and image files saved alongside up to a size limit.","startTime":182.4,"endTime":186.33333333333331,"audioSegment":0},{"text":"Webcam Watch a room with a webcam or a computer's built-in camera.","startTime":186.33333333333331,"endTime":190.26666666666665,"audioSegment":0},{"text":"X Posts Keep a searchable copy of your X (Twitter) presence: your posts with their like, repost,","startTime":190.26666666666665,"endTime":194.2,"audioSegment":0},{"text":"and view counts and a daily engagement history, optional mentions, and a daily follower count.","startTime":194.2,"endTime":198.13333333333333,"audioSegment":0},{"text":"YouTube Videos Keep a searchable copy of the videos on YouTube channels you run or follow: titles,","startTime":198.13333333333333,"endTime":202.06666666666666,"audioSegment":0},{"text":"descriptions, tags, length and view counts, one file per video.","startTime":202.06666666666666,"endTime":206,"audioSegment":0},{"text":"Gezel’s toolset browser also lists about 19,800 MCP servers from the public community registry,","startTime":206,"endTime":208.75,"audioSegment":0},{"text":"marked Community.","startTime":208.75,"endTime":211.5,"audioSegment":0},{"text":"They are third-party projects, so review one before you add it.","startTime":211.5,"endTime":214.25,"audioSegment":0},{"text":"You can also bring your own: see Custom MCP toolsets.","startTime":214.25,"endTime":217,"audioSegment":0}],"version":1},"startBlock":{"title":"Add-on toolsets and connectors","subtitle":"Every crew member starts with the built-in tool groups that fit their role, described in Tools and toolsets. This page lists what you can add on top.","ambientMotion":"zoomIn"}}</script>
