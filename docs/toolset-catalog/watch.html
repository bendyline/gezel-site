value":"Custom MCP toolsets","position":{"start":{"line":48,"column":217,"offset":4924},"end":{"line":48,"column":236,"offset":4943}}}],"position":{"start":{"line":48,"column":216,"offset":4923},"end":{"line":48,"column":281,"offset":4988}}},{"type":"text","value":".","position":{"start":{"line":48,"column":281,"offset":4988},"end":{"line":48,"column":282,"offset":4989}}}],"position":{"start":{"line":48,"column":1,"offset":4708},"end":{"line":48,"column":282,"offset":4989}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"Every crew member starts with the built-in tool groups that fit their role,","startTime":0,"endTime":2.6666666666666665,"audioSegment":0},{"text":"described in Tools and toolsets.","startTime":2.6666666666666665,"endTime":5.333333333333333,"audioSegment":0},{"text":"This page lists what you can add on top.","startTime":5.333333333333333,"endTime":8,"audioSegment":0},{"text":"Extra tools from Gezel’s own catalog.","startTime":8,"endTime":11,"audioSegment":0},{"text":"Add one to a crew member from their Toolsets tab.","startTime":11,"endTime":14,"audioSegment":0},{"text":"Toolset What it does","startTime":14,"endTime":17,"audioSegment":0},{"text":"DocBlocks Documents Create real documents and rendered media from markdown — Word (DOCX), PowerPoint (PPTX),","startTime":17,"endTime":20,"audioSegment":0},{"text":"PDF, Excel (XLSX), EPUB, HTML, MP4, animated GIF, and dashboard PNG images — via the DocBlocks MCP server.","startTime":20,"endTime":23,"audioSegment":0},{"text":"GitHub Browse and act on GitHub repositories, issues,","startTime":23,"endTime":26,"audioSegment":0},{"text":"and pull requests via the official @modelcontextprotocol/server-github MCP server.","startTime":26,"endTime":29,"audioSegment":0},{"text":"Connectors copy data from outside services, such as mail,","startTime":29,"endTime":32.91489361702128,"audioSegment":0},{"text":"calendars and issue trackers, into a project as searchable files.","startTime":32.91489361702128,"endTime":36.829787234042556,"audioSegment":0},{"text":"Gezel works on that local copy, never on the live account.","startTime":36.829787234042556,"endTime":40.74468085106383,"audioSegment":0},{"text":"Connector What it brings in","startTime":40.74468085106383,"endTime":44.659574468085104,"audioSegment":0},{"text":"Airtable Records Mirror an Airtable table into a searchable corpus — one file per record —","startTime":44.659574468085104,"endTime":48.57446808510638,"audioSegment":0},{"text":"via the Airtable API, hosted off-platform through a vendored Prismatic component.","startTime":48.57446808510638,"endTime":52.48936170212766,"audioSegment":0},{"text":"Azure Monitor Logs Mirror a Log Analytics workspace table — request logs,","startTime":52.48936170212766,"endTime":56.40425531914893,"audioSegment":0},{"text":"diagnostics, app telemetry — into a queryable data table.","startTime":56.40425531914893,"endTime":60.31914893617021,"audioSegment":0},{"text":"Bluesky Posts Keep a searchable copy of your Bluesky presence: your posts with their likes and reposts,","startTime":60.31914893617021,"endTime":64.23404255319149,"audioSegment":0},{"text":"mentions and replies from others, and a daily follower count.","startTime":64.23404255319149,"endTime":68.14893617021276,"audioSegment":0},{"text":"Email (IMAP) Sync any IMAP mailbox into a searchable corpus of messages: recent mail at first sync,","startTime":68.14893617021276,"endTime":72.06382978723404,"audioSegment":0},{"text":"then every new message.","startTime":72.06382978723404,"endTime":75.97872340425532,"audioSegment":0},{"text":"GitHub Issues Mirror recent issues from one GitHub repository into searchable project files.","startTime":75.97872340425532,"endTime":79.8936170212766,"audioSegment":0},{"text":"GitHub Pull Requests Mirror a project's open pull requests into local files: a summary,","startTime":79.8936170212766,"endTime":83.80851063829786,"audioSegment":0},{"text":"one file per changed file with its patch, and the complete unified diff.","startTime":83.80851063829786,"endTime":87.72340425531914,"audioSegment":0},{"text":"GitHub Releases Mirror GitHub release notes and uploaded release assets into local project files.","startTime":87.72340425531914,"endTime":91.63829787234042,"audioSegment":0},{"text":"GitHub Wiki Mirror a repository's wiki pages into searchable project files.","startTime":91.63829787234042,"endTime":95.5531914893617,"audioSegment":0},{"text":"Gmail Sync a Gmail mailbox into a searchable corpus of messages: recent mail at first sync,","startTime":95.5531914893617,"endTime":99.46808510638297,"audioSegment":0},{"text":"then every new message.","startTime":99.46808510638297,"endTime":103.38297872340425,"audioSegment":0},{"text":"Google Calendar Mirror Google Calendar events into a normalized, searchable corpus (OAuth).","startTime":103.38297872340425,"endTime":107.29787234042553,"audioSegment":0},{"text":"Google Drive Files Keep a local, searchable copy of the Google Drive folders you choose: Docs, Sheets,","startTime":107.29787234042553,"endTime":111.2127659574468,"audioSegment":0},{"text":"and Slides as readable text, text files inline, and PDFs, Office files, and images saved alongside up to a size limit.","startTime":111.2127659574468,"endTime":115.12765957446808,"audioSegment":0},{"text":"Instagram Media Keep a searchable copy of your Instagram presence: your posts, reels, and carousels with captions,","startTime":115.12765957446808,"endTime":119.04255319148936,"audioSegment":0},{"text":"links, like and comment counts and a daily engagement history, plus a daily follower count.","startTime":119.04255319148936,"endTime":122.95744680851064,"audioSegment":0},{"text":"JSON Rows over HTTP Mirror rows from any JSON or NDJSON HTTP endpoint into a queryable data table.","startTime":122.95744680851064,"endTime":126.87234042553192,"audioSegment":0},{"text":"Linear Issues Mirror recent Linear issues into a searchable corpus via Linear's MCP server.","startTime":126.87234042553192,"endTime":130.7872340425532,"audioSegment":0},{"text":"LinkedIn Posts Publish to LinkedIn from Gezel: your crew drafts posts in your voice and,","startTime":130.7872340425532,"endTime":134.70212765957444,"audioSegment":0},{"text":"once you allow publishing, posts them while working on something you asked for.","startTime":134.70212765957444,"endTime":138.61702127659572,"audioSegment":0},{"text":"Microsoft 365 Mail Sync a Microsoft 365 (work/school) mailbox into a searchable corpus of messages: recent mail at first sync,","startTime":138.61702127659572,"endTime":142.531914893617,"audioSegment":0},{"text":"then every new message.","startTime":142.531914893617,"endTime":146.44680851063828,"audioSegment":0},{"text":"OneDrive Files Keep a local, searchable copy of a folder in your OneDrive (personal, work,","startTime":146.44680851063828,"endTime":150.36170212765956,"audioSegment":0},{"text":"or school): text files inline, and Word, Excel, PowerPoint, PDF, and image files saved alongside up to a size limit.","startTime":150.36170212765956,"endTime":154.27659574468083,"audioSegment":0},{"text":"Outlook Calendar Mirror Outlook calendars — Microsoft 365 work or school,","startTime":154.27659574468083,"endTime":158.1914893617021,"audioSegment":0},{"text":"or personal Outlook.com — into a normalized, searchable corpus of events (OAuth).","startTime":158.1914893617021,"endTime":162.1063829787234,"audioSegment":0},{"text":"Outlook.com Mail Sync a personal Outlook.com mailbox into a searchable corpus of messages: recent mail at first sync,","startTime":162.1063829787234,"endTime":166.02127659574467,"audioSegment":0},{"text":"then every new message.","startTime":166.02127659574467,"endTime":169.93617021276594,"audioSegment":0},{"text":"RSS and Atom Feeds Follow blogs, news sites,","startTime":169.93617021276594,"endTime":173.85106382978722,"audioSegment":0},{"text":"podcasts and newsletters through their RSS, Atom or JSON feeds.","startTime":173.85106382978722,"endTime":177.7659574468085,"audioSegment":0},{"text":"SharePoint Files Keep a local, searchable copy of a SharePoint document library, or one folder in it: text files inline,","startTime":177.7659574468085,"endTime":181.68085106382978,"audioSegment":0},{"text":"and Word, Excel, PowerPoint, PDF, and image files saved alongside up to a size limit.","startTime":181.68085106382978,"endTime":185.59574468085106,"audioSegment":0},{"text":"Webcam Watch a room with a webcam or a computer's built-in camera.","startTime":185.59574468085106,"endTime":189.51063829787233,"audioSegment":0},{"text":"Websites Keep an offline copy of web pages you follow: what each page says,","startTime":189.51063829787233,"endTime":193.4255319148936,"audioSegment":0},{"text":"a few screenshots of how it looked, and what changed since last time.","startTime":193.4255319148936,"endTime":197.3404255319149,"audioSegment":0},{"text":"X Posts Keep a searchable copy of your X (Twitter) presence: your posts with their like, repost,","startTime":197.3404255319149,"endTime":201.25531914893617,"audioSegment":0},{"text":"and view counts and a daily engagement history, optional mentions, and a daily follower count.","startTime":201.25531914893617,"endTime":205.17021276595744,"audioSegment":0},{"text":"YouTube Videos Keep a searchable copy of the videos on YouTube channels you run or follow: titles,","startTime":205.17021276595744,"endTime":209.08510638297872,"audioSegment":0},{"text":"descriptions, tags, length and view counts, one file per video.","startTime":209.08510638297872,"endTime":213,"audioSegment":0},{"text":"Gezel’s toolset browser also lists about 23,900 MCP servers from the public community registry,","startTime":213,"endTime":215.75,"audioSegment":0},{"text":"marked Community.","startTime":215.75,"endTime":218.5,"audioSegment":0},{"text":"They are third-party projects, so review one before you add it.","startTime":218.5,"endTime":221.25,"audioSegment":0},{"text":"You can also bring your own: see Custom MCP toolsets.","startTime":221.25,"endTime":224,"audioSegment":0}],"version":1},"startBlock":{"title":"Add-on toolsets and connectors","subtitle":"Every crew member starts with the built-in tool groups that fit their role, described in Tools and toolsets. This page lists what you can add on top.","ambientMotion":"zoomIn"}}</script>
