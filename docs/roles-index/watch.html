 facts in authorized inputs.","startTime":36.473684210526315,"endTime":39.07894736842105,"audioSegment":0},{"text":"medium research-report, literature-review, competitive-analysis, due-diligence-brief, fact-check","startTime":39.07894736842105,"endTime":41.68421052631579,"audioSegment":0},{"text":"Copywriter Drafts comms and marketing copy under length/tone constraints.","startTime":41.68421052631579,"endTime":44.28947368421053,"audioSegment":0},{"text":"small blog-post, landing-copy, press-release, email-sequence, product-descriptions","startTime":44.28947368421053,"endTime":46.89473684210526,"audioSegment":0},{"text":"Designer Designs visual deliverables; generates and places imagery into pages.","startTime":46.89473684210526,"endTime":49.5,"audioSegment":0},{"text":"small hero-image, landing-page, moodboard, svg-animation, logo-set","startTime":49.5,"endTime":52.10526315789473,"audioSegment":0},{"text":"Image Generator Produces images via generate_image; no direct file writes.","startTime":52.10526315789473,"endTime":54.71052631578947,"audioSegment":0},{"text":"tiny logo-set, icon-pack, hero-image, thumbnail-generator","startTime":54.71052631578947,"endTime":57.315789473684205,"audioSegment":0},{"text":"Video Generator Produces short video clips via generate_video; no direct file writes. tiny —","startTime":57.315789473684205,"endTime":59.921052631578945,"audioSegment":0},{"text":"Developer Builds and fixes code; works to task-specific build and test gates.","startTime":59.921052631578945,"endTime":62.526315789473685,"audioSegment":0},{"text":"small build-loop, bug-fix-tdd, refactor-module, test-suite-backfill, apply-review-findings","startTime":62.526315789473685,"endTime":65.13157894736842,"audioSegment":0},{"text":"Web Developer Frontend/full-stack code with live browser work.","startTime":65.13157894736842,"endTime":67.73684210526315,"audioSegment":0},{"text":"small landing-page, spa-dashboard, web-app-crud, portfolio-site, pwa-offline","startTime":67.73684210526315,"endTime":70.34210526315789,"audioSegment":0},{"text":"Planner Turns a brief into a structured, owned, checkable plan.","startTime":70.34210526315789,"endTime":72.94736842105263,"audioSegment":0},{"text":"medium spec-doc, proposal-sow, dashboard-spec, board-deck, onboarding-checklist","startTime":72.94736842105263,"endTime":75.55263157894737,"audioSegment":0},{"text":"Generalist Carries a whole task from first step to last in one conversation —","startTime":75.55263157894737,"endTime":78.1578947368421,"audioSegment":0},{"text":"every step, every gate.","startTime":78.1578947368421,"endTime":80.76315789473684,"audioSegment":0},{"text":"medium build-loop, bug-fix-tdd","startTime":80.76315789473684,"endTime":83.36842105263158,"audioSegment":0},{"text":"Each role has its own article in this section with the full picture: the character it starts with,","startTime":83.36842105263158,"endTime":85.97368421052632,"audioSegment":0},{"text":"every tool in its kit, and the craftbooks it runs well.","startTime":85.97368421052632,"endTime":88.57894736842105,"audioSegment":0},{"text":"And roles are starting points, not cages — you can rename,","startTime":88.57894736842105,"endTime":91.18421052631578,"audioSegment":0},{"text":"re-equip, and rewrite any gezel after it's created.","startTime":91.18421052631578,"endTime":93.78947368421052,"audioSegment":0},{"text":"To browse the ready-made characters outside the app,","startTime":93.78947368421052,"endTime":96.39473684210526,"audioSegment":0},{"text":"see every role template on gezel.com.","startTime":96.39473684210526,"endTime":99,"audioSegment":0}],"version":1},"startBlock":{"title":"Roles at a glance","subtitle":"A gezel's role is its trade: the bundle of skills, tools, and habits it brings to your crew. Roles aren't just labels — each one comes with a default character, a curated toolkit, and a model floor (the minimum model tier the role needs to work unsupervised).","ambientMotion":"zoomIn"}}</script>
