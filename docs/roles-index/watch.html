dTime":12.682926829268293,"audioSegment":0},{"text":"Conversationalist Talks, researches, and writes in conversation;","startTime":12.682926829268293,"endTime":15.21951219512195,"audioSegment":0},{"text":"brings in advisers or craftbooks when useful. tiny —","startTime":15.21951219512195,"endTime":17.75609756097561,"audioSegment":0},{"text":"Meester Coordinator: delegates work across the gezel workforce; does not build directly.","startTime":17.75609756097561,"endTime":20.29268292682927,"audioSegment":0},{"text":"medium status-report, weekly-review","startTime":20.29268292682927,"endTime":22.829268292682926,"audioSegment":0},{"text":"Voorman Foreman: triages, diagnoses, and routes work to specialists; read-only investigator.","startTime":22.829268292682926,"endTime":25.365853658536587,"audioSegment":0},{"text":"medium root-cause-investigation, release-readiness-review, bug-fix-tdd","startTime":25.365853658536587,"endTime":27.902439024390244,"audioSegment":0},{"text":"Reviewer Reviews code and deliverables; verifies claims against sources before approving.","startTime":27.902439024390244,"endTime":30.4390243902439,"audioSegment":0},{"text":"medium pull-request-review, code-review, deep-security-review, pr-security-review, test-coverage-review","startTime":30.4390243902439,"endTime":32.97560975609756,"audioSegment":0},{"text":"Researcher Answers questions from sources;","startTime":32.97560975609756,"endTime":35.51219512195122,"audioSegment":0},{"text":"cites every claim and grounds facts in authorized inputs.","startTime":35.51219512195122,"endTime":38.048780487804876,"audioSegment":0},{"text":"medium research-report, literature-review, competitive-analysis, due-diligence-brief, fact-check","startTime":38.048780487804876,"endTime":40.58536585365854,"audioSegment":0},{"text":"Curator Looks after a photo library: describes, groups and proposes albums.","startTime":40.58536585365854,"endTime":43.1219512195122,"audioSegment":0},{"text":"Changes arrive as proposals.","startTime":43.1219512195122,"endTime":45.65853658536585,"audioSegment":0},{"text":"small album-curate, photo-cull, year-in-review","startTime":45.65853658536585,"endTime":48.19512195121951,"audioSegment":0},{"text":"Copywriter Drafts comms and marketing copy under length/tone constraints.","startTime":48.19512195121951,"endTime":50.73170731707317,"audioSegment":0},{"text":"small blog-post, landing-copy, press-release, email-sequence, product-descriptions","startTime":50.73170731707317,"endTime":53.26829268292683,"audioSegment":0},{"text":"Designer Designs visual deliverables; generates and places imagery into pages.","startTime":53.26829268292683,"endTime":55.80487804878049,"audioSegment":0},{"text":"small hero-image, landing-page, moodboard, svg-animation, logo-set","startTime":55.80487804878049,"endTime":58.34146341463415,"audioSegment":0},{"text":"Image Generator Produces images via generate_image; no direct file writes.","startTime":58.34146341463415,"endTime":60.8780487804878,"audioSegment":0},{"text":"tiny logo-set, icon-pack, hero-image, thumbnail-generator","startTime":60.8780487804878,"endTime":63.41463414634146,"audioSegment":0},{"text":"Video Generator Produces short video clips via generate_video; no direct file writes. tiny —","startTime":63.41463414634146,"endTime":65.95121951219512,"audioSegment":0},{"text":"Developer Builds and fixes code; works to task-specific build and test gates.","startTime":65.95121951219512,"endTime":68.48780487804878,"audioSegment":0},{"text":"small build-loop, bug-fix-tdd, refactor-module, test-suite-backfill, apply-review-findings","startTime":68.48780487804878,"endTime":71.02439024390245,"audioSegment":0},{"text":"Web Developer Frontend/full-stack code with live browser work.","startTime":71.02439024390245,"endTime":73.5609756097561,"audioSegment":0},{"text":"small landing-page, spa-dashboard, web-app-crud, portfolio-site, pwa-offline","startTime":73.5609756097561,"endTime":76.09756097560975,"audioSegment":0},{"text":"Planner Turns a brief into a structured, owned, checkable plan.","startTime":76.09756097560975,"endTime":78.63414634146342,"audioSegment":0},{"text":"medium spec-doc, proposal-sow, dashboard-spec, board-deck, onboarding-checklist","startTime":78.63414634146342,"endTime":81.17073170731707,"audioSegment":0},{"text":"Generalist Carries a whole task from first step to last in one conversation —","startTime":81.17073170731707,"endTime":83.70731707317073,"audioSegment":0},{"text":"every step, every gate.","startTime":83.70731707317073,"endTime":86.2439024390244,"audioSegment":0},{"text":"medium build-loop, bug-fix-tdd","startTime":86.2439024390244,"endTime":88.78048780487805,"audioSegment":0},{"text":"Each role has its own article in this section with the full picture: the character it starts with,","startTime":88.78048780487805,"endTime":91.3170731707317,"audioSegment":0},{"text":"every tool in its kit, and the craftbooks it runs well.","startTime":91.3170731707317,"endTime":93.85365853658537,"audioSegment":0},{"text":"And roles are starting points, not cages — you can rename,","startTime":93.85365853658537,"endTime":96.39024390243902,"audioSegment":0},{"text":"re-equip, and rewrite any gezel after it's created.","startTime":96.39024390243902,"endTime":98.92682926829268,"audioSegment":0},{"text":"To browse the ready-made characters outside the app,","startTime":98.92682926829268,"endTime":101.46341463414635,"audioSegment":0},{"text":"see every role template on gezel.com.","startTime":101.46341463414635,"endTime":104,"audioSegment":0}],"version":1},"startBlock":{"title":"Roles at a glance","subtitle":"A gezel's role is its trade: the bundle of skills, tools, and habits it brings to your crew. Roles aren't just labels — each one comes with a default character, a curated toolkit, and a model floor (the minimum model tier the role needs to work unsupervised).","ambientMotion":"zoomIn"}}</script>
