55555555556,"endTime":62.66666666666667,"audioSegment":0},{"text":"small landing-page, spa-dashboard, web-app-crud, portfolio-site, pwa-offline","startTime":62.66666666666667,"endTime":65.27777777777779,"audioSegment":0},{"text":"Planner Turns a brief into a structured, owned, checkable plan.","startTime":65.27777777777779,"endTime":67.88888888888889,"audioSegment":0},{"text":"medium spec-doc, proposal-sow, dashboard-spec, board-deck, onboarding-checklist","startTime":67.88888888888889,"endTime":70.5,"audioSegment":0},{"text":"Generalist Carries a whole task from first step to last in one conversation —","startTime":70.5,"endTime":73.11111111111111,"audioSegment":0},{"text":"every step, every gate.","startTime":73.11111111111111,"endTime":75.72222222222223,"audioSegment":0},{"text":"medium build-loop, bug-fix-tdd","startTime":75.72222222222223,"endTime":78.33333333333333,"audioSegment":0},{"text":"Each role has its own article in this section with the full picture: the character it starts with,","startTime":78.33333333333333,"endTime":80.94444444444444,"audioSegment":0},{"text":"every tool in its kit, and the craftbooks it runs well.","startTime":80.94444444444444,"endTime":83.55555555555556,"audioSegment":0},{"text":"And roles are starting points, not cages — you can rename,","startTime":83.55555555555556,"endTime":86.16666666666667,"audioSegment":0},{"text":"re-equip, and rewrite any gezel after it's created.","startTime":86.16666666666667,"endTime":88.77777777777779,"audioSegment":0},{"text":"To browse the ready-made characters outside the app,","startTime":88.77777777777779,"endTime":91.38888888888889,"audioSegment":0},{"text":"visit the Gezel Gilde role catalog.","startTime":91.38888888888889,"endTime":94,"audioSegment":0}],"version":1},"startBlock":{"title":"Roles at a glance","subtitle":"A gezel's role is its trade: the bundle of skills, tools, and habits it brings to your crew. Roles aren't just labels — each one comes with a default character, a curated too
