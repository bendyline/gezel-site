"endTime":12.619047619047619,"audioSegment":0},{"text":"Conversationalist Talks, researches, and writes in conversation;","startTime":12.619047619047619,"endTime":15.142857142857142,"audioSegment":0},{"text":"brings in advisers or craftbooks when useful. tiny —","startTime":15.142857142857142,"endTime":17.666666666666664,"audioSegment":0},{"text":"Meester Coordinator: delegates work across the crew; does not build directly.","startTime":17.666666666666664,"endTime":20.19047619047619,"audioSegment":0},{"text":"medium status-report, weekly-review","startTime":20.19047619047619,"endTime":22.714285714285715,"audioSegment":0},{"text":"Crew Lead Foreman: triages, diagnoses, and routes work to specialists; read-only investigator.","startTime":22.714285714285715,"endTime":25.238095238095237,"audioSegment":0},{"text":"medium root-cause-investigation, release-readiness-review, bug-fix-tdd","startTime":25.238095238095237,"endTime":27.76190476190476,"audioSegment":0},{"text":"Reviewer Reviews code and deliverables; verifies claims against sources before approving.","startTime":27.76190476190476,"endTime":30.285714285714285,"audioSegment":0},{"text":"medium pull-request-review, code-review, deep-security-review, pr-security-review, test-coverage-review","startTime":30.285714285714285,"endTime":32.80952380952381,"audioSegment":0},{"text":"Researcher Answers questions from sources;","startTime":32.80952380952381,"endTime":35.33333333333333,"audioSegment":0},{"text":"cites every claim and grounds facts in authorized inputs.","startTime":35.33333333333333,"endTime":37.857142857142854,"audioSegment":0},{"text":"medium research-report, literature-review, competitive-analysis, due-diligence-brief, fact-check","startTime":37.857142857142854,"endTime":40.38095238095238,"audioSegment":0},{"text":"Curator Looks after a photo library: describes, groups and proposes albums.","startTime":40.38095238095238,"endTime":42.904761904761905,"audioSegment":0},{"text":"Changes arrive as proposals.","startTime":42.904761904761905,"endTime":45.42857142857143,"audioSegment":0},{"text":"small album-curate, photo-cull, year-in-review","startTime":45.42857142857143,"endTime":47.95238095238095,"audioSegment":0},{"text":"Copywriter Drafts comms and marketing copy under length/tone constraints.","startTime":47.95238095238095,"endTime":50.476190476190474,"audioSegment":0},{"text":"small blog-post, landing-copy, press-release, email-sequence, product-descriptions","startTime":50.476190476190474,"endTime":53,"audioSegment":0},{"text":"Designer Designs visual deliverables; generates and places imagery into pages.","startTime":53,"endTime":55.52380952380952,"audioSegment":0},{"text":"small hero-image, landing-page, moodboard, svg-animation, logo-set","startTime":55.52380952380952,"endTime":58.047619047619044,"audioSegment":0},{"text":"Image Generator Produces images via generate_image,","startTime":58.047619047619044,"endTime":60.57142857142857,"audioSegment":0},{"text":"and SVG or manifest files beside them.","startTime":60.57142857142857,"endTime":63.095238095238095,"audioSegment":0},{"text":"tiny logo-set, icon-pack, hero-image, thumbnail-generator","startTime":63.095238095238095,"endTime":65.61904761904762,"audioSegment":0},{"text":"Video Generator Produces short video clips via generate_video; no direct file writes. tiny —","startTime":65.61904761904762,"endTime":68.14285714285714,"audioSegment":0},{"text":"Developer Builds and fixes code; works to task-specific build and test gates.","startTime":68.14285714285714,"endTime":70.66666666666666,"audioSegment":0},{"text":"small build-loop, bug-fix-tdd, refactor-module, test-suite-backfill, apply-review-findings","startTime":70.66666666666666,"endTime":73.19047619047619,"audioSegment":0},{"text":"Web Developer Frontend/full-stack code with live browser work.","startTime":73.19047619047619,"endTime":75.71428571428571,"audioSegment":0},{"text":"small landing-page, spa-dashboard, web-app-crud, portfolio-site, pwa-offline","startTime":75.71428571428571,"endTime":78.23809523809524,"audioSegment":0},{"text":"Planner Turns a brief into a structured, owned, checkable plan.","startTime":78.23809523809524,"endTime":80.76190476190476,"audioSegment":0},{"text":"medium spec-doc, proposal-sow, dashboard-spec, board-deck, onboarding-checklist","startTime":80.76190476190476,"endTime":83.28571428571428,"audioSegment":0},{"text":"Generalist Carries a whole task from first step to last in one conversation —","startTime":83.28571428571428,"endTime":85.80952380952381,"audioSegment":0},{"text":"every step, every gate.","startTime":85.80952380952381,"endTime":88.33333333333333,"audioSegment":0},{"text":"medium build-loop, bug-fix-tdd","startTime":88.33333333333333,"endTime":90.85714285714286,"audioSegment":0},{"text":"Each role has its own article in this section with the full picture: the character it starts with,","startTime":90.85714285714286,"endTime":93.38095238095238,"audioSegment":0},{"text":"every tool in its kit, and the plans it runs well.","startTime":93.38095238095238,"endTime":95.9047619047619,"audioSegment":0},{"text":"And roles are starting points, not cages — you can rename,","startTime":95.9047619047619,"endTime":98.42857142857143,"audioSegment":0},{"text":"re-equip, and rewrite any crew member after they're created.","startTime":98.42857142857143,"endTime":100.95238095238095,"audioSegment":0},{"text":"To browse the ready-made characters outside the app,","startTime":100.95238095238095,"endTime":103.47619047619047,"audioSegment":0},{"text":"see every role template on gezel.com.","startTime":103.47619047619047,"endTime":106,"audioSegment":0}],"version":1},"startBlock":{"title":"Roles at a glance","subtitle":"A role is a crew member's trade: the bundle of skills, tools, and habits they bring to the work. Roles aren't just labels — each one comes with a default character, a curated toolkit, and a model floor (the minimum model tier the role needs to work unsupervised).","ambientMotion":"zoomIn"}
