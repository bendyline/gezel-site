ition":{"start":{"line":74,"column":1,"offset":4852},"end":{"line":74,"column":59,"offset":4910}}},{"type":"text","value":" sets out, kind by kind, what traffic each level allows.","position":{"start":{"line":74,"column":59,"offset":4910},"end":{"line":74,"column":115,"offset":4966}}}],"position":{"start":{"line":74,"column":1,"offset":4852},"end":{"line":74,"column":115,"offset":4966}}}]},{"id":"choose-the-activity-mode","startTime":220,"duration":24,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Choose the activity mode","position":{"start":{"line":76,"column":4,"offset":4971},"end":{"line":76,"column":28,"offset":4995}}}],"position":{"start":{"line":76,"column":1,"offset":4968},"end":{"line":76,"column":28,"offset":4995}}},"title":"Choose the activity mode","contents":[{"type":"paragraph","children":[{"type":"text","value":"The mode decides how much Gezel does without being asked. A new install starts in ","position":{"start":{"line":78,"column":1,"offset":4997},"end":{"line":78,"column":83,"offset":5079}}},{"type":"strong","children":[{"type":"text","value":"full play","position":{"start":{"line":78,"column":85,"offset":5081},"end":{"line":78,"column":94,"offset":5090}}}],"position":{"start":{"line":78,"column":83,"offset":5079},"end":{"line":78,"column":96,"offset":5092}}},{"type":"text","value":", which suits a desktop where someone is watching. For a server, use ","position":{"start":{"line":78,"column":96,"offset":5092},"end":{"line":78,"column":165,"offset":5161}}},{"type":"strong","children":[{"type":"text","value":"reactive + tasks","position":{"start":{"line":78,"column":167,"offset":5163},"end":{"line":78,"column":183,"offset":5179}}}],"position":{"start":{"line":78,"column":165,"offset":5161},"end":{"line":78,"column":185,"offset":5181}}},{"type":"text","value":": Gezel answers messages, runs the tasks you start and keeps to schedules, but does not nudge or start work of its own.","position":{"start":{"line":78,"column":185,"offset":5181},"end":{"line":78,"column":304,"offset":5300}}}],"position":{"start":{"line":78,"column":1,"offset":4997},"end":{"line":78,"column":304,"offset":5300}}},{"type":"code","lang":"sh","value":"gezel mode reactive+tasks","position":{"start":{"line":80,"column":1,"offset":5302},"end":{"line":82,"column":4,"offset":5337}}},{"type":"paragraph","children":[{"type":"inlineCode","value":"gezel stop --keep-running","position":{"start":{"line":84,"column":1,"offset":5339},"end":{"line":84,"column":28,"offset":5366}}},{"type":"text","value":" is the emergency brake: it cancels AI work, unloads the engines and switches to ","position":{"start":{"line":84,"column":28,"offset":5366},"end":{"line":84,"column":109,"offset":5447}}},{"type":"strong","children":[{"type":"text","value":"reactive","position":{"start":{"line":84,"column":111,"offset":5449},"end":{"line":84,"column":119,"offset":5457}}}],"position":{"start":{"line":84,"column":109,"offset":5447},"end":{"line":84,"column":121,"offset":5459}}},{"type":"text","value":", while the service stays up.","position":{"start":{"line":84,"column":121,"offset":5459},"end":{"line":84,"column":150,"offset":5488}}}],"position":{"start":{"line":84,"column":1,"offset":5339},"end":{"line":84,"column":150,"offset":5488}}}]},{"id":"using-it","startTime":244,"duration":41,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"Using it","position":{"start":{"line":86,"column":4,"offset":5493},"end":{"line":86,"column":12,"offset":5501}}}],"position":{"start":{"line":86,"column":1,"offset":5490},"end":{"line":86,"column":12,"offset":5501}}},"title":"Using it","contents":[{"type":"list","ordered":false,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"inlineCode","value":"gezel run \"...\"","position":{"start":{"line":88,"column":3,"offset":5505},"end":{"line":88,"column":20,"offset":5522}}},{"type":"text","value":" sends one prompt and prints the reply; it reads a prompt from standard input with ","position":{"start":{"line":88,"column":20,"offset":5522},"end":{"line":88,"column":103,"offset":5605}}},{"type":"inlineCode","value":"-","position":{"start":{"line":88,"column":103,"offset":5605},"end":{"line":88,"column":106,"offset":5608}}},{"type":"text","value":".","position":{"start":{"line":88,"column":106,"offset":5608},"end":{"line":88,"column":107,"offset":5609}}}],"position":{"start":{"line":88,"column":3,"offset":5505},"end":{"line":88,"column":107,"offset":5609}}}],"position":{"start":{"line":88,"column":1,"offset":5503},"end":{"line":88,"column":107,"offset":5609}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"inlineCode","value":"gezel start --web","position":{"start":{"line":89,"column":3,"offset":5612},"end":{"line":89,"column":22,"offset":5631}}},{"type":"text","value":" serves the web interface on this machine only and prints a sign-in link. From your own computer, reach it through an SSH tunnel to that port rather than opening it to the network. Add ","position":{"start":{"line":89,"column":22,"offset":5631},"end":{"line":89,"column":207,"offset":5816}}},{"type":"inlineCode","value":"--accounts","position":{"start":{"line":89,"column":207,"offset":5816},"end":{"line":89,"column":219,"offset":5828}}},{"type":"text","value":" to sign in with a name and password instead of a link that lasts until the service restarts; ","position":{"start":{"line":89,"column":219,"offset":5828},"end":{"line":89,"column":313,"offset":5922}}},{"type":"inlineCode","value":"gezel account","position":{"start":{"line":89,"column":313,"offset":5922},"end":{"line":89,"column":328,"offset":5937}}},{"type":"text","value":" manages who can sign in.","position":{"start":{"line":89,"column":328,"offset":5937},"end":{"line":89,"column":353,"offset":5962}}}],"position":{"start":{"line":89,"column":3,"offset":5612},"end":{"line":89,"column":353,"offset":5962}}}],"position":{"start":{"line":89,"column":1,"offset":5610},"end":{"line":89,"column":353,"offset":5962}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"inlineCode","value":"gezel doctor","position":{"start":{"line":90,"column":3,"offset":5965},"end":{"line":90,"column":17,"offset":5979}}},{"type":"text","value":" checks the installation and ends with what to do next.","position":{"start":{"line":90,"column":17,"offset":5979},"end":{"line":90,"column":72,"offset":6034}}}],"position":{"start":{"line":90,"column":3,"offset":5965},"end":{"line":90,"column":72,"offset":6034}}}],"position":{"start":{"line":90,"column":1,"offset":5963},"end":{"line":90,"column":72,"offset":6034}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"inlineCode","value":"gezel bench","position":{"start":{"line":91,"column":3,"offset":6037},"end":{"line":91,"column":16,"offset":6050}}},{"type":"text","value":" measures the chosen model on this machine with the same tasks as the published ","position":{"start":{"line":91,"column":16,"offset":6050},"end":{"line":91,"column":96,"offset":6130}}},{"type":"link","url":"../model-scorecard/","children":[{"type":"text","value":"model scorecard","position":{"start":{"line":91,"column":97,"offset":6131},"end":{"line":91,"column":112,"offset":6146}}}],"position":{"start":{"line":91,"column":96,"offset":6130},"end":{"line":91,"column":134,"offset":6168}}},{"type":"text","value":".","position":{"start":{"line":91,"column":134,"offset":6168},"end":{"line":91,"column":135,"offset":6169}}}],"position":{"start":{"line":91,"column":3,"offset":6037},"end":{"line":91,"column":135,"offset":6169}}}],"position":{"start":{"line":91,"column":1,"offset":6035},"end":{"line":91,"column":135,"offset":6169}}}],"position":{"start":{"line":88,"column":1,"offset":5503},"end":{"line":91,"column":135,"offset":6169}}},{"type":"paragraph","children":[{"type":"text","value":"Back up the home folder like any other data directory; it holds plain Markdown, JSON and SQLite files. ","position":{"start":{"line":93,"column":1,"offset":6171},"end":{"line":93,"column":104,"offset":6274}}},{"type":"link","url":"../where-files-live/","children":[{"type":"text","value":"Where files live","position":{"start":{"line":93,"column":105,"offset":6275},"end":{"line":93,"column":121,"offset":6291}}}],"position":{"start":{"line":93,"column":104,"offset":6274},"end":{"line":93,"column":144,"offset":6314}}},{"type":"text","value":" gives the layout.","position":{"start":{"line":93,"column":144,"offset":6314},"end":{"line":93,"column":162,"offset":6332}}}],"position":{"start":{"line":93,"column":1,"offset":6171},"end":{"line":93,"column":162,"offset":6332}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"The Gezel service runs without a screen.","startTime":0,"endTime":3.7777777777777777,"audioSegment":0},{"text":"The desktop app is one way to drive it;","startTime":3.7777777777777777,"endTime":7.555555555555555,"audioSegment":0},{"text":"the gezel command line is another, and on a server it is all you need.","startTime":7.555555555555555,"endTime":11.333333333333332,"audioSegment":0},{"text":"Your projects, crews, craftbooks and history live in plain files on that machine,","startTime":11.333333333333332,"endTime":15.11111111111111,"audioSegment":0},{"text":"and the service answers only on that machine unless you deliberately pair another device to it.","startTime":15.11111111111111,"endTime":18.88888888888889,"audioSegment":0},{"text":"This page covers a single-user server: one account that owns the service and its files.","startTime":18.88888888888889,"endTime":22.666666666666664,"audioSegment":0},{"text":"For the full list of commands, see The gezel command line.","startTime":22.666666666666664,"endTime":26.444444444444443,"audioSegment":0},{"text":"If the server runs Docker, Gezel in Docker is the shorter road: one command,","startTime":26.444444444444443,"endTime":30.22222222222222,"audioSegment":0},{"text":"every engine already inside, and a sign-in for each person who uses it.","startTime":30.22222222222222,"endTime":34,"audioSegment":0},{"text":"Node.js 24 or newer.","startTime":34,"endTime":36.8235294117647,"audioSegment":0},{"text":"The command line checks this and says so if it is missing.","startTime":36.8235294117647,"endTime":39.64705882352941,"audioSegment":0},{"text":"On Ubuntu or Debian, curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -","startTime":39.64705882352941,"endTime":42.470588235294116,"audioSegment":0},{"text":"&& sudo apt-get install -y nodejs installs it; on any system, nvm install 24 does too.","startTime":42.470588235294116,"endTime":45.294117647058826,"audioSegment":0},{"text":"The command line itself: npm install -g gezel-cli,","startTime":45.294117647058826,"endTime":48.11764705882353,"audioSegment":0},{"text":"or npx gezel-cli to run it without installing.","startTime":48.11764705882353,"endTime":50.94117647058823,"audioSegment":0},{"text":"gezel-cli is the short name for @bendyline/gezel-cli;","startTime":50.94117647058823,"endTime":53.76470588235294,"audioSegment":0},{"text":"install one of the two, not both.","startTime":53.76470588235294,"endTime":56.58823529411765,"audioSegment":0},{"text":"Either way the command is gezel.","startTime":56.58823529411765,"endTime":59.411764705882355,"audioSegment":0},{"text":"For local models on Linux, a recent C library.","startTime":59.411764705882355,"endTime":62.23529411764706,"audioSegment":0},{"text":"Gezel's on-device engines need glibc 2.38 or newer and the GCC 14.1 C++ runtime.","startTime":62.23529411764706,"endTime":65.05882352941177,"audioSegment":0},{"text":"Ubuntu 24.04, Debian 13 and Fedora 40 or later meet that floor.","startTime":65.05882352941177,"endTime":67.88235294117646,"audioSegment":0},{"text":"Ubuntu 22.04, Debian 12,","startTime":67.88235294117646,"endTime":70.70588235294119,"audioSegment":0},{"text":"RHEL 9 and Fedora 39 do not; see the next section.","startTime":70.70588235294119,"endTime":73.52941176470588,"audioSegment":0},{"text":"On Windows, the Microsoft Visual C++ 2015–2022 Redistributable.","startTime":73.52941176470588,"endTime":76.3529411764706,"audioSegment":0},{"text":"The desktop installer adds it for you; an npm install does not.","startTime":76.3529411764706,"endTime":79.1764705882353,"audioSegment":0},{"text":"On macOS, macOS 13.3 or newer for the on-device engines.","startTime":79.1764705882353,"endTime":82,"audioSegment":0},{"text":"Below the C library floor, the bundled engines cannot start.","startTime":82,"endTime":84.8125,"audioSegment":0},{"text":"The system stops them before they can report anything,","startTime":84.8125,"endTime":87.625,"audioSegment":0},{"text":"so a local model simply never loads.","startTime":87.625,"endTime":90.4375,"audioSegment":0},{"text":"Everything else in Gezel still works: projects,","startTime":90.4375,"endTime":93.25,"audioSegment":0},{"text":"crews, craftbooks, tools and the API.","startTime":93.25,"endTime":96.0625,"audioSegment":0},{"text":"You have two ways to give it a model:","startTime":96.0625,"endTime":98.875,"audioSegment":0},{"text":"A cloud provider.","startTime":98.875,"endTime":101.6875,"audioSegment":0},{"text":"Save a key with gezel secret set anthropicApiKey --env ANTHROPIC_API_KEY (or openaiApiKey,","startTime":101.6875,"endTime":104.5,"audioSegment":0},{"text":"and so on), then run gezel and pick one of that provider's models with /model.","startTime":104.5,"endTime":107.3125,"audioSegment":0},{"text":"Cloud models need the lockdown or free security level; super-lockdown refuses them.","startTime":107.3125,"endTime":110.125,"audioSegment":0},{"text":"Ollama, installed and run separately.","startTime":110.125,"endTime":112.9375,"audioSegment":0},{"text":"Gezel treats Ollama as a local engine,","startTime":112.9375,"endTime":115.75,"audioSegment":0},{"text":"so it is allowed at every security level, including super-lockdown.","startTime":115.75,"endTime":118.5625,"audioSegment":0},{"text":"Install the command line from npm on these systems.","startTime":118.5625,"endTime":121.375,"audioSegment":0},{"text":"The desktop .deb and .rpm packages enforce the floor for the whole application and refuse to install below it,","startTime":121.375,"endTime":124.1875,"audioSegment":0},{"text":"even if you only mean to use cloud models.","startTime":124.1875,"endTime":127,"audioSegment":0},{"text":"gezel start starts the service and returns;","startTime":127,"endTime":129.3913043478261,"audioSegment":0},{"text":"it keeps running until gezel stop.","startTime":129.3913043478261,"endTime":131.7826086956522,"audioSegment":0},{"text":"On a server, let the operating system supervise it instead: run gezel start --foreground as a service of your own account,","startTime":131.7826086956522,"endTime":134.17391304347825,"audioSegment":0},{"text":"so it restarts after a crash or a reboot.","startTime":134.17391304347825,"endTime":136.56521739130434,"audioSegment":0},{"text":"Give the server its own home with --home.","startTime":136.56521739130434,"endTime":138.95652173913044,"audioSegment":0},{"text":"Everything the service keeps goes there,","startTime":138.95652173913044,"endTime":141.34782608695653,"audioSegment":0},{"text":"and a home you name is kept apart from anything a desktop install on the same machine shares.","startTime":141.34782608695653,"endTime":143.73913043478262,"audioSegment":0},{"text":"On Linux, a systemd user service does this.","startTime":143.73913043478262,"endTime":146.1304347826087,"audioSegment":0},{"text":"Save the following as ~/.config/systemd/user/gezel.service,","startTime":146.1304347826087,"endTime":148.52173913043478,"audioSegment":0},{"text":"replacing the two paths with the output of command -v gezel and dirname \"$(command -v node)\": [Unit]","startTime":148.52173913043478,"endTime":150.91304347826087,"audioSegment":0},{"text":"Description=Gezel service","startTime":150.91304347826087,"endTime":153.30434782608697,"audioSegment":0},{"text":"After=network-online.target [Service]","startTime":153.30434782608697,"endTime":155.69565217391303,"audioSegment":0},{"text":"Environment=PATH=/path/to/node/bin:/usr/bin:/bin","startTime":155.69565217391303,"endTime":158.08695652173913,"audioSegment":0},{"text":"ExecStart=/path/to/gezel --home %h/gezel-server start --foreground","startTime":158.08695652173913,"endTime":160.47826086956522,"audioSegment":0},{"text":"Restart=on-failure [Install]","startTime":160.47826086956522,"endTime":162.8695652173913,"audioSegment":0},{"text":"WantedBy=default.target Then:","startTime":162.8695652173913,"endTime":165.26086956521738,"audioSegment":0},{"text":"systemctl --user daemon-reload","startTime":165.26086956521738,"endTime":167.65217391304347,"audioSegment":0},{"text":"systemctl --user enable --now gezel","startTime":167.65217391304347,"endTime":170.04347826086956,"audioSegment":0},{"text":"loginctl enable-linger \"$USER\"   # keep it running when you are logged out","startTime":170.04347826086956,"endTime":172.43478260869566,"audioSegment":0},{"text":"Every later command against that home takes the same option,","startTime":172.43478260869566,"endTime":174.82608695652175,"audioSegment":0},{"text":"for example gezel --home ~/gezel-server status.","startTime":174.82608695652175,"endTime":177.2173913043478,"audioSegment":0},{"text":"Setting GEZEL_HOME in your shell profile does the same without typing it each time. On macOS,","startTime":177.2173913043478,"endTime":179.6086956521739,"audioSegment":0},{"text":"a LaunchAgent with the same command line and KeepAlive does the same job.","startTime":179.6086956521739,"endTime":182,"audioSegment":0},{"text":"A server should run at a level you chose on purpose.","startTime":182,"endTime":184.23529411764707,"audioSegment":0},{"text":"The new-install default is lockdown.","startTime":184.23529411764707,"endTime":186.47058823529412,"audioSegment":0},{"text":"Set or check it from the terminal:","startTime":186.47058823529412,"endTime":188.7058823529412,"audioSegment":0},{"text":"gezel security level              # show the current level and what it allows","startTime":188.7058823529412,"endTime":190.94117647058823,"audioSegment":0},{"text":"gezel security level set lockdown","startTime":190.94117647058823,"endTime":193.1764705882353,"audioSegment":0},{"text":"gezel security level set super-lockdown","startTime":193.1764705882353,"endTime":195.41176470588235,"audioSegment":0},{"text":"super-lockdown: local models only.","startTime":195.41176470588235,"endTime":197.64705882352942,"audioSegment":0},{"text":"No cloud models, no web access, no scripts,","startTime":197.64705882352942,"endTime":199.88235294117646,"audioSegment":0},{"text":"no automatic update checks, and connectors move no data.","startTime":199.88235294117646,"endTime":202.11764705882354,"audioSegment":0},{"text":"Choose this when nothing may leave the machine.","startTime":202.11764705882354,"endTime":204.35294117647058,"audioSegment":0},{"text":"lockdown: adds cloud models, sandboxed scripts, the model's Git tools,","startTime":204.35294117647058,"endTime":206.58823529411765,"audioSegment":0},{"text":"connector syncs you start, and update checks.","startTime":206.58823529411765,"endTime":208.8235294117647,"audioSegment":0},{"text":"Web search, mail and third-party toolsets stay off.","startTime":208.8235294117647,"endTime":211.05882352941177,"audioSegment":0},{"text":"free: everything, including web search and third-party toolsets.","startTime":211.05882352941177,"endTime":213.29411764705884,"audioSegment":0},{"text":"Rarely right for a shared server.","startTime":213.29411764705884,"endTime":215.52941176470588,"audioSegment":0},{"text":"What leaves this computer sets out,","startTime":215.52941176470588,"endTime":217.76470588235293,"audioSegment":0},{"text":"kind by kind, what traffic each level allows.","startTime":217.76470588235293,"endTime":220,"audioSegment":0},{"text":"The mode decides how much Gezel does without being asked.","startTime":220,"endTime":223,"audioSegment":0},{"text":"A new install starts in full play,","startTime":223,"endTime":226,"audioSegment":0},{"text":"which suits a desktop where someone is watching.","startTime":226,"endTime":229,"audioSegment":0},{"text":"For a server, use reactive + tasks: Gezel answers messages,","startTime":229,"endTime":232,"audioSegment":0},{"text":"runs the tasks you start and keeps to schedules, but does not nudge or start work of its own.","startTime":232,"endTime":235,"audioSegment":0},{"text":"gezel mode reactive+tasks","startTime":235,"endTime":238,"audioSegment":0},{"text":"gezel stop --keep-running is the emergency brake: it cancels AI work,","startTime":238,"endTime":241,"audioSegment":0},{"text":"unloads the engines and switches to reactive, while the service stays up.","startTime":241,"endTime":244,"audioSegment":0},{"text":"gezel run \"...\" sends one prompt and prints the reply;","startTime":244,"endTime":247.41666666666666,"audioSegment":0},{"text":"it reads a prompt from standard input with -.","startTime":247.41666666666666,"endTime":250.83333333333334,"audioSegment":0},{"text":"gezel start --web serves the web interface on this machine only and prints a sign-in link.","startTime":250.83333333333334,"endTime":254.25,"audioSegment":0},{"text":"From your own computer,","startTime":254.25,"endTime":257.6666666666667,"audioSegment":0},{"text":"reach it through an SSH tunnel to that port rather than opening it to the network.","startTime":257.6666666666667,"endTime":261.0833333333333,"audioSegment":0},{"text":"Add --accounts to sign in with a name and password instead of a link that lasts until the service restarts;","startTime":261.0833333333333,"endTime":264.5,"audioSegment":0},{"text":"gezel account manages who can sign in.","startTime":264.5,"endTime":267.9166666666667,"audioSegment":0},{"text":"gezel doctor checks the installation and ends with what to do next.","startTime":267.9166666666667,"endTime":271.3333333333333,"audioSegment":0},{"text":"gezel bench measures the chosen model on this machine with the same tasks as the published model scorecard.","startTime":271.3333333333333,"endTime":274.75,"audioSegment":0},{"text":"Back up the home folder like any other data directory;","startTime":274.75,"endTime":278.1666666666667,"audioSegment":0},{"text":"it holds plain Markdown, JSON and SQLite files.","startTime":278.1666666666667,"endTime":281.5833333333333,"audioSegment":0},{"text":"Where files live gives the layout.","startTime":281.5833333333333,"endTime":285,"audioSegment":0}],"version":1},"startBlock":{"title":"Gezel on a server","subtitle":"The Gezel service runs without a screen. The desktop app is one way to drive it; the gezel command line is another, and on a server it is all you need. Your projects, crews, craftbooks and history live in plain files on that machine, and the service answers only on that machine unless you deliberately pair another device to it.","ambientMotion":"zoomIn"}}</script>
