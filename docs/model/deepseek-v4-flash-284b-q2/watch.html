B-parameter Mixture-of-Experts (~13B active per token) with 1M-token context and Compressed Sparse Attention.","startTime":2.7777777777777777,"endTime":5.555555555555555,"audioSegment":0},{"text":"Same architecture as the original V4 Flash,","startTime":5.555555555555555,"endTime":8.333333333333332,"audioSegment":0},{"text":"with substantially stronger agentic and coding behaviour.","startTime":8.333333333333332,"endTime":11.11111111111111,"audioSegment":0},{"text":"The routed experts are crushed to IQ2_XXS / Q2_K while attention projections, shared experts, router, embeddings,","startTime":11.11111111111111,"endTime":13.88888888888889,"audioSegment":0},{"text":"and output head stay at Q8_0 / F16, landing the whole model in ~81 GB — runnable on 128 GB-class machines versus ~156 GB for the native FP4 build.","startTime":13.88888888888889,"endTime":16.666666666666664,"audioSegment":0},{"text":"Note: these quants were produced for antirez's ds4 inference engine;","startTime":16.666666666666664,"endTime":19.444444444444443,"audioSegment":0},{"text":"whether they load on stock llama depends on its DeepSeek-V4 support. At a glance","startTime":19.444444444444443,"endTime":22.22222222222222,"audioSegment":0},{"text":"Made by DeepSeek","startTime":22.22222222222222,"endTime":25,"audioSegment":0},{"text":"Download size 86.7 GB","startTime":25,"endTime":27.77777777777778,"audioSegment":0},{"text":"Parameters 284B","startTime":27.77777777777778,"endTime":30.555555555555554,"audioSegment":0},{"text":"Quantization IQ2_XXS","startTime":30.555555555555554,"endTime":33.33333333333333,"audioSegment":0},{"text":"Context window 1000K tokens Uses tools Yes","startTime":33.33333333333333,"endTime":36.11111111111111,"audioSegment":0},{"text":"Best for Reasoning","startTime":36.11111111111111,"endTime":38.888888888888886,"audioSegment":0},{"text":"Runs on llama.cpp, DwarfStar License MIT","startTime":38.888888888888886,"endTime":41.666666666666664,"audioSegment":0},{"text":"Added to the catalog 2026-08-01","startTime":41.666666666666664,"endTime":44.44444444444444,"audioSegment":0},{"text":"Gezel downloads this model the first time it is needed,","startTime":44.44444444444444,"endTime":47.22222222222222,"audioSegment":0},{"text":"checks the file against its published hash, and applies tuned settings for it.","startTime":47.22222222222222,"endTime":50,"audioSegment":0},{"text":"Every scorecard round that ran this model or another build of it, newest first.","startTime":50,"endTime":54.166666666666664,"audioSegment":0},{"text":"Each round is one machine, one day, one version of Gezel and one version of the tests,","startTime":54.166666666666664,"endTime":58.333333333333336,"audioSegment":0},{"text":"so rounds are not comparable with each other: a change to any of those can move a score without the model changing.","startTime":58.333333333333336,"endTime":62.5,"audioSegment":0},{"text":"Where a task ran fewer than three times,","startTime":62.5,"endTime":66.66666666666667,"audioSegment":0},{"text":"the result is a count rather than a percentage.","startTime":66.66666666666667,"endTime":70.83333333333334,"audioSegment":0},{"text":"How we test models explains what each set contains.","startTime":70.83333333333334,"endTime":75,"audioSegment":0},{"text":"Round Build Task set Passed Output speed Prefill speed","startTime":75,"endTime":79.16666666666667,"audioSegment":0},{"text":"2026-08-31 · DGX Spark Class deepseek-v4-flash-284b-q2 · DwarfStar General capability 33/33 (100%) 17.1 tok/s 456.0 tok/s","startTime":79.16666666666667,"endTime":83.33333333333334,"audioSegment":0},{"text":"2026-08-31 · DGX Spark Class deepseek-v4-flash-284b-q2 · DwarfStar Office and knowledge work 36/39 (92%) 17.1 tok/s 456.0 tok/s","startTime":83.33333333333334,"endTime":87.5,"audioSegment":0},{"text":"2026-08-20 · DGX Spark Class deepseek-v4-flash-284b-q2 · DwarfStar General capability 33/33 (100%) 16.9 tok/s 680.0 tok/s","startTime":87.5,"endTime":91.66666666666667,"audioSegmen
