he installed schemas, test the main flow in a real host, and report supported modes, remaining limitations, and the release/install step needed to use it.","position":{"start":{"line":211,"column":466,"offset":23457},"end":{"line":211,"column":812,"offset":23803}}}],"position":{"start":{"line":211,"column":3,"offset":22994},"end":{"line":211,"column":812,"offset":23803}}}],"position":{"start":{"line":211,"column":1,"offset":22992},"end":{"line":211,"column":812,"offset":23803}}},{"type":"paragraph","children":[{"type":"text","value":"Before handing over the app:","position":{"start":{"line":213,"column":1,"offset":23805},"end":{"line":213,"column":29,"offset":23833}}}],"position":{"start":{"line":213,"column":1,"offset":23805},"end":{"line":213,"column":29,"offset":23833}}},{"type":"list","ordered":true,"start":1,"spread":false,"children":[{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Validate the source or Gilde payload, including every referenced role, craftbook, script, page, and seed. Keep generated and authored files distinct.","position":{"start":{"line":215,"column":4,"offset":23838},"end":{"line":215,"column":153,"offset":23987}}}],"position":{"start":{"line":215,"column":4,"offset":23838},"end":{"line":215,"column":153,"offset":23987}}}],"position":{"start":{"line":215,"column":1,"offset":23835},"end":{"line":215,"column":153,"offset":23987}}},{"type":"listItem","spread":false,"children":[{"type":"paragraph","children":[{"type":"text","value":"Create or apply the app in an isolated test project. Verify the actual folder binding, permission denials, and every state-changing action. A folder explorer must leave originals unchanged.","position":{"start":{"line":216,"column":4,"offset":23991},"end":{"line":216,"column":193,"offset":24180}}}],"position":{"start":{"line":216,"column":4,"offset":23991},"end":{"line":216,"column":193,"offset":24180}}}],"position":{"start":{"line":216,"column":1,"offset":23988} value":" sidecars are validated at authoring time, but the eval harness does not yet run an installed app's craftbook tests","position":{"start":{"line":233,"column":39,"offset":26130},"end":{"line":233,"column":154,"offset":26245}}}],"position":{"start":{"line":233,"column":26,"offset":26117},"end":{"line":233,"column":156,"offset":26247}}}],"position":{"start":{"line":233,"column":1,"offset":26092},"end":{"line":233,"column":156,"offset":26247}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Signing and registries","position":{"start":{"line":234,"column":3,"offset":26250},"end":{"line":234,"column":25,"offset":26272}}}],"position":{"start":{"line":234,"column":1,"offset":26248},"end":{"line":234,"column":26,"offset":26273}}},{"type":"tableCell","children":[{"type":"text","value":"v1 signature status is ","position":{"start":{"line":234,"column":28,"offset":26275},"end":{"line":234,"column":51,"offset":26298}}},{"type":"inlineCode","value":"unsigned","position":{"start":{"line":234,"column":51,"offset":26298},"end":{"line":234,"column":61,"offset":26308}}},{"type":"text","value":"; a signing story and a private registry path alongside public Gilde contributions","position":{"start":{"line":234,"column":61,"offset":26308},"end":{"line":234,"column":143,"offset":26390}}}],"position":{"start":{"line":234,"column":26,"offset":26273},"end":{"line":234,"column":145,"offset":26392}}}],"position":{"start":{"line":234,"column":1,"offset":26248},"end":{"line":234,"column":145,"offset":26392}}}],"position":{"start":{"line":226,"column":1,"offset":25194},"end":{"line":234,"column":145,"offset":26392}}},{"type":"paragraph","children":[{"type":"text","value":"Until those close, treat the source folder as the canonical form of an AI App: Gilde for public distribution, ","position":{"start":{"line":236,"column":1,"offset":26394},"end":{"line":236,"column":111,"offset":26504}}},{"type":"inlineCode","value":".gezapp","position":{"start":{"line":236,"column":111,"offset":26504},"end":{"line":236,"column":120,"offset":26513}}},{"type":"text","value":" for controlled sharing, and ordinary projects for prototypes whose composition is still changing.","position":{"start":{"line":236,"column":120,"offset":26513},"end":{"line":236,"column":218,"offset":26611}}}],"position":{"start":{"line":236,"column":1,"offset":26394},"end":{"line":236,"column":218,"offset":26611}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"File-oriented apps should reuse the shared file card and file adder.","startTime":0,"endTime":3.2142857142857144,"audioSegment":0},{"text":"Use explicit pages.imports destinations for uploads, alongside pages.reads for browsing.","startTime":3.2142857142857144,"endTime":6.428571428571429,"audioSegment":0},{"text":"The components work with plain HTML, inherit shared typography,","startTime":6.428571428571429,"endTime":9.642857142857142,"audioSegment":0},{"text":"and include an in-memory standalone demo adapter.","startTime":9.642857142857142,"endTime":12.857142857142858,"audioSegment":0},{"text":"Test both demo and embedded flows, including write denial,","startTime":12.857142857142858,"endTime":16.071428571428573,"audioSegment":0},{"text":"partial failures and resetting demo state.","startTime":16.071428571428573,"endTime":19.285714285714285,"audioSegment":0},{"text":"An AI App is a reusable experience that runs inside Gezel: a tailored project,","startTime":19.285714285714285,"endTime":22.5,"audioSegment":0},{"text":"a purpose-built crew, repeatable craftbooks, scripts, data, and an optional interactive dashboard.","startTime":22.5,"endTime":25.714285714285715,"audioSegment":0},{"text":"A language trainer, research room, board game,","startTime":25.714285714285715,"endTime":28.92857142857143,"audioSegment":0},{"text":"or client-service workspace can all use the same underlying pieces while feeling like a distinct application.","startTime":28.92857142857143,"endTime":32.142857142857146,"audioSegment":0},{"text":"\"Gezel app\" and \"AI App\" name that experience.","startTime":32.142857142857146,"endTime":35.35714285714286,"audioSegment":0},{"text":"The project type is its reusable composition and setup recipe;","startTime":35.35714285714286,"endTime":38.57142857142857,"audioSegment":0},{"text":"the project is one person's instance.","startTime":38.57142857142857,"endTime":41.785714285714285,"audioSegment":0},{"text":"You can build a useful app with only a page and a folder,","startTime":41.785714285714285,"endTime":45,"audioSegment":0},{"text":"then add a crew member or a craftbook when the work calls for one.","startTime":45,"endTime":48.214285714285715,"audioSegment":0},{"text":"You do not need every component in every app.","startTime":48.214285714285715,"endTime":51.42857142857143,"audioSegment":0},{"text":"For the interface,","startTime":51.42857142857143,"endTime":54.642857142857146,"audioSegment":0},{"text":"read Using the Gezel page APIs and the app page style guide.","startTime":54.642857142857146,"endTime":57.85714285714286,"audioSegment":0},{"text":"The complete page API reference and project-type specification provide the precise runtime contracts.","startTime":57.85714285714286,"endTime":61.07142857142858,"audioSegment":0},{"text":"These three Handboek guides are the starting path for people and AI agents building an app.","startTime":61.07142857142858,"endTime":64.28571428571429,"audioSegment":0},{"text":"The project type is the composition root and installer.","startTime":64.28571428571429,"endTime":67.5,"audioSegment":0},{"text":"Public AI Apps arrive through the project-type collection;","startTime":67.5,"endTime":70.71428571428572,"audioSegment":0},{"text":"private or experimental apps travel as .gezapp packages.","startTime":70.71428571428572,"endTime":73.92857142857143,"audioSegment":0},{"text":"Both start life as the same thing: a source folder you can build with the command line,","startTime":73.92857142857143,"endTime":77.14285714285714,"audioSegment":0},{"text":"by hand, or with an AI agent — this article is the guide to that folder.","startTime":77.14285714285714,"endTime":80.35714285714286,"audioSegment":0},{"text":"An AI App is different from a connected app.","startTime":80.35714285714286,"endTime":83.57142857142857,"audioSegment":0},{"text":"A connected app runs in its own process and interface and reaches Gezel through @bendyline/gezel-app-sdk.","startTime":83.57142857142857,"endTime":86.78571428571429,"audioSegment":0},{"text":"See Building connected apps with gezel-app-sdk when that is what you are building.","startTime":86.78571428571429,"endTime":90,"audioSegment":0},{"text":"Scaffolding, schema export, validation, and packing work without a running service.","startTime":90,"endTime":92.97674418604652,"audioSegment":0},{"text":"Installation and adoption use the Gezel daemon.","startTime":92.97674418604652,"endTime":95.95348837209302,"audioSegment":0},{"text":"Start with a disposable project folder while developing an app that writes data:","startTime":95.95348837209302,"endTime":98.93023255813954,"audioSegment":0},{"text":"gezel app new my-app --with-page     # a minimal source folder that validates cd my-app","startTime":98.93023255813954,"endTime":101.90697674418604,"audioSegment":0},{"text":"gezel app schemas --out schemas     # the exact schemas this CLI understands","startTime":101.90697674418604,"endTime":104.88372093023256,"audioSegment":0},{"text":"# edit items/ —","startTime":104.88372093023256,"endTime":107.86046511627907,"audioSegment":0},{"text":"the role's about.md and the version manifest are the heart","startTime":107.86046511627907,"endTime":110.83720930232559,"audioSegment":0},{"text":"gezel app validate .","startTime":110.83720930232559,"endTime":113.81395348837209,"audioSegment":0},{"text":"# every finding at once; --json for tooling","startTime":113.81395348837209,"endTime":116.7906976744186,"audioSegment":0},{"text":"gezel app pack .","startTime":116.7906976744186,"endTime":119.76744186046511,"audioSegment":0},{"text":"# -> my-app-1.0.0.gezapp","startTime":119.76744186046511,"endTime":122.74418604651163,"audioSegment":0},{"text":"gezel app add my-app-1.0.0.gezapp     # review and confirm the installation","startTime":122.74418604651163,"endTime":125.72093023255815,"audioSegment":0},{"text":"cd ~/the/folder/for/it && gezel app apply my-app","startTime":125.72093023255815,"endTime":128.69767441860466,"audioSegment":0},{"text":"apply outfits the current folder as a project: it creates the crew from the embedded role templates,","startTime":128.69767441860466,"endTime":131.67441860465118,"audioSegment":0},{"text":"installs craftbooks and scripts, seeds the data files, and pins the Output page.","startTime":131.67441860465118,"endTime":134.65116279069767,"audioSegment":0},{"text":"From there, iterate — edit the source, validate, pack, add (an upgrade), and apply --refresh;","startTime":134.65116279069767,"endTime":137.62790697674419,"audioSegment":0},{"text":"gezel app status reports seed drift, and gezel app serve shares the finished page (and optional visitor chat) as a mini-site.","startTime":137.62790697674419,"endTime":140.6046511627907,"audioSegment":0},{"text":"The --with-page scaffold includes a working records page.","startTime":140.6046511627907,"endTime":143.5813953488372,"audioSegment":0},{"text":"Run gezel app demo .","startTime":143.5813953488372,"endTime":146.5581395348837,"audioSegment":0},{"text":"--out ../my-app-demo and open the generated pages/dashboard/index.html for a standalone demo with resettable,","startTime":146.5581395348837,"endTime":149.53488372093022,"audioSegment":0},{"text":"in-memory sample data.","startTime":149.53488372093022,"endTime":152.51162790697674,"audioSegment":0},{"text":"The exporter supplies the shared bootstrap,","startTime":152.51162790697674,"endTime":155.48837209302326,"audioSegment":0},{"text":"components and fonts; app source does not bundle them.","startTime":155.48837209302326,"endTime":158.46511627906978,"audioSegment":0},{"text":"Inside Gezel it reads the real data.json, inherits the shared body/UI/heading fonts,","startTime":158.46511627906978,"endTime":161.4418604651163,"audioSegment":0},{"text":"follows host theme changes, and displays failures without switching to sample data.","startTime":161.4418604651163,"endTime":164.4186046511628,"audioSegment":0},{"text":"It includes loading, empty, pending,","startTime":164.4186046511628,"endTime":167.3953488372093,"audioSegment":0},{"text":"and retry states and cleans up its subscriptions.","startTime":167.3953488372093,"endTime":170.37209302325581,"audioSegment":0},{"text":"The browser preview is read-only;","startTime":170.37209302325581,"endTime":173.34883720930233,"audioSegment":0},{"text":"embedded and shared-site actions remain subject to host permissions.","startTime":173.34883720930233,"endTime":176.32558139534882,"audioSegment":0},{"text":"The scaffold exposes add_record to the keeper and page_add_record to the page,","startTime":176.32558139534882,"endTime":179.30232558139534,"audioSegment":0},{"text":"both backed by the same records-store script.","startTime":179.30232558139534,"endTime":182.27906976744185,"audioSegment":0},{"text":"This distinction matters: a name in pages.tools is excluded from the model's tool roster.","startTime":182.27906976744185,"endTime":185.25581395348837,"audioSegment":0},{"text":"Keep separate names when both audiences need an action.","startTime":185.25581395348837,"endTime":188.2325581395349,"audioSegment":0},{"text":"The sample uses button and keyboard handlers because the page sandbox does not allow native form submissions.","startTime":188.2325581395349,"endTime":191.2093023255814,"audioSegment":0},{"text":"Extend this starting point using the style/API guides,","startTime":191.2093023255814,"endTime":194.18604651162792,"audioSegment":0},{"text":"and test your new actions against a real host as well as the demo.","startTime":194.18604651162792,"endTime":197.1627906976744,"audioSegment":0},{"text":"Three worked samples of graded size live in examples/apps — example-journal (the minimal shape),","startTime":197.1627906976744,"endTime":200.13953488372093,"audioSegment":0},{"text":"example-habit-tracker (state, tools, a live page), and example-reading-circle (a crew, craftbooks, schedules, dependencies).","startTime":200.13953488372093,"endTime":203.11627906976744,"audioSegment":0},{"text":"Copying the smallest one that fits beats starting empty.","startTime":203.11627906976744,"endTime":206.09302325581393,"audioSegment":0},{"text":"For shared page APIs, inspect the Media Library and Data Analysis types: they show folder discovery,","startTime":206.09302325581393,"endTime":209.06976744186045,"audioSegment":0},{"text":"file-viewer navigation, inherited typography, and indexed summaries without private transports.","startTime":209.06976744186045,"endTime":212.04651162790697,"audioSegment":0},{"text":"Use the API reference as the contract;","startTime":212.04651162790697,"endTime":215.02325581395348,"audioSegment":0},{"text":"a sample's implementation choices are not additional requirements.","startTime":215.02325581395348,"endTime":218,"audioSegment":0},{"text":"The other on-ramp is to prototype the experience as an ordinary project first: settle the crew roles in conversation,","startTime":218,"endTime":222.83333333333334,"audioSegment":0},{"text":"work through each craftbook, run the scripts by hand, and decide which files are durable state versus generated artifacts.","startTime":222.83333333333334,"endTime":227.66666666666666,"audioSegment":0},{"text":"When the composition feels right,","startTime":227.66666666666666,"endTime":232.5,"audioSegment":0},{"text":"ask someone on the crew who has the project-management tools to export the type applied to that project.","startTime":232.5,"endTime":237.33333333333334,"audioSegment":0},{"text":"Gezel writes a .gezapp into the project artifacts — and a .gezapp is a renamed zip of exactly the source layout below,","startTime":237.33333333333334,"endTime":242.16666666666666,"audioSegment":0},{"text":"so unzip it, drop in a small gezapp.json, and keep iterating with validate and pack.","startTime":242.16666666666666,"endTime":247,"audioSegment":0},{"text":"A source folder is a gezapp.json beside an items/ tree.","startTime":247,"endTime":249.55263157894737,"audioSegment":0},{"text":"The tree is the same layout the packed archive and the installed app use (items sharded by the first two characters of their id,","startTime":249.55263157894737,"endTime":252.10526315789474,"audioSegment":0},{"text":"identity separate from versioned content), which is why exports round-trip: my-app/","startTime":252.10526315789474,"endTime":254.6578947368421,"audioSegment":0},{"text":"gezapp.json                        the source manifest — small on purpose items/","startTime":254.6578947368421,"endTime":257.2105263157895,"audioSegment":0},{"text":"project-types/my/my-app/","startTime":257.2105263157895,"endTime":259.7631578947368,"audioSegment":0},{"text":"manifest.json                  identity: id, name, description, maintainer","startTime":259.7631578947368,"endTime":262.3157894736842,"audioSegment":0},{"text":"versions/1.0.0/","startTime":262.3157894736842,"endTime":264.86842105263156,"audioSegment":0},{"text":"manifest.json                the composition root (everything below hangs off it)","startTime":264.86842105263156,"endTime":267.42105263157896,"audioSegment":0},{"text":"about.md                     param-templated project context mission.md","startTime":267.42105263157896,"endTime":269.9736842105263,"audioSegment":0},{"text":"records.json                 seed data (workspaceSeed) scripts/","startTime":269.9736842105263,"endTime":272.5263157894737,"audioSegment":0},{"text":"record-store.ts            sidecar script — folded inline at pack craftbooks/","startTime":272.5263157894737,"endTime":275.07894736842104,"audioSegment":0},{"text":"review-records.json        type-private craftbook document pages/","startTime":275.07894736842104,"endTime":277.63157894736844,"audioSegment":0},{"text":"dashboard/index.html       the Output page","startTime":277.63157894736844,"endTime":280.1842105263158,"audioSegment":0},{"text":"gezel-templates/my/my-app-lead/","startTime":280.1842105263158,"endTime":282.7368421052632,"audioSegment":0},{"text":"manifest.json                  role identity (kind, id, name, role)","startTime":282.7368421052632,"endTime":285.2894736842105,"audioSegment":0},{"text":"versions/1.0.0/","startTime":285.2894736842105,"endTime":287.8421052631579,"audioSegment":0},{"text":"manifest.json                points at about.md","startTime":287.8421052631579,"endTime":290.39473684210526,"audioSegment":0},{"text":"about.md                     the role's working character","startTime":290.39473684210526,"endTime":292.94736842105266,"audioSegment":0},{"text":"craftbook-templates/my/my-app-review/ manifest.json","startTime":292.94736842105266,"endTime":295.5,"audioSegment":0},{"text":"versions/1.0.0/","startTime":295.5,"endTime":298.0526315789474,"audioSegment":0},{"text":"craftbook.json               the reusable craftbook document","startTime":298.0526315789474,"endTime":300.60526315789474,"audioSegment":0},{"text":"test.json                    its eval sidecar","startTime":300.60526315789474,"endTime":303.1578947368421,"audioSegment":0},{"text":"gezapp.json stays small on purpose — format: \"gezel-ai-app-source\",","startTime":303.1578947368421,"endTime":305.7105263157895,"audioSegment":0},{"text":"schemaVersion: 1, and optionally an entry pin and a publisher.","startTime":305.7105263157895,"endTime":308.2631578947369,"audioSegment":0},{"text":"The item list, per-item SHA-256 hashes, the external dependency lock, minGezelVersion,","startTime":308.2631578947369,"endTime":310.8157894736842,"audioSegment":0},{"text":"and timestamps are all derived from the tree by gezel app pack; writing them by hand is a validation error, not a convention.","startTime":310.8157894736842,"endTime":313.36842105263156,"audioSegment":0},{"text":"Scripts have two equal authoring forms.","startTime":313.36842105263156,"endTime":315.92105263157896,"audioSegment":0},{"text":"The version manifest's scripts map holds inline TypeScript strings — the form models author most reliably —","startTime":315.92105263157896,"endTime":318.4736842105263,"audioSegment":0},{"text":"and versions/<v>/scripts/<name>.ts holds the same scripts as real files, which people and typecheckers prefer.","startTime":318.4736842105263,"endTime":321.0263157894737,"audioSegment":0},{"text":"Pack folds sidecars into the map and drops the files, so the shipped app is byte-identical either way;","startTime":321.0263157894737,"endTime":323.57894736842104,"audioSegment":0},{"text":"defining one name in both forms is a validation error.","startTime":323.57894736842104,"endTime":326.13157894736844,"audioSegment":0},{"text":"Craftbooks also have two homes.","startTime":326.13157894736844,"endTime":328.6842105263158,"audioSegment":0},{"text":"A procedure private to this app lives embedded at versions/<v>/craftbooks/<id>.json —","startTime":328.6842105263158,"endTime":331.2368421052632,"audioSegment":0},{"text":"it ships inside the project type and appears in no catalog.","startTime":331.2368421052632,"endTime":333.7894736842105,"audioSegment":0},{"text":"A reusable procedure is its own craftbook-templates/ item with a craftbook.json and a test.json eval sidecar —","startTime":333.7894736842105,"endTime":336.3421052631579,"audioSegment":0},{"text":"or simply a reference to an existing recipe in the craftbook collection.","startTime":336.3421052631579,"endTime":338.89473684210526,"audioSegment":0},{"text":"The version manifest's craftbooks list references both by id,","startTime":338.89473684210526,"endTime":341.44736842105266,"audioSegment":0},{"text":"and an embedded document wins over a catalog item with the same id.","startTime":341.44736842105266,"endTime":344,"audioSegment":0},{"text":"Part What it contributes","startTime":344,"endTime":347.1111111111111,"audioSegment":0},{"text":"Project type Identity, version, setup params, project templates,","startTime":347.1111111111111,"endTime":350.22222222222223,"audioSegment":0},{"text":"crew roster, and references to every other part","startTime":350.22222222222223,"endTime":353.3333333333333,"audioSegment":0},{"text":"Role templates Each crew member's name, role, and about.md working character;","startTime":353.3333333333333,"endTime":356.44444444444446,"audioSegment":0},{"text":"one entry can be the crew lead (voorman: true), or a solo type presents its one crew member under a custom leadLabel.","startTime":356.44444444444446,"endTime":359.55555555555554,"audioSegment":0},{"text":"Browse the role collection before writing a new one","startTime":359.55555555555554,"endTime":362.6666666666667,"audioSegment":0},{"text":"Craftbooks Repeatable procedures installed into each project —","startTime":362.6666666666667,"endTime":365.77777777777777,"audioSegment":0},{"text":"embedded (type-private) or referenced catalog items","startTime":365.77777777777777,"endTime":368.8888888888889,"audioSegment":0},{"text":"Scripts and tools Capability-declared TypeScript run in Gezel's sandbox;","startTime":368.8888888888889,"endTime":372,"audioSegment":0},{"text":"a tools entry exposes a script as a schema-validated tool for the model or the page","startTime":372,"endTime":375.1111111111111,"audioSegment":0},{"text":"Output page A read-limited HTML/CSS/JS experience pinned into the project's Output tab","startTime":375.1111111111111,"endTime":378.22222222222223,"audioSegment":0},{"text":"Data Ordinary JSON, Markdown,","startTime":378.22222222222223,"endTime":381.3333333333333,"audioSegment":0},{"text":"and media files seeded into the workspace or artifacts","startTime":381.3333333333333,"endTime":384.44444444444446,"audioSegment":0},{"text":"Schedules Consent-gated scheduled or Night Shift craftbook runs","startTime":384.44444444444446,"endTime":387.55555555555554,"audioSegment":0},{"text":"Toolsets Catalog references for capabilities the project needs or suggests;","startTime":387.55555555555554,"endTime":390.6666666666667,"audioSegment":0},{"text":"toolset code is never embedded","startTime":390.6666666666667,"endTime":393.77777777777777,"audioSegment":0},{"text":"Nothing installs merely because Gezel detects a suitable project type: adoption is explicit, params render as a form and substitute into nameTemplate,","startTime":393.77777777777777,"endTime":396.8888888888889,"audioSegment":0},{"text":"the about/mission templates, and seed files, and toolsets and schedules remain subject to consent and security policy.","startTime":396.8888888888889,"endTime":400,"audioSegment":0},{"text":"Write a short brief with five decisions: what the person does, which files are authoritative,","startTime":400,"endTime":402.6222222222222,"audioSegment":0},{"text":"which actions change them, where judgment needs a model, and what successful completion looks like.","startTime":402.6222222222222,"endTime":405.24444444444447,"audioSegment":0},{"text":"Map each decision to an existing part of the platform:","startTime":405.24444444444447,"endTime":407.8666666666667,"audioSegment":0},{"text":"Requirement Put it here","startTime":407.8666666666667,"endTime":410.4888888888889,"audioSegment":0},{"text":"Show, search, filter,","startTime":410.4888888888889,"endTime":413.1111111111111,"audioSegment":0},{"text":"or chart existing content A type-owned page using the shared page APIs","startTime":413.1111111111111,"endTime":415.73333333333335,"audioSegment":0},{"text":"Store a record or calculate a deterministic result A capability-declared SDK script,","startTime":415.73333333333335,"endTime":418.35555555555555,"audioSegment":0},{"text":"exposed through a tool when needed","startTime":418.35555555555555,"endTime":420.97777777777776,"audioSegment":0},{"text":"Make a judgment, explain, research,","startTime":420.97777777777776,"endTime":423.6,"audioSegment":0},{"text":"or converse A focused crew role with the tools it actually needs","startTime":423.6,"endTime":426.22222222222223,"audioSegment":0},{"text":"Carry out a repeatable multi-step job A craftbook with clear inputs,","startTime":426.22222222222223,"endTime":428.84444444444443,"audioSegment":0},{"text":"step ownership, and completion gates","startTime":428.84444444444443,"endTime":431.4666666666667,"audioSegment":0},{"text":"Set up the experience The project type's params,","startTime":431.4666666666667,"endTime":434.0888888888889,"audioSegment":0},{"text":"about/mission, crew, scripts, seeds, and project defaults","startTime":434.0888888888889,"endTime":436.7111111111111,"audioSegment":0},{"text":"Describe the data contract explicitly: path, workspace or artifacts,","startTime":436.7111111111111,"endTime":439.3333333333333,"audioSegment":0},{"text":"schema, owner, who writes it, and how the page learns about changes.","startTime":439.3333333333333,"endTime":441.9555555555556,"audioSegment":0},{"text":"Keep the source definition separate from user data.","startTime":441.9555555555556,"endTime":444.5777777777778,"audioSegment":0},{"text":"A gallery's HTML belongs to the catalog type;","startTime":444.5777777777778,"endTime":447.2,"audioSegment":0},{"text":"photos belong to the selected workspace.","startTime":447.2,"endTime":449.8222222222222,"audioSegment":0},{"text":"A generated report belongs in artifacts.","startTime":449.8222222222222,"endTime":452.44444444444446,"audioSegment":0},{"text":"The page should not create a second source of truth in local storage.","startTime":452.44444444444446,"endTime":455.06666666666666,"audioSegment":0},{"text":"For a folder app such as Media Library or Data Analysis,","startTime":455.06666666666666,"endTime":457.68888888888887,"audioSegment":0},{"text":"declare a page with read access and no workspaceSeed. On desktop,","startTime":457.68888888888887,"endTime":460.31111111111113,"audioSegment":0},{"text":"New Project can attach an existing folder to a seedless type without copying or moving its originals.","startTime":460.31111111111113,"endTime":462.93333333333334,"audioSegment":0},{"text":"Typed creation accepts workingDir;","startTime":462.93333333333334,"endTime":465.55555555555554,"audioSegment":0},{"text":"types with workspace starter files use an internal workspace instead.","startTime":465.55555555555554,"endTime":468.1777777777778,"audioSegment":0},{"text":"This does not imply that CLI app apply is read-only: applying a stateful type can seed files in the folder you choose.","startTime":468.1777777777778,"endTime":470.8,"audioSegment":0},{"text":"Start a new type with the smallest version manifest that fits.","startTime":470.8,"endTime":473.4222222222222,"audioSegment":0},{"text":"For a read-only folder app, a composition can be this small;","startTime":473.4222222222222,"endTime":476.0444444444445,"audioSegment":0},{"text":"its identity manifest still lives one level above versions/: {","startTime":476.0444444444445,"endTime":478.6666666666667,"audioSegment":0},{"text":"\"schemaVersion\": 1,","startTime":478.6666666666667,"endTime":481.2888888888889,"audioSegment":0},{"text":"\"version\": \"1.0.0\",","startTime":481.2888888888889,"endTime":483.9111111111111,"audioSegment":0},{"text":"\"releasedAt\": \"2026-10-19T00:00:00Z\",","startTime":483.9111111111111,"endTime":486.5333333333333,"audioSegment":0},{"text":"\"aboutTemplate\": \"about.md\",","startTime":486.5333333333333,"endTime":489.15555555555557,"audioSegment":0},{"text":"\"missionTemplate\": \"mission.md\", \"pages\": {","startTime":489.15555555555557,"endTime":491.77777777777777,"audioSegment":0},{"text":"\"entry\": \"index.html\", \"api\": 1,","startTime":491.77777777777777,"endTime":494.4,"audioSegment":0},{"text":"\"reads\": [{ \"source\": \"workspace\", \"path\": \".\", \"subtree\": true }] } }","startTime":494.4,"endTime":497.02222222222224,"audioSegment":0},{"text":"Add params only for choices the person needs to make.","startTime":497.02222222222224,"endTime":499.64444444444445,"audioSegment":0},{"text":"nameTemplate, aboutTemplate, and missionTemplate describe the instance;","startTime":499.64444444444445,"endTime":502.26666666666665,"audioSegment":0},{"text":"they are not replacements for a role's character.","startTime":502.26666666666665,"endTime":504.8888888888889,"audioSegment":0},{"text":"tabVisibility can simplify supporting tabs, mode and leadLabel shape a solo experience,","startTime":504.8888888888889,"endTime":507.5111111111111,"audioSegment":0},{"text":"and meesterManaged controls progress check-ins.","startTime":507.5111111111111,"endTime":510.1333333333333,"audioSegment":0},{"text":"Set indexingEnabled: false only when the app does not need indexed search or tables.","startTime":510.1333333333333,"endTime":512.7555555555556,"audioSegment":0},{"text":"Omitting a default preserves the existing project choice;","startTime":512.7555555555556,"endTime":515.3777777777777,"audioSegment":0},{"text":"a declaration can change it during adoption.","startTime":515.3777777777777,"endTime":518,"audioSegment":0},{"text":"A custom role is a gezel-templates item with an identity manifest,","startTime":518,"endTime":521.1818181818181,"audioSegment":0},{"text":"a version manifest, and an about.md.","startTime":521.1818181818181,"endTime":524.3636363636364,"audioSegment":0},{"text":"Reference its template id in gezels[],","startTime":524.3636363636364,"endTime":527.5454545454545,"audioSegment":0},{"text":"marking the crew lead with voorman: true when appropriate.","startTime":527.5454545454545,"endTime":530.7272727272727,"audioSegment":0},{"text":"Reuse a suitable existing role before adding a new one.","startTime":530.7272727272727,"endTime":533.9090909090909,"audioSegment":0},{"text":"A role template defines expertise, temperament, working style,","startTime":533.9090909090909,"endTime":537.0909090909091,"audioSegment":0},{"text":"and boundaries; it does not define one person's project brief.","startTime":537.0909090909091,"endTime":540.2727272727273,"audioSegment":0},{"text":"Keep tool listings out of its prose because Gezel injects the actual available tools at runtime.","startTime":540.2727272727273,"endTime":543.4545454545455,"audioSegment":0},{"text":"A custom craftbook turns a job into a sequence that can be checked.","startTime":543.4545454545455,"endTime":546.6363636363636,"audioSegment":0},{"text":"Define its input parameters, a valid entryStepId, unique step ids,","startTime":546.6363636363636,"endTime":549.8181818181819,"audioSegment":0},{"text":"the role responsible for each step, concrete outputs, and success gates.","startTime":549.8181818181819,"endTime":553,"audioSegment":0},{"text":"Use a script for calculation or mechanical file manipulation and a model for judgment.","startTime":553,"endTime":556.1818181818181,"audioSegment":0},{"text":"Do not ask a model to reconstruct data already available to a script.","startTime":556.1818181818181,"endTime":559.3636363636364,"audioSegment":0},{"text":"Use {{task.dir}} for task-owned outputs instead of inventing global paths.","startTime":559.3636363636364,"endTime":562.5454545454545,"audioSegment":0},{"text":"See Plans, the script SDK,","startTime":562.5454545454545,"endTime":565.7272727272727,"audioSegment":0},{"text":"and the complete Reading Circle sample for a crew with both embedded and reusable craftbooks.","startTime":565.7272727272727,"endTime":568.9090909090909,"audioSegment":0},{"text":"Validate craftbook documents against schemas exported by the installed CLI rather than guessing step or gate fields.","startTime":568.9090909090909,"endTime":572.0909090909091,"audioSegment":0},{"text":"Reusable catalog craftbooks carry a test.json sidecar;","startTime":572.0909090909091,"endTime":575.2727272727273,"audioSegment":0},{"text":"that sidecar is not proof the workflow has run successfully.","startTime":575.2727272727273,"endTime":578.4545454545455,"audioSegment":0},{"text":"Exercise a representative task and its gates.","startTime":578.4545454545455,"endTime":581.6363636363636,"audioSegment":0},{"text":"Schedules reference the craftbook id and should make their consent behavior explicit;","startTime":581.6363636363636,"endTime":584.8181818181818,"audioSegment":0},{"text":"start with consent: \"ask\" for work the person has not yet enabled.","startTime":584.8181818181818,"endTime":588,"audioSegment":0},{"text":"The app composition is the same in both cases;","startTime":588,"endTime":591,"audioSegment":0},{"text":"the authoring and release loops differ.","startTime":591,"endTime":594,"audioSegment":0},{"text":"Target Source Check and use it","startTime":594,"endTime":597,"audioSegment":0},{"text":"Private, experimental, or portable app gezapp.json + items/ gezel app validate,","startTime":597,"endTime":600,"audioSegment":0},{"text":"pack, then install and apply against a test project","startTime":600,"endTime":603,"audioSegment":0},{"text":"Public Gilde app gilde/data/<kind>/<shard>/<id>/ Gilde's schema/content checks,","startTime":603,"endTime":606,"audioSegment":0},{"text":"page-demo checks, and local index build; then test with Gezel using that content root","startTime":606,"endTime":609,"audioSegment":0},{"text":"In the Gezel repository, public catalog content belongs in the sibling Gilde checkout,","startTime":609,"endTime":612,"audioSegment":0},{"text":"not in Gezel's old data/ tree or installed dependencies.","startTime":612,"endTime":615,"audioSegment":0},{"text":"GEZEL_GILDE_DATA_DIR can select the checkout's data/ directory for a development service.","startTime":615,"endTime":618,"audioSegment":0},{"text":"The normal application still uses its pinned catalog unless configured otherwise.","startTime":618,"endTime":621,"audioSegment":0},{"text":"A catalog change must be released and consumed before it appears in an ordinary installation.","startTime":621,"endTime":624,"audioSegment":0},{"text":"The private source packer folds script sidecars into the version manifest.","startTime":624,"endTime":627,"audioSegment":0},{"text":"That preprocessing is specific to the source-package path: when authoring Gilde directly,","startTime":627,"endTime":630,"audioSegment":0},{"text":"follow its released-payload conventions and validators.","startTime":630,"endTime":633,"audioSegment":0},{"text":"Never hand-edit a released version; add a new version.","startTime":633,"endTime":636,"audioSegment":0},{"text":"Exported hashes, dependency locks, and catalog-root indexes are generated, not authored.","startTime":636,"endTime":639,"audioSegment":0},{"text":"Each script declares its capabilities, inputs, outputs, and whether it is an action or gate through @bendyline/gezel-sdk;","startTime":639,"endTime":642.3,"audioSegment":0},{"text":"the Writing scripts with gezel-sdk article covers that contract.","startTime":642.3,"endTime":645.6,"audioSegment":0},{"text":"Adoption copies the scripts into the project with provenance.","startTime":645.6,"endTime":648.9,"audioSegment":0},{"text":"A tools entry gives a script a stable name, a JSON Schema inputs object validated before every run,","startTime":648.9,"endTime":652.2,"audioSegment":0},{"text":"and static bind values so several narrow tools can share one script without letting the caller replace the bound operation.","startTime":652.2,"endTime":655.5,"audioSegment":0},{"text":"A tool listed in pages.tools is page-only — kept off the model's roster —","startTime":655.5,"endTime":658.8,"audioSegment":0},{"text":"and can carry a reaction that summons a named crew member when the page invokes it, with the tool output interpolated into the reaction prompt.","startTime":658.8,"endTime":662.1,"audioSegment":0},{"text":"Design tools a small local model can use.","startTime":662.1,"endTime":665.4,"audioSegment":0},{"text":"These rules come from running app requests on Gemma 4 E4B and 12B,","startTime":665.4,"endTime":668.7,"audioSegment":0},{"text":"where each one fixed a request that otherwise failed:","startTime":668.7,"endTime":672,"audioSegment":0},{"text":"Give the status tool the whole picture a request needs.","startTime":672,"endTime":675.3,"audioSegment":0},{"text":"A meal planner whose status listed only the grocery gap could not plan \"around what we have\",","startTime":675.3,"endTime":678.6,"audioSegment":0},{"text":"because nothing said what was in stock.","startTime":678.6,"endTime":681.9,"audioSegment":0},{"text":"Include ids, owners, dates and totals, and lead with what changed.","startTime":681.9,"endTime":685.2,"audioSegment":0},{"text":"A state: true tool runs before each chat turn and the model often answers from its output without calling anything,","startTime":685.2,"endTime":688.5,"audioSegment":0},{"text":"literally: asked what was due in 60 days, it skipped a separate \"Overdue\" list.","startTime":688.5,"endTime":691.8,"audioSegment":0},{"text":"Put what a question selects in one list, most urgent first.","startTime":691.8,"endTime":695.1,"audioSegment":0},{"text":"Name people in an output field, don't just count them.","startTime":695.1,"endTime":698.4,"audioSegment":0},{"text":"Asked who still owed a dietary answer, a model read missingDietary: 2 beside a list that also held a guest who had not replied,","startTime":698.4,"endTime":701.7,"audioSegment":0},{"text":"decided he was one of the two, and could not name the other.","startTime":701.7,"endTime":705,"audioSegment":0},{"text":"A noDietaryAnswer field listing the names leaves nothing to infer.","startTime":705,"endTime":708.3,"audioSegment":0},{"text":"Say when to call a write tool.","startTime":708.3,"endTime":711.6,"audioSegment":0},{"text":"\"Call it as soon as the person mentions one,","startTime":711.6,"endTime":714.9,"audioSegment":0},{"text":"before you describe it\" stops a model that would otherwise describe a plan it never saved.","startTime":714.9,"endTime":718.2,"audioSegment":0},{"text":"Make adds idempotent on name.","startTime":718.2,"endTime":721.5,"audioSegment":0},{"text":"\"We ran out of olive oil\" often arrives as an add;","startTime":721.5,"endTime":724.8,"audioSegment":0},{"text":"update the existing record instead of creating a twin.","startTime":724.8,"endTime":728.1,"audioSegment":0},{"text":"Give relative changes their own input.","startTime":728.1,"endTime":731.4,"audioSegment":0},{"text":"Told that someone joined a party of four,","startTime":731.4,"endTime":734.7,"audioSegment":0},{"text":"a model replaced the party with one name.","startTime":734.7,"endTime":738,"audioSegment":0},{"text":"A joining input the script adds to the count removes the arithmetic from the model.","startTime":738,"endTime":741.3,"audioSegment":0},{"text":"Keep money in integer cents and dates as local YYYY-MM-DD,","startTime":741.3,"endTime":744.6,"audioSegment":0},{"text":"and roll a monthly date forward to the last day of a shorter month rather than into the next.","startTime":744.6,"endTime":747.9,"audioSegment":0},{"text":"Speak to the model in the units its inputs take.","startTime":747.9,"endTime":751.2,"audioSegment":0},{"text":"Store cents, but report dollars in tool outputs.","startTime":751.2,"endTime":754.5,"audioSegment":0},{"text":"After reading openValueCents in one result,","startTime":754.5,"endTime":757.8,"audioSegment":0},{"text":"a model passed valueChange: 340000 for \"another $3,400\" to an input that takes dollars, and a $22,500 deal became $362,500.","startTime":757.8,"endTime":761.1,"audioSegment":0},{"text":"The Output page runs in a sandbox and codes against the injected window.gezel API (typed definitions in @bendyline/gezel-sdk/page;","startTime":761.1,"endTime":764.4,"audioSegment":0},{"text":"set pages.api to 1).","startTime":764.4,"endTime":767.7,"audioSegment":0},{"text":"Every readable file must appear in pages.reads and every callable tool in pages.tools —","startTime":767.7,"endTime":771,"audioSegment":0},{"text":"there is deliberately no raw page write API, so state changes flow through declared tools and stay auditable:","startTime":771,"endTime":774.3,"audioSegment":0},{"text":"async function refresh() {","startTime":774.3,"endTime":777.6,"audioSegment":0},{"text":"render(await gezel.data.read('records.json', { as: 'json' })); }","startTime":777.6,"endTime":780.9,"audioSegment":0},{"text":"const stop = gezel.data.watch('records.json', () => { void refresh().catch(showError); });","startTime":780.9,"endTime":784.2,"audioSegment":0},{"text":"await refresh();","startTime":784.2,"endTime":787.5,"audioSegment":0},{"text":"const { output } = await gezel.tools.invoke('add_record', { title: 'First review' });","startTime":787.5,"endTime":790.8,"audioSegment":0},{"text":"window.addEventListener('pagehide', stop, { once: true });","startTime":790.8,"endTime":794.1,"audioSegment":0},{"text":"Here render and showError are your UI functions.","startTime":794.1,"endTime":797.4,"audioSegment":0},{"text":"A watch reports that a file changed;","startTime":797.4,"endTime":800.7,"audioSegment":0},{"text":"it does not pass the file contents to render.","startTime":800.7,"endTime":804,"audioSegment":0},{"text":"Use gezel.data.list() to discover files, data.url() for media,","startTime":804,"endTime":807.3,"audioSegment":0},{"text":"and data.open() to navigate to their existing Gezel renditions.","startTime":807.3,"endTime":810.6,"audioSegment":0},{"text":"Use gezel.tables.list/describe/query for permission-scoped summaries and charts over indexed data.","startTime":810.6,"endTime":813.9,"audioSegment":0},{"text":"These capabilities are shared infrastructure; keep them out of app-specific transports.","startTime":813.9,"endTime":817.2,"audioSegment":0},{"text":"See the page API guide for host differences and failure states.","startTime":817.2,"endTime":820.5,"audioSegment":0},{"text":"Pages inherit Gezel's local body/UI and heading fonts.","startTime":820.5,"endTime":823.8,"audioSegment":0},{"text":"They still define their own layout, color variables,","startTime":823.8,"endTime":827.1,"audioSegment":0},{"text":"control styles, and responsive behavior.","startTime":827.1,"endTime":830.4,"audioSegment":0},{"text":"Follow the page style guide,","startTime":830.4,"endTime":833.7,"audioSegment":0},{"text":"including both themes and system fallbacks for standalone demos.","startTime":833.7,"endTime":837,"audioSegment":0},{"text":"gezel app validate collects every finding at once, in layers: folder shape and portable paths, every manifest and craftbook parsed with the same schemas the runtime uses, the exact verification an install runs (hashes,","startTime":837,"endTime":841.8666666666667,"audioSegment":0},{"text":"reference closure, dependency locks), referenced files and craftbook step graphs, script diagnostics from the real TypeScript compiler, page syntax and theme checks, and offline dependency availability.","startTime":841.8666666666667,"endTime":846.7333333333333,"audioSegment":0},{"text":"Errors mean install or adoption would break; warnings are advisory.","startTime":846.7333333333333,"endTime":851.6,"audioSegment":0},{"text":"gezel app pack derives the manifest and produces the .gezapp —","startTime":851.6,"endTime":856.4666666666667,"audioSegment":0},{"text":"a renamed zip holding the root manifest and the items/ tree, with a SHA-256 digest per embedded item.","startTime":856.4666666666667,"endTime":861.3333333333334,"audioSegment":0},{"text":"Exactly one entry project type travels, along with every role and craftbook template it references; toolsets, connectors,","startTime":861.3333333333334,"endTime":866.2,"audioSegment":0},{"text":"and models stay outside as an exact-version dependency lock — models remain separate catalog choices (browse every model) and are never bundled into an app.","startTime":866.2,"endTime":871.0666666666666,"audioSegment":0},{"text":"Version 1 packages are explicitly unsigned — hashes detect corruption,","startTime":871.0666666666666,"endTime":875.9333333333333,"audioSegment":0},{"text":"not authorship, so install only from sources you trust.","startTime":875.9333333333333,"endTime":880.8,"audioSegment":0},{"text":"Installation is gezel app add: a first pass previews publisher, contents, compatibility, conflicts, and missing dependencies without writing anything;","startTime":880.8,"endTime":885.6666666666666,"audioSegment":0},{"text":"the confirmed pass installs atomically under ~/.gezel/ai-apps/, records a receipt, and mounts the app as one catalog source.","startTime":885.6666666666666,"endTime":890.5333333333333,"audioSegment":0},{"text":"Import never executes package contents,","startTime":890.5333333333333,"endTime":895.4,"audioSegment":0},{"text":"and gezel app list/show/enable/disable/remove/update manage the installed lifecycle.","startTime":895.4,"endTime":900.2666666666667,"audioSegment":0},{"text":"For public distribution, contribute the same items/ content to the Gilde repository —","startTime":900.2666666666667,"endTime":905.1333333333333,"audioSegment":0},{"text":"the catalog and a .gezapp share the layout, so a private app can graduate to the public collection without restructuring.","startTime":905.1333333333333,"endTime":910,"audioSegment":0},{"text":"An AI agent building an app should work the same loop a person does,","startTime":910,"endTime":912.953488372093,"audioSegment":0},{"text":"with the machine-readable ends of it:","startTime":912.953488372093,"endTime":915.9069767441861,"audioSegment":0},{"text":"gezel app schemas --out schemas (or --json) — the JSON Schemas for every catalog content file plus the packed and source gezapp manifests,","startTime":915.9069767441861,"endTime":918.8604651162791,"audioSegment":0},{"text":"rendered live from the running build so they can never be stale.","startTime":918.8604651162791,"endTime":921.8139534883721,"audioSegment":0},{"text":"gezel app validate <folder> --json — the findings list with stable rule ids;","startTime":921.8139534883721,"endTime":924.7674418604652,"audioSegment":0},{"text":"fix and re-run until ok is true, then pack.","startTime":924.7674418604652,"endTime":927.7209302325581,"audioSegment":0},{"text":"examples/apps — three complete source folders of graded complexity,","startTime":927.7209302325581,"endTime":930.6744186046511,"audioSegment":0},{"text":"each kept working against the real service by the repository's test suite.","startTime":930.6744186046511,"endTime":933.6279069767442,"audioSegment":0},{"text":"gezel app new —","startTime":933.6279069767442,"endTime":936.5813953488372,"audioSegment":0},{"text":"a guaranteed-valid starting shape when no sample is at hand.","startTime":936.5813953488372,"endTime":939.5348837209302,"audioSegment":0},{"text":"Use this brief when asking an LLM to build an app:","startTime":939.5348837209302,"endTime":942.4883720930233,"audioSegment":0},{"text":"Build a Gezel app for [person and task].","startTime":942.4883720930233,"endTime":945.4418604651163,"audioSegment":0},{"text":"Read Building AI Apps inside Gezel, Using the Gezel page APIs,","startTime":945.4418604651163,"endTime":948.3953488372093,"audioSegment":0},{"text":"and the Gezel app page style guide first.","startTime":948.3953488372093,"endTime":951.3488372093024,"audioSegment":0},{"text":"Choose public Gilde content or a private .gezapp source folder.","startTime":951.3488372093024,"endTime":954.3023255813954,"audioSegment":0},{"text":"State the user flow, authoritative files and schemas,","startTime":954.3023255813954,"endTime":957.2558139534883,"audioSegment":0},{"text":"read/write permissions, crew responsibilities, and completion criteria.","startTime":957.2558139534883,"endTime":960.2093023255813,"audioSegment":0},{"text":"Reuse existing APIs, roles, and craftbooks.","startTime":960.2093023255813,"endTime":963.1627906976744,"audioSegment":0},{"text":"Implement only the components this app needs.","startTime":963.1627906976744,"endTime":966.1162790697674,"audioSegment":0},{"text":"Use shared fonts and window.gezel, deterministic scripts for actions,","startTime":966.1162790697674,"endTime":969.0697674418604,"audioSegment":0},{"text":"and gated craftbooks for repeatable work.","startTime":969.0697674418604,"endTime":972.0232558139535,"audioSegment":0},{"text":"Include labeled standalone samples where required,","startTime":972.0232558139535,"endTime":974.9767441860465,"audioSegment":0},{"text":"but never use samples after a live failure.","startTime":974.9767441860465,"endTime":977.9302325581396,"audioSegment":0},{"text":"Validate against the installed schemas, test the main flow in a real host,","startTime":977.9302325581396,"endTime":980.8837209302326,"audioSegment":0},{"text":"and report supported modes, remaining limitations, and the release/install step needed to use it.","startTime":980.8837209302326,"endTime":983.8372093023256,"audioSegment":0},{"text":"Before handing over the app:","startTime":983.8372093023256,"endTime":986.7906976744187,"audioSegment":0},{"text":"Validate the source or Gilde payload,","startTime":986.7906976744187,"endTime":989.7441860465117,"audioSegment":0},{"text":"including every referenced role, craftbook, script, page, and seed.","startTime":989.7441860465117,"endTime":992.6976744186046,"audioSegment":0},{"text":"Keep generated and authored files distinct.","startTime":992.6976744186046,"endTime":995.6511627906976,"audioSegment":0},{"text":"Create or apply the app in an isolated test project.","startTime":995.6511627906976,"endTime":998.6046511627907,"audioSegment":0},{"text":"Verify the actual folder binding, permission denials, and every state-changing action.","startTime":998.6046511627907,"endTime":1001.5581395348837,"audioSegment":0},{"text":"A folder explorer must leave originals unchanged.","startTime":1001.5581395348837,"endTime":1004.5116279069767,"audioSegment":0},{"text":"Exercise the main craftbook with representative inputs and confirm its outputs and gates.","startTime":1004.5116279069767,"endTime":1007.4651162790698,"audioSegment":0},{"text":"Check disabled/consent-required schedules without silently arming them.","startTime":1007.4651162790698,"endTime":1010.4186046511628,"audioSegment":0},{"text":"Test the page's live and standalone flows, light/dark themes, keyboard navigation,","startTime":1010.4186046511628,"endTime":1013.3720930232558,"audioSegment":0},{"text":"narrow layout, empty content, unavailable capabilities, and failed actions.","startTime":1013.3720930232558,"endTime":1016.3255813953489,"audioSegment":0},{"text":"Dispose watches and media players.","startTime":1016.3255813953489,"endTime":1019.2790697674418,"audioSegment":0},{"text":"A page with a conversation gets a sample conversation for its demo;","startTime":1019.2790697674418,"endTime":1022.2325581395348,"audioSegment":0},{"text":"then ask the real crew lead the same suggestions on a small local model, so the demo never promises what the app cannot do.","startTime":1022.2325581395348,"endTime":1025.1860465116279,"audioSegment":0},{"text":"If upgrading, check user-modified content and seed drift.","startTime":1025.1860465116279,"endTime":1028.139534883721,"audioSegment":0},{"text":"Document any unsupported migration or reconciliation rather than overwriting it as a convenience.","startTime":1028.139534883721,"endTime":1031.093023255814,"audioSegment":0},{"text":"Report what shipped, what was tested, which host modes are supported,","startTime":1031.093023255814,"endTime":1034.046511627907,"audioSegment":0},{"text":"and whether the normal app consumes the new catalog version yet.","startTime":1034.046511627907,"endTime":1037,"audioSegment":0},{"text":"The authoring loop above is real,","startTime":1037,"endTime":1040.5555555555557,"audioSegment":0},{"text":"but the surrounding lifecycle still has gaps:","startTime":1040.5555555555557,"endTime":1044.111111111111,"audioSegment":0},{"text":"Gap What is needed","startTime":1044.111111111111,"endTime":1047.6666666666667,"audioSegment":0},{"text":"Project-to-app export Export packages the catalog definition; a diff-and-review flow that turns organic project changes (edited scripts,","startTime":1047.6666666666667,"endTime":1051.2222222222222,"audioSegment":0},{"text":"new craftbooks, a redesigned page) into a new version does not exist yet","startTime":1051.2222222222222,"endTime":1054.7777777777778,"audioSegment":0},{"text":"Import interface The desktop app still routes import through project artifacts and model tools;","startTime":1054.7777777777778,"endTime":1058.3333333333333,"audioSegment":0},{"text":"file picking, bundle review, and conflict handling belong in the UI the way the CLI already has them","startTime":1058.3333333333333,"endTime":1061.888888888889,"audioSegment":0},{"text":"Updates and drift gezel app status reports per-seed drift and apply preserves user-modified seeds,","startTime":1061.888888888889,"endTime":1065.4444444444443,"audioSegment":0},{"text":"but scripts still overwrite on upgrade and there is no three-way reconcile view","startTime":1065.4444444444443,"endTime":1069,"audioSegment":0},{"text":"Schema evolution App data-version declarations, migrations, backup, and rollback for custom records","startTime":1069,"endTime":1072.5555555555557,"audioSegment":0},{"text":"Dashboard surface First-class page templates, an in-app development preview,","startTime":1072.5555555555557,"endTime":1076.111111111111,"audioSegment":0},{"text":"diagnostics, and possibly more than one app-owned project tab","startTime":1076.111111111111,"endTime":1079.6666666666667,"audioSegment":0},{"text":"Craftbook test harness test.json sidecars are validated at authoring time,","startTime":1079.6666666666667,"endTime":1083.2222222222222,"audioSegment":0},{"text":"but the eval harness does not yet run an installed app's craftbook tests","startTime":1083.2222222222222,"endTime":1086.7777777777778,"audioSegment":0},{"text":"Signing and registries v1 signature status is unsigned;","startTime":1086.7777777777778,"endTime":1090.3333333333333,"audioSegment":0},{"text":"a signing story and a private registry path alongside public Gilde contributions","startTime":1090.3333333333333,"endTime":1093.888888888889,"audioSegment":0},{"text":"Until those close, treat the source folder as the canonical form of an AI App: Gilde for public distribution,","startTime":1093.888888888889,"endTime":1097.4444444444443,"audioSegment":0},{"text":".gezapp for controlled sharing, and ordinary projects for prototypes whose composition is still changing.","startTime":1097.4444444444443,"endTime":1101,"audioSegment":0}],"version":1},"startBlock":{"title":"Building AI Apps inside Gezel","subtitle":"File-oriented apps should reuse the shared file card and file adder. Use explicit pages.imports destinations for uploads, alongside pages.reads for browsing. The components work with plain HTML, inherit shared typography, and include an in-memory standalone demo adapter. Test both demo and embedded flows, including write denial, partial failures and resetting demo state.","ambientMotion":"zoomIn"}}</script>
