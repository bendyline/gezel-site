5},"end":{"line":120,"column":81,"offset":11335}}}],"position":{"start":{"line":117,"column":1,"offset":10709},"end":{"line":120,"column":81,"offset":11335}}}]},{"id":"what-still-needs-improvement","startTime":453,"duration":64,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"What still needs improvement","position":{"start":{"line":122,"column":4,"offset":11340},"end":{"line":122,"column":32,"offset":11368}}}],"position":{"start":{"line":122,"column":1,"offset":11337},"end":{"line":122,"column":32,"offset":11368}}},"title":"What still needs improvement","contents":[{"type":"paragraph","children":[{"type":"text","value":"The authoring loop above is real, but the surrounding lifecycle still has gaps:","position":{"start":{"line":124,"column":1,"offset":11370},"end":{"line":124,"column":80,"offset":11449}}}],"position":{"start":{"line":124,"column":1,"offset":11370},"end":{"line":124,"column":80,"offset":11449}}},{"type":"table","align":[null,null],"children":[{"type":"tableRow","children":[{"type":"tableCell","isHeader":true,"children":[{"type":"text","value":"Gap","position":{"start":{"line":126,"column":3,"offset":11453},"end":{"line":126,"column":6,"offset":11456}}}],"position":{"start":{"line":126,"column":1,"offset":11451},"end":{"line":126,"column":7,"offset":11457}}},{"type":"tableCell","isHeader":true,"children":[{"type":"text","value":"What is needed","position":{"start":{"line":126,"column":9,"offset":11459},"end":{"line":126,"column":23,"offset":11473}}}],"position":{"start":{"line":126,"column":7,"offset":11457},"end":{"line":126,"column":25,"offset":11475}}}],"position":{"start":{"line":126,"column":1,"offset":11451},"end":{"line":126,"column":25,"offset":11475}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Project-to-app export","position":{"start":{"line":128,"column":3,"offset":11492},"end":{"line":128,"column":24,"offset":11513}}}],"position":{"start":{"line":128,"column":1,"offset":11490},"end":{"line":128,"column":25,"offset":11514}}},{"type":"tableCell","children":[{"type":"text","value":"Export packages the catalog definition; a diff-and-review flow that turns organic project changes (edited scripts, new craftbooks, a redesigned page) into a new version does not exist yet","position":{"start":{"line":128,"column":27,"offset":11516},"end":{"line":128,"column":214,"offset":11703}}}],"position":{"start":{"line":128,"column":25,"offset":11514},"end":{"line":128,"column":216,"offset":11705}}}],"position":{"start":{"line":128,"column":1,"offset":11490},"end":{"line":128,"column":216,"offset":11705}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Import interface","position":{"start":{"line":129,"column":3,"offset":11708},"end":{"line":129,"column":19,"offset":11724}}}],"position":{"start":{"line":129,"column":1,"offset":11706},"end":{"line":129,"column":20,"offset":11725}}},{"type":"tableCell","children":[{"type":"text","value":"The desktop app still routes import through project artifacts and gezel tools; file picking, bundle review, and conflict handling belong in the UI the way the CLI already has them","position":{"start":{"line":129,"column":22,"offset":11727},"end":{"line":129,"column":201,"offset":11906}}}],"position":{"start":{"line":129,"column":20,"offset":11725},"end":{"line":129,"column":203,"offset":11908}}}],"position":{"start":{"line":129,"column":1,"offset":11706},"end":{"line":129,"column":203,"offset":11908}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Updates and drift","position":{"start":{"line":130,"column":3,"offset":11911},"end":{"line":130,"column":20,"offset":11928}}}],"position":{"start":{"line":130,"column":1,"offset":11909},"end":{"line":130,"column":21,"offset":11929}}},{"type":"tableCell","children":[{"type":"inlineCode","value":"gezel app status","position":{"start":{"line":130,"column":23,"offset":11931},"end":{"line":130,"column":41,"offset":11949}}},{"type":"text","value":" reports per-seed drift and ","position":{"start":{"line":130,"column":41,"offset":11949},"end":{"line":130,"column":69,"offset":11977}}},{"type":"inlineCode","value":"apply","position":{"start":{"line":130,"column":69,"offset":11977},"end":{"line":130,"column":76,"offset":11984}}},{"type":"text","value":" preserves user-modified seeds, but scripts still overwrite on upgrade and there is no three-way reconcile view","position":{"start":{"line":130,"column":76,"offset":11984},"end":{"line":130,"column":187,"offset":12095}}}],"position":{"start":{"line":130,"column":21,"offset":11929},"end":{"line":130,"column":189,"offset":12097}}}],"position":{"start":{"line":130,"column":1,"offset":11909},"end":{"line":130,"column":189,"offset":12097}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Schema evolution","position":{"start":{"line":131,"column":3,"offset":12100},"end":{"line":131,"column":19,"offset":12116}}}],"position":{"start":{"line":131,"column":1,"offset":12098},"end":{"line":131,"column":20,"offset":12117}}},{"type":"tableCell","children":[{"type":"text","value":"App data-version declarations, migrations, backup, and rollback for custom records","position":{"start":{"line":131,"column":22,"offset":12119},"end":{"line":131,"column":104,"offset":12201}}}],"position":{"start":{"line":131,"column":20,"offset":12117},"end":{"line":131,"column":106,"offset":12203}}}],"position":{"start":{"line":131,"column":1,"offset":12098},"end":{"line":131,"column":106,"offset":12203}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Dashboard surface","position":{"start":{"line":132,"column":3,"offset":12206},"end":{"line":132,"column":20,"offset":12223}}}],"position":{"start":{"line":132,"column":1,"offset":12204},"end":{"line":132,"column":21,"offset":12224}}},{"type":"tableCell","children":[{"type":"text","value":"First-class page templates, an in-app development preview, diagnostics, and possibly more than one app-owned project tab","position":{"start":{"line":132,"column":23,"offset":12226},"end":{"line":132,"column":143,"offset":12346}}}],"position":{"start":{"line":132,"column":21,"offset":12224},"end":{"line":132,"column":145,"offset":12348}}}],"position":{"start":{"line":132,"column":1,"offset":12204},"end":{"line":132,"column":145,"offset":12348}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Craftbook test harness","position":{"start":{"line":133,"column":3,"offset":12351},"end":{"line":133,"column":25,"offset":12373}}}],"position":{"start":{"line":133,"column":1,"offset":12349},"end":{"line":133,"column":26,"offset":12374}}},{"type":"tableCell","children":[{"type":"inlineCode","value":"test.json","position":{"start":{"line":133,"column":28,"offset":12376},"end":{"line":133,"column":39,"offset":12387}}},{"type":"text","value":" sidecars are validated at authoring time, but the eval harness does not yet run an installed app's craftbook tests","position":{"start":{"line":133,"column":39,"offset":12387},"end":{"line":133,"column":154,"offset":12502}}}],"position":{"start":{"line":133,"column":26,"offset":12374},"end":{"line":133,"column":156,"offset":12504}}}],"position":{"start":{"line":133,"column":1,"offset":12349},"end":{"line":133,"column":156,"offset":12504}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Signing and registries","position":{"start":{"line":134,"column":3,"offset":12507},"end":{"line":134,"column":25,"offset":12529}}}],"position":{"start":{"line":134,"column":1,"offset":12505},"end":{"line":134,"column":26,"offset":12530}}},{"type":"tableCell","children":[{"type":"text","value":"v1 signature status is ","position":{"start":{"line":134,"column":28,"offset":12532},"end":{"line":134,"column":51,"offset":12555}}},{"type":"inlineCode","value":"unsigned","position":{"start":{"line":134,"column":51,"offset":12555},"end":{"line":134,"column":61,"offset":12565}}},{"type":"text","value":"; a signing story and a private registry path alongside public Gilde contributions","position":{"start":{"line":134,"column":61,"offset":12565},"end":{"line":134,"column":143,"offset":12647}}}],"position":{"start":{"line":134,"column":26,"offset":12530},"end":{"line":134,"column":145,"offset":12649}}}],"position":{"start":{"line":134,"column":1,"offset":12505},"end":{"line":134,"column":145,"offset":12649}}}],"position":{"start":{"line":126,"column":1,"offset":11451},"end":{"line":134,"column":145,"offset":12649}}},{"type":"paragraph","children":[{"type":"text","value":"Until those close, treat the source folder as the canonical form of an AI App: Gilde for public distribution, ","position":{"start":{"line":136,"column":1,"offset":12651},"end":{"line":136,"column":111,"offset":12761}}},{"type":"inlineCode","value":".gezapp","position":{"start":{"line":136,"column":111,"offset":12761},"end":{"line":136,"column":120,"offset":12770}}},{"type":"text","value":" for controlled sharing, and ordinary projects for prototypes whose composition is still changing.","position":{"start":{"line":136,"column":120,"offset":12770},"end":{"line":136,"column":218,"offset":12868}}}],"position":{"start":{"line":136,"column":1,"offset":12651},"end":{"line":136,"column":218,"offset":12868}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"An AI App is a reusable experience that runs inside Gezel: a tailored project,","startTime":0,"endTime":3.5833333333333335,"audioSegment":0},{"text":"a purpose-built crew, repeatable craftbooks, scripts, data, and an optional interactive dashboard.","startTime":3.5833333333333335,"endTime":7.166666666666667,"audioSegment":0},{"text":"A language trainer, research room, board game,","startTime":7.166666666666667,"endTime":10.75,"audioSegment":0},{"text":"or client-service workspace can all use the same underlying pieces while feeling like a distinct application.","startTime":10.75,"endTime":14.333333333333334,"audioSegment":0},{"text":"The project type is the composition root and installer.","startTime":14.333333333333334,"endTime":17.916666666666668,"audioSegment":0},{"text":"Public AI Apps arrive through the project-type collection;","startTime":17.916666666666668,"endTime":21.5,"audioSegment":0},{"text":"private or experimental apps travel as .gezapp packages.","startTime":21.5,"endTime":25.083333333333336,"audioSegment":0},{"text":"Both start life as the same thing: a source folder you can build with the command line,","startTime":25.083333333333336,"endTime":28.666666666666668,"audioSegment":0},{"text":"by hand, or with an AI agent — this article is the guide to that folder.","startTime":28.666666666666668,"endTime":32.25,"audioSegment":0},{"text":"An AI App is different from a connected app.","startTime":32.25,"endTime":35.833333333333336,"audioSegment":0},{"text":"A connected app runs in its own process and interface and reaches Gezel through @bendyline/gezel-app-sdk.","startTime":35.833333333333336,"endTime":39.41666666666667,"audioSegment":0},{"text":"See Building connected apps with gezel-app-sdk when that is what you are building.","startTime":39.41666666666667,"endTime":43,"audioSegment":0},{"text":"The command line owns the whole loop — scaffold, edit, validate,","startTime":43,"endTime":46.05555555555556,"audioSegment":0},{"text":"pack, install, apply — and none of it needs the service running:","startTime":46.05555555555556,"endTime":49.111111111111114,"audioSegment":0},{"text":"gezel app new my-app --with-page     # a complete, working source folder cd my-app","startTime":49.111111111111114,"endTime":52.166666666666664,"audioSegment":0},{"text":"# edit items/ —","startTime":52.166666666666664,"endTime":55.22222222222222,"audioSegment":0},{"text":"the role's about.md and the version manifest are the heart","startTime":55.22222222222222,"endTime":58.27777777777778,"audioSegment":0},{"text":"gezel app validate .","startTime":58.27777777777778,"endTime":61.33333333333333,"audioSegment":0},{"text":"# every finding at once; --json for tooling","startTime":61.33333333333333,"endTime":64.38888888888889,"audioSegment":0},{"text":"gezel app pack .","startTime":64.38888888888889,"endTime":67.44444444444444,"audioSegment":0},{"text":"# -> my-app-1.0.0.gezapp","startTime":67.44444444444444,"endTime":70.5,"audioSegment":0},{"text":"gezel app add my-app-1.0.0.gezapp --yes","startTime":70.5,"endTime":73.55555555555556,"audioSegment":0},{"text":"cd ~/the/folder/for/it && gezel app apply my-app","startTime":73.55555555555556,"endTime":76.61111111111111,"audioSegment":0},{"text":"apply outfits the current folder as a project: it creates the crew from the embedded role templates,","startTime":76.61111111111111,"endTime":79.66666666666666,"audioSegment":0},{"text":"installs craftbooks and scripts, seeds the data files, and pins the Output page.","startTime":79.66666666666666,"endTime":82.72222222222223,"audioSegment":0},{"text":"From there, iterate — edit the source, validate, pack, add (an upgrade), and apply --refresh;","startTime":82.72222222222223,"endTime":85.77777777777777,"audioSegment":0},{"text":"gezel app status reports seed drift, and gezel app serve shares the finished page (and optional visitor chat) as a mini-site.","startTime":85.77777777777777,"endTime":88.83333333333333,"audioSegment":0},{"text":"Three worked samples of graded size live in examples/apps — example-journal (the minimal shape),","startTime":88.83333333333333,"endTime":91.88888888888889,"audioSegment":0},{"text":"example-habit-tracker (state, tools, a live page), and example-reading-circle (a crew, craftbooks, schedules, dependencies).","startTime":91.88888888888889,"endTime":94.94444444444444,"audioSegment":0},{"text":"Copying the smallest one that fits beats starting empty.","startTime":94.94444444444444,"endTime":98,"audioSegment":0},{"text":"The other on-ramp is to prototype the experience as an ordinary project first: settle the crew roles in conversation,","startTime":98,"endTime":102.83333333333333,"audioSegment":0},{"text":"work through each craftbook, run the scripts by hand, and decide which files are durable state versus generated artifacts.","startTime":102.83333333333333,"endTime":107.66666666666667,"audioSegment":0},{"text":"When the composition feels right,","startTime":107.66666666666667,"endTime":112.5,"audioSegment":0},{"text":"ask a gezel with the project-management tools to export the type applied to that project.","startTime":112.5,"endTime":117.33333333333333,"audioSegment":0},{"text":"Gezel writes a .gezapp into the project artifacts — and a .gezapp is a renamed zip of exactly the source layout below,","startTime":117.33333333333333,"endTime":122.16666666666666,"audioSegment":0},{"text":"so unzip it, drop in a small gezapp.json, and keep iterating with validate and pack.","startTime":122.16666666666666,"endTime":127,"audioSegment":0},{"text":"A source folder is a gezapp.json beside an items/ tree.","startTime":127,"endTime":129.55263157894737,"audioSegment":0},{"text":"The tree is the same layout the packed archive and the installed app use (items sharded by the first two characters of their id,","startTime":129.55263157894737,"endTime":132.10526315789474,"audioSegment":0},{"text":"identity separate from versioned content), which is why exports round-trip: my-app/","startTime":132.10526315789474,"endTime":134.6578947368421,"audioSegment":0},{"text":"gezapp.json                        the source manifest — small on purpose items/","startTime":134.6578947368421,"endTime":137.21052631578948,"audioSegment":0},{"text":"project-types/my/my-app/","startTime":137.21052631578948,"endTime":139.76315789473685,"audioSegment":0},{"text":"manifest.json                  identity: id, name, description, maintainer","startTime":139.76315789473685,"endTime":142.31578947368422,"audioSegment":0},{"text":"versions/1.0.0/","startTime":142.31578947368422,"endTime":144.8684210526316,"audioSegment":0},{"text":"manifest.json                the composition root (everything below hangs off it)","startTime":144.8684210526316,"endTime":147.42105263157896,"audioSegment":0},{"text":"about.md                     param-templated project context mission.md","startTime":147.42105263157896,"endTime":149.97368421052633,"audioSegment":0},{"text":"records.json                 seed data (workspaceSeed) scripts/","startTime":149.97368421052633,"endTime":152.5263157894737,"audioSegment":0},{"text":"record-store.ts            sidecar script — folded inline at pack craftbooks/","startTime":152.5263157894737,"endTime":155.07894736842104,"audioSegment":0},{"text":"review-records.json        type-private craftbook document pages/","startTime":155.07894736842104,"endTime":157.63157894736844,"audioSegment":0},{"text":"dashboard/index.html       the Output page","startTime":157.63157894736844,"endTime":160.18421052631578,"audioSegment":0},{"text":"gezel-templates/my/my-app-lead/","startTime":160.18421052631578,"endTime":162.73684210526315,"audioSegment":0},{"text":"manifest.json                  role identity (kind, id, name, role)","startTime":162.73684210526315,"endTime":165.28947368421052,"audioSegment":0},{"text":"versions/1.0.0/","startTime":165.28947368421052,"endTime":167.8421052631579,"audioSegment":0},{"text":"manifest.json                points at about.md","startTime":167.8421052631579,"endTime":170.39473684210526,"audioSegment":0},{"text":"about.md                     the role's working character","startTime":170.39473684210526,"endTime":172.94736842105263,"audioSegment":0},{"text":"craftbook-templates/my/my-app-review/ manifest.json","startTime":172.94736842105263,"endTime":175.5,"audioSegment":0},{"text":"versions/1.0.0/","startTime":175.5,"endTime":178.05263157894737,"audioSegment":0},{"text":"craftbook.json               the reusable craftbook document","startTime":178.05263157894737,"endTime":180.60526315789474,"audioSegment":0},{"text":"test.json                    its eval sidecar","startTime":180.60526315789474,"endTime":183.1578947368421,"audioSegment":0},{"text":"gezapp.json stays small on purpose — format: \"gezel-ai-app-source\",","startTime":183.1578947368421,"endTime":185.71052631578948,"audioSegment":0},{"text":"schemaVersion: 1, and optionally an entry pin and a publisher.","startTime":185.71052631578948,"endTime":188.26315789473685,"audioSegment":0},{"text":"The item list, per-item SHA-256 hashes, the external dependency lock, minGezelVersion,","startTime":188.26315789473685,"endTime":190.81578947368422,"audioSegment":0},{"text":"and timestamps are all derived from the tree by gezel app pack; writing them by hand is a validation error, not a convention.","startTime":190.81578947368422,"endTime":193.3684210526316,"audioSegment":0},{"text":"Scripts have two equal authoring forms.","startTime":193.3684210526316,"endTime":195.92105263157896,"audioSegment":0},{"text":"The version manifest's scripts map holds inline TypeScript strings — the form models author most reliably —","startTime":195.92105263157896,"endTime":198.4736842105263,"audioSegment":0},{"text":"and versions/<v>/scripts/<name>.ts holds the same scripts as real files, which people and typecheckers prefer.","startTime":198.4736842105263,"endTime":201.0263157894737,"audioSegment":0},{"text":"Pack folds sidecars into the map and drops the files, so the shipped app is byte-identical either way;","startTime":201.0263157894737,"endTime":203.57894736842104,"audioSegment":0},{"text":"defining one name in both forms is a validation error.","startTime":203.57894736842104,"endTime":206.13157894736844,"audioSegment":0},{"text":"Craftbooks also have two homes.","startTime":206.13157894736844,"endTime":208.68421052631578,"audioSegment":0},{"text":"A procedure private to this app lives embedded at versions/<v>/craftbooks/<id>.json —","startTime":208.68421052631578,"endTime":211.23684210526318,"audioSegment":0},{"text":"it ships inside the project type and appears in no catalog.","startTime":211.23684210526318,"endTime":213.78947368421052,"audioSegment":0},{"text":"A reusable procedure is its own craftbook-templates/ item with a craftbook.json and a test.json eval sidecar —","startTime":213.78947368421052,"endTime":216.34210526315792,"audioSegment":0},{"text":"or simply a reference to an existing recipe in the craftbook collection.","startTime":216.34210526315792,"endTime":218.89473684210526,"audioSegment":0},{"text":"The version manifest's craftbooks list references both by id,","startTime":218.89473684210526,"endTime":221.44736842105266,"audioSegment":0},{"text":"and an embedded document wins over a catalog item with the same id.","startTime":221.44736842105266,"endTime":224,"audioSegment":0},{"text":"Part What it contributes","startTime":224,"endTime":227.11111111111111,"audioSegment":0},{"text":"Project type Identity, version, setup params, project templates,","startTime":227.11111111111111,"endTime":230.22222222222223,"audioSegment":0},{"text":"crew roster, and references to every other part","startTime":230.22222222222223,"endTime":233.33333333333334,"audioSegment":0},{"text":"Gezel role templates Each crew member's name, role, and about.md working character;","startTime":233.33333333333334,"endTime":236.44444444444446,"audioSegment":0},{"text":"one entry can be the voorman, or a solo type presents its one gezel under a custom leadLabel.","startTime":236.44444444444446,"endTime":239.55555555555554,"audioSegment":0},{"text":"Browse the role collection before writing a new one","startTime":239.55555555555554,"endTime":242.66666666666666,"audioSegment":0},{"text":"Craftbooks Repeatable procedures installed into each project —","startTime":242.66666666666666,"endTime":245.77777777777777,"audioSegment":0},{"text":"embedded (type-private) or referenced catalog items","startTime":245.77777777777777,"endTime":248.88888888888889,"audioSegment":0},{"text":"Scripts and tools Capability-declared TypeScript run in Gezel's sandbox;","startTime":248.88888888888889,"endTime":252,"audioSegment":0},{"text":"a tools entry exposes a script as a schema-validated tool for a gezel or the page","startTime":252,"endTime":255.11111111111111,"audioSegment":0},{"text":"Output page A read-limited HTML/CSS/JS experience pinned into the project's Output tab","startTime":255.11111111111111,"endTime":258.22222222222223,"audioSegment":0},{"text":"Data Ordinary JSON, Markdown,","startTime":258.22222222222223,"endTime":261.3333333333333,"audioSegment":0},{"text":"and media files seeded into the workspace or artifacts","startTime":261.3333333333333,"endTime":264.44444444444446,"audioSegment":0},{"text":"Schedules Consent-gated scheduled or Night Shift craftbook runs","startTime":264.44444444444446,"endTime":267.55555555555554,"audioSegment":0},{"text":"Toolsets Catalog references for capabilities the project needs or suggests;","startTime":267.55555555555554,"endTime":270.6666666666667,"audioSegment":0},{"text":"toolset code is never embedded","startTime":270.6666666666667,"endTime":273.77777777777777,"audioSegment":0},{"text":"Nothing installs merely because Gezel detects a suitable project type: adoption is explicit, params render as a form and substitute into nameTemplate,","startTime":273.77777777777777,"endTime":276.8888888888889,"audioSegment":0},{"text":"the about/mission templates, and seed files, and toolsets and schedules remain subject to consent and security policy.","startTime":276.8888888888889,"endTime":280,"audioSegment":0},{"text":"Each script declares its capabilities, inputs, outputs, and whether it is an action or gate through @bendyline/gezel-sdk;","startTime":280,"endTime":284.125,"audioSegment":0},{"text":"the Writing scripts with gezel-sdk article covers that contract.","startTime":284.125,"endTime":288.25,"audioSegment":0},{"text":"Adoption copies the scripts into the project with provenance.","startTime":288.25,"endTime":292.375,"audioSegment":0},{"text":"A tools entry gives a script a stable name, a JSON Schema inputs object validated before every run,","startTime":292.375,"endTime":296.5,"audioSegment":0},{"text":"and static bind values so several narrow tools can share one script without letting the caller replace the bound operation.","startTime":296.5,"endTime":300.625,"audioSegment":0},{"text":"A tool listed in pages.tools is page-only — kept off the model's roster —","startTime":300.625,"endTime":304.75,"audioSegment":0},{"text":"and can carry a reaction that summons a named gezel when the page invokes it, with the tool output interpolated into the reaction prompt.","startTime":304.75,"endTime":308.875,"audioSegment":0},{"text":"The Output page runs in a sandbox and codes against the injected window.gezel API (typed definitions in @bendyline/gezel-sdk/page;","startTime":308.875,"endTime":313,"audioSegment":0},{"text":"set pages.api to 1).","startTime":313,"endTime":317.125,"audioSegment":0},{"text":"Every readable file must appear in pages.reads and every callable tool in pages.tools —","startTime":317.125,"endTime":321.25,"audioSegment":0},{"text":"there is deliberately no raw page write API, so state changes flow through declared tools and stay auditable:","startTime":321.25,"endTime":325.375,"audioSegment":0},{"text":"const records = await gezel.data.read('records.json', { as: 'json' });","startTime":325.375,"endTime":329.5,"audioSegment":0},{"text":"gezel.data.watch('records.json', render);","startTime":329.5,"endTime":333.625,"audioSegment":0},{"text":"const { output } = await gezel.tools.invoke('add_record', { title: 'First review' });","startTime":333.625,"endTime":337.75,"audioSegment":0},{"text":"Pages must work in both themes: declare color-scheme: light dark, drive colors through variables,","startTime":337.75,"endTime":341.875,"audioSegment":0},{"text":"and override them in an @media (prefers-color-scheme: dark) block — the validator warns when a page hardcodes light colors.","startTime":341.875,"endTime":346,"audioSegment":0},{"text":"gezel app validate collects every finding at once, in layers: folder shape and portable paths, every manifest and craftbook parsed with the same schemas the runtime uses, the exact verification an install runs (hashes,","startTime":346,"endTime":350.8666666666667,"audioSegment":0},{"text":"reference closure, dependency locks), referenced files and craftbook step graphs, script diagnostics from the real TypeScript compiler, page syntax and theme checks, and offline dependency availability.","startTime":350.8666666666667,"endTime":355.73333333333335,"audioSegment":0},{"text":"Errors mean install or adoption would break; warnings are advisory.","startTime":355.73333333333335,"endTime":360.6,"audioSegment":0},{"text":"gezel app pack derives the manifest and produces the .gezapp —","startTime":360.6,"endTime":365.46666666666664,"audioSegment":0},{"text":"a renamed zip holding the root manifest and the items/ tree, with a SHA-256 digest per embedded item.","startTime":365.46666666666664,"endTime":370.3333333333333,"audioSegment":0},{"text":"Exactly one entry project type travels, along with every role and craftbook template it references; toolsets, connectors,","startTime":370.3333333333333,"endTime":375.2,"audioSegment":0},{"text":"and models stay outside as an exact-version dependency lock — models remain separate catalog choices (browse every model) and are never bundled into an app.","startTime":375.2,"endTime":380.06666666666666,"audioSegment":0},{"text":"Version 1 packages are explicitly unsigned — hashes detect corruption,","startTime":380.06666666666666,"endTime":384.93333333333334,"audioSegment":0},{"text":"not authorship, so install only from sources you trust.","startTime":384.93333333333334,"endTime":389.8,"audioSegment":0},{"text":"Installation is gezel app add: a first pass previews publisher, contents, compatibility, conflicts, and missing dependencies without writing anything;","startTime":389.8,"endTime":394.6666666666667,"audioSegment":0},{"text":"the confirmed pass installs atomically under ~/.gezel/ai-apps/, records a receipt, and mounts the app as one catalog source.","startTime":394.6666666666667,"endTime":399.5333333333333,"audioSegment":0},{"text":"Import never executes package contents,","startTime":399.5333333333333,"endTime":404.4,"audioSegment":0},{"text":"and gezel app list/show/enable/disable/remove/update manage the installed lifecycle.","startTime":404.4,"endTime":409.26666666666665,"audioSegment":0},{"text":"For public distribution, contribute the same items/ content to the Gilde repository —","startTime":409.26666666666665,"endTime":414.1333333333333,"audioSegment":0},{"text":"the catalog and a .gezapp share the layout, so a private app can graduate to the public collection without restructuring.","startTime":414.1333333333333,"endTime":419,"audioSegment":0},{"text":"An AI agent building an app should work the same loop a person does,","startTime":419,"endTime":422.4,"audioSegment":0},{"text":"with the machine-readable ends of it:","startTime":422.4,"endTime":425.8,"audioSegment":0},{"text":"gezel app schemas --out schemas (or --json) — the JSON Schemas for every catalog content file plus the packed and source gezapp manifests,","startTime":425.8,"endTime":429.2,"audioSegment":0},{"text":"rendered live from the running build so they can never be stale.","startTime":429.2,"endTime":432.6,"audioSegment":0},{"text":"gezel app validate <folder> --json — the findings list with stable rule ids;","startTime":432.6,"endTime":436,"audioSegment":0},{"text":"fix and re-run until ok is true, then pack.","startTime":436,"endTime":439.4,"audioSegment":0},{"text":"examples/apps — three complete source folders of graded complexity,","startTime":439.4,"endTime":442.8,"audioSegment":0},{"text":"each kept working against the real service by the repository's test suite.","startTime":442.8,"endTime":446.2,"audioSegment":0},{"text":"gezel app new —","startTime":446.2,"endTime":449.6,"audioSegment":0},{"text":"a guaranteed-valid starting shape when no sample is at hand.","startTime":449.6,"endTime":453,"audioSegment":0},{"text":"The authoring loop above is real,","startTime":453,"endTime":456.55555555555554,"audioSegment":0},{"text":"but the surrounding lifecycle still has gaps:","startTime":456.55555555555554,"endTime":460.1111111111111,"audioSegment":0},{"text":"Gap What is needed","startTime":460.1111111111111,"endTime":463.6666666666667,"audioSegment":0},{"text":"Project-to-app export Export packages the catalog definition; a diff-and-review flow that turns organic project changes (edited scripts,","startTime":463.6666666666667,"endTime":467.22222222222223,"audioSegment":0},{"text":"new craftbooks, a redesigned page) into a new version does not exist yet","startTime":467.22222222222223,"endTime":470.77777777777777,"audioSegment":0},{"text":"Import interface The desktop app still routes import through project artifacts and gezel tools;","startTime":470.77777777777777,"endTime":474.3333333333333,"audioSegment":0},{"text":"file picking, bundle review, and conflict handling belong in the UI the way the CLI already has them","startTime":474.3333333333333,"endTime":477.8888888888889,"audioSegment":0},{"text":"Updates and drift gezel app status reports per-seed drift and apply preserves user-modified seeds,","startTime":477.8888888888889,"endTime":481.44444444444446,"audioSegment":0},{"text":"but scripts still overwrite on upgrade and there is no three-way reconcile view","startTime":481.44444444444446,"endTime":485,"audioSegment":0},{"text":"Schema evolution App data-version declarations, migrations, backup, and rollback for custom records","startTime":485,"endTime":488.55555555555554,"audioSegment":0},{"text":"Dashboard surface First-class page templates, an in-app development preview,","startTime":488.55555555555554,"endTime":492.1111111111111,"audioSegment":0},{"text":"diagnostics, and possibly more than one app-owned project tab","startTime":492.1111111111111,"endTime":495.6666666666667,"audioSegment":0},{"text":"Craftbook test harness test.json sidecars are validated at authoring time,","startTime":495.6666666666667,"endTime":499.22222222222223,"audioSegment":0},{"text":"but the eval harness does not yet run an installed app's craftbook tests","startTime":499.22222222222223,"endTime":502.77777777777777,"audioSegment":0},{"text":"Signing and registries v1 signature status is unsigned;","startTime":502.77777777777777,"endTime":506.3333333333333,"audioSegment":0},{"text":"a signing story and a private registry path alongside public Gilde contributions","startTime":506.3333333333333,"endTime":509.8888888888889,"audioSegment":0},{"text":"Until those close, treat the source folder as the canonical form of an AI App: Gilde for public distribution,","startTime":509.8888888888889,"endTime":513.4444444444445,"audioSegment":0},{"text":".gezapp for controlled sharing, and ordinary projects for prototypes whose composition is still changing.","startTime":513.4444444444445,"endTime":517,"audioSegment":0}],"version":1},"startBlock":{"title":"Building AI Apps inside Gezel","subtitle":"An AI App is a reusable experience that runs inside Gezel: a tailored project, a purpose-built crew, repeatable craftbooks, scripts, data, and an optional interactive dashboard. A language trainer, research room, board game, or client-service workspace can all use the same underlying pieces while feeling like a distinct application.","ambientMotion":"zoomIn"}}</script>
