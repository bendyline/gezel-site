~/.gezel/ai-apps/","position":{"start":{"line":193,"column":449,"offset":12271},"end":{"line":193,"column":468,"offset":12290}}},{"type":"text","value":", records an installation receipt, and mounts it as one catalog source. Import never executes the contents.","position":{"start":{"line":193,"column":468,"offset":12290},"end":{"line":193,"column":575,"offset":12397}}}],"position":{"start":{"line":193,"column":1,"offset":11823},"end":{"line":193,"column":575,"offset":12397}}},{"type":"paragraph","children":[{"type":"text","value":"The v1 signature status is ","position":{"start":{"line":195,"column":1,"offset":12399},"end":{"line":195,"column":28,"offset":12426}}},{"type":"inlineCode","value":"unsigned","position":{"start":{"line":195,"column":28,"offset":12426},"end":{"line":195,"column":38,"offset":12436}}},{"type":"text","value":". Hashes detect corruption and tampering after packaging, but they do not establish who published the app. Only install packages from a source you trust.","position":{"start":{"line":195,"column":38,"offset":12436},"end":{"line":195,"column":191,"offset":12589}}}],"position":{"start":{"line":195,"column":1,"offset":12399},"end":{"line":195,"column":191,"offset":12589}}},{"type":"paragraph","children":[{"type":"text","value":"The current exporter packages the catalog definition, not the organic state of the current project. Changes made after adoption—edited scripts, a newly written craftbook, accumulated data, or a redesigned dashboard—are not automatically turned back into a new project-type version.","position":{"start":{"line":197,"column":1,"offset":12591},"end":{"line":197,"column":282,"offset":12872}}}],"position":{"start":{"line":197,"column":1,"offset":12591},"end":{"line":197,"column":282,"offset":12872}}}]},{"id":"the-gezapp-contract","startTime":511,"duration":30,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"The ","position":{"start":{"line":199,"column":4,"offset":12877},"end":{"line":199,"column":8,"offset":12881}}},{"type":"inlineCode","value":".gezapp","position":{"start":{"line":199,"column":8,"offset":12881},"end":{"line":199,"column":17,"offset":12890}}},{"type":"text","value":" contract","position":{"start":{"line":199,"column":17,"offset":12890},"end":{"line":199,"column":26,"offset":12899}}}],"position":{"start":{"line":199,"column":1,"offset":12874},"end":{"line":199,"column":26,"offset":12899}}},"title":"The .gezapp contract","contents":[{"type":"paragraph","children":[{"type":"inlineCode","value":".gezapp","position":{"start":{"line":201,"column":1,"offset":12901},"end":{"line":201,"column":10,"offset":12910}}},{"type":"text","value":" is the customer-facing package for one AI App, not a generic bag of unrelated catalog content. Its entry project type defines the experience; referenced roles and craftbooks travel with it; external executable and model dependencies stay locked by identity and exact version. Gezel validates the archive's paths, size limits, schemas, reference closure, hashes, compatibility, dependencies, and conflicts before it mounts the package.","position":{"start":{"line":201,"column":10,"offset":12910},"end":{"line":201,"column":445,"offset":13345}}}],"position":{"start":{"line":201,"column":1,"offset":12901},"end":{"line":201,"column":445,"offset":13345}}},{"type":"paragraph","children":[{"type":"text","value":"The mounted-unit design preserves the relationship between the installed items and the app that supplied them. That makes receipts, inspection, disabling, replacement, and a future uninstall flow possible without scattering copied files through several local catalog directories.","position":{"start":{"line":203,"column":1,"offset":13347},"end":{"line":203,"column":280,"offset":13626}}}],"position":{"start":{"line":203,"column":1,"offset":13347},"end":{"line":203,"column":280,"offset":13626}}}]},{"id":"what-still-needs-improvement","startTime":541,"duration":71,"audioSegment":0,"template":"sectionHeader","sourceHeading":{"type":"heading","depth":2,"children":[{"type":"text","value":"What still needs improvement","position":{"start":{"line":205,"column":4,"offset":13631},"end":{"line":205,"column":32,"offset":13659}}}],"position":{"start":{"line":205,"column":1,"offset":13628},"end":{"line":205,"column":32,"offset":13659}}},"title":"What still needs improvement","contents":[{"type":"paragraph","children":[{"type":"text","value":"The runtime pieces are farther along than the authoring experience. These are the largest gaps visible from today's implementation:","position":{"start":{"line":207,"column":1,"offset":13661},"end":{"line":207,"column":132,"offset":13792}}}],"position":{"start":{"line":207,"column":1,"offset":13661},"end":{"line":207,"column":132,"offset":13792}}},{"type":"table","align":[null,null],"children":[{"type":"tableRow","children":[{"type":"tableCell","isHeader":true,"children":[{"type":"text","value":"Gap","position":{"start":{"line":209,"column":3,"offset":13796},"end":{"line":209,"column":6,"offset":13799}}}],"position":{"start":{"line":209,"column":1,"offset":13794},"end":{"line":209,"column":7,"offset":13800}}},{"type":"tableCell","isHeader":true,"children":[{"type":"text","value":"What is needed","position":{"start":{"line":209,"column":9,"offset":13802},"end":{"line":209,"column":23,"offset":13816}}}],"position":{"start":{"line":209,"column":7,"offset":13800},"end":{"line":209,"column":25,"offset":13818}}}],"position":{"start":{"line":209,"column":1,"offset":13794},"end":{"line":209,"column":25,"offset":13818}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"App builder","position":{"start":{"line":211,"column":3,"offset":13835},"end":{"line":211,"column":14,"offset":13846}}}],"position":{"start":{"line":211,"column":1,"offset":13833},"end":{"line":211,"column":15,"offset":13847}}},{"type":"tableCell","children":[{"type":"text","value":"A guided UI or CLI that scaffolds the type, role, page, craftbook, script, and seed files and validates them together","position":{"start":{"line":211,"column":17,"offset":13849},"end":{"line":211,"column":134,"offset":13966}}}],"position":{"start":{"line":211,"column":15,"offset":13847},"end":{"line":211,"column":136,"offset":13968}}}],"position":{"start":{"line":211,"column":1,"offset":13833},"end":{"line":211,"column":136,"offset":13968}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Project-to-app export","position":{"start":{"line":212,"column":3,"offset":13971},"end":{"line":212,"column":24,"offset":13992}}}],"position":{"start":{"line":212,"column":1,"offset":13969},"end":{"line":212,"column":25,"offset":13993}}},{"type":"tableCell","children":[{"type":"text","value":"A deliberate diff and review flow that converts an organic project into a new project-type version instead of exporting only its original catalog item","position":{"start":{"line":212,"column":27,"offset":13995},"end":{"line":212,"column":177,"offset":14145}}}],"position":{"start":{"line":212,"column":25,"offset":13993},"end":{"line":212,"column":179,"offset":14147}}}],"position":{"start":{"line":212,"column":1,"offset":13969},"end":{"line":212,"column":179,"offset":14147}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Import interface","position":{"start":{"line":213,"column":3,"offset":14150},"end":{"line":213,"column":19,"offset":14166}}}],"position":{"start":{"line":213,"column":1,"offset":14148},"end":{"line":213,"column":20,"offset":14167}}},{"type":"tableCell","children":[{"type":"text","value":"File picking, bundle review, conflict handling, and export/download controls in the desktop app rather than a project-artifact and gezel-tool flow","position":{"start":{"line":213,"column":22,"offset":14169},"end":{"line":213,"column":168,"offset":14315}}}],"position":{"start":{"line":213,"column":20,"offset":14167},"end":{"line":213,"column":170,"offset":14317}}}],"position":{"start":{"line":213,"column":1,"offset":14148},"end":{"line":213,"column":170,"offset":14317}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Updates and drift","position":{"start":{"line":214,"column":3,"offset":14320},"end":{"line":214,"column":20,"offset":14337}}}],"position":{"start":{"line":214,"column":1,"offset":14318},"end":{"line":214,"column":21,"offset":14338}}},{"type":"tableCell","children":[{"type":"text","value":"A three-way reconcile view for a new type version versus the installed provenance versus user-edited scripts, craftbooks, documents, and data","position":{"start":{"line":214,"column":23,"offset":14340},"end":{"line":214,"column":164,"offset":14481}}}],"position":{"start":{"line":214,"column":21,"offset":14338},"end":{"line":214,"column":166,"offset":14483}}}],"position":{"start":{"line":214,"column":1,"offset":14318},"end":{"line":214,"column":166,"offset":14483}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Schema evolution","position":{"start":{"line":215,"column":3,"offset":14486},"end":{"line":215,"column":19,"offset":14502}}}],"position":{"start":{"line":215,"column":1,"offset":14484},"end":{"line":215,"column":20,"offset":14503}}},{"type":"tableCell","children":[{"type":"text","value":"App data-version declarations, migrations, backup, and rollback for custom JSON or other records","position":{"start":{"line":215,"column":22,"offset":14505},"end":{"line":215,"column":118,"offset":14601}}}],"position":{"start":{"line":215,"column":20,"offset":14503},"end":{"line":215,"column":120,"offset":14603}}}],"position":{"start":{"line":215,"column":1,"offset":14484},"end":{"line":215,"column":120,"offset":14603}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Dashboard surface","position":{"start":{"line":216,"column":3,"offset":14606},"end":{"line":216,"column":20,"offset":14623}}}],"position":{"start":{"line":216,"column":1,"offset":14604},"end":{"line":216,"column":21,"offset":14624}}},{"type":"tableCell","children":[{"type":"text","value":"First-class page templates, development preview, diagnostics, and possibly more than one app-owned project page","position":{"start":{"line":216,"column":23,"offset":14626},"end":{"line":216,"column":134,"offset":14737}}}],"position":{"start":{"line":216,"column":21,"offset":14624},"end":{"line":216,"column":136,"offset":14739}}}],"position":{"start":{"line":216,"column":1,"offset":14604},"end":{"line":216,"column":136,"offset":14739}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Testing","position":{"start":{"line":217,"column":3,"offset":14742},"end":{"line":217,"column":10,"offset":14749}}}],"position":{"start":{"line":217,"column":1,"offset":14740},"end":{"line":217,"column":11,"offset":14750}}},{"type":"tableCell","children":[{"type":"text","value":"A standard AI App test kit covering adoption, schema validation, scripts, page tools, craftbooks, permissions, local models, and upgrades","position":{"start":{"line":217,"column":13,"offset":14752},"end":{"line":217,"column":150,"offset":14889}}}],"position":{"start":{"line":217,"column":11,"offset":14750},"end":{"line":217,"column":152,"offset":14891}}}],"position":{"start":{"line":217,"column":1,"offset":14740},"end":{"line":217,"column":152,"offset":14891}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Portable script sandbox","position":{"start":{"line":218,"column":3,"offset":14894},"end":{"line":218,"column":26,"offset":14917}}}],"position":{"start":{"line":218,"column":1,"offset":14892},"end":{"line":218,"column":27,"offset":14918}}},{"type":"tableCell","children":[{"type":"text","value":"A consistent OS-enforced path for user-edited scripts on every supported platform; today provenance-verified catalog scripts have a more portable execution path than modified or newly authored scripts","position":{"start":{"line":218,"column":29,"offset":14920},"end":{"line":218,"column":229,"offset":15120}}}],"position":{"start":{"line":218,"column":27,"offset":14918},"end":{"line":218,"column":231,"offset":15122}}}],"position":{"start":{"line":218,"column":1,"offset":14892},"end":{"line":218,"column":231,"offset":15122}}},{"type":"tableRow","children":[{"type":"tableCell","children":[{"type":"text","value":"Catalog workflow","position":{"start":{"line":219,"column":3,"offset":15125},"end":{"line":219,"column":19,"offset":15141}}}],"position":{"start":{"line":219,"column":1,"offset":15123},"end":{"line":219,"column":20,"offset":15142}}},{"type":"tableCell","children":[{"type":"text","value":"A supported local authoring source, publish command, signing story, and private registry path alongside public Gilde contributions","position":{"start":{"line":219,"column":22,"offset":15144},"end":{"line":219,"column":152,"offset":15274}}}],"position":{"start":{"line":219,"column":20,"offset":15142},"end":{"line":219,"column":154,"offset":15276}}}],"position":{"start":{"line":219,"column":1,"offset":15123},"end":{"line":219,"column":154,"offset":15276}}}],"position":{"start":{"line":209,"column":1,"offset":13794},"end":{"line":219,"column":154,"offset":15276}}},{"type":"paragraph","children":[{"type":"text","value":"Until those exist, treat the project type as the canonical source of an AI App. Use Gilde for public distribution, ","position":{"start":{"line":221,"column":1,"offset":15278},"end":{"line":221,"column":116,"offset":15393}}},{"type":"inlineCode","value":".gezapp","position":{"start":{"line":221,"column":116,"offset":15393},"end":{"line":221,"column":125,"offset":15402}}},{"type":"text","value":" for controlled sharing of an already-authored type, and ordinary projects for prototypes whose composition is still changing.","position":{"start":{"line":221,"column":125,"offset":15402},"end":{"line":221,"column":251,"offset":15528}}}],"position":{"start":{"line":221,"column":1,"offset":15278},"end":{"line":221,"column":251,"offset":15528}}}]}]}],"audio":{"segments":[]},"captions":{"phrases":[{"text":"An AI App is a reusable experience that runs inside Gezel: a tailored project,","startTime":0,"endTime":3.5,"audioSegment":0},{"text":"a purpose-built crew, repeatable craftbooks, scripts, data, and an optional interactive dashboard.","startTime":3.5,"endTime":7,"audioSegment":0},{"text":"A language trainer, research room, board game,","startTime":7,"endTime":10.5,"audioSegment":0},{"text":"or client-service workspace can all use the same underlying pieces while feeling like a distinct application.","startTime":10.5,"endTime":14,"audioSegment":0},{"text":"The project type is the composition root and installer.","startTime":14,"endTime":17.5,"audioSegment":0},{"text":"Public AI Apps normally arrive through the Gezel Gilde project-type collection;","startTime":17.5,"endTime":21,"audioSegment":0},{"text":"private or experimental apps can be shared as .gezapp packages.","startTime":21,"endTime":24.5,"audioSegment":0},{"text":"An AI App is different from a connected app.","startTime":24.5,"endTime":28,"audioSegment":0},{"text":"A connected app runs in its own process and interface and reaches Gezel through @bendyline/gezel-app-sdk.","startTime":28,"endTime":31.5,"audioSegment":0},{"text":"See Building connected apps with gezel-app-sdk when that is what you are building.","startTime":31.5,"endTime":35,"audioSegment":0},{"text":"PartWhat it contributes todayProject typeThe identity, version, setup parameters, project templates, crew roster, tab defaults, and references to every other partGezel role templatesThe role name, description, about.md instructions, suggested tools, and optional tuning guidance for each crew memberCraftbooksRepeatable procedures installed into each project; they may be private to the type or referenced from the Gilde craftbook collectionScripts and toolsCapability-declared TypeScript run by Gezel's sandbox;","startTime":35,"endTime":41.4,"audioSegment":0},{"text":"a manifest can expose a script as a schema-validated tool for a gezel or dashboardOutput pageA read-limited HTML, CSS, and JavaScript experience pinned into the project's Output tab; one entry page can implement several views or routesDataJSON, Markdown, media, and other ordinary files seeded into the project workspace or artifacts and then read by scripts, gezels, and the pageSchedulesConsent-gated scheduled or Night Shift craftbook runsToolsetsCatalog references for capabilities the project needs or suggests; toolset code is not embedded in the project type","startTime":41.4,"endTime":47.8,"audioSegment":0},{"text":"The result is composition rather than a general plug-in runtime:","startTime":47.8,"endTime":54.2,"audioSegment":0},{"text":"Gilde project type or .gezapp package","startTime":54.2,"endTime":60.6,"audioSegment":0},{"text":"↓ explicit adoption","startTime":60.6,"endTime":67,"audioSegment":0},{"text":"project + crew + craftbooks + scripts + data + Output page ↓ ordinary use","startTime":67,"endTime":73.4,"audioSegment":0},{"text":"chat, page actions, scheduled work, and editable project files","startTime":73.4,"endTime":79.80000000000001,"audioSegment":0},{"text":"Nothing is installed merely because Gezel detects a suitable project type.","startTime":79.80000000000001,"endTime":86.2,"audioSegment":0},{"text":"Adoption is explicit,","startTime":86.2,"endTime":92.6,"audioSegment":0},{"text":"and toolsets and schedules remain subject to consent and security policy.","startTime":92.6,"endTime":99,"audioSegment":0},{"text":"There is no AI App builder or gezel app new command yet.","startTime":99,"endTime":102.31818181818181,"audioSegment":0},{"text":"The supported public authoring path is source-first in the Gilde repository:","startTime":102.31818181818181,"endTime":105.63636363636364,"audioSegment":0},{"text":"Prototype the experience as an ordinary project.","startTime":105.63636363636364,"endTime":108.95454545454545,"audioSegment":0},{"text":"Settle the crew roles, work through each craftbook, run the scripts by hand,","startTime":108.95454545454545,"endTime":112.27272727272728,"audioSegment":0},{"text":"and decide which files are durable state versus generated artifacts.","startTime":112.27272727272728,"endTime":115.5909090909091,"audioSegment":0},{"text":"Give the composition a project-type id and version.","startTime":115.5909090909091,"endTime":118.9090909090909,"audioSegment":0},{"text":"Add separate role-template items for crew members whose instructions should be reusable or versioned.","startTime":118.9090909090909,"endTime":122.22727272727272,"audioSegment":0},{"text":"Move default project context into about.md and mission.md, turn initial data into seed files,","startTime":122.22727272727272,"endTime":125.54545454545455,"audioSegment":0},{"text":"and place type-private craftbooks under the version's craftbooks/ folder.","startTime":125.54545454545455,"endTime":128.86363636363637,"audioSegment":0},{"text":"Put SDK script source in the version manifest's scripts map,","startTime":128.86363636363637,"endTime":132.1818181818182,"audioSegment":0},{"text":"expose only the narrow tools the gezels or page need, and declare every capability and input schema.","startTime":132.1818181818182,"endTime":135.5,"audioSegment":0},{"text":"Build the Output page against window.gezel,","startTime":135.5,"endTime":138.8181818181818,"audioSegment":0},{"text":"declare its readable paths and callable tools, and test both light and dark themes.","startTime":138.8181818181818,"endTime":142.13636363636363,"audioSegment":0},{"text":"From the Gilde checkout, run npm run fix and npm run check.","startTime":142.13636363636363,"endTime":145.45454545454544,"audioSegment":0},{"text":"When developing Gilde and Gezel side by side,","startTime":145.45454545454544,"endTime":148.77272727272728,"audioSegment":0},{"text":"run pnpm link:gilde from the Gezel checkout so the local daemon and tests see the edited catalog content.","startTime":148.77272727272728,"endTime":152.0909090909091,"audioSegment":0},{"text":"Contribute the type to Gilde for normal distribution.","startTime":152.0909090909091,"endTime":155.4090909090909,"audioSegment":0},{"text":"After a type is resolvable by a Gezel installation,","startTime":155.4090909090909,"endTime":158.72727272727275,"audioSegment":0},{"text":"export a .gezapp for controlled private sharing.","startTime":158.72727272727275,"endTime":162.04545454545456,"audioSegment":0},{"text":"This workflow is deliberately candid: the catalog files are the authoring surface today.","startTime":162.04545454545456,"endTime":165.36363636363637,"audioSegment":0},{"text":"The desktop app can use and share a finished type,","startTime":165.36363636363637,"endTime":168.6818181818182,"audioSegment":0},{"text":"but it cannot yet assemble those files from a prototype for you.","startTime":168.6818181818182,"endTime":172,"audioSegment":0},{"text":"The source of a public AI App is a slice of the Gilde catalog.","startTime":172,"endTime":173.89361702127658,"audioSegment":0},{"text":"Items are sharded by the first two characters of their id and keep identity separate from versioned content: data/ project-types/ my/ my-app/ manifest.json versions/ 1.0.0/ manifest.json about.md mission.md records.json craftbooks/","startTime":173.89361702127658,"endTime":175.7872340425532,"audioSegment":0},{"text":"review-records.json pages/ dashboard/ index.html","startTime":175.7872340425532,"endTime":177.68085106382978,"audioSegment":0},{"text":"gezel-templates/ my/ my-app-lead/ manifest.json versions/ 1.0.0/ manifest.json about.md","startTime":177.68085106382978,"endTime":179.5744680851064,"audioSegment":0},{"text":"The root project-type manifest supplies stable identity: {","startTime":179.5744680851064,"endTime":181.46808510638297,"audioSegment":0},{"text":"\"schemaVersion\": 1,","startTime":181.46808510638297,"endTime":183.36170212765958,"audioSegment":0},{"text":"\"kind\": \"project-type\",","startTime":183.36170212765958,"endTime":185.25531914893617,"audioSegment":0},{"text":"\"id\": \"my-app\",","startTime":185.25531914893617,"endTime":187.14893617021278,"audioSegment":0},{"text":"\"name\": \"My AI App\",","startTime":187.14893617021278,"endTime":189.04255319148936,"audioSegment":0},{"text":"\"description\": \"A focused workspace for reviewing records with a gezel.\",","startTime":189.04255319148936,"endTime":190.93617021276594,"audioSegment":0},{"text":"\"tags\": [\"review\", \"records\"],","startTime":190.93617021276594,"endTime":192.82978723404256,"audioSegment":0},{"text":"\"maintainer\": { \"name\": \"Your company\" },","startTime":192.82978723404256,"endTime":194.72340425531914,"audioSegment":0},{"text":"\"license\": \"MIT\",","startTime":194.72340425531914,"endTime":196.61702127659575,"audioSegment":0},{"text":"\"yankedVersions\": [] }","startTime":196.61702127659575,"endTime":198.51063829787233,"audioSegment":0},{"text":"The version manifest describes what adoption installs.","startTime":198.51063829787233,"endTime":200.40425531914894,"audioSegment":0},{"text":"This shortened example shows the main seams;","startTime":200.40425531914894,"endTime":202.29787234042553,"audioSegment":0},{"text":"script source is represented by a placeholder to keep it readable: {","startTime":202.29787234042553,"endTime":204.1914893617021,"audioSegment":0},{"text":"\"schemaVersion\": 1,","startTime":204.1914893617021,"endTime":206.08510638297872,"audioSegment":0},{"text":"\"version\": \"1.0.0\",","startTime":206.08510638297872,"endTime":207.97872340425533,"audioSegment":0},{"text":"\"releasedAt\": \"2026-01-01T00:00:00Z\", \"params\": {","startTime":207.97872340425533,"endTime":209.87234042553192,"audioSegment":0},{"text":"\"type\": \"object\",","startTime":209.87234042553192,"endTime":211.7659574468085,"audioSegment":0},{"text":"\"properties\": {","startTime":211.7659574468085,"endTime":213.6595744680851,"audioSegment":0},{"text":"\"recordLabel\": { \"type\": \"string\",","startTime":213.6595744680851,"endTime":215.5531914893617,"audioSegment":0},{"text":"\"title\": \"What do you call a record?\", \"default\": \"case\" } },","startTime":215.5531914893617,"endTime":217.4468085106383,"audioSegment":0},{"text":"\"required\": [\"recordLabel\"] },","startTime":217.4468085106383,"endTime":219.3404255319149,"audioSegment":0},{"text":"\"nameTemplate\": \"{{recordLabel}} review\",","startTime":219.3404255319149,"endTime":221.2340425531915,"audioSegment":0},{"text":"\"aboutTemplate\": \"about.md\",","startTime":221.2340425531915,"endTime":223.12765957446808,"audioSegment":0},{"text":"\"missionTemplate\": \"mission.md\",","startTime":223.12765957446808,"endTime":225.02127659574467,"audioSegment":0},{"text":"\"gezels\": [{ \"templateId\": \"my-app-lead\", \"voorman\": true }],","startTime":225.02127659574467,"endTime":226.91489361702128,"audioSegment":0},{"text":"\"craftbooks\": [\"review-records\"],","startTime":226.91489361702128,"endTime":228.80851063829786,"audioSegment":0},{"text":"\"scripts\": { \"record-store\": \"<TypeScript source>\" }, \"tools\": [ {","startTime":228.80851063829786,"endTime":230.70212765957447,"audioSegment":0},{"text":"\"name\": \"add_record\",","startTime":230.70212765957447,"endTime":232.59574468085106,"audioSegment":0},{"text":"\"description\": \"Add one record to the app data.\",","startTime":232.59574468085106,"endTime":234.48936170212767,"audioSegment":0},{"text":"\"script\": \"record-store\", \"inputs\": {","startTime":234.48936170212767,"endTime":236.38297872340425,"audioSegment":0},{"text":"\"type\": \"object\",","startTime":236.38297872340425,"endTime":238.27659574468083,"audioSegment":0},{"text":"\"properties\": { \"title\": { \"type\": \"string\" } },","startTime":238.27659574468083,"endTime":240.17021276595744,"audioSegment":0},{"text":"\"required\": [\"title\"] },","startTime":240.17021276595744,"endTime":242.06382978723406,"audioSegment":0},{"text":"\"bind\": { \"action\": \"add\" } } ], \"pages\": {","startTime":242.06382978723406,"endTime":243.95744680851064,"audioSegment":0},{"text":"\"entry\": \"dashboard/index.html\", \"api\": 1,","startTime":243.95744680851064,"endTime":245.85106382978722,"audioSegment":0},{"text":"\"reads\": [{ \"source\": \"workspace\", \"path\": \"records.json\" }],","startTime":245.85106382978722,"endTime":247.74468085106383,"audioSegment":0},{"text":"\"tools\": [\"add_record\"] },","startTime":247.74468085106383,"endTime":249.63829787234044,"audioSegment":0},{"text":"\"workspaceSeed\": [\"records.json\"] }","startTime":249.63829787234044,"endTime":251.531914893617,"audioSegment":0},{"text":"Project parameters use a JSON Schema-like object.","startTime":251.531914893617,"endTime":253.4255319148936,"audioSegment":0},{"text":"Gezel renders them as an adoption form and substitutes their values into the suggested project name,","startTime":253.4255319148936,"endTime":255.31914893617022,"audioSegment":0},{"text":"the project about and mission templates, and seeded files.","startTime":255.31914893617022,"endTime":257.2127659574468,"audioSegment":0},{"text":"A type can also set project shape and tab visibility, inherit a built-in project category with extends,","startTime":257.2127659574468,"endTime":259.1063829787234,"audioSegment":0},{"text":"seed artifacts instead of workspace files, suggest or require toolsets, and declare scheduled craftbooks.","startTime":259.1063829787234,"endTime":261,"audioSegment":0},{"text":"Each gezels entry references a versioned gezel-template;","startTime":261,"endTime":264.4166666666667,"audioSegment":0},{"text":"role instructions are not buried inside the project-type manifest.","startTime":264.4166666666667,"endTime":267.8333333333333,"audioSegment":0},{"text":"The template's about.md becomes the gezel's working character and method.","startTime":267.8333333333333,"endTime":271.25,"audioSegment":0},{"text":"One referenced role can be marked as the voorman—Dutch for foreman—or a solo type can present that gezel under a domain-specific label such as “Tutor” or “Opponent.” Browse the Gilde role collection before creating a new role,","startTime":271.25,"endTime":274.6666666666667,"audioSegment":0},{"text":"because an existing one may already fit.","startTime":274.6666666666667,"endTime":278.0833333333333,"audioSegment":0},{"text":"A project type lists craftbook ids.","startTime":278.0833333333333,"endTime":281.5,"audioSegment":0},{"text":"For a procedure used only by this type, place a Craftbook document at versions/{version}/craftbooks/{id}.json;","startTime":281.5,"endTime":284.9166666666667,"audioSegment":0},{"text":"an embedded document wins over a catalog item with the same id.","startTime":284.9166666666667,"endTime":288.3333333333333,"audioSegment":0},{"text":"For a reusable procedure, reference a craftbook-template from Gilde.","startTime":288.3333333333333,"endTime":291.75,"audioSegment":0},{"text":"On adoption Gezel copies the resolved craftbook into the project,","startTime":291.75,"endTime":295.1666666666667,"audioSegment":0},{"text":"where it becomes editable.","startTime":295.1666666666667,"endTime":298.5833333333333,"audioSegment":0},{"text":"Reapplying the type does not overwrite a copy the user has changed.","startTime":298.5833333333333,"endTime":302,"audioSegment":0},{"text":"The released project-type manifest currently stores each script as TypeScript source in its scripts map.","startTime":302,"endTime":305.1904761904762,"audioSegment":0},{"text":"Adoption copies those scripts into the project with provenance.","startTime":305.1904761904762,"endTime":308.3809523809524,"audioSegment":0},{"text":"Each script declares its capabilities, inputs, outputs, and whether it is an action or gate through @bendyline/gezel-sdk;","startTime":308.3809523809524,"endTime":311.57142857142856,"audioSegment":0},{"text":"the Writing scripts with gezel-sdk article covers that contract.","startTime":311.57142857142856,"endTime":314.76190476190476,"audioSegment":0},{"text":"A tools entry gives a script a stable tool name and description.","startTime":314.76190476190476,"endTime":317.95238095238096,"audioSegment":0},{"text":"Its inputs object is JSON Schema and is validated before the script runs.","startTime":317.95238095238096,"endTime":321.14285714285717,"audioSegment":0},{"text":"Static bind values let several narrow tools share one script without letting the caller replace the bound operation.","startTime":321.14285714285717,"endTime":324.3333333333333,"audioSegment":0},{"text":"The same tool can be exposed to a gezel or allowlisted for the Output page;","startTime":324.3333333333333,"endTime":327.5238095238095,"audioSegment":0},{"text":"page-only tools are kept off the model's tool roster.","startTime":327.5238095238095,"endTime":330.7142857142857,"audioSegment":0},{"text":"There is no app-specific database or schema registry today.","startTime":330.7142857142857,"endTime":333.9047619047619,"audioSegment":0},{"text":"Custom app state is normally an ordinary JSON, Markdown,","startTime":333.9047619047619,"endTime":337.0952380952381,"audioSegment":0},{"text":"or media file whose shape is owned by your script and page code.","startTime":337.0952380952381,"endTime":340.2857142857143,"audioSegment":0},{"text":"Schemas currently appear at these boundaries:","startTime":340.2857142857143,"endTime":343.4761904761905,"audioSegment":0},{"text":"params describes the setup form.","startTime":343.4761904761905,"endTime":346.6666666666667,"audioSegment":0},{"text":"tools[].inputs validates a tool call.","startTime":346.6666666666667,"endTime":349.8571428571429,"audioSegment":0},{"text":"Script metadata describes direct script inputs and outputs.","startTime":349.8571428571429,"endTime":353.04761904761904,"audioSegment":0},{"text":"A craftbook can declare its own parameter schema.","startTime":353.04761904761904,"endTime":356.23809523809524,"audioSegment":0},{"text":"If several components share a data shape, keep a TypeScript type and a small runtime validator in your authoring source,","startTime":356.23809523809524,"endTime":359.42857142857144,"audioSegment":0},{"text":"then make schema migration an explicit script operation.","startTime":359.42857142857144,"endTime":362.6190476190476,"audioSegment":0},{"text":"Gezel preserves the files,","startTime":362.6190476190476,"endTime":365.8095238095238,"audioSegment":0},{"text":"but it does not yet migrate arbitrary app data for you.","startTime":365.8095238095238,"endTime":369,"audioSegment":0},{"text":"The Output page is served from the selected project-type version and runs in a null-origin sandbox.","startTime":369,"endTime":371.7647058823529,"audioSegment":0},{"text":"Set pages.api to 1 and use the injected window.gezel API.","startTime":371.7647058823529,"endTime":374.52941176470586,"audioSegment":0},{"text":"Typed definitions are available from @bendyline/gezel-sdk/page.","startTime":374.52941176470586,"endTime":377.29411764705884,"audioSegment":0},{"text":"const records = await gezel.data.read('records.json');","startTime":377.29411764705884,"endTime":380.05882352941177,"audioSegment":0},{"text":"render(records);","startTime":380.05882352941177,"endTime":382.8235294117647,"audioSegment":0},{"text":"const stopWatching = gezel.data.watch('records.json', async () => {","startTime":382.8235294117647,"endTime":385.5882352941176,"audioSegment":0},{"text":"render(await gezel.data.read('records.json')); });","startTime":385.5882352941176,"endTime":388.3529411764706,"audioSegment":0},{"text":"const { output } = await gezel.tools.invoke('add_record', { title: 'First review' });","startTime":388.3529411764706,"endTime":391.11764705882354,"audioSegment":0},{"text":"Every readable file or subtree must appear in pages.reads,","startTime":391.11764705882354,"endTime":393.88235294117646,"audioSegment":0},{"text":"and every callable action must appear in pages.tools; the service checks both declarations on every request.","startTime":393.88235294117646,"endTime":396.6470588235294,"audioSegment":0},{"text":"There is deliberately no raw page write API.","startTime":396.6470588235294,"endTime":399.4117647058824,"audioSegment":0},{"text":"A page changes state through a declared script tool,","startTime":399.4117647058824,"endTime":402.1764705882353,"audioSegment":0},{"text":"which leaves an auditable run and can optionally summon a gezel to react.","startTime":402.1764705882353,"endTime":404.94117647058823,"audioSegment":0},{"text":"The page should also follow gezel.ui.theme and use gezel.data.url() for media.","startTime":404.94117647058823,"endTime":407.70588235294116,"audioSegment":0},{"text":"One project type currently pins one Output entry page.","startTime":407.70588235294116,"endTime":410.47058823529414,"audioSegment":0},{"text":"That page may contain several screens or client-side routes,","startTime":410.47058823529414,"endTime":413.2352941176471,"audioSegment":0},{"text":"but Gezel does not yet let a type add several first-class project tabs.","startTime":413.2352941176471,"endTime":416,"audioSegment":0},{"text":"Public, broadly useful AI Apps should be contributed to Gilde.","startTime":416,"endTime":418.7142857142857,"audioSegment":0},{"text":"The released project type, its roles, craftbooks,","startTime":418.7142857142857,"endTime":421.42857142857144,"audioSegment":0},{"text":"and assets then travel in the exact-pinned @bendyline/gilde catalog used by Gezel.","startTime":421.42857142857144,"endTime":424.14285714285717,"audioSegment":0},{"text":"Models remain separate catalog choices—browse the Gilde model collection—and are not bundled into an AI App.","startTime":424.14285714285717,"endTime":426.85714285714283,"audioSegment":0},{"text":"For private sharing, Gezel uses .gezapp.","startTime":426.85714285714283,"endTime":429.57142857142856,"audioSegment":0},{"text":"It is a renamed zip with a root manifest.json, an items/ tree,","startTime":429.57142857142856,"endTime":432.2857142857143,"audioSegment":0},{"text":"and a SHA-256 digest for every embedded catalog item.","startTime":432.2857142857143,"endTime":435,"audioSegment":0},{"text":"Version 1 packages contain:","startTime":435,"endTime":437.7142857142857,"audioSegment":0},{"text":"Exactly one entry project type at an exact version, including its pages,","startTime":437.7142857142857,"endTime":440.42857142857144,"audioSegment":0},{"text":"seeds, assets, scripts, and private embedded craftbooks.","startTime":440.42857142857144,"endTime":443.14285714285717,"audioSegment":0},{"text":"Every gezel role template and standalone craftbook template referenced by that version.","startTime":443.14285714285717,"endTime":445.85714285714283,"audioSegment":0},{"text":"An exact dependency lock for referenced toolsets, connectors, and models.","startTime":445.85714285714283,"endTime":448.57142857142856,"audioSegment":0},{"text":"These dependencies remain external to the archive and must be available before installation.","startTime":448.57142857142856,"endTime":451.2857142857143,"audioSegment":0},{"text":"A minimum Gezel version, publisher details,","startTime":451.2857142857143,"endTime":454,"audioSegment":0},{"text":"an explicit signature status, and content hashes.","startTime":454,"endTime":456.7142857142857,"audioSegment":0},{"text":"Only the selected version of each item is included.","startTime":456.7142857142857,"endTime":459.42857142857144,"audioSegment":0},{"text":"A .gezapp does not embed toolsets, models,","startTime":459.42857142857144,"endTime":462.14285714285717,"audioSegment":0},{"text":"connector executables, or arbitrary npm code.","startTime":462.14285714285717,"endTime":464.8571428571429,"audioSegment":0},{"text":"Ask a gezel with the project-management tools to export the type applied to the current project.","startTime":464.8571428571429,"endTime":467.57142857142856,"audioSegment":0},{"text":"Gezel writes the .gezapp into project artifacts.","startTime":467.57142857142856,"endTime":470.2857142857143,"audioSegment":0},{"text":"On another installation,","startTime":470.2857142857143,"endTime":473,"audioSegment":0},{"text":"place that file in a project's artifacts and ask a gezel to import it.","startTime":473,"endTime":475.7142857142857,"audioSegment":0},{"text":"The first import call previews the publisher, contents, compatibility,","startTime":475.7142857142857,"endTime":478.42857142857144,"audioSegment":0},{"text":"hashes, conflicts, and missing dependencies without writing anything.","startTime":478.42857142857144,"endTime":481.1428571428571,"audioSegment":0},{"text":"A second, confirmed call installs the package atomically under ~/.gezel/ai-apps/,","startTime":481.1428571428571,"endTime":483.8571428571429,"audioSegment":0},{"text":"records an installation receipt, and mounts it as one catalog source.","startTime":483.8571428571429,"endTime":486.57142857142856,"audioSegment":0},{"text":"Import never executes the contents.","startTime":486.57142857142856,"endTime":489.2857142857143,"audioSegment":0},{"text":"The v1 signature status is unsigned.","startTime":489.2857142857143,"endTime":492,"audioSegment":0},{"text":"Hashes detect corruption and tampering after packaging,","startTime":492,"endTime":494.7142857142857,"audioSegment":0},{"text":"but they do not establish who published the app.","startTime":494.7142857142857,"endTime":497.42857142857144,"audioSegment":0},{"text":"Only install packages from a source you trust.","startTime":497.42857142857144,"endTime":500.14285714285717,"audioSegment":0},{"text":"The current exporter packages the catalog definition,","startTime":500.14285714285717,"endTime":502.8571428571429,"audioSegment":0},{"text":"not the organic state of the current project.","startTime":502.8571428571429,"endTime":505.57142857142856,"audioSegment":0},{"text":"Changes made after adoption—edited scripts, a newly written craftbook, accumulated data,","startTime":505.57142857142856,"endTime":508.2857142857143,"audioSegment":0},{"text":"or a redesigned dashboard—are not automatically turned back into a new project-type version.","startTime":508.2857142857143,"endTime":511,"audioSegment":0},{"text":".gezapp is the customer-facing package for one AI App,","startTime":511,"endTime":514.3333333333334,"audioSegment":0},{"text":"not a generic bag of unrelated catalog content.","startTime":514.3333333333334,"endTime":517.6666666666666,"audioSegment":0},{"text":"Its entry project type defines the experience; referenced roles and craftbooks travel with it;","startTime":517.6666666666666,"endTime":521,"audioSegment":0},{"text":"external executable and model dependencies stay locked by identity and exact version.","startTime":521,"endTime":524.3333333333334,"audioSegment":0},{"text":"Gezel validates the archive's paths, size limits, schemas, reference closure,","startTime":524.3333333333334,"endTime":527.6666666666666,"audioSegment":0},{"text":"hashes, compatibility, dependencies, and conflicts before it mounts the package.","startTime":527.6666666666666,"endTime":531,"audioSegment":0},{"text":"The mounted-unit design preserves the relationship between the installed items and the app that supplied them.","startTime":531,"endTime":534.3333333333334,"audioSegment":0},{"text":"That makes receipts, inspection, disabling, replacement,","startTime":534.3333333333334,"endTime":537.6666666666666,"audioSegment":0},{"text":"and a future uninstall flow possible without scattering copied files through several local catalog directories.","startTime":537.6666666666666,"endTime":541,"audioSegment":0},{"text":"The runtime pieces are farther along than the authoring experience.","startTime":541,"endTime":549.875,"audioSegment":0},{"text":"These are the largest gaps visible from today's implementation:","startTime":549.875,"endTime":558.75,"audioSegment":0},{"text":"GapWhat is neededApp builderA guided UI or CLI that scaffolds the type, role, page, craftbook, script, and seed files and validates them togetherProject-to-app exportA deliberate diff and review flow that converts an organic project into a new project-type version instead of exporting only its original catalog itemImport interfaceFile picking, bundle review, conflict handling, and export/download controls in the desktop app rather than a project-artifact and gezel-tool flowUpdates and driftA three-way reconcile view for a new type version versus the installed provenance versus user-edited scripts, craftbooks, documents, and dataSchema evolutionApp data-version declarations, migrations,","startTime":558.75,"endTime":567.625,"audioSegment":0},{"text":"backup, and rollback for custom JSON or other recordsDashboard surfaceFirst-class page templates, development preview, diagnostics, and possibly more than one app-owned project pageTestingA standard AI App test kit covering adoption, schema validation, scripts, page tools, craftbooks, permissions, local models, and upgradesPortable script sandboxA consistent OS-enforced path for user-edited scripts on every supported platform; today provenance-verified catalog scripts have a more portable execution path than modified or newly authored scriptsCatalog workflowA supported local authoring source, publish command, signing story, and private registry path alongside public Gilde contributions","startTime":567.625,"endTime":576.5,"audioSegment":0},{"text":"Until those exist,","startTime":576.5,"endTime":585.375,"audioSegment":0},{"text":"treat the project type as the canonical source of an AI App.","startTime":585.375,"endTime":594.25,"audioSegment":0},{"text":"Use Gilde for public distribution, .gezapp for controlled sharing of an already-authored type,","startTime":594.25,"endTime":603.125,"audioSegment":0},{"text":"and ordinary projects for prototypes whose composition is still changing.","startTime":603.125,"endTime":612,"audioSegment":0}],"version":1},"startBlock":{"title":"Building AI Apps inside Gezel","subtitle":"An AI App is a reusable experience that runs inside Gezel: a tailored project, a purpose-built crew, repeatable craftbooks, scripts, data, and an optional interactive dashboard. A language trainer, research room, board game, or client-service workspace can all use the same underlying pieces while feeling like a distinct application.","ambientMotion":"zoomIn"}}</script>
